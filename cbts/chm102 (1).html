e a molecular formula but differ in atom arrangement.","Same formula, different arrangement.",0,0],["Structural isomers are also called",["Constitutional isomers","Conformational isomers","Optical isomers","Geometric isomers"],0,"The book says structural isomers are also called constitutional isomers.","Structural, constitutional.",0,0],["Structural isomers have",["The same arrangement in space but different bonding","The same structural formula but a different molecular formula","Different molecular formula and different functional groups","The same molecular formula but different structural formula"],3,"The compounds are arranged in a completely different order.","Same molecular, different structural.",0,0],["Structural isomers in the same homologous series with the same functional groups",["Have similar chemical properties but different physical properties","Have no chemical properties in common at all","Have different chemical properties and similar physical ones","Have identical chemical properties and identical physical properties"],0,"Physical and chemical properties both differ if the isomers are in different series with different groups.","Same group, same chemistry.",0,0],["How many chain isomers does butane (C4H10) have?",["Two","One","Three","Five"],0,"There are only two butanes, but three pentanes and 18 octanes.","Butane, two.",0,0],["How many isomers does pentane (C5H12) have?",["Five","Three","Four","Two"],1,"The book says there are three pentanes.","Pentane, three.",0,0],["How many constitutional isomers does C8H18 have?",["8","18","12","35"],1,"The book says there are 18 octanes.","Octane, 18.",0,0],["The number of constitutional isomers of C20H42 is no fewer than",["366,319","3,319","36,319","1,366"],0,"The number of isomers increases greatly with the number of atoms.","20 carbons, 366,319.",0,0],["Chain isomerism arises from",["A double bond","Branching of the carbon chain","Different functional groups","Movement of a functional group"],1,"Butane has a straight-chain and a branched isomer.","Chain, branching.",0,1],["Which is a chain isomer of pentane?",["Cyclopentane, with a closed ring","Pent-1-ene, with a double bond","2,2-Dimethylpropane","Pentan-2-ol, with an OH group"],2,"The three chain isomers are pentane, 2-methylbutane and 2,2-dimethylpropane.","Same formula, branched.",0,1],["Which of these is a chain isomer of butane?",["But-1-ene, an alkene","Butan-1-ol, an alcohol","Cyclobutane, a closed ring","2-Methylpropane"],3,"2-Methylpropane (isobutane) is the branched isomer.","Branched butane.",0,1],["In position isomerism the",["Carbon skeleton changes but the group stays put","Carbon skeleton stays the same but a group moves","Functional group changes but the skeleton stays","Number of atoms differs but the skeleton stays"],1,"Important groups such as functional groups are moved around the skeleton.","Same skeleton, group moves.",0,2],["1-Bromopropane and 2-bromopropane are",["Position isomers","Geometric isomers","Functional group isomers","Chain isomers"],0,"The bromine is at the end in one and in the middle in the other.","Br moves, position.",0,2],["Butan-1-ol and butan-2-ol are",["Tautomers","Chain isomers","Position isomers","Optical isomers"],2,"The –OH group is on carbon 1 or 2 of the same skeleton.","OH moves, position.",0,2],["2-Methylpropan-1-ol and 2-methylpropan-2-ol are isomers of",["Butanol","Pentanol","Propanol","Butanal"],0,"The book lists them as the other two isomers of butanol.","C4H9OH, butanol.",0,2],["How many butanol isomers does the book list?",["Five","Three","Two","Four"],3,"They are butan-1-ol, butan-2-ol, 2-methylpropan-1-ol and 2-methylpropan-2-ol.","Butanol, four.",0,2],["In benzene rings, position isomerism arises from",["The number of double bonds in the ring","The position of the substituent on the ring","The length of the side chain attached","The size of the ring and its stability"],1,"Different positions of chlorine on the ring give different isomers.","Ring, position.",0,2],["Propanal and propanone are",["Geometric isomers about a double bond","Chain isomers of the carbon skeleton","Functional group isomers","Position isomers of the carbonyl group"],2,"Propanal is an aldehyde and propanone is a ketone, both C3H6O.","Aldehyde vs ketone.",0,3],["In functional group isomerism, the isomers have",["The same functional group","Different functional groups","Different carbon number","Different molecular formula"],1,"The book gives propanal and propanone as the example.","Different groups.",0,3],["Cyclopropane is isomeric with",["Propene","Propyne","Propanol","Propane"],0,"Cyclic alkanes are isomeric with alkenes.","Ring alkane, alkene.",0,3],["Skeletal isomers differ in",["The main carbon chain","The position of the group","The functional group","Space arrangement"],0,"This is most identifiable in secondary and tertiary alcohol isomers.","Skeleton, chain differs.",0,3],["Tautomers are structural isomers that",["Cannot interconvert unless a catalyst is added","Are mirror images of one another","Spontaneously interconvert even when pure","Differ in the number of carbon atoms"],2,"They have different chemical properties and distinct reactions.","Tautomers swap by themselves.",0,3],["Keto/enol tautomerism differs by the position of",["A halogen","A double bond only","A proton","A carbon atom"],2,"The proton is alternately on carbon or oxygen.","Proton moves.",0,3],["If interconversion of tautomers is fast enough,",["They become enantiomers of each other","They cannot be isolated from each other","They are always isolated as separate forms","They form a racemic mixture on standing"],1,"Fast interconversion prevents isolation.","Too fast to separate.",0,3],["Stereoisomers have the same",["Molecular formula but different structural formula","Different atoms but the same arrangement in space","Molecular and structural formula but different arrangement in space","Different functional groups but similar arrangement"],2,"They are classified by symmetry properties.","Same structure, different space.",0,4],["Geometric isomerism involves a",["Single bond that allows free rotation fully","Triple bond with a linear shape only","Ring of six carbons with delocalised pi","Double bond that does not allow free rotation"],3,"Usually a C=C bond. The isomers are not superimposable.","Double bond, no rotation.",0,4],["Cis-but-2-ene and trans-but-2-ene are",["Functional group isomers","Geometric isomers","Chain isomers","Optical isomers"],1,"The groups lie on the same or opposite side of the double bond.","Cis and trans, geometric.",0,4],["Maleic acid is the",["Trans isomer of butenedioic acid","Optical isomer of fumaric acid","Cis isomer of butenedioic acid","Position isomer of succinic acid"],2,"The book says cis-butenedioic acid is maleic acid.","Maleic, cis.",0,4],["Fumaric acid is the",["Chain isomer of maleic acid","Cis isomer of butenedioic acid","Racemic form of maleic acid","Trans isomer of butenedioic acid"],3,"The book says trans-butenedioic acid is fumaric acid.","Fumaric, trans.",0,4],["Optical isomerism occurs when an atom is bonded to",["Four different atoms or groups","A double bond and a single bond","Three different atoms or groups only","Two identical atoms or groups only"],0,"Usually a carbon atom. The isomers exist in pairs that are mirror images.","Four different, optical.",0,5],["Optical isomers exist as",["Chain forms of the same carbon skeleton","Cis and trans forms of the alkene","Identical molecules in every respect","Mirror images of each other"],3,"One isomer is the mirror image of the other.","Mirror pairs.",0,5],["Butan-2-ol shows optical isomerism because",["It has two OH groups on the chain","It has a double bond between the carbons","It is a ring with a hydroxyl group","Carbon 2 holds four different groups"],3,"The groups on C2 are H, OH, CH3 and C2H5.","Four different groups on C2.",0,5],["Non-superimposable mirror images are called",["Tautomers","Diastereomers","Enantiomers","Meso compounds"],2,"The central carbon with four different groups is the asymmetrical carbon.","Mirror images, enantiomers.",0,5],["An asymmetrical carbon atom is one attached to",["Two identical atoms or groups only","Three hydrogens and one other group","Four different atoms or groups","A double bond to a neighbouring carbon"],2,"It is the central carbon of the optical isomers.","Asymmetric, four different.",0,5],["A symmetry plane",["Divides a molecule into equivalent halves","Breaks a bond in the molecule","Is a point at the centre of the molecule","Joins two molecules into one compound"],0,"Like a mirror placed so one half is a mirror image of the other.","Plane splits in two.",0,5],["A chiral stereoisomer",["Has a centre of symmetry","Has no plane or centre of symmetry","Has a plane of symmetry","Is superimposable on its mirror image"],1,"A chiral stereoisomer is not superimposable on its mirror image.","Chiral, no symmetry.",0,5],["A racemic form is",["A meso compound with a symmetry plane","An equal mixture of the two enantiomers","A single pure enantiomer of the compound","A pair of diastereomers in equal amounts"],1,"The book says a mixture of equal members of each enantiomer is the racemic form.","Racemic, 50:50.",0,6],["Racemization is",["Separation of enantiomers into pure forms","Conversion of a cis isomer into a trans form","Formation of a double bond from a single bond","Conversion of an enantiomer into a racemic form"],3,"Racemization converts an enantiomer into a racemic mixture.","Racemization makes the mix.",0,6],["Resolution is",["Separation of a racemic form into individual enantiomers","Conversion of one enantiomer into a mixture of both","Removal of a double bond from the chain","Formation of a ring from a straight chain"],0,"Resolution separates the two enantiomers.","Resolution splits.",0,6],["Stereoisomers that are not mirror images are called",["Racemates","Tautomers","Diastereomers","Enantiomers"],2,"They occur in compounds having more than one chiral centre.","Not mirror, diastereomers.",0,6],["Diastereomers occur in compounds with",["Only a double bond","Only one chiral centre","No chiral centre","More than one chiral centre"],3,"The book's example is 2-chloro-3-pentanol.","Many centres, diastereomers.",0,6],["A molecule is achiral if it",["Has four different groups on one carbon","Is not superimposable on its mirror image","Is a racemic mixture of two forms","Is superimposable on its mirror image"],3,"Most achiral molecules have a plane or centre of symmetry.","Superimposable, achiral.",0,6],["Achiral molecules that contain a stereocentre are called",["Enantiomers","Meso compounds","Racemic forms","Diastereomers"],1,"The book calls achiral molecules with a stereocentre meso.","Achiral with stereocentre, meso.",0,6]]},{"t":"Alcohols","s":["Classification and naming","Physical properties","Industrial preparation","Laboratory preparation: hydrolysis, Grignard and reduction","Oxymercuration, hydroboration, aldol and hydroxylation","Chemical properties","Oxidation and tests for alcohols"],"q":[["The general formula of alcohols is",["CnH2n+1OH","CnH2n-1OH","CnH2n+2OH","CnH2nOH"],0,"Alcohols have at least one –OH (hydroxyl) group.","Alkyl plus OH.",0,0],["The functional group of alcohols is called the",["Carbonyl group","Carboxyl group","Hydroxyl group","Amino group"],2,"The book calls the –OH group the hydroxyl group.","OH, hydroxyl.",0,0],["Alcohols are classified as 1°, 2° or 3° by",["The boiling point of the alcohol formed","The number of R groups on the carbon bearing the OH","The number of OH groups in the molecule","The number of carbons in the main chain"],1,"Primary has one R, secondary two and tertiary three on the carbinol carbon.","Count R on the OH carbon.",0,0],["A tertiary alcohol has the OH carbon attached to",["Three R groups","Two R groups","One R group","Three hydrogens"],0,"The OH carbon has no hydrogen.","3° means three R.",0,0],["Alcohols are also classified by the number of OH groups per molecule as",["Primary, secondary and tertiary","Open and closed","Saturated and unsaturated","Monohydric, dihydric and trihydric"],3,"One OH is monohydric, two dihydric and three trihydric.","Mono, di, tri-hydric.",0,0],["Ethylene glycol (1,2-ethanediol) is a",["Trihydric alcohol","Dihydric alcohol","Tertiary alcohol","Monohydric alcohol"],1,"It has two –OH groups.","Two OH, dihydric.",0,0],["Glycerol (1,2,3-propanetriol) is a",["Trihydric alcohol","Monohydric alcohol","Dihydric alcohol","Primary alcohol only"],0,"It has three –OH groups.","Three OH, trihydric.",0,0],["In the carbinol system, CH3CH2OH is named",["Ethylcarbinol","Methylcarbinol","Dimethylcarbinol","Carbinol"],1,"The carbon bearing OH is called carbinol and the rest is the alkyl group.","Ethanol is methylcarbinol.",1,0],["Triphenylcarbinol has the carbinol carbon bonded to",["Three ethyl groups","Three phenyl groups","Three methyl groups","One phenyl group"],1,"The carbinol carbon carries three phenyl groups and the OH.","Tri, three phenyl.",0,0],["The IUPAC name of (CH3)2CHCH2CH2OH type 2-methylbutan-1-ol shows the OH is on carbon",["2","1","4","3"],1,"2-Methylbutan-1-ol has OH at C1 and methyl at C2.","Number from the OH.",0,0],["Ethylene glycol is also named",["1,3-Propanediol","1,1-Ethanediol","1,2-Ethanediol","Ethanol"],2,"Both OH groups are on adjacent carbons.","Glycol, 1,2-diol.",0,0],["The boiling point of alcohols increases with",["Decreasing molecular weight","Increasing branching","Decreasing polarity","Increasing molecular weight"],3,"It decreases with branching.","Heavier, higher boiling.",0,1],["Branching in an alcohol chain",["Makes it a solid","Decreases the boiling point","Has no effect","Increases the boiling point"],1,"Boiling point is affected by molecular weight and shape.","Branched, lower bp.",0,1],["Alcohols have higher boiling points than aldehydes of similar mass because of",["Greater density of the liquid alcohol","Intermolecular hydrogen bonding","Ionic bonds between the molecules","Higher dipole moment of the C=O group"],1,"The book notes that alcohols boil higher even though aldehydes are more polar.","Alcohols hydrogen bond.",1,1],["Which compound in the book's table has the highest boiling point?",["n-Butyraldehyde","n-Butyl alcohol","n-Propyl chloride","n-Pentane"],1,"The boiling points are 118, 76, 47 and 36 °C.","Hydrogen bond wins.",0,1],["The boiling point of ethylene glycol is",["78 °C","118 °C","197 °C","97 °C"],2,"It forms double intermolecular hydrogen bonding.","Two OH, very high bp.",0,1],["The boiling point of ethanol is",["64.5 °C","97 °C","118 °C","78.3 °C"],3,"The book gives 78.3 °C for ethanol.","Ethanol, 78.",0,1],["The boiling point of methanol is",["97 °C","78.3 °C","100 °C","64.5 °C"],3,"Methanol is the first member of the series with n = 1.","Methanol, 64.5.",0,1],["The solubility of alcohols in water decreases as",["The temperature of the water falls","The molecule gets smaller in size","The R group (non-polar end) gets longer","The OH group increases in number"],2,"Lower alcohols have infinite solubility in water.","Long R, less soluble.",0,1],["Lower alcohols have what solubility in water?",["Zero","Infinite","Moderate only","Very low"],1,"The solubility decreases with longer members.","Small alcohols mix fully.",0,1],["The melting point of alcohols",["Increases with increasing molecular weight","Stays the same whatever the weight","Drops sharply with each extra carbon","Decreases with increasing molecular weight"],0,"The book notes that ethanol and propanol show deviation from this trend.","Heavier, higher mp.",0,1],["Fermentation is the gradual decomposition of",["A larger organic molecule such as starch into simpler molecules","Glucose into a polymer by strong heating","Ethene into alcohol by acid catalysis","Ethanol into starch by the action of yeast"],0,"Starch is converted to ethanol and carbon dioxide in the presence of yeast enzymes.","Starch to ethanol.",0,2],["The enzymes for fermentation are supplied by",["Yeast","Starch","Bacteria in soil","Water"],0,"Yeast contains enzymes.","Yeast, enzymes.",0,2],["Distilling the fermented mixture gives about",["50% ethanol","100% ethanol","90–95% ethanol","20% ethanol"],2,"The crude alcohol is distilled to 90–95% ethanol.","Distillation, 90–95.",0,2],["The enzyme that changes maltose to glucose is",["Maltase","Lipase","Zymase","Pepsin"],0,"Maltase hydrolyses maltose into glucose and fructose units.","Maltase, maltose.",0,2],["The enzyme that changes glucose to ethanol and carbon dioxide is",["Amylase","Maltase","Lipase","Zymase"],3,"Zymase converts glucose/fructose into ethanol and CO2.","Zymase, ethanol.",0,2],["Ethanol can be further purified by redistilling with",["Ether","Acetone","Hexane","Benzene"],3,"The book says benzene is added and ethanol is redistilled at 78.3 °C.","Add benzene.",0,2],["Hydration of alkenes uses alkenes obtained from",["Fermentation of sugars by yeast","Coal tar from the gas works","Petroleum cracking","Wood distillation in a closed retort"],2,"The alkenes react with water or dilute H2SO4.","Alkene, cracking.",0,2],["Hydration of an alkene is carried out using",["LiAlH4 in dry ether solvent","H2O with dilute H2SO4","KMnO4 in cold dilute solution","NaOH in aqueous solution, warm"],1,"The alkene adds H and OH across the double bond.","Alkene plus water.",0,2],["Destructive distillation of wood gives a liquid called",["Pyroligneous acid","Wood spirit acid","Pyrolytic oil","Formic liquor"],0,"It contains methanol, ethanoic acid, acetone, methyl ethanoate, ammonia and amines.","Wood heat, pyroligneous.",0,2],["Methanol is made industrially by catalytic reduction of CO with a catalyst of",["Zinc and chromium oxide","Nickel and platinum","Iron and aluminium","Copper and tin"],0,"CO + 2H2 gives CH3OH.","CO + 2H2, Zn and Cr oxide.",0,2],["Hydrolysis of an alkyl halide with KOH gives",["An alcohol","An ether","An acid","An alkene"],0,"RX + KOH gives ROH + KX.","Halide to alcohol.",0,3],["Benzyl chloride with aqueous NaOH gives",["Toluene","Phenol","Benzaldehyde","Benzyl alcohol"],3,"The chlorine is replaced by OH.","Benzyl chloride, benzyl alcohol.",0,3],["Methanal (HCHO) with a Grignard reagent, then hydrolysis, gives a",["Primary alcohol","Ketone","Tertiary alcohol","Secondary alcohol"],0,"Methanal + GR gives a 1° alcohol.","HCHO, primary.",0,3],["Other aldehydes with a Grignard reagent give a",["Tertiary alcohol","Ether","Secondary alcohol","Primary alcohol"],2,"Other aldehydes + GR give 2° alcohols.","Aldehyde, secondary.",0,3],["Ketones with a Grignard reagent give a",["Secondary alcohol","Ether","Primary alcohol","Tertiary alcohol"],3,"Ketones + GR give 3° alcohols.","Ketone, tertiary.",0,3],["Ethylene oxide with a Grignard reagent gives a",["Ketone","Tertiary alcohol","Primary alcohol","Secondary alcohol"],2,"The product is a 1° alcohol.","Epoxide, primary.",0,3],["An ester with two moles of Grignard reagent gives a",["Primary alcohol","Tertiary alcohol","Ketone","Secondary alcohol"],1,"Ester + 2 GR gives a 3° alcohol.","Ester, two GR, tertiary.",0,3],["Reduction of an aldehyde gives a",["Acid","Secondary alcohol","Tertiary alcohol","Primary alcohol"],3,"Reduction of aldehydes gives 1° alcohols.","Aldehyde to primary.",0,3],["Reduction of a ketone gives a",["Tertiary alcohol","Aldehyde","Primary alcohol","Secondary alcohol"],3,"CH3COCH2CH3 gives butan-2-ol.","Ketone to secondary.",0,3],["A primary amine warmed with nitrous acid gives",["An aldehyde","An acid","An alcohol","An ether"],2,"RNH2 + HNO2 gives ROH + H2O + N2.","Amine to alcohol, N2 lost.",0,3],["Methylamine with nitrous acid gives",["Methanol","Methanal","Nitromethane","Ethanol"],0,"CH3NH2 + HNO2 gives CH3OH + H2O + N2.","Methylamine, methanol.",0,3],["Oxymercuration–demercuration adds water to a double bond in",["An anti-Markovnikov manner","A free radical manner","A Markovnikov manner","A syn manner only"],2,"The reagents are Hg(OAc)2 followed by NaBH4.","Hg gives Markovnikov.",0,4],["Hydroboration–oxidation adds water to a double bond in",["A manner that gives no alcohol at all","A Markovnikov manner of addition","An anti-Markovnikov manner","A random manner with no fixed pattern"],2,"The reagents are diborane (BH3)2 in THF, then H2O2/OH−.","Boron gives anti-Markovnikov.",0,4],["The solvent used in hydroboration is",["Benzene","Ether only","THF","Water"],2,"THF separates diborane from its dimer to the monomer.","Hydroboration, THF.",0,4],["The oxidation step of hydroboration uses",["H2O2 with a base","Zn with HCl in water","LiAlH4 in dry ether solvent","KMnO4 in cold dilute solution"],0,"Triethylborane is oxidised to ethanol and boric acid.","Borane oxidised by H2O2.",0,4],["Hydroboration–oxidation overall allows the addition of",["H2 to the C=C double bond","Br–Br to the C=C double bond","H–Br to the C=C double bond","H–OH to the C=C double bond"],3,"The product is an alcohol.","Alkene plus H–OH.",0,4],["Catalytic hydrogenation of α,β-unsaturated aldehydes and ketones gives",["Saturated alcohols","Acids","Unsaturated alcohols","Ketones"],0,"Addition takes place at both C=C and C=O bonds.","Hydrogenation, saturated alcohol.",0,4],["In the aldol route, ethanal gives aldol, then crotonaldehyde, and finally with H2/Ni",["Isobutyl alcohol","Ethanol","Propanol","n-Butyl alcohol"],3,"CH3CH=CHCHO + H2/Ni gives CH3CH2CH2CH2OH.","Four carbons, n-butyl.",0,4],["Carbonyl compounds can be reduced to alcohols by",["HNO3 in concentrated solution","KMnO4 in acid or alkaline solution","LiAlH4 or H2 with Ni, Pt or Pd","Na2Cr2O7 with dilute sulphuric acid"],2,"Aldehydes are reduced to 1° alcohols.","LiAlH4 reduces.",0,4],["NaBH4 does not reduce",["A C=C bond, even if conjugated","A C=O bond of a ketone","A C=O bond of an aldehyde","An aldehyde group on a chain"],0,"It is a mild reducing agent compared with LiAlH4 and is used to make unsaturated alcohols.","NaBH4 spares C=C.",0,4],["NaBH4 reduction of 3-phenyl-2-propenal gives",["An unsaturated alcohol","A saturated alcohol","An ether","An acid"],0,"The C=C remains and the CHO becomes CH2OH.","C=C stays.",0,4],["Acids are converted to esters before reduction because",["LiAlH4 is not strong enough","Acids cannot be reduced","LiAlH4 is expensive","Esters are cheaper than alcohols"],2,"The book says to use esters and then reduce them.","Acid to ester saves LiAlH4.",0,4],["Hydroxylation of an alkene with cold dilute KMnO4 gives a",["Glycol (syn-hydroxylation)","Monohydric alcohol, by anti addition","Epoxide only, with no OH groups","Ketone, by cleavage of the bond"],0,"Both OH groups add to the same face of the double bond.","KMnO4, glycol.",0,4],["Reactions with HX, PCl3 or PCl5, or conc. H2SO4 involve breaking of the",["O–H bond","C–OH bond","C–C bond","C–H bond"],1,"These reactions replace or remove the OH group.","HX, PCl5, C–OH.",0,5],["Reactions with active metals, esterification and oxidation involve breaking of the",["C–OH bond","O–H bond","C–C bond","C–H bond only"],1,"For O–H breaking, the order of reactivity is 1° > 2° > 3°.","Na, ester, oxidation, O–H.",0,5],["In reaction with HX, the order of reactivity of alcohols is",["2° > 1° > 3°","3° > 2° > 1°","1° > 2° > 3°","All equal"],1,"Alcohols react with HX in the order 3° > 2° > 1°.","HX, tertiary first.",0,5],["Reaction of an alcohol with PBr3 gives",["An alkene by loss of water","A carboxylic acid on oxidation","An alkyl bromide","An ether by loss of water"],2,"2-Methyl-1-propanol gives 1-bromo-2-methylpropane.","PBr3, bromide.",0,5],["Dehydration of ethanol with conc. H2SO4 gives",["Ethane","Diethyl ether","Ethene","Ethanal"],2,"Water is lost to form a double bond.","Ethanol minus water, ethene.",0,5],["Dehydrating agents for alcohols include",["NaOH and KOH in hot solution","Alumina and conc. H2SO4","LiAlH4 in dry ether solvent","KMnO4 in cold dilute solution"],1,"The book lists heat, a catalyst such as alumina, and conc. H2SO4.","Alumina or conc. acid.",0,5],["Ethanol reacts with sodium to give",["Ethanal and hydroge try{ if(window.IndigeneHistory&&IndigeneHistory.registerStruct) IndigeneHistory.registerStruct('CHM102',{title:'CHM 102 \u00b7 Organic Chemistry',chapters:DATA.map(function(c){return {t:c.t,n:c.q.length,s:c.s};})}); }catch(e){}
const SUBJECT_KEY = 'chm102';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// flatten
const ALL = [];
DATA.forEach((c,ci)=>c.q.forEach((q,qi)=>ALL.push({id:ci+'_'+qi, ch:ci, stem:q[0], opts:q[1], ans:q[2], exp:q[3], hack:q[4], trap:q[5], sec:q[6]})));
const TOTAL = ALL.length;
// questions already served in earlier runs (kept per browser) so new runs favour fresh ones
let SEEN = new Set();
try{ SEEN = new Set(JSON.parse(localStorage.getItem('chm102_seen')||'[]')); }catch(e){}
function saveSeen(){ try{ localStorage.setItem('chm102_seen', JSON.stringify([...SEEN])); }catch(e){} }
// shuffle, then put unseen questions first (random order inside each half)
function freshFirst(arr){ const a=shuffle(arr.slice()); return a.filter(q=>!SEEN.has(q.id)).concat(a.filter(q=>SEEN.has(q.id))); }
const FULL_N = 500;
// fair sample: every chapter is represented in proportion to its size
function sampleFair(n){
  const groups = DATA.map((_,ci)=>freshFirst(ALL.filter(q=>q.ch===ci)));
  const exact = groups.map(g=>g.length*n/TOTAL);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a,b)=>a+b,0);
  exact.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([f,i])=>{ if(left>0 && take[i]<groups[i].length){ take[i]++; left--; } });
  let out=[]; groups.forEach((g,i)=>{ out=out.concat(g.slice(0,take[i])); });
  return shuffle(out);
}

// optional access gate (cbt-lock.js) — never breaks the quiz if missing
let lock = null;
async function loadLock(){
  try { lock = await import('../cbt-lock.js'); }
  catch(e){ try { lock = await import('/cbt-lock.js'); } catch(e2){ lock = null; } }
}
const lockReady = loadLock();

const PASS = 50;
const grade = p => p>=70?'A':p>=60?'B':p>=50?'C':p>=45?'D':p>=40?'E':'F';
let mode = 'full', sel = new Set(), secSel = null, run = [], idx = 0, weakSpec = null;
// '2.3,4.all' = chapter 2 section 3, whole of chapter 4 (sent from the History tab or the result screen)
function specPool(spec){
  const want = spec.map(s=>s.split('.')); let pool = [];
  want.forEach(([c,s])=>{ const ci=(+c)-1; if(!DATA[ci]) return;
    pool = pool.concat(ALL.filter(q=>q.ch===ci && (s==='all' || q.sec===(+s)-1))); });
  pool = shuffle(pool); return pool.length>50 ? pool.slice(0,50) : pool;
}

function renderSetup(){
  const quick = 50, half = 250;
  const cards = [
    ['full', FULL_N, 'Full CBT'],
    ['quick', quick, 'Quick Drill'],
    ['half', half, 'Half Run'],
    ['session', '🎯', 'By Chapter']
  ];
  $('runs').innerHTML = cards.map(c=>`<button class="run${c[0]===mode?' sel':''}" data-m="${c[0]}"><span class="n">${c[1]}</span>${c[2]}</button>`).join('');
  document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; renderSetup(); });
  $('chaps').classList.toggle('show', mode==='session');
  $('chapList').innerHTML = DATA.map((c,i)=>{
    const on = sel.has(i);
    let x = `<div class="chap${on?' on':''}" data-i="${i}"><span class="box" style="border-radius:50%">${on?'●':''}</span><span class="nm">Ch ${i+1}. ${esc(c.t)}</span><span class="ct">${c.q.length}</span></div>`;
    if(on){
      x += '<div class="secs"><button class="sec'+(secSel===null?' on':'')+'" data-s="all">Whole chapter · '+c.q.length+'</button>'
        + c.s.map((sn,si)=>'<button class="sec'+(secSel===si?' on':'')+'" data-s="'+si+'">'+esc(sn)+' · '+c.q.filter(q=>q[6]===si).length+'</button>').join('') + '</div>';
    }
    return x;
  }).join('');
  document.querySelectorAll('.chap').forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; sel.clear(); sel.add(i); secSel=null; renderSetup(); });
  document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{ secSel = b.dataset.s==='all' ? null : +b.dataset.s; renderSetup(); });
}

function makeItem(q){
  return { q, perm: shuffle([0,1,2,3]), pick: null };   // perm = order of original options shown 
}

async function startQuiz(){
  if(mode==='session' && sel.size===0){ toast('Pick a chapter first'); return; }
  try{ await lockReady; }catch(e){}
  if(lock && typeof lock.checkCbtAccess==='function'){
    try{
      const r = await lock.checkCbtAccess(SUBJECT_KEY);
      if(r && r.blocked){ lock.renderCbtLockScreen($('app'), r.reason); return; }
    }catch(e){}
  }
  let pool;
  if(mode==='full') pool = sampleFair(FULL_N);
  else if(mode==='quick') pool = freshFirst(ALL).slice(0,50);
  else if(mode==='half') pool = sampleFair(250);
  else if(mode==='weak') pool = specPool(weakSpec||[]);
  else {
    pool = [];
    [...sel].sort((a,b)=>a-b).forEach(ci=>{ pool = pool.concat(ALL.filter(q=>q.ch===ci && (secSel===null || q.sec===secSel))); });
  }
  if(!pool.length){ toast('Nothing to practise there'); return; }
  begin(pool);
}

let startedAt = 0, isRetry = false, saved = false;
let reviewing=false;
function begin(pool, retry){
  reviewing=false; $('finishBtn').textContent='Finish & see score';
  run = pool.map(makeItem); idx = 0; startedAt = Date.now(); isRetry = !!retry; saved = false;
  if(!retry){ pool.forEach(q=>SEEN.add(q.id)); if(SEEN.size >= TOTAL) SEEN = new Set(); saveSeen(); }
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  window.scrollTo(0,0);
  renderQ();
}

function counts(){
  let ok=0,no=0;
  run.forEach(it=>{ if(it.pick!==null){ it.pick===it.q.ans ? ok++ : no++; } });
  return {ok,no};
}

function renderQ(){
  const it = run[idx], q = it.q, c = counts();
  $('qpos').textContent = `Q ${idx+1} / ${run.length}`;
  $('sOk').textContent = c.ok; $('sNo').textContent = c.no;
  $('bar').style.width = ((c.ok+c.no)/run.length*100)+'%';
  $('chtag').textContent = `Ch ${q.ch+1} · ${DATA[q.ch].t}`;
  $('qtext').textContent = q.stem;
  const L = ['A','B','C','D'];
  const answered = it.pick!==null || reviewing;
  $('opts').innerHTML = it.perm.map((oi,pos)=>{
    let cls='opt';
    if(answered){ cls+=' locked'; if(oi===q.ans) cls+=' correct'; else if(oi===it.pick) cls+=' wrong'; }
    return `<button class="${cls}" data-oi="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join('');
  if(!answered) document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  renderFb();
  $('prev').disabled = idx===0;
  $('next').textContent = idx===run.length-1 ? (reviewing?'Done ▶':'Finish ▶') : 'Next ▶';
}

function renderFb(){
  const it = run[idx], q = it.q;
  if(it.pick===null && !reviewing){ $('fb').innerHTML=''; return; }
  const good = it.pick===q.ans;
  const pos = 'ABCD'[it.perm.indexOf(q.ans)];
  $('fb').innerHTML = `<div class="fb">
    ${q.trap?'<span class="trap">⚠ TRAP QUESTION</span>':''}
    <div class="v ${good?'ok':'no'}">${good?'✅ Correct!':it.pick===null?'⏭ Skipped — the answer is '+pos:'❌ Not quite — the answer is '+pos}</div>
    <p class="ex">${esc(q.exp)}</p>
    <div class="hk">⏱ Speed hack: ${esc(q.hack)}</div>
  </div>`;
}

function choose(oi){
  const it = run[idx];
  if(it.pick!==null || reviewing) return;
  it.pick = oi;
  try{ if(lock && typeof lock.recordCbtQuestionUsed==='function') lock.recordCbtQuestionUsed(); }catch(e){}
  renderQ();
}

$('prev').onclick=()=>{ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0);} };
$('next').onclick=()=>{ if(idx<run.length-1){ idx++; renderQ(); window.scrollTo(0,0);} else if(reviewing) backToResult(); else finish(); };
function startReview(){
  reviewing=true; idx=0;
  $('finishBtn').textContent='Back to result';
  $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  renderQ(); window.scrollTo(0,0);
}
function backToResult(){ reviewing=false; $('finishBtn').textContent='Finish & see score'; finish(); }
$('finishBtn').onclick=()=>{
  if(reviewing){ backToResult(); return; }
  const left = run.filter(i=>i.pick===null).length;
  if(left===0){ finish(); return; }
  $('cmsg').textContent = left+' question(s) not answered yet. Finish anyway?';
  $('cov').classList.add('show');
};
$('cYes').onclick=()=>{ $('cov').classList.remove('show'); finish(); };
$('cNo').onclick=()=>$('cov').classList.remove('show');

function openMap(){
  $('map').innerHTML = run.map((it,i)=>{
    let c=''; if(it.pick!==null) c = it.pick===it.q.ans?'ok':'no';
    if(i===idx) c+=' cur';
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; $('ov').classList.remove('show'); renderQ(); window.scrollTo(0,0); });
  $('ov').classList.add('show');
}
$('mapBtn').onclick=openMap;
$('closeMap').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{ if(e.target.id==='ov') $('ov').classList.remove('show'); };

function saveHistory(c){
  if(saved || isRetry) return;
  const answered = c.ok + c.no;
  if(answered<=0) return;
  saved = true;
  try{
    if(window.IndigeneHistory && typeof window.IndigeneHistory.save==='function'){
      const topics = {};
      run.forEach(it=>{
        if(it.pick===null) return;
        const k = 'Ch '+(it.q.ch+1)+' · '+DATA[it.q.ch].s[it.q.sec];
        if(!topics[k]) topics[k]=[0,0];
        topics[k][1]++; if(it.pick===it.q.ans) topics[k][0]++;
      });
      window.IndigeneHistory.save({course:'CHM102', mode:'cbt', correct:c.ok, total:answered,
        secs:Math.round((Date.now()-startedAt)/1000), topics:topics});
    }
  }catch(e){}
}
function finish(){
  const c = counts(), n = run.length, un = n-c.ok-c.no;
  const pct = n? Math.round(c.ok/n*100):0;
  const msg = pct>=70?'Outstanding. You are ready for the exam. 🔥':pct>=50?'You passed. Keep pushing higher and clear every section.':pct>=40?'Close. Revise the failed sections and run again.':'Keep going. Read the failed sections again, then retry.';
  saveHistory(c);
  const chs = {}, secs = {};
  run.forEach(it=>{
    const q = it.q, good = it.pick===q.ans;
    const a = chs[q.ch] || (chs[q.ch] = {ok:0,n:0}); a.n++; if(good) a.ok++;
    const k = q.ch+'_'+q.sec; const b = secs[k] || (secs[k] = {ch:q.ch,sec:q.sec,ok:0,n:0}); b.n++; if(good) b.ok++;
  });
  const chKeys = Object.keys(chs).map(Number).sort((x,y)=>x-y);
  const pc = x => Math.round(x.ok/x.n*100);
  const need = ci => Math.max(8, Math.ceil(DATA[ci].q.length*0.4));
  const rows = chKeys.map(ci=>{
    const a = chs[ci], s = pc(a), full = a.n>=need(ci), ok = s>=PASS;
    const sr = Object.values(secs).filter(x=>x.ch===ci).sort((x,y)=>x.sec-y.sec).map(x=>`<div class="sr"><span>${esc(DATA[ci].s[x.sec])}</span><b class="${pc(x)>=PASS?'pass':'fail'}">${x.ok}/${x.n} · ${pc(x)}%</b></div>`).join('');
    return `<details class="cres"${(full&&!ok)?' open':''}><summary><span>Ch ${ci+1} · ${esc(DATA[ci].t)}</span><b class="${!full?'na':ok?'pass':'fail'}" style="white-space:nowrap">${s}/100 · ${grade(s)} · ${!full?'PRACTICE':ok?'PASS ✔':'FAIL ✖'}</b></summary>${sr}</details>`;
  }).join('');
  const weak = Object.values(secs).filter(x=>x.n>=2 && pc(x)<PASS).sort((x,y)=>x.ch-y.ch||x.sec-y.sec);
  const revise = weak.length ? `<div class="revise"><b>Revise these sections</b>${weak.map(x=>`<div class="sr"><span>Ch ${x.ch+1} · ${esc(DATA[x.ch].s[x.sec])}</span><b class="fail">${pc(x)}%</b></div>`).join('')}</div>` : '<p class="msg pass"><b>Every section in this run is at pass mark or above.</b></p>';
  const fullKeys = chKeys.filter(ci=>chs[ci].n>=need(ci));
  const passedN = fullKeys.filter(ci=>pc(chs[ci])>=PASS).length;
  const wrong = run.filter(it=>it.pick!==null && it.pick!==it.q.ans);
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  window.scrollTo(0,0);
  $('result').innerHTML = `
    <h2>Result</h2>
    <div class="big" style="font-size:2.2rem">${pct}/100 · ${grade(pct)}</div>
    <div class="stats"><span>Correct <b>${c.ok}</b></span><span>Wrong <b>${c.no}</b></span><span>Skipped <b>${un}</b></span><span>Total <b>${n}</b></span></div>
    <p class="msg"><b class="${pct>=PASS?'pass':'fail'}">${pct>=PASS?'PASS':'FAIL'}</b> · pass mark ${PASS}/100 · ${fullKeys.length?'chapters passed in this run '+passedN+'/'+fullKeys.length:'practice run, no chapter pass or fail'}</p>
    <p class="msg">${msg}</p>
    <h2 style="margin-top:16px">Score per chapter</h2>
    ${rows}
    <p class="msg" style="font-size:.8rem;color:var(--mute)">PRACTICE means this run had under 40% of that chapter's questions, so it shows a score but no pass or fail.</p>
    ${revise}
    ${weak.length?'<button class="btn" id="weakBtn">Practice these weak sections ('+weak.length+')</button>':''}
    <button class="btn" id="reviewBtn">Review answers${wrong.length?' ('+wrong.length+' wrong)':''}</button>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="/#history=CHM102">My history</a>
    ${wrong.length?`<button class="btn" id="retryWrong">Retry wrong answers (${wrong.length})</button>`:''}
    <button class="btn ghost" id="newRun">New run</button>
    `;
  $('reviewBtn').onclick=startReview;
  if($('weakBtn')) $('weakBtn').onclick=()=>{ weakSpec=weak.map(x=>(x.ch+1)+'.'+(x.sec+1)); mode='weak'; startQuiz(); };
  if($('retryWrong')) $('retryWrong').onclick=()=>begin(shuffle(wrong.map(w=>w.q)), true);
  $('newRun').onclick=()=>{ $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); renderSetup(); window.scrollTo(0,0); };
}

document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden') || $('ov').classList.contains('show') || $('cov').classList.contains('show')) return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ const it=run[idx]; if(it.pick===null){ choose(it.perm['abcd'.indexOf(k)]); } }
  else if(e.key==='ArrowRight') $('next').click();
  else if(e.key==='ArrowLeft') $('prev').click();
});

$('startBtn').onclick=startQuiz;
renderSetup();
try{
  const pr = new URLSearchParams(location.search).get('practice');
  if(pr && /^[\d.,all]+$/.test(pr)){ weakSpec = pr.split(',').filter(Boolean); mode='weak'; startQuiz(); }
}catch(e){}
</script>
</body>
</html>
