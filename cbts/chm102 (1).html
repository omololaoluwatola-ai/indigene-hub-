<style>
:root{
  --bg:#120a07; --bg2:#1a0f0a; --card:#1c110b; --line:#4a2a17;
  --fire:#ff6a1a; --fire2:#d4400f; --gold:#ffb347; --text:#f3e7dc; --mute:#b49a88;
  --ok:#2ecc71; --okbg:rgba(46,204,113,.12); --bad:#ff4d4d; --badbg:rgba(255,77,77,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#3a1a0b 0%,var(--bg) 55%) fixed;
  color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh;
  padding:20px 16px 40px;line-height:1.5;
}
#app{max-width:720px;margin:0 auto}
h1.brand{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--fire);text-align:center;
  letter-spacing:.08em;font-size:2.1rem;margin:8px 0 6px;text-shadow:0 0 18px rgba(255,106,26,.35)}
.sub{font-family:'Orbitron',sans-serif;text-align:center;color:var(--mute);font-size:.9rem;letter-spacing:.06em;margin:0 0 20px}
.panel{background:linear-gradient(180deg,var(--card),#150c08);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
.panel h2{font-family:'Orbitron',sans-serif;color:var(--gold);text-align:center;font-size:1.35rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run{background:#150c08;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer;transition:.15s}
.run .n{display:block;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold);font-size:1.5rem;margin-bottom:2px}
.run.sel{background:linear-gradient(135deg,var(--fire),var(--fire2));border-color:var(--gold);box-shadow:0 0 16px rgba(255,106,26,.35)}
.run.sel .n{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;cursor:pointer;
  background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-family:'Exo 2',sans-serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.03em;box-shadow:0 8px 22px rgba(255,106,26,.28)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#150c08;border:1px solid var(--line);color:var(--text);box-shadow:none}
.foot{color:var(--mute);text-align:center;font-size:.92rem;margin-top:16px}
.chaps{margin-top:14px;display:none}
.chaps.show{display:block}
.chaps .tools{display:flex;gap:8px;margin-bottom:8px}
.chaps .tools button{flex:1;background:#150c08;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;font-weight:600;cursor:pointer}
.chap{display:flex;align-items:center;gap:10px;background:#150c08;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.chap.on{border-color:var(--gold);background:#24140c}
.chap .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#000}
.chap.on .box{background:var(--gold);border-color:var(--gold)}
.chap .nm{flex:1;font-size:.98rem}
.chap .ct{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.85rem}

/* progress + sections */
.secs{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px 4px}
.sec{border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:20px;padding:5px 11px;font-size:.82rem;cursor:pointer;font-family:inherit}
.sec.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
details.cres{border:1px solid var(--line);background:#150c08;border-radius:14px;margin-top:10px}
details.cres>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.cres>summary::-webkit-details-marker{display:none}
.cres .sr,.revise .sr{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.cres .sr{padding:8px 14px;border-top:1px solid var(--line)}
.revise{border:1px solid var(--bad);background:var(--badbg);border-radius:14px;padding:12px 14px;margin-top:14px}
.revise .sr{padding:6px 0}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--mute);margin-bottom:8px}
.top .sc{font-family:'Orbitron',sans-serif;font-size:.85rem}
.top .sc b.g{color:var(--ok)} .top .sc b.r{color:var(--bad)}
.bar{height:6px;background:#2a170d;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .25s}
.chtag{display:inline-block;font-size:.78rem;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);
  color:var(--text);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-family:inherit;font-size:1.02rem;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#2a170d;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem}
.opt:not(.locked):hover{border-color:var(--fire)}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .l{background:var(--ok);color:#001a0a}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#2a0000}
.fb{border:1px solid var(--line);border-left:4px solid var(--gold);background:#1a0f0a;border-radius:12px;padding:12px 14px;margin-top:6px}
.fb .v{font-weight:700;margin-bottom:6px}
.fb .v.ok{color:var(--ok)} .fb .v.no{color:var(--bad)}
.fb .trap{display:inline-block;background:var(--fire);color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.fb .ex{margin:0 0 8px}
.fb .hk{color:var(--gold);font-weight:600}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:12px;padding:13px 8px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.nav button.primary{background:linear-gradient(135deg,var(--fire),var(--fire2));border:0;color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

/* map */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.ov h3{font-family:'Orbitron',sans-serif;color:var(--gold);margin:0 0 10px;font-size:1.05rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:38px;border-radius:8px;border:1px solid var(--line);background:#150c08;color:var(--mute);font-family:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
.map button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.map button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--gold)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:10px 0}

/* result */
.big{font-family:'Orbitron',sans-serif;font-size:3rem;color:var(--gold);text-align:center;margin:6px 0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;color:var(--mute)}
.stats b{color:var(--text)}
.msg{text-align:center;color:var(--text);margin:8px 0 6px}
.rv{border:1px solid var(--line);background:#150c08;border-radius:14px;padding:12px 14px;margin-top:12px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .you{color:var(--bad)} .rv .cor{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a170d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}
@media (max-width:420px){.q{font-size:1.08rem}h1.brand{font-size:1.8rem}}
</style>
</head>

<script>
const DATA = [{"t":"Introduction to Organic Chemistry","s":["Definition and uses","Catenation of carbon","Open chain compounds","Closed chain: alicyclic compounds","Aromatic compounds: benzenoids","Non-benzenoid compounds"],"q":[["Organic chemistry is the study of which compounds?",["Carbon-containing compounds","Hydrocarbons only","Compounds found in living things only","Compounds of metals and salts"],0,"The book defines it as the branch of chemistry that deals with carbon-containing compounds and their properties, mainly their reactions.","Look for the word carbon in the option.",0,0],["Cotton for the textile industry is obtained from",["Starch","Sporopollenin","Rubber","Cellulose"],3,"The book lists cotton from cellulose under textile and dye industries.","Textile goes with cellulose.",0,0],["Carboxymethyl cellulose is used in which industry?",["Plastics industry","Petroleum industry","Paint industry","Security industry"],2,"The book gives paint industries as the use of carboxymethyl cellulose made from cellulose.","Carboxymethyl cellulose, paint.",0,0],["Tyres in the automobile industry are made from",["Natural dyes","Cellulose","Fossils","Rubbers"],3,"The book states automobile industries: tyre from rubbers.","Automobile means rubber.",0,0],["Which organic material is used to detect fingerprints in the security industry?",["Sporopollenin exine capsule","Nylon fibre","Xanthophyll","Carboxymethyl cellulose"],0,"Security and intelligence industries use organic material such as the sporopollenin exine capsule to detect fingerprints.","Fingerprint means sporopollenin.",0,0],["Aspirin and paracetamol are examples of organic compounds used in the",["Petroleum and geological industry","Medical and pharmaceutical industry","Textile and dye industry","Food and beverage industry"],1,"The book says drugs such as aspirin and paracetamol are organic compounds used in medicine.","Drug names point to the medical industry.",0,0],["Plastics and nylon industries use",["Metal alloys made from ores","Dyes made from carbonates","Fuels made from crude oil only","Polymeric materials from simple organic molecules"],3,"The book describes plastics and nylon as polymeric materials made from simple organic molecules.","Plastics, polymers.",0,0],["Crude oil and fossils are linked in the book to which industry?",["Paint industry","Security and intelligence industry","Petroleum and geological industry","Food industry"],2,"The book lists petroleum and geological industries with crude oil and fossils as examples.","Crude oil, petroleum.",0,0],["Catenation is the",["Overlap of orbitals of different energies","Bonding of carbon atoms to other elements","Linkage of atoms of the same element into longer chains","Breaking of long chains into small rings"],2,"Catenation means atoms of the same element linking to form longer chains.","Same element, same element.",0,1],["Which property lets carbon form a seemingly unlimited number of compounds?",["Polarity","Allotropy","Ionisation","Catenation"],3,"The book says carbon forms a seemingly unlimited number of compounds due to its catenation nature.","Unlimited compounds, catenation.",0,1],["Apart from carbon, which elements are named as showing catenation?",["Li, Be and B","Si, P and S","Na, K and Ca","He, Ne and Ar"],1,"The book notes that other elements such as Si, P and S also show catenation.","Remember Si, P, S.",0,1],["Carbon has high catenation because of its",["Metallic nature and d-orbitals","Small size, tetravalent nature and p-orbitals","Small size, divalent nature and d-orbitals","Large size, divalent nature and f-orbitals"],1,"Small size, tetravalency and the presence of p-orbitals give carbon its high catenation property.","Small, tetra, p.",0,1],["Compared with d- and f-orbitals, p-orbitals are",["Much less diffused","Fully filled","Equally diffused","Much more diffused"],0,"The book says p-orbitals are much less diffused than d- or f-orbitals, which favours good overlap.","p is compact.",0,1],["The p–p bonding that favours C–C bond formation is a",["Hydrogen bond","Ionic bond","Pi bond","Sigma bond"],3,"The book calls p–p bonding a sigma bonding with high bond energy.","C–C head-on, sigma.",0,1],["Which bonds are stronger than the C–C bond according to the book?",["Si–Si, P–P and S–S","C–H, C–F and C–O","H–H only","C–Si, C–P and C–S"],1,"The book says C–H, C–F and C–O bonds are stronger than C–C.","C–C is not the strongest, H, F and O beat it.",0,1],["Which of these is NOT an organic compound?",["Cellulose used for cotton","Calcium carbonate","Paracetamol used as a drug","Aspirin used as a drug"],1,"The book notes that carbonates such as CaCO3 contain carbon but are not organic compounds.","Carbonates are inorganic.",1,1],["NaCN is classified as",["A cyanide, not an organic compound","An organic nitrile of carbon","A carbonate salt of carbon","An allotrope of carbon element"],0,"The book gives sodium cyanide as an example of a carbon-containing compound that is not organic.","Cyanides, not organic.",1,1],["Diamond and graphite are described in the book as",["Organic isomers of carbon atoms","Inorganic carbon forms allotropic to organic carbon","Carbonates of carbon and metals","Organic polymers of carbon chains"],1,"Diamond and graphite contain carbon but are inorganic and allotropic to organic carbon.","Diamond and graphite, not organic.",1,1],["Organic compounds are divided into which two major groups?",["Open chain and closed chain","Homocyclic and heterocyclic","Saturated and unsaturated","Aliphatic and aromatic"],0,"The two major groups are open chain (acyclic) and closed chain compounds.","Major split: open and closed.",1,2],["Open chain organic compounds are also called",["Alicyclic compounds","Acyclic compounds","Carbocyclic compounds","Heterocyclic compounds"],1,"Open chain compounds are straight or branched chain hydrocarbons that are acyclic.","Open chain, acyclic.",0,2],["Saturated open chain compounds contain",["Both double and triple bonds","Only triple bonds","At least one double bond","Only single bonds"],3,"Saturated compounds have only single bonds, for example alkanes.","Saturated means singles only.",0,2],["Which open chain family is the example of saturated compounds?",["Alkanes","Alkenes","Cycloalkenes","Alkynes"],0,"The book gives alkanes as the example of saturated hydrocarbons.","Alkane, single bonds.",0,2],["Unsaturated open chain compounds contain",["Double or triple bonds or both","Oxygen atom within the chain","A benzene ring in the skeleton","Single bonds between all carbons"],0,"Unsaturated hydrocarbons have double or triple bonds, or both, in the carbon skeleton.","Any double or triple bond, unsaturated.",0,2],["CH3–CH=CH–CH2–C≡C–CH3 is an example of",["An aromatic compound","An unsaturated open chain compound","A saturated open chain compound","An alicyclic compound"],1,"It carries a double and a triple bond in an open chain, so it is unsaturated acyclic.","Spot = or ≡, unsaturated.",0,2],["Closed chain compounds have at least",["One ring (cyclic) system","One hetero atom in the chain","One double bond in the chain","One benzene ring in the chain"],0,"Closed chain compounds are in ring or cyclic form with at least one ring.","Closed means ring.",0,3],["Closed chain compounds are divided into homocyclic and heterocyclic based on",["The size of the ring","The number of rings","The presence of double bonds","The type of atoms in the ring"],3,"The split depends on whether the ring atoms are all carbon or include other atoms.","Hetero or homo is about ring atoms.",1,3],["Homocyclic compounds are also known as",["Heterocyclic compounds","Aliphatic compounds","Carbocyclic compounds","Acyclic compounds"],2,"The book says homocyclic compounds are also called carbocyclic because the ring is made of carbon only.","Homo, carbo.",0,3],["The ring of a homocyclic compound is made of",["Hydrogen atoms only","Carbon and oxygen atoms","Carbon atoms only","Carbon and one hetero atom"],2,"Homocyclic rings contain carbon atoms only.","Homo means same atoms.",0,3],["Homocyclic compounds are further divided into",["Saturated and unsaturated compounds","Alicyclic and aromatic compounds","Monocyclic and polycyclic compounds","Benzenoid and non-benzenoid compounds"],1,"The two groups of homocyclic compounds are alicyclic and aromatic.","Homocyclic gives alicyclic and aromatic.",0,3],["Alicyclic compounds have properties similar to",["Benzenoids","Heterocyclic compounds","Aromatic compounds","Aliphatic hydrocarbons"],3,"Alicyclic compounds behave like aliphatic hydrocarbons, and are named as cyclo-hydrocarbons.","Alicyclic acts aliphatic.",0,3],["Each corner of a drawn cycloalkane ring represents",["A –C group","A –CH group","A –CH2– group","A –CH3 group"],2,"The book says each corner is a –CH2– group in the saturated ring.","Cycloalkane corner, CH2.",0,3],["In a cycloalkene, each carbon of the double bond carries",["Two hydrogen atoms","No hydrogen atom","One hydrogen atom","Three hydrogen atoms"],2,"Each double-bond carbon is –CH, while the other ring carbons are –CH2–.","Double bond carbon, one H.",0,3],["In a cycloalkyne, each carbon of the triple bond carries",["One hydrogen atom","Two hydrogen atoms","Three hydrogen atoms","No hydrogen atom"],3,"There is no hydrogen on the triple-bond carbon, and the other ring carbons are –CH2–.","Triple bond carbon, no H.",0,3],["Which is the largest saturated ring shown in the book's list?",["Cyclooctane","Cyclodecane","Cycloheptane","Cyclononane"],0,"The saturated series runs from cyclopropane up to cyclooctane.","List ends at octane.",0,3],["Aromatic compounds are so called because of their",["Special properties and characteristic smell or aroma","Their saturated carbon chains only","Their ring made of five carbons","Their oxygen atom within the ring"],0,"The book says they have special properties and characteristic aroma, hence the name.","Aromatic, aroma.",0,4],["Aromatic compounds are compounds with a",["Isolated double bond","Single bonds only","Saturated ring","Conjugated pi-system"],3,"The book describes aromatic compounds as having a conjugated pi-system.","Aromatic, conjugated pi.",0,4],["Aromatic compounds are divided into",["Monocyclic and open chain","Homocyclic and acyclic","Alicyclic and aliphatic","Benzenoids and non-benzenoids"],3,"The two classes are benzenoid and non-benzenoid compounds.","Aromatic, two classes: benzenoid and non.",0,4],["The ring of a benzenoid compound is made of",["Carbon and sulphur","Carbon atoms only","Carbon and nitrogen","Carbon and oxygen"],1,"Benzenoid rings are formed of carbon only, though derivatives may carry other elements as substituents.","Benzenoid ring, carbon only.",0,4],["Benzenoids are divided into",["Open and closed rings","Azulenes and tropones","Monocyclic and polycyclic rings","Saturated and unsaturated rings"],2,"Benzenoids are monocyclic or polycyclic aromatic rings and derivatives.","Mono or poly.",0,4],["In monocyclic aromatic compounds the benzene rings are",["Fused together","Joined by triple bonds","Saturated","Not fused together"],3,"Monocyclic compounds have one or more benzene rings that are not fused.","Monocyclic, not fused.",0,4],["Which is a monocyclic aromatic compound?",["Toluene","Naphthalene","Anthracene","Phenanthrene"],0,"Toluene has one benzene ring with a methyl group. The other three have fused rings.","One ring only, toluene.",0,4],["Aniline is benzene bearing",["A –CH3 group","An –NH2 group","A –CHO group","An –OH group"],1,"The book draws aniline as benzene with NH2, phenol with OH and toluene with CH3.","Aniline, N.",0,4],["Polycyclic aromatic compounds contain",["Five-membered rings only","Rings joined by single bonds without fusion","Two or more benzene rings fused together","One benzene ring only"],2,"Polycyclic compounds have two or more benzene rings fused together.","Poly, fused.",0,4],["Naphthalene is classified as",["Bicyclic","Tricyclic","Monocyclic","Tetracyclic"],0,"Naphthalene has two fused benzene rings.","Naph, two rings.",0,4],["Anthracene and phenanthrene are",["Monocyclic compounds","Bicyclic compounds","Tricyclic compounds","Tetracyclic compounds"],2,"Each has three fused benzene rings.","Anthra and phenanthrene, three.",0,4],["Which of these is a tetracyclic compound listed in the book?",["Phenanthrene","Chrysene","Naphthalene","Xylene"],1,"The tetracyclic examples in the book are tetracene, tetraphene, chrysene and one other fused system.","Chrysene is on the four-ring list.",0,4],["The rings of non-benzenoid compounds are usually",["Six-membered rings only","Saturated rings with no pi bonds","Rings other than six-membered","Three-membered rings only"],2,"They are made of carbon rings other than six-membered, though they may sometimes include a benzene ring.","Non-benzenoid, not six.",0,5],["Azulenes have rings of",["Two six-membered rings","Seven and five members","Six and three members","Two five-membered rings"],1,"Azulenes have unsaturated seven-membered and five-membered ring structures.","Azulene, 7 and 5.",0,5],["Azulenes are usually structural isomers of",["Anthracene","Toluene","Naphthalene","Benzene"],2,"The book says azulenes are usually structural isomers of naphthalene.","Azulene, naphthalene.",0,5],["Oxaazulanones are azulene rings that contain",["Oxygen atoms","Halogen atoms","Sulphur atoms","Nitrogen atoms"],0,"Oxaazulanones are azulene rings with oxygen atoms.","Oxa means oxygen.",0,5],["Tropone is named",["2,4,6-cyclooctatrien-1-one","2,4,6-cycloheptatrien-1-one","1,3,5-cycloheptatriene","2,4-cyclohexadien-1-one"],1,"Tropone is a non-benzenoid ring of seven carbons with a ketone group.","Tropone, hepta, one.",0,5],["Tropolone differs from tropone by having",["A 2-hydroxy group","A 2-amino group","An extra ring","A methyl group"],0,"Tropolone is 2-hydroxy-2,4,6-cycloheptatrien-1-one.","Tropolone, OH.",0,5],["The molecular formula of the tropylium ion is",["C5H5+","C6H6","C7H8","C7H7+"],3,"The tropylium ion is an aromatic ion with formula C7H7+.","Tropylium, seven C and H.",0,5],["Salts of tropylium ions are stable because of",["Saturation of the ring","Presence of oxygen","Aromaticity","Their large size"],2,"The book says salts of tropylium ions are stable due to aromaticity.","Stable, aromatic.",0,5]]},{"t":"Hybridization","s":["Hybridization and carbon's electrons","Shape of orbitals and overlap","sp3 hybridization","sp2 hybridization","sp hybridization","Comparing sp3, sp2 and sp"],"q":[["Hybridization is the",["Loss of electrons by the carbon atom","Mixing of atomic orbitals to form new hybrid orbitals","Overlap of two hybrid orbitals fully","Promotion of an electron to a higher shell"],1,"The book defines it as a process that leads to the formation of new hybrid orbitals.","Hybridization makes new orbitals.",0,0],["Hybridization mixes two different atomic orbitals of",["Different atoms","The same shell","The nucleus","Different shells"],1,"Orbitals of the same shell are mixed to give hybrid orbitals of equal energies.","Same shell mixing.",0,0],["The new hybrid orbitals formed have",["Different energies","Equal energies","No energy","Higher energy than the d-orbital"],1,"The mixing gives new hybrid orbitals of equal energies.","Hybrids are equal.",0,0],["The electronic configuration of carbon is",["1s2 2s2 2p2","1s2 2s2 2p4","1s2 2s1 2p3","1s2 2s2 2p6"],0,"Carbon has 6 electrons: 1s2 2s2 2p2.","Six electrons, 2+2+2.",0,0],["In the ground state, how many unpaired electrons does carbon have in its outermost shell?",["One","Two","Zero","Four"],1,"Ground state carbon is 2s2 2px1 2py1 2pz0, so two electrons are unpaired.","Ground state, two unpaired.",0,0],["Hund's rule says electrons",["Fill an orbital singly before pairing up","Fill only the s-orbitals first of all","Fill the highest orbital first of all","Pair up before filling singly"],0,"The book uses Hund's rule to show 2px and 2py each take one electron.","Hund, singly first.",0,0],["At the excited state, which electron is promoted?",[  is used to form",["A hydrogen bond","A sigma bond","A pi bond","An ionic bond"],2,"The unchanged p-orbital forms the pi bond.","Leftover p, pi.",0,3],["The shape of an sp2 carbon is",["Octahedral with six bonds","Tetrahedral with four bonds","Linear with two bonds only","Trigonal planar"],3,"The sp2 carbon has trigonal planar geometry.","sp2, trigonal.",0,3],["The bond angle at an sp2 carbon is",["180°","109.5°","90°","120°"],3,"The hydrogen–carbon bonds in ethene are at 120°.","sp2, 120.",0,3],["In ethene, the C–C sigma bond forms by overlap of",["Two sp3 orbitals","Two sp2 orbitals","Two s-orbitals","Two p-orbitals"],1,"The two carbons form a sigma bond by overlapping two sp2 orbitals.","Ethene sigma, sp2 + sp2.",0,3],["The C–H bonds in ethene form by",["s–sp2 overlap","p–p overlap","sp–sp overlap","s–sp3 overlap"],0,"Each carbon forms two C–H bonds by s–sp2 overlap.","H uses s.",0,3],["The pi bond in ethene is formed by",["s–p overlap","2p–2p overlap","sp3–sp3 overlap","sp2–sp2 overlap"],1,"The pi bond lies perpendicular to the molecular plane and is formed by 2p–2p overlap.","pi is p with p.",0,3],["The s-character in an sp2 orbital is",["67%","50%","33.3%","25%"],2,"One s in three orbitals gives about 33.3% s-character.","One in three.",0,3],["In sp hybridization the 2s orbital mixes with",["All three of the 2p orbitals","No p-orbital of any kind","One of the three 2p orbitals","Two of the three 2p orbitals"],2,"Only one 2p is mixed, forming two sp orbitals.","sp, one p.",0,4],["How many sp orbitals are formed in sp hybridization?",["Four","Two","One","Three"],1,"One s plus one p gives two sp orbitals.","Mixed 1 + 1 = 2.",0,4],["In sp hybridization, how many p-orbitals remain unchanged?",["None","Two","Three","One"],1,"Two 2p orbitals stay unchanged and form the pi bonds.","sp has two p's left.",0,4],["A carbon–carbon triple bond has",["One sigma bond and two pi bonds","Three sigma bonds","Two sigma bonds and one pi bond","Three pi bonds"],0,"The sp carbons form one sigma bond and two pi bonds.","Triple, 1 sigma + 2 pi.",0,4],["The shape around an sp carbon is",["Tetrahedral","Bent","Linear","Trigonal planar"],2,"The shape of each sp carbon is linear.","sp, linear.",0,4],["The bond angle at an sp carbon is",["120°","180°","109.5°","90°"],1,"sp carbon has a bond angle of 180°.","sp, straight line.",0,4],["The linear shape of sp carbon helps to",["Increase electron–electron repulsion","Reduce the length of the bond","Break the pi bonds of the carbon","Minimise electron–electron repulsion"],3,"The atoms and bonding electrons are as far apart as possible, minimising repulsion.","Far apart, less repulsion.",0,4],["Which carbon has the longest bond length?",["sp3","sp","All are equal","sp2"],0,"The bond length is longest in sp3, shorter in sp2 and shortest in sp.","Single bond, longest.",0,5],["Which carbon has the shortest bond length?",["sp","All are equal","sp2","sp3"],0,"sp has the shortest bond length.","Triple, shortest.",0,5],["Which carbon has the strongest bond strength?",["sp3","All are equal","sp","sp2"],2,"sp is strongest because of its two pi bonds (4 pi electrons).","Triple, strongest.",0,5],["Which carbon has the weakest bond strength?",["None, all are equal","sp2","sp","sp3"],3,"sp3 has the weakest bond strength.","Single, weakest.",0,5],["The p-character in an sp orbital is",["50%","25%","75%","33.3%"],0,"sp has 50% s-character and 50% p-character.","sp, half and half.",0,5],["Which sequence gives the correct % s-character?",["sp3 25, sp2 50, sp 33.3","sp3 50, sp2 33.3, sp 25","sp3 25, sp2 33.3, sp 50","sp3 33.3, sp2 25, sp 50"],2,"The % s-character rises from 25 (sp3) to 33.3 (sp2) to 50 (sp).","s grows as pi bonds grow.",0,5],["The degree of saturation between two carbons increases with",["Increase in the number of pi electrons","Increase in % s-character","Increase in % p-character","Increase in bond energy"],2,"The book lists increase in % p-character, bond length and decrease in s-character, bond energy, ined"],1,"Only part of the name (-ane, -ene, -ol) is used in a systematic way.","Part rule, part not.",0,0],["1-Methylnaphthalene and 1-pentanol are examples of",["Substitutive names","Conjunctive names","Replacement names","Subtractive names"],0,"A substitutive name involves replacement of hydrogen by a group or another element.","Hydrogen swapped, substitutive.",0,0],["A replacement name is one in which",["Specified atoms are removed from the molecule","Two molecules are added together as one","Hydrogen is replaced by a group or element","C, CH or CH2 is replaced by a hetero atom"],3,"The book gives 2,7,9-triazaphenanthrene as an example.","Replace a carbon with a hetero atom.",0,0],["Names ending in -ene or -yne, and names with dehydro- or deoxy-, are",["Additive names","Radicofunctional names","Subtractive names","Fusion names"],2,"A subtractive name involves removal of specified atoms.","Removal, subtractive.",0,0],["Acetyl chloride and ethyl alcohol are",["Conjunctive names, by joining two names","Systematic names, by coined syllables","Radicofunctional names","Subtractive names, by removal of atoms"],2,"A radicofunctional name is formed from the name of a radical and the name of a functional class.","Radical plus class.",0,0],["Styrene oxide is an example of an",["Replacement name","Fusion name","Subtractive name","Additive name"],3,"An additive name signifies addition between molecules and/or atoms.","Styrene oxide, additive.",0,0],["Naphthaleneacetic acid is an example of a",["Conjunctive name","Additive name","Subtractive name","Fusion name"],0,"A conjunctive name is formed by placing together the names of two molecules linked by loss of one hydrogen atom from each.","Two names joined, conjunctive.",0,0],["Benzofuran is an example of a",["Replacement name","Conjunctive name","Fusion name","Hantzsch–Widman name"],2,"A fusion name is for a cyclic system formed using a linking 'o' between the names of two ring systems.","Linking o, fusion.",0,0],["A Hantzsch–Widman name uses the suffix -ole for a",["Three-membered ring","Six-membered ring","Five-membered ring","Seven-membered ring"],2,"-ole is for a five-membered ring and -ine for a six-membered ring. Triazole and thiazole are examples.","-ole five, -ine six.",0,0],["The three ways an organic compound can be named are",["Trivial, systematic and common","Trivial, derived and IUPAC","Common, additive and IUPAC","Derived, fusion and IUPAC"],1,"The book lists the trivial or common name system, the derived name system and the IUPAC system.","Trivial, derived, IUPAC.",0,1],["Trivial names are mostly obtained from",["Latin words","Arabic words","German words","Greek words only"],0,"The trivial nomenclature is not systematic and the names are mostly obtained from Latin words.","Trivial from Latin.",0,1],["Wood spirit (methyl spirit) was named from",["Destructive distillation of wood","Fermentation of grain with yeast","Oxidation of vinegar with air","Distillation of urine at high heat"],0,"CH3OH was obtained by destructive distillation of wood.","Wood spirit, wood.",0,1],["Urea got its trivial name from",["Ureter tissue","Urine","Uranium salts","Ureka plant"],1,"Urea (NH2CONH2) was obtained from urine.","Urea, urine.",0,1],["Marsh gas (fire damp) is",["Methane","Propane","Ethene","Ethane"],0,"CH4 was called marsh gas because it was produced in marsh places.","Marsh, methane.",0,1],["Vinegar got its name from the Latin word",["Acetum","Formicus","Lactous","Oxalis"],0,"CH3COOH was obtained from Acetum, that is vinegar.","Acetum, acetic.",0,1],["Formic acid was first obtained from",["Red ants","Milk","Apples","Butter"],0,"The book says it was obtained from formicus, the red ant.","Formic, formicus, ants.",0,1],["Lactic acid was first obtained from",["Apple","Goat fat","Lemon","Milk"],3,"Lactic acid comes from lactous, which means milk.","Lactic, lactous, milk.",0,1],["Malic acid was first obtained from",["Butter","Apple","Milk","Lemon"],1,"The book gives malic acid as obtained from apple.","Malic, malus, apple.",0,1],["Butyric acid was named because it was obtained from",["Goats","Barley","Milk","Butter"],3,"Butyric acid is obtained from butter.","Butyr, butter.",0,1],["Caproic acid was first obtained from",["Barley","Lemon","Goats","Butter"],2,"The book lists caproic acid as obtained from goats.","Capro, goat.",0,1],["Oxalic acid was first obtained from the",["Apples of the Malus tree","Oxalis plant","Lemon fruit of the citrus tree","Barley grain of the field"],1,"Oxalic acid is obtained from the oxalis plant.","Oxalic, oxalis.",0,1],["Grain alcohol, C2H5OH, is obtained from",["Butter","Urine","Wood","Barley"],3,"The book gives grain alcohol as obtained from barley.","Grain alcohol, grain.",0,1],["Citric acid was first obtained from",["Tamarind pods of the tree","Citron (lemon)","Apple fruit of the orchard","Milk of the cow or goat"],1,"The book lists citric acid as obtained from citron (lemon).","Citric, citrus.",0,1],["Glycol and glycerol take their names from the Greek word meaning",["Salty","Sweet","Bitter","Sour"],1,"Glycerol is named from Glycus, which means sweet. Glycol is described as sweet and poisonous.","Gly, sweet.",0,1],["Which reagent is named after the person who discovered it?",["ROH, the alcohol family","RX, the alkyl halide family","RNH2, the amine family","RMgX (Grignard reagent)"],3,"Grignard reagent is RMgX, and Frankland reagent is R2Zn.","Names with people are reagents.",0,1],["Frankland reagent has the formula",["RMgX","RLi","R2Zn","R2Cd"],2,"The book gives R2Zn as Frankland reagent.","Frankland, zinc.",0,1],["Groups are",["Atoms or groups of atoms that have a free valency","Molecules with no free valency at all","Rings of carbon with no free valency","Compounds that carry a double bond"],0,"A group is an atom or group of atoms with a free valency.","Group means free valency.",0,2],["The prefixes n-, iso- and neo- are used to",["Show the number of carbon atoms","Separate two structures of the same molecular formula","Name the functional groups present","Show the position of a double bond"],1,"The book says they differentiate compounds that share a molecular formula.","n, iso, neo split isomers.",0,2],["In a normal (n) group, the free bond is on",["The middle carbon of the chain","The second carbon of the chain","A branched carbon of the chain","The first or last carbon of a straight chain"],3,"Normal groups have no branch chain and the free bond comes on the terminal carbon.","n, terminal.",0,2],["An iso group has",["A quaternary carbon in the chain","No methyl group on the chain at all","One methyl group on the second carbon of a straight chain","Two methyl groups on the first carbon"],2,"The book says iso groups have one methyl group attached on the second carbon atom.","Iso, 2nd carbon methyl.",0,2],["Which group has one quaternary carbon surrounded by methyl groups?",["Neo group","Normal group","Secondary group","Iso group"],0,"The neo group has a quaternary carbon (4°) surrounded by at least three methyl groups, like neopentane.","Neo, quaternary.",0,2],["Amyl groups are isomeric groups with the formula",["C4H9","C6H13","C5H11","C5H12"],2,"The book gives amyl as the isomeric groups with formula C5H11, also called pentyl.","Amyl, five carbons.",0,2],["Another name for amyl is",["Hexyl","Pentyl","Propyl","Butyl"],1,"The amyl group is also called pentyl.","Amyl, pent.",0,2],["In a secondary group the carbon carrying the free valency is attached to",["No alkyl group","One alkyl group","Three alkyl groups","Two alkyl groups"],3,"A secondary carbon is attached to two alkyl groups and at least one hydrogen.","Secondary, two alkyls.",0,2],["In a tertiary group the carbon carrying the free valency has",["One alkyl group","Three alkyl groups","Four hydrogens","Two alkyl groups"],1,"A tertiary carbon has three alkyl group substituents.","Tertiary, three alkyls.",0,2],["The general formula of an alkyl group is",["CnH2n+1","CnH2n-1","CnH2n-3","CnH2n"],0,"An alkyl group is an alkane minus one hydrogen atom.","Alkane minus H, CnH2n+1.",0,3],["The general formula of an alkenyl group is",["CnH2n+1","CnH2n-3","CnH2n-1","CnH2n"],2,"An alkenyl group is an alkene minus one hydrogen atom.","Alkene CnH2n, remove one H.",0,3],["The general formula of an alkynyl group is",["CnH2n+1","CnH2n-2","CnH2n-3","CnH2n-1"],2,"An alkynyl group is an alkyne minus one hydrogen atom.","Alkyne CnH2n-2, remove one H.",0,3],["Alkylidene groups are alkanes short of two hydrogens",["From different carbon atoms","From the terminal carbons only","From the same carbon atom","From the benzene ring"],2,"Alkylidene has the same general formula as alkene but no double bond.","Ylidene, same carbon.",0,3],["Alkylene groups are alkanes short of two hydrogens",["From one terminal carbon only","From the ring","From different carbon atoms","From the same carbon atom"],2,"Alkylene groups lose hydrogens from different carbons.","Ylene, different carbons.",0,3],["A phenyl group forms when benzene loses",["A methyl group","Two hydrogen atoms","A carbon atom","One hydrogen atom"],3,"The phenyl group is C6H5–.","Phenyl, C6H5.",0,3],["A benzyl group forms when toluene loses a hydrogen from",["Two carbons","The methyl group","The benzene ring","The ring and the methyl"],1,"Benzyl is C6H5CH2–, for example benzyl bromide.","Benzyl, CH2 side.",0,3],["Tolyl groups form when toluene loses a hydrogen from",["Both methyl and ring","The carbon of methyl","The benzene ring","The methyl group"],2,"Tolyl groups are o-, m- and p-tolyl, such as o-tolyl isocyanate.","Tolyl, ring.",0,3],["A benzal group forms when two hydrogens are lost from",["The alkyl group substituent","Two ring carbons","The ring and the methyl","The benzene ring"],0,"Benzal is the group formed when toluene loses two hydrogens from the alkyl substituent, for example benzal cyanide.","Benzal, two H from side chain.",0,3],["The groups described in this section are mainly used as",["Functional groups","Parent names","Suffixes in naming","Prefixes in naming"],3,"The book notes that these groups are majorly used as prefix in nomenclature.","Groups go first, prefix.",0,3],["In common naming, a multiple bond on carbon 1 is shown with",["α (alpha)","β (beta)","γ (gamma)","δ (delta)"],0,"Alpha is used for carbon 1, beta for carbon 2, then gamma and delta.","Alpha is first.",0,4],["In common naming, a multiple bond on carbon 2 is shown with",["β (beta)","γ (gamma)","α (alpha)","δ (delta)"],0,"Beta is for carbon number 2.","Beta is second.",0,4],["CH3–CH=CH–CH3 is commonly named",["α-Butylene","γ-Butylene","β-Butylene","Isobutylene"],2,"The double bond is on carbon 2, so β-butylene.","Middle double bond, beta.",0,4],["CH3–CH2–CH=CH–CH2–CH3 is commonly named",["α-Hexylene","β-Hexylene","δ-Hexylene","γ-Hexylene"],3,"The double bond is on carbon 3, so gamma.","Third carbon, gamma.",0,4],["A gem-dihalide has two halogen atoms on",["The two terminal carbons","The same carbon atom","Adjacent carbon atoms","Different rings"],1,"Gem-dihalides are commonly named as alkylidene halides.","Gem, same carbon.",0,4],["Ethylidene bromide is an example of a",["Gem-dihalide","Polymethylene halide","Vicinal dihalide","Alkyl halide"],0,"Both bromine atoms are on the same carbon.","Ylidene halide, gem.",0,4],["A gem-dihalide with only one carbon is named",["Methylidene halide","Dimethylene halide","Methyl halide","Methylene halide"],3,"The book says it is wrong to say methylidene halide because the carbon carries two hydrogens, so it is methylene halide.","One carbon, methylene.",1,4],["A vicinal dihalide has halogens on",["The benzene ring","The same carbon","The two terminal carbons","Adjacent carbon atoms"],3,"Vicinal dihalides are commonly named alkylene halides, such as propylene iodide.","Vicinal, neighbours.",0,4],["Two halogens on the two terminal carbons of a chain of more than two carbons give a",["Alkylene halide","Alkyl halide","Polymethylene halide","Alkylidene halide"],2,"Trimethylene chloride and hexamethylene bromide are examples.","Ends, polymethylene.",0,4],["Two –OH groups on adjacent carbons give an",["Alkylene glycol","Polymethylene glycol","Alkylidene glycol","Alkyl alcohol"],0,"Butylene glycol is an example.","Adjacent OH, alkylene glycol.",0,4],["Two –OH groups on the terminal carbons of a long chain give a",["Polymethylene glycol","Alkylene glycol","Alkylidene glycol","Alkyl alcohol"],0,"Tetramethylene glycol and heptamethylene glycol are examples.","Ends, polymethylene.",0,4],["A two-carbon compound with –OH on both carbons is named",["Dimethylene glycol","Methylene glycol","Ethylidene glycol","Ethylene glycol"],3,"The book says it is wrong to call it dimethylene glycol.","Two carbons, ethylene.",1,4],["The common name prefix for a one-carbon acid derivative is",["Acet-","Propion-","Form-","Butyr-"],2,"The carbon prefixes begin with form- for one carbon, acet- for two carbons and propion- for three.","1C form, 2C acet.",0,5],["The common prefix for a three-carbon chain with single bonds is",["Propion-","Acryl-","Butyr-","Croton-"],0,"Propion- is for three carbons with single bonds.","3C single, propion.",0,5],["The prefix acryl- is used for a compound with",["Four carbons and a double bond","Three carbons and a double bond on carbon 2","Three carbons and no double bond","Four carbons and a triple bond"],1,"CH2=CH–COOH is acrylic acid.","Acryl is 3C with double.",0,5],["The prefix croton- is used for a compound with",["Five carbons and a double bond","Four carbons and no double bond","Four carbons and a double bond on carbon 2","Three carbons and a double bond"],2,"The book gives methyl crotonate as an example.","Croton is 4C with double.",0,5],["The prefix pyruv- is used when",["The chain has exactly four carbons","The chain is branched at carbon 2","A double bond is on carbon number 2","A C=O group is directly attached to the functional group"],3,"Pyruvic acid is CH3–CO–COOH.","Pyruv, keto beside functional group.",0,5],["–CN is named a",["Amide or acid amide","Isonitrile or isocyanide","Nitrile or cyanide","Amine or alkyl amine"],2,"The book gives –CN as nitrile or cyanide and –NC as isonitrile or isocyanide.","CN nitrile, NC isonitrile.",0,5],["CH2=CH–CN is named",["Acrylonitrile","Acrylamide","Acryloisonitrile","Acrylic acid"],0,"It is also called vinyl cyanide.","CN end, nitrile.",0,5],["CH2=CH–CONH2 is named",["Acrylic acid","Acrylamide","Acrylonitrile","Acrylaldehyde"],1,"CONH2 is the amide group.","CONH2, amide.",0,5],["Which common name suffix is used for the R–SH group?",["Thioether","Thioalcohol","Alcohol","Amine"],1,"The suffix for R–SH is thioalcohol.","SH, thioalcohol.",0,5],["In the derived naming system, the representative compound of alkenes is",["Acetylene","Ethane","Methane","Ethylene"],3,"The book lists methane for alkanes, ethylene for alkenes and acetylene for alkynes.","Alkene, ethylene.",0,5],["In the derived system, the representative compound of alkynes is",["Methane","Acetylene","Carbinol","Ethylene"],1,"Alkynes are named as derivatives of acetylene.","Alkyne, acetylene.",0,5],["In the derived system, alcohols are named as derivatives of",["Methane","Acetic acid","Carbinol","Acetone"],2,"Alkanols are named as carbinol derivatives.","Alcohol, carbinol.",0,5],["In the derived system, ketones are named as derivatives of",["Acetaldehyde","Acetone","Acetic acid","Acetamide"],1,"Alkanones are named as derivatives of acetone.","Ketone, acetone.",0,5],["In the derived system, carboxylic acids are named as derivatives of",["Acetone","Formic acid","Acetic acid","Carbinol"],2,"Alkanoic acids are derivatives of acetic acid.","Acid, acetic.",0,5],["Tetramethylmethane is the derived name of",["Isopentane","Neopentane","n-Pentane","Isobutane"],1,"Four methyl groups on methane give tetramethylmethane.","Four methyls on a carbon, neo.",0,5],["CH3–C≡C–CH3 is named in the derived system as",["Dimethylethylene","Tetramethylethylene","Trimethylethylene","Dimethylacetylene"],3,"It is acetylene with two methyl groups.","Triple bond, acetylene.",0,5],["The IUPAC system was set up at the end of which century?",["19th century","18th century","20th century","17th century"],0,"The book says the IUPAC system of nomenclature was established at the end of the 19th century at a meeting of chemists in Geneva.","Geneva, 19th century.",0,6],["IUPAC stands for",["International Union of Practical and Applied Chemistry","International Union of Pure and Applied Chemistry","International Union of Pure and Analytical Chemistry","Institute of Pure and Applied Chemistry"],1,"IUPAC is the International Union of Pure and Applied Chemistry.","Pure and Applied.",0,6],["The primary prefix in IUPAC naming is mostly used in",["Ketones","Open chain alkanes","Alcohols","Cyclic compounds"],3,"The primary prefix is mostly used in cyclic compounds (cyclo), while the secondary prefix shows substituents.","Primary prefix, cyclo.",0,6],["The secondary prefix represents",["The main functional group","Saturation of the chain","Substituents or branches","The number of carbons"],2,"The secondary prefix shows substituents or branches in the compound.","Secondary prefix, branches.",0,6],["The primary suffix shows",["The branches attached to the chain","The main functional group of the compound","The ring type of the compound","Saturation or unsaturation of the chain"],3,"The primary suffix is -ane, -ene or -yne.","Primary suffix, ane/ene/yne.",0,6],["The secondary suffix shows",["The ring size of the cyclic part","Saturation or unsaturation of the chain","Branches attached to the main chain","The main functional group"],3,"The secondary suffix represents the main functional group.","Secondary suffix, function.",0,6],["The root name represents",["The multiple bonds in the main chain","The functional group on the main chain","The branches attached to the main chain","The number of carbon atoms in the main chain"],3,"The root or parent name gives the number of carbons in the selected main chain.","Root, carbon count.",0,6],["IUPAC rule 1 says the main chain should be the",["Longest continuous chain with the most substituents, multiple bonds and functional groups","Any chain that contains carbon atoms","Chain with the most hydrogen atoms","Shortest chain with the fewest substituents"],0,"The priority order is functional group, then multiple bond, then substituent.","Longest chain that catches the most.",0,6],["For numbering the chain, the functional group should get",["The same number as the substituent","The highest possible number","Number 1 always","The lowest possible number"],3,"The book says to number from the end nearer to the substituent, multiple bond or functional group, giving the functional group the lowest number.","Functional group, lowest.",0,6],["When the same alkyl group occurs more than once, its positions are",["Written alphabetically with no commas","Written once with no numerical prefix","Separated by hyphens with no prefix","Separated by commas with di, tri, tetra"],3,"The book says the positions are separated by commas and a numerical prefix di, tri or tetra is added.","Commas between numbers.",0,6],["Which numerical prefixes are NOT considered for alphabetical order?",["neo, tert","di, tri, tetra","iso, sec","ethyl, methyl"],1,"The numerical prefixes are ignored when arranging substituent names alphabetically.","Ignore di and tri.",0,6],["Different alkyl substituents are written in",["Order of size","Reverse alphabetical order","Order of position number","Alphabetical order"],3,"For example 3-ethyl-2-methylhexane.","Ethyl before methyl.",0,6],["3-Ethyl-4-methylhexane shows the rule that, at equivalent positions,",["The larger group gets the lower number","The group first in alphabet gets the lower number","The smaller group gets the lower number","The last in the alphabet gets the lower number"],1,"Ethyl comes before methyl, so it gets 3.","Alphabet decides ties.",0,6],["If two chains have the same length, the parent chain is the one that",["Captures all the substituents","Is drawn horizontally on the page","Has the fewest substituents attached","Has no branches on its length"],0,"The book's example is 3-ethyl-2-methylpentane.","Pick the chain that holds everything.",0,6],["The terminal 'e' of the primary suffix is removed when followed by a suffix beginning with",["b, c or d","a, i, o, u or y","Any vowel at all","Any consonant"],1,"The book lists a, i, o, u and y.","Drop e before vowels like a, i, o, u, y.",0,6],["CH2=CH–CH2–COOH is named",["But-3-enoic acid","But-3-enol","Butanoic acid","But-1-enoic acid"],0,"The acid gets carbon 1, so the double bond is at 3.","Acid takes number 1.",0,6],["In IUPAC naming, –OR (alkoxy) groups always act as",["Prefix","Parent name","Suffix","Primary suffix"],0,"The book gives 1-methoxypropane and 1,2-epoxybutane as examples of groups that always work as prefix.","Ether, always prefix.",0,6],["The compound CH3CH2CH2–O–CH3 is named",["Methoxybutane","2-Methoxypropane","1-Methoxypropane","1-Propoxymethane"],2,"Numbering starts from the end away from oxygen, so 1-methoxypropane.","Smaller chain becomes methoxy.",0,6],["When a –COOH is directly attached to a ring carbon, the compound is named with the suffix",["Carboxylic acid","carbonyl, as in a ketone","oic acid, as in a chain","acid only, with no other suffix"],0,"The book gives cyclopropane carboxylic acid and 2-hydroxybenzoic acid.","Ring plus COOH, carboxylic acid.",0,6],["A –CHO group attached to a ring carbon is named with the suffix",["Carbonyl","Al","Carbaldehyde","Carboxylic acid"],2,"The book names cyclohexane-1,2,4-tricarbaldehyde.","Ring plus CHO, carbaldehyde.",0,6],["Propane-1,2,3-tricarboxylic acid has three",["–CHO groups on the chain","–COOH groups on the chain","–OH groups on the chain","–CN groups on the chain"],1,"The suffix tricarboxylic acid is used for three –COOH groups.","Tri-carboxylic, three COOH.",0,6],["Butane-1,3,3-tricarbonitrile has three",["–CN groups","–CHO groups","–CONH2 groups","–COOH groups"],0,"The suffix carbonitrile shows –CN groups.","Carbonitrile, CN.",0,6],["3-Amino benzene carboxamide is also named",["3-Hydroxy benzamide","3-Amino benzoic acid","3-Amino benzamide","3-Amino benzaldehyde"],2,"The book gives 3-amino benzene carboxamide, also called 3-amino benzamide.","Carboxamide equals benzamide.",0,6],["Which group has the highest priority for numbering?",["Ketone (C=O) group","Aldehyde (–CHO) group","Carboxylic acid (–COOH)","Alcohol (–OH) group"],2,"The priority table begins with carboxylic acid, then sulphonic acid, anhydride, ester and acid halide.","Acid first.",0,7],["Which is higher in priority?",["Sulphonic acid","Amide (–CONH2) group","Ester (–COOR) group","Nitrile (–CN) group"],0,"Sulphonic acid is number 2 in the book's table, after carboxylic acid.","Acid, then sulphonic.",0,7],["The suffix for an acid anhydride is",["oate","amide","oyl halide","oic anhydride"],3,"The anhydride group is number 3 and has the suffix oic anhydride.","Anhydride, oic anhydride.",0,7],["The suffix of an ester is",["oic acid, as in the acid","amide, as in the amide","Alkyl … oate","nitrile, as in the cyanide"],2,"Esters are named Alkyl ... oate, with the prefix alkoxycarbonyl.","Ester, oate.",0,7],["The suffix for –CONH2 is",["nitrile","amide","oate","amine"],1,"The prefix is carbamoyl or amido and the suffix is amide.","CONH2, amide.",0,7],["The prefix for the –CN group is",["Formyl","Carbamoyl","Nitro","Cyano"],3,"–CN has prefix cyano and suffix nitrile.","CN, cyano.",0,7],["The prefix for the –CHO group is",["Keto, as in a ketone","Formyl or oxo","Hydroxy, as in an alcohol","Carboxy, as in an acid"],1,"–CHO has suffix al and prefix formyl or oxo.","CHO, al.",0,7],["Which has higher priority?",["Amine over aldehyde","Alcohol over ketone","Ketone over aldehyde","Aldehyde over ketone"],3,"The table lists aldehyde (9) above ketone (10), then alcohol (11).","Al, one, ol.",0,7],["The suffix of the –SH group is",["ol","thiol","thio","amine"],1,"–SH has the prefix mercapto and the suffix thiol.","SH, thiol.",0,7],["The prefix of the –OH group is",["Hydroxy","Mercapto","Amino","Alkoxy"],0,"–OH has the prefix hydroxy and the suffix ol.","OH, hydroxy.",0,7],["Which groups act ONLY as prefixes (no suffix)?",["Hydroxy, amino and cyano","Carboxy, formyl and oxo","Alkoxy, halo and nitro","Mercapto, amino and keto"],2,"The table gives × for suffix on –O–, –X and –NO2.","Alkoxy, halo, nitro are prefix only.",0,7],["3-Hydroxy-3-methylbutan-2-one shows that the ketone is named as the",["Suffix","Root","Prefix","Primary prefix"],0,"The ketone has higher priority than hydroxy, so one is the suffix and hydroxy the prefix.","Higher priority takes the suffix.",0,7],["3-Cyanopropanoic acid is named with cyano as a prefix because",["The nitrile is on carbon number 3 only","The acid has higher priority than the nitrile","The nitrile has higher priority than the acid","Cyano is always used as a suffix"],1,"–COOH is higher in priority and takes the suffix.","Acid beats nitrile.",0,7],["In the priority list, which of these is the LOWEST?",["Halo (–X)","Nitro (–NO2)","Amino (–NH2)","Alkoxy (–O–)"],1,"Nitro is number 18, the last in the table.","Nitro last.",0,7]]},{"t":"Homologous Series and Functional Groups","s":["Homologous series","Functional groups and their types","Hydrogen bond and position of the functional group","Primary, secondary and tertiary compounds","Stability, reactivity and steric hindrance","Mono- and bi-functional groups and naming","Hydrophobic and hydrophilic groups"],"q":[["A homologous series is a group of compounds that have",["The same functional group and similar properties","The same molecular mass and similar boiling points","The same number of carbons and similar density","The same boiling point and similar colour"],0,"The book defines it as compounds with the same functional group and similar or the same physical and chemical properties.","Same functional group, same series.",0,0],["Methane, ethane, propane and butane belong to the same series with general formula",["CnH2n+1","CnH2n+2","CnH2n-2","CnH2n"],1,"They are straight-chain alkanes, CnH2n+2.","Alkane, 2n + 2.",0,0],["The general formula of straight-chain alkenes is",["CnH2n+2","CnH2n-2","CnH2n","CnH2n+1"],2,"Alkenes follow CnH2n for n ≥ 2.","Alkene, 2n.",0,0],["The general formula of straight-chain alkynes is",["CnH2n","CnH2n-1","CnH2n+2","CnH2n-2"],3,"Alkynes follow CnH2n-2 for n ≥ 2.","Alkyne, 2n − 2.",0,0],["The general formula of cycloalkanes is",["CnH2n+2","CnH2n+1","CnH2n","CnH2n-2"],2,"Cycloalkanes are CnH2n with n ≥ 3.","Ring, 2n.",0,0],["The repeating unit in a homologous series is",["–CH3","–CH=","–CH2–","–C≡"],2,"Adjacent members of a series differ by a –CH2– group.","Series steps by CH2.",0,0],["The general formula of straight-chain alcohols is",["CnH2nOH","CnH2n-1OH","CnH2n+2OH","CnH2n+1OH"],3,"The book lists straight-chain alcohols as CnH2n+1OH with –OH as functional group.","Alkyl plus OH.",0,0],["The general formula of an alkyl halide is",["CnH2n+1X","CnH2n+2X","CnH2nX","CnH2n-1X"],0,"The book lists alkyl halides as CnH2n+1X.","Alkyl plus X.",0,0],["The general formula of straight-chain aldehydes is",["CnH2n+2CHO","CnH2n-1CHO","CnH2n+1CHO","CnH2nCHO"],2,"Aldehydes are CnH2n+1CHO.","Alkyl plus CHO.",0,0],["Members of a homologous series show differences in physical properties because of",["Different functional groups on the carbon chain","Change in molecular mass and structural arrangement","Different general methods of preparation used","Different general formula of the members"],1,"Physical properties change with molecular mass and structure while chemical properties stay similar.","Physical changes, mass changes.",0,0],["Members of a series have similar chemical properties because they have",["The same boiling point","The same molecular mass","The same number of carbons","The same functional group"],3,"The same functional group gives the same general methods of preparation and similar chemical properties.","Same group, same chemistry.",0,0],["Two adjacent members of a homologous series differ by",["One –CH2– group","One hydrogen atom","One –CH3 group","Two –CH2– groups"],0,"The book says two adjacent members differ by a –CH2– group.","Neighbours, CH2.",0,0],["A functional group is an atom or system of bonds that",["Dictates the identity of an organic compound","Joins two organic molecules into one chain","Fixes the melting point of the compound only","Makes the compound inorganic in nature"],0,"It determines the characteristics and reactivity of the compound.","Functional group gives identity.",0,1],["Which is a nitrogen-based functional group?",["Ester (R–COOR)","Thiol (R–SH)","Alkyl halide (R–X)","Nitrile (R–C≡N)"],3,"Nitrile, nitro and amide are listed under nitrogen-based groups.","Look for N.",0,1],["Which is a sulphur-based functional group?",["Thiol or mercaptan (–SH)","Hydroxyl (–OH) found in alcohols","Amino (–NH2) found in amines","Carbonyl (C=O) found in ketones"],0,"–SH, disulfide, sulfone and sulfonyl halides are sulphur-based.","Look for S.",0,1],["Which is a halogen-based functional group?",["Ketone (RCOR) found in acetone","Nitro (R–NO2) found in explosives","Alkyl halide (R–X)","Ester (RCOOR) found in fruits"],2,"R–X, where X is F, Cl, Br or I, is the halogen-based group.","Look for X.",0,1],["An organic disulfide has the general formula",["R–SH","R–S–R","R–S–S–R","R–SO2–R"],2,"The book shows disulfide as R–S–S–R, for example CH3CH2SSCH2CH3.","Two S in a row, disulfide.",0,1],["Which is a carbonyl-based functional group?",["Alkyl halide","Ketone","Mercaptan","Alcohol"],1,"Aldehyde, ketone, anhydride, acid, ester and amide are listed as carbonyl based.","C=O family.",0,1],["The functional group of an anhydride has",["One carbonyl group and one OH group","Two hydroxyl groups on one carbon","One carbonyl group and one NH2 group","Two carbonyl groups joined through an oxygen"],3,"Anhydrides are R–CO–O–CO–R.","CO–O–CO.",0,1],["A functional group can be",["A carbon chain only, such as an alkyl","An atom only, such as a halogen","An atom or a group of atoms","A molecule only, such as a whole acid"],2,"Br is an atom and –COOH is a group of atoms, both are functional groups.","Single atom or group.",0,1],["The functional group of alcohols and phenols is",["Carbonyl (C=O)","Carboxyl (–COOH)","Hydroxyl (–OH)","Amino (–NH2)"],2,"The hydroxyl group is the functional group of alcohols and phenols.","OH, alcohol and phenol.",0,1],["The general formula of an ester is",["R–COOH","R–CO–R′","R–CONH2","R–COOR′"],3,"Esters are alkanoates, R–COOR′.","Ester, COOR.",0,1],["A hydrogen bond is",["A bond between two hydrogen atoms in H2","A sharing of two electrons between two atoms","A partial electrostatic attraction between H bound to a highly electronegative atom and a lone pair","A complete transfer of electrons between atoms"],2,"The book defines it as partial electrostatic force of attraction between hydrogen bound to N, O or F and another adjacent atom with a lone pair.","H on N, O or F.",0,2],["Hydrogen bonding is possible when hydrogen is bound to",["Na, K or Li","N, O or F","Cl, Br or I","C, Si or P"],1,"The highly electronegative atoms listed are N, O and F.","N, O, F.",0,2],["A hydrogen bond between two functional groups on different molecules is",["Intermolecular","Ionic","Covalent","Intramolecular"],0,"Hydrogen bonds between different molecules are intermolecular.","Between molecules, inter.",0,2],["A hydrogen bond within the same molecule is",["Intermolecular","Intramolecular","Metallic","Ionic"],1,"Intramolecular hydrogen bonds are between groups on the same molecule.","Inside one molecule, intra.",0,2],["The carbon that carries the functional group is called the",["Functional group carrier carbon","Terminal carbon at the end of the chain","Parent carbon of the whole chain","Alpha carbon next to the carbonyl"],0,"The book calls it the functional group bearer or carrier carbon.","Carrier carbon, bears the group.",0,2],["A primary (1°) organic compound has the functional-group carbon attached to",["Three hydrogens","One alkyl group and two hydrogens","Two alkyl groups and one hydrogen","Three alkyl groups"],1,"A primary compound has one alkyl group and two hydrogen atoms on the carrier carbon.","1° means one alkyl.",0,3],["A secondary (2°) organic compound has the functional-group carbon attached to",["Two alkyl groups and one hydrogen","One alkyl group and two hydrogens","Two hydrogens","Three alkyl groups"],0,"A secondary compound has two alkyl groups and one hydrogen on the carrier carbon.","2° means two alkyl.",0,3],["A tertiary (3°) organic compound has the functional-group carbon attached to",["One alkyl group and two hydrogens","Three alkyl groups and no hydrogen","Two alkyl groups and one hydrogen","Three hydrogens"],1,"A tertiary compound has no hydrogen on the carrier carbon.","3° means no H.",0,3],["Classification as 1°, 2° or 3° depends on the number of",["Carbon atoms in the whole molecule","Functional groups found in the molecule","Double bonds found in the carbon chain","Alkyl groups and hydrogens on the carrier carbon"],3,"It depends on the alkyl groups and hydrogen atoms on the functional group carrier carbon.","Count groups on carrier carbon.",0,3],["More alkyl groups on the functional-group carbon give",["Higher stability and higher reactivity","Lower stability and higher reactivity","Higher stability and lower reactivity","No change"],2,"Stability increases 1° < 2° < 3° and reactivity falls in the same direction.","More alkyl, more stable.",0,4],["Which is the most stable class of organic compound?",["Secondary","Tertiary","All the same","Primary"],1,"Tertiary compounds are highly stable and mostly non-reactive or less reactive.","3° most stable.",0,4],["Which is the most reactive class?",["All the same","Primary","Secondary","Tertiary"],1,"Primary compounds are highly reactive, more than 2° and 3°.","1° most reactive.",0,4],["The correct order of stability is",["1° < 2° < 3°","2° < 1° < 3°","1° = 2° = 3°","3° < 2° < 1°"],0,"Stability increases with the number of alkyl groups.","Stability follows number.",0,4],["The decrease in reactivity as alkyl groups increase is due to",["Presence of double bonds in the chain","Bulkiness of the carbon bearing the functional group","Higher electronegativity of the carbon","Lower molecular mass of the molecule"],1,"The book says this is called the steric effect.","Bulky carbon, steric.",0,4],["A steric effect is an effect on relative rates caused by",["The space-filling properties of parts of a molecule near the reacting site","The colour shown by the compound","The charge carried by the functional group","The temperature at which the reaction is run"],0,"It depends on the space-filling properties of the parts attached to or near the reacting site.","Steric means space.",0,4],["Steric hindrance is when the spatial arrangement of atoms near the reacting site",["Hinders or retards a reaction","Stops the reaction completely always","Speeds up a reaction","Has no effect"],0,"Steric hindrance retards reaction.","Hindrance slows.",0,4],["Steric hindrance is greatest in",["Primary compounds","Methane only","Secondary compounds","Tertiary compounds"],3,"Steric hindrance increases 1° < 2° < 3°.","3° most crowded.",0,4],["A compound with two functional groups is called",["Monofunctional","Polyfunctional only","Bifunctional ring","Difunctional"],3,"The book gives amino acids as examples of difunctional compounds.","Two groups, difunctional.",0,5],["Which of these is difunctional according to the book?",["Alkyl halides","Simple alcohols","Alkanes","Amino acids"],3,"Amino acids have both an amino and a carboxyl group.","Amino acid, two groups.",0,5],["The –COOH group contains which three functional groups?",["Carboxyl, amino and hydroxyl","Carboxyl, carbonyl and hydroxyl","Carbonyl, amino and nitro","Carboxyl, carbonyl and ether"],1,"The book notes that any of the three can dictate its reactivity.","COOH has C=O aturated","Ionic"],2,"Unsaturated hydrocarbons undergo addition reactions.","Unsaturated, addition.",0,2],["The C=C bond of an alkene contains",["Two pi bonds between the carbons","Two sigma bonds between the carbons","Three sigma bonds between the carbons","One sigma bond and one pi bond"],3,"The pi bond is weaker than the sigma bond.","Double, 1 sigma + 1 pi.",0,2],["Of the three carbon–carbon bonds in an alkyne, the pi bonds number",["Three","One","Two","None"],2,"One is sigma and two are pi bonds.","Triple, 2 pi.",0,2],["The pi bond breaks easily because it is",["Ionic","Stronger than the sigma bond","Non-polar","Weaker than the sigma bond"],3,"The weaker pi bond breaks easily.","Pi weak.",0,2],["The colour of bromine solution disappears when added to unsaturated hydrocarbons because of",["An addition reaction","A rearrangement","A substitution reaction","An elimination reaction"],0,"Ethene plus Br2 gives colourless 1,2-dibromoethane.","Colour lost, addition.",0,2],["The product of ethene with bromine is",["Bromoethane","Ethyne","1,2-Dibromoethane","1,1-Dibromoethane"],2,"Br adds to each carbon of the double bond.","Br on both carbons.",0,2],["The multiple bond of an alkene or alkyne is attacked easily by",["Neutral molecules only","Nucleophilic reagents","Electrophilic reagents","Inert gases"],2,"It is a region of high electron density.","High electron density, electrophile.",0,2],["Alkynes add hydrogen in two steps, first giving",["An alkane then an alkene","A ring compound","An alcohol","An alkene and then an alkane"],3,"Two molecules of hydrogen add using a Ni or Pt catalyst.","Triple, double, single.",0,2],["Which catalyst is named for adding hydrogen to a double bond?",["H2SO4","AlCl3","Fe","Ni or Pt"],3,"The book writes H2/Ni or Pt catalyst for hydrogenation.","H2 uses Ni or Pt.",0,2],["An elimination reaction is",["The formation of a saturated compound from an alkene","The formation of an alkene from a saturated compound","The swapping of two atoms","The movement of a group"],1,"It is the reverse of addition.","Elimination makes the double bond.",0,3],["Elimination is characterised by",["Addition of a small molecule to carbons","Replacement of a hydrogen by a halogen","Removal of a small molecule from adjacent carbons and formation of a double bond","Opening of a ring to a straight chain"],2,"For example, an alcohol loses water to form an alkene.","Small molecule out.",0,3],["Heating ethanol with a strong acid catalyst gives",["Ethene and water","Ethane and water","Ethanal","Ethyl ether"],0,"H2SO4 removes H2O from adjacent carbons.","Alcohol minus water, alkene.",0,3],["A molecular rearrangement involves",["A change in the hydrocarbon skeleton with a group migrating","Loss of a double bond to form a ring","Addition of a halogen to a double bond","Removal of water from adjacent carbons"],0,"An atom or group migrates from one position to another.","Group migrates.",0,4],["In the book's example, 1-chlorobutane with AlCl3 rearranges to",["Butane","2-Chlorobutane","Butene","1,2-Dichlorobutane"],1,"The chlorine migrates to carbon 2 in the presence of a Lewis acid.","Cl moves to carbon 2.",0,4],["The Lewis acid used in that rearrangement is",["AlCl3","NaOH","FeCl3","H2SO4"],0,"1-Chlorobutane rearranges to 2-chlorobutane in the presence of AlCl3.","Lewis acid, AlCl3.",0,4],["A reaction mechanism is the",["Rate of heating used in a reaction","Final yield of a reaction product","Detailed steps by which reactants change into products","Colour change seen during a reaction"],2,"The book defines it as detailed knowledge of the steps involved in the change of reactants to products.","Mechanism, step by step.",0,4]]},{"t":"Benzene","s":["Structure and properties of benzene","Derivatives and uses of benzene","Nomenclature of benzene compounds","Preparation of benzene","Reactions of benzene: electrophilic substitution","Nitration and sulphonation"],"q":[["Benzene is the prototype of",["A heterocyclic compound","An aliphatic compoun
