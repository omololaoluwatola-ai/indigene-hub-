: "Femoral hernias appear above and medial to the pubic tubercle, the same as inguinal hernias.", "answer": false, "explanation": "This positional distinction relative to the pubic tubercle is the classic way to differentiate femoral from inguinal hernias clinically."}, {"id": 883, "topic": "LumbosacralPlexus", "statement": "The lumbosacral plexus has an identical structural organization to the brachial plexus.", "answer": false, "explanation": "The lumbosacral plexus's organization into two linked plexuses (lumbar and sacral) is structurally distinct from the brachial plexus's single pipeline."}, {"id": 884, "topic": "PosteriorLeg", "statement": "Tarsal tunnel syndrome involves compression of the tibial nerve behind the medial malleolus, causing burning or numbness in the sole.", "answer": true, "explanation": "Tarsal tunnel syndrome is the lower limb's analog to carpal tunnel syndrome, involving the tibial nerve at the medial ankle."}, {"id": 885, "topic": "AnteriorThigh", "statement": "All four quadriceps heads converge into a single quadriceps tendon that continues as the patellar ligament.", "answer": true, "explanation": "Despite four separate origins, all quadriceps heads converge into one common tendon."}, {"id": 886, "topic": "MasteryLinks", "statement": "Adductor magnus's nerve supply has no relationship to embryological development.", "answer": false, "explanation": "Recognizing the developmental basis for adductor magnus's unusual dual nerve supply reinforces why this exception exists rather than requiring pure rote memorization."}, {"id": 887, "topic": "Gluteal", "statement": "Gluteus medius originates from the lateral surface of the ilium and inserts on the greater trochanter.", "answer": true, "explanation": "Gluteus medius runs from the lateral ilium to the greater trochanter, enabling hip abduction."}, {"id": 888, "topic": "LateralLeg", "statement": "Peroneus brevis inserts on the base of the first metatarsal.", "answer": false, "explanation": "Peroneus brevis has a shorter course than longus, inserting directly on the fifth metatarsal base."}, {"id": 889, "topic": "BloodSupplyLL", "statement": "The profunda femoris (deep femoral artery) is the main supplier of the thigh muscles, not the femoral artery itself.", "answer": true, "explanation": "The femoral artery mostly passes through to become the popliteal artery, while profunda femoris does the major work of thigh muscle supply."}, {"id": 890, "topic": "Gluteal", "statement": "Gluteus maximus is a weak hip flexor with no role in extension.", "answer": false, "explanation": "Gluteus maximus is the prime extensor of the hip, especially important when extending from flexion, like climbing or standing from sitting."}, {"id": 891, "topic": "LateralLeg", "statement": "The lateral leg compartment contains four muscles matching the anterior compartment.", "answer": false, "explanation": "Peroneus (fibularis) longus and brevis are the sole two muscles of the lateral compartment."}, {"id": 892, "topic": "PosteriorLeg", "statement": "The Achilles tendon is the thinnest and weakest tendon in the human body.", "answer": false, "explanation": "Despite being extremely strong, the Achilles tendon can still rupture under sudden forceful loading."}, {"id": 893, "topic": "LumbosacralPlexus", "statement": "The lateral cutaneous nerve of the thigh is a purely sensory branch of the lumbar plexus supplying the anterolateral thigh.", "answer": true, "explanation": "This nerve is purely sensory, and its entrapment near the ASIS causes meralgia paresthetica."}, {"id": 894, "topic": "MasteryLinks", "statement": "The femoral triangle's NAVEL order and the popliteal fossa's reversed depth order (artery deepest) are both frequently tested comparative facts about neurovascular bundle organization in the lower limb.", "answer": true, "explanation": "Both are classic, frequently examined structural arrangements that examiners love to test in combination."}, {"id": 895, "topic": "FemoralTriangle", "statement": "The femoral triangle has no neurovascular significance and is purely a muscular landmark.", "answer": false, "explanation": "The femoral triangle is fundamentally a neurovascular passageway, housing the major nerve, artery, vein, and lymphatics entering the thigh."}, {"id": 896, "topic": "Gluteal", "statement": "The gluteal region has only one uniform muscular layer with no distinction between superficial and deep.", "answer": false, "explanation": "This layered organization mirrors the rotator cuff concept — big power muscles superficially, small stabilizing rotators deep."}, {"id": 897, "topic": "AnteriorThigh", "statement": "Rectus femoris originates from the posterior superior iliac spine (PSIS).", "answer": false, "explanation": "The AIIS is the origin point for rectus femoris, distinguishing it from the other three vastus muscles."}, {"id": 898, "topic": "AnteriorLeg", "statement": "Extensor digitorum longus and extensor hallucis longus cross the ankle joint posteriorly.", "answer": false, "explanation": "Their anterior course across the ankle allows them to contribute to dorsiflexion alongside their toe extension roles."}, {"id": 899, "topic": "LumbosacralPlexus", "statement": "The sacral plexus has no branches to the gluteal region.", "answer": false, "explanation": "These smaller named branches of the sacral plexus supply specific deep gluteal rotator muscles."}, {"id": 900, "topic": "MedialThigh", "statement": "Obturator hernia has no relationship to the obturator nerve.", "answer": false, "explanation": "This rare hernia type, more common in elderly thin women, can directly compress the obturator nerve, producing characteristic pain."}, {"id": 901, "topic": "BloodSupplyLL", "statement": "The medial and lateral circumflex femoral arteries anastomose to help supply the femoral head and neck region, directly connecting to the hip joint's blood supply.", "answer": true, "explanation": "This is the same blood supply pathway discussed earlier with the femoral neck and hip joint, now placed in its full arterial context."}, {"id": 902, "topic": "IntrinsicFoot", "statement": "Claw toes have no relationship to intrinsic muscle function.", "answer": false, "explanation": "Similar to the hand's lumbrical-loss claw deformity, foot intrinsic imbalance can produce clawed or hammer toe deformities."}, {"id": 903, "topic": "MedialThigh", "statement": "The medial compartment of the thigh, together with the anterior and posterior compartments, is separated by intermuscular septa.", "answer": true, "explanation": "Intermuscular septa divide the thigh into anterior, medial, and posterior compartments, each with distinct nerve supply."}, {"id": 904, "topic": "MasteryLinks", "statement": "Reviewing musculature alongside its nerve supply and blood supply, rather than each in isolation, better reflects how these systems are tested together in clinical vignettes.", "answer": true, "explanation": "Integrated study of muscle-nerve-vessel relationships mirrors how clinical questions and vignettes are actually constructed."}, {"id": 905, "topic": "PosteriorLeg", "statement": "Dysfunction of tibialis posterior has no relationship to flatfoot deformity.", "answer": false, "explanation": "Because tibialis posterior dynamically supports the medial arch, its failure is a leading cause of adult-acquired flatfoot."}, {"id": 906, "topic": "IntrinsicFoot", "statement": "Extensor hallucis brevis is supplied by the tibial nerve.", "answer": false, "explanation": "As part of the dorsal extensor group, EHB shares deep peroneal nerve supply with extensor digitorum brevis."}, {"id": 907, "topic": "MasteryLinks", "statement": "Sciatic nerve injuries produce identical deficits regardless of the level of injury.", "answer": false, "explanation": "A high sciatic injury affects both divisions; a lower injury (after the split) affects only one, directly testing understanding of the nerve's composite structure."}, {"id": 908, "topic": "LateralLeg", "statement": "The primary action of the lateral leg compartment is eversion of the foot, with weak assistance to plantarflexion.", "answer": true, "explanation": "Eversion is the unifying action of the lateral compartment, opposite to tibialis anterior/posterior's inversion role."}, {"id": 909, "topic": "PosteriorThigh", "statement": "Hamstring strain is a rare injury seen almost exclusively in swimmers.", "answer": false, "explanation": "The hamstrings are among the most frequently strained muscles in athletics, particularly sprinting sports."}, {"id": 910, "topic": "LumbosacralPlexus", "statement": "The lumbosacral trunk is formed by part of L4 and all of L5, connecting the lumbar and sacral plexuses.", "answer": true, "explanation": "The lumbosacral trunk is the physical bridge linking the two plexuses, carrying L4/L5 fibers down to join the sacral plexus."}, {"id": 911, "topic": "FemoralTriangle", "statement": "The roof of the femoral triangle is formed by the sartorius muscle belly.", "answer": false, "explanation": "The roof is fascial, not muscular, covering the triangle's contents superficially."}, {"id": 912, "topic": "PosteriorLeg", "statement": "To isolate soleus strength, plantarflexion is tested with the knee fully extended.", "answer": false, "explanation": "Flexing the knee shortens gastrocnemius (reducing its contribution), allowing soleus strength to be more isolated."}, {"id": 913, "topic": "AnteriorLeg", "statement": "The deep peroneal nerve also supplies sensation to a small web space between the first and second toes.", "answer": true, "explanation": "The first dorsal web space is the classic sensory territory of the deep peroneal nerve, useful in clinical nerve assessment."}, {"id": 914, "topic": "PosteriorThigh", "statement": "Semitendinosus and semimembranosus are both supplied by the common peroneal division.", "answer": false, "explanation": "These two hamstrings, both crossing the hip from the ischial tuberosity, share tibial nerve supply."}, {"id": 915, "topic": "PopFossa", "statement": "The floor of the popliteal fossa is formed entirely by skin and superficial fascia.", "answer": false, "explanation": "The floor is deep, bony/muscular structure, contrasting with the superficial fascial roof."}, {"id": 916, "topic": "IntrinsicFoot", "statement": "The medial plantar nerve supplies muscles analogous to the ulnar nerve's territory in the hand.", "answer": false, "explanation": "Medial plantar nerve is the foot's 'median nerve equivalent,' with a smaller, more medial territory."}, {"id": 917, "topic": "MedialThigh", "statement": "The adductor hiatus is a solid bony structure with no passage for vessels.", "answer": false, "explanation": "The adductor hiatus is the exact point where the femoral artery becomes the popliteal artery."}, {"id": 918, "topic": "MedialThigh", "statement": "Obturator externus has no rotational action at the hip.", "answer": false, "explanation": "Obturator externus, despite being a medial compartment muscle, also contributes to lateral rotation."}, {"id": 919, "topic": "MasteryLinks", "statement": "The common peroneal nerve's course has no relationship between its popliteal fossa position and its fibular neck vulnerability.", "answer": false, "explanation": "Tracing this single nerve's path ties together the popliteal fossa, fibular neck osteology, and both anterior/lateral leg compartments into one coherent injury picture."}, {"id": 920, "topic": "MedialThigh", "statement": "The adductor hiatus is a gap in adductor magnus's tendinous insertion, allowing femoral vessels to pass into the popliteal fossa.", "answer": true, "explanation": "The adductor hiatus is the exact point where the femoral artery becomes the popliteal artery."}, {"id": 921, "topic": "IntrinsicFoot", "statement": "Abductor hallucis is supplied by the medial plantar nerve.", "answer": true, "explanation": "Abductor hallucis, in the first plantar layer, is medial plantar nerve territory, like its hand counterpart abductor pollicis brevis."}, {"id": 922, "topic": "PosteriorLeg", "statement": "The posterior leg compartment has mixed nerve supply from tibial and peroneal nerves.", "answer": false, "explanation": "All superficial and deep posterior compartment muscles share tibial nerve innervation."}, {"id": 923, "topic": "BloodSupplyLL", "statement": "The profunda femoris has no branches supplying the posterior thigh.", "answer": false, "explanation": "Perforating branches of profunda femoris pierce the adductor muscles to reach and supply the hamstring compartment."}, {"id": 924, "topic": "LumbosacralPlexus", "statement": "Sciatic nerve injury from posterior hip dislocation or improper deep intramuscular injection can cause combined tibial and common peroneal deficits.", "answer": true, "explanation": "Both are classic causes of sciatic nerve injury, producing the combined foot drop plus plantarflexion/intrinsic muscle loss pattern."}, {"id": 925, "topic": "LateralLeg", "statement": "Weakness of eversion after a fibular neck injury should raise suspicion of tibial nerve involvement.", "answer": false, "explanation": "Since superficial peroneal nerve supplies the evertors, its involvement (via common peroneal nerve injury) explains eversion weakness."}, {"id": 926, "topic": "AnteriorThigh", "statement": "Vastus medialis is the largest of the four quadriceps muscles.", "answer": false, "explanation": "Vastus lateralis holds the largest bulk among the four heads of quadriceps femoris."}, {"id": 927, "topic": "BloodSupplyLL", "statement": "The anterior tibial artery remains in the posterior compartment throughout its course.", "answer": false, "explanation": "The anterior tibial artery must cross through the interosseous membrane to reach and supply the anterior compartment."}, {"id": 928, "topic": "LumbosacralPlexus", "statement": "The femoral nerve arises from the lumbar plexus with root value L2-L4.", "answer": true, "explanation": "Femoral nerve, the main nerve of the anterior thigh, is a lumbar plexus branch with L2-L4 contribution."}, {"id": 929, "topic": "IntrinsicFoot", "statement": "Adductor hallucis is found in the first plantar layer.", "answer": false, "explanation": "Adductor hallucis, along with flexor hallucis brevis and flexor digiti minimi brevis, occupies the third layer."}, {"id": 930, "topic": "PosteriorLeg", "statement": "Gastrocnemius crosses only the ankle joint, unlike soleus which crosses both the knee and ankle.", "answer": false, "explanation": "This is the key distinguishing feature between the two major calf muscles."}, {"id": 931, "topic": "LumbosacralPlexus", "statement": "The femoral and obturator nerves have completely non-overlapping root value ranges.", "answer": false, "explanation": "Despite the overlapping L2-L4 root contribution, these two nerves diverge to supply anterior versus medial thigh compartments respectively."}, {"id": 932, "topic": "PopFossa", "statement": "Genicular branches of the popliteal artery form an anastomotic network providing collateral circulation around the knee.", "answer": true, "explanation": "These genicular branches are clinically important as a collateral pathway if the main popliteal artery is compromised."}, {"id": 933, "topic": "LumbosacralPlexus", "statement": "Meralgia paresthetica results from compression of the lateral cutaneous nerve of the thigh under the inguinal ligament.", "answer": true, "explanation": "This specific entrapment syndrome, common in obesity and pregnancy, involves the lateral cutaneous nerve of thigh."}, {"id": 934, "topic": "FemoralTriangle", "statement": "The femoral triangle's lateral boundary is the medial border of sartorius.", "answer": true, "explanation": "Sartorius forms the lateral wall of the femoral triangle."}, {"id": 935, "topic": "LumbosacralPlexus", "statement": "The lumbosacral plexus is formed from two functional units: the lumbar plexus and the sacral plexus, linked by the lumbosacral trunk.", "answer": true, "explanation": "Unlike the brachial plexus's single continuous pipeline, the lumbosacral plexus is really two plexuses connected by the lumbosacral trunk."}, {"id": 936, "topic": "FemoralTriangle", "statement": "The femoral canal is the most lateral content of the femoral triangle.", "answer": false, "explanation": "The femoral canal, medial-most in the NAVEL order, is clinically significant as the site of femoral hernia formation."}, {"id": 937, "topic": "AnteriorLeg", "statement": "Foot drop has no effect on walking pattern.", "answer": false, "explanation": "Because the foot can't be lifted, patients compensate with excessive hip/knee flexion — the classic steppage gait."}, {"id": 938, "topic": "AnteriorThigh", "statement": "Quadriceps tendon rupture causes an inability to actively extend the knee, known as extensor lag.", "answer": true, "explanation": "A ruptured quadriceps tendon disconnects the muscle from the patella, preventing active knee extension."}, {"id": 939, "topic": "LumbosacralPlexus", "statement": "The sciatic nerve exits the pelvis via the obturator foramen.", "answer": false, "explanation": "The greater sciatic foramen, with piriformis passing through it, is the sciatic nerve's exit route from the pelvis."}, {"id": 940, "topic": "PosteriorThigh", "statement": "The posterior thigh compartment is separated from the anterior and medial compartments by fascial septa.", "answer": true, "explanation": "Like the other thigh compartments, the posterior compartment is defined by intermuscular septa."}, {"id": 941, "topic": "LumbosacralPlexus", "statement": "The sciatic nerve is formed from L4 to S3 and is the largest nerve in the body.", "answer": true, "explanation": "The sciatic nerve, the body's largest and widest nerve, draws from L4-S3 root values."}, {"id": 942, "topic": "PopFossa", "statement": "The popliteal fossa has no connection to any other anatomical region.", "answer": false, "explanation": "The popliteal fossa serves as a central relay point, connecting the thigh's adductor canal above to the leg's deep posterior compartment below."}, {"id": 943, "topic": "AnteriorLeg", "statement": "Extensor digitorum longus and extensor hallucis longus both cross the ankle joint anteriorly, positioning them as effective dorsiflexors.", "answer": true, "explanation": "Their anterior course across the ankle allows them to contribute to dorsiflexion alongside their toe extension roles."}, {"id": 944, "topic": "LumbosacralPlexus", "statement": "Femoral nerve injury has no known clinical causes.", "answer": false, "explanation": "These are classic causes of femoral nerve injury, given its course near the pelvis and proximal femur."}, {"id": 945, "topic": "LateralLeg", "statement": "Peroneal tendons have no relationship to lateral ankle stability.", "answer": false, "explanation": "The peroneal tendons run close to the lateral ankle ligaments and can be involved in instability or subluxation issues."}, {"id": 946, "topic": "IntrinsicFoot", "statement": "Claw toes or hammer toes can result from intrinsic foot muscle imbalance, conceptually similar to claw hand from lumbrical loss.", "answer": true, "explanation": "Similar to the hand's lumbrical-loss claw deformity, foot intrinsic imbalance can produce clawed or hammer toe deformities."}, {"id": 947, "topic": "IntrinsicFoot", "statement": "The plantar and dorsal interossei of the foot have split innervation like the lumbricals.", "answer": false, "explanation": "Unlike the lumbricals, all foot interossei are uniformly lateral plantar nerve territory."}, {"id": 948, "topic": "BloodSupplyLL", "statement": "The dorsalis pedis pulse is classically palpated between the first and second metatarsals on the top of the foot.", "answer": true, "explanation": "This specific location for the dorsalis pedis pulse is a standard clinical exam point for peripheral vascular assessment."}, {"id": 949, "topic": "PosteriorLeg", "statement": "Tibialis posterior everts and dorsiflexes the foot with no role in arch support.", "answer": false, "explanation": "Tibialis posterior is both an inverter/plantarflexor and the primary muscular support of the medial arch."}, {"id": 950, "topic": "MedialThigh", "statement": "Weakness of hip adduction after pelvic surgery should raise suspicion for femoral nerve injury.", "answer": false, "explanation": "Given the obturator nerve's role in adduction, its injury during pelvic surgery is the logical cause of new adduction weakness."}, {"id": 951, "topic": "FemoralTriangle", "statement": "Femoral line placement has no relationship to the femoral artery's position.", "answer": false, "explanation": "Because the vein lies medial to the artery in the NAVEL order, clinicians use the palpable arterial pulse as a landmark to safely access the vein."}, {"id": 952, "topic": "AnteriorLeg", "statement": "Anterior compartment syndrome of the leg can compromise the anterior tibial artery and deep peroneal nerve due to tight fascial boundaries.", "answer": true, "explanation": "The anterior compartment is particularly vulnerable to compartment syndrome, risking both vascular and neural structures within it."}, {"id": 953, "topic": "PosteriorThigh", "statement": "Biceps femoris inserts on the medial tibial condyle.", "answer": false, "explanation": "Biceps femoris is unique among hamstrings for inserting laterally on the fibular head rather than the tibia."}, {"id": 954, "topic": "PopFossa", "statement": "The roof of the popliteal fossa is formed by the femur.", "answer": false, "explanation": "The popliteal fossa's roof is fascial/cutaneous, while its floor is formed by bone, capsule, and popliteus."}, {"id": 955, "topic": "PopFossa", "statement": "A popliteal artery aneurysm is the most common peripheral artery aneurysm.", "answer": true, "explanation": "The popliteal artery is the most frequent site for peripheral arterial aneurysms."}, {"id": 956, "topic": "AnteriorThigh", "statement": "Vastus intermedius lies superficial to rectus femoris.", "answer": false, "explanation": "Vastus intermedius is the deepest of the quadriceps heads, directly beneath rectus femoris."}, {"id": 957, "topic": "LateralLeg", "statement": "Both peroneal muscles pass in front of the medial malleolus before reaching their insertions.", "answer": false, "explanation": "The peroneal tendons take a characteristic retromalleolar (behind the lateral malleolus) course."}, {"id": 958, "topic": "MasteryLinks", "statement": "Tibialis posterior's role in supporting the medial longitudinal arch connects the posterior leg compartment directly to the foot arch anatomy learned with the tarsal bones.", "answer": true, "explanation": "This links deep posterior leg musculature to earlier osteology content on foot arches."}, {"id": 959, "topic": "PosteriorLeg", "statement": "Gastrocnemius and soleus together are known as the triceps surae, converging onto the Achilles tendon.", "answer": true, "explanation": "Both muscles converge into the shared Achilles (calcaneal) tendon, together forming the triceps surae."}, {"id": 960, "topic": "FemoralTriangle", "statement": "Femoral hernias have a lower risk of strangulation than inguinal hernias.", "answer": false, "explanation": "The femoral canal's narrow, unyielding boundaries make strangulation more likely with femoral hernias."}, {"id": 961, "topic": "PosteriorThigh", "statement": "Semimembranosus has a broad, membranous tendon of insertion, reflected in its name meaning 'half-membrane.'", "answer": true, "explanation": "Semimembranosus's name reflects its broad, flattened, membrane-like tendon, distinguishing it from semitendinosus."}, {"id": 962, "topic": "FemoralTriangle", "statement": "The floor of the femoral triangle is formed by iliopsoas and pectineus.", "answer": true, "explanation": "Iliopsoas and pectineus together form the muscular floor of the femoral triangle."}, {"id": 963, "topic": "PopFossa", "statement": "The common peroneal nerve runs along the medial border of biceps femoris within the popliteal fossa.", "answer": true, "explanation": "Common peroneal nerve tracks along biceps femoris's medial border, more lateral and superficial than the tibial nerve."}, {"id": 964, "topic": "FemoralTriangle", "statement": "The contents of the femoral triangle, from lateral to medial, follow the mnemonic NAVEL: Nerve, Artery, Vein, Empty space, Lymphatics.", "answer": true, "explanation": "NAVEL is the classic lateral-to-medial ordering of femoral triangle contents."}, {"id": 965, "topic": "FemoralTriangle", "statement": "The femoral triangle's superior boundary is the inguinal ligament.", "answer": true, "explanation": "The inguinal ligament forms the base (superior boundary) of the femoral triangle."}, {"id": 966, "topic": "PopFossa", "statement": "The popliteal fossa's inferior boundaries are formed by the two heads of gastrocnemius.", "answer": true, "explanation": "The medial and lateral heads of gastrocnemius form the inferomedial and inferolateral boundaries respectively."}, {"id": 967, "topic": "AnteriorThigh", "statement": "All four quadriceps muscles cross both the hip and knee joints equally.", "answer": false, "explanation": "Rectus femoris originates from the AIIS (crossing the hip) uniquely among the four heads, allowing it to also flex the hip."}, {"id": 968, "topic": "MasteryLinks", "statement": "The pes anserinus is formed by three muscles that all share the same nerve supply.", "answer": false, "explanation": "This convergence point is a clear example of integrating compartment, nerve, and clinical landmark knowledge into one memorable structure."}, {"id": 969, "topic": "FemoralTriangle", "statement": "The femoral pulse is palpated at the midpoint of the inguinal ligament itself.", "answer": false, "explanation": "The mid-inguinal point (not the midpoint of the inguinal ligament, a commonly confused landmark) is where the femoral artery is best palpated."}, {"id": 970, "topic": "PosteriorThigh", "statement": "The hamstrings' primary actions are hip flexion and knee extension.", "answer": false, "explanation": "As the functional opposite of the quadriceps, the hamstrings extend the hip and flex the knee."}, {"id": 971, "topic": "Gluteal", "statement": "Gluteus medius and minimus have no role in pelvic stability.", "answer": false, "explanation": "These muscles prevent the pelvis from dropping on the unsupported side during single-leg stance."}, {"id": 972, "topic": "LumbosacralPlexus", "statement": "The lumbosacral trunk is formed entirely from S1 and S2.", "answer": false, "explanation": "The lumbosacral trunk is the physical bridge linking the two plexuses, carrying L4/L5 fibers down to join the sacral plexus."}, {"id": 973, "topic": "MasteryLinks", "statement": "There is no functional similarity between hip abductors and rotator cuff muscles.", "answer": false, "explanation": "Both muscle groups serve a stabilizing role for their respective ball-and-socket joints, a useful cross-limb organizing principle."}, {"id": 974, "topic": "FemoralTriangle", "statement": "The apex of the femoral triangle continues distally as the adductor canal (Hunter's canal).", "answer": true, "explanation": "Where sartorius crosses adductor longus at the triangle's apex, the neurovascular bundle continues into the adductor canal."}, {"id": 975, "topic": "AnteriorThigh", "statement": "Patellofemoral pain syndrome is linked to VMO weakness and abnormal patellar tracking.", "answer": true, "explanation": "VMO weakness allowing lateral patellar tracking is a well-established contributor to patellofemoral pain syndrome."}, {"id": 976, "topic": "LateralLeg", "statement": "Peroneus longus is more superficial than peroneus brevis in the proximal lateral leg.", "answer": true, "explanation": "Proximally, peroneus longus lies superficial to brevis, though their relationship changes distally near the malleolus."}, {"id": 977, "topic": "Gluteal", "statement": "Piriformis syndrome has no relationship to the sciatic nerve.", "answer": false, "explanation": "Piriformis spasm or anatomical variance can compress the sciatic nerve, producing sciatica-like symptoms without true nerve root pathology."}, {"id": 978, "topic": "PosteriorThigh", "statement": "The popliteal fossa's superolateral boundary is formed by the tendon of biceps femoris.", "answer": true, "explanation": "Biceps femoris, being the lateral hamstring, forms the superolateral boundary of the popliteal fossa."}, {"id": 979, "topic": "BloodSupplyLL", "statement": "The popliteal artery divides into femoral and obturator arteries at the lower border of popliteus.", "answer": false, "explanation": "This division into the two tibial arteries occurs at a specific, testable anatomical landmark."}, {"id": 980, "topic": "MedialThigh", "statement": "Gracilis is the deepest muscle of the adductor group, confined to the upper thigh only.", "answer": false, "explanation": "Gracilis is notably long and superficial, distinguishing it from the bulkier, shorter adductor muscles."}, {"id": 981, "topic": "FemoralTriangle", "statement": "Femoral nerve blocks have no relationship to surface landmarks.", "answer": false, "explanation": "Clinical femoral nerve blocks rely on the predictable NAVEL arrangement relative to the mid-inguinal point."}, {"id": 982, "topic": "IntrinsicFoot", "statement": "In the foot, the medial plantar nerve supplies only the first lumbrical, while the lateral plantar nerve supplies lumbricals 2, 3, and 4.", "answer": true, "explanation": "This is the reverse ratio from the hand (where median supplies 2 and ulnar supplies 2) — a classic exam trap."}, {"id": 983, "topic": "Gluteal", "statement": "The gluteal region can be thought of as having a superficial layer (3 glutes) and deeper layers of small lateral rotators.", "answer": true, "explanation": "This layered organization mirrors the rotator cuff concept — big power muscles superficially, small stabilizing rotators deep."}, {"id": 984, "topic": "AnteriorThigh", "statement": "Rectus femoris originates from the anterior inferior iliac spine (AIIS).", "answer": true, "explanation": "The AIIS is the origin point for rectus femoris, distinguishing it from the other three vastus muscles."}, {"id": 985, "topic": "MasteryLinks", "statement": "Neither the femoral triangle nor popliteal fossa have any standard organizational pattern to their contents.", "answer": false, "explanation": "Both are classic, frequently examined structural arrangements that examiners love to test in combination."}, {"id": 986, "topic": "BloodSupplyLL", "statement": "The femoral artery becomes the popliteal artery after passing through the obturator canal.", "answer": false, "explanation": "The adductor hiatus, a gap in adductor magnus, is exactly where this name change occurs."}, {"id": 987, "topic": "LumbosacralPlexus", "statement": "The sciatic nerve is composed of the tibial and common peroneal nerves bound together within a single connective tissue sheath.", "answer": true, "explanation": "The sciatic nerve is essentially two nerves (tibial and common peroneal) traveling together until they typically split near the popliteal fossa."}, {"id": 988, "topic": "MedialThigh", "statement": "Adductor brevis and adductor longus originate from entirely different bones.", "answer": false, "explanation": "Both muscles share a pubic origin, consistent with the medial compartment's general attachment pattern."}, {"id": 989, "topic": "PopFossa", "statement": "The popliteal fossa's superolateral boundary is formed by semimembranosus.", "answer": false, "explanation": "Biceps femoris, the lateral hamstring, forms the superolateral wall of the popliteal fossa."}, {"id": 990, "topic": "AnteriorThigh", "statement": "Kicking a ball uses only vastus lateralis, with no other quadriceps involvement.", "answer": false, "explanation": "Rectus femoris's dual-joint crossing uniquely suits it for simultaneous hip flexion and knee extension movements."}, {"id": 991, "topic": "LumbosacralPlexus", "statement": "The pudendal nerve arises from the lumbar plexus and supplies the anterior thigh.", "answer": false, "explanation": "Pudendal nerve, S2-S4, is dedicated to perineal structures, distinct from the limb-supplying nerves of the plexus."}, {"id": 992, "topic": "MedialThigh", "statement": "Weakness of hip adduction after pelvic surgery should raise suspicion for obturator nerve injury.", "answer": true, "explanation": "Given the obturator nerve's role in adduction, its injury during pelvic surgery is the logical cause of new adduction weakness."}, {"id": 993, "topic": "LumbosacralPlexus", "statement": "A high sciatic nerve injury only affects sensation, with no motor deficit.", "answer": false, "explanation": "Because it's proximal to the tibial/common peroneal split, a high injury knocks out hamstrings plus the entire leg/foot below the knee."}, {"id": 994, "topic": "MedialThigh", "statement": "Groin strains typically involve gluteus maximus.", "answer": false, "explanation": "Adductor longus is the most commonly strained muscle in classic 'pulled groin' sports injuries."}, {"id": 995, "topic": "PopFossa", "statement": "The common peroneal nerve runs centrally down the middle of the popliteal fossa.", "answer": false, "explanation": "Common peroneal nerve tracks along biceps femoris's medial border, more lateral and superficial than the tibial nerve."}, {"id": 996, "topic": "FemoralTriangle", "statement": "Femoral line (central venous catheter) placement uses the NAVEL order to stay medial to the palpable femoral artery pulse when targeting the vein.", "answer": true, "explanation": "Because the vein lies medial to the artery in the NAVEL order, clinicians use the palpable arterial pulse as a landmark to safely access the vein."}, {"id": 997, "topic": "FemoralTriangle", "statement": "The femoral triangle's medial boundary is the medial border of adductor longus.", "answer": true, "explanation": "Adductor longus forms the medial wall, opposite sartorius laterally."}, {"id": 998, "topic": "MasteryLinks", "statement": "Studying musculature, nerve supply, and blood supply as completely separate topics is equally effective for exam preparation.", "answer": false, "explanation": "Integrated study of muscle-nerve-vessel relationships mirrors how clinical questions and vignettes are actually constructed."}, {"id": 999, "topic": "PopFossa", "statement": "A popliteal artery aneurysm is exceedingly rare compared to other peripheral aneurysms.", "answer": false, "explanation": "The popliteal artery is the most frequent site for peripheral arterial aneurysms."}, {"id": 1000, "topic": "LumbosacralPlexus", "statement": "The psoas major muscle, which the lumbar plexus lies within, is a hip flexor.", "answer": true, "explanation": "Psoas major, housing the lumbar plexus, is part of the iliopsoas group and flexes the hip."}, {"id": 1001, "topic": "PosteriorThigh", "statement": "The popliteal fossa's superomedial boundary is formed by the tendons of semitendinosus and semimembranosus.", "answer": true, "explanation": "These two medial hamstrings form the superomedial wall, while biceps femoris forms the superolateral wall."}, {"id": 1002, "topic": "PosteriorThigh", "statement": "Semitendinosus has a long, cord-like tendon, reflected in its name meaning 'half-tendon.'", "answer": true, "explanation": "The name semitendinosus directly describes its long, thin, cord-like tendon of insertion."}, {"id": 1003, "topic": "ClinicalHighYield", "statement": "Intramuscular injections into the gluteal region are given in the upper outer quadrant to avoid injuring the sciatic nerve.", "answer": true, "explanation": "The upper outer quadrant (or ventrogluteal site) keeps the needle away from the sciatic nerve, which runs through the lower/medial gluteal region."}, {"id": 1004, "topic": "ClinicalHighYield", "statement": "Total hip replacement performed via an anterior approach carries a higher risk of sciatic nerve injury than a posterior approach.", "answer": false, "explanation": "It is the posterior approach that passes close to the sciatic nerve beneath the short external rotators; the anterior approach carries lower sciatic risk."}, {"id": 1005, "topic": "ClinicalHighYield", "statement": "Meralgia paresthetica results from compression of the femoral nerve as it passes under the inguinal ligament.", "answer": false, "explanation": "Meralgia paresthetica is caused by compression of the lateral femoral cutaneous nerve, not the femoral nerve itself, near the ASIS."}, {"id": 1006, "topic": "ClinicalHighYield", "statement": "Meralgia paresthetica classically produces burning pain and numbness over the posterior thigh rather than the anterolateral thigh.", "answer": false, "explanation": "Meralgia paresthetica affects the lateral femoral cutaneous nerve's territory, which is the anterolateral thigh, not the posterior thigh."}, {"id": 1007, "topic": "ClinicalHighYield", "statement": "A posterior hip dislocation places the femoral nerve, artery, and vein at greater risk than an anterior dislocation does.", "answer": false, "explanation": "It is anterior dislocation that pushes the femoral head toward the anterior neurovascular bundle; posterior dislocation instead threatens the sciatic nerve."}, {"id": 1008, "topic": "ClinicalHighYield", "statement": "Femoral hernias emerge lateral to the femoral artery within the femoral sheath.", "answer": false, "explanation": "Femoral hernias actually emerge medial to the femoral vein, within the femoral canal, not lateral to the artery."}, {"id": 1009, "topic": "ClinicalHighYield", "statement": "The femoral pulse is palpated lateral to the pubic tubercle at the midpoint of a line from the ASIS to the pubic symphysis.", "answer": true, "explanation": "This midinguinal point overlies the femoral artery as it enters the thigh within the femoral triangle."}, {"id": 1010, "topic": "ClinicalHighYield", "statement": "The adductor canal (Hunter's canal) transmits the sciatic nerve alongside the femoral vessels toward the popliteal fossa.", "answer": false, "explanation": "The adductor canal carries the femoral artery, femoral vein, and saphenous nerve, not the sciatic nerve, which runs posteriorly in the thigh."}, {"id": 1011, "topic": "ClinicalHighYield", "statement": "Coronary artery bypass grafting commonly harvests the great saphenous vein because it is superficial, long, and expendable.", "answer": true, "explanation": "Its superficial course from the foot to the groin and adequate caliber make the great saphenous vein a standard CABG conduit."}, {"id": 1012, "topic": "ClinicalHighYield", "statement": "Varicose veins most often result from incompetent valves in the deep venous system rather than the superficial system.", "answer": false, "explanation": "Varicosities typically arise from incompetent valves in the superficial veins or their perforating connections to the deep system."}, {"id": 1013, "topic": "ClinicalHighYield", "statement": "A deep vein thrombosis most commonly originates in the femoral vein before propagating distally into the calf.", "answer": false, "explanation": "DVT most often originates in the calf veins and may propagate proximally toward the femoral vein, not the reverse."}, {"id": 1014, "topic": "ClinicalHighYield", "statement": "Homan's sign (calf pain on forced dorsiflexion) is a highly reliable, specific test for deep vein thrombosis.", "answer": false, "explanation": "Homan's sign is neither sensitive nor specific for DVT and is no longer recommended as a diagnostic maneuver."}, {"id": 1015, "topic": "ClinicalHighYield", "statement": "Intermittent claudication classically presents as cramping calf pain on walking that resolves quickly with rest.", "answer": true, "explanation": "This exertional, rest-relieved pattern reflects inadequate arterial supply to exercising leg muscles, typically from femoropopliteal disease."}, {"id": 1016, "topic": "ClinicalHighYield", "statement": "The popliteal artery is a rare site for peripheral aneurysm compared to the femoral or tibial arteries.", "answer": false, "explanation": "The popliteal artery is actually the most common site of peripheral arterial aneurysm outside the aorta."}, {"id": 1017, "topic": "ClinicalHighYield", "statement": "A ruptured Baker's cyst can mimic the clinical presentation of a deep vein thrombosis with calf swelling and pain.", "answer": true, "explanation": "Leaking synovial fluid tracks down the calf, producing a 'pseudo-thrombophlebitis' picture that can be mistaken for DVT."}, {"id": 1018, "topic": "ClinicalHighYield", "statement": "Common peroneal nerve palsy from fibular neck compression produces a high-stepping gait due to loss of ankle dorsiflexion.", "answer": true, "explanation": "Loss of tibialis anterior and other dorsiflexors causes foot drop, compensated for by exaggerated hip and knee flexion during swing phase."}, {"id": 1019, "topic": "ClinicalHighYield", "statement": "Habitually crossing the legs at the knee has no recognized association with peroneal nerve compression.", "answer": false, "explanation": "The nerve's superficial course around the fibular neck makes prolonged leg crossing a well-documented cause of compressive neuropathy there."}, {"id": 1020, "topic": "ClinicalHighYield", "statement": "Loss of sensation in the first dorsal web space of the foot suggests superficial peroneal nerve injury.", "answer": false, "explanation": "The first dorsal web space is the autonomous sensory zone of the deep peroneal nerve, not the superficial peroneal nerve."}, {"id": 1021, "topic": "ClinicalHighYield", "statement": "The superficial peroneal nerve supplies the first dorsal web space, while the deep peroneal nerve covers the rest of the dorsal foot.", "answer": false, "explanation": "It is the reverse: the deep peroneal nerve is restricted to the first web space, while the superficial peroneal nerve covers most of the dorsal foot."}, {"id": 1022, "topic": "ClinicalHighYield", "statement": "Tarsal tunnel syndrome results from compression of the tibial nerve as it passes behind the medial malleolus.", "answer": true, "explanation": "The tibial nerve is compressed under the flexor retinaculum at the tarsal tunnel, producing plantar foot pain and paresthesia."}, {"id": 1023, "topic": "ClinicalHighYield", "statement": "Anterior compartment syndrome of the leg poses little risk to the anterior tibial artery or deep peroneal nerve.", "answer": false, "explanation": "Both structures run within the tight anterior compartment, so rising pressure can compromise them, making this a surgical emergency."}, {"id": 1024, "topic": "ClinicalHighYield", "statement": "Pain out of proportion to the injury, and pain on passive stretch of the toes, are early warning signs of compartment syndrome.", "answer": true, "explanation": "These are classic early findings that should prompt urgent pressure measurement and possible fasciotomy before pulses are lost."}, {"id": 1025, "topic": "ClinicalHighYield", "statement": "Loss of a distal pulse is typically the earliest reliable sign of compartment syndrome.", "answer": false, "explanation": "Pulses are often preserved until late; disproportionate pain and pain on passive stretch appear earlier and are more reliable warning signs."}, {"id": 1026, "topic": "ClinicalHighYield", "statement": "Medial tibial stress syndrome ('shin splints') presents with sharply localized pain at a single point on the anterior tibial crest.", "answer": false, "explanation": "Shin splints classically cause diffuse pain along the posteromedial tibial border, not a sharply localized single point of tenderness."}, {"id": 1027, "topic": "ClinicalHighYield", "statement": "An Achilles tendon rupture produces a positive Thompson test, where squeezing the calf fails to produce plantarflexion.", "answer": true, "explanation": "Normally, calf squeeze passively plantarflexes the foot via an intact tendon; absence of this response indicates rupture."}, {"id": 1028, "topic": "ClinicalHighYield", "statement": "Achilles tendon rupture classically occurs in older, sedentary individuals during light daily activity rather than in athletes.", "answer": false, "explanation": "Achilles rupture classically occurs in middle-aged 'weekend warrior' athletes during sudden forceful push-off, not typically at rest."}, {"id": 1029, "topic": "ClinicalHighYield", "statement": "Plantar fasciitis classically causes sharp heel pain that is worst with the first steps in the morning.", "answer": true, "explanation": "Overnight contracture of the plantar fascia followed by sudden stretch on standing produces this classic 'first-step' pain pattern."}, {"id": 1030, "topic": "ClinicalHighYield", "statement": "A Morton's neuroma most commonly forms between the 1st and 2nd metatarsal heads.", "answer": false, "explanation": "Morton's neuroma most commonly forms in the 3rd-4th interspace, where the medial and lateral plantar digital nerves converge."}, {"id": 1031, "topic": "ClinicalHighYield", "statement": "Hallux valgus refers to medial deviation of the great toe at the first metatarsophalangeal joint.", "answer": false, "explanation": "In hallux valgus, the great toe deviates laterally toward the other toes, not medially."}, {"id": 1032, "topic": "ClinicalHighYield", "statement": "Developmental dysplasia of the hip is assessed clinically in newborns using the Ortolani and Barlow maneuvers.", "answer": true, "explanation": "These maneuvers detect a reducible dislocated hip (Ortolani) or a dislocatable hip (Barlow) by feeling for a clunk."}, {"id": 1033, "topic": "ClinicalHighYield", "statement": "Slipped capital femoral epiphysis typically involves anterior/superior displacement of the femoral head on the neck.", "answer": false, "explanation": "SCFE classically involves posteroinferior displacement of the epiphysis relative to the femoral neck, not anterior/superior."}, {"id": 1034, "topic": "ClinicalHighYield", "statement": "Legg-Calvé-Perthes disease is idiopathic avascular necrosis of the femoral head occurring in children, typically ages 4-8.", "answer": true, "explanation": "This is the classic age range and pathology for Legg-Calvé-Perthes disease, distinct from adult AVN causes."}, {"id": 1035, "topic": "ClinicalHighYield", "statement": "Septic arthritis of the hip in a young child is an orthopedic emergency because pressure buildup can compromise the retrograde blood supply to the femoral head.", "answer": true, "explanation": "Because the femoral head depends on vessels running along the neck within the capsule, an infected effusion can tamponade flow and cause AVN."}, {"id": 1036, "topic": "ClinicalHighYield", "statement": "Piriformis syndrome produces sciatic-like buttock and leg pain from compression of the sciatic nerve near or through the piriformis muscle.", "answer": true, "explanation": "Piriformis syndrome is a recognized cause of sciatica-mimicking symptoms due to the nerve's close anatomical relationship with the muscle."}, {"id": 1037, "topic": "ClinicalHighYield", "statement": "Injury to the superior gluteal nerve produces an inability to actively extend the hip.", "answer": false, "explanation": "Superior gluteal nerve injury weakens the abductors (gluteus medius/minimus), producing a Trendelenburg gait, not loss of extension."}, {"id": 1038, "topic": "ClinicalHighYield", "statement": "Injury to the inferior gluteal nerve weakens gluteus maximus, impairing forceful hip extension such as climbing stairs.", "answer": true, "explanation": "Gluteus maximus, supplied by the inferior gluteal nerve, is the prime mover for powerful hip extension activities."}, {"id": 1039, "topic": "ClinicalHighYield", "statement": "Obturator nerve entrapment or irritation has no recognized ability to cause referred knee pain.", "answer": false, "explanation": "Because the obturator nerve has articular branches to both the hip and knee, its irritation is a recognized cause of referred knee pain."}, {"id": 1040, "topic": "ClinicalHighYield", "statement": "Hip joint pathology can present as isolated knee pain due to shared innervation via the obturator and femoral nerves.", "answer": true, "explanation": "Referred pain from the hip to the knee is a well-recognized clinical trap, explained by overlapping nerve supply to both joints."}, {"id": 1041, "topic": "ClinicalHighYield", "statement": "A positive Trendelenburg test indicates weakness of the hip flexors on the stance leg.", "answer": false, "explanation": "A positive Trendelenburg test reflects weakness of the hip abductors (gluteus medius/minimus) on the stance leg, not the hip flexors."}, {"id": 1042, "topic": "ClinicalHighYield", "statement": "Genu recurvatum refers to restricted knee flexion rather than hyperextension.", "answer": false, "explanation": "Genu recurvatum specifically describes excessive knee hyperextension, not restricted flexion."}, {"id": 1043, "topic": "ClinicalHighYield", "statement": "Patellar dislocation most commonly occurs medially due to the pull of vastus medialis obliquus.", "answer": false, "explanation": "The patella most often dislocates laterally, because the pull of vastus lateralis and the shallow lateral trochlear slope favor lateral displacement."}, {"id": 1044, "topic": "ClinicalHighYield", "statement": "A palpable gap above the patella with inability to perform a straight leg raise suggests quadriceps tendon rupture.", "answer": true, "explanation": "Quadriceps tendon rupture disrupts the extensor mechanism, producing a suprapatellar gap and loss of active knee extension."}, {"id": 1045, "topic": "ClinicalHighYield", "statement": "Pes anserinus bursitis affects the insertion of biceps femoris and gastrocnemius on the proximal lateral tibia.", "answer": false, "explanation": "Pes anserinus involves sartorius, gracilis, and semitendinosus inserting on the proximal medial tibia, not biceps femoris/gastrocnemius laterally."}, {"id": 1046, "topic": "ClinicalHighYield", "statement": "Prepatellar bursitis ('housemaid's knee') is caused by repetitive overhead activity rather than kneeling.", "answer": false, "explanation": "Prepatellar bursitis results from repetitive kneeling and friction over the anterior patella, not overhead activity."}, {"id": 1047, "topic": "ClinicalHighYield", "statement": "A positive Ober's test suggests tightness of the iliotibial band.", "answer": true, "explanation": "Ober's test assesses IT band and tensor fasciae latae tightness by checking whether the hip stays abducted when released."}, {"id": 1048, "topic": "ClinicalHighYield", "statement": "An avulsion fracture of the tibial tuberosity in an adolescent athlete is associated with Osgood-Schlatter disease.", "answer": true, "explanation": "Repetitive quadriceps traction on the immature tibial tuberosity apophysis can cause pain or, in severe cases, avulsion in adolescents."}, {"id": 1049, "topic": "ClinicalHighYield", "statement": "A positive anterior drawer or Lachman test with a hemarthrosis after a pivoting injury strongly suggests ACL rupture.", "answer": true, "explanation": "This clinical triad (mechanism, laxity test, rapid swelling) is classic for an acute anterior cruciate ligament tear."}, {"id": 1050, "topic": "ClinicalHighYield", "statement": "The unhappy/terrible triad knee injury classically results from a medial force applied to a fully extended knee.", "answer": false, "explanation": "The terrible triad classically results from a lateral force on a planted, slightly flexed knee (valgus plus rotation), not a medial force on extension."}, {"id": 1051, "topic": "ClinicalHighYield", "statement": "Osteosarcoma most commonly arises near the metaphysis of long bones, especially around the knee.", "answer": true, "explanation": "The distal femur and proximal tibia, both near the knee, are the most common sites for osteosarcoma due to high growth-plate activity there."}, {"id": 1052, "topic": "ClinicalHighYield", "statement": "A varus thrust during gait suggests lateral compartment knee osteoarthritis rather than medial compartment disease.", "answer": false, "explanation": "A varus thrust reflects medial compartment collapse/osteoarthritis, causing the knee to buckle outward (varus) during stance."}, {"id": 1053, "topic": "ClinicalHighYield", "statement": "The popliteal fossa is a common site for a palpable pulse used to assess distal lower limb perfusion.", "answer": true, "explanation": "The popliteal artery pulse, palpated deep in the popliteal fossa with the knee flexed, is a key part of peripheral vascular examination."}, {"id": 1054, "topic": "ClinicalHighYield", "statement": "Absent dorsalis pedis and posterior tibial pulses with a cold, pale foot suggest acute limb ischemia requiring urgent evaluation.", "answer": true, "explanation": "These findings, especially with pain and paresthesia, indicate critically reduced arterial perfusion needing emergency vascular assessment."}, {"id": 1055, "topic": "ClinicalHighYield", "statement": "The dorsalis pedis pulse is palpated medial to the extensor hallucis longus tendon on the dorsum of the foot.", "answer": false, "explanation": "The dorsalis pedis pulse is classically palpated lateral to the extensor hallucis longus tendon, not medial to it."}, {"id": 1056, "topic": "ClinicalHighYield", "statement": "Diabetic peripheral neuropathy classically begins proximally at the hip and spreads distally toward the toes.", "answer": false, "explanation": "Length-dependent diabetic neuropathy affects the longest nerves first, so symptoms begin distally at the toes/feet, not proximally at the hip."}, {"id": 1057, "topic": "ClinicalHighYield", "statement": "Charcot foot deformity is unrelated to sensory loss and occurs equally in patients with normal protective sensation.", "answer": false, "explanation": "Charcot foot specifically arises from repeated unrecognized trauma in a foot with impaired protective sensation, such as in diabetic neuropathy."}, {"id": 1058, "topic": "ClinicalHighYield", "statement": "Claw toe deformity classically involves hyperextension at the metatarsophalangeal joint with flexion at both interphalangeal joints.", "answer": true, "explanation": "This combination distinguishes claw toe from hammer toe, which spares the distal interphalangeal joint."}, {"id": 1059, "topic": "ClinicalHighYield", "statement": "An ankle-foot orthosis is a recognized functional aid for compensating foot drop from common peroneal nerve injury.", "answer": true, "explanation": "An AFO holds the foot in a neutral/dorsiflexed position, preventing toe catching during the swing phase of gait in foot drop."}, {"id": 1060, "topic": "ClinicalHighYield", "statement": "Sciatica caused by lumbar disc herniation typically radiates pain along the distribution of the sciatic nerve into the posterior thigh and leg.", "answer": true, "explanation": "Nerve root compression contributing to the sciatic nerve produces radicular pain following its dermatomal/peripheral distribution."}, {"id": 1061, "topic": "ClinicalHighYield", "statement": "A positive straight leg raise test reproducing radicular leg pain supports a diagnosis of lumbar nerve root irritation.", "answer": true, "explanation": "Stretching the sciatic nerve and its contributing roots during the straight leg raise reproduces radicular symptoms when a root is irritated."}, {"id": 1062, "topic": "ClinicalHighYield", "statement": "Cauda equina syndrome presenting with saddle anesthesia and urinary retention can be safely managed conservatively without urgent surgery.", "answer": false, "explanation": "Cauda equina syndrome threatens permanent bowel, bladder, and lower limb function and requires urgent surgical decompression, not conservative management."}, {"id": 1063, "topic": "ClinicalHighYield", "statement": "The 'terrible triad' of the ankle refers to combined ACL, PCL, and meniscus injury.", "answer": false, "explanation": "The terrible triad is a knee injury pattern (MCL, ACL, medial meniscus); the ankle has no equivalently named 'terrible triad'."}, {"id": 1064, "topic": "ClinicalHighYield", "statement": "A high ankle (syndesmotic) sprain typically takes longer to heal than a typical lateral ligament ankle sprain.", "answer": true, "explanation": "Because the syndesmosis is critical for ankle mortise stability, syndesmotic injuries generally require longer recovery than lateral sprains."}, {"id": 1065, "topic": "ClinicalHighYield", "statement": "The external rotation (Kleiger) test can help detect a syndesmotic ankle injury by reproducing pain with forced external rotation of the foot.", "answer": true, "explanation": "External rotation stresses the distal tibiofibular syndesmosis, reproducing pain when that ligament complex is injured."}, {"id": 1066, "topic": "ClinicalHighYield", "statement": "A positive squeeze test for syndesmotic injury involves compressing the medial and lateral malleoli directly together at the ankle.", "answer": false, "explanation": "The squeeze test compresses the tibia and fibula at mid-calf, transmitting force distally to reproduce pain — it is not performed directly at the malleoli."}, {"id": 1067, "topic": "ClinicalHighYield", "statement": "A calcaneal fracture from a fall from height is frequently associated with an accompanying lumbar spine compression fracture.", "answer": true, "explanation": "Axial loading transmitted up the skeleton during a fall onto the heels can also produce vertebral compression fractures, so the spine should be examined."}, {"id": 1068, "topic": "ClinicalHighYield", "statement": "Bilateral calcaneal fractures from a fall carry no meaningful association with thoracolumbar spinal injury.", "answer": false, "explanation": "The same axial loading mechanism causing bilateral heel fractures can transmit force to the spine, making concurrent evaluation important."}, {"id": 1069, "topic": "ClinicalHighYield", "statement": "Lisfranc injury may be subtle on plain X-ray and is suggested by even slight malalignment of the second metatarsal base relative to the middle cuneiform.", "answer": true, "explanation": "Because the second metatarsal base is the keystone of the Lisfranc joint, even minor displacement there is a critical diagnostic clue."}, {"id": 1070, "topic": "ClinicalHighYield", "statement": "Missing a Lisfranc injury rarely causes any long-term problems once the initial pain resolves.", "answer": false, "explanation": "Because Lisfranc injuries are easily overlooked, delayed diagnosis is a recognized cause of chronic midfoot instability and post-traumatic arthritis."}, {"id": 1071, "topic": "ClinicalHighYield", "statement": "A Jones fracture at the base of the 5th metatarsal has a high nonunion rate because it lies in a watershed area between two blood supplies.", "answer": true, "explanation": "The relatively poor vascularity at this junctional zone predisposes Jones fractures to delayed or non-union."}, {"id": 1072, "topic": "ClinicalHighYield", "statement": "March fractures (metatarsal stress fractures) most commonly affect the second and third metatarsal shafts.", "answer": true, "explanation": "These metatarsals bear repetitive load during push-off and are the most common sites of stress fracture in runners and recruits."}, {"id": 1073, "topic": "ClinicalHighYield", "statement": "Turf toe refers to hyperextension injury of the first metatarsophalangeal joint, common in athletes on artificial turf.", "answer": true, "explanation": "Turf toe is a sprain of the plantar plate/capsule of the first MTP joint from forced hyperextension, often on hard artificial surfaces."}, {"id": 1074, "topic": "ClinicalHighYield", "statement": "Podagra, the acute pain of gout at the first metatarsophalangeal joint, is caused by deposition of calcium pyrophosphate crystals.", "answer": false, "explanation": "Gout (podagra) is caused by monosodium urate crystal deposition; calcium pyrophosphate deposition causes pseudogout instead."}, {"id": 1075, "topic": "ClinicalHighYield", "statement": "Flexible flat feet in children are almost always pathological and require early surgical correction.", "answer": false, "explanation": "Flexible pes planus in children is usually a normal developmental variant that resolves with growth and rarely needs surgery."}, {"id": 1076, "topic": "ClinicalHighYield", "statement": "The saphenous nerve can be injured during great saphenous vein stripping or harvest procedures, causing medial leg numbness.", "answer": true, "explanation": "Because the saphenous nerve runs close to the great saphenous vein, especially below the knee, it is at risk during venous procedures."}, {"id": 1077, "topic": "ClinicalHighYield", "statement": "Varicose vein surgery at the saphenofemoral junction commonly risks direct injury to the femoral nerve.", "answer": false, "explanation": "The saphenofemoral junction is closer to the femoral vein and superficial inguinal structures; the femoral nerve lies more laterally and is not the primary risk there."}, {"id": 1078, "topic": "ClinicalHighYield", "statement": "Clinical signs alone, such as calf swelling and warmth, are considered sufficiently reliable to diagnose or exclude DVT without imaging.", "answer": false, "explanation": "Because clinical signs are unreliable for DVT, objective imaging such as compression ultrasound is required to confirm or exclude the diagnosis."}, {"id": 1079, "topic": "ClinicalHighYield", "statement": "May-Thurner syndrome involves compression of the left common iliac vein by the overlying right common iliac artery, predisposing to left-sided DVT.", "answer": true, "explanation": "This anatomical variant compresses the left iliac vein against the lumbar spine, a recognized cause of left-sided lower limb DVT."}, {"id": 1080, "topic": "ClinicalHighYield", "statement": "Compression stockings are contraindicated in patients with significant peripheral arterial disease because they can worsen limb ischemia.", "answer": true, "explanation": "Because compression can further reduce already-compromised arterial flow, ankle-brachial index should be checked before prescribing them."}, {"id": 1081, "topic": "ClinicalHighYield", "statement": "An ankle-brachial index above 1.4 always indicates completely normal, healthy arteries.", "answer": false, "explanation": "An abnormally high ABI can actually reflect non-compressible, calcified vessels (e.g., in diabetes), not necessarily normal arterial health."}, {"id": 1082, "topic": "ClinicalHighYield", "statement": "Buerger's disease (thromboangiitis obliterans) classically affects older patients with diabetes and hyperlipidemia.", "answer": false, "explanation": "Buerger's disease classically affects young to middle-aged smokers, distinct from typical atherosclerotic PAD risk factors."}, {"id": 1083, "topic": "ClinicalHighYield", "statement": "Neurogenic claudication from lumbar spinal stenosis typically improves with forward flexion (e.g., leaning on a shopping cart) unlike vascular claudication.", "answer": true, "explanation": "Flexion increases spinal canal diameter, relieving neurogenic claudication, whereas vascular claudication is unaffected by posture and relieved simply by rest."}, {"id": 1084, "topic": "ClinicalHighYield", "statement": "A positive Thomas test indicates a fixed flexion deformity of the hip, often from iliopsoas tightness or contracture.", "answer": true, "explanation": "The Thomas test flattens the lumbar lordosis to reveal a hip that cannot fully extend, indicating a flexion contracture."}, {"id": 1085, "topic": "ClinicalHighYield", "statement": "Femoral shaft fractures in non-ambulatory infants with no clear accidental history should raise concern for non-accidental injury.", "answer": true, "explanation": "Femoral fractures in non-ambulatory infants without a plausible mechanism are a recognized red flag warranting abuse screening."}, {"id": 1086, "topic": "ClinicalHighYield", "statement": "Fat embolism syndrome has no recognized association with long bone fractures such as the femoral shaft.", "answer": false, "explanation": "Fat embolism syndrome is a well-recognized complication after long bone fracture or intramedullary instrumentation, producing respiratory and neurological symptoms."}, {"id": 1087, "topic": "ClinicalHighYield", "statement": "A pelvic binder is applied at the level of the greater trochanters to help stabilize an unstable pelvic ring fracture.", "answer": true, "explanation": "Positioning the binder over the greater trochanters compresses the pelvic ring effectively, reducing volume and controlling hemorrhage."}, {"id": 1088, "topic": "ClinicalHighYield", "statement": "Hemorrhage from pelvic ring fractures always originates from a single, easily identified major artery.", "answer": false, "explanation": "Bleeding in unstable pelvic fractures frequently arises diffusely from venous plexuses and fracture surfaces, not a single identifiable artery."}, {"id": 1089, "topic": "ClinicalHighYield", "statement": "A 'watch and wait' approach is standard first-line management for a displaced femoral neck fracture in an elderly patient.", "answer": false, "explanation": "Displaced femoral neck fractures in the elderly are generally treated surgically (fixation or arthroplasty) due to poor healing potential and mobility concerns."}, {"id": 1090, "topic": "ClinicalHighYield", "statement": "Early mobilization after hip fracture surgery is associated with reduced mortality and complications in elderly patients.", "answer": true, "explanation": "Prompt mobilization reduces risks such as pneumonia, DVT, and pressure sores that are common after prolonged immobility in the elderly."}, {"id": 1091, "topic": "ClinicalHighYield", "statement": "Osteoarthritis of the knee classically causes morning stiffness lasting several hours, similar to rheumatoid arthritis.", "answer": false, "explanation": "Osteoarthritis typically causes brief morning stiffness (under 30 minutes), unlike the prolonged stiffness seen in inflammatory arthritis like RA."}, {"id": 1092, "topic": "ClinicalHighYield", "statement": "A Baker's cyst arises from herniation of synovial fluid into the semimembranosus-gastrocnemius bursa in the popliteal fossa.", "answer": true, "explanation": "This bursa communicates with the knee joint, allowing synovial fluid to distend it and form a palpable posterior knee swelling."}, {"id": 1093, "topic": "ClinicalHighYield", "statement": "A locked knee that cannot fully extend after a twisting injury suggests a displaced meniscal fragment blocking full extension.", "answer": true, "explanation": "A bucket-handle meniscal tear fragment can mechanically wedge in the joint, preventing full extension — a true mechanical locking sign."}, {"id": 1094, "topic": "ClinicalHighYield", "statement": "Osgood-Schlatter disease is most common in skeletally mature adult weightlifters rather than adolescent athletes.", "answer": false, "explanation": "Osgood-Schlatter is a traction apophysitis of growing adolescents during rapid growth spurts, not typically seen in skeletally mature adults."}, {"id": 1095, "topic": "ClinicalHighYield", "statement": "Sever's disease (calcaneal apophysitis) is a common cause of heel pain in active, growing children.", "answer": true, "explanation": "Repetitive traction on the immature calcaneal apophysis by the Achilles tendon in active children/adolescents causes this common heel pain syndrome."}, {"id": 1096, "topic": "ClinicalHighYield", "statement": "Labral tears of the hip typically present with posterior buttock pain only, with no association to clicking or catching.", "answer": false, "explanation": "Labral tears classically present with anterior groin pain and a mechanical clicking or catching sensation, not isolated posterior buttock pain."}, {"id": 1097, "topic": "ClinicalHighYield", "statement": "Genu valgum appearing physiologically around age 3-4 in an otherwise healthy child is a normal developmental pattern.", "answer": true, "explanation": "A transition from physiological genu varum in infancy to mild genu valgum around age 3-4 is a well-recognized normal growth pattern."}, {"id": 1098, "topic": "ClinicalHighYield", "statement": "Blount's disease is a pathological cause of progressive genu varum from abnormal growth at the proximal medial tibial physis.", "answer": true, "explanation": "Blount's disease disrupts normal growth at the medial tibial physis, producing progressive and often asymmetric bowing distinct from physiological varus."}, {"id": 1099, "topic": "ClinicalHighYield", "statement": "A positive McMurray test with a palpable/audible click during knee rotation and extension suggests a meniscal tear.", "answer": true, "explanation": "Combined rotation and extension stresses a torn meniscal fragment, producing the characteristic click/pain of a positive test."}, {"id": 1100, "topic": "ClinicalHighYield", "statement": "Rapid hemarthrosis within hours of a knee injury is more suggestive of an isolated meniscal tear than of a ligamentous or osteochondral injury.", "answer": false, "explanation": "Rapid, large hemarthrosis usually indicates a vascular structure was torn (e.g., ACL), since the central meniscus itself is relatively avascular."}, {"id": 1101, "topic": "ClinicalHighYield", "statement": "Modern injury series show isolated ACL tears are more common overall than the classic combined 'unhappy triad' pattern.", "answer": true, "explanation": "Modern series show isolated ACL injuries are more common than the classic combined MCL/ACL/meniscus triad originally described."}, {"id": 1102, "topic": "ClinicalHighYield", "statement": "A positive posterior sag sign, where the tibia appears to fall backward with the knee flexed, suggests PCL injury.", "answer": true, "explanation": "Loss of PCL restraint allows gravity to displace the tibia posteriorly relative to the femur, producing the visible posterior sag."}];

function getCbtLock(){

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

async function startSession(pool, size){
  const shuffled = shuffle(pool);
  sessionQueue = size ? shuffled.slice(0, size) : shuffled;
  currentIndex = 0;
  score = 0;
  answered = 0;
  wrongList = [];
  await renderQuestion();
}

async function renderQuestion(){
  if(currentIndex >= sessionQueue.length){
    renderEnd();
    return;
  }

  const cbtLockMod = await getCbtLock();
  if(cbtLockMod && typeof cbtLockMod.checkCbtAccess === 'function'){
    try{
      const access = await cbtLockMod.checkCbtAccess(CBT_ID);
      if(access.blocked){
        const root = document.getElementById('root');
        if(typeof cbtLockMod.renderCbtLockScreen === 'function'){
          cbtLockMod.renderCbtLockScreen(root, access.reason);
        }
        return;
      }
    }catch(e){ /* dormant/misconfigured lock never blocks the quiz */ }
  }

  selected = null;
  locked = false;
  const q = sessionQueue[currentIndex];
  const root = document.getElementById('root');
  const pct = Math.round((currentIndex / sessionQueue.length) * 100);
  root.innerHTML = `
    <div class="statbar">
      <div class="stat"><div class="num">${currentIndex+1}/${sessionQueue.length}</div><div class="lbl">Question</div></div>
      <div class="stat"><div class="num">${score}</div><div class="lbl">Correct</div></div>

  `;
}

}

function select(val){
  if(locked) return;
  selected = val;
  document.getElementById('btnTrue').classList.toggle('selected', val===true);
  document.getElementById('btnFalse').classList.toggle('selected', val===false);
  document.getElementById('lockBtn').classList.add('active');
}

async function lockIn(){
  if(selected===null || locked) return;
  locked = true;
  const q = sessionQueue[currentIndex];
  const isCorrect = (selected === q.answer);
  answered++;
  if(isCorrect){ score++; } else { wrongList.push({q, yourAnswer:selected}); }

  const _cbtLockMod = await getCbtLock();
  if(_cbtLockMod && typeof _cbtLockMod.recordCbtQuestionUsed === 'function'){
    try{ _cbtLockMod.recordCbtQuestionUsed(); }catch(e){ /* dormant/misconfigured lock never blocks the quiz */ }
  }

  document.getElementById('btnTrue').style.pointerEvents='none';
  document.getElementById('btnFalse').style.pointerEvents='none';
  document.getElementById('lockBtn').classList.remove('active');
  document.getElementById('lockBtn').style.display='none';

  const fz = document.getElementById('feedbackZone');
  fz.innerHTML = `
    <div class="feedback ${isCorrect ? 'correct' : 'wrong'}">
      <div class="feedback-head">${isCorrect ? '✓ CORRECT' : '✗ WRONG'} — Answer is ${q.answer ? 'TRUE' : 'FALSE'}</div>
      <div class="feedback-body">${q.explanation}</div>
    </div>
    <button class="next-btn" data-action="next">${currentIndex+1 >= sessionQueue.length ? 'FINISH SESSION' : 'NEXT QUESTION →'}</button>
  `;
}

async function nextQuestion(){
  currentIndex++;
  await renderQuestion();
}

function renderEnd(){
  const root = document.getElementById('root');
  const pct = answered ? Math.round((score/answered)*100) : 0;
  let verdict = "Keep grinding — repetition is how this sticks.";
  if(pct >= 90) verdict = "Monster level confirmed. This is exam-ready recall.";
  else if(pct >= 75) verdict = "Strong. Tighten up the weak spots below.";
  else if(pct >= 50) verdict = "Solid foundation — revisit the wrong ones and go again.";

  let reviewHtml = '';
  if(wrongList.length > 0){
    reviewHtml = `<div class="panel"><div style="font-family:'Trebuchet MS','Segoe UI',sans-serif;color:var(--ember2);margin-bottom:12px;">Review — ${wrongList.length} Missed</div>`;
    wrongList.forEach(item=>{
      reviewHtml += `
        <div class="review-item">
          <div class="rq">${item.q.statement}</div>
          <div class="ra">You answered <span class="your-ans">${item.yourAnswer ? 'TRUE' : 'FALSE'}</span> — correct is <span class="correct-ans">${item.q.answer ? 'TRUE' : 'FALSE'}</span></div>
          <div class="ra" style="margin-top:4px;">${item.q.explanation}</div>
        </div>
      `;
    });
    reviewHtml += `</div>`;
  }

  root.innerHTML = `
    <div class="panel end-screen">
      <div style="font-family:'Trebuchet MS','Segoe UI',sans-serif;font-weight:900;font-size:1.6rem;color:var(--gold);">${pct}%</div>
      <div style="color:var(--muted);margin:6px 0 4px 0;">${score} / ${answered} correct</div>
      <div style="font-size:0.9rem;color:var(--ember2);">${verdict}</div>
      <button class="big-btn" data-action="restart">RUN AGAIN</button>
    </div>
    ${reviewHtml}
  `;
}

let pendingSize = null;

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  if(action === 'pickmode'){
    pendingSize = parseInt(el.getAttribute('data-size'),10);
    document.querySelectorAll('.mode-card[data-action="pickmode"]').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('startQuizBtn').classList.add('active');
  }
  else if(action === 'startquiz'){
    if(pendingSize){ startSession(QUESTIONS, pendingSize); }
  }
  else if(action === 'bysession'){ renderSessionPicker(); }
  else if(action === 'back'){ renderStart(); }
  else if(action === 'startsession'){
    const topic = el.getAttribute('data-topic');
    const pool = QUESTIONS.filter(q => q.topic === topic);
    startSession(pool, pool.length);
  }
  else if(action === 'select'){ select(el.getAttribute('data-val') === 'true'); }
  else if(action === 'lockin'){ lockIn(); }
  else if(action === 'next'){ nextQuestion(); }
  else if(action === 'restart'){ renderStart(); }
});
(async function init(){
  renderStart();
})();
</script>
</body>
</html>
