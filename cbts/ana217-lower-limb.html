ility, increasing injury susceptibility, as seen with ankle plantarflexion."}, {"id": 15, "topic": "KneeJoint", "statement": "Cruciate ligaments are named according to their tibial attachment, not femoral.", "answer": true, "explanation": "ACL and PCL naming is based on where each attaches on the tibia (anterior vs posterior)."}, {"id": 16, "topic": "AnkleJoint", "statement": "The squeeze test is used to assess for a meniscus tear.", "answer": false, "explanation": "The squeeze test compresses the tibia and fibula together to elicit pain in syndesmotic injuries."}, {"id": 17, "topic": "HipJoint", "statement": "Developmental dysplasia of the hip involves an abnormally deep acetabulum.", "answer": false, "explanation": "DDH involves acetabular shallowness leading to instability/dislocation risk, screened for at birth."}, {"id": 18, "topic": "AnkleJoint", "statement": "Ankle joint movement (dorsiflexion/plantarflexion) occurs mainly between the talus and the tibia/fibula mortise.", "answer": true, "explanation": "The true ankle joint's dorsiflexion/plantarflexion motion happens at the talus-tibia/fibula articulation."}, {"id": 19, "topic": "Femur", "statement": "A branch of the obturator artery travels within the ligamentum teres to help supply the femoral head.", "answer": true, "explanation": "The obturator artery gives off a small branch that runs in the ligamentum teres to the femoral head."}, {"id": 20, "topic": "AnkleJoint", "statement": "The bony mortise is formed by the talus and calcaneus only.", "answer": false, "explanation": "The mortise is formed by tibial and fibular malleoli gripping the talus, not by the talus and calcaneus."}, {"id": 21, "topic": "AnkleJoint", "statement": "The CFL is a medial ankle ligament.", "answer": false, "explanation": "CFL is one of the three lateral ligaments, alongside ATFL and PTFL."}, {"id": 22, "topic": "KneeJoint", "statement": "The IT band inserts at Gerdy's tubercle on the tibia.", "answer": true, "explanation": "The il m bones — medial, intermediate, and lateral.", "answer": true, "explanation": "The cuneiforms come in a set of three: medial, intermediate, and lateral."}, {"id": 185, "topic": "HipBone", "statement": "The hip bone articulates with the sacrum at the pubic symphysis.", "answer": false, "explanation": "The sacroiliac joint connects the ilium to the sacrum; the pubic symphysis connects the two pubic bones to each other."}, {"id": 186, "topic": "PatellaTibiaFibula", "statement": "The patella's base is inferior, where the quadriceps tendon attaches.", "answer": false, "explanation": "The base of the patella, at the top, receives the quadriceps tendon."}, {"id": 187, "topic": "PatellaTibiaFibula", "statement": "Tibial shaft fractures are rare and almost always closed.", "answer": false, "explanation": "The tibia's subcutaneous position makes open (compound) fractures relatively common when the shaft breaks."}, {"id": 188, "topic": "Femur", "statement": "The linea aspera has distinguishable borders/lips that give attachment to different muscles.", "answer": true, "explanation": "The linea aspera has medial and lateral lips serving as separate attachment sites for different muscle groups."}, {"id": 189, "topic": "HipJoint", "statement": "Posterior hip dislocation classically occurs from falling backward onto an outstretched hand.", "answer": false, "explanation": "A flexed knee striking the dashboard drives the femur posteriorly out of the acetabulum in this classic mechanism."}, {"id": 190, "topic": "FootBones", "statement": "The navicular articulates with all three cuneiform bones distally.", "answer": true, "explanation": "The navicular sits between the talus and the three cuneiforms, articulating distally with all of them."}, {"id": 191, "topic": "Femur", "statement": "The femoral artery travels directly through the ligamentum teres.", "answer": false, "explanation": "The obturator artery gives off a small branch that runs in the ligamentum teres to the femoral head."}, ves the base of the first metatarsal and heals rapidly.", "answer": false, "explanation": "The Jones fracture at the 5th metatarsal base is notorious for delayed/non-union due to poor local blood supply."}, {"id": 208, "topic": "FootBones", "statement": "The Lisfranc joint refers to the tarsometatarsal joint complex, and Lisfranc injury can be a severe midfoot injury.", "answer": true, "explanation": "Lisfranc joint/injury specifically concerns the tarsometatarsal articulations of the midfoot."}, {"id": 209, "topic": "AnkleJoint", "statement": "The bony mortise of the ankle is formed by the medial malleolus, lateral malleolus, and posterior malleolus.", "answer": true, "explanation": "The mortise is formed by tibial and fibular malleoli gripping the talus, not by the talus and calcaneus."}, {"id": 210, "topic": "HipJoint", "statement": "The circumflex femoral arteries run only from the head down toward the shaft, never retrograde.", "answer": false, "explanation": "Their retrograde course up the neck is exactly why neck fractures can compromise the head's blood supply."}, {"id": 211, "topic": "KneeJoint", "statement": "The knee is a synovial hinge joint with a small amount of rotation allowed.", "answer": true, "explanation": "The knee is a modified hinge joint, permitting flexion/extension plus a small rotational component."}, {"id": 212, "topic": "PatellaTibiaFibula", "statement": "The patella articulates posteriorly with the femoral condyles at the patellofemoral joint.", "answer": true, "explanation": "The patella glides against the femoral trochlear groove/condyles, forming the patellofemoral joint, not a direct tibial articulation."}, {"id": 213, "topic": "CrossTopic", "statement": "The retrograde blood supply pattern seen in the scaphoid has a direct parallel in the femoral neck and talus of the lower limb, all at risk of avascular necrosis.", "answer": true, "explanation": "Scaphoid, femoral neck, and talus all share the theme of retrograde blood supply creating avascular necrosis risk after fracture."}, {"id": 214, "topic": "HipJoint", "statement": "The circumflex femoral arteries run retrograde up the femoral neck within the joint capsule.", "answer": true, "explanation": "Their retrograde course up the neck is exactly why neck fractures can compromise the head's blood supply."}, {"id": 215, "topic": "Femur", "statement": "Femoral neck fracture classically presents with a shortened, externally rotated limb.", "answer": true, "explanation": "The classic clinical description of a femoral neck fracture is limb shortening with external rotation."}, {"id": 216, "topic": "KneeJoint", "statement": "The PCL attaches to the anterior intercondylar area of the tibia.", "answer": false, "explanation": "The posterior cruciate ligament attaches posteriorly on the tibia, matching its name."}, {"id": 217, "topic": "PatellaTibiaFibula", "statement": "The patella articulates posteriorly with the tibia directly.", "answer": false, "explanation": "The patella glides against the femoral trochlear groove/condyles, forming the patellofemoral joint, not a direct tibial articulation."}, {"id": 218, "topic": "FootBones", "statement": "The navicular bone is located on the medial midfoot.", "answer": true, "explanation": "The navicular sits medially in the midfoot, between the talus and the cuneiforms."}, {"id": 219, "topic": "Femur", "statement": "The femur is the longest and strongest bone in the human body.", "answer": true, "explanation": "The femur is both the longest and strongest bone, built to bear the body's full weight."}, {"id": 220, "topic": "HipJoint", "statement": "The iliofemoral ligament is the weakest ligament in the human body.", "answer": false, "explanation": "The iliofemoral ligament is classically cited as the strongest ligament in the body, critical for standing posture."}, {"id": 221, "topic": "CrossTopic", "statement": "The lower limb's weight-bearing role explains why its joints (hip, knee, ankle) generally prioritize ity.", "answer": false, "explanation": "Both tests evaluate anterior tibial translation, which reflects ACL competence."}, {"id": 229, "topic": "HipBone", "statement": "The hip bone, together with the sacrum and coccyx, forms the bony pelvis.", "answer": true, "explanation": "The bony pelvis is a composite structure of the two hip bones plus the sacrum and coccyx posteriorly."}, {"id": 230, "topic": "KneeJoint", "statement": "Menisci are fibrocartilage structures that act as shock absorbers in the knee.", "answer": true, "explanation": "The menisci are fibrocartilaginous and function to absorb and distribute load across the knee joint."}, {"id": 231, "topic": "KneeJoint", "statement": "The popliteal fossa is bounded inferiorly by the quadriceps tendon.", "answer": false, "explanation": "The two heads of gastrocnemius form the inferior boundaries of the diamond-shaped popliteal fossa."}, {"id": 232, "topic": "HipJoint", "statement": "In Trendelenburg sign, the pelvis drops on the side opposite to the weak, standing leg.", "answer": true, "explanation": "The contralateral (opposite) pelvic drop, not the ipsilateral side, is the hallmark of a positive Trendelenburg sign."}, {"id": 233, "topic": "PatellaTibiaFibula", "statement": "The medial malleolus is a distal projection of the fibula.", "answer": false, "explanation": "The medial malleolus belongs to the distal tibia, forming the medial ankle prominence."}, {"id": 234, "topic": "HipJoint", "statement": "The hip joint is a synovial hinge joint.", "answer": false, "explanation": "The hip is a classic ball-and-socket joint, formed by the femoral head and acetabulum."}, {"id": 235, "topic": "PatellaTibiaFibula", "statement": "The tibial shaft is subcutaneous anteromedially, making it prone to direct injury.", "answer": true, "explanation": "The anteromedial tibial shaft lies directly under the skin with minimal muscle cover, explaining why shin injuries are so painful."}, {"id": 236, "topic": "AnkleJoint", "statement": mur", "statement": "The head of the femur forms about two-thirds of a sphere.", "answer": true, "explanation": "The femoral head is roughly two-thirds spherical, fitting into the acetabular socket."}, {"id": 244, "topic": "AnkleJoint", "statement": "The ankle joint is a synovial hinge joint.", "answer": true, "explanation": "The ankle (talocrural) joint is a hinge joint, primarily allowing dorsiflexion/plantarflexion."}, {"id": 245, "topic": "Femur", "statement": "The femoral neck is a classic fracture site in elderly, osteoporotic individuals.", "answer": true, "explanation": "Femoral neck fractures are extremely common in elderly osteoporotic patients, especially women."}, {"id": 246, "topic": "PatellaTibiaFibula", "statement": "The fibula is the main weight-bearing bone of the leg.", "answer": false, "explanation": "Nearly all body weight passes through the tibia; the fibula bears very little."}, {"id": 247, "topic": "FootBones", "statement": "Flat feet (pes planus) refers to a collapsed medial longitudinal arch.", "answer": true, "explanation": "Pes planus is defined by loss/collapse of the normal medial longitudinal arch."}, {"id": 248, "topic": "Femur", "statement": "The linea aspera is a rough ridge on the posterior femoral shaft giving attachment to adductor muscles.", "answer": true, "explanation": "The linea aspera runs down the posterior shaft and is the main attachment line for the adductor group."}, {"id": 249, "topic": "HipBone", "statement": "The obturator canal is located at the inferior part of the obturator foramen with no nerve passing through it.", "answer": false, "explanation": "The obturator nerve and vessels pass through the obturator canal at the superior aspect of the obturator foramen, en route to the medial thigh."}, {"id": 250, "topic": "FootBones", "statement": "There are a total of 10 phalanges in the foot.", "answer": false, "explanation": "2 (great toe) + 3x4 (other toes) = 14 phalanges, matching the hand's total."}, {"id": 251, "top ose-packed (least stable) position, making sprains more likely then."}, {"id": 303, "topic": "FootBones", "statement": "The talus is the only tarsal bone with no muscle or tendon attachments.", "answer": true, "explanation": "Uniquely among the tarsals, the talus has no direct muscle or tendon attachments — all its movement is passive."}, {"id": 304, "topic": "PatellaTibiaFibula", "statement": "A 'boot-top fracture' refers to a tibial and fibular shaft fracture at the level where a ski boot ends, common in skiing injuries.", "answer": true, "explanation": "This specific fracture pattern occurs at the boot-top level in skiing accidents, involving both leg bones."}, {"id": 305, "topic": "HipBone", "statement": "The linea terminalis has no role in dividing the pelvis into regions.", "answer": false, "explanation": "The pelvic brim, formed partly by the pectineal line and other structures, marks the boundary between the greater and lesser pelvis."}, {"id": 306, "topic": "PatellaTibiaFibula", "statement": "The intercondylar eminence of the tibia is the attachment site for the collateral ligaments only.", "answer": false, "explanation": "The intercondylar eminence, between the tibial condyles, anchors the cruciate ligaments and meniscal horns."}, {"id": 307, "topic": "PatellaTibiaFibula", "statement": "Osgood-Schlatter disease involves painful traction apophysitis at the tibial tuberosity in adolescents.", "answer": true, "explanation": "Repetitive quadriceps pull on the growing tibial tuberosity causes Osgood-Schlatter disease in adolescent athletes."}, {"id": 308, "topic": "FootBones", "statement": "The Achilles (calcaneal) tendon inserts onto the calcaneus.", "answer": true, "explanation": "The Achilles tendon, from gastrocnemius/soleus, inserts on the posterior calcaneus."}, {"id": 309, "topic": "AnkleJoint", "statement": "Ankle sprains classically present with swelling over the medial malleolus regardless of which ligament is torn.", "answer": false, "explanation": " ascular necrosis of the femoral head.", "answer": true, "explanation": "Because the main supply runs retrograde up the neck, a fracture there can cut off flow to the head, causing avascular necrosis."}, {"id": 333, "topic": "HipBone", "statement": "The superior and inferior pubic rami are parts of the pubis.", "answer": true, "explanation": "Both pubic rami, by definition, belong to the pubic bone."}, {"id": 334, "topic": "AnkleJoint", "statement": "The medial malleolus being longer than the lateral provides resistance to eversion.", "answer": false, "explanation": "The longer lateral malleolus acts as a bony block limiting eversion further."}, {"id": 335, "topic": "HipJoint", "statement": "The three extracapsular ligaments of the hip spiral around the femoral neck.", "answer": true, "explanation": "Their spiral course is exactly what allows them to tighten progressively as the hip extends."}, {"id": 336, "topic": "PatellaTibiaFibula", "statement": "The patella's base is superior, where the quadriceps tendon attaches.", "answer": true, "explanation": "The base of the patella, at the top, receives the quadriceps tendon."}, {"id": 337, "topic": "Femur", "statement": "The linea aspera is a single smooth line with no distinguishable borders.", "answer": false, "explanation": "The linea aspera has medial and lateral lips serving as separate attachment sites for different muscle groups."}, {"id": 338, "topic": "PatellaTibiaFibula", "statement": "The fibular head articulates with the tibia at the proximal tibiofibular joint.", "answer": true, "explanation": "The proximal tibiofibular joint connects the fibular head to the lateral tibial condyle region, not the femur."}, {"id": 339, "topic": "AnkleJoint", "statement": "The tibiofibular syndesmosis is a synovial joint allowing free rotation.", "answer": false, "explanation": "The syndesmosis is fibrous, providing stability between the distal tibia and fibula rather than mobility."}, {"id": 340, "topic": "FootBones", "statement": "Tarsal bones are arranged in a single straight row.", "answer": false, "explanation": "The 7 tarsals form 3 functional rows/groups rather than a single line, unlike the two carpal rows."}, {"id": 341, "topic": "PatellaTibiaFibula", "statement": "The asymmetry between malleoli, with the lateral being longer, contributes to inversion sprains being more common than eversion sprains.", "answer": true, "explanation": "The longer lateral malleolus provides more bony resistance against eversion, making inversion injuries relatively more frequent."}, {"id": 342, "topic": "HipJoint", "statement": "The iliofemoral ligament ('Y-ligament of Bigelow') is the strongest ligament in the human body.", "answer": true, "explanation": "The iliofemoral ligament is classically cited as the strongest ligament in the body, critical for standing posture."}, {"id": 343, "topic": "Femur", "statement": "The intercondylar fossa is where the cruciate ligaments attach.", "answer": true, "explanation": "The cruciate ligaments (ACL, PCL) attach within the intercondylar fossa/notch of the femur."}, {"id": 344, "topic": "KneeJoint", "statement": "The PCL prevents anterior translation of the tibia relative to the femur.", "answer": false, "explanation": "The PCL resists the tibia sliding backward under the femur."}, {"id": 345, "topic": "PatellaTibiaFibula", "statement": "Osgood-Schlatter disease involves painful traction at the fibular head.", "answer": false, "explanation": "Repetitive quadriceps pull on the growing tibial tuberosity causes Osgood-Schlatter disease in adolescent athletes."}, {"id": 346, "topic": "AnkleJoint", "statement": "The ankle mortise fits most snugly in plantarflexion, making it the most stable position.", "answer": false, "explanation": "Because the talus is wider anteriorly, dorsiflexion wedges it most tightly into the mortise, maximizing stability."}, {"id": 347, "topic": "HipJoint", "statement": "Squatting is the position of maximum hip joint stability.", "answer": ritory."}, {"id": 676, "topic": "BloodSupplyLL", "statement": "The profunda femoris gives off perforating arteries that supply the posterior thigh (hamstring) muscles.", "answer": true, "explanation": "Perforating branches of profunda femoris pierce the adductor muscles to reach and supply the hamstring compartment."}, {"id": 677, "topic": "FemoralTriangle", "statement": "The femoral sheath encloses the femoral nerve as its primary content.", "answer": false, "explanation": "The femoral sheath specifically wraps the vessels and canal, excluding the femoral nerve which lies just lateral to it."}, {"id": 678, "topic": "LumbosacralPlexus", "statement": "Obturator nerve injury can occur due to obturator hernia or pelvic surgery.", "answer": true, "explanation": "These are the classic clinical scenarios for obturator nerve injury discussed alongside the medial thigh musculature."}, {"id": 679, "topic": "BloodSupplyLL", "statement": "The medial and lateral circumflex femoral arteries have no relationship to the hip joint's blood supply.", "answer": false, "explanation": "This is the same blood supply pathway discussed earlier with the femoral neck and hip joint, now placed in its full arterial context."}, {"id": 680, "topic": "FemoralTriangle", "statement": "Femoral hernias are more common in men.", "answer": false, "explanation": "Anatomical differences in pelvic width contribute to the higher incidence of femoral hernias in women."}, {"id": 681, "topic": "MasteryLinks", "statement": "Recognizing that gluteus medius/minimus (hip) and rotator cuff muscles (shoulder) both function as joint stabilizers alongside larger prime-mover muscles helps organize musculoskeletal learning around functional roles, not just isolated facts.", "answer": true, "explanation": "Both muscle groups serve a stabilizing role for their respective ball-and-socket joints, a useful cross-limb organizing principle."}, {"id": 682, "topic": "Gluteal", "statement": "The greater sciatic foramen has no relationship to piriformis.", "answer": false, "explanation": "Piriformis passes through the greater sciatic foramen, dividing it into suprapiriform and infrapiriform spaces through which different structures pass."}, {"id": 683, "topic": "Gluteal", "statement": "Gluteus maximus is supplied by the superior gluteal nerve.", "answer": false, "explanation": "Inferior gluteal nerve supplies gluteus maximus; superior gluteal nerve supplies medius and minimus."}, {"id": 684, "topic": "PosteriorLeg", "statement": "The Lachman test is the classic clinical test for Achilles tendon rupture.", "answer": false, "explanation": "The Thompson test involves squeezing the calf and observing for plantarflexion; the Lachman test is for the ACL."}, {"id": 685, "topic": "PopFossa", "statement": "Popliteal lymph nodes lie deep within the popliteal fossa along the vessels.", "answer": true, "explanation": "Deep popliteal lymph nodes accompany the popliteal vessels within the fossa."}, {"id": 686, "topic": "FemoralTriangle", "statement": "The roof of the femoral triangle is formed by fascia lata and superficial fascia.", "answer": true, "explanation": "The roof is fascial, not muscular, covering the triangle's contents superficially."}, {"id": 687, "topic": "PosteriorLeg", "statement": "Dysfunction or rupture of tibialis posterior is a common cause of acquired adult flatfoot deformity.", "answer": true, "explanation": "Because tibialis posterior dynamically supports the medial arch, its failure is a leading cause of adult-acquired flatfoot."}, {"id": 688, "topic": "PosteriorLeg", "statement": "The entire posterior leg compartment is supplied by the tibial nerve.", "answer": true, "explanation": "All superficial and deep posterior compartment muscles share tibial nerve innervation."}, {"id": 689, "topic": "PopFossa", "statement": "The common peroneal nerve's path through the popliteal fossa leads directly to its vulnerable position at the fibular neck.", "answer": true, "explanation": "Tracing the nerve from the popliteal fossa (along biceps femoris) to the fibular neck shows the direct anatomical continuity explaining its injury pattern there."}, {"id": 690, "topic": "LumbosacralPlexus", "statement": "The pudendal nerve arises from the sacral plexus with root value S2-S4 and supplies the perineum.", "answer": true, "explanation": "Pudendal nerve, S2-S4, is dedicated to perineal structures, distinct from the limb-supplying nerves of the plexus."}, {"id": 691, "topic": "PosteriorLeg", "statement": "The Achilles tendon is the thickest and strongest tendon in the human body.", "answer": true, "explanation": "Despite being extremely strong, the Achilles tendon can still rupture under sudden forceful loading."}, {"id": 692, "topic": "BloodSupplyLL", "statement": "The posterior tibial artery runs independently, unrelated to the tibial nerve's course.", "answer": false, "explanation": "The posterior tibial artery and nerve travel together through this specific anatomical bundle behind the medial malleolus."}, {"id": 693, "topic": "AnteriorThigh", "statement": "The iliotibial tract, though not a quadriceps muscle itself, works alongside the anterior thigh group for knee stability.", "answer": true, "explanation": "The IT band, tensioned by TFL and gluteus maximus, contributes to lateral knee stability alongside quadriceps function."}, {"id": 694, "topic": "MedialThigh", "statement": "Adductor brevis lies superficial to adductor longus.", "answer": false, "explanation": "Adductor brevis is positioned deep to the more superficial adductor longus in the medial thigh layering."}, {"id": 695, "topic": "AnteriorLeg", "statement": "Peroneus tertius is functionally related to the posterior compartment muscles.", "answer": false, "explanation": "Peroneus tertius is often described as a distal slip of extensor digitorum longus, reflecting a close developmental relationship."}, {"id": 696, "topic": "MedialThigh", "statement": "Groin strains, a common sports injury, typically involve adductor longus.", "answer": true, "explanation": "Adductor longus is the most commonly strained muscle in classic 'pulled groin' sports injuries."}, {"id": 697, "topic": "AnteriorLeg", "statement": "The anterior tibial artery runs alongside the deep peroneal nerve through the anterior leg compartment.", "answer": true, "explanation": "The anterior tibial artery and deep peroneal nerve travel together through the anterior compartment."}, {"id": 698, "topic": "PosteriorLeg", "statement": "Flexor digitorum longus extends the lateral four toes.", "answer": false, "explanation": "As a deep posterior compartment muscle, FDL flexes toes 2-5, mirroring FDP's role in the hand."}, {"id": 699, "topic": "IntrinsicFoot", "statement": "Adductor hallucis is found in the third plantar layer.", "answer": true, "explanation": "Adductor hallucis, along with flexor hallucis brevis and flexor digiti minimi brevis, occupies the third layer."}, {"id": 700, "topic": "PosteriorLeg", "statement": "The deep posterior compartment muscles include popliteus, flexor digitorum longus, flexor hallucis longus, and tibialis posterior.", "answer": true, "explanation": "The four deep-layer muscles are distinct from the three superficial (triceps surae + plantaris) muscles."}, {"id": 701, "topic": "Gluteal", "statement": "The superior gluteal nerve and vessels pass through the infrapiriform space (below piriformis).", "answer": false, "explanation": "Structures are classically divided by their passage above (superior gluteal) or below (sciatic, inferior gluteal, pudendal) piriformis."}, {"id": 702, "topic": "IntrinsicFoot", "statement": "Plantar fasciitis causes pain exclusively in the toes, never the heel.", "answer": false, "explanation": "Plantar fasciitis classically presents with heel pain that is characteristically worse upon first steps after rest."}, {"id": 703, "topic": "PosteriorThigh", "statement": "The hamstrings' primary actions are hip extension and knee flexion.", "answer": true, "explanation": "As the functional opposite of the quadriceps, the hamstrings extend the hip and flex the knee."}, {"id": 704, "topic": "Gluteal", "statement": "The sciatic nerve always passes directly through the center of piriformis with no variation.", "answer": false, "explanation": "Anatomical variation in the sciatic nerve's relationship to piriformis is well documented and clinically relevant to piriformis syndrome."}, {"id": 705, "topic": "PosteriorThigh", "statement": "Clinical hamstring tightness can contribute to altered pelvic tilt and lower back discomfort.", "answer": true, "explanation": "Tight hamstrings can pull on the pelvis, influencing posture and potentially contributing to lower back issues."}, {"id": 706, "topic": "MedialThigh", "statement": "Adductor brevis lies deep to adductor longus.", "answer": true, "explanation": "Adductor brevis is positioned deep to the more superficial adductor longus in the medial thigh layering."}, {"id": 707, "topic": "PosteriorThigh", "statement": "High sciatic nerve injury, such as from posterior hip dislocation, weakens all hamstring muscles.", "answer": true, "explanation": "Because the sciatic nerve (via its tibial and common peroneal divisions) supplies all hamstrings, high injury affects the whole group."}, {"id": 708, "topic": "AnteriorThigh", "statement": "Sartorius originates from the ischial tuberosity and inserts on the lateral tibia.", "answer": false, "explanation": "Sartorius runs from the ASIS diagonally across the thigh to the pes anserinus."}, {"id": 709, "topic": "MedialThigh", "statement": "The accessory obturator nerve, when present, may contribute partial innervation to pectineus.", "answer": true, "explanation": "An inconstant accessory obturator nerve can contribute a small supply to pectineus alongside the femoral nerve."}, {"id": 710, "topic": "AnteriorLeg", "statement": "The anterior tibial artery has no relationship to the deep peroneal nerve's course.", "answer": false, "explanation": "The anterior tibial artery and deep peroneal nerve travel together through the anterior compartment."}, {"id": 711, "topic": "LateralLeg", "statement": "Peroneus longus and peroneus brevis have different nerve supplies from each other.", "answer": false, "explanation": "Both lateral compartment muscles share superficial peroneal nerve innervation."}, {"id": 712, "topic": "PosteriorThigh", "statement": "Semitendinosus has a broad, membranous tendon.", "answer": false, "explanation": "The name semitendinosus directly describes its long, thin, cord-like tendon of insertion."}, {"id": 713, "topic": "AnteriorThigh", "statement": "Quadriceps tendon rupture has no effect on knee extension.", "answer": false, "explanation": "A ruptured quadriceps tendon disconnects the muscle from the patella, preventing active knee extension."}, {"id": 714, "topic": "BloodSupplyLL", "statement": "The popliteal artery is the deepest structure in the popliteal fossa, lying closest to the bone.", "answer": true, "explanation": "Unlike the cubital fossa's TAN order, in the popliteal fossa the artery is deepest, protected against the femur/tibia."}, {"id": 715, "topic": "FemoralTriangle", "statement": "Femoral hernias appear below and lateral to the pubic tubercle, distinguishing them from inguinal hernias which appear above and medial to it.", "answer": true, "explanation": "This positional distinction relative to the pubic tubercle is the classic way to differentiate femoral from inguinal hernias clinically."}, {"id": 716, "topic": "FemoralTriangle", "statement": "Cloquet's lymph node is located within the popliteal fossa.", "answer": false, "explanation": "Cloquet's node is a specifically named lymph node found within the femoral canal, part of the 'empty space/lymphatics' content of NAVEL."}, {"id": 717, "topic": "LumbosacralPlexus", "statement": "The lumbar plexus nerves have no relationship to the muscle groups already covered in this course.", "answer": false, "explanation": "This connection between nerve territory and previously learned musculature reinforces integrated understanding rather than isolated memorization."}, {"id": 718, "topic": "PosteriorLeg", "statement": "Plantaris is the largest and most powerful muscle in the posterior compartment.", "answer": false, "explanation": "Plantaris is notably small and absent in a significant portion of the population, unlike the bulky gastrocnemius and soleus."}, {"id": 719, "topic": "AnteriorThigh", "statement": "The pes anserinus is formed by the tendons of sartorius, gracilis, and semitendinosus.", "answer": true, "explanation": "'Say Grace before Tea' — Sartorius, Gracilis, semiTendinosus converge at the pes anserinus on the medial tibia."}, {"id": 720, "topic": "LateralLeg", "statement": "Common peroneal nerve injury at the fibular neck can cause combined loss of dorsiflexion and eversion.", "answer": true, "explanation": "Because the nerve splits into both deep (anterior) and superficial (lateral) branches near the fibular neck, injury there knocks out both compartments."}, {"id": 721, "topic": "LumbosacralPlexus", "statement": "The sacral plexus is formed from ventral rami of L1 to L4 exclusively.", "answer": false, "explanation": "The sacral plexus draws from L4-S4, overlapping with the lumbar plexus at L4 via the lumbosacral trunk."}, {"id": 722, "topic": "BloodSupplyLL", "statement": "Peripheral arterial disease is clinically assessed by checking the dorsalis pedis and posterior tibial pulses.", "answer": true, "explanation": "These two pulse points are the standard clinical checkpoints for assessing lower limb arterial supply."}, {"id": 723, "topic": "MedialThigh", "statement": "Gracilis inserts at the pes anserinus alongside sartorius and semitendinosus.", "answer": true, "explanation": "Gracilis is the medial compartment's contribution to the three-tendon pes anserinus insertion."}, {"id": 724, "topic": "LumbosacralPlexus", "statement": "The obturator nerve supplies the medial thigh  "topic": "PopFossa", "statement": "The popliteal vein is the deepest structure in the popliteal fossa.", "answer": false, "explanation": "The depth order in the popliteal fossa (artery deepest) is the reverse of the cubital fossa's TAN arrangement."}, {"id": 739, "topic": "PosteriorLeg", "statement": "Gastrocnemius crosses both the knee and ankle joints, unlike soleus which crosses only the ankle.", "answer": true, "explanation": "This is the key distinguishing feature between the two major calf muscles."}, {"id": 740, "topic": "AnteriorThigh", "statement": "Rectus femoris is the only quadriceps muscle that crosses both the hip and knee joints.", "answer": true, "explanation": "Rectus femoris originates from the AIIS (crossing the hip) uniquely among the four heads, allowing it to also flex the hip."}, {"id": 741, "topic": "MedialThigh", "statement": "Adductor magnus has a split nerve supply: the adductor part is supplied by the obturator nerve, and the hamstring part by the tibial nerve.", "answer": true, "explanation": "Adductor magnus's dual embryological origin gives it a unique split innervation — a top exam fact."}, {"id": 742, "topic": "Gluteal", "statement": "The sciatic nerve typically exits the pelvis below piriformis, though anatomical variants exist where it passes through or above the muscle.", "answer": true, "explanation": "Anatomical variation in the sciatic nerve's relationship to piriformis is well documented and clinically relevant to piriformis syndrome."}, {"id": 743, "topic": "LateralLeg", "statement": "Peroneus longus's tendon terminates behind the lateral malleolus with no further course.", "answer": false, "explanation": "Peroneus longus has a distinctive tendon path crossing the plantar surface, helping support the transverse arch."}, {"id": 744, "topic": "Gluteal", "statement": "Gluteus minimus lies superficial to gluteus maximus.", "answer": false, "explanation": "Gluteus minimus is the deepest of the three gluteal muscles, lying beneath art of the 'empty space/lymphatics' content of NAVEL."}, {"id": 759, "topic": "Gluteal", "statement": "Quadratus femoris shares its nerve supply with gluteus maximus.", "answer": false, "explanation": "The nerve to quadratus femoris is a distinct branch that also innervates inferior gemellus."}, {"id": 760, "topic": "PopFossa", "statement": "Popliteal lymph nodes are located in the anterior thigh, not the popliteal fossa.", "answer": false, "explanation": "Deep popliteal lymph nodes accompany the popliteal vessels within the fossa."}, {"id": 761, "topic": "LateralLeg", "statement": "The lateral leg compartment contains two muscles: peroneus longus and peroneus brevis.", "answer": true, "explanation": "Peroneus (fibularis) longus and brevis are the sole two muscles of the lateral compartment."}, {"id": 762, "topic": "PosteriorThigh", "statement": "The long head of biceps femoris crosses only the knee joint.", "answer": false, "explanation": "Like the other 'true' hamstrings, the long head originates from the ischial tuberosity, crossing both joints."}, {"id": 763, "topic": "PosteriorThigh", "statement": "Hamstring muscles have no role during running.", "answer": false, "explanation": "Hamstrings control leg deceleration during running, which is why they're prone to strain injuries during sprinting."}, {"id": 764, "topic": "MedialThigh", "statement": "Adductor magnus is the smallest and most anterior of the adductor muscles.", "answer": false, "explanation": "Adductor magnus is both the bulkiest adductor and positioned most posteriorly, bordering the hamstring compartment."}, {"id": 765, "topic": "BloodSupplyLL", "statement": "The anterior tibial artery pierces the interosseous membrane to enter the anterior leg compartment.", "answer": true, "explanation": "The anterior tibial artery must cross through the interosseous membrane to reach and supply the anterior compartment."}, {"id": 766, "topic": "AnteriorLeg", "statement": "Deep peroneal nerve injury classically presents with weakness in toe extension in addition to foot drop.", "answer": true, "explanation": "Since EDL and EHL are also deep peroneal territory, injury impairs both dorsiflexion and toe extension."}, {"id": 767, "topic": "PopFossa", "statement": "The small saphenous vein drains directly into the femoral artery.", "answer": false, "explanation": "This termination point of the small saphenous vein into the popliteal vein is a classic exam fact."}, {"id": 768, "topic": "Gluteal", "statement": "The greater sciatic foramen, through which most gluteal region nerves and vessels pass, is divided into compartments by piriformis.", "answer": true, "explanation": "Piriformis passes through the greater sciatic foramen, dividing it into suprapiriform and infrapiriform spaces through which different structures pass."}, {"id": 769, "topic": "PopFossa", "statement": "A Baker's cyst forms in the anterior thigh and has no association with knee pathology.", "answer": false, "explanation": "Baker's cysts are fluid-filled swellings specifically located in the popliteal fossa, frequently linked to intra-articular knee problems."}, {"id": 770, "topic": "BloodSupplyLL", "statement": "The posterior tibial artery is generally larger than the anterior tibial artery.", "answer": true, "explanation": "The posterior tibial artery, supplying the larger posterior compartment and sole, is the larger of the two tibial arteries."}, {"id": 771, "topic": "LateralLeg", "statement": "Both peroneal muscles pass behind the lateral malleolus before reaching their foot insertions.", "answer": true, "explanation": "The peroneal tendons take a characteristic retromalleolar (behind the lateral malleolus) course."}, {"id": 772, "topic": "IntrinsicFoot", "statement": "Quadratus plantae has no direct equivalent in the hand and corrects the oblique pull of flexor digitorum longus.", "answer": true, "explanation": "Quadratus plantae is a uniquely foot-specific muscle that redirects FDL's line of pull."}, {"id": he medial thigh skin."}, {"id": 780, "topic": "PosteriorThigh", "statement": "Hamstring muscles work eccentrically to decelerate the leg during the swing phase of running.", "answer": true, "explanation": "Hamstrings control leg deceleration during running, which is why they're prone to strain injuries during sprinting."}, {"id": 781, "topic": "LumbosacralPlexus", "statement": "The femoral nerve supplies the medial thigh adductor muscles.", "answer": false, "explanation": "Femoral nerve territory matches the anterior thigh compartment you already learned in musculature."}, {"id": 782, "topic": "Gluteal", "statement": "Gluteus medius originates from the ischial tuberosity and inserts on the lesser trochanter.", "answer": false, "explanation": "Gluteus medius runs from the lateral ilium to the greater trochanter, enabling hip abduction."}, {"id": 783, "topic": "PopFossa", "statement": "The popliteal fossa's superomedial boundary is formed by biceps femoris.", "answer": false, "explanation": "These two medial hamstrings form the superomedial wall of the popliteal fossa."}, {"id": 784, "topic": "AnteriorThigh", "statement": "The vastus medialis obliquus (VMO) helps stabilize the patella by pulling it medially.", "answer": true, "explanation": "VMO counteracts the natural lateral pull on the patella, and its weakness contributes to patellar maltracking."}, {"id": 785, "topic": "FemoralTriangle", "statement": "The femoral triangle's medial boundary is the medial border of sartorius.", "answer": false, "explanation": "Adductor longus forms the medial wall, opposite sartorius laterally."}, {"id": 786, "topic": "LateralLeg", "statement": "The primary action of the lateral leg compartment is inversion of the foot.", "answer": false, "explanation": "Eversion is the unifying action of the lateral compartment, opposite to tibialis anterior/posterior's inversion role."}, {"id": 787, "topic": "AnteriorLeg", "statement": "The anterior leg compartment is supplied entirely by the deep peroneal (fibular) nerve.", "answer": true, "explanation": "All four anterior compartment muscles share deep peroneal nerve supply, similar to the posterior forearm's single-nerve pattern."}, {"id": 788, "topic": "LumbosacralPlexus", "statement": "The superior gluteal nerve supplies gluteus maximus exclusively.", "answer": false, "explanation": "Superior gluteal nerve territory matches what you learned in gluteal musculature — medius, minimus, and TFL."}, {"id": 789, "topic": "IntrinsicFoot", "statement": "Quadratus plantae is supplied by the lateral plantar nerve.", "answer": true, "explanation": "Quadratus plantae, in the second plantar layer, is lateral plantar nerve territory."}, {"id": 790, "topic": "BloodSupplyLL", "statement": "The femoral artery becomes the popliteal artery after passing through the adductor hiatus.", "answer": true, "explanation": "The adductor hiatus, a gap in adductor magnus, is exactly where this name change occurs."}, {"id": 791, "topic": "MedialThigh", "statement": "The medial compartment of the thigh is primarily involved in hip adduction, with the obturator nerve as the dominant nerve supply.", "answer": true, "explanation": "Adduction is the unifying action of this compartment, matching its predominant obturator nerve innervation."}, {"id": 792, "topic": "LumbosacralPlexus", "statement": "Femoral nerve injury can result from pelvic fracture, femoral neck fracture, or psoas abscess.", "answer": true, "explanation": "These are classic causes of femoral nerve injury, given its course near the pelvis and proximal femur."}, {"id": 793, "topic": "PosteriorThigh", "statement": "High sciatic nerve injury has no effect on hamstring function.", "answer": false, "explanation": "Because the sciatic nerve (via its tibial and common peroneal divisions) supplies all hamstrings, high injury affects the whole group."}, {"id": 794, "topic": "PosteriorThigh", "statement": "Biceps femoris short head originates from the ischial tuberosity like the long head.", "answer": false, "explanation": "Because it doesn't cross the hip joint, the short head arises directly from the femoral shaft (linea aspera)."}, {"id": 795, "topic": "PopFossa", "statement": "The common peroneal nerve's path through the popliteal fossa has no relationship to its course at the fibular neck.", "answer": false, "explanation": "Tracing the nerve from the popliteal fossa (along biceps femoris) to the fibular neck shows the direct anatomical continuity explaining its injury pattern there."}, {"id": 796, "topic": "BloodSupplyLL", "statement": "The anterior leg compartment is especially vulnerable to compartment syndrome due to the anterior tibial artery and deep peroneal nerve running through it.", "answer": true, "explanation": "Its combination of fascial tightness and important neurovascular contents makes the anterior compartment the classic site for compartment syndrome."}, {"id": 797, "topic": "IntrinsicFoot", "statement": "Foot intrinsic muscles have no role in arch maintenance.", "answer": false, "explanation": "Both intrinsic muscles and connective tissue (like plantar fascia) contribute to dynamic and static arch support."}, {"id": 798, "topic": "IntrinsicFoot", "statement": "Flexor digiti minimi brevis in the foot acts on the little toe, analogous to its hand counterpart acting on the little finger.", "answer": true, "explanation": "As in the hand, this muscle specifically flexes the smallest digit — the little toe in the foot."}, {"id": 799, "topic": "MedialThigh", "statement": "Adductor magnus is the largest and most posterior of the adductor muscles.", "answer": true, "explanation": "Adductor magnus is both the bulkiest adductor and positioned most posteriorly, bordering the hamstring compartment."}, {"id": 800, "topic": "BloodSupplyLL", "statement": "The dorsalis pedis pulse is classically palpated behind the medial malleolus.", "answer": false, "explanation": "This specific location for the dorsalis pedis pulse is a standard clinical exam point for peripheral vascular assessment."}, {"id": 801, "topic": "MasteryLinks", "statement": "Musculature, nerve supply, and blood supply knowledge stands entirely independent of prior osteology and joint study.", "answer": false, "explanation": "The layered teaching approach — bones and joints first, then muscles, then nerves, then vessels — builds a complete, interconnected regional anatomy picture."}, {"id": 802, "topic": "AnteriorThigh", "statement": "Kicking a ball requires simultaneous hip flexion and knee extension, an action rectus femoris performs almost alone among the quadriceps.", "answer": true, "explanation": "Rectus femoris's dual-joint crossing uniquely suits it for simultaneous hip flexion and knee extension movements."}, {"id": 803, "topic": "MedialThigh", "statement": "Adductor longus, adductor brevis, gracilis, and obturator externus are all supplied by the obturator nerve.", "answer": true, "explanation": "These four muscles share straightforward obturator nerve innervation, unlike adductor magnus and pectineus."}, {"id": 804, "topic": "PosteriorLeg", "statement": "Deep vein thrombosis often forms in the calf muscle veins, particularly the soleal sinuses.", "answer": true, "explanation": "The soleal venous sinuses are a classic site of origin for calf DVTs, making calf swelling a clinical red flag."}, {"id": 805, "topic": "AnteriorLeg", "statement": "Tibialis anterior originates from the lateral tibial condyle and proximal tibial shaft.", "answer": true, "explanation": "Tibialis anterior's origin is primarily on the tibia, consistent with its name."}, {"id": 806, "topic": "Gluteal", "statement": "Quadratus femoris has its own dedicated nerve, which also supplies inferior gemellus.", "answer": true, "explanation": "The nerve to quadratus femoris is a distinct branch that also innervates inferior gemellus."}, {"id": 807, "topic": "PopFossa", "statement": "The popliteal fossa is diamond-shaped, bounded by hamstring tendons above and gastrocnemius heads below.", "answer": true, "explanation": "The classic diamond shape of the popliteal fossa is formed by the four muscular boundaries already described."}, {"id": 808, "topic": "MedialThigh", "statement": "Adductor longus originates from the body of the pubis and inserts on the middle third of the linea aspera.", "answer": true, "explanation": "Adductor longus's origin and insertion place it centrally within the adductor group's attachment pattern on the femur."}, {"id": 809, "topic": "MedialThigh", "statement": "Adductor brevis and adductor longus both originate from the pubis.", "answer": true, "explanation": "Both muscles share a pubic origin, consistent with the medial compartment's general attachment pattern."}, {"id": 810, "topic": "PosteriorLeg", "statement": "Popliteus 'unlocks' the knee from full extension by reversing the screw-home mechanism.", "answer": true, "explanation": "Popliteus initiates knee flexion from the locked extended position, the opposite action of the screw-home locking mechanism."}, {"id": 811, "topic": "IntrinsicFoot", "statement": "Extensor digitorum brevis is the only intrinsic foot muscle located on the dorsum of the foot.", "answer": true, "explanation": "EDB is unique among foot intrinsics for its dorsal location, supplied by the deep peroneal nerve."}, {"id": 812, "topic": "MasteryLinks", "statement": "The structures behind the medial malleolus have no clinical or vascular significance.", "answer": false, "explanation": "This single anatomical bundle explains both a named clinical syndrome and the arterial supply route into the plantar foot."}, {"id": 813, "topic": "IntrinsicFoot", "statement": "Tarsal tunnel syndrome can affect both the medial and lateral plantar nerves, since both arise from the tibial nerve passing through that region.", "answer": true, "explanation": "Because both plantar nerves branch from the tibial nerve near the tarsal tunnel, compression there can affect intrinsic foot muscle function broadly."}, {"id": 814, "topic": "LumbosacralPlexus", "statement": "The lumbar plexus lies embedded within the substance of psoas major, unlike the brachial plexus which lies in the neck/axilla region.", "answer": true, "explanation": "The lumbar plexus's location within psoas major is a distinguishing anatomical feature from the brachial plexus's more superficial neck/axilla course."}, {"id": 815, "topic": "AnteriorThigh", "statement": "Femoral nerve territory in the thigh includes only the hamstrings.", "answer": false, "explanation": "The femoral nerve's motor territory in the thigh covers the anterior compartment muscles, including pectineus at its border."}, {"id": 816, "topic": "AnteriorLeg", "statement": "Extensor hallucis longus flexes the great toe.", "answer": false, "explanation": "EHL specifically extends the great toe (hallux) while also assisting dorsiflexion."}, {"id": 817, "topic": "AnteriorLeg", "statement": "The anterior leg compartment is supplied entirely by the tibial nerve.", "answer": false, "explanation": "All four anterior compartment muscles share deep peroneal nerve supply, similar to the posterior forearm's single-nerve pattern."}, {"id": 818, "topic": "Gluteal", "statement": "Gluteus maximus is supplied by the inferior gluteal nerve.", "answer": true, "explanation": "Inferior gluteal nerve supplies gluteus maximus; superior gluteal nerve supplies medius and minimus."}, {"id": 819, "topic": "Gluteal", "statement": "Intramuscular gluteal injections are given in the upper outer quadrant of the buttock to avoid the sciatic nerve.", "answer": true, "explanation": "The upper outer quadrant is chosen specifically because it is farthest from the sciatic nerve's typical course."}, {"id": 820, "topic": "BloodSupplyLL", "statement": "Peripheral arterial disease has no standard pulse-based clinical assessment.", "answer": false, "explanation": "These two pulse points are the standard clinical checkpoints for assessing lower limb arterial supply."}, {"id" nts."}, {"id": 828, "topic": "LateralLeg", "statement": "The common peroneal nerve splits into deep and superficial peroneal nerves near the fibular neck.", "answer": true, "explanation": "This split occurs around the fibular neck, meaning injury there can affect both branches simultaneously."}, {"id": 829, "topic": "AnteriorThigh", "statement": "Femoral nerve injury causes loss of knee extension and sensory loss over the anteromedial thigh and leg via the saphenous nerve.", "answer": true, "explanation": "The saphenous nerve, a branch of the femoral nerve, supplies sensation to the medial leg, so femoral nerve injury affects this territory too."}, {"id": 830, "topic": "PosteriorThigh", "statement": "Hamstring tightness has no relationship to pelvic posture.", "answer": false, "explanation": "Tight hamstrings can pull on the pelvis, influencing posture and potentially contributing to lower back issues."}, {"id": 831, "topic": "PopFossa", "statement": "The popliteal fossa connects proximally to the adductor canal and distally to the deep posterior compartment of the leg.", "answer": true, "explanation": "The popliteal fossa serves as a central relay point, connecting the thigh's adductor canal above to the leg's deep posterior compartment below."}, {"id": 832, "topic": "BloodSupplyLL", "statement": "The anterior tibial artery is generally larger than the posterior tibial artery.", "answer": false, "explanation": "The posterior tibial artery, supplying the larger posterior compartment and sole, is the larger of the two tibial arteries."}, {"id": 833, "topic": "IntrinsicFoot", "statement": "The lateral plantar nerve supplies muscles analogous to the median nerve's territory in the hand.", "answer": false, "explanation": "Lateral plantar nerve is the foot's 'ulnar nerve equivalent,' with the larger intrinsic muscle territory."}, {"id": 834, "topic": "AnteriorThigh", "statement": "Sartorius is the shortest muscle in the human body.", "answer": false, "explanation": "Sart 848, "topic": "IntrinsicFoot", "statement": "Plantar fasciitis is a common cause of heel pain, often worse with the first steps in the morning.", "answer": true, "explanation": "Plantar fasciitis classically presents with heel pain that is characteristically worse upon first steps after rest."}, {"id": 849, "topic": "MedialThigh", "statement": "The hamstring part of adductor magnus originates from the ischial tuberosity and acts more like a hip extensor.", "answer": true, "explanation": "This portion of adductor magnus behaves functionally like a hamstring due to its ischial tuberosity origin and tibial nerve supply."}, {"id": 850, "topic": "MedialThigh", "statement": "Obturator hernia, a rare hernia through the obturator canal, can compress the obturator nerve and cause medial thigh pain (Howship-Romberg sign).", "answer": true, "explanation": "This rare hernia type, more common in elderly thin women, can directly compress the obturator nerve, producing characteristic pain."}, {"id": 851, "topic": "PosteriorThigh", "statement": "The popliteal fossa's superolateral boundary is formed by semimembranosus.", "answer": false, "explanation": "Biceps femoris, being the lateral hamstring, forms the superolateral boundary of the popliteal fossa."}, {"id": 852, "topic": "MedialThigh", "statement": "The adductor canal contains the sciatic nerve and popliteal artery.", "answer": false, "explanation": "The adductor canal runs from the femoral triangle apex to the adductor hiatus, carrying these three structures deep to sartorius."}, {"id": 853, "topic": "AnteriorLeg", "statement": "Common peroneal nerve injury at the fibular neck causes foot drop due to loss of the entire anterior compartment.", "answer": true, "explanation": "Since the deep peroneal nerve (a branch of common peroneal) supplies the whole anterior compartment, injury there causes foot drop."}, {"id": 854, "topic": "IntrinsicFoot", "statement": "Flexor hallucis brevis is supplied by the lateral plantar nerve.", " wer": true, "explanation": "Femoral nerve territory matches the anterior thigh compartment you already learned in musculature."}, {"id": 862, "topic": "MedialThigh", "statement": "Gracilis is the most superficial and medial of the adductor group muscles, running the full length of the thigh.", "answer": true, "explanation": "Gracilis is notably long and superficial, distinguishing it from the bulkier, shorter adductor muscles."}, {"id": 863, "topic": "FemoralTriangle", "statement": "The femoral pulse is palpated at the mid-inguinal point, the midpoint between the ASIS and the pubic symphysis.", "answer": true, "explanation": "The mid-inguinal point (not the midpoint of the inguinal ligament, a commonly confused landmark) is where the femoral artery is best palpated."}, {"id": 864, "topic": "MedialThigh", "statement": "The thigh has no fascial separation between its muscle compartments.", "answer": false, "explanation": "Intermuscular septa divide the thigh into anterior, medial, and posterior compartments, each with distinct nerve supply."}, {"id": 865, "topic": "LumbosacralPlexus", "statement": "The sacral plexus is formed from ventral rami of L4 to S4.", "answer": true, "explanation": "The sacral plexus draws from L4-S4, overlapping with the lumbar plexus at L4 via the lumbosacral trunk."}, {"id": 866, "topic": "LumbosacralPlexus", "statement": "Sensory loss over the posterior thigh can occur with sacral plexus or sciatic nerve pathology via the posterior cutaneous nerve of the thigh.", "answer": true, "explanation": "The posterior cutaneous nerve of thigh, a sacral plexus branch, supplies sensation to the posterior thigh skin."}, {"id": 867, "topic": "AnteriorThigh", "statement": "Vastus intermedius lies deep to rectus femoris.", "answer": true, "explanation": "Vastus intermedius is the deepest of the quadriceps heads, directly beneath rectus femoris."}, {"id": 868, "topic": "LumbosacralPlexus", "statement": "The superior gluteal nerve, arising from the sacral plexus, supplies gluteus medius, minimus, and tensor fasciae latae.", "answer": true, "explanation": "Superior gluteal nerve territory matches what you learned in gluteal musculature — medius, minimus, and TFL."}, {"id": 869, "topic": "BloodSupplyLL", "statement": "The external iliac artery becomes the femoral artery once it passes deep to the inguinal ligament.", "answer": true, "explanation": "The name change to 'femoral artery' occurs specifically as the vessel crosses under the inguinal ligament into the thigh."}, {"id": 870, "topic": "IntrinsicFoot", "statement": "The medial plantar nerve supplies muscles analogous to the median nerve's territory in the hand.", "answer": true, "explanation": "Medial plantar nerve is the foot's 'median nerve equivalent,' with a smaller, more medial territory."}, {"id": 871, "topic": "AnteriorLeg", "statement": "The deep peroneal nerve has no sensory territory anywhere in the foot.", "answer": false, "explanation": "The first dorsal web space is the classic sensory territory of the deep peroneal nerve, useful in clinical nerve assessment."}, {"id": 872, "topic": "BloodSupplyLL", "statement": "The posterior tibial artery divides into medial and lateral plantar arteries in the sole of the foot.", "answer": true, "explanation": "This division into plantar arteries occurs once the posterior tibial artery reaches the sole."}, {"id": 873, "topic": "LumbosacralPlexus", "statement": "There is no cutaneous sensory nerve supplying the posterior thigh from the sacral plexus.", "answer": false, "explanation": "The posterior cutaneous nerve of thigh, a sacral plexus branch, supplies sensation to the posterior thigh skin."}, {"id": 874, "topic": "FemoralTriangle", "statement": "The femoral nerve lies within the femoral sheath alongside the artery and vein.", "answer": false, "explanation": "This is a classic exam trap — only the artery, vein, and canal are enclosed within the femoral sheath, not the nerve."}, {"id": 875, "topic": "AnteriorLeg",
