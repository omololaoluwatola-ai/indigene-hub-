<style>
:root{
  --bg:#120a07; --bg2:#1a0f0a; --card:#1c110b; --line:#4a2a17;
  --fire:#ff6a1a; --fire2:#d4400f; --gold:#ffb347; --text:#f3e7dc; --mute:#b49a88;
  --ok:#2ecc71; --okbg:rgba(46,204,113,.12); --bad:#ff4d4d; --badbg:rgba(255,77,77,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#3a1a0b 0%,var(--bg) 55%) fixed;
  color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh;
  padding:20px 16px 40px;line-height:1.5;
}
#app{max-width:720px;margin:0 auto}
h1.brand{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--fire);text-align:center;
  letter-spacing:.08em;font-size:2.1rem;margin:8px 0 6px;text-shadow:0 0 18px rgba(255,106,26,.35)}
.sub{font-family:'Orbitron',sans-serif;text-align:center;color:var(--mute);font-size:.9rem;letter-spacing:.06em;margin:0 0 20px}
.panel{background:linear-gradient(180deg,var(--card),#150c08);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
.panel h2{font-family:'Orbitron',sans-serif;color:var(--gold);text-align:center;font-size:1.35rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run{background:#150c08;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer;transition:.15s}
.run .n{display:block;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold);font-size:1.5rem;margin-bottom:2px}
.run.sel{background:linear-gradient(135deg,var(--fire),var(--fire2));border-color:var(--gold);box-shadow:0 0 16px rgba(255,106,26,.35)}
.run.sel .n{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;cursor:pointer;
  background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-family:'Exo 2',sans-serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.03em;box-shadow:0 8px 22px rgba(255,106,26,.28)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#150c08;border:1px solid var(--line);color:var(--text);box-shadow:none}
.foot{color:var(--mute);text-align:center;font-size:.92rem;margin-top:16px}
.chaps{margin-top:14px;display:none}
.chaps.show{display:block}
.chaps .tools{display:flex;gap:8px;margin-bottom:8px}
.chaps .tools button{flex:1;background:#150c08;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;font-weight:600;cursor:pointer}
.chap{display:flex;align-items:center;gap:10px;background:#150c08;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.chap.on{border-color:var(--gold);background:#24140c}
.chap .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#000}
.chap.on .box{background:var(--gold);border-color:var(--gold)}
.chap .nm{flex:1;font-size:.98rem}
.chap .ct{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.85rem}

/* progress + sections */
.secs{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px 4px}
.sec{border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:20px;padding:5px 11px;font-size:.82rem;cursor:pointer;font-family:inherit}
.sec.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
details.cres{border:1px solid var(--line);background:#150c08;border-radius:14px;margin-top:10px}
details.cres>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.cres>summary::-webkit-details-marker{display:none}
.cres .sr,.revise .sr{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.cres .sr{padding:8px 14px;border-top:1px solid var(--line)}
.revise{border:1px solid var(--bad);background:var(--badbg);border-radius:14px;padding:12px 14px;margin-top:14px}
.revise .sr{padding:6px 0}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--mute);margin-bottom:8px}
.top .sc{font-family:'Orbitron',sans-serif;font-size:.85rem}
.top .sc b.g{color:var(--ok)} .top .sc b.r{color:var(--bad)}
.bar{height:6px;background:#2a170d;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .25s}
.chtag{display:inline-block;font-size:.78rem;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);
  color:var(--text);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-family:inherit;font-size:1.02rem;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#2a170d;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem}
.opt:not(.locked):hover{border-color:var(--fire)}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .l{background:var(--ok);color:#001a0a}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#2a0000}
.fb{border:1px solid var(--line);border-left:4px solid var(--gold);background:#1a0f0a;border-radius:12px;padding:12px 14px;margin-top:6px}
.fb .v{font-weight:700;margin-bottom:6px}
.fb .v.ok{color:var(--ok)} .fb .v.no{color:var(--bad)}
.fb .trap{display:inline-block;background:var(--fire);color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.fb .ex{margin:0 0 8px}
.fb .hk{color:var(--gold);font-weight:600}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:12px;padding:13px 8px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.nav button.primary{background:linear-gradient(135deg,var(--fire),var(--fire2));border:0;color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

/* map */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.ov h3{font-family:'Orbitron',sans-serif;color:var(--gold);margin:0 0 10px;font-size:1.05rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:38px;border-radius:8px;border:1px solid var(--line);background:#150c08;color:var(--mute);font-family:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
.map button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.map button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--gold)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:10px 0}

/* result */
.big{font-family:'Orbitron',sans-serif;font-size:3rem;color:var(--gold);text-align:center;margin:6px 0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;color:var(--mute)}
.stats b{color:var(--text)}
.msg{text-align:center;color:var(--text);margin:8px 0 6px}
.rv{border:1px solid var(--line);background:#150c08;border-radius:14px;padding:12px 14px;margin-top:12px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .you{color:var(--bad)} .rv .cor{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a170d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1}
.pass{color:var(--ok)} .fail{color:var(--bad)} .na{color:var(--mute)}
.qimg{display:block;width:100%;height:auto;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#fff;margin:0 0 4px;cursor:zoom-in}
.tapnote{font-size:.75rem;color:var(--mute);margin:0 0 12px;text-align:center}
.iov{position:fixed;inset:0;background:#000;z-index:80;display:none;flex-direction:column}
.iov.show{display:flex}
.iov .bar2{display:flex;gap:8px;padding:10px;background:#120a07;border-bottom:1px solid var(--line)}
.iov .bar2 button{flex:1;border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:10px;padding:10px;font-family:inherit;font-weight:700;font-size:1rem}
.iov .scr{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;background:#fff}
.iov .scr img{display:block;width:100%;height:auto;max-width:none}
.hidden{display:none!important}
@media (max-width:420px){.q{font-size:1.08rem}h1.brand{font-size:1.8rem}}
</style>
</head>

se units?",["7","5","6","9"],0,"There are seven base units for seven base quantities.","Seven base units.",0,1,""],["The SI base unit of mass is the:",["Kilogram","Gram","Pound","Tonne"],0,"Mass has kilogram as its SI base unit, symbol kg.","Mass is kg, not g.",0,1,""],["The SI base unit of electric current is the:",["Volt","Ampere","Coulomb","Ohm"],1,"Current is measured in amperes. Volt, coulomb and ohm are not base units.","Current = ampere.",0,1,""],["The SI base unit of thermodynamic temperature is the:",["Celsius","Kelvin","Fahrenheit","Joule"],1,"Thermodynamic temperature (symbol T) uses the kelvin.","T goes with kelvin.",0,1,""],["The SI base unit of luminous intensity is the:",["Lumen","Candela","Lux","Watt"],1,"Luminous intensity is in candela.","Light intensity = candela.",0,1,""],["The SI base unit of amount of substance is the:",["Gram","Mole","Litre","Molecule"],1,"Amount of substance (symbol n) is in moles.","n goes with mole.",0,1,""],["The symbol for thermodynamic temperature in the SI table is:",["Small t","Capital T","K","θ"],1,"Small t is time. Capital T is thermodynamic temperature.","Capital T = temperature, small t = time.",0,1,""],["Which of these is NOT an SI base quantity?",["Velocity","Length","Electric current","Luminous intensity"],0,"Velocity is derived from displacement and time.","Anything with 'per' is derived.",0,1,""],["Quantities obtained from base quantities by algebraic relations are called:",["Fundamental quantities","Independent quantities","Standard quantities","Derived quantities"],3,"Derived quantities come from the base ones through equations.","Made from base = derived.",0,2,""],["Base quantities are said to have ___ units.",["Derived","Secondary","Relative","Fundamental"],3,"Base quantities have fundamental units. Derived quantities have derived units.","Base = fundamental.",0,2,""],["If displacement and time are base quantities, velocity is:",["A derived quantity","A base quantity","A fundamental unit","Dimensionless"], rror.",0,3,""],["How many significant figures does 5.00 have?",["3","1","2","0"],0,"Each zero has a non-zero digit to its left, so all count.","Zero after a non-zero digit counts.",0,3,""],["How many significant figures does 0.0005 have?",["4","3","2","1"],3,"The zeros have no non-zero digit to their left, so they do not count.","Leading zeros never count.",0,3,""],["How many significant figures does 1.0005 have?",["4","3","5","1"],2,"Every zero has the digit 1 to its left, so all five digits count.","Zeros trapped between digits count.",0,3,""],["A zero counts as significant if it has:",["A decimal point to its right","A non-zero digit to its right","Another zero beside it","A non-zero digit anywhere to its left"],3,"The rule: a non-zero digit anywhere to the left makes the zero significant.","Look left for a non-zero.",0,3,""],["To show three significant figures, 6000 is written as:",["6 × 10³","6.00 × 10³","6.0 × 10³","6 × 10⁴"],1,"6000 is not well defined. 6.00 × 10³ has three s.f. and 6 × 10³ has one.","Standard form fixes the count.",0,3,""],["The number 6 × 10³ has how many significant figures?",["2","1","3","4"],1,"Only the digit 6 is significant.","Count the digits before × 10.",0,3,""],["How many significant figures does 0.050 have?",["1","3","2","4"],2,"The leading zeros do not count. The 5 and the last 0 do.","Leading zeros out, trailing after 5 in.",0,3,""],["Precision refers to the:",["Reproducibility of replicate measurements","Closeness to the true value","Size of the absolute error","Number of significant figures"],0,"Precision is how close repeated measurements of the same quantity are to each other.","Precision = repeat agreement.",0,4,""],["Accuracy refers to the closeness of a measurement, or the mean of several, to the:",["Previous reading","True or accepted value","Instrument scale","Largest reading"],1,"Accuracy compares the result with the true or accepted value.","Accuracy = true value.",0,4,""],["In the archery target example, accuracy is :",["Sr","SrO","None","O₂"],3,"It takes the electrons.","Oxygen oxidises.",0,5,""],["The ion-electron method resolves a redox reaction into:",["Two neutralisations","An oxidation and a reduction half-reaction","Two precipitations","Three steps"],1,"They are balanced separately and then recombined.","Half-reactions.",0,5,""],["The ion-electron method of balancing a redox equation takes how many steps?",["Three","Six","Four","Eight"],1,"The book describes six steps.","Six steps.",0,5,""],["The first step in the ion-electron method is to:",["Write the skeletal equation and assign oxidation numbers","Add the electrons","Balance the charges","Add the half-reactions"],0,"Then separate into half-reactions.","Skeleton first.",0,5,""],["Balancing oxygen atoms in a half-reaction in acidic medium is done by adding:",["OH⁻","O₂","H₂","H₂O"],3,"H⁺ then balances the hydrogen.","Oxygen with water.",0,5,""],["Balancing hydrogen atoms in a half-reaction in acidic medium is done by adding:",["OH⁻","H₂","H₂O","H⁺"],3,"Then balance the charge with electrons.","Hydrogen with H⁺.",0,5,""],["In a basic medium, after adding H⁺ you add OH⁻ to both sides, then:",["Combine H⁺ and OH⁻ to form H₂O","Remove the OH⁻","Remove the H⁺","Add more H⁺"],0,"This is what the book does for MnO₄⁻.","H⁺ + OH⁻ = H₂O.",0,5,""],["The reduction half-reaction for Cr₂O₇²⁻ in acid is:",["Cr₂O₇²⁻ + 14H⁺ → 2Cr³⁺ + 7H₂O","Cr₂O₇²⁻ + 7H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O","Cr₂O₇²⁻ + 14H⁺ + 3e⁻ → 2Cr³⁺ + 7H₂O","Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O"],3,"Cr goes from +6 to +3 in each of two atoms, so 6 electrons.","6 electrons, 14 H⁺.",0,5,""],["The oxidation half-reaction for C → CO₂ in acid is:",["C + 2H₂O → CO₂ + 4H⁺ + 4e⁻","C + H₂O → CO₂ + 2H⁺ + 2e⁻","C + 2H₂O → CO₂ + 4H⁺","C + O₂ → CO₂ + 4e⁻"],0,"Carbon goes from 0 to +4, so 4 electrons.","4 electrons.",0,5,""],["To equalise the electrons for the Cr₂O₇²⁻ and C half-reactions, you multiply them by:",["2 and 3","1 and 1","3 and 2","6 and 4"],0,"12 electrons each.","2 and 3 make 12." try{ if(window.IndigeneHistory&&IndigeneHistory.registerStruct) IndigeneHistory.registerStruct('CHM101',{title:'CHM 101 \u00b7 Introductory Inorganic & Physical Chemistry',chapters:DATA.map(function(c){return {t:c.t,n:c.q.length,s:c.s};})}); }catch(e){}
const SUBJECT_KEY = 'chm101';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// flatten
const ALL = [];
DATA.forEach((c,ci)=>c.q.forEach((q,qi)=>ALL.push({id:ci+'_'+qi, ch:ci, stem:q[0], opts:q[1], ans:q[2], exp:q[3], hack:q[4], trap:q[5], sec:q[6], img:q[7]||''})));
const TOTAL = ALL.length;
// questions already served in earlier runs (kept per browser) so new runs favour fresh ones
let SEEN = new Set();
try{ SEEN = new Set(JSON.parse(localStorage.getItem('chm101_seen')||'[]')); }catch(e){}
function saveSeen(){ try{ localStorage.setItem('chm101_seen', JSON.stringify([...SEEN])); }catch(e){} }
// shuffle, then put unseen questions first (random order inside each half)
function freshFirst(arr){ const a=shuffle(arr.slice()); return a.filter(q=>!SEEN.has(q.id)).concat(a.filter(q=>SEEN.has(q.id))); }
const FULL_N = Math.min(500, TOTAL), HALF_N = Math.min(250, Math.floor(TOTAL/2));
// fair sample: every chapter is represented in proportion to its size
function sampleFair(n){
  const groups = DATA.map((_,ci)=>freshFirst(ALL.filter(q=>q.ch===ci)));
  const exact = groups.map(g=>g.length*n/TOTAL);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a,b)=>a+b,0);
  exact.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([f,i])=>{ if(left>0 && take[i]<groups[i].length){ take[i]++; left--; } });
  let out=[]; groups.forEach((g,i)=>{ out=out.concat(g.slice(0,take[i])); });
  return shuffle(out);
}

// optional access gate (cbt-lock.js) — never breaks the quiz if missing
let lock = null;
async function loadLock(){
  try { lock = await import('../cbt-lock.js'); }
  catch(e){ try { lock = await import('/cbt-lock.js'); } catch(e2){ lock = null; } }
}
const lockReady = loadLock();

const PASS = 50;
const grade = p => p>=70?'A':p>=60?'B':p>=50?'C':p>=45?'D':p>=40?'E':'F';
let mode = 'full', sel = new Set(), secSel = null, run = [], idx = 0, weakSpec = null;
// '2.3,4.all' = chapter 2 section 3, whole of chapter 4 (sent from the History tab or the result screen)
function specPool(spec){
  const want = spec.map(s=>s.split('.')); let pool = [];
  want.forEach(([c,s])=>{ const ci=(+c)-1; if(!DATA[ci]) return;
    pool = pool.concat(ALL.filter(q=>q.ch===ci && (s==='all' || q.sec===(+s)-1))); });
  pool = shuffle(pool); return pool.length>50 ? pool.slice(0,50) : pool;
}

function renderSetup(){
  const quick = 50, half = HALF_N;
  const cards = [
    ['full', FULL_N, 'Full CBT'],
    ['quick', quick, 'Quick Drill'],
    ['half', half, 'Half Run'],
    ['session', '🎯', 'By Chapter']
  ];
  $('runs').innerHTML = cards.map(c=>`<button class="run${c[0]===mode?' sel':''}" data-m="${c[0]}"><span class="n">${c[1]}</span>${c[2]}</button>`).join('');
  document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; renderSetup(); });
  $('chaps').classList.toggle('show', mode==='session');
  $('chapList').innerHTML = DATA.map((c,i)=>{
    const on = sel.has(i);
    let x = `<div class="chap${on?' on':''}" data-i="${i}"><span class="box" style="border-radius:50%">${on?'●':''}</span><span class="nm">Ch ${i+1}. ${esc(c.t)}</span><span class="ct">${c.q.length}</span></div>`;
    if(on){
      x += '<div class="secs"><button class="sec'+(secSel===null?' on':'')+'" data-s="all">Whole chapter · '+c.q.length+'</button>'
        + c.s.map((sn,si)=>'<button class="sec'+(secSel===si?' on':'')+'" data-s="'+si+'">'+esc(sn)+' · '+c.q.filter(q=>q[6]===si).length+'</button>').join('') + '</div>';
    }
    return x;
  }).join('');
  document.querySelectorAll('.chap').forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; sel.clear(); sel.add(i); secSel=null; renderSetup(); });
  document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{ secSel = b.dataset.s==='all' ? null : +b.dataset.s; renderSetup(); });
}

function makeItem(q){
  return { q, perm: shuffle([0,1,2,3]), pick: null };   // perm = order of original options shown 
}

async function startQuiz(){
  if(mode==='session' && sel.size===0){ toast('Pick a chapter first'); return; }
  try{ await lockReady; }catch(e){}
  if(lock && typeof lock.checkCbtAccess==='function'){
    try{
      const r = await lock.checkCbtAccess(SUBJECT_KEY);
      if(r && r.blocked){ lock.renderCbtLockScreen($('app'), r.reason); return; }
    }catch(e){}
  }
  let pool;
  if(mode==='full') pool = sampleFair(FULL_N);
  else if(mode==='quick') pool = freshFirst(ALL).slice(0,50);
  else if(mode==='half') pool = sampleFair(HALF_N);
  else if(mode==='weak') pool = specPool(weakSpec||[]);
  else {
    pool = [];
    [...sel].sort((a,b)=>a-b).forEach(ci=>{ pool = pool.concat(ALL.filter(q=>q.ch===ci && (secSel===null || q.sec===secSel))); });
  }
  if(!pool.length){ toast('Nothing to practise there'); return; }
  begin(pool);
}

let startedAt = 0, isRetry = false, saved = false;
let reviewing=false;
function begin(pool, retry){
  reviewing=false; $('finishBtn').textContent='Finish & see score';
  run = pool.map(makeItem); idx = 0; startedAt = Date.now(); isRetry = !!retry; saved = false;
  if(!retry){ pool.forEach(q=>SEEN.add(q.id)); if(SEEN.size >= TOTAL) SEEN = new Set(); saveSeen(); }
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  window.scrollTo(0,0);
  renderQ();
}

function counts(){
  let ok=0,no=0;
  run.forEach(it=>{ if(it.pick!==null){ it.pick===it.q.ans ? ok++ : no++; } });
  return {ok,no};
}

function renderQ(){
  const it = run[idx], q = it.q, c = counts();
  $('qpos').textContent = `Q ${idx+1} / ${run.length}`;
  $('sOk').textContent = c.ok; $('sNo').textContent = c.no;
  $('bar').style.width = ((c.ok+c.no)/run.length*100)+'%';
  $('chtag').textContent = `Ch ${q.ch+1} · ${DATA[q.ch].t}`;
  $('qtext').textContent = q.stem;
  $('qimg').innerHTML = q.img && IMGS[q.img] ? '<img class="qimg" id="qimgEl" src="'+IMGS[q.img]+'" alt="Figure for this question"><div class="tapnote">Tap the picture to open it full screen and zoom</div>' : '';
  if($('qimgEl')) $('qimgEl').onclick=()=>openImg(IMGS[q.img]);
  const L = ['A','B','C','D'];
  const answered = it.pick!==null || reviewing;
  $('opts').innerHTML = it.perm.map((oi,pos)=>{
    let cls='opt';
    if(answered){ cls+=' locked'; if(oi===q.ans) cls+=' correct'; else if(oi===it.pick) cls+=' wrong'; }
    return `<button class="${cls}" data-oi="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join('');
  if(!answered) document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  renderFb();
  $('prev').disabled = idx===0;
  $('next').textContent = idx===run.length-1 ? (reviewing?'Done ▶':'Finish ▶') : 'Next ▶';
}

function renderFb(){
  const it = run[idx], q = it.q;
  if(it.pick===null && !reviewing){ $('fb').innerHTML=''; return; }
  const good = it.pick===q.ans;
  const pos = 'ABCD'[it.perm.indexOf(q.ans)];
  $('fb').innerHTML = `<div class="fb">
    ${q.trap?'<span class="trap">⚠ TRAP QUESTION</span>':''}
    <div class="v ${good?'ok':'no'}">${good?'✅ Correct!':it.pick===null?'⏭ Skipped — the answer is '+pos:'❌ Not quite — the answer is '+pos}</div>
    <p class="ex">${esc(q.exp)}</p>
    <div class="hk">⏱ Speed hack: ${esc(q.hack)}</div>
  </div>`;
}

function choose(oi){
  const it = run[idx];
  if(it.pick!==null || reviewing) return;
  it.pick = oi;
  try{ if(lock && typeof lock.recordCbtQuestionUsed==='function') lock.recordCbtQuestionUsed(); }catch(e){}
  renderQ();
}

$('prev').onclick=()=>{ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0);} };
$('next').onclick=()=>{ if(idx<run.length-1){ idx++; renderQ(); window.scrollTo(0,0);} else if(reviewing) backToResult(); else finish(); };
function startReview(){
  reviewing=true; idx=0;
  $('finishBtn').textContent='Back to result';
  $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  renderQ(); window.scrollTo(0,0);
}
function backToResult(){ reviewing=false; $('finishBtn').textContent='Finish & see score'; finish(); }
$('finishBtn').onclick=()=>{
  if(reviewing){ backToResult(); return; }
  const left = run.filter(i=>i.pick===null).length;
  if(left===0){ finish(); return; }
  $('cmsg').textContent = left+' question(s) not answered yet. Finish anyway?';
  $('cov').classList.add('show');
};
$('cYes').onclick=()=>{ $('cov').classList.remove('show'); finish(); };
$('cNo').onclick=()=>$('cov').classList.remove('show');

function openMap(){
  $('map').innerHTML = run.map((it,i)=>{
    let c=''; if(it.pick!==null) c = it.pick===it.q.ans?'ok':'no';
    if(i===idx) c+=' cur';
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; $('ov').classList.remove('show'); renderQ(); window.scrollTo(0,0); });
  $('ov').classList.add('show');
}
$('mapBtn').onclick=openMap;
$('closeMap').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{ if(e.target.id==='ov') $('ov').classList.remove('show'); };

function saveHistory(c){
  if(saved || isRetry) return;
  const answered = c.ok + c.no;
  if(answered<=0) return;
  saved = true;
  try{
    if(window.IndigeneHistory && typeof window.IndigeneHistory.save==='function'){
      const topics = {};
      run.forEach(it=>{
        if(it.pick===null) return;
        const k = 'Ch '+(it.q.ch+1)+' · '+DATA[it.q.ch].s[it.q.sec];
        if(!topics[k]) topics[k]=[0,0];
        topics[k][1]++; if(it.pick===it.q.ans) topics[k][0]++;
      });
      window.IndigeneHistory.save({course:'CHM101', mode:'cbt', correct:c.ok, total:answered,
        secs:Math.round((Date.now()-startedAt)/1000), topics:topics});
    }
  }catch(e){}
}
function finish(){
  const c = counts(), n = run.length, un = n-c.ok-c.no;
  const pct = n? Math.round(c.ok/n*100):0;
  const msg = pct>=70?'Outstanding. You are ready for the exam. 🔥':pct>=50?'You passed. Keep pushing higher and clear every section.':pct>=40?'Close. Revise the failed sections and run again.':'Keep going. Read the failed sections again, then retry.';
  saveHistory(c);
  const chs = {}, secs = {};
  run.forEach(it=>{
    const q = it.q, good = it.pick===q.ans;
    const a = chs[q.ch] || (chs[q.ch] = {ok:0,n:0}); a.n++; if(good) a.ok++;
    const k = q.ch+'_'+q.sec; const b = secs[k] || (secs[k] = {ch:q.ch,sec:q.sec,ok:0,n:0}); b.n++; if(good) b.ok++;
  });
  const chKeys = Object.keys(chs).map(Number).sort((x,y)=>x-y);
  const pc = x => Math.round(x.ok/x.n*100);
  const need = ci => Math.max(8, Math.ceil(DATA[ci].q.length*0.4));
  const rows = chKeys.map(ci=>{
    const a = chs[ci], s = pc(a), full = a.n>=need(ci), ok = s>=PASS;
    const sr = Object.values(secs).filter(x=>x.ch===ci).sort((x,y)=>x.sec-y.sec).map(x=>`<div class="sr"><span>${esc(DATA[ci].s[x.sec])}</span><b class="${pc(x)>=PASS?'pass':'fail'}">${x.ok}/${x.n} · ${pc(x)}%</b></div>`).join('');
    return `<details class="cres"${(full&&!ok)?' open':''}><summary><span>Ch ${ci+1} · ${esc(DATA[ci].t)}</span><b class="${!full?'na':ok?'pass':'fail'}" style="white-space:nowrap">${s}/100 · ${grade(s)} · ${!full?'PRACTICE':ok?'PASS ✔':'FAIL ✖'}</b></summary>${sr}</details>`;
  }).join('');
  const weak = Object.values(secs).filter(x=>x.n>=2 && pc(x)<PASS).sort((x,y)=>x.ch-y.ch||x.sec-y.sec);
  const revise = weak.length ? `<div class="revise"><b>Revise these sections</b>${weak.map(x=>`<div class="sr"><span>Ch ${x.ch+1} · ${esc(DATA[x.ch].s[x.sec])}</span><b class="fail">${pc(x)}%</b></div>`).join('')}</div>` : '<p class="msg pass"><b>Every section in this run is at pass mark or above.</b></p>';
  const fullKeys = chKeys.filter(ci=>chs[ci].n>=need(ci));
  const passedN = fullKeys.filter(ci=>pc(chs[ci])>=PASS).length;
  const wrong = run.filter(it=>it.pick!==null && it.pick!==it.q.ans);
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  window.scrollTo(0,0);
  $('result').innerHTML = `
    <h2>Result</h2>
    <div class="big" style="font-size:2.2rem">${pct}/100 · ${grade(pct)}</div>
    <div class="stats"><span>Correct <b>${c.ok}</b></span><span>Wrong <b>${c.no}</b></span><span>Skipped <b>${un}</b></span><span>Total <b>${n}</b></span></div>
    <p class="msg"><b class="${pct>=PASS?'pass':'fail'}">${pct>=PASS?'PASS':'FAIL'}</b> · pass mark ${PASS}/100 · ${fullKeys.length?'chapters passed in this run '+passedN+'/'+fullKeys.length:'practice run, no chapter pass or fail'}</p>
    <p class="msg">${msg}</p>
    <h2 style="margin-top:16px">Score per chapter</h2>
    ${rows}
    <p class="msg" style="font-size:.8rem;color:var(--mute)">PRACTICE means this run had under 40% of that chapter's questions, so it shows a score but no pass or fail.</p>
    ${revise}
    ${weak.length?'<button class="btn" id="weakBtn">Practice these weak sections ('+weak.length+')</button>':''}
    <button class="btn" id="reviewBtn">Review answers${wrong.length?' ('+wrong.length+' wrong)':''}</button>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="/#history=CHM101">My history</a>
    ${wrong.length?`<button class="btn" id="retryWrong">Retry wrong answers (${wrong.length})</button>`:''}
    <button class="btn ghost" id="newRun">New run</button>
    `;
  $('reviewBtn').onclick=startReview;
  if($('weakBtn')) $('weakBtn').onclick=()=>{ weakSpec=weak.map(x=>(x.ch+1)+'.'+(x.sec+1)); mode='weak'; startQuiz(); };
  if($('retryWrong')) $('retryWrong').onclick=()=>begin(shuffle(wrong.map(w=>w.q)), true);
  $('newRun').onclick=()=>{ $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); renderSetup(); window.scrollTo(0,0); };
}

document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden') || $('ov').classList.contains('show') || $('cov').classList.contains('show')) return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ const it=run[idx]; if(it.pick===null){ choose(it.perm['abcd'.indexOf(k)]); } }
  else if(e.key==='ArrowRight') $('next').click();
  else if(e.key==='ArrowLeft') $('prev').click();
});

let zoom=100;
function setZoom(z){ zoom=Math.max(100,Math.min(400,z)); $('iimg').style.width=zoom+'%'; }
function openImg(src){ $('iimg').src=src; setZoom(100); $('iscr').scrollTo(0,0); $('iov').classList.add('show'); }
$('zIn').onclick=()=>setZoom(zoom+50); $('zOut').onclick=()=>setZoom(zoom-50);
$('zClose').onclick=()=>$('iov').classList.remove('show');
$('iimg').onclick=()=>setZoom(zoom>=200?100:200);
$('startBtn').onclick=startQuiz;
renderSetup();
try{
  const pr = new URLSearchParams(location.search).get('practice');
  if(pr && /^[\d.,all]+$/.test(pr)){ weakSpec = pr.split(',').filter(Boolean); mode='weak'; startQuiz(); }
}catch(e){}
</script>
