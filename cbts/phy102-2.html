<script>
const CHAPTERS=[[{"q":"Balloon B is known to be negatively charged. Balloon A is pulled towards B when they are brought close. What can you conclude about the charge on A?","c":"A is positive or neutral, since a neutral object is also pulled towards a charged one","w":["A is negative only, because unlike charges are the ones that attract each other","A is neutral only, because attraction between balloons needs no charge on A","A is positive only, because a neutral object can never be pulled by a charged one"],"e":"Attraction does not prove A is positive. A neutral object gets induced charges, the side near B becomes opposite to B, so it is pulled in too. That is why the table says 'positive or neutral'.","h":"Attraction can mean opposite OR neutral, so pick the option with 'or neutral'. Only repulsion proves a sign."},{"q":"Balloon C is pushed away from the negatively charged balloon B. What is the charge on C?","c":"C is negative, because only like charges repel and a neutral object cannot repel","w":["C is positive, because repulsion happens between unlike charges only","C is neutral, because repulsion happens when neither balloon is attracted","C is either positive or neutral, because both of them can push B away"],"e":"Repulsion is the only sure test. Neutral objects never repel, and unlike charges attract. So the only way C can be pushed away from a negative B is if C is also negative.","h":"Repel = same sign for sure. B negative and C repelled means C is negative. No calculation."},{"q":"Example 1.2: An object has a net charge of 8.0 × 10⁻¹⁹ C. How many electrons were removed to give this charge?","c":"5 electrons were removed","w":["5 electrons were added","8 electrons were removed","3 electrons were removed"],"e":"n = q/e = 8.0 × 10⁻¹⁹ ÷ 1.60 × 10⁻¹⁹ = 5. The charge is positive, so electrons left the object. Net charge is +5e.","h":"n = q ÷ 1.6×10⁻¹⁹. Just divide the mantissas: 8.0 ÷ 1.6 = 5. Positive charge means electrons left."},{"q":"Example 1.3: Why does a balloon rubbed with cloth stick to a wall?","c":"Its extra electrons push electrons in the wall away, leaving positive charges near the surface that attract the balloon","w":["The balloon becomes positive and pulls the wall's electrons straight onto its surface","The wall is a conductor, so it passes its own charge across to the balloon and holds it","The balloon and the wall carry the same charge, and a magnetic force holds them together"],"e":"Rubbing moves electrons onto the balloon, so it is negative. Near the wall, its excess electrons repel the electrons in the wall, so the wall surface is left slightly positive. Unlike charges attract, so the balloon sticks. This is charging by induction.","h":"Charged balloon induces opposite charge on the wall surface, then attracts. Pick 'induced charge'."},{"q":"Example 1.4: The electron and proton of a hydrogen atom are 5.3 × 10⁻¹¹ m apart. What is the magnitude of the electric force between them?","c":"8.2 × 10⁻⁸ N","w":["8.2 × 10⁻¹⁰ N","4.3 × 10⁻⁸ N","1.6 × 10⁻⁷ N"],"e":"F = ke²/r² = (8.99 × 10⁹)(1.60 × 10⁻¹⁹)² ÷ (5.3 × 10⁻¹¹)² = 8.2 × 10⁻⁸ N. The force is attractive because the charges are opposite.","h":"F = ke²/r². Use k×e² = 2.3×10⁻²⁸ N·m². Divide by r²: 2.3×10⁻²⁸ ÷ 2.8×10⁻²¹ ≈ 8.2×10⁻⁸ N."},{"q":"Two point charges exert a force F on each other. If the distance between them is doubled, what happens to the force?","c":"It drops to one quarter of F","w":["It drops to half of F","It rises to four times F","It stays equal to F"],"e":"F ∝ 1/r². Doubling r gives 1/2² = 1/4. Halving r would give four times the force.","h":"Double r → F ÷ 4. Halve r → F × 4. Just apply the inverse square."},{"q":"Example 1.5: q₁ = q₃ = 5.0 µC, q₂ = −2.0 µC, a = 0.10 m. What is the magnitude of F₂₃, the force of q₂ on q₃, and its direction?","c":"9.0 N, attractive, pointing towards q₂ (to the left)","w":["9.0 N, repulsive, pointing away from q₂ (to the right)","11.0 N, attractive, pointing towards q₂ (to the left)","4.5 N, attractive, pointing towards q₂ (to the left)"],"e":"F₂₃ = k|q₂||q₃|/a² = (8.99 × 10⁹)(2.0 × 10⁻⁶)(5.0 × 10⁻⁶) ÷ (0.1)² ≈ 9.0 N. q₂ and q₃ have opposite signs, so the force is attraction, towards q₂.","h":"Quick check F₂₃: 9×10⁹ × 2×5×10⁻¹² ÷ 0.01 = 9.0 N. The product of microcoulombs × 9×10³ ÷ r² works."},{"q":"Example 1.5 continued: What is the magnitude of F₁₃, the force of q₁ on q₃, which sits √2a away along the diagonal?","c":"11.0 N, repulsive, because both charges are positive and r² = 2a²","w":["22.0 N, repulsive, because the distance used is a and not √2a","5.5 N, attractive, because the diagonal doubles the distance","11.0 N, attractive, because q₁ and q₃ are both positive charges"],"e":"F₁₃ = k q₁q₃ / (√2 a)² = (8.99 × 10⁹)(5.0 × 10⁻⁶)² ÷ 2(0.1)² ≈ 11 N. Both are positive so the force is repulsive.","h":"The diagonal is √2·a so r² = 2a². Force is half of the one at distance a: 5×5 gives 22.5 ÷ 2 ≈ 11 N."},{"q":"Example 1.5 continued: F₁₃ = 11.0 N acts at 45° to the x-axis. What is its x-component, and what is the resultant x-component on q₃ after adding F₂₃ = 9.0 N pointing left?","c":"F₁₃ₓ = 7.9 N, so the resultant Fₓ = −1.1 N","w":["F₁₃ₓ = 7.9 N, so the resultant Fₓ = +16.9 N","F₁₃ₓ = 11.0 N, so the resultant Fₓ = +2.0 N","F₁₃ₓ = 5.5 N, so the resultant Fₓ = −3.5 N"],"e":"F₁₃ₓ = 11 cos 45° = 7.9 N to the right. F₂₃ = 9.0 N to the left, so Fₓ = 7.9 − 9.0 = −1.1 N. The y-component is only from F₁₃, which is 7.9 N.","h":"F₁₃ₓ = 11 × 0.707 = 7.9. Subtract the left pull 9.0. 7.9 − 9.0 = −1.1."},{"q":"Example 1.5 continued: What is the resultant force on q₃ written in unit-vector form?","c":"(−1.1 i + 7.9 j) N","w":["(+1.1 i + 7.9 j) N","(−7.9 i + 1.1 j) N","(−1.1 i − 7.9 j) N"],"e":"The x-part is 7.9 − 9.0 = −1.1 N and the y-part is 7.9 N, so F = (−1.1 i + 7.9 j) N.","h":"Both components come from 45°: 7.9 each. x = 7.9 − 9.0, y = 7.9. Write (−1.1 i + 7.9 j)."},{"q":"Exercise 1.2: Two positive charges q₁ = 15.0 µC at x = 2.00 m and q₂ = 6.00 µC at the origin. Where must a third charge q₃ sit on the x-axis for the net force on it to be zero?","c":"x = 0.775 m, between the two charges and closer to the smaller one","w":["x = −0.775 m, on the left of the smaller charge","x = 1.225 m, between the two charges and closer to the larger one","x = 3.44 m, on the right of the larger charge"],"e":"Both charges are positive, so outside them both forces push the same way and cannot cancel. The point has to be between them. Set k q₂/x² = k q₁/(2−x)². Then (2−x)/x = √(15/6) = 1.58, which gives x = 2/2.58 = 0.775 m.","h":"Same sign charges: the null point is between them, nearer the smaller. √(q₂/q₁) ratio: x = 2·√6/(√6+√15) ≈ 0.775 m."},{"q":"Exercise 1.3: Two identical charged spheres hang from strings of length 0.15 m, mass 3.0 × 10⁻² kg each, with θ = 5.0° to the vertical. Which pair of equations is used to find the charge?","c":"tan θ = Fₑ/mg and r = 2L sin θ, then Fₑ = kq²/r²","w":["sin θ = Fₑ/mg and r = L sin θ, then Fₑ = kq²/r²","tan θ = mg/Fₑ and r = 2L cos θ, then Fₑ = kq²/r²","cos θ = Fₑ/mg and r = L cos θ, then Fₑ = kq/r"],"e":"Balance forces: T cos θ = mg and T sin θ = Fₑ, so Fₑ = mg tan θ. The two spheres are 2L sin θ apart. Then put these in Coulomb's law to solve for q.","h":"Hanging spheres: write tanθ = Fₑ/mg first, and r = 2L sinθ. Those two lines solve every one of these."},{"q":"Exercise 1.3 (continued): Using Fₑ = mg tan 5.0° and r = 2(0.15) sin 5.0°, what is the charge on each sphere?","c":"4.4 × 10⁻⁸ C","w":["4.4 × 10⁻⁶ C","2.6 × 10⁻⁸ C","8.8 × 10⁻⁸ C"],"e":"Fₑ = (3.0 × 10⁻²)(9.8)(tan 5°) = 0.0257 N. r = 0.0261 m. Then q = r√(Fₑ/k) = 0.0261 × √(0.0257/8.99 × 10⁹) = 4.4 × 10⁻⁸ C.","h":"Fₑ = mg tanθ = 0.0257 N. r = 0.0261. q = r√(F/k). Do F/k first, then the root. Answer 4.4×10⁻⁸ C."},{"q":"Problem 1.1: Five charged particles lie evenly spaced on an axis. The middle one has the same charge in four situations. Situation (1): −e, −e, [middle], +e, −e. Situation (4): −e, +e, [middle], +e, −e. Which situation gives zero net force on the middle particle?","c":"Situation (4), because the left and right sides are mirror images and cancel","w":["Situation (1), because the nearest two charges are equal and cancel","Situation (3), because the signs on both sides add to zero","Situation (2), because the charges on the right are all positive"],"e":"In situation (4) the arrangement is symmetric: −e +e [ ] +e −e. The push from the left side is equal and opposite to the push from the right side, so the net force is zero.","h":"Symmetric arrangement (−e +e [ ] +e −e) cancels, so net force is zero. Look for the mirror image."},{"q":"Problem 1.1 (continued): Ranking the four situations by the magnitude of the net force on the middle particle, greatest first, gives","c":"3, 1, 2, 4","w":["1, 2, 3, 4","3, 2, 1, 4","4, 2, 1, 3"],"e":"Adding the field contributions in units of ke/d²: situation 3 gives 2.5, situation 1 gives 2.0, situation 2 gives 0.5, situation 4 gives 0. So the order is 3, 1, 2, 4.","h":"Rank by adding signed contributions in units of ke/d². The all-nearest-same-side case is biggest: 3, 1, 2, 4."},{"q":"Problem 1.2: Two identical spheres start with charges +6e and −4e, are touched together and separated. How much charge is transferred, and what does each sphere end with?","c":"5e is transferred and each sphere ends with +e","w":["5e is transferred and each sphere ends with +2e","10e is transferred and each sphere ends with +e","2e is transferred and each sphere ends with +2e"],"e":"The total is +6e − 4e = +2e and identical spheres share it equally, so each gets +e. The +6e sphere drops to +e, so it gave away 5e of charge.","h":"Total charge ÷ 2 for identical spheres: (+6 − 4)e ÷ 2 = +e each. Transfer = 6e − e = 5e."},{"q":"Problem 1.2 (continued): Pair (2) starts at 0 and +2e, and pair (3) starts at −12e and +14e. Ranking the three pairs by the charge transferred, greatest first, gives","c":"Pair 3, then pair 1, then pair 2","w":["Pair 1, then pair 2, then pair 3","Pair 2, then pair 1, then pair 3","Pair 3, then pair 2, then pair 1"],"e":"Pair (1): +e each, transfer 5e. Pair (2): total +2e, +e each, transfer e. Pair (3): total +2e, +e each, the +14e sphere gives up 13e. So 13e > 5e > e.","h":"Find each pair's total ÷ 2, then subtract from the start. Transfer is |start − final| of one sphere."},{"q":"Problem 1.3: What is the magnitude of the electric field at a point 2.0 m from a point charge q = 4.0 nC?","c":"9.0 N/C","w":["18 N/C","36 N/C","4.5 N/C"],"e":"E = kq/r² = (8.99 × 10⁹)(4.0 × 10⁻⁹) ÷ (2.0)² = 9.0 N/C.","h":"E = 9×10⁹ × q ÷ r². With q in nC use E = 9 × q(nC) ÷ r²(m²) = 9 × 4 ÷ 4 = 9.0 N/C."},{"q":"Problem 1.4: q₁ = +4.00 nC at x = 0, q₂ = −1.20 nC at x = 6.00 cm, q₃ = −2.00 nC at x = 4.00 cm. What is the total force on q₃?","c":"9.89 × 10⁻⁵ N in the −x direction","w":["9.89 × 10⁻⁵ N in the +x direction","8.99 × 10⁻⁶ N in the −x direction","1.0 × 10⁻⁵ N in the +x direction"],"e":"q₁ attracts q₃ towards the left: k(4)(2) × 10⁻¹⁸/(0.04)² = 4.50 × 10⁻⁵ N. q₂ is also negative so it repels q₃ to the left: k(1.2)(2) × 10⁻¹⁸/(0.02)² = 5.39 × 10⁻⁵ N. Both go left, so add: 9.89 × 10⁻⁵ N.","h":"Compute each force separately, then add or subtract by direction. Same direction? Add. Opposite? Subtract."},{"q":"Problem 1.5: q₁ = +4.00 nC at (0, 0.200 m), q₂ = −4.00 nC at the origin, q₃ = −1.50 nC at (0.250 m, 0). What is the x-component of the total force on q₃?","c":"4.52 × 10⁻⁷ N","w":["−4.11 × 10⁻⁷ N","8.63 × 10⁻⁷ N","1.29 × 10⁻⁶ N"],"e":"q₂ repels q₃ along +x: 8.63 × 10⁻⁷ N. q₁ attracts q₃ along the line to (0, 0.2). That force is 5.26 × 10⁻⁷ N and its x-part is −4.11 × 10⁻⁷ N. Add: 8.63 − 4.11 = 4.52 × 10⁻⁷ N.","h":"Do x and y components separately. x from q₂ minus the x part of q₁'s force. Draw the triangle (0.2, 0.25, 0.32)."},{"q":"Problem 1.5 (continued): What is the y-component of the total force on q₃?","c":"3.29 × 10⁻⁷ N, pointing up towards q₁","w":["3.29 × 10⁻⁷ N, pointing down away from q₁","5.26 × 10⁻⁷ N, pointing up towards q₁","−4.11 × 10⁻⁷ N, pointing down away from q₁"],"e":"Only q₁ has a y-component. F = 5.26 × 10⁻⁷ N and the y-part is F(0.200/0.3202) = 3.29 × 10⁻⁷ N. q₁ is positive and q₃ is negative so it is pulled up towards q₁.","h":"y comes only from q₁. y-part = F × (0.200/0.3202). Triangle ratio, no angles needed."},{"q":"Problem 1.6: For the force between q₁ = 26.0 µC and q₃ = −47.0 µC to be 5.70 N, what must their separation be?","c":"1.39 m","w":["1.93 m","0.52 m","3.86 m"],"e":"r = √(k|q₁q₃|/F) = √[(8.99 × 10⁹)(26.0 × 10⁻⁶)(47.0 × 10⁻⁶) ÷ 5.70] = √1.93 = 1.39 m.","h":"r = √(k·q₁q₃/F). Multiply the numbers under the root first, then take one root."},{"q":"Problem 1.7: A +3.00 × 10⁻⁶ C particle is 12.0 cm from a −1.50 × 10⁻⁶ C particle. What is the magnitude of the electrostatic force between them?","c":"2.81 N","w":["28.1 N","0.34 N","5.62 N"],"e":"F = kq₁q₂/r² = (8.99 × 10⁹)(3.00 × 10⁻⁶)(1.50 × 10⁻⁶) ÷ (0.120)² = 2.81 N. It is attractive.","h":"F = 9×10⁹ × 3×10⁻⁶ × 1.5×10⁻⁶ ÷ 0.0144 = 2.81 N. Convert cm to m first (12 cm = 0.12 m)."},{"q":"Problem 1.8: Particles 1 (q₁ at x = −a) and 2 (q₂ at x = +a) leave zero net force on particle 3 (+Q) at x = +0.500a. What is q₁/q₂?","c":"9","w":["−9","3","−25"],"e":"Particle 3 is 1.5a from q₁ and 0.5a from q₂. Particle 3 sits between them so for the forces to cancel, q₁ and q₂ have the same sign. q₁/(1.5a)² = q₂/(0.5a)², so q₁/q₂ = 2.25/0.25 = 9.","h":"Between the charges: same signs, so ratio is positive. q₁/q₂ = (1.5a)²/(0.5a)² = 9. Square the distance ratio."},{"q":"Problem 1.8(b): For particle 3 at x = +1.50a (outside the pair), the net force is zero. What is q₁/q₂?","c":"−25","w":["25","−5","5"],"e":"Particle 3 is 2.5a from q₁ and 0.5a from q₂. Outside the pair the two forces can only cancel if the charges have opposite signs. q₁/(2.5a)² = −q₂/(0.5a)², so q₁/q₂ = −6.25/0.25 = −25.","h":"Outside the pair: opposite signs, so negative. |q₁/q₂| = (2.5/0.5)² = 25, sign negative, giving −25."},{"q":"Problem 1.9: Two tiny water drops each carry −1.00 × 10⁻¹⁶ C and are 1.00 cm apart. What is the electrostatic force between them?","c":"8.99 × 10⁻¹⁹ N, repulsive","w":["8.99 × 10⁻¹⁵ N, repulsive","8.99 × 10⁻¹⁹ N, attractive","8.99 × 10⁻²³ N, repulsive"],"e":"F = (8.99 × 10⁹)(1.00 × 10⁻¹⁶)² ÷ (0.0100)² = 8.99 × 10⁻¹⁹ N. Same signs, so the force is a repulsion.","h":"Same sign gives repulsion. F = 9×10⁹ × (1×10⁻¹⁶)² ÷ 10⁻⁴ = 9×10⁻¹⁹ N."},{"q":"Problem 1.9(b): How many excess electrons are on each drop carrying −1.00 × 10⁻¹⁶ C?","c":"625 electrons","w":["6.25 × 10¹⁶ electrons","1600 electrons","160 electrons"],"e":"n = q/e = 1.00 × 10⁻¹⁶ ÷ 1.60 × 10⁻¹⁹ = 625 electrons.","h":"n = q ÷ e. 1.0×10⁻¹⁶ ÷ 1.6×10⁻¹⁹ = 1000 ÷ 1.6 = 625. Move the powers, then divide."},{"q":"Problem 1.10: How many electrons must be removed from a coin to leave it with a charge of +1.0 × 10⁻⁷ C?","c":"6.3 × 10¹¹ electrons","w":["1.6 × 10¹² electrons","6.3 × 10⁻¹² electrons","1.0 × 10¹⁹ electrons"],"e":"n = q/e = 1.0 × 10⁻⁷ ÷ 1.60 × 10⁻¹⁹ = 6.25 × 10¹¹, so about 6.3 × 10¹¹ electrons.","h":"n = 10⁻⁷ ÷ 1.6×10⁻¹⁹ = 6.25×10¹¹ ≈ 6.3×10¹¹. Divide 10 by 1.6 then fix the power."},{"q":"Problem 1.11: What is the magnitude of the electrostatic force between Na⁺ (+e) and Cl⁻ (−e) in a salt crystal when they are 2.82 × 10⁻¹⁰ m apart?","c":"2.89 × 10⁻⁹ N","w":["2.89 × 10⁻¹⁹ N","8.16 × 10⁻⁹ N","1.45 × 10⁻⁹ N"],"e":"F = ke²/r² = (8.99 × 10⁹)(1.60 × 10⁻¹⁹)² ÷ (2.82 × 10⁻¹⁰)² = 2.89 × 10⁻⁹ N. It is attractive.","h":"F = ke²/r². Use ke² = 2.3×10⁻²⁸: 2.3×10⁻²⁸ ÷ (2.82×10⁻¹⁰)² = 2.89×10⁻⁹ N."},{"q":"Problem 1.12: Two identical ions 5.0 × 10⁻¹⁰ m apart repel with a force of 3.7 × 10⁻⁹ N. What is the charge on each ion, and how many electrons are missing?","c":"3.2 × 10⁻¹⁹ C, so 2 electrons are missing","w":["3.2 × 10⁻¹⁹ C, so 1 electron is missing","1.6 × 10⁻¹⁹ C, so 1 electron is missing","6.4 × 10⁻¹⁹ C, so 4 electrons are missing"],"e":"q = r√(F/k) = (5.0 × 10⁻¹⁰)√(3.7 × 10⁻⁹/8.99 × 10⁹) = 3.2 × 10⁻¹⁹ C. Dividing by e gives 2. Positive ions, so 2 electrons are missing.","h":"q = r√(F/k). Then n = q ÷ e. 3.2×10⁻¹⁹ ÷ 1.6×10⁻¹⁹ = 2 exactly. A quick round number confirms it."},{"q":"What happens when a plastic comb is rubbed on hair?","c":"The comb collects electrons from the hair, so the comb is negative and the hair is positive","w":["The comb collects protons from the hair, so the comb is positive and the hair is negative","The comb loses electrons to the hair, so the comb is positive and the hair is negative","The comb creates new electrons from friction, so both comb and hair become negative"],"e":"Friction moves surface electrons from the hair to the comb. The comb has more electrons than protons, so it is negative. The hair is short of electrons, so it is positive. No charge is created.","h":"Rubbing moves electrons. The comb gets the extra electrons, so it is negative. Hair loses them."},{"q":"Which statement is the principle of conservation of charge?","c":"The algebraic sum of all electric charges in a closed system is constant","w":["The algebraic sum of all electric charges in a closed system always equals zero","Charges can be created from energy but never destroyed in a closed system","Charge is always shared equally between any two bodies that touch each other"],"e":"Charge is only moved from one object to another. It is neither created nor destroyed. The total stays constant, though not always zero.","h":"Conservation: total charge stays the same, only moves. Pick 'algebraic sum is constant'."},{"q":"Which of these is the correct charge and location of each subatomic particle?","c":"Proton +1.60 × 10⁻¹⁹ C in the nucleus; electron −1.60 × 10⁻¹⁹ C outside it; neutron no charge in the nucleus","w":["Proton −1.60 × 10⁻¹⁹ C outside the nucleus; electron +1.60 × 10⁻¹⁹ C inside it; neutron no charge outside it","Proton +1.60 × 10⁻¹⁹ C in the nucleus; electron no charge outside it; neutron −1.60 × 10⁻¹⁹ C in the nucleus","Proton +1.60 × 10⁻¹⁹ C in the nucleus; electron −9.11 × 10⁻³¹ C outside it; neutron no charge in the nucleus"],"e":"Protons and neutrons sit in the nucleus. Electrons move around outside. Proton and electron have equal magnitude of charge, which is e = 1.60 × 10⁻¹⁹ C.","h":"Proton +e in nucleus, electron −e outside, neutron zero. Eliminate any option with the electron in the nucleus."},{"q":"A nitrogen atom has 7 protons and 7 electrons. What is its net charge?","c":"Zero, because 7(+e) + 7(−e) = 0","w":["+7e, because the protons are heavier than the electrons","−7e, because the electrons orbit on the outside of the atom","+14e, because both kinds of particles count as positive"],"e":"Protons and electrons carry equal and opposite charges. With the same number of each, the charges cancel and the atom is neutral.","h":"Equal protons and electrons = zero net charge. No sum needed."},{"q":"Which statement about the masses of the subatomic particles is correct?","c":"Proton and neutron are nearly equal in mass, and the electron is about 1000 times lighter","w":["Proton and electron are nearly equal in mass, and the neutron is about 1000 times lighter","All three particles have nearly the same mass of about 9.11 × 10⁻³¹ kg","Electron is about 1000 times heavier than the proton and neutron, which are nearly equal"],"e":"mₚ = 1.6726 × 10⁻²⁷ kg and mₙ = 1.6749 × 10⁻²⁷ kg, while mₑ = 9.109 × 10⁻³¹ kg. That is why the nucleus is treated as stationary.","h":"Mass: proton ≈ neutron, electron about 1/1836 of that. Pick 'nearly equal, electron much smaller'."},{"q":"What does it mean to say charge is quantized?","c":"The charge on any object is always a whole-number multiple of e = 1.60 × 10⁻¹⁹ C","w":["The charge on any object is always an exact multiple of 9.11 × 10⁻³¹ C","The charge on any object can take any continuous value above 1.60 × 10⁻¹⁹ C","The charge on any object is always equal to exactly one electron charge e"],"e":"Charge comes in packets of e. An object can have 1e, 2e, 3e, and so on, but never 1.5e. So q = ne.","h":"Quantized = whole-number multiples of e. Never 1.5e. See 'integer multiple' and tick it."},{"q":"Which list contains only conductors?","c":"Silver, copper, aluminium","w":["Glass, rubber, copper","Cloth, plastic, aluminium","Wood, dry air, silver"],"e":"Metals have loose outer electrons that move freely, so they are conductors. Cloth, plastic, glass, dry air, wood and rubber are insulators.","h":"Metals = conductors. Silver, copper, aluminium. Skip any list with rubber, glass, plastic."},{"q":"A charged rod brought near a neutral metal sphere on an insulating stand causes the charges in the sphere to shift. What is this called?","c":"Polarization, a form of electrostatic induction","w":["Conduction, because charge flows from the rod into the sphere","Ionization, because the rod strips electrons off the sphere","Neutralization, because the rod cancels the sphere's charge"],"e":"The charged rod repels or attracts the sphere's electrons, creating a positive side and a negative side. Total charge is still zero. The nearer, opposite side is pulled towards the rod.","h":"Charges shifting inside a neutral object = polarization (induction). Pick that name."},{"q":"What does Coulomb's law state?","c":"The force between two point charges is proportional to the product of the charges and inversely proportional to the square of the distance between them","w":["The force between two point charges is proportional to the sum of the charges and inversely proportional to the distance between them","The force between two point charges is proportional to the distance between them and inversely proportional to the product of the charges","The force between two point charges is proportional to the square of the charges and independent of the distance between them"],"e":"F = k|q₁q₂|/r². Charges are multiplied on top, and r is squared on the bottom.","h":"Coulomb: product of charges on top, distance squared below. Pick the option with 'r²' in the denominator."},{"q":"What is the value of Coulomb's constant k in SI units?","c":"8.99 × 10⁹ N·m²/C²","w":["8.99 × 10⁻⁹ N·m²/C²","9.11 × 10⁹ N·m²/C²","6.67 × 10⁻¹¹ N·m²/C²"],"e":"k = 1/(4πε₀) ≈ 8.99 × 10⁹ N·m²/C². In most exam calculations you can use 9 × 10⁹.","h":"k = 8.99×10⁹ ≈ 9×10⁹ N·m²/C². Use 9×10⁹ in exams and save time."},{"q":"Two point charges exert forces F₁₂ and F₂₁ on each other. How are these two forces related?","c":"They are equal in magnitude and opposite in direction, F₂₁ = −F₁₂","w":["They are equal in magnitude and the same in direction, F₂₁ = F₁₂","The bigger charge exerts a bigger force on the smaller charge","They are opposite in direction but the smaller charge feels the bigger force"],"e":"The electric force obeys Newton's third law. The pair acts along the line joining the charges, with equal size and opposite direction.","h":"Third law: equal and opposite. F₁₂ = −F₂₁. Never depends on the charge sizes."},{"q":"Two point charges of +2 μC and +3 μC are 0.30 m apart in air. What is the force between them? (k = 9×10⁹ N·m²/C²)","c":"0.60 N, repulsive","w":["0.60 N, attractive","6.0 N, repulsive","0.18 N, repulsive"],"e":"F = kq₁q₂/r² = 9×10⁹ × 6×10⁻¹² / 0.09 = 0.60 N. Like charges push apart.","h":"F = 9×10⁹ × 6×10⁻¹² ÷ 0.09 = 0.60 N. 9×6 = 54, ÷9 gives 6, fix powers. Same signs = repulsive."},{"q":"The distance between two charges is doubled and nothing else changes. What happens to the force?","c":"It falls to one quarter of its old value","w":["It falls to one half of its old value","It doubles","It rises to four times its old value"],"e":"F ∝ 1/r². Doubling r divides the force by 2² = 4.","h":"Double r → ÷4. Instant answer, no calculation."},{"q":"Both charges in a Coulomb pair are doubled and the distance is kept the same. By what factor does the force change?","c":"It becomes four times larger","w":["It becomes twice as large","It becomes eight times larger","It stays the same"],"e":"F ∝ q₁q₂. Doubling both gives 2 × 2 = 4.","h":"Both charges doubled: 2 × 2 = 4 times. One charge doubled gives 2 times."},{"q":"A 5 μC charge pulls on a 1 μC charge with a force F. What force does the 1 μC charge exert on the 5 μC charge?","c":"Equal to F in magnitude and opposite in direction","w":["Five times smaller than F, in the opposite direction","Five times larger than F, in the same direction","Equal to F in magnitude and in the same direction"],"e":"Newton's third law holds for electric forces. The bigger charge does not pull harder.","h":"Newton's third law again: the 1 μC charge pulls back with the same F. Size of charge does not matter."},{"q":"What is the charge of a body that has 2.0×10¹³ extra electrons? (e = 1.6×10⁻¹⁹ C)","c":"−3.2×10⁻⁶ C","w":["+3.2×10⁻⁶ C","−3.2×10⁻³² C","−1.25×10⁻³³ C"],"e":"Q = ne = 2×10¹³ × 1.6×10⁻¹⁹ = 3.2×10⁻⁶ C. Extra electrons make it negative.","h":"Q = n × e = 2×10¹³ × 1.6×10⁻¹⁹ = 3.2×10⁻⁶ C. Extra electrons, so negative."},{"q":"Which of these could be the charge on an isolated object? (e = 1.6×10⁻¹⁹ C)","c":"4.8×10⁻¹⁹ C","w":["2.4×10⁻¹⁹ C","6.4×10⁻²⁰ C","1.0×10⁻¹⁹ C"],"e":"Charge is quantized, so Q must be a whole number times e. 4.8×10⁻¹⁹ is exactly 3e. The others are not whole multiples.","h":"Divide each option by 1.6×10⁻¹⁹. Only 4.8 gives a whole number (3). Check by dividing, not guessing."},{"q":"A glass rod becomes positively charged when rubbed with silk. What actually moved?","c":"Electrons moved from the glass to the silk","w":["Protons moved from the glass to the silk","Electrons moved from the silk to the glass","Protons moved from the silk to the glass"],"e":"Only electrons transfer in rubbing. The glass loses electrons and ends up positive.","h":"Only electrons move. Glass loses electrons (becomes +), silk gains. Pick 'electrons moved from glass to silk'."},{"q":"A negatively charged rod is brought near, but does not touch, a neutral metal sphere. The sphere is briefly grounded and the rod then removed. What charge does the sphere keep?","c":"Positive","w":["Negative","Neutral","It depends on the size of the sphere"],"e":"The rod pushes electrons away to the ground. When the ground is removed first, the sphere is left short of electrons. Induction leaves the opposite sign.","h":"Negative rod near a sphere, ground, remove ground first, then rod: sphere is positive. Opposite of the rod's sign."},{"q":"Two identical metal spheres carry +6 μC and −2 μC. They are touched together and separated. What is the charge on each?","c":"+2 μC each","w":["+4 μC each","+3 μC each","−2 μC each"],"e":"Total charge = +6 − 2 = +4 μC. Identical spheres share it equally, +2 μC each.","h":"Identical spheres: add then halve. (+6 − 2) ÷ 2 = +2 μC each."},{"q":"Two identical spheres with +6 μC and −2 μC are 0.10 m apart. After touching and returning to 0.10 m, how does the force change? (k = 9×10⁹)","c":"It changes from an attraction of 10.8 N to a repulsion of 3.6 N","w":["It changes from a repulsion of 10.8 N to an attraction of 3.6 N","It stays an attraction and falls to 3.6 N","It changes from an attraction of 3.6 N to a repulsion of 10.8 N"],"e":"Before: 9×10⁹×12×10⁻¹²/0.01 = 10.8 N, attractive. After: each is +2 μC, so 9×10⁹×4×10⁻¹²/0.01 = 3.6 N, repulsive.","h":"Before: 9×10⁹ × 12×10⁻¹² ÷ 0.01 = 10.8 N attractive. After: +2 each: 9×10⁹ × 4×10⁻¹² ÷ 0.01 = 3.6 N repulsive."},{"q":"A charge +Q is at x = 0 and +4Q is at x = d on a line. Where must a small positive test charge sit between them to feel no net force?","c":"At d/3 from the +Q charge","w":["At d/2 from the +Q charge","At d/5 from the +Q charge","At 2d/3 from the +Q charge"],"e":"Set kQq/x² = k4Qq/(d−x)². Then (d−x) = 2x, so x = d/3.","h":"Null point between Q and 4Q: ratio of distances = √(Q/4Q) = 1/2. So x = d/3 from the smaller charge."},{"q":"A pair of charges is moved from air into a liquid of dielectric constant 4, with the same separation. What happens to the force?","c":"It is divided by 4","w":["It is multiplied by 4","It is divided by 16","It is unchanged"],"e":"In a medium, F = kq₁q₂/(κr²). With κ = 4 the force falls to a quarter.","h":"Medium with κ: F ÷ κ. κ = 4 means the force is a quarter."},{"q":"A charge +q sits midway between two equal charges +Q on a straight line. What is the net force on +q?","c":"Zero, because the two forces are equal and opposite","w":["Directed towards one of the +Q charges","Directed away from both +Q charges","Equal to twice the force from one +Q charge"],"e":"Each +Q repels +q with the same size force and the two forces point in opposite directions, so they cancel.","h":"Symmetry: equal charges either side cancel at the midpoint. Net force zero."},{"q":"What are the SI units of the permittivity of free space ε₀?","c":"C²/(N·m²)","w":["N·m²/C²","C/(N·m)","N/(C·m²)"],"e":"From F = q₁q₂/(4πε₀r²), ε₀ = q²/(F·r²) giving C²·N⁻¹·m⁻². Note k has the inverted units.","h":"ε₀ units: C²/(N·m²). They are the upside-down of k's units (N·m²/C²)."},{"q":"How many electrons make up a total charge of 1 coulomb? (e = 1.6×10⁻¹⁹ C)","c":"About 6.25×10¹⁸","w":["About 1.6×10¹⁹","About 6.25×10⁻¹⁹","About 9×10⁹"],"e":"n = Q/e = 1/(1.6×10⁻¹⁹) = 6.25×10¹⁸.","h":"1 C ÷ 1.6×10⁻¹⁹ = 6.25×10¹⁸ electrons. Memorise 6.25×10¹⁸."},{"q":"What force would two 1 C charges, 1 m apart in vacuum, exert on each other?","c":"About 9×10⁹ N","w":["About 9×10⁻⁹ N","About 1 N","About 1.6×10⁻¹⁹ N"],"e":"F = k(1)(1)/1² = 9×10⁹ N. A coulomb is huge. Real charges are μC or nC.","h":"k × 1 × 1 ÷ 1 = 9×10⁹ N. A coulomb is huge."},{"q":"Which statement about the electric force between two electrons and the gravitational force between them is correct?","c":"The electric force is about 10⁴² times larger than the gravitational force","w":["The gravitational force is about 10⁴² times larger than the electric force","The two forces are about the same size","The electric force is about 10⁴ times larger than the gravitational force"],"e":"For two electrons, F_e/F_g = ke²/(Gm²) ≈ 4×10⁴². Gravity is negligible for atomic particles.","h":"Electric to gravity ratio for electrons ≈ 10⁴². Always remember '10⁴²'."},{"q":"Which of these is the SI unit of electric charge expressed in base units?","c":"Ampere-second (A·s)","w":["Ampere per second (A/s)","Volt-second (V·s)","Joule per ampere (J/A)"],"e":"I = Q/t, so Q = I·t. One coulomb is one ampere flowing for one second.","h":"Q = I × t, so C = A·s. Pick ampere-second."},{"q":"A statement says: \"The total charge of an isolated system never changes.\" Which law is this?","c":"Conservation of charge","w":["Coulomb's law","Gauss's law","Conservation of the number of electrons"],"e":"Charges can be created in pairs or destroyed in pairs, such as in pair production, but the net charge stays the same. The number of electrons alone can change.","h":"'Total charge of an isolated system never changes' = conservation of charge."},{"q":"A conductor and an insulator are each touched by a charged rod at one point. What happens to the charge on each?","c":"On the conductor it spreads over the surface, on the insulator it stays near the contact point","w":["On the conductor it stays near the contact point, on the insulator it spreads over the surface","On both it spreads evenly over the surface","On both it stays near the contact point"],"e":"Electrons move freely in a conductor, so the charge distributes. In an insulator they are held in place.","h":"Conductor: charge spreads over the surface. Insulator: stays at the touch point."},{"q":"A force of repulsion of 8 N acts between two small charged spheres. If the distance between them is halved, what is the new force?","c":"32 N","w":["16 N","4 N","2 N"],"e":"F ∝ 1/r². Halving r multiplies the force by 2² = 4, so 8 × 4 = 32 N.","h":"Halve r → F × 4. 8 × 4 = 32 N."}],[{"q":"How is the electric field E at a point defined?","c":"The force per unit positive test charge placed at that point, E = F/q₀","w":["The force on the source charge multiplied by the test charge, E = Fq₀","The work done per unit distance on the test charge, E = W/r","The charge per unit force acting at that point, E = q₀/F"],"e":"A small positive test charge q₀ is placed at the point and the force F on it is measured. E = F/q₀. It is a vector pointing in the direction of the force on a positive charge.","h":"E = F ÷ q₀: force per unit positive test charge. Pick the option with 'per unit positive test charge'."},{"q":"What are the units of the electric field?","c":"N/C, which is the same as V/m","w":["C/N, which is the same as m/V","N·m/C, which is the same as J/V","N/C², which is the same as V/m²"],"e":"E = F/q so the unit is newton per coulomb. It is also equal to volt per metre.","h":"N/C = V/m. If one of them is in the options with the other, pick the pair."},{"q":"What is the magnitude of the electric field a distance r from an isolated point charge q?","c":"E = q/(4πε₀r²), pointing outward if q is positive and inward if q is negative","w":["E = q/(4πε₀r), pointing outward if q is positive and inward if q is negative","E = q/(4πε₀r²), pointing inward if q is positive and outward if q is negative","E = q²/(4πε₀r²), pointing outward whether q is positive or negative"],"e":"Put Coulomb's law F = qq₀/(4πε₀r²) into E = F/q₀. q₀ cancels, leaving E = q/(4πε₀r²). Field lines leave positive charges and enter negative ones.","h":"Point charge: q cancels from F/q₀, leaving kq/r². The field points out from +, in towards −."},{"q":"How is the net electric field from several point charges found?","c":"By the principle of superposition: add the fields of the individual charges as vectors","w":["By adding only the magnitudes of the individual fields, ignoring direction","By multiplying the fields of the individual charges together as vectors","By using only the field of the nearest charge and ignoring the others"],"e":"Each charge produces its own field independent of the others. The resultant is their vector sum, ΣE = Σ Q/(4πε₀r²), taken with directions.","h":"Several charges: superposition, add the fields as vectors. 'Vector sum of each charge's field'."},{"q":"Example 2.1: A proton of mass m and charge q is released from rest in a uniform field E. How does it move?","c":"With constant acceleration a = qE/m, like a body falling in gravity","w":["With constant speed, because the field is uniform","With acceleration that grows with time, because the force builds up","With constant acceleration a = E/qm, in a circle around the field direction"],"e":"F = qE is constant, so a = qE/m is constant. The motion is uniformly accelerated, with v = at = qEt/m and y = ½at² = qEt²/2m.","h":"Constant F = qE gives constant a = qE/m. So use the equations of motion (v² = 2ay)."},{"q":"Example 2.1 (continued): After moving a distance y in the field, what is the kinetic energy of the proton?","c":"K = qEy","w":["K = qE/y","K = ½qEy²","K = qEy/m"],"e":"v² = 2ay = 2qEy/m. K = ½mv² = ½m(2qEy/m) = qEy. This is work done by the field, force × distance.","h":"Work done = qEy = K. Shortcut: K = qEy, no mass or v needed."},{"q":"Example 2.2: Q₁ = +2e at (−r, 0) and Q₂ = −3e at (r, r). What is the x-component of the field at the origin?","c":"3.06 ke/r², pointing along +x","w":["2.0 ke/r², pointing along +x","3.06 ke/r², pointing along −x","5.0 ke/r², pointing along +x"],"e":"E₁ = k(2e)/r² along +x (pushes away from +2e). Q₂ is √2 r away so E₂ = k(3e)/2r², pulled towards Q₂. Its x-part is E₂ cos 45° ≈ 0.707 × 1.5 ke/r². Total Eₓ = (2 + 1.06)ke/r² = 3.06 ke/r².","h":"Do x and y separately. Q₂ at (r, r) is √2·r away, so E₂ = k·3e/2r². Then take 1/√2 for each component."},{"q":"Example 2.2: Why is the distance from Q₂ to the origin written as √2 r?","c":"Q₂ is at r along x and r along y, so the distance is √(r² + r²) = √2 r","w":["Q₂ is at distance r only, and √2 comes from the charge being −3e","The distance √2 r is found by adding r and r to get 2r, then taking the root","The factor √2 comes from cos 45°, which is used to convert the distance"],"e":"Use Pythagoras. The origin and Q₂ are separated by r in x and r in y, so the straight-line distance is √2 r. Then r² in the field formula is replaced by 2r².","h":"Distance to (r, r) from the origin = √(r² + r²) = √2·r. Pythagoras."},{"q":"What is an electric dipole?","c":"Two equal and opposite charges separated by a small distance, with moment p = qd pointing from −q to +q","w":["Two equal charges of the same sign separated by a small distance, with moment p = qd","Two unequal opposite charges at the same point, with moment p = q/d pointing from +q to −q","One charge sitting in a uniform field, with moment p = qE pointing along the field"],"e":"The dipole moment is a vector p = qd pointing from the negative charge to the positive charge. Its unit is C·m.","h":"Dipole = ±q, small separation d. p = qd points from − to +."},{"q":"A dipole is in a uniform electric field. What is the net force on it, and what is the net effect?","c":"The net force is zero but there is a torque, which tends to align the dipole with the field","w":["The net force is qE and there is no torque, so the dipole moves in a straight line","The net force is zero and there is no torque, so the dipole does not move at all","The net force is 2qE and there is a torque, which tends to turn the dipole away from the field"],"e":"The force on +q is qE and the force on −q is −qE. These cancel, so net force is zero. But they act at different points, which gives a torque τ = p × E.","h":"Uniform field: net force zero (qE − qE), but torque nonzero. It rotates and does not translate."},{"q":"What is the magnitude of the torque on a dipole of moment p at angle θ to a uniform field E?","c":"τ = pE sin θ","w":["τ = pE cos θ","τ = pE tan θ","τ = p sin θ / E"],"e":"Each force qE has arm r sin θ, with two charges. τ = 2(qE)(r sin θ) = pE sin θ. In vector form τ = p × E.","h":"τ = pE sinθ. θ is the angle between p and E."},{"q":"At what angle between p and E is the torque on a dipole maximum?","c":"90°, because sin θ = 1","w":["0°, because sin θ = 1","45°, because sin θ = cos θ","180°, because sin θ = −1"],"e":"τ = pE sin θ. The sine is largest, equal to 1, at θ = 90°. At 0° and 180° the torque is zero.","h":"Torque maximum at 90° (sin 90° = 1). Zero at 0° and 180°."},{"q":"What is the potential energy of a dipole in a uniform field if U = 0 is taken at θ = 90°?","c":"U = −pE cos θ = −p·E","w":["U = +pE cos θ = +p·E","U = −pE sin θ = −p × E","U = pE(1 − sin θ)"],"e":"Work by the field is W = pE(cos θ₁ − cos θ). Taking zero energy at 90° gives U = −pE cos θ. Minimum energy (−pE) is when p is parallel to E.","h":"U = −pE cosθ = −p·E. Zero at 90°. Minimum at 0°, maximum at 180°."},{"q":"Example 2.3: A dipole has p = 6.4 × 10⁻²⁴ C·m in a field of 3.2 × 10⁶ N/C. What is the maximum torque?","c":"2.05 × 10⁻¹⁷ N·m","w":["2.05 × 10⁻³⁰ N·m","1.0 × 10⁻¹⁷ N·m","4.1 × 10⁻¹⁷ N·m"],"e":"Maximum torque is at sin θ = 1, so τ = pE = (3.2 × 10⁶)(6.4 × 10⁻²⁴) = 2.05 × 10⁻¹⁷ N·m.","h":"Maximum τ = pE = 3.2×10⁶ × 6.4×10⁻²⁴. Multiply 3.2 × 6.4 = 20.5, fix the power: 2.05×10⁻¹⁷."},{"q":"Example 2.3(ii): With pE = 2.05 × 10⁻¹⁷ N·m, what energy is needed to rotate the dipole 35° from its minimum-energy position?","c":"3.71 × 10⁻¹⁸ J","w":["1.68 × 10⁻¹⁷ J","1.18 × 10⁻¹⁷ J","3.71 × 10⁻¹⁹ J"],"e":"W = pE(cos θ₁ − cos θ). Minimum energy is at θ₁ = 0, so W = pE(1 − cos 35°) = 2.05 × 10⁻¹⁷ × 0.181 = 3.71 × 10⁻¹⁸ J.","h":"W = pE(1 − cos35°) = pE × 0.181. 2.05×10⁻¹⁷ × 0.181 = 3.71×10⁻¹⁸ J."},{"q":"What is the electric field on the axis of a uniform ring of charge Q and radius R, at a distance z from its centre?","c":"E = Qz / [4πε₀(R² + z²)^(3/2)], directed along the axis","w":["E = Q / [4πε₀(R² + z²)], directed along the axis","E = Qz / [4πε₀(R² + z²)^(1/2)], directed along the axis","E = QR / [4πε₀(R² + z²)^(3/2)], directed along the axis"],"e":"Take a small piece dq = λ ds with λ = Q/2πR. Its field is dE = λ ds/(4πε₀r²) and r² = R² + z². Only the axis part dE cos θ survives, with cos θ = z/(R²+z²)^(1/2). Summing around the ring gives the formula.","h":"Ring axis: E = kQz/(R² + z²)^{3/2}. Write that and substitute."},{"q":"In the ring derivation, why do the y-components (perpendicular to the axis) add up to zero?","c":"By symmetry, the piece on the opposite side of the ring cancels each perpendicular component","w":["Because the charge on the ring is spread so thinly that the y-field is negligible","Because the y-field of each piece points along the axis rather than across it","Because electric fields are always parallel to the axis of any charged object"],"e":"For every small piece of the ring there is another on the opposite side. Their sideways parts are equal and opposite, so they cancel. Only the parts along the axis add.","h":"y-components cancel by symmetry: each piece has an opposite partner on the other side. Only the axis component survives."},{"q":"For the ring of charge, what does the field become when z ≫ R?","c":"E ≈ Q/(4πε₀z²), the field of a point charge","w":["E ≈ Qz/(4πε₀R³), growing steadily with z","E ≈ Q/(4πε₀R²), constant and independent of z","E ≈ 0, because the charges on opposite sides cancel"],"e":"When z is large, R² is tiny beside z², so (R² + z²)^(3/2) ≈ z³. Then E = Qz/(4πε₀z³) = Q/(4πε₀z²). Far away the ring looks like a point charge.","h":"z ≫ R: (R² + z²)^{3/2} → z³, so E → kQ/z². The ring behaves as a point charge."},{"q":"For the ring of charge, what is the field at the centre (z = 0)?","c":"Zero, because z = 0 in the numerator and the pieces cancel by symmetry","w":["Q/(4πε₀R²), the field of a point charge at distance R","Maximum, because every piece of the ring is the same distance R away","Q/(2πε₀R²), because the total length of the ring is 2πR"],"e":"Put z = 0 in E = Qz/[4πε₀(R² + z²)^(3/2)] and the numerator is zero. The pieces on opposite sides push in opposite directions and cancel.","h":"z = 0 gives zero in the numerator, so E = 0 at the centre. Pairs cancel."},{"q":"Tutorial 2.1(i): What is the electric field intensity in air at 30 cm from a point charge q₁ = 5 × 10⁻⁹ C?","c":"About 500 N/C","w":["About 150 N/C","About 1500 N/C","About 50 N/C"],"e":"E = kq/r² = (8.99 × 10⁹)(5 × 10⁻⁹) ÷ (0.30)² = 499 ≈ 500 N/C.","h":"E = 9×10⁹ × 5×10⁻⁹ ÷ 0.09 = 45 ÷ 0.09 = 500 N/C. 9 × 5 = 45, powers cancel."},{"q":"Tutorial 2.1(ii): A charge q₂ = 4 × 10⁻¹⁰ C is placed 30 cm from q₁ in the 500 N/C field. What force acts on it?","c":"2.0 × 10⁻⁷ N","w":["2.0 × 10⁻⁵ N","1.25 × 10¹² N","8.0 × 10⁻⁷ N"],"e":"F = qE = (4 × 10⁻¹⁰)(500) = 2.0 × 10⁻⁷ N.","h":"F = qE = 4×10⁻¹⁰ × 500 = 2×10⁻⁷ N. Just multiply by the field value."},{"q":"Tutorial 2.1(iii): What force acts on a charge q₂ = 5 × 10⁻¹⁰ C at the same 30 cm point?","c":"2.5 × 10⁻⁷ N","w":["2.5 × 10⁻⁵ N","1.0 × 10⁻⁷ N","2.0 × 10⁻⁷ N"],"e":"F = qE = (5 × 10⁻¹⁰)(500) = 2.5 × 10⁻⁷ N. The field is the same, only the test charge changed.","h":"Same field, so F = qE again: 5×10⁻¹⁰ × 500 = 2.5×10⁻⁷ N. Field does not change, only the charge."},{"q":"Tutorial 2.2: Nucleus A has charge −3e and nucleus B has +8e, separated by 6.5 µm. What is the attractive force between them?","c":"1.3 × 10⁻¹⁶ N","w":["1.3 × 10⁻²² N","5.4 × 10⁻¹⁷ N","4.9 × 10⁻¹⁶ N"],"e":"F = k(3e)(8e)/r² = (8.99 × 10⁹)(24)(1.6 × 10⁻¹⁹)² ÷ (6.5 × 10⁻⁶)² = 1.3 × 10⁻¹⁶ N.","h":"Use ke² = 2.3×10⁻²⁸ for charges in e. F = 2.3×10⁻²⁸ × 24 ÷ (6.5×10⁻⁶)² = 1.3×10⁻¹⁶ N."},{"q":"Tutorial 2.3(i): Three identical 6.4 µC metal balls sit at the corners of an equilateral triangle of side 0.25 m. What is the resultant force on one ball?","c":"10.2 N","w":["5.9 N","17.7 N","20.4 N"],"e":"Each of the other two exerts F = kq²/a² = 5.89 N. The two forces make 60° with each other, so the resultant is 2F cos 30° = √3 × 5.89 = 10.2 N, pointing away from the triangle.","h":"Equilateral triangle: force on one ball = 2F cos30° = √3 F. √3 × 5.89 = 10.2 N."},{"q":"Tutorial 2.3(ii): Each ball in the same triangle carries 0.99 µC instead. What is the resultant force on one ball?","c":"0.244 N","w":["0.141 N","0.488 N","0.0813 N"],"e":"F = kq²/a² = (8.99 × 10⁹)(0.99 × 10⁻⁶)² ÷ (0.25)² = 0.141 N. Resultant = 2F cos 30° = 0.244 N.","h":"√3 × F: 1.732 × 0.141 = 0.244 N. Same triangle trick as before."},{"q":"Tutorial 2.4: An electron enters a uniform field E at a right angle with speed v₀. How does it move?","c":"On a parabola: constant speed v₀ across the field and constant acceleration eE/m opposite to E along it","w":["On a straight line, because the field cannot change the electron's direction","On a circle, because the force is always at a right angle to the velocity","On a parabola, with constant acceleration along the direction of E, not opposite to it"],"e":"It is the same as a projectile. Across the field there is no force, so velocity stays v₀. Along the field the force eE is constant, giving acceleration eE/m. The electron is negative, so the acceleration is opposite to E. Combined, the path is a parabola.","h":"Across the field no force, along the field constant acceleration. It is a parabola, like a projectile."},{"q":"What are the SI units of electric field?","c":"N/C, which is the same as V/m","w":["N·C, which is the same as V·m","C/N, which is the same as m/V","N/C², which is the same as V/m²"],"e":"E = F/q gives newtons per coulomb. From E = V/d, volts per metre. They are equal.","h":"N/C = V/m. If both appear, pick the 'same as' option."},{"q":"What is the electric field at 0.30 m from a point charge of 2 nC? (k = 9×10⁹)","c":"200 N/C","w":["60 N/C","600 N/C","20 N/C"],"e":"E = kq/r² = 9×10⁹ × 2×10⁻⁹ / 0.09 = 200 N/C.","h":"E = 9×10⁹ × 2×10⁻⁹ ÷ 0.09 = 18 ÷ 0.09 = 200 N/C. Do the 9 × 2 first."},{"q":"What is the direction of the electric field around an isolated negative point charge?","c":"Radially inward, towards the charge","w":["Radially outward, away from the charge","Circular, around the charge","Tangential to the nearest equipotential"],"e":"Field direction is the direction of the force on a positive test charge. A positive test charge is pulled towards a negative source.","h":"Negative charge: field points radially inward. The field points the way a positive test charge would go."},{"q":"An electron is placed in a uniform field of 500 N/C pointing east. What is the force on it? (e = 1.6×10⁻¹⁹ C)","c":"8×10⁻¹⁷ N towards the west","w":["8×10⁻¹⁷ N towards the east","3.2×10⁻²² N towards the west","8×10⁻¹⁷ N pointing north"],"e":"F = eE = 1.6×10⁻¹⁹ × 500 = 8×10⁻¹⁷ N. The electron is negative, so the force is opposite to E.","h":"F = eE = 8×10⁻¹⁷ N. Electron is negative so the force opposes the field. East field gives west force."},{"q":"The distance from a point charge is tripled. What happens to the field strength?","c":"It falls to one ninth","w":["It falls to one third","It rises to nine times","It falls to one sixth"],"e":"E ∝ 1/r². Tripling r divides E by 9.","h":"r × 3 → E ÷ 9. Square the factor."},{"q":"What is the electric field at the midpoint between two equal positive point charges?","c":"Zero","w":["Twice the field of one charge","Equal to the field of one charge","Pointing from one charge to the other"],"e":"The two fields are equal in size and opposite in direction at the midpoint. They cancel.","h":"Equal fields, opposite directions at the midpoint: zero. Equal and same sign means cancel."},{"q":"A +1 μC and a −1 μC charge are 0.20 m apart. What is the field at the midpoint? (k = 9×10⁹)","c":"1.8×10⁶ N/C, pointing towards the negative charge","w":["Zero","1.8×10⁶ N/C, pointing towards the positive charge","4.5×10⁵ N/C, pointing towards the negative charge"],"e":"Each charge is 0.10 m away. Each gives 9×10⁹×10⁻⁶/0.01 = 9×10⁵ N/C, both pointing the same way (away from + and towards −). The sum is 1.8×10⁶ N/C.","h":"Opposite charges: the fields add at the midpoint. 2 × 9×10⁵ = 1.8×10⁶ N/C, towards the negative."},{"q":"Two charges, +4q and +q, are a distance d apart. Where is the field zero on the line between them?","c":"At 2d/3 from the +4q charge","w":["At d/2 from the +4q charge","At d/3 from the +4q charge","At d/5 from the +4q charge"],"e":"Set 4q/x² = q/(d−x)². Then d − x = x/2, so x = 2d/3 from the bigger charge.","h":"Null point: √ ratio. x/(d−x) = √(4q/q) = 2, so x = 2d/3 from the bigger charge."},{"q":"What is the electric field at the centre of a uniformly charged ring?","c":"Zero, because the contributions cancel in pairs","w":["Q/(4πε₀R²), as if the charge were at one point","Q/(2πε₀R), directed along the axis","Q/(4πε₀R), directed in the plane of the ring"],"e":"Each charge element has an opposite partner and their fields cancel at the centre.","h":"Ring centre E = 0, by symmetry. No numbers needed."},{"q":"At a distance z much larger than the radius R, how does the field on the axis of a charged ring behave?","c":"It becomes like that of a point charge, E ≈ kQ/z²","w":["It becomes like that of an infinite line, E ∝ 1/z","It stays equal to zero","It grows with z as E ∝ z"],"e":"For z ≫ R, (R² + z²)^(3/2) → z³ and E → kQz/z³ = kQ/z².","h":"z ≫ R: ring behaves like a point charge, E ≈ kQ/z². Same answer as before."},{"q":"What is the dipole moment of a charge pair ±q separated by distance d?","c":"p = qd, directed from the negative to the positive charge","w":["p = qd, directed from the positive to the negative charge","p = q/d, directed from the negative to the positive charge","p = 2q, directed along the field"],"e":"The magnitude is q × d with units C·m. The vector points from −q to +q.","h":"p = qd, directed − to +. Units C·m."},{"q":"A dipole of moment 4×10⁻⁹ C·m sits at 30° to a uniform field of 5×10³ N/C. What torque acts on it?","c":"1×10⁻⁵ N·m","w":["2×10⁻⁵ N·m","1.7×10⁻⁵ N·m","5.8×10⁻⁶ N·m"],"e":"τ = pE sinθ = 4×10⁻⁹ × 5×10³ × 0.5 = 1×10⁻⁵ N·m.","h":"τ = 4×10⁻⁹ × 5×10³ × 0.5 = 10⁻⁵ N·m. sin30° = 0.5. Multiply the numbers by 0.5."},{"q":"At what angle between p and E is the torque on a dipole zero?","c":"0° and 180°","w":["90° only","45° and 135°","0° only"],"e":"τ = pE sinθ, and sinθ is zero at 0° and 180°. The 180° case is unstable.","h":"τ = 0 at θ = 0° and 180°. sinθ = 0 at those angles."},{"q":"Which orientation of a dipole in a uniform field is stable equilibrium?","c":"p parallel to E","w":["p antiparallel to E","p perpendicular to E","None, a dipole is never in equilibrium"],"e":"At θ = 0 the energy −pE is a minimum. A small turn gives a restoring torque. At θ = 180° it is a maximum.","h":"Stable equilibrium: p parallel to E (minimum energy, −pE). 180° is unstable."},{"q":"What is the potential energy of a dipole in a field when p is antiparallel to E?","c":"+pE, the maximum value","w":["−pE, the minimum value","Zero","+pE/2"],"e":"U = −pE cosθ. At θ = 180°, cos = −1 so U = +pE.","h":"θ = 180°: cos = −1, so U = +pE. The maximum."},{"q":"What is the net force on an electric dipole placed in a uniform field?","c":"Zero, but there can be a torque","w":["Non-zero, but there is no torque","Zero, and there is no torque","Non-zero, and there is a torque"],"e":"The +q and −q feel equal and opposite forces so the net is zero. They act at different points, so they give a turning effect.","h":"Uniform field means no net force on a dipole, but possible torque."},{"q":"What acceleration does an electron get in a uniform field of 1000 N/C? (e = 1.6×10⁻¹⁹ C, m = 9.1×10⁻³¹ kg)","c":"About 1.8×10¹⁴ m/s²","w":["About 1.8×10⁻¹⁴ m/s²","About 1.6×10⁻¹⁶ m/s²","About 5.7×10⁻¹¹ m/s²"],"e":"a = eE/m = 1.6×10⁻¹⁹ × 1000 / 9.1×10⁻³¹ = 1.76×10¹⁴ m/s².","h":"a = eE/m = 1.6×10⁻¹⁹ × 10³ ÷ 9.1×10⁻³¹ = 1.76×10¹⁴ m/s². Divide 1.6 by 9.1 = 0.176."},{"q":"A proton and an electron are in the same uniform field. Compare the force and acceleration of each.","c":"The forces are equal in size, but the electron accelerates far more","w":["The forces are equal and the accelerations are equal","The proton feels a larger force and accelerates more","The electron feels a larger force and accelerates more"],"e":"Both have charge of magnitude e, so F = eE is the same. a = F/m, and the electron's mass is about 1/1836 of the proton's.","h":"Same force (charge magnitude e), but a = F/m. The electron's much smaller mass gives much bigger a."},{"q":"What is the electric field inside a conductor in electrostatic equilibrium?","c":"Zero everywhere inside","w":["Equal to the field at the surface","Uniform but non-zero","Equal to kQ/r² at every interior point"],"e":"If a field existed, free charges would move. Equilibrium means they have stopped, so E = 0 inside.","h":"Conductor in equilibrium: E = 0 inside. Free charges rearrange until the field vanishes."},{"q":"Two perpendicular fields of 3 N/C and 4 N/C act at a point. What is the magnitude of the resultant field?","c":"5 N/C","w":["7 N/C","1 N/C","12 N/C"],"e":"Fields add as vectors. At right angles, E = √(3² + 4²) = 5 N/C.","h":"Perpendicular fields: Pythagoras. 3-4-5 triangle gives 5 N/C instantly."},{"q":"Why must a test charge used to define E be very small?","c":"So that it does not disturb the charges that make the field","w":["So that it does not leave the field region","So that the force on it is always attractive","So that it never accelerates"],"e":"E is defined as F/q₀ in the limit q₀ → 0. A large test charge would move the source charges around.","h":"Test charge must be tiny so it does not disturb the source charges. Pick 'so it does not disturb'."},{"q":"A rod of charge is replaced by a point charge Q at its centre. For which point is the point-charge formula a good approximation for the rod's field?","c":"A point very far from the rod compared with its length","w":["A point very close to the middle of the rod","A point on the rod itself","A point at a distance equal to half the rod's length"],"e":"Only at large distances does the shape stop mattering. Close to the rod the field depends strongly on its shape.","h":"Far from the rod, shape does not matter, so point-charge formula works. 'Very far compared with its length'."}],[{"q":"What is an electric field line?","c":"An imaginary line drawn so that its tangent at any point gives the direction of the electric field E there","w":["A real path that a negative charge always follows when it is released in a field","An imaginary line drawn so that it is always at a right angle to the field E at every point","A line joining all the points in a field that have exactly the same electric potential"],"e":"Field lines are imaginary. The tangent to the line at a point shows the direction of E at that point. Lines at a right angle to the field are equipotential lines, which is a different thing.","h":"Field line = imaginary line whose tangent at a point gives the direction of E. Pick 'tangent'."},{"q":"What does the closeness of electric field lines tell you?","c":"Lines close together mean a strong field and lines far apart mean a weak field","w":["Lines close together mean a weak field and lines far apart mean a strong field","Closeness of the lines tells only the sign of the charge and not the strength","Lines close together mean a uniform field and lines far apart mean a changing field"],"e":"The number of lines per unit area is proportional to the magnitude of E. Crowded lines mean strong field. Spread-out lines mean weak field.","h":"Close lines = strong field, far apart = weak. Line density = strength."},{"q":"Which of these is NOT a rule for drawing electric field lines?","c":"Field lines may cross each other where two fields are equal in strength","w":["Field lines start on positive charges and end on negative charges","The number of lines is proportional to the size of the charge","Field lines can never cross each other at any point"],"e":"Field lines never cross. If they did, the field at the crossing would point in two directions at once, which is impossible.","h":"Lines never cross. For 'NOT a rule' questions, pick the option that allows crossing."},{"q":"Exercise 3.1: The electric field lines diverge from which of these?","c":"A positive charge","w":["A negative charge","A dipole as a whole","A zero potential point"],"e":"Field lines come out of positive charges, so they spread out (diverge). They go into negative charges and converge there.","h":"Lines diverge from a positive charge and converge on a negative. Positive = diverge."},{"q":"Exercise 3.2: Two electric field lines ______.","c":"never intersect","w":["always intersect each other","may intersect sometimes","are always perpendicular to each other"],"e":"The field at any point has one direction only, so two lines can never cross.","h":"Never intersect. One direction per point, so lines cannot cross."},{"q":"Where do electric field lines for a system with an excess of one type of charge end?","c":"Some lines end on charges of the opposite sign, and some go off to infinity","w":["All lines must end on a charge of the same sign located nearby","All lines are forced to form closed loops around the excess charge","All lines stop at the point where the field strength reaches zero"],"e":"Lines start on positive and end on negative charges. If one kind of charge is in excess, the extra lines go out to infinity (or come in from it).","h":"Lines start on + and end on −. Excess charge of one sign: the extra lines go to infinity."},{"q":"A charge q₀ of mass m is placed in a uniform field E, and the electric force is the only force. What is its acceleration?","c":"a = qE/m, in the direction of E if the charge is positive","w":["a = mE/q, in the direction of E if the charge is positive","a = qE/m, in the direction of E whatever the sign of the charge","a = E/qm, always in the direction opposite to E"],"e":"F = qE = ma gives a = qE/m. A negative charge accelerates in the opposite direction to E.","h":"a = qE/m. Negative charge accelerates opposite to E. Never forget the sign."},{"q":"What does the direction of the electric field around an isolated positive point charge look like?","c":"Radially outward, directly away from the charge","w":["Radially inward, directly towards the charge","In circles around the charge, like closed loops","Straight up in one direction, whatever the position"],"e":"E = (1/4πε₀)(q/r²) r̂. For positive q the field is directly away from it. For negative q it is directly towards it.","h":"Positive point charge: field points radially outward. Negative: inward."},{"q":"How is an electric dipole described in the text?","c":"Two point charges of equal magnitude and opposite sign separated by a distance d","w":["Two point charges of unequal magnitude and the same sign separated by a distance d","Two point charges of equal magnitude and the same sign separated by a distance d","Two point charges of unequal magnitude and opposite sign at the same point"],"e":"+q and −q a distance d apart. A water molecule behaves like one, because the oxygen end is net negative and the hydrogen end is net positive.","h":"Dipole = +q and −q, equal magnitude, small separation. Water is a dipole example."},{"q":"In a water molecule, which way does the dipole moment p point?","c":"From the negative oxygen end towards the positive hydrogen end","w":["From the positive hydrogen end towards the negative oxygen end","From one hydrogen atom directly to the other hydrogen atom","In a direction at a right angle to the line joining oxygen and hydrogen"],"e":"p points from the negative end of the dipole to the positive end. In water, oxygen is the negative end, so p points to the hydrogen side.","h":"p points from − to +. In water that is from the oxygen end (negative) towards the hydrogen end (positive)."},{"q":"What is the field on the axis of a dipole at a distance z from its centre, when z ≫ d?","c":"E ≈ 2kp/z³, pointing along p","w":["E ≈ kp/z², pointing along p","E ≈ 2kp/z², pointing against p","E ≈ kp/z³, pointing against p"],"e":"E = kq/(z − d/2)² − kq/(z + d/2)². For z ≫ d this simplifies to E = qd/(2πε₀z³) = 2kp/z³. A dipole field falls off as 1/z³, faster than a single charge at 1/z².","h":"Axial far field: E ≈ 2kp/z³, along p. The z³ tells you it falls faster than a point charge."},{"q":"Example 3.1: A dipole of charges ±1.6 × 10⁻¹⁹ C separated by 0.125 nm is in a uniform field of 5 × 10⁵ N/C. What is the net force on the dipole?","c":"Zero, because the forces on the two charges are equal and opposite","w":["8.0 × 10⁻¹⁴ N, because the force on one charge is qE","1.6 × 10⁻¹³ N, because the force on both charges adds up","2.0 × 10⁻²⁹ N, because the force is equal to p"],"e":"The field is uniform so the force on +q is qE and on −q is −qE. They cancel and the net force is zero. There is still a torque.","h":"Uniform field: forces on ±q cancel, net force zero. No calculation needed."},{"q":"Example 3.1(b): What is the magnitude of the dipole moment of the ±1.6 × 10⁻¹⁹ C charges separated by 0.125 × 10⁻⁹ m?","c":"2.0 × 10⁻²⁹ C·m","w":["2.0 × 10⁻²⁸ C·m","2.0 × 10⁻³⁰ C·m","1.3 × 10⁻²⁹ C·m"],"e":"p = qd = (1.6 × 10⁻¹⁹)(0.125 × 10⁻⁹) = 2.0 × 10⁻²⁹ C·m. Direction is from the negative charge to the positive charge.","h":"p = qd = 1.6×10⁻¹⁹ × 0.125×10⁻⁹ = 2.0×10⁻²⁹ C·m. 1.6 × 0.125 = 0.2, fix the powers."},{"q":"Example 3.2: The electric field at a point on the perpendicular bisector of a dipole is directed","c":"Opposite to the dipole moment","w":["Along the dipole moment","Perpendicular to the dipole moment","At 45° to the dipole moment"],"e":"On the bisector, the two charges are the same distance from the point. The sideways parts cancel. What remains points from the + side to the − side, which is opposite to p.","h":"On the perpendicular bisector, E points opposite to p. Equatorial = antiparallel."},{"q":"Exercise 3.3: Charges +1 C and −1 C are 5 mm apart, forming a dipole. What is the field on the axis 15 cm from the dipole?","c":"About 2.67 × 10¹⁰ N/C","w":["About 2.67 × 10⁹ N/C","About 2.67 × 10⁸ N/C","About 5.33 × 10¹⁰ N/C"],"e":"E = 2kqd/z³ = 2(9 × 10⁹)(1)(0.005) ÷ (0.15)³ = 9 × 10⁷ ÷ 3.375 × 10⁻³ = 2.67 × 10¹⁰ N/C. Note: the book prints 2.66 × 10⁹, which does not match its own formula, so check with your lecturer.","h":"E = 2kqd/z³ = 2 × 9×10⁹ × 0.005 ÷ 0.003375 = 2.67×10¹⁰ N/C. Cube 0.15 first: 0.003375."},{"q":"Exercise 3.4: What is the dimension of the dipole moment?","c":"[A·T·L], since it is charge times length","w":["[M·L·T⁻²], since it is a force","[A·T·L⁻¹], since it is charge divided by length","[M·L²·T⁻²], since it is an energy"],"e":"p = qd. Charge has dimension [A·T] and distance has [L], so p is [A·T·L]. Its SI unit is the coulomb-metre.","h":"p = qd → [A·T][L]. Charge = current × time (A·T)."},{"q":"Tutorial 3.1: What is the Coulomb force between point charges of 15 µC and 10 µC placed 200 cm apart?","c":"About 0.34 N","w":["About 3.4 N","About 0.084 N","About 1.35 × 10⁻³ N"],"e":"r = 200 cm = 2.00 m. F = kq₁q₂/r² = (8.99 × 10⁹)(15 × 10⁻⁶)(10 × 10⁻⁶) ÷ 4 = 0.337 N. Repulsive, since both are positive.","h":"Convert 200 cm to 2 m first. F = 9×10⁹ × 150×10⁻¹² ÷ 4 = 0.34 N. 9 × 150 ÷ 4 = 337.5."},{"q":"Tutorial 3.2: q₁ = −4 µC, q₂ = +3 µC, q₃ = −7 µC lie in a line with q₂ in the middle. q₁q₂ = 20 cm, q₂q₃ = 15 cm. What is the net force on q₂?","c":"About 5.7 N, directed towards q₃","w":["About 11.1 N, directed towards q₃","About 5.7 N, directed towards q₁","About 2.7 N, directed towards q₁"],"e":"q₁ attracts q₂ with F₁ = k(4)(3) × 10⁻¹²/(0.2)² = 2.7 N towards q₁. q₃ attracts q₂ with F₃ = k(7)(3) × 10⁻¹²/(0.15)² = 8.4 N towards q₃. They point opposite ways, so subtract: 8.4 − 2.7 = 5.7 N towards q₃.","h":"q₁ pulls left 2.7 N; q₃ pulls right 8.4 N. Subtract: 8.4 − 2.7 = 5.7 N toward q₃. Opposite signs → pulls on a middle charge go both ways."},{"q":"Tutorial 3.3: A water molecule has dipole moment 6.2 × 10⁻³⁰ C·m. How far apart are the centres of its positive and negative charge?","c":"3.9 × 10⁻¹¹ m","w":["7.8 × 10⁻¹² m","3.9 × 10⁻¹² m","1.95 × 10⁻¹¹ m"],"e":"p = ed, so d = p/e = 6.2 × 10⁻³⁰ ÷ 1.6 × 10⁻¹⁹ = 3.9 × 10⁻¹¹ m.","h":"d = p ÷ e = 6.2×10⁻³⁰ ÷ 1.6×10⁻¹⁹ = 3.9×10⁻¹¹ m. Divide 6.2 by 1.6 = 3.9."},{"q":"Tutorial 3.4: An electric dipole is defined as","c":"Two charges of the same magnitude and opposite sign, separated by a distance","w":["Two charges of different magnitude and the same sign, separated by a distance","Two charges of different magnitude and opposite sign, separated by a distance","Two charges of the same magnitude and the same sign, separated by a distance"],"e":"A dipole is +q and −q separated by a small distance. It must be equal and opposite.","h":"Dipole = equal magnitude, opposite sign, close together. Must be both."},{"q":"Tutorial 3.5: The electric dipole moment p is described as","c":"qd","w":["qE","Ed","Fd"],"e":"p = qd, the charge multiplied by the separation. qE is a force and Fd is a work or energy.","h":"p = qd. Not qE (that is force) and not Fd (that is work)."},{"q":"Tutorial 3.6: Which statement about the field and the field line is correct?","c":"The electric field at any point is always in the direction of the electric field line","w":["The electric field at any point is always opposite to the direction of the field line","The electric field at any point is not always in the direction of the field line","The electric field at any point is always at a right angle to the direction of the field line"],"e":"The field line is drawn to show the direction of E, so the tangent to the line is E's direction.","h":"The tangent to a field line is the direction of E. Pick 'always tangent'."},{"q":"Tutorial 3.8: When the electric field is weak,","c":"the electric field lines are far apart","w":["the electric field lines are closer together","the electric field lines are not in line","the electric field lines are not far apart"],"e":"Line density is proportional to field strength. A weak field means the lines are spread out.","h":"Weak field = lines far apart. Strong = close."},{"q":"Tutorial 3.9: Which of these is FALSE about electric field lines?","c":"They attract each other","w":["They are continuous","They remain parallel in a uniform electric field","They diverge from a positive charge"],"e":"Field lines are imaginary, so they don't attract or repel each other. The other three statements are true.","h":"FALSE statement: they attract each other. Field lines are imaginary and exert nothing."},{"q":"Tutorial 3.10: Two plates oppositely charged and parallel are kept a small distance apart. What do the field lines between them look like?","c":"Parallel and uniform in the central part, but they fringe out at the extreme ends","w":["Circular around each plate, with no lines between the plates","Parallel and uniform everywhere, with no bending even at the edges","Not uniform anywhere, getting stronger towards the negative plate"],"e":"Between the plates the field is nearly uniform. Near the edges the lines bulge out. This is called the fringing effect.","h":"Parallel plates: uniform lines in the middle, bulge at the edges (fringing)."},{"q":"Where do electric field lines begin and end?","c":"They begin on positive charges and end on negative charges","w":["They begin on negative charges and end on positive charges","They begin and end on positive charges only","They form closed loops around every charge"],"e":"Lines leave positive charges and enter negative charges. Electrostatic field lines never form closed loops.","h":"Begin on positive, end on negative. Opposite order is wrong."},{"q":"Why can two electric field lines never cross?","c":"The field at a point has only one direction, and a crossing would give two","w":["Field lines carry charge, and charges repel","Crossing lines would make the field zero everywhere","Field lines always run parallel to each other"],"e":"The tangent to a line gives the field direction at that point. Two lines crossing would mean two directions at the crossing point.","h":"One direction per point, so two lines can never cross. That is the reason."},{"q":"What does the closeness of field lines show?","c":"The strength of the field, with closer lines meaning a stronger field","w":["The strength of the field, with closer lines meaning a weaker field","The direction of the field only","The sign of the source charge"],"e":"The number of lines through a unit area perpendicular to them is proportional to E.","h":"Closeness of lines = strength of field. Closer means stronger."},{"q":"At the surface of a conductor in electrostatic equilibrium, how do field lines meet the surface?","c":"At right angles to the surface","w":["Parallel to the surface","At 45° to the surface","At a random angle depending on the shape"],"e":"A parallel component would push the surface charges along the surface. At equilibrium they are still, so E must be perpendicular.","h":"Field lines meet a conductor surface at right angles (90°). Parallel component would move charge."},{"q":"How does the electric field of a point charge differ from the field of a dipole as distance r grows?","c":"The point charge field falls as 1/r² and the dipole field falls as 1/r³","w":["The point charge field falls as 1/r³ and the dipole field falls as 1/r²","Both fall as 1/r²","Both fall as 1/r³"],"e":"The +q and −q of a dipole partly cancel each other far away, so the field dies off faster.","h":"Point charge falls as 1/r². Dipole falls faster, 1/r³. Pick the pair '1/r² and 1/r³'."},{"q":"A dipole has p = 2×10⁻⁹ C·m. What is the field on its axis at 0.10 m from the centre? (k = 9×10⁹)","c":"3.6×10⁴ N/C, in the direction of p","w":["1.8×10⁴ N/C, in the direction of p","3.6×10⁴ N/C, opposite to p","1.8×10⁴ N/C, opposite to p"],"e":"E_axis = 2kp/z³ = 2 × 9×10⁹ × 2×10⁻⁹ / 10⁻³ = 3.6×10⁴ N/C along p.","h":"E = 2kp/z³ = 2 × 9×10⁹ × 2×10⁻⁹ ÷ 10⁻³ = 36 ÷ 10⁻³ = 3.6×10⁴ N/C. Axial is twice equatorial."},{"q":"For the same dipole (p = 2×10⁻⁹ C·m), what is the field on the perpendicular bisector at 0.10 m from the centre? (k = 9×10⁹)","c":"1.8×10⁴ N/C, opposite to the direction of p","w":["3.6×10⁴ N/C, opposite to the direction of p","1.8×10⁴ N/C, along the direction of p","3.6×10⁴ N/C, along the direction of p"],"e":"E_equatorial = kp/r³ = 9×10⁹ × 2×10⁻⁹ / 10⁻³ = 1.8×10⁴ N/C, pointing opposite to p.","h":"Equatorial = half of axial, opposite to p: kp/r³ = 1.8×10⁴ N/C. Take half of the axial answer."},{"q":"The distance along the axis of a dipole is doubled. What happens to the axial field?","c":"It falls to one eighth","w":["It falls to one quarter","It falls to one half","It falls to one sixteenth"],"e":"E ∝ 1/z³. Doubling z divides E by 2³ = 8.","h":"E ∝ 1/z³. Double z → 1/8. Cube the factor."},{"q":"An electron enters a uniform field at right angles to the field with speed v. What is the shape of its path while in the field?","c":"A parabola","w":["A circle","A straight line","A helix"],"e":"The force is constant and perpendicular to the initial velocity, so motion is like a projectile: uniform along one axis, uniformly accelerated along the other.","h":"Perpendicular entry gives a parabola. Constant force ⟂ velocity = projectile motion."},{"q":"An electron enters the region between parallel plates at 1×10⁷ m/s, perpendicular to a field of 2000 N/C. The plates are 0.10 m long. What is its sideways deflection on leaving? (e = 1.6×10⁻¹⁹ C, m = 9.1×10⁻³¹ kg)","c":"About 1.8 cm","w":["About 18 cm","About 0.18 cm","About 3.5 cm"],"e":"t = 0.10/10⁷ = 10⁻⁸ s. a = eE/m = 3.5×10¹⁴ m/s². y = ½at² = 0.5 × 3.5×10¹⁴ × 10⁻¹⁶ = 0.0176 m.","h":"t = L/v = 10⁻⁸ s, a = eE/m = 3.5×10¹⁴. y = ½at² = 0.5 × 3.5×10¹⁴ × 10⁻¹⁶ = 1.8 cm."},{"q":"A proton is released from rest in a uniform field of 1000 N/C and moves 0.20 m. What kinetic energy does it gain? (e = 1.6×10⁻¹⁹ C)","c":"3.2×10⁻¹⁷ J","w":["3.2×10⁻¹⁹ J","1.6×10⁻¹⁷ J","3.2×10⁻¹⁴ J"],"e":"Work = qEd = 1.6×10⁻¹⁹ × 1000 × 0.20 = 3.2×10⁻¹⁷ J, which becomes kinetic energy.","h":"K = qEd = 1.6×10⁻¹⁹ × 1000 × 0.2 = 3.2×10⁻¹⁷ J. Multiply three numbers, no velocity needed."},{"q":"A charged particle is released from rest in a non-uniform field with curved lines. Does it follow a field line?","c":"Not necessarily, since its velocity can carry it off the line as it speeds up","w":["Yes, always, since force is along the line","No, it moves at right angles to the line","Yes, but only if the charge is positive"],"e":"The force is along the tangent at each point, but the particle's momentum keeps it going straight for a bit, so on a curved line it leaves the line. In a straight uniform field it does follow the line.","h":"Curved field lines: a particle does not have to follow the line. The tangent gives force direction, not path."},{"q":"Field lines from a charge +2q are compared with those from a charge +q. How are the numbers of lines drawn?","c":"The +2q charge has twice as many lines","w":["The +2q charge has the same number of lines","The +2q charge has half as many lines","The +2q charge has four times as many lines"],"e":"The number of lines leaving a charge is proportional to the charge.","h":"Lines ∝ charge. +2q has twice as many lines as +q."},{"q":"What happens to field lines near the edges of two oppositely charged parallel plates?","c":"They bulge outward at the edges, which is called fringing","w":["They stay perfectly straight right to the edge","They bend inward at the edges","They disappear at the edges"],"e":"The field between the plates is nearly uniform at the centre, but near the edges the lines curve outward.","h":"Edges of parallel plates: lines bulge out (fringing). Centre is uniform."},{"q":"A drop of mass 1.63×10⁻¹⁵ kg hangs motionless in a field of 1×10⁵ N/C. What is its charge? (g = 9.8 m/s²)","c":"About 1.6×10⁻¹⁹ C","w":["About 1.6×10⁻²⁰ C","About 3.2×10⁻¹⁹ C","About 1.6×10⁻¹⁷ C"],"e":"qE = mg, so q = mg/E = 1.63×10⁻¹⁵ × 9.8 / 10⁵ = 1.6×10⁻¹⁹ C, one electron charge.","h":"Balance: q = mg/E = 1.63×10⁻¹⁵ × 9.8 ÷ 10⁵ = 1.6×10⁻¹⁹ C. One elementary charge."},{"q":"At a point on the perpendicular bisector of an electric dipole, which way does the field point?","c":"Antiparallel to the dipole moment","w":["Parallel to the dipole moment","Perpendicular to the dipole moment","Towards the positive charge"],"e":"The vertical components of the two charges cancel and the horizontal components add, pointing from + to − side, which is opposite to p.","h":"Bisector: vertical parts cancel, horizontal add, pointing opposite to p. Antiparallel."},{"q":"The tangent to a field line at a point gives which quantity?","c":"The direction of the electric field at that point","w":["The direction of the velocity of every charge there","The magnitude of the electric field at that point","The direction of the equipotential surface"],"e":"The line is drawn so that its tangent is the direction of E. The magnitude is shown by line density.","h":"Tangent gives the direction of E. Density gives the magnitude."},{"q":"A field of lines is drawn radially outward from an isolated point charge. What is the sign of the charge?","c":"Positive","w":["Negative","Neutral","It cannot be told from the lines"],"e":"Field lines start on positive charges, so lines pointing outward show a positive charge.","h":"Lines going out = positive. Lines coming in = negative."},{"q":"Which statement about field lines is wrong?","c":"They exist as real physical strings stretched between charges","w":["They are drawn tangent to the field direction","They are more crowded where the field is stronger","They never intersect each other"],"e":"Field lines are only a drawing aid. The field itself fills all space.","h":"Field lines are not physical strings. Pick the option saying they exist as real things."},{"q":"What happens to a positive test charge released at rest in a uniform field?","c":"It accelerates in the direction of the field","w":["It moves at constant speed in the direction of the field","It accelerates against the direction of the field","It stays at rest"],"e":"F = qE is constant and parallel to E, so the charge undergoes constant acceleration along the field.","h":"Positive test charge in a uniform field: accelerates in the direction of E. F = qE constant."}],[{"q":"What is electric flux through a flat surface in a uniform field?","c":"Φ = E·A = EA cos θ, where θ is the angle between E and the area vector A","w":["Φ = E·A = EA sin θ, where θ is the angle between E and the area vector A","Φ = E/A cos θ, where θ is the angle between E and the surface itself","Φ = E × A, which is a vector at right angles to both E and the surface"],"e":"Flux measures how many field lines pass through a surface. Only the part of E along the normal to the surface counts, so we use cos θ with θ measured from the normal (area vector).","h":"Flux = EA cosθ, θ is the angle to the normal (not the surface). Parallel to the normal means full flux."},{"q":"What are the SI unit and the nature of electric flux?","c":"N·m²/C, and it is a scalar quantity","w":["N·m/C, and it is a vector quantity","N/C·m², and it is a scalar quantity","N·m²/C, and it is a vector quantity"],"e":"Flux = E × area, so (N/C) × m² = N·m²/C. The dot product of two vectors is a scalar.","h":"(N/C)×m² = N·m²/C. Scalar (dot product). Pick 'scalar'."},{"q":"When is the electric flux through a surface equal to zero (for a non-zero field)?","c":"When the surface is parallel to the field, so the normal is at 90° to E","w":["When the surface is perpendicular to the field, so the normal is along E","When the surface is at 45° to the field, so the normal is half-way","When the surface is tiny, because flux depends only on the area"],"e":"cos 90° = 0. If the field lines slide along the surface and never pass through it, the flux is zero.","h":"Zero flux when field is parallel to the surface (θ = 90°, cos 90° = 0). Lines slide along it."},{"q":"For a closed surface, which way does the area vector point?","c":"Outward, away from the enclosed volume","w":["Inward, towards the enclosed volume","Along the surface, in the direction of the field","Along the field, whether it points in or out"],"e":"By convention, for a closed surface the area vector points outward. Flux going out is positive and flux going in is negative.","h":"Closed surface: area vector points outward. Outward flux positive, inward negative."},{"q":"State Gauss's law.","c":"The total electric flux through a closed surface equals the net charge enclosed divided by ε₀","w":["The total electric flux through a closed surface equals the net charge enclosed multiplied by ε₀","The total electric flux
