Li².","h":"U = ½Li². Work done raising the current from zero."},{"q":"An inductor of 2 H carries a current of 3 A. How much energy is stored in it?","c":"9 J","w":["18 J","6 J","4.5 J"],"e":"U = ½Li² = ½ × 2 × 3² = 9 J.","h":"U = ½ × 2 × 9 = 9 J. Square the current first."},{"q":"A 0.5 H inductor stores 4 J of energy. What is the current through it?","c":"4 A","w":["8 A","16 A","2 A"],"e":"U = ½Li², so i = √(2U/L) = √(8/0.5) = √16 = 4 A.","h":"i = √(2U/L) = √(8/0.5) = √16 = 4 A."},{"q":"What is the energy density of a magnetic field of strength B in vacuum?","c":"u_B = B²/2μ₀","w":["u_B = B²/μ₀","u_B = μ₀B²/2","u_B = B/2μ₀"],"e":"For a solenoid, U/volume = ½Li²/(Al) = B²/2μ₀. The result holds for any magnetic field.","h":"u = B²/2μ₀. Same for any field in vacuum."},{"q":"What is the magnetic energy density in a region where B = 0.5 T? (μ₀ = 4π×10⁻⁷ T·m/A)","c":"About 9.9×10⁴ J/m³","w":["About 1.0×10⁵ J/m² at the surface only","About 2.0×10⁵ J/m³","About 4.0×10⁴ J/m³"],"e":"u = B²/2μ₀ = 0.25/(2 × 4π×10⁻⁷) = 9.95×10⁴ J/m³.","h":"u = 0.25 ÷ (2 × 4π×10⁻⁷) = 0.25 ÷ 2.51×10⁻⁶ ≈ 9.9×10⁴ J/m³."},{"q":"What does the self-induced emf in an inductor do when the current is increasing?","c":"It acts against the supply, slowing the rise of the current","w":["It acts with the supply, making the current rise faster","It stays zero until the current reaches its final value","It reverses the direction of the current at once"],"e":"By Lenz's law the induced emf opposes the change. A rising current is opposed, so the current takes time to build up.","h":"Self-induced emf opposes the increase. Current rises slowly."},{"q":"What is the time constant τ of a series RL circuit?","c":"τ = L/R","w":["τ = R/L","τ = LR","τ = 1/(LR)"],"e":"The current obeys L di/dt + Ri = ε. The natural time scale is L/R, in seconds (H/Ω = s).","h":"τ = L/R. Unit seconds (H/Ω = s)."},{"q":"An RL circuit has L = 0.5 H and R = 100 Ω. What is its time constant?","c":"5 ms","w":["200 s","50 ms","0.5 s"],"e":"τ = L/R = 0.5/100 = 0.005 s = 5 ms.","h":"0.5 ÷ 100 = 0.005 s = 5 ms."},{"q":"A series RL circuit has R = 20 Ω and L = 0.1 H. What is the time constant?","c":"5 ms","w":["2 ms","200 ms","0.5 ms"],"e":"τ = 0.1/20 = 0.005 s = 5 ms.","h":"0.1 ÷ 20 = 0.005 s = 5 ms. Divide L by R, no extras."},{"q":"A battery is connected across a resistor and inductor in series. What fraction of the final current flows at t = τ?","c":"About 63%, since i = (ε/R)(1 − e^(−t/τ))","w":["About 37%, since i = (ε/R)e^(−t/τ)","About 50%, halfway to the final value","About 86%, after two time constants"],"e":"At t = τ, 1 − e⁻¹ = 0.632. So the current is 63% of ε/R.","h":"At t = τ the current is 63% of final. Same 1 − e⁻¹ as the RC circuit."},{"q":"When an RL circuit is switched on, how does the inductor behave at t = 0 and at a very long time afterwards?","c":"At t = 0 it acts like an open circuit, and at long times like an ordinary wire","w":["At t = 0 it acts like a short circuit, and at long times like an open circuit","At t = 0 and at long times it acts like an open circuit","At t = 0 it acts like an ordinary wire, and at long times like an open circuit"],"e":"At the start di/dt is largest, so the back emf equals the supply and no current flows. Later di/dt → 0, the back emf vanishes and only R limits the current.","h":"t = 0: inductor opposes sudden change (acts open, i = 0). Long time: acts like a wire."},{"q":"After the battery in a charged RL circuit is removed and the current decays through the resistor, how does the current change with time?","c":"i = i₀e^(−t/τ), falling to about 37% after one time constant","w":["i = i₀(1 − e^(−t/τ)), falling to about 63% after one time constant","i = i₀ − Rt/L, falling in a straight line to zero","i = i₀e^(−Rt), falling by the same ratio every second regardless of L"],"e":"With no source, L di/dt = −Ri. The solution is an exponential decay with τ = L/R.","h":"Decay: i = i₀e^(−t/τ). At t = τ it falls to 37%."},{"q":"Two inductors of 0.2 H and 0.3 H are connected in series with negligible mutual coupling. What is the equivalent inductance?","c":"0.5 H","w":["0.12 H","0.1 H","0.06 H"],"e":"For series inductors with no coupling, L = L₁ + L₂ = 0.2 + 0.3 = 0.5 H.","h":"Series inductors: add. 0.2 + 0.3 = 0.5 H."},{"q":"Two inductors of 0.2 H and 0.3 H are connected in parallel with negligible mutual coupling. What is the equivalent inductance?","c":"0.12 H","w":["0.5 H","0.25 H","0.06 H"],"e":"1/L = 1/0.2 + 1/0.3 = 5 + 3.33 = 8.33, so L = 0.12 H. Product over sum gives 0.06/0.5 = 0.12 H.","h":"Parallel: product ÷ sum = 0.06/0.5 = 0.12 H."},{"q":"What does mutual inductance describe?","c":"The emf induced in one coil by a changing current in a neighbouring coil","w":["The emf induced in a coil by a changing current in the same coil","The emf induced in a coil by a steady current in a neighbouring coil","The resistance that two coils offer to each other"],"e":"When the current in coil 1 changes, its flux links coil 2 and induces an emf there. This coupling is the mutual inductance M.","h":"Mutual inductance: emf induced in coil 2 by changing current in coil 1."},{"q":"What is the induced emf in coil 2 in terms of the mutual inductance M and the rate of change of current in coil 1?","c":"ε₂ = −M di₁/dt","w":["ε₂ = −M i₁","ε₂ = +M² di₁/dt","ε₂ = −di₁/(M dt)"],"e":"M = N₂Φ₂₁/i₁, so ε₂ = −N₂dΦ₂₁/dt = −M di₁/dt.","h":"ε₂ = −M di₁/dt. Same pattern as self-inductance with M."},{"q":"Two coils have a mutual inductance of 48.2 mH. The current in the first coil changes at 10 A/s. What emf is induced in the second coil?","c":"0.482 V","w":["4.82 V","0.0482 V","482 V"],"e":"ε₂ = M di₁/dt = 0.0482 × 10 = 0.482 V in magnitude.","h":"ε₂ = M × di₁/dt = 0.0482 × 10 = 0.482 V. mH to H first."},{"q":"How are M₁₂ and M₂₁ related for two coils?","c":"They are equal, M₁₂ = M₂₁ = M","w":["M₁₂ is always larger than M₂₁","M₁₂ = 1/M₂₁","M₁₂ = −M₂₁"],"e":"The mutual inductance depends only on the geometry of the two coils and the medium. It is the same in either direction.","h":"M₁₂ = M₂₁ = M. Depends only on geometry."},{"q":"What is the coupling coefficient k of two coils with self-inductances L₁ and L₂ and mutual inductance M?","c":"k = M/√(L₁L₂)","w":["k = M/(L₁ + L₂)","k = √(L₁L₂)/M","k = M²/(L₁L₂)"],"e":"The most coupling possible gives M = √(L₁L₂). So k compares the actual M to that maximum.","h":"k = M/√(L₁L₂). Maximum 1."},{"q":"Two coils have L₁ = 0.04 H, L₂ = 0.09 H and M = 0.02 H. What is the coupling coefficient?","c":"About 0.33","w":["About 0.67","About 1.5","About 0.15"],"e":"k = 0.02/√(0.04 × 0.09) = 0.02/0.06 = 0.33.","h":"√(0.04 × 0.09) = 0.06. k = 0.02/0.06 = 0.33. Find the root first."},{"q":"What are the limits on the value of the coupling coefficient k?","c":"0 ≤ k ≤ 1, with k = 1 meaning all the flux of one coil links the other","w":["0 ≤ k ≤ 10, with k = 10 meaning the strongest possible coupling","−1 ≤ k ≤ 0, with k = −1 meaning all the flux links the other coil","1 ≤ k ≤ ∞, with k = 1 meaning no flux links the other coil"],"e":"k = 0 means no flux links the second coil. k = 1 is perfect coupling, as in an ideal transformer.","h":"0 ≤ k ≤ 1. k = 1 means all flux links both coils."},{"q":"A 2 H inductor has its current changing at 5 A/s. What is the induced emf magnitude?","c":"10 V","w":["0.4 V","2.5 V","20 V"],"e":"ε = L di/dt = 2 × 5 = 10 V.","h":"ε = 2 × 5 = 10 V. Multiply L by the rate."},{"q":"What is the time constant of an RL circuit with L = 2 H and R = 40 Ω?","c":"0.05 s","w":["20 s","80 s","0.5 s"],"e":"τ = L/R = 2/40 = 0.05 s.","h":"τ = 2/40 = 0.05 s."},{"q":"How much energy is stored in a 0.4 H inductor carrying 5 A?","c":"5 J","w":["10 J","2 J","1 J"],"e":"U = ½Li² = 0.5 × 0.4 × 25 = 5 J.","h":"U = ½ × 0.4 × 25 = 5 J."},{"q":"How does an ideal inductor behave in a DC circuit after a long time?","c":"Like a plain wire with no voltage across it","w":["Like an open circuit","Like a very large resistor","Like a battery"],"e":"When the current is steady, di/dt = 0, so the induced emf is zero.","h":"After a long time: di/dt = 0, no voltage across L. It acts like a plain wire."},{"q":"The number of turns on a solenoid is tripled, with the same size. What happens to its inductance?","c":"It becomes nine times larger","w":["It becomes three times larger","It becomes six times larger","It stays the same"],"e":"L ∝ N². Tripling N multiplies L by 9.","h":"L ∝ N². Triple turns, nine times L."},{"q":"Two coils have mutual inductance 0.1 H. The current in the first changes at 30 A/s. What emf is induced in the second?","c":"3 V","w":["0.003 V","300 V","0.33 V"],"e":"ε₂ = M di₁/dt = 0.1 × 30 = 3 V.","h":"ε₂ = M di/dt = 0.1 × 30 = 3 V."},{"q":"What is the final steady current in a series RL circuit with ε = 12 V and R = 6 Ω?","c":"2 A, regardless of L","w":["2 A, but only for large L","72 A, divided by L","0.5 A, since the inductor opposes the current"],"e":"At steady state the inductor has no voltage, so I = ε/R = 2 A. L only decides how fast it gets there.","h":"I = ε/R = 12/6 = 2 A. Inductance does not change the final current."},{"q":"A series RL circuit is switched on with ε = 12 V and L = 2 H. What is the initial rate of change of current?","c":"6 A/s","w":["24 A/s","0.17 A/s","12 A/s"],"e":"At t = 0, i = 0 so the whole emf appears across L: ε = L di/dt, giving di/dt = 12/2 = 6 A/s.","h":"At t = 0, i = 0, so all the emf is across L: di/dt = ε/L = 12/2 = 6 A/s."},{"q":"What fraction of the final current flows after two time constants in an RL circuit that is switching on?","c":"About 86%","w":["About 63%","About 95%","About 50%"],"e":"1 − e⁻² = 1 − 0.135 = 0.865.","h":"After 2τ: 1 − e⁻² = 1 − 0.135 = 86%. After τ: 63%. After 3τ: 95%."},{"q":"How long does the current take to reach half its final value in an RL circuit?","c":"About 0.69τ","w":["About τ","About 0.5τ","About 2τ"],"e":"1 − e^(−t/τ) = 0.5 gives t = τ ln 2 = 0.693τ.","h":"Half the final current at t = τ ln 2 = 0.69τ."},{"q":"Why can a spark appear across a switch when a circuit with a large inductor is suddenly opened?","c":"The current drops very fast, so a large emf ε = L di/dt is induced","w":["The inductor stores charge that flows out through the switch","The resistance of the open switch becomes zero","The magnetic field produces a static charge on the switch"],"e":"Opening the switch makes di/dt very large and negative. The inductor tries to keep the current going, causing a high voltage.","h":"Open the switch: di/dt very large, emf = L di/dt huge, so the spark. 'Large emf' is the answer."},{"q":"Two inductors of 0.1 H and 0.4 H are perfectly coupled, k = 1. What is the mutual inductance?","c":"0.2 H","w":["0.25 H","0.5 H","0.04 H"],"e":"M = k√(L₁L₂) = √(0.1 × 0.4) = √0.04 = 0.2 H.","h":"M = k√(L₁L₂) = √(0.1 × 0.4) = √0.04 = 0.2 H."},{"q":"A solenoid has N = 500 turns, area 1×10⁻³ m² and length 0.20 m. What is its inductance? (μ₀ = 4π×10⁻⁷)","c":"About 1.6 mH","w":["About 1.6 H","About 0.16 mH","About 16 mH"],"e":"L = μ₀N²A/l = 4π×10⁻⁷ × 250000 × 10⁻³/0.2 = 1.57×10⁻³ H.","h":"L = 4π×10⁻⁷ × 250000 × 10⁻³ ÷ 0.2 = 1.6×10⁻³ H = 1.6 mH."},{"q":"Which factor does NOT affect the inductance of a long air-core solenoid?","c":"The current flowing through it","w":["The number of turns","The cross-sectional area","The length of the solenoid"],"e":"L = μ₀N²A/l depends only on geometry (and core). The current does not appear.","h":"Inductance does NOT depend on the current. Pick 'current'."},{"q":"Convert 250 mH and 50 μH to henries.","c":"0.25 H and 5×10⁻⁵ H","w":["25 H and 5×10⁻³ H","0.025 H and 5×10⁻⁷ H","250 H and 0.05 H"],"e":"1 mH = 10⁻³ H and 1 μH = 10⁻⁶ H.","h":"mH = 10⁻³ H, μH = 10⁻⁶ H. 250 mH = 0.25 H, 50 μH = 5×10⁻⁵ H."},{"q":"During the decay of current in an RL circuit with no battery, where does the stored magnetic energy go?","c":"Into heat in the resistor","w":["Into the battery","Back into the electric field of a capacitor","It disappears"],"e":"The current continues through R. The energy ½Li² is dissipated as I²R heating.","h":"Stored energy dissipates as heat in the resistor (I²R) during decay."},{"q":"Which statement about the induced emf in a self-inductor is correct?","c":"It opposes any change in current, both an increase and a decrease","w":["It opposes only an increase in current","It opposes the current itself","It always has the same direction as the current"],"e":"It opposes the change. When the current falls, the emf acts to keep it going.","h":"Self-induced emf opposes any change: increase or decrease. Both."},{"q":"Two inductors, 0.2 H and 0.3 H, are connected in series with no coupling. What is the total?","c":"0.5 H","w":["0.12 H","0.25 H","0.1 H"],"e":"Series inductors add like resistors: 0.2 + 0.3 = 0.5 H.","h":"Series: 0.2 + 0.3 = 0.5 H."},{"q":"What is the energy density of a magnetic field B in vacuum?","c":"B²/(2μ₀)","w":["B²/μ₀","μ₀B²/2","B/(2μ₀)"],"e":"u = U/volume = B²/2μ₀, derived from ½Li² for a solenoid.","h":"Energy density = B²/2μ₀."},{"q":"The coupling coefficient of two coils is 0. What does this mean?","c":"None of the flux from one coil links the other","w":["All of the flux from one coil links the other","The coils have zero self-inductance","The coils are connected in parallel"],"e":"k = M/√(L₁L₂) = 0 means M = 0, so changing the current in one coil induces no emf in the other.","h":"k = 0 means none of the flux links the second coil. M = 0."}],[{"q":"Which four equations make up Maxwell's equations?","c":"Gauss's law for electricity, Gauss's law for magnetism, Faraday's law and the Ampère–Maxwell law","w":["Coulomb's law, Ohm's law, Faraday's law and Lenz's law","Gauss's law for electricity, Biot–Savart law, Ohm's law and Lenz's law","Coulomb's law, Gauss's law for magnetism, Kirchhoff's law and Ampère's law"],"e":"Together they describe all classical electric and magnetic phenomena. The fourth is Ampère's law with Maxwell's displacement-current term added.","h":"Maxwell's four: Gauss (electric), Gauss (magnetic), Faraday, Ampère–Maxwell. Learn them as G-G-F-A."},{"q":"What does Gauss's law for magnetism, ∮B·dA = 0, tell us?","c":"The net magnetic flux through any closed surface is zero, so isolated magnetic poles do not exist","w":["The net magnetic flux through any closed surface equals the enclosed current, so poles exist alone","The net magnetic flux through a closed surface is zero only when the magnet is at rest","The net magnetic flux through any closed surface equals μ₀ times the enclosed charge"],"e":"Field lines of B form closed loops. Every line that enters a closed surface also leaves it.","h":"∮B·dA = 0: no magnetic monopoles. Net flux through any closed surface is zero."},{"q":"What does Faraday's law in Maxwell's form, ∮E·dl = −dΦ_B/dt, say?","c":"A changing magnetic flux produces an electric field that circulates around it","w":["A changing electric flux produces a magnetic field that circulates around it","A steady magnetic flux produces an electric field that circulates around it","A static charge produces an electric field that circulates in closed loops"],"e":"The line integral of E round a loop is the induced emf. It equals minus the rate of change of magnetic flux through the loop.","h":"Faraday–Maxwell: changing B flux produces a circulating E field."},{"q":"What does the Ampère–Maxwell law say?","c":"∮B·dl = μ₀(i + ε₀dΦ_E/dt), so a magnetic field is produced by a current and by a changing electric flux","w":["∮B·dl = μ₀i only, so a magnetic field is produced by current alone","∮B·dl = −dΦ_E/dt, so a magnetic field is produced only by a changing electric flux","∮B·dl = ε₀q, so a magnetic field is produced by charge at rest"],"e":"Maxwell added the displacement-current term ε₀dΦ_E/dt to Ampère's law. Without it the law fails for a charging capacitor.","h":"Ampère–Maxwell adds μ₀ε₀ dΦ_E/dt. A changing E flux also makes a B field."},{"q":"What is the displacement current?","c":"The term ε₀ dΦ_E/dt, caused by a changing electric flux, which acts as a source of magnetic field","w":["A real flow of charge across the gap between the plates of a capacitor","The current that flows in a wire connected to a changing magnetic field","The term μ₀ dΦ_B/dt, caused by a changing magnetic flux in a coil"],"e":"No charge crosses the gap of a capacitor, but the electric flux there changes. This changing flux gives the same magnetic field as an equivalent current would.","h":"Displacement current = ε₀ dΦ_E/dt. No charge crosses the gap, but changing E acts like a current."},{"q":"In a charging parallel-plate capacitor, how does the displacement current between the plates compare with the conduction current in the wires?","c":"They are equal, so the total current is continuous round the circuit","w":["The displacement current is larger, since the plates are far apart","The displacement current is zero, since no charge crosses the gap","The displacement current is smaller, by a factor of ε₀"],"e":"Since q = CV and E = V/d, ε₀ dΦ_E/dt = ε₀A dE/dt = dq/dt, which is the wire current.","h":"Charging capacitor: displacement current in the gap = conduction current in the wires. Total current continuous."},{"q":"A point charge of 6 nC sits inside a closed surface. What is the electric flux through the surface? (ε₀ = 8.85×10⁻¹² F/m)","c":"About 678 V·m","w":["About 6.8×10⁻⁴ V·m","About 54 V·m","About 6.8×10⁴ V·m"],"e":"Φ = q/ε₀ = 6×10⁻⁹/8.85×10⁻¹² = 678 V·m.","h":"Φ = q/ε₀ = 6×10⁻⁹ ÷ 8.85×10⁻¹² = 678 V·m. Divide 6 by 8.85, then move the power by 3."},{"q":"How is the speed of light in vacuum related to μ₀ and ε₀?","c":"c = 1/√(μ₀ε₀) ≈ 3.0×10⁸ m/s","w":["c = √(μ₀ε₀) ≈ 3.0×10⁸ m/s","c = 1/(μ₀ε₀) ≈ 9.0×10¹⁶ m/s","c = √(μ₀/ε₀) ≈ 377 m/s"],"e":"Maxwell's equations give a wave equation whose speed is 1/√(μ₀ε₀) = 2.998×10⁸ m/s, the measured speed of light. He concluded light is an electromagnetic wave.","h":"c = 1/√(μ₀ε₀) = 3×10⁸ m/s."},{"q":"What are the main properties of an electromagnetic wave in vacuum?","c":"It is transverse, with E and B perpendicular to each other and to the direction of travel, and in phase","w":["It is longitudinal, with E and B both along the direction of travel","It is transverse, with E and B parallel to each other and to the direction of travel","It is transverse, with E and B perpendicular to each other and 90° out of phase"],"e":"E, B and the direction of propagation form a right-handed set. E and B rise and fall together, and E = cB.","h":"EM wave: transverse, E ⟂ B ⟂ direction of travel, in phase, moves at c in vacuum."},{"q":"What is the ratio of the electric field amplitude to the magnetic field amplitude in an EM wave in vacuum?","c":"E/B = c","w":["E/B = 1/c","E/B = c²","E/B = μ₀"],"e":"The two fields are tied together by E = cB at every point and every moment.","h":"E/B = c. Pick the option with c."},{"q":"An EM wave in vacuum has an electric field amplitude of 300 V/m. What is the magnetic field amplitude?","c":"About 1.0×10⁻⁶ T","w":["About 9.0×10¹⁰ T","About 1.0×10⁻⁹ T","About 1.0×10⁻³ T"],"e":"B = E/c = 300/(3×10⁸) = 1.0×10⁻⁶ T.","h":"B = E/c = 300 ÷ 3×10⁸ = 1×10⁻⁶ T. Divide by 3×10⁸ every time."},{"q":"What does a static electric charge produce?","c":"Only an electric field, and no electromagnetic wave","w":["An electric field and a magnetic field together","An electromagnetic wave with a very low frequency","A magnetic field only"],"e":"A charge at rest has only E. A charge moving at steady speed has E and B. Only an accelerating charge radiates EM waves.","h":"A static charge makes only an E field. No wave."},{"q":"What kind of charge motion produces electromagnetic waves?","c":"Accelerated charges, for example charges oscillating in an antenna","w":["Charges moving at a constant speed along a straight wire","Charges held at rest on the plates of a capacitor","Charges moving in a steady direct current"],"e":"Accelerating charges make changing E and B fields. Each changing field makes the other, and the wave travels outward.","h":"Accelerated charges radiate EM waves. Steady motion does not."},{"q":"Which of the following lists EM waves in order of increasing frequency?","c":"Radio, microwave, infrared, visible, ultraviolet, X-ray, gamma","w":["Gamma, X-ray, ultraviolet, visible, infrared, microwave, radio","Radio, infrared, microwave, visible, X-ray, ultraviolet, gamma","Microwave, radio, visible, infrared, ultraviolet, gamma, X-ray"],"e":"Frequency goes up as wavelength goes down. Radio waves have the longest wavelength, gamma rays the shortest.","h":"Order by rising frequency: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma. Wavelength falls in the same order."},{"q":"Which EM waves have the longest wavelength?","c":"Radio waves","w":["Gamma rays","Visible light","X-rays"],"e":"Radio waves reach metres and kilometres. Gamma rays are smaller than an atom.","h":"Radio waves have the longest wavelength. Gamma the shortest."},{"q":"What is the approximate wavelength range of visible light?","c":"About 400 nm to 700 nm","w":["About 4 nm to 7 nm","About 400 μm to 700 μm","About 4 mm to 7 mm"],"e":"Violet light is near 400 nm and red light near 700 nm.","h":"Visible light: about 400 nm (violet) to 700 nm (red)."},{"q":"Which relation links the speed, frequency and wavelength of an EM wave?","c":"c = fλ","w":["c = f/λ","c = λ/f","c = f + λ"],"e":"The wave travels one wavelength in one period, so speed = λ/T = fλ.","h":"c = fλ. Speed = frequency × wavelength."},{"q":"What is the wavelength of a 100 MHz radio wave in vacuum? (c = 3.0×10⁸ m/s)","c":"3 m","w":["0.3 m","30 m","300 m"],"e":"λ = c/f = 3×10⁸/10⁸ = 3 m.","h":"λ = c/f = 3×10⁸ ÷ 10⁸ = 3 m. MHz = 10⁶."},{"q":"What is the wavelength of electromagnetic radiation of frequency 5×10¹⁴ Hz in vacuum? (c = 3.0×10⁸ m/s)","c":"600 nm","w":["60 nm","6000 nm","1.5×10²³ nm"],"e":"λ = c/f = 3×10⁸/(5×10¹⁴) = 6×10⁻⁷ m = 600 nm, orange light.","h":"λ = 3×10⁸ ÷ 5×10¹⁴ = 0.6×10⁻⁶ m = 600 nm. 3 ÷ 5 = 0.6."},{"q":"What is the wavelength of the electromagnetic wave produced by a 60 Hz power line? (c = 3.0×10⁸ m/s)","c":"5×10⁶ m","w":["5×10⁻⁶ m","1.8×10¹⁰ m","2×10⁻⁷ m"],"e":"λ = c/f = 3×10⁸/60 = 5×10⁶ m, thousands of kilometres.","h":"λ = 3×10⁸ ÷ 60 = 5×10⁶ m. Easy division by 60."},{"q":"Does an electromagnetic wave need a material medium to travel?","c":"No, it travels through vacuum at the speed c","w":["Yes, it needs air in order to carry the oscillations","Yes, it needs a solid or a liquid, and it cannot go through a gas","No, but in vacuum it travels slower than it does in air"],"e":"Changing E and B fields keep making each other, so the wave carries on without any matter. That is how sunlight reaches us.","h":"EM waves need no medium. They travel in vacuum at c."},{"q":"What does the Poynting vector S = E×B/μ₀ represent?","c":"The rate of energy flow per unit area, pointing in the direction of travel of the wave","w":["The momentum stored in the wave per unit volume, pointing along E","The electric charge carried by the wave per unit area, pointing along B","The frequency of the wave, pointing in the direction of the magnetic field"],"e":"Its magnitude is power per unit area (W/m²). Its direction is E × B, which is the direction the wave moves.","h":"Poynting vector S = E×B/μ₀: energy flow per unit area, points the way the wave goes."},{"q":"An EM wave in vacuum has an electric field amplitude of 100 V/m. What is its average intensity? (I = ½cε₀E₀², ε₀ = 8.85×10⁻¹² F/m)","c":"About 13 W/m²","w":["About 27 W/m²","About 1.3 W/m²","About 130 W/m²"],"e":"I = ½ × 3×10⁸ × 8.85×10⁻¹² × 100² = 13.3 W/m².","h":"I = ½cε₀E₀² = 0.5 × 3×10⁸ × 8.85×10⁻¹² × 10⁴ = 13 W/m². Multiply 0.5 × 3 × 8.85 = 13.3, powers cancel."},{"q":"What is the energy of a single photon of frequency f?","c":"E = hf","w":["E = h/f","E = hf²","E = f/h"],"e":"Planck's relation. The energy is proportional to the frequency, so gamma-ray photons carry far more energy than radio photons.","h":"Photon energy E = hf. Higher frequency, more energy."},{"q":"A simple harmonic oscillator has x = A cos(ωt + φ). How are ω, f and T related?","c":"ω = 2πf = 2π/T","w":["ω = f/2π = T/2π","ω = 2πT = 2π/f","ω = πf = π/T"],"e":"One cycle covers 2π radians in one period T, so ω = 2π/T. Since f = 1/T, ω = 2πf.","h":"ω = 2πf = 2π/T. Memorise the three together."},{"q":"A body in simple harmonic motion has amplitude 0.05 m and angular frequency 20 rad/s. What is its maximum speed?","c":"1 m/s","w":["0.0025 m/s","100 m/s","0.25 m/s"],"e":"v_max = ωA = 20 × 0.05 = 1 m/s, reached as it passes through the centre.","h":"v_max = ωA = 20 × 0.05 = 1 m/s."},{"q":"For the same body (A = 0.05 m, ω = 20 rad/s), what is the maximum acceleration?","c":"20 m/s²","w":["1 m/s²","400 m/s²","0.25 m/s²"],"e":"a_max = ω²A = 400 × 0.05 = 20 m/s², reached at the ends of the motion.","h":"a_max = ω²A = 400 × 0.05 = 20 m/s². Square ω first."},{"q":"A mass of 0.5 kg hangs on a spring of constant 50 N/m. What is the period of oscillation?","c":"About 0.63 s","w":["About 0.10 s","About 6.3 s","About 1.6 s"],"e":"T = 2π√(m/k) = 2π√(0.5/50) = 2π × 0.1 = 0.628 s.","h":"T = 2π√(m/k) = 2π × √0.01 = 2π × 0.1 = 0.63 s."},{"q":"What is the natural frequency of oscillation of an LC circuit?","c":"f = 1/(2π√(LC))","w":["f = 2π√(LC)","f = √(LC)/2π","f = 1/(2πLC)"],"e":"Energy swings between the capacitor's electric field and the inductor's magnetic field. The angular frequency is ω = 1/√(LC).","h":"LC circuit: f = 1/(2π√LC). Remember it matches 1/√(LC) for ω."},{"q":"An LC circuit has L = 1 mH and C = 1 μF. What is its oscillation frequency?","c":"About 5.0 kHz","w":["About 31.6 kHz","About 160 Hz","About 1.0 kHz"],"e":"ω = 1/√(10⁻³ × 10⁻⁶) = 3.16×10⁴ rad/s. f = ω/2π = 5.03×10³ Hz.","h":"ω = 1/√(LC) = 1/√10⁻⁹ = 3.16×10⁴. f = ω ÷ 6.28 = 5.0 kHz."},{"q":"What happens to the energy in an ideal LC circuit as it oscillates?","c":"It passes back and forth between the capacitor's electric field and the inductor's magnetic field, with the total constant","w":["It stays in the capacitor all the time, and only the charge changes","It is lost steadily as heat in the inductor, so the oscillation dies out","It stays in the inductor all the time, and only the current changes"],"e":"When the capacitor is full, the current is zero and all the energy is electric. A quarter-cycle later the energy is all magnetic. Without resistance the total ½Li² + q²/2C stays constant.","h":"Energy swings between the capacitor (electric) and the inductor (magnetic). Total stays constant."},{"q":"Which of Maxwell's equations says that isolated magnetic poles do not exist?","c":"Gauss's law for magnetism, ∮B·dA = 0","w":["Gauss's law for electricity, ∮E·dA = q/ε₀","Faraday's law, ∮E·dl = −dΦ_B/dt","The Ampère–Maxwell law"],"e":"Zero net magnetic flux through any closed surface means field lines never start or end, so there are no monopoles.","h":"No magnetic monopoles = Gauss's law for magnetism."},{"q":"What was Maxwell's addition to Ampère's law?","c":"The displacement current term, ε₀ dΦ_E/dt","w":["The term −dΦ_B/dt","A term for magnetic monopoles","A term for the resistance of the loop"],"e":"Without it, Ampère's law fails for a charging capacitor. With it, a changing electric field also produces a magnetic field.","h":"Maxwell added the displacement current term ε₀ dΦ_E/dt to Ampère's law."},{"q":"An EM wave has a wavelength of 3 m in vacuum. What is its frequency? (c = 3×10⁸ m/s)","c":"100 MHz","w":["1 GHz","10 MHz","9×10⁸ Hz"],"e":"f = c/λ = 3×10⁸/3 = 10⁸ Hz = 100 MHz.","h":"f = c/λ = 3×10⁸ ÷ 3 = 10⁸ Hz = 100 MHz."},{"q":"Which of these is NOT an electromagnetic wave?","c":"Ultrasound","w":["Microwaves","X-rays","Radio waves"],"e":"Ultrasound is a mechanical sound wave and needs a medium. The others are EM waves and travel in vacuum.","h":"Ultrasound is a sound (mechanical) wave, so it is not EM. Others are EM."},{"q":"Which EM radiation has the shortest wavelength?","c":"Gamma rays","w":["X-rays","Ultraviolet","Infrared"],"e":"Gamma rays have the highest frequency and so the shortest wavelength.","h":"Shortest wavelength = highest frequency = gamma rays."},{"q":"How are E and B related in the phase of a plane EM wave?","c":"They are in phase, both reaching maximum together","w":["They are 90° out of phase","They are 180° out of phase","E is zero when B is at its maximum"],"e":"The two fields rise and fall together. This is a feature of EM waves, unlike the energy in an LC circuit.","h":"E and B in a plane EM wave: in phase, peak together."},{"q":"An EM wave in vacuum has E₀ = 600 V/m. What is B₀? (c = 3×10⁸ m/s)","c":"2×10⁻⁶ T","w":["1.8×10¹¹ T","2×10⁻¹¹ T","2×10⁻³ T"],"e":"B₀ = E₀/c = 600/(3×10⁸) = 2×10⁻⁶ T.","h":"B₀ = E₀/c = 600 ÷ 3×10⁸ = 2×10⁻⁶ T."},{"q":"In which direction does an EM wave travel relative to its E and B fields?","c":"Along E × B","w":["Along E","Along B","Along E + B"],"e":"The wave is transverse. The Poynting vector S = E × B/μ₀ gives the direction of energy flow.","h":"Wave travels along E × B. Right-hand rule with E first."},{"q":"What frequency has light of wavelength 500 nm in vacuum? (c = 3×10⁸ m/s)","c":"6×10¹⁴ Hz","w":["6×10⁸ Hz","1.5×10⁻⁶ Hz","6×10⁻¹⁵ Hz"],"e":"f = c/λ = 3×10⁸/(5×10⁻⁷) = 6×10¹⁴ Hz.","h":"f = c/λ = 3×10⁸ ÷ 5×10⁻⁷ = 6×10¹⁴ Hz."},{"q":"What is the energy of a photon of frequency 6×10¹⁴ Hz? (h = 6.63×10⁻³⁴ J·s)","c":"About 4.0×10⁻¹⁹ J","w":["About 4.0×10⁻⁴⁸ J","About 1.1×10⁻⁴⁸ J","About 4.0×10⁻¹⁵ J"],"e":"E = hf = 6.63×10⁻³⁴ × 6×10¹⁴ = 3.98×10⁻¹⁹ J.","h":"E = hf = 6.63×10⁻³⁴ × 6×10¹⁴ = 4.0×10⁻¹⁹ J. 6.63 × 6 = 39.8, powers give −20."},{"q":"Light of wavelength 600 nm in vacuum enters glass of refractive index 1.5. What is its wavelength in the glass?","c":"400 nm","w":["900 nm","600 nm","1000 nm"],"e":"Frequency stays the same, and speed drops by n. So λ = λ₀/n = 600/1.5 = 400 nm.","h":"Frequency same, wavelength ÷ n: 600 ÷ 1.5 = 400 nm."},{"q":"What happens to the frequency of light when it passes from air into glass?","c":"It stays the same","w":["It increases","It decreases","It becomes zero"],"e":"The frequency is set by the source. Speed and wavelength change at the boundary.","h":"Frequency never changes between media. Speed and wavelength change."},{"q":"How long does sunlight take to reach Earth, 1.5×10¹¹ m away? (c = 3×10⁸ m/s)","c":"About 500 s, or 8.3 minutes","w":["About 5 s","About 50 000 s","About 8.3 s"],"e":"t = d/c = 1.5×10¹¹/3×10⁸ = 500 s.","h":"t = d/c = 1.5×10¹¹ ÷ 3×10⁸ = 500 s ≈ 8.3 min."},{"q":"The electric field amplitude of an EM wave is doubled. What happens to its intensity?","c":"It becomes four times larger","w":["It doubles","It becomes eight times larger","It stays the same"],"e":"I ∝ E₀². Doubling E₀ gives four times the intensity.","h":"I ∝ E₀². Double E, four times I."},{"q":"What does the term ε₀ dΦ_E/dt in the Ampère–Maxwell law represent?","c":"A displacement current, which produces a magnetic field like a real current","w":["A real current of free charges across the capacitor gap","An emf induced by a changing magnetic flux","The energy density of the electric field"],"e":"No charge crosses the gap of a capacitor, but the changing electric flux acts as a source of B.","h":"ε₀ dΦ_E/dt is the displacement current. It makes a magnetic field like real current."},{"q":"What does Faraday's law, in Maxwell's form, say about a changing magnetic field?","c":"It produces a circulating electric field","w":["It produces a static electric charge","It produces a magnetic monopole","It produces a steady current in vacuum"],"e":"∮E·dl = −dΦ_B/dt. A changing B makes E loops, which is the basis of induction.","h":"Faraday: changing B produces a circulating E. Minus sign (Lenz)."},{"q":"In SHM, x = 0.1 cos(10πt) m. What are the frequency and period?","c":"5 Hz and 0.2 s","w":["10π Hz and 0.1 s","31.4 Hz and 0.032 s","2.5 Hz and 0.4 s"],"e":"ω = 10π, so f = ω/2π = 5 Hz and T = 1/f = 0.2 s.","h":"ω = 10π, f = ω/2π = 5 Hz, T = 0.2 s. Just divide by 2π."},{"q":"A mass of 0.5 kg on a spring with k = 200 N/m oscillates with amplitude 0.1 m. What is the total energy?","c":"1 J","w":["2 J","10 J","0.1 J"],"e":"E = ½kA² = 0.5 × 200 × 0.01 = 1 J. Notice mass does not matter.","h":"E = ½kA² = 0.5 × 200 × 0.01 = 1 J. Mass is not needed."},{"q":"At which point in SHM is the kinetic energy a maximum?","c":"At the equilibrium position, x = 0","w":["At the extremes of motion, x = ±A","At x = A/2","It is constant throughout"],"e":"At x = 0 the speed is greatest and the potential energy is zero. At x = ±A the speed is zero.","h":"KE is maximum at the equilibrium position (x = 0). PE is maximum at the ends."},{"q":"The capacitance of an LC circuit is doubled with the same L. What happens to its oscillation frequency?","c":"It falls by the factor √2","w":["It doubles","It halves","It rises by the factor √2"],"e":"f = 1/(2π√(LC)). Doubling C divides f by √2.","h":"f ∝ 1/√C. Double C, f falls by √2."},{"q":"A pendulum has length 1.0 m. What is its period for small swings? (g = 9.8 m/s²)","c":"About 2.0 s","w":["About 1.0 s","About 0.5 s","About 6.3 s"],"e":"T = 2π√(L/g) = 2π√(1/9.8) = 2.01 s.","h":"T = 2π√(L/g) = 2π × 0.32 = 2.0 s for L = 1 m. Remember 'a 1 m pendulum swings in 2 s'."},{"q":"How does the frequency of a simple harmonic oscillator depend on its amplitude?","c":"It does not depend on amplitude","w":["It increases with amplitude","It decreases with amplitude","It is proportional to the square of the amplitude"],"e":"ω = √(k/m) has no A in it. Bigger swings take the same time per cycle.","h":"SHM frequency does not depend on amplitude. ω = √(k/m)."}]];
</script>
<script>
const LOCK_ID='phy102',COURSE='PHY 102';
const NAMES=['Electrostatics & Coulomb\'s Law','Electric Field','Field Lines & Dipoles','Flux & Gauss\'s Law','Electric Potential','Current & Circuits','Capacitors','Dielectrics & Magnetic Force','Induction & Ampère','Inductance','Maxwell & EM Waves'];
const ALL=[];CHAPTERS.forEach((ch,i)=>ch.forEach((q,j)=>ALL.push(Object.assign({id:i+'_'+j,ch:i},q))));
const $=id=>document.getElementById(id);
$('sub').textContent='PHY 102 — Electricity & Magnetism CBT (500 Questions)';
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seenGet(){try{return JSON.parse(localStorage.getItem('phy102_seen')||'[]')}catch(e){return[]}}
function seenAdd(id){try{const s=new Set(seenGet());s.add(id);localStorage.setItem('phy102_seen',JSON.stringify([...s]))}catch(e){}}
function draw(n){const seen=new Set(seenGet());const u=shuf(ALL.filter(q=>!seen.has(q.id))),s=shuf(ALL.filter(q=>seen.has(q.id)));return shuf(u.concat(s).slice(0,n))}
function grade(p){return p>=70?'A':p>=60?'B':p>=50?'C':p>=45?'D':p>=40?'E':'F'}
const FULL=500,HALF=250;
const RUNS=[{k:'full',t:'Full CBT',n:FULL},{k:'quick',t:'Quick Drill',n:50},{k:'half',t:'Half Run',n:HALF},{k:'chap',t:'By Chapter',n:'🎯'}];
let run='full',pick1=null;
function renderSetup(){
 $('runs').innerHTML=RUNS.map(r=>`<div class="run ${r.k===run?'sel':''}" data-k="${r.k}"><b>${r.n}</b>${r.t}</div>`).join('');
 $('runs').querySelectorAll('.run').forEach(e=>e.onclick=()=>{run=e.dataset.k;renderSetup()});
 $('chips').className='chips'+(run==='chap'?' on':'');
 $('chips').innerHTML=NAMES.map((n,i)=>`<div class="chip ${pick1===i?'sel':''}" data-i="${i}"><span>${i+1}. ${n}</span><span>${CHAPTERS[i].length}</span></div>`).join('');
 $('chips').querySelectorAll('.chip').forEach(e=>e.onclick=()=>{pick1=+e.dataset.i;renderSetup()});
}
let Q=[],idx=0,ans=[],isRetry=false,orders=[];
function ask(t,yes,noLabel){$('ovt').textContent=t;$('ovy').style.display=yes?'block':'none';$('ovn').textContent=yes?'CANCEL':'OK';$('ovy').textContent='YES';$('ov').classList.add('on');$('ovy').onclick=()=>{$('ov').classList.remove('on');yes&&yes()};$('ovn').onclick=()=>$('ov').classList.remove('on')}
let lockMod=null;
const lockReady=import('../cbt-lock.js').catch(()=>import('/cbt-lock.js')).then(m=>{lockMod=m},()=>{lockMod=null});
async function lockBlocked(){
 try{await lockReady;if(lockMod&&typeof lockMod.checkCbtAccess==='function'){const r=await lockMod.checkCbtAccess(LOCK_ID);if(r&&r.blocked&&typeof lockMod.renderCbtLockScreen==='function'){lockMod.renderCbtLockScreen(document.querySelector('.wrap'),r.reason);return true}}}catch(e){}
 return false}
$('start').onclick=async()=>{
 if(await lockBlocked())return;
 let list;
 if(run==='chap'){if(pick1===null){ask('Pick a chapter first.');return}list=shuf(ALL.filter(q=>q.ch===pick1))}
 else list=draw(run==='full'?FULL:run==='quick'?50:HALF);
 begin(list,false);
};
let startedAt=0;
function begin(list,retry){Q=list;idx=0;startedAt=Date.now();ans=Q.map(()=>null);orders=Q.map(q=>shuf([q.c].concat(q.w)));isRetry=retry;
 $('setup').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');window.scrollTo(0,0);show()}
function score(){return ans.reduce((s,a,i)=>s+(a!==null&&a===Q[i].c?1:0),0)}
function show(){
 const q=Q[idx],a=ans[idx];
 const nOk=score(),nNo=ans.filter(x=>x!==null).length-nOk;$('qn').textContent='Q '+(idx+1)+' / '+Q.length;$('sOk').textContent=nOk;$('sNo').textContent=nNo;
 $('pb').style.width=(ans.filter(x=>x!==null).length/Q.length*100)+'%';
 $('tg').textContent='Ch '+(q.ch+1)+' · '+NAMES[q.ch];$('qt').textContent=q.q;$('opts').innerHTML='';
 orders[idx].forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent='ABCD'[i]+'.  '+t;
  if(a!==null){if(t===q.c)b.classList.add('ok');else if(t===a)b.classList.add('no');else b.classList.add('dim')}
  b.onclick=()=>choose(t);$('opts').appendChild(b)});
 $('fb').innerHTML=a===null?'':`<div class="fb"><b>${a===q.c?'Correct.':'Wrong.'}</b> ${q.e}<div class="hk">⚡ Speed hack: ${q.h}</div></div>`;
 $('prev').disabled=idx===0;
 $('next').textContent=idx===Q.length-1?'Finish ▶':'Next ▶';
}
function choose(t){
 if(ans[idx]!==null)return;ans[idx]=t;seenAdd(Q[idx].id);
 try{if(lockMod&&typeof lockMod.recordCbtQuestionUsed==='function')lockMod.recordCbtQuestionUsed()}catch(e){}
 show();
}
$('prev').onclick=()=>{if(idx>0){idx--;show();window.scrollTo(0,0)}};
$('next').onclick=()=>{if(idx<Q.length-1){idx++;show();window.scrollTo(0,0)}else trySubmit()};
function trySubmit(){const left=ans.filter(x=>x===null).length;
 if(left){ask(left+' question(s) not answered yet. Finish anyway?',finish);$('ovy').textContent='Finish now';$('ovn').textContent='Go back'}else finish()}
$('mapb').onclick=()=>{
 $('map').innerHTML=Q.map((q,i)=>{const a=ans[i];const c=a===null?'':(a===q.c?'c':'x');return `<button class="mn ${c} ${i===idx?'cur':''}" data-i="${i}">${i+1}</button>`}).join('');
 $('map').querySelectorAll('.mn').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;$('mo').classList.remove('on');show();window.scrollTo(0,0)});
 $('mo').classList.add('on')};
$('mclose').onclick=()=>$('mo').classList.remove('on');
$('finishBtn').onclick=trySubmit;
function finish(){
 $('quiz').classList.add('hide');
 const sc=score(),pct=Math.round(sc/Q.length*100);
 const stat={};Q.forEach((q,i)=>{const s=stat[q.ch]=stat[q.ch]||{r:0,t:0};s.t++;if(ans[i]===q.c)s.r++});
 const rows=Object.keys(stat).map(k=>{const s=stat[k];return{k:+k,n:NAMES[k],r:s.r,t:s.t,p:Math.round(s.r/s.t*100)}}).sort((a,b)=>a.k-b.k);
 if(!isRetry){try{const done=ans.filter(x=>x!==null).length;if(done>0&&window.IndigeneHistory&&typeof IndigeneHistory.save==='function'){const tp={};Q.forEach((q,k)=>{if(ans[k]===null)return;const nm='Ch '+(q.ch+1)+' · '+NAMES[q.ch];if(!tp[nm])tp[nm]=[0,0];tp[nm][1]++;if(ans[k]===q.c)tp[nm][0]++});IndigeneHistory.save({course:'PHY102',mode:'cbt',correct:sc,total:done,secs:Math.round((Date.now()-startedAt)/1000),topics:tp})}}catch(e){}}
 const wrong=Q.map((q,i)=>({q,t:ans[i]})).filter(w=>w.t!==w.q.c);
 let h=`<div class="brand" style="font-size:1.8rem">RESULT</div><div class="big">${pct}/100</div><div class="g" style="font-size:1.4rem">Grade ${grade(pct)}</div><div class="sub" style="margin-top:6px">${sc} of ${Q.length} correct</div>`;
 rows.forEach(r=>h+=`<div class="row"><span>${r.n} (${r.r}/${r.t})</span><span class="g">${r.p}/100 · ${grade(r.p)}</span></div>`);
 if(wrong.length){h+=`<div class="rh">WRONG ANSWERS (${wrong.length})</div>`;
  wrong.forEach(w=>h+=`<div class="rev"><b>${w.q.q}</b><br>Your answer: <span style="color:var(--no)">${w.t===null?'Not answered':w.t}</span><br>Correct: <span style="color:var(--ok)">${w.q.c}</span><br>${w.q.e}<br><span style="color:var(--gd)">⚡ ${w.q.h}</span></div>`);
  h+='<button class="btn" id="rt">RETRY WRONG ANSWERS</button>'}
 h+='<button class="btn alt" id="nw">NEW RUN</button>';
 $('result').innerHTML=h;$('result').classList.remove('hide');window.scrollTo(0,0);
 if($('rt'))$('rt').onclick=()=>begin(shuf(wrong.map(w=>w.q)),true);
 $('nw').onclick=()=>{$('result').classList.add('hide');$('setup').classList.remove('hide');renderSetup()};
}
renderSetup();
</script></body></html>
