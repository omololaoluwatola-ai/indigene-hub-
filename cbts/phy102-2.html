d output, tuning radios."},{"q":"Which of these are common dielectric materials for capacitors?","c":"Mica, glass, paper and aluminium oxide","w":["Copper, silver, gold and aluminium","Mica, copper, glass and iron","Paper, silver, glass and graphite"],"e":"A dielectric is an insulator between the plates. Mica, glass, paper, air and aluminium oxide are common. Metals are conductors, so they cannot be dielectrics.","h":"Dielectrics are insulators: mica, glass, paper, aluminium oxide. Skip any list with metals."},{"q":"Example 7.1: Capacitors of 15 µF, 10 µF, 6 µF and 3 µF are connected in series across 20 V. What is the equivalent capacitance?","c":"1.5 µF","w":["34 µF","0.67 µF","15 µF"],"e":"1/C = 1/15 + 1/10 + 1/6 + 1/3 = (2 + 3 + 5 + 10)/30 = 20/30 = 0.667 per µF. So C = 1.5 µF.","h":"1/C = 1/15 + 1/10 + 1/6 + 1/3. Use 30 as common denominator: (2 + 3 + 5 + 10)/30 = 20/30, so C = 1.5 µF."},{"q":"Example 7.1(b): What is the charge on each of the series capacitors (C_eq = 1.5 µF, 20 V)?","c":"30 µC on each","w":["7.5 µC on each","30 µC shared equally between them","300 µC on each"],"e":"Q = C_eq V = (1.5 × 10⁻⁶)(20) = 30 µC. In series every capacitor carries the same charge.","h":"Series: Q is the same everywhere. Q = C_eq × V = 1.5 × 20 = 30 µC."},{"q":"Example 7.1(c): With 30 µC on each, what are the voltages across the 15 µF, 10 µF, 6 µF and 3 µF capacitors?","c":"2 V, 3 V, 5 V and 10 V","w":["10 V, 5 V, 3 V and 2 V","5 V on each","20 V on each"],"e":"V = Q/C: 30/15 = 2 V, 30/10 = 3 V, 30/6 = 5 V, 30/3 = 10 V. They add up to the 20 V supply. The smallest capacitor takes the biggest voltage.","h":"V = Q/C for each: 30/15, 30/10, 30/6, 30/3 = 2, 3, 5, 10. They add to 20 V. Smallest C gets the biggest V."},{"q":"Example 7.2: What is the absolute potential at 10 cm from a 2.0 µC point charge?","c":"1.8 × 10⁵ V","w":["1.8 × 10⁷ V","1.8 × 10³ V","3.6 × 10⁴ V"],"e":"V = kq/r = (9.0 × 10⁹)(2.0 × 10⁻⁶) ÷ 0.10 = 1.8 × 10⁵ V.","h":"V = 9×10⁹ × 2×10⁻⁶ ÷ 0.10 = 1.8×10⁵ V."},{"q":"Example 7.2: What is the potential at 50 cm from the same 2.0 µC charge, and how much work is needed to carry a 0.05 µC charge from 50 cm to 10 cm?","c":"V = 36 kV and W ≈ 7.2 mJ","w":["V = 36 kV and W ≈ 7.2 µJ","V = 180 kV and W ≈ 7.2 mJ","V = 36 kV and W ≈ 9.0 mJ"],"e":"V₅₀ = V₁₀/5 = 36 kV. Work = q(V₁₀ − V₅₀) = (5 × 10⁻⁸)(1.8 × 10⁵ − 0.36 × 10⁵) = (5 × 10⁻⁸)(1.44 × 10⁵) = 7.2 × 10⁻³ J.","h":"V ∝ 1/r. Five times further = one fifth: 1.8×10⁵ ÷ 5 = 36 kV. Then W = qΔV."},{"q":"Example 7.3: A 3.0 pF and a 6.0 pF capacitor are in series across 1000 V. What is the equivalent capacitance and the charge on each?","c":"C_eq = 2.0 pF and q = 2.0 nC on each","w":["C_eq = 9.0 pF and q = 9.0 nC on each","C_eq = 2.0 pF and q = 1.0 nC on each","C_eq = 4.5 pF and q = 2.0 nC on each"],"e":"1/C = 1/3 + 1/6 = 1/2, so C = 2.0 pF. q = CV = (2.0 × 10⁻¹²)(1000) = 2.0 × 10⁻⁹ C.","h":"Series of 3 pF and 6 pF: product/sum = 18/9 = 2 pF. q = 2 × 1000 = 2 nC."},{"q":"Example 7.3 continued: What are the potential differences across the 3.0 pF and 6.0 pF capacitors (q = 2.0 nC)?","c":"667 V across the 3.0 pF and 333 V across the 6.0 pF","w":["333 V across the 3.0 pF and 667 V across the 6.0 pF","500 V across each capacitor","1000 V across each capacitor"],"e":"V₁ = q/C₁ = 2.0 × 10⁻⁹ ÷ 3.0 × 10⁻¹² = 667 V. V₂ = q/C₂ = 2.0 × 10⁻⁹ ÷ 6.0 × 10⁻¹² = 333 V. They sum to 1000 V.","h":"V = q/C: 2 nC ÷ 3 pF = 667 V, 2 nC ÷ 6 pF = 333 V. They add to 1000 V. The smaller C gets more."},{"q":"Example 7.3 continued: What is the total energy stored in the 3.0 pF and 6.0 pF series combination across 1000 V?","c":"1.0 µJ (0.67 µJ in the 3.0 pF and 0.33 µJ in the 6.0 pF)","w":["1.0 mJ (0.67 mJ in the 3.0 pF and 0.33 mJ in the 6.0 pF)","2.0 µJ (1.33 µJ in the 3.0 pF and 0.67 µJ in the 6.0 pF)","0.5 µJ (0.33 µJ in the 3.0 pF and 0.17 µJ in the 6.0 pF)"],"e":"U = ½qV for each: ½(2.0 × 10⁻⁹)(667) = 6.7 × 10⁻⁷ J and ½(2.0 × 10⁻⁹)(333) = 3.3 × 10⁻⁷ J. Total = 1.0 × 10⁻⁶ J. Same as ½C_eq V² = ½(2 × 10⁻¹²)(10⁶).","h":"U = ½ C_eq V² = ½ × 2×10⁻¹² × 10⁶ = 1.0 µJ. Use C_eq with the total voltage."},{"q":"Example 7.4: A 2.0 pF and a 6.0 pF capacitor are in parallel across 120 V. What are C_eq and the charge on each?","c":"C_eq = 8.0 pF, with 0.24 nC and 0.72 nC on the two","w":["C_eq = 1.5 pF, with 0.48 nC on each","C_eq = 8.0 pF, with 0.48 nC on each","C_eq = 8.0 pF, with 0.72 nC and 0.24 nC on the two"],"e":"C_eq = 2.0 + 6.0 = 8.0 pF. Each has 120 V across it: q₁ = (2.0 × 10⁻¹²)(120) = 0.24 nC and q₂ = (6.0 × 10⁻¹²)(120) = 0.72 nC. Total = 0.96 nC.","h":"Parallel: C = 2 + 6 = 8 pF. Q = CV: 2 × 120 = 0.24 nC, 6 × 120 = 0.72 nC."},{"q":"Problem 7.1: What does it mean to say that the capacitance of a capacitor is 20 µF?","c":"It stores 20 µC of charge for every 1 V across it","w":["It stores 20 C of charge for every 1 µV across it","It can hold a maximum charge of exactly 20 µC","It stores 20 µJ of energy for every 1 V across it"],"e":"C = Q/V = 20 µF means Q/V = 20 × 10⁻⁶ C per volt. It is a ratio. It is not a maximum charge.","h":"20 µF means 20 µC for each volt. C = Q/V."},{"q":"Problem 7.2: A capacitor C₃ is in series with a parallel pair C₁ and C₂. What is the equivalent capacitance?","c":"C = C₃(C₁ + C₂)/(C₁ + C₂ + C₃)","w":["C = C₃(C₁ + C₂) + C₁C₂","C = (C₁ + C₂ + C₃)/C₃(C₁ + C₂)","C = C₁C₂C₃/(C₁ + C₂ + C₃)"],"e":"First add the parallel pair: C₁₂ = C₁ + C₂. Then put it in series with C₃: C = C₁₂C₃/(C₁₂ + C₃) = C₃(C₁ + C₂)/(C₁ + C₂ + C₃).","h":"(C₁ + C₂) in series with C₃: C = C₃(C₁ + C₂)/(C₁ + C₂ + C₃). Product over sum."},{"q":"Problem 7.3: A capacitor C is in parallel with a series pair of two capacitors each of value C. What is the equivalent capacitance?","c":"3C/2","w":["C/3","2C/3","3C"],"e":"The series pair gives C/2. In parallel with the other C, C_eq = C + C/2 = 3C/2.","h":"Series pair = C/2. Parallel with C: C + C/2 = 3C/2."},{"q":"Problem 7.4: Two 2 µF capacitors are in parallel across 120 V. What is the charge on each?","c":"2.4 × 10⁻⁴ C","w":["1.2 × 10⁻⁴ C","4.8 × 10⁻⁴ C","2.4 × 10⁻⁶ C"],"e":"Each capacitor has 120 V across it. Q = CV = (2 × 10⁻⁶)(120) = 2.4 × 10⁻⁴ C. The total charge is 4.8 × 10⁻⁴ C.","h":"Parallel across 120 V. Each Q = 2×10⁻⁶ × 120 = 2.4×10⁻⁴ C."},{"q":"Problem 7.5: A 2 µF capacitor is in series with three equal capacitors C in parallel. The effective capacitance between X and Y is 1.5 µF. What is C?","c":"2.0 µF","w":["6.0 µF","0.67 µF","1.5 µF"],"e":"The parallel group is 3C. Series: 1/1.5 = 1/2 + 1/3C. So 1/3C = 0.667 − 0.5 = 0.167, which gives 3C = 6 µF and C = 2.0 µF.","h":"Parallel group 3C. Series with 2 µF gives 1.5 µF: 1/3C = 1/1.5 − 1/2 = 1/6, so 3C = 6 and C = 2 µF."},{"q":"Problem 7.7: Three 120 pF capacitors, each charged to 0.50 kV, are connected in series. What is the potential difference across the end plates?","c":"1.5 kV","w":["0.50 kV","0.17 kV","4.5 kV"],"e":"When the charged capacitors are connected in series (end to end, + to −), the voltages add: 3 × 0.50 kV = 1.5 kV.","h":"Connected in series with the same polarity: voltages add. 3 × 0.5 = 1.5 kV."},{"q":"Problem 7.7 (continued): What is the charge on each capacitor, and the total energy stored in the series system?","c":"60 nC on each and 45 µJ","w":["180 nC on each and 45 µJ","60 nC on each and 135 µJ","20 nC on each and 15 µJ"],"e":"Q = CV = (120 × 10⁻¹²)(500) = 60 nC. In series the charge on each stays 60 nC. C_eq = 120/3 = 40 pF. U = ½C_eq V² = ½(40 × 10⁻¹²)(1500)² = 4.5 × 10⁻⁵ J = 45 µJ.","h":"Q = CV = 120 pF × 500 V = 60 nC. Series total C = 40 pF, V = 1.5 kV: U = ½ × 40×10⁻¹² × 2.25×10⁶ = 45 µJ."},{"q":"Problem 7.8: Capacitors of 0.30 µF and 0.50 µF are connected in parallel. What is their equivalent capacitance, and what is the potential difference if 200 µC is placed on the combination?","c":"0.80 µF and 0.25 kV","w":["0.19 µF and 1.1 kV","0.80 µF and 4.0 × 10⁻⁴ kV","0.20 µF and 0.25 kV"],"e":"C = 0.30 + 0.50 = 0.80 µF. V = Q/C = 200 µC ÷ 0.80 µF = 250 V = 0.25 kV.","h":"Parallel: C = 0.30 + 0.50 = 0.80 µF. Voltage is the same across both."},{"q":"Problem 7.8(c): With 250 V across the 0.30 µF and 0.50 µF parallel capacitors, what are the charges on them?","c":"75 µC on the 0.30 µF and 125 µC (0.13 mC) on the 0.50 µF","w":["125 µC on the 0.30 µF and 75 µC on the 0.50 µF","100 µC on each capacitor","75 µC on each capacitor"],"e":"Q = CV: 0.30 µF × 250 V = 75 µC and 0.50 µF × 250 V = 125 µC. The sum is the 200 µC that was placed on the combination.","h":"Q = CV for each. 0.30 × 250 = 75 µC and 0.50 × 250 = 125 µC. Same V, so more C means more Q."},{"q":"Problem 7.10(b): A 5.0 µF capacitor is subjected to a 2000 V potential difference. What energy is stored in it?","c":"10 J","w":["10 mJ","20 J","5 J"],"e":"U = ½CV² = ½(5.0 × 10⁻⁶)(2000)² = ½(5 × 10⁻⁶)(4 × 10⁶) = 10 J.","h":"U = ½CV² = ½ × 5×10⁻⁶ × 4×10⁶ = 10 J. 2000² = 4×10⁶."},{"q":"A 10 μF capacitor is charged to 12 V. How much charge is on it?","c":"120 μC","w":["1.2 μC","0.83 μC","1.2 C"],"e":"Q = CV = 10×10⁻⁶ × 12 = 1.2×10⁻⁴ C = 120 μC.","h":"Q = CV = 10 µF × 12 V = 120 µC. Micro stays in the answer."},{"q":"The plate separation of an air parallel-plate capacitor is halved. What happens to its capacitance?","c":"It doubles","w":["It halves","It quadruples","It stays the same"],"e":"C = ε₀A/d, so C is inversely proportional to d.","h":"d halved → C doubled."},{"q":"A parallel-plate capacitor has plate area 0.01 m² and separation 1 mm. What is its capacitance? (ε₀ = 8.85×10⁻¹² F/m)","c":"About 88.5 pF","w":["About 88.5 nF","About 8.85 pF","About 885 pF"],"e":"C = ε₀A/d = 8.85×10⁻¹² × 0.01/10⁻³ = 8.85×10⁻¹¹ F = 88.5 pF.","h":"C = 8.85×10⁻¹² × 0.01 ÷ 0.001 = 8.85×10⁻¹¹ F = 88.5 pF. Convert 1 mm to metres."},{"q":"A 10 μF capacitor is charged to 100 V. How much energy does it store?","c":"0.05 J","w":["0.5 J","1.0×10⁻³ J","5.0×10⁻⁵ J"],"e":"U = ½CV² = 0.5 × 10×10⁻⁶ × 10⁴ = 0.05 J.","h":"U = ½ × 10×10⁻⁶ × 10⁴ = 0.05 J. 100² = 10⁴."},{"q":"Capacitors of 6 μF and 3 μF are connected in series. What is the equivalent capacitance?","c":"2 μF","w":["9 μF","4.5 μF","18 μF"],"e":"Product over sum: 18/9 = 2 μF.","h":"Series: product ÷ sum = 18/9 = 2 µF."},{"q":"Capacitors of 6 μF and 3 μF are connected in parallel. What is the equivalent capacitance?","c":"9 μF","w":["2 μF","4.5 μF","18 μF"],"e":"In parallel, capacitances add: 6 + 3 = 9 μF.","h":"Parallel: add. 6 + 3 = 9 µF."},{"q":"Which quantity is the same for all capacitors connected in series?","c":"The charge","w":["The voltage","The capacitance","The energy stored"],"e":"Charge moved to one plate has to come from its neighbour, so each capacitor holds the same Q. The voltage divides.","h":"Series: the same charge on each capacitor."},{"q":"Two 4 μF capacitors in series are connected across a 10 V supply. What is the charge on each?","c":"20 μC","w":["40 μC","80 μC","10 μC"],"e":"C_eq = 2 μF. Q = 2×10⁻⁶ × 10 = 20 μC, and each capacitor carries that same charge. Each has 5 V.","h":"Two 4 µF in series: C_eq = 2 µF. Q = 2 × 10 = 20 µC."},{"q":"A charged capacitor remains connected to the battery while a dielectric of constant κ is inserted. What happens to the charge on the plates?","c":"It increases by the factor κ","w":["It decreases by the factor κ","It stays the same","It becomes zero"],"e":"The battery keeps V fixed. C rises by κ, so Q = CV rises by κ.","h":"Battery stays connected: V fixed, C increases by κ, so Q increases by κ."},{"q":"A charged capacitor is disconnected from the battery and then a dielectric of constant κ is inserted. What happens to the voltage across it?","c":"It decreases by the factor κ","w":["It increases by the factor κ","It stays the same","It increases by the factor κ²"],"e":"Q is fixed because the plates are isolated. C rises by κ so V = Q/C falls by κ.","h":"Battery disconnected: Q fixed, C × κ, so V falls by 1/κ. Voltage decreases by κ."},{"q":"A charged, isolated capacitor has a dielectric of constant κ inserted. How does the stored energy change?","c":"It decreases by the factor κ","w":["It increases by the factor κ","It stays the same","It decreases by the factor κ²"],"e":"U = Q²/2C with Q fixed. C rises by κ so U falls by κ. The dielectric is pulled in, so the field does work.","h":"Isolated: Q fixed, U = Q²/2C, C × κ so U ÷ κ. Energy decreases by κ."},{"q":"A 2 μF capacitor charged to 60 V is connected to an uncharged 4 μF capacitor. What is the common final voltage?","c":"20 V","w":["30 V","40 V","60 V"],"e":"Charge is conserved: 2×10⁻⁶ × 60 = 120 μC shared across 6 μF, so V = 20 V.","h":"Charge conserved: 2 × 60 = 120 µC. Total C = 6 µF. V = 120/6 = 20 V."},{"q":"How much energy is lost when the charged 2 μF capacitor (60 V) is connected to the uncharged 4 μF capacitor?","c":"2.4 mJ","w":["1.2 mJ","3.6 mJ","Zero, since charge is conserved"],"e":"Initial: ½ × 2×10⁻⁶ × 3600 = 3.6 mJ. Final: ½ × 6×10⁻⁶ × 400 = 1.2 mJ. Loss = 2.4 mJ, as heat and radiation in the connection.","h":"U_i = ½ × 2×10⁻⁶ × 3600 = 3.6 mJ. U_f = ½ × 6×10⁻⁶ × 400 = 1.2 mJ. Lost = 2.4 mJ."},{"q":"Two identical capacitors, one charged to V and one uncharged, are connected together. What fraction of the original energy remains?","c":"One half","w":["All of it","One quarter","None of it"],"e":"The voltage falls to V/2 with total capacitance 2C, so U = ½(2C)(V/2)² = ¼CV², which is half of the original ½CV².","h":"Equal capacitors share: V falls to V/2, energy = ½(2C)(V/2)² = U/2. One half is left (half lost as heat)."},{"q":"What does an uncharged capacitor in a DC circuit act like at the instant a switch is closed?","c":"A short circuit","w":["An open circuit","A very large resistor","A battery"],"e":"With no charge, the voltage across it is zero, so current flows freely at the start. After a long time, it acts like an open circuit.","h":"Uncharged capacitor at t = 0 acts as a short circuit. Full current flows."},{"q":"What is the time constant of a series RC circuit with R = 1 kΩ and C = 100 μF?","c":"0.1 s","w":["10 s","0.1 ms","100 s"],"e":"τ = RC = 1000 × 100×10⁻⁶ = 0.1 s.","h":"τ = RC = 1000 × 100×10⁻⁶ = 0.1 s. Multiply kΩ by µF to get ms."},{"q":"A capacitor charges through a resistor from a battery. What fraction of the final voltage is reached at t = RC?","c":"About 63%","w":["About 37%","About 50%","About 86%"],"e":"V = V₀(1 − e^(−t/RC)). At t = RC, 1 − e⁻¹ = 0.63.","h":"At t = RC the voltage is 1 − e⁻¹ = 63% of final. Remember 63%."},{"q":"What is the total charge on a charged parallel-plate capacitor taken as a whole?","c":"Zero, since the plates carry +Q and −Q","w":["+Q","−Q","2Q"],"e":"The charge Q quoted for a capacitor is the magnitude on each plate. The plates carry equal and opposite charges.","h":"Plates carry +Q and −Q: total charge is zero."},{"q":"Three equal capacitors C are joined in series and then in parallel. What are the equivalent capacitances?","c":"C/3 in series and 3C in parallel","w":["3C in series and C/3 in parallel","C/3 in series and C/3 in parallel","3C in series and 3C in parallel"],"e":"Series: 1/C_eq = 3/C so C_eq = C/3. Parallel: add, 3C.","h":"Series: C/3. Parallel: 3C."},{"q":"Both the plate area and the separation of an air capacitor are doubled. What happens to its capacitance?","c":"It stays the same","w":["It doubles","It quadruples","It halves"],"e":"C = ε₀A/d. Doubling both A and d cancels.","h":"C = ε₀A/d: both doubled, ratio unchanged. C is the same."},{"q":"A 6 μF capacitor is in series with two 3 μF capacitors connected in parallel. What is the total capacitance?","c":"3 μF","w":["12 μF","1.5 μF","6 μF"],"e":"The parallel pair gives 6 μF. Then 6 μF in series with 6 μF gives 3 μF.","h":"Parallel pair = 6 µF. Series with 6 µF = 3 µF. Equal capacitors in series halve."},{"q":"What is the energy density in the field between capacitor plates?","c":"½ε₀E²","w":["ε₀E²","½ε₀E","½E²/ε₀"],"e":"u = U/volume = ½CV²/(Ad) = ½ε₀E². It is the energy per unit volume of the field.","h":"Energy density u = ½ε₀E²."}],[{"q":"What happens to the electric field between charged parallel plates when a dielectric is inserted?","c":"The field is weakened by the factor k, E = E₀/k, because induced surface charges oppose the applied field","w":["The field is strengthened by the factor k, E = kE₀, because the dielectric adds charge","The field is unchanged, E = E₀, because the dielectric is an insulator","The field is reduced to zero, because the dielectric blocks every field line"],"e":"The dielectric polarizes. Bound charges −q′ and +q′ appear on its surfaces and their field opposes E₀. The net field is E = (q − q′)/(Aε₀) = E₀/k.","h":"Dielectric weakens the field: E = E₀/κ. Same charge, smaller field."},{"q":"What is polarization in a dielectric?","c":"The redistribution of positive and negative charge in the material under a field, creating induced surface charges","w":["The movement of free electrons through the material, creating a current","The conversion of the material into a conductor under a field","The permanent removal of the electrons from the atoms of the material"],"e":"In a dielectric the charges cannot move freely but they shift slightly. This creates induced surface charges (bound charge). The material behaves as many tiny dipoles.","h":"Polarization: charges shift slightly and line up, no free flow. Insulator only."},{"q":"What is the electric displacement vector D in terms of E and the polarization P?","c":"D = ε₀E + P, and in a linear dielectric D = εE","w":["D = ε₀E − P, and in a linear dielectric D = E/ε","D = ε₀P + E, and in a linear dielectric D = εP","D = E/ε₀ + P, and in a linear dielectric D = ε/E"],"e":"D includes the field and the polarization. P is the dipole moment per unit volume. In a linear dielectric D = εE with ε = kε₀.","h":"D = ε₀E + P. In a linear dielectric D = εE."},{"q":"What does the integral form of Gauss's law for dielectrics state?","c":"The surface integral of D over a closed surface equals the free charge enclosed, ∮D·dA = q","w":["The surface integral of E over a closed surface equals the free charge enclosed, ∮E·dA = q","The surface integral of D over a closed surface equals the bound charge enclosed, ∮D·dA = q′","The surface integral of D over a closed surface equals zero for every dielectric material"],"e":"Using D = εE, the dielectric constant is absorbed. Only free charge is on the right side, so you don't need to know the bound charge.","h":"Gauss for dielectrics: ∮D·dA = free charge only. Bound charge is hidden inside D."},{"q":"What does the differential form of Gauss's law for a dielectric say?","c":"The divergence of D equals the free charge density, ∇·D = ρ_f","w":["The divergence of D equals the bound charge density, ∇·D = ρ_b","The divergence of E equals the free charge density, ∇·E = ρ_f","The curl of D equals the free charge density, ∇×D = ρ_f"],"e":"Total ρ = ρ_f + ρ_b with ρ_b = −∇·P. Putting D = ε₀E + P into ∇·E = ρ/ε₀ gives ∇·D = ρ_f.","h":"Differential form: ∇·D = ρ_free. Free charge, not total."},{"q":"How is the bound (polarization) charge density related to the polarization P?","c":"ρ_b = −∇·P","w":["ρ_b = +∇·P","ρ_b = −∇×P","ρ_b = −P/ε₀"],"e":"Where the polarization spreads out (positive divergence) bound charge is left behind, negative. So ρ_b = −∇·P.","h":"ρ_b = −∇·P. Bound charge is minus the divergence of P."},{"q":"Which statements about magnets are correct?","c":"Like poles repel, unlike poles attract, the effect is strongest at the poles, and poles occur in equal and opposite pairs","w":["Like poles attract, unlike poles repel, the effect is strongest at the centre, and a single pole can exist alone","Like poles repel, unlike poles attract, the effect is strongest at the centre, and a single pole can exist alone","Like poles attract, unlike poles repel, the effect is strongest at the poles, and poles occur in equal and opposite pairs"],"e":"N repels N and S repels S, while N attracts S. A bar magnet is strongest at its ends. If you cut a magnet you get two smaller magnets, each with N and S. There is no isolated pole.","h":"Like poles repel, unlike attract. Poles are strongest at the ends of a bar magnet."},{"q":"With which charges do magnetic forces interact?","c":"Only with moving charges","w":["Only with stationary charges","With all charges, moving or stationary","Only with positive charges"],"e":"Electric forces act on any charge. Magnetic forces act only on charges that are moving, as in a current.","h":"Magnetic force acts only on moving charges. Electric force acts on any charge."},{"q":"Why does the north pole of a compass needle point towards Earth's geographic north?","c":"Earth's geographic north is close to a magnetic south pole, which attracts the needle's north pole","w":["Earth's geographic north is close to a magnetic north pole, which attracts the needle's north pole","Earth's geographic north is close to a magnetic south pole, which repels the needle's north pole","Earth's geographic north is close to a magnet's equator, which pulls the needle sideways"],"e":"Unlike poles attract. The needle's north end is drawn to a magnetic south pole, which lies near Earth's geographic north.","h":"Compass N points to Earth's geographic north because that end is close to a magnetic SOUTH pole. Unlike poles attract."},{"q":"What are magnetic declination and magnetic inclination?","c":"Declination is the angle between magnetic north and geographic north, and inclination is the angle of the field above or below the horizontal","w":["Declination is the angle of the field above or below the horizontal, and inclination is the angle between magnetic and geographic north","Declination is the strength of the field at the poles, and inclination is the strength at the equator","Declination is the angle between the magnet and the compass, and inclination is the angle of the compass needle to the ground"],"e":"Earth's magnetic axis is not parallel to its rotation axis, so a compass deviates from true north (declination). The field also dips (inclination), and is vertical at the magnetic poles.","h":"Declination = angle between magnetic north and true north. Inclination (dip) = angle of the field below the horizontal."},{"q":"How is the direction of a magnetic field at a point defined?","c":"As the direction of the force the field would exert on a magnetic north pole at that point","w":["As the direction of the force the field would exert on a magnetic south pole at that point","As the direction in which a stationary charge would begin to move","As the direction in which a compass needle's south end points"],"e":"A compass aligns with the field. The field direction is the way a magnetic north pole would be pushed, which is the way the compass's north end points.","h":"Field direction = direction a compass N pole would point. It follows the way a north pole is pushed."},{"q":"What is the magnetic force on a charge q moving with velocity v in a magnetic field B?","c":"F = qv × B, with magnitude F = qvB sin θ","w":["F = qv · B, with magnitude F = qvB cos θ","F = qB/v, with magnitude F = qB sin θ/v","F = q(v + B), with magnitude F = q(v + B) sin θ"],"e":"The force is the vector (cross) product of v and B. θ is the angle between v and B. The force is perpendicular to both v and B.","h":"F = qv × B, magnitude qvB sinθ. Cross product, not dot."},{"q":"When is the magnetic force on a moving charge zero, and when is it maximum?","c":"Zero when v is parallel or antiparallel to B (θ = 0° or 180°), maximum when v is perpendicular to B (θ = 90°)","w":["Zero when v is perpendicular to B (θ = 90°), maximum when v is parallel to B (θ = 0°)","Zero only when the charge is negative, maximum only when the charge is positive","Zero when v is at 45° to B, maximum when v is at 135° to B"],"e":"F = qvB sin θ. sin 0° = sin 180° = 0 and sin 90° = 1. So a charge moving along the field feels no magnetic force.","h":"F = 0 when v ∥ B (0° or 180°). Maximum at 90°. sinθ again."},{"q":"How do you find the direction of the magnetic force on a moving positive charge?","c":"It is the direction of v × B (right-hand rule), and it is reversed for a negative charge","w":["It is the direction of v × B (right-hand rule), and it is the same for a negative charge","It is the direction of B, and it is reversed for a negative charge","It is the direction of v, and it is reversed for a negative charge"],"e":"Point the fingers along v, curl them towards B, and the thumb gives F for a positive charge. For a negative charge the force is opposite.","h":"Right hand: fingers along v, curl to B, thumb gives F on a positive charge. Reverse it for a negative."},{"q":"What is the SI unit of magnetic field B?","c":"The tesla, 1 T = 1 N/(A·m) = 1 Wb/m²","w":["The gauss, 1 G = 1 N/(A·m) = 1 Wb/m²","The tesla, 1 T = 1 N/(C·m) = 1 J/m²","The weber, 1 Wb = 1 N/(A·m) = 1 T/m²"],"e":"From F = qvB, B = F/qv with unit N/(C·m/s) = N/(A·m). The gauss is smaller: 1 G = 10⁻⁴ T. Earth's field is about 10⁻⁴ T (1 G).","h":"Tesla = N/(A·m) = Wb/m². Gauss is much smaller (1 T = 10⁴ G)."},{"q":"What does the Lorentz force law say about a charge moving in both electric and magnetic fields?","c":"F = q(E + v × B), the vector sum of the electric force and the magnetic force","w":["F = q(E · v × B), the product of the electric force and the magnetic force","F = q(E + v · B), the sum of the electric force and a scalar magnetic term","F = qE only, because the magnetic force never acts on a charge"],"e":"Both fields act on the particle at once. The electric part is qE and the magnetic part is qv × B. The net force is their vector sum.","h":"Lorentz force: F = q(E + v × B). Electric part plus magnetic part."},{"q":"Which statement about magnetic field lines is correct?","c":"They are tangent to B, point away from north poles and towards south poles outside the magnet, and never intersect","w":["They are at right angles to B, point away from south poles, and may intersect where the field is weak","They are tangent to B, point towards north poles and away from south poles, and never intersect","They are tangent to B, point away from north poles, and intersect at the neutral point"],"e":"The tangent to the line shows the direction of B. Lines are closer where B is strong. Since B has one direction at each point, lines cannot cross. At a neutral point the two fields cancel, so B = 0 there, and no line passes through it.","h":"Field lines are tangent to B, leave N and enter S outside the magnet. Closed loops overall."},{"q":"How is magnetic flux defined, and what is its unit?","c":"Φ_B = ∫B·dA = BA cos θ, with the unit weber (Wb) = T·m²","w":["Φ_B = ∫B·dA = BA sin θ, with the unit tesla (T) = Wb/m²","Φ_B = B/A cos θ, with the unit weber (Wb) = T/m²","Φ_B = B × A, a vector, with the unit weber (Wb) = T·m"],"e":"Like electric flux, it is the dot product of B and the area vector. θ is the angle between B and the normal to the loop. B is also called flux density, since B = dΦ/dA⊥.","h":"Φ_B = BA cosθ. Unit weber (Wb) = T·m²."},{"q":"What does Gauss's law for magnetism state?","c":"The total magnetic flux through any closed surface is always zero","w":["The total magnetic flux through a closed surface equals the enclosed magnetic pole strength over μ₀","The total magnetic flux through a closed surface equals the enclosed charge over ε₀","The total magnetic flux through a closed surface is always positive and equal to BA"],"e":"Magnetic monopoles have never been found. Every field line that leaves a closed surface comes back in, so net flux is zero: ∮B·dA = 0.","h":"Gauss for magnetism: total flux through a closed surface is zero. No monopoles."},{"q":"A charge q of mass m moves at speed v at right angles to a uniform field B. What is the radius of its circular path?","c":"R = mv/qB = p/qB","w":["R = qB/mv","R = mv²/qB","R = qv/mB"],"e":"The magnetic force provides the centripetal force: qvB = mv²/R. So R = mv/(qB), which is the momentum divided by qB.","h":"R = mv/qB. Magnetic force = centripetal: qvB = mv²/R. Rearrange."},{"q":"A charge q of mass m circles in a uniform field B. What is its cyclotron frequency, and what does it depend on?","c":"f = qB/2πm, which depends on q/m and B but not on the speed or the radius","w":["f = qB/2πm, which depends on the speed and the radius but not on q/m","f = mB/2πq, which depends on q/m and B but not on the speed","f = 2πm/qB, which depends on q/m and B but not on the radius"],"e":"ω = v/R = qB/m, so f = ω/2π = qB/2πm. A fast particle takes a bigger circle and the period stays the same. This is the principle of the cyclotron.","h":"f = qB/2πm. Depends on q/m and B, not on speed or radius."},{"q":"Does a magnetic field do work on a moving charge?","c":"No, because the force is always at right angles to the velocity, so the kinetic energy does not change","w":["Yes, because the force changes the direction and so also the speed","Yes, because the field must supply the centripetal force from its own energy","No, because the magnetic force is zero for any charge that is moving"],"e":"Work = F·v dt = 0 since F ⊥ v. The speed stays constant. Only the direction changes.","h":"Magnetic force is ⟂ to v, so it does no work. Speed constant, KE constant."},{"q":"What is the magnitude of the magnetic force on a straight wire of length l carrying current I in a field B at angle θ?","c":"F = BIl sin θ, greatest when the wire is perpendicular to the field","w":["F = BIl cos θ, greatest when the wire is parallel to the field","F = BI/l sin θ, greatest when the wire is perpendicular to the field","F = BIl², greatest when the wire is parallel to the field"],"e":"The wire is a line of moving charges. Force on it is I l × B. F = BIl when l ⊥ B and zero when l ∥ B.","h":"F = BIl sinθ. Maximum when wire ⟂ B."},{"q":"What does Fleming's left-hand rule give?","c":"The thumb gives the thrust (force), the first finger gives the field, and the second finger gives the current","w":["The thumb gives the field, the first finger gives the thrust (force), and the second finger gives the current","The thumb gives the current, the first finger gives the thrust (force), and the second finger gives the field","The thumb gives the thrust (force), the first finger gives the current, and the second finger gives the field"],"e":"Hold the thumb, first finger and second finger at right angles. First finger = Field, seCond finger = Current, Thumb = Thrust. It is used for motors.","h":"Fleming's left hand: thumb = force, first finger = field, second finger = current. Think F-B-I (Thrust, Field, Current)."},{"q":"What is the torque on a coil of N turns, area A, carrying current I in a uniform field B?","c":"τ = NBIA sin θ, where θ is the angle between B and the normal to the coil","w":["τ = NBIA cos θ, where θ is the angle between B and the normal to the coil","τ = BIA sin θ/N, where θ is the angle between B and the normal to the coil","τ = NBI/A sin θ, where θ is the angle between B and the normal to the coil"],"e":"The net force on a loop is zero but the forces on opposite sides form a couple. Each turn adds BIA sin θ, so N turns give N times as much.","h":"τ = NBIA sinθ, θ is between B and the normal to the coil."},{"q":"What is the magnetic dipole moment of a current loop, and how is the torque written with it?","c":"μ = NIA (unit A·m²), with direction along the normal to the loop, and τ = μ × B","w":["μ = NI/A (unit A/m²), with direction along the plane of the loop, and τ = μ × B","μ = NIA (unit A·m²), with direction along the plane of the loop, and τ = μ · B","μ = NIA (unit A·m), with direction along the normal to the loop, and τ = B/μ"],"e":"The direction of μ is given by the right-hand rule (curl the fingers along the current, thumb along μ). Then τ = μB sin θ, or in vector form μ × B.","h":"μ = NIA, along the normal to the loop. τ = μ × B."},{"q":"At which angle between the normal of a current loop and B is the loop in stable equilibrium?","c":"θ = 0°, where the torque is zero and a small turn brings the loop back","w":["θ = 180°, where the torque is zero and a small turn brings the loop back","θ = 90°, where the torque is zero and a small turn brings the loop back","θ = 45°, where the torque is greatest and the loop is held in place"],"e":"At 0° the moment μ is along B. A small turn gives a torque that rotates it back. At 180° the loop is in unstable equilibrium, since a small turn grows.","h":"Stable equilibrium at θ = 0° (μ along B). 180° is unstable."},{"q":"In which direction do the right-hand screw rule and the field lines of a long straight wire point?","c":"The field lines are circles around the wire, and the direction is the way a right-handed screw rotates when it advances along the current","w":["The field lines are straight lines along the wire, and the direction is the same as the current","The field lines are circles around the wire, and the direction is the way a right-handed screw rotates when it moves against the current","The field lines are circles around the wire, and the direction is always clockwise whichever way the current flows"],"e":"If the current comes out of the page (dot), the field circles anticlockwise. If it goes into the page (cross), the circles are clockwise.","h":"Field lines circle the wire. Thumb along current, fingers curl in the field direction."},{"q":"Example 8.1: A proton (1.6 × 10⁻¹⁹ C) moves at 3.0 × 10⁵ m/s through a uniform field of 2.0 T along +z, with its velocity at 30° to +z. What is the force?","c":"4.8 × 10⁻¹⁴ N","w":["9.6 × 10⁻¹⁴ N","8.3 × 10⁻¹⁴ N","4.8 × 10⁻¹⁹ N"],"e":"F = qvB sin θ = (1.6 × 10⁻¹⁹)(3.0 × 10⁵)(2.0)(sin 30°) = 9.6 × 10⁻¹⁴ × 0.5 = 4.8 × 10⁻¹⁴ N.","h":"qvB = 1.6×10⁻¹⁹ × 3×10⁵ × 2 = 9.6×10⁻¹⁴. The angle is 30°, so ×0.5 = 4.8×10⁻¹⁴ N. Never skip sinθ."},{"q":"Example 8.1 (continued): If the beam were electrons instead of protons, what would change?","c":"The direction of the force reverses, but the magnitude stays 4.8 × 10⁻¹⁴ N","w":["The direction stays the same, and the magnitude becomes much smaller","The direction reverses, and the magnitude becomes much smaller","The direction stays the same, and the magnitude stays 4.8 × 10⁻¹⁴ N"],"e":"The electron has the same size of charge but the opposite sign. F = qv × B changes sign, so the direction is opposite. The magnitude uses |q|, so it is unchanged.","h":"Electron: same magnitude of force, opposite direction (negative charge)."},{"q":"Example 8.2: A straight wire 3.5 cm long carries 5 A at right angles to a field of 0.2 T. What is the force on it?","c":"0.035 N","w":["3.5 N","0.35 N","0.0035 N"],"e":"F = BIl = (0.2)(5)(3.5 × 10⁻²) = 0.035 N.","h":"F = BIl = 0.2 × 5 × 0.035 = 0.035 N. Convert 3.5 cm to metres."},{"q":"Example 8.3: A galvanometer coil has area 2 cm², 100 turns and carries 1 mA in a radial field of 0.2 T. What is the torque?","c":"4.0 × 10⁻⁶ N·m","w":["4.0 × 10⁻² N·m","4.0 × 10⁻⁹ N·m","2.0 × 10⁻⁶ N·m"],"e":"τ = NBIA = (100)(0.2)(1 × 10⁻³)(2 × 10⁻⁴) = 4.0 × 10⁻⁶ N·m. A radial field keeps the plane of the coil parallel to B, so the torque is at maximum.","h":"τ = NBIA = 100 × 0.2 × 10⁻³ × 2×10⁻⁴ = 4×10⁻⁶ N·m. cm² to m²: ×10⁻⁴."},{"q":"Example 8.4: A circular coil of radius 0.0500 m with 30 turns carries 5.00 A in a 1.20 T field, with μ at 90° to B. What are the magnetic moment and the torque?","c":"μ = 1.18 A·m² and τ = 1.41 N·m","w":["μ = 1.18 A·m² and τ = 0.98 N·m","μ = 0.039 A·m² and τ = 0.047 N·m","μ = 1.18 A·m² and τ = 0 N·m"],"e":"μ = NIA = 30 × 5.00 × π(0.0500)² = 1.18 A·m². τ = μB sin 90° = 1.18 × 1.20 × 1 = 1.41 N·m.","h":"μ = NIA = 30 × 5 × π(0.05)² = 1.18. τ = μB = 1.18 × 1.2 = 1.41 N·m."},{"q":"Example 8.5: What magnetic field is needed for electrons to move in circular paths at 2450 MHz (m = 9.11 × 10⁻³¹ kg, q = 1.6 × 10⁻¹⁹ C)?","c":"0.0877 T","w":["0.877 T","0.0140 T","5.5 × 10⁻⁴ T"],"e":"B = 2πfm/q = 2π(2450 × 10⁶)(9.11 × 10⁻³¹) ÷ 1.6 × 10⁻¹⁹ = 0.0877 T.","h":"B = 2πfm/q = 6.28 × 2.45×10⁹ × 9.11×10⁻³¹ ÷ 1.6×10⁻¹⁹ = 0.0877 T."},{"q":"Problem 8.1: An electron at 7.60 × 10⁶ m/s in a field of 83.0 mT has acceleration 4.70 × 10¹⁴ m/s². What is the angle between its velocity and the field?","c":"About 0.24°","w":["About 89.8°","About 0.0042°","About 4.2°"],"e":"ma = qvB sin θ so sin θ = ma/(qvB) = (9.11 × 10⁻³¹)(4.70 × 10¹⁴) ÷ [(1.6 × 10⁻¹⁹)(7.60 × 10⁶)(0.083)] = 4.24 × 10⁻³. θ = 0.24°.","h":"sinθ = ma/(qvB) is tiny, so θ ≈ 0.24°. a ÷ (qvB/m) gives the sine."},{"q":"Problem 8.4: A proton (q = 1.6 × 10⁻¹⁹ C) at 23° to a field of 26 mT feels a force of 6.50 × 10⁻¹⁷ N. What is its speed?","c":"About 4.0 × 10⁴ m/s","w":["About 1.6 × 10⁴ m/s","About 9.5 × 10⁴ m/s","About 4.0 × 10⁷ m/s"],"e":"v = F/(qB sin θ) = 6.50 × 10⁻¹⁷ ÷ [(1.6 × 10⁻¹⁹)(0.026)(sin 23°)] = 6.50 × 10⁻¹⁷ ÷ 1.63 × 10⁻²¹ = 4.0 × 10⁴ m/s.","h":"v = F ÷ (qB sinθ) = 6.5×10⁻¹⁷ ÷ (1.6×10⁻¹⁹ × 0.026 × 0.39) = 4.0×10⁴ m/s."},{"q":"Problem 8.5: A proton of mass 6.0 × 10⁻²⁷ kg (as given) moves at 4.0 × 10⁴ m/s. What is its kinetic energy in eV?","c":"About 30 eV","w":["About 4.8 eV","About 300 eV","About 3.0 × 10⁻¹⁸ eV"],"e":"K = ½mv² = ½(6.0 × 10⁻²⁷)(4.0 × 10⁴)² = 4.8 × 10⁻¹⁸ J. In eV: 4.8 × 10⁻¹⁸ ÷ 1.6 × 10⁻¹⁹ = 30 eV.","h":"K = ½mv² = 0.5 × 6×10⁻²⁷ × 1.6×10⁹ = 4.8×10⁻¹⁸ J. ÷ 1.6×10⁻¹⁹ = 30 eV."},{"q":"Problem 8.3: What is the cyclotron frequency of an electron in a field of 2.0 × 10⁻⁴ T?","c":"About 5.6 × 10⁶ Hz","w":["About 5.6 × 10⁹ Hz","About 3.5 × 10⁷ Hz","About 5.6 × 10³ Hz"],"e":"f = eB/2πm = (1.6 × 10⁻¹⁹)(2.0 × 10⁻⁴) ÷ [2π(9.11 × 10⁻³¹)] = 3.2 × 10⁻²³ ÷ 5.72 × 10⁻³⁰ = 5.6 × 10⁶ Hz.","h":"f = eB/2πm = 1.6×10⁻¹⁹ × 2×10⁻⁴ ÷ (6.28 × 9.11×10⁻³¹) = 5.6×10⁶ Hz."},{"q":"Problem 8.6: What magnetic field makes electrons circle at 2540 MHz?","c":"About 0.091 T","w":["About 0.91 T","About 0.014 T","About 5.7 × 10⁻⁴ T"],"e":"B = 2πfm/q = 2π(2540 × 10⁶)(9.11 × 10⁻³¹) ÷ 1.6 × 10⁻¹⁹ = 0.091 T.","h":"B = 2πfm/q = 6.28 × 2.54×10⁹ × 9.11×10⁻³¹ ÷ 1.6×10⁻¹⁹ = 0.091 T. Same as the 2450 MHz one, scaled."},{"q":"Problem 8.7: An electron feels a force of 4.60 × 10⁻¹⁵ N at 40.0° to a field of 3.50 × 10⁻³ T. What is its speed?","c":"About 1.28 × 10⁷ m/s","w":["About 2.05 × 10⁷ m/s","About 1.28 × 10¹⁰ m/s","About 8.2 × 10⁶ m/s"],"e":"v = F/(qB sin θ) = 4.60 × 10⁻¹⁵ ÷ [(1.6 × 10⁻¹⁹)(3.50 × 10⁻³)(sin 40°)] = 4.60 × 10⁻¹⁵ ÷ 3.60 × 10⁻²² = 1.28 × 10⁷ m/s.","h":"v = F ÷ (eB sin40°) = 4.6×10⁻¹⁵ ÷ (1.6×10⁻¹⁹ × 3.5×10⁻³ × 0.643) = 1.28×10⁷ m/s."},{"q":"Problem 8.8: Electrons move at 3.7 × 10⁷ m/s in a uniform 2.0 T field. What is the radius of their orbit?","c":"About 1.05 × 10⁻⁴ m","w":["About 1.05 × 10⁻² m","About 9.5 × 10³ m","About 2.1 × 10⁻⁴ m"],"e":"R = mv/qB = (9.11 × 10⁻³¹)(3.7 × 10⁷) ÷ [(1.6 × 10⁻¹⁹)(2.0)] = 3.37 × 10⁻²³ ÷ 3.2 × 10⁻¹⁹ = 1.05 × 10⁻⁴ m.","h":"R = mv/qB = 9.11×10⁻³¹ × 3.7×10⁷ ÷ (1.6×10⁻¹⁹ × 2) = 1.05×10⁻⁴ m."},{"q":"Problem 8.9: What magnetic field is needed to produce radiation of frequency 2.00 THz in a magnetron?","c":"About 72 T","w":["About 0.072 T","About 720 T","About 7.2 × 10⁻⁵ T"],"e":"B = 2πfm/q = 2π(2.00 × 10¹²)(9.11 × 10⁻³¹) ÷ 1.6 × 10⁻¹⁹ = 71.6 T. That is a very large field.","h":"B = 2πfm/q with f = 2×10¹² Hz = 72 T. The frequency ratio from the 2.45 GHz case scales B."},{"q":"Problem 8.11: A 160-turn coil has a magnetic dipole moment of 2.30 A·m². What is the maximum torque in a 35.0 mT field?","c":"About 0.0805 N·m","w":["About 12.9 N·m","About 0.0005 N·m","About 0.502 N·m"],"e":"The moment already includes the turns (μ = NIA). τ_max = μB = (2.30)(0.0350) = 0.0805 N·m.","h":"μ already includes N. τ_max = μB = 2.30 × 0.035 = 0.0805 N·m. Don't multiply by 160 again."},{"q":"Problem 8.12: A horizontal rod 0.200 m long in a perpendicular field of 0.087 T feels a force of 0.22 N. What is the current?","c":"About 12.6 A","w":["About 1.26 A","About 0.079 A","About 25.3 A"],"e":"F = BIl so I = F/(Bl) = 0.22 ÷ (0.087 × 0.200) = 12.6 A.","h":"I = F/(Bl) = 0.22 ÷ (0.087 × 0.2) = 12.6 A."},{"q":"Problem 8.13: An electron beam is bent in a circle of radius 2.0 cm by a 4.5 × 10⁻³ T field. What is the speed of the electrons?","c":"About 1.6 × 10⁷ m/s","w":["About 1.6 × 10⁹ m/s","About 3.2 × 10⁷ m/s","About 8.0 × 10⁶ m/s"],"e":"v = qBR/m = (1.6 × 10⁻¹⁹)(4.5 × 10⁻³)(0.020) ÷ 9.1 × 10⁻³¹ = 1.58 × 10⁷ m/s.","h":"v = qBR/m = 1.6×10⁻¹⁹ × 4.5×10⁻³ × 0.02 ÷ 9.11×10⁻³¹ = 1.6×10⁷ m/s."},{"q":"What is the magnitude of the magnetic force on a charge q moving with velocity v in a field B at angle θ?","c":"F = qvB sinθ","w":["F = qvB cosθ","F = qvB","F = qB/v sinθ"],"e":"Only the component of v perpendicular to B matters, so sinθ. The force is zero if v is parallel to B.","h":"F = qvB sinθ. Only the component of v ⟂ B matters."},{"q":"A charge moves parallel to a magnetic field. What is the magnetic force on it?","c":"Zero","w":["Maximum, qvB","qvB/2","It depends on the sign of the charge"],"e":"θ = 0 gives sinθ = 0.","h":"Parallel to B: θ = 0, sin 0 = 0, so F = 0."},{"q":"What work does the magnetic force do on a moving charge?","c":"Zero, since the force is always perpendicular to the velocity","w":["Positive, since it speeds the charge up","Negative, since it slows the charge down","qvB times the distance moved"],"e":"The force changes direction but not speed, so kinetic energy does not change.","h":"Work by magnetic force = 0. F ⟂ v always."},{"q":"An electron moves at 2×10⁶ m/s perpendicular to a field of 0.5 T. What force acts on it? (e = 1.6×10⁻¹⁹ C)","c":"1.6×10⁻¹³ N","w":["1.6×10⁻¹⁹ N","3.2×10⁻¹³ N","1.6×10⁻¹⁶ N"],"e":"F = evB = 1.6×10⁻¹⁹ × 2×10⁶ × 0.5 = 1.6×10⁻¹³ N.","h":"F = evB = 1.6×10⁻¹⁹ × 2×10⁶ × 0.5 = 1.6×10⁻¹³ N. Multiply 1.6 × 2 × 0.5."},{"q":"A proton moves at 1×10⁶ m/s perpendicular to a field of 0.1 T. What is the radius of its circular path? (m = 1.67×10⁻²⁷ kg, e = 1.6×10⁻¹⁹ C)","c":"About 0.10 m","w":["About 1.0 m","About 0.010 m","About 10 m"],"e":"r = mv/(qB) = 1.67×10⁻²⁷ × 10⁶/(1.6×10⁻¹⁹ × 0.1) = 0.104 m.","h":"r = mv/qB = 1.67×10⁻²⁷ × 10⁶ ÷ (1.6×10⁻¹⁹ × 0.1) = 0.10 m."},{"q":"A charged particle moves in a circle in a uniform field. What happens to the period if its speed is doubled?","c":"It stays the same","w":["It doubles","It halves","It quadruples"],"e":"T = 2πm/(qB) does not contain v. A faster particle takes a bigger circle but the same time.","h":"T = 2πm/qB: no v in it. Double speed, same period (bigger radius)."},{"q":"A proton and an electron have the same kinetic energy and enter a field perpendicular to B. Which has the larger radius?","c":"The proton, by a factor of about 43","w":["The electron, by a factor of about 43","The proton, by a factor of about 1836","They have the same radius"],"e":"p = √(2mK), so r = p/(qB) ∝ √m. The proton is 1836 times heavier, so its radius is √1836 ≈ 43 times larger.","h":"Same KE: p = √(2mK), r ∝ p ∝ √m. Proton is √1836 ≈ 43 times larger."},{"q":"A charged particle enters a magnetic field at an angle between 0° and 90° to the field. What path does it follow?","c":"A helix","w":["A circle","A parabola","A straight line"],"e":"The perpendicular component gives circular motion. The parallel component is unchanged, so the particle drifts along the field.","h":"Angle between 0 and 90°: ⟂ part gives circle, ∥ part gives drift. Net path is a helix."},{"q":"A wire of length 0.3 m carries 5 A at right angles to a field of 0.2 T. What force acts on it?","c":"0.3 N","w":["0.03 N","3.0 N","7.5 N"],"e":"F = BIL = 0.2 × 5 × 0.3 = 0.3 N.","h":"F = BIL = 0.2 × 5 × 0.3 = 0.3 N."},{"q":"A current-carrying wire is parallel to a magnetic field. What is the force on it?","c":"Zero","w":["BIL","BIL/2","It depends on the current direction"],"e":"F = BIL sinθ and θ = 0 gives sinθ = 0.","h":"Wire parallel to B: no force. θ = 0."},{"q":"Two long parallel wires carry currents in the same direction. What is the force between them?","c":"Attractive","w":["Repulsive","Zero","Attractive for one wire and repulsive for the other"],"e":"Each wire sits in the field of the other. Parallel currents attract, antiparallel currents repel. The opposite of electric charges.","h":"Same-direction parallel currents attract. Opposite directions repel. (Opposite of charges.)"},{"q":"A positive charge moves east in a magnetic field pointing north. What is the direction of the force on it?","c":"Upward","w":["Downward","North","West"],"e":"Using F = qv × B, east × north = up. A negative charge would feel a downward force.","h":"East × north = up (x̂ × ŷ = ẑ with x = east, y = north). Positive charge, force up."},{"q":"A rectangular coil of 10 turns, area 0.05 m² and current 2 A is in a field of 0.4 T with its plane parallel to the field. What is the torque?","c":"0.4 N·m","w":["0.2 N·m","Zero","0.8 N·m"],"e":"τ = NIAB sinθ, where θ is the angle between the normal and B. Plane parallel to B means θ = 90°, sin = 1. τ = 10 × 2 × 0.05 × 0.4 = 0.4 N·m.","h":"τ = NIAB sinθ with θ = 90° (plane parallel to B means normal ⟂ B). 10 × 2 × 0.05 × 0.4 = 0.4 N·m."},{"q":"At which position of a coil in a uniform field is the torque zero?","c":"When the plane of the coil is perpendicular to the field","w":["When the plane of the coil is parallel to the field","When the plane is at 45° to the field","The torque is never zero"],"e":"Then the normal is parallel to B, so θ = 0 and sinθ = 0. The flux is maximum at this position.","h":"Torque zero when the plane is perpendicular to B (normal ∥ B, θ = 0)."},{"q":"What is the magnetic dipole moment of a coil of N turns, current I and area A?","c":"μ = NIA, along the normal to the plane","w":["μ = NI/A, along the normal to the plane","μ = NIA, in the plane of the coil","μ = N²IA, along the normal"],"e":"μ is in A·m². The torque is then τ = μB sinθ.","h":"μ = NIA, along the normal. Unit A·m²."},{"q":"What is the SI unit of magnetic flux and what is it equal to?","c":"The weber, equal to 1 T·m²","w":["The tesla, equal to 1 Wb·m²","The weber, equal to 1 T/m²","The henry, equal to 1 T·m"],"e":"Φ = BA, so Wb = T × m². And 1 T = 1 Wb/m².","h":"Wb = T·m². 1 T = 1 Wb/m²."},{"q":"A charge moves undeflected through crossed electric and magnetic fields E = 2×10⁴ V/m and B = 0.1 T. What is its speed?","c":"2×10⁵ m/s","w":["2×10³ m/s","2×10⁶ m/s","5×10⁻⁶ m/s"],"e":"No deflection means qE = qvB, so v = E/B = 2×10⁴/0.1 = 2×10⁵ m/s.","h":"No deflection: qE = qvB, so v = E/B = 2×10⁴ ÷ 0.1 = 2×10⁵ m/s. Mass and charge cancel."},{"q":"What is the Lorentz force on a charge q in both electric and magnetic fields?","c":"F = q(E + v × B)","w":["F = q(E − v × B)","F = qE × vB","F = q(E + B/v)"],"e":"The electric part acts on any charge. The magnetic part only on a moving one.","h":"Lorentz: F = q(E + v × B)."},{"q":"A positive charge moves along +x and feels a magnetic force along +z. In which direction does B point?","c":"Along +y","w":["Along −y","Along +z","Along −x"],"e":"F = qv × B. Since x̂ × ŷ = ẑ, B along +y gives a force along +z. B along −y would give −z.","h":"F = qv × B. x̂ × ŷ = ẑ: B along +y gives force along +z."},{"q":"What does the dielectric constant κ tell us about a material placed between capacitor plates?","c":"The factor by which the capacitance (and field reduction) changes, compared with vacuum","w":["The maximum voltage that the material can withstand","The factor by which the plate charge changes at fixed field","The density of free electrons in the material"],"e":"C = κC₀ and E = E₀/κ at fixed charge. For vacuum κ = 1.","h":"κ = C/C₀ = E₀/E. How many times the capacitance goes up."},{"q":"What is the SI unit of the electric displacement D?","c":"C/m²","w":["N/C","C/m³","V/m"],"e":"D = ε₀E + P. P is dipole moment per volume = C·m/m³ = C/m². So D has units of surface charge density.","h":"D has units C/m², the same as P."}],[{"q":"What is electromagnetic induction?","c":"The production of an emf (and current) in a circuit when the magnetic flux linking it changes, for example by relative motion of a coil and a magnet","w":["The production of a magnetic field around a conductor that carries a steady direct current","The production of an emf in a circuit that is at rest in a constant field with no change at all","The production of static charge on a coil when it is rubbed with a magnet"],"e":"Whenever the flux through a circuit changes, an emf is induced. A magnet moving into a coil is the standard demonstration: the galvanometer deflects while the magnet moves, and reads zero when the magnet is still.","h":"Induction = emf produced when the flux through a circuit changes. Changing flux is the key."},{"q":"A bar magnet is held still inside a coil connected to a galvanometer. What does the galvanometer show?","c":"No deflection, because there is no relative motion and no change in flux","w":["A steady deflection, because the magnet's field passes through the coil","A deflection in the opposite direction, because the magnet is inside the coil","A rapidly alternating deflection, because the magnet's poles act in turn"],"e":"Current flows only while the magnet moves towards or away from the coil. A stationary magnet, even inside the coil, induces nothing.","h":"Magnet at rest in the coil: no deflection. No relative motion, no changing flux."},{"q":"What does the size of the induced emf in the coil-and-magnet experiment depend on?","c":"The speed of relative motion, the number of turns, and the strength of the magnet","w":["The speed of relative motion, the colour of the wire, and the length of the connecting leads","The number of turns only, with no effect from the speed or the magnet strength","The resistance of the galvanometer only, with no effect from the speed or the turns"],"e":"Faster motion changes the flux faster. More turns give more emf, and a stronger magnet gives more flux.","h":"Induced emf depends on speed of motion, number of turns, and magnet strength. All three."},{"q":"Which are the three ways to change the flux through a loop (Φ = BA cos θ) and so induce an emf?","c":"Change the field B, change the area A, or change the angle θ between B and the normal","w":["Change the resistance R, change the area A, or change the current I","Change the field B, change the charge Q, or change the angle θ between B and the loop","Change the temperature T, change the field B, or change the area A"],"e":"Φ = BA cos θ. Any change in B, A or θ changes the flux. A rotating coil changes θ, which is the basis of the generator.","h":"Φ = BA cosθ: change B, or A, or θ. Three ways."},{"q":"State Faraday's laws of electromagnetic induction.","c":"An emf is induced when the flux linking a circuit changes, and its size is proportional to the rate of change of flux, ε = −N ΔΦ/Δt","w":["An emf is induced when the current in a circuit is steady, and its size is proportional to the flux itself, ε = −NΦ","An emf is induced only when the circuit is open, and its size is proportional to the resistance, ε = −NΔt/ΔΦ","An emf is induced when the flux linking a circuit is constant, and its size equals the flux per turn, ε = −Φ/N"],"e":"First law: change of flux induces emf. Second law: magnitude = rate of change of flux linkage. For N turns, ε = −N ΔΦ/Δt, where NΦ = NBA is the flux linkage.","h":"Faraday: emf is induced when flux changes. Size is proportional to the rate of change of flux."},{"q":"What does Lenz's law state, and what does the minus sign in Faraday's law mean?","c":"The induced emf acts in a direction that opposes the change producing it, and the minus sign shows this opposition","w":["The induced emf acts in a direction that helps the change producing it, and the minus sign shows this support","The induced emf is always in the direction of the applied field, and the minus sign shows that the flux is negative","The induced emf has no fixed direction, and the minus sign only means that the emf is small"],"e":"If the flux through a coil is increasing, the induced current makes a field that tries to reduce it. This follows from conservation of energy.","h":"Lenz: induced emf opposes the change that causes it. That is the minus sign."},{"q":"What is the emf induced in a conductor of length l moving at speed v perpendicular to a field B?","c":"ε = Blv, greatest when the motion is perpendicular to the field and zero when parallel","w":["ε = Bl/v, greatest when the motion is parallel to the field and zero when perpendicular","ε = Blv, greatest when the motion is parallel to the field and zero when perpendicular","ε = Bv/l, greatest when the motion is perpendicular to the field and zero when parallel"],"e":"The conductor cuts field lines. Moving along the field lines cuts none, so the emf is zero. Moving across them gives the maximum.","h":"Motional emf ε = Blv. Maximum when v, B and l are mutually perpendicular."},{"q":"How is Fleming's right-hand rule used?","c":"The thumb gives the direction of motion, the first finger gives the field, and the second finger gives the induced current","w":["The thumb gives the direction of the induced current, the first finger gives the motion, and the second finger gives the field","The thumb gives the direction of the field, the first finger gives the induced current, and the second finger gives the motion","The thumb gives the direction of motion, the first finger gives the induced current, and the second finger gives the field"],"e":"The right-hand rule is for generators (motion → current). The left-hand rule is for motors (current → motion).","h":"Right-hand rule for generators (motion → current). Left hand is for motors (current → motion)."},{"q":"Example 9.1: A 10-turn coil of area 5 cm² is at right angles to a field of 2 × 10⁻² T that falls to zero in 10 s. What are the flux change and the induced emf?","c":"Flux linkage change 1.0 × 10⁻⁴ Wb, emf 1.0 × 10⁻⁵ V","w":["Flux linkage change 1.0 × 10⁻⁴ Wb, emf 1.0 × 10⁻³ V","Flux linkage change 1.0 × 10⁻⁷ Wb, emf 1.0 × 10⁻⁸ V","Flux linkage change 1.0 × 10⁻⁴ Wb, emf 1.0 × 10⁻⁴ V"],"e":"NBA = 10 × 2 × 10⁻² × 5 × 10⁻⁴ = 1.0 × 10⁻⁴ Wb. ε = ΔNΦ/Δt = 1.0 × 10⁻⁴ ÷ 10 = 1.0 × 10⁻⁵ V.","h":"ΔΦ = N × B × A = 10 × 2×10⁻² × 5×10⁻⁴ = 1.0×10⁻⁴ Wb. Then emf = ΔΦ/Δt."},{"q":"What are the parts of a simple a.c. generator?","c":"A strong magnet, an armature (coil on a soft iron core), and two slip rings with carbon brushes","w":["A strong magnet, an armature (coil on a copper core), and a split-ring commutator with carbon brushes","Two magnets, an armature (coil on a soft iron core), and a single slip ring with a metal brush","A battery, an armature (coil on a soft iron core), and two slip rings with carbon brushes"],"e":"The coil turns in the field of the magnet. The slip rings carry the current out through the brushes, and the current alternates each half turn.","h":"AC generator parts: magnet, armature coil on iron core, slip rings, brushes."},{"q":"What is the instantaneous emf of an a.c. generator with N turns, area A, field B, angular speed ω?","c":"ε = NABω sin ωt, with a maximum value NABω","w":["ε = NABω cos² ωt, with a maximum value NABω/2","ε = NAB sin ωt/ω, with a maximum value NAB/ω","ε = NABω tan ωt, with no maximum value"],"e":"The flux is NBA cos ωt. The emf is its rate of change, NABω sin ωt. ω = 2πf, and E_max = NABω.","h":"ε = NABω sin ωt. Maximum NABω."},{"q":"In an a.c. generator, when is the induced emf maximum and when is it zero?","c":"Maximum when the plane of the coil is parallel to B (flux zero but changing fastest), and zero when the plane is perpendicular to B (flux maximum, not changing)","w":["Maximum when the plane of the coil is perpendicular to B (flux maximum), and zero when the plane is parallel to B (flux zero)","Maximum at the instant the coil is at rest, and zero when the coil is at full speed","Maximum and zero at the same instant, because flux and emf are always in step"],"e":"emf is the rate of change of flux, not the flux itself. When the coil is flat to the field the flux is zero but changing fastest. When it is upright, flux is at the maximum but momentarily steady.","h":"Maximum emf when the coil plane is parallel to B (flux changing fastest). Zero when perpendicular."},{"q":"How is an a.c. generator changed into a d.c. generator?","c":"Replace the two slip rings with a split-ring commutator","w":["Replace the carbon brushes with copper brushes","Replace the soft iron core with a copper core","Replace the strong magnet with a weaker magnet"],"e":"The commutator reverses the connection every half turn, so the current in the outside circuit flows in one direction (though it pulsates). Many coils smooth it further.","h":"AC → DC: replace the two slip rings with a split-ring commutator."},{"q":"Which changes increase the emf of a simple generator?","c":"More turns, a stronger magnet, a soft iron core, and a faster rotation","w":["Fewer turns, a stronger magnet, an air core, and a faster rotation","More turns, a weaker magnet, a soft iron core, and a slower rotation","More turns, a stronger magnet, an air core, and a slower rotation"],"e":"E_max = NABω, so more turns (N), a stronger field (B), and a faster rotation (ω) all help. Iron concentrates the flux.","h":"Increase N, B, A, ω, or add a soft iron core. E_max = NABω."},{"q":"What is the difference between a motor and a generator in construction and use?","c":"They are built alike, but a motor turns electrical energy into motion, while a generator turns motion into electrical energy","w":["They are built differently, and a motor produces current while a generator uses current to turn","They are built alike, and both turn electrical energy into motion with no other difference","They are built alike, but a motor turns motion into electrical energy, while a generator turns electrical energy into motion"],"e":"Pass a current through a d.c. dynamo and it spins as a motor. Turn it by hand and it produces a current as a generator.","h":"Motor and generator are built alike. Motor: current in, motion out. Generator: motion in, current out."},{"q":"How does a transformer change voltage, and what is the relation between voltages, turns and currents?","c":"E_s/E_p = N_s/N_p = I_p/I_s, so more secondary turns step the voltage up and cut the current","w":["E_s/E_p = N_p/N_s = I_p/I_s, so more secondary turns step the voltage down and raise the current","E_s/E_p = N_s/N_p = I_s/I_p, so more secondary turns step the voltage up and raise the current","E_s/E_p = N_s/N_p = I_p/I_s, so more secondary turns step the voltage up and keep the current the same"],"e":"An ideal transformer has no loss, so I_pV_p = I_sV_s. If the voltage goes up by a factor, the current goes down by the same factor.","h":"Es/Ep = Ns/Np = Ip/Is. More secondary turns means higher voltage and lower current."},{"q":"A transformer works only with which kind of supply?","c":"Alternating current, because only a changing current gives a changing flux in the core","w":["Direct current, because a steady current gives the strongest flux in the core","Both a.c. and d.c., because the turns ratio is the same for both","Neither, because the core is an insulator and carries no flux"],"e":"Faraday's law needs changing flux. Steady d.c. gives constant flux, so no emf in the secondary.","h":"Transformer works only with AC. Changing flux is needed."},{"q":"Which is the correct pairing of a transformer loss and the way to reduce it?","c":"Heating of the wire: low-resistance wire. Flux leakage: efficient core design. Eddy currents: laminated core. Hysteresis: soft iron core","w":["Heating of the wire: laminated core. Flux leakage: low-resistance wire. Eddy currents: soft iron core. Hysteresis: efficient core design","Heating of the wire: soft iron core. Flux leakage: laminated core. Eddy currents: low-resistance wire. Hysteresis: efficient core design","Heating of the wire: efficient core design. Flux leakage: soft iron core. Eddy currents: laminated core. Hysteresis: low-resistance wire"],"e":"Copper loss (I²R) is cut with thick low-resistance wire. Leakage is cut by winding both coils on the same closed core. Eddy currents are cut by laminating (thin insulated sheets). Hysteresis is cut by soft iron, which magnetizes and demagnetizes easily.","h":"Heating of wire → thick low-resistance copper. Eddy currents → laminated core. Match each loss to its fix."},{"q":"How is the efficiency of a transformer found?","c":"Efficiency = (output power/input power) × 100%","w":["Efficiency = (input power/output power) × 100%","Efficiency = (output voltage/input current) × 100%","Efficiency = (output power × input power) × 100%"],"e":"Efficiency = P_secondary/P_primary × 100%. It is less than 100% because of the losses.","h":"Efficiency = (P_out ÷ P_in) × 100%. Never above 100%."},{"q":"Example 9.2: A 100-turn coil of resistance 6 Ω encloses 80 cm². How fast must a field along its axis change to induce 1 mA in the coil?","c":"0.0075 T/s","w":["0.075 T/s","0.00075 T/s","7.5 T/s"],"e":"ε = IR = (1 × 10⁻³)(6) = 6 × 10⁻³ V. A = 80 × 10⁻⁴ = 8 × 10⁻³ m². ΔB/Δt = ε/NA = 6 × 10⁻³ ÷ (100 × 8 × 10⁻³) = 0.0075 T/s.","h":"ε = IR = 6 mV. dB/dt = ε ÷ (NA) = 6×10⁻³ ÷ (100 × 8×10⁻³) = 0.0075 T/s."},{"q":"Example 9.3: A transformer has 200 primary turns and 50 secondary turns on a 120 V line, with the secondary on a 100 Ω bulb. What are the secondary voltage and the primary current?","c":"V_s = 30 V and I_p = 0.075 A","w":["V_s = 480 V and I_p = 4.8 A","V_s = 30 V and I_p = 0.3 A","V_s = 30 V and I_p = 1.2 A"],"e":"V_s = (50/200)(120) = 30 V. I_s = 30/100 = 0.3 A. I_p = (N_s/N_p)I_s = (50/200)(0.3) = 0.075 A. Check: 120 × 0.075 = 9 W = 30 × 0.3.","h":"Vs = 120 × 50/200 = 30 V. Primary current = secondary current × Ns/Np (smaller on the primary)."},{"q":"Example 9.4: How much energy is stored in a 20 mH coil carrying 0.2 A, and what current stores 1 J?","c":"W = 4 × 10⁻⁴ J, and I = 10 A","w":["W = 4 × 10⁻⁴ J, and I = 100 A","W = 8 × 10⁻⁴ J, and I = 10 A","W = 4 × 10⁻¹ J, and I = 0.1 A"],"e":"W = ½LI² = ½(20 × 10⁻³)(0.2)² = 4 × 10⁻⁴ J. For 1 J, I = √(2W/L) = √(2 ÷ 0.02) = √100 = 10 A.","h":"W = ½LI² = ½ × 0.02 × 0.04 = 4×10⁻⁴ J. For 1 J: I = √(2/L) = √100 = 10 A."},{"q":"Example 9.5: An inductor of resistance 20 Ω and inductance 0.1 H is connected to a 12 V battery. What is the initial rate of rise of current, and the final current?","c":"120 A/s initially, and 0.6 A finally","w":["0.6 A/s initially, and 120 A finally","120 A/s initially, and 120 A finally","12 A/s initially, and 0.6 A finally"],"e":"At t = 0, I = 0 so the full emf appears across L: dI/dt = E/L = 12/0.1 = 120 A/s. The back emf shrinks as the current grows. At the end dI/dt = 0 and I = E/R = 12/20 = 0.6 A.","h":"Initial dI/dt = V/L = 12/0.1 = 120 A/s. Final I = V/R = 12/20 = 0.6 A (L has no effect at the end)."},{"q":"What does the Biot–Savart law give, and what is its form?","c":"The magnetic field dB at a point due to a current element, dB = μ₀I dl sin θ/4πr²","w":["The electric field dE at a point due to a charge element, dE = μ₀I dl sin θ/4πr","The magnetic field dB at a point due to a current element, dB = μ₀I dl sin θ/4πr","The magnetic flux dΦ through a surface due to a current element, dΦ = μ₀I dl/4πr²"],"e":"dB depends on the current element I dl, the sine of the angle between dl and the line to the point, and 1/r². μ₀ is the permeability of free space.","h":"Biot–Savart: dB from a current element I dl. Basic field law for currents."},{"q":"Which formulas give the field of a long straight wire, the centre of a circular loop, and an ideal solenoid?","c":"Wire: B = μ₀I/2πr. Loop centre: B = μ₀I/2R. Solenoid: B = μ₀NI/L","w":["Wire: B = μ₀I/2R. Loop centre: B = μ₀I/2πr. Solenoid: B = μ₀NI/L","Wire: B = μ₀I/2πr. Loop centre: B = μ₀I/4R. Solenoid: B = μ₀I/NL","Wire: B = μ₀I/4πr². Loop centre: B = μ₀I/2R. Solenoid: B = μ₀N/IL"],"e":"Wire: field falls as 1/r. Loop: use R (the radius) with no π. Solenoid: nI where n = N/L is turns per metre.","h":"Wire μ₀I/2πr. Loop centre μ₀I/2R. Solenoid μ₀nI. Remember the pattern."},{"q":"What does Ampère's law relate?","c":"The line integral of B around a closed loop to the current passing through the loop, ∮B·dl = μ₀I","w":["The surface integral of B over a closed surface to the charge inside, ∮B·dA = μ₀Q","The line integral of E around a closed loop to the flux through the loop, ∮E·dl = −dΦ/dt","The surface integral of B over a closed surface to the current outside the surface, ∮B·dA = μ₀I"],"e":"Ampère's circuital law ties B around a loop to the enclosed current. Maxwell added the displacement-current term ∂D/∂t to make ∇×H = ∂D/∂t + J.","h":"Ampère's law: ∮B·dl = μ₀ I_enclosed. Use it when there is symmetry."},{"q":"Example 9.6 and 9.7: What is the field at the centre of a full circular loop of radius R with current I, and of a semicircular wire of radius 0.20 m carrying 150 A?","c":"Full loop: μ₀I/2R. Semicircle: μ₀I/4R = 2.4 × 10⁻⁴ T","w":["Full loop: μ₀I/4R. Semicircle: μ₀I/2R = 4.7 × 10⁻⁴ T","Full loop: μ₀I/2R. Semicircle: μ₀I/4R = 2.4 × 10⁻⁷ T","Full loop: μ₀I/2R. Semicircle: μ₀I/8R = 1.2 × 10⁻⁴ T"],"e":"Half the loop gives half the field: B = μ₀I/4R = (4π × 10⁻⁷)(150) ÷ (4 × 0.20) = 2.36 × 10⁻⁴ T, about 2.4 × 10⁻⁴ T.","h":"Full loop centre: μ₀I/2R. Semicircle: half of that, μ₀I/4R."},{"q":"Problem 9.1: The primary coil of a transformer has 1000 turns and 240 V a.c., and the secondary has 500 turns. What is the secondary emf?","c":"120 V","w":["480 V","60 V","240 V"],"e":"E_s = (N_s/N_p)E_p = (500/1000)(240) = 120 V. It is a step-down transformer.","h":"Es = Ep × Ns/Np = 240 × 500/1000 = 120 V."},{"q":"Problem 9.2: What is the magnetic field 7.00 mm from a long straight wire carrying 8.00 A?","c":"About 2.29 × 10⁻⁴ T","w":["About 2.29 × 10⁻⁷ T","About 1.60 × 10⁻³ T","About 7.2 × 10⁻⁴ T"],"e":"B = μ₀I/2πr = (4π × 10⁻⁷)(8.00) ÷ (2π × 0.00700) = 2 × 10⁻⁷ × 8 ÷ 0.007 = 2.29 × 10⁻⁴ T.","h":"B = 2×10⁻⁷ × I/r = 2×10⁻⁷ × 8 ÷ 0.007 = 2.29×10⁻⁴ T. Use 2×10⁻⁷ instead of μ₀/2π."},{"q":"Problem 9.3: A step-down transformer is on 240 V a.c., and the secondary must give 60 V. What is N_s/N_p?","c":"1/4 (0.25)","w":["4","1/16","2"],"e":"N_s/N_p = V_s/V_p = 60/240 = 0.25.","h":"Ns/Np = Vs/Vp = 60/240 = 1/4. Step-down means less than 1."},{"q":"Problem 9.4: What is the inductance of a solenoid with 200 turns, length 20.0 cm and cross-sectional area 5.00 × 10⁻³ m²?","c":"About 1.26 × 10⁻³ H","w":["About 1.26 × 10⁻⁵ H","About 6.3 × 10⁻⁶ H","About 0.25 H"],"e":"L = μ₀N²A/l = (4π × 10⁻⁷)(200)²(5.00 × 10⁻³) ÷ 0.200 = 1.26 × 10⁻³ H = 1.26 mH.","h":"L = μ₀N²A/l. Square the turns, then divide by the length in metres."},{"q":"Problem 9.5: A transformer has an input of 240 V and an output of 960 V, with 720 turns on the secondary. How many turns are on the primary?","c":"180 turns","w":["2880 turns","540 turns","720 turns"],"e":"N_p/N_s = V_p/V_s = 240/960 = 1/4. So N_p = 720/4 = 180.","h":"Np = Ns × Vp/Vs = 720 × 240/960 = 180 turns. Step-up has fewer primary turns."},{"q":"Problem 9.6: The current through the 1.26 mH solenoid falls at 40.0 A/s. What is the self-induced emf?","c":"About 0.050 V","w":["About 50 V","About 3.2 × 10⁻⁵ V","About 0.0013 V"],"e":"ε = L dI/dt = (1.26 × 10⁻³)(40.0) = 0.0503 V. Its direction opposes the fall in current.","h":"ε = L × dI/dt = 1.26×10⁻³ × 40 = 0.050 V. Multiply."},{"q":"Problem 9.7: A 220 V step-down transformer lights eight 12 V, 20 W lamps with a primary current of 1 A. What is its efficiency?","c":"About 73%","w":["About 138%","About 87%","About 55%"],"e":"Output = 8 × 20 = 160 W. Input = 220 × 1 = 220 W. Efficiency = 160/220 × 100 = 72.7%.","h":"Output = 8 × 20 = 160 W. Input = 220 × 1 = 220 W. Efficiency = 160/220 = 73%."},{"q":"Problem 9.8: How much energy is stored in a 250 mH coil carrying 0.02 A?","c":"5.0 × 10⁻⁵ J","w":["5.0 × 10⁻³ J","2.5 × 10⁻⁶ J","1.0 × 10⁻⁴ J"],"e":"U = ½LI² = ½(0.250)(0.02)² = ½(0.25)(4 × 10⁻⁴) = 5.0 × 10⁻⁵ J.","h":"U = ½LI² = ½ × 0.25 × 4×10⁻⁴ = 5×10⁻⁵ J. 0.02² = 4×10⁻⁴."},{"q":"Problem 9.9: A 30 V to 230 V transformer is 85% efficient and its output powers a 230 V, 100 W lamp. What current is in the primary?","c":"About 3.9 A","w":["About 0.43 A","About 3.3 A","About 4.6 A"],"e":"Output power = 100 W. Input power = 100/0.85 = 117.6 W. I_p = P/V_p = 117.6/30 = 3.9 A.","h":"P_in = 100/0.85 = 117.6 W. I_p = 117.6/30 = 3.9 A. Divide by efficiency first."},{"q":"Problem 9.11: A generator coil has 20 turns, area 0.06 m², resistance 24.0 Ω, and rotates at 100.0 Hz in a field of 0.50 T. What is the maximum induced emf?","c":"About 377 V","w":["About 60 V","About 6.0 V","About 2370 V"],"e":"ω = 2πf = 628 rad/s. E_max = NABω = 20 × 0.06 × 0.50 × 628 = 377 V.","h":"E_max = NABω. ω = 2πf = 628 rad/s. Multiply all four."},{"q":"Problem 9.12–9.14: For the same generator (E_max = 377 V, R = 24.0 Ω, ω = 628 rad/s), what are the maximum current and the time form of the emf and current?","c":"I_max = 15.7 A, E = 377 sin(628t) V and I = 15.7 sin(628t) A","w":["I_max = 15.7 A, E = 628 sin(377t) V and I = 15.7 sin(377t) A","I_max = 9050 A, E = 377 sin(628t) V and I = 9050 sin(628t) A","I_max = 0.064 A, E = 377 cos(100t) V and I = 0.064 cos(100t) A"],"e":"I_max = E_max/R = 377/24 = 15.7 A. The emf varies as E = E_max sin ωt, and I = I_max sin ωt, with ω = 628 rad/s.","h":"I_max = E_max/R = 377/24 = 15.7 A. e = E_max sin ωt."},{"q":"A coil of 100 turns sees its flux change by 0.02 Wb in 0.5 s. What is the average induced emf?","c":"4 V","w":["0.04 V","1 V","400 V"],"e":"ε = N ΔΦ/Δt = 100 × 0.02/0.5 = 4 V.","h":"ε = N ΔΦ/Δt = 100 × 0.02 ÷ 0.5 = 4 V."},{"q":"What does the minus sign in Faraday's law ε = −N dΦ/dt represent?","c":"The induced emf opposes the change that causes it (Lenz's law)","w":["The emf is always negative","The emf always points along the flux","The flux is decreasing"],"e":"The induced current makes a field that fights the change in flux. This follows from conservation of energy.","h":"Minus sign = Lenz's law. The induced emf opposes the change in flux."},{"q":"A rod of length 0.4 m moves at 10 m/s perpendicular to a field of 0.5 T. What emf is induced between its ends?","c":"2 V","w":["20 V","0.2 V","5 V"],"e":"ε = BLv = 0.5 × 0.4 × 10 = 2 V.","h":"ε = BLv = 0.5 × 0.4 × 10 = 2 V."},{"q":"A loop moves at constant velocity with its whole area inside a uniform field. What is the induced emf?","c":"Zero, because the flux through it does not change","w":["BLv, where L is the side of the loop","Equal to the field times the area","Positive and constant"],"e":"Emf needs a changing flux. If the loop is entirely inside a uniform field, the flux is constant. Emf appears only while it enters or leaves.","h":"Loop fully inside a uniform field moving at constant velocity: flux constant, emf zero."},{"q":"A rod moves at twice its original speed in the same field. What happens to the motional emf?","c":"It doubles","w":["It quadruples","It halves","It stays the same"],"e":"ε = BLv is proportional to v.","h":"ε ∝ v. Double speed, double emf."},{"q":"A coil of 50 turns, area 0.04 m², rotates at ω = 100 rad/s in a field of 0.2 T. What is the peak emf?","c":"40 V","w":["400 V","4 V","0.4 V"],"e":"ε_max = NBAω = 50 × 0.2 × 0.04 × 100 = 40 V.","h":"ε_max = NBAω = 50 × 0.2 × 0.04 × 100 = 40 V. Multiply four numbers."},{"q":"A generator's emf is ε = 151 sin(314t) V. What is its frequency?","c":"50 Hz","w":["314 Hz","100 Hz","25 Hz"],"e":"ω = 2πf, so f = 314/(2π) = 50 Hz.","h":"ε = 151 sin(314t): ω = 314, f = ω/2π = 50 Hz. Divide by 6.28."},{"q":"At which position of a generator coil is the induced emf zero?","c":"When the plane of the coil is perpendicular to the field (flux is maximum)","w":["When the plane of the coil is parallel to the field","When the coil rotates at its slowest","When the flux is changing fastest"],"e":"ε = −dΦ/dt and the flux is at a maximum (so its rate of change is zero) when the coil faces the field.","h":"Emf is zero when the coil plane is perpendicular to B (flux maximum, rate of change zero)."},{"q":"What is the rms value of an AC voltage with peak 311 V?","c":"About 220 V","w":["About 440 V","About 155 V","About 311 V"],"e":"V_rms = V_peak/√2 = 311/1.414 = 220 V.","h":"V_rms = V_peak ÷ 1.414 = 311/1.414 = 220 V. Remember 311 ↔ 220."},{"q":"A transformer has 1000 primary turns and 50 secondary turns. It is connected to a 240 V AC source. What is the secondary voltage?","c":"12 V","w":["4800 V","240 V","1.2 V"],"e":"V_s/V_p = N_s/N_p, so V_s = 240 × 50/1000 = 12 V.","h":"Vs = 240 × 50/1000 = 12 V. Divide the turns ratio first (1/20)."},{"q":"An ideal step-up transformer raises the voltage by 10 times. What happens to the current in the secondary?","c":"It falls to one tenth of the primary current","w":["It rises to 10 times the primary current","It stays the same as the primary current","It falls to zero"],"e":"Power in = power out, so V_pI_p = V_sI_s. If V_s is 10 times bigger, I_s is 10 times smaller.","h":"Step-up V × 10: power in = power out, so I ÷ 10. Current falls to a tenth."},{"q":"Why does a transformer not work with a steady DC input?","c":"The flux in the core does not change, so no emf is induced in the secondary","w":["DC has too low a frequency to heat the core","DC cannot flow through a coil","The secondary resistance is infinite for DC"],"e":"Induction needs a changing flux. DC gives a constant flux after the first instant.","h":"DC gives constant flux, no changing flux, no induced emf. Pick 'flux does not change'."},{"q":"Why are transformer cores made of thin laminated sheets rather than solid iron?","c":"To reduce eddy-current losses","w":["To increase the resistance of the coils","To increase the primary voltage","To make the core lighter only"],"e":"Insulated thin sheets break up the paths for circulating eddy currents which would waste energy as heat.","h":"Laminated cores reduce eddy-current losses. Thin insulated sheets break up the loops."},{"q":"What is the magnetic field at 0.05 m from a long straight wire carrying 10 A? (μ₀ = 4π×10⁻⁷)","c":"4×10⁻⁵ T","w":["4×10⁻⁴ T","2×10⁻⁵ T","8×10⁻⁵ T"],"e":"B = μ₀I/(2πr) = 4π×10⁻⁷ × 10/(2π × 0.05) = 4×10⁻⁵ T.","h":"B = 2×10⁻⁷ × 10 ÷ 0.05 = 4×10⁻⁵ T. 2×10⁻⁷ × I/r saves time."},{"q":"A solenoid has 1000 turns per metre and carries 2 A. What is the field inside? (μ₀ = 4π×10⁻⁷)","c":"About 2.5×10⁻³ T","w":["About 2.5×10⁻⁶ T","About 1.3×10⁻³ T","About 0.25 T"],"e":"B = μ₀nI = 4π×10⁻⁷ × 1000 × 2 = 2.51×10⁻³ T.","h":"B = μ₀nI = 4π×10⁻⁷ × 1000 × 2 = 2.5×10⁻³ T. n is turns per metre."},{"q":"A circular loop of radius 0.10 m carries 5 A. What is the field at its centre? (μ₀ = 4π×10⁻⁷)","c":"About 3.1×10⁻⁵ T","w":["About 6.3×10⁻⁵ T","About 1.6×10⁻⁵ T","About 3.1×10⁻⁷ T"],"e":"B = μ₀I/(2R) = 4π×10⁻⁷ × 5/0.2 = 3.14×10⁻⁵ T.","h":"B = μ₀I/2R = 4π×10⁻⁷ × 5 ÷ 0.2 = 3.1×10⁻⁵ T."},{"q":"Two long parallel wires each carry 10 A and are 0.10 m apart. What is the force per unit length between them? (μ₀ = 4π×10⁻⁷)","c":"2×10⁻⁴ N/m","w":["2×10⁻⁶ N/m","4×10⁻⁴ N/m","1×10⁻⁴ N/m"],"e":"F/L = μ₀I₁I₂/(2πd) = 2×10⁻⁷ × 100/0.10 = 2×10⁻⁴ N/m.","h":"F/L = 2×10⁻⁷ × I₁I₂/d = 2×10⁻⁷ × 100 ÷ 0.1 = 2×10⁻⁴ N/m."},{"q":"How is the direction of the magnetic field around a straight current-carrying wire found?","c":"By the right-hand grip rule: thumb along the current, fingers curl along B","w":["By the left-hand grip rule: thumb along the current, fingers curl against B","The field points along the wire in the direction of the current","The field points radially outward from the wire"],"e":"B forms circles around the wire. This follows from Ampère's law and the cross product in Biot–Savart.","h":"Right-hand grip: thumb along current, fingers curl the field direction."},{"q":"What does Ampère's law state?","c":"The line integral of B around a closed loop equals μ₀ times the current enclosed","w":["The line integral of B around a closed loop is always zero","The surface integral of B over a closed surface equals μ₀ times the current","The line integral of E around a closed loop equals the enclosed charge divided by ε₀"],"e":"∮B·dl = μ₀I_enc. It is useful when the current distribution has high symmetry.","h":"∮B·dl = μ₀I_enc. Enclosed current only."},{"q":"What is the field outside an ideal long solenoid?","c":"Approximately zero","w":["Equal to the field inside","Equal to half the field inside","μ₀nI/r"],"e":"For an ideal solenoid, Ampère's law on a loop outside gives zero, since the field lines close very far away over a large area.","h":"Outside an ideal solenoid: B ≈ 0. Inside uniform."},{"q":"If the speed of a magnet moving through a coil is doubled, what happens to the induced emf?","c":"It doubles","w":["It stays the same","It halves","It quadruples"],"e":"The flux changes twice as fast, and ε = N dΦ/dt doubles.","h":"Faster magnet, faster flux change, so emf doubles. ε ∝ rate of change."}],[{"q":"How is the self-inductance L of a coil of N turns defined?","c":"L = NΦ/i, the flux linkage in the coil per unit current through it","w":["L = Φ/(Ni), the flux through one turn per unit current and per turn","L = iΦ/N, the current times the flux per turn","L = N/(Φi), the number of turns per unit flux and current"],"e":"Flux linkage is NΦ. Self-inductance is the flux linkage produced in the coil by its own current, divided by that current.","h":"L = NΦ/i. Flux linkage per unit current."},{"q":"What is the SI unit of inductance, the henry, equal to?","c":"1 H = 1 V·s/A = 1 Wb/A","w":["1 H = 1 V·A/s = 1 J/s","1 H = 1 A·s/V = 1 C/V","1 H = 1 V/(A·s) = 1 T/A"],"e":"From ε = L di/dt, L = ε/(di/dt) which has units V per (A/s) = V·s/A. Also Wb/A from L = NΦ/i.","h":"1 H = 1 V·s/A = 1 Wb/A. From ε = L di/dt."},{"q":"What is the emf induced in a coil of self-inductance L when the current through it changes at the rate di/dt?","c":"ε = −L di/dt, the sign showing that the emf opposes the change in current","w":["ε = +L di/dt, the sign showing that the emf helps the change in current","ε = −L i, the emf depends on the current itself and not on its rate of change","ε = −di/(L dt), the emf is larger for a smaller inductance"],"e":"Faraday's law with flux linkage NΦ = Li gives ε = −d(Li)/dt = −L di/dt. Lenz's law gives the minus sign.","h":"ε = −L di/dt. The minus sign means it opposes the change (Lenz)."},{"q":"A coil of inductance 500 mH carries a current that changes at 1000 A/s. What is the magnitude of the induced emf?","c":"500 V","w":["50 V","2 V","5000 V"],"e":"ε = L(di/dt) = 0.5 × 1000 = 500 V.","h":"ε = L × di/dt = 0.5 × 1000 = 500 V. Convert mH to H first."},{"q":"A coil of inductance 0.3 H has its current raised from 0 to 4 A in 0.2 s at a steady rate. What is the average induced emf magnitude?","c":"6 V","w":["0.24 V","24 V","1.5 V"],"e":"di/dt = 4/0.2 = 20 A/s. ε = 0.3 × 20 = 6 V.","h":"di/dt = 4/0.2 = 20 A/s. ε = 0.3 × 20 = 6 V. Rate first, then multiply by L."},{"q":"What is the inductance of a long solenoid of N turns, cross-sectional area A and length l with no core?","c":"L = μ₀N²A/l","w":["L = μ₀NA/l","L = μ₀N²l/A","L = μ₀NA²/l"],"e":"B = μ₀Ni/l, flux per turn is BA, so L = NΦ/i = μ₀N²A/l.","h":"L = μ₀N²A/l. Turns squared, area on top, length below."},{"q":"A solenoid has 1000 turns, area 2.0×10⁻⁴ m² and length 0.50 m. What is its inductance? (μ₀ = 4π×10⁻⁷ T·m/A)","c":"About 5.0×10⁻⁴ H","w":["About 5.0×10⁻⁷ H","About 2.5×10⁻⁴ H","About 1.0×10⁻³ H"],"e":"L = μ₀N²A/l = (4π×10⁻⁷)(10⁶)(2×10⁻⁴)/0.5 = 5.03×10⁻⁴ H.","h":"L = 4π×10⁻⁷ × 10⁶ × 2×10⁻⁴ ÷ 0.5 = 5×10⁻⁴ H. Square the turns first (10⁶)."},{"q":"If the number of turns of a solenoid is doubled while its size stays the same, what happens to its inductance?","c":"It becomes four times as large","w":["It becomes twice as large","It stays the same","It becomes half as large"],"e":"L is proportional to N². Doubling N multiplies L by 2² = 4.","h":"L ∝ N². Double turns, four times L."},{"q":"Which change would increase the inductance of a solenoid?","c":"Inserting an iron core, which raises the permeability","w":["Pulling out the turns to make it longer with the same N","Using thinner wire of a smaller cross-sectional area","Reducing the number of turns while keeping the length"],"e":"L = μN²A/l. An iron core raises μ a great deal. A longer coil lowers L, a smaller area lowers L, fewer turns lower L.","h":"Iron core raises permeability μ, so L goes up a lot. More turns also does it."},{"q":"What energy is stored in an inductor of inductance L carrying a current i?","c":"U = ½Li²","w":["U = Li²","U = ½L²i","U = ½Li"],"e":"Power is p = Li di/dt, so the work done in raising the current from 0 to i is ∫Li di = ½
