 through any open surface equals the charge enclosed divided by ε₀","The total electric flux through a closed surface equals the charge outside it divided by ε₀"],"e":"Φ = ∮E·dA = Q/ε₀. Only the charge inside the closed (Gaussian) surface counts.","h":"Gauss: total flux through a closed surface = enclosed charge ÷ ε₀. Only inside charge counts."},{"q":"A point charge q is at the centre of a cube. What is the flux through each face?","c":"q/6ε₀, because the total flux q/ε₀ is shared equally over 6 faces","w":["q/ε₀, because each face is crossed by all the field lines","q/3ε₀, because only three faces are crossed by field lines","q/8ε₀, because the cube has 8 corners to share the flux"],"e":"The total flux through the cube is q/ε₀. By symmetry all six faces get the same, so each gets q/6ε₀.","h":"Cube: total q/ε₀ ÷ 6 faces = q/6ε₀. Symmetry, no integration."},{"q":"A charge lies outside a closed surface. What is its contribution to the net flux through that surface?","c":"Zero, because every line that enters the surface also leaves it","w":["Positive, because the charge still produces field lines on the surface","Negative, because the field lines enter the surface from the outside","Equal to q/ε₀, because Gauss's law counts every charge in the system"],"e":"Only enclosed charges contribute to net flux. Lines from an outside charge go in on one side and out on the other, so they cancel.","h":"Charge outside a closed surface: zero net flux. Every line in also goes out."},{"q":"A closed surface encloses no net charge. What is the net flux through it?","c":"Zero, because the number of lines entering equals the number leaving","w":["Equal to ε₀, because that is the smallest possible flux","Positive, because lines of E always leave a closed surface","Infinite, because the field near the surface is not controlled"],"e":"Φ = Q/ε₀ with Q = 0 gives Φ = 0. This does not mean E is zero, only that the net flux is.","h":"No net charge inside: Φ = 0. Field can still be non-zero."},{"q":"What do you get if you apply Gauss's law to a point charge enclosed by a sphere?","c":"Coulomb's law, because Gauss's law is a restatement of it","w":["Newton's law of gravitation, because both are inverse-square laws","Ohm's law, because the flux is linked to the current in the sphere","Faraday's law, because the flux is linked to the changing field"],"e":"E(4πr²) = q/ε₀ gives E = q/(4πε₀r²), which is Coulomb's law.","h":"Gauss's law on a point charge gives Coulomb's law. E(4πr²) = q/ε₀."},{"q":"Which sources of flux are counted in Gauss's law?","c":"Only electric charges, since changing magnetic fields cannot act as sources or sinks of E in this law","w":["Electric charges and changing magnetic fields, since both create the field E","Only positive charges, because negative charges are not sources","Only the charges on the surface itself, not the ones inside it"],"e":"The flux comes from sources (positive charges) and sinks (negative charges) inside the surface. Charges outside do not count.","h":"Only charges are sources of E-flux. Changing magnetic fields are not counted in this form."},{"q":"Which is the correct order of steps for using Gauss's law to find a field?","c":"Identify the symmetry, choose a matching Gaussian surface, find the flux, find the enclosed charge, then solve for E","w":["Find the enclosed charge, choose any surface, calculate the flux, then find the symmetry","Choose a Gaussian surface, find the field, then check the symmetry of the charge","Find the flux, identify the symmetry, solve for E, then find the enclosed charge"],"e":"You first look at the symmetry, then pick a surface of the same symmetry so E is constant (or zero) on it. Then Φ = EA and Φ = Q/ε₀ give E.","h":"Order: symmetry, then Gaussian surface, then E from Gauss. Spot the option that starts with symmetry."},{"q":"Which three kinds of symmetry are used with Gauss's law?","c":"Spherical, cylindrical and planar","w":["Spherical, linear and circular","Cylindrical, planar and rectangular","Spherical, cubic and planar"],"e":"Point charges and spheres use a spherical surface. Long lines use a cylinder. Large sheets use a pillbox crossing the plane.","h":"Gauss symmetries: spherical, cylindrical, planar. Three, in that order."},{"q":"Which Gaussian surface is used to find the field of an infinite line of charge?","c":"A cylinder of radius r and length l centred on the line","w":["A sphere of radius r centred on the line","A cube with the line passing through one face","A flat circle placed at a right angle to the line"],"e":"By cylindrical symmetry, E points radially outward and has the same size all around the curved surface. There is no flux through the end caps.","h":"Line of charge: cylinder coaxial with the line. Spherical surface will not work."},{"q":"What is the electric field at a distance r from an infinite line of charge with linear density λ?","c":"E = λ/2πε₀r","w":["E = λ/4πε₀r²","E = λ/2ε₀","E = λr/2πε₀"],"e":"Gauss's law: E(2πrl) = λl/ε₀ gives E = λ/2πε₀r. It falls off as 1/r, not 1/r².","h":"Line: E = λ/2πε₀r = 2kλ/r. It falls as 1/r."},{"q":"What is the field near a large flat non-conducting sheet of charge with surface density σ?","c":"E = σ/2ε₀, the same at every distance, pointing away from a positive sheet","w":["E = σ/ε₀, the same at every distance, pointing away from a positive sheet","E = σ/2ε₀r², weakening with distance, pointing away from a positive sheet","E = σ/4πε₀r², weakening with distance, pointing away from a positive sheet"],"e":"A pillbox crossing the sheet has flux through both end caps: 2EA = σA/ε₀, so E = σ/2ε₀. It is independent of distance.","h":"Non-conducting sheet: E = σ/2ε₀ (two faces). It does not depend on distance."},{"q":"What is the field just outside the surface of a charged conductor, and between two oppositely charged parallel plates?","c":"E = σ/ε₀ in both cases","w":["E = σ/2ε₀ in both cases","E = σ/ε₀ near the conductor but σ/2ε₀ between the plates","E = 2σ/ε₀ in both cases"],"e":"For a conductor the field is zero inside, so there is flux through one side only: EA = σA/ε₀. Between two plates the fields of both add, giving σ/2ε₀ + σ/2ε₀ = σ/ε₀.","h":"Conductor surface and parallel plates: E = σ/ε₀. Double the sheet value."},{"q":"What does the differential form of Gauss's law state?","c":"The divergence of E at a point equals the volume charge density divided by ε₀, ∇·E = ρ/ε₀","w":["The divergence of E at a point equals the volume charge density multiplied by ε₀, ∇·E = ρε₀","The curl of E at a point equals the volume charge density divided by ε₀, ∇×E = ρ/ε₀","The gradient of E at a point equals the surface charge density divided by ε₀, ∇E = σ/ε₀"],"e":"The integral form relates flux to charge in a volume. The differential form does it at a single point, in terms of ρ.","h":"Differential form: ∇·E = ρ/ε₀. Divergence of E equals charge density over ε₀."},{"q":"Example 4.1: E = 100 N/C in the x-direction passes through a square of side 10 cm in the Y-Z plane, with the normal along +x. What is the flux?","c":"1 N·m²/C","w":["10 N·m²/C","0.1 N·m²/C","100 N·m²/C"],"e":"The normal is along E, so θ = 0. Φ = EA = 100 × (0.10)² = 1 N·m²/C.","h":"Normal along E: θ = 0, so Φ = EA = 100 × 0.01 = 1 N·m²/C. Area in m²."},{"q":"Example 4.2: A large plane sheet with σ = 2.0 × 10⁻⁶ C/m² lies in the x-y plane. What is the flux through a circle of radius 1 cm whose normal makes 60° with the z-axis?","c":"About 17.7 N·m²/C (the book rounds this to 17.5)","w":["About 35.5 N·m²/C, because cos 60° is left out","About 8.9 N·m²/C, because the area is halved twice","About 30.7 N·m²/C, because sin 60° is used instead"],"e":"E = σ/2ε₀ = 1.13 × 10⁵ N/C along z. A = πr² = 3.14 × 10⁻⁴ m². Φ = EA cos 60° = 1.13 × 10⁵ × 3.14 × 10⁻⁴ × 0.5 ≈ 17.7 N·m²/C.","h":"E = σ/2ε₀ = 2×10⁻⁶ ÷ 1.77×10⁻¹¹ = 1.13×10⁵. Then ×A (3.14×10⁻⁴). Answer 17.7."},{"q":"Example 4.3: 4 × 10⁻⁸ C is spread on a sphere of radius 1 cm, covered by a concentric hollow conducting sphere of radius 5 cm. What is the field at 2 cm from the centre?","c":"9 × 10⁵ N/C","w":["9 × 10⁷ N/C","3.6 × 10² N/C","4.5 × 10⁵ N/C"],"e":"A spherical Gaussian surface of radius 2 cm encloses only the 4 × 10⁻⁸ C. E = kq/r² = (9 × 10⁹)(4 × 10⁻⁸) ÷ (2 × 10⁻²)² = 9 × 10⁵ N/C.","h":"Gaussian sphere of 2 cm encloses only the inner charge. E = 9×10⁹ × 4×10⁻⁸ ÷ 4×10⁻⁴ = 9×10⁵ N/C."},{"q":"Example 4.3(b): A charge of 6 × 10⁻⁸ C is placed on the hollow sphere. What charge ends up on its inner and outer surface?","c":"Inner surface −4 × 10⁻⁸ C, outer surface +10 × 10⁻⁸ C","w":["Inner surface +4 × 10⁻⁸ C, outer surface +2 × 10⁻⁸ C","Inner surface zero, outer surface +6 × 10⁻⁸ C","Inner surface −4 × 10⁻⁸ C, outer surface +2 × 10⁻⁸ C"],"e":"Field inside the conducting material is zero, so a Gaussian surface in the metal must enclose zero charge. So the inner surface carries −4 × 10⁻⁸ C to cancel the inner sphere. The total is 6 × 10⁻⁸ C, so the outer surface has 6 + 4 = 10 × 10⁻⁸ C.","h":"Gauss inside the hollow metal: inner surface −q, outer = total − inner. 6 + 4 = +10×10⁻⁸ C."},{"q":"Example 4.3(b) continued: The outer surface of the hollow sphere (radius 5 cm) carries 1.0 × 10⁻⁷ C. What is its surface charge density?","c":"About 3.2 × 10⁻⁶ C/m²","w":["About 3.2 × 10⁻⁴ C/m²","About 1.6 × 10⁻⁶ C/m²","About 8.0 × 10⁻⁶ C/m²"],"e":"σ = Q/4πR² = 1.0 × 10⁻⁷ ÷ [4π(0.05)²] = 1.0 × 10⁻⁷ ÷ 0.0314 = 3.2 × 10⁻⁶ C/m².","h":"σ = Q ÷ 4πR² = 10⁻⁷ ÷ 0.0314 = 3.2×10⁻⁶. 4π(0.05)² = 0.0314."},{"q":"Example 4.4: Shells A (radius a) and C (radius c) carry q and −q. Middle shell B (radius b) is earthed. What is the charge on the inner surface of B?","c":"−q, since the field in the metal of B is zero","w":["+q, since B must copy the charge of the shell inside it","Zero, since an earthed shell cannot hold any charge","−q·b/c, since the radii must be included in the ratio"],"e":"Take a Gaussian surface inside the metal of B. The field there is zero, so the enclosed charge is zero. The shell A has +q, so the inner surface of B has −q.","h":"B earthed: inner surface takes −q (Gauss in the metal gives E = 0). Inner charge = −q."},{"q":"Example 4.4 continued: With shell B earthed, what charge sits on the outer surface of B?","c":"+qb/c","w":["+q","−qb/c","Zero"],"e":"Let the outer surface of B have q′. The inner surface of C then has −q′. B is earthed, so its potential is zero: q′/4πε₀b − q/4πε₀c = 0, which gives q′ = qb/c.","h":"Outer of B: q′. Earth fixes potential, so q′ = +qb/c."},{"q":"Example 4.4 continued: What is the charge on the outer surface of shell C?","c":"−q(1 − b/c)","w":["−q(1 + b/c)","−qb/c","+q(1 − b/c)"],"e":"C carries −q in total. Its inner surface has −qb/c, so the outer surface has −q − (−qb/c) = −q(1 − b/c).","h":"C total −q, its inner surface has −qb/c... outer = −q + qb/c = −q(1 − b/c)."},{"q":"Example 4.5: A particle of mass 5 × 10⁻⁶ g floats above a large horizontal sheet of charge density 4.0 × 10⁻⁶ C/m². What charge must it carry to stay in the air?","c":"About 2.2 × 10⁻¹³ C","w":["About 2.2 × 10⁻¹⁶ C","About 4.4 × 10⁻¹³ C","About 1.1 × 10⁻¹³ C"],"e":"E = σ/2ε₀ = 2.26 × 10⁵ N/C. The electric force qE balances the weight: q = mg/E = (5 × 10⁻⁹ × 9.8) ÷ 2.26 × 10⁵ ≈ 2.2 × 10⁻¹³ C.","h":"Float: qE = mg, q = mg ÷ E. 5×10⁻⁹ × 9.8 ÷ 2.26×10⁵ = 2.2×10⁻¹³ C."},{"q":"Example 4.5 continued: About how many electrons must be removed to give the particle a charge of 2.2 × 10⁻¹³ C, and what is the mass lost?","c":"About 1.4 × 10⁶ electrons, losing about 1.3 × 10⁻²⁴ kg","w":["About 1.4 × 10⁶ electrons, losing about 1.3 × 10⁻³⁰ kg","About 1.4 × 10⁶ electrons, losing about 1.3 × 10⁻¹⁹ kg","About 3.5 × 10⁻³³ electrons, losing about 1.3 × 10⁻²⁴ kg"],"e":"n = q/e = 2.2 × 10⁻¹³ ÷ 1.6 × 10⁻¹⁹ = 1.4 × 10⁶. Mass lost = 1.4 × 10⁶ × 9.1 × 10⁻³¹ kg ≈ 1.3 × 10⁻²⁴ kg, which is tiny.","h":"n = q ÷ e = 2.2×10⁻¹³ ÷ 1.6×10⁻¹⁹ = 1.4×10⁶. Then mass = n × mₑ."},{"q":"Example 4.6: A conducting sphere with charge Q sits inside a concentric hollow shell, with a potential difference V between them. If the shell is now given a charge −3Q, what is the new potential difference between the sphere and the shell?","c":"Still V, because both surfaces shift by the same potential","w":["V − 3Q, because the charge on the shell is subtracted","3V, because the shell charge is three times bigger","Zero, because the shell cancels the sphere's field"],"e":"Putting extra charge on the shell changes the potential everywhere inside and on it by the same amount V₀. The difference V_sphere − V_shell = (Q/4πε₀)(1/a − 1/b) does not change.","h":"Extra charge on the shell shifts both potentials equally. The difference V stays."},{"q":"Example 4.7: A small sphere of mass 80 g with charge q is released 9 m above the centre of a fixed non-conducting sphere of radius 1 m carrying the same charge q. It falls until it just stops before touching. What is q?","c":"About 28 µC","w":["About 2.8 µC","About 84 µC","About 9.4 µC"],"e":"Energy conservation: kq²/9 + mg(9) = kq²/1 + mg(1). So kq²(8/9) = 8mg, which gives q² = 9mg/k = 9(0.08)(9.8) ÷ 9 × 10⁹ = 7.84 × 10⁻¹⁰, so q = 2.8 × 10⁻⁵ C = 28 µC.","h":"Energy conservation between the two heights: kq²(1/r₂−1/r₁) = mg(Δh). Solve for q², then root."},{"q":"Problem 4.1: What is the electric flux through a Gaussian surface containing 200 million electrons?","c":"About −3.6 N·m²/C","w":["About +3.6 N·m²/C","About −3.6 × 10⁻¹¹ N·m²/C","About −5.1 × 10⁸ N·m²/C"],"e":"Q = −(2 × 10⁸)(1.6 × 10⁻¹⁹) = −3.2 × 10⁻¹¹ C. Φ = Q/ε₀ = −3.2 × 10⁻¹¹ ÷ 8.85 × 10⁻¹² = −3.6 N·m²/C. Negative means inward.","h":"Q = −(2×10⁸)(1.6×10⁻¹⁹) = −3.2×10⁻¹¹. Φ = Q ÷ 8.85×10⁻¹² = −3.6."},{"q":"Problem 4.2: A uniformly charged solid insulating sphere of radius 0.25 m holds 3.4 pC. What is the field 0.15 m from the centre?","c":"About 0.29 N/C","w":["About 0.49 N/C","About 1.36 N/C","About 0.015 N/C"],"e":"Inside the sphere only the charge within r counts: Q(r/R)³. So E = kQr/R³ = (9 × 10⁹)(3.4 × 10⁻¹²)(0.15) ÷ (0.25)³ = 0.29 N/C.","h":"Inside a uniform solid sphere: E = kQr/R³. 9×10⁹ × 3.4×10⁻¹² × 0.15 ÷ 0.0156 = 0.29 N/C."},{"q":"Problem 4.3: An infinite line of charge carries 0.4 C per metre. What is the field 0.3 m from the line?","c":"About 2.4 × 10¹⁰ N/C","w":["About 1.2 × 10¹⁰ N/C","About 4.0 × 10⁹ N/C","About 2.4 × 10⁸ N/C"],"e":"E = λ/2πε₀r = 2kλ/r = 2(9 × 10⁹)(0.4) ÷ 0.3 = 2.4 × 10¹⁰ N/C.","h":"E = 2kλ/r = 2 × 9×10⁹ × 0.4 ÷ 0.3 = 2.4×10¹⁰ N/C. Just substitute into 2kλ/r."},{"q":"Problem 4.4: A −2 µC charge is at the centre of a cube of side 5 cm. What is the net flux through the cube surface?","c":"About −2.3 × 10⁵ N·m²/C","w":["About +2.3 × 10⁵ N·m²/C","About −3.8 × 10⁴ N·m²/C","About −5.6 × 10⁷ N·m²/C"],"e":"Φ = Q/ε₀ = −2 × 10⁻⁶ ÷ 8.85 × 10⁻¹² = −2.3 × 10⁵ N·m²/C. The side length does not matter.","h":"Φ = Q ÷ ε₀ = −2×10⁻⁶ ÷ 8.85×10⁻¹² = −2.3×10⁵. The cube's size is a distraction."},{"q":"Problem 4.5: A charge Q sits at the centre of a cube of edge L. What is the flux through the whole cube, and through one face?","c":"Q/ε₀ through the whole cube and Q/6ε₀ through one face","w":["Q/6ε₀ through the whole cube and Q/36ε₀ through one face","Q/ε₀ through the whole cube and Q/ε₀ through one face","Q/2ε₀ through the whole cube and Q/12ε₀ through one face"],"e":"Gauss's law gives the total. By symmetry each of the six faces takes an equal share.","h":"Whole cube Q/ε₀. One face Q/6ε₀. Divide by 6."},{"q":"Problem 4.6: A hemisphere contains a total charge of 6.6 × 10⁻⁷ C. The flux through the rounded part is 9.8 × 10⁴ N·m²/C. What is the flux through the flat base?","c":"About −2.3 × 10⁴ N·m²/C","w":["About +2.3 × 10⁴ N·m²/C","About +1.7 × 10⁵ N·m²/C","About −1.7 × 10⁵ N·m²/C"],"e":"Total flux for the closed hemisphere is Q/ε₀ = 7.5 × 10⁴ N·m²/C. Flux through the base = total − rounded part = 7.5 × 10⁴ − 9.8 × 10⁴ = −2.3 × 10⁴ N·m²/C.","h":"Closed hemisphere total = Q/ε₀. Flat face flux = total − rounded flux. Watch the signs."},{"q":"Problem 4.7: A cube of side 8.5 cm is in a uniform field E = 7500 N/C, with two faces parallel to the field lines. What is the net flux through the cube, and the flux through each of the two faces at a right angle to E?","c":"Net flux is zero; the two faces carry about −54 and +54 N·m²/C","w":["Net flux is 108 N·m²/C; the two faces carry 54 N·m²/C each","Net flux is zero; the two faces carry about −540 and +540 N·m²/C","Net flux is 54 N·m²/C; the two faces carry 27 N·m²/C each"],"e":"No charge is inside, so net flux = 0. Flux through a face at a right angle is EL² = 7500 × (0.085)² = 54 N·m²/C. What goes in on one face comes out of the opposite face. The other four faces are parallel to E, so they have zero flux.","h":"No charge inside, so net flux 0. Two faces parallel to the field carry zero. The other two cancel."},{"q":"Problem 4.8: A point charge q is placed near a very large flat plane. What is the flux through the plane?","c":"q/2ε₀, which is half the total flux from the charge","w":["q/ε₀, which is the whole flux from the charge","q/4ε₀, which is a quarter of the flux from the charge","Zero, because the plane is not a closed surface"],"e":"Half of the field lines from the charge go to one side of the infinite plane, so the flux through it is half of q/ε₀.","h":"Plane splits flux in half: q/2ε₀. Half the lines go each side."},{"q":"Problem 4.9: A sphere of mass 100 g with charge q is released 10 m above the centre of a fixed non-conducting sphere of radius 1 m with the same charge q, and stops just before touching it. What is q?","c":"About 33 µC","w":["About 3.3 µC","About 10 µC","About 66 µC"],"e":"kq²/10 + mg(10) = kq²/1 + mg(1). So kq²(9/10) = 9mg and q² = 10mg/k = 10(0.1)(9.8) ÷ 9 × 10⁹ = 1.09 × 10⁻⁹. So q ≈ 3.3 × 10⁻⁵ C = 33 µC.","h":"q² = 10mg ÷ k for the 10 m case. Take the root and convert to µC."},{"q":"A uniform field of 200 N/C passes through a flat area of 0.5 m² with the normal at 60° to the field. What is the flux?","c":"50 N·m²/C","w":["100 N·m²/C","86.6 N·m²/C","173 N·m²/C"],"e":"Φ = EA cosθ = 200 × 0.5 × 0.5 = 50 N·m²/C. The angle is measured from the normal, not the surface.","h":"Φ = 200 × 0.5 × cos60° = 200 × 0.5 × 0.5 = 50 N·m²/C. Use the angle to the normal."},{"q":"When is the flux of a uniform field through a flat surface zero?","c":"When the field is parallel to the surface","w":["When the field is perpendicular to the surface","When the surface is very small","When the field is strong"],"e":"Φ = EA cosθ with θ the angle to the normal. A field parallel to the surface is at 90° to the normal, and cos 90° = 0.","h":"Field parallel to surface means flux zero. θ = 90° to the normal."},{"q":"A closed surface contains a net charge q. What does Gauss's law give for the net flux through it?","c":"Φ = q/ε₀","w":["Φ = qε₀","Φ = q/(4πε₀r²)","Φ = ε₀/q"],"e":"The net flux through any closed surface equals the net enclosed charge divided by ε₀.","h":"Net flux = q/ε₀. Closed surface, enclosed charge. No other charges matter."},{"q":"A point charge lies outside a closed surface. What is the net flux through the surface due to that charge?","c":"Zero, since every line that enters also leaves","w":["q/ε₀, as for any charge","Half of q/ε₀","Depends on the distance"],"e":"Field lines from an outside charge go in one side and out the other, so the net flux is zero.","h":"Outside charge: zero net flux. Lines go in and out equally."},{"q":"What is the net electric flux through a closed surface enclosing 8.85 nC? (ε₀ = 8.85×10⁻¹² C²/N·m²)","c":"1000 N·m²/C","w":["1.0 N·m²/C","1×10⁶ N·m²/C","8.85×10⁻⁹ N·m²/C"],"e":"Φ = q/ε₀ = 8.85×10⁻⁹/8.85×10⁻¹² = 1000 N·m²/C.","h":"8.85 nC ÷ ε₀: 8.85×10⁻⁹ ÷ 8.85×10⁻¹² = 10³. Same digits cancel, so only powers of ten remain."},{"q":"A sphere around a charge is enlarged to twice its radius. What happens to the net flux through it?","c":"It stays the same","w":["It halves","It quarters","It doubles"],"e":"Φ = q/ε₀ depends only on the enclosed charge. The field is weaker on a bigger sphere, but the area is bigger by the same amount.","h":"Flux depends only on enclosed charge. Bigger sphere, same flux."},{"q":"A charge of 6 nC is at the centre of a cube. What is the flux through one face? (ε₀ = 8.85×10⁻¹²)","c":"About 113 N·m²/C","w":["About 678 N·m²/C","About 18 N·m²/C","About 4.7 N·m²/C"],"e":"Total flux = q/ε₀ = 678. By symmetry, each of the six faces has one sixth, 113 N·m²/C.","h":"Total q/ε₀ = 6×10⁻⁹ ÷ 8.85×10⁻¹² = 678. Divide by 6 = 113 per face."},{"q":"A point charge q sits at one corner of a cube. What is the total flux through the whole cube?","c":"q/(8ε₀)","w":["q/(6ε₀)","q/ε₀","q/(24ε₀)"],"e":"Eight identical cubes around the corner would enclose the charge completely, so each cube takes one eighth of q/ε₀.","h":"Corner: 8 cubes would surround the charge, so the cube gets one-eighth. q/8ε₀."},{"q":"A charge q is at one corner of a cube. What is the flux through each face that does not touch the charge?","c":"q/(24ε₀)","w":["q/(8ε₀)","q/(6ε₀)","Zero"],"e":"The cube's total flux is q/8ε₀. The three faces touching the charge get zero. The other three share it equally, q/24ε₀ each.","h":"Corner charge: 3 faces touching get zero. Other 3 share q/8ε₀, so q/24ε₀ each."},{"q":"An infinite line of charge has linear density 2 nC/m. What is the field at 0.50 m? (k = 9×10⁹)","c":"72 N/C","w":["36 N/C","144 N/C","18 N/C"],"e":"E = λ/(2πε₀r) = 2kλ/r = 2 × 9×10⁹ × 2×10⁻⁹/0.5 = 72 N/C.","h":"E = 2kλ/r = 2 × 9×10⁹ × 2×10⁻⁹ ÷ 0.5 = 36 ÷ 0.5 = 72 N/C."},{"q":"How does the field of a long line of charge change with distance r?","c":"It falls as 1/r","w":["It falls as 1/r²","It is constant","It falls as 1/r³"],"e":"The Gaussian cylinder has area 2πrL, so E × 2πrL = λL/ε₀ giving E ∝ 1/r.","h":"Long line: E ∝ 1/r. Cylinder area is 2πrL."},{"q":"An infinite sheet carries a surface charge density of 8.85×10⁻⁹ C/m². What is the field near it? (ε₀ = 8.85×10⁻¹²)","c":"500 N/C","w":["1000 N/C","250 N/C","8.85 N/C"],"e":"E = σ/(2ε₀) = 8.85×10⁻⁹/(2 × 8.85×10⁻¹²) = 500 N/C.","h":"σ ÷ 2ε₀. 8.85×10⁻⁹ ÷ 2 × 8.85×10⁻¹² = 500 N/C. Same digits cancel again."},{"q":"How does the field of an infinite uniformly charged sheet depend on distance from the sheet?","c":"It does not depend on distance","w":["It falls as 1/r","It falls as 1/r²","It increases with distance"],"e":"The Gaussian pillbox has area A on each side and the field lines are parallel, so E = σ/2ε₀ at every distance.","h":"Infinite sheet: E is independent of distance. Pillbox has the same flux at any height."},{"q":"A conductor in equilibrium carries surface charge density σ. What is the field just outside its surface?","c":"σ/ε₀","w":["σ/(2ε₀)","2σ/ε₀","Zero"],"e":"The field inside is zero, so only the outward face of the pillbox has flux: EA = σA/ε₀. Do not confuse this with an isolated sheet.","h":"Conductor surface: E = σ/ε₀. Field is zero inside so only one face of the pillbox."},{"q":"A conducting sphere of radius 0.10 m carries 2 nC. What is the field just outside its surface? (k = 9×10⁹)","c":"1800 N/C","w":["180 N/C","18 000 N/C","Zero"],"e":"Outside, it acts like a point charge at its centre: kQ/R² = 9×10⁹ × 2×10⁻⁹/0.01 = 1800 N/C.","h":"Outside a conducting sphere: kQ/R² = 9×10⁹ × 2×10⁻⁹ ÷ 0.01 = 1800 N/C."},{"q":"What is the electric field inside a hollow charged conducting shell (in the empty cavity)?","c":"Zero","w":["Equal to kQ/R²","Uniform but non-zero","Directed towards the centre"],"e":"A Gaussian surface inside the cavity encloses no charge, so E = 0 by symmetry.","h":"Hollow shell cavity: E = 0. Gaussian surface inside encloses no charge."},{"q":"A solid insulating sphere of radius R has uniform charge Q. How does the field inside depend on r?","c":"E = kQr/R³, growing in proportion to r","w":["E = kQ/r², falling with r","E = 0 everywhere inside","E = kQ/R², constant inside"],"e":"Charge enclosed within r is Q(r³/R³). Gauss's law gives E = kQr/R³.","h":"Inside a uniform insulating sphere: E ∝ r (kQr/R³). Linear in r."},{"q":"For the same uniformly charged solid sphere, how does the field at r = R/2 compare with the field at the surface?","c":"It is half the surface field","w":["It is equal to the surface field","It is one quarter of the surface field","It is zero"],"e":"E = kQr/R³ is proportional to r. At r = R/2 it is E_surface/2.","h":"E ∝ r inside, so at R/2 the field is half the surface value."},{"q":"Two large parallel plates carry equal and opposite uniform charge densities ±σ. What is the field between them and outside?","c":"σ/ε₀ between the plates, and zero outside","w":["σ/(2ε₀) between the plates, and σ/(2ε₀) outside","Zero between the plates, and σ/ε₀ outside","σ/ε₀ both between and outside"],"e":"Between the plates, the two σ/2ε₀ fields add. Outside, they cancel.","h":"Parallel plates ±σ: σ/ε₀ between, zero outside. Two σ/2ε₀ fields add between, cancel outside."},{"q":"The net electric flux through a closed surface is zero. Which conclusion is correct?","c":"The net charge enclosed is zero","w":["There are no charges inside the surface","The electric field is zero everywhere on the surface","The surface lies inside a conductor"],"e":"Equal amounts of + and − charge inside can give zero net flux while the field on the surface is not zero.","h":"Net flux zero means net enclosed charge is zero. Equal + and − inside is allowed."},{"q":"What are the SI units of electric flux?","c":"N·m²/C, which is the same as V·m","w":["N/C, which is the same as V/m","N·C/m², which is the same as J/m","C/N·m², which is the same as F/m"],"e":"Flux = E × A = (N/C)(m²). Since E is V/m, flux is also V·m.","h":"N·m²/C = V·m. Both forms are right."}],[{"q":"How is electric potential V defined?","c":"The change in potential energy per unit charge, ΔV = ΔU/q","w":["The force per unit charge at a point, V = F/q","The potential energy multiplied by the charge, V = Uq","The work done per unit distance on a charge, V = W/d"],"e":"Dividing the potential energy by the charge gives a quantity that does not depend on the charge itself. That is the potential, in joules per coulomb.","h":"V = potential energy per unit charge (U/q). Pick 'energy per unit charge'."},{"q":"What is the SI unit of electric potential, and what is 1 electron-volt in joules?","c":"The volt (J/C), and 1 eV = 1.60 × 10⁻¹⁹ J","w":["The volt (J/C), and 1 eV = 1.60 × 10⁻¹⁹ C","The volt (N/C), and 1 eV = 1.60 × 10¹⁹ J","The volt (J·C), and 1 eV = 9.11 × 10⁻³¹ J"],"e":"1 V = 1 J/C. One electron-volt is the energy gained by an electron across 1 V: (1.60 × 10⁻¹⁹ C)(1 V) = 1.60 × 10⁻¹⁹ J.","h":"1 V = 1 J/C. 1 eV = 1.60×10⁻¹⁹ J. Learn the second number."},{"q":"What does it mean that the electrostatic force is conservative?","c":"The work done in moving a charge from one point to another does not depend on the path taken","w":["The work done in moving a charge is always zero, whatever path is taken","The work done in moving a charge is larger along a longer path","The work done in moving a charge depends only on how fast it is moved"],"e":"Because the work is path-independent we can define a potential energy U. Only changes in U matter, so we choose U = 0 at infinity.","h":"Conservative: work between two points does not depend on the path. Pick 'path-independent'."},{"q":"How is the change in potential energy related to the work done by the electric force?","c":"ΔU = −W, so a field doing positive work lowers the potential energy","w":["ΔU = +W, so a field doing positive work raises the potential energy","ΔU = W/q, so the work is shared out among the charges","ΔU = −W², so the potential energy is always negative"],"e":"If the field pushes the charge along its motion, W is positive and the charge loses potential energy (like a ball falling). So ΔU = −W.","h":"ΔU = −W by the field. Field does positive work, U drops."},{"q":"Example 5.1: A uniform field of 1000 N/C points left. Points A and B are on a line at right angles to the field, and C is 4.0 cm to the right of B. What is V_B − V_A?","c":"0 V, since A and B lie on the same equipotential","w":["+40 V, since B is 4.0 cm from C","−40 V, since the field points to the left","+30 V, since A is 3.0 cm from B"],"e":"A and B are on a line at right angles to E, so no distance is covered along the field. So V_B = V_A and the difference is zero.","h":"A and B on a line at right angles to E sit on an equipotential. ΔV = 0."},{"q":"Example 5.1(b): With E = 1000 N/C pointing left, what is V_B − V_C when C is 4.0 cm to the right of B?","c":"−40 V","w":["+40 V","−4.0 V","0 V"],"e":"ΔV = −E·d along the path from C to B. Moving from C to B is along the field (to the left) so the potential drops going that way. ΔV = V_B − V_C = −(1000)(0.040) = −40 V.","h":"ΔV = −E·d. Moving against E raises V. 1000 × 0.04 = 40 V, then fix the sign by direction."},{"q":"Example 5.1(c)–(d): V_C − V_A = +40 V. How much work is done when a charge of 1.6 × 10⁻¹⁹ C moves through this 40 V difference? (The book's printed 1720.7 J is a slip.)","c":"6.4 × 10⁻¹⁸ J","w":["6.4 × 10⁻¹⁷ J","2.5 × 10⁻²¹ J","1.7 × 10³ J"],"e":"W = qΔV = (1.6 × 10⁻¹⁹)(40) = 6.4 × 10⁻¹⁸ J. This equals 40 eV.","h":"W = qΔV = 1.6×10⁻¹⁹ × 40 = 6.4×10⁻¹⁸ J. Multiply, no formula chasing."},{"q":"Example 5.2: The potential difference between the ground and a cloud is 1.2 × 10⁹ V. What is the magnitude of the energy change of an electron moving between them?","c":"1.2 GeV","w":["1.2 MeV","1.2 keV","1.9 × 10⁻¹⁰ GeV"],"e":"ΔU = qΔV = e(1.2 × 10⁹ V) = 1.2 × 10⁹ eV = 1.2 GeV.","h":"Energy in eV = charge in e × volts. 1.2×10⁹ V with one electron = 1.2 GeV. No conversion."},{"q":"How does the potential change as you move with and against the electric field?","c":"Potential falls when moving with the field and rises when moving against it","w":["Potential rises when moving with the field and falls when moving against it","Potential stays the same in either direction, because E is conservative","Potential falls in both directions, because work is always done"],"e":"Moving with E, the field does positive work, so V falls. Moving against E, you do work and V rises. Field points from high to low potential.","h":"Moving with E, V falls. Against E, V rises. Think downhill."},{"q":"What is an equipotential surface?","c":"A set of points where V has the same value, so no work is done moving a charge between them","w":["A set of points where E has the same value, so no force acts on a charge placed there","A set of points where the charge is the same, so no current flows between them","A set of points where V is zero, so no charges can be placed on the surface"],"e":"On an equipotential surface ΔV = 0 so W = qΔV = 0. The value of V is constant, but E need not be.","h":"Equipotential = same V everywhere on it, zero work along it."},{"q":"What is the relation between field lines and equipotential surfaces?","c":"They are perpendicular to each other everywhere","w":["They are parallel to each other everywhere","They are tangent to each other at every point","They meet at 45° at every point"],"e":"If E had a component along the surface, work would be done moving along it, and V would change. So E must be at 90° to the surface.","h":"Field lines ⟂ equipotentials, always. Pick 'perpendicular'."},{"q":"For a uniform field, what do the equipotential surfaces look like?","c":"Parallel planes at right angles to the field lines","w":["Concentric spheres centred on the field","Parallel planes along the field lines","Concentric cylinders around the field lines"],"e":"Uniform field lines are straight, parallel and equally spaced. The surfaces perpendicular to them are flat parallel planes.","h":"Uniform field: equipotentials are parallel planes at right angles to the lines."},{"q":"For equipotential surfaces of a point charge, closely spaced surfaces near the charge mean","c":"The potential changes rapidly with distance there, so the field is strong","w":["The potential changes slowly with distance there, so the field is strong","The potential changes rapidly with distance there, so the field is weak","The potential is constant there, so the field is zero"],"e":"E = −dV/dr. Surfaces drawn at equal ΔV that are crowded together mean V changes quickly, so E is large.","h":"Closely packed equipotentials mean a strong field there (E = −dV/dr). Potential changes rapidly."},{"q":"What is the potential at a distance r from an isolated point charge q (V = 0 at infinity)?","c":"V = q/(4πε₀r)","w":["V = q/(4πε₀r²)","V = qr/(4πε₀)","V = q²/(4πε₀r)"],"e":"Integrating E = q/(4πε₀r²) from infinity to r gives V = q/(4πε₀r). It falls as 1/r, and it is a scalar with sign.","h":"V = kq/r with V = 0 at infinity. Scalar, sign follows q."},{"q":"How do you find the potential at a point due to a group of point charges?","c":"Add the individual potentials as ordinary numbers with their signs","w":["Add the individual potentials as vectors, using their directions","Multiply the individual potentials together and take the root","Use only the largest charge, because the others are small"],"e":"Potential is a scalar so V = Σ qᵢ/(4πε₀rᵢ). Keep the sign of each charge.","h":"Potential is scalar: add as plain numbers with signs. No vectors."},{"q":"Example 5.3: A 2 µC charge is moved 0.02 m against a uniform field of 25 V/m. How much work is done on the charge?","c":"1 × 10⁻⁶ J","w":["1 × 10⁻³ J","5 × 10⁻⁷ J","2.5 × 10⁻⁶ J"],"e":"ΔV = Ed = 25 × 0.02 = 0.5 V. W = qΔV = (2 × 10⁻⁶)(0.5) = 1 × 10⁻⁶ J.","h":"ΔV = Ed = 25 × 0.02 = 0.5 V. W = qΔV = 2×10⁻⁶ × 0.5 = 1×10⁻⁶ J."},{"q":"Example 5.4: Three charges +4.0 µC, +4.0 µC and −4.0 µC are at the corners of an equilateral triangle of side 20 cm. What is the potential at the centre?","c":"About 3.1 × 10⁵ V","w":["About 9.4 × 10⁵ V","About 3.1 × 10⁴ V","About 1.0 × 10⁶ V"],"e":"The centre is r = 20/√3 = 11.5 cm from each corner. V = k(q₁ + q₂ + q₃)/r = (9 × 10⁹)(4 × 10⁻⁶) ÷ 0.1155 ≈ 3.1 × 10⁵ V. The book prints 3.078 × 10⁵ V, which is a rounding slip.","h":"Centre r = 20/√3 = 11.5 cm. V = k(4 + 4 − 4)×10⁻⁶ ÷ 0.115 = 3.1×10⁵ V. Add signed values."},{"q":"Example 5.4: Why can the potentials of the three charges simply be added?","c":"Because potential is a scalar, so only the signs matter and not the directions","w":["Because potential is a vector, so directions cancel at the centre","Because the three charges are the same size, so their effects are equal","Because the distances are equal, so each potential is zero"],"e":"For a scalar quantity there are no directions to consider. Add +, +, − as numbers. For the field at the centre you would need vectors.","h":"Scalar: only the signs matter, no directions to resolve."},{"q":"What is the potential at a point P far from a dipole, at distance r and angle θ from the dipole axis?","c":"V = p cos θ/(4πε₀r²)","w":["V = p sin θ/(4πε₀r²)","V = p cos θ/(4πε₀r)","V = p cos θ/(4πε₀r³)"],"e":"V = V₁ − V₂ = (q/4πε₀)(r₂ − r₁)/(r₁r₂). For r ≫ d, r₂ − r₁ = 2d cos θ and r₁r₂ = r², so V = p cos θ/(4πε₀r²) with p = 2dq.","h":"Dipole far field: V = p cosθ/4πε₀r². Note r², not r³ (that is for E)."},{"q":"For a dipole, what is the potential at all points on the perpendicular bisector (θ = 90°)?","c":"Zero, because cos 90° = 0","w":["Maximum, because sin 90° = 1","Infinite, because the charges are closest there","Equal to the potential of one charge, because the other cancels"],"e":"The point is equally far from +q and −q, so their potentials cancel exactly. V = 0 on the whole bisecting plane.","h":"Bisector θ = 90°: cos 90° = 0, so V = 0. Equal distances from + and −."},{"q":"How is the potential found for a continuous charge distribution?","c":"Add up (integrate) dV = dq/(4πε₀r) over all the small charge elements","w":["Add up (integrate) dV = dq/(4πε₀r²) over all the small charge elements","Multiply the total charge by the potential at its centre","Take the largest dq and ignore the smaller elements"],"e":"Split the charge into small pieces dq = ρ dτ. Each one gives dV = dq/(4πε₀r), and the potential is their sum.","h":"Continuous charge: integrate dq/4πε₀r over the distribution."},{"q":"Problem 5.1: An electron between two large parallel plates 12 cm apart feels a force of 3.9 × 10⁻¹⁵ N. What are the field and the potential difference?","c":"E = 2.4 × 10⁴ N/C and ΔV ≈ 2.9 × 10³ V","w":["E = 2.4 × 10⁴ N/C and ΔV ≈ 2.9 × 10⁵ V","E = 6.2 × 10⁻³⁵ N/C and ΔV ≈ 7.4 × 10⁻³⁶ V","E = 2.4 × 10³ N/C and ΔV ≈ 2.9 × 10² V"],"e":"E = F/e = 3.9 × 10⁻¹⁵ ÷ 1.6 × 10⁻¹⁹ = 2.4 × 10⁴ N/C. ΔV = Ed = (2.4 × 10⁴)(0.12) = 2.9 × 10³ V.","h":"E = F/e = 3.9×10⁻¹⁵ ÷ 1.6×10⁻¹⁹ = 2.4×10⁴. ΔV = E × d = 2.4×10⁴ × 0.12 = 2.9×10³ V."},{"q":"Problem 5.2: An infinite non-conducting sheet has σ = 0.10 µC/m². How far apart are equipotential surfaces whose potentials differ by 50 V?","c":"About 8.8 mm","w":["About 8.8 cm","About 0.88 mm","About 1.1 m"],"e":"E = σ/2ε₀ = 1.0 × 10⁻⁷ ÷ (2 × 8.85 × 10⁻¹²) = 5650 N/C. d = ΔV/E = 50 ÷ 5650 = 8.8 × 10⁻³ m.","h":"d = ΔV ÷ E, with E = σ/2ε₀ = 5.65×10³. 50 ÷ 5.65×10³ = 8.8 mm."},{"q":"Problem 5.3: A hollow metal sphere has a potential of +400 V relative to ground. What is the potential at its centre?","c":"400 V, since the potential inside a conductor equals the surface value","w":["0 V, since the field inside a conductor is zero","200 V, since the centre is half way into the sphere","800 V, since the potential builds up towards the centre"],"e":"Inside a conductor E = 0, so V does not change with position. The centre has the same potential as the surface. E = 0 does not mean V = 0.","h":"Inside a conductor V is constant, equal to the surface. Centre = 400 V."},{"q":"Problem 5.4: Two electrons are fixed 2.0 cm apart. Another electron is shot from infinity and stops midway between them. What is its initial speed?","c":"About 3.2 × 10² m/s","w":["About 3.2 × 10⁴ m/s","About 1.6 × 10² m/s","About 3.2 × 10⁶ m/s"],"e":"At the midpoint (1.0 cm from each), U = 2ke²/0.010 = 4.6 × 10⁻²⁶ J. All the kinetic energy has gone: ½mv² = 4.6 × 10⁻²⁶, so v = √(2 × 4.6 × 10⁻²⁶ ÷ 9.11 × 10⁻³¹) ≈ 3.2 × 10² m/s.","h":"Energy conservation: ½mv² = ke²/(0.01) × 2 ... use K = 2 × ke²/d. Then v = √(2K/m)."},{"q":"Problem 5.5: What is the electric potential energy of two electrons 2.00 nm apart, and what happens to it if they are moved further apart?","c":"1.15 × 10⁻¹⁹ J, and it decreases as they move apart","w":["1.15 × 10⁻¹⁹ J, and it increases as they move apart","1.15 × 10⁻²⁸ J, and it decreases as they move apart","2.30 × 10⁻¹⁹ J, and it increases as they move apart"],"e":"U = ke²/r = (8.99 × 10⁹)(1.6 × 10⁻¹⁹)² ÷ (2.00 × 10⁻⁹) = 1.15 × 10⁻¹⁹ J. The electrons repel, so energy is released as they separate and U falls.","h":"U = ke²/r = 2.3×10⁻²⁸ ÷ 2×10⁻⁹ = 1.15×10⁻¹⁹ J. Moving apart, U decreases (like charges repel)."},{"q":"Problem 5.6: A conducting sphere of radius 0.15 m is at 200 V (with V = 0 at infinity). What are its charge and surface charge density?","c":"q ≈ 3.3 × 10⁻⁹ C and σ ≈ 1.2 × 10⁻⁸ C/m²","w":["q ≈ 3.3 × 10⁻⁹ C and σ ≈ 2.4 × 10⁻⁸ C/m²","q ≈ 3.0 × 10⁻¹¹ C and σ ≈ 1.2 × 10⁻⁸ C/m²","q ≈ 1.3 × 10⁻⁷ C and σ ≈ 4.7 × 10⁻⁷ C/m²"],"e":"V = kq/R gives q = VR/k = (200)(0.15) ÷ 8.99 × 10⁹ = 3.3 × 10⁻⁹ C. σ = q/4πR² = 3.3 × 10⁻⁹ ÷ 0.283 = 1.2 × 10⁻⁸ C/m².","h":"V = kq/R gives q = VR/k = 200 × 0.15 ÷ 9×10⁹ = 3.3×10⁻⁹ C. Then σ = q/4πR²."},{"q":"Problem 5.7: In an xy plane V = (2.0 V/m²)x² − (3.0 V/m²)y². What are the magnitude and direction of E at (3.0 m, 2.0 m)?","c":"17 V/m, at 135° from the +x axis","w":["17 V/m, at 45° from the +x axis","12 V/m, at 135° from the +x axis","24 V/m, at 45° from the +x axis"],"e":"E = −∇V. Eₓ = −∂V/∂x = −4x = −12 V/m. E_y = −∂V/∂y = +6y = +12 V/m. Magnitude = √(12² + 12²) = 17 V/m. The vector points up and to the left, so the angle is 135°.","h":"E = −∇V: Eₓ = −4x, E_y = +6y. At (3, 2): (−12, +12). Magnitude 17, angle 135°."},{"q":"Problem 5.8: Four charges +q, −q, −q, +q sit at the corners of a square of side a, with equal charges on a diagonal. What is the work needed to assemble them from far away?","c":"W = −(4 − √2)kq²/a ≈ −2.59 kq²/a","w":["W = +(4 − √2)kq²/a ≈ +2.59 kq²/a","W = −4kq²/a, since the diagonals are left out","W = −(4 + √2)kq²/a ≈ −5.41 kq²/a"],"e":"Add the energy of the six pairs. Four sides are unlike pairs: 4(−kq²/a). Two diagonals are like pairs: 2(+kq²/√2a) = +√2kq²/a. Total = −(4 − √2)kq²/a. Negative means the charges pull themselves together.","h":"Add pair energies with signs: sides negative (−4kq²/a), diagonals positive. W = −(4 − √2)kq²/a."},{"q":"Problem 5.9(a): Two tiny spheres each carry 5.00 µC and are joined by a string 1.00 m long. What is the electric potential energy of the system?","c":"About 0.225 J","w":["About 0.225 × 10⁻³ J","About 2.25 J","About 0.45 J"],"e":"U = kq₁q₂/d = (8.99 × 10⁹)(5.00 × 10⁻⁶)² ÷ 1.00 = 0.225 J.","h":"U = kq²/d = 9×10⁹ × 25×10⁻¹² ÷ 1 = 0.225 J. Same charges on both."},{"q":"Problem 5.9(b): The 5.00 g sphere A and 10.0 g sphere B in the same set-up (5.00 µC each, 1.00 m apart) are released when the string is cut. What are their accelerations at that instant?","c":"a_A ≈ 45 m/s² and a_B ≈ 22 m/s²","w":["a_A ≈ 22 m/s² and a_B ≈ 45 m/s²","a_A ≈ 45 m/s² and a_B ≈ 45 m/s²","a_A ≈ 0.22 m/s² and a_B ≈ 0.11 m/s²"],"e":"F = kq²/d² = 0.225 N on each. a = F/m: a_A = 0.225 ÷ 0.00500 = 45 m/s² and a_B = 0.225 ÷ 0.0100 = 22 m/s². The lighter sphere accelerates more.","h":"a = F/m. F = 0.225 N. a_A = 0.225 ÷ 0.005 = 45, a_B = 0.225 ÷ 0.01 = 22.5. Lighter one accelerates more."},{"q":"Problem 5.9(c): A long time after the string is cut, what are the speeds of A (5.00 g) and B (10.0 g)?","c":"v_A ≈ 7.75 m/s and v_B ≈ 3.87 m/s","w":["v_A ≈ 3.87 m/s and v_B ≈ 7.75 m/s","v_A ≈ 5.48 m/s and v_B ≈ 5.48 m/s","v_A ≈ 15.5 m/s and v_B ≈ 7.75 m/s"],"e":"Momentum is conserved: m_A v_A = m_B v_B, so v_A = 2v_B. Energy: ½m_A v_A² + ½m_B v_B² = 0.225 J. So 0.0025(4v_B²) + 0.005v_B² = 0.015v_B² = 0.225, giving v_B = 3.87 m/s and v_A = 7.75 m/s.","h":"Momentum conserved: m_A v_A = m_B v_B, so v_A = 2 v_B. Energy gives U = ½m_A v_A² + ½m_B v_B²."},{"q":"Problem 5.10: A charge q is spread uniformly through a sphere of radius R. Taking V = 0 at infinity, what is V at distance r < R from the centre?","c":"V = q(3R² − r²)/(8πε₀R³)","w":["V = q(3R² + r²)/(8πε₀R³)","V = q/(4πε₀r)","V = q(R² − r²)/(8πε₀R³)"],"e":"Outside, V = q/4πε₀r. Inside, E = qr/4πε₀R³. Integrate E from the surface to r and add the surface value q/4πε₀R. The result is q(3R² − r²)/8πε₀R³.","h":"Inside uniform sphere: V = q(3R² − r²)/8πε₀R³. Outside V = q/4πε₀r."},{"q":"Problem 5.10(b): For the uniformly charged sphere, what is the potential difference between the centre and the surface?","c":"V(0) − V(R) = q/(8πε₀R), with the centre higher","w":["V(0) − V(R) = q/(4πε₀R), with the centre higher","V(0) − V(R) = q/(8πε₀R), with the surface higher","V(0) − V(R) = 0, since the field is zero at the centre"],"e":"At the centre V(0) = 3q/(8πε₀R). At the surface V(R) = q/(4πε₀R) = 2q/(8πε₀R). The difference is q/(8πε₀R), and the centre is higher for a positive charge.","h":"V(0) − V(R) = q/8πε₀R. Centre is higher than the surface (for positive q)."},{"q":"What is the electric potential at 0.30 m from a point charge of 3 nC? (k = 9×10⁹)","c":"90 V","w":["300 V","270 V","30 V"],"e":"V = kq/r = 9×10⁹ × 3×10⁻⁹/0.30 = 90 V.","h":"V = 9×10⁹ × 3×10⁻⁹ ÷ 0.3 = 27 ÷ 0.3 = 90 V. 9 × 3 = 27 and the powers cancel."},{"q":"Which statement about electric potential and electric field is correct?","c":"Potential is a scalar and the field is a vector","w":["Both are vectors","Potential is a vector and the field is a scalar","Both are scalars"],"e":"Potentials from several charges add as plain numbers (with signs). Fields add as vectors.","h":"Potential = scalar, field = vector. Pick the pair."},{"q":"What work is done in moving a 2 μC charge through a potential difference of 50 V?","c":"1×10⁻⁴ J","w":["1×10⁻⁷ J","25 J","1×10⁻¹ J"],"e":"W = qΔV = 2×10⁻⁶ × 50 = 1×10⁻⁴ J.","h":"W = qΔV = 2×10⁻⁶ × 50 = 10⁻⁴ J. Multiply the numbers, fix the power."},{"q":"How many joules is one electron-volt?","c":"1.6×10⁻¹⁹ J","w":["1.6×10⁻¹⁹ W","9.1×10⁻³¹ J","6.25×10¹⁸ J"],"e":"1 eV is the energy gained by one electron through 1 V: e × 1 V = 1.6×10⁻¹⁹ J.","h":"1 eV = 1.6×10⁻¹⁹ J. Memorise."},{"q":"An electron is accelerated from rest through 200 V. What is its final speed? (e = 1.6×10⁻¹⁹ C, m = 9.1×10⁻³¹ kg)","c":"About 8.4×10⁶ m/s","w":["About 8.4×10⁴ m/s","About 7.0×10¹³ m/s","About 2.1×10⁷ m/s"],"e":"½mv² = eV, so v = √(2 × 1.6×10⁻¹⁹ × 200/9.1×10⁻³¹) = 8.4×10⁶ m/s.","h":"½mv² = eV. v = √(2eV/m) = √(2×1.6×10⁻¹⁹×200 ÷ 9.1×10⁻³¹) ≈ 8.4×10⁶ m/s. Use 5.9×10⁵√V."},{"q":"A +1 μC charge and a −1 μC charge sit 0.20 m apart. What is the potential at the midpoint?","c":"Zero","w":["1.8×10⁵ V","9×10⁴ V","−1.8×10⁵ V"],"e":"Each is 0.10 m away. The potentials are +9×10⁴ and −9×10⁴ V and they cancel. The field there is not zero.","h":"Equal and opposite charges, midpoint: V = 0. Plus and minus cancel."},{"q":"Two +1 μC charges are 0.20 m apart. What is the potential at the midpoint? (k = 9×10⁹)","c":"1.8×10⁵ V","w":["9×10⁴ V","Zero","3.6×10⁵ V"],"e":"Each gives 9×10⁹ × 10⁻⁶/0.10 = 9×10⁴ V. They add: 1.8×10⁵ V. The field there is zero.","h":"Same sign at the midpoint: potentials add. 2 × 9×10⁴ = 1.8×10⁵ V."},{"q":"What is the relationship between equipotential surfaces and field lines?","c":"They are always perpendicular to each other","w":["They are always parallel to each other","They are at 45° to each other","They are unrelated"],"e":"If the field had a component along the surface, work would be done moving along it, so the potential would not be constant.","h":"Equipotentials are always ⟂ to field lines."},{"q":"How much work is done moving a charge along an equipotential surface?","c":"Zero","w":["qE × distance","qV where V is the potential of the surface","It depends on the path"],"e":"There is no potential difference between two points on the surface, so W = qΔV = 0.","h":"Along an equipotential, ΔV = 0, so work = 0."},{"q":"In a uniform field of 500 V/m, what is the potential difference between two points 0.04 m apart along the field?","c":"20 V","w":["12 500 V","0.08 V","2 V"],"e":"ΔV = Ed = 500 × 0.04 = 20 V.","h":"ΔV = Ed = 500 × 0.04 = 20 V."},{"q":"What is the potential energy of 2 μC and 3 μC charges 0.30 m apart? (k = 9×10⁹)","c":"0.18 J","w":["0.60 J","0.054 J","1.8 J"],"e":"U = kq₁q₂/r = 9×10⁹ × 6×10⁻¹² / 0.30 = 0.18 J.","h":"U = kq₁q₂/r = 9×10⁹ × 6×10⁻¹² ÷ 0.3 = 0.18 J. 9 × 6 ÷ 3 = 18, fix powers."},{"q":"What is the sign of the potential energy of two opposite charges?","c":"Negative, because work must be done to separate them","w":["Positive, because they attract","Zero, since they cancel","It depends on the sign of the test charge"],"e":"U = kq₁q₂/r. With q₁q₂ < 0, U is negative. You must supply energy to pull them apart to U = 0.","h":"Opposite charges: U negative (bound, work needed to separate). q₁q₂ < 0."},{"q":"Three charges of +1 μC each sit at the corners of an equilateral triangle of side 0.10 m. What is the total potential energy? (k = 9×10⁹)","c":"0.27 J","w":["0.09 J","0.81 J","0.054 J"],"e":"There are three pairs, each at 0.10 m: 3 × 9×10⁹ × 10⁻¹²/0.10 = 0.27 J.","h":"Three pairs, not three charges: 3 × kq²/r = 3 × 9×10⁹ × 10⁻¹² ÷ 0.1 = 0.27 J."},{"q":"What is the potential inside a charged conductor in equilibrium?","c":"Constant and equal to the surface potential","w":["Zero","Rising from the centre to the surface","Falling from the centre to the surface"],"e":"E = 0 inside, so there is no potential difference between any two interior points. V is the same as at the surface.","h":"Inside a conductor: V constant, equal to the surface value. E = 0."},{"q":"In which region can the field be zero while the potential is not zero?","c":"Inside a charged conducting sphere","w":["Outside a charged conducting sphere","At the surface of a conducting sphere","At a point 1 m from a point charge"],"e":"Inside a conductor E = 0, but the potential equals the surface value, kQ/R.","h":"E = 0 inside a charged conductor but V ≠ 0. Equal to the surface value."},{"q":"A positive charge moves from a high-potential point to a low-potential point under the field alone. What happens to its energy?","c":"Its potential energy falls and its kinetic energy rises","w":["Its potential energy rises and its kinetic energy falls","Both its potential and kinetic energies fall","Both stay the same"],"e":"The field does positive work on a positive charge moving along E. Energy changes from potential to kinetic.","h":"Positive charge goes from high V to low V: U falls, K rises. Total energy stays."},{"q":"The radius of a charged conducting sphere is doubled while its charge stays the same. What happens to its surface potential?","c":"It halves","w":["It doubles","It quarters","It stays the same"],"e":"V = kQ/R. Doubling R halves V.","h":"V = kQ/R. Double R → V halves."},{"q":"What is the potential on the perpendicular bisector of an electric dipole?","c":"Zero","w":["kp/r²","2kp/r²","kp/r"],"e":"Every point on the bisector is equally far from +q and −q, so their potentials cancel.","h":"Perpendicular bisector of a dipole: V = 0."},{"q":"A 4 nC and a −2 nC charge are each 0.20 m from a point P. What is the potential at P? (k = 9×10⁹)","c":"90 V","w":["270 V","−90 V","180 V"],"e":"V = 9×10⁹(4×10⁻⁹)/0.2 + 9×10⁹(−2×10⁻⁹)/0.2 = 180 − 90 = 90 V.","h":"V = 9×10⁹ × (4 − 2)×10⁻⁹ ÷ 0.2 = 18 ÷ 0.2 = 90 V. Add the charges first, since both are at 0.2 m."},{"q":"Which expression is correct for the electric field in terms of the potential V?","c":"E = −dV/dx, so E points in the direction of decreasing potential","w":["E = +dV/dx, so E points in the direction of increasing potential","E = V/x², so E is always positive","E = −V dx, so E has units of J·m"],"e":"The field is the negative gradient of potential. It points downhill in V.","h":"E = −dV/dx. The field points toward decreasing V."},{"q":"Which of these is the SI unit of potential written in base-type units?","c":"J/C","w":["C/J","N/C","J·C"],"e":"V = W/q, so 1 volt = 1 joule per coulomb. Also N·m/C.","h":"V = J/C. Also N·m/C. Pick J/C."}],[{"q":"What carries electric charge in metals, in liquids, and in semiconductors?","c":"Metals: electrons. Liquids: positive and negative ions. Semiconductors: electrons and holes","w":["Metals: ions. Liquids: electrons. Semiconductors: protons and electrons","Metals: electrons and holes. Liquids: electrons. Semiconductors: positive and negative ions","Metals: electrons. Liquids: electrons and holes. Semiconductors: positive and negative ions"],"e":"Metals have free electrons. Electrolytes (liquids) conduct through ions. Gases conduct through electrons and ions. Semiconductors conduct through electrons (−) and holes (+).","h":"Metals: electrons. Liquids: positive and negative ions. Semiconductors: electrons and holes. Pick the option with all three."},{"q":"Which statement correctly classifies materials?","c":"Conductors conduct well, semiconductors (silicon, germanium) are in between, and insulators resist current because of a wide energy gap","w":["Conductors resist current because of a wide gap, semiconductors (copper, silver) conduct best, and insulators are in between","Conductors and insulators both conduct well, while semiconductors (silicon, germanium) do not conduct at all","Conductors have a wide energy gap, semiconductors have overlapping bands, and insulators have no gap at all"],"e":"Conductors have overlapping bands and conduct well. Semiconductors have a smaller gap and their conductivity can be changed by doping. Insulators have a wide gap, so they block current.","h":"Conductors conduct well, semiconductors (Si, Ge) sit between, insulators barely conduct. Order by conduction."},{"q":"What is electric current and what is its SI unit?","c":"The rate of flow of charge, I = dq/dt, measured in amperes (coulombs per second)","w":["The total amount of charge in a wire, I = q, measured in coulombs","The rate of flow of energy, I = dW/dt, measured in joules per second","The potential difference per unit charge, I = V/q, measured in volts"],"e":"I = q/t. One ampere is one coulomb passing a point each second. q = It, or q = ∫ I dt when the current changes.","h":"I = dq/dt, unit ampere (C/s). Pick 'rate of flow of charge'."},{"q":"What is the difference between AC and DC?","c":"In AC the charge flow reverses direction periodically, while in DC it flows in one direction only","w":["In AC the charge flows in one direction only, while in DC it reverses direction periodically","In AC the voltage is constant, while in DC the voltage follows a sine wave","In AC the current flows only in liquids, while in DC it flows only in metals"],"e":"AC (mains, usually a sine wave) reverses direction. DC (battery, solar cell, dynamo) is unidirectional with roughly constant voltage.","h":"AC reverses direction periodically (mains). DC flows one way (battery)."},{"q":"State Ohm's law, including its condition.","c":"The current in a wire is proportional to the potential difference across it, V = IR, provided temperature stays constant","w":["The current in a wire is inversely proportional to the potential difference, V = R/I, at any temperature","The current in a wire is proportional to the potential difference, V = IR, whatever the temperature","The current in a wire is proportional to its resistance, I = VR, provided the voltage stays constant"],"e":"V ∝ I at constant temperature, so a graph of V against I is a straight line with slope R. The wire must also not be under tension.","h":"Ohm's law: V ∝ I at constant temperature. Graph V against I is a straight line."},{"q":"How must an ammeter and a voltmeter be connected to measure the current and potential difference across a component?","c":"Ammeter in series, voltmeter in parallel","w":["Ammeter in parallel, voltmeter in series","Both in series with the component","Both in parallel with the component"],"e":"An ammeter must carry the same current as the component, so it goes in series. A voltmeter measures the potential difference across the component, so it goes in parallel.","h":"Ammeter in series, voltmeter in parallel. Ammeter low resistance, voltmeter high."},{"q":"Which of these does the resistance of a wire depend on?","c":"Length, cross-sectional area, temperature and the material","w":["Length, current, voltage and the material","Cross-sectional area, current, charge and the colour","Length, temperature and voltage, but not the material"],"e":"R = ρL/A. So it depends on L, A, the material through ρ, and temperature. It does not depend on the current or the voltage applied.","h":"R = ρL/A. Depends on length, area, temperature and material. Not on the voltage or current."},{"q":"If the length of a wire is doubled and its cross-sectional area is also doubled, what happens to its resistance?","c":"It stays the same, since R = ρL/A and the factor 2 cancels","w":["It becomes four times larger","It becomes half as large","It becomes twice as large"],"e":"R = ρL/A. Replace L with 2L and A with 2A, and R = ρ(2L)/(2A) = ρL/A. No change.","h":"L and A both doubled: R = ρ(2L)/(2A) = same. Both factors cancel."},{"q":"What is the SI unit of resistivity ρ, and how is it related to conductivity σ?","c":"Ω·m, and ρ = 1/σ","w":["Ω/m, and ρ = σ","Ω·m, and ρ = σ²","Ω, and ρ = 1/σ²"],"e":"From R = ρL/A, ρ = RA/L, so the unit is Ω·m²/m = Ω·m. Conductivity is the reciprocal, with unit (Ω·m)⁻¹.","h":"ρ unit = Ω·m. ρ = 1/σ."},{"q":"How does the resistance of a metal normally change as temperature rises?","c":"It increases, following R = R₀[1 + α(T − T₀)]","w":["It decreases, following R = R₀[1 − α(T − T₀)]","It stays constant, following R = R₀ at all temperatures","It increases then falls to zero, following R = R₀/(T − T₀)"],"e":"Atoms vibrate more at higher temperature and scatter electrons more. So resistance grows. A superconductor is the special case, with almost zero resistance at very low temperature.","h":"Metal heats up, ions vibrate more, resistance rises. R = R₀[1 + α(T − T₀)]."},{"q":"Example 6.1: A copper wire of length 160 m and diameter 1.0 mm (ρ = 1.72 × 10⁻⁸ Ω·m) is connected to a 1.5 V battery. What is its resistance and the current?","c":"R ≈ 3.50 Ω and I ≈ 0.43 A","w":["R ≈ 3.50 Ω and I ≈ 5.3 A","R ≈ 14.0 Ω and I ≈ 0.11 A","R ≈ 0.88 Ω and I ≈ 1.7 A"],"e":"A = π(0.5 × 10⁻³)² = 7.85 × 10⁻⁷ m². R = ρL/A = (1.72 × 10⁻⁸)(160) ÷ 7.85 × 10⁻⁷ = 3.50 Ω. I = V/R = 1.5/3.50 = 0.43 A.","h":"A = πd²/4 = 7.85×10⁻⁷. R = ρL/A = 1.72×10⁻⁸ × 160 ÷ 7.85×10⁻⁷ = 3.5 Ω. I = 1.5/3.5 = 0.43 A."},{"q":"How do you find the equivalent resistance of resistors in series and in parallel?","c":"Series: add them. Parallel: add the reciprocals, then take the reciprocal","w":["Series: add the reciprocals. Parallel: add the values directly","Series: multiply them. Parallel: add the values directly","Series: add them. Parallel: multiply them together"],"e":"Series: R = R₁ + R₂ + R₃. Parallel: 1/R = 1/R₁ + 1/R₂ + 1/R₃. Parallel resistance is always smaller than the smallest resistor.","h":"Series: add. Parallel: add reciprocals. Quick pair: product ÷ sum."},{"q":"Which quantity is the same in a series circuit, and which is the same in a parallel circuit?","c":"Series: the same current. Parallel: the same voltage","w":["Series: the same voltage. Parallel: the same current","Series: the same resistance. Parallel: the same power","Series: the same current. Parallel: the same current"],"e":"In series there is only one path, so the current is the same everywhere. In parallel all branches are connected across the same two points, so each has the same potential difference.","h":"Series: same current. Parallel: same voltage. Current shares in parallel."},{"q":"Example 6.2: Three resistors of 8 Ω, 8 Ω and 4 Ω are in series with a 10 V source. What is the current through each?","c":"0.5 A in each resistor","w":["1.0 A in each resistor","0.5 A in the 4 Ω and 0.25 A in each 8 Ω","5.0 A in each resistor"],"e":"R = 8 + 8 + 4 = 20 Ω. I = V/R = 10/20 = 0.5 A. In series the current is the same through every resistor.","h":"R = 8 + 8 + 4 = 20 Ω. I = 10 ÷ 20 = 0.5 A, same in all."},{"q":"Example 6.3: The same 8 Ω, 8 Ω and 4 Ω resistors are in parallel across a 10 V source. What are the equivalent resistance and the total current?","c":"R = 2 Ω and I = 5 A","w":["R = 20 Ω and I = 0.5 A","R = 2 Ω and I = 0.2 A","R = 0.5 Ω and I = 20 A"],"e":"1/R = 1/8 + 1/8 + 1/4 = 4/8 = 1/2, so R = 2 Ω. I = 10/2 = 5 A.","h":"1/R = 1/8 + 1/8 + 1/4 = 1/2, R = 2 Ω, I = 10 ÷ 2 = 5 A."},{"q":"Example 6.3 (continued): What are the individual currents in the 8 Ω, 8 Ω and 4 Ω resistors with 10 V across each?","c":"1.25 A, 1.25 A and 2.5 A","w":["2.5 A, 2.5 A and 1.25 A","1.25 A, 1.25 A and 1.25 A","5 A, 5 A and 5 A"],"e":"I = V/R with V = 10 V for each branch: 10/8 = 1.25 A, 10/8 = 1.25 A, 10/4 = 2.5 A. They add up to the 5 A total.","h":"Same 10 V across each. 10/8, 10/8, 10/4 = 1.25, 1.25, 2.5 A. They add to 5 A."},{"q":"Example 6.4: A 25 V source is connected to R₁ = 38 Ω in series with R₂ = 20 Ω and R₃ = 30 Ω in parallel. What is the current I from the source?","c":"0.5 A","w":["0.33 A","1.25 A","0.66 A"],"e":"R₂ and R₃ in parallel: (20 × 30)/(20 + 30) = 12 Ω. Total R = 38 + 12 = 50 Ω. I = 25/50 = 0.5 A.","h":"R₂ ∥ R₃ = (20×30)/50 = 12 Ω. Total R = 38 + 12 = 50 Ω. I = 25/50 = 0.5 A."},{"q":"Example 6.4 (continued): What are the currents through R₂ = 20 Ω and R₃ = 30 Ω?","c":"0.3 A through R₂ and 0.2 A through R₃","w":["0.2 A through R₂ and 0.3 A through R₃","0.25 A through each","0.5 A through each"],"e":"Voltage across the parallel part = I × 12 = 0.5 × 12 = 6 V. I₂ = 6/20 = 0.3 A and I₃ = 6/30 = 0.2 A. They add up to 0.5 A.","h":"V across parallel = 0.5 × 12 = 6 V. I₂ = 6/20 = 0.3, I₃ = 6/30 = 0.2 A. They add to 0.5."},{"q":"Example 6.5: Three cells of emf 3 V and internal resistance 0.6 Ω each are connected in parallel. What is the effective internal resistance?","c":"0.2 Ω","w":["1.8 Ω","0.6 Ω","0.9 Ω"],"e":"1/r = 1/0.6 + 1/0.6 + 1/0.6 = 5, so r = 0.2 Ω. For n identical cells in parallel, r_eff = r/n = 0.6/3 = 0.2 Ω.","h":"n identical cells in parallel: r/n = 0.6/3 = 0.2 Ω. EMF stays 3 V."},{"q":"Example 6.6: Resistors of 4 Ω, 4 Ω and 2 Ω are in parallel across a 12 V battery. What is the total current and the current in the 2 Ω resistor?","c":"Total current 12 A, and 6 A in the 2 Ω resistor","w":["Total current 12 A, and 3 A in the 2 Ω resistor","Total current 3 A, and 6 A in the 2 Ω resistor","Total current 6 A, and 12 A in the 2 Ω resistor"],"e":"1/R = 1/4 + 1/4 + 1/2 = 1, so R = 1 Ω and I = 12/1 = 12 A. The 2 Ω gets 12/2 = 6 A. The 4 Ω resistors get 3 A each.","h":"1/R = 1/4 + 1/4 + 1/2 = 1, R = 1 Ω, I = 12 A. 2 Ω branch: 12/2 = 6 A."},{"q":"Which formulas give electric power?","c":"P = IV = I²R = V²/R","w":["P = IV = IR² = V/R²","P = I/V = I²R = R/V²","P = IV = V/I = I²/R"],"e":"P = work per second = IV. With V = IR you get P = I²R, and with I = V/R you get P = V²/R. The unit is the watt (J/s).","h":"P = IV = I²R = V²/R. Pick the form that uses the quantities you were given."},{"q":"What does Joule's law of heating state?","c":"The heat produced is H = I²Rt, proportional to I², R and t","w":["The heat produced is H = IR²t, proportional to I, R² and t","The heat produced is H = I²R/t, proportional to I², R and 1/t","The heat produced is H = IRt, proportional to I, R and t only"],"e":"H = I²Rt. The current is squared, so doubling the current gives four times the heat.","h":"Joule heating H = I²Rt. Current squared: double I → four times heat."},{"q":"How many joules are there in 1 kilowatt-hour?","c":"3.6 × 10⁶ J","w":["3.6 × 10³ J","1.0 × 10⁶ J","6.0 × 10⁴ J"],"e":"1 kW·h = 1000 W × 3600 s = 3.6 × 10⁶ J. Electricity companies bill in kW·h, which is energy, not power.","h":"1 kWh = 1000 W × 3600 s = 3.6×10⁶ J. Memorise 3.6 million."},{"q":"Example 6.7: A 100 W bulb runs two hours each day, and energy costs 0.10 per kW·h. What is the cost to run it for a month (30 days)?","c":"0.60 (that is 0.1 kW × 60 h × 0.10)","w":["6.00 (that is 100 kW × 60 h × 0.001)","0.06 (that is 0.1 kW × 6 h × 0.10)","1.20 (that is 0.1 kW × 120 h × 0.10)"],"e":"Power = 0.1 kW. Time = 2 h × 30 days = 60 h. Energy = 6 kW·h. Cost = 6 × 0.10 = 0.60.","h":"0.1 kW × 60 h × 0.10 = 0.60. Convert watts to kW first."},{"q":"Problem 6.1: Three 2.00 Ω resistors are connected in parallel across a 5 V battery. What is the equivalent resistance and the current from the battery? (The book says 'four' but lists three.)","c":"R = 0.667 Ω and I = 7.5 A","w":["R = 6.00 Ω and I = 0.83 A","R = 0.667 Ω and I = 3.3 A","R = 2.00 Ω and I = 2.5 A"],"e":"1/R = 3/2, so R = 2/3 = 0.667 Ω. I = V/R = 5/0.667 = 7.5 A. If there were four 2 Ω resistors it would be R = 0.5 Ω and I = 10 A.","h":"1/R = 3/2, R = 0.667 Ω. I = 5 ÷ 0.667 = 7.5 A. Identical resistors in parallel: R ÷ n."},{"q":"Problem 6.3: A 75 V source is connected across R₁ = 50 Ω in parallel with a branch of R₂ = 35 Ω in series with R₃ = 40 Ω. What is the total current I?","c":"2.5 A","w":["1.5 A","1.0 A","3.5 A"],"e":"The series branch is 35 + 40 = 75 Ω. Equivalent: (50 × 75)/(50 + 75) = 30 Ω. I = 75/30 = 2.5 A. Check: 75/50 = 1.5 A plus 75/75 = 1.0 A gives 2.5 A.","h":"Series branch 35 + 40 = 75 Ω. Both branches see 75 V: I = 75/50 + 75/75 = 1.5 + 1 = 2.5 A."},{"q":"Problem 6.4: A 9.0 V accumulator with negligible internal resistance is connected to a 5 Ω resistor in series with a parallel combination of 5 Ω and 20 Ω. What is the total current?","c":"1.0 A","w":["0.75 A","1.8 A","0.36 A"],"e":"Parallel part: (5 × 20)/(5 + 20) = 4 Ω. Total = 5 + 4 = 9 Ω. I = 9.0/9 = 1.0 A.","h":"(5×20)/25 = 4 Ω. Total 5 + 4 = 9 Ω. I = 9/9 = 1.0 A."},{"q":"Problem 6.5(i): Find the resistance of a wire of length 20 m and cross-sectional area 8 × 10⁻⁶ m², with resistivity 4 × 10⁻⁷ Ω·m.","c":"1000 Ω","w":["100 Ω","0.001 Ω","10 000 Ω"],"e":"R = ρL/A = (4 × 10⁻⁷)(20) ÷ (8 × 10⁻⁶) = 8 × 10⁻⁶ ÷ 8 × 10⁻⁶ × 10³ = 1000 Ω. The value of π is not needed here.","h":"R = ρL/A = 4×10⁻⁷ × 20 ÷ 8×10⁻⁶ = 1000 Ω. Powers: −7 − (−6) = −1, 4 × 20 ÷ 8 = 10, 10 × 10² = 1000."},{"q":"Problem 6.5(ii): A wire of area 2π × 10⁻⁸ m² and resistivity 1.1 × 10⁻⁶ Ω·m has resistance 21 Ω (take π = 22/7). What is its length and its conductivity?","c":"L = 1.2 m and σ ≈ 9.1 × 10⁵ (Ω·m)⁻¹","w":["L = 1.2 m and σ ≈ 1.1 × 10⁻⁶ (Ω·m)⁻¹","L = 12 m and σ ≈ 9.1 × 10⁵ (Ω·m)⁻¹","L = 0.12 m and σ ≈ 9.1 × 10⁻⁵ (Ω·m)⁻¹"],"e":"L = RA/ρ = 21 × (2 × 22/7 × 10⁻⁸) ÷ 1.1 × 10⁻⁶ = 1.2 m. σ = 1/ρ = 1/(1.1 × 10⁻⁶) = 9.1 × 10⁵ (Ω·m)⁻¹.","h":"L = RA/ρ = 21 × 2π×10⁻⁸ ÷ 1.1×10⁻⁶. π = 22/7 simplifies: L = 1.2 m. σ = 1/ρ."},{"q":"Problem 6.6: A fan draws 0.75 A from a 240 V supply. If electricity costs 0.50 per kW·h, what does it cost to use the fan for 10 hours?","c":"0.90","w":["9.00","0.09","1.80"],"e":"P = IV = 0.75 × 240 = 180 W = 0.18 kW. Energy = 0.18 × 10 = 1.8 kW·h. Cost = 1.8 × 0.50 = 0.90.","h":"P = IV = 0.75 × 240 = 180 W = 0.18 kW. Then multiply by hours and cost."},{"q":"Problem 6.7: The maximum power a 100 Ω resistor can dissipate is 8 W. What is the largest voltage that can be put across it?","c":"About 28 V","w":["About 800 V","About 2.8 V","About 0.28 V"],"e":"P = V²/R, so V = √(PR) = √(8 × 100) = √800 = 28.3 V.","h":"V = √(PR) = √(8 × 100) = √800 ≈ 28 V. Use P = V²/R."},{"q":"Problem 6.8: A current is I = I₀ sin ωt with f = 10 Hz and peak current 5 A. What are the current and the charge that has passed (starting from t = 0) at t = 5 s?","c":"Both are zero, because ωt = 100π, a whole number of cycles","w":["The current is 5 A and the charge is 0.08 C","The current is 0 A and the charge is 0.08 C","The current is 5 A and the charge is zero"],"e":"ω = 2πf = 20π rad/s, so ωt = 20π × 5 = 100π. sin(100π) = 0, so I = 0. The charge is q = (I₀/ω)(1 − cos ωt) = (5/62.8)(1 − 1) = 0, since cos(100π) = 1.","h":"ωt = 2πft = 2π × 10 × 5 = 100π: a whole number of cycles. sin = 0, so I = 0 and charge = 0."},{"q":"Problem 6.9: What is the difference between electrical power and electrical energy?","c":"Power is the rate of doing electrical work (watts), while energy is the total work done (joules or kW·h)","w":["Power is the total work done (joules), while energy is the rate of doing electrical work (watts)","Power is measured in kW·h, while energy is measured in watts","Power and energy are the same thing, measured in joules per second"],"e":"Power = energy ÷ time. A 100 W bulb uses energy at the rate of 100 J every second. Over an hour, it has used 0.1 kW·h of energy.","h":"Power = rate (watts). Energy = power × time (joules or kWh). Different quantities."},{"q":"Problem 6.10: A 24 V source drives a resistor R in series with a parallel pair of 100 Ω and a 600 Ω voltmeter. The voltmeter reads 10 V. What is R?","c":"About 120 Ω","w":["About 14 Ω","About 206 Ω","About 86 Ω"],"e":"Parallel part: (100 × 600)/700 = 85.7 Ω. Current = 10/85.7 = 0.117 A. Total R = 24/0.117 = 205.7 Ω, so R = 205.7 − 85.7 = 120 Ω.","h":"Parallel part: 100 ∥ 600 = 85.7 Ω. Series R = 24/I − 85.7 ≈ 120 Ω."},{"q":"Problem 6.10 (continued): For the same circuit, what is the total power dissipated?","c":"About 2.8 W","w":["About 24 W","About 0.28 W","About 1.2 W"],"e":"I = 0.1167 A and the supply is 24 V. P = IV = 0.1167 × 24 = 2.8 W. Check with I²R_total: (0.1167)² × 205.7 = 2.8 W.","h":"P = IV = 0.1167 × 24 = 2.8 W. Total current × source voltage."},{"q":"A charge of 120 C flows past a point in one minute. What is the current?","c":"2 A","w":["120 A","7200 A","0.5 A"],"e":"I = Q/t = 120/60 = 2 A. Time must be in seconds.","h":"I = Q/t with t in seconds. 120/60 = 2 A. A minute is 60 s."},{"q":"A resistor draws 0.5 A when connected across 12 V. What is its resistance?","c":"24 Ω","w":["6 Ω","0.042 Ω","60 Ω"],"e":"R = V/I = 12/0.5 = 24 Ω.","h":"R = V/I = 12 ÷ 0.5 = 24 Ω. Divide by 0.5 = multiply by 2."},{"q":"A wire's length is doubled with the same material and cross-section. What happens to its resistance?","c":"It doubles","w":["It halves","It quadruples","It stays the same"],"e":"R = ρL/A. R is proportional to L.","h":"R ∝ L. Doubles with the length."},{"q":"A wire's diameter is doubled with the same length and material. What happens to its resistance?","c":"It falls to one quarter","w":["It falls to one half","It doubles","It falls to one eighth"],"e":"Area goes with diameter squared, so A is four times larger and R is a quarter.","h":"R ∝ 1/A ∝ 1/d². Double diameter, R ÷ 4."},{"q":"A wire of resistance 4 Ω is stretched uniformly to twice its length. Its volume stays the same. What is its new resistance?","c":"16 Ω","w":["8 Ω","2 Ω","4 Ω"],"e":"Length doubles, so area halves. R = ρL/A becomes 2 × 2 = 4 times larger: 16 Ω.","h":"Stretching: L doubles, A halves, so R × 4 = 16 Ω. Stretch by n → R × n²."},{"q":"Resistors of 2 Ω, 3 Ω and 5 Ω are connected in series. What is the equivalent resistance?","c":"10 Ω","w":["0.97 Ω","1.0 Ω","30 Ω"],"e":"In series, R = R₁ + R₂ + R₃ = 2 + 3 + 5 = 10 Ω.","h":"Series: add. 2 + 3 + 5 = 10 Ω."},{"q":"Resistors of 6 Ω and 3 Ω are connected in parallel. What is the equivalent resistance?","c":"2 Ω","w":["9 Ω","4.5 Ω","18 Ω"],"e":"Product over sum: 18/9 = 2 Ω. It is always smaller than the smallest resistor.","h":"6 ∥ 3: product ÷ sum = 18/9 = 2 Ω. Always less than the smaller one."},{"q":"A 20 Ω resistor has 10 V across it. What power does it dissipate?","c":"5 W","w":["200 W","0.5 W","2 W"],"e":"P = V²/R = 100/20 = 5 W.","h":"P = V²/R = 100 ÷ 20 = 5 W."},{"q":"A 2 kW heater is used for 3 hours. How much energy is used?","c":"6 kWh","w":["6 kW","0.67 kWh","6000 kWh"],"e":"Energy = power × time = 2 kW × 3 h = 6 kWh. One kWh is 3.6×10⁶ J.","h":"E = P × t = 2 × 3 = 6 kWh. Keep in kW and hours."},{"q":"How many joules are in one kilowatt-hour?","c":"3.6×10⁶ J","w":["3.6×10³ J","1×10³ J","3.6×10⁹ J"],"e":"1 kWh = 1000 W × 3600 s = 3.6×10⁶ J.","h":"1 kWh = 3.6×10⁶ J."},{"q":"What is the direction of conventional current in a wire?","c":"The direction in which positive charges would move, opposite to the electron flow","w":["The direction in which electrons actually move","Always from the negative to the positive terminal outside the battery","Along the direction of the magnetic field"],"e":"By convention, current is the flow of positive charge. Electrons drift the other way.","h":"Conventional current: direction of positive charge. Electrons go the other way."},{"q":"Copper has 8.5×10²⁸ free electrons per m³. A 1 mm² wire carries 1 A. What is the drift speed? (e = 1.6×10⁻¹⁹ C)","c":"About 7.4×10⁻⁵ m/s","w":["About 7.4×10⁻² m/s","About 3×10⁸ m/s","About 7.4×10⁻¹¹ m/s"],"e":"v = I/(nAe) = 1/(8.5×10²⁸ × 10⁻⁶ × 1.6×10⁻¹⁹) = 7.4×10⁻⁵ m/s. The electrons creep, but the signal travels fast.","h":"v = I/(nAe) = 1 ÷ (8.5×10²⁸ × 10⁻⁶ × 1.6×10⁻¹⁹) = 7.4×10⁻⁵ m/s. Convert mm² to m² first."},{"q":"Resistors of 4 Ω and 12 Ω are connected in parallel across a 12 V supply. What is the total current drawn?","c":"4 A","w":["0.75 A","1 A","3 A"],"e":"I₁ = 12/4 = 3 A and I₂ = 12/12 = 1 A. In parallel the currents add: 4 A.","h":"I = 12/4 + 12/12 = 3 + 1 = 4 A. Each branch has the full 12 V."},{"q":"A 6 Ω and a 3 Ω resistor are in series across a 9 V supply. What is the voltage across the 6 Ω resistor?","c":"6 V","w":["3 V","9 V","4.5 V"],"e":"I = 9/9 = 1 A. V₆ = 1 × 6 = 6 V. The voltage divides in proportion to the resistance.","h":"Voltage divider: V across R = V × R/(R_total) = 9 × 6/9 = 6 V."},{"q":"A battery of emf 12 V and internal resistance 0.5 Ω supplies a current of 2 A. What is the terminal voltage?","c":"11 V","w":["13 V","12 V","6 V"],"e":"V = ε − Ir = 12 − 2 × 0.5 = 11 V.","h":"V = ε − Ir = 12 − 1 = 11 V."},{"q":"Which law is Kirchhoff's junction rule based on?","c":"Conservation of charge","w":["Conservation of energy","Conservation of momentum","Newton's third law"],"e":"Charge cannot pile up at a junction, so current in equals current out. The loop rule is based on conservation of energy.","h":"Junction rule = conservation of charge. Loop rule = conservation of energy."},{"q":"What happens to the resistance of a metal conductor as its temperature rises?","c":"It increases","w":["It decreases","It stays the same","It falls to zero"],"e":"Hotter ions vibrate more and scatter the electrons more, so resistivity rises. Semiconductors behave the opposite way.","h":"Metal: more heat, more resistance. Hotter ions scatter electrons more."},{"q":"Two bulbs of different resistance are connected in series to a battery. Which one is brighter?","c":"The one with the larger resistance","w":["The one with the smaller resistance","They are equally bright","The one nearer the battery"],"e":"Same current in both, so P = I²R is larger for the larger R.","h":"Series: same current, so P = I²R. Bigger R is brighter."},{"q":"The same two bulbs are connected in parallel to a battery. Which one is brighter?","c":"The one with the smaller resistance","w":["The one with the larger resistance","They are equally bright","The one nearer the battery"],"e":"Same voltage across both, so P = V²/R is larger for the smaller R.","h":"Parallel: same voltage, so P = V²/R. Smaller R is brighter."},{"q":"How should an ammeter and a voltmeter be connected in a circuit?","c":"The ammeter in series and the voltmeter in parallel","w":["Both in series","The ammeter in parallel and the voltmeter in series","Both in parallel"],"e":"An ammeter has very low resistance and must carry the whole current. A voltmeter has very high resistance and is connected across the component.","h":"Ammeter series (very low R), voltmeter parallel (very high R)."},{"q":"A wire of resistance R is cut into two equal halves, which are then connected in parallel. What is the combined resistance?","c":"R/4","w":["R/2","R","2R"],"e":"Each half has R/2. Two of them in parallel give (R/2)/2 = R/4.","h":"Half the wire: R/2 each. Two in parallel: (R/2)/2 = R/4."},{"q":"What are the SI units of resistivity?","c":"Ω·m","w":["Ω/m","Ω·m²","m/Ω"],"e":"From R = ρL/A, ρ = RA/L, which is Ω·m²/m = Ω·m.","h":"ρ = RA/L = Ω·m²/m = Ω·m."}],[{"q":"What is a capacitor?","c":"A device of two conductors carrying equal and opposite charges, separated by an insulator (dielectric), which stores charge and energy","w":["A device of one conductor carrying a single charge, surrounded by air, which only conducts current","A device of two conductors carrying equal charges of the same sign, separated by a metal, which stores energy","A device of two insulators joined by a conductor, which converts charge into current"],"e":"A capacitor stores charge +q and −q on two conductors separated by a dielectric. Energy is stored in the electric field between them. The charge can be released in a controlled way.","h":"Capacitor = two conductors with equal and opposite charge, separated by an insulator or vacuum."},{"q":"How is capacitance defined, and what is its unit?","c":"C = Q/V, the charge stored per unit potential difference, measured in farads (C/V)","w":["C = V/Q, the potential difference per unit charge stored, measured in farads (V/C)","C = QV, the energy stored per unit charge, measured in farads (J/C)","C = Q/V, the charge stored per unit potential difference, measured in henrys (C/V)"],"e":"Capacitance is the ratio of the charge on the capacitor to the potential difference between its plates. 1 farad = 1 coulomb per volt. In practice we use µF, nF and pF.","h":"C = Q/V, unit farad (C/V). Pick 'charge per unit potential difference'."},{"q":"What is the capacitance of a parallel-plate capacitor with plate area A and separation d in vacuum?","c":"C = ε₀A/d","w":["C = ε₀d/A","C = Ad/ε₀","C = ε₀A/d²"],"e":"E = σ/ε₀ = Q/ε₀A, and V = Ed = Qd/ε₀A. So C = Q/V = ε₀A/d. More area gives more capacitance, and more separation gives less.","h":"Parallel plate: C = ε₀A/d. Area on top, distance below."},{"q":"A parallel-plate capacitor has its plate separation doubled while the area stays the same. What happens to its capacitance?","c":"It is halved","w":["It is doubled","It is unchanged","It is quadrupled"],"e":"C = ε₀A/d, so C is inversely proportional to d. Doubling d halves C.","h":"d doubled → C halves. Inverse to d."},{"q":"Which of these affect the capacitance of a capacitor?","c":"Distance between the plates, area of the plates, shape of the conductors and the dielectric","w":["Charge on the plates, current in the circuit, area of the plates and the colour of the plates","Voltage across the plates, charge on the plates, resistance of the wire and the shape of the plates","Distance between the plates, voltage across the plates, current in the wire and the dielectric"],"e":"Capacitance depends only on geometry and on the dielectric. It does not depend on the charge or voltage applied.","h":"C depends on geometry (area, distance) and the dielectric. Not on Q or V."},{"q":"What is the capacitance of a single isolated spherical conductor of radius R?","c":"C = 4πε₀R","w":["C = 4πε₀R²","C = ε₀R/4π","C = 2πε₀R"],"e":"V = Q/4πε₀R, so C = Q/V = 4πε₀R.","h":"Isolated sphere: C = 4πε₀R. Just V = kQ/R inverted."},{"q":"What is the capacitance of a cylindrical capacitor of length L with inner and outer radii a and b?","c":"C = 2πε₀L/ln(b/a)","w":["C = 2πε₀L ln(b/a)","C = 4πε₀L/ln(b/a)","C = ε₀L/ln(a/b)"],"e":"The field between cylinders is E = λ/2πε₀r. Integrating gives ΔV = (λ/2πε₀)ln(b/a), and C = Q/ΔV = λL/ΔV = 2πε₀L/ln(b/a).","h":"Cylinder: C = 2πε₀L/ln(b/a). Look for the ln."},{"q":"What is the capacitance of a spherical capacitor with inner radius a and outer radius b?","c":"C = 4πε₀ab/(b − a)","w":["C = 4πε₀(b − a)/ab","C = 4πε₀(a + b)/ab","C = 4πε₀ab/(b + a)"],"e":"ΔV = (Q/4πε₀)(1/a − 1/b) = (Q/4πε₀)(b − a)/ab. So C = Q/ΔV = 4πε₀ab/(b − a).","h":"Spherical capacitor: C = 4πε₀ab/(b − a). Outer minus inner on the bottom."},{"q":"Which rule is correct for capacitors connected in series?","c":"The same charge is on each, and 1/C_eq = 1/C₁ + 1/C₂ + …","w":["The same voltage is across each, and 1/C_eq = 1/C₁ + 1/C₂ + …","The same charge is on each, and C_eq = C₁ + C₂ + …","The same voltage is across each, and C_eq = C₁ + C₂ + …"],"e":"In series the charge +Q on one plate induces −Q on the next, so every capacitor has the same Q. The voltages add: V = Q/C₁ + Q/C₂, which gives the reciprocal rule.","h":"Series: same charge, 1/C_eq = Σ1/C. Parallel: same voltage, C_eq = ΣC. (Opposite of resistors.)"},{"q":"Which rule is correct for capacitors connected in parallel?","c":"The same voltage is across each, and C_eq = C₁ + C₂ + …","w":["The same charge is on each, and C_eq = C₁ + C₂ + …","The same voltage is across each, and 1/C_eq = 1/C₁ + 1/C₂ + …","The same charge is on each, and 1/C_eq = 1/C₁ + 1/C₂ + …"],"e":"Each capacitor is connected across the same two points, so V is the same. The charges add: Q = C₁V + C₂V = (C₁ + C₂)V.","h":"Parallel capacitors: same V, C adds. Pick 'C_eq = C₁ + C₂'."},{"q":"Which expressions give the energy stored in a capacitor?","c":"U = Q²/2C = ½CV² = ½QV","w":["U = Q²/C = CV² = QV","U = Q/2C = ½CV = ½Q²V","U = QC²/2 = ½C²V = ½QV²"],"e":"Work to put a small charge dq on the capacitor is v dq = (q/C)dq. Integrating from 0 to Q gives Q²/2C. Using Q = CV gives the other forms.","h":"U = ½CV² = Q²/2C = ½QV. Choose the form with the two quantities you have."},{"q":"What is the energy density of an electric field?","c":"u = ½ε₀E², and it holds for any configuration","w":["u = ε₀E², and it holds for parallel plates only","u = ½ε₀E, and it holds for any configuration","u = ½E²/ε₀, and it holds for any configuration"],"e":"Energy density = ½CV²/(Ad). With C = ε₀A/d and V = Ed this becomes ½ε₀E² joules per cubic metre.","h":"Energy density u = ½ε₀E². Works for any field configuration."},{"q":"Which of these is an application of capacitors?","c":"Storing energy in a strobe light, smoothing rectified current, and tuning radio circuits","w":["Converting direct current into alternating current in a power station","Reducing the resistance of a wire in a household circuit","Measuring the temperature of a resistor in a heating circuit"],"e":"Capacitors store energy (strobe lights), smooth the output of power supplies, filter signals, couple stages of amplifiers, and form tuned circuits with inductors.","h":"Capacitor uses: strobe flash, smoothing rectifie
