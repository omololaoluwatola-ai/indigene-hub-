function tileHtml(k, n, label){
  return '<button class="tile' + (selectedRun === k ? ' sel' : '') + '" id="t-' + k + '" type="button"><span class="n">' + n + '</span>' + label + '</button>';
}

function renderTopics(){
  let html = '<div class="brand">INDIGENE</div><div class="sub">Pick a chapter</div><div class="card list">';
  TOPICS.forEach(function(t){
    html += '<button class="row" type="button" data-id="' + t.id + '"><span>' + esc(t.name) + '</span><span class="c">' + t.count + 'Q</span></button>';
  });
  html += '<button class="btn ghost" id="backBtn" type="button">Back</button></div>';
  root.innerHTML = html;
  Array.prototype.forEach.call(root.querySelectorAll('.row'), function(el){
    el.addEventListener('click', function(){
      const id = Number(el.getAttribute('data-id'));
      const pool = BANK.filter(function(b){ return b.topic === id; });
      startRun(shuffle(pool), TOPICS[id].name);
    });
  });
  document.getElementById('backBtn').addEventListener('click', renderHome);
}

  const letters = ['A','B','C','D'];
  let html =
    '<div class="top"><span>Q <b>' + (currentIndex + 1) + '</b> / ' + sessionQueue.length + '</span><span>Score <b>' + score + '</b></span></div>' +
    '<div class="bar"><i style="width:' + Math.round((currentIndex / sessionQueue.length) * 100) + '%"></i></div>' +
    '<div class="chap">' + esc(item.label) + '</div>' +
    '<p class="qtext">' + esc(item.q) + '</p>';
  currentOpts.forEach(function(o, i){
    html += '<button class="opt" type="button" data-i="' + i + '"><span class="k">' + letters[i] + '</span><span>' + esc(o.t) + '</span></button>';
  });
  html += '<div id="fb"></div><button class="btn ghost" id="quitBtn" type="button">Quit</button>';
  root.innerHTML = html;
  Array.prototype.forEach.call(root.querySelectorAll('.opt'), function(el){
    el.addEventListener('click', function(){ lockIn(Number(el.getAttribute('data-i'))); });
  });
  document.getElementById('quitBtn').addEventListener('click', function(){
    var b = document.getElementById('quitBtn');
    if(b.getAttribute('data-sure') === '1'){ renderHome(); return; }
    b.setAttribute('data-sure','1');
    b.textContent = 'Tap again to quit (score will be lost)';
    setTimeout(function(){ if(b.isConnected){ b.removeAttribute('data-sure'); b.textContent = 'Quit'; } }, 3000);
  });
}

async function lockIn(choice){
  if(answered) return;
  answered = true;
  const item = sessionQueue[currentIndex];
  const picked = currentOpts[choice];
  if(picked.ok){ score++; }
  else { wrongList.push({ q:item.q, yours:picked.t, right:item.right, exp:item.exp, label:item.label }); }
  const _cbtLockMod = await getCbtLock();
  if(_cbtLockMod && typeof _cbtLockMod.recordCbtQuestionUsed === 'function'){
    try{ _cbtLockMod.recordCbtQuestionUsed(); }catch(e){ /* dormant/misconfigured lock never blocks the quiz */ }
  }
  Array.prototype.forEach.call(root.querySelectorAll('.opt'), function(el, i){
    el.disabled = true;
    if(currentOpts[i].ok) el.classList.add('good');
    else if(i === choice) el.classList.add('bad');
  });
  const last = currentIndex + 1 >= sessionQueue.length;
  document.getElementById('fb').innerHTML =
    '<div class="fb"><div class="v ' + (picked.ok ? 'g' : 'b') + '">' + (picked.ok ? 'Correct' : 'Wrong') + '</div>' +
    (picked.ok ? '' : '<div>Answer: <b>' + esc(item.right) + '</b></div>') +
    '<div>' + esc(item.exp) + '</div>' +
    '<div class="hack"><b>🔥 EXAM HACK</b><br>' + esc(item.hack) + '</div></div>' +
    '<button class="btn" id="nextBtn" type="button">' + (last ? 'SEE RESULT' : 'NEXT') + '</button>';
  document.getElementById('nextBtn').addEventListener('click', function(){ currentIndex++; renderQuestion(); });
  const nb = document.getElementById('nextBtn');
  if(nb && nb.scrollIntoView) nb.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

// ---- End and review ----
function renderEnd(){
  const n = sessionQueue.length;
  const pct = Math.round((score / n) * 100);
  let remark = 'Keep going, read the hacks again and retry.';
  if(pct >= 80) remark = 'Strong run.';
  else if(pct >= 60) remark = 'Fair. Go through the wrong ones once more.';
  root.innerHTML =
    '<div class="brand">INDIGENE</div><div class="sub">' + esc(runLabel) + '</div>' +
    '<div class="card"><h2>Result</h2><div class="score">' + score + ' / ' + n + '</div>' +
    '<div class="pct">' + pct + '% — ' + remark + '</div>' +
    (wrongList.length ? '<button class="btn" id="revBtn" type="button">REVIEW ' + wrongList.length + ' WRONG</button>' : '') +
    '<button class="btn ghost" id="againBtn" type="button">Try again</button>' +
    '<button class="btn ghost" id="homeBtn" type="button">Home</button></div>';
  const rb = document.getElementById('revBtn');
  if(rb) rb.addEventListener('click', renderReview);
  document.getElementById('againBtn').addEventListener('click', function(){ startRun(shuffle(sessionQueue), runLabel); });
  document.getElementById('homeBtn').addEventListener('click', renderHome);
}

function renderReview(){
  let html = '<div class="brand">INDIGENE</div><div class="sub">Wrong answers</div>';
  wrongList.forEach(function(w, i){
    html += '<div class="rev"><div class="q">' + (i + 1) + '. ' + esc(w.q) + '</div>' +
      '<div class="y">You chose: ' + esc(w.yours) + '</div>' +
      '<div class="a">Answer: ' + esc(w.right) + '</div>' +
      '<div class="e">' + esc(w.exp) + '</div></div>';
  });
  html += '<button class="btn" id="backEnd" type="button">Back</button>';
  root.innerHTML = html;
  document.getElementById('backEnd').addEventListener('click', renderEnd);
}

renderHome();
</script>
</body>
</html>
