<script>
const DATA = [{"name": "Use of Library (Basics, Types, Stock & Rules)", "hacks": ["Types of library = APN-PRS: Academic, National, Private, Public, Research/Special, School. Six, never seven.", "Four components = B-B-P-C: Books/materials, Building, Personnel, Clientele. If an option names only 3 of them, it is incomplete.", "Four ways to acquire stock = P-G-E-B: Purchase, Gift, Exchange, Bequeath. Gift comes free, Purchase is cash and carry."], "q": [["The word 'library' comes from the Latin word 'liber'. What does 'liber' mean?", "Book", "Reading", "Shelf", "Knowledge", "Library is from Latin 'liber' meaning book.", 0], ["How is the library described in the handbook?", "A store house of knowledge where scholars are hatched", "A shop where books are sold to students at a small price", "A reading room meant only for lecturers and postgraduates", "A hall used for lectures and examinations in the university", "The library is a store house of knowledge and a 'nest' where scholars are hatched.", 1], ["How many types of libraries did Busayo (2004) say we have in the society?", "Six", "Four", "Five", "Seven", "Academic, National, Private, Public, Research/Special and School = 6.", 0], ["FUOYE Library and EKSU Library are examples of which type of library?", "Academic library", "Public library", "Special library", "School library", "Libraries attached to universities, polytechnics and colleges are academic libraries.", 0], ["According to Aina (2004), what is the main purpose of a university library?", "To support learning, teaching, research and service", "To provide reading materials for the general public of all ages", "To keep a copy of every book published in the whole country", "To serve the needs of one profession such as law or medicine", "An academic library backs up the objectives of the university.", 1], ["Which library has the legal deposit right and can issue ISBN and ISSN?", "National library", "Academic library", "Public library", "Private library", "The apex library of a nation has legal deposit and is empowered to issue ISBN and ISSN.", 2], ["What does legal deposit right mean for a national library?", "It can receive copies of all works on the country", "It can stop an author from publishing a book abroad", "It gets government money for each book it lends out", "It can borrow books from university libraries at no cost", "Legal deposit = the right to acquire materials published on the country, for retention in its stock.", 2], ["Which of these is an example of a national library?", "National Library of Nigeria", "Federal Polytechnic Ado-Ekiti Library", "Central Bank of Nigeria Library", "A church library in Lagos", "Others given: National Library of Kenya and the Library of Congress (USA).", 0], ["A lawyer who keeps law books at home for his own use has which type of library?", "Private library", "Public library", "Academic library", "School library", "Private libraries are owned by an individual or an organisation like a church.", 0], ["Which library is called 'the people's university' and is paid for with tax-payers' money?", "Public library", "National library", "Research library", "Academic library", "Public libraries serve everybody in the community without discrimination, children included.", 0], ["IITA Ibadan and the Central Bank of Nigeria have libraries of what type?", "Special libraries", "Public libraries", "School libraries", "Academic libraries", "Special libraries serve a defined group of specialist users, e.g. doctors or engineers.", 0], ["A library attached to a primary or secondary school is mainly meant to do what?", "Build the reading habit and learning skills of pupils", "Train library officers and teacher-librarians for the state", "Collect research papers for lecturers in universities", "Keep legal deposit copies of every school textbook", "School libraries build reading skill early, as in 'train up a child in the way he should go'.", 0], ["How many attributes of a library did Nwalo (2000) list in the handbook?", "Five", "Three", "Four", "Six", "Space, collection, organisation, trained person in charge, and opening hours = 5.", 1], ["Who should be in charge of a real library according to its attributes?", "A person trained formally in librarianship", "Any educated person picked by the school head", "A teacher who has many books at home", "The founder of the collection, whatever his training", "A librarian, library officer or teacher-librarian. A collection run by an untrained person is not a library.", 1], ["Why is a room full of books, locked up and not open to users, not a library?", "Because it keeps the collection out of users' reach", "Because a library must always have more than one thousand books", "Because only a government building can be called a library", "Because books must be replaced every year before use", "People must be allowed to use the library at specified hours.", 1], ["Which of these is NOT one of the four components of a library?", "Funding department", "Building or room", "Personnel (staff)", "Clientele (users)", "The four are books/serials/non-book materials, building, personnel and clientele.", 1], ["A book must have not less than how many pages, apart from the cover pages?", "49 pages", "25 pages", "100 pages", "64 pages", "Below 49 pages it is called a pamphlet.", 1], ["What is a printed work of less than 49 pages called?", "Pamphlet", "Serial", "Periodical", "Manuscript", "Pamphlet = fewer than 49 pages.", 1], ["Which of these describes serials?", "Parts issued one after the other without end", "Books printed once and kept in the reserve section only", "Films and slides that users can only see and hear", "Rare handwritten documents kept in the library archives", "Serials carry volume, number and date, e.g. journals, magazines, annuals.", 1], ["Non-book materials are otherwise called what?", "Audio-visual materials", "Printed materials", "Reference materials", "Directional materials", "They are things that can be seen and heard, like films, slides, radios and computers.", 1], ["Which of these is a non-book material?", "Slides", "Journals", "Pamphlets", "Annuals", "Computers, films, video cameras, TVs, radios, slides, maps, charts and photographs are non-book materials.", 1], ["Who are the core library personnel?", "Academic librarians and para-professionals like library officers", "Porters, clerical officers and technical staff of the library", "Attendants, assistants and security men at the gate", "Lecturers and researchers who use the library daily", "Core = professionals and para-professionals. Attendants, porters and clerical officers are supportive staff.", 1], ["Which of these belong to the supportive library personnel?", "Porters and attendants", "Academic librarians", "Library officers", "The University Librarian", "Supportive staff: attendants/assistants, porters, clerical officers and technical staff.", 1], ["Which of these is a sanction for breaking library rules?", "Suspension from library use for some period", "A lifetime ban from all libraries in Nigeria", "Withdrawal of the student's hostel space", "Loss of borrowing rights in another faculty library", "Sanctions: letter of undertaking, replacing the lost book or paying for it, suspension, or dismissal after trial.", 2], ["The four components of a library cannot be separated and work together. This relationship is called what?", "Symbiotic", "Parasitic", "Competitive", "Independent", "Their roles complement each other, so they are symbiotic.", 1], ["What is the 'cash and carry' method of getting library stock called?", "Purchase", "Gift", "Exchange", "Bequeath", "The librarian buys directly from a vendor, or invites the vendor to the library.", 2], ["Books given to the library free by an author or an organisation came through which method?", "Gift", "Purchase", "Exchange", "Legal deposit", "Gift/donation materials come free; they are not bought.", 2], ["A library receives a gift outside its curriculum and swaps it with a sister institution. What is this called?", "Exchange", "Bequeath", "Purchase", "Donation", "Exchange: trading unwanted gifts for materials the library actually needs.", 2], ["Chief Obafemi Awolowo left his law collection to Ogun State University (now OOU) in his will. What method is this?", "Bequeath", "Exchange", "Purchase", "Gift", "A bequest comes into effect after the person dies. Awolowo died in 1987.", 2], ["Which of these is allowed inside the library according to the rules?", "Showing your ID card at entry", "Eating snacks at the reading table", "Charging your phone at a socket", "Reserving a seat for a friend", "Smoking, eating, drinking, phones and seat reservation are not allowed. ID card must be shown.", 2]]}, {"name": "Serials, Reference Sources & Intellectual Property Rights", "hacks": ["Directional = DIRECTS you elsewhere = Bibliographies, Indexes, Abstracts (B-I-A). Everything else (dictionary, atlas, almanac...) gives the answer directly.", "Thesaurus gives words that mean the same or opposite but NEVER meanings. Dictionary gives meanings. Don't swap them.", "Plagiarism = copying ideas without credit. Piracy = copying for money. Counterfeit = fake copy of the original. Money in the picture means piracy."], "q": [["Which of these is covered by copyright in Nigeria?", "Sound recordings", "Machines and tools", "Scientific theories", "Names of products", "Literary, musical, artistic works, cinematograph films and sound recordings.", 2], ["Which of these is a reference service offered in the library?", "SDI (Selective Dissemination)", "Cataloguing of newly bought books", "Binding of damaged books for users", "Stamping of newly acquired books", "Others: CAS, user education, referral services, compiling bibliographies and answering enquiries.", 1], ["What do we call serials published at regular intervals of less than a year?", "Periodicals", "Pamphlets", "Annuals", "Gazettes", "Daily, weekly, monthly or quarterly serials are periodicals.", 0], ["Which number is used to identify a serial publication?", "ISSN", "ISBN", "IPR", "URL", "ISSN = International Standard Serials Number.", 0], ["Which serial carries original research reports that experts review before they are published?", "Journal", "Magazine", "Newsletter", "Newspaper", "Editors send submitted manuscripts to reviewers before accepting or rejecting them.", 0], ["Tell, Newswatch and Ovation are examples of what?", "Magazines", "Journals", "Newspapers", "Gazettes", "Magazines are concise, informal articles on different topics, often with graphics.", 0], ["Someone copies another person's ideas into his own work without giving credit. What is this offence called?", "Plagiarism", "Piracy", "Counterfeiting", "Fair dealing", "Plagiarism = academic dishonesty. Even your own earlier work must be acknowledged.", 2], ["How is a newsletter different from a newspaper?", "Smaller, and covers news of one organisation", "It is bigger and covers daily news of the whole country", "It is handwritten and records the life of one person", "It is printed once and has no volume or issue number", "Newsletters are smaller in size and focus on a particular organisation or activity.", 0], ["Making copies of a copyrighted work in order to sell and make money is known as what?", "Piracy", "Plagiarism", "Paraphrasing", "Referencing", "Piracy takes away the owner's income and discourages him from producing more works.", 2], ["How are reference books usually marked in the library?", "With 'R' or 'Ref' on the spine", "With a red sticker on the cover", "With the word 'Serial' on the first page", "With the ISBN on the date slip", "Reference books carry R or Ref on the spine and are not loaned out.", 0], ["Which sources are known as directional reference materials?", "Bibliographies, indexes and abstracts", "Dictionaries, atlases and almanacs", "Directories, yearbooks and gazettes", "Handbooks, manuals and biographies", "They direct the user to where the information can be found.", 0], ["Making fake copies of an original work for sale is called what?", "Counterfeiting", "Piracy", "Plagiarism", "Citation", "Counterfeits are reproductions of fake copies of the original.", 2], ["Saying what another author said, but in your own words, is called what?", "Paraphrasing", "Plagiarism", "Quoting verbatim", "Indexing", "Even when you paraphrase, you must cite the author in the text and list the source.", 2], ["A reference source with words in alphabetical order and their meanings, spellings and usage is called what?", "Dictionary", "Thesaurus", "Gazetteer", "Directory", "A dictionary gives meaning, spelling, pronunciation and usage of words.", 1], ["Roget's Thesaurus is used mainly to find what?", "Synonyms and antonyms of words", "Meanings and pronunciation of words", "Names of places and where they are", "Names and phone numbers of companies", "Thesauri list related words but do not give meanings.", 1], ["Which source gives alphabetical essay-like summaries on all areas of human knowledge?", "Encyclopaedia", "Almanac", "Handbook", "Yearbook", "Encyclopaedia Britannica and Americana are general encyclopaedias.", 1], ["Which source lists names of people or organisations with their addresses and phone numbers?", "Directory", "Gazetteer", "Atlas", "Almanac", "Directories list names, addresses, phone numbers and affiliations, e.g. the Nigerian Telephone Directory.", 1], ["The Nigerian Gazette is best described as what?", "Official government publication of acts and bills", "A list of towns, rivers and mountains in Nigeria", "A yearly book of statistics on events in Nigeria", "A collection of maps showing all the states of Nigeria", "Gazettes carry current government information: constitution, acts, bills, regulations, tenders.", 1], ["A gazetteer is used to find what?", "Geographic names of places and their locations", "Official notices issued by the government", "Statistics and photographs of last year's events", "Facts on one subject in short, handy form", "Chambers World Gazetteer is an example. Gazette (government) is different from gazetteer (places).", 1], ["A yearly publication with statistics, photographs and facts about the previous year is called what?", "Yearbook", "Almanac", "Handbook", "Bulletin", "Yearbook covers past events of a country, discipline or institution.", 1], ["Which reference source is a yearly collection of dates, facts and statistics, often in tabular form?", "Almanac", "Yearbook", "Atlas", "Directory", "Almanacs are rich in economic, political and demographic information.", 1], ["What is the difference between a short quotation and a long quotation?", "A short one goes in quotation marks and a long one is indented", "A short one is indented and a long one goes in quotation marks", "A short one needs a footnote and a long one needs none", "A short one is italicised and a long one is underlined", "Short = quotation marks. Long = indented block.", 2], ["A list at the end of a document that describes all the sources cited in the text is called what?", "Reference list", "Glossary", "Abstract", "Index", "A reference list is usually alphabetical. It protects the author from a plagiarism charge.", 2], ["Short notes at the bottom of a page that point to a source or give more information are called what?", "Footnotes", "Endnotes", "Abstracts", "Prefaces", "Endnotes do the same job but come at the end of the document.", 2], ["What is a patent?", "An inventor's legal right to benefit from his invention", "A sign put on a product to show where it was made", "Money paid each time a creative work is sold or performed", "The right to copy any work for school use", "Patent = inventor's right to use and make money from the invention for a set time.", 2], ["Symbols or signs put on products to show their commercial origin are called what?", "Trademarks", "Patents", "Royalties", "Copyrights", "Think brand logo.", 2], ["A sum of money paid to the owner of a creative work each time it is sold or performed is called what?", "Royalty", "Patent", "Trademark", "Fine", "Royalty = pay for every sale or performance.", 2], ["Which referencing style is a simplified version of the Chicago Manual of Style?", "Turabian", "Harvard", "MLA", "APA", "Kate Turabian developed it for theses, dissertations and term papers.", 2], ["A student quotes a few lines from a book for research and acknowledges the author. This falls under what?", "Fair use or fair dealing", "Piracy", "Plagiarism", "Counterfeiting", "Fair use needs a limited portion, no commercial purpose, and no harm to the work's market.", 2], ["What does Intellectual Property Right protect?", "Creative ideas of the human mind", "Physical buildings owned by the university", "Books kept in the reserve section", "Money paid to authors by publishers", "IP products are intangible: musical compositions, the story in a novel, etc.", 2]]}, {"name": "Book Anatomy, Citation & Referencing", "hacks": ["Book has TWO major parts: Preliminary pages (before the text, roman numerals) and the Body/Text. Preface, dedication, acknowledgement, table of contents all sit in the preliminary part.", "Verso = back of the title page (copyright details). Recto = right-hand page (odd number). V comes before R, back before right.", "Harvard = author-date. MLA = author + PAGE number, no year in the bracket. APA = author + year. Page number in the bracket points to MLA."], "q": [["What is the technical term for the physical arrangement of a book?", "Codex", "Leaf", "Spine", "Verso", "A single sheet in a codex is a leaf, and each side of a leaf is a page.", 0], ["A single sheet in a codex is called what?", "Leaf", "Page", "Recto", "Folio", "Each side of a leaf is a page, so a leaf has two pages.", 0], ["A book is made up of how many major parts?", "Two", "Three", "Four", "Five", "The preliminary part and the body of the text.", 0], ["Which type of book cover is called 'paper back'?", "Soft bound", "Hard bound", "Dust bound", "Case bound", "Hard bound books cost more because they last longer.", 0], ["Which part of a book carries the title and author's name where the pages are glued or sewn together?", "Spine", "End paper", "Dust jacket", "Verso", "The spine is where the pages are joined, and the title and author are printed there.", 0], ["What is the dust jacket used for?", "To protect a hard bound cover", "To hold the call number of the book", "To list other works by the author", "To carry the date due slip", "Not every book has one.", 0], ["Which is the blank sheet that comes before the preliminary pages?", "End paper", "Half title", "Title page", "Verso", "End paper = blank sheet before the preliminary pages.", 0], ["How are the printed sheets in the preliminary pages usually numbered?", "Unnumbered or in roman figures", "In Arabic figures starting from one", "With alphabets from A onwards", "In the same style as the text", "Arabic numerals belong to the text proper.", 0], ["Which page carries less information than the full title page?", "Half title", "Verso", "Preface", "Dedication", "Half title = shorter version of the title page.", 0], ["Where can you find the author's name, title, publisher, place and date of publication of a book?", "Title page", "Half title", "Preface", "End paper", "It is the main identification page for bibliographic details.", 0], ["What is the verso of a book?", "Back of the title page, with copyright details", "The right-hand page which carries an odd page number", "The page where the author thanks those who helped him", "The blank sheet at the start of the book", "Verso gives copyright dates, the owners and other information.", 1], ["What is the right-hand page of a book that carries an odd page number called?", "Recto", "Verso", "Leaf", "Spine", "Right = recto. The back of the title page is the verso.", 1], ["How many digits does the ISBN have?", "Thirteen", "Ten", "Eight", "Twelve", "ISBN is a 13-digit number given to only one book title in the whole world.", 1], ["What does ISBN stand for?", "International Standard Book Number", "International Serial Book Number", "Internal Standard Book Network", "Indexed Standard Bibliographic Name", "ISBN identifies a single book title. ISSN is for serials.", 1], ["Where does an author discuss briefly all the aspects of his book?", "Preface", "Dedication", "Acknowledgement", "Table of contents", "The preface is the author's informal introduction to the book.", 1], ["A page showing how a book is divided into chapters is called what?", "Contents page", "Preface", "Half title", "Dedication", "Table of contents lists chapters and where they start.", 1], ["Which part is the author's way of showing gratitude and appreciation to someone?", "Dedication", "Acknowledgement", "Preface", "Appendix", "Acknowledgement is different: it thanks those who gave help or assistance in preparing the book.", 1], ["Which part of a book thanks people who gave help during its preparation?", "Acknowledgement", "Dedication", "Preface", "Verso", "Dedication = gratitude to a person. Acknowledgement = thanks for help rendered.", 1], ["Why is the Harvard system also called the author-date method?", "Author's name and date are put in the text", "The list of sources is arranged by date and not by author", "The author's name and page number appear in brackets", "The date of the book is the only detail needed", "Example: Alaba (2007) in the text, then a full entry in the reference list.", 2], ["An author has three works cited that were published in 2007. How does Harvard tell them apart?", "By adding small letters after the year, e.g. 2007a", "By adding the page number after the year in brackets", "By putting the author's initials before the year", "By writing the title of each work inside the text", "Alaba 2007a, Alaba 2007b, Alaba 2007c.", 2], ["In the Harvard system, how is the reference list arranged?", "Alphabetically by the first author", "By date of publication, starting from the latest", "By type of source, with books before journals", "In the order the sources appear in the text", "No need to separate books, journals, etc.", 2], ["In Harvard, how do you cite a book that has four or more authors?", "Give the first author's surname followed by 'et al'", "List every author's name in full", "Use the publisher's name in place of the authors", "Use only the title of the book", "Example: Stone G M et al (2006).", 2], ["Alokun (2000), John (2002) and Ajayi (2006) are cited at the same place in a text. In what order do they appear?", "Chronological order, earliest first", "Alphabetical order of the authors' surnames", "Reverse order, latest first", "Any order the writer prefers", "When several references are cited together, list by date, earliest first.", 2], ["A government document has no named author or editor. Whose name is used for the citation?", "The responsible organisation", "The name of the printer", "The librarian who holds the copy", "The year only, with no name", "E.g. National Planning Commission (2004).", 2], ["The APA style needs which two elements for citing outside sources?", "Text citations and a reference list", "Footnotes and a bibliography only", "A glossary and an index of names", "Endnotes and a list of abbreviations", "APA uses the author's last name and year of publication in brackets in the text.", 2], ["In MLA style, what does the in-text citation (Olajide, 85) contain?", "The author's last name and the page number", "The author's first name and the year", "The title of the book and the year", "The publisher and the place of publication", "MLA uses parenthetical citations with author and page, no year.", 2], ["What is the difference between a reference list and a bibliography?", "A reference list has works cited only; a bibliography may add works consulted", "A reference list holds works consulted, while a bibliography holds only works cited", "A reference list is for books, while a bibliography is for journals only", "They mean different things and never appear in the same document", "A bibliography can also list sources you consulted but did not cite.", 2], ["Which of these is a reason for giving references in a piece of writing?", "It lets others trace the original works you used", "It makes the work longer to meet the word count", "It shows the writer is more important than the authors", "It removes the need to read the original sources", "Referencing also shows you researched widely and protects you from plagiarism.", 2], ["Which statement about citation styles agrees with the handbook?", "No style is best; follow your supervisor's choice", "Harvard is the best style and must be used for every project", "APA is compulsory for all students of Nigerian universities", "MLA is used only when the supervisor is not around", "If in doubt, consult your lecturer, supervisor or editor.", 2], ["A reference to a thesis must include which extra details?", "Degree level and awarding institution", "The ISBN and the name of the printer", "The volume and issue number of the journal", "The edition and the name of the editor", "Example: PhD thesis, Department of Library and Information Studies, University of the Western Cape.", 2]]}, {"name": "Catalogue, Classification & Sections of the Library", "hacks": ["LC for Academic libraries, Dewey for National and Public libraries. Think: L-C = Learned Campus, Dewey = the people's library.", "Dewey: 10 classes, each 100 numbers wide. 500s = pure science, 600s = technology. Science sub-order is M-A-P-C-G-P-A-B-Z: Maths 510, Astronomy 520, Physics 530, Chemistry 540, Geology 550... Zoology 590.", "Technical Services = 'behind the scene' (Acquisition, Cataloguing, Serials, Reprography/Bindery). Readers' Services = where users meet staff (Circulation, Reserve, Reference)."], "q": [["Which of these is a retrieval tool listed by Taylor (1999)?", "Finding aids", "Shelf guides", "Stack lists", "Accession slips", "Retrieval tools: bibliographies, indexes, finding aids, registers and the catalogue.", 0], ["What does an index do?", "Shows where an item in the collection can be located", "Lists the donors of objects kept in a museum", "Gives a full summary of every book in the library", "Records how many copies of a title the library has", "An index is usually arranged alphabetically by subject or name.", 0], ["Which retrieval tool is used in archives?", "Finding aids", "Registers", "Catalogues", "Indexes", "Finding aids are also called inventories.", 0], ["Which retrieval tool is used mainly in museums and carries an identification number for each object?", "Register", "Finding aid", "Bibliography", "Catalogue", "A register has the identity and donor of each museum object.", 0], ["A catalogue that records the holdings of more than one library is called what?", "Union catalogue", "Divided catalogue", "Shelf catalogue", "Book catalogue", "One catalogue, many libraries.", 0], ["Which of these is a reason why a library catalogue is important?", "It tells users if a book is in the library", "It stores the books that are in constant demand", "It lists the names of users who borrowed a book", "It shows the price of every book the library bought", "It also shows the number of copies of a title and gives full bibliographic details.", 0], ["What is the person who describes library items to produce catalogue entries called?", "Cataloguer", "Classifier", "Circulation officer", "Acquisition officer", "Cataloguing = describing an item so its bibliographic details are highlighted.", 0], ["What is the size of a catalogue card?", "3 inches by 5 inches", "4 inches by 6 inches", "2 inches by 4 inches", "5 inches by 8 inches", "Cards are filed in drawers, which together form a catalogue cabinet.", 0], ["How many cards are made for each item in a card catalogue?", "At least three: author, title and subject", "Only one card with all the access points", "Two cards: author and publisher", "Five cards, one for each library section", "Author card, title card and subject card.", 0], ["What is the main advantage of the card catalogue?", "Flexibility, as cards can be added or removed", "It needs no staff to prepare and file the entries", "It can be used from outside the library over the internet", "It can show the records of libraries around the world", "The cards can easily be interfiled.", 0], ["What does OPAC stand for?", "Online Public Access Catalogue", "Open Printed Access Card", "Official Public Archive Catalogue", "Online Personal Access Computer", "It is the most modern form of catalogue and can be updated easily.", 0], ["A divided catalogue in a university library is divided into how many parts?", "Three: author, title and subject", "Two: author and subject", "Four: author, title, subject and date", "Five: one for each faculty", "The three approaches are Author, Title and Subject.", 0], ["What does classification mean in the library context?", "Grouping materials by subject in logical order", "Arranging library materials by size and colour", "Listing the books the library holds in a catalogue", "Giving each book a unique serial number on arrival", "Without it a systematic library cannot be built.", 1], ["Which classification scheme is used by academic libraries in Nigeria?", "Library of Congress (LC)", "Dewey Decimal", "Colon", "Universal Decimal", "LC is used by academic libraries.", 1], ["Which classification scheme is used by national and public libraries in Nigeria?", "Dewey Decimal", "Library of Congress", "Colon", "Moys", "Dewey is for national and public libraries.", 1], ["In the Library of Congress scheme, which letter stands for Medicine?", "R", "M", "S", "Q", "Q = Science, R = Medicine, S = Agriculture, T = Technology.", 1], ["In the Library of Congress scheme, which letter stands for Law?", "K", "L", "J", "H", "J = Political science, K = Law, L = Education.", 1], ["In the Library of Congress scheme, which letter stands for Library Science and Bibliography?", "Z", "A", "B", "Y", "Z covers bibliography, library science and information resources.", 1], ["In Library of Congress, which letter stands for Science?", "Q", "R", "S", "T", "Q = Science.", 1], ["How many main classes does the Dewey Decimal scheme have?", "Ten", "Eight", "Twelve", "Twenty-six", "000 to 999, ten classes of 100 numbers each.", 1], ["Under Dewey, which numbers cover Social Sciences?", "300 to 399", "100 to 199", "500 to 599", "700 to 799", "000 Generalities, 100 Philosophy, 200 Religion, 300 Social Sciences, 400 Languages.", 1], ["Under Dewey, which numbers cover Zoology?", "590 to 599", "580 to 589", "570 to 579", "540 to 549", "580 = Botany, 590 = Zoology, 540 = Chemistry.", 1], ["Under Dewey, which numbers cover Physics?", "530 to 539", "520 to 529", "540 to 549", "510 to 519", "510 Mathematics, 520 Astronomy, 530 Physics, 540 Chemistry.", 1], ["What is an accession number?", "A unique serial number given on arrival", "A number made of the class number and the cutter number", "A thirteen-digit number given to a book by the publisher", "A number showing how many times a book was borrowed", "No two library materials get the same accession number, e.g. 00045.", 1], ["What is a call mark?", "A mark made of the class number and cutter number", "A mark showing the day a borrowed material must be returned", "A stamp showing which library owns the material", "A number given to the material by its publisher", "Also called location mark or call number.", 1], ["What is a cutter number used for?", "To order items within a class", "To count the number of books in a class", "To identify the publisher of a book", "To show that a book is on loan", "It uses the first letter of the author's name and numbers from the cutter table.", 1], ["Which section of the library chooses and buys materials and checks the stock to avoid duplication?", "Acquisition section", "Cataloguing section", "Serials section", "Circulation section", "It sits under Technical Services.", 2], ["Where are library materials charged (loaned out) and discharged (returned)?", "Circulation section", "Reserve section", "Reference section", "Serials section", "Circulation also registers new users, sends overdue notices and collects fines.", 2], ["Materials that are in constant demand but short in supply are kept in which section?", "Reserve section", "Reference section", "Circulation section", "Reprography section", "They are given to users on request but not loaned out.", 2], ["Who heads the administrative department of a university library?", "The University Librarian", "The chief cataloguer", "The circulation librarian", "The Vice-Chancellor", "The University Librarian develops library policies, trains staff and supervises the whole library.", 2]]}, {"name": "Library Software & Electronic Databases", "hacks": ["Match the database to the first letter of its field: HINARI = Health (WHO), AGORA = Agriculture (FAO), OARE = Environment (UNEP), TEEAL = Agriculture (offline), DOAJ = Open access journals, PubMed = Biomedical.", "Two software types: System (runs the machine: Windows, Linux, Android) and Application (does a job for the user: Word, Photoshop, library software). Library software is application software.", "Proprietary = you pay (Symphony, Millennium, Aleph, Voyager). Open source = free to use, modify and share (Koha, Evergreen, Greenstone, DSpace). FUOYE runs Koha."], "q": [["How is computer software best described in the handbook?", "Programs and data that tell the computer what to do and how to do it", "The physical parts of the computer that can be seen and touched", "The cables and boxes that join computers into a network", "A list of the books and journals owned by the library", "Software = instructions for the computer. Hardware = the physical parts.", 1], ["Software is divided into how many main types?", "Two: system software and application software", "Three: system, application and network software", "Four: input, output, process and storage software", "Five: one for each unit of the computer", "System software and application software.", 1], ["Which of these is system software?", "Linux", "Microsoft Word", "Photoshop", "Koha", "System software also covers device drivers, utilities and servers.", 1], ["Which of these is application software?", "Photoshop", "Linux", "Unix", "Android", "Applications include Microsoft Office, Corel Draw, browsers and library software.", 1], ["Library software is mainly designed to do what?", "Handle library housekeeping tasks", "Repair damaged books in the bindery", "Connect the library to the national grid", "Replace all the staff in the library", "Housekeeping = cataloguing, circulation, acquisition, serials and reference.", 1], ["Which of these is a library housekeeping function that software can handle?", "Circulation", "Fumigation", "Book binding", "Rubber stamping", "Others: acquisition, cataloguing, serial processing, web-based OPAC and stock management.", 1], ["Library software comes in how many models?", "Two: proprietary and open source", "Three: free, trial and paid", "Four: local, national, regional and global", "Five: one for each type of library", "Proprietary software and Open Source Software (OSS).", 2], ["What is proprietary library software?", "Software the library pays for by subscription", "Software the library may freely change and share", "Software built by the students of a department", "Software that runs only without internet", "Proprietary products are mature and still the dominant approach for library automation.", 2], ["Which of these is a proprietary library software package?", "Symphony", "Koha", "Evergreen", "Greenstone", "Others: Millennium, Aleph, Voyager, Polaris, Carl X and Spydus.", 2], ["Which of these is an open source library software?", "Koha", "Millennium", "Aleph", "Voyager", "Others: Evergreen, Greenstone, DSpace, NewGenLib and OpenBiblio.", 2], ["Which open source software is used in the Federal University Oye-Ekiti library?", "Koha", "Symphony", "Aleph", "Spydus", "Koha is the one named in the handbook.", 2], ["Open source software is described as what?", "Free to use, modify and share", "Always free of charge and never needing money to run", "Locked to one library and never to be changed", "Meant for use only by foreign libraries", "Free refers to freedom to use, modify and share.", 2], ["An electronic database is best described as what?", "An organised collection arranged for fast computer search", "A printed list of all books borrowed by students in a year", "A set of programs that control the hardware of a computer", "A store of paper files kept in a library cabinet", "It is a searchable electronic index of published, reliable resources.", 2], ["Which of these is a reason databases are popular with librarians and users?", "Speed, flexibility, wide range and currency", "Low price, small size and fixed content", "Printed copies, poor quality and old content", "Slow access, narrow range and limited use", "These four were listed from BIAD (1998).", 2], ["AGORA is an electronic database in which field?", "Agriculture", "Health", "Environment", "Law", "AGORA = Access to Global Online Research in Agriculture, led by the FAO of the United Nations.", 0], ["Which organisation leads the HINARI programme?", "World Health Organization", "Food and Agriculture Organization", "United Nations Environment Programme", "National Institutes of Health", "HINARI = Health InterNetwork Access to Research Initiative.", 0], ["OARE gives developing countries access to research in which field?", "Environment", "Health", "Agriculture", "Law", "OARE = Online Access to Research in the Environment, led by UNEP.", 0], ["DOAJ is a directory of which kind of journals?", "Open access, peer-reviewed journals", "Journals that charge heavy subscription fees", "Newspapers published in Nigeria", "Theses written by university lecturers", "DOAJ = Directory of Open Access Journals. It indexes more than 10,000 of them.", 0], ["Which database gives subscription-based access to a large body of scientific and medical research?", "ScienceDirect", "DOAJ", "PubMed", "TEEAL", "ScienceDirect hosts millions of pieces of content from thousands of journals and e-books.", 0], ["PubMed is an archive of which kind of literature?", "Biomedical and life sciences", "Agricultural reference journals", "Environmental science research", "Newspapers and magazines", "It is a free full-text archive run by the National Library of Medicine, NIH.", 0], ["What is special about TEEAL?", "An offline library of agricultural journals", "It is a free online archive of biomedical journals", "It is an online directory of open access journals", "It is a database of environmental research papers", "TEEAL = The Essential Electronic Agricultural Library.", 0], ["EBSCOhost is mainly known as what?", "A provider of research databases and e-books", "A free archive run by the United Nations", "A program for running a library's circulation", "A directory of agricultural journals kept offline", "It also offers a discovery service to libraries.", 0], ["Which database gives access to dissertations, theses, newspapers, periodicals and historical collections?", "ProQuest", "HINARI", "OARE", "TEEAL", "ProQuest is a collection of many databases.", 0], ["Which of these is a benefit of using library software and electronic databases?", "Less time spent in delivering services to users", "More books needed on the shelves of the library", "Users no longer need any training or skills", "The library no longer needs an internet connection", "Others: easy access, better efficiency, easy generation of records and web-based OPAC.", 0], ["What concern did the writer raise about e-resources in libraries?", "Many users do not know how to use them", "They are too cheap to be taken seriously", "They cannot be updated once bought", "They are only meant for foreign students", "Users need ICT skills, so librarians should train them.", 0], ["Libraries are said to be turning into virtual libraries because of what?", "Books and journals are turning into e-books", "Buildings are being sold off by universities", "Printed books are no longer allowed in libraries", "Students prefer not to visit the library at all", "This has increased the global dissemination of information.", 0], ["Why are the services of modern libraries said to be no longer confined to four walls?", "They join local and international networks", "The buildings have grown too big for one room", "Only staff are allowed to enter the library now", "Printed books are no longer kept in the library", "Electronic documents can be stored, accessed and delivered when required.", 0], ["Who provides free databases to libraries in developing countries?", "Publishers or vendors", "The local government", "The library's own staff", "The students' union", "Some are free; others need a subscription fee.", 0], ["Specialised electronic databases are said to hold published records that are not available on what?", "Google or search engines", "Any computer in the university", "The library's own shelves", "Printed journals and magazines", "Uzuegbu et al. (2012) described them as specialised records, often in full text.", 0], ["Which of these is a type of system software?", "Device drivers", "Spreadsheet programs", "Photo editing programs", "Library catalogue programs", "System software also covers utilities, operating systems and servers.", 1]]}, {"name": "Sources of Information (Primary, Secondary & Tertiary)", "hacks": ["PRIMARY = first-hand, raw, original (diary, letter, speech, patent, thesis, interview, artefact). SECONDARY = someone talking ABOUT the original (textbook, commentary, criticism). TERTIARY = points you to the others (bibliography, index, directory, chronology).", "Quick test: did the writer see it happen? Yes = primary. Did the writer read about it? = secondary. Does it just list where to look? = tertiary.", "Textbook, dictionary and encyclopedia are secondary. Bibliography, index and directory are tertiary. Don't swap the two lists."], "q": [["How many basic sources of information does the handbook name?", "Three", "Two", "Four", "Five", "Primary, secondary and tertiary.", 0], ["What decides which source of information a person should consult?", "The kind of information needed", "The size of the library the person is using", "The age of the person looking for it", "The price of the material", "The choice of source depends on the type of information needed.", 0], ["How does the Oxford dictionary define information, as quoted in the handbook?", "Facts learned about something or someone", "Any paper kept in a file", "A message sent only through a computer", "Opinions shared by one person with another", "Dictionary.com says it is knowledge communicated or received concerning a fact or circumstance.", 0], ["What are primary sources of information?", "Original materials on which other sources are based", "Materials that explain and comment on other sources", "Materials that point you to other sources", "Materials made from a mix of other books", "They report a discovery or share new information, first-hand.", 0], ["A scientist's handwritten record of daily observations in an experiment is what kind of source?", "Primary source", "Secondary source", "Tertiary source", "Reference source", "Diaries are first-hand records, so they are primary.", 0], ["Which of these is a primary source?", "Letters", "Commentaries", "Indexes", "Criticisms", "A letter is the original account of the writer.", 0], ["Which of these is a primary source?", "Patents", "Biographical works", "Chronologies", "Encyclopedia", "A patent is the original record of an invention.", 0], ["Which of these is a primary source?", "Thesis", "Textbooks", "Directories", "Indexes", "Original research results appear in theses, dissertations and journal articles.", 0], ["A student records an interview with a farmer for a project. What is the recording?", "Primary source", "Secondary source", "Tertiary source", "Directional source", "Interviews, video and audio recordings and e-mails are all primary.", 0], ["A coin or a fossil kept in a museum is what kind of source?", "Primary source", "Secondary source", "Tertiary source", "Reference source only", "Artefacts like coins, plant specimens, tools and furniture are primary.", 0], ["A musical score, a painting and a novel are examples of what?", "Works of art counted as primary sources", "Textbooks counted as secondary sources", "Indexes counted as tertiary sources", "Directories counted as reference sources", "Paintings, sculptures, novels, poems and buildings are primary sources.", 0], ["Birth certificates, wills and marriage licences are examples of what?", "Primary sources", "Secondary sources", "Tertiary sources", "Directional sources", "Original documents are primary.", 0], ["Treaties and annual reports of government agencies are what kind of source?", "Primary source", "Secondary source", "Tertiary source", "Reference only", "Records of organisations and government agencies are primary.", 0], ["What are secondary sources of information?", "Sources written from primary sources by outsiders", "Original records written by the person who saw the event", "Lists that only point to books and articles", "Raw data collected during experiments", "They describe, analyse, interpret, evaluate or discuss evidence from primary sources.", 0], ["A student reads a history textbook about a civil war. What kind of source is the textbook?", "Secondary source", "Primary source", "Tertiary source", "Artefact", "The author did not take part in the war; he wrote from other sources.", 1], ["Which of these is a secondary source?", "Commentary", "Birth certificate", "Interview", "Thesis", "A commentary talks about evidence, it is not the evidence.", 2], ["Which of these is a secondary source?", "Biographical works", "Photographs", "Letters", "Original speeches", "The writer of a biography did not live the events first-hand.", 2], ["Which of these is a secondary source?", "Criticism", "Treaty", "Artefact", "Bibliography", "Criticisms evaluate other works.", 2], ["Why is a secondary source not counted as evidence?", "It is commentary on the evidence", "It is written without any research at all", "It is found only in the reference section", "It is always older than the primary source", "Secondary sources are commentary on evidence, not the evidence itself.", 1], ["What should you take note of when using secondary sources?", "How recent they are", "How many pages they have", "How heavy they are", "How many copies the library has", "Recent secondary sources are more up to date.", 1], ["What are tertiary sources of information?", "Works that point to primary and secondary sources", "Original records of research results", "Commentaries written by experts on primary sources", "Personal letters and diaries of famous people", "They list, index, organise and compile citations of other sources.", 1], ["Which of these is a tertiary source?", "Bibliography", "Textbook", "Diary", "Criticism", "Chronologies, bibliographies, indexes, encyclopedias and directories.", 2], ["Which of these is a tertiary source?", "Index", "Letter", "Speech", "Patent", "An index points you to where things are found.", 2], ["Which of these is a tertiary source?", "Directory", "Thesis", "Interview", "Biography", "Directories list people and organisations.", 2], ["Which of these is a tertiary source?", "Chronology", "Commentary", "Photograph", "Dissertation", "A chronology lists events in order of time and points to the sources.", 2], ["A researcher wants a list of all articles ever written on malaria. Where should he start?", "A tertiary source such as a bibliography", "A primary source such as a diary", "A secondary source such as a criticism", "An artefact such as a fossil", "Tertiary sources point you to primary and secondary ones.", 2], ["A soldier's letter written during a war is what kind of source?", "Primary source", "Secondary source", "Tertiary source", "Directional source", "First-hand account in its original form.", 0], ["Which pairing of source type and example is correct?", "Tertiary - directory", "Primary - textbook", "Secondary - patent", "Primary - bibliography", "Directory is tertiary; textbook is secondary; patent is primary; bibliography is tertiary.", 2], ["How do authors of secondary sources differ from authors of primary sources?", "They did not witness the event first-hand", "They always write in the same year the event happened", "They are never allowed to cite other works", "They write only for newspapers and magazines", "Secondary authors work from the evidence that primary sources provide.", 1], ["Which of these is a secondary source?", "Dictionary", "Journal article reporting new research", "Conference proceedings", "Website of an organisation", "Textbooks, dictionaries and encyclopedias are secondary sources.", 2]]}, {"name": "Online Searching (Challenges, Strategies & Evaluation)", "hacks": ["Seven challenges = S-I-E-A-N-H-R: Spelling variation, Information overload, Excessive truncation, Acronyms, Negation, Homographs, Reverse concept. Tie each to its example: honour/honor, too general, LIB, ADD/SAD/AIDS, elderly, cricket/KM, school management vs management school.", "Boolean: AND narrows (both words), OR widens (either word), NOT removes a word. Truncation too short (LIB) pulls unrelated words.", "Evaluating a webpage = T-A-P-C-D: Title, Author (name and designation), Purpose, Contact details, Date (produced and last updated)."], "q": [["What is online searching?", "Retrieving information from online databases by computer", "Reading printed books while connected to a library network", "Typing a document into a word processor while offline", "Sending e-mail messages to friends and lecturers", "It can also mean a specialised search using a string of words entered into a search engine.", 0], ["What does a search engine do when a user types a search request?", "Compares it with its index and ranks the results", "Goes live across the whole internet and reads every page", "Sends the request to a librarian to answer by hand", "Deletes unrelated pages from the internet", "The user searches a fixed database compiled by someone, not the live internet.", 0], ["When you use a search engine, what are you actually searching?", "A fixed database that has been compiled for the search", "The live internet as it is at that moment", "The hard disk of your own computer", "The shelves of the nearest library", "That is why some new pages do not show up.", 0], ["Whose work is the list of challenges of online searching credited to in the handbook?", "Klushpreet (2009)", "Busayo (2004)", "Taylor (1999)", "Breeding (2012)", "Klushpreet (2009) listed the major challenges.", 0], ["Searching for 'honour' and missing pages that use 'honor' is an example of which challenge?", "Spelling variation", "Homographs", "Negation", "Reverse concept", "British and American spelling: honour/honor, organisation/organization, judgement/judgment, catalogue/catalog.", 0], ["What is meant by information overload in online searching?", "Too much information, mostly from too general words", "Too little information because the words are too specific", "Information deleted by the website owner", "Information that can be read only after payment", "Relevant and non-relevant documents come together in the results.", 0], ["Searching with the truncated stem 'LIB' and getting Liberty, libation and libel is an example of what?", "Excessive truncation", "Information overload", "Negation", "Acronyms", "Cutting a word too short pulls in words with different roots.", 0], ["Which challenge arises when ADD, SAD and AIDS retrieve results based on the words 'add', 'sad' and 'aids'?", "Acronyms", "Homographs", "Negation", "Spelling variation", "The conflation of words to form acronyms confuses the search.", 0], ["A search for 'computer AND older OR elderly' returns a document saying 'we had hoped to include elderly people'. Which challenge is this?", "Negation", "Reverse concept", "Homographs", "Information overload", "The result contains the words but means the opposite of what was wanted.", 0], ["The word 'cricket' meaning a game and also an insect is an example of what?", "Homographs", "Acronyms", "Negation", "Spelling variation", "Homographs are words spelt the same but with different meanings, like KM or AGF.", 0], ["KM can mean kilometre or knowledge management. Which challenge does this show?", "Homographs", "Reverse concept", "Excessive truncation", "Information overload", "Same spelling, different meaning.", 0], ["Searching 'management AND school' to find 'school management' also returns 'management school'. Which challenge is this?", "Reverse concept", "Negation", "Homographs", "Acronyms", "The order of the words changes the meaning.", 0], ["Which of these is a basic strategy for online searching?", "Put the most important keywords first", "Always use only one keyword", "Never use synonyms of a word", "Use the same search engine all the time", "Also: start with the closest keywords and mention the place with them.", 1], ["In free-text searching, what should you add to get more results?", "Synonyms and alternative vocabulary", "Only words in capital letters", "Words from another language only", "Extra spaces between the words", "Describe the topic with other words too.", 1], ["What does the handbook advise when one search engine does not give a good result?", "Try the search on another search engine", "Give up the search for the day", "Delete the browser history and start again", "Change the subject of the search completely", "Different engines have different indexes.", 1], ["When you find a good website, what does the handbook advise you to do?", "Check it for links to similar sites", "Copy the whole page into your assignment", "Close it and look for another one", "Send it to the owner for approval", "Good sites often link to other useful ones.", 1], ["A search term cannot be found. What should you remember?", "There may be more; not finding a term proves nothing", "The information certainly does not exist anywhere", "The search engine is broken and should be replaced", "You must stop searching online for that topic", "Be aware that there is more out there.", 1], ["Why should truncated words be used in a search?", "To pick up singular and plural versions of a word", "To keep the search words under three letters", "To remove all spelling mistakes from the results", "To stop the search engine using its index", "But do not truncate too much, as in 'LIB'.", 1], ["Which of these are Boolean operators?", "AND, OR and NOT", "IF, THEN and ELSE", "PLUS, MINUS and TIMES", "OPEN, CLOSE and SAVE", "Boolean operators combine search words.", 1], ["What is the use of parentheses (brackets) in a search?", "To distinguish concepts", "To make the results appear faster", "To hide the search from other users", "To translate the words to another language", "Also combine keywords into a phrase where possible.", 1], ["Which of these is another strategy given for online searching?", "Use the advanced search features", "Avoid subject-specific alternatives", "Forget where you found useful items", "Search only with general words", "Also: consider subject-specific alternatives and keep track of useful finds.", 1], ["Why should internet content be evaluated before use?", "Anyone can publish anything on it", "The internet carries only false information", "Only universities may publish on the internet", "All websites are owned by the government", "The internet has a lot of valuable information and a lot of junk.", 2], ["Which of these is a tip for evaluating a webpage?", "Check the name and designation of the author", "Count the number of pictures on the page", "Check how fast the page loads on your phone", "Check the colour of the website background", "Also check the title of the webpage and website.", 2], ["Which detail helps you know if a webpage is up to date?", "Date produced and last updated", "Number of visitors to the page", "Size of the page in kilobytes", "Name of the browser used", "Dates tell you how current the content is.", 2], ["Why should you check the purpose and objectives of a webpage?", "To know why the page was created and its use", "To find out how much money the owner made from it", "To count the pages on the website", "To see who else visited it that day", "Part of evaluating internet resources.", 2], ["Why should you look for the contact details of the author of a webpage?", "So you can reach him to confirm his work", "So you can send him gifts after using his work", "So the website can load faster", "So the page can be printed in colour", "It is one of the five tips.", 2], ["Which statement about search engines agrees with the handbook's conclusion?", "They are fast but cannot replace human expertise", "They can fully replace librarians and researchers", "They should never be used for academic research", "They always give correct and complete results", "Select the best tools and strategies to retrieve relevant information and save time.", 2], ["A student wants to find hotels in Ado-Ekiti online. Which search follows the handbook's advice?", "Start with the closest keywords plus the place", "Type one general word like 'accommodation' and scroll", "Use a very long question with many unrelated words", "Truncate the word to 'ho' so every word is picked up", "Closest keywords first, with the place.", 1], ["A student wants 'school management' and not 'management school'. Which advice helps most?", "Combine the keywords into a phrase", "Use only the word 'school' in the search box", "Truncate both words to three letters each", "Add as many unrelated keywords as possible", "Phrase searching keeps the words in the order you want.", 1], ["Which strategy is about keeping records while searching?", "Keep track of where you find useful items", "Delete useful pages after reading them", "Memorise every web address by heart", "Print every page you come across", "Keep track of where you find something useful, for repeated reference.", 1]]}, {"name": "Deterioration, Preservation & Conservation", "hacks": ["Three agents of deterioration = E-B-M: Environmental, Biological, Microbiological. Biological = visible (humans, insects). Microbiological = needs a microscope (fungi, bacteria, mould).", "Preservation = protect everything that keeps the material healthy (broad, preventive). Conservation = specialised repair to make a fragile item safe and usable (hands-on).", "Five inhibitors = F-M-G-M-T: Finance, Materials, Government economic policies, Maintenance culture, Technical know-how. Money problem comes first."], "q": [["What is the main role of a library with regard to its information resources?", "Acquire, organise and preserve them for users", "Sell them to users at a small price to raise funds", "Lock them away from users to avoid any damage", "Give them out permanently to lecturers who ask for them", "The library must ensure resources bought with scarce funds last for future users too.", 0], ["Which of these is a sign of deterioration in library materials?", "Brittleness", "Large print", "Colour illustrations", "Fine binding", "Others: wear and tear, shrinkage, cracks, warping, discoloration, abrasion, holes and dirt.", 0], ["Deterioration of library information resources is mainly caused by how many agents?", "Three", "Two", "Four", "Five", "Environmental, biological and microbiological.", 0], ["Why should land be surveyed before a library is built on it?", "To avoid pests and pollution near the building", "To know the price the land will sell for in future", "To decide the colour the building should be painted", "To count the number of students living nearby", "A library in a swampy area will attract reptiles and rodents.", 0], ["What does polluted air do to library materials?", "Oxides in it form a damaging acid", "It makes the paper stronger and more flexible", "It removes dust from shelves and books", "It has no effect except on electronic items", "Libraries near industrial areas suffer from this.", 0], ["Which of these is a biological agent of deterioration?", "Termites", "Fungi", "Bacteria", "Bacillus species", "Biological agents: human beings and insects like cockroaches, termites, silverfish, booklice and bookworms.", 0], ["Which of these is a biological agent of deterioration?", "Cockroaches", "Moulds", "Pseudomonas", "Fungi", "Cockroaches are insects, so biological. Fungi, bacteria and moulds are microbiological.", 0], ["Human beings can damage library materials through which of these?", "Theft, defacing and mishandling", "Reading in silence at the reading table", "Registering with the library", "Returning books on time", "Users should be educated on how to handle information resources.", 0], ["Which of these is a microbiological agent of deterioration?", "Fungi", "Silverfish", "Termites", "Booklice", "Microbiological agents include fungi, bacteria and moulds.", 0], ["Which of these microorganisms is injurious to library materials?", "Bacillus species", "Cockroach", "Termite", "Silverfish", "Bacillus sp. and Pseudomonas sp. are named in the handbook.", 0], ["Why can microbiological agents not be seen with the eye?", "They are too small and can be seen only with a microscope", "They come out only at night when the library is closed", "They hide behind the shelves where nobody looks", "They have the same colour as the paper", "Regular cleaning of books and shelves keeps dust from settling.", 0], ["What is preservation, according to the handbook?", "All that keeps the resources physically well", "The specialised repair of one fragile object", "The buying of new copies of damaged books", "The removal of old books from the library", "Olajide (2010) defined it that way, and protection is included.", 1], ["Conservation is best described as what?", "Specialised work to make a fragile item usable", "General cleaning of the library building every morning", "The yearly buying of materials for the library", "The sharing of books with other libraries", "Vinas and Vinas (1988): operations meant to prolong the life of an object by forestalling damage and remedying deterioration.", 1], ["Which of these is a factor that affects preservation and conservation in African libraries?", "Finance", "Large reading rooms", "Strong teamwork among users", "Free supply of equipment", "Budgets for most African libraries are going down.", 2], ["Why do many African libraries neglect preservation and conservation?", "They lack money even to buy resources", "They believe books never get damaged", "They have too many trained conservators on staff", "They get free equipment from the government", "Lack of funds means little attention goes to preservation.", 2], ["Why do government economic policies affect preservation in Africa?", "Materials are not made locally or cost too much", "Libraries are made to pay no tax on materials", "The government supplies all equipment free of charge", "Libraries are banned from buying anything abroad", "Policies in most African countries do not favour libraries.", 2], ["What does a lack of maintenance culture lead to?", "Quick deterioration of the collections", "Longer life for the books on the shelves", "Lower cost of buying new books", "Better use of the library by students", "Poor maintenance of infrastructure is a reason for quick deterioration.", 2], ["Why is technical know-how important for preservation?", "It is a specialised field needing skills", "It helps staff to catalogue books faster", "It reduces the number of users in the library", "It removes the need for any equipment", "Staff must have relevant skills for a successful programme.", 2], ["Which of these is a way of preventing deterioration?", "Keeping the library clean and hygienic", "Allowing users to eat in the stack area", "Leaving the storage areas uninspected", "Placing food near the shelves", "Also periodic inspection of storage areas and vigilance over old and new acquisitions.", 2], ["Which trap is preferred for rodents in a library?", "Mechanical traps", "Toxic chemical bait", "Poisoned food on the shelves", "Strong perfume sprays", "Mechanical traps are preferred so that the rodents die in the open, not inside walls or ceilings.", 2], ["Why are air conditioners or fans installed in storage areas?", "To control humidity and temperature", "To make the room smell better for visitors", "To dry the ink on freshly printed books", "To keep the reading tables cold for students", "The handbook gives 25 degrees Celsius as favourable to microbial growth.", 2], ["Why are users discouraged from wetting their fingers with saliva to turn pages?", "Disease carriers may pass bacteria into the book", "It makes the page numbers fade away over the years", "It makes the book too heavy for the next reader", "It makes the cover change colour after some days", "Hygiene also protects the next user.", 2], ["What should be done regularly to control insects in the library?", "Appropriate fumigation", "Spraying water on the shelves", "Moving the books outdoors in the sun", "Painting the walls with oil paint", "Fumigation is done on a regular, appropriate schedule.", 2], ["Taking edibles into reading or shelf areas is what?", "Prohibited, since it attracts pests", "Allowed for staff only, at any time", "Allowed during examination periods", "Allowed if users clean up after themselves", "Library hygiene also includes training staff and punishing recalcitrant users.", 2], ["Which of these is a principle for restoring information resources?", "The manager must know conservation and restoration", "The extent of the damage need not be known", "No records of repairs should be kept", "The numbering of loose documents need not be checked", "The extent of damage must be known and records of repairs safely kept.", 2], ["Why must records of all documents repaired be kept safely?", "So the work done can be traced later", "So the repair work can be sold to other libraries", "So users can borrow the repair tools", "So the library can avoid repairing again", "Part of the restoration principles.", 2], ["Which idea of Ranganathan is linked to conservation in the handbook?", "Resources should be conserved for use", "Libraries should keep books away from users", "Books are for storing, not for use", "Every user must buy his own book", "If resources are conserved, Ranganathan's Laws of Library Science are kept.", 2], ["Reptiles and rodents are most likely to find their way into a library built where?", "In a swampy area", "On dry and elevated ground", "Inside a busy school compound", "Beside a well-kept garden", "The environment where a library is sited affects the life span of its materials.", 0], ["What should library staff receive regularly to help preservation and conservation?", "Training on conservation and hygiene", "Gifts for handling very old books carefully", "Extra holidays after cleaning the shelves", "Lessons on how to sell damaged books", "Recalcitrant staff or users can be punished as a deterrent.", 2], ["Which of these is also needed for a good restoration programme?", "Good inventory planning of repair materials", "A ban on checking bound document numbers", "Hiding the damage from the staff", "Repairing with no record kept", "Inventory planning and control of materials for repair is one of the principles.", 2]]}, {"name": "ICT: Threats, Networks, Internet, IoT & NFTs", "hacks": ["Malicious code family: Virus (attaches to files, needs a host), Worm (stands alone, travels through the network), Trojan horse (looks useful, tricks you into installing), Logic bomb (waits for a condition or date), Trapdoor/Backdoor (secret entry). Worm = Network, Virus = Files.", "Three network sizes to remember: LAN (one building or campus), CAN (whole campus, e.g. fuoyeNET), WAN (long distance, the Internet is a super WAN). Topologies are Bus, Ring, Star.", "NFT = unique, cannot be altered, one-of-a-kind (Non-Fungible). Cryptocurrency = digital money. Blockchain = the shared ledger that records both. Buying an NFT does not mean you own the copyright."], "q": [["A computer threat that comes from hacking is described as what?", "Intentional", "Accidental", "Natural", "Harmless", "Intentional (hacking) or accidental (malfunction or physical damage).", 0], ["Malicious code is also known as what?", "A rogue program", "A search engine", "A firewall", "A backup file", "It threatens computing assets through damage caused by a programmer's code.", 0], ["What does a computer virus do?", "Passes malicious code to other programs", "Moves through a network as a standalone program only", "Waits for a set date before doing any damage", "Gives the programmer a secret way into a program", "Viruses attach to files such as .doc, .xls and .exe and can spread to other systems.", 0], ["What is a Trojan horse?", "A program that looks useful but does unexpected things once installed", "A program that copies itself across a network without a host file", "A program that destroys files when a certain date arrives", "A program that blocks unwanted network traffic", "A fake login script that steals your ID and password is an example.", 0], ["A time bomb is an example of what?", "Logic bomb", "Worm", "Trojan horse", "Firewall", "A logic bomb goes off when a specific condition or time is reached.", 0], ["What is a trapdoor or backdoor?", "A hidden way of getting into a program with special privileges", "A program that spreads copies of itself through the network", "A program that secretly collects information about the user", "A program that scans a computer for viruses", "It can be harmless for troubleshooting or used for illegal access.", 0], ["What is the main difference between a worm and a virus?", "A worm spreads over the network alone; a virus attaches to programs", "A worm attaches to other programs, while a virus spreads over the network alone", "A worm attacks only hardware, while a virus attacks only software", "A worm is harmless, while a virus always destroys the screen", "Worms consume bandwidth; viruses corrupt or modify files.", 0], ["Which of these is an antivirus program?", "Kaspersky", "Spybot", "Ad-aware", "SpywareBlaster", "Norton, ESET and Kaspersky are antivirus. Spybot, Ad-aware and SpywareBlaster are anti-spyware.", 0], ["What is spyware?", "A hidden program that collects user information", "A program that scans computer memory for viruses", "A program that fills the screen with adverts for an hour", "A program that backs up files automatically", "Anti-spyware programs are used to remove it.", 0], ["What does a firewall do?", "Blocks forbidden communications in a network", "Copies computer data into an archive file", "Removes viruses from stored e-mail files", "Records everything a user types on the keyboard", "It can be hardware or software and may permit limited access.", 0], ["What is a data backup?", "Copying data into an archive for restoring later", "Deleting old files to free space on the hard drive", "Sending a copy of a virus to other users", "Switching off the computer after long use", "Backups are a simple kind of disaster recovery but not a complete plan on their own.", 0], ["What does ICT stand for?", "Information and Communication Technology", "Internet and Computer Technology", "Information and Computer Training", "Internal Communication Tools", "Its scope is broader than IT because it includes telecommunications and broadcast media.", 1], ["What is computer networking?", "Linking computers to share resources", "Storing programs in the memory of one computer", "Printing documents from one computer to another", "Sending e-mails to a computer at home only", "Shared resources include hard discs, printers and modems.", 1], ["Which of these is a basic component of a classical computer network?", "Network hardware", "A telephone directory", "A paper catalogue", "A card index", "The three are network software, application software and network hardware.", 1], ["Which type of network cable is the most reliable but also the most expensive?", "Fibre-optic", "Twisted-pair", "Coaxial", "Telephone wire", "Fibre optic is mostly used between 'backbone' devices.", 1], ["Which type of network spans long distances using telephone lines, fibre-optic cables or satellite links?", "Wide Area Network (WAN)", "Local Area Network (LAN)", "Personal Area Network (PAN)", "Campus Area Network (CAN)", "The Internet is a super WAN. LAN speeds are higher than WAN speeds.", 1], ["What is a Campus Area Network (CAN)?", "A network covering a school or business campus", "A network covering only one room or floor", "A network linking phones and watches to a laptop", "A network linking computers across countries", "It is usually made of several LANs connected by switches and routers.", 1], ["Which of these is a network topology?", "Star", "Cable", "Router", "Hub", "Topologies: bus, ring and star.", 1], ["Which statement about wired and wireless networks is correct?", "Wired is the most reliable and secure, while wireless gives outstanding mobility", "Wireless is the most reliable and secure, while wired gives outstanding mobility", "Wired and wireless are the same in cost and reliability", "Wireless needs cables but wired needs none", "Wireless is more expensive, easier to install, but open to interference.", 1], ["What is an SSID?", "The name of a Wi-Fi network", "The password of a Wi-Fi network", "The speed of a Wi-Fi network", "The address of a website", "Service Set IDentifier. FUOYE's is fuoyenet.", 1], ["What is a WPA2 key used for?", "A password that blocks people without it", "It is a cable that joins two computers together", "It is a name for a Wi-Fi network in a café", "It is a program that cleans viruses from a router", "WPA stands for Wi-Fi Protected Access, a wireless security standard.", 1], ["How is the Internet different from the World Wide Web?", "The internet is the global communication system, while the web is one service on it", "The web is the global communication system, while the internet is one service on it", "They are the same thing and cannot be told apart", "The internet is only for e-mail and the web only for games", "The internet uses TCP/IP to transmit data.", 1], ["Which network did the U.S. government start building in the 1960s that led to the internet?", "ARPANET", "NSFNET", "FUOYENET", "BITNET", "NSFNET came in 1985, and commercial providers took over around 1995.", 1], ["What is the Internet of Things (IoT)?", "Devices that share data without human help", "A group of websites that sell physical goods online", "A set of programs that protect networks from viruses", "A network used only for sending e-mails", "Each thing has a unique identifier (UID).", 2], ["How can IoT help with student attendance?", "Attendance is taken using ID cards and biometrics", "Students write their names in a register at the gate", "Lecturers call the roll by hand at the end of class", "Students sign in using paper slips", "Staff entry and leaving times can also be tracked.", 2], ["Kajeet makes Wi-Fi systems for what?", "Smart school buses", "Smart classrooms", "Library shelves", "Student hostels", "Students use the bus Wi-Fi to finish homework, and parents can track the bus in real time.", 2], ["What is e-commerce?", "Buying and selling goods using the internet", "Sending letters through a post office", "Printing receipts for goods sold in a shop", "Keeping records of goods in a store room", "Customers, suppliers and employees all benefit from ICT in e-commerce.", 2], ["What is a blockchain?", "A decentralised ledger on a peer-to-peer network", "A central bank register controlled by one clearing authority", "A paper record of transactions kept in a vault", "A computer program for sorting e-mails", "It lets participants confirm transactions without a central clearing authority.", 2], ["Bitcoin is best known as what?", "The best-known cryptocurrency", "A bank account used by the government", "A type of firewall for networks", "A program for cleaning viruses", "Others: Ethereum, Tether, Litecoin, XRP, Binance Coin, Cardano.", 2], ["What is a non-fungible token (NFT)?", "A unique data unit on a blockchain that cannot be altered", "A digital coin that can be swapped one-for-one with any other coin", "A program used for sending money by e-mail", "A copy of a painting that anyone can print", "NFTs are created by a pay-per-use process called minting; OpenSea is a popular marketplace.", 2]]}, {"name": "Computers: Classification, Components & Supercomputers", "hacks": ["Timeline in order: Abacus (500 BC) > Napier's Bones (1617) > Slide Rule (1632) > Pascaline (1642) > Leibniz > Jacquard loom > Babbage Difference Engine (1822) > Analytical Engine (1833) > Hollerith (1890) > ENIAC.", "Four ways to classify a computer = G-T-S-P: Generation, Types (analog, digital, hybrid), Size (super, mainframe, mini, micro), Purpose (special, general).", "Top 5 supercomputers in order of speed: Fugaku (Japan) > Summit (USA) > Sierra (USA) > Sunway TaihuLight (China) > Perlmutter. Japan, USA, USA, China, USA."], "q": [["Which of these is the best description of a computer?", "A device that takes in, processes and gives out data", "A machine that only prints documents on paper", "A device that stores programs but cannot process data", "A telephone network that links many offices", "Input, process, output and storage, following instructions called a program.", 0], ["What does GIGO mean?", "Garbage In, Garbage Out", "Good Input, Good Output", "General Input, General Output", "Graphics In, Graphics Out", "The quality of the output cannot be better than the quality of the input.", 0], ["What are the three major operations of a computer called IPO?", "Input, Process and Output", "Input, Print and Open", "Internet, Program and Output", "Instruction, Process and Order", "IPOCS adds Communication and Storage.", 0], ["The abacus was invented around what time?", "500 BC", "1617", "1642", "1890", "It is the first counting a const CBT_ID = 'gst103';

const BANK = [];
DATA.forEach(function(ch, ci){
  const isFuoye = ci >= 10;
  const label = isFuoye ? ch.name : ('Chapter ' + (ci + 1) + ': ' + ch.name);
  ch.q.forEach(function(q){
    BANK.push({ q:q[0], right:q[1], wrong:[q[2], q[3], q[4]], exp:q[5], hack:ch.hacks[q[6]] || ch.hacks[0], topic:ci, label:label });

});
const TOTAL = BANK.length;

});

// ---- Helpers ----
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
const root = document.getElementById('root');

function renderHome(){
  root.innerHTML =
    '<div class="brand">INDIGENE</div>' +
    '<div class="sub">' + esc(COURSE_LINE) + ' (' + TOTAL + ' Questions)</div>' +
    '<div class="card"><h2>Choose Your Run</h2>' +

      tileHtml('full', String(TOTAL), 'Full CBT') +

      '<button class="tile" id="t-topic" type="button"><span class="n">🎯</span>By Session/Topic</button>' +
    '</div>' +
    '<button class="btn" id="startBtn" type="button">START QUIZ</button></div>';
  ['full','quick','half'].forEach(function(k){
    document.getElementById('t-' + k).addEventListener('click', function(){
      selectedRun = k;
      ['full','quick','half'].forEach(function(x){
        document.getElementById('t-' + x).classList.toggle('sel', x === k);

  });
  document.getElementById('t-topic').addEventListener('click', renderTopics);
