<style>
:root{
  --bg:#120a07; --bg2:#1c0f09; --card:#1a0f0b; --line:#5a3416; --orange:#ff6a1a; --orange2:#d4400f;
  --gold:#ffb347; --text:#f4ece6; --muted:#a8968a; --good:#3ddc84; --bad:#ff5252;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%, #3a1a0a 0%, var(--bg) 60%) no-repeat, var(--bg);min-height:100vh}
#root{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.brand{font-family:'Orbitron',sans-serif;font-weight:900;font-size:34px;letter-spacing:4px;text-align:center;color:var(--orange);margin:6px 0 4px}
.sub{text-align:center;color:var(--muted);letter-spacing:2px;font-size:15px;line-height:1.5;margin:0 6px 22px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:22px 18px}
.card h2{font-family:'Orbitron',sans-serif;font-weight:700;font-size:23px;color:var(--gold);text-align:center;margin:2px 0 18px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#150c08;border:1.5px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;color:var(--text);cursor:pointer;font-family:'Exo 2',sans-serif;font-size:18px;font-weight:600}
.tile .n{display:block;font-family:'Orbitron',sans-serif;font-weight:700;font-size:25px;color:var(--gold);margin-bottom:2px}
.tile.sel{background:linear-gradient(135deg,var(--orange),var(--orange2));border-color:var(--gold)}
.tile.sel .n{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px;margin-top:20px;font-family:'Exo 2',sans-serif;font-weight:700;font-size:21px;letter-spacing:.5px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--orange),var(--orange2));box-shadow:0 8px 24px rgba(255,106,26,.25)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text);box-shadow:none;font-size:17px;padding:14px}
.foot{text-align:center;color:var(--muted);font-size:14.5px;line-height:1.55;margin:20px 6px 2px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:10px;gap:8px}
.top b{color:var(--gold);font-family:'Orbitron',sans-serif;font-weight:700}
.bar{height:6px;border-radius:6px;background:#2a1710;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));width:0}
.chap{font-size:12.5px;letter-spacing:1.5px;color:var(--orange);text-transform:uppercase;margin-bottom:8px}
.qtext{font-size:19px;line-height:1.5;font-weight:600;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:17px;line-height:1.4;cursor:pointer}
.opt .k{flex:0 0 28px;height:28px;border-radius:8px;background:#2a1710;color:var(--gold);font-family:'Orbitron',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.opt.good{border-color:var(--good);background:#0f2a1a}
.opt.good .k{background:var(--good);color:#06210f}
.opt.bad{border-color:var(--bad);background:#2d1010}
.opt.bad .k{background:var(--bad);color:#2d0707}
.opt[disabled]{cursor:default}
.fb{margin-top:6px;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:#160d09;font-size:16px;line-height:1.55}
.fb .v{font-weight:700;margin-bottom:6px}
.fb .v.g{color:var(--good)} .fb .v.b{color:var(--bad)}
.hack{margin-top:10px;padding:10px 12px;border-left:3px solid var(--gold);background:#1f1209;border-radius:0 10px 10px 0;font-size:15px;color:#f6dcb8}
.hack b{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:1px}
.list .row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:16.5px;cursor:pointer}
.list .row span.c{color:var(--gold);font-family:'Orbitron',sans-serif;font-weight:700;font-size:14px;white-space:nowrap}
.score{font-family:'Orbitron',sans-serif;font-weight:900;font-size:50px;color:var(--gold);text-align:center;margin:6px 0}
.pct{text-align:center;color:var(--muted);margin-bottom:6px;font-size:17px}
.rev{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#150c08;font-size:16px;line-height:1.5}
.rev .q{font-weight:600;margin-bottom:8px}
.rev .y{color:var(--bad)} .rev .a{color:var(--good)}
.rev .e{color:var(--muted);margin-top:6px;font-size:15px}
.small{font-size:14px;color:var(--muted);text-align:center;margin-top:12px}
</style>
