ol is done by:",["heating the alcohol with NaOH at room temperature","treating the alcohol with LiAlH₄","heating the alcohol with ammonia under pressure over Al₂O₃","treating the alcohol with HNO₂"],2,"ROH + NH₃ gives a mixture of primary, secondary and tertiary amines.","Alcohol + NH₃ under pressure over alumina (catalyst) at heat. Heat + pressure + Al₂O₃.",0],["In the Hinsberg test, amines are treated with:",["chloroform and alcoholic KOH","p-toluenesulphonyl chloride","nitrous acid","acetyl chloride"],1,"The reagent forms sulphonamides with primary and secondary amines.","Hinsberg reagent = benzenesulphonyl chloride or p-toluenesulphonyl chloride (TsCl).",0],["Which amine forms a sulphonamide that dissolves in KOH in the Hinsberg test?",["all three amines, since each one forms a sulphonamide with an acidic hydrogen","a secondary amine, because the sulphonamide has an acidic N–H","a primary amine, because the sulphonamide has an acidic N–H","a tertiary amine, because it has the most alkyl groups"],2,"RNH–SO₂Ar still has an H on N, which is acidic, so it makes a soluble salt in base.","Primary amine's sulphonamide has an acidic N–H, so it dissolves in KOH. 1° dissolves.",1],["In the Hinsberg test, the sulphonamide of a secondary amine is:",["converted to a gas and removed by distillation along with the amine","soluble in water, because it forms a sodium salt at the sulphonyl group","soluble in KOH, because it has an acidic hydrogen on nitrogen","insoluble in KOH, because it has no acidic hydrogen on nitrogen"],3,"R₂N–SO₂Ar has no H on N. It stays as an insoluble solid.","2° sulphonamide has no N–H left, so insoluble in KOH. 'No acidic hydrogen' wins.",0],["In the Hinsberg separation, how does a tertiary amine behave?",["it does not react with the sulphonyl chloride, and it is distilled off","it forms an insoluble sulphonamide that stays as a solid residue","it forms a soluble sulphonamide that dissolves in the KOH layer","it reacts to form a quaternary salt that stays in the aqueous layer"],0,"A tertiary amine has no N–H, so it cannot form a stable sulphonamide.","3° amine does not react with the sulphonyl chloride at all. It stays unchanged.",0],["Which amine preparation gives an amine with one more carbon than the starting alkyl halide?",["reaction of RX with excess NH₃ under pressure","RX + CN⁻ to give RCN, followed by reduction with H₂/Ni","Hofmann degradation of RCONH₂ with Br₂ and NaOH","reduction of RNO₂ with Fe and hydrochloric acid, which keeps the same carbons"],1,"RCN adds one carbon from CN. Reduction gives RCH₂NH₂.","RX + CN⁻ → RCN → H₂/Ni → RCH₂NH₂. One carbon more. RCN adds 1 C.",0],["What are the products of the reduction of nitrobenzene with Fe/HCl, followed by Na₂CO₃?",["benzaldehyde","phenol","cyclohexylamine","aniline"],3,"The first product is anilinium chloride. The sodium carbonate then frees the free amine.","Nitrobenzene + Fe/HCl → aniline. Fe/HCl is the classic nitro reduction.",0],["Reduction of benzaldoxime gives:",["aniline","benzamide","benzylamine","benzonitrile"],2,"C₆H₅CH=NOH + 4[H] → C₆H₅CH₂NH₂ + H₂O.","Oxime reduction: C=N–OH → CH–NH₂. PhCH=NOH → PhCH₂NH₂ = benzylamine.",0],["Reduction of acetone oxime gives:",["acetamide","isopropylamine","ethylamine","propylamine"],1,"(CH₃)₂C=NOH → (CH₃)₂CHNH₂.","Acetone oxime reduction → (CH₃)₂CHNH₂ = isopropylamine.",0],["LiAlH₄ reduces RCONH₂ to:",["RCH₂NH₂, a primary amine with the same number of carbons","RNH₂, a primary amine with one carbon less","RCH₂OH, a primary alcohol","RCOOH, a carboxylic acid"],0,"The C=O becomes CH₂. The carbon count is unchanged.","LiAlH₄: RCONH₂ → RCH₂NH₂ (same number of carbons). C=O becomes CH₂.",0],["Hofmann degradation of an amide, RCONH₂ with Br₂ and NaOH, gives:",["a primary amine with one carbon less than the amide","a primary amine with the same number of carbons","a carboxylic acid with one carbon less","a primary amine with one more carbon"],0,"The carbonyl carbon is lost as carbonate. CH₃CONH₂ gives CH₃NH₂.","Hofmann degradation (Br₂/NaOH): amide loses one carbon, gives a primary amine. n − 1.",1],["In the Hofmann degradation, the intermediate that forms after rearrangement is:",["a nitrile, R–C≡N","an isocyanate, R–N=C=O","an isocyanide, R–N⁺≡C⁻","an acid chloride, RCOCl"],1,"N-bromoamide loses HBr, and R migrates from C to N, giving R–N=C=O. Alkaline hydrolysis then gives the amine and carbonate.","Intermediate in Hofmann: R–N=C=O isocyanate. Then hydrolysed with loss of CO₂.",1],["Hydrolysis of an isocyanide (isonitrile) with aqueous acid gives:",["a carboxylic acid and ammonia","an alcohol and ammonia","a primary amine and formic acid","a primary amine and acetic acid"],2,"R–NC + 2H₂O → RNH₂ + HCOOH.","RNC + H₃O⁺ → RNH₂ + HCOOH. Isonitrile gives the amine and formic acid.",0],["Why are aliphatic amines stronger bases than ammonia?",["the alkyl groups pull electrons away from nitrogen, making the lone pair less available","the alkyl groups reduce the size of the molecule","the alkyl groups make the amine ionic","the alkyl groups push electrons toward nitrogen, making the lone pair more available"],3,"The +I effect of alkyl groups increases electron density on nitrogen.","Alkyl groups push electrons to N (+I effect), making the lone pair more available. Stronger base than NH₃.",0],["In water, the order of basicity of the methylamines and ammonia is:",["NH₃ > CH₃NH₂ > (CH₃)₂NH > (CH₃)₃N","(CH₃)₃N > (CH₃)₂NH > CH₃NH₂ > NH₃","(CH₃)₂NH > CH₃NH₂ > (CH₃)₃N > NH₃","CH₃NH₂ > (CH₃)₂NH > (CH₃)₃N > NH₃"],2,"The +I effect favours 3° > 2° > 1° > NH₃. Solvation of the ion by H-bonds favours NH₃ > 1° > 2° > 3°. The compromise in water is 2° > 1° > 3° > NH₃.","In water the order is 2° > 1° > 3° > NH₃ (solvation effect). The tertiary falls below the primary.",1],["Why is aniline a much weaker base than methylamine?",["aniline is much less soluble in water than methylamine, so it cannot ionise at all","aniline has no lone pair on nitrogen, because the nitrogen uses all its electrons in the ring","the benzene ring pushes electrons toward nitrogen, which makes the lone pair too crowded to accept a proton","the lone pair on nitrogen is delocalised into the benzene ring, so it is less available to accept a proton"],3,"Resonance spreads the lone pair over the ring. In methylamine it is localised on nitrogen.","Aniline's lone pair is delocalised into the ring, so less available. Weaker base.",0],["Which substituent at position 4 of aniline would increase its basicity?",["a carbonyl group such as –CHO","an electron-releasing group such as –CH₃","a halogen such as –Cl","an electron-withdrawing group such as –NO₂"],1,"Electron-releasing groups push electron density to nitrogen. Electron-withdrawing groups pull it away.","Electron-releasing groups (–CH₃) at para increase basicity. Electron-withdrawing (NO₂) lower it.",0],["Alkylation of a primary amine with excess alkyl halide ends with:",["a quaternary ammonium salt, R₄N⁺X⁻","a nitrile, RCN","a primary amine, RNH₂","an amide, RCONH₂"],0,"RNH₂ → R₂NH → R₃N → R₄N⁺X⁻. The reaction with a tertiary amine is used to characterise it.","Excess RX on amine ends with quaternary ammonium salt R₄N⁺X⁻. N with 4 groups.",0],["Which amines undergo acylation with an acid chloride or acid anhydride?",["primary and secondary amines, both aliphatic and aromatic","tertiary amines only, since they have the most alkyl groups on nitrogen","primary amines only, since secondary amines are too hindered to react","all three classes, since each has a lone pair on nitrogen"],0,"They need an N–H to lose. Tertiary amines have none, so they do not react.","Acylation needs an N–H: only 1° and 2° amines. Tertiary amines have no H to lose.",0],["Primary aliphatic amines react with nitrous acid to give:",["a nitrosamine, as a yellow oil","an alcohol, nitrogen gas and water","an amide, since the nitrous acid acylates the NH₂ group","a diazonium salt, stable in the cold"],1,"C₂H₅NH₂ + HNO₂ → C₂H₅OH + N₂ + H₂O.","R–NH₂ + HONO → R–OH + N₂ + H₂O. Bubbles of nitrogen.",0],["Nitrous acid is prepared in situ because:",["it reacts violently with glass","it is a gas that cannot be bottled","it is unstable, and is made from a mineral acid and sodium nitrite","it is too weak an acid to react"],2,"NaNO₂ + HCl → HNO₂ + NaCl. It decomposes on standing.","HNO₂ is unstable, so it is made in situ from NaNO₂ + HCl. Made right where it is used.",0],["A primary aromatic amine reacts with HONO and HCl at 0–5 °C to give:",["an N-nitrosamine","a phenol directly, with N₂","a nitroso amine in the ring","a diazonium salt (diazotisation)"],3,"C₆H₅NH₂ + HNO₂ + HCl → C₆H₅N₂⁺Cl⁻ + 2H₂O. If the solution is warmed, the salt gives phenol and N₂.","Aromatic 1° amine + HONO/HCl at 0–5 °C → diazonium salt. Keep it cold.",1],["What happens to the benzenediazonium salt when it is warmed?",["it gives benzoic acid","it gives nitrobenzene","it gives phenol and nitrogen gas","it gives aniline and nitrogen gas"],2,"The diazonium group is replaced by OH, with loss of N₂.","Diazonium salt warmed with water → phenol + N₂. Heat gives phenol.",0],["Secondary amines react with nitrous acid to give:",["no reaction at all, because the nitrogen has no lone pair","an N-nitrosamine, R₂N–N=O, a yellow oil","a diazonium salt, R–N₂⁺, which decomposes on warming","an alcohol, nitrogen gas and water, as primary amines do"],1,"The nitrosamine is not basic and is insoluble in water. Acid reflux regenerates the amine.","2° amine + HONO → N-nitrosamine (R₂N–N=O), yellow oil. Oily, yellow.",0],["Why is a nitrosamine not basic?",["the molecule has no nitrogen atom, because the nitrogen is lost as a gas","it is insoluble in every acid because it has no oxygen atom","the nitrogen carries a full positive charge, so it cannot accept another proton","the nitrogen has no available lone pair because it is attached to the N=O group"],3,"The lone pair is delocalised toward the nitroso group. This is a fact used to separate it from basic amines.","Nitrosamine N is bonded to N=O, so its lone pair is delocalised and not available. Not basic.",1],["What happens when a tertiary aliphatic amine meets nitrous acid?",["it forms a soluble salt but does not form a stable nitroso compound","it forms an alcohol and nitrogen gas, as primary aliphatic amines do","it forms a diazonium salt that is stable only at 0–5 °C","it forms a yellow nitrosamine oil that is insoluble in the acid solution"],0,"It has no N–H and cannot be nitrosated on N. It simply dissolves by forming a salt in the acid.","3° aliphatic amine + HONO: only forms a salt, no stable nitroso product.",0],["N,N-Dimethylaniline reacts with HONO to give:",["phenol and nitrogen gas, after the ring is diazotised and warmed","N-nitroso-N,N-dimethylaniline, a yellow oil, which is not basic","p-nitroso-N,N-dimethylaniline, a green compound, which is basic","benzenediazonium chloride, a salt that is stable below 5 °C"],2,"A tertiary aromatic amine is nitrosated on the ring at the para position. Unlike nitrosamines, this product is basic.","Tertiary aromatic amine nitrosates on the ring (para): p-nitroso-N,N-dimethylaniline, green.",1],["The carbylamine (isocyanide) test is positive for:",["tertiary amines, giving a quaternary salt","secondary amines, giving a nitrosamine","all amines, giving a diazonium salt","primary amines, giving an isocyanide with a foul smell"],3,"RNH₂ + CHCl₃ + 3KOH → RNC + 3KCl + 3H₂O. 2° and 3° amines give no reaction.","Carbylamine test is positive for primary amines only. Foul-smelling isocyanide.",0],["Which reagent combination is used in the carbylamine reaction?",["bromine and NaOH","chloroform and alcoholic KOH","chloroform and aqueous HCl","nitrous acid and HCl"],1,"The reaction works for both aliphatic and aromatic primary amines.","Carbylamine reagent: CHCl₃ + alcoholic KOH. Chloroform and KOH.",0]]},{"t":"Carbohydrates","q":[["Carbohydrates are chemically defined as:",["chains of amino acids joined by peptide bonds, or compounds that give them on hydrolysis","polyhydroxy carboxylic acids that contain nitrogen, or compounds that give them on hydrolysis","long-chain esters of glycerol with fatty acids, or compounds that give them on hydrolysis","polyhydroxy aldehydes or ketones, or compounds that give them on hydrolysis"],3,"They contain only C, H and O, and many have the empirical formula CₙH₂ₙOₙ, which is Cₘ(H₂O)ₙ.","Carbohydrate = polyhydroxy aldehyde or ketone (or gives them on hydrolysis). Many OH + C=O.",0],["Deoxyribose, C₅H₁₀O₄, is a carbohydrate. What does this show about the formula Cₘ(H₂O)ₙ?",["the formula only applies to disaccharides, since monosaccharides have no fixed formula","not every carbohydrate fits the formula exactly, since it has one oxygen fewer","deoxyribose is not a carbohydrate, since it does not fit the formula Cₘ(H₂O)ₙ","every carbohydrate fits the formula exactly, since deoxyribose has five carbons and five waters"],1,"C₅H₁₀O₄ cannot be written as C₅(H₂O)₅. It is still a carbohydrate because of its structure.","Cₘ(H₂O)ₙ is only a rough guide. Deoxyribose C₅H₁₀O₄ breaks it. 'Not every carbohydrate fits' wins.",1],["Grape sugar, cane sugar and milk sugar are respectively:",["lactose, sucrose and glucose","glucose, lactose and sucrose","glucose, sucrose and lactose","sucrose, glucose and lactose"],2,"Glucose is a monosaccharide. Sucrose and lactose are disaccharides. Simple sugars end in -ose.","Grape = glucose, cane = sucrose, milk = lactose. Match the source in order.",0],["A monosaccharide is a carbohydrate that:",["cannot be hydrolysed into smaller carbohydrate units","can be hydrolysed into two simple sugars","has a branched chain of 100 glucose units","contains a peptide bond"],0,"The general formula is (CH₂O)ₙ with n ≥ 3. Examples are glucose, fructose and glyceraldehyde.","Monosaccharide = cannot be hydrolysed further. 'Simple sugar'.",0],["What are the smallest monosaccharides?",["the tetroses: erythrose and threose, which have four carbons","the trioses: dihydroxyacetone and D- and L-glyceraldehyde","the pentoses: ribose and xylose, which have five carbons","the hexoses: glucose and fructose, which have six carbons"],1,"n = 3 is the smallest value for (CH₂O)ₙ.","Smallest sugars = trioses (3 C): dihydroxyacetone and glyceraldehyde.",0],["Ribose is a:",["five-carbon sugar (aldopentose) found in RNA and in coenzymes such as ATP, FAD and NAD","five-carbon ketose (ketopentose) found in fruit juice and honey as fruit sugar","six-carbon sugar (aldohexose) found in DNA and in the coenzymes ATP, FAD and NAD","disaccharide of two glucose units, found in malt and in germinating barley"],0,"Deoxyribose, made from ribose, is the sugar of DNA.","Ribose = 5 C (pent) + CHO (aldo) = aldopentose, in RNA.",0],["Formaldehyde, CH₂O, and inositol fit the formula (CH₂O)ₙ. Are they monosaccharides?",["No, because they are too large to be monosaccharides and must be disaccharides","Yes, because they match the formula (CH₂O)ₙ, which is all that a monosaccharide needs","No, they match the formula but lack the carbonyl and polyhydroxy structure of a sugar","Yes, because all compounds that contain only C, H and O are classed as sugars"],2,"A monosaccharide must be a polyhydroxy aldehyde or ketone. Formaldehyde has no OH groups, and inositol has no carbonyl.","Formula (CH₂O)ₙ alone is not enough: no carbonyl + OH pattern means not a sugar. Formaldehyde has no OH.",1],["When the open-chain form of a sugar closes into a ring, the carbonyl carbon and an OH group form:",["an ester with a C=O in the ring","an acetal with two C–O–C bridges","an ether with no OH group","a hemiacetal with a C–O–C bridge"],3,"In a ketose, the same process gives a hemiketal. The ring contains oxygen.","Open chain closes: C=O + OH = hemiacetal ring (C–O–C bridge).",0],["Glucose is classified as:",["a ketohexose","an aldohexose","an aldopentose","a ketopentose"],1,"It has an aldehyde group (aldo-) and six carbons (hexose). Fructose is a ketohexose and ribose is an aldopentose.","Glucose = 6 C + CHO = aldohexose.",0],["Which of these is a ketose?",["fructose","glucose","galactose","xylose"],0,"Fructose has a C=O on carbon 2. Glucose, galactose and xylose are aldoses.","Ketose = ketone sugar. Fructose is the classic one. Glucose is an aldose.",0],["Dihydroxyacetone, erythrulose and ribulose are all:",["aldoses","polysaccharides","ketoses","disaccharides"],2,"The names ending in -ulose usually indicate a ketose. Examples are the trioses, tetroses and pentoses.","Dihydroxyacetone, erythrulose, ribulose: all end in '-ulose', all ketoses. '-ulose' = ketose.",0],["In the D/L system, a sugar is called D if:",["the OH on the asymmetric carbon farthest from the carbonyl is on the left in the Fischer projection","it rotates plane-polarised light to the right when a solution of it is placed in a polarimeter","the OH on the carbon nearest to the carbonyl group is on the right in the Fischer projection","the OH on the asymmetric carbon farthest from the carbonyl group is on the right in the Fischer projection"],3,"Left means L. For glucose, this is carbon 5.","D if the OH on the farthest chiral carbon from C=O points right (Fischer). L = left.",0],["Does D-glucose rotate plane-polarised light to the right because of the D in its name?",["Yes, because the D shows the sugar is a solid, and solids always rotate light to the right","Yes, D always means dextrorotatory, so every D sugar rotates the plane of polarised light to the right","No, the D shows the configuration of the sugar, while + or d shows the direction of rotation","No, because D-glucose does not rotate plane-polarised light at all, since it has no chiral carbon"],2,"D/L and (+)/(−) are separate things. Some D sugars rotate to the left, such as D-fructose, which is (−).","D/L is configuration, not the direction of rotation. (+)/(−) is the rotation. D does not mean dextro here.",1],["How many stereogenic carbons does D-glucose have, and how many stereoisomers are possible for an aldohexose?",["6 stereogenic carbons and 2⁶ = 64 stereoisomers","4 stereogenic carbons and 2⁴ = 16 stereoisomers","5 stereogenic carbons and 2⁵ = 32 stereoisomers","4 stereogenic carbons and 4² = 16 stereoisomers"],1,"Carbons 2, 3, 4 and 5 each have four different groups. Carbon 1 is the CHO and carbon 6 is CH₂OH. The book writes '24 isomers', but it means 2⁴.","Glucose: 4 chiral carbons, 2⁴ = 16 stereoisomers. Formula 2ⁿ.",1],["In the cyclic forms of glucose, a six-membered ring and a five-membered ring are called:",["aldose and ketose respectively","furanose and pyranose respectively","pyranose and pyranose","pyranose and furanose respectively"],3,"Glucopyranose has a six-membered ring (five carbons and one oxygen). Glucofuranose has a five-membered ring.","6-ring = pyranose (pyran), 5-ring = furanose (furan). 6 then 5 in order.",0],["The anomeric carbon is:",["the carbonyl carbon, which becomes a new stereogenic centre on ring closure","the oxygen atom in the ring, which links the first and the fifth carbons","the carbon that carries the CH₂OH group, which is the last carbon of the chain","the carbon furthest from the carbonyl group, which decides whether the sugar is D or L"],0,"It is C1 for glucose and C2 for fructose. Its configuration decides if the sugar is alpha or beta.","Anomeric carbon = the old carbonyl carbon, now a new chiral centre.",0],["In an α-anomer of D-glucopyranose, the OH on the anomeric carbon is:",["trans (opposite side) to the CH₂OH group","in the plane of the ring","absent from the anomeric carbon","cis (same side) as the CH₂OH group"],0,"In the β-anomer the OH is cis to the CH₂OH. The two forms are called anomers.","α = OH on C1 is trans to CH₂OH (opposite side). β = cis.",0],["Mutarotation is:",["the splitting of a disaccharide into two monosaccharides by water and an acid","the slow interconversion of the α and β anomers in solution, over a few hours","the conversion of glucose into fructose by an enzyme, which changes aldose to ketose","the oxidation of glucose to gluconic acid by a mild oxidising agent"],1,"It goes through the open-chain form. The optical rotation of the solution changes until equilibrium is reached.","Mutarotation = slow α ⇌ β interconversion in solution. Optical rotation drifts.",0],["Which sugar is found in semen, fruits and honey, and is absorbed directly in the intestine?",["lactose","ribose","fructose","trehalose"],2,"It is known as fruit sugar. It is metabolised in the liver.","Fructose = fruit sugar, in semen, honey, absorbed directly. 'Fruit' = fructose.",0],["Trehalose is the major sugar of insects, because:",["it is converted to starch for storage","it is converted to lactose in the gut","it is hydrolysed to glucose and fructose to supply energy for sleep","it is hydrolysed to two glucose molecules to supply energy for flight"],3,"Trehalose is made of two glucose units. It is a non-reducing disaccharide.","Trehalose in insects: hydrolysed to two glucose for flight energy.",0],["The equation for photosynthesis is:",["6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, in the presence of light and chlorophyll","C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, in the presence of light","6CO₂ + 6H₂O → C₆H₁₂O₆ + 6H₂, in the presence of light and chlorophyll","6CO + 6H₂O → C₆H₁₂O₆ + 6O₂, in the presence of chlorophyll"],0,"Oxygen is released. The book has a typo for oxygen, but 6O₂ is correct.","Photosynthesis: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, with light. Balance C: 6 = 6.",1],["Excess glucose in the body is stored as:",["starch in the liver and muscle cells","cellulose in the liver and muscle cells","sucrose in the blood","glycogen in the liver and muscle cells"],3,"Starch is the plant store and glycogen is the animal store.","Excess glucose = glycogen (liver and muscle). Starch is the plant store.",0],["Fermentation of glucose with zymase gives:",["ethanal and carbon monoxide","lactic acid and hydrogen","ethanol and carbon dioxide","ethanoic acid and water"],2,"C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂. In bread making, the CO₂ makes the dough rise.","Zymase on glucose gives ethanol + CO₂. Yeast fermentation.",0],["Lacto-fermentation by bacteria feeds on sugar and produces:",["carbon dioxide only","lactic acid, which preserves the food","ethanol, which makes the food alcoholic","acetic acid, which makes the food sweet"],1,"Foods made this way include yoghurt and pickles. They may contain probiotics and B vitamins.","Lacto-fermentation: bacteria make lactic acid, which preserves the food.",0],["Mild oxidation of glucose with Fehling's solution gives:",["sorbitol, since the C=O group of the sugar is reduced to a CH₂OH group","glucaric acid, since both ends of the chain are oxidised to carboxylic acid groups","CO₂ and water only, since the ring is broken and all the carbon is oxidised","gluconic acid, since only the CHO group is oxidised to COOH"],3,"Mild oxidising agents only attack the aldehyde group.","Fehling's mild oxidation: only CHO becomes COOH → gluconic acid. Not saccharic.",0],["Reduction of glucose with NaBH₄, or with sodium amalgam in water, gives:",["mannitol","gluconic acid","glucitol (sorbitol)","glucose oxime"],2,"The aldehyde group is reduced to CH₂OH, giving a hexahydric alcohol.","NaBH₄ reduces glucose's CHO to CH₂OH: glucitol = sorbitol.",0],["When glucose is heated with concentrated H₂SO₄, a black residue forms. The black material is:",["carbon, formed by dehydration of the sugar","silver, formed by reduction of the sugar","sulphur, formed by reaction with the acid","copper(I) oxide, formed by oxidation of the sugar"],0,"C₆H₁₂O₆ → 6C + 6H₂O. The acid removes water from the sugar.","Conc. H₂SO₄ removes water from sugar. Black carbon is left. Dehydration.",0],["Reaction of glucose with excess phenylhydrazine gives:",["a gluconic acid","an osazone","a cyanohydrin","an oxime"],1,"Three moles of phenylhydrazine are used. The first gives the phenylhydrazone and the others react at carbon 2.","Excess phenylhydrazine (3 moles): glucose → osazone. Glucose and fructose give the same osazone.",0],["Fehling's solution A and B are respectively:",["aqueous copper(II) sulphate, and a mixture of potassium sodium tartrate (Rochelle salt) and NaOH","aqueous copper(II) sulphate, and aqueous ammonia, which are mixed just before use","aqueous sodium carbonate, and aqueous sodium citrate, which are mixed just before use","aqueous silver nitrate, and aqueous ammonia, which are mixed just before use"],0,"A is deep blue. B is colourless. They are mixed just before use.","Fehling A = CuSO₄ (aq). Fehling B = Rochelle salt (K-Na tartrate) + NaOH. A is blue copper.",0],["What is the red precipitate formed in a positive Fehling's test?",["copper(II) oxide, CuO","copper(I) oxide, Cu₂O","silver oxide, Ag₂O","elemental copper"],1,"Cu²⁺ is reduced to Cu⁺ by the aldehyde, which is itself oxidised.","Positive Fehling = red Cu₂O (copper(I) oxide). Blue Cu²⁺ is reduced to Cu⁺.",0],["Fehling's solution does NOT work with:",["aliphatic aldehydes, for which Tollens' reagent is used instead","reducing sugars, for which iodine is used instead","aromatic aldehydes, for which Tollens' reagent is used instead","glucose, for which Benedict's reagent is used instead"],2,"Benzaldehyde does not reduce Fehling's solution. Tollens' reagent does react with it.","Fehling's fails with aromatic aldehydes. Use Tollens' for those. Aromatic = not Fehling.",1],["Tollens' reagent is prepared from silver nitrate by adding NaOH, then excess ammonia. What does the excess ammonia do?",["it oxidises the aldehyde in the test sample, which is why the reagent has a short shelf life","it neutralises the excess NaOH, so the solution becomes acidic and clear","it reduces silver ions to silver metal, so the reagent is ready to oxidise the sugar","it dissolves the brown Ag₂O by forming the diamminesilver(I) complex, [Ag(NH₃)₂]⁺"],3,"AgNO₃ + NaOH gives brown Ag₂O. Excess NH₃ dissolves it to give a clear complex. The reagent should be freshly made because it has a short shelf life.","Excess NH₃ dissolves brown Ag₂O forming [Ag(NH₃)₂]⁺. It keeps silver in solution.",0],["Tollens' reagent gives a positive result with:",["aldehydes and α-hydroxy ketones, but is negative for most ketones","tertiary alcohols and ketones, but not aldehydes or sugars","alkenes and alkynes, since the π bond reduces the silver ions","all ketones, but not aldehydes, since only ketones can reduce silver ions"],0,"The α-hydroxy ketones can isomerise to aldehydes in base.","Tollens' positive: aldehydes + α-hydroxy ketones (fructose). Negative for simple ketones.",0],["Benedict's reagent contains:",["chloroform and potassium hydroxide","sodium hydroxide, Rochelle salt and copper(II) sulphate","silver nitrate and ammonia","sodium carbonate, sodium citrate and copper(II) sulphate"],3,"Benedict's reagent detects monosaccharides and reducing disaccharides.","Benedict's = Na₂CO₃ + Na citrate + CuSO₄. Citrate replaces tartrate.",0],["In the Benedict's test, the colour changes with increasing sugar concentration in which order?",["green, blue, yellow, red, orange, brick red","blue, green, yellow, orange, red, brick red","blue, red, orange, yellow, green, brick red","blue, yellow, green, orange, brick red, red"],1,"Greenish is about 0.5 g%, yellow about 1 g%, orange about 1.5 g% and red about 2 g% or higher. So the test is semi-quantitative.","Benedict's colours: blue → green → yellow → orange → red → brick red. Blue = none, brick red = lots.",0],["Fructose is a ketose, but it gives a positive result with Benedict's reagent. Why?",["it is a disaccharide with a free hemiacetal group that reduces the copper(II) ions directly","it is oxidised directly as a ketone, because ketones are as easily oxidised as aldehydes by Cu²⁺ ions","in alkaline conditions, it is isomerised through an enediol to glucose and mannose, which have aldehyde groups","it contains a free aldehyde group in its open-chain form, which is why it is called an aldose"],2,"Fructose is an α-hydroxy ketone. Base converts it to aldoses, which can reduce Cu²⁺.","Fructose isomerises to glucose and mannose in alkali via an enediol. That is why it is positive.",1],["Disaccharides are formed from two monosaccharides by:",["a condensation reaction, giving a glycosidic bond","a hydrolysis reaction, giving an ester bond","an oxidation reaction, giving a peptide bond","an addition reaction, giving a double bond"],0,"A hydrogen from one sugar and an OH from the other are lost as water. The formula of a disaccharide is C₁₂H₂₂O₁₁.","Disaccharide = two monosaccharides + loss of H₂O = condensation, glycosidic bond.",0],["Sucrose is composed of:",["two glucose units joined by an α-1,4 bond between carbon 1 and carbon 4","α-D-glucose and D-fructose joined by an α-1,2 glycosidic bond","galactose and glucose joined by a β-1,4 bond between carbon 1 and carbon 4","two glucose units joined by a β-1,4 bond between carbon 1 and carbon 4"],1,"C1 of glucose is joined to C2 of fructose. Glucose is in the pyranose form and fructose in the furanose form.","Sucrose = α-glucose + β-fructose, α-1,2 link (both anomeric carbons used). Non-reducing.",0],["Lactose is composed of:",["two galactose units, linked by a β-1,4 bond","two glucose units, linked by an α-1,4 bond","glucose and fructose, linked by an α-1,2 bond","D-galactose and D-glucose, linked by a β-1,4 glycosidic bond"],3,"It is a reducing sugar, because the glucose part still has a free hemiacetal.","Lactose = galactose + glucose, β-1,4 link. Milk sugar.",0],["Maltose and cellobiose are both made of two glucose units. They differ in:",["the type of sugar, with maltose made of glucose and cellobiose made of galactose","the presence of nitrogen, with cellobiose carrying an amino group on each ring","the type of linkage: α-1,4 in maltose and β-1,4 in cellobiose","the number of glucose units, with maltose having two and cellobiose having three"],2,"That small change decides whether the enzyme in our body can break them.","Maltose α-1,4. Cellobiose β-1,4. Both glucose + glucose. α for maltose (starch), β for cellobiose (cellulose).",0],["Which of these disaccharides is NON-reducing?",["cellobiose","sucrose","lactose","maltose"],1,"In sucrose, the glycosidic bond uses both anomeric carbons, so there is no free hemiacetal. Trehalose is also non-reducing.","Sucrose is non-reducing because both anomeric carbons are tied up in the bond.",1],["Why are non-reducing sugars more stable in storage?",["they have more hydroxyl groups, which form hydrogen bonds that protect the sugar","they contain nitrogen, which protects the sugar from reacting with oxygen","they have a higher molecular mass, so they cannot react with other compounds","they have no free hemiacetal group that can open to a reactive aldehyde"],3,"Plants transport sugar as sucrose for this reason.","Non-reducing = no free hemiacetal, so it cannot open into an aldehyde. More stable.",0],["What does the suffix -oside, as in glucopyranoside, indicate?",["the sugar is a ketose with a carbonyl group on the second carbon","the sugar is a polysaccharide made of many glycosidic units","both anomeric carbons are involved in the glycosidic bond","the sugar has a free hemiacetal group that can open to form an aldehyde"],2,"Sucrose is named as a fructofuranoside for this reason.","-oside = anomeric OH replaced by OR. Glycoside link formed at the anomeric carbon.",0],["When sucrose is heated to 186 °C, it:",["does not melt, but decomposes to caramel, a process called caramelisation","melts sharply into a clear liquid, which crystallises again unchanged on cooling","boils and evaporates unchanged, leaving no residue in the container","turns into glucose only, because heat alone breaks the glycosidic bond"],0,"Further heating dehydrates it to carbon. Sucrose can burn with KNO₃ as 'rocket candy'.","Sucrose heated to 186 °C does not melt cleanly, but decomposes to caramel (caramelisation).",1],["Sucrose gives no reaction with Benedict's reagent. After boiling with dilute HCl, it gives a positive result. Why?",["the acid oxidises sucrose to gluconic acid, which then gives the red precipitate","hydrolysis gives glucose and fructose (invert sugar), which are reducing sugars","the acid converts sucrose into lactose, a disaccharide that has a free hemiacetal group","the acid turns sucrose into starch, which is then able to reduce the copper(II) ions"],1,"The acid breaks the glycosidic bond. Lactose and maltose give a direct positive result.","Sucrose is non-reducing. Boil with HCl → glucose + fructose (invert sugar) → both reduce.",0],["Which of these sugars has no sucrose at all, even in the ripe fruit?",["sugarcane","mango","banana","grapes"],3,"Grapes, cherries, blueberries, figs, pomegranates, tomatoes, avocados, lemons and limes contain no sucrose in the notes.","Grapes have glucose and fructose but no sucrose. Pick grapes.",1],["Sugar alcohols (polyols) are:",["carbohydrates that are not sugars, used as sugar-free sweeteners","proteins that are made of amino acids joined by peptide bonds","sugars that are made of two monosaccharides joined by a glycosidic bond","lipids that are made of fatty acids joined to a glycerol backbone"],0,"Examples are sorbitol, mannitol, xylitol, maltitol, erythritol and isomalt. They can be used cup-for-cup, unlike saccharin and aspartame.","Polyols = sugar alcohols, not sugars. Used as sweeteners (sorbitol, xylitol).",0],["Sorbitol and mannitol are isomers. How do they differ?",["the presence of a carbonyl group","the number of OH groups","the orientation of the OH group at carbon 2","the number of carbon atoms"],2,"They have the same formula, C₆H₁₄O₆. Mannitol is made from mannose and sorbitol from glucose.","Sorbitol and mannitol differ only in the OH orientation at C2 (epimers).",0],["In the body, the polyol pathway converts glucose to sorbitol by which enzyme?",["amylase, using water","sorbitol dehydrogenase, using NAD⁺","aldose reductase, using NADPH","zymase, using ATP"],2,"Sorbitol dehydrogenase then converts sorbitol to fructose. Galactose is reduced to galactitol by the same enzyme.","Polyol pathway: aldose reductase + NADPH converts glucose to sorbitol.",0],["Which is a disadvantage of polyols such as sorbitol?",["they cause tooth decay in the same way as sucrose, by feeding the bacteria in the mouth","they raise blood sugar sharply, which is a risk for people with diabetes","they are far too sweet to be used in food, so they cannot replace sugar","they may cause gastrointestinal distress when taken in large amounts"],3,"Mannitol also has a low glycaemic index and does not absorb water until 98% humidity, so it is used for coating.","Polyols are poorly absorbed, so they may cause diarrhoea and bloating in excess.",0],["Oligosaccharides are carbohydrates with:",["more than 100 monosaccharide units, joined by glycosidic bonds","3 to 10 monosaccharide units joined by glycosidic bonds","2 monosaccharide units only, joined by one glycosidic bond","1 monosaccharide unit only, which has no glycosidic bond"],1,"Examples are raffinose, stachyose and the fructo-oligosaccharides (FOS).","Oligo = few: 3 to 10 units.",0],["In glycoproteins, oligosaccharides are N-linked and O-linked respectively to:",["asparagine, and serine or threonine","serine or threonine, and asparagine","lysine, and cysteine","tyrosine, and tryptophan"],0,"N-linked goes to the amine N of asparagine. O-linked goes to the OH of serine or threonine.","N-linked: asparagine (N). O-linked: serine/threonine (hydroxyl, O). N for Asn.",1],["Inulin and fructo-oligosaccharides are found in:",["milk, cheese, butter and other dairy products","meat, poultry and the cooked blood of animals","chicory, onions, leeks, asparagus and Jerusalem artichoke","fish, eggs, liver and other foods from animal sources"],2,"FOS are short chains of fructose, and inulin is a longer chain. They are only partly digested by humans.","Inulin sources: chicory, onions, leeks, asparagus, Jerusalem artichoke. Fructans.",0]]},{"t":"Polysaccharides","q":[["Polysaccharides are carbohydrates that:",["are made of amino acids joined by peptide bonds","are made of glycerol and fatty acids joined by ester bonds","are made of a large number of monosaccharide units joined by glycosidic bonds","are made of only two monosaccharide units joined by a glycosidic bond"],2,"They are polymers of sugars. They serve as energy stores or as structural material.","Poly = many. Polysaccharide = large number of monosaccharide units.",0],["Which pair of polysaccharides is used for energy storage?",["starch and cellulose","starch and glycogen","cellulose and chitin","glycogen and chitin"],1,"Cellulose (plants) and chitin (arthropods) are structural. Starch (plants) and glycogen (animals) are energy stores.","Energy storage pair: starch (plants) and glycogen (animals). Cellulose and chitin are structural.",0],["Chitin is a structural polysaccharide found in:",["plant cell walls","animal muscle cells","the liver of mammals","the exoskeleton of arthropods"],3,"Plants use cellulose and arthropods use chitin.","Chitin = exoskeleton of arthropods (insects, crabs). Also fungal walls.",0],["Another name for starch is:",["amylum","amylin","amylose","amylase"],0,"Amylose is only one component of starch, and amylase is the enzyme that digests it.","Starch = amylum. Latin 'amylum' gives amylose and amylase.",1],["Starch is described as:",["a red crystalline solid that is soluble in alcohol","a yellow, sweet, odourless liquid that is soluble in cold water","a colourless gas that is soluble in cold water","a white, tasteless, odourless powder that is insoluble in cold water and alcohol"],3,"It dissolves only on heating with water, forming a sticky paste.","Starch: white, tasteless, odourless powder, insoluble in cold water.",0],["Starch consists of which two molecules?",["cellulose and amylopectin","amylose and glycogen","linear, helical amylose and branched amylopectin","branched amylose and linear amylopectin"],2,"Amylose is a straight chain coiled into a helix. Amylopectin has branches.","Starch = amylose (linear, helical) + amylopectin (branched). Linear first, branched second.",0],["By weight, starch contains about:",["20–25% amylose and 75–80% amylopectin","75–80% amylose and 20–25% amylopectin","50% amylose and 50% amylopectin","40–45% amylose and 55–60% amylopectin"],0,"Amylopectin is the major part.","Amylose 20–25%, amylopectin 75–80%. Branched is the major part.",1],["Glycogen compares with amylopectin in that it is:",["linear instead of branched","similar, but more highly branched and more compact","similar, but less branched and less compact","identical in all respects"],1,"Glycogen is the animal analogue of starch. Its many branches allow quick release of glucose.","Glycogen = amylopectin but MORE branched and more compact.",0],["Which of these is a good source of starch?",["yam, cassava, maize and rice","palm oil and groundnut oil","milk and cheese","fish, eggs and meat"],0,"Tubers and grains are the main sources. Starchy food is sticky when heated.","Starch foods: yam, cassava, maize, rice. All staples. Skip any option with meat or fruit.",0],["What colour does iodine solution give with starch?",["colourless","yellow","red-brown","blue-black"],3,"Iodine fits inside the amylose helix and forms a blue-black complex. Without starch, iodine solution is brown.","Iodine + starch = blue-black. Iodine + glycogen = reddish-brown.",0],["Which group lists only non-starch polysaccharides?",["amylose, amylopectin and cellulose","amylum, amylose and hemicellulose","pectin, cellulose and hemicellulose","glycogen, amylopectin and pectin"],2,"Non-starch polysaccharides include pectin, cellulose, hemicellulose and hydrocolloids. Amylose, amylopectin and amylum (starch) are starch.","Non-starch polysaccharides: pectin, cellulose, hemicellulose. Starch and glycogen are excluded.",1],["A student says amylose and amylase are the same thing. Which statement is correct?",["both are enzymes that digest cellulose","amylose is a polysaccharide in starch, while amylase is an enzyme that digests starch","amylose is an enzyme that digests starch, while amylase is a polysaccharide in starch","both are polysaccharides in glycogen"],1,"The -ose ending usually shows a sugar. The -ase ending shows an enzyme.","Amylose = a polysaccharide (-ose). Amylase = an enzyme (-ase). '-ase' means enzyme.",1],["A pure cotton ball is mostly made of:",["chitin, over 90%","glycogen, over 90%","cellulose, over 90%","starch, over 90%"],2,"Wood and straw also contain cellulose.","Cotton = cellulose, over 90%. Nearly pure.",0],["Which of these is a branched polysaccharide, and which is unbranched?",["glycogen is branched, and cellulose is unbranched","cellulose is branched, and glycogen is unbranched","both are branched","both are unbranched"],0,"Glycogen is highly branched. Cellulose is a straight chain, and amylose is also unbranched.","Glycogen is branched; cellulose is unbranched (straight). Match each to its feature.",0],["What is the repeating unit and the bond in cellulose?",["fructose units joined by α-1,2 bonds","glucose units joined by β-1,4 glycosidic bonds","glucose units joined by α-1,4 glycosidic bonds","amino acids joined by peptide bonds"],1,"The β linkage makes the chain straight and tough. Starch has an α linkage instead.","Cellulose = β-glucose joined by β-1,4 bonds. Starch is α-1,4.",0],["Cellulose chains are bundled into strong fibres because:",["the chains are highly branched, so they lock into each other like a mesh","the chains are joined by ionic bonds between positively and negatively charged groups","the chains are joined by disulphide bridges between sulphur-containing side chains","many –OH groups form hydrogen bonds between neighbouring chains"],3,"That makes cellulose insoluble in water and resistant to chemical attack.","Many –OH groups form H bonds between chains, making strong fibres.",0],["Cellulose is:",["the most abundant carbohydrate, and is the main structural component of plant cell walls","a disaccharide found in milk, made of galactose and glucose","found only in arthropods, where it forms the hard outer exoskeleton","the main energy store of animals, kept in the liver and muscle cells as granules"],0,"Cotton is over 90% cellulose. Wood and straw are also rich in it.","Cellulose = most abundant carbohydrate, structural material of plants.",0],["Why can humans not digest cellulose?",["cellulose is too soluble to be digested","cellulose is a protein and cannot be digested","we lack the enzyme amylase, which breaks the β-1,4 bond","we lack the enzyme cellulase, which breaks the β-1,4 bond"],3,"Termites and ruminants such as goats and sheep digest it through cellulase, produced mainly by microbes in their guts. Human amylase only breaks the α-1,4 bond.","Humans lack cellulase, which breaks β-1,4 bonds. Our amylase only cuts α-links.",1],["Dietary fibre (roughage) is useful because it:",["provides amino acids for growth, since it is broken down to protein in the gut","provides vitamins for the blood, since it is rich in vitamin B₁₂ and iron","helps digestion, regulates bowel movement and helps in weight control","provides most of the energy in the diet, since it is fully digested and absorbed"],2,"High-fibre foods include whole grains, vegetables, fruits and nuts.","Fibre helps digestion, regulates bowel movement, lowers cholesterol. Not an energy source.",0],["Which of these is made from cellulose?",["glass and ceramics","paper, cardboard, cellophane and rayon","soap and candles","plastic bags and bottles"],1,"Hydrolysis followed by hydrogenation gives sorbitol.","Cellulose products: paper, cardboard, cellophane, rayon. All plant-fibre materials.",0],["A biopolymer is:",["a polymer made by living organisms","a polymer made only from petroleum","a polymer that is not biodegradable","a polymer made only in laboratories"],0,"Starch, cellulose, proteins and DNA are biopolymers. Biomass is the material of living organisms.","Biopolymer = polymer made by living organisms. 'Bio' = made by life.",0],["Glycogen is the energy store in:",["bacteria only","plants only","animals only","animals and fungi"],3,"It is stored in the liver and muscle cells. Plants store starch.","Glycogen = animal (and fungi) energy store. Plants use starch.",1],["In which two places is glycogen mainly stored in the human body?",["the skin and the bones","the liver and the muscle cells","the brain and the kidneys","the heart and the lungs"],1,"It is stored with about 3–4 parts of water for each part of glycogen.","Glycogen stored in liver and muscle cells. Two places.",0],["Muscle glycogen and liver glycogen differ in that:",["both supply glucose only to the brain, because the central nervous system is the only organ that stores glycogen","muscle glycogen supplies glucose to the whole body including the brain, while liver glycogen supplies glucose to the muscle only","muscle glycogen supplies glucose to the muscle only, while liver glycogen supplies glucose to the whole body including the central nervous system","neither can be converted back to glucose, because glycogen is only a structural molecule in animal cells"],2,"The liver can release glucose into the blood. Muscle keeps its glycogen for its own use.","Liver glycogen feeds the whole body (blood glucose). Muscle glycogen feeds only the muscle.",1],["Which is the primary long-term energy store of the body, and which is the secondary?",["glycogen is primary, and fat in adipose tissue is secondary","protein is primary, and fat in adipose tissue is secondary","starch is primary, and glycogen is secondary, in the liver and muscle","fat in adipose tissue is primary, and glycogen is secondary"],3,"Glycogen is quickly available, but it is less compact than fat, so the body stores far less of it.","Fat in adipose tissue = primary long-term store; glycogen = secondary (short-term).",1],["When carbohydrate intake is restricted, the body breaks down fat for energy. This state is called:",["acidosis","fermentation","ketosis","glycolysis"],2,"The fats are converted to ketone bodies.","Fat burning when carbs are low = ketosis (ketone bodies).",0],["Compare glycogen and triglycerides as energy stores. Which statement is correct?",["glycogen is mobilised quickly, but it is less compact than triglycerides","glycogen is mobilised slowly, and it is more compact than triglycerides","glycogen is mobilised quickly, and it is more compact than triglycerides","glycogen and triglycerides are the same"],0,"Glycogen is hydrated with water, so it takes more space per unit of energy.","Glycogen: quick to mobilise but less compact. Fat: more energy per gram, slower to use.",1],["Amylose is a polymer of glucose with a repeat of about:",["2 glucose units","300–600 glucose units","over 1,000,000 glucose units","10–20 glucose units"],1,"Amylose is long and unbranched. Cellulose can be larger, with a molecular weight of about 150,000 to 1,000,000.","Amylose: 300–600 glucose units. Amylopectin is far larger.",1],["Which property of starch makes it useful in food and industry?",["being a good conductor of heat, which makes cooking faster","being highly volatile, which makes it a good solvent for paints","transparency, viscosity and tensile strength","being a strong acid, which makes it a good preservative"],2,"Starchy foods also become sticky when heated.","Starch: transparency, viscosity, tensile strength. Used as thickener and gel.",0],["Which pair correctly matches a polysaccharide and its linkage?",["amylose with β-1,4 bonds, and cellulose with α-1,4 bonds","amylose and cellulose, both with α-1,6 bonds","amylose with peptide bonds, and cellulose with ester bonds","amylose with α-1,4 bonds, and cellulose with β-1,4 bonds"],3,"Amylopectin has α-1,4 bonds in the chain and α-1,6 bonds at branch points.","Amylose α-1,4, cellulose β-1,4. Match α with starch, β with cellulose.",0],["Which of these is a polysaccharide of fructose?",["inulin","cellulose","amylose","glycogen"],0,"Inulin has a higher degree of polymerisation than FOS. Amylose, glycogen and cellulose are polymers of glucose.","Inulin = fructose polymer. 'Inu-' linked to fructans. Only polysaccharide of fructose here.",1]]},{"t":"Proteins","q":[["Proteins are best described as:",["nitrogen-containing organic compounds made of amino acids joined by peptide bonds","compounds of carbon, hydrogen and oxygen only, made of sugar units","chains of nucleotides joined by phosphate bonds","esters of glycerol with long-chain fatty acids"],0,"They are found in all living matter. Carbon is 50–55%, oxygen about 23%, nitrogen 15–18%, hydrogen 6.6–7.3% and sulphur about 0.2%.","Protein = N-containing compounds made of amino acids. Amino acid is the building block.",0],["Which element is present in all proteins but NOT in carbohydrates or fats?",["hydrogen","nitrogen","carbon","oxygen"],1,"Carbohydrates and fats have C, H and O only. Proteins also contain about 15–18% nitrogen. Sulphur is present in some.","N is in every protein but not in carbohydrates or fats (only C, H, O). Pick nitrogen.",1],["Some proteins also contain which elements besides C, H, O, N and S?",["fluorine and helium","sodium, chlorine and potassium only","silicon and aluminium","phosphorus, iodine and iron"],3,"Examples are casein (phosphorus), thyroglobulin (iodine) and haemoglobin (iron).","Extra elements in some proteins: phosphorus, iodine, iron. Think casein (P), thyroglobulin (I), haemoglobin (Fe).",0],["The peptide linkage is:",["–C–O–C–, formed between the hydroxyl groups of two neighbouring amino acids with loss of water","–NH–NH–, formed between the amino groups of two neighbouring amino acids with loss of hydrogen","–CO–NH–, formed between the carboxyl group of one amino acid and the amino group of the next","–CO–O–, formed between the carboxyl groups of two neighbouring amino acids with loss of water"],2,"It is an amide bond. Water is lost when it forms.","Peptide bond = –CO–NH–, between COOH of one and NH₂ of the next. Water is lost.",0],["Which is the simplest amino acid?",["valine, where R = CH(CH₃)₂","alanine, where R = CH₃","glycine, where R = H","serine, where R = CH₂OH"],2,"Glycine has no side chain except hydrogen. It is the only common amino acid with no chiral carbon.","Simplest amino acid = glycine (R = H). Only one that is not chiral.",0],["All amino acids found in proteins are:",["β-amino acids, with the NH₂ group two carbons from the COOH group","α-amino acids, with the NH₂ group on the carbon next to the COOH group","γ-amino acids, with the NH₂ group three carbons from the COOH group","amino acids with the NH₂ group on the COOH carbon"],1,"The α-carbon carries the amino group, the carboxyl group, H and the R group.","Protein amino acids are α-amino acids: NH₂ on the carbon next to COOH.",0],["Amino acids are described as amphoteric because they:",["can react as an acid by donating a proton, or as a base by accepting one","can only react as bases because of the –NH₂ group, since the –COOH group is inert","can only react as acids because of the –COOH group, since the –NH₂ group is inert","are neither acidic nor basic, because the two groups cancel out each other's charges completely"],0,"They contain –NH₂ (basic) and –COOH (acidic). The form depends on the pH, as cation, zwitterion or anion.","Amphoteric = acts as an acid or a base. Can donate or accept H⁺.",0],["A zwitterion is:",["an ion with no charge on either group, which is the form found at very high pH only","a molecule with two positive charges on the same amino acid, so it is attracted to the cathode","a molecule with two negative charges on the same amino acid, so it is attracted to the anode","an internal salt, with –NH₃⁺ and –COO⁻ in the same molecule, so it is electrically neutral"],3,"It has both charges, and the total charge is zero.","Zwitterion = internal salt, –NH₃⁺ and –COO⁻ in the same molecule. Net charge zero.",0],["In the zwitterion, which group gives the acid property and which gives the basic property?",["both properties come from –NH₃⁺","the acidic property comes from –NH₃⁺, and the basic property from –COO⁻","both properties come from –COO⁻","the acidic property comes from –COO⁻, and the basic property from –NH₃⁺"],1,"–NH₃⁺ can give up H⁺, so it is the acid. –COO⁻ can accept H⁺, so it is the base. It is the opposite of what you might guess from the original groups.","–NH₃⁺ donates H⁺ (acid). –COO⁻ accepts H⁺ (base). Do not swap them.",1],["In an electric field in an acidic solution, an amino acid exists as a cation. It moves toward the:",["cathode","anode","both electrodes","neither electrode"],0,"Positive ions go to the negative electrode (cathode).","Cation in acid, so it moves to the cathode (negative). Cation → cathode.",0],["In an alkaline solution, an amino acid exists as an anion. It moves toward the:",["neither electrode","both electrodes","cathode","anode"],3,"Negative ions go to the positive electrode (anode).","Anion in alkali, so it moves to the anode (positive). Anion → anode.",0],["The isoelectric point of an amino acid is:",["the pH of pure water, which is exactly 7 for every amino acid and protein","the pH at which it exists only as a cation and moves steadily toward the cathode","the pH at which it exists as the zwitterion and is not moved by an electric current","the pH at which it exists only as an anion and moves steadily toward the anode"],2,"At this pH, the net charge is zero. The amino acid does not migrate in the field.","Isoelectric point = pH where the zwitterion dominates and the net charge is zero. No movement in the field.",0],["How many essential amino acids are there for adult humans, and for children?",["eight for adults and eight for children, because arginine and histidine can be made by the body","ten for adults and nine for children, because arginine is essential only for adults","twenty for adults and twenty for children, because all the amino acids must come from food","nine for adults and ten for children, because arginine is essential only for children"],3,"The notes list lysine, histidine, arginine, threonine, valine, methionine, tryptophan, leucine, isoleucine and phenylalanine, with arginine as the extra one for children.","Essential: 9 for adults, 10 for children (arginine added). Children = 10.",1],["Which of these is an essential amino acid?",["alanine","lysine","serine","glycine"],1,"The body cannot make essential amino acids, so they must come from food. Glycine, alanine, serine, tyrosine, cysteine, proline, aspartic acid and glutamic acid are non-essential.","Essential ones come from the diet: lysine, leucine, valine, threonine, tryptophan, phenylalanine, methionine, isoleucine, histidine. Spot lysine.",0],["Which of these is a NON-essential amino acid?",["methionine","phenylalanine","tyrosine","tryptophan"],2,"Tyrosine can be made from phenylalanine. The other three are essential.","Tyrosine is made from phenylalanine, so non-essential. Phenylalanine is the essential one.",1],["An amino acid with one amino group and two carboxyl groups is called:",["acidic, such as aspartic acid and glutamic acid","aromatic, such as phenylalanine and tyrosine","neutral, such as glycine and alanine","basic, such as lysine and arginine"],0,"The extra COOH gives the acidic character.","Two COOH + one NH₂ = acidic amino acid (aspartic, glutamic acid). More acid group.",0],["Which amino acids are basic?",["glycine and alanine","lysine, arginine and histidine","aspartic acid and glutamic acid","serine and threonine"],1,"Basic amino acids have two amino groups (or a basic nitrogen group) and one carboxyl group.","Basic amino acids: lysine, arginine, histidine. Extra N groups.",0],["Which amino acids contain sulphur?",["alanine and valine","serine and threonine","methionine and cysteine","lysine and arginine"],2,"Cystine is the oxidised form of two cysteines linked by a disulphide bond.","Sulphur: methionine and cysteine. Both 'S' words.",0],["Which pair are aromatic amino acids?",["phenylalanine and tyrosine","lysine and arginine","glycine and alanine","serine and cysteine"],0,"They contain a benzene ring in the side chain. This is why they respond to the xanthoprotein test.","Aromatic: phenylalanine and tyrosine (benzene ring).",0],["A dipeptide contains how many peptide bonds?",["2","3","0","1"],3,"A tripeptide has two peptide bonds. The number of peptide bonds is always one less than the number of amino acids in a chain.","Dipeptide = 2 amino acids = 1 peptide bond. Bonds = residues − 1.",1],["By convention, a peptide with a molecular weight up to 10,000 is called:",["an amino acid, with larger ones called peptides","a polypeptide, with larger ones called proteins","a protein, with smaller ones called polypeptides","a dipeptide, with larger ones called proteins"],1,"Large polypeptides with defined structure and function are proteins.","Peptide up to 10,000 mol. wt = polypeptide; above that = protein.",0],["Which of these forces stabilise the structure of proteins?",["only hydrogen bonds, since they are the only forces strong enough to hold the chain","only van der Waals forces, since proteins are nonpolar molecules throughout","hydrophobic forces, hydrogen bonds, ionic interactions and covalent linkages","only covalent bonds, since the peptide bonds alone hold the whole three-dimensional shape"],2,"The covalent linkage in the tertiary structure is the disulphide bond.","Protein stability: hydrophobic forces, H bonds, ionic interactions, disulphide bridges. Pick the all-inclusive list.",0],["The primary structure of a protein is:",["the α-helix or β-pleated sheet arrangement","the folding of the chain into a three-dimensional shape","the interaction between several polypeptide chains","the sequence of amino acids from the N-terminal to the C-terminal end"],3,"The N-terminal end has the free amino group and the C-terminal end has the free carboxyl group.","Primary structure = amino acid sequence, N-terminal to C-terminal. Order only.",0],["Which structures belong to the secondary structure of proteins, and which bonds hold them?",["the α-helix, the β-pleated sheet and the collagen helix, held by hydrogen bonds","the interaction between chains, held by ionic bonds","the sequence of amino acids, held by peptide bonds","the α-helix, the β-pleated sheet and the collagen helix, held by disulphide bonds"],0,"Hydrogen bonds form between the C=O and the N–H of the peptide groups.","Secondary: α-helix, β-pleated sheet, collagen helix, held by H bonds.",0],["Which bond is found in the tertiary structure of a protein but NOT in the secondary structure?",["the peptide bond","the hydrogen bond","the ester bond","the covalent disulphide linkage"],3,"Tertiary structure is held by hydrogen bonds, hydrophobic linkages, salt linkages and disulphide linkages. The secondary structure is held by hydrogen bonds only.","Disulphide (S–S) is covalent and appears in tertiary structure (not in secondary).",1],["Quaternary structure refers to:",["the α-helix or β-sheet arrangement found in one polypeptide chain","the interaction between or among two or more polypeptide chains","the sequence of amino acids in one polypeptide chain, from the N-terminal end","the disulphide bridges that fold one polypeptide chain into a compact shape"],1,"Haemoglobin, with four chains, is an example. It is held by H-bonds, salt linkages and hydrophobic interactions.","Quaternary = two or more polypeptide chains interacting. Haemoglobin has 4.",0],["Denaturation of a protein is:",["the disruption of the protein's structure, without necessarily breaking the peptide bonds, giving a random coil","the breaking of all the peptide bonds to form free amino acids, so the primary structure is lost","the addition of extra amino acids to the end of the chain by enzymes during protein synthesis","the formation of new peptide bonds between the chains to give a larger and more stable molecule"],0,"The primary structure remains. The higher structures are lost.","Denaturation = structure disrupted, primary sequence intact. Peptide bonds are not broken.",1],["Which of these can denature a protein?",["cooling to 10 °C, since low temperature breaks the hydrogen bonds","dissolving in pure water at neutral pH, since proteins are unstable in solution","heat, extreme pH, alcohol, acetone, urea and ionising radiation","adding water at room temperature, since water makes the chains fall apart"],2,"High pressure is also a cause.","Denaturing agents: heat, extreme pH, alcohol, acetone, urea, ionising radiation. Heat and pH are the standards.",0],["What changes occur when a protein is denatured?",["it keeps its function and becomes less soluble","it gains biological function and becomes more soluble","it loses its biological function and becomes less soluble","it keeps its function and becomes more soluble"],2,"Other effects are an increase in viscosity, an increased tendency toward digestion by proteolytic enzymes and decreased crystallisation.","After denaturing: loses function and becomes less soluble (coagulates, like cooked egg white).",0],["The Biuret test detects:",["peptide bonds, and gives a violet colour with NaOH and CuSO₄","benzene rings, and gives a yellow colour with nitric acid","starch, and gives a blue-black colour with iodine","tyrosine, and gives a red colour with Millon's reagent"],0,"A dipeptide gives no colour, since at least two peptide bonds are needed.","Biuret: peptide bonds, violet colour with NaOH + CuSO₄. Need at least two peptide bonds.",0],["Millon's reagent is a solution of mercury in nitric acid. What does it test for?",["the peptide bond, which gives a violet colour","the tyrosine residue, which gives a red colour on heating","the sulphur atom, which gives a black colour","the glycine residue, which gives a blue colour"],1,"A white precipitate forms first and turns red on heating.","Millon's: tyrosine (phenol group), red colour. Hg in HNO₃.",0],["The xanthoproteic test gives which colour with concentrated nitric acid, and with excess ammonia?",["red and then yellow","violet and then red","blue and then green","yellow and then orange"],3,"Concentrated HNO₃ nitrates the benzene ring of aromatic amino acids. Adding excess ammonia deepens the colour to orange.","Xanthoproteic: conc. HNO₃ gives yellow, excess ammonia gives orange. Needs aromatic residues.",0],["Which pair of tests and their targets is correctly matched?",["Biuret for peptide bonds, and Millon's for tyrosine","Millon's for peptide bonds, and xanthoproteic for sulphur","Biuret for sulphur, and xanthoproteic for peptide bonds","Biuret for tyrosine, and Millon's for peptide bonds"],0,"Xanthoproteic is for aromatic rings, such as in phenylalanine, tyrosine and tryptophan.","Match tests to targets: Biuret → peptide bond, Millon's → tyrosine, xanthoproteic → aromatic ring. Eliminate pairs that swap.",1],["Amino acids react with sodium hydroxide to form:",["an ester, and with hydrochloric acid to form an amide","a sodium salt, and with hydrochloric acid to form a sodium salt","an alcohol, and with hydrochloric acid to form a ketone","a sodium salt, and with hydrochloric acid to form a hydrochloride"],3,"The COOH reacts with the base, and the NH₂ reacts with the acid. This is the amphoteric nature.","Amino acid + NaOH → sodium salt; + HCl → hydrochloride (amino salt). Amphoteric, both reactions work.",0]]},{"t":"Isolation and Purification","q":[["Isolation and purification of an organic compound means:",["the addition of impurities to improve the substance","the destruction of the substance by heat","the physical separation of the substance of interest from contaminants","the chemical conversion of the substance into a new compound"],2,"The aim is to get the wanted compound alone. Physical methods such as filtration and distillation are used.","Isolation and purification = physical separation of the wanted compound. 'Separation' is the keyword.",0],["Affinity purification works by:",["retaining the protein on a column through its specific binding to an immobilised antibody, enzyme or receptor","passing the mixture through filter paper that holds back the protein because of its large size alone","adding a salt that turns the protein into a gas, which is then condensed in a separate flask","boiling the mixture until only the protein is left in the flask, since the protein has the highest boiling point"],0,"The wanted protein sticks to its partner on the column. The rest washes through.","Affinity purification: the protein sticks to a column through specific binding. Specificity is the clue.",0],["Filtration separates:",["a dissolved solid from its solvent, using a membrane that retains the dissolved ions","an insoluble solid from a liquid, using a porous sheet that retains the solid","two liquids with different boiling points, using a column that retains the heavier one","two gases from each other, using a sheet that retains the heavier gas"],1,"The solid is the residue and the liquid is the filtrate.","Filtration: insoluble solid from liquid, through a porous medium (filter paper).",0],["Centrifugation separates particles by:",["passing the liquid through a column of charcoal, so that the particles stick to it","cooling the liquid until crystals form, so that the particles can be filtered off","heating the liquid until it evaporates, so that the particles are left behind","spinning at high speed so that fine particles settle at the bottom"],3,"It is useful when the particles are too fine for filtration.","Centrifugation: spin at high speed, fine particles settle. Use it when filter paper fails.",0],["Evaporation is used to:",["remove solids from a liquid by filtration","separate two solids","separate two volatile liquids","remove volatile liquids from non-volatile solutes"],3,"The solvent is vapourised and the solute stays behind.","Evaporation removes a volatile liquid from a non-volatile solute. Salt from seawater.",0],["In liquid–liquid extraction, the desired compound is:",["retained on a charcoal bed, so that the other components wash
