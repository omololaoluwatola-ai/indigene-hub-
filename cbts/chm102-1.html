the sticking of a substance on a surface. Chromatography uses adsorption and desorption on a packed bed.","Adsorption: sticks on the SURFACE of a solid (charcoal). Hence 'trapping on the surface'.",0],["What is the difference between adsorption and absorption?",["they mean exactly the same thing","adsorption is attachment on a surface, while absorption is uptake into the bulk of the material","adsorption is uptake into the bulk, while absorption is attachment on a surface","adsorption involves gases only, and absorption involves liquids only"],1,"Activated carbon works by adsorption. A sponge soaking up water is absorption.","Adsorption = on the surface. Absorption = into the bulk. The 'd' for dust on the surface.",1],["Which solid is commonly used to adsorb coloured impurities?",["activated charcoal (activated carbon)","chalk (calcium carbonate powder)","sand (silicon dioxide grains)","common salt (sodium chloride crystals)"],0,"It has a very large surface area. It is used in water purification and in decolourising solutions.","Coloured impurities → activated charcoal. Easy pick.",0],["Smelting is the method used to:",["separate crude oil into fractions by heating it in a tall column","obtain sugar from sugarcane juice by evaporating it","purify water by boiling it and condensing the steam","extract metals from their ores by heating with a reducing agent"],3,"Iron ore is smelted with coke in a furnace.","Smelting: extract metals from ores by heating with a reducing agent (carbon).",0],["In the refining of petroleum, crude oil is separated into fractions according to:",["their solubility in water","their density only","their colour","their condensation (boiling) points"],3,"Heavier fractions condense lower in the column. Lighter ones go higher.","Petroleum fractions separate by boiling (condensation) points. Light fractions rise highest.",0],["Distillation separates liquids according to:",["their relative solubility","their relative volatility","their relative colour","their relative charge"],1,"It is used in petroleum refining and in ethanol purification.","Distillation separates by volatility. Most volatile boils off first.",0],["Which method would you use to separate a mixture of ethanol (bp 78 °C) and water (bp 100 °C)?",["fractional distillation","crystallisation","centrifugation","filtration"],0,"The two liquids are miscible and have different boiling points. Ethanol, the more volatile, comes off first.","Ethanol 78 °C and water 100 °C are miscible with close boiling points. Fractional distillation.",0],["Can pure ethanol be obtained from an ethanol–water mixture by ordinary distillation?",["No, because ethanol does not boil at all when it is mixed with water in any proportion","Yes, ordinary distillation gives 100% ethanol, because ethanol has a lower boiling point than water","No, the best that can be reached is about 95% ethanol, and benzene or another entrainer is needed to reach absolute alcohol","Yes, because water has a lower boiling point than ethanol, so it distils first and leaves pure ethanol"],2,"Ethanol and water form a constant-boiling mixture. This links to the chapter on alcohols, where benzene is added and the mixture is redistilled at 78.3 °C.","Ordinary distillation reaches about 95% ethanol (azeotrope). Pure ethanol needs more steps. Answer: No.",1],["Fractionation, as a purification method, means:",["repeating a purification method that is not sufficient on its own, to reach higher purity","heating the sample to the highest possible temperature, so that impurities burn off","adding more impurities to the sample, so that the pure compound can be seen clearly","using a very strong acid to purify the sample, in one single step"],0,"Fractional distillation and fractional crystallisation are examples.","Fractionation = repeating a method that did not separate enough. Repeat to improve.",0],["Sublimation is the process in which:",["a liquid changes directly to a solid without passing through the gas phase on cooling","a solid changes directly to a gas without passing through the liquid phase","a gas dissolves in a liquid and is then released again when the solution is heated","a solid melts and then boils at a higher temperature to form a vapour"],1,"Iodine, naphthalene and ammonium chloride sublime. The vapour is cooled to regain the solid.","Sublimation: solid straight to gas, skipping liquid. Think of iodine vapour.",0],["Which of these substances can be purified by sublimation?",["sucrose and starch","sodium chloride and glucose","iodine and naphthalene","sand and glass"],2,"Substances that sublime have fairly weak forces between molecules. Ionic solids like NaCl do not sublime on gentle heating.","Sublimes: iodine and naphthalene (also ammonium chloride). Skip salt and sugar.",1],["Bioleaching is the extraction of metals from ores using:",["high temperatures only","strong acids only","electrolysis only","living organisms such as bacteria"],3,"It is used for copper and gold. The microbes oxidise the mineral and release the metal.","Bioleaching = metals extracted using bacteria. Living organisms in the option.",0],["Downstream processing is the stage in which:",["products such as antibiotics, citric acid, vitamin E and insulin are recovered and purified after fermentation","the raw materials are grown and harvested on the farm before they reach the factory","the microbes are selected and cultured before they are added to the fermenter vessel","the fermenter vessel is designed and built to withstand the pressure of the process"],0,"It follows fermentation. It includes filtration, extraction and crystallisation.","Downstream processing = recovery and purification of the product after fermentation (antibiotics, citric acid).",0],["Electrolysis is a purification method used to:",["separate two liquids by boiling them and condensing the vapours in a long column","purify metals such as copper by passing an electric current through a solution","remove colour from a sugar solution by passing it through activated carbon","separate proteins by size using a gel that holds back the larger molecules"],1,"In copper refining, pure copper is deposited on the cathode.","Electrolysis purifies metals like copper. Pure copper is the cathode.",0],["Which separation method is suitable for removing fine suspended solids that pass through the filter paper?",["smelting","evaporation","sublimation","centrifugation"],3,"A high-speed spin forces the fine particles to settle.","Fine solids that pass through filter paper: centrifuge them.",0],["In chromatography, the separation is based on:",["the different electrical charges of the components, and nothing else at all","the different colours of the components, which are separated by a filter","adsorption and desorption of the components on a packed bed","the different densities of the components, which settle in layers"],2,"Components that stick more to the packed bed move more slowly.","Chromatography: adsorption and desorption on a stationary phase. Components travel at different rates.",0],["Which method is used to purify water in the notes, and what is one purpose of the method?",["smelting, which melts the water impurities out of the ore so that clean water can be collected","fractionation, which adds extra impurities to the water so that it can be separated afterwards","water purification, to remove contaminants such as suspended solids and microbes so that it is safe to drink","evaporation, which adds dissolved salt to the water so that it becomes safe to drink in the end"],2,"It may combine filtration, adsorption and disinfection.","Water purification removes contaminants (microbes, solids, chemicals). Pick that.",0],["How would you separate a mixture of sand and sugar in water?",["smelt the mixture in a furnace, and then distil the sugar from the molten sand","evaporate the water first, and then filter the dry mixture to remove the sand from the sugar","centrifuge the mixture, and then sublime the sugar from the sand left at the bottom","filter off the sand, and then evaporate or crystallise the sugar from the filtrate"],3,"Sand is insoluble and stays on the filter paper. Sugar is dissolved, so it passes through.","Sand + sugar in water: filter sand, then evaporate or crystallise the sugar. Filter first.",0],["A student recrystallises benzoic acid. The best solvent for recrystallisation is one that dissolves the compound:",["well when hot, but poorly when cold","poorly at both temperatures","well when cold, but poorly when hot","equally well when hot and cold"],0,"On cooling, the compound comes out of solution as pure crystals, and the impurities stay dissolved.","Best recrystallisation solvent: dissolves the compound well when hot, poorly when cold.",1],["Which of these is a purity check for a solid organic compound after recrystallisation?",["a low density","a sharp melting point","a high boiling point","a bright colour"],1,"Impurities lower and broaden the melting range. A pure compound melts sharply at one temperature.","Sharp melting point = pure solid. Easy purity check.",0],["A solid sample melts over a wide range, starting well below the literature value. What does this suggest?",["the sample has no impurities but is damp","the sample is a gas","the sample is impure","the sample is very pure"],2,"Impurities lower the melting point and make the range wider. That is why melting point is used to check purity.","Wide melting range and low start = impure. Impurity lowers and widens mp.",1],["Which method would you choose to separate two miscible liquids with close boiling points?",["centrifugation, spinning the mixture so that the denser liquid settles","fractional distillation, using a fractionating column","sublimation, heating the mixture so that one liquid turns directly to a gas","simple filtration, using filter paper to hold back the liquid with the higher boiling point"],1,"The column gives repeated condensation and evaporation. This is the same idea as the fractionating column used to distil off an aldehyde while it is being formed from an alcohol.","Miscible liquids, close boiling points: fractional distillation with a fractionating column.",0],["Which pair of methods is used to purify a solid and a liquid respectively?",["recrystallisation for the solid, and distillation for the liquid","distillation for the solid, and recrystallisation for the liquid","filtration for both, since filter paper holds back the impurities in each case","sublimation for the liquid, and smelting for the solid"],0,"Solids are purified by crystallisation methods, and liquids by distillation.","Solid → recrystallisation. Liquid → distillation. Match solid with crystals, liquid with boiling.",0]]}];
const SUBJECT_KEY = 'chm102';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// flatten
const ALL = [];
DATA.forEach((c,ci)=>c.q.forEach((q,qi)=>ALL.push({id:ci+'_'+qi, ch:ci, stem:q[0], opts:q[1], ans:q[2], exp:q[3], hack:q[4], trap:q[5]})));
const TOTAL = ALL.length;
// questions already served in earlier runs (kept per browser) so new runs favour fresh ones
let SEEN = new Set();
try{ SEEN = new Set(JSON.parse(localStorage.getItem('chm102_seen')||'[]')); }catch(e){}
function saveSeen(){ try{ localStorage.setItem('chm102_seen', JSON.stringify([...SEEN])); }catch(e){} }
// shuffle, then put unseen questions first (random order inside each half)
function freshFirst(arr){ const a=shuffle(arr.slice()); return a.filter(q=>!SEEN.has(q.id)).concat(a.filter(q=>SEEN.has(q.id))); }
const FULL_N = 500;
// fair sample: every chapter is represented in proportion to its size
function sampleFair(n){
  const groups = DATA.map((_,ci)=>freshFirst(ALL.filter(q=>q.ch===ci)));
  const exact = groups.map(g=>g.length*n/TOTAL);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a,b)=>a+b,0);
  exact.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([f,i])=>{ if(left>0 && take[i]<groups[i].length){ take[i]++; left--; } });
  let out=[]; groups.forEach((g,i)=>{ out=out.concat(g.slice(0,take[i])); });
  return shuffle(out);
}

// optional access gate (cbt-lock.js) — never breaks the quiz if missing
let lock = null;
async function loadLock(){
  try { lock = await import('../cbt-lock.js'); }
  catch(e){ try { lock = await import('/cbt-lock.js'); } catch(e2){ lock = null; } }
}
const lockReady = loadLock();

let mode = 'full', sel = new Set(), run = [], idx = 0;

function renderSetup(){
  const quick = 50, half = 250;
  const cards = [
    ['full', FULL_N, 'Full CBT'],
    ['quick', quick, 'Quick Drill'],
    ['half', half, 'Half Run'],
    ['session', '🎯', 'By Chapter']
  ];
  $('runs').innerHTML = cards.map(c=>`<button class="run${c[0]===mode?' sel':''}" data-m="${c[0]}"><span class="n">${c[1]}</span>${c[2]}</button>`).join('');
  document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; renderSetup(); });
  $('chaps').classList.toggle('show', mode==='session');
  $('chapList').innerHTML = DATA.map((c,i)=>`<div class="chap${sel.has(i)?' on':''}" data-i="${i}"><span class="box" style="border-radius:50%">${sel.has(i)?'●':''}</span><span class="nm">Ch ${i+1}. ${esc(c.t)}</span><span class="ct">${c.q.length}</span></div>`).join('');
  document.querySelectorAll('.chap').forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; sel.clear(); sel.add(i); renderSetup(); });
}

function makeItem(q){
  return { q, perm: shuffle([0,1,2,3]), pick: null };   // perm = order of original options shown (Fisher–Yates)
}

async function startQuiz(){
  if(mode==='session' && sel.size===0){ toast('Pick a chapter first'); return; }
  try{ await lockReady; }catch(e){}
  if(lock && typeof lock.checkCbtAccess==='function'){
    try{
      const r = await lock.checkCbtAccess(SUBJECT_KEY);
      if(r && r.blocked){ lock.renderCbtLockScreen($('app'), r.reason); return; }
    }catch(e){}
  }
  let pool;
  if(mode==='full') pool = sampleFair(FULL_N);
  else if(mode==='quick') pool = freshFirst(ALL).slice(0,50);
  else if(mode==='half') pool = sampleFair(250);
  else {
    pool = [];
    [...sel].sort((a,b)=>a-b).forEach(ci=>{ pool = pool.concat(shuffle(ALL.filter(q=>q.ch===ci))); });
  }
  begin(pool);
}

let startedAt = 0, isRetry = false, saved = false;
function begin(pool, retry){
  run = pool.map(makeItem); idx = 0; startedAt = Date.now(); isRetry = !!retry; saved = false;
  if(!retry){ pool.forEach(q=>SEEN.add(q.id)); if(SEEN.size >= TOTAL) SEEN = new Set(); saveSeen(); }
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  window.scrollTo(0,0);
  renderQ();
}

function counts(){
  let ok=0,no=0;
  run.forEach(it=>{ if(it.pick!==null){ it.pick===it.q.ans ? ok++ : no++; } });
  return {ok,no};
}

function renderQ(){
  const it = run[idx], q = it.q, c = counts();
  $('qpos').textContent = `Q ${idx+1} / ${run.length}`;
  $('sOk').textContent = c.ok; $('sNo').textContent = c.no;
  $('bar').style.width = ((c.ok+c.no)/run.length*100)+'%';
  $('chtag').textContent = `Ch ${q.ch+1} · ${DATA[q.ch].t}`;
  $('qtext').textContent = q.stem;
  const L = ['A','B','C','D'];
  const answered = it.pick!==null;
  $('opts').innerHTML = it.perm.map((oi,pos)=>{
    let cls='opt';
    if(answered){ cls+=' locked'; if(oi===q.ans) cls+=' correct'; else if(oi===it.pick) cls+=' wrong'; }
    return `<button class="${cls}" data-oi="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join('');
  if(!answered) document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  renderFb();
  $('prev').disabled = idx===0;
  $('next').textContent = idx===run.length-1 ? 'Finish ▶' : 'Next ▶';
}

function renderFb(){
  const it = run[idx], q = it.q;
  if(it.pick===null){ $('fb').innerHTML=''; return; }
  const good = it.pick===q.ans;
  const pos = 'ABCD'[it.perm.indexOf(q.ans)];
  $('fb').innerHTML = `<div class="fb">
    ${q.trap?'<span class="trap">⚠ TRAP QUESTION</span>':''}
    <div class="v ${good?'ok':'no'}">${good?'✅ Correct!':'❌ Not quite — the answer is '+pos}</div>
    <p class="ex">${esc(q.exp)}</p>
    <div class="hk">⏱ Speed hack: ${esc(q.hack)}</div>
  </div>`;
}

function choose(oi){
  const it = run[idx];
  if(it.pick!==null) return;
  it.pick = oi;
  try{ if(lock && typeof lock.recordCbtQuestionUsed==='function') lock.recordCbtQuestionUsed(); }catch(e){}
  renderQ();
}

$('prev').onclick=()=>{ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0);} };
$('next').onclick=()=>{ if(idx<run.length-1){ idx++; renderQ(); window.scrollTo(0,0);} else finish(); };
$('finishBtn').onclick=()=>{
  const left = run.filter(i=>i.pick===null).length;
  if(left===0){ finish(); return; }
  $('cmsg').textContent = left+' question(s) not answered yet. Finish anyway?';
  $('cov').classList.add('show');
};
$('cYes').onclick=()=>{ $('cov').classList.remove('show'); finish(); };
$('cNo').onclick=()=>$('cov').classList.remove('show');

function openMap(){
  $('map').innerHTML = run.map((it,i)=>{
    let c=''; if(it.pick!==null) c = it.pick===it.q.ans?'ok':'no';
    if(i===idx) c+=' cur';
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; $('ov').classList.remove('show'); renderQ(); window.scrollTo(0,0); });
  $('ov').classList.add('show');
}
$('mapBtn').onclick=openMap;
$('closeMap').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{ if(e.target.id==='ov') $('ov').classList.remove('show'); };

function saveHistory(c){
  if(saved || isRetry) return;
  const answered = c.ok + c.no;
  if(answered<=0) return;
  saved = true;
  try{
    if(window.IndigeneHistory && typeof window.IndigeneHistory.save==='function'){
      const topics = {};
      run.forEach(it=>{
        if(it.pick===null) return;
        const k = 'Ch '+(it.q.ch+1)+' · '+DATA[it.q.ch].t;
        if(!topics[k]) topics[k]=[0,0];
        topics[k][1]++; if(it.pick===it.q.ans) topics[k][0]++;
      });
      window.IndigeneHistory.save({course:'CHM102', mode:'cbt', correct:c.ok, total:answered,
        secs:Math.round((Date.now()-startedAt)/1000), topics:topics});
    }
  }catch(e){}
}
function finish(){
  const c = counts(), n = run.length, un = n-c.ok-c.no;
  const pct = n? Math.round(c.ok/n*100):0;
  let msg = pct>=80?'Outstanding. You are ready for the exam. 🔥':pct>=60?'Good run. Study the wrong ones and push higher.':pct>=40?'Fair. Go back to the chapters you missed and run again.':'Keep going. Review the wrong answers carefully, then try again.';
  saveHistory(c);
  const wrong = run.filter(it=>it.pick!==null && it.pick!==it.q.ans);
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  window.scrollTo(0,0);
  $('result').innerHTML = `
    <h2>Result</h2>
    <div class="big">${pct}%</div>
    <div class="stats"><span>Correct <b>${c.ok}</b></span><span>Wrong <b>${c.no}</b></span><span>Skipped <b>${un}</b></span><span>Total <b>${n}</b></span></div>
    <p class="msg">${msg}</p>
    ${wrong.length?`<button class="btn" id="retryWrong">Retry wrong answers (${wrong.length})</button>`:''}
    <button class="btn ghost" id="newRun">New run</button>
    ${wrong.length?'<h2 style="margin-top:22px">Wrong-answer review</h2>':''}
    <div id="rvList"></div>`;
  $('rvList').innerHTML = wrong.map((it,i)=>{
    const q=it.q;
    return `<div class="rv"><div class="rq">${i+1}. ${esc(q.stem)}</div>
      <div class="you">Your answer: ${esc(q.opts[it.pick])}</div>
      <div class="cor">Correct: ${esc(q.opts[q.ans])}</div>
      <p style="margin:8px 0 4px">${esc(q.exp)}</p>
      <div class="hk" style="color:var(--gold)">⏱ ${esc(q.hack)}</div></div>`;
  }).join('');
  if($('retryWrong')) $('retryWrong').onclick=()=>begin(shuffle(wrong.map(w=>w.q)), true);
  $('newRun').onclick=()=>{ $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); renderSetup(); window.scrollTo(0,0); };
}

document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden') || $('ov').classList.contains('show') || $('cov').classList.contains('show')) return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ const it=run[idx]; if(it.pick===null){ choose(it.perm['abcd'.indexOf(k)]); } }
  else if(e.key==='ArrowRight') $('next').click();
  else if(e.key==='ArrowLeft') $('prev').click();
});

$('startBtn').onclick=startQuiz;
renderSetup();
</script>
</body>
</html>
