<style>
:root{
  --bg:#120a07; --bg2:#1a0f0a; --card:#1c110b; --line:#4a2a17;
  --fire:#ff6a1a; --fire2:#d4400f; --gold:#ffb347; --text:#f3e7dc; --mute:#b49a88;
  --ok:#2ecc71; --okbg:rgba(46,204,113,.12); --bad:#ff4d4d; --badbg:rgba(255,77,77,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#3a1a0b 0%,var(--bg) 55%) fixed;
  color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh;
  padding:20px 16px 40px;line-height:1.5;
}
#app{max-width:720px;margin:0 auto}
h1.brand{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--fire);text-align:center;
  letter-spacing:.08em;font-size:2.1rem;margin:8px 0 6px;text-shadow:0 0 18px rgba(255,106,26,.35)}
.sub{font-family:'Orbitron',sans-serif;text-align:center;color:var(--mute);font-size:.9rem;letter-spacing:.06em;margin:0 0 20px}
.panel{background:linear-gradient(180deg,var(--card),#150c08);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
.panel h2{font-family:'Orbitron',sans-serif;color:var(--gold);text-align:center;font-size:1.35rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run{background:#150c08;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer;transition:.15s}
.run .n{display:block;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold);font-size:1.5rem;margin-bottom:2px}
.run.sel{background:linear-gradient(135deg,var(--fire),var(--fire2));border-color:var(--gold);box-shadow:0 0 16px rgba(255,106,26,.35)}
.run.sel .n{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;cursor:pointer;
  background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-family:'Exo 2',sans-serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.03em;box-shadow:0 8px 22px rgba(255,106,26,.28)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#150c08;border:1px solid var(--line);color:var(--text);box-shadow:none}
.foot{color:var(--mute);text-align:center;font-size:.92rem;margin-top:16px}
.chaps{margin-top:14px;display:none}
.chaps.show{display:block}
.chaps .tools{display:flex;gap:8px;margin-bottom:8px}
.chaps .tools button{flex:1;background:#150c08;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;font-weight:600;cursor:pointer}
.chap{display:flex;align-items:center;gap:10px;background:#150c08;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.chap.on{border-color:var(--gold);background:#24140c}
.chap .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#000}
.chap.on .box{background:var(--gold);border-color:var(--gold)}
.chap .nm{flex:1;font-size:.98rem}
.chap .ct{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.85rem}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--mute);margin-bottom:8px}
.top .sc{font-family:'Orbitron',sans-serif;font-size:.85rem}
.top .sc b.g{color:var(--ok)} .top .sc b.r{color:var(--bad)}
.bar{height:6px;background:#2a170d;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .25s}
.chtag{display:inline-block;font-size:.78rem;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);
  color:var(--text);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-family:inherit;font-size:1.02rem;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#2a170d;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem}
.opt:not(.locked):hover{border-color:var(--fire)}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .l{background:var(--ok);color:#001a0a}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#2a0000}
.fb{border:1px solid var(--line);border-left:4px solid var(--gold);background:#1a0f0a;border-radius:12px;padding:12px 14px;margin-top:6px}
.fb .v{font-weight:700;margin-bottom:6px}
.fb .v.ok{color:var(--ok)} .fb .v.no{color:var(--bad)}
.fb .trap{display:inline-block;background:var(--fire);color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.fb .ex{margin:0 0 8px}
.fb .hk{color:var(--gold);font-weight:600}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:12px;padding:13px 8px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.nav button.primary{background:linear-gradient(135deg,var(--fire),var(--fire2));border:0;color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

/* map */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.ov h3{font-family:'Orbitron',sans-serif;color:var(--gold);margin:0 0 10px;font-size:1.05rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:38px;border-radius:8px;border:1px solid var(--line);background:#150c08;color:var(--mute);font-family:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
.map button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.map button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--gold)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:10px 0}

/* result */
.big{font-family:'Orbitron',sans-serif;font-size:3rem;color:var(--gold);text-align:center;margin:6px 0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;color:var(--mute)}
.stats b{color:var(--text)}
.msg{text-align:center;color:var(--text);margin:8px 0 6px}
.rv{border:1px solid var(--line);background:#150c08;border-radius:14px;padding:12px 14px;margin-top:12px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .you{color:var(--bad)} .rv .cor{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a170d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}
@media (max-width:420px){.q{font-size:1.08rem}h1.brand{font-size:1.8rem}}
</style>
</head>

</div></div>

<script>
const DATA = [{"t":"Introduction to Organic Chemistry","q":[["Organic chemistry is best defined as:",["the branch of chemistry that deals with metals, their ores and the compounds they form","the branch of chemistry that deals with carbon-containing compounds and their reactions","the branch of chemistry that deals with compounds made of hydrogen and oxygen only","the branch of chemistry that deals with all living organisms and the changes inside their cells"],1,"Organic chemistry is the study of carbon compounds and how they react.","See 'carbon' + 'compounds' in the options? Pick it. Skip the long ones that name other elements.",0],["The ability of carbon atoms to link with each other to form long chains or rings is called:",["catenation","hybridization","polarisation","tautomerism"],0,"Catenation is the linking of atoms of the same element into longer chains. It is the main reason carbon forms so many compounds.","Chain/ring linking of the same atom = catenation. Hear 'chains of carbon' and answer in 2 seconds.",0],["Which of these elements, apart from carbon, is also mentioned as showing catenation?",["Neon","Calcium","Sodium","Sulphur"],3,"Silicon, phosphorus and sulphur also show catenation, but far less than carbon.","Order the catenation list as C > Si > S > P. If only one non-carbon option is real, it is Sulphur. Skip Oxygen and Nitrogen.",0],["Carbon shows very high catenation mainly because of its:",["free mobile electrons that move between carbon atoms the way they do in metals","high ionisation energy and its tendency to form only ionic bonds with other carbon atoms","small size, tetravalent nature and p-orbitals that are less diffuse than d or f orbitals","large size, divalent nature and many empty d orbitals that overlap easily with each other"],2,"Small size and four bonds let carbon form strong p-p sigma bonds, so strong C–C bonds are possible.","Pick the option that lists all three reasons: small size + tetravalent + p-orbitals. Half-answers lose.",0],["Which of these carbon-containing substances is NOT an organic compound?",["Calcium carbonate, CaCO₃","Acetic acid, CH₃COOH","Methanol, CH₃OH","Urea, NH₂CONH₂"],0,"Carbonates and cyanides contain carbon but are treated as inorganic. Urea, methanol and acetic acid are organic.","Carbonate, cyanide, CO, CO₂ = INORGANIC. Spot any of these four and you are done in 1 second.",1],["Sodium cyanide, NaCN, contains carbon. How is it classified?",["Neither organic nor inorganic because it is a salt of carbon","Organic, because every compound that contains carbon is organic","Inorganic, because cyanides are not regarded as organic compounds","Organic, because it contains the C≡N triple bond like all nitriles"],2,"Cyanides such as NaCN are on the list of carbon compounds that are not organic. Do not confuse it with organic nitriles (RCN).","Metal + CN (NaCN) or metal + CO₃ (CaCO₃) = inorganic. These are the two lecturer examples, so answer at once.",1],["Diamond and graphite are best described as:",["hydrocarbons that contain sp³ and sp² carbon atoms only","inorganic carbon-containing allotropes of carbon","organic compounds because they are made of carbon atoms only","carbonates formed when carbon combines with oxygen in rocks"],1,"Diamond and graphite are allotropes of carbon. They contain carbon but are not organic compounds.","Only carbon in the formula (C alone) = not an organic compound. No H, no other atoms = allotrope.",1],["According to the notes, which bonds are stronger than the C–C bond?",["None, because C–C is the strongest single bond carbon can form","C–N and C–S bonds only, since these involve heavier atoms","C–Cl, C–Br and C–I bonds","C–H, C–F and C–O bonds"],3,"The notes state that C–H, C–F and C–O bonds are stronger than the C–C bond, even though C–C is strong enough for chains.","Bonds to H, F, O beat C–C. Pick the option that lists H, F and O together.",1],["Organic compounds are divided into two major groups. These are:",["natural compounds (made by living things) and benzenoid compounds (made in the laboratory)","saturated compounds (single bonds only) and aromatic compounds (benzene ring present)","aliphatic compounds (no ring present) and homocyclic compounds (a ring of carbon only)","open chain (acyclic) compounds and closed chain (cyclic) compounds"],3,"Everything in organic chemistry is either open chain or ring (closed chain).","Two groups only: acyclic vs cyclic. Any option with 'aromatic' or 'aliphatic' as the TWO main groups is wrong.",0],["A saturated organic compound is one that:",["contains a ring whose atoms include carbon and one hetero atom","contains only single bonds in its carbon skeleton, as in alkanes","contains a benzene ring with alternating double and single bonds","contains at least one double or triple bond in its carbon skeleton"],1,"Saturated means only single bonds. Alkanes are the typical example.","Count the double and triple bonds. Zero = saturated. One or more = unsaturated. Takes 3 seconds.",0],["CH₃–CH=CH–CH₂–C≡C–CH₃ is classified as:",["an open chain unsaturated compound with both a double and a triple bond","an open chain saturated hydrocarbon of the alkane family","an alicyclic compound containing a single triple bond","a closed chain compound with one double bond and one triple bond"],0,"There is no ring, so it is open chain. It has a double bond and a triple bond, so it is unsaturated.","Find a ring? No ring = open chain. Then spot '=' and '≡'. Both present = double and triple together.",0],["Homocyclic compounds are also called carbocyclic compounds because:",["the compound has carbon atoms only outside the ring as side chains","the ring is formed from carbon and hydrogen atoms in equal numbers","the ring is formed by carbon atoms only","the ring contains one or more oxygen atoms along with carbon"],2,"Homo means same. The ring is made of the same atom, carbon.","HOMO = same. Ring made of one kind of atom (carbon) = homocyclic = carbocyclic.",0],["A heterocyclic compound is one in which:",["the ring contains at least one atom that is not carbon","the carbon chain is straight and has no ring at all","two or more benzene rings are fused together","every ring atom is carbon and each ring is saturated"],0,"Hetero means different. One or more ring atoms is another element such as N, O or S.","HETERO = different. Any ring with N, O or S inside = heterocyclic. Just look for a non-carbon atom in the ring.",0],["Alicyclic compounds have properties similar to those of aliphatic hydrocarbons, and their names are formed as:",["heterocyclic names, for example oxacyclohexane only","polycyclic names, for example hexacyclane","benzenoid names, for example benzene-hexane","cyclohydrocarbons, for example cyclohexane"],3,"Alicyclic means aliphatic and cyclic. They are named with the prefix cyclo.","Alicyclic names = 'cyclo' + hydrocarbon name. See cyclohexane, cyclopentane? Alicyclic, no need to read further.",0],["In a saturated alicyclic compound such as cyclohexane, every corner of the ring is a:",["–CH– group","–CH₂– group","–C– group with no hydrogen","–CH₃ group"],1,"Each ring carbon has two ring bonds and two hydrogens, so it is CH₂.","Saturated ring corner = CH₂. Each corner uses 2 bonds for the ring, so 2 H fill the rest.",0],["In cyclohexene, the two carbons joined by the double bond each carry:",["no hydrogen atoms, so each is a fully substituted carbon","three hydrogen atoms, so each is a –CH₃ carbon","one hydrogen atom, so each is a –CH= carbon","two hydrogen atoms, so each is a –CH₂– carbon"],2,"A double-bond carbon uses 2 bonds for the double bond and 1 for the other ring carbon, leaving one hydrogen.","Double bond in a ring: each carbon has 3 bonds used, so 1 H left each. Picture the carbon, count the bonds, done.",0],["In cyclohexyne, the two carbons of the triple bond carry:",["no hydrogen atoms","one hydrogen atom each","two hydrogen atoms each","one carbon has two hydrogens and the other has none"],0,"A triple-bond carbon uses three bonds on the partner carbon and one on the ring carbon, so nothing is left for hydrogen.","Triple bond carbon: 2 bonds to ring + 2 more in the triple = all 4 used. 0 H. Do not even count.",0],["What is the molecular formula of cyclopentane?",["C₅H₈","C₅H₁₂","C₅H₁₀","C₅H₆"],2,"Five corners, each CH₂, gives C₅H₁₀. This follows CₙH₂ₙ for a single-ring saturated compound.","Cycloalkane formula = CₙH₂ₙ. Pentane has 5, so C₅H₁₀. Multiply the carbons by 2, 5 seconds.",0],["What is the molecular formula of cyclooctene?",["C₈H₁₆","C₈H₁₄","C₈H₁₂","C₈H₁₈"],1,"Cyclooctane is C₈H₁₆. One double bond removes two hydrogens, giving C₈H₁₄.","Start from CₙH₂ₙ for ring, then subtract 2 H for each double bond. C₈: 16 − 2 = 14. Ring and double bond each cost 2 H.",0],["Aromatic compounds are so named because:",["they contain only sigma bonds and a ring made up of hetero atoms such as nitrogen","they are all extracted from sweet-smelling fruits and flowers, and have no ring in the molecule","they contain a long chain of saturated carbon atoms with no π bond at all","they have special properties, including a characteristic smell, and contain a conjugated π system"],3,"Aromatic comes from aroma. The key feature in the notes is the conjugated π system.","'Aromatic' = smelly + π system. If an option mentions 'smell/aroma' pick it. Not 'sweet taste'.",0],["Aromatic homocyclic compounds are divided into two classes. These are:",["monocyclic and acyclic","saturated and unsaturated","benzenoids and non-benzenoids","acyclic and cyclic"],2,"The two classes are benzenoids (with benzene rings) and non-benzenoids (other ring sizes).","Benzenoid vs non-benzenoid: the only two aromatic homocyclic groups. Eliminate every other pair of names.",0],["A benzenoid compound can carry elements other than carbon, because:",["the benzene ring may contain nitrogen in place of one of its carbon atoms","benzenoids are not allowed to carry any substituent on the ring","the ring in every benzenoid must contain at least one oxygen atom","such elements are attached to the ring as substituents, while the ring itself is carbon only"],3,"The ring of a benzenoid is carbon only. Phenol and aniline have OH and NH₂ as substituents on that ring.","Ring = carbon only; other atoms hang as substituents. The word 'substituents' in an option almost always wins.",1],["Which of these is a polycyclic (fused) benzenoid compound?",["Xylene","Naphthalene","Aniline","Toluene"],1,"Naphthalene has two benzene rings that share two carbon atoms. The others have a single benzene ring.","Fused rings sharing a bond: Naphthalene is the only common fused pair among options. Pick it if you see it.",0],["Biphenyl (two benzene rings joined by a single bond) is classified as:",["a monocyclic aromatic compound, because the rings are joined but not fused","a non-benzenoid compound, because it has more than one ring","a polycyclic aromatic compound, because it has two rings","an alicyclic compound, because the rings are joined by a sigma bond"],0,"In this course, monocyclic aromatic means benzene rings that are not fused together. Biphenyl and terphenyl are in that list. Polycyclic needs fused rings.","Rings joined by a single bond (biphenyl) = monocyclic. Only SHARED carbons make polycyclic.",1],["Anthracene and phenanthrene both have three fused benzene rings. They differ in:",["the presence of a hydroxyl group on one of the rings","one being benzenoid while the other is non-benzenoid","the number of carbon atoms in each ring, which is five in one of them","the way the rings are fused: linear in anthracene and angular in phenanthrene"],3,"Both are benzenoid with three six-membered rings. The only difference is straight (anthracene) or bent (phenanthrene) arrangement.","AN = in a line (A, N like a straight arrow). PHEN = angular. The word 'linear' goes with anthracene.",0],["Which of the following is a tetracyclic aromatic compound from the notes?",["Naphthalene","Chrysene","Phenanthrene","Anthracene"],1,"Tetracene, tetraphene and chrysene have four fused rings. Naphthalene has 2 rings; anthracene and phenanthrene have 3.","Tetra = 4 rings. Chrysene is the four-ring one from the notes. Skip Naphthalene (2), Anthracene (3).",0],["Azulenes are non-benzenoid aromatic compounds. They contain:",["a five-membered ring and a six-membered ring, and are isomers of anthracene","three seven-membered rings joined in a straight line","a seven-membered ring fused to a five-membered ring, and are isomers of naphthalene","two six-membered rings fused together, and are the same as naphthalene"],2,"Azulene is C₁₀H₈, the same formula as naphthalene, but its rings are 7 and 5 membered.","Azulene = 7 + 5 rings. Naphthalene is 6 + 6. If the option says 7 and 5, tick it.",0],["Tropolone differs from tropone because tropolone has:",["an extra hydroxyl group on carbon 2","an extra amino group on carbon 2","an extra double bond in the ring","a six-membered ring instead of a seven-membered ring"],0,"Tropone is 2,4,6-cycloheptatrien-1-one. Tropolone is 2-hydroxy-2,4,6-cycloheptatrien-1-one.","Tropone → tropolone: the extra 'ol' means an OH. Look for 'hydroxyl' in the options.",0],["The tropylium ion is:",["a neutral molecule of formula C₇H₈ found in toluene","an aromatic ion of formula C₇H₇⁺ whose salts are stable because of aromaticity","an aromatic ion of formula C₆H₆²⁻ found in benzene derivatives","a non-aromatic ion of formula C₆H₅⁺ that decomposes at once"],1,"The tropylium ion has seven carbons and a positive charge, C₇H₇⁺. It is stable because it is aromatic.","Tropylium ion = C₇H₇⁺. Count 7 carbons and a plus sign. Ignore other charges.",0],["Pentafulvene (fulvene) has the same molecular formula as benzene but its ring contains:",["six carbon atoms only","seven carbon atoms and one positive charge","four carbon atoms and one oxygen atom","five carbon atoms only"],3,"Fulvene is C₆H₆ like benzene, but the ring itself has five carbons. Conjugated π electrons make it aromatic.","Pentafulvene: 'penta' says 5. Ring has FIVE carbons. Formula still C₆H₆, same as benzene.",0],["Oxaazulanones are non-benzenoid compounds that have:",["benzene rings containing nitrogen atoms","open chains containing oxygen atoms","azulene rings containing oxygen atoms","cyclohexane rings containing sulphur atoms"],2,"Oxa means oxygen. The azulene ring system carries oxygen, as in 5-isopropyl-3-(methoxycarbonyl)-2H-cycloheptafuran-2-one.","OXA = oxygen. Any 'oxa' word means an oxygen atom in the ring. Ignore the other prefix hints.",0],["Sporopollenin exine capsules are mentioned as useful in the security and intelligence industry to detect:",["fingerprints","radioactive materials","forged banknotes","explosive vapours"],0,"The notes list sporopollenin exine capsule as an organic material used to detect fingerprints.","Sporopollenin = fingerprints. Just match the pair; skip the rest. This one is pure recall.",0],["In the paint industry, the organic material mentioned in the notes is:",["nylon, made from adipic acid","carboxymethyl cellulose, made from cellulose","aspirin, made from salicylic acid","polystyrene, made from styrene"],1,"The notes link paint with carboxymethyl cellulose from cellulose. Cotton for textiles also comes from cellulose.","Paint → carboxymethyl cellulose. Tyres → rubber. Just memorise the industry-product pair.",0],["Which pair is correctly matched with its industrial use from the notes?",["Rubber tyres: food industry","Cotton from cellulose: petroleum industry","Crude oil and fossils: textile and dye industry","Aspirin and paracetamol: medical and pharmaceutical industry"],3,"Aspirin and paracetamol are organic drugs. Crude oil belongs to petroleum and geology, cotton to textile, and tyres to automobile industry.","Match each product to ITS industry. Aspirin + paracetamol = pharmacy. Eliminate any pair with another drug.",0]]},{"t":"Hybridization","q":[["Hybridization is best described as:",["the overlap of two atomic orbitals from different atoms to form one bond between them","the transfer of an electron from one atom to another to form an ion with a full shell","the mixing of two different atomic orbitals of the same shell to form new hybrid orbitals of equal energy","the splitting of one atomic orbital into two orbitals of different energies"],2,"Hybridization happens inside one atom. Orbitals of the same shell mix and give new orbitals that all have the same energy.","HYBRID = MIX. Pick the option that says orbitals of the SAME atom mix to give new equal ones.",0],["What is the electronic configuration of the carbon atom in its ground state?",["1s² 2s² 2p²","1s² 2s¹ 2p³","1s² 2s² 2p⁴","1s² 2s² 2p⁶"],0,"Carbon has 6 electrons: two in 1s, two in 2s and two in 2p.","Carbon is atom 6. Fill 1s² 2s² then the last 2 electrons go to 2p: 1s² 2s² 2p². Count to 6 and stop.",0],["In the ground state, how many unpaired electrons does carbon have in its outermost shell?",["Zero","Two","Four","One"],1,"Hund's rule puts the two 2p electrons in separate orbitals, 2pₓ¹ and 2p_y¹, so only two are unpaired.","Only the 2p has 2 electrons in separate boxes. 2s is paired. Answer: two.",1],["According to Hund's rule, as used for the 2p electrons of carbon:",["electrons occupy the highest energy orbital first before lower ones","electrons pair up in the first p orbital before entering the next one","electrons in the same subshell must always have the same spin","electrons fill the orbitals of a subshell singly before any pairing begins"],3,"This is why the outer configuration is written 2s² 2pₓ¹ 2p_y¹ 2p_z⁰.","Hund = 'bus seats': one person per seat first, then pair up. Pick 'singly before pairing'.",0],["Before sp³ hybridization, carbon moves to the excited state. What happens?",["One electron from the 2s orbital is promoted to the empty 2p_z orbital","Two electrons from the 2p orbitals are moved into the 2s orbital","One electron from the 1s orbital is promoted to the empty 2p_z orbital","One electron from the 2p orbital is lost completely from the atom"],0,"Promotion gives 2s¹ 2pₓ¹ 2p_y¹ 2p_z¹, which is four unpaired electrons ready to form four bonds.","Excited state = 2s electron jumps to the empty 2p. Gives 4 unpaired electrons. Pick 'promoted'.",0],["What is the shape of an s orbital and a p orbital respectively?",["dumb-bell shaped and dumb-bell shaped","spherical and dumb-bell shaped","spherical and spherical","dumb-bell shaped and spherical"],1,"s is a ball. p is two lobes on either side of the nucleus.","s = sphere (S for sphere), p = dumb-bell. Two-second recall.",0],["Which pair of orbitals gives a π bond when they overlap sideways?",["s with pₓ along the bond axis","pₓ with pₓ along the bond axis","s with s","p_y with p_y"],3,"Sideways overlap of parallel p orbitals gives π. The other three pairs overlap head-on and give sigma bonds.","π = SIDEWAYS overlap. Only p with the SAME label can do this: py + py or pz + pz.",0],["Which pair of orbitals has NO overlap (they are orthogonal)?",["pₓ and pₓ along the axis","s and s","pₓ and p_y","s and pₓ along the axis"],2,"pₓ and p_y are at right angles to each other, so no net overlap happens. The other pairs overlap well.","px and py are at 90°, so zero overlap. Any pair with different letters (x with y) is orthogonal.",1],["A sigma (σ) bond is:",["a bond that exists only between two sp-hybridized carbon atoms","an ionic bond formed by complete transfer of electrons","a double bond formed by sideways overlap of two p orbitals","a single covalent bond formed by head-on overlap of orbitals"],3,"A sigma bond lies along the line joining the two nuclei. The first bond between two atoms is always sigma.","σ = head-on (like σ for straight). π = sideways. Pick 'head-on'.",0],["sp³ hybridization of carbon gives which percentage of s and p character?",["25% s and 75% p","50% s and 50% p","75% s and 25% p","33.3% s and 66.7% p"],0,"One s and three p orbitals are mixed, so one quarter is s and three quarters is p.","sp³ = 1 s + 3 p = 4 parts. 1/4 = 25% s, 3/4 = 75% p. Divide the number of orbitals in 1 sec.",0],["What is the shape and bond angle of methane?",["linear, 180°","tetrahedral, 109.5°","square planar, 90°","trigonal planar, 120°"],1,"Four sp³ orbitals spread out as far as possible, giving a tetrahedron with 109.5° between the bonds.","sp³ means 4 groups around carbon = tetrahedral, 109.5°. CH₄ is the standard example.",0],["In sp² hybridization of carbon, the 2s orbital mixes with:",["two 2p orbitals and the 1s orbital, leaving one unchanged","only one of the three 2p orbitals, leaving two unchanged","only two of the three 2p orbitals, leaving one p orbital unchanged","all three of the 2p orbitals, leaving none unchanged"],2,"That gives three sp² orbitals. The unchanged p orbital is used to form the π bond.","sp² uses 2 p orbitals only. 3 p minus 2 = one p left over for the π bond.",1],["How many p orbitals remain unhybridised in an sp-hybridised carbon?",["Three","Two","One","None"],1,"sp uses the 2s and only one 2p. The other two p orbitals stay and form the two π bonds of a triple bond.","sp = 2 hybrid orbitals, so 3 p minus 1 = TWO p left unhybridised. They make two π bonds.",1],["The unhybridised p orbital on an sp² carbon is used to form:",["a σ bond with the other carbon","a lone pair on carbon","a π bond","a σ bond with hydrogen"],2,"The three sp² orbitals make the σ framework. The leftover p orbital overlaps sideways to give the π bond.","The leftover p orbital always makes the π bond. Pick 'π bond' on sight.",0],["How many hybrid orbitals are formed when one s orbital mixes with one p orbital?",["Two","Three","One","Four"],0,"The number of hybrid orbitals always equals the number of atomic orbitals mixed. s + p gives two sp orbitals.","Number of hybrids ALWAYS equals number of orbitals mixed. 1 s + 1 p = 2 hybrids.",0],["In ethene, the C–C σ bond is formed by the overlap of:",["two unhybridised p orbitals","two sp³ orbitals","two sp orbitals","two sp² orbitals"],3,"Each carbon is sp². The C–C sigma bond is sp²–sp², and the π bond is 2p–2p.","C–C σ in ethene: sp² + sp². Just copy the hybrid label of the carbon.",0],["Each C–H bond in ethene is formed by the overlap of:",["an s orbital of hydrogen with an sp orbital of carbon","an s orbital of hydrogen with an unhybridised p orbital of carbon","an s orbital of hydrogen with an sp³ orbital of carbon","an s orbital of hydrogen with an sp² orbital of carbon"],3,"The three sp² orbitals on each carbon form one C–C bond and two C–H bonds, with 120° angles.","C–H bond = s of H + hybrid of carbon. Ethene carbon is sp², so H(s) + C(sp²).",0],["The geometry around each carbon of ethene is:",["tetrahedral, with bond angles of 109.5°","trigonal pyramidal, with bond angles of 107°","trigonal planar, with bond angles of 120°","linear, with bond angles of 180°"],2,"Three sp² orbitals lie in one plane at 120° to each other.","sp² = trigonal planar = 120°. Remember 'sp²: 2 → 120 → flat'.",0],["The shape of an sp-hybridised carbon atom is:",["linear, with a bond angle of 180°","bent, with a bond angle of 104.5°","tetrahedral, with a bond angle of 109.5°","trigonal planar, with a bond angle of 120°"],0,"Two sp orbitals point in opposite directions so the electron pairs are as far apart as possible, which reduces repulsion.","sp = linear = 180°. Two groups only, so they sit on opposite sides.",0],["How many σ bonds and π bonds are in ethyne, HC≡CH?",["2 σ bonds and 3 π bonds","3 σ bonds and 2 π bonds","5 σ bonds and 1 π bond","3 σ bonds and 1 π bond"],1,"Two C–H σ bonds, one C–C σ bond, and two π bonds in the triple bond.","Triple bond = 1 σ + 2 π. Plus 2 C–H σ bonds. Total 3 σ, 2 π.",0],["How many σ bonds and π bonds are in propene, CH₃CH=CH₂?",["8 σ bonds and 2 π bonds","9 σ bonds and 1 π bond","8 σ bonds and 1 π bond","7 σ bonds and 2 π bonds"],2,"Two C–C σ bonds and six C–H σ bonds make 8 σ. The double bond adds one π.","Count lines: 6 C–H + 2 C–C = 8 σ. The second line of C=C is the only π. Every double bond = 1 σ + 1 π.",0],["Which of these carbon-carbon bonds is the LONGEST?",["C=C in ethene (sp²–sp²)","C≡C in ethyne (sp–sp)","All three have equal length","C–C in ethane (sp³–sp³)"],3,"More s-character pulls the electrons closer, so bond length falls: sp³ longest, sp shortest.","Longer bond = lower s-character. sp³ has least s, so the longest. Alkane > alkene > alkyne.",0],["Which carbon-carbon bond is the STRONGEST according to the table in the notes?",["the bond between two sp carbons, because of two π bonds (4 π electrons)","all are equal because each contains at least one σ bond","the bond between two sp² carbons, because it has the largest bond angle","the bond between two sp³ carbons, because it has the greatest bond length"],0,"The triple bond holds the carbons together most tightly: one σ plus two π bonds.","Triple bond = strongest, because it has the most bonds between the two atoms (1 σ + 2 π). More bonds, stronger.",0],["In the characteristics table, bond strength for sp² was left blank. From the trend it should be:",["stronger than sp and stronger than sp³","stronger than sp³ but weaker than sp","equal to sp³","weaker than sp³ and weaker than sp"],1,"Strength rises from sp³ to sp², then to sp. So sp² is in the middle.","Trend: sp³ < sp² < sp. sp² must sit in the middle. Pick 'stronger than sp³, weaker than sp'.",1],["Which hybridised carbon has the highest percentage of s-character?",["sp²","They are all equal","sp³","sp"],3,"sp has 50% s-character, sp² has 33.3%, and sp³ has 25%.","s-character: sp = 50%, sp² = 33%, sp³ = 25%. Fewest orbitals mixed = most s. So sp wins.",0],["Which statement about the degree of saturation between two carbons is correct?",["It increases when the number of π electrons increases","It increases when the percentage of s-character decreases","It increases when the bond length decreases","It increases when the bond angle increases"],1,"From the notes, saturation increases with decreasing %s, decreasing bond energy, decreasing bond angle, decreasing π electrons, increasing %p and increasing bond length.","Degree of saturation goes with MORE π bonds and MORE s-character. 'Decreases when s-char increases' is wrong. Read the direction.",1],["Which of these is NOT a condition that makes the degree of saturation increase?",["an increase in the number of π electrons","an increase in the percentage of p-character","a decrease in the bond angle","an increase in the bond length"],0,"More π electrons means more unsaturated. So saturation increases when π electrons decrease, not increase.","For NOT questions, flip each option into a true/false check. π electrons increasing = unsaturation increases, so that one is a valid condition.",1],["How many sp²-hybridised carbons are in the molecule CH₃–CH=CH–C≡CH?",["Four","One","Two","Three"],2,"CH₃ is sp³, the two carbons of the double bond are sp², and the two carbons of the triple bond are sp.","Mark each carbon by its bonds: C=C gives two sp², C≡C gives two sp. CH₃ is sp³. Two sp² here.",0],["Two sp-hybridised carbons are joined by a triple bond. How are the two π bonds arranged?",["along the bond axis, one on top of the other","at right angles to each other, one above and below the axis and one in front and behind","in the same plane, lying on the same side of the bond axis","at 120° to each other, in the plane of the σ bond"],1,"The two leftover p orbitals on each carbon (p_y and p_z) are perpendicular, so the two π bonds are perpendicular too.","Two π bonds in a triple bond sit at 90° to each other because px and py are perpendicular.",0],["The hybridization of the carbon atom in each of these species is, in order: CH₄, CH₂=CH₂, HC≡CH.",["sp³, sp, sp²","sp², sp³, sp","sp, sp², sp³","sp³, sp², sp"],3,"Four σ bonds and no π gives sp³. Three σ and one π gives sp². Two σ and two π gives sp.","CH₄ = 4 groups = sp³. C=C = 3 groups = sp². C≡C = 2 groups = sp. Count the groups around the carbon.",0],["In CH₂=C=CH₂ (allene), the central carbon is hybridised as:",["sp³, with a tetrahedral arrangement of 109.5°","sp², with a linear arrangement of 180°","sp, with a linear arrangement of 180°","sp², with a trigonal planar arrangement of 120°"],2,"The central carbon has two double bonds, so only two σ bonds. Two groups means sp and a bond angle of 180°. The two end carbons are sp².","Central carbon of allene has two double bonds. 2 groups = sp, linear 180°. Count attached atoms, not bonds.",1],["Which of these has a carbon with the shortest C–H bond?",["ethyne, because the carbon is sp with 50% s-character","ethane, because the carbon is sp³ with 25% s-character","ethane, because the carbon has the largest bond angle","ethene, because the carbon is sp² with 50% s-character"],0,"The more s-character, the closer the electrons sit to the nucleus. So C–H is shortest in ethyne.","Highest s-character gives shortest C–H. So ethyne (sp, 50%) wins. Pick the alkyne.",0],["What is the total number of σ bonds in ethane, C₂H₆?",["8","7","6","5"],1,"One C–C bond plus six C–H bonds make 7 σ bonds. There is no π bond in ethane.","Ethane: 6 C–H + 1 C–C = 7 σ. Every single bond is one σ, so count the lines.",0]]},{"t":"Nomenclature and Classes of Organic Compounds","q":[["Which type of name is made wholly of coined syllables with no link to any older name, such as pentane or oxazole?",["Trivial name","Systematic name","Semi-trivial name","Radicofunctional name"],1,"A systematic name is built from syllables that each carry a fixed meaning. A trivial name has no such system, like xanthophyll.","Names built from coined syllables with no older link (pentane, oxazole) = Systematic. Pick it and move on.",0],["Most names used in organic chemistry (methane, butene, calciferol) are classified as:",["fully systematic names","fully trivial names","semi-systematic (semi-trivial) names","additive names"],2,"Part of the name follows the system (meth-, but-, -ene) and part does not. That makes them semi-systematic, and they are the majority.","Methane, butene, calciferol = part trivial, part systematic. Common names like these are 'semi-systematic'.",1],["In substitutive nomenclature, the name is formed by:",["replacing hydrogen atoms of the parent with groups or elements, as in 1-pentanol or 1-methylnaphthalene","removing atoms from the parent, as in deoxy- or dehydro- compounds","replacing carbon atoms of the parent with hetero atoms, as in thiopyran","joining two molecule names after losing one hydrogen from each"],0,"Substitutive = H replaced. Replacement = C or CH replaced by a hetero atom. Subtractive = atoms removed. Conjunctive = two names joined.","Substitutive = swap H for a group. Key word 'replacing hydrogen'. Not 'replacing carbon'.",0],["Thiopyran is named from pyran by replacing oxygen with sulphur. Which type of nomenclature is this?",["Subtractive nomenclature","Substitutive nomenclature","Additive nomenclature","Replacement nomenclature"],3,"The prefixes thio-, seleno- and telluro- replace O with S, Se and Te. That is replacement nomenclature.","Swap one ring atom for another (O → S) = Replacement nomenclature. Think 'replace the atom'.",0],["Which nomenclature gives names such as benzofuran, by linking two ring systems with an 'o'?",["Radicofunctional nomenclature","Hantzsch–Widman nomenclature","Conjunctive nomenclature","Fusion nomenclature"],3,"Fusion names join the names of two ring systems and use 'o' to link them, as in benzo + furan.","Benzofuran, 'o' joining two rings = Fusion nomenclature. Two rings fused together gives the name.",0],["In Hantzsch–Widman nomenclature, the suffix for a five-membered heterocycle and a six-membered heterocycle are respectively:",["-ole and -ine","-ine and -ole","-ane and -ene","-ole and -ane"],0,"Triazole and thiazole are five-membered. A six-membered ring ends in -ine.","5-ring ends in -ole (pyrrole), 6-ring ends in -ine (pyridine). Pick the pair '-ole and -ine' in order.",1],["Which of these is an example of radicofunctional nomenclature?",["naphthaleneacetic acid","acetyl chloride","styrene oxide","triazaphenanthrene"],1,"Radicofunctional names have a radical name plus a functional class name, such as acetyl chloride or ethyl alcohol.","Radicofunctional = alkyl/acyl group + functional class name. 'Acetyl chloride' fits the pattern: group + chloride.",0],["A trivial name can be based on all of these EXCEPT:",["the source of the compound","the person who discovered it","the colour of the compound's crystals","the property of the compound"],2,"Trivial names are based on source, property, discoverer or structure. Colour is not one of the four.","Trivial names come from source, taste, smell, discoverer. Colour of crystals is not on the list. Pick it.",1],["Wood spirit is the trivial name of which compound, and why?",["ethanol, C₂H₅OH, because it is obtained by fermentation of barley","methane, CH₄, because it is formed from decaying wood in marshes","methanol, CH₃OH, because it is obtained by destructive distillation of wood","ethanoic acid, CH₃COOH, because it is obtained from wine going sour"],2,"Methyl spirit and wood spirit are old names of methanol, from heating wood without air.","Wood spirit = methanol (from destructive distillation of wood). Wood → CH₃OH.",0],["Match the compound with the source of its trivial name: urea, formic acid and malic acid.",["milk, red ants and tamarind","urine, goats and apples","urine, butter and lemons","urine, red ants and apples"],3,"Urea comes from urine, formic acid from formicus (red ant) and malic acid from Malus, the apple.","Urea → urine, formic → ants (formica), malic → apples (malus). Match Latin roots to the source in seconds.",0],["Which acid is named after butter and which one is named after goats?",["lactic acid and caproic acid","butyric acid and caproic acid","butyric acid and citric acid","caproic acid and butyric acid"],1,"Butyric, CH₃CH₂CH₂COOH, is from butter. Caproic, CH₃(CH₂)₄COOH, is from goats.","Butyric = butter, caproic = goat (caper). B for Butter, C for Caprine.",0],["Which acid gets its name from the Latin word for vinegar, Acetum?",["acetic acid","oxalic acid","tartaric acid","lactic acid"],0,"Acetic acid, CH₃COOH, is the acid in vinegar.","Acetum = vinegar = acetic acid. Latin root gives the acid name.",0],["Ethylene glycol and glycerol both have names from 'glycus'. What does it mean?",["sweet, although ethylene glycol is poisonous","sticky, although ethylene glycol is not poisonous","slippery, although glycerol is a solid at room temperature","sour, although glycerol is used as a sweetener"],0,"Glycus means sweet. Glycol tastes sweet but is poisonous, which makes it dangerous to drink.","glycus = sweet. Both glycol and glycerol taste sweet. Do not choose 'poisonous' to describe the word.",1],["Grignard reagent (RMgX) and Frankland reagent (R₂Zn) are examples of names based on:",["the source","the discoverer","the structure","the property"],1,"Both are named after the chemists who found them.","Names with a person behind them (Grignard, Frankland) = based on the discoverer. Easy pick.",0],["Which of these correctly matches the carbon prefix with the number of carbons?",["hept = 8 and non = 10","hept = 6 and non = 8","hept = 7 and non = 8","hept = 7 and non = 9"],3,"Meth1 Eth2 Prop3 But4 Pent5 Hex6 Hept7 Oct8 Non9 Dec10.","Prefix numbers: meth 1, eth 2, prop 3, but 4, pent 5, hex 6, hept 7, oct 8, non 9, dec 10. Check 7 and 9 only.",0],["Which of these is the isopropyl group?",["(CH₃)₃C–","CH₃CH₂CH(CH₃)–","(CH₃)₂CH–","CH₃CH₂CH₂–"],2,"The iso prefix means one methyl on the second carbon of a straight chain. Isopropyl has the free bond on the middle carbon of a 3-carbon chain.","Iso = (CH₃)₂CH– with the branch at carbon 2 from the attachment. Shape: two methyls on one CH.",0],["Which of these is the isobutyl group?",["(CH₃)₂CH–CH₂–","CH₃CH₂CH(CH₃)–","(CH₃)₃C–","CH₃CH₂CH₂CH₂–"],0,"Isobutyl has the free bond on the CH₂ at the end. CH₃CH₂CH(CH₃)– is sec-butyl and (CH₃)₃C– is tert-butyl.","Isobutyl is isopropyl with a CH₂ added: (CH₃)₂CH–CH₂–. Count 4 carbons, then check the attachment point.",1],["Which of these represents neopentane?",["(CH₃)₃CH","(CH₃)₄C","(CH₃)₂CHCH₂CH₃","CH₃CH₂CH₂CH₂CH₃"],1,"Neo means a carbon with four methyls or three methyls, a quaternary carbon. Neopentane is C(CH₃)₄.","Neo = 4 methyls on one carbon: (CH₃)₄C. 5 carbons, central carbon with no H.",0],["Which is the correct general formula of an alkyl, alkenyl and alkynyl group respectively?",["CₙH₂ₙ₊₂, CₙH₂ₙ and CₙH₂ₙ₋₂","CₙH₂ₙ₋₁, CₙH₂ₙ₊₁ and CₙH₂ₙ₋₃","CₙH₂ₙ₊₁, CₙH₂ₙ₋₃ and CₙH₂ₙ₋₁","CₙH₂ₙ₊₁, CₙH₂ₙ₋₁ and CₙH₂ₙ₋₃"],3,"A group is the parent hydrocarbon minus one hydrogen. Alkane CₙH₂ₙ₊₂ gives CₙH₂ₙ₊₁, alkene CₙH₂ₙ gives CₙH₂ₙ₋₁, alkyne CₙH₂ₙ₋₂ gives CₙH₂ₙ₋₃.","Alkyl CₙH₂ₙ₊₁, alkenyl CₙH₂ₙ₋₁, alkynyl CₙH₂ₙ₋₃. Subtract 2 H per extra bond. The sequence drops by 2 each time.",0],["Which pair is correctly named?",["CH₂=CH– is ethynyl and CH₂=CH–CH₂– is allyl","CH₂=CH– is allyl and CH₂=CH–CH₂– is vinyl","CH₂=CH– is vinyl and CH₂=CH–CH₂– is allyl","CH₂=CH– is propenyl and CH₂=CH–CH₂– is vinyl"],2,"Vinyl has two carbons. Allyl has three carbons with the double bond at the end. Ethynyl is HC≡C–.","Vinyl = CH₂=CH– (2 C). Allyl = CH₂=CH–CH₂– (3 C). Vinyl is shorter, allyl has the extra CH₂.",1],["The group HC≡C–CH₂– is called:",["isopropenyl","ethynyl","allyl","propargyl"],3,"Propargyl, also called 2-propynyl, has a triple bond at the end of a 3-carbon group. Ethynyl is HC≡C– with only two carbons.","Propargyl = HC≡C–CH₂–. The alkyne partner of allyl. P for Propargyl and Parked triple bond.",0],["An alkylidene group is formed when an alkane loses:",["two hydrogens from different carbons","one hydrogen from the terminal carbon","two hydrogens from the same carbon","two hydrogens from the benzene ring"],2,"Alkylidene has both free valencies on one carbon. An alkylene group has them on different carbons.","Alkylidene = both free valences on the SAME carbon (like C=). Alkylene = on different carbons.",0],["Alkylidene and alkylene groups have the general formula CₙH₂ₙ. Does this make them alkenes?",["No, because they are groups with free valencies and contain no double bond","No, because they have a formula of CₙH₂ₙ₊₂ instead","Yes, because both lose two hydrogens just like an alkene does","Yes, because any compound with the formula CₙH₂ₙ is an alkene"],0,"The formula matches an alkene but there is no C=C. These are groups, not molecules, and are used in names only.","CₙH₂ₙ group does not make an alkene. A group has free valences. Eliminate 'yes, it is an alkene'.",1],["In the classwork on alkylidene and alkylene groups, which of these is a pentylidene group?",["–CH₂CH(CH₂CH₂CH₃)–","CH₃CH₂CH₂CH₂CH=","CH₂=CHCH₂CH₂CH₃","CH₃CH₂CH₂CH₂CH₂–"],1,"The first has both valencies on the same terminal carbon, so it is an alkylidene. The second is pentyl, the third is 1-pentene and the last is an alkylene-type group.","Pentylidene = 5 carbons ending in '=' on the last carbon: CH₃CH₂CH₂CH₂CH=. Count the C and check the double bond end.",0],["Which group is C₆H₅CH₂–, and which is CH₃C₆H₄–?",["tolyl and benzyl","phenyl and benzal","benzyl and tolyl","benzal and phenyl"],2,"Benzyl is toluene minus one H from the methyl group. Tolyl is toluene minus one H from the ring.","C₆H₅CH₂– = benzyl (CH₂ attached). CH₃C₆H₄– = tolyl (methyl on the ring). Benzyl has the CH₂ outside the ring.",0],["Benzyl, tolyl and which other group are all C₇ groups of toluene?",["phenyl, C₆H₅–, which is C₇H₆","phenylene, C₆H₄, which is C₇H₇","phenyl, C₆H₅–, which is C₇H₇","benzal, C₆H₅CH=, which is C₇H₆"],3,"Benzal is toluene minus two H from the methyl group. Phenyl is C₆H₅ and comes from benzene, not toluene.","Toluene C₇ groups: benzyl C₆H₅CH₂–, tolyl CH₃C₆H₄–, benzal C₆H₅CH=. Benzal is the double-ended one.",1],["In common naming of alkenes, which of these is β-butylene?",["CH₂=CHCH₂CH₃","CH₃CH=CHCH₃","(CH₃)₂C=CH₂","CH₃CH₂CH=CHCH₂CH₃"],1,"Alpha is carbon 1, beta is carbon 2, gamma is carbon 3. β-butylene has the double bond at carbon 2.","α-butylene = but-1-ene, β-butylene = but-2-ene (CH₃CH=CHCH₃). β = the middle double bond.",0],["Which formula is isobutylene?",["(CH₃)₂C=CH₂","CH₂=CH–CH₃","CH₃CH=CHCH₃","CH₂=CHCH₂CH₃"],0,"Isobutylene is 2-methylpropene. CH₂=CH–CH₃ is propylene.","Isobutylene = (CH₃)₂C=CH₂. Iso (branched) + butylene. Branch on the doubly bonded carbon.",0],["A gem-dihalide has two halogens on one carbon. The common name of CH₃CHBr₂ is:",["vinyl bromide","ethylidene bromide","ethylene bromide","dimethylene bromide"],1,"Two halogens on the same carbon means an alkylidene halide. The ethylene halide has halogens on different carbons.","gem-dihalide with ONE carbon bearing both halogens: use -idene. CH₃CHBr₂ = ethylidene bromide.",0],["What is the common name of CH₂I₂?",["methylene iodide","diiodomethane iodide","methylidene iodide","dimethyl iodide"],0,"With one carbon there is no other carbon for the halogens to be on, so the book names it methylene iodide, not methylidene.","CH₂I₂: one carbon, two iodines = methylene iodide. Methylene is the one-carbon name.",1],["What is the common name of ICH₂CH₂I?",["diethyl iodide","ethylidene iodide","ethylene iodide","dimethylene iodide"],2,"Vicinal dihalides are alkylene halides. The two-carbon one is ethylene, not dimethylene. Polymethylene halides are used for terminal halogens on chains longer than two carbons.","ICH₂CH₂I: two iodines on adjacent carbons = ethylene iodide. 'ene' = vicinal (different carbons).",1],["Cl–CH₂CH₂CH₂–Cl has its two halogens at the two ends of a 3-carbon chain. Its common name is:",["propylene chloride","propylidene chloride","tripropyl chloride","trimethylene chloride"],3,"Halogens on the two terminal carbons of a chain with more than two carbons make a polymethylene halide. Three CH₂ units make trimethylene.","3 carbons in a chain with halogens at each end = trimethylene chloride. Count carbons for the prefix.",0],["Two OH groups on adjacent carbons are named as an alkylene glycol. Which compound is the dihydroxy compound with two OH on the terminal carbons of a seven-carbon chain called?",["heptamethylene glycol","heptylidene glycol","heptanoic glycol","heptylene glycol"],0,"Terminal OH groups on a chain of more than two carbons give a polymethylene glycol. Seven CH₂ units make hepta-.","Two OH on different carbons = alkylene glycol. Seven CH₂ between = hepta. Heptamethylene glycol.",0],["In System I of common naming, the suffixes for –CONH₂, –CHO and –CN are respectively:",["-yl halide, -ic acid and -o-isonitrile","-ate, -one and -oic acid","-amine, -ol and -o-isonitrile","-amide, -aldehyde and -o-nitrile"],3,"System I uses carbon prefixes plus -ic acid, -ic anhydride, -ate, -amide, -yl halide, -aldehyde, -o-nitrile and -o-isonitrile.","Suffix quick list: –CONH₂ = amide, –CHO = aldehyde, –CN = nitrile (written -o-nitrile in System I).",0],["Which common prefix is used for a 3-carbon chain with a double bond, and for a 4-carbon chain with a double bond on the second carbon?",["acet and valer","acryl and croton","propion and butyr","form and pyruv"],1,"Acrylic acid is CH₂=CH–COOH. Crotonic acid has four carbons. Propion and butyr are for saturated chains.","3C with double bond = acryl. 4C with double bond on carbon 2 = croton. Acr-3, Crot-4.",0],["What is the System I name of CH₂=CH–CN?",["propionitrile","vinyl isocyanide","acrylonitrile","acryloisonitrile"],2,"CH₂=CH–CN has the C bonded to N, so it is a nitrile. Acryloisonitrile is CH₂=CH–NC.","CH₂=CH–CN = acryl (3C double bond) + nitrile = acrylonitrile.",0],["Which of these is pyruvic acid?",["CH₃–CH₂–COOH","CH₂=CH–COOH","CH₃–CO–COOH","CH₃–CH(OH)–COOH"],2,"Pyruv- means CH₃–CO– is directly attached to the functional group. CH₃CH₂COOH is propionic acid, lactic acid has OH and acrylic acid has C=C.","Pyruvic acid = CH₃–CO–COOH. Keto group right next to the acid. 3 carbons, one C=O in the middle.",1],["Using the anhydride rule, what is the common name of CH₃CH₂CO–O–COCH₂CH₃?",["butyric anhydride","acetic anhydride","dipropionic anhydride","propionic anhydride"],3,"The anhydride has 6 carbons altogether. Dividing by 2 gives 3, so it is propionic anhydride.","Anhydride with the same two acyl parts: just name the acid, then 'anhydride'. Propionic + anhydride.",0],["A mixed anhydride CH₃CO–O–COCH₂CH₃ is named by:",["naming each acid part in alphabetical order, then the word anhydride: acetic propionic anhydride","naming the longer part only: propionic anhydride","naming the shorter part first: propionic acetic anhydride","adding the carbons and dividing by two: butyric anhydride"],0,"When R ≠ R', split at the O, name both parts, and put them in alphabetical order. The later alphabet gives the parent name.","Mixed anhydride = list the two acid names alphabetically, then the word 'anhydride'. Acetic before propionic.",0],["In System II common naming, (CH₃)₃C–OH is named:",["tertiary butyl ether","t-butyl alcohol","butyl carbinol","isobutyl alcohol"],1,"System II gives the hydrocarbon radical name plus the class, here alcohol.","t-butyl alcohol = (CH₃)₃C–OH. The t means tertiary, three methyls on the carbon bearing OH.",0],["In derived naming, tetramethylmethane is the derived name of:",["isopentane, (CH₃)₂CHCH₂CH₃","pentane, CH₃(CH₂)₃CH₃","neopentane, (CH₃)₄C","isobutane, (CH₃)₃CH"],2,"Methane with four methyl groups replacing four hydrogens gives C(CH₃)₄. Trimethylmethane is isobutane.","Tetramethylmethane: methane carbon with 4 methyls = neopentane (CH₃)₄C. Count the substituents.",0],["In the derived naming system, which parent compound is used for alcohols and ketones?",["carbinol for alcohols and acetone for ketones","ethanol for alcohols and propanone for ketones","carbinol for ketones and acetone for alcohols","methanol for alcohols and acetaldehyde for ketones"],0,"Alkanols are named as substituted carbinol, such as ethylmethyl carbinol. Alkanones are substituted acetone.","Derived names: alcohol → carbinol (CH₃OH), ketone → acetone. Replace the groups on the parent.",0],["Which of these is dimethylacetylene in the derived naming system?",["CH₃–CH=CH–CH₃","CH₃–C≡C–CH₃","CH₃–CH₂–C≡CH","CH₃–CH₂–CH₂–CH₃"],1,"Acetylene is the parent alkyne. Two methyl groups on HC≡CH give 2-butyne.","Dimethylacetylene: acetylene (HC≡CH) with both H replaced by CH₃. CH₃–C≡C–CH₃.",0],["Where did the chemists meet to set the IUPAC rules, and when?",["Paris, at the start of the 20th century","Geneva, in the middle of the 20th century","London, in the middle of the 19th century","Geneva, at the end of the 19th century"],3,"The meeting was in Geneva in the 1890s. The IUPAC system is meant to be systematic and unambiguous.","IUPAC began in Geneva, 1892 (end of 19th century). Pure recall: Geneva.",0],["In an IUPAC name, the primary suffix and the secondary suffix show respectively:",["the main functional group and the number of carbons","the substituents and the type of ring","the number of carbons and the substituents","saturation or unsaturation (ane, ene, yne) and the main functional group"],3,"The root shows the chain length, the primary suffix the saturation, the secondary suffix the main functional group.","Primary suffix = bond type (ane/ene/yne). Secondary suffix = main functional group (ol, one, al). Order matters.",0],["IUPAC Rule 1: when choosing the parent chain, what takes priority?",["functional group, then multiple bonds, then substituents","functional group, then substituents, then multiple bonds","substituents, then multiple bonds, then functional group","multiple bonds, then substituents, then functional group"],0,"Choose the longest continuous chain that has the functional group, multiple bonds and the most substituents, in that order of importance.","Priority for the parent chain: functional group first, then multiple bonds, then substituents. FMS.",0],["When numbering a chain with a double bond and a triple bond with no other functional group, the lowest numbers go to:",["the substituents, before both multiple bonds","the double bond, before the triple bond","whichever gives the lowest sum","the triple bond, before the double bond"],1,"The notes give the order FG > double bond > triple bond > substituent. The handwritten note says alkenes come first because they are more reactive.","Double bond gets the lowest number first, before the triple. So but-1-en-3-yne style: ene beats yne.",1],["What is the IUPAC name of CH₃CH(CH₃)CH₂CH₃?",["isobutane","2-methylpropane","2-methylbutane","3-methylbutane"],2,"The longest chain has four carbons with a methyl on C2. Numbering from the other end would give C3, which is higher.","Longest chain = 4 carbons with a methyl on C2 = 2-methylbutane. Count the chain, number from the end near the branch.",0],["What is the IUPAC name of isobutane, (CH₃)₃CH?",["2-methylbutane","1,1-dimethylethane","trimethylmethane","2-methylpropane"],3,"The longest chain is three carbons with a methyl on the middle carbon. Trimethylmethane is the derived name, not IUPAC.","Isobutane = 3 carbons chain + methyl on C2 = 2-methylpropane. Never '1-methylpropane'.",1],["When there are different alkyl groups, the substituents are written in:",["order of the carbon number from the highest to the lowest","alphabetical order, ignoring the prefixes di, tri and tetra","order of increasing size of the alkyl group","alphabetical order, including the prefixes di, tri and tetra"],1,"3-ethyl-2-methylhexane puts ethyl first because e comes before m. In dimethyl, the 'di' is not counted, so m is used.","Different groups listed alphabetically (ethyl before methyl). Ignore di-, tri- when sorting, e.g. ethyl, methyl.",1],["The correct IUPAC name of a hexane with a methyl on C3 and ethyl on C4 is:",["4-ethyl-3-methylhexane","3-methyl-4-ethylhexane","3-ethyl-4-methylhexane","3,4-ethylmethylhexane"],2,"When the two substituents could take either number, the alphabetically first group (ethyl) gets the lower number.","3-ethyl-4-methylhexane: 'e' comes before 'm'. Alphabetical order first, then numbers.",0],["How are the position numbers written when there are identical alkyl groups, as in 2,2,4-trimethylpentane?",["separated by commas, with the prefix tri for three groups","separated by commas, with the prefix di for three groups","written as one number only, with the prefix tri","separated by hyphens, with the prefix tri for three groups"],0,"Numbers are separated by commas. Numbers and words are separated by hyphens. The prefix shows how many groups there are.","Repeated groups: 2,2,4-trimethyl. Commas between numbers, 'tri' for three groups. Hyphen between numbers and name.",0],["In 3-methyl-2-pentanol, the terminal 'e' of pentane is dropped because:",["the secondary suffix begins with a consonant","the name has more than one substituent","the secondary suffix begins with a vowel","the compound has a double bond"],2,"The 'e' is removed if the suffix that follows begins with a, i, o, u or y. The -ol suffix begins with o.","Drop the final 'e' when the next suffix starts with a vowel (ol, one, al, oic). Keep it before consonants like 'nitrile'.",0],["In which name is the terminal 'e' kept?",["propanol","propanenitrile","propanal","propanoic acid"],1,"The suffix -nitrile begins with n, a consonant, so the e stays. The suffixes -oic, -al and -ol all start with a vowel.","Keep the 'e' when the suffix starts with a consonant: propane + nitrile = propanenitrile.",1],["Which of these functional groups is ALWAYS named as a prefix and never as a suffix?",["amino, –NH₂","carboxyl, –COOH","hydroxy, –OH","nitro, –NO₂"],3,"Halo, alkoxy, epoxy, nitro and nitroso are always prefixes.","Nitro, halo and alkyl groups are ONLY prefixes. Nitro never becomes a suffix. Pick nitro.",0],["In the IUPAC priority list, which of these functional groups has the highest priority?",["–COOH","–OH","–C≡N","–CHO"],0,"The order starts: carboxylic acid, sulphonic acid, anhydride, ester, acid halide, amide, nitrile, isonitrile, aldehyde, ketone, alcohol, thiol, amine, ether, C=C, C≡C, halo, nitro.","Priority: COOH > anhydride > ester > acid halide > amide > nitrile > aldehyde > ketone > alcohol > amine. Just pick –COOH.",0],["In a compound with both a ketone and an alcohol group, 3-hydroxy-3-methylbutan-2-one, why is hydroxy a prefix?",["hydroxy is always named as a prefix in every compound","the alcohol group is on a carbon with a methyl group","the ketone has a higher priority than the alcohol so it takes the suffix","the alcohol has a higher priority than the ketone so it takes the suffix"],2,"Priority: ketone (10) comes before alcohol (11). The lower-priority group becomes the prefix.","The higher priority group takes the suffix. Ketone outranks alcohol, so the alcohol becomes hydroxy.",1],["What is the IUPAC name of HOOC–CH₂–CH₂–CN?",["3-carboxypropanenitrile","3-cyanopropanoic acid","4-cyanobutanoic acid","1-cyanopropanoic acid"],1,"The acid group has a higher priority than nitrile. C1 is the COOH carbon and the CN is on C3. The CN carbon is part of the cyano prefix, not the chain.","COOH on top, CN lower: cyano becomes the prefix. Number from COOH as C1: 3-cyanopropanoic acid.",0],["CH₃–CO–CHO is named 2-oxopropanal and not propane-1,2-dione because:",["the compound has two oxygen atoms and must be named as a dione","the ketone has a higher priority than the aldehyde so it takes the suffix","aldehyde and ketone have equal priority so alphabetical order is used","the aldehyde has a higher priority than the ketone so it takes the suffix"],3,"The aldehyde (9) outranks the ketone (10). The ketone becomes an oxo prefix and the CHO carbon is C1.","Aldehyde > ketone, so aldehyde gets the suffix 'al' and the ketone becomes 'oxo'. Name: 2-oxopropanal.",1],["The special suffix 'carboxylic acid' (instead of 'oic acid') is used when:",["the –COOH is directly attached to a ring carbon, as in cyclopropanecarboxylic acid","the compound is an acid with fewer than 3 carbons","the acid has a halogen substituent","the compound has a double bond in the chain"],0,"The special suffixes are used for ring-attached groups and also for acyclic compounds with 3 or more of the same group.","–COOH directly on a RING carbon = carboxylic acid suffix. If it is on a chain, 'oic acid'.",0],["Which of these acyclic compounds needs the special suffix (carbaldehyde, carboxylic acid, carbonitrile)?",["butane-1,4-dicarboxylic acid, having two –COOH groups","pentane-1,2,4-tricarbaldehyde, having three –CHO groups","propanenitrile, having one –CN group","pentanedial, having two –CHO groups"],1,"For an acyclic chain, the special suffix is needed when there are 3 or more of the same group. With two, you can use the carbon in the chain.","Acyclic with 3 –CHO groups: chain carbon would be counted wrongly, so the special suffix tricarbaldehyde is needed.",1],["2-Hydroxybenzenecarboxylic acid is better known by which IUPAC name?",["2-benzoylphenol","2-hydroxyphenoic acid","2-hydroxybenzoic acid","2-hydroxybenzoyl acid"],2,"Benzenecarboxylic acid is benzoic acid. So the compound is 2-hydroxybenzoic acid, which is salicylic acid.","2-hydroxybenzenecarboxylic acid is salicylic acid. IUPAC form: 2-hydroxybenzoic acid.",0],["Which pair of names for the same compound is correct?",["methyl acetate and ethyl methanoate","acetone and ethanone","acetonitrile and propanenitrile","acetone and propanone"],3,"Acetone is CH₃COCH₃, propanone. Methyl acetate is methyl ethanoate. Acetonitrile is ethanenitrile.","Acetone = propanone. Match the 3-carbon ketone with its two names. Skip pairs that mention another compound.",0]]},{"t":"Homologous Series and Functional Groups","q":[["A homologous series is a group of compounds that:",["have the same number of carbon atoms but different functional groups","have the same physical properties but different chemical properties","have the same molecular formula but different structures and different properties","have the same functional group, the same general formula and similar chemical properties"],3,"Members of a series share the functional group, so they react alike. Only the chain length changes.","Homologous = same functional group + same general formula + same method of preparation. Pick the option that lists them together.",0],["Two adjacent members of a homologous series differ by:",["a –CH₃ unit, which is 15 atomic mass units","a –CH₂– unit, which is 14 atomic mass units","two hydrogen atoms, which is 2 atomic mass units","a –CH= unit, which is 13 atomic mass units"],1,"CH₂ = 12 + 2 = 14. That is the gap between neighbours like ethane and propane.","Neighbours differ by CH₂ = 14 u (12 + 2). When you see 14, tick it.",0],["What is the general formula of the alkanes, and the smallest value of n?",["CₙH₂ₙ₊₂ with n ≥ 1","CₙH₂ₙ₋₂ with n ≥ 2","CₙH₂ₙ with n ≥ 2","CₙH₂ₙ₊₂ with n ≥ 0"],0,"Methane, CH₄, is the first alkane with n = 1.","Alkane CₙH₂ₙ₊₂, smallest n = 1 (methane). Alkane always starts at 1.",0],["For monocarboxylic acids CₙH₂ₙ₊₁COOH, the smallest value of n is:",["1, giving methanoic acid, HCOOH","2, giving ethanoic acid, CH₃COOH","0, giving methanoic acid, HCOOH","1, giving ethanoic acid, CH₃COOH"],2,"When n = 0 the formula is just HCOOH. Aldehydes CₙH₂ₙ₊₁CHO also start at n = 0, giving HCHO.","Acid CₙH₂ₙ₊₁COOH: n = 0 gives H–COOH, methanoic acid. The formula already has one carbon in COOH.",1],["Which of these has the general formula CₙH₂ₙ with n ≥ 3?",["cycloalkanes","1-alkynes","alkanes","1-alkenes"],0,"A ring needs at least 3 carbons. Alkenes have the same formula but start at n = 2.","CₙH₂ₙ with n ≥ 3: a ring needs at least 3 carbons. Cycloalkane.",0],["Which pair of compounds share the same general formula CₙH₂ₙ but are in different series?",["alkanes and alkenes","alkanes and cycloalkanes","alkenes and alkynes","1-alkenes and cycloalkanes"],3,"A double bond and a ring each remove two hydrogens from CₙH₂ₙ₊₂, so they match. They are still different series because the functional group is different.","Same formula, different series: 1-alkenes and cycloalkanes. Both CₙH₂ₙ, so mind the extra ring.",1],["The general formula of a 1-alkyne and its smallest n are:",["CₙH₂ₙ₋₂ with n ≥ 1","CₙH₂ₙ₋₂ with n ≥ 2","CₙH₂ₙ₋₃ with n ≥ 2","CₙH₂ₙ with n ≥ 2"],1,"Ethyne, C₂H₂, is the first alkyne. CₙH₂ₙ₋₃ is for the alkynyl group.","Alkyne CₙH₂ₙ₋₂, n ≥ 2. Minus 2 H from alkane per extra bond (alkene −2, alkyne −4 = −2 relative to alkene).",0],["The general formula for an alkyl halide is:",["CₙH₂ₙ₊₂X with n ≥ 1","CₙH₂ₙX with n ≥ 2","CₙH₂ₙ₊₁X with n ≥ 1","CₙH₂ₙ₋₁X with n ≥ 1"],2,"An alkyl group CₙH₂ₙ₊₁ plus a halogen X. The same pattern holds for alcohols, CₙH₂ₙ₊₁OH.","Alkyl halide = alkyl + X = CₙH₂ₙ₊₁X. Same as alkyl, plus halogen.",0],["The general formula of a ketone, written (CₙH₂ₙ₊₁)₂CO, starts at n =",["1, giving propanone, CH₃COCH₃","3, giving pentanone","2, giving butanone, CH₃COC₂H₅","0, giving methanone, HCOH"],0,"Two alkyl groups need at least one carbon each. So the smallest ketone has 3 carbons, acetone.","Ketone smallest is propanone. R + R + C=O = at least 3 carbons, so n = 1.",0],["Which of these represents the repeating unit of the polyacetylenes?",["–NH–","–CH=CH–","–CX₂–","–CH₂–"],1,"Polyacetylenes have the general formula C₂ₙH₂ₙ₊₂. Perhaloalkanes repeat –CX₂– and azanes repeat –NH–.","Polyacetylene unit = –CH=CH–. Same as acetylene after it opens up.",0],["What is the general formula of the azanes?",["CₙF₂ₙ₊₂, with –CF₂– as the repeating unit","CₙH₂ₙ₊₂, with –CH₂– as the repeating unit","NₙHₙ₊₂, with –NH– as the repeating unit","NₙH₂ₙ, with –NH₂– as the repeating unit"],2,"Azanes are the nitrogen version of alkanes. Ammonia, NH₃, is n = 1 and hydrazine, N₂H₄, is n = 2.","Azane = N–H chain, repeating –NH–. Formula NₙHₙ₊₂. Mirrors alkane's pattern.",0],["Homologues in a series differ in which of these?",["general formula, because of the change in the number of carbon atoms","chemical properties, because of the change in functional group","methods of preparation, because of the change in functional group","physical properties, because of the change in molecular mass"],3,"Same FG means same chemistry and same preparation method. The boiling point, density and so on change with the size of the molecule.","Homologues share chemical properties, but physical properties change with molecular mass. Pick 'physical'.",1],["A functional group is best described as:",["any atom in the molecule that is bonded to a carbon atom","the longest continuous chain of carbon atoms in the molecule","an atom or group of atoms in a molecule that decides its identity and reactivity","the part of a molecule that has no effect on its reactions"],2,"The FG is the reactive part of the molecule. It can be a single atom such as –Br or a group such as –COOH.","Functional group = the part that decides the reactions. 'Decides' or 'determines' is the keyword.",0],["Which pair shows a bond-type functional group with its correct name?",["C=C, alkyne and C≡C, alkene","C=C, alkene and C≡C, alkyne","C–C, alkene and C=C, alkane","C–O, alkyne and C=O, alkene"],1,"Bond-based functional groups are the single, double and triple carbon bonds. Arenes have alternating single and double bonds.","C=C is alkene, C≡C is alkyne. Match the bond to the name directly. Skip the other pairs.",0],["R–OH, Ar–OH and R–O–R are respectively:",["an ether, a phenol and an alkanol","a phenol, an alkanol and an ether","an alkanol, an ether and a phenol","an alkanol, a phenol and an ether"],3,"Ar means an aromatic group. So when –OH sits on a benzene ring it is a phenol.","R–OH alkanol, Ar–OH phenol, R–O–R ether. Ar means aromatic ring.",0],["An acetal has which general structure?",["R–CH(OR)₂, two OR groups on the same carbon from an aldehyde","R–C(OH)(OR)–R, one OH and one OR on the carbon of a ketone","R–C(OR)₂–R, two OR groups on the carbon of a ketone","R–CH(OH)(OR), one OH and one OR on the same carbon"],0,"The four are acetal, hemiacetal, ketal and hemiketal. Acetals and hemiacetals come from aldehydes. Ketals and hemiketals come from ketones. The 'hemi' ones have one OH.","Acetal = TWO OR groups on the same carbon from an aldehyde. R–CH(OR)₂.",1],["A hemiketal has the structure:",["R–C(OR)₂–R","R–CH(OH)(OR)","R–C(OH)(OR)–R","R–CH(OR)₂"],2,"Ketone carbon with one OH and one OR. R–C(OR)₂–R is a ketal, R–CH(OH)(OR) is a hemiacetal and R–CH(OR)₂ is an acetal.","Hemi = half. Hemiketal has one OH and one OR: R–C(OH)(OR)–R. Both different groups on one carbon.",1],["Which of these is a nitrogen-containing functional group?",["–SO₃H, sulphonic acid","–NO₂, nitro","–SH, thiol","–COOH, carboxyl"],1,"The nitrogen group list: amino (–NH₂), nitrile (–CN), nitro (–NO₂) and amide (–CONH₂).","Nitro –NO₂ contains N. Other options are O or S groups. Look for the letter N.",0],["Which of these is the functional group of a mercaptan?",["–SO₂–","–OH","–S–S–","–SH"],3,"A thiol or mercaptan is the sulphur version of an alcohol. R–S–S–R is a disulfide and R₂SO₂ is a sulfone.","Mercaptan = thiol = –SH. 'S' for sulphur and 'H' for hydrogen.",0],["Which pairing of sulphur compounds is correct?",["R–S–S–R is a disulfide and R₂SO₂ is a sulfone","R–S–S–R is a sulfone and R₂SO₂ is a disulfide","R–SO₂–X is a sulfinyl halide and R–SO–X is a sulfonyl halide","R–S–R is a sulfite and R–SO₃–R is a thioether"],0,"R–SO₂–X is sulfonyl and R–SO–X is sulfinyl. R–S–R is the thioether (sulfane). R–SO₃–R is an organic sulfite.","R–S–S–R = disulfide (two S). R₂SO₂ = sulfone (two O). Count S and O.",1],["A hydrogen bond is:",["a covalent bond formed by the complete sharing of two electrons between two hydrogen atoms","a very strong attraction between two nonpolar molecules that have no permanent dipole","an ionic bond between a hydrogen ion and a negatively charged atom in the same molecule","a partial electrostatic attraction between H bonded to N, O or F and an atom with a lone pair"],3,"It can be intermolecular (between molecules) or intramolecular (inside one molecule). It is weaker than a normal covalent bond.","H bond = partial attraction between H (on N, O or F) and another N, O or F. Not a full bond.",0],["In classifying a compound as 1°, 2° or 3°, we count:",["the number of functional groups in the molecule","the number of alkyl groups on the carbon that carries the functional group","the number of hydrogen atoms on the carbon next to the functional group","the total number of carbon atoms in the molecule"],1,"Primary has 2 or 3 H (0 or 1 alkyl). Secondary has 1 H (2 alkyl). Tertiary has 0 H (3 alkyl).","1°/2°/3° = count the alkyl groups on the carbon carrying the group. Zero or one = 1°. Two = 2°. Three = 3°.",0],["Which of these is a tertiary alcohol?",["(CH₃)₃C–OH","CH₃CH₂CH₂–OH","(CH₃)₂CH–OH","CH₃CH(OH)CH₂CH₃"],0,"The carbon with OH must have no hydrogen and three alkyl groups. (CH₃)₂CHOH and CH₃CH(OH)CH₂CH₃ are secondary.","Tertiary alcohol = OH on a carbon with three alkyl groups. (CH₃)₃C–OH. Count the methyls around the carbon.",1],["Is CH₃CH₂CH₂CH₂–OH a primary alcohol, because the longest chain has four carbons?",["Yes, because the chain has exactly four carbons, and four carbons always means primary","No, it is secondary because the chain has four carbons and so more than one alkyl group","Yes, because the carbon with OH has only one alkyl group and two H atoms","No, it is tertiary because the long chain makes the carbon with OH very crowded"],2,"The chain length does not decide the class. The carbon carrying OH has two H and one alkyl group, so it is primary.","Primary: the carbon bearing OH has only ONE alkyl group. Chain length is irrelevant. Answer: yes.",1],["From the notes, how does the stability of the 1°, 2° and 3° compounds change?",["stability increases: 1° < 2° < 3°","stability increases: 3° < 2° < 1°","stability is the same for all three","stability increases: 2° < 1° < 3°"],0,"The more alkyl groups on the carbon, the more stable it is. Reactivity moves the other way, as the notes say.","Stability goes with the carbon type: 3° is most stable. 1° < 2° < 3°.",0],["According to the notes, the order of reactivity is:",["all have equal reactivity","primary > secondary > tertiary","secondary > primary > tertiary","tertiary > secondary > primary"],1,"Reactivity increases 3° < 2° < 1°. The tertiary one is mostly non-reactive because the bulky groups block the reacting site.","The order of reactivity as given: 1° > 2° > 3°. If the options reverse it, look at the notes' direction.",1],["Steric hindrance is:",["the attraction between two charged atoms in the molecule","the removal of a small molecule from two neighbouring carbons","the blocking of a reaction site by the bulky groups around the functional group carbon","the increase in reactivity caused by a very large molecular mass"],2,"Bulky groups crowd the carbon and stop reagents from getting in. So reactions go slower.","Steric hindrance = bulky groups block the reaction site. Pick 'blocking'.",0],["In which class of compound is steric hindrance the greatest?",["primary, because it has the most hydrogen atoms around the carbon","secondary, because it has two alkyl groups around the carbon","all three have equal steric hindrance","tertiary, because it has three alkyl groups around the carbon"],3,"More alkyl groups means more bulk. So hindrance increases 1° < 2° < 3°. The book's arrow can be confusing but this is the correct order.","3° has the most groups, so the most crowding. Tertiary = greatest steric hindrance.",1],["Which of these functional groups is mono-functional and which is bi-functional?",["–CO is bi-functional and –COOR is mono-functional","–COOH is mono-functional and –OH is bi-functional","–NH₂ is bi-functional and –CONH₂ is mono-functional","–OH is mono-functional and –COOH is bi-functional"],3,"–COOH has a carbonyl and a hydroxyl in one group. –CONH₂ and –COOR are also bi-functional.","–OH has one bond site, –COOH has two parts (C=O and OH). So OH mono, COOH bi.",0],["An amino acid has both –NH₂ and –COOH groups. It is therefore:",["difunctional","monofunctional","non-functional","polyfunctional only if it has three carbons"],0,"Two functional groups on one compound make it difunctional.","Two different functional groups = difunctional. NH₂ + COOH → difunctional.",0],["What is the IUPAC name of OHC–CH₂CH₂CH₂–CHO?",["pentane-1,5-diol","pentan-5-one","pentane-1,5-dial","pentanal"],2,"Two aldehyde groups on a 5-carbon chain, one at each end. The notes write it as pentan-1,5-dial.","Both ends CHO on a 5-carbon chain: pentane-1,5-dial. Write -dial for two aldehydes.",0],["What is the name of a compound with a double bond at C4, an OH on C1 and 6 carbons?",["4-hydroxyhex-1-ene","hex-4-en-1-ol","hexan-4-en-1-ol","hex-1-en-4-ol"],1,"The alcohol is the main group, so it takes the lowest number and the suffix -ol. The double bond is named as -en- in the middle.","Name = hex (6 C) + 4-en + 1-ol: hex-4-en-1-ol. Read the numbers in order.",0],["Which of these groups are hydrophilic because they form hydrogen bonds?",["–Cl and –Br","–CH=CH₂ and –C≡CH","–OH, –COOH and –NH₂","–CH₃ and –C₂H₅"],2,"Hydrophilic means water-loving. Groups that can hydrogen bond with water are hydrophilic. Methyl and other hydrocarbon groups are nonpolar and hydrophobic.","Hydrophilic = H-bond makers: –OH, –COOH, –NH₂. All have H on O or N.",0],["Which of these functional groups releases H⁺ in water and so acts as an acid?",["amino and sulfhydryl","carboxyl and phosphate","amino and hydroxyl","hydroxyl and methyl"],1,"Carboxyl and phosphate ionise and release H⁺. The amino group accepts H⁺ to form –NH₃⁺, so it is basic.","Releases H⁺ = acid. Carboxyl (–COOH) and phosphate. Alcohol –OH is too weak.",1],["Which description of the carbonyl group is correct?",["It is a polar group, C–N, found in amides only","It is a charged group, C–OH, that releases H⁺","It is a nonpolar group, C=O, found in aldehydes and ketones","It is a polar group, C=O, found in aldehydes and ketones"],3,"The C=O bond is polar because O pulls electrons. It is the group that defines aldehydes, ketones, acids and esters.","Carbonyl = C=O, polar, in aldehydes and ketones. Check for the C=O pair.",0]]},{"t":"Organic Reactions","q":[["A chemical reaction is best described as:",["a process in which a substance changes only its state, with no bonds broken or formed","a process in which atoms are created or destroyed to form a new substance","a process in which two substances mix together without any change in their identity","a process in which one substance is converted into another, with bonds broken and new bonds formed"],3,"In a reaction, old bonds break and new ones form, so a new substance appears. Atoms are never created or destroyed.","Reaction = one substance turned into another. 'Converted into' is the key phrase.",0],["Which of these is NOT one of the four main types of organic reactions?",["neutralisation","molecular rearrangement","elimination","substitution"],0,"The four types are substitution, elimination, addition and molecular rearrangement.","The four types: substitution, addition, elimination, rearrangement. Neutralisation is acid-base, so it is the odd one.",1],["In a substitution reaction:",["the carbon skeleton changes without any group leaving","a small molecule is added across a double bond","an atom or group in a molecule is displaced by another atom or group","a small molecule is removed from two neighbouring carbons"],2,"Substitution is a swap: one group out, another group in.","Substitution = swap. One atom or group leaves, another comes in. 'Displaced' is the clue.",0],["Aliphatic compounds such as alkyl halides mainly undergo which type of substitution?",["free radical addition","nucleophilic substitution","electrophilic addition","electrophilic substitution"],1,"Alkyl halides have a carbon with a partial positive charge, so it is attacked by a nucleophile.","Alkyl halides (aliphatic) are attacked by Nu⁻. Pick nucleophilic. Benzene is the opposite.",0],["In the reaction R–X + Nu⁻ → R–Nu + X⁻, which is the leaving group?",["Nu⁻","R–Nu","R","X⁻"],3,"X leaves with the bonding electrons. The nucleophile Nu comes
