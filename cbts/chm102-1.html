 in and takes its place on carbon.","Leaving group = the one that leaves with the electrons. In R–X, that is X⁻.",0],["Which of these can act as a nucleophile (Nu)?",["AlCl₃, FeCl₃ and BF₃","H⁺, NO₂⁺ and Cl⁺","OH⁻, CN⁻ and NH₃","CH₄, C₂H₆ and C₃H₈"],2,"A nucleophile has a lone pair or a negative charge, and attacks a positive centre. The notes list OH, NH₂, CN, SH, OR' and NHR'. H⁺ and NO₂⁺ are electrophiles.","Nucleophile = has a lone pair or negative charge. OH⁻, CN⁻, NH₃ all have lone pairs.",0],["Benzene undergoes which type of substitution, and why?",["electrophilic, because the ring has a high electron density","electrophilic, because the ring is electron poor","nucleophilic, because the ring has a high electron density","nucleophilic, because the ring is electron poor"],0,"The π electron cloud above and below the ring is rich in electrons, so it attracts positive reagents, called electrophiles.","Benzene = electron-rich ring, so electrophile attacks. Electron-rich needs electron-lovers: electrophilic.",1],["In electrophilic substitution of benzene, the leaving group is always:",["a halogen atom on the ring","a hydrogen atom on the ring, lost as H⁺","a carbon atom of the ring","the electrophile, which leaves immediately"],1,"The electrophile replaces a ring H. The H leaves as a proton so that the aromatic ring is restored.","Benzene's leaving group is always H⁺. The ring loses H and keeps its aromaticity.",0],["What reagents convert benzene to nitrobenzene?",["dilute hydrochloric acid and zinc metal, heated under reflux","concentrated nitric acid and concentrated sulphuric acid","sodium hydroxide solution and heat, in an open flask","chlorine gas and iron(III) chloride, kept away from light"],1,"The mixture HNO₃/H₂SO₄ makes the nitronium ion, NO₂⁺, which attacks the ring.","Nitration = conc. HNO₃ + conc. H₂SO₄ (the 'nitrating mixture'). Both concentrated.",0],["Why are alkenes and alkynes more reactive than alkanes?",["they contain π bonds, which are weaker than σ bonds and break easily","they contain σ bonds, which are weaker than π bonds","they have only single bonds, so they are very crowded","they have more hydrogen atoms, so they are less stable"],0,"The π bond is formed by side-on overlap, so it is weaker and its electrons are more exposed. They are attacked by electrophiles.","π bond is weaker than σ, so easier to break. That makes alkenes and alkynes reactive.",0],["A C=C double bond is made up of:",["one σ bond and two π bonds","two π bonds","one σ bond and one π bond","two σ bonds"],2,"A triple bond has one σ and two π. A double bond has one σ and one π.","Double bond = 1 σ + 1 π. Triple = 1 σ + 2 π.",0],["In an addition reaction, the multiple bond is attacked by:",["free electrons, because the bond is ionic","nucleophiles, because the bond has a low electron density","neutral atoms only, because the bond is nonpolar","electrophiles, because the bond has a high electron density"],3,"The π electrons are available, so positive reagents like H⁺ and Br⁺ come to them.","π bond is electron-rich, so electrophiles attack it. Addition at C=C is electrophilic.",0],["Ethene is bubbled through bromine water. What do you observe, and what does it show?",["the solution turns green, showing that the compound is saturated","the orange-brown colour stays, showing that the compound is unsaturated","a white precipitate forms, showing that the compound is saturated","the orange-brown colour disappears, showing that the compound is unsaturated"],3,"Bromine adds across the double bond to give 1,2-dibromoethane, which is colourless. The colour loss is the test for unsaturation.","Orange-brown bromine water turns colourless = unsaturation (C=C or C≡C) present. Colour gone = positive.",0],["What is the product when ethene reacts with bromine?",["1,1-dibromoethane, CH₃CHBr₂","1,2-dibromoethane, CH₂BrCH₂Br","bromoethane, CH₃CH₂Br","bromoethene, CH₂=CHBr"],1,"Br₂ adds to the two carbons of the double bond, one Br to each carbon.","Br₂ + CH₂=CH₂ gives CH₂Br–CH₂Br. One Br on each carbon: 1,2-dibromoethane.",0],["Which of these gives a positive bromine test, decolourising it quickly?",["methane, CH₄","ethane, CH₃CH₃","propyne, CH₃C≡CH","propane, CH₃CH₂CH₃"],2,"The saturated alkanes do not decolourise bromine in the dark. Alkenes and alkynes do.","Alkyne decolourises bromine fast, because it has two π bonds. Pick propyne, the only unsaturated option.",1],["What is formed when propyne is treated with two moles of hydrogen over a Ni catalyst?",["propane, going through propene","cyclopropane","propene only","propene, then propyne again"],0,"The first mole turns the triple bond into a double bond (propene). The second turns the double bond into a single bond (propane).","2 H₂ added to an alkyne gives an alkane via the alkene. Propyne + 2H₂ → propane.",0],["What catalyst is used in the addition of hydrogen to an alkene?",["nickel or platinum","iron(III) chloride or aluminium chloride","concentrated sulphuric acid","potassium dichromate"],0,"H₂/Ni or Pt is called catalytic hydrogenation. FeCl₃ and AlCl₃ are used for halogenation of benzene.","Hydrogenation catalyst = Ni or Pt (or Pd). Nickel for exam answers.",0],["Elimination is described as:",["the replacement of one group by another group on the same carbon atom","the removal of a small molecule from two adjacent carbons to form a double bond","the movement of an atom or group from one carbon of the chain to another carbon","the addition of a small molecule across a double bond to give a saturated compound"],1,"Elimination makes C=C by taking out a molecule such as H₂O or HX. It is the reverse of addition.","Elimination = remove a small molecule (H₂O, HX) from two adjacent carbons. A double bond forms.",0],["Which pair of reactions are reverse processes?",["addition and substitution","substitution and rearrangement","elimination and rearrangement","addition and elimination"],3,"Add a small molecule across C=C and you have addition. Remove it and you have elimination.","Addition and elimination are opposites: one adds across a double bond, the other forms it.",0],["Ethanol is heated with concentrated sulphuric acid at the right temperature to give ethene. What type of reaction is this?",["addition (hydration)","substitution (hydrolysis)","elimination (dehydration)","rearrangement (isomerisation)"],2,"Water is removed from adjacent carbons of the alcohol, so it is dehydration, a type of elimination.","Alcohol + conc. H₂SO₄ (heat) = dehydration = elimination. Water is removed.",0],["At which temperature should ethanol and concentrated H₂SO₄ be heated to obtain ethene?",["about 443 K (170 °C). The book writes 403 K, which is too low and tends to give ether","about 403 K (130 °C), which is the temperature that gives ethene best","about 373 K (100 °C), the boiling point of water, which gives ethene","about 573 K (300 °C), which gives diethyl ether best"],0,"The standard temperature for ethene is 170 °C, which is 443 K. A lower temperature, about 140 °C (413 K), favours diethyl ether. The book's 403 K is a slip.","Ethene from ethanol needs 443 K (170 °C), conc. H₂SO₄. Below it (413 K) you get ether. Ignore 403 K in the book.",1],["Molecular rearrangement is a reaction in which:",["a small molecule is lost from two neighbouring carbons to give a double bond","a group on the molecule is replaced by a different group from the reagent","the carbon skeleton changes because an atom or group migrates within the molecule","a multiple bond takes up a small molecule to give a more saturated compound"],2,"Nothing is added or removed. The atoms are rearranged, giving an isomer.","Rearrangement = atoms move inside the molecule, skeleton changes. Pick 'atom or group migrates'.",0],["What happens when 1-chlorobutane is treated with AlCl₃?",["it forms 1,2-dichlorobutane","it forms butane and aluminium chloride","it eliminates HCl to give 1-butene","it rearranges to 2-chlorobutane"],3,"The Lewis acid helps the chlorine move to the second carbon. That is molecular rearrangement. The two are structural isomers.","AlCl₃ turns 1-chlorobutane into 2-chlorobutane. The chlorine moves to the more stable carbon.",0],["A reaction mechanism is:",["the overall equation of the reaction without the intermediates","a detailed description of the steps by which reactants change into products","the catalyst used in the reaction","the rate at which products are formed from reactants"],1,"A mechanism shows each step, including intermediates and which bonds break first.","Mechanism = step-by-step description. 'Steps' is the keyword.",0],["Which of these reactions is a substitution reaction?",["CH₂=CH₂ + Br₂ → CH₂BrCH₂Br","CH₃CH₂Br + OH⁻ → CH₃CH₂OH + Br⁻","CH₃CH₂CH₂CH₂Cl → CH₃CHClCH₂CH₃","CH₃CH₂OH → CH₂=CH₂ + H₂O"],1,"Br is replaced by OH. The second is an addition. The third is an elimination. The last is a rearrangement.","Substitution = X⁻ replaced by OH⁻. CH₃CH₂Br → CH₃CH₂OH. Look for one group swapped for another.",1],["Which reaction type is the reaction CH₂=CH₂ + H₂O → CH₃CH₂OH?",["rearrangement","elimination","addition","substitution"],2,"Water adds across the double bond and the double bond is lost. It is the reverse of the dehydration of ethanol.","CH₂=CH₂ + H₂O → CH₃CH₂OH: two molecules join to one = addition.",0],["Why does benzene prefer substitution to addition?",["addition would destroy the stable aromatic ring, while substitution keeps it","benzene has no π electrons, so it cannot take part in addition reactions","addition would be too fast to control, while substitution is a slow reaction","benzene has only single bonds in the ring, so it behaves like an alkane"],0,"The ring is stabilised by resonance. Addition would break that stability. Substitution replaces H and keeps the ring.","Substitution keeps the ring. Addition would destroy aromatic stability. Pick 'destroy the ring'.",0],["In the electrophilic substitution of benzene, the first step is the attack of the electrophile to form:",["the final substituted product, which is a fast step","a free radical, which is a slow step","a carbanion, which is a fast step","a carbocation (benzenonium or arenium ion), which is a slow step"],3,"The electrophile uses two π electrons to bond to carbon, leaving a positive charge on the ring. The loss of H⁺ then follows quickly.","First step: electrophile attacks the ring giving a carbocation (arenium ion). Ring temporarily loses aromaticity.",0],["An electrophile is a species that:",["has no charge and never takes part in reactions with a π bond","accepts a pair of electrons and is attracted to electron-rich centres","is always a negative ion with a lone pair of electrons","donates a pair of electrons and is attracted to electron-poor centres"],1,"Electrophile means electron-loving. NO₂⁺, H⁺ and Br⁺ are examples.","Electrophile = electron-pair acceptor, loves electrons. E⁺ is positive or electron-poor.",0],["What is the organic product when bromoethane reacts with sodium cyanide?",["propanenitrile, CH₃CH₂CN","ethanenitrile, CH₃CN","ethanol, CH₃CH₂OH","ethylamine, CH₃CH₂NH₂"],0,"CN⁻ replaces Br⁻ by nucleophilic substitution. The carbon of CN is added to the chain, which gives three carbons.","CN⁻ replaces Br⁻: adds one carbon. Bromoethane (2C) + CN → 3C = propanenitrile.",1],["How many moles of hydrogen are needed to convert one mole of ethyne completely to ethane?",["3 moles","4 moles","2 moles","1 mole"],2,"Ethyne to ethene takes one mole. Ethene to ethane takes another mole. A triple bond has two π bonds, so two moles in all.","Ethyne → ethene (1 H₂) → ethane (2 H₂). Count the π bonds: two π = 2 moles.",0],["Which of these cannot undergo an elimination reaction to give an alkene?",["2-bromopropane, CH₃CHBrCH₃","chloroethane, CH₃CH₂Cl","ethanol, CH₃CH₂OH","chloromethane, CH₃Cl"],3,"Elimination removes H from one carbon and the group from the next carbon. Chloromethane has only one carbon, so there is no adjacent carbon to form a double bond.","Elimination needs two adjacent carbons. CH₃Cl has only one carbon, so it cannot. One carbon = no alkene.",1]]},{"t":"Benzene","q":[["Benzene is the prototype of the aromatic compounds. What is its molecular formula?",["C₅H₅N","C₆H₁₂","C₆H₆","C₆H₁₄"],2,"Six carbons in a ring with one hydrogen on each carbon. C₆H₁₂ is cyclohexane and C₅H₅N is pyridine.","Benzene = 6 C and 6 H = C₆H₆. Remember 'six and six' and skip the rest.",0],["Benzene is unsaturated, yet its reactivity is low. What does it mainly undergo?",["rearrangement reactions, which change the ring size","elimination reactions, which open the ring","addition reactions, as all unsaturated compounds do","substitution reactions, which keep the ring intact"],3,"The stable aromatic ring is kept in substitution. Addition would destroy it.","Unsaturated but unreactive: benzene substitutes, it does not add. Substitution keeps the ring.",1],["What did Kekulé's 1865 structure of benzene explain?",["only one monosubstituted product and three isomers for every disubstituted derivative","only one monosubstituted product and only one disubstituted isomer","two monosubstituted products and two disubstituted isomers","three monosubstituted products and six disubstituted isomers"],0,"All six carbons are equivalent, so any one substitution gives one product. The three disubstituted isomers are ortho, meta and para.","Kekulé: one mono-substituted product + three disubstituted isomers (o, m, p). Pick the option with 1 and 3.",0],["In a disubstituted benzene, ortho, meta and para refer to positions:",["1,4, 1,3 and 1,2 respectively","1,2, 1,3 and 1,4 respectively","1,3, 1,2 and 1,4 respectively","1,2, 1,4 and 1,3 respectively"],1,"Ortho is next door, meta skips one and para is across the ring.","Ortho 1,2. Meta 1,3. Para 1,4. Alphabet order O, M, P matches 2, 3, 4.",0],["The bond angle and the C–C bond length of benzene are:",["120° and 109 pm","180° and 120 pm","109.5° and 154 pm","120° and 139 pm"],3,"The ring is flat with sp² carbons, so 120°. The C–C length of 139 pm lies between a single bond (154 pm) and a double bond (134 pm). The C–H length is 109 pm.","Benzene: 120° and 139 pm. All C–C bonds sit between a single (154) and a double (134) bond.",0],["Which of these C–C bond lengths in benzene is correct?",["all six are 134 pm","all six are equal, at 139 pm","all six are 154 pm","three are 154 pm and three are 134 pm"],1,"Benzene is a resonance hybrid, so the bonds are all identical. The Kekulé picture with alternating bonds is only a drawing.","All six bonds are equal, 139 pm. Anything that mentions 'alternating' is wrong.",1],["In benzene, each carbon atom is:",["sp² hybridised, using two sp² orbitals for C–C σ bonds and one for the C–H σ bond","sp³ hybridised, using four sp³ orbitals for σ bonds to two carbons and two hydrogens","unhybridised, using only its 2p orbitals for the C–C σ bonds and its 2s orbital for the C–H bond","sp hybridised, using two sp orbitals for the two C–C bonds and leaving the C–H bond unhybridised"],0,"The leftover p orbitals overlap sideways to make the delocalised π cloud above and below the ring.","Each carbon is sp²: 2 σ to carbons, 1 σ to H, 1 p orbital for the π cloud. Pick 'sp²'.",0],["Benzene boils at about 80 °C and melts at 5.5 °C. This means that at room temperature it is:",["a white solid","a colourless gas","a colourless liquid","a yellow liquid"],2,"Room temperature is around 25 °C, which is above the melting point and below the boiling point.","Boils 80 °C, melts 5.5 °C. Room temp (25 °C) lies between, so it is a liquid.",0],["Which of these statements about benzene is NOT correct?",["it burns with a sooty flame","it is soluble in water","it is insoluble in water","it is soluble in organic solvents"],1,"Benzene is nonpolar, so it does not dissolve in water. It burns with a smoky flame because of the high carbon content.","NOT correct: soluble in water. Benzene is non-polar and does not dissolve in water. Tick that.",1],["Which health risk is linked to benzene?",["it is a harmless solvent that is safe to inhale","it is a mild antiseptic that helps wound healing","it is a vitamin and increases the body's resistance","it is carcinogenic and increases the risk of cancer"],3,"Benzene is toxic and carcinogenic. That is why toluene is now used in many places where benzene was used before.","Benzene → cancer (carcinogenic). Any cancer-linked option wins.",0],["Benzene is a good solvent for which of these?",["water and other polar liquids","sugars and amino acids","fats, resins, iodine, sulphur and phosphorus","ionic salts like sodium chloride and potassium nitrate"],2,"Nonpolar solvents dissolve nonpolar solutes. Ionic salts and sugars prefer water.","Benzene dissolves non-polar things: fats, resins, iodine, sulphur, phosphorus. Not salts.",0],["Which of these is aniline?",["C₆H₅NH₂","C₆H₅COOH","C₆H₅CH₃","C₆H₅OH"],0,"Phenol is PhOH, toluene is PhMe, aniline is PhNH₂, and benzoic acid is PhCOOH.","Aniline = C₆H₅NH₂. 'Amine' on a benzene ring. Look for NH₂.",0],["Biphenyl, naphthalene and anthracene are all benzene derivatives. In which one are the rings joined by a single bond only?",["biphenyl, C₆H₅–C₆H₅","naphthalene","none of them","anthracene"],0,"Naphthalene and anthracene are fused rings that share carbon atoms. Biphenyl has two rings joined by a single bond.","Single-bonded rings = biphenyl (C₆H₅–C₆H₅). Naphthalene and anthracene are fused.",0],["The limit of the fusion of benzene rings is:",["fullerene, a hydrogen-rich allotrope of carbon","graphite, a hydrogen-free allotrope of carbon","diamond, a hydrogen-rich allotrope of carbon","benzene itself, because the rings cannot fuse any further"],1,"Fuse more and more rings and all the hydrogens are used up. You are left with sheets of carbon, which is graphite.","Fuse the rings endlessly and you reach graphite: pure carbon, no H.",0],["Replacing one CH group of benzene with a nitrogen atom gives:",["pyrrole, C₄H₅N","pyrimidine, C₄H₄N₂","pyridine, C₅H₅N","aniline, C₆H₅NH₂"],2,"Pyridine has five carbons and one nitrogen in a six-membered ring. A second N gives pyridazine, pyrimidine or pyrazine.","Replace CH with N in benzene gives pyridine, C₅H₅N. Five carbons, one nitrogen.",0],["Can benzene be converted into pyridine by a simple reaction?",["Yes, by heating benzene with ammonia in the presence of a suitable catalyst","Yes, by nitrating benzene first and then reducing the nitro group with a metal","No, because pyridine has a larger ring than benzene and so cannot be formed","No, the ring would have to lose a carbon atom and gain a nitrogen atom, and benzene cannot do that"],3,"Pyridine is related to benzene by structure only. You cannot change one into the other directly.","Benzene → pyridine is not a simple reaction. A carbon must leave and N must enter. Pick 'No'.",1],["More than half of the benzene produced is used to make:",["aniline, which becomes dyes and nothing else in industry","cyclohexane, which becomes nylon fibres and nothing else","phenol, which becomes aspirin and similar painkillers only","ethylbenzene, which becomes styrene and then polystyrene"],3,"Benzene → ethylbenzene → styrene → polystyrene and other plastics.","Over half of benzene goes into ethylbenzene → styrene → polystyrene. Look for 'styrene'.",0],["Which is made from cumene?",["styrene and hydrogen","acetone and phenol","adipic acid and caprolactam","ethanol and acetic acid"],1,"Cumene is made from benzene and propene. It is converted to phenol and acetone. Phenol then goes to bisphenol A, which is used in polycarbonates and epoxy resins.","Cumene process gives acetone + phenol. Two products. Pick the pair.",0],["Cyclohexane, made from benzene, is a raw material for:",["epoxy resins and polycarbonates, which are made from bisphenol A","polystyrene plastics, which are made from styrene monomer","nylon 6,6 through adipic acid and nylon 6 through caprolactam","polyethylene bags and bottles, which are made from ethene"],2,"Adipic acid gives nylon 6,6 and caprolactam gives nylon 6.","Cyclohexane → adipic acid → nylon 6,6, and caprolactam → nylon 6. Both nylons.",0],["Why is toluene preferred as a substitute for benzene as a solvent?",["it is a similar solvent but less toxic, and has a wider liquid range","it is a better solvent and is completely non-toxic","it dissolves in water, which benzene does not do","it has a narrower liquid range, which makes it safer to store"],0,"Toluene is less dangerous than benzene. It is also used as a fuel additive and can be converted back into benzene.","Toluene replaces benzene as a solvent because it is less toxic. Solvent power is similar.",0],["What is the name of C₆H₅–NO₂?",["benzenenitrile","nitrophenol","phenyl nitrite","nitrobenzene"],3,"A monosubstituted benzene is named with the prefix and the word benzene, here nitro + benzene.","C₆H₅–NO₂ = nitro + benzene = nitrobenzene. Write the group first, then benzene.",0],["Which of these monosubstituted benzenes takes a new base name instead of 'prefix + benzene'?",["ethylbenzene and propylbenzene","chlorobenzene and bromobenzene","toluene, phenol and benzoic acid","nitrobenzene and fluorobenzene"],2,"Some compounds with a common group have their own parent name: toluene, phenol, benzoic acid, aniline.","New base names: toluene (methyl), phenol (OH), benzoic acid (COOH). Also aniline, benzaldehyde. Pick the three.",0],["The compound 1,3-dichlorobenzene is also called:",["m-dichlorobenzene","o-dichlorobenzene","p-dichlorobenzene","benzyl dichloride"],0,"1,3 means meta. 1,2 is ortho and 1,4 is para.","1,3 = meta. 1,3-dichlorobenzene = m-dichlorobenzene.",0],["In 1-chloro-3-ethylbenzene, why is chloro written before ethyl?",["the chloro group is larger than the ethyl group, and larger groups are always named first","substituents are in alphabetical order, and c comes before e","ethyl groups are always named last because they are alkyl groups that contain no halogen","chloro has the lower locant number, and the group with the lower number is always named first"],1,"When the substituents are different, alphabetical order decides. The numbers are fixed by the lowest locant rule.","Chloro before ethyl: c before e alphabetically. Alphabet rules the order, not the numbers.",0],["According to the course text, when is the benzene ring named as a phenyl substituent, as in 2-phenyloctane?",["whenever the compound has an alkane in it","when the alkane chain is longer than four carbons","when the alkane chain is shorter than four carbons","when the ring has more than one substituent"],1,"With a short chain, the ring is the parent (butylbenzene). With a longer chain, the chain is the parent and the ring is the phenyl group.","Phenyl is a substituent when the chain has more than four carbons: 2-phenyloctane. Chain longer = phenyl is the group.",1],["Assignment: what is the name of the benzene ring with –COOH and –NO₂ on adjacent carbons?",["2-nitrobenzoic acid (o-nitrobenzoic acid)","2-carboxynitrobenzene","4-nitrobenzoic acid (p-nitrobenzoic acid)","3-nitrobenzoic acid (m-nitrobenzoic acid)"],0,"The COOH group has the higher priority, so it is C1 and the base is benzoic acid. The adjacent carbon is C2.","COOH takes the suffix and defines position 1. NO₂ on the adjacent carbon is 2. o-nitrobenzoic acid.",0],["Assignment: aniline with bromine atoms at carbons 2, 4 and 6 is called:",["1,3,5-tribromoaniline","tribromobenzenamine at 1,3,5","2,4,6-tribromoaniline","2,4,6-tribromophenol"],2,"The NH₂ is C1 as aniline is the base name. The three Br atoms are at the 2, 4 and 6 positions.","Aniline gives position 1 to NH₂. Br at 2, 4, 6 = 2,4,6-tribromoaniline.",0],["Assignment: nitrobenzene with chlorine atoms on carbons 2 and 4 is named:",["2,4-dichlorobenzenenitro","1,3-dichloronitrobenzene","2,4-dinitrochlorobenzene","2,4-dichloronitrobenzene"],3,"The nitro group is the base position C1. The two chlorines take 2 and 4. Nitrobenzene is the parent name, so the two chloro prefixes come before it.","Nitro is on C1. Cl at 2 and 4: 2,4-dichloronitrobenzene. Number from the nitro.",0],["What conditions are used in catalytic reforming to prepare benzene?",["concentrated sulphuric acid at 170 °C and normal pressure","a platinum or rhenium catalyst at 500–525 °C and 8–50 atm","iron(III) chloride at room temperature and normal pressure","a nickel catalyst at 150 °C and 1 atm of pressure"],1,"Hydrocarbons boiling at 60–200 °C are mixed with hydrogen over the catalyst. Aromatics are extracted with diethylene glycol or sulfolane.","Catalytic reforming: Pt/Re at 500–525 °C, 8–50 atm. Recall the heat and pressure range.",0],["Toluene hydrodealkylation gives benzene. What is the other product?",["water","carbon dioxide","methane","ethane"],2,"C₆H₅CH₃ + H₂ → C₆H₆ + CH₄. The methyl group is removed as methane.","C₆H₅CH₃ + H₂ → C₆H₆ + CH₄. The CH₃ leaves as methane.",0],["Benzene can also be prepared by heating benzoic acid or its salts with soda lime. This is called:",["decarboxylation, which also gives CO₂","hydrogenation, which also gives H₂","dehydration, which also gives water","dehalogenation, which also gives HCl"],0,"C₆H₅COOH → C₆H₆ + CO₂. The carboxyl group is lost as carbon dioxide.","Heating a carboxylic acid salt with soda lime = decarboxylation (lose CO₂). C₆H₅COONa → C₆H₆.",0],["Why does halogenation of benzene need a catalyst such as FeCl₃ or AlCl₃?",["the catalyst supplies hydrogen to the ring so that addition can take place instead","the catalyst is needed to break the benzene ring so that the halogen can enter","benzene is too reactive toward chlorine alone, and the catalyst slows the reaction down","the metal halide has empty d orbitals that help make the chlorine a strong electrophile"],3,"Cl₂ is not electrophilic enough alone. FeCl₃ polarises Cl–Cl and gives Cl⁺-like character.","FeCl₃/AlCl₃ polarise the halogen to make X⁺. Empty d orbitals pull the electrons to create the electrophile.",0],["What is the electrophile in the nitration of benzene?",["the nitrate ion, NO₃⁻","the hydronium ion, H₃O⁺","the nitronium ion, NO₂⁺","the nitrite ion, NO₂⁻"],2,"H₂SO₄ is the stronger acid, so it protonates HNO₃ to produce NO₂⁺. Without sulphuric acid, no NO₂⁺ forms.","Nitration electrophile = NO₂⁺ (nitronium ion). N, O, 2 only. Positive charge.",0],["In the generation of NO₂⁺, the role of nitric acid is:",["a base, because it is weaker than sulphuric acid and accepts a proton from it","a catalyst, because it is not used up","an acid, because it donates a proton to sulphuric acid","an oxidising agent, because it removes hydrogen from benzene"],0,"HNO₃ + 2H₂SO₄ → H₃O⁺ + 2HSO₄⁻ + NO₂⁺. H₂SO₄ is the stronger acid and HNO₃ acts as a base.","In the nitrating mixture, H₂SO₄ is the stronger acid, so HNO₃ acts as a BASE. Weaker acid = base role.",1],["What are the three steps of nitration of benzene in the correct order?",["formation of the benzenonium ion, loss of H⁺, and then formation of NO₂⁺ to give nitrobenzene","attack on benzene to give the benzenonium ion, formation of NO₂⁺, and loss of H⁺ to give nitrobenzene","loss of H⁺ from benzene, formation of NO₂⁺, and attack on the ring to give nitrobenzene","formation of NO₂⁺, attack on benzene to give the benzenonium ion, and loss of H⁺ to give nitrobenzene"],3,"First make the electrophile, then attack, then deprotonate. The attack is the slow step and the deprotonation is fast.","Nitration: (1) form NO₂⁺, (2) attack to give the arenium ion, (3) lose H⁺ to restore aromaticity.",0],["Sulfonation of benzene uses concentrated H₂SO₄ or SO₃ and gives:",["chlorobenzene and HCl","benzenesulphonic acid and water","phenol and sulphur dioxide","nitrobenzene and water"],1,"C₆H₆ + H₂SO₄ → C₆H₅SO₃H + H₂O.","Sulfonation: conc. H₂SO₄ or SO₃ gives benzenesulphonic acid + H₂O. Look for –SO₃H on the ring.",0]]},{"t":"Isomerism in Organic Chemistry","q":[["Isomers are compounds that have:",["the same structural formula but different molecular formulae","the same physical properties but different molecular formulae","the same molecular formula but different arrangements of atoms","different molecular formulae but the same functional group"],2,"Isomers have the same atoms in different arrangements, so they usually differ in physical or chemical properties.","Isomers = same molecular formula, different arrangement. Pick 'same formula, different structure'.",0],["The two main types of isomerism are:",["chain isomerism and position isomerism, which are the two kinds of structural isomerism","geometric isomerism and optical isomerism, which are the two kinds of stereoisomerism","tautomerism and rearrangement, which are the two kinds of reaction of isomers","structural (constitutional) isomerism and stereoisomerism"],3,"Structural isomers differ in the order in which atoms are bonded. Stereoisomers have the same order but differ in space.","Two main types: structural (constitutional) and stereoisomerism. Pick that pair.",0],["Two structural isomers belong to the same homologous series and have the same functional group. What does this mean for their properties?",["many chemical properties are the same, but physical properties differ","both physical and chemical properties are different","both physical and chemical properties are the same","the chemical properties differ but the physical properties are the same"],0,"Same FG means similar chemistry. Different shape changes boiling point and similar properties. If the FG differs, both change.","Same series, same group: chemical properties alike, physical properties differ (boiling point etc.).",0],["How many structural isomers does butane, C₄H₁₀, have?",["3","2","1","4"],1,"n-butane and 2-methylpropane (isobutane).","C₄H₁₀ has 2 isomers: butane and 2-methylpropane. Alkane counts: 1, 1, 1, 2, 3, 5, 9, 18.",0],["Methane, ethane and propane each have how many isomers?",["none, because isomers start from pentane","one for methane, two for ethane and three for propane","two each, because every alkane has chain isomers","only one each, because there is only one way to arrange their carbons"],3,"A chain of one, two or three carbons can only be arranged in a single way. Branching starts to be possible with four carbons.","C₁, C₂ and C₃ alkanes: only one arrangement each. Isomers start at C₄.",1],["Which of these gives the correct number of isomers for the alkanes?",["pentane 4, hexane 5, heptane 9, octane 17","pentane 3, hexane 5, heptane 9, octane 18","pentane 3, hexane 4, heptane 8, octane 16","pentane 3, hexane 6, heptane 10, octane 18"],1,"The number grows quickly with carbon number. C₂₀H₄₂ has at least 366,319 constitutional isomers.","Learn the order: C₄ 2, C₅ 3, C₆ 5, C₇ 9, C₈ 18. The counts climb 2, 3, 5, 9, 18.",0],["What are the three isomers of pentane, C₅H₁₂?",["pentane, 2-methylbutane and 2,2-dimethylpropane","pentane, 1-methylbutane and 2,2-dimethylpropane","pentane, 2-methylbutane and 3-methylbutane","pentane, 2-methylpentane and 2,2-dimethylpropane"],0,"3-methylbutane is the same compound as 2-methylbutane, numbered from the other end. There is no 1-methylbutane, because that is just pentane.","Pentane isomers: straight chain, one methyl on C2, two methyls on C2 (neopentane). 3 total.",1],["Chain isomerism is isomerism that arises from:",["different positions of atoms in space","a change in the position of the functional group","different branching of the carbon chain","a change in the functional group itself"],2,"n-butane and isobutane differ only by the way the carbon chain is branched.","Chain isomers = different branching of the carbon chain. Look for 'branching'.",0],["Position isomers have the same carbon skeleton but differ in:",["the number of carbon atoms in the chain","the spatial arrangement of the groups","the position of the functional group","the type of functional group"],2,"1-bromopropane and 2-bromopropane are position isomers. C₄H₉OH has four alcohol isomers.","Position isomers: same skeleton, functional group in a different spot (1-ol vs 2-ol).",0],["How many isomeric alcohols have the formula C₄H₉OH?",["3: butan-1-ol, butan-2-ol and butan-3-ol","4: butan-1-ol, butan-2-ol, 2-methylpropan-1-ol and 2-methylpropan-2-ol","5: including diethyl ether","2: butan-1-ol and butan-2-ol only"],1,"There are two chain types (straight and branched). The OH can be on different carbons in each. Butan-3-ol is the same as butan-2-ol. Diethyl ether is a different class.","C₄H₉OH = 4 alcohols: 2 straight (1-ol, 2-ol) + 2 branched (2-methylpropan-1-ol, 2-methylpropan-2-ol).",1],["How many isomers have the formula C₇H₇Cl and contain a benzene ring?",["4: benzyl chloride and the o-, m- and p-chlorotoluenes","3: o-, m- and p-chlorotoluene only","2: benzyl chloride and chlorotoluene","6: all possible positions around the ring"],0,"Cl can be on the CH₃ group (benzyl chloride) or on the ring in three positions.","C₇H₇Cl with a ring: benzyl chloride + o-, m-, p-chlorotoluene = 4. Chlorine on the CH₃ or on the ring in 3 positions.",0],["C₃H₆O can be propanal or propanone. This is an example of:",["chain isomerism","position isomerism","geometric isomerism","functional group isomerism"],3,"Propanal has –CHO (aldehyde) and propanone has C=O in the middle (ketone). They have different functional groups.","Propanal (CHO) vs propanone (C=O) = different functional group. Functional group isomerism.",0],["Cyclopropane and propene have the formula C₃H₆. What kind of isomers are they?",["functional group isomers, because a cycloalkane is isomeric with an alkene","position isomers, because the double bond is in a different position","they are not isomers, because one is saturated and one is unsaturated","chain isomers, because both have three carbons"],0,"Same molecular formula, different structures. Cycloalkanes and alkenes have the same general formula, CₙH₂ₙ.","Cyclopropane and propene (C₃H₆) have different groups (ring vs C=C). Functional group isomers.",1],["Tautomers are:",["isomers that differ only in the position of the double bond in the carbon chain","structural isomers of the same substance that change into each other spontaneously, even when pure","isomers that can only be separated from each other by fractional distillation","stereoisomers that are mirror images of each other and cannot be superimposed"],1,"Examples are HCN ⇌ HNC and keto ⇌ enol forms. A proton moves from carbon to oxygen or the reverse.","Tautomers: structural isomers that interconvert, usually by moving an H. Pick 'change into each other'.",0],["If the interconversion of two tautomers is very fast, what can be said about the tautomers?",["they have different molecular formulae","they can be easily separated by crystallisation","they are always optical isomers","they cannot be isolated as separate compounds"],3,"Each form turns into the other before you can separate them, so you only observe the equilibrium mixture.","Fast interconversion means you cannot isolate them separately. Fast = cannot isolate.",0],["Keto–enol tautomerism involves the movement of:",["a proton from nitrogen to carbon with the loss of water","a methyl group from one carbon to another","a proton from a carbon to an oxygen, with the shift of a double bond","an electron pair from oxygen to carbon only"],2,"The keto form has C=O and the enol form has C=C with an OH. The proton moves between the carbon next to C=O and the oxygen.","Keto–enol: a proton shifts from C to O and the double bond moves. H goes from carbon to oxygen.",0],["Assignment: which of these is NOT an isomer of C₃H₆O₂?",["methyl ethanoate, CH₃COOCH₃","propan-2-one, CH₃COCH₃","ethyl methanoate, HCOOCH₂CH₃","propanoic acid, CH₃CH₂COOH"],1,"Propanone is C₃H₆O, with only one oxygen. The other three all have the formula C₃H₆O₂.","C₃H₆O₂ isomers have 2 O. Propanone C₃H₆O has only one O, so it is not an isomer. Count the O.",1],["In the C₃H₆O₂ assignment, the acid and the esters are examples of:",["optical isomers","chain isomers","functional group isomers","position isomers"],2,"A carboxylic acid and an ester have the same formula but different functional groups.","Acid + esters on the same formula = different functional groups. Functional group isomers.",0],["Geometric (cis–trans) isomerism in alkenes occurs because:",["there is free rotation about the C=C bond, so the groups can swap sides at room temperature","the molecule has a carbon bonded to four different groups, giving a non-superimposable mirror image","the carbon atoms of the double bond are sp³ hybridised, so the groups lie in different planes","there is no free rotation about the C=C bond and each carbon has two different groups"],3,"The π bond locks the groups in position. Each carbon of the double bond must have two different groups for cis–trans isomers to exist.","cis/trans: no free rotation around C=C, plus two different groups on each carbon.",0],["Maleic acid and fumaric acid are respectively:",["the cis and trans forms of butenedioic acid","the trans and cis forms of butenedioic acid","the D and L forms of butenedioic acid","the cis and trans forms of butanedioic acid"],0,"Maleic = cis (both COOH on the same side). Fumaric = trans (opposite sides).","Maleic = cis (OH groups same side), fumaric = trans. M for 'More crowded', F for 'Far apart'.",1],["Which of these can show cis–trans isomerism?",["2-methylpropene, (CH₃)₂C=CH₂","but-2-ene, CH₃CH=CHCH₃","propene, CH₂=CHCH₃","but-1-ene, CH₂=CHCH₂CH₃"],1,"Each carbon of the double bond in but-2-ene has H and CH₃. In the others, one carbon has two identical groups.","Each C of the double bond needs two different groups. But-2-ene (CH₃/H on each carbon) passes. Skip but-1-ene.",1],["What condition makes a carbon atom a chiral centre?",["it is bonded to four different atoms or groups","it is bonded to two hydrogen atoms","it forms a double bond with another carbon","it is bonded to four identical atoms or groups"],0,"Four different groups produce two arrangements in space that are mirror images and cannot be superimposed.","Chiral centre = carbon with FOUR DIFFERENT groups. Count the different groups.",0],["Which carbon in butan-2-ol, CH₃CH(OH)CH₂CH₃, is the chiral centre?",["C4, bonded to three hydrogens","C3, bonded to two hydrogens","C2, bonded to H, OH, CH₃ and CH₂CH₃","C1, bonded to three hydrogens and C2"],2,"Only C2 has four different groups. This is why butan-2-ol has a pair of enantiomers.","Butan-2-ol: C2 has H, OH, CH₃, C₂H₅ = four different. Pick C2.",0],["Is butan-1-ol, CH₃CH₂CH₂CH₂OH, chiral?",["No, because it is a primary alcohol with only one OH","Yes, because C1 has an OH group","Yes, because it has four carbon atoms","No, because no carbon has four different groups"],3,"C1 has two H atoms, so it is not chiral. Having an OH on the carbon does not make it chiral.","Butan-1-ol: every carbon has repeated groups (two H on C1). No chiral centre, so not chiral.",1],["Enantiomers are:",["stereoisomers that are non-superimposable mirror images of each other","identical molecules drawn in different ways","structural isomers with different functional groups","stereoisomers that are not mirror images of each other"],0,"Like the left hand and the right hand. They have the same physical properties but rotate plane-polarised light in opposite directions.","Enantiomers = non-superimposable mirror images. Like left and right hands.",0],["A racemic mixture is:",["a mixture of cis and trans isomers","a mixture of two diastereomers in equal proportion","an equal mixture of two enantiomers","a single pure enantiomer"],2,"The rotations of the two enantiomers cancel, so a racemic mixture does not rotate plane-polarised light.","Racemic = 50:50 mixture of enantiomers. Optical rotation cancels. 'Equal mixture' answers it.",0],["What is the difference between racemisation and resolution?",["racemisation makes the compound achiral, and resolution makes it chiral","racemisation converts an enantiomer into the racemic form, and resolution separates the racemic form into its enantiomers","both words mean the separation of isomers","racemisation separates the racemic form into its enantiomers, and resolution converts an enantiomer into the racemic form"],1,"Racemisation mixes, resolution separates.","Racemisation = turn one enantiomer into the 50:50 mix. Resolution = separate them out.",1],["Diastereomers are stereoisomers that:",["are mirror images of each other, and occur in compounds with one chiral centre","differ only in functional group","have different molecular formulae","are not mirror images of each other, and occur in compounds with more than one chiral centre"],3,"Diastereomers have different physical properties from each other, unlike enantiomers.","Diastereomers: stereoisomers that are NOT mirror images. Not each other's mirror image.",0],["Exercise: 2-chloro-3-pentanol has two chiral centres. How many stereoisomers does it have in total?",["2, which form 1 pair of enantiomers","8, which form 4 pairs of enantiomers","4, which form 2 pairs of enantiomers","3, which form 1 pair of enantiomers and 1 meso compound"],2,"n chiral centres gives 2ⁿ stereoisomers if there is no symmetry. Here 2² = 4. Between the two pairs, the relationship is diastereomeric.","2 chiral centres: 2² = 4 stereoisomers. Formula 2ⁿ. 4 isomers = 2 enantiomer pairs.",0],["A meso compound is:",["a compound with a double bond and two stereocentres, which rotates light strongly","an equal mixture of two enantiomers, which does not rotate plane-polarised light","a chiral compound that has no stereocentres, but which rotates plane-polarised light","an achiral compound that contains stereocentres, because it has an internal plane of symmetry"],3,"The two halves cancel each other's effect, so the molecule is optically inactive even though it has chiral centres.","Meso = achiral despite chiral centres, because of an internal mirror plane. 'Internal symmetry' phrases win.",1],["An achiral molecule is one that:",["can be superimposed on its mirror image and usually has a plane or centre of symmetry","has a mirror image that is a different compound and rotates plane-polarised light strongly","cannot be superimposed on its mirror image and has no plane or centre of symmetry at all","always contains a chiral carbon atom that is bonded to four different atoms or groups"],0,"A chiral molecule has no plane and no centre of symmetry. The achiral is the opposite.","Achiral = superimposable on its mirror image. Has a plane of symmetry. Think of a cup.",0],["Exercise: which of these objects is chiral?",["the letter A","a screw","a rectangle","an Erlenmeyer flask"],1,"A screw has a handed thread, so it cannot be superimposed on its mirror image. The others have a plane of symmetry. A hand, a helix and the letter R are chiral too.","Chiral objects have a left/right version: screw (thread direction), hand, shoe. Picture the object.",0],["Which of these is achiral?",["a helix","a parallelogram (in two dimensions)","the letter R","the letter A"],3,"The letter A has a vertical mirror plane. R and the helix have none. A parallelogram has no mirror line, so it is chiral in a plane.","The letter A has a mirror line down its middle, so it is achiral. Test: draw the mirror line.",1],["Which statement about enantiomers and diastereomers is correct?",["enantiomers have different boiling points and solubilities, while diastereomers have identical physical properties and differ only in the direction in which they rotate polarised light","enantiomers have identical physical properties except for the direction in which they rotate polarised light, while diastereomers have different physical properties","enantiomers rotate polarised light in the same direction by equal angles, while diastereomers rotate it in opposite directions by equal angles","enantiomers and diastereomers both have identical physical properties in every respect, and they can only be told apart by their melting points"],1,"That is why diastereomers can be separated by distillation or crystallisation, while enantiomers need a resolution method.","Enantiomers = same physical properties except rotation of plane-polarised light. Diastereomers differ in all.",0],["Which of these is a stereoisomer pair?",["propanal and propanone","but-1-ene and but-2-ene","cis-but-2-ene and trans-but-2-ene","butane and isobutane"],2,"Stereoisomers have the same bond sequence and differ only in space. The other pairs are structural isomers.","cis- and trans-but-2-ene are geometric stereoisomers. Same atoms, same connection, different space.",0]]},{"t":"Alcohols","q":[["Alcohols have the general formula CₙH₂ₙ₊₁OH. The functional group is:",["the carboxyl group, –COOH, attached to a saturated carbon","the hydroxyl group, –OH, attached to a saturated carbon","the alkoxy group, –OR, attached to a saturated carbon","the carbonyl group, C=O, attached to a saturated carbon"],1,"An alcohol is an alkane with one or more H replaced by OH.","Alcohol = –OH on a saturated carbon. If the option says 'hydroxyl', tick it.",0],["Alcohols are classified as primary, secondary or tertiary by:",["the number of alkyl groups on the carbon bearing the OH group","the number of hydrogen atoms in the molecule","the number of OH groups in the molecule","the number of carbon atoms in the longest chain"],0,"Primary has 1 (or 0) alkyl, secondary has 2 and tertiary has 3 on the carbon with OH.","1°/2°/3° = count alkyl groups on the carbon carrying OH: 1, 2, 3.",0],["Methanol is classified as:",["it is not classified, since it has no alkyl group","a tertiary alcohol, since it has only one carbon","a primary alcohol, since the carbon with OH has no alkyl group but three hydrogens","a secondary alcohol, since it is the simplest alcohol"],2,"Primary includes RCH₂OH and also CH₃OH. The carbon has 3 H and 0 alkyl groups.","Methanol: carbon bearing OH has zero alkyl groups. Still counted as primary.",1],["Which of these is a secondary alcohol?",["2-methylpropan-2-ol","ethanol","propan-1-ol","cyclobutanol"],3,"In cyclobutanol the carbon with OH is bonded to two ring carbons and one H, so two alkyl groups. Ethanol and propan-1-ol are primary. 2-Methylpropan-2-ol is tertiary.","Secondary = OH carbon bonded to 2 other carbons. In a ring, both neighbours are ring carbons, so cyclobutanol is 2°.",0],["Alcohols are also classed by the number of OH groups. Ethylene glycol and glycerol are respectively:",["trihydric and dihydric","monohydric and dihydric","dihydric and monohydric","dihydric and trihydric"],3,"Ethylene glycol HOCH₂CH₂OH has two OH. Glycerol (propane-1,2,3-triol) has three.","Count the OH: glycol 2 (di), glycerol 3 (tri). Di-hydric, tri-hydric.",0],["Sorbitol, HOCH₂(CHOH)₄CH₂OH, is a:",["trihydric alcohol, because it comes from a three-carbon sugar","hexahydric alcohol, because it has six OH groups","dihydric alcohol, because it has two CH₂OH groups","monohydric alcohol, because it has only one carbon chain"],1,"Count the OH groups: two CH₂OH plus four CHOH = six. The book calls it hexahydric in one place and something else elsewhere, but six OH groups is the correct count.","Count the OH groups, not the carbons. Sorbitol has six OH: hexahydric.",1],["Which of these is the trivial name of (CH₃)₃C–OH?",["isobutyl alcohol","n-butyl alcohol","tert-butyl alcohol","sec-butyl alcohol"],2,"The three methyls on the carbon with OH make it tertiary.","(CH₃)₃C–OH = tert-butyl alcohol. Three methyls on the carbinol carbon.",0],["In the carbinol system, the carbon carrying the OH is called carbinol. Which of these is methylcarbinol?",["ethanol","propan-2-ol","propan-1-ol","methanol"],0,"Carbinol is CH₃OH with the H atoms replaced by alkyl groups. One methyl on carbinol gives CH₃CH₂OH, which is ethanol.","Carbinol = CH₃OH. Methylcarbinol = CH₃–CH₂OH = ethanol. Add one carbon to the name's group.",1],["What is the carbinol name of propan-1-ol?",["ethylcarbinol","dimethylcarbinol","methylcarbinol","propylcarbinol"],0,"CH₃CH₂CH₂OH is CH₂OH with an ethyl group on it. Dimethylcarbinol is propan-2-ol.","Carbinol rule: name the groups on the carbinol carbon. Propan-1-ol = C₂H₅–CH₂OH = ethylcarbinol.",0],["(C₆H₅)₃C–OH is named in the carbinol system as:",["phenylcarbinol","triphenylmethanol only, because carbinol is not allowed","triphenylcarbinol","tribenzylcarbinol"],2,"Three phenyl groups replace the three H atoms of carbinol.","Three phenyls on the carbinol carbon: triphenylcarbinol. Just count and name.",0],["What is the IUPAC name of CH₃CH(OH)CH(CH₃)₂?",["2-methylbutan-3-ol","3-methylbutan-2-ol","2-methylbutan-2-ol","isopentyl alcohol"],1,"The OH takes the lowest possible number. Numbering from the end nearest the OH gives OH on C2 and methyl on C3.","Chain 4 carbons, OH at C2 (numbered from the end near OH), methyl at C3: 3-methylbutan-2-ol.",0],["What is the IUPAC name of CH₂=CH–CH(OH)–CH₃?",["butan-2-ol-3-ene","but-1-en-3-ol","3-buten-2-one","but-3-en-2-ol"],3,"The OH takes the lowest number, so the OH is on C2 and the double bond on C3.","Number from the end nearest OH: C1 CH₃, C2 CHOH, C3 =CH, C4 CH₂ = but-3-en-2-ol. OH takes the lowest number.",1],["How are the melting and boiling points of the straight-chain alcohols related to the number of carbons?",["neither is affected by the molecular weight","both generally increase with the molecular weight","the boiling point increases and the melting point decreases","both decrease with the molecular weight"],1,"A larger molecule has stronger London forces. Methanol boils at 64.5 °C and 1-heptanol at 176 °C. The melting point has small deviations at ethanol and propanol.","Longer chain, higher mass = higher boiling point and melting point. Both go up together.",0],["Which alcohol is the most soluble in water?",["butan-1-ol, which is miscible in all proportions","heptan-1-ol, which is miscible in all proportions","propan-1-ol, which is miscible in all proportions","pentan-1-ol, which is miscible in all proportions"],2,"Methanol, ethanol and propanol are miscible. Butanol is only about 7.9 g per 100 g of water, and solubility keeps falling as the carbon chain grows.","Small chain, still mostly polar OH: propan-1-ol is miscible with water. Among the options it is the shortest.",0],["Why does the solubility of alcohols in water fall as the chain gets longer?",["the nonpolar hydrocarbon part becomes larger compared with the polar OH group","the OH group becomes weaker as the chain gets longer","the molecular mass decreases as the chain gets longer","the hydrogen bonds with water become stronger as the chain gets longer"],0,"The OH hydrogen bonds with water. The long hydrocarbon tail does not, and it resists water.","Longer chain = bigger nonpolar part overpowers the OH, so solubility drops.",1],["The boiling point of an alcohol is higher than that of an aldehyde of similar molecular mass, even though the aldehyde is more polar. Why?",["alcohol molecules have more carbon atoms","alcohol molecules form covalent bonds with each other","alcohol molecules have a higher dipole moment","alcohol molecules form intermolecular hydrogen bonds"],3,"From the table, n-butyraldehyde (dipole 2.72) boils at 76 °C but n-butyl alcohol (dipole 1.63) boils at 118 °C. Hydrogen bonding wins over dipole.","Alcohol O–H forms H bonds with other alcohol molecules. Aldehydes cannot. Hence higher boiling point.",1],["How does branching affect the boiling point of an alcohol?",["it has no effect on the boiling point","it makes the compound a gas at room temperature","it raises the boiling point, since branched molecules are larger","it lowers the boiling point, since branched molecules have less surface contact"],3,"tert-butyl alcohol boils at a lower temperature than n-butyl alcohol. A compact molecule has weaker London forces.","Branching lowers the surface area, so the boiling point drops. Straight chain boils higher.",0],["Ethylene glycol boils at 197 °C. This is because:",["it is an ionic compound, so the strong ionic lattice needs a lot of energy to break","each molecule has two OH groups, giving a lot of intermolecular hydrogen bonding","it has the highest molecular mass of all the alcohols, so London forces dominate completely","it contains a carbon–carbon double bond, which holds the molecules strongly together"],1,"Two OH groups per molecule mean more hydrogen bonds per molecule, so more energy is needed to separate them.","Two OH groups means more H-bonding. 197 °C. Diols boil much higher than mono-alcohols.",0],["In the fermentation of starch to ethanol, which of these gives the correct order of enzymes?",["zymase, maltase, diastase","maltase, diastase, zymase","diastase, maltase, zymase","diastase, zymase, maltase"],2,"Diastase turns starch to maltose. Maltase turns maltose to glucose. Zymase from yeast turns glucose to ethanol and CO₂.","Order: diastase (starch → maltose), maltase (maltose → glucose), zymase (glucose → ethanol). D, M, Z.",0],["What is the final product of the action of zymase on glucose?",["ethanol, C₂H₅OH, and carbon dioxide","methanol, CH₃OH, and carbon dioxide","ethanoic acid, CH₃COOH, and water","maltose, C₁₂H₂₂O₁₁, and water"],0,"C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂. The book writes C₁₂H₂₂O₁₁ in the last line, but that is the formula of maltose and sucrose, not an alcohol.","Zymase on glucose: C₂H₅OH + CO₂. Two products. Ethanol alone is incomplete.",1],["Crude alcohol from fermentation gives only 90–95% ethanol after distillation. How is it further purified?",["by adding benzene and redistilling at 78.3 °C","by adding water and redistilling at 100 °C","by adding sodium and filtering","by adding sulphuric acid and heating strongly"],0,"Alcohol forms a constant-boiling mixture with water. Benzene is added to remove the last of the water.","Azeotrope breaks with benzene and fractional redistillation at 78.3 °C. Pure ethanol is 99.5%.",0],["Industrial preparation of alcohols from alkenes (from petroleum cracking) uses:",["sodium hydroxide and heat, giving hydrolysis","hydrogen gas and a nickel catalyst, giving hydrogenation","water or dilute sulphuric acid, giving hydration","chlorine and light, giving halogenation"],2,"RCH=CH₂ + H₂SO₄ → RCH(OSO₃H)CH₃, then H₂O gives RCH(OH)CH₃.","Alkene + H₂O (acid catalyst) = alcohol by hydration. 'Hydration' is the keyword.",0],["Destructive distillation of wood gives pyroligneous acid. Which of these is NOT in it?",["ethanoic acid","ethane","acetone","methanol"],1,"Pyroligneous acid contains methanol, ethanoic acid, acetone, methyl ethanoate, ammonia and amines. It does not contain an alkane gas like ethane.","Pyroligneous acid contains methanol, acetic acid, acetone. Ethane is a gas, so not in it.",1],["Methanol is made industrially from carbon monoxide and hydrogen using:",["a platinum catalyst without hydrogen","a nickel catalyst at atmospheric pressure","an iron catalyst at room temperature","a zinc and chromium oxide catalyst at high pressure"],3,"CO + 2H₂ → CH₃OH. The catalyst is zinc oxide with chromium oxide, at high pressure (about 200 atm).","CO + 2H₂ → CH₃OH over ZnO/Cr₂O₃ at high pressure. Look for zinc and chromium.",0],["In the laboratory, an alkyl halide is converted into an alcohol by:",["reduction with LiAlH₄","hydrolysis with aqueous KOH or NaOH","dehydration with concentrated H₂SO₄","oxidation with KMnO₄"],1,"R–X + KOH → R–OH + KX. Benzyl chloride with aqueous NaOH gives benzyl alcohol.","R–X + aqueous KOH = R–OH (hydrolysis). Alcoholic KOH would give an alkene instead.",0],["Grignard reagent + methanal (HCHO), followed by hydrolysis, gives:",["a secondary alcohol","a tertiary alcohol","a carboxylic acid","a primary alcohol"],3,"Methanal gives a primary alcohol. Other aldehydes give secondary alcohols. Ketones give tertiary alcohols.","Grignard + HCHO = primary alcohol. Methanal always gives primary.",0],["Exercise: what is formed when ethanal reacts with CH₃MgI and the product is hydrolysed?",["propan-2-ol","ethanol","2-methylpropan-2-ol","propan-1-ol"],0,"The CH₃ adds to the carbonyl carbon of CH₃CHO. That gives CH₃CH(OMgI)CH₃ and then CH₃CH(OH)CH₃, a secondary alcohol.","Ethanal + CH₃MgI: CH₃CH(OH)CH₃ = propan-2-ol. Aldehyde gives a secondary alcohol.",0],["Exercise: acetone, CH₃COCH₃, is treated with CH₃MgI and then water. The product is:",["2-methylpropan-1-ol (isobutyl alcohol)","propan-2-ol (isopropyl alcohol)","2-methylpropan-2-ol (tert-butyl alcohol)","butan-2-ol (sec-butyl alcohol)"],2,"A ketone gives a tertiary alcohol. (CH₃)₃C–OH.","Acetone + CH₃MgI gives a tertiary alcohol with 3 methyls: (CH₃)₃COH.",0],["Exercise: ethyl propanoate, CH₃CH₂COOC₂H₅, reacts with two moles of CH₃MgI. After hydrolysis, the alcohol formed is:",["2-methylbutan-2-ol, a tertiary alcohol","2-methylbutan-1-ol, a primary alcohol","pentan-3-ol, a secondary alcohol","butan-2-ol, a secondary alcohol"],0,"Two methyl groups add to the ester carbon along with the original ethyl group. The carbon bears OH, two CH₃ and a CH₂CH₃, which is 2-methylbutan-2-ol.","Ester + 2 RMgX → tertiary alcohol. The two new groups are both CH₃. Total C = 5: 2-methylbutan-2-ol.",0],["Exercise: ethylene oxide reacts with CH₃MgI and the product is hydrolysed. The alcohol obtained is:",["butan-1-ol, a primary alcohol","propan-2-ol, a secondary alcohol","propan-1-ol, a primary alcohol","ethanol, a primary alcohol"],2,"The CH₃ adds to one carbon of the epoxide. That gives CH₃CH₂CH₂OMgI, then CH₃CH₂CH₂OH. Ethylene oxide always adds two carbons to the Grignard's R group.","Ethylene oxide + RMgX = R–CH₂CH₂OH. CH₃ + 2 C = propan-1-ol. Always adds two carbons.",0],["Reduction of an aldehyde and a ketone gives respectively:",["a tertiary alcohol and a secondary alcohol","a primary alcohol and a secondary alcohol","a primary alcohol and a tertiary alcohol","a secondary alcohol and a primary alcohol"],1,"Butanone is reduced to butan-2-ol, a secondary alcohol. Ethanal gives ethanol, a primary alcohol.","Aldehyde → 1° alcohol. Ketone → 2° alcohol. Same order as in the question.",0],["A primary amine reacts with nitrous acid (HONO) to give:",["a nitro compound and hydrogen","an amide and water","a carboxylic acid and ammonia","an alcohol, nitrogen gas and water"],3,"RNH₂ + HNO₂ → ROH + H₂O + N₂. Methylamine gives methanol.","R–NH₂ + HONO → R–OH + N₂ + H₂O. N₂ bubbles off.",0],["Oxymercuration–demercuration adds water to an alkene according to:",["anti-Markovnikov's rule","Saytzeff's rule","no rule, it gives a mixture","Markovnikov's rule"],3,"The reagents are Hg(OAc)₂/H₂O, then NaBH₄. The OH goes to the more substituted carbon.","Oxymercuration–demercuration: Markovnikov. OH goes on the more substituted carbon.",0],["Hydroboration–oxidation of an alkene gives an alcohol. The addition of water is:",["Markovnikov, so propene gives propan-1-ol","anti-Markovnikov, so propene gives propan-1-ol","Markovnikov, so propene gives propan-2-ol","anti-Markovnikov, so propene gives propan-2-ol"],1,"In hydroboration the boron goes to the less substituted carbon. After oxidation with H₂O₂/OH⁻ the OH is on the less substituted carbon.","Hydroboration–oxidation: anti-Markovnikov. OH goes on the less-substituted carbon, propene → propan-1-ol.",1],["In hydroboration, the solvent THF is used to:",["split diborane into monomers, BH₃","stabilise the alcohol formed","oxidise the alkene","provide hydrogen for the reaction"],0,"Diborane (BH₃)₂ is a dimer. THF forms a borane–THF complex, which is a convenient source of BH₃.","THF splits B₂H₆ into BH₃ monomers. THF is the solvent that does it. Pick 'monomers'.",0],["What does the oxidation step of hydroboration give from triethylborane, (CH₃CH₂)₃B?",["one molecule of triethyl alcohol and boron","three molecules of ethane and boric acid","three molecules of ethanol and boric acid, B(OH)₃","three molecules of ethanal and boron oxide"],2,"(CH₃CH₂)₃B + 3H₂O₂/OH⁻ → 3CH₃CH₂OH + B(OH)₃.","(Et)₃B + oxidation (H₂O₂/NaOH) = 3 C₂H₅OH + B(OH)₃. Each ethyl becomes an ethanol.",0],["Ethanal in dilute NaOH gives aldol. Heating gives crotonaldehyde. Hydrogenation over Ni then gives:",["but-2-en-1-ol","butanal","butan-1-ol","butan-2-ol"],2,"H₂/Ni reduces both the C=C and the C=O of CH₃CH=CHCHO, giving CH₃CH₂CH₂CH₂OH.","Aldol (4C) → crotonaldehyde (4C) → H₂/Ni → butan-1-ol. Both C=C and C=O are reduced.",0],["What does NaBH₄ do to CH₃CH=CHCHO (crotonaldehyde)?",["it reduces only the C=O, giving crotyl alcohol, CH₃CH=CHCH₂OH","it reduces both the C=C and C=O, giving butan-1-ol","it reduces only the C=C, giving butanal","it does not react with it at all"],0,"NaBH₄ is a mild reducing agent. It attacks the carbonyl but not the C=C, even when conjugated.","NaBH₄ reduces only C=O, not C=C. It leaves the double bond: CH₃CH=CHCH₂OH. Selectivity is the trap.",1],["Which reducing agent is strong enough to reduce a carboxylic acid directly to a primary alcohol?",["Zn/HCl","NaBH₄","H₂/Ni at room temperature","LiAlH₄"],3,"Acids need LiAlH₄, which is expensive. So acids are often converted to esters first, which are then reduced.","Only LiAlH₄ (not NaBH₄) reduces acids directly. A stronger reducing agent. Ends with an 'AlH₄'.",0],["Cold dilute alkaline KMnO₄ added to an alkene gives a glycol. This is known as:",["the iodoform test, which adds two OH groups on the same side (syn)","Baeyer's test, which adds two OH groups on the same side (syn)","Lucas test, which adds two OH groups on opposite sides (anti)","Fehling's test, which adds two OH groups on opposite sides (anti)"],1,"The purple colour of KMnO₄ disappears. A per-acid route (via an epoxide) gives the anti glycol instead.","Cold dilute alkaline KMnO₄ + alkene = glycol (Baeyer's). Purple turns colourless/brown.",0],["Which bond is broken when an alcohol reacts with HX, PCl₅ or concentrated H₂SO₄ (dehydration)?",["the C–C bond","the C–OH bond","the O–H bond","the C–H bond"],1,"In those reactions, the OH group leaves. In reactions with Na, esterification and oxidation, the O–H bond is the one that is involved.","Alcohol C–OH bond breaks with HX, PCl₅, conc. H₂SO₄. The O–H bond breaks with Na.",0],["What is the order of reactivity of alcohols with HX?",["3° > 2° > 1°, since the SN1 mechanism through a carbocation is preferred","1° > 2° > 3°, since the SN2 mechanism is preferred","all alcohols react at the same rate","2° > 3° > 1°, since the SN1 mechanism is preferred"],0,"The more stable the carbocation, the faster the reaction. Tertiary carbocations are the most stable.","With HX: 3° > 2° > 1°, because the carbocation intermediate is more stable at 3°.",1],["Lucas reagent is:",["concentrated H₂SO₄ with KMnO₄","dilute NaOH with iodine","concentrated HCl with anhydrous ZnCl₂","acidified K₂Cr₂O₇"],2,"It converts alcohols to alkyl chlorides, which are insoluble and make the mixture cloudy.","Lucas = conc. HCl + anhydrous ZnCl₂. HCl and ZnCl₂, both named.",0],["In the Lucas test, which alcohol gives a cloudy solution immediately at room temperature?",["a primary alcohol","a secondary alcohol","all three at the same time","a tertiary alcohol"],3,"Tertiary reacts at once. Secondary takes about five minutes. Primary is very slow and needs heating.","Tertiary alcohol = cloudy at once. Secondary: 5 minutes. Primary: none (heat needed).",0],["Which alcohol gives the yellow precipitate of iodoform with I₂/NaOH?",["propan-1-ol, because it is a primary alcohol","2-methylpropan-2-ol, because it is a tertiary alcohol","methanol, because it is the simplest alcohol","ethanol, because it has a CH₃ group on the carbon bearing OH"],3,"Alcohols with CH₃CH(OH)–R react, so ethanol and propan-2-ol give iodoform, CHI₃. Methanol and propan-1-ol do not.","Iodoform needs CH₃–CH(OH)– or CH₃CH₂OH. Ethanol is the only simple alcohol that fits.",1],["Primary alcohols react with sodium to give:",["sodium alkoxide and hydrogen gas","an ether and hydrogen gas","sodium hydroxide and an alkane","sodium carbonate and water"],0,"2CH₃CH₂OH + 2Na → 2CH₃CH₂ONa + H₂. The alkoxide can react with an alkyl halide to give an ether (Williamson).","Alcohol + Na → alkoxide + H₂. Hydrogen gas bubbling = acidic H on OH.",0],["What happens when an alcohol reacts with a Grignard reagent, ROH + R'MgX?",["an ether R–O–R' is formed","an alkane (R'H) and Mg(OR)X are formed","an ester is formed","a higher alcohol is formed"],1,"The Grignard reagent is a strong base. It takes the acidic H from the alcohol and forms an alkane.","R–OH + R'MgX = R'H (alkane) + Mg(OR)X. Grignard is destroyed by the acid H.",0],["Esterification is:",["the dehydration of an alcohol to give an ester","the reaction of an alcohol with sodium to give an ester","the reaction of an alcohol and a carboxylic acid to give an ester and water, which is reversible","the reaction of an alcohol and an acid to give an ester only, which is irreversible"],2,"It is catalysed by acid. The reactivity order is 1° > 2° > 3°.","Esterification = alcohol + acid → ester + water. Catalyst: conc. H₂SO₄.",0],["Oxidation of a primary alcohol with acidified KMnO₄ or K₂Cr₂O₇ gives:",["an ester first, and then an aldehyde","an alkene first, and then an alkane","an aldehyde first, and then a carboxylic acid","a ketone first, and then a carboxylic acid"],2,"A secondary alcohol is oxidised to a ketone. A tertiary alcohol is not oxidised by mild oxidising agents.","1° alcohol → aldehyde → acid. Two stages with a strong oxidiser.",0],["What is the colour change when a primary alcohol is oxidised by acidified potassium dichromate?",["orange to cream, since Cr₂O₇²⁻ becomes Cr³⁺","purple to colourless, since Cr₂O₇²⁻ becomes Cr²⁺","colourless to orange, since Cr³⁺ becomes Cr₂O₇²⁻","orange to green, since Cr₂O₇²⁻ becomes Cr³⁺"],3,"The book writes cream, but the test result is orange to green. KMnO₄ changes from purple to colourless instead.","Orange dichromate to green Cr³⁺. Colour change shows oxidation took place. Orange → green.",1],["Classwork: the product when ethanol is oxidised with excess acidified KMnO₄ is:",["ethanal, CH₃CHO","ethanoic acid, CH₃COOH","ethyl ethanoate, CH₃COOC₂H₅","ethene, CH₂=CH₂"],1,"With a strong oxidant in excess, the aldehyde is not stopped. It goes on to the acid.","Excess KMnO₄ on ethanol: the aldehyde continues all the way to the acid. Ethanoic acid.",0],["Classwork: the product of oxidising propan-2-ol with acidified KMnO₄ is:",["propanone, CH₃COCH₃","no reaction","propanoic acid, CH₃CH₂COOH","propanal, CH₃CH₂CHO"],0,"A secondary alcohol gives a ketone. A ketone is not oxidised further under these conditions.","Secondary alcohol → ketone. Propan-2-ol gives propanone. No further oxidation.",0],["Classwork: what is the product when (CH₃CH₂)₃COH is treated with acidified KMnO₄ under mild conditions?",["a ketone formed by loss of the OH hydrogen and one ethyl group","a carboxylic acid with the same number of carbons as the alcohol","no reaction, because it is a tertiary alcohol","an aldehyde formed by oxidation at the end of one ethyl group"],2,"The carbon with OH has no hydrogen to lose. Mild oxidising agents do not affect it. Strong oxidising agents may break C–C bonds.","Tertiary alcohol has no H on the carbon bearing OH. So no oxidation under mild conditions.",1],["Classwork: which alcohol oxidises to give CH₃CH₂COCH₃?",["2-methylpropan-2-ol","butan-2-ol","butanal","butan-1-ol"],1,"The ketone butanone comes from a secondary alcohol with the OH on carbon 2.","Ketone CH₃CH₂COCH₃ (butanone) comes from the secondary alcohol butan-2-ol.",0],["Classwork: which alcohol oxidises to give CH₃CH₂CH(CH₃)CH₂COOH?",["3-methylpentan-3-ol, CH₃CH₂C(OH)(CH₃)CH₂CH₃","2-methylpentan-1-ol, CH₃CH₂CH₂CH(CH₃)CH₂OH","3-methylpentan-2-ol, CH₃CH₂CH(CH₃)CH(OH)CH₃","3-methylpentan-1-ol, CH₃CH₂CH(CH₃)CH₂CH₂OH"],3,"A carboxylic acid comes from a primary alcohol. CH₂COOH came from CH₂CH₂OH, so the alcohol has one more CH₂ at the end.","Acid with the chain intact comes from a 1° alcohol with the same chain: ...CH₂CH₂OH. 3-methylpentan-1-ol.",0],["Exercise: preparing 1-butanol using a Grignard reagent and methanal requires which Grignard reagent?",["propylmagnesium bromide, CH₃CH₂CH₂MgBr","ethylmagnesium bromide, CH₃CH₂MgBr","methylmagnesium bromide, CH₃MgBr","butylmagnesium bromide, CH₃CH₂CH₂CH₂MgBr"],0,"Methanal adds one carbon. So the Grignard must have three carbons to give a four-carbon primary alcohol.","Grignard + HCHO adds one carbon. 4 C target needs a 3 C Grignard: CH₃CH₂CH₂MgBr.",0],["Exercise: Can 1-butanol be made efficiently from butane by Br₂/light followed by KOH?",["Yes, because KOH always gives the primary alcohol","No, because butane cannot react with bromine","No, because bromination of butane gives mainly 2-bromobutane, which gives butan-2-ol","Yes, because bromination of butane gives mainly 1-bromobutane"],2,"Bromine is selective for the more substituted carbon. So the major product from butane is secondary.","Br₂/light attacks the more stable 2° position on butane. Gives 2-bromobutane, so the product would be butan-2-ol.",1],["Exercise: is the route toluene → benzyl bromide (Br₂, light) → benzyl alcohol (KOH) feasible?",["Yes, but the final product with KOH would be phenol, since the ring carbon is the one attacked","Yes, because the benzylic hydrogens are easily replaced, giving benzyl bromide and then benzyl alcohol","No, because toluene cannot react with bromine under any conditions, so no bromide is formed","No, because bromination with light goes only on the ring, giving bromotoluenes and not benzyl bromide"],1,"Light and heat make the radical bromination go on the methyl group. KOH then replaces Br by OH.","Benzylic H are easily replaced. Toluene → benzyl bromide (Br₂, light) → benzyl alcohol (KOH). Valid route.",0],["Sorbitol, a sweetener for diabetic people, is prepared by:",["hydrogenation of glucose over nickel, where the aldehyde C=O becomes CH₂OH","dehydration of glucose with concentrated H₂SO₄, where water is removed to leave carbon","oxidation of glucose with KMnO₄, where the aldehyde group becomes a carboxylic acid group","hydrolysis of starch with enzymes, where the glycosidic bonds are broken by water"],0,"Glucose + H₂ (Ni, about 120 atm) gives HOCH₂(CHOH)₄CH₂OH. It is also an intermediate in the synthesis of vitamin C.","Glucose + H₂/Ni = sorbitol. Aldehyde group becomes CH₂OH.",0]]},{"t":"Ethers","q":[["An ether is a compound in which:",["an oxygen atom is double bonded to a carbon atom","an oxygen atom is bonded to two alkyl or aryl groups","a hydroxyl group is bonded to a saturated carbon","a nitrogen atom is bonded to three alkyl groups"],1,"The general structures are R–O–R, Ar–O–R and Ar–O–Ar.","Ether = O between two carbon groups (R–O–R'). 'Oxygen bonded to two alkyl/aryl groups'.",0],["What is the simplest ether?",["methanol, CH₃OH","ethylene oxide","diethyl ether, C₂H₅–O–C₂H₅","dimethyl ether, CH₃–O–CH₃"],3,"Diethyl ether is the common one that is simply called 'ether'. Dimethyl ether is the simplest.","Simplest ether = CH₃–O–CH₃, dimethyl ether. One carbon each side.",0],["Ethanol and dimethyl ether both have the formula C₂H₆O. What type of isomers are they?",["position isomers, with OH at different positions","optical isomers, with a chiral carbon","functional group isomers, an alcohol and an ether","chain isomers, with different branching"],2,"CH₃CH₂OH and CH₃OCH₃ have different functional groups. Alcohols and ethers with the same carbon count are always isomers.","C₂H₆O: ethanol (alcohol) and CH₃OCH₃ (ether). Different groups, same formula: functional group isomers.",1],["What is the IUPAC name of CH₃–O–CH₂CH₃?",["methoxyethane","ethoxymethane","methyl ethyl ketone","ethyl methanol"],0,"The shorter alkyl group with oxygen becomes the alkoxy prefix (methoxy). The longer chain is the parent alkane (ethane).","Smaller group becomes the alkoxy prefix: CH₃–O is methoxy, the longer chain is the parent. Methoxyethane.",0],["What is the IUPAC name of C₂H₅–O–C₂H₅?",["ethanoxyethane","ethoxyethane","diethoxyethane","ethylethane"],1,"Common name is diethyl ether. In IUPAC, one ethyl with the oxygen is ethoxy, the other is the parent ethane.","Two ethyls: ethoxy + ethane = ethoxyethane. Parent = longer or either chain when equal.",0],["Anisole is:",["phenol, the simplest aromatic alcohol","benzaldehyde, the simplest aromatic aldehyde","diphenyl ether, the simplest diaryl ether","methoxybenzene, the simplest alkyl aryl ether"],3,"C₆H₅OCH₃. It is the product of methylating phenol.","Anisole = C₆H₅OCH₃ = methoxybenzene. 'Simplest alkyl aryl ether'.",0],["Which pair is an unsymmetrical (non-symmetrical) ether?",["ethyl methyl ether, C₂H₅OCH₃","diphenyl ether, C₆H₅OC₆H₅","diethyl ether, C₂H₅OC₂H₅","dimethyl ether, CH₃OCH₃"],0,"A symmetrical ether has identical groups on each side of the oxygen.","Unsymmetrical = two different groups on the oxygen. C₂H₅OCH₃ fits. Symmetrical pairs are identical.",0],["What is the name of an ether whose substituent on the parent chain is –OC₂H₅, on carbon 4 of benzoic acid?",["ethyl 4-benzoate","4-ethylbenzoic acid ether","4-ethoxybenzoic acid","4-ethanoxybenzoic acid"],2,"The acid is the main group. The ether part becomes an alkoxy prefix.","Ethers are prefixes (alkoxy) because the acid has higher priority. –OC₂H₅ is ethoxy: 4-ethoxybenzoic acid.",0],["Why do ethers have much lower boiling points than alcohols of similar molecular mass?",["ethers are completely ionic, so they separate into ions and boil at a lower temperature","ethers have a triple bond in the chain, which weakens the forces between the molecules","ethers have a much smaller molecular mass than the alcohols they are compared with","ethers cannot form hydrogen bonds with each other because they have no O–H bond"],3,"Alcohols have O–H and form hydrogen bonds. Ethers have no H attached to O. Compare ethyl ether (bp 35 °C) and n-butyl alcohol (bp 118 °C).","Ethers lack O–H, so no H-bonding between ether molecules. Lower boiling point than alcohols.",0],["Is the C–O–C bond angle in an ether 180°?",["Yes, so the bond dipoles cancel and the dipole moment of the ether is zero","No, the angle is bent, so the bond dipoles do not cancel and the ether has a small dipole moment","Yes, so the molecule is completely nonpolar and cannot dissolve in any polar liquid","No, but the dipoles still cancel out because of the two lone pairs on the oxygen"],1,"The bent shape gives a net dipole. This is why ethers are slightly more polar than alkanes. The dipole of ethyl ether is 1.18, while n-pentane is 0.","Bent (about 110°), not 180°. So dipoles do not cancel. Ethers are polar.",1],["Ethers dissolve in water to about the same extent as alcohols of similar mass. This is because:",["ethers ionise in water to give alkoxide and alkyl ions that are stabilised by the water","ethers are more polar than water, so they mix with it in every proportion","the oxygen of the ether forms hydrogen bonds with water molecules","ethers react with water to form alcohols, so the ether is no longer present"],2,"Ethers cannot H-bond to each other, but their oxygen can accept an H-bond from water.","Ether O accepts H bonds from water. That is why ethers dissolve as well as alcohols.",1],["Williamson synthesis prepares an ether from:",["an alkyl halide and a sodium or potassium alkoxide (or phenoxide)","two molecules of an alkyl halide and sodium metal","an alkene and hydrogen","an alcohol and an aldehyde in acid"],0,"CH₃CH₂Br + CH₃ONa → CH₃CH₂OCH₃ + NaBr. The alkoxide acts as a nucleophile.","Williamson = R–X + R'O⁻ Na⁺/K⁺. Alkyl halide plus alkoxide.",0],["What is the product of CH₃I + C₆H₅OK?",["phenol and methane","benzene and CH₃OK","anisole (methoxybenzene) and KI","toluene and KOH"],2,"The phenoxide attacks the methyl carbon of CH₃I and replaces I.","CH₃I + C₆H₅OK → C₆H₅OCH₃ + KI. The alkyl group of the halide goes on the O of the phenoxide.",0],["In Williamson synthesis, an aryl halide such as C₆H₅Cl cannot be used because:",["aryl halides are gases at room temperature","the benzene ring has a high reactivity towards nucleophiles, so the reaction is too fast","aryl halides have no halogen atom","the benzene ring has a low reactivity towards nucleophiles, so C₆H₅Cl does not react with C₆H₅OK"],3,"The ring is electron rich and repels nucleophiles. The halogen is also held more strongly because of resonance.","Aryl halides do not take part in SN2 (low reactivity of ring C–X). So the halide must be alkyl.",1],["Which of these is the best choice of reagents to prepare ethyl phenyl ether?",["bromobenzene and sodium ethoxide","bromoethane and sodium phenoxide","benzene and ethanol with H₂SO₄","chlorobenzene and ethanol"],1,"The alkyl halide must be the one that goes through nucleophilic substitution. The phenoxide supplies the aryl–O part.","Use the alkyl halide on one side (bromoethane) and the phenoxide on the other. Never aryl halide.",0],["Dehydration of ethanol with concentrated H₂SO₄ at 130–140 °C gives:",["diethyl ether","ethene","ethanal","ethane"],0,"At this temperature and with excess alcohol, one molecule of alcohol attacks another. Above about 160 °C, ethene predominates.","Ethanol + conc. H₂SO₄ at 130–140 °C = diethyl ether. At 170 °C it is ethene instead.",0],["Dehydration of alcohols can be used to prepare which type of ether?",["unsymmetrical ethers only, from any alcohol","symmetrical ethers only, from alcohols such as propanol and below","aryl alkyl ethers only, such as anisole from phenol and methanol","both symmetrical and unsymmetrical ethers with equal ease"],1,"If two different alcohols are used, a mixture of three ethers results. It is therefore useful only for symmetrical ones.","Dehydration works for symmetrical ethers only. Two different alcohols would give a mixture.",1],["In the dehydration of an alcohol to give an ether, the protonated alcohol and the second alcohol molecule act respectively as:",["the substrate and the nucleophile","the oxidant and the reductant","the catalyst and the product","the nucleophile and the substrate"],0,"The H⁺ from the acid protonates one ROH, so water can leave. The other ROH attacks as a nucleophile.","Protonated alcohol = substrate (electrophile). The second alcohol = nucleophile. Substrate, then nucleophile.",0],["In alkoxymercuration–demercuration, an alkene is treated with an alcohol and:",["mercuric trifluoroacetate, and then H₂/Ni","sodium metal, and then HBr","diborane, and then H₂O₂","mercuric trifluoroacetate, and then NaBH₄"],3,"It gives an ether in high yield without side reactions. A disadvantage is that the bulky mercuric compound causes steric hindrance.","Alkoxymercuration: Hg(OCOCF₃)₂ + ROH, then NaBH₄. Same pattern as oxymercuration.",0],["Which method is suitable for making an unsymmetrical ether such as tert-butyl ethyl ether?",["oxidation of tert-butanol","dehydration of a mixture of ethanol and tert-butanol","addition of ethanol to 2-methylpropene with an acid catalyst","reaction of ethanol with sodium metal"],2,"(CH₃)₂C=CH₂ + CH₃CH₂OH/H⁺ → (CH₃)₃C–O–CH₂CH₃.","Add ethanol to 2-methylpropene (acid) for tert-butyl ethyl ether. Do not use Williamson with a 3° halide.",0],["Ethers are known as:",["unreactive only to bases and very reactive to acids","the least reactive of the common functional groups, which makes them good solvents","the most reactive of the common functional groups, which makes them good oxidising agents","reactive only toward bases, which makes them useful for neutralisation"],1,"That is why diethyl ether is used for Grignard reactions and extractions.","Ethers are the least reactive common group. That is why they make good solvents.",0],["What are the products of the reaction between ethoxyethane and one mole of HBr?",["ethanol and bromoethane","two moles of ethanol","ethane and bromine","ethene and water"],0,"C₂H₅OC₂H₅ + HBr → C₂H₅OH + C₂H₅Br. With excess HX, the alcohol also changes to the halide.","Diethyl ether + 1 HBr = C₂H₅OH + C₂H₅Br. Each one is cleaved at C–O.",0],["Anisole is heated with excess HI. The products are:",["phenol and methanol","benzene and methyl iodide","phenol and iodomethane","iodobenzene and methanol"],2,"The aryl–O bond is strong and does not break, so the phenol is not turned into an aryl iodide. The methyl–O bond breaks.","Anisole + HI: the weaker alkyl C–O breaks, so you get phe
