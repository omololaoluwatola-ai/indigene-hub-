nol + CH₃I. Aryl C–O never breaks.",1],["Diaryl ethers such as diphenyl ether:",["are cleaved by water at room temperature","give two moles of phenyl iodide with HI","are cleaved more easily than dialkyl ethers","are not cleaved by acids"],3,"Neither C–O bond can break by substitution, because both carbons are in aromatic rings.","Diaryl ethers are not cleaved by acids. Both bonds are aryl C–O.",0],["When diethyl ether reacts with a strong acid, which type of compound forms?",["an oxonium salt (etherate), similar to the formation of ammonium salts","an alkoxide formed when the acid removes a hydrogen from the alkyl group","a carboxylate salt formed when the oxygen loses an electron pair to the acid","an ester formed when the acid group bonds to the carbon of the ether"],0,"The oxygen lone pair accepts H⁺, just as NH₃ + HCl → NH₄Cl.","Ether + acid = oxonium salt (etherate). O lone pair picks up H⁺.",0],["Why is diethyl ether a popular solvent?",["it is highly reactive and takes an active part in most of the reactions it is used in","it is nonflammable and cannot be ignited, so it is safe to use near a flame","it is heavier than water and can be easily separated from an aqueous layer","it has low reactivity, is cheap and dissolves many organic compounds well"],3,"It is also used as an anaesthetic and for solvent extraction, and ether-type compounds are used as softeners for plastics.","Popular solvent: unreactive, cheap, dissolves many organics. Pick the option with all three.",0],["Diethyl ether catches fire in a laboratory. What should you use to put out the fire?",["a wet cloth thrown over the burning ether, because water smothers the flame","more ether, added to the fire to dilute it until the flame goes out","carbon dioxide, because ether floats on water and water would spread the fire","water, because water cools the ether quickly and puts out the flame"],2,"Ether is less dense than water and immiscible enough that it floats and spreads. CO₂ smothers the flame.","Ether floats on water, so a water jet spreads the fire. Use CO₂ or dry powder.",1],["Diethyl ether vapour is denser than air. What danger does this create?",["the vapour rises to the ceiling and is easily removed by the extractor fan","the vapour rolls along the bench and can reach a distant flame and ignite","the vapour has no effect, because the ether is nonflammable at room temperature","the vapour is absorbed by the walls and the floor, so it never reaches a flame"],1,"The vapour sinks and travels along surfaces. A spark or burner several metres away can ignite it.","Vapour heavier than air = rolls along the bench to a distant flame. Flash-back risk.",0],["What dangerous compounds can form when ethers stand in air for a long time?",["hydrates, which dissolve in water and make the ether cloudy and wet","alcohols, which change the boiling point of the ether during distillation","peroxides, which can explode when the ether is distilled","carbonates, which make the ether acidic and can corrode the container"],2,"Peroxides boil at a higher temperature than the ether. They accumulate in the flask and explode when heated.","Old ethers form peroxides that can explode when distilled. 'Peroxides' is the keyword.",0],["How can peroxides be removed from an ether?",["by treating the ether with a reducing agent such as iron(II) sulphate, FeSO₄","by distilling the ether to dryness","by adding water and heating","by treating the ether with an oxidising agent such as KMnO₄"],0,"A reducing agent destroys the peroxide linkage. Never distil an ether to dryness, because peroxides concentrate in the residue.","Remove peroxides with a reducing agent (FeSO₄ or Na₂SO₃). Oxidiser + reducer neutralise.",1],["Which of these is a cyclic ether?",["anisole","cyclohexanol","ethyl acetate","tetrahydrofuran (THF)"],3,"Cyclic ethers include ethylene oxide, 1,4-dioxane and THF. THF is also used to split diborane into BH₃.","THF = tetrahydrofuran, a 5-membered ring with one O. The only ring option.",0]]},{"t":"Epoxides","q":[["An epoxide is:",["a four-membered cyclic ether containing the C–C–C–O ring","a three-membered cyclic ether containing the C–C–O ring","an open-chain ether with an epoxy prefix","a cyclic ester with a C=O in the ring"],1,"The ring has two carbons and one oxygen.","Epoxide = 3-membered ring with C–C–O. 'Oxirane'. Three atoms: two C and one O.",0],["Which is the most popular epoxide?",["ethylene oxide","propylene oxide","styrene oxide","cyclohexene oxide"],0,"It is the simplest epoxide, made from ethene. The others are named from their alkenes.","Most popular epoxide: ethylene oxide (smallest, 2 carbons).",0],["Why do epoxides have unusual properties compared with ordinary ethers?",["the oxygen atom is positively charged","the ring contains a double bond that is easily broken","the ring is aromatic","the three-membered ring is strained, so it opens easily"],3,"The bond angles are about 60° instead of the normal 109.5°. That strain makes the ring open readily in reactions that ordinary ethers resist.","Epoxide ring is strained, so it opens easily. Ring strain = the reason.",1],["Ordinary ethers are unreactive, but epoxides react readily with acids, bases and Grignard reagents. The reason is:",["the presence of a carbonyl group","an extra double bond in the ring","ring strain, not any extra functional group","a free OH group in the ring"],2,"Epoxides are still ethers, but angle strain gives them a driving force to open.","Ring strain is the answer, not another functional group. Both rings and groups appear in options; pick strain.",1],["In the halohydrin route, an epoxide is prepared by:",["reacting an alkene with HX, and then treating the product with an acid","reacting an alcohol with concentrated H₂SO₄, and then treating it with a base","reacting an alkene with X₂ and water to form a halohydrin, and then treating it with a base","reacting an alkene with H₂ over a nickel catalyst, and then treating it with water"],2,"The halohydrin has an OH on one carbon and a halogen on the next. The base removes H from OH, and the O⁻ pushes out the halide to close the ring.","Halohydrin route: alkene + X₂ + H₂O gives a halohydrin (OH and X on neighbouring carbons). Then base closes the ring.",0],["What are the two by-products when a halohydrin is converted to an epoxide with OH⁻?",["carbon dioxide and water","water and a halide ion","an alcohol and hydrogen","hydrogen and a halide ion"],1,"OH⁻ takes H from the OH group, forming water. The halide leaves as X⁻.","Halohydrin + OH⁻ → epoxide + H₂O + X⁻. The two by-products: water and halide ion.",0],["Ethylene oxide is made industrially from ethene by:",["catalytic oxidation with oxygen over silver","hydration with steam and phosphoric acid","catalytic reduction with hydrogen over nickel","reaction with chlorine and light"],0,"O₂ over a silver catalyst adds one O across the C=C.","Industrial: ethene + O₂ over a silver catalyst. 'Silver' is the key word.",0],["Which reagent is used in the laboratory to convert an alkene directly to an epoxide?",["an alkoxide, such as sodium ethoxide, used in dry ethanol","a dilute acid, such as dilute hydrochloric acid, used at room temperature","a reducing agent, such as LiAlH₄, used in dry ether","a peroxyacid (peracid), such as peroxybenzoic acid"],3,"RCO₃H gives the epoxide and the carboxylic acid. Styrene gives styrene oxide.","Lab: alkene + peracid (RCO₃H) gives epoxide directly. Pick 'peroxyacid'.",0],["What is the other product when an alkene reacts with peroxybenzoic acid to give an epoxide?",["benzyl alcohol","benzoic acid","benzaldehyde","phenol"],1,"The peracid transfers one O atom to the alkene and becomes the parent carboxylic acid.","Peracid loses an O and becomes the plain acid. Peroxybenzoic acid → benzoic acid.",0],["Styrene reacts with a peracid to give:",["styrene glycol","ethylbenzene","benzaldehyde","styrene oxide"],3,"Only the C=C of the side chain reacts. The ring is left intact.","Styrene's C=C becomes the epoxide: styrene oxide. Name from the alkene + oxide.",0],["Ring opening of an epoxide can be catalysed by:",["only an acid","neither, since epoxides need a metal catalyst","an acid or a base","only a base"],2,"Both routes open the ring. The acid route protonates the oxygen first. The base route has the nucleophile attack directly.","Epoxide ring opening works with acid or base. Both catalyse it.",0],["What is formed when ethylene oxide reacts with ethanol and H⁺?",["2-ethoxyethanol","ethyl ethanoate","diethyl ether","1,2-ethanediol"],0,"The ethanol acts as a nucleophile and the ring opens. The product has an ether group and an OH group: CH₃CH₂OCH₂CH₂OH.","Ethylene oxide + EtOH/H⁺: ethanol attaches to one carbon, OH on the other: 2-ethoxyethanol.",0],["Ethylene oxide reacts with HBr to give:",["ethanol and bromine","1,2-dibromoethane","2-bromoethanol, BrCH₂CH₂OH","bromoethane"],2,"The ring opens, and Br adds to one carbon while OH is formed on the other.","HBr opens the ring: Br on one carbon, OH on the other. BrCH₂CH₂OH is 2-bromoethanol.",0],["Sodium ethoxide reacts with ethylene oxide. After the ring opens and protonation, the product is:",["2-ethoxyethanol","diethyl ether","ethane-1,2-diol","ethyl 2-hydroxyacetate"],0,"The ethoxide acts as the nucleophile (Z:⁻). It attacks a carbon of the ring, and the ring opens to give an alkoxide, which is protonated.","EtO⁻ attacks the ring carbon, then protonation. Same product as acid route: 2-ethoxyethanol.",0],["Sodium phenoxide reacts with ethylene oxide. The product is:",["ethylene glycol","2-phenylethanol","phenol","2-phenoxyethanol"],3,"The phenoxide oxygen attacks the epoxide carbon, so the product contains C₆H₅–O–CH₂CH₂OH.","PhO⁻ + ethylene oxide gives PhOCH₂CH₂OH, 2-phenoxyethanol. Nucleophile + 2 carbons + OH.",1],["What is the difference between 2-phenoxyethanol and 2-phenylethanol?",["2-phenylethanol has a C₆H₅–O– group, and 2-phenoxyethanol has a C₆H₅– group","2-phenoxyethanol has a C₆H₅–O– group, and 2-phenylethanol has a C₆H₅– group directly on carbon","they are the same compound with different names","2-phenoxyethanol is a ketone and 2-phenylethanol is an alcohol"],1,"Phenoxy contains an oxygen. Phenyl does not. The first comes from sodium phenoxide, and the second from phenylmagnesium bromide.","Phenoxy = C₆H₅–O– (has O). Phenyl = C₆H₅– (no O). Oxy = extra O.",1],["What does a Grignard reagent do to ethylene oxide?",["it gives a secondary alcohol with one more carbon than the R group in the reagent","it attacks the ring carbon, and after hydrolysis gives a primary alcohol with two more carbons than R","it attacks the ring oxygen, and after hydrolysis it gives an ether","it gives a tertiary alcohol with three more carbons than the R group in the reagent"],1,"RMgX + ethylene oxide → RCH₂CH₂OMgX → H₂O → RCH₂CH₂OH.","Grignard attacks the ring carbon; hydrolysis gives a primary alcohol with 2 more carbons.",0],["Exercise: butylmagnesium bromide reacts with ethylene oxide, followed by H⁺. The product is:",["octan-1-ol","pentan-1-ol","hexan-2-ol","hexan-1-ol"],3,"The butyl group has 4 carbons and the epoxide adds 2, so 6 carbons in a primary alcohol.","Butyl (4 C) + 2 = hexan-1-ol. 4 + 2 = 6 carbons, primary alcohol.",0],["Exercise: phenylmagnesium bromide reacts with ethylene oxide, and the product is hydrolysed. The product is:",["2-phenylethanol","phenol","1-phenylethanol","benzyl alcohol"],0,"C₆H₅–CH₂CH₂–OH. The phenyl group gains two carbons.","Phenyl–MgBr + ethylene oxide = C₆H₅CH₂CH₂OH. 2-phenylethanol.",0],["Which alcohol would be formed from ethylmagnesium bromide and ethylene oxide?",["ethanol, because the epoxide is lost","propan-1-ol, because only one carbon is added","butan-1-ol, not butan-2-ol","butan-2-ol, because the Grignard adds to the middle"],2,"Ethyl (2 C) + 2 C from the ring = 4 carbons. Both ring carbons are CH₂, so the alcohol is primary.","Ethyl (2 C) + 2 = 4 carbons, OH at the end: butan-1-ol. The OH is always on the terminal carbon.",1],["Which of these cannot be prepared from ethylene oxide?",["a halohydrin such as 2-bromoethanol, from a hydrogen halide","an alkoxy alcohol such as 2-ethoxyethanol, from an alcohol","a primary alcohol with two more carbons than the Grignard R group","an aldehyde with two more carbons than the Grignard R group"],3,"The ring opening always leaves an OH group, so the products are alcohols and their ether or halogen derivatives.","Ethylene oxide + Grignard always gives a primary ALCOHOL. An aldehyde cannot be made. Pick the aldehyde option.",0],["Compare the reaction of an epoxide with acid and with base. Which statement is correct?",["both reactions begin with the protonation of the oxygen, since a nucleophile cannot attack the ring otherwise","neither reaction opens the ring, because the strain in the three-membered ring makes it very stable","in the acid-catalysed reaction the oxygen is protonated first, but in the base-catalysed reaction the nucleophile attacks directly","in the acid-catalysed reaction the nucleophile attacks first, but in the base-catalysed reaction the oxygen is protonated first"],2,"Protonation makes the oxygen a better leaving group. In base, a strong nucleophile is used and attacks directly.","Acid: O is protonated first, then Nu attacks. Base: Nu attacks directly. Keep that order in mind.",1],["What is the function of the strain in an epoxide ring during ring opening?",["it makes the oxygen atom positively charged","its release makes the reaction energetically favourable","it removes the need for a nucleophile","it makes the ring aromatic"],1,"Opening the ring releases about 25 kcal/mol of strain energy. That helps the reaction.","Strain release gives energy, making the ring opening easy. Pick 'release of strain'.",0],["1,2-Epoxybutane is named using the prefix 'epoxy'. Which statement about this prefix is correct?",["epoxy is always used as a prefix, and the two numbers show the carbons joined to the oxygen","epoxy is always used as a suffix at the end of the name, and the numbers go in front of the name","epoxy is used only for ethylene oxide, and every other epoxide has a different prefix","epoxy has no numbers in the name, because the ring always uses the first two carbons"],0,"In IUPAC, epoxy (C–O–C ring) is always a prefix. 1,2-epoxybutane has the oxygen across carbons 1 and 2.","'Epoxy' is only ever a prefix, with two numbers (1,2-epoxybutane). Never a suffix.",0],["An alkene with Br₂ in water gives a bromohydrin. What does it contain?",["an OH on one carbon and a Br on the neighbouring carbon","two Br atoms on the same carbon, and no OH group anywhere in the molecule","an OH group and a Br atom on the same carbon, so that the carbon becomes a carbonyl","two OH groups on the same carbon, and no Br atom anywhere in the molecule"],0,"Water attacks the bromonium ion, so OH and Br end up on adjacent carbons. This is the starting material for the epoxide.","Bromohydrin = OH and Br on adjacent carbons. Halohydrin means halogen + hydroxyl.",0],["Which of these is the product of Baeyer-type syn hydroxylation, and which of the per-acid route followed by acid and water?",["an anti glycol and a syn glycol respectively","two syn glycols","an epoxide and an alkane respectively","a syn glycol and an anti glycol respectively"],3,"The per-acid first gives an epoxide. The ring is then opened by water from the back side, which gives anti addition.","Baeyer gives syn glycol. Peracid epoxide then H₃O⁺ gives anti glycol. Syn first, anti second.",1],["Which of these is an application of ethylene oxide?",["manufacture of benzene for plastics, which is made by hydrolysis of the ring","manufacture of nylon from adipic acid, which is made by oxidation of the ring","manufacture of ethylene glycol, used as antifreeze","manufacture of methane for fuel, which is made by reduction of the ring"],2,"Ring opening with water gives HOCH₂CH₂OH. Ethylene glycol is a dihydric alcohol with a high boiling point of 197 °C.","Ethylene oxide → ethylene glycol → antifreeze. Link the two.",0],["What is the product of the ring opening of ethylene oxide by water in acid?",["ethanoic acid, formed when the ring is oxidised by the water","ethane-1,2-diol (ethylene glycol)","ethanol, formed when the water removes the ring oxygen entirely","ethanal, formed when the ring opens and rearranges to a carbonyl"],1,"H₂O is the nucleophile. The result is a molecule with an OH on each carbon.","Epoxide + H₂O/H⁺ = ethane-1,2-diol. Two OH on adjacent carbons.",0],["How many carbon atoms does the product contain when a Grignard reagent R–MgX, where R has n carbons, reacts with ethylene oxide followed by hydrolysis?",["n + 2","n","n + 3","n + 1"],0,"Ethylene oxide contributes two carbons, as CH₂CH₂, to the final alcohol.","R–MgX with n carbons gives R–CH₂CH₂OH, so n + 2. Always add 2.",0],["Ethylene oxide and acetaldehyde (ethanal) have the same molecular formula, C₂H₄O. What does this show?",["they are homologues, since the formulae are identical","they are structural isomers, one a cyclic ether and the other an aldehyde","they are stereoisomers, since the formulae are identical","they are the same compound, since the formulae are identical"],1,"Same molecular formula, different structure and different functional groups. So they are functional group isomers.","Same formula C₂H₄O, different structure: structural isomers (cyclic ether vs aldehyde).",1],["Which Grignard reagent and which epoxide would you use to make propan-1-ol?",["methylmagnesium iodide and methanal","ethylmagnesium iodide and ethylene oxide","methylmagnesium iodide and propylene oxide","methylmagnesium iodide and ethylene oxide"],3,"CH₃ + CH₂CH₂OH gives CH₃CH₂CH₂OH. Methanal would give ethanol instead.","Propan-1-ol = 3 C. CH₃MgI (1 C) + ethylene oxide (+2) = 3 C. Methyl + ethylene oxide.",0]]},{"t":"Carboxylic Acids and Derivatives","q":[["The functional group of a carboxylic acid and the general formula of the saturated monocarboxylic acids are:",["–CHO and CₙH₂ₙ₊₁CHO","–COOH and CₙH₂ₙ₊₁COOH","–CO– and (CₙH₂ₙ₊₁)₂CO","–OH and CₙH₂ₙ₊₁OH"],1,"The carboxyl group is a carbonyl and a hydroxyl on the same carbon. For HCOOH, n = 0.","Acid = –COOH, saturated monoacid CₙH₂ₙ₊₁COOH. Same pair as the one used for the homologous series.",0],["Carboxylic acids are acidic because they:",["react with water to give CO₂ and an alcohol, which is why the solution is acidic","accept H⁺ from water to form a positive ion that is stabilised by the carbonyl group","release OH⁻ in water, and the hydroxide ion is what makes the solution acidic","ionise in water to give H⁺ that can be passed to a base, forming a carboxylate ion"],3,"RCOOH + H₂O ⇌ RCOO⁻ + H₃O⁺. Water acts as the base, RCOO⁻ is the conjugate base, and H₃O⁺ is the conjugate acid.","Acidic = ionises to give H⁺ (proton donor). Pick 'give H⁺'.",0],["What are the common and IUPAC names of CH₃COOH?",["formic acid and methanoic acid","propionic acid and propanoic acid","acetic acid and ethanoic acid","butyric acid and butanoic acid"],2,"Methanoic is HCOOH, propanoic is CH₃CH₂COOH, butanoic is CH₃CH₂CH₂COOH.","CH₃COOH: acetic (common) + ethanoic (IUPAC). 2 carbons, so 'eth'.",0],["CH₃(CH₂)₃COOH has the common name valeric acid. Its IUPAC name is:",["pentanoic acid","hexanoic acid","butanoic acid","propanoic acid"],0,"Four CH₂/CH₃ carbons plus the COOH carbon give five carbons.","Valeric = 5 carbons (CH₃(CH₂)₃COOH = 1 + 3 + 1). Count carbons: pentanoic acid.",1],["The correct IUPAC name of palmitic acid, CH₃(CH₂)₁₄COOH, is:",["octadecanoic acid","tetradecanoic acid","pentadecanoic acid","hexadecanoic acid"],3,"Fourteen CH₂ plus CH₃ plus COOH is 16 carbons. The book spells it 'hexanedecanoic', which is a typing slip.","CH₃(CH₂)₁₄COOH = 1 + 14 + 1 = 16 carbons. Hexadecanoic.",1],["Stearic acid has how many carbon atoms?",["16","14","18","20"],2,"CH₃(CH₂)₁₆COOH. That is octadecanoic acid.","Stearic = 18 C. Palmitic = 16 C. S is after P, 18 after 16.",0],["Benzoic acid, C₆H₅COOH, has the IUPAC name:",["benzenoic acid","benzenecarboxylic acid","phenylmethanoic acid","benzoyl acid"],1,"The COOH is directly on a ring carbon, so the special suffix carboxylic acid is used.","Benzoic acid is also called benzenecarboxylic acid (COOH on the ring).",0],["In the Greek letter system, the carbon next to the COOH group is called:",["alpha (α)","gamma (γ)","beta (β)","delta (δ)"],0,"The COOH carbon itself is not given a letter. Alpha is the next one, then beta, gamma and delta.","Next to COOH = α. Then β, γ, δ. The first carbon after COOH is α.",0],["γ-Chloro-α-methylbutyric acid has the chlorine on carbon number ___ of the IUPAC chain, counting the COOH carbon as carbon 1.",["2","5","4","3"],2,"Alpha is C2, beta is C3 and gamma is C4. So the chlorine is on C4 and the methyl on C2.","Count COOH as C1, then α = C2, β = C3, γ = C4. Gamma = carbon 4.",1],["Which pair of names for phthalic acids is correct?",["phthalic is 1,2-, isophthalic is 1,3- and terephthalic is 1,4-benzenedicarboxylic acid","phthalic is 1,4-, isophthalic is 1,3- and terephthalic is 1,2-benzenedicarboxylic acid","phthalic is 1,3-, isophthalic is 1,2- and terephthalic is 1,4-benzenedicarboxylic acid","all three are 1,2-benzenedicarboxylic acid"],0,"Ortho, meta and para are phthalic, isophthalic and terephthalic.","ortho = 1,2 (phthalic), meta = 1,3 (iso), para = 1,4 (tere). P, I, T in order 2, 3, 4.",1],["Exercise: which of these is 2,2-dimethylpentanoic acid?",["CH₃CH₂C(CH₃)₂CH₂COOH","CH₃CH(CH₃)CH(CH₃)CH₂COOH","(CH₃)₃CCH₂CH₂COOH","CH₃CH₂CH₂C(CH₃)₂COOH"],3,"The COOH carbon is C1, then C2 has two methyls, then three more carbons (C3, C4, C5).","2,2-dimethylpentanoic acid: pentanoic chain (5 C, COOH is C1), two CH₃ on C2. Draw from the COOH end.",0],["Exercise: how many carbon atoms are in the main chain of 2,4-dimethylnonanoic acid, and where are the methyl groups?",["11 carbons, with methyl groups on C2 and C4","9 carbons, with methyl groups on C2 and C4","9 carbons, with methyl groups on C3 and C5","8 carbons, with methyl groups on C2 and C4"],1,"Nonanoic acid is a nine-carbon chain. The methyls are substituents on carbons 2 and 4.","2,4-dimethylnonanoic: nona = 9 carbons. Methyls on C2 and C4.",0],["Exercise: the formula of 3-chloroheptanoic acid is:",["ClCH₂CH₂CH₂CH₂CH₂CH₂COOH","CH₃CH₂CH₂CHClCH₂CH₂COOH","CH₃CH₂CH₂CH₂CH₂CHClCOOH","CH₃CH₂CH₂CH₂CHClCH₂COOH"],3,"Seven carbons in the chain, with Cl on carbon 3 counting from the COOH carbon.","Heptanoic = 7 C, Cl on C3 (second carbon after COOH). Count carbons in the formula = 7.",0],["Exercise: 2-methyl-4-ethyloctanoic acid is written with the substituents in alphabetical order as:",["2-methyl-4-ethyloctanoic acid","4-ethyl-2-methyloctanoic acid","2,4-ethylmethyloctanoic acid","4-methyl-2-ethyloctanoic acid"],1,"The substituents must be in alphabetical order in the name: ethyl before methyl. The numbers follow each substituent.","Alphabetical order: ethyl before methyl. Numbers stay with the group. 4-ethyl-2-methyl.",1],["Exercise: 3-hydroxybutanoic acid has the structure:",["CH₃CH(OH)CH₂COOH","CH₃CH₂CH(OH)COOH","HOCH₂CH₂CH₂COOH","CH₃CH₂CH₂COOH with OH on the acid"],0,"The OH is on C3, which is the beta carbon.","3-hydroxybutanoic: 4 C, OH on C3. CH₃CH(OH)CH₂COOH. Count from COOH.",0],["Which method does NOT give a carboxylic acid?",["reaction of a Grignard reagent with CO₂ followed by acid","hydrolysis of a nitrile","reduction of an aldehyde with LiAlH₄","oxidation of a primary alcohol"],2,"Reduction of an aldehyde gives a primary alcohol. The other three give acids.","LiAlH₄ reduces an aldehyde to an alcohol. Not an acid. This is the one that fails.",1],["Bromoethane is heated with KCN and the product is hydrolysed with H₂O/H⁺. The acid obtained is:",["butanoic acid","propanoic acid","ethanoic acid","ethanoic anhydride"],1,"CH₃CH₂Br → CH₃CH₂CN → CH₃CH₂COOH. This route adds one carbon.","RBr + KCN → RCN (adds 1 C). Then hydrolyse → acid. 2 C + 1 = 3 C: propanoic acid.",0],["Which halide cannot be used in the nitrile route to prepare a carboxylic acid?",["a tertiary halide","a secondary halide","a primary halide","a methyl halide"],0,"Tertiary halides give elimination instead of substitution with CN⁻.","Tertiary halides eliminate with CN⁻ instead of substituting. So cannot use 3° R–X.",1],["Hot KMnO₄ oxidises an alkylbenzene such as ethylbenzene to:",["acetophenone, because only one carbon is oxidised","benzene, because the side chain is removed","benzoic acid, because any alkyl side chain is oxidised to COOH","phenylethanoic acid, because only the end carbon is oxidised"],2,"The side chain carbon next to the ring is oxidised, and the remainder is lost as CO₂. An o-dialkylbenzene gives phthalic acid.","Hot KMnO₄ turns any alkyl side chain on benzene into COOH. Ethylbenzene → benzoic acid.",0],["Propylmagnesium bromide is treated with CO₂ and then HCl. The acid formed is:",["propanoic acid, CH₃CH₂COOH","pentanoic acid, CH₃CH₂CH₂CH₂COOH","butanal, CH₃CH₂CH₂CHO","butanoic acid, CH₃CH₂CH₂COOH"],3,"The Grignard reagent adds one carbon from CO₂. Three carbons plus one gives four. The book writes a five-carbon formula, which is wrong.","RMgX + CO₂, then H⁺ = RCOOH, adds one carbon. Propyl (3) + 1 = butanoic acid (4).",1],["Which of these gives a carboxylic acid on hydrolysis?",["an ester only, since the other derivatives do not react with water","an ether, an alcohol, an aldehyde and a ketone","an ester, an acid chloride, an anhydride and an amide","an ester and an ether only, since both contain a C–O–C link"],2,"Ester + H₂O gives acid + alcohol. RCOCl + H₂O gives RCOOH + HCl. Anhydride gives two acids. Amide gives acid (or its salt) and NH₄⁺ (or NH₃).","All acid derivatives (ester, acid chloride, anhydride, amide) hydrolyse back to the acid.",0],["Hydrolysis of an amide with NaOH gives:",["an alcohol and a carboxylic acid","an amine and carbon dioxide","a carboxylic acid and ammonium ion","a carboxylate salt and ammonia"],3,"Under acid conditions, the products are the acid and NH₄⁺. Under alkaline conditions, the products are RCOO⁻ and NH₃.","Amide + NaOH → RCOO⁻Na⁺ + NH₃. Ammonia gas is the extra product.",1],["In the malonic ester synthesis, which compound is the starting ester?",["diethyl malonate, CH₂(COOC₂H₅)₂","ethyl acrylate, CH₂=CHCOOC₂H₅","diethyl ether, C₂H₅OC₂H₅","ethyl acetate, CH₃COOC₂H₅"],0,"The CH₂ between the two ester groups is acidic. NaOC₂H₅ removes H⁺, then the carbanion attacks RX.","Malonic ester = diethyl malonate, CH₂(COOC₂H₅)₂. The CH₂ between two esters.",0],["After alkylation, the malonic ester synthesis ends with:",["reduction and dehydration to give RCH₂CH₂OH","hydrolysis and decarboxylation to give RCH₂COOH","oxidation and esterification to give RCOOR","hydrolysis and dehydration to give RCH=CH₂"],1,"Hydrolysis gives the diacid, and heating removes one CO₂.","Malonic route: alkylate, hydrolyse, heat (decarboxylate) → RCH₂COOH. Adds two carbons to the halide R.",0],["Carboxylic acids have much higher boiling points than esters of nearly the same molecular mass because:",["acid molecules are ionic compounds, so a lot of energy is needed to separate the ions","acid molecules form stable cyclic dimers through double intermolecular hydrogen bonding","esters have a higher molecular mass, so their molecules are held less strongly than acids","acid molecules form covalent bonds with each other, giving a giant network structure"],1,"Two H-bonds hold two acid molecules together. Esters have no O–H and cannot do this.","Acids form cyclic dimers through two H bonds. Esters cannot. Dimer = higher boiling point.",0],["As the number of carbons in a carboxylic acid increases, the solubility in water:",["stays the same, while the melting and boiling points increase","increases, while the melting and boiling points decrease","decreases, while the melting and boiling points increase","increases, along with the melting and boiling points"],2,"The nonpolar R group grows relative to the polar COOH. The lower members (up to about 4 carbons) are fully miscible.","Longer chain = solubility falls, melting and boiling point rise. Water-solubility down, mp/bp up.",0],["Carboxylic acids are weak acids because:",["they are fully dissociated in water","they are insoluble in all solvents","they have no hydrogen ions","they are only partially dissociated in water"],3,"Even though they are much more acidic than alcohols, an equilibrium is set up with most molecules unionised.","Weak acid = only partially dissociated. Ka small.",0],["Why is a carboxylic acid much more acidic than an alcohol?",["the carboxylate ion is stabilised by resonance, but the alkoxide ion is not","the alkoxide ion is stabilised by resonance but the carboxylate is not","carboxylic acids have more hydrogen atoms than alcohols","carboxylic acids have a higher molecular mass than alcohols"],0,"The negative charge in RCOO⁻ is spread over two oxygens. In RO⁻ the negative charge is on a single oxygen.","Carboxylate ion is resonance stabilised; alkoxide is not. Resonance = more acidic.",0],["Which acid is the strongest, based on Ka values?",["HCOOH","Cl₂CHCOOH","CH₃COOH","ClCH₂COOH"],1,"The Ka values (×10⁻⁵) are 5530 for Cl₂CHCOOH, 136 for ClCH₂COOH, 17.7 for HCOOH and 1.75 for CH₃COOH. More chlorine atoms pull electrons and stabilise the anion more.","More Cl = more electron withdrawal = stronger acid. Cl₂CHCOOH has two Cl, so the strongest.",0],["Which of these is the weakest acid?",["ClCH₂COOH, with Ka = 136 × 10⁻⁵","C₆H₅COOH, with Ka = 6.3 × 10⁻⁵","HCOOH, with Ka = 17.7 × 10⁻⁵","CH₃COOH, with Ka = 1.75 × 10⁻⁵"],3,"The methyl group donates electrons, which reduces acidity. Formic acid has no such group, so it is stronger than acetic acid.","Weakest acid = smallest Ka. CH₃COOH (1.75 × 10⁻⁵) has no electron-withdrawing group. Compare the powers of ten.",1],["An electron-withdrawing group on the alkyl chain of an acid affects the acid in which way?",["it increases acidity by spreading the negative charge over the anion through the inductive effect","it decreases acidity by concentrating the negative charge on the carboxylate anion","it has no effect on acidity, since the group is too far from the carboxyl group","it decreases acidity by making the acid less soluble in water and so less able to ionise"],0,"Cl, NO₂ and similar groups pull electron density. The anion becomes more stable and the acid ionises more.","Electron-withdrawing group spreads the negative charge and stabilises the anion. Acidity increases.",0],["Which acid is stronger than benzoic acid, Ka = 6.3 × 10⁻⁵?",["acetic acid, Ka = 1.75 × 10⁻⁵","p-methylbenzoic acid","o-nitrobenzoic acid, Ka = 670 × 10⁻⁵","p-hydroxybenzoic acid, Ka = 2.6 × 10⁻⁵"],2,"The nitro group withdraws electrons, which makes the anion more stable. The OH and CH₃ groups donate electrons and lower acidity.","o-nitrobenzoic: Ka 670 × 10⁻⁵ is bigger than 6.3 × 10⁻⁵. Higher Ka = stronger.",0],["Which test distinguishes a carboxylic acid from a phenol or an alcohol?",["it reacts with sodium to liberate hydrogen","it dissolves in water","it liberates CO₂ from sodium hydrogencarbonate","it burns with a smoky flame"],2,"RCOOH + NaHCO₃ → RCOONa + H₂O + CO₂. Alcohols and most phenols do not react with NaHCO₃. Sodium reacts with all three.","Acid + NaHCO₃ → CO₂ bubbles. Phenols and alcohols do not (they are too weak).",1],["The equation for the reaction between acetic acid and sodium hydroxide is:",["CH₃COOH + NaOH → CH₃COONa + H₂","CH₃COOH + NaOH → CH₃COONa + H₂O","CH₃COOH + NaOH → CH₃CH₂OH + Na₂CO₃","CH₃COOH + NaOH → CH₃COONa + H₂O + CO₂"],1,"A base gives only salt and water. CO₂ is released only from a carbonate or hydrogencarbonate. The book's version has a mistaken CO₂.","CH₃COOH + NaOH → CH₃COONa + H₂O. Neutralisation. Salt + water only.",1],["Carboxylic acids react with sodium to give:",["an alcohol and sodium oxide","an ester and hydrogen gas","a sodium salt and CO₂","a sodium salt and hydrogen gas"],3,"2RCOOH + 2Na → 2RCOONa + H₂.","Acid + Na → RCOONa + H₂. Same as alcohols, but faster.",0],["In the reaction of RCOOH with PCl₅ or SOCl₂, the –OH group is replaced by:",["–Cl, giving an acid chloride","–NH₂, giving an amide","–OR, giving an ester","–H, giving an aldehyde"],0,"RCOOH + PCl₅ → RCOCl + POCl₃ + HCl. With SOCl₂: RCOCl + SO₂ + HCl.","PCl₅ or SOCl₂ replaces OH with Cl. RCOOH → RCOCl.",0],["Why is thionyl chloride preferred to PCl₅ for making acid chlorides?",["its by-products are solids that can be filtered off, which makes the acid chloride pure","it is cheaper than PCl₅ and gives a higher yield of the acid chloride at room temperature","it reacts with the acid without any by-products, so no separation is needed at all","its by-products, SO₂ and HCl, are gases that escape, so the acid chloride is easily obtained"],3,"With PCl₅ you must separate POCl₃ from the product. With SOCl₂ the by-products leave as gases.","SOCl₂ gives SO₂ and HCl, both gases that leave, so the acid chloride stays pure. PCl₅ leaves POCl₃ to separate.",1],["How can an amide be made from a carboxylic acid?",["treat the acid with sodium and then ammonia","convert the acid to an aldehyde, then oxidise it","convert the acid to an acid chloride, and then treat it with ammonia","treat the acid directly with chlorine and light"],2,"RCOCl + NH₃ → RCONH₂ + HCl.","Acid → acid chloride (SOCl₂) → amide (NH₃). Do not use direct heating of acid with NH₃ alone.",0],["Heating sodium propanoate with soda lime gives:",["ethane, which has one carbon less than the acid","propane, which has the same carbon number","ethanol, which is an alcohol","butane, which has one more carbon"],0,"This is decarboxylation: RCOONa + NaOH → RH + Na₂CO₃. The COOH carbon is lost as carbonate (CO₂).","Soda lime decarboxylation: lose CO₂. Propanoate (3 C) gives ethane (2 C). One carbon less.",0],["The Hell–Volhard–Zelinsky reaction does what?",["it removes CO₂ from the acid, using soda lime","it replaces an alpha-hydrogen with a halogen, using red phosphorus and Cl₂ or Br₂","it replaces the OH with chlorine, using PCl₅","it adds a halogen to the aromatic ring, using FeBr₃"],1,"RCH₂COOH → RCHXCOOH. Acetic acid can be taken to chloro-, dichloro- and trichloroacetic acid.","HVZ = α-halogenation of acids (Br₂, red P). α-H replaced by Br.",0],["The –COOH group on a benzene ring is:",["an ortho/para director, which activates the ring","a meta director, which deactivates the ring","a meta director, which activates the ring","an ortho/para director, which deactivates the ring"],1,"COOH withdraws electrons from the ring, which reduces the electron density, especially at the ortho and para positions. So substitution goes meta.","–COOH is electron-withdrawing, so it deactivates the ring and directs meta.",0],["What is the product when benzoic acid is nitrated with HNO₃/H₂SO₄?",["2,4,6-trinitrobenzoic acid only","p-nitrobenzoic acid","o-nitrobenzoic acid","m-nitrobenzoic acid"],3,"The carboxyl group directs the incoming NO₂⁺ to the meta position.","COOH is meta-directing: benzoic acid nitration gives m-nitrobenzoic acid.",0],["Which groups are ortho/para directors?",["–OH, –OR, –NH₂ and alkyl groups","–COOH, –NO₂ and –CHO","–COOH, –OH and –NO₂","–NO₂, –CN and –COOR"],0,"Electron-donating groups activate the ring and direct to ortho and para. Electron-withdrawing groups are meta directors.","o/p directors: –OH, –OR, –NH₂, alkyl. All are electron-donating.",1],["A mixture of ethanoic acid and ethanol with concentrated H₂SO₄ is warmed. What smell is observed?",["a smell of rotten eggs from hydrogen sulphide","a sharp pungent smell of ammonia from the acid","a sweet, fruity smell of ethyl ethanoate","no smell, because the mixture only forms a salt and water"],2,"This is the esterification test for acids (and alcohols).","Acid + alcohol + conc. H₂SO₄ gives a fruity-smelling ester. Smell is the test for esterification.",0],["Which of these is a dicarboxylic acid?",["oxalic acid (ethanedioic acid) and malonic acid (propanedioic acid)","formic acid (methanoic acid) and oxalic acid (ethanedioic acid) only","acetic acid (ethanoic acid) and propionic acid (propanoic acid)","benzoic acid (benzenecarboxylic acid) and acetic acid (ethanoic acid)"],0,"Both oxalic acid HOOC–COOH and malonic acid HOOCCH₂COOH have two carboxyl groups.","Dicarboxylic = two COOH. Oxalic (2 C) and malonic (3 C) both fit.",0],["Higher fatty acids, such as palmitic acid and stearic acid, are found mainly:",["as free acids in sea water","as gases in the atmosphere","as esters of glycerol in plants and animals","as salts of sodium in the soil"],2,"Butanoic acid exists in cow butter as a glyceryl ester. Fatty acids have four or more carbons.","Palmitic and stearic acids are found as glycerol esters (fats and oils) in plants and animals. Not free.",0],["Reduction of a carboxylic acid with LiAlH₄ gives:",["an aldehyde","a ketone","a secondary alcohol","a primary alcohol"],3,"RCOOH → RCH₂OH. Since LiAlH₄ is expensive, the acid is often esterified first and then reduced.","LiAlH₄ + RCOOH = RCH₂OH. Primary alcohol.",0]]},{"t":"Esters","q":[["An ester is a carboxylic acid derivative in which:",["the C=O of the acid is replaced by a CH₂ group","the –OH of the acid is replaced by a chlorine atom","the –OH of the acid is replaced by an amino group, –NH₂","the –OH of the acid is replaced by an alkoxy group, –OR"],3,"The general formula is RCOOR'. Examples are CH₃COOCH₂CH₃ and C₆H₅COOCH₃.","Ester = acid with OH replaced by OR (alkoxy). RCOOR'.",0],["In the name ethyl propanoate, which part comes from the alcohol?",["propanoate","the –oate ending","ethyl","ethyl propanoate as a whole"],2,"The alkyl group on the oxygen comes from the alcohol and is named first. The acid part ends in –oate.","Name = ALCOHOL part first (ethyl), then acid part (propanoate). First word = alcohol.",0],["What are the products of the esterification of ethanoic acid with ethanol?",["ethyl ethanoate and carbon dioxide","ethyl ethanoate and water","ethanal and water","ethyl ethanoate and hydrogen"],1,"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O. It is reversible and catalysed by acid.","Acid + alcohol → ester + water. Ethanoic + ethanol = ethyl ethanoate + H₂O.",0],["Which statement about esterification of an acid with an alcohol is correct?",["it is a reversible reaction catalysed by H⁺","it is irreversible and catalysed by OH⁻","it goes to completion and needs no catalyst","it needs UV light"],0,"Because it is reversible, an excess of one reactant or removal of water is used to improve the yield.","Esterification is reversible and acid-catalysed. 'Reversible' is the winning word.",1],["Which reaction between an alcohol and an acid chloride gives an ester?",["CH₃COCl + CH₃OH → CH₃CHO + HCl","CH₃COCl + CH₃OH → CH₃COOH + CH₃Cl","CH₃COCl + CH₃OH → CH₃COOCH₃ + HCl","CH₃COCl + CH₃OH → CH₃OCH₃ + HCOCl"],2,"The alcohol replaces Cl with OR. HCl is the by-product, and the reaction is not reversible.","Acid chloride + alcohol → ester + HCl. Look for HCl as the by-product.",0],["An anhydride reacts with an alcohol to give:",["an ester and water","an ester and HCl","two molecules of ester","an ester and a carboxylic acid"],3,"(CH₃CO)₂O + CH₃OH → CH₃COOCH₃ + CH₃COOH. Half the anhydride becomes the ester and half becomes the acid.","Anhydride + ROH → ester + acid (half the anhydride leaves as an acid).",1],["Heating the silver salt of a carboxylic acid with an alkyl halide gives:",["an alcohol and a silver salt","an ester and a silver halide","an acid and silver oxide","an ether and silver"],1,"RCOOAg + R'X → RCOOR' + AgX.","RCOOAg + R'X → RCOOR' + AgX. Silver halide precipitates.",0],["Diazomethane reacts with a carboxylic acid to give:",["a methyl ester and nitrogen gas","an acid chloride and nitrogen gas","a methyl ester and hydrogen gas","an ethyl ester and nitrogen gas"],0,"RCOOH + CH₂N₂ → RCOOCH₃ + N₂. It only makes methyl esters.","CH₂N₂ + RCOOH → methyl ester + N₂. Methylation. Nitrogen bubbles away.",0],["Hydrolysis of an ester produces:",["a ketone and water","a carboxylic acid and an alcohol","two alcohols","an aldehyde and an alcohol"],1,"It is the reverse of esterification. Acid hydrolysis is reversible, while alkaline hydrolysis is not.","Ester + H₂O → acid + alcohol. Reverse of esterification.",0],["Alkaline hydrolysis of an ester differs from acid hydrolysis because it:",["gives an aldehyde instead of the alcohol, since the OH⁻ oxidises the product","does not occur at all, because esters are inert toward hydroxide ions","is reversible, and gives the free acid together with the alcohol in an equilibrium mixture","goes to completion, and gives the salt of the acid instead of the free acid"],3,"In base, the acid formed is immediately neutralised to RCOO⁻. That drives the reaction one way.","Alkaline hydrolysis is irreversible. Complete, gives the carboxylate salt. Acid hydrolysis is reversible.",1],["Assignment: what is soap?",["the sodium or potassium salt of a long-chain fatty acid","a long-chain hydrocarbon that dissolves in water","a long-chain alcohol with an OH group","the calcium salt of a short-chain acid"],0,"Soap is made by alkaline hydrolysis of fats and oils.","Soap = sodium or potassium salt of a long-chain fatty acid. Na/K + fatty acid.",0],["Saponification is the:",["acid hydrolysis of fats and oils with dilute H₂SO₄ to give fatty acids and glycerol","dehydration of glycerol with concentrated H₂SO₄ to give acrolein and water","alkaline hydrolysis of fats and oils with NaOH or KOH to give soap and glycerol","oxidation of fatty acids with KMnO₄ to give soap and carbon dioxide"],2,"A fat is a triester of glycerol. With NaOH you get 3 moles of soap per mole of fat, plus glycerol.","Saponification = alkaline hydrolysis of fats and oils (NaOH or KOH). Soap-making.",0],["Which gives a harder soap, NaOH or KOH?",["neither can make soap","KOH gives a hard soap and NaOH gives a soft soap","NaOH gives a hard soap and KOH gives a soft soap","both give a hard soap"],2,"Sodium soaps are firm. Potassium soaps are soft or liquid.","NaOH = hard soap. KOH = soft soap. N for hard, K for soft (KOH is Kind to skin).",1],["Assignment: how does soap clean greasy dirt?",["the nonpolar tail dissolves in grease and the ionic head stays in water, forming micelles that carry the dirt away","soap reacts chemically with the grease to form a gas, which carries the dirt away from the cloth surface","the ionic head dissolves in the grease and the nonpolar tail stays in water, so the grease is drawn into the water layer","soap burns the grease away by an exothermic reaction, leaving only ash that washes off easily"],0,"The hydrocarbon tail is hydrophobic and enters the grease. The carboxylate head is hydrophilic and faces the water. The grease droplet is then pulled into the water.","Soap: non-polar tail dissolves in grease, ionic head sticks to water. Tail in grease, head in water.",0],["Transesterification is:",["the reaction of two esters to give a fat","the cleavage of an ester by ammonia to give an amide","the conversion of an ester to an acid by heating","the cleavage of an ester by an alcohol to give a different ester"],3,"RCOOR¹ + R²OH ⇌ RCOOR² + R¹OH. It is also called alcoholysis.","Transesterification = ester + alcohol gives a different ester + a different alcohol. Swap of the alkoxy group.",0],["What conditions favour transesterification?",["an oxidising agent and an excess of ester, because the alcohol must be oxidised first","an acid or base catalyst and an excess of the alcohol, because the reaction is reversible","no catalyst and a limited amount of alcohol, because the reaction goes to completion by itself","ultraviolet light and chlorine gas, because the reaction proceeds through free radicals"],1,"Concentrated H₂SO₄, dry HCl or an alkoxide can be used as the catalyst.","Needs acid or base catalyst + excess alcohol (pushes equilibrium). Both conditions together.",0],["An ester reacts with ammonia to give:",["an amide and an alcohol","an amine and an aldehyde","an acid and an amine","an acid chloride and water"],0,"RCOOR' + NH₃ → RCONH₂ + R'OH. This is called ammonolysis.","Ester + NH₃ → amide + alcohol. Ammonolysis.",0],["What is formed when an ester reacts with hydrazine?",["an amide, RCONH₂","an acid, RCOOH","an acyl hydrazide, RCONHNH₂","an oxime, RCH=NOH"],2,"Hydrazine, NH₂NH₂, replaces the OR group. RCO– is the acyl group.","Ester + NH₂NH₂ → RCONHNH₂ (acyl hydrazide). Hydrazine is N₂H₄.",0],["What is the acyl group in an ester such as ethyl ethanoate?",["CH₃CH₂O–, derived from the alcohol part","CH₃CO–, derived from the acid part","CH₃COO–, derived from the whole ester","CH₃CH₂–, derived from the alcohol part"],1,"RCO– is the acyl group and it comes from the carboxylic acid. The group from the alcohol is the alkyl group.","Acyl group = the part from the acid: CH₃CO–. The alkyl part from the alcohol is not acyl.",1],["Reaction of an ester with PCl₅ or SOCl₂ gives:",["an amide","an acid anhydride","an alcohol","an acid chloride"],3,"The ester is changed to RCOCl. These reagents are also used for acids.","Ester + PCl₅ or SOCl₂ → acid chloride (and alkyl chloride). The OR is replaced by Cl.",0],["Reduction of methyl ethanoate with LiAlH₄ or H₂/Ni gives:",["ethane and methanol","ethanoic acid and methane","ethanal and methanol","ethanol and methanol"],3,"The acid part becomes a primary alcohol, and the alcohol part is released. Fats are reduced to long-chain alcohols and glycerol.","LiAlH₄ splits an ester into two alcohols: the acid part (ethanol) and the alcohol part (methanol).",0],["When an ester reacts with one mole of a Grignard reagent, the first product is a ketone, and with a second mole it becomes:",["a primary alcohol","a tertiary alcohol","a carboxylic acid","a secondary alcohol"],1,"The ketone is more reactive than the ester, so it reacts with the second Grignard reagent. After hydrolysis, you get a tertiary alcohol.","Ester + 1 RMgX → ketone; + 2nd RMgX → tertiary alcohol. 2 moles = tertiary alcohol.",0],["Fruity essences are mainly:",["esters of higher fatty acids with higher monohydric alcohols","salts of carboxylic acids with sodium","esters of lower and middle carboxylic acids with lower and middle alcohols","esters of higher fatty acids with glycerol"],2,"They are volatile and have sweet smells.","Fruity essence = esters of small acids + small alcohols. Think pineapple, banana, apple.",0],["Fats and oils are esters of:",["glycerol with higher and middle fatty acids","glycerol with inorganic acids","ethylene glycol with short-chain acids","monohydric alcohols with higher acids"],0,"Each fat molecule has three fatty acid chains attached to a glycerol backbone.","Fats and oils = glycerol + 3 fatty acids (triglycerides). Glycerol is the alcohol.",0],["Waxes, such as beeswax, are esters of:",["higher monohydric alcohols with higher carboxylic acids","glycerol with higher fatty acids","lower alcohols with lower carboxylic acids","ethylene glycol with lower fatty acids"],0,"Fats are glycerol esters. Waxes use a single OH alcohol with a long chain, so they are not glycerides.","Waxes = esters of long-chain monohydric alcohols with long-chain acids. 'Monohydric' (one OH) is the trap, not glycerol.",1],["Methyl butanoate is used mainly as:",["a fuel for petrol engines because it burns cleanly","a monomer for making nylon fibres by condensation","a fertiliser for the soil because it releases nitrogen","a flavouring agent with a fruity smell"],3,"Esters are also used as solvents in paints, lacquers and plastics, and in making soaps.","Methyl butanoate smells fruity (pineapple). Used as flavouring.",0],["Which test is used to identify esters using hydroxylamine hydrochloride?",["the Lucas test, which gives a cloudy solution with ZnCl₂","the iodoform test, which gives a yellow precipitate","the hydroxamic acid test, which gives a red or violet colour with FeCl₃","the Baeyer test, which decolourises KMnO₄"],2,"The ester reacts with hydroxylamine to give a hydroxamic acid. It forms a coloured complex with Fe³⁺.","Hydroxylamine test: ester → hydroxamic acid, then FeCl₃ gives red or violet colour. Hydroxamic acid is the keyword.",0],["What is the product when ethyl ethanoate is hydrolysed with aqueous NaOH?",["ethanal and sodium ethoxide","sodium ethanoate and ethanol","ethanoic acid and ethanol","ethanoic acid and sodium ethoxide"],1,"The acid made is at once neutralised by NaOH. So the products are the sodium salt and the alcohol.","Ester + NaOH → RCOONa + ROH. Ethyl ethanoate → sodium ethanoate + ethanol.",1],["Which of these is the correct name of CH₃CH₂COOCH₃?",["ethyl ethanoate","methyl propanoate","methyl ethanoate","propyl methanoate"],1,"The O-attached alkyl is methyl. The acid part has three carbons (propanoic), so the name is methyl propanoate.","CH₃CH₂COOCH₃: alkyl on O is methyl; acid part is propanoate (3 C). Methyl propanoate.",1],["How many esters have the formula C₃H₆O₂?",["4: including propanoic acid","3: including propyl methanoate","2: methyl ethanoate and ethyl methanoate","1: methyl ethanoate only"],2,"HCOOCH₂CH₃ and CH₃COOCH₃ are the only two. Propanoic acid is an acid, not an ester.","C₃H₆O₂ esters: HCOOC₂H₅ and CH₃COOCH₃. Only two. Count the possible alkyl groups.",0]]},{"t":"Aldehydes and Ketones","q":[["Aldehydes and ketones are collectively called:",["alkoxy compounds, because they contain the –OR group","carboxyl compounds, because they contain the –COOH group","carbonyl compounds, because they contain the C=O group","hydroxyl compounds, because they contain the –OH group"],2,"Both have a C=O. In aldehydes, the carbonyl carbon has at least one H. In ketones, it is between two carbons.","Aldehydes + ketones both have C=O: carbonyl compounds.",0],["Which of these functional groups is classified as a carbonyl compound in this chapter?",["a carboxylic acid","a ketone","an acid chloride","an ester"],1,"Even though acids, esters, acid chlorides and anhydrides contain a C=O, they are not called carbonyl compounds. Only aldehydes and ketones are.","Of the options, only a ketone has a C=O carbonyl. Ester, acid etc. are 'carboxyl derivatives' here.",1],["What is the IUPAC name of HCHO, and what is its common name?",["methanal and formaldehyde","propanal and propionaldehyde","ethanal and acetaldehyde","methanol and formalin"],0,"Ethanal is CH₃CHO and propanal is CH₃CH₂CHO.","HCHO: methanal (IUPAC), formaldehyde (common). One carbon, 'meth'.",0],["Acetone is also called:",["ethanone, with the formula CH₃COCH₃","propanal, with the formula CH₃CH₂CHO","butanone, with the formula CH₃COCH₂CH₃","propanone, with the formula CH₃COCH₃"],3,"The carbonyl carbon is in the middle of a 3-carbon chain.","Acetone = propanone, CH₃COCH₃. 3 carbons with C=O in the middle.",0],["What is the IUPAC name of CH₃CH₂COCH₃?",["propan-2-one (acetone)","butan-2-one (methyl ethyl ketone)","butanal (butyraldehyde)","butan-3-one (ethyl methyl ketone)"],1,"Four carbons with C=O on carbon 2 counted from the end nearer the C=O.","CH₃CH₂COCH₃ = 4 C, C=O at 2 (lowest number from the end). Butan-2-one = methyl ethyl ketone.",0],["The common name of (CH₃)₂CHCOCH₃ is methyl isopropyl ketone. Its IUPAC name is:",["3-methylbutan-2-one","2-methylbutanal","pentan-2-one","2-methylbutan-3-one"],0,"The chain has four carbons with C=O on carbon 2 and a methyl on carbon 3.","Longest chain 4 C with C=O at C2 and methyl at C3: 3-methylbutan-2-one.",0],["Acetophenone and benzophenone are respectively:",["C₆H₅CHO and C₆H₅COCH₃","C₆H₅COOH and C₆H₅COCH₃","C₆H₅COC₆H₅ and C₆H₅COCH₃","C₆H₅COCH₃ and C₆H₅COC₆H₅"],3,"Aceto = methyl on the C=O. Benzo = another phenyl on the C=O.","Aceto = CH₃ on the C=O: C₆H₅COCH₃. Benzo = phenyl on both sides: C₆H₅COC₆H₅.",0],["What is the common name of CH₃CH₂COCH₂CH₃?",["dipropyl ketone","methyl propyl ketone","diethyl ketone (3-pentanone)","ethyl methyl ketone"],2,"Two ethyl groups on the C=O. In IUPAC, it is pentan-3-one.","Two ethyls around C=O = diethyl ketone = pentan-3-one.",0],["Exercise: the IUPAC name of OHC–(CH₂)₄–CHO is:",["hexane-1,6-dione","hexanedial","hexanedioic acid","hexan-1,6-diol"],1,"Six carbons, with CHO at each end: the suffix is -dial.","Two CHO ends on 6 carbons: hexanedial. (CH₂)₄ + 2 CHO = 6 C.",0],["Exercise: the IUPAC name of HC≡C–CH₂CH₂CH₂–CHO is:",["hex-5-ynone","hex-1-yn-6-al","hex-1-ynal","hex-5-ynal"],3,"The aldehyde carbon is C1, so the triple bond is at C5. The suffix -al is at the end, with the e of -yne dropped.","Count the chain from the CHO: 6 C, triple bond at C5. Hex-5-ynal. CHO always carbon 1.",1],["Exercise: the IUPAC name of (CH₃)₂CHCH₂CHO is:",["2-methylbutanal","isopentanal ketone","3-methylbutanal","3-methylbutan-1-one"],2,"The CHO carbon is C1, so the methyl is on C3.","Chain: CHO (C1), CH₂ (C2), CH (C3, with CH₃), CH₃ (C4). 3-methylbutanal.",0],["Exercise: the IUPAC name of CH₃COCH₂CH₂CH(CH₃)₂ is:",["5-methylhexan-2-one","2-methylhexan-2-one","2-methylhexan-5-one","5-methylhexanal"],0,"Six carbons, with the C=O on C2 counted from the end that gives it the lower number. The methyl is on C5.","Number from the C=O end: C1 CH₃, C2 C=O. 6 C chain, methyl on C5. 5-methylhexan-2-one.",0],["Exercise: the IUPAC name of CH₃COC(CH₃)₂CH₂ cyclopropane, i.e. 1-(2,2-dimethylcyclopropyl)ethanone, indicates:",["a ketone with an acetyl group attached to a cyclopropane ring that has two methyl groups on the same carbon","an aldehyde with a methyl group on a cyclopropane ring","an ester containing a cyclopropane ring","an ether with a cyclopropane ring and an ethyl group"],0,"Ethanone is CH₃CO–. The ring is named as a substituent (cyclopropyl).","Acetyl (CH₃CO–) attached to a ring = ketone ('ethanone' with a ring on it). Spot CH₃CO– plus a ring.",0],["Exercise: which is the structure of cinnamaldehyde?",["C₆H₅CHO","C₆H₅CH=CHCOCH₃","C₆H₅CH₂CHO","C₆H₅CH=CHCHO"],3,"Cinnamaldehyde is 3-phenylprop-2-enal. C₆H₅CH₂CHO is phenylacetaldehyde and C₆H₅CHO is benzaldehyde.","Cinnam = C₆H₅CH=CH– + CHO. Phenyl-propenal.",0],["Exercise: trimethylacetaldehyde is:",["CH₃CH₂C(CH₃)₂–CHO only","(CH₃)₃C–COCH₃","(CH₃)₃C–CHO","(CH₃)₂CH–CHO"],2,"This is derived naming. Acetaldehyde is CH₃CHO, and replacing the three H on CH₃ with methyl groups gives (CH₃)₃C–CHO, which is 2,2-dimethylpropanal.","Tri-methyl-acetaldehyde: acetaldehyde (CH₃CHO) with all 3 H on the CH₃ replaced by CH₃. (CH₃)₃C–CHO.",1],["Exercise: 4-methylpent-3-en-2-one is:",["CH₃CH=CHCOCH₃","CH₃COCH=C(CH₃)₂","(CH₃)₂C=CHCHO","CH₃COCH₂CH(CH₃)₂"],1,"Five carbons with C=O at C2, a double bond between C3 and C4, and a methyl at C4. It is also called mesityl oxide.","4-methylpent-3-en-2-one: C=O at C2, C=C at C3=C4 with methyl on C4. CH₃COCH=C(CH₃)₂.",0],["Exercise: 3-hydroxypentanal is:",["CH₃CH(OH)CH₂CH₂CHO","HOCH₂CH₂CH₂CH₂CHO","CH₃CH₂CH₂CH(OH)CHO","CH₃CH₂CH(OH)CH₂CHO"],3,"CHO is C1, and the OH is on C3.","3-hydroxypentanal: 5 C, CHO at C1, OH at C3. CH₃CH₂CH(OH)CH₂CHO.",0],["In the preparation of an aldehyde by oxidising a primary alcohol, why is the aldehyde distilled out as soon as it is formed?",["it has a higher boiling point than the alcohol, so it would stay in the flask","it must be removed because it turns into a ketone","it has a lower boiling point than the alcohol, and removing it stops further oxidation to the acid","it must be removed because it dissolves in the oxidising agent"],2,"Butan-1-ol boils at 118 °C and butanal at 76 °C. The aldehyde has no O–H, so it has no hydrogen bonding with itself. It leaves the mixture before being oxidised.","Aldehyde boils lower (no H-bonding), so distil it off before it oxidises further to the acid.",1],["What happens to methylbenzene when it is treated with Cl₂ and heat, and then with water?",["it forms benzaldehyde through benzal chloride, C₆H₅CHCl₂","it forms phenol through chlorobenzene","it forms benzoic acid through benzyl chloride","it forms benzyl alcohol through benzyl chloride only"],0,"ArCH₃ → ArCHCl₂ → ArCHO. The dichloromethyl group is hydrolysed to the aldehyde.","Toluene + Cl₂/heat → benzal chloride → H₂O → benzaldehyde. Two Cl on the CH₃ turn into CHO.",0],["Which reagent reduces an acid chloride to an aldehyde and stops there?",["sodium borohydride, NaBH₄ in water","lithium tri-tert-butoxyaluminium hydride, LiAlH(O-tBu)₃","hydrogen over nickel at high pressure","lithium aluminium hydride, LiAlH₄"],1,"LiAlH₄ would continue to the alcohol. The bulky hydride is milder and stops at the aldehyde.","LiAlH(OBu-t)₃: a weak, bulky hydride. Stops at the aldehyde. LiAlH₄ would go on to the alcohol.",0],["The Reimer–Tiemann reaction produces which compound from phenol?",["salicylaldehyde (o-hydroxybenzaldehyde)","salicylic acid (o-hydroxybenzoic acid)","benzaldehyde, since the OH group is lost on reaction","p-hydroxybenzaldehyde, since the CHO adds at the para position"],0,"Phenol + CHCl₃ + aqueous NaOH puts a CHO group at the ortho position. The intermediate is a benzal chloride that is hydrolysed in alkali.","Reimer–Tiemann: phenol + CHCl₃/NaOH = o-hydroxybenzaldehyde (salicylaldehyde).",0],["How are ketones prepared by oxidation?",["oxidation of a tertiary alcohol with K₂Cr₂O₇/H⁺","oxidation of a primary alcohol with K₂Cr₂O₇/H⁺","oxidation of a secondary alcohol with CrO₃ or K₂Cr₂O₇/H⁺","oxidation of an alkane with KMnO₄"],2,"Propan-2-ol gives propanone. Menthol gives menthone.","Ketone: oxidise a SECONDARY alcohol. Primary gives aldehyde/acid.",0],["Friedel–Crafts acylation of benzene with benzoyl chloride and AlCl₃ gives:",["acetophenone and HCl","toluene and HCl","benzaldehyde and HCl","benzophenone and HCl"],3,"C₆H₆ + C₆H₅COCl → C₆H₅COC₆H₅ + HCl. It is a type of electrophilic aromatic substitution.","Benzene + C₆H₅COCl/AlCl₃ → benzophenone + HCl. Friedel–Crafts acylation.",0],["Benzene is treated with acetic anhydride and AlCl₃. The products are:",["benzaldehyde and ethanoic acid","acetophenone and ethanoic acid","phenol and acetone","toluene and carbon dioxide"],1,"The acyl group CH₃CO– goes onto the ring. The other half of the anhydride becomes acetic acid.","Benzene + (CH₃CO)₂O/AlCl₃ → acetophenone + CH₃COOH. The anhydride also gives an acid.",0],["Organocadmium compounds R₂Cd react with acid chlorides to give:",["carboxylic acids","ketones","tertiary alcohols","aldehydes"],1,"2RCOCl + R'₂Cd → 2RCOR' + CdCl₂. They are less reactive than Grignard reagents, so they stop at the ketone.","R₂Cd + acid chloride = ketone. Cadmium stops at the ketone, unlike Grignard.",0],["What kind of R' groups can be used in an organocadmium reagent?",["tertiary alkyl groups only","any alkyl group, including tertiary","aryl or primary alkyl groups only","only methyl"],2,"The reagent is made from the Grignard reagent and CdCl₂. Secondary and tertiary alkyls decompose.","Organocadmium R' must be aryl or primary alkyl. 2° or 3° are unstable.",1],["Di-n-butylcadmium reacts with isobutyryl chloride. The product is:",["n-butyl isopropyl ketone (2-methylheptan-3-one)","di-n-butyl ketone (nonan-5-one)","2-methylpentan-3-one (ethyl isopropyl ketone)","isopropyl alcohol (propan-2-ol)"],0,"The n-butyl group replaces Cl on (CH₃)₂CHCOCl, giving (CH₃)₂CHCOCH₂CH₂CH₂CH₃.","Isobutyryl chloride (iPr–COCl) + n-Bu₂Cd gives n-butyl isopropyl ketone. Swap Cl for butyl.",0],["Acetoacetic ester synthesis of ketones starts with:",["ethyl acetate, CH₃COOC₂H₅, which is treated with LiAlH₄ in dry ether and then with water to give a primary alcohol","acetone, CH₃COCH₃, which is treated with bromine and sodium hydroxide, then acidified to give a carboxylic acid","diethyl malonate, CH₂(COOC₂H₅)₂, which is treated with sodium ethoxide, then an alkyl halide, hydrolysed and decarboxylated to an acid","ethyl acetoacetate, CH₃COCH₂COOC₂H₅, which is treated with sodium ethoxide, then an alkyl halide, hydrolysed and decarboxylated"],3,"The CH₂ between the two carbonyls is acidic. After alkylation and hydrolysis, loss of CO₂ gives a substituted acetone.","Acetoacetic ester synthesis: ethyl acetoacetate + base + R–X, then hydrolyse and decarboxylate. Makes ketones.",1],["Which reagent gives a silver mirror with aldehydes?",["Fehling's reagent","Tollens' reagent, Ag(NH₃)₂⁺","Lucas reagent","Brady's reagent"],1,"The aldehyde is oxidised to the acid and Ag⁺ is reduced to silver metal. Ketones do not react.","Tollens' = Ag(NH₃)₂⁺ gives a silver mirror with aldehydes. Ketones do not.",0],["Why is ammonia present in Tollens' reagent?",["ammonia oxidises the aldehyde to the carboxylic acid, which is the main reaction in the test","ammonia acts as the catalyst that speeds up the electron transfer without forming any complex","ammonia complexes Ag⁺, preventing the formation of insoluble silver oxide in the alkaline medium","ammonia reduces the Ag⁺ ions to silver metal, which is what forms the mirror on the glass"],2,"Without NH₃, OH⁻ would precipitate Ag₂O. The complex keeps silver in solution.","NH₃ forms a complex so Ag⁺ does not precipitate as Ag₂O in base. Complex keeps Ag⁺ dissolved.",1],["Methyl ketones can be oxidised by which reaction?",["the iodoform (haloform) reaction, giving a yellow precipitate of CHI₃","the aldol reaction, giving a β-hydroxy ketone","the Cannizzaro reaction, giving an alcohol and an acid salt","the Clemmensen reduction, giving an alkane"],0,"RCOCH₃ + 3OI⁻ → RCOO⁻ + CHI₃ + 2OH⁻. Iodoform melts at 119 °C.","Methyl ketones (CH₃CO–) + I₂/NaOH give yellow iodoform (CHI₃). Haloform reaction.",0],["Which of these gives a positive iodoform test?",["propanal","diethyl ketone (pentan-3-one)","benzophenone","acetone"],3,"Only compounds with CH₃CO– (or CH₃CH(OH)–) react. Pentan-3-one, benzophenone and propanal do not have a methyl on the C=O.","Acetone (CH₃COCH₃) has CH₃CO–. It gives yellow CHI₃. Check for CH₃C=O.",1],["Reduction of a ketone with LiAlH₄ gives:",["a primary alcohol","an alkane","a tertiary alcohol","a secondary alcohol"],3,"Acetophenone gives 1-phenylethanol. Aldehydes give primary alcohols.","LiAlH₄ on a ketone gives a secondary alcohol. Aldehyde gives primary.",0],["The Clemmensen reduction of a ketone uses:",["NaBH₄, giving an alcohol","hydrazine and a base, giving an alkane","zinc amalgam and concentrated HCl, giving an alkane","LiAlH₄, giving an alcohol"],2,"Zn(Hg)/HCl reduces C=O to CH₂ in acidic conditions.","Clemmensen = Zn(Hg) + conc. HCl. Converts C=O to CH₂. Acid conditions.",0],["The Wolff–Kishner reduction uses:",["LiAlH₄ in ether","hydrazine, NH₂NH₂, in a basic medium","zinc amalgam in acid","H₂ over nickel"],1,"The C=O becomes CH₂ in base. Cyclopentanone gives cyclopentane.","Wolff–Kishner = NH₂NH₂ + base (KOH). Converts C=O to CH₂. Basic conditions.",0],["A ketone that is sensitive to acid has to be reduced to an alkane. Which method should be chosen?",["Wolff–Kishner, because it is carried out in a basic medium","Tollens' reagent, because it is carried out in an ammoniacal medium","Clemmensen, because it is carried out in an acidic medium","iodoform reaction, because it is carried out in an alkaline medium"],0,"Acid-sensitive product: use base. Base-sensitive product: use acid.","Acid-sensitive ketone → use basic Wolff–Kishner. Acid-sensitive = use base.",1],["Exercise: benzene reacts with butanoyl chloride and AlCl₃, followed by Zn(Hg)/conc HCl. What is the final product B?",["isobutylbenzene","sec-butylbenzene","butylbenzene","propylbenzene"],2,"The first step gives 1-phenylbutan-1-one. Clemmensen reduction turns C=O to CH₂. Direct alkylation with butyl chloride would give a rearranged product, so this route is better.","Benzene + butanoyl chloride (4 C acyl) → ketone, then Clemmensen turns C=O to CH₂. Butylbenzene.",1],["Exercise: CH₃CH₂COCH₃ is treated with NH₂NH₂ and a base. The product is:",["butanal","2-butene","butan-2-ol","butane"],3,"The C=O becomes CH₂, and the four carbons form CH₃CH₂CH₂CH₃.","CH₃CH₂COCH₃ + N₂H₄/base → CH₃CH₂CH₂CH₃. C=O becomes CH₂: butane.",0],["Why does the carbonyl group undergo nucleophilic addition?",["the carbon is electron-deficient and the oxygen is electron-rich, so nucleophiles attack the carbon","the carbon is electron-rich, so electrophiles attack it","the C=O is nonpolar, so any reagent can add","the oxygen is electron-poor, so nucleophiles attack the oxygen"],0,"The C=O bond is polarised toward oxygen. This is in contrast to the C=C of alkenes, which undergo electrophilic addition.","C is δ⁺ (electron-poor), O is δ⁻. So Nu⁻ attacks carbon: nucleophilic addition.",0],["Which of these types of addition do alkenes and aldehydes undergo respectively?",["nucleophilic addition for both","electrophilic addition and nucleophilic addition","electrophilic addition for both","nucleophilic addition and electrophilic addition"],1,"C=C is electron-rich, so it attracts electrophiles. C=O has an electron-poor carbon, so it attracts nucleophiles.","Alkenes: electrophilic addition (electron-rich π). Aldehydes: nucleophilic addition (δ⁺ carbon).",1],["A Grignard reagent reacts with ethanal. After hydrolysis, which type of alcohol is formed?",["a primary alcohol","a secondary alcohol","a carboxylic acid","a tertiary alcohol"],1,"Only methanal gives a primary alcohol. Other aldehydes give secondary, and ketones give tertiary.","Grignard + aldehyde (not methanal) → secondary alcohol. Methanal → 1°, ketone → 3°.",0],["Exercise: ethanal reacts with phenylmagnesium bromide, followed by hydrolysis. The product is:",["acetophenone","2-phenylethanol","1-phenylethanol","benzyl alcohol"],2,"The phenyl group adds to the carbonyl carbon: CH₃CH(OH)C₆H₅.","CH₃CHO + C₆H₅MgBr: CH₃CH(OH)C₆H₅ = 1-phenylethanol.",0],["Exercise: propanone reacts with n-butylmagnesium bromide, followed by hydrolysis. The product is:",["heptan-2-ol","2-methylhexan-3-ol","hexan-2-ol","2-methylhexan-2-ol"],3,"Butyl adds to acetone's carbon. The carbon then has OH, two CH₃ and a butyl, making it tertiary. The longest chain is six carbons, with a methyl on C2.","Acetone + C₄H₉MgBr: tertiary alcohol with 2 CH₃ + C₄H₉. 6 C chain: 2-methylhexan-2-ol.",0],["Addition of HCN to an aldehyde or ketone gives:",["a cyanohydrin (hydroxy nitrile)","an oxime (the C=N–OH compound)","an acetal (two OR groups on one carbon)","a hydrazone (the C=N–NH₂ compound)"],0,"The CN⁻ attacks the carbon. The O⁻ picks up an H⁺. The product has OH and CN on the same carbon.","HCN + C=O → cyanohydrin (OH and CN on the same carbon).",0],["Exercise: acetone reacts with NaCN and H₂SO₄. The product is:",["propanenitrile (ethyl cyanide), formed by loss of the oxygen atom","2-hydroxy-2-methylpropanenitrile (acetone cyanohydrin)","2-methylpropanoic acid, formed by hydrolysis of the nitrile group","2-amino-2-methylpropanenitrile, formed by replacing OH with NH₂"],1,"(CH₃)₂C(OH)CN. The nitrile carbon is counted in the chain, so the parent is propane-nitrile with a 2-methyl and 2-hydroxy.","Acetone + HCN: CH₃C(OH)(CN)CH₃. 2-hydroxy-2-methylpropanenitrile.",0],["Benzaldehyde is treated with NaCN/NaHSO₃, then with H₂O/HCl. What is the final product?",["mandelic acid","cinnamic acid","benzoic acid","salicylic acid"],0,"The first product is mandelonitrile, C₆H₅CH(OH)CN. Hydrolysis of CN to COOH gives C₆H₅CH(OH)COOH, mandelic acid.","PhCHO + CN⁻ → cyanohydrin; H₃O⁺ hydrolyses CN to COOH. Mandelic acid (PhCH(OH)COOH).",0],["Sodium bisulphite adds to benzaldehyde to give:",["a cyanohydrin, a liquid formed when the CN⁻ ion attacks the carbonyl carbon","an oxime, a crystalline solid formed by condensation with hydroxylamine","a crystalline bisulphite addition product, which is a sodium hydroxy sulphonate","a Schiff base, formed by condensation with a primary amine and loss of water"],2,"NaHSO₃ adds across C=O. The product is used to purify aldehydes.","NaHSO₃ + carbonyl gives a crystalline bisulphite adduct. Used to purify aldehydes.",0],["Diisopropyl ketone (2,4-dimethylpentan-3-one) reacts with NaHSO₃ to give:",["an oxime, formed by loss of water from the carbonyl compound","a hemiacetal, formed because the bisulphite ion acts like an alcohol","a crystalline bisulphite addition product, as all ketones do with NaHSO₃","no reaction, because of steric hindrance around the carbonyl carbon"],3,"The two bulky isopropyl groups block the attack on the carbonyl carbon.","Bulky ketones do not form the bisulphite adduct (steric hindrance). Diisopropyl ketone: no reaction.",1],["Reaction of an aldehyde with hydroxylamine, NH₂OH, gives:",["a phenylhydrazone","a semicarbazone","a hydrazone, C=N–NH₂","an oxime, C=N–OH"],3,"Ethanal gives acetaldoxime. Hydrazine gives a hydrazone, and phenylhydrazine gives a phenylhydrazone.","NH₂OH + C=O → C=N–OH, an oxime. Hydroxylamine means oxime.",0],["Which pair is correctly matched with the ammonia derivative and the product?",["semicarbazide and semicarbazone","hydrazine and oxime","hydroxylamine and hydrazone","phenylhydrazine and semicarbazone"],0,"Each product has C=N–G, with G coming from the reagent. These products are crystalline solids used for identification.","Matching pairs: hydroxylamine/oxime, semicarbazide/semicarbazone, phenylhydrazine/phenylhydrazone. Suffix 'one' goes with hydrazide.",0],["Benzaldehyde reacts with phenylhydrazine to give:",["benzaldehyde cyanohydrin","benzaldehyde phenylhydrazone","benzaldehyde semicarbazone","benzaldehyde oxime"],1,"C₆H₅CHO + H₂NNHC₆H₅ → C₆H₅CH=NNHC₆H₅ + H₂O.","PhNHNH₂ + PhCHO gives the phenylhydrazone. Name = aldehyde + phenylhydrazone.",0],["When an aldehyde reacts with two moles of an alcohol in the presence of HCl, the product is:",["an ester and water","a hemiketal only","an acetal and water","an ether and water"],2,"Ethanal with two moles of ethanol gives acetaldehyde diethyl acetal. Butanal with two moles of methanol gives butanal dimethyl acetal.","Aldehyde + 2 ROH/HCl = acetal + H₂O. 2 ROH is the key.",0],["Which aldehyde does NOT undergo the Cannizzaro reaction?",["ethanal, because it has alpha-hydrogens","methanal, because it has no alpha-hydrogens","p-nitrobenzaldehyde, because it has no alpha-hydrogens","benzaldehyde, because it has no alpha-hydrogens"],0,"The Cannizzaro reaction needs an aldehyde with no alpha-H. Ethanal has three, so it goes through aldol condensation instead.","Cannizzaro needs NO α-hydrogen. Ethanal has α-H, so it does not.",1],["In the Cannizzaro reaction of methanal with concentrated NaOH, the products are:",["methane and sodium carbonate","methanol and sodium methanoate","ethanol and sodium ethanoate","methanol and methanoic acid"],1,"2HCHO + NaOH → CH₃OH + HCOONa. One molecule is oxidised and one is reduced, which is a disproportionation.","HCHO + conc. NaOH: methanol + sodium methanoate. One oxidised, one reduced.",0],["In aldol condensation of ethanal, what is the product, and what does the name 'aldol' mean?",["2-hydroxybutanal; the name comes from aldehyde + alkane","3-hydroxybutanone; the name comes from aldehyde + ketone","3-hydroxybutanal; the name comes from aldehyde + alcohol","butanal; the name comes from aldehyde + ethanol"],2,"The molecule has an aldehyde group and an alcohol group. It forms when the α-carbon of one ethanal attacks the carbonyl carbon of another.","Aldol = ALDehyde + alcOL: 3-hydroxybutanal. Ethanal + dil. NaOH gives CH₃CH(OH)CH₂CHO.",0],["Which of these cannot undergo self-aldol condensation?",["ethanal, because it has alpha-hydrogens","butanal, because it has alpha-hydrogens","propanone, because it has alpha-hydrogens","benzaldehyde, because it has no alpha-hydrogen"],3,"The aldol reaction needs an alpha-H to form the carbanion.","Benzaldehyde has no α-H, so no self-aldol. Crossed is possible.",1],["Benzaldehyde and propanone react in dilute base, followed by dehydration. The product is:",["cinnamic acid, C₆H₅CH=CHCOOH, from oxidation of the aldehyde","benzophenone, C₆H₅COC₆H₅, from a Friedel–Crafts type reaction","acetophenone, C₆H₅COCH₃, from loss of the aldehyde hydrogen","benzalacetone, C₆H₅CH=CHCOCH₃, from a crossed aldol"],3,"Propanone provides the carbanion. Benzaldehyde has no α-H, so it is only the acceptor.","PhCHO + CH₃COCH₃: crossed aldol → benzalacetone, C₆H₅CH=CHCOCH₃.",0],["What is the Reformatsky reaction?",["an aldehyde reacts with Ag⁺ to give a silver mirror","an α-bromo ester reacts with zinc and an aldehyde or ketone to give a β-hydroxy ester","an aldehyde reacts with hydrazine to give an alkane","an α-bromo ester reacts with magnesium and CO₂ to give an acid"],1,"Acetone with BrCH₂COOEt and Zn gives ethyl 3-hydroxy-3-methylbutanoate.","Reformatsky = α-bromoester + Zn + aldehyde or ketone. Zinc is the key.",0]]},{"t":"Amines","q":[["Amines are related to ammonia in the same way that alcohols are related to:",["hydrogen peroxide","water","carbon dioxide","methane"],1,"Replace one H of H₂O with an alkyl group to get an alcohol. Replace H of NH₃ with an alkyl group to get an amine.","Amines : ammonia = alcohols : water. Replace H with R. Water.",0],["Amines are classified as primary, secondary or tertiary by:",["the number of alkyl or aryl groups attached to the nitrogen atom","the number of alkyl groups on the carbon that has the amino group","the number of carbons in the longest chain","the number of hydrogen atoms in the molecule"],0,"RNH₂ is primary, R₂NH is secondary and R₃N is tertiary.","1°/2°/3° for amines = number of alkyl/aryl groups on N (1, 2, 3). Not on the carbon.",0],["(CH₃)₃C–NH₂ is tert-butylamine. Is it a primary, secondary or tertiary amine?",["quaternary, because it has four carbons","secondary, because it has three methyl groups","tertiary, because the carbon with the amino group has three alkyl groups","primary, because only one alkyl group is attached to the nitrogen"],3,"For amines, the classification is by what is on nitrogen. For alcohols it is by what is on the carbon. That is the difference in the two systems.","Count groups ON the nitrogen: tert-butyl is ONE group, so it is a 1° amine. The 'tert' is about the carbon.",1],["Which of these is a secondary amine?",["(CH₃)₃N","CH₃NH₂","(CH₃)₂NH","(CH₃)₄N⁺"],2,"The nitrogen has two alkyl groups and one hydrogen.","Secondary amine = NH with two R: (CH₃)₂NH. One H left on N.",0],["What is the IUPAC name of CH₃CH₂CH(NH₂)CH₃?",["1-aminobutane","sec-butyl alcohol","2-aminobutane (butan-2-amine)","2-methylpropylamine"],2,"The amino group is on carbon 2 of a four-carbon chain.","4-carbon chain, NH₂ on C2: butan-2-amine (2-aminobutane). Longest chain, lowest number.",0],["What is the common name of (CH₃)₂CHNH₂?",["isopropylamine","dimethylamine","tert-butylamine","propylamine"],0,"The isopropyl group is on the NH₂. Its IUPAC name is 2-aminopropane.","(CH₃)₂CH– = isopropyl + amine = isopropylamine. Same groups as in alcohols.",0],["In naming secondary and tertiary amines in IUPAC, the longest alkyl chain is the parent. The other groups are named as:",["a suffix, as in 2-methylpentane-4-diethylamine","a separate word, as in diethyl 2-methylpentane","a Greek letter prefix, as in alpha-diethylpentane","a compound prefix, as in 4-(diethylamino)-2-methylpentane"],3,"The nitrogen with its extra alkyl groups is treated as an alkylamino or dialkylamino prefix.","Extra groups on N in IUPAC become a compound prefix: (diethylamino). Name them as one prefix.",0],["What does the italic capital N mean in the name N-ethyl-N-methylpropylamine?",["the compound is a nitro compound","the ethyl and methyl groups are attached to the nitrogen atom","the compound contains two nitrogen atoms","the ethyl and methyl groups are attached to the first carbon"],1,"N shows the substituent is on nitrogen, not on a carbon.","Italic N = the group is on nitrogen, not on a carbon. N- means 'on the nitrogen'.",0],["What is the name of C₆H₅–N(CH₃)₂?",["N-methylaniline","N,N-dimethylaniline","dimethylbenzene","2,2-dimethylaniline"],1,"Two methyl groups on the nitrogen of aniline. N-methylaniline has only one.","Two CH₃ on N, phenyl parent: N,N-dimethylaniline. Both methyls on N get N,N.",0],["Which of these is the amine with the formula C₆H₅NH₂?",["benzylamine, which has a CH₂ group before the NH₂","cyclohexylamine, which has a saturated six-membered ring","aniline, also called phenylamine","toluidine, which has a methyl group on the ring"],2,"Toluidine has a methyl on the ring. Benzylamine is C₆H₅CH₂NH₂.","C₆H₅NH₂ = aniline = phenylamine. Amine directly on the ring.",0],["Benzylamine and aniline differ in that:",["benzylamine has CH₂ between the ring and NH₂, while aniline has NH₂ directly on the ring","benzylamine has two NH₂ groups, while aniline has only one NH₂ group","benzylamine has NH₂ on the ring, while aniline has CH₂ between the ring and NH₂","they are the same compound, since both contain a benzene ring and one NH₂ group"],0,"C₆H₅CH₂NH₂ behaves like an aliphatic amine, so it is a much stronger base. Aniline's lone pair is delocalised into the ring.","Benzylamine = C₆H₅CH₂NH₂ (CH₂ between ring and N). Aniline = N attached straight to the ring.",1],["At room temperature, methylamine and ethylamine are:",["solids that are insoluble in water, with no smell","liquids that are insoluble in water, with a sweet smell","gases that are insoluble in water, with a fruity smell","gases that are soluble in water, with an ammonia-like smell"],3,"Higher members are liquids or solids with a fishy odour.","Methylamine and ethylamine = gases, water-soluble, smell like ammonia. Small amines are gases.",0],["Which amine has the highest boiling point among isomers of the same molecular mass?",["a tertiary amine","all are the same","a primary amine","a secondary amine"],2,"Primary amines have two N–H bonds, so they form the most hydrogen bonds. The order is 1° > 2° > 3°.","Boiling point: primary > secondary > tertiary (more N–H, more H-bonding).",0],["Tertiary amines have the lowest boiling point of the three classes because:",["they are ionic compounds","they have N–H bonds that are too weak","they have the lowest molecular mass of the three","they have no N–H bond and cannot form hydrogen bonds with each other"],3,"They can still accept H-bonds from water, so they dissolve in it. But there is no H on N to donate.","Tertiary amines have no N–H, so they cannot H-bond to each other. Lowest bp.",1],["Aromatic amines compared with aliphatic amines are:",["less soluble in water","insoluble in water but soluble in alkali","more soluble in water","equally soluble in water"],0,"The large aromatic ring is nonpolar and also reduces the availability of the lone pair for hydrogen bonding.","Aromatic amines: bigger non-polar ring, so less soluble in water.",0],["Hofmann's method of preparing amines is:",["reduction of a nitro compound with Fe/HCl","ammonolysis of an alkyl halide, in which NH₃ acts as a nucleophile","degradation of an amide with Br₂/NaOH","alkylation of an acid chloride"],1,"RX + NH₃ → RNH₃⁺X⁻, then NH₃ frees the amine as RNH₂ plus NH₄X.","Hofmann ammonolysis: NH₃ attacks the alkyl halide (NH₃ is the nucleophile). Mixture of amines.",0],["Why is ammonolysis of an alkyl halide not a good method to prepare a pure primary amine?",["the product is always a quaternary salt, since ammonia is alkylated four times before any amine is released","the reaction gives only tertiary amines, since the primary and secondary products are removed as gases","the reaction does not occur at all, because ammonia is too weak a nucleophile to attack an alkyl halide at carbon","the product reacts further with the halide, giving a mixture of primary, secondary and tertiary amines that is hard to separate"],3,"The amine formed is itself a nucleophile and competes with ammonia for the alkyl halide. A large excess of NH₃ reduces this problem.","Product amine is a better nucleophile, so it attacks more halide. Mixture of 1°, 2°, 3° and quaternary. Pick 'reacts further'.",1],["Which alkyl halide reacts the fastest in ammonolysis?",["alkyl iodide, since I⁻ is the best leaving group","alkyl bromide, since Br⁻ is the best leaving group","alkyl fluoride, since F⁻ is the best leaving group","alkyl chloride, since Cl⁻ is the best leaving group"],0,"The order is RI > RBr > RCl. The book says SN1, but primary halides go through SN2.","RI > RBr > RCl. Iodide leaves easiest. Bigger halide = faster.",0],["Ammonolysis of an alcoh
