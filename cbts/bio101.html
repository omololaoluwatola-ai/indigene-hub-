ions."}, {"tier": "hot", "topic": "Reproduction", "q": "Why is it inaccurate to assume that all hermaphroditic (bisexual) plants can self-fertilize?", "correct": "Because a bisexual individual, while producing both male and female gametes, is not necessarily capable of fertilizing its own eggs", "wrongs": ["Because hermaphroditic plants never produce viable gametes", "Because hermaphroditic plants are always sterile", "Because self-fertilization is biologically impossible in all organisms"], "exp": "Individual plants may be bisexual (hermaphroditic), in which male and female gametes are produced by the same organism. A bisexual individual, however, is not necessarily capable of fertilizing its own eggs.", "hack": "Being hermaphroditic (having both sexes' organs) \u2260 automatically self-fertile \u2014 a subtle but important distinction the manual explicitly flags."}, {"tier": "hot", "topic": "Reproduction", "q": "Which of the following correctly distinguishes isogamous from heterogamous (oogamous) gamete unions?", "correct": "Isogamous gametes are morphologically indistinguishable; heterogamous gametes differ by size, with a larger non-motile egg and a smaller motile sperm", "wrongs": ["Isogamous gametes differ by size; heterogamous gametes are identical in appearance", "Both terms describe asexual reproduction", "Isogamous gametes are always found only in animals"], "exp": "In their union, gametes may be morphologically indistinguishable (isogamous) or they may be distinguishable only on the criterion of size (heterogamous). The larger gamete, or egg, is nonmotile; the smaller gamete, or sperm, is motile.", "hack": "Iso=same size/shape; Hetero(oogamous)=different size, with egg (big, still) and sperm (small, mobile)."}, {"tier": "hot", "topic": "Reproduction", "q": "Comparing bryophytes/vascular cryptogams to seed plants, which statement about gametophyte development is correct?", "correct": "In vascular cryptogams, gametophytes mature after spores are shed and are free-living; in seed plants, gametophytes mature as parasites on the sporophyte", "wrongs": ["In both groups, gametophytes are always free-living", "In both groups, gametophytes are always parasitic on the sporophyte", "Seed plants have no gametophyte generation at all"], "exp": "The gametophytes of the vascular cryptogams mature after the spores that initiated them have been shed from the parent plant, so the gametophytes are free-living. In the seed plants, the gametophytes mature as parasites on the sporophytes.", "hack": "Free-living gametophyte = ferns/cryptogams. Parasitic (reduced, dependent) gametophyte = seed plants (gymnosperms/angiosperms) \u2014 a major evolutionary trend toward sporophyte dominance."}, {"tier": "hot", "topic": "Reproduction", "q": "Which of these is a listed difference between gymnosperms and angiosperms, aside from seed position?", "correct": "Angiosperms complete their reproductive cycle more quickly and have smaller, simpler gametophytes lacking archegonia, unlike most gymnosperms", "wrongs": ["Gymnosperms involve two sperm cells (double fertilization); angiosperms involve only one", "Angiosperms transfer pollen directly to the ovule's micropyle, just like gymnosperms", "Gymnosperm ovules increase to mature seed size after fertilization, just like angiosperms"], "exp": "Differences: (1) angiosperm reproductive cycle completes faster with smaller/simpler gametophytes lacking archegonia (unlike most gymnosperms); (2) pollen is transferred to the megasporophyll surface in angiosperms vs to the ovule's micropyle directly in gymnosperms; (3) angiosperms use TWO sperm cells (double fertilization) vs gymnosperm single fertilization; (4) angiosperm ovule enlarges to mature seed size AFTER fertilization, while in gymnosperms this enlargement occurs BEFORE fertilization.", "hack": "6 listed Gymnosperm vs Angiosperm differences \u2014 HOT-tier questions may test any ONE of these six in isolation."}, {"tier": "hot", "topic": "Reproduction", "q": "Why does external fertilization (as in frogs and fish) typically occur in water?", "correct": "Because sperm need to swim to reach the eggs, and a watery environment supports this movement and protects the delicate, shell-less eggs", "wrongs": ["Because water increases the sperm count directly", "Because external fertilization is illegal on land", "Because eggs laid externally always need a hard shell like a hen's egg"], "exp": "In animals that undergo external fertilization, fertilization takes place in water; the female lays eggs (delicate, not covered by shell, held together by a jelly layer), and the male deposits sperm over them \u2014 each sperm swims randomly in water with the help of its long tail to reach the eggs.", "hack": "External fertilization needs a WATER medium because sperm literally swim to the egg \u2014 no water, no successful fertilization for these species."}, {"tier": "hot", "topic": "Reproduction", "q": "How does an Ovoviviparous animal differ from a true Viviparous animal in terms of nourishment, despite both giving live birth?", "correct": "Ovoviviparous young are nourished by egg yolk with no placental connection; true viviparous young are nourished via a placental connection to the mother", "wrongs": ["Ovoviviparous young are nourished by a placenta, exactly like viviparous animals", "True viviparous animals lay eggs externally, unlike ovoviviparous animals", "There is no nourishment difference between the two"], "exp": "Ovoviviparous animals are similar to viviparous species in that there is internal fertilization and the young are born live, but differ in that there is no placental connection and the unborn young are nourished by egg yolk.", "hack": "Both give LIVE birth, but the nourishment source differs: Ovoviviparous=yolk (no placenta); Viviparous=placenta."}, {"tier": "hot", "topic": "Reproduction", "q": "In Amoeba's binary fission, what is the correct SEQUENCE of events?", "correct": "The nucleus divides into two nuclei first, then the body divides into two, with each part receiving one nucleus", "wrongs": ["The body divides first, then the nucleus divides afterward", "Both the nucleus and body divide simultaneously with no set order", "The cell forms a bud that later separates"], "exp": "Amoeba begins the process of reproduction by the division of its nucleus into two nuclei. This is followed by division of its body into two, each part receiving a nucleus. Finally, two amoebae are produced from one parent amoeba.", "hack": "Sequence matters: Nucleus divides FIRST \u2192 Body divides SECOND \u2014 a subtle ordering fact examiners like to test."}, {"tier": "hot", "topic": "Interrelationship", "q": "Compare Mutualism and Commensalism in terms of the effect on BOTH participating organisms.", "correct": "In Mutualism, BOTH organisms benefit; in Commensalism, ONE organism benefits while the other is neither harmed nor helped", "wrongs": ["In Mutualism, one organism is harmed; in Commensalism, both organisms benefit", "Both relationships always harm at least one organism", "There is no meaningful difference between the two"], "exp": "Mutualism = both organisms benefit from the association (e.g. clownfish-anemone). Commensalism = one organism benefits, the other is neither harmed nor helped (e.g. orchids on tree bark, barnacles on whales).", "hack": "Mutualism = Win-Win. Commensalism = Win-Neutral. Parasitism = Win-Lose. Keep this three-way spectrum straight."}, {"tier": "hot", "topic": "Interrelationship", "q": "How does the termite-gut-microorganism relationship illustrate the concept of 'obligate mutualism' specifically?", "correct": "Because at least one of the two species (the termite) has lost the ability to survive without its microbial partner digesting cellulose for it", "wrongs": ["Because both species can easily survive alone if separated", "Because the microorganisms harm the termite over time", "Because it is actually an example of parasitism, not mutualism"], "exp": "The interaction between termites and the microorganisms in their digestive system is an example of obligate mutualism, in which at least one species has lost the ability to survive without its partner (unlike facultative mutualism, where both species can survive alone).", "hack": "Obligate mutualism ties DIRECTLY to survival dependency, not just cooperation \u2014 the key differentiator from facultative mutualism."}, {"tier": "hot", "topic": "Interrelationship", "q": "Why are ticks (ectoparasites) able to significantly affect the survival of a moose population according to the manual?", "correct": "Because they weaken hosts by withdrawing blood and causing hair breakage/loss, increasing the moose's chance of dying from cold stress or predation by wolves", "wrongs": ["Because ticks directly kill moose through venom", "Because ticks compete with moose for the same food source", "Because ticks are actually mutualistic partners of the moose"], "exp": "Parasites can significantly affect the survival, reproduction and density of their host populations. For example, ticks that live as ectoparasites on moose weaken their hosts by withdrawing blood and causing hair breakage and loss, increasing the chance that the moose will die from cold stress or predation by wolves.", "hack": "This tick-moose example shows an INDIRECT parasitic effect (weakening \u2192 increased vulnerability to cold/predators), not a direct kill \u2014 a HOT-adjacent nuance worth flagging even at medium tier."}, {"tier": "hot", "topic": "Interrelationship", "q": "How are mutualistic relationships sometimes linked to the evolution of related adaptations in both species involved?", "correct": "Changes in either species likely affect the survival/reproduction of the other; e.g. flowering plants evolve nectar/fruit to attract animals, while animals evolve adaptations to find/consume that nectar", "wrongs": ["Mutualistic species never evolve any adaptations related to each other", "Only the plant species evolves in a plant-animal mutualism, never the animal", "Mutualistic relationships always eventually turn into predation"], "exp": "Mutualistic relationship sometimes involve the evolution of related adaptations in both species, with changes in either species likely to affect the survival and reproduction of the other. For example, most flowering plants have adaptations such as nectar or fruit that attract animals which function in pollination or seed dispersal; in turn, many animals have adaptations that help them find and consume nectar.", "hack": "This is co-evolution: TWO species evolving together, each shaping the other's traits over time \u2014 nectar-producing plants and nectar-seeking pollinators."}, {"tier": "hot", "topic": "Heredity", "q": "Why does the sex of a human offspring depend on the FATHER's contribution rather than the mother's?", "correct": "Because the mother (homogametic) always contributes an X chromosome, while the father (heterogametic) contributes either an X or Y chromosome, which determines the child's sex", "wrongs": ["Because the mother always contributes a Y chromosome", "Because both parents contribute identical X chromosomes always", "Because the father's autosomes determine sex, not his sex chromosomes"], "exp": "Female is homogametic, producing only ova each containing one X-chromosome. Male is heterogametic, producing two types of sperm, half carrying X and other half Y. Since the mother always gives X, the father's X-or-Y sperm determines whether the child is XX (girl) or XY (boy).", "hack": "HOT-adjacent reasoning: the VARIABLE parent (heterogametic father) is what determines sex, since the CONSTANT parent (homogametic mother) always gives the same X."}, {"tier": "hot", "topic": "Heredity", "q": "In a monohybrid cross of Ss \u00d7 Ss, why does the phenotypic ratio (3:1) differ from the genotypic ratio (1:2:1)?", "correct": "Because the heterozygous genotype (Ss) displays the same phenotype as the homozygous dominant genotype (SS), merging two genotype categories into one phenotype category", "wrongs": ["Because phenotype and genotype are always identical concepts", "Because the recessive allele disappears completely in F2", "Because only genotype ratios apply to monohybrid crosses"], "exp": "In F2, three genotypes are produced in 1:2:1 ratio (1/4 SS : 1/2 Ss : 1/4 ss), but because S is dominant, the heterozygote (Ss) has the smooth phenotype just like SS \u2014 so the 1 SS + 2 Ss genotype groups collapse into one 'smooth' phenotype group, giving a 3:1 phenotypic ratio.", "hack": "The dominant allele MASKS the recessive one in Ss, converting a 1:2:1 genotype split into a simpler 3:1 phenotype split \u2014 this masking effect is the crux of Mendelian dominance."}, {"tier": "hot", "topic": "Heredity", "q": "Which of Mendel's three laws specifically explains why a Dihybrid cross of YyRr \u00d7 YyRr produces a 9:3:3:1 phenotypic ratio, rather than the 3:1 ratio of a monohybrid cross?", "correct": "The Law of Independent Assortment", "wrongs": ["The Law of Dominance", "The Law of Segregation", "None of Mendel's laws explain dihybrid ratios"], "exp": "The Law of Independent Assortment states that each pair of alleles segregates independently of each other pair of alleles during gamete formation \u2014 this independent behaviour of TWO gene pairs (not just one) is what produces the characteristic 9:3:3:1 dihybrid ratio, distinct from the 3:1 monohybrid ratio explained by Segregation alone.", "hack": "Segregation Law \u2192 monohybrid 3:1. Independent Assortment Law \u2192 dihybrid 9:3:3:1 \u2014 match the LAW to the CROSS TYPE it explains."}, {"tier": "hot", "topic": "Heredity", "q": "A Test Cross is specifically used to determine an unknown genotype by crossing it with a homozygous recessive individual. Why is a homozygous recessive individual, rather than a homozygous dominant one, used for this purpose?", "correct": "Because a homozygous recessive individual contributes only recessive alleles, so the offspring's phenotypes directly reveal whether the unknown parent was homozygous dominant (all offspring show dominant phenotype) or heterozygous (offspring show a 1:1 dominant:recessive ratio)", "wrongs": ["Because homozygous dominant individuals cannot produce any offspring", "Because homozygous recessive individuals are always sterile", "Because using a homozygous dominant individual would give identical results"], "exp": "In a Test Cross, an individual with unknown genotype is crossed with a homozygous recessive individual specifically so that the recessive parent's contribution can't mask anything \u2014 any dominant phenotype appearing in offspring must have come from the unknown parent, revealing its genotype through the resulting ratio.", "hack": "HOT-adjacent logic: using a recessive homozygote as the 'known' partner in a Test Cross ensures NO masking on that side, so offspring ratios cleanly reveal the unknown parent's genotype."}, {"tier": "hot", "topic": "Evolution", "q": "Explain how homologous organs (like the forelimbs of a frog, bird, and man) provide evidence for evolution, despite performing very different functions.", "correct": "Because all these forelimbs share the same basic underlying structural design, indicating they evolved from a common ancestral animal that had that basic limb design, even though each species later adapted the limb for a different function", "wrongs": ["Because they all perform identical functions in every species", "Because they have no structural similarity at all, only functional similarity", "Because they are found only in a single species"], "exp": "The presence of homologous forelimbs in a frog, a bird and a man indicates that all these forelimbs have evolved from a common ancestral animal which had a basic design limb. The presence of homologous organs in different animals provides evidence for evolution by telling us that they are derived from the same ancestor who had the 'basic design' of the organ.", "hack": "Homologous organs prove COMMON ANCESTRY, not similar function \u2014 structure matters more than current use in this line of evidence."}, {"tier": "hot", "topic": "Evolution", "q": "Why do analogous organs (e.g. insect wings vs bird wings) NOT indicate a common ancestor, unlike homologous organs?", "correct": "Because analogous organs have different basic structures/designs despite performing similar functions, showing they evolved independently to solve a similar survival problem rather than from a shared ancestor", "wrongs": ["Because analogous organs always have identical basic structures", "Because analogous organs never perform any useful function", "Because analogous organs are found only in extinct species"], "exp": "Analogous organs have different basic structure (or different basic design) but have similar appearance and perform similar functions. The presence of analogous organs indicates that even organisms having organs with different structures perform similar functions for their survival under hostile environmental conditions \u2014 they can independently evolve to perform similar functions without deriving from common ancestors.", "hack": "Homologous = same STRUCTURE (proves shared ancestry). Analogous = same FUNCTION only, different structure (proves independent/convergent evolution, NOT shared ancestry) \u2014 a critical exam distinction."}, {"tier": "hot", "topic": "Evolution", "q": "How does the still-functional appendix in cows/buffalo, compared to the vestigial (non-functional) appendix in humans, support the theory of evolution?", "correct": "It suggests humans evolved from ancestors that had a functional appendix (like modern herbivorous ruminants), which became vestigial over time as human diet/digestion needs changed", "wrongs": ["It proves humans and cows are the exact same species", "It shows the appendix has never had any function in any animal", "It disproves evolution since the appendix differs between species"], "exp": "Though the appendix is a s within a population, while Lamarck proposed that traits ACQUIRED during an individual's lifetime (through use/disuse) are inherited by offspring", "wrongs": ["Darwin and Lamarck proposed identical mechanisms with no meaningful difference", "Darwin believed in inheritance of acquired characteristics; Lamarck believed in natural selection", "Neither Darwin nor Lamarck proposed any mechanism, only observed patterns"], "exp": "Darwin's theory centres on variations that already exist within a population being selected for by nature (natural selection). Lamarck's hypothesis is based on the use and disuse of parts and the inheritance of ACQUIRED characteristics (traits developed during an individual's lifetime, like a stretched giraffe neck, being passed on) \u2014 a mechanism now known to be incorrect for genetic inheritance.", "hack": "Darwin = selection acts on PRE-EXISTING variation. Lamarck = traits ACQUIRED during a lifetime get inherited \u2014 the manual confirms Lamarck's mechanism (acquired-trait inheritance) is NOT correct, though his point about environment shaping phenotype was valid."}, {"tier": "hot", "topic": "Ecology", "q": "Comparing the abiotic and biotic components of an ecosystem, which of the following is correctly categorized?", "correct": "Light, temperature, wind, and soil are abiotic; green plants (autotrophs) and animals feeding on them (heterotrophs) are biotic", "wrongs": ["Light and temperature are biotic; green plants and animals are abiotic", "All living and non-living factors are classified only as biotic", "Soil is biotic while green plants are abiotic"], "exp": "Ecosystem consists of: (a) Abiotic component (non-living phenomena) including climatic factors of light, temperature, precipitation, wind, topography, and soil (edaphic); (b) Biotic component including all living organisms, grouped into Autotrophic (green plants) and Heterotrophic (non-green plants and animals that feed on autotrophs).", "hack": "Abiotic = non-living (light, temp, wind, soil). Biotic = living, itself split into Autotrophic (producers) and Heterotrophic (consumers)."}, {"tier": "hot", "topic": "Ecology", "q": "Why is energy flow in an ecosystem described as moving in a 'single direction,' unlike nutrients, which cycle?", "correct": "Because energy is progressively lost as heat at every trophic transfer (per the second law of thermodynamics), leaving no free energy to recycle at the end of the chain, whereas matter/nutrients are conserved and can be reused", "wrongs": ["Because nutrients disappear entirely after one use, unlike energy", "Because energy and nutrients behave identically in ecosystems", "Because energy only flows in ecosystems that lack decomposers"], "exp": "As energy in a food chain is passed along, its useful capacity for work is diminished in accordance with the second law of thermodynamics; heat is given off with every transformation, so at the end of the food chain little/no free energy is left and recycling is not possible. Matter, however, is not lost \u2014 its passage along the food chain can be described as a cycle (e.g. carbon, nitrogen, sulphur cycles).", "hack": "This ENERGY (one-way, lost as heat) vs NUTRIENTS (cyclical, conserved) contrast is one of the most testable conceptual pairs in the whole Ecology chapter."}, {"tier": "hot", "topic": "Ecology", "q": "Which of the three ecological pyramids (Energy, Biomass, Numbers) is the ONLY one that can sometimes appear 'inverted' or 'lumpy' rather than always upright, according to the manual?", "correct": "Numbers pyramid", "wrongs": ["Energy pyramid", "Biomass pyramid", "All three pyramids are always upright with no exceptions"], "exp": "Numbers pyramids show how many individual organisms there are in each trophic level. They can be upright, inverted, or kind of lumpy, depending on the ecosystem \u2014 unlike energy pyramids (which typically show a steadily decreasing rate of energy flow up trophic levels).", "hack": "Numbers pyramids are shape-flexible (e.g. can invert if a single tree/producer supports many insects/parasites) \u2014 the manual highlights this variability specifically for the Numbers pyramid."}, {"tier": "hot", "topic": "Ecology", "q": "How does the equation for logistic growth, dN/dt = rN[(K-N)/K], differ functionally from the exponential growth equation, dN/dt = rN?", "correct": "The logistic equation includes the factor (K-N)/K, which approaches zero as population size N nears the carrying capacity K, slowing growth and producing an S-shaped curve \u2014 the exponential equation has no such limiting factor and produces unlimited, ever-accelerating growth", "wrongs": ["The two equations are mathematically identical with no functional difference", "The exponential equation includes a carrying capacity term while the logistic equation does not", "The logistic equation only applies to plant populations, never animal populations"], "exp": "The exponential growth equation dN/dt = rN has no limiting term, producing unlimited theoretical growth. The logistic equation dN/dt = rN[(K-N)/K] modifies growth rate by the factor (K-N)/K, which shrinks toward zero as N approaches K (carrying capacity), producing the characteristic S-shaped logistic growth curve that levels off, unlike the unbounded exponential curve.", "hack": "The KEY mathematical difference: the (K-N)/K term is what turns an unlimited exponential curve into a realistic, capped logistic curve."}, {"tier": "hot", "topic": "Classification", "q": "Phylum Annelida has which type of circulatory system?", "correct": "Closed circulatory system", "wrongs": ["Open circulatory system", "No circulatory system", "Circulatory system via diffusion only"], "exp": "Annelids have a closed Circulatory system (blood flows through defined vessels), unlike Arthropods and Molluscs which have open systems.", "hack": "Annelida = CLOSED circulatory system \u2014 the exception among the invertebrate worm/arthropod/mollusc phyla covered, which mostly have OPEN syste ion", "wrongs": ["Somatic Variation and Genotypic Variation", "Dominant and Recessive Variation", "Male and Female Variation"], "exp": "Based on the degree of differences, variation is classified into two types: Continuous Variation and Discontinuous Variation.", "hack": "Degree of difference: Continuous (no limit, fluctuating) vs Discontinuous (distinct groups)."}, {"tier": "hot", "topic": "Heredity", "q": "Variations caused by environmental factors such as climate, food supply and activity of other organisms, generally NOT transmitted to future generations, are called:", "correct": "Somatic Variation", "wrongs": ["Genotypic Variation", "Discontinuous Variation", "Sexual Variation"], "exp": "Somatic Variation: variations caused by environmental factors such as climate, food supply and activity of other organism; these are not due to differences in gene/chromosomes and in general are not transmitted to future generations. Hence they are not significant in the process of evolution.", "hack": "Somatic Variation = environment-caused, NOT heritable, NOT evolutionarily significant."}];

let currentTier = 'drill';
let quizQuestions = [];
let currentIndex = 0;
let score = 0;
let wrongLog = [];
let answered = false;

function fisherYates(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function selectTier(t){
  currentTier = t;
  document.querySelectorAll('.tierbtn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.tierbtn[data-tier="${t}"]`).classList.add('active');
}

function buildQuizSet(){
  let pool;
  if(currentTier==='all'){ pool = ALL_Q; }
  else { pool = ALL_Q.filter(q=>q.tier===currentTier); }
  pool = fisherYates(pool);
  return pool.map(q=>{
    const opts = fisherYates([q.correct, ...q.wrongs]);
    return {
      tier:q.tier, topic:q.topic, question:q.q,
      options:opts, correct:q.correct,
      exp:q.exp, hack:q.hack
    };
  });
}

function startQuiz(){
  quizQuestions = buildQuizSet();
  currentIndex = 0; score = 0; wrongLog = [];
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('reviewScreen').classList.add('hidden');
  document.getElementById('liveTotal').textContent = quizQuestions.length;
  document.getElementById('qOfLabel').textContent = 'of ' + quizQuestions.length;
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const q = quizQuestions[currentIndex];
  document.getElementById('qNumLabel').textContent = 'Q ' + (currentIndex+1);
  document.getElementById('pbarFill').style.width = ((currentIndex)/quizQuestions.length*100)+'%';
  document.getElementById('liveScore').textContent = score;
  document.getElementById('tierLabel').textContent = (currentTier==='all'?'MIXED':currentTier.toUpperCase());
  document.getElementById('qTierTag').textContent = q.tier.toUpperCase();
  document.getElementById('qTierTag').className = 'qtier ' + q.tier;
  document.getElementById('qText').textContent = q.question;

  const wrap = document.getElementById('optsWrap');
  wrap.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<b>'+letters[i]+'.</b> '+opt;
    btn.onclick = ()=>selectAnswer(opt, btn);
    wrap.appendChild(btn);
  });

  document.getElementById('fbBox').classList.remove('show','right','wrong');
  document.getElementById('nextBtn').style.display = 'none';
}

function selectAnswer(chosen, btnEl){
  if(answered) return;
  answered = true;
  const q = quizQuestions[currentIndex];
  const correct = chosen === q.correct;
  const allBtns = document.querySelectorAll('.opt');
  allBtns.forEach(b=>{
    b.classList.add('disabled');
    const label = b.textContent.replace(/^[A-D]\.\s*/, '');
    if(label === q.correct) b.classList.add('correct');
  });
  if(!correct){
    btnEl.classList.add('wrong');
    wrongLog.push({question:q.question, correct:q.correct, chosen:chosen, exp:q.exp, hack:q.hack});
  } else {
    score++;
  }
  document.getElementById('liveScore').textContent = score;

  const fb = document.getElementById('fbBox');
  fb.classList.add('show', correct?'right':'wrong');
  document.getElementById('fbLabel').className = 'fb-label ' + (correct?'right':'wrong');
  document.getElementById('fbLabel').textContent = correct ? '✅ CORRECT' : '❌ INCORRECT — Correct answer: ' + q.correct;
  document.getElementById('fbExp').textContent = q.exp;
  document.getElementById('fbHack').textContent = q.hack;

  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion(){
  currentIndex++;
  if(currentIndex >= quizQuestions.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalNum').textContent = score + '/' + quizQuestions.length;
  const pct = Math.round((score/quizQuestions.length)*100);
  document.getElementById('finalPct').textContent = pct + '%';
}

function showReview(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('reviewScreen').classList.remove('hidden');
  const list = document.getElementById('reviewList');
  if(wrongLog.length===0){
    list.innerHTML = '<p style="color:var(--good);text-align:center;">🔥 Perfect score — no wrong answers!</p>';
    return;
  }
  list.innerHTML = wrongLog.map(w=>`
    <div class="reviewitem">
      <div class="riq">${w.question}</div>
      <div class="riwrong">Your answer: ${w.chosen}</div>
      <div class="ricorrect">Correct: ${w.correct}</div>
      <div class="exp" style="margin-top:6px;">${w.exp}</div>
      <div class="hackbox" style="margin-top:6px;"><div class="hacklabel">🔥 EXAM HACK</div><div class="hacktext">${w.hack}</div></div>
    </div>
  `).join('');
}

function restart(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('reviewScreen').classList.add('hidden');
  document.getElementById('setupScreen').classList.remove('hidden');
}
</script>
