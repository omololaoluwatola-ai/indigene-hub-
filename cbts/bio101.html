<style>
:root{
  --bg:#0a0604; --bg2:#150c08; --panel:#1c120c;
  --ember:#ff6a1a; --ember2:#ff9540; --gold:#ffb347; --deepred:#c8390d;
  --text:#f4e9df; --muted:#c9b7a8; --good:#3ecf6e; --bad:#ff4d4d;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:
    radial-gradient(circle at 20% -10%, rgba(255,106,26,.18), transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(255,150,60,.10), transparent 40%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text); font-family:'Exo 2',sans-serif; padding:16px;
}
h1,h2,.brand{font-family:'Orbitron',sans-serif;}
.wrap{max-width:720px;margin:0 auto;}
.brand{
  text-align:center; font-weight:900; letter-spacing:2px; font-size:1.5rem;
  background:linear-gradient(90deg,var(--gold),var(--ember),var(--deepred));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 30px rgba(255,106,26,.35); margin:4px 0 2px;
}
.subbrand{text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:1px;margin-bottom:14px;}
.card{
  background:linear-gradient(160deg,var(--panel),#120b07);
  border:1px solid rgba(255,150,60,.25); border-radius:16px;
  padding:18px; margin-bottom:16px; box-shadow:0 8px 30px rgba(0,0,0,.45);
}
.tierbar{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.tierbtn{
  flex:1; min-width:90px; padding:10px 6px; border-radius:10px; border:1px solid rgba(255,150,60,.3);
  background:#1a1008; color:var(--text); font-family:'Exo 2'; font-weight:600; cursor:pointer;
  text-align:center; font-size:.85rem;
}
.tierbtn b{display:block;font-family:'Orbitron';font-size:1rem;color:var(--ember2);}
.tierbtn.active{background:linear-gradient(135deg,var(--ember),var(--deepred));border-color:var(--gold);color:#fff;}
.tierbtn.active b{color:#fff;}
.startbtn,.navbtn,.optbtn{
  width:100%; padding:14px; border-radius:12px; border:none; cursor:pointer;
  font-family:'Exo 2'; font-weight:600; font-size:1rem; margin-top:8px;
}
.startbtn{background:linear-gradient(135deg,var(--ember),var(--deepred)); color:#fff; box-shadow:0 6px 18px rgba(255,106,26,.35);}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-bottom:8px;}
.pbar{height:6px;border-radius:6px;background:#2a1a10;overflow:hidden;margin-bottom:14px;}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--ember));transition:width .3s;}
.qtier{display:inline-block;font-size:.7rem;padding:3px 10px;border-radius:20px;margin-bottom:8px;font-weight:700;letter-spacing:1px;}
.qtier.drill{background:#254a2c;color:#8fe3a4;}
.qtier.medium{background:#4a3a15;color:#ffce6b;}
.qtier.hot{background:#4a1515;color:#ff8f8f;}
.qtext{font-size:1.05rem;line-height:1.5;margin-bottom:14px;color:var(--text);}
.opt{
  display:block;width:100%;text-align:left;background:#170e08;border:1px solid rgba(255,150,60,.25);
  color:var(--text);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font-size:.95rem;
  font-family:'Exo 2';line-height:1.4;
}
.opt:active{transform:scale(.98);}
.opt.correct{background:rgba(62,207,110,.18);border-color:var(--good);}
.opt.wrong{background:rgba(255,77,77,.18);border-color:var(--bad);}
.opt.disabled{pointer-events:none;opacity:.75;}
.feedback{border-radius:12px;padding:14px;margin-top:6px;display:none;}
.feedback.show{display:block;}
.feedback.right{background:rgba(62,207,110,.10);border:1px solid rgba(62,207,110,.4);}
.feedback.wrong{background:rgba(255,77,77,.10);border:1px solid rgba(255,77,77,.4);}
.fb-label{font-weight:700;font-family:'Orbitron';font-size:.85rem;margin-bottom:6px;}
.fb-label.right{color:var(--good);}
.fb-label.wrong{color:var(--bad);}
.exp{color:var(--text);font-size:.9rem;line-height:1.5;margin-bottom:10px;}
.hackbox{background:linear-gradient(135deg,rgba(255,106,26,.15),rgba(200,57,13,.1));border:1px dashed var(--ember);border-radius:10px;padding:10px 12px;}
.hacklabel{font-family:'Orbitron';font-weight:700;font-size:.75rem;color:var(--gold);letter-spacing:1px;margin-bottom:4px;}
.hacktext{font-size:.87rem;color:var(--text);line-height:1.4;}
.scorepill{
  display:flex;justify-content:space-between;background:#170e08;border-radius:10px;padding:10px 14px;
  margin-bottom:14px;font-size:.85rem;color:var(--muted);
}
.scorepill b{color:var(--gold);}
.finalscore{text-align:center;padding:24px 10px;}
.finalscore .num{font-family:'Orbitron';font-size:3rem;font-weight:900;color:var(--gold);text-shadow:0 0 25px rgba(255,179,71,.5);}
.finalscore .pct{color:var(--ember2);font-size:1.1rem;margin-bottom:16px;}
.reviewbtn{background:#1a1008;color:var(--ember2);border:1px solid var(--ember);}
.restartbtn{background:linear-gradient(135deg,var(--ember),var(--deepred));color:#fff;}
.reviewitem{border-bottom:1px solid rgba(255,150,60,.15);padding:12px 0;}
.reviewitem:last-child{border-bottom:none;}
.riq{font-weight:600;margin-bottom:6px;}
.ricorrect{color:var(--good);font-size:.85rem;}
.riwrong{color:var(--bad);font-size:.85rem;}
.hidden{display:none;}
.footer-note{text-align:center;color:var(--muted);font-size:.72rem;margin-top:16px;opacity:.7;}
</style>
</head>

<div class="wrap">
  <div class="brand">INDIGENE</div>

  <div id="setupScreen" class="card">

  <div id="resultScreen" class="hidden">

      <div style="font-family:'Orbitron';color:var(--muted);font-size:.9rem;letter-spacing:2px;">SESSION COMPLETE</div>

      <div class="pct" id="finalPct">0%</div>
      <button class="navbtn reviewbtn" onclick="showReview()">REVIEW WRONG ANSWERS</button>
      <button class="navbtn restartbtn" onclick="restart()">RESTART / CHOOSE STAGE</button>
    </div>
  </div>

  <div id="reviewScreen" class="hidden">
    <div class="card">
      <h2 style="margin-top:0;font-size:1rem;color:var(--ember2);">Wrong Answer Review</h2>
      <div id="reviewList"></div>
      <button class="navbtn restartbtn" onclick="restart()">BACK TO START</button>
    </div>
  </div>

</div>

 regarded as the Father of Biology?", "correct": "Aristotle", "wrongs": ["Charles Darwin", "Carolus Linnaeus", "Robert Hooke"], "exp": "Aristotle is regarded as the Father of Biology.", "hack": "Aristotle = Biology (general). Linnaeus = Taxonomy. Don't mix them up in exams."}, {"tier": "drill", "topic": "Classification", "q": "Who is known as the Father of Modern Taxonomy?", "correct": "Carolus Linnaeus", "wrongs": ["Aristotle", "Charles Darwin", "Robert Whittaker"], "exp": "Carolus Linnaeus is known as the Father of Modern Taxonomy.", "hack": "Linnaeus = Taxonomy/Classification. Aristotle = Biology (general). Keep these separate!"}, {"tier": "drill", "topic": "Cytology", "q": "Cytology is the study of:", "correct": "Cells", "wrongs": ["Tissues", "Organs", "Whole organisms"], "exp": "Cytology is the study of cells. There are two types: prokaryotic cells and eukaryotic cells.", "hack": "Cyto- = cell (cytoplasm, cytology, cytoskeleton all share this root)."}, {"tier": "drill", "topic": "Reproduction", "q": "Asexual reproduction involves:", "correct": "No union of cells or nuclei of cells, and therefore no mingling of genetic traits", "wrongs": ["Union of male and female gametes", "Meiosis followed by fertilization", "Formation of a zygote from two parents"], "exp": "Asexual reproduction involves no union of cells or nuclei of cells and, therefore, no mingling of genetic traits, since the nucleus contains the genetic material (chromosomes) of the cell.", "hack": "Asexual = no mixing of genes from two parents = offspring genetically identical to the single parent."}, {"tier": "drill", "topic": "Interrelationship", "q": "Key interspecific interactions in the life of organisms include competition, predation, and:", "correct": "Symbiosis (including parasitism)", "wrongs": ["Photosynthesis", "Mitosis", "Excretion"], "exp": "Some key relationships in the life of an organism are its interactions with individuals of other species in the community. These interspecific interactions include competition, predation, and symbiosis including parasitism.", "hack": "3 core interspecific interactions: Competition, Predation, Symbiosis (which itself includes parasitism, mutualism, commensalism)."}, {"tier": "drill", "topic": "Heredity", "q": "An alternative version of a gene that can occur at a particular locus on homologous chromosomes is called a(n):", "correct": "Allele", "wrongs": ["Gene", "Genotype", "Phenotype"], "exp": "Allele: This is an alternative version of a gene that can occur at a particular locus on homologous chromosomes.", "hack": "Allele = a VARIANT of a gene (e.g. the 'S' allele vs the 's' allele of the same seed-shape gene)."}, {"tier": "drill", "topic": "Evolution", "q": "Why is evolution also called 'organic evolution'?", "correct": "Because it is evolution of living organisms", "wrongs": ["Because it only involves organic chemistry compounds", "Because it was named after a scientist named Organic", "Because it applies only to plants, not animals"], "exp": "Since the evolution is of living organisms, it is called organic evolution.", "hack": "'Organic' here simply means 'of living organisms' (biological), not a chemistry reference."}, {"tier": "drill", "topic": "Ecology", "q": "There are three types of ecological pyramids. Which pyramid shows RATES of energy flow through trophic levels, not absolute amounts stored?", "correct": "Pyramid of Energy", "wrongs": ["Pyramid of Biomass", "Pyramid of Numbers", "Pyramid of Nutrients"], "exp": "Energy pyramids represent energy flow through trophic levels. An energy pyramid usually shows rates of energy flow through trophic levels, not absolute amounts of energy stored. It can have energy units such as kcal/m\u00b2/yr.", "hack": "Energy Pyramid = RATE of flow (kcal/m\u00b2/yr), not a stock/amount \u2014 this distinguishes it clearly from Biomass pyramids."}, {"tier": "drill", "topic": "Intro", "q": "Into how many main branches has biological science traditionally been divided?", "correct": "3 (Zoology, Botany, Microbiology)", "wrongs": ["2", "4", "5"], "exp": "Biological science has 3 main branches: Zoology (animals), Botany (plants), Microbiology (simple/unicellular/microscopic organisms).", "hack": "Z-B-M: Zoology-Botany-Microbiology \u2014 the classic 3-way split of old biology texts."}, {"tier": "drill", "topic": "Classification", "q": "Biodiversity is best defined as:", "correct": "The great variety of living organisms on Earth and their varied habitats", "wrongs": ["The science of naming organisms", "The orderly arrangement of organisms into groups", "The scientific study of evolution only"], "exp": "Biodiversity is a term used to describe the great variety of living organisms on Earth and their varied habitats.", "hack": "Bio + Diversity = variety of life, straightforward word breakdown."}, {"tier": "drill", "topic": "Cytology", "q": "In Eukaryotic cells, flagella (if present) have which internal fibril arrangement?", "correct": "9 + 2 arrangement", "wrongs": ["7 + 2 arrangement", "9 + 0 arrangement", "No internal fibrils at all"], "exp": "Flagella have 9+2 internal fibril arrangement in Eukaryotes; Prokaryotic flagella (if present) lack this internal 9+2 arrangement.", "hack": "9+2 = the classic eukaryotic flagella/cilia microtubule arrangement (9 outer pairs + 2 central)."}, {"tier": "drill", "topic": "Reproduction", "q": "In liverworts and mosses, fragmentation followed by regeneration of the fragments into whole new organisms serves as a:", "correct": "Reproductive system (reproduction by fragments)", "wrongs": ["A form of sexual reproduction", "A disease process", "A form of pollination"], "exp": "In many plant groups, fragmentation of the plant body, followed by regeneration and development of the fragments into whole new organisms, serves as a reproductive system.", "hack": "Fragmentation = a plant body breaks apart and each piece can regrow into a whole new plant \u2014 common in liverworts/mosses."}, {"tier": "drill", "topic": "Interrelationship", "q": "Competition is an interaction that occurs when individuals fight or compete for:", "correct": "A resource that limits their growth and survival (mates, food, light, shelter, or space)", "wrongs": ["Sunlight only, never other resources", "Territory only, never food", "Reproductive partners exclusively"], "exp": "Competition is an interaction that occurs when individuals of the same or different species fight or compete for a resource that limits their growth and survival. Animals could compete for mates, food, light, shelter or space.", "hack": "Competition = fight over a LIMITED resource \u2014 can be intraspecific (same species) or interspecific (different species)."}, {"tier": "drill", "topic": "Heredity", "q": "An allele that does NOT express itself in the heterozygous condition is called the:", "correct": "Recessive Allele", "wrongs": ["Dominant Allele", "Homozygous Allele", "Genotype"], "exp": "Recessive Allele: This is an allele that does not express itself in the heterozygous condition.", "hack": "Recessive Allele = 'hides' when paired with a dominant allele; only shows up when homozygous recessive."}, {"tier": "drill", "topic": "Evolution", "q": "Due to overpopulation, there is a ______ between members of the same/different species for food, water, air, and space.", "correct": "Struggle (competition)", "wrongs": ["Total cooperation with no conflict", "Complete indifference", "Instant extinction of all members"], "exp": "Darwin's theory point 2: Due to over population, there is a struggle between the members of same species as well as from other species for food, water, air, and space. Only a few are able to get it and survive and the rest perish and get eliminated.", "hack": "Struggle for existence = the direct CONSEQUENCE of overproduction (point 1) \u2014 too many organisms, not enough resources."}, {"tier": "drill", "topic": "Ecology", "q": "Unlike energy, matter (nutrients) is NOT lost as it passes from one component of the food chain to another; this is described as passing through:", "correct": "A cycle", "wrongs": ["A single direction only, just like energy", "A random, disconnected pathway", "A one-time-use pathway"], "exp": "On the other hand, matter is not lost as it passes from one component of the food chain to another \u2014 the passage of organic molecules and their elemental units along the food chain may be described in terms of a cycle. Ecologists follow specific atoms (e.g. carbon, nitrogen, sulphur) through the cycle.", "hack": "Nutrient CYCLING = matter is reused/recycled repeatedly, contrasting sharply with the one-way, non-recyclable flow of energy."}, {"tier": "drill", "topic": "Intro", "q": "Zoology is the study of:", "correct": "Animals and facts related to their life", "wrongs": ["Plants", "Simpler unicellular organisms", "Fossils only"], "exp": "Zoology deals with the study of animals and the facts related to their life.", "hack": "Zoo = animals, easy recall."}, {"tier": "drill", "topic": "Classification", "q": "The Basic Unit of Classification is the:", "correct": "Species", "wrongs": ["Genus", "Family", "Kingdom"], "exp": "Species is called the Basic Unit of Classification. A species is a group of organisms which can interbreed with each other.", "hack": "Species = smallest/basic taxonomic rank AND the interbreeding definition \u2014 two facts in one."}, {"tier": "drill", "topic": "Cytology", "q": "Which cell structure is found in Plant cells but NOT in Animal cells?", "correct": "Cellulose cell wall", "wrongs": ["Cell membrane", "Ribosomes", "Mitochondria"], "exp": "Per Table 1.1, Plant cells have a cellulose cell wall as well as a membrane; Animal cells have no cellulose cell wall, only a membrane.", "hack": "Cell WALL (cellulose) = plant-only structure; both plant and animal cells have a cell MEMBRANE."}, {"tier": "drill", "topic": "Reproduction", "q": "Elongated runners or horizontal stems (e.g. in strawberries) that root and form new plantlets are called:", "correct": "Stolons", "wrongs": ["Rhizomes", "Corms", "Bulbs"], "exp": "Stolons are elongated runners, or horizontal stems, such as those of the strawberry, which root and form new plantlets when they make proper contact with a moist soil surface.", "hack": "Stolon = strawberry runner \u2014 think of strawberry plants spreading via long horizontal 'runner' stems."}, {"tier": "drill", "topic": "Interrelationship", "q": "In Predation, the species that kills and eats the other is called the:", "correct": "Predator (the one eaten is called the prey)", "wrongs": ["Prey", "Parasite", "Host"], "exp": "Predation refers to an interaction between species in which one species, the predator, kills and eats the other, the prey. Example: Lion attacking and eating antelope.", "hack": "Predator = the KILLER/eater; Prey = the one that gets killed/eaten."}, {"tier": "drill", "topic": "Heredity", "q": "In humans, sex determination follows which chromosomal system?", "correct": "XX and XY types", "wrongs": ["ZW and ZZ types", "XO and XX types", "Haplodiploidy"], "exp": "In humans, sex determination is of XX and XY types.", "hack": "Human sex determination = XX (female)/XY (male) system \u2014 not all species use this system (some use ZW/ZZ, some use XO)."}, {"tier": "drill", "topic": "Evolution", "q": "Was Lamarck's idea that the environment produces phenotypic changes in an individual (e.g. exercise increasing muscle size) correct?", "correct": "Yes, that part was correct, but such acquired traits (affecting only the phenotype, non-genetic) cannot be inherited", "wrongs": ["No, environment has zero effect on an individual's body", "Yes, and such acquired traits ARE inherited by offspring", "Lamarck never made any claim about environment and phenotype"], "exp": "Lamarck's emphasis on the role of the environment in producing phenotypic changes in the individual was correct. For example, body-building exercises will increase the size of muscles, but these acquired traits, while affecting the p tes"], "exp": "Gymnosperms bear naked seeds e.g. Pinus; Angiosperms bear seeds in fruits.", "hack": "Gymno- = naked (like 'gymnasium', originally naked exercise) \u2192 Gymnosperm = naked seed."}, {"tier": "medium", "topic": "Classification", "q": "Flowering plants whose seeds develop inside a fruit are called:", "correct": "Angiosperms", "wrongs": ["Gymnosperms", "Bryophytes", "Thallophytes"], "exp": "Angiosperms are flowering plants whose seeds develop in an organ that turns into the fruit; Angio = covered, Sperma = seeds.", "hack": "Angio- = covered/vessel (like 'angiogram' for blood vessels) \u2192 Angiosperm = covered seed."}, {"tier": "medium", "topic": "Classification", "q": "Angiosperms are divided into two types based on the number of cotyledons. These are:", "correct": "Monocotyledons (Monocots) and Dicotyledons (Dicots)", "wrongs": ["Gymnosperms and Cryptogams", "Thallophytes and Bryophytes", "Prokaryotes and Eukaryotes"], "exp": "Angiosperms can be divided into two types based on presence of cotyledons: Monocotyledons/Monocots and Dicotyledons/Dicots.", "hack": "Mono = one cotyledon; Di = two cotyledons \u2014 the number is right in the prefix."}, {"tier": "medium", "topic": "Classification", "q": "Monocot plants have floral parts in multiples of:", "correct": "Three", "wrongs": ["Four or five", "Two", "Six or seven"], "exp": "Monocots have floral parts in multiples of three; Dicots have floral parts in multiples of four or five.", "hack": "MONO-cots \u2192 3 (odd number pairing trick: think 'tri'cky monocots)."}, {"tier": "medium", "topic": "Classification", "q": "Dicot plants typically have which type of root system?", "correct": "Long taproot", "wrongs": ["Fibrous roots", "No roots", "Aerial roots only"], "exp": "Dicotyledons have a long taproot and broad leaves with a network of veins; Monocots have fibrous roots and long leaves with parallel veins.", "hack": "Di-cots = Deep taproot; Mono-cots = Mat of fibrous roots \u2014 alliteration trick."}, {"tier": "medium", "topic": "Classification", "q": "Which of these is an example of a Monocot?", "correct": "Maize", "wrongs": ["Rose", "Pea", "Sunflower"], "exp": "Examples of Monocots: Corn, Wheat, Grass, Maize. Examples of Dicots: Rose, Sunflower, Lily, Pea.", "hack": "Cereal/grass-type plants = monocots (corn, wheat, maize, grass); broad flowering plants = dicots (rose, pea, sunflower)."}, {"tier": "medium", "topic": "Classification", "q": "Animals are classified as Coelomate if they have:", "correct": "A true body cavity called the coelom", "wrongs": ["No body cavity at all", "A false cavity filled with fluid", "Only a partial digestive tract"], "exp": "Coelomate animals have a true body cavity called the Coelom.", "hack": "Coelomate = true Coelom (cavity)."}, {"tier": "medium", "topic": "Classification", "q": "Pseudocoelomate animals have:", "correct": "A false body cavity filled with fluid", "wrongs": ["A true body cavity (coelom)", "No body cavity at all", "A cavity made of bone"], "exp": "Pseudocoelomate means false cavity; they have a body cavity filled with fluid.", "hack": "Pseudo- = false \u2192 Pseudocoelomate = FALSE coelom."}, {"tier": "medium", "topic": "Classification", "q": "Acoelomate animals have:", "correct": "No body cavity at all", "wrongs": ["A true body cavity", "A false, fluid-filled cavity", "Two body cavities"], "exp": "Acoelomates have no body cavity at all.", "hack": "A- = without \u2192 Acoelomate = WITHOUT a coelom."}, {"tier": "medium", "topic": "Classification", "q": "The whole body of a Porifera (sponge) is called:", "correct": "Ostia or Osculum", "wrongs": ["Coelom", "Mantle", "Notochord"], "exp": "The whole body of a Porifera is called Ostia or Osculum, per the handwritten manual note.", "hack": "Ostia/Osculum = pore openings that define the sponge's body/canal system."}, {"tier": "medium", "topic": "Classification", "q": "Sponges (Phylum Porifera) reproduce/feed through which system running through their pores?", "correct": "A canal system through which water and food circulate and waste is removed", "wrongs": ["A closed circulatory system", "A respiratory tracheal system", "A notochord-based nerve system"], "exp": "Sponges have pores in their body which form a canal system through which water and food circulate in the body and waste is removed.", "hack": "Sponges: no organs, but a canal system does the job of circulation/waste removal via pores."}, {"tier": "medium", "topic": "Classification", "q": "Which examples belong to Phylum Porifera?", "correct": "Sycon, Spongilla, Euspongia", "wrongs": ["Hydra, Jellyfish", "Planaria, Tapeworm", "Earthworm, Leech"], "exp": "Examples of Phylum Porifera are Sycon, Spongilla, Euspongia.", "hack": "Remember: Sycon & Spongilla = sponges (Porifera). Hydra & Jellyfish = Coelenterata."}, {"tier": "medium", "topic": "Classification", "q": "Phylum Coelenterata (Cnidaria) organisms have which symmetry?", "correct": "Radial symmetry", "wrongs": ["Bilateral symmetry", "Asymmetrical", "No fixed symmetry"], "exp": "Phylum Coelenterata has Radial symmetry, with tissue-level organization (two cell layers \u2014 called Diploblastic organisms).", "hack": "Coelenterata/Cnidaria = radial symmetry, like a wheel with spokes (e.g. Hydra, Jellyfish)."}, {"tier": "medium", "topic": "Classification", "q": "Organisms with two cell layers are called:", "correct": "Diploblastic", "wrongs": ["Triploblastic", "Monoblastic", "Tetrablastic"], "exp": "Coelenterates have tissue-level organization with two cell layers, so called Diploblastic Organisms.", "hack": "Di- = two \u2192 Diploblastic = 2 layers (Coelenterata). Tri- = three \u2192 Triploblastic = 3 layers (most other phyla)."}, {"tier": "medium", "topic": "Classification", "q": "Which examples belong to Phylum Coelenterata (Cnidaria)?", "correct": "Aurelia (Jellyfish) and Adamsia (Sea Anemone)", "wrongs": ["Sycon and Spongilla", "Taenia solium and Fasciola hepatica", "Nereis and Leech"], "exp": "Examples of Phylum Coelenterata are Aurelia (Jelly fish) and Adamsia (Sea Anemone). Some live in colonies (like Coral), others solitary (like Hydra).", "hack": "Coelenterata = Cnidaria; jellyfish, sea anemones, hydra, coral all belong here."}, {"tier": "medium", "topic": "Classification", "q": "Coelenterates (Cnidarians) are described as the simplest form of:", "correct": "Invertebrate", "wrongs": ["Vertebrate", "Chordate", "Mammal"], "exp": "Per the manual's handwritten note, Coelenterates/Cnidarians are the simplest form of invertebrate.", "hack": "Coelenterata is an early/simple branch on the invertebrate side of the animal kingdom tree."}, {"tier": "medium", "topic": "Classification", "q": "Phylum Platyhelminthes organisms are commonly called:", "correct": "Flatworms", "wrongs": ["Roundworms", "Segmented worms", "Spiny-skinned animals"], "exp": "Phylum Platyhelminthes have a flat body and are thus called Flatworms.", "hack": "Platy- = flat (like 'platypus' flat-footed, or 'plateau' flat land) \u2192 Platyhelminthes = flatworms."}, {"tier": "medium", "topic": "Classification", "q": "Which body cavity classification applies to Phylum Platyhelminthes?", "correct": "Acoelomate (no body cavity)", "wrongs": ["Coelomate", "Pseudocoelomate", "Semi-coelomate"], "exp": "Phylum Platyhelminthes has no body cavity/coelom, so-called Acoelomates.", "hack": "Flatworms = Acoelomate \u2014 flat body, no room for a cavity."}, {"tier": "hot", "topic": "Intro", "q": "A student notices a patient has stomach pain, headache, loss of appetite and constipation. Lab tests confirm Salmonella typhi. Based on the disease table, the diagnosis is:", "correct": "Typhoid", "wrongs": ["Pneumonia (caused by a different organism, Haemophilus influenza)", "Common cold (caused by Rhino viruses)", "Filariasis (caused by Wuchereria bancrofti)"], "exp": "Salmonella typhi causes Typhoid, matching the symptom set (stomach pain, headache, loss of appetite, constipation) given in the manual's disease table.", "hack": "HOT tip: match organism \u2192 symptom set \u2192 disease name as a triangle; exam questions often give you 2 of the 3 and ask for the missing piece."}, {"tier": "hot", "topic": "Intro", "q": "A branch of biology combines biological science with engineering to design artificial limbs and organs. Which TWO fields from the manual overlap most closely to make this possible?", "correct": "Biomedical Engineering and Medicine", "wrongs": ["Anthropology and Forensic Science", "Sericulture and Apiculture", "Pathology and Dentistry"], "exp": "Biomedical engineering (design/manufacture of artificial organs) works hand-in-hand with medicine (doctors who use these devices to help impaired bodies function).", "hack": "HOT reasoning: link the 'who builds it' (Biomedical Engineering) with the 'who uses it' (Medicine/doctors)."}, {"tier": "hot", "topic": "Intro", "q": "Why is Innate immunity considered the body's FIRST line of defence rather than its most precise one?", "correct": "Because it is non-specific and acts immediately upon encountering any antigen, unlike adaptive immunity which is specific and slower to develop", "wrongs": ["Because it only works after vaccination", "Because it is formed exclusively by T cells", "Because it targets only bacteria and not viruses"], "exp": "Innate immunity is non-specific and immediate (e.g. skin, stomach acid, WBCs), while adaptive immunity is specific, involving B and T cells, and develops more slowly with memory.", "hack": "HOT link: speed vs precision trade-off \u2014 Innate = fast+broad, Adaptive = slow+targeted."}, {"tier": "hot", "topic": "Intro", "q": "A biologist wants a career combining research on protein folding, enzyme kinetics, and the unknown functions of 20% of eukaryotic proteins. Which topical issue category from the manual best fits this interest?", "correct": "General Biology \u2014 Biochemistry and Cell Biology", "wrongs": ["Non-human Biology \u2014 Ethology", "Neuroscience and Cognition \u2014 Perception", "General Biology \u2014 Evolution and Origins of Life"], "exp": "Topical issues like 'unknown protein function,' 'protein folding,' and 'enzyme kinetics' are all listed under General Biology > Biochemistry and Cell Biology.", "hack": "HOT trick: match keyword clusters (protein, enzyme, folding) to their listed sub-category rather than guessing by general vibe."}, {"tier": "hot", "topic": "Classification", "q": "A microbiologist finds a single-celled organism that is a prokaryote, lives in a hot spring at near-boiling temperature, and produces no methane. Based on the manual's habitat-based classification, it is most likely a:", "correct": "Thermophile (an Archaebacterium)", "wrongs": ["Methanogen", "Halophile", "Eubacterium living in soil"], "exp": "Thermophiles are Archaebacteria that live in boiling water such as hot springs and volcanoes \u2014 matching a prokaryotic, hot-spring-dwelling, non-methane-producing organism.", "hack": "HOT elimination: rule out Methanogen (produces methane) and Halophile (needs salty water, not heat) to land on Thermophile."}, {"tier": "hot", "topic": "Classification", "q": "A student sees a plant with naked seeds on cone scales, no flowers, and woody stems that persist year-round. Applying the Gymnosperm vs Angiosperm table, this plant is a:", "correct": "Gymnosperm (like Pine)", "wrongs": ["Angiosperm (like Maize)", "Bryophyte (like Moss)", "Thallophyte (like Spirogyra)"], "exp": "Gymnosperms bear naked seeds, exist for long time periods (evergreen), are woody with no flowers, e.g. Pines, Deodar \u2014 exactly matching this description; Angiosperms are flowering plants with seeds enclosed in fruit.", "hack": "HOT trick: 'naked seed + no flower + woody/evergreen' is the textbook Gymnosperm profile \u2014 memorize this bundle, not just one fact."}, {"tier": "hot", "topic": "Classification", "q": "Given the classification hierarchy Kingdom > Phylum > Class > Order > Family > Genus > Species, two organisms placed in the same Family but different Genus would be expected to:", "correct": "Share more characteristics than organisms in the same Phylum but different Class, but fewer than organisms in the same Genus", "wrongs": ["Share fewer characteristics than organisms in different Kingdoms", "Be unable to be classified at all", "Automatically belong to the same species"], "exp": "As the hierarchy narrows from Kingdom to Species, organisms sharing a lower/narrower rank (like Family) share MORE similarities than those sharing only a broader rank (like Phylum), reflecting the tree in Figure 2 (Homo sapiens hierarchical classification).", "hack": "HOT reasoning: the narrower the shared rank, the closer the relationship \u2014 this is the whole logic behind the King-Phylum-Class-Order-Family-Genus-Species ladder."}, {"tier": "hot", "topic": "Classification", "q": "A newly discovered organism is eukaryotic, multicellular, autotrophic, and has a cell wall made of cellulose. Based on the Five-Kingdom characteristics table, it belongs to Kingdom:", "correct": "Plantae", "wrongs": ["Fungi", "Animalia", "Monera"], "exp": "Per the table: Plantae are Eukaryotes, Multicellular, Autotrophic, with cell walls made of cellulose \u2014 matching exactly. Fungi are heterotrophic with chitin walls; Animalia are heterotrophic with no cell wall; Monera are prokaryotes.", "hack": "HOT strategy: use nutrition mode (auto/hetero) + cell wall material (cellulose/chitin/none) as the two fastest discriminators among the eukaryotic kingdoms (Protista, Fungi, Plantae, Animalia)."}, {"tier": "hot", "topic": "Classification", "q": "Why does the crocodile stand out as an exception within Class Reptilia in the vertebrate classification table?", "correct": "It has 4 heart chambers instead of the typical 3 chambers seen in other reptiles", "wrongs": ["It is warm-blooded unlike other reptiles", "It lays live young instead of eggs", "It breathes through gills as an adult"], "exp": "Reptilia have 3 Chambers except Crocodile which has 4 heart chambers; all other listed reptile traits (dry scales, cold-blooded, lungs, eggs) still apply to the crocodile.", "hack": "HOT exam trap: the crocodile ONLY breaks the heart-chamber rule (4 vs 3) \u2014 it is still cold-blooded and egg-laying like other reptiles, unlike birds/mammals."}, {"tier": "hot", "topic": "Classification", "q": "Comparing the Platypus/Echidna exception in Mammalia to the Crocodile exception in Reptilia, what do both exceptions have in common?", "correct": "Both are single named exceptions to an otherwise defining trait of their class (live birth for mammals; 3-chambered heart for reptiles)", "wrongs": ["Both exceptions concern body temperature regulation", "Both exceptions concern the number of legs", "Both animals are actually the same species"], "exp": "Platypus/Echidna break the 'mammals give live birth' rule by laying eggs; Crocodile breaks the 'reptiles have 3 heart chambers' rule by having 4 \u2014 both are classic single-exception facts examiners love to test.", "hack": "HOT pattern-recognition: whenever a table says 'except X,' expect a dedicated exam question isolating that exception."}, {"tier": "hot", "topic": "Classification", "q": "A biology exam asks you to distinguish Coelomate, Pseudocoelomate, and Acoelomate animals using only body cavity structure. Which ordering correctly reflects increasing structural complexity of the body cavity, as implied by the classification chart (Porifera/Cnidaria \u2192 Acoelomata \u2192 Coelomata)?", "correct": "Acoelomate \u2192 Pseudocoelomate \u2192 Coelomate", "wrongs": ["Coelomate \u2192 Pseudocoelomate \u2192 Acoelomate", "Pseudocoelomate \u2192 Coelomate \u2192 Acoelomate", "All three are equally complex, order doesn't matter"], "exp": "The classification of animalia diagram moves from Acoelomata (Platyhelminthes, Nematoda) toward Coelomata (Annelida, Arthropoda, Mollusca, Echinodermata), with Pseudocoelomate (Nematoda) sitting between full absence of cavity and a true coelom.", "hack": "HOT tip: use the flowchart logic (Fig 24) \u2014 Acoelomata splits into Platyhelminthes+Nematoda, but Nematoda itself is Pseudocoelomate, showing a stepwise complexity increase toward true Coelomata."}, {"tier": "hot", "topic": "Cytology", "q": "A cell biologist observes an organelle with a double unit membrane surrounding a matrix (stroma) containing stacked lamellae with chlorophyll and starch granules. This is most likely a:", "correct": "Chloroplast", "wrongs": ["Mitochondrion", "Lysosome", "Golgi apparatus"], "exp": "Chloroplasts are found only in plant cells, always having a double unit membrane surrounding a matrix (stroma) in which are stacks of lamellae (grana) holding chlorophyll, with starch granules and enzymes for CO2 reduction in the stroma.", "hack": "HOT ID trick: 'double membrane + stroma + grana/lamellae + chlorophyll + starch' is the unique chloroplast signature \u2014 distinct from mitochondria's cristae-and-matrix setup."}, {"tier": "hot", "topic": "Cytology", "q": "Suppose a mutation disables Golgi apparatus function in a secretory cell. Which downstream processes would be MOST directly disrupted?", "correct": "Glycoprotein production, carbohydrate secretion for cell walls, secretory enzyme production, lipid transport/storage, and lysosome formation", "wrongs": ["DNA replication and mitosis only", "Cellular respiration and ATP production only", "Photosynthesis and starch storage only"], "exp": "Golgi apparatus functions include: production of glycoproteins; secretion of carbohydrates for cell wall production; production/secretion of enzymes; transport and storage of lipids; formation of lysosomes \u2014 all would be disrupted.", "hack": "HOT approach: recall the Golgi's FULL function list, then predict which downstream processes break when it fails \u2014 this style of 'if X breaks, what fails' question is common at 200-level exams."}, {"tier": "hot", "topic": "Cytology", "q": "Comparing 'rough ER lined with ribosomes actively producing secreted proteins' versus 'smooth ER producing steroid hormones,' which organelle feature explains the functional difference?", "correct": "The presence or absence of ribosomes attached to the ER membrane determines whether it specializes in protein synthesis (rough) or lipid/steroid synthesis (smooth)", "wrongs": ["The colour of the ER determines its function", "The location of the ER in the cell (top vs bottom) determines its function", "Rough ER is only found in prokaryotes"], "exp": "Where the ER is lined with ribosomes (rough ER) it plays a role in protein synthesis; where ribosomes are absent (smooth ER) it produces lipids and steroids \u2014 the ribosome presence/absence is the functional switch.", "hack": "HOT causal link: ribosome presence = protein-making machine attached = rough ER's protein specialty; their absence frees smooth ER for lipid/steroid work."}, {"tier": "hot", "topic": "Cytology", "q": "A researcher wants to increase a plant cell's capacity for water storage and osmotic support in herbaceous tissue. Which structure should they focus on enhancing?", "correct": "The central vacuole (surrounded by the tonoplast)", "wrongs": ["The centriole", "The peroxisome", "The Golgi apparatus"], "exp": "In plant cells the large central vacuole, surrounded by the tonoplast, stores amino acids/sugars/waste and supports herbaceous parts of a plant by providing an osmotic system that creates pressure.", "hack": "HOT application: match a described NEED (osmotic support/water storage) to the SPECIFIC organelle responsible (central vacuole/tonoplast), not just recall its definition."}, {"tier": "hot", "topic": "Cytology", "q": "Explain why microtubules are essential to BOTH cell division and cilia/flagella movement, based on their listed functions.", "correct": "Because microtubules aid cell division by forming the mitotic spindle, and separately serve as a major structural component of cilia and flagella", "wrongs": ["Because microtubules only function in cell division, never in movement", "Because microtubules are identical in structure to microfilaments and serve no distinct role", "Because microtubules are found only in prokaryotic cells"], "exp": "Functions of microtubules include aiding cell division by forming the spindle, AND being a major component of cilia and flagella \u2014 two distinct but structurally-linked roles for the same 24nm tubular structure.", "hack": "HOT synthesis: microtubules are a 'multi-purpose scaffold' \u2014 same building block (tubulin tubes), different jobs depending on where they're deployed (spindle vs cilia/flagella shaft)."}, {"tier": "hot", "topic": "Reproduction", "q": "A plant produces spores of two distinctly different sizes: larger ones that develop into female gametophytes and smaller ones that develop into male gametophytes. What term describes this condition, and which genus mentioned in the manual exhibits it?", "correct": "Heterosporous; Selaginella (Spike mosses)", "wrongs": ["Homosporous; Psilotum", "Isogamous; Lycopodium", "Oogamous; ferns generally"], "exp": "All species of Selaginella (Spike mosses) are heterosporous, i.e. produce spores of two sizes: the larger designated megaspores develop into female gametophyte, the smaller microspores become the male gametophyte.", "hack": "HOT link: 'two spore sizes' = heterosporous = Selaginella, distinguishing it from most other cryptogams covered, which are typically homosporous (single spore size)."}, {"tier": "hot", "topic": "Reproduction", "q": "Explain the reproductive significance of 'double fertilization' in angiosperms, and identify the TWO structures it produces.", "correct": "One sperm fuses with the egg to form a zygote (future embryo); the other sperm fuses with two polar nuclei of the female gametophyte to form the primary endosperm nucleus (future nutritive endosperm tissue)", "wrongs": ["Both sperm fuse with the egg to form two separate zygotes", "One sperm fertilizes the egg while the other is discarded unused", "Double fertilization only occurs in gymnosperms, not angiosperms"], "exp": "Two sperm cells are involved in the sexual union in angiosperms: one unites with the egg to form a zygote; the other unites with two nuclei of the female gametophyte to form the primary endosperm nucleus. This divides to form a post-fertilization storage tissue that serves as a food source for the embryo \u2014 unlike gymnosperms where the embryo is nourished by the somatic tissues of the female gametophyte.", "hack": "HOT synthesis: Double fertilization = 2 sperm + 2 separate fusion events \u2192 Zygote (embryo) AND Endosperm (food supply) \u2014 this is THE defining reproductive innovation separating angiosperms from gymnosperms."}, {"tier": "hot", "topic": "Reproduction", "q": "A biology student observes an animal species where fertilization is internal, the young are born alive, but dissection reveals no placental attachment \u2014 instead, large yolk reserves are found around each developing embryo. What reproductive mode is this, and in which animal groups is it common per the manual?", "correct": "Ovoviviparity (aplacental viviparity); common in sharks, fishes, and amphibians (and other animals)", "wrongs": ["True viviparity; common only in mammals", "Oviparity; common in birds and reptiles", "External fertilization; common in fish"], "exp": "Ovoviviparity (aplacental viviparity) is a mode of reproduction in sharks, fishes, amphibians (and other animals) in which embryos develop inside eggs retained within the mother's body until ready to hatch; nourished by egg yolk, not placenta, though the mother's body does provide gas exchange.", "hack": "HOT clue-matching: 'internal fertilization + live birth + yolk (no placenta)' = the unique fingerprint of Ovoviviparity, distinct from both true Viviparity and Oviparity."}, {"tier": "hot", "topic": "Reproduction", "q": "Contrast the dominance pattern of gametophyte vs sporophyte generations across Bryophytes, Vascular Cryptogams (ferns etc.), and Seed Plants, explaining the overall evolutionary trend.", "correct": "Bryophytes are gametophyte-dominant; vascular cryptogams and seed plants are sporophyte-dominant, with seed-plant gametophytes further reduced to microscopic parasites on the sporophyte \u2014 an evolutionary trend toward increasing sporophyte dominance and gametophyte reduction", "wrongs": ["All three groups are equally gametophyte-dominant with no evolutionary trend", "All three groups are equally sporophyte-dominant with no evolutionary trend", "Bryophytes are sporophyte-dominant while seed plants are gametophyte-dominant"], "exp": "In liverworts, hornworts and mosses, the dominant phase is the gametophyte. In tracheophytes (vascular cryptogams) and seed plants, the sporophyte is dominant; in seed plants specifically, the gametophytes are reduced to microscopic parasites on the sporophytes.", "hack": "HOT big-picture trend: moving from Bryophytes \u2192 Cryptogams \u2192 Seed plants, the SPOROPHYTE becomes progressively more dominant and the GAMETOPHYTE becomes progressively smaller/more dependent \u2014 a key evolutionary storyline in plant reproduction."}, {"tier": "hot", "topic": "Interrelationship", "q": "A student observes weeds competing with garden plants for water and nutrients, then separately observes a lion killing and eating an antelope. Which TWO distinct interspecific interactions do these represent, and what is the key structural difference between them?", "correct": "Competition (weeds vs plants) and Predation (lion vs antelope) \u2014 competition involves indirect resource rivalry without one organism consuming the other, while predation involves direct killing and consumption", "wrongs": ["Both scenarios represent the same interaction, Symbiosis", "Both scenarios represent Mutualism", "Competition is a subtype of Predation, not a separate category"], "exp": "Competition occurs when individuals fight or compete for a limiting resource (e.g. weeds vs garden plants for nutrients/water) without direct killing; Predation is when one species (the predator) kills and eats the other (the prey), e.g. lion and antelope \u2014 these are listed as two distinct key relationships alongside symbiosis.", "hack": "HOT distinction: Competition = indirect resource rivalry (no direct kill); Predation = direct kill-and-consume act \u2014 don't lump them together just because both are 'interspecific interactions.'"}, {"tier": "hot", "topic": "Interrelationship", "q": "Explain why the barnacle-whale relationship is classified as Commensalism rather than Mutualism, even though the barnacle clearly benefits.", "correct": "Because for Mutualism BOTH organisms must benefit, but in the barnacle-whale relationship the whale is generally not affected (neither harmed nor helped) by the barnacles \u2014 only the barnacle benefits", "wrongs": ["Because the whale is actually harmed by the barnacles, making it parasitism instead", "Because barnacles provide the whale with food, which would make it mutualism if recognized", "Because commensalism requires both organisms to be harmed"], "exp": "Mutualism requires BOTH organisms to benefit (like clownfish-anemone). In the barnacle-whale relationship, only the barnacle benefits (transportation + steady food supply); the whale, on the other hand, is generally not affected by this kind of interaction \u2014 fitting the definition of commensalism (one benefits, other neither harmed nor helped) rather than mutualism.", "hack": "HOT reasoning: always check BOTH sides of the relationship before naming it \u2014 one-sided benefit with a neutral host = Commensalism, NOT Mutualism, even if it looks similar on the surface."}, {"tier": "hot", "topic": "Interrelationship", "q": "A parasite population is discovered to be losing its host species to extinction due to overexploitation. Predict which type of parasite (endoparasite or ectoparasite) is MORE likely being described if the host shows signs of external hair loss, weakened skin, and increased vulnerability to cold and predation \u2014 and justify using the moose-tick example.", "correct": "Ectoparasite \u2014 matching the manual's tick example, where ticks (living on the external surface of moose) cause blood withdrawal, hair breakage and loss, weakening the host and increasing its vulnerability to cold stress and predation by wolves", "wrongs": ["Endoparasite \u2014 because internal parasites always cause external hair loss", "Neither \u2014 hair loss and external weakening are unrelated to any parasite type", "Predator \u2014 because hair loss indicates a direct predation event, not parasitism"], "exp": "Ticks are explicitly described as ectoparasites that live on the external surface of a host (e.g. moose), causing external symptoms (blood withdrawal, hair breakage/loss) that weaken the host and increase vulnerability to cold stress or predation by wolves \u2014 matching the described scenario.", "hack": "HOT application: match the SYMPTOM LOCATION (external hair/skin damage) to the PARASITE TYPE (ectoparasite lives externally) using the specific tick-moose case study as your evidence anchor."}, {"tier": "hot", "topic": "Heredity", "q": "A researcher crosses a pea plant of unknown genotype (either SS or Ss) with a homozygous recessive (ss) plant via a Test Cross. All offspring show the smooth (dominant) phenotype. What is the genotype of the unknown parent, and why?", "correct": "SS (homozygous dominant) \u2014 because if it were Ss, roughly half the offspring would show the recessive (wrinkled) phenotype due to segregation of the s allele, but since ALL offspring are smooth, the unknown parent could only have contributed the S allele", "wrongs": ["Ss (heterozygous) \u2014 because heterozygotes always produce only dominant-phenotype offspring", "ss (homozygous recessive) \u2014 because recessive alleles are always expressed in a test cross", "It is impossible to determine the genotype from this cross"], "exp": "A Test Cross reveals the unknown genotype through offspring ratios: an Ss \u00d7 ss cross would yield ~1:1 dominant:recessive phenotypes (since Ss produces both S and s gametes via the Law of Segregation), while an SS \u00d7 ss cross yields 100% dominant phenotype (since SS produces only S gametes) \u2014 matching the all-smooth outcome described.", "hack": "HOT deduction: apply the Law of Segregation to predict Test Cross ratios, then work BACKWARD from the observed all-dominant offspring to conclude the unknown parent must be homozygous dominant (SS), not heterozygous (Ss)."}, {"tier": "hot", "topic": "Heredity", "q": "A couple has three sons and no daughters. A colleague claims 'the mother must have a genetic defect that only allows her to produce X-carrying eggs that combine with Y-sperm.' Using the manual's sex determination facts, evaluate this claim.", "correct": "The claim is flawed \u2014 the mother (homogametic) always produces ova carrying only X chromosomes regardless of the child's sex; it is the FATHER's heterogametic sperm (X-carrying vs Y-carrying) that determines whether each child is XX (girl) or XY (boy), so three sons simply reflects three Y-carrying sperm fertilizations, not any maternal 'defect'", "wrongs": ["The claim is correct \u2014 mothers who have only sons must be genetically unable to produce X-carrying ova", "The claim is correct, but only because the father has no Y chromosome to contribute", "Sex determination in humans has nothing to do with either parent's chromosomes"], "exp": "Female is homogametic (produces only X-carrying ova); Male is heterogametic (produces both X-carrying and Y-carrying sperm, half each). Each child's sex is determined by which type of sperm fertilizes the ovum: X-sperm+X-ovum=Girl (44A+XX), Y-sperm+X-ovum=Boy (44A+XY). Three sons in a row is a matter of probability (each conception is independent, ~50/50), not maternal genetic defect.", "hack": "HOT critical evaluation: this tests whether the student understands that sex determination outcome PROBABILITY (independent 50/50 events) is not evidence of a maternal 'defect' \u2014 a classic real-world misapplication of genetics the manual's facts can correct."}, {"tier": "hot", "topic": "Heredity", "q": "Distinguish between Somatic Variation and Genotypic Variation using an example of identical twins raised in different environments who develop different body weights but retain identical eye colour.", "correct": "The difference in body weight (influenced by diet/environment/activity) illustrates Somatic Variation \u2014 non-heritable, caused by environmental factors; the identical eye colour (determined by genes) illustrates that genetically identical individuals (same genotype) show the same Genotypic trait regardless of environment, since Genotypic Variation depends on chromosome/gene differences, not environment", "wrongs": ["Both differences are examples of Genotypic Variation since the twins are genetically identical", "Both differences are examples of Somatic Variation since twins can never have genetic differences", "There is no meaningful distinction between Somatic and Genotypic Variation in twins"], "exp": "Somatic Variation is caused by environmental factors (climate, food supply, activity) and is generally not transmitted to future generations/not significant in evolution. Genotypic Variation is caused by differences in chromosome number/structure or genes carried by chromosomes. Since the twins share identical genotypes, any environmentally-driven difference (like weight, from diet/activity) is Somatic; genetically fixed traits (like eye colour) stay the same regardless of environment because they're Genotypic.", "hack": "HOT application: use identical twins as a natural 'genotype-controlled' experiment \u2014 any trait that DIFFERS despite identical genes = Somatic Variation; traits that stay the SAME despite different environments = Genotypic Variation expressing itself consistently."}, {"tier": "hot", "topic": "Evolution", "q": "A biology student examines the wings of a bat and the wings of a butterfly and concludes 'these are homologous organs since both fly using wings.' Evaluate this claim using the manual's definitions.", "correct": "The claim is incorrect \u2014 bat wings (modified forelimb bones, mammalian) and butterfly wings (chitinous exoskeletal extensions, insect) have completely different basic structures despite performing the similar function of flight; this makes them ANALOGOUS organs (similar function, different structure/origin), not homologous organs, which require a shared basic structural design from a common ancestor", "wrongs": ["The claim is correct, since any two flying structures are automatically homologous", "The claim is correct, since 'wings' is the same word for both structures", "Neither homology nor analogy applies to insect and mammal structures"], "exp": "Homologous organs share a basic structural design from a common ancestor despite different functions (e.g. frog/bird/human forelimbs). Analogous organs have different basic structures but similar function (e.g. insect and bird wings, explicitly given as the manual's example) \u2014 bat and butterfly wings fit the analogous pattern: different structural origin (bone vs chitin), same function (flight).", "hack": "HOT trap: 'same function' does NOT automatically mean homologous \u2014 always check whether the underlying STRUCTURE/origin is shared (homologous) or different (analogous), using the manual's insect-vs-bird-wing example as your template."}, {"tier": "hot", "topic": "Evolution", "q": "Using Darwin's five-point framework, explain why a population of insecticide-resistant mosquitoes might emerge after repeated pesticide spraying, even though no single mosquito was ever deliberately 'trained' to resist the pesticide.", "correct": "Mosquitoes overproduce offspring; pesticide spraying creates a struggle for survival; natural variation in resistance already exists among mosquitoes before spraying; resistant mosquitoes survive and reproduce while susceptible ones die (survival of the fittest); over repeated generations this favourable trait accumulates, producing a resistant population", "wrongs": ["A single mosquito actively 'trains' its body to resist pesticide, and this trained resistance is passed to offspring (Lamarckian inheritance of an acquired trait)", "Resistance appears instantly and simultaneously in all mosquitoes the very first time pesticide is used", "Insecticide resistance has no connection to genetics, environment, or evolutionary theory at all"], "exp": "Darwin's mechanism relies on selection acting on variation that ALREADY EXISTS in the population before the selective pressure (pesticide) is applied \u2014 resistant individuals aren't 'created' by the pesticide, they already existed as a minority and survive to reproduce while susceptible ones are eliminated, gradually shifting the whole population toward resistance over generations (mirroring Darwin's 5-point framework: overproduction, struggle, variation, survival of the fittest, accumulation into new trait dominance).", "hack": "HOT synthesis: this is a real-world application of Darwin's 5-point framework \u2014 always check that the correct answer preserves 'variation existed FIRST, selection acted SECOND,' never 'the pressure created the trait,' which is the incorrect Lamarckian framing."}, {"tier": "hot", "topic": "Evolution", "q": "The manual states Lamarck's emphasis on the environment producing phenotypic changes was 'correct,' using body-building exercise as an example. Explain precisely WHAT was correct and WHAT was incorrect about Lamarck's overall theory.", "correct": "It was correct that environmental factors (like exercise) can change an individual's PHENOTYPE (e.g. increasing muscle size); it was incorrect that such acquired, non-genetic phenotypic changes can be inherited by offspring, since they do not affect the genotype", "wrongs": ["Lamarck's entire theory, including inheritance of acquired characteristics, was fully correct and is still used today", "Lamarck was entirely wrong about everything, including the effect of environment on phenotype", "Lamarck's theory was about genotype change only, never phenotype"], "exp": "Lamarck's emphasis on the role of the environment in producing phenotypic changes in the individual was correct \u2014 body-building exercises will increase the size of muscles. However, these acquired traits, while affecting the phenotype, are non-genetic, and having no influence on the genotype cannot be inherited \u2014 this is the part of Lamarck's theory (inheritance of acquired characteristics) that is incorrect.", "hack": "HOT precision: separate Lamarck's theory into its two distinct claims \u2014 (1) environment shapes phenotype [correct, still true today] vs (2) acquired phenotypic changes are heritable [incorrect, genotype is unaffected] \u2014 many exam questions test whether you can cleanly split these two claims."}, {"tier": "hot", "topic": "Ecology", "q": "A newly-formed island ecosystem initially shows a population of rabbits growing in a J-shaped curve with no signs of slowing. After several years, growth begins to level off as the rabbit population approaches a stable maximum. Explain this transition using the manual's growth curve concepts and equations.", "correct": "Initially, with abundant resources and few limiting constraints, the population follows exponential growth (dN/dt = rN, J-shaped curve); as the population increases and approaches the island's carrying capacity (K), limiting factors (food, space, etc.) cause birth rate to be matched/overtaken by death rate, and growth shifts to the logistic pattern (dN/dt = rN[(K-N)/K]), levelling off in an S-shaped curve at K", "wrongs": ["The rabbits simply stopped reproducing entirely once growth slowed, with no mathematical explanation", "Exponential and logistic growth are unrelated concepts and cannot describe the same population over time", "The population's growth rate r changed to a negative number, causing the population to shrink to zero"], "exp": "Exponential growth (dN/dt=rN) increases slowly then rapidly, potentially approaching a vertical line \u2014 but this is only hypothetical since a population increasing at such a rate becomes subject to limiting constraints; its birthrate is matched/overtaken by an increased death rate, maintaining a steady number. This is captured by the logistic equation dN/dt = rN[(K-N)/K], where the rate of growth is modified by the factor (K-N)/K as N approaches carrying capacity K, producing the S-shaped growth curve.", "hack": "HOT synthesis: real populations often START exponential (when resources are abundant/unconstrained) and TRANSITION to logistic (as they approach carrying capacity) \u2014 recognizing this shift, and mapping it to both named equations, is a classic higher-order ecology exam question."}, {"tier": "hot", "topic": "Ecology", "q": "In the grassland ecosystem numbers pyramid, nearly 6 million producer plants support only 3 tertiary (top) consumers. Using the concept of energy pyramids and the second law of thermodynamics, explain why such a dramatic reduction occurs moving up trophic levels.", "correct": "Because energy is lost as heat at every trophic transfer (per the second law of thermodynamics), only a fraction of the energy stored at one trophic level is available to the next level up; over multiple trophic transfers (producer\u2192primary\u2192secondary\u2192tertiary consumer) this compounding energy loss means far fewer organisms can be supported at each successively higher level, explaining why millions of producers are needed to sustain only a few top predators", "wrongs": ["Because plants deliberately withhold energy from consumers to protect themselves", "Because tertiary consumers require no energy to survive, unlike producers", "Because the carrying capacity K is identical at every trophic level, so numbers should stay the same"], "exp": "As energy passes along a food chain from one link to another, its useful capacity for work is diminished with every transformation (2nd law of thermodynamics) \u2014 heat is given off, and by the end of the chain little/no free energy is left. This explains both the shape of the energy pyramid (each level holds much less usable energy than the one below) and the dramatic numeric drop-off seen in the grassland numbers pyramid (5,842,000 producers supporting only 3 tertiary consumers).", "hack": "HOT integration: this question links THREE separate manual facts \u2014 the 2nd law of thermodynamics/energy pyramids concept, the specific grassland numbers-pyramid figures, and the general 'energy flows one way and is lost as heat' principle \u2014 into one causal explanation, the hallmark of a true higher-order-thinking question."}, {"tier": "hot", "topic": "Intro", "q": "Innate immunity refers to:", "correct": "The non-specific defence mechanism that works immediately when a person encounters an antigen", "wrongs": ["A specific defence mechanism involving B and T cells", "Immunity acquired only through vaccination", "Immunity passed from mother to child only"], "exp": "Innate immunity refers to the non-specific defence mechanism that works immediately when a person is encountered by an antigen \u2014 e.g. skin, HCl in stomach, WBCs.", "hack": "Innate = 'in-born' = immediate & non-specific. Adaptive = specific & involves memory (B/T cells)."}, {"tier": "hot", "topic": "Intro", "q": "Which of the following is an example of innate immunity?", "correct": "Skin", "wrongs": ["B cells", "T cells", "Antibodies from vaccination"], "exp": "Examples of innate immunity include Skin, Hydrochloric Acid in the Stomach, and White Blood Cells \u2014 the body's immediate, non-specific barriers.", "hack": "Barriers/first-responders (skin, stomach acid, WBCs) = innate. Cells that 'remember' (B/T cells) = adaptive."}, {"tier": "hot", "topic": "Intro", "q": "Adaptive immunity involves two types of cells. These are:", "correct": "B Cells ons", "wrongs": ["Poultry Farm Management", "Dairy Farm Management", "Bee Keeping"], "exp": "Animal Husbandry includes Poultry Farm Management, Dairy Farm Management, Bee Keeping, and Aquaculture/Pisciculture \u2014 not forensic investigations.", "hack": "Odd-one-out trap: forensic science belongs to a totally different scope entry (careers), not Animal Husbandry."}, {"tier": "hot", "topic": "Intro", "q": "Which household product is formed with the help of Lactobacillus bacterium?", "correct": "Curd (from milk)", "wrongs": ["Cheese only", "Bread", "Vinegar"], "exp": "Microbes in household products: Lactobacillus in curd \u2014 this bacterium is essential for curd formation from milk. Cheese is produced by fermented bacteria known as Propionibacterium Sharmanii.", "hack": "Lactobacillus = lacto (milk) \u2192 curd/yoghurt. Different bacterium (Propionibacterium) makes cheese \u2014 don't merge them!"}, {"tier": "hot", "topic": "Intro", "q": "Rhizobium bacteria found in leguminous plants act as:", "correct": "Bio-fertilizers, helping in nitrogen fixation", "wrongs": ["Bio-control agents against pests", "Bacteria used in sewage treatment only", "Bacteria that cause plant disease"], "exp": "Some microbes are used as bio-fertilizers; Rhizobium is a bacteria found in leguminous plants that helps in nitrogen fixation.", "hack": "Rhizobium \u2194 Root nodules of legumes \u2194 Nitrogen fixation \u2014 a classic linked triad."}, {"tier": "hot", "topic": "Intro", "q": "Bacillus thuringiensis is used in agriculture as a:", "correct": "Bio-control agent against insects/pests", "wrongs": ["Bio-fertilizer", "Curd-forming bacterium", "Sewage treatment bacterium"], "exp": "Microbes are also used as bio control agents such as Bacillus thuringiensis against insects/pests.", "hack": "Bt (Bacillus thuringiensis) is a well-known natural pesticide bacterium \u2014 common in GMO crop questions too."}, {"tier": "hot", "topic": "Classification", "q": "Species is called the Basic Unit of Classification because:", "correct": "It is a group of organisms which can interbreed with each other", "wrongs": ["It is the broadest classification category", "It only applies to plants", "It has no genetic definition"], "exp": "Species is called the Basic Unit of Classification. A species is a group of organisms which can interbreed with each other.", "hack": "Interbreeding capability = the biological test for 'same species' status."}, {"tier": "hot", "topic": "Classification", "q": "Which of these is NOT one of the criteria scientists used to divide organisms into kingdoms?", "correct": "Colour of the organism", "wrongs": ["Organization inside the cells (prokaryotic vs eukaryotic)", "Organization of cells in the body (unicellular vs multicellular)", "How organisms obtain their food (autotroph vs heterotroph)"], "exp": "Scientists divided organisms into kingdoms based on: organization inside cells, organization of cells in the body, and how organisms obtain their food \u2014 not colour.", "hack": "3 criteria: cell type (pro/eukaryote), body organization (uni/multicellular), and nutrition mode (auto/heterotroph) \u2014 not colour, size, or habitat."}, {"tier": "hot", "topic": "Classification", "q": "Which kingdom(s) in the five-kingdom system contain BOTH autotrophic and heterotrophic members?", "correct": "Monera and Protista", "wrongs": ["Fungi and Plantae", "Plantae and Animalia only", "Fungi only"], "exp": "In the Five-Kingdom classification table, Monera has some autotrophs (blue-green algae) and some heterotrophs; Protista has both autotrophs and heterotrophs. Fungi are (mostly) heterotrophs, Plantae are autotrophs, Animalia are heterotrophs.", "hack": "Only Monera and Protista show BOTH nutrition modes in the same kingdom \u2014 Plantae is purely autotrophic, Animalia and Fungi are purely heterotrophic."}, {"tier": "hot", "topic": "Classification", "q": "Which kingdom is entirely made of eukaryotic, multicellular, heterotrophic organisms with NO cell wall?", "correct": "Animalia", "wrongs": ["Fungi", "Plantae", "Protista"], "exp": "Per the Five-Kingdom characteristics table: Animalia is eukaryotic, multicellular, heterotrophic, and has no cell walls (unlike Fungi, whose cell walls are chitin, and Plantae, whose cell walls are cellulose).", "hack": "Animalia = eukaryotic + multicellular + heterotroph + NO cell wall \u2014 the ONLY kingdom lacking a cell wall entirely."}, {"tier": "hot", "topic": "Classification", "q": "Fungi's cell wall composition differs from Plantae's cell wall in that:", "correct": "Fungi's is made of chitin while Plantae's is made of cellulose", "wrongs": ["Fungi's is made of cellulose while Plantae's is made of chitin", "Both are made of the same complex sugar", "Neither Fungi nor Plantae have cell walls"], "exp": "Fungi cell walls are made up of the complex sugar chitin; Plantae cell walls are made of cellulose.", "hack": "Chitin (Fungi) vs Cellulose (Plantae) \u2014 two different but both structural polysaccharides."}, {"tier": "hot", "topic": "Classification", "q": "Why were Archaebacteria eventually renamed 'Archaea' and elevated to their own domain?", "correct": "Because biochemical/DNA-RNA sequence analyses showed they are more closely related to eukaryotes than to true bacteria", "wrongs": ["Because they were discovered to be multicellular", "Because they contain chlorophyll", "Because they were found only on land"], "exp": "It became obvious from biochemical characteristics and DNA/RNA sequence analyses that archaebacteria were more closely related to eukaryotes than to bacteria; they were renamed Archaea and given the rank of Domain.", "hack": "The domain system exists BECAUSE Archaea turned out to be genetically closer to Eukarya than to Bacteria, despite looking prokaryotic."}, {"tier": "hot", "topic": "Classification", "q": "The Three Domains of life are:", "correct": "Archaea, Bacteria, Eukarya", "wrongs": ["Monera, Protista, Animalia", "Prokaryota, Eukaryota, Protista", "Fungi, Plantae, es (and organelles like mitochondria/chloroplasts, since they evolved from bacteria); 80S = eukaryotic cytoplasmic ribosomes."}, {"tier": "hot", "topic": "Classification", "q": "Which of these is a difference between Prokaryotic and Eukaryotic cell division?", "correct": "Prokaryotes divide by binary fission with no meiosis; Eukaryotes divide by mitosis and undergo meiosis for sexual reproduction", "wrongs": ["Prokaryotes undergo mitosis; Eukaryotes undergo binary fission", "Both divide the exact same way", "Neither undergoes any form of division"], "exp": "Cell Division in Prokaryotes: Binary fission; in Eukaryotes: Mitosis. Sexual Reproduction: Prokaryotes \u2014 No meiosis, only transfer of DNA fragments (conjugation); Eukaryotes \u2014 Involves meiosis.", "hack": "Binary fission (no true sex) = Prokaryote; Mitosis + Meiosis (true sexual reproduction) = Eukaryote."}, {"tier": "hot", "topic": "Cytology", "q": "Which comparison correctly distinguishes Prokaryotic from Eukaryotic chromosome arrangement?", "correct": "Prokaryotes have a single circular chromosome lacking histones; Eukaryotes have multiple linear chromosomes with histones", "wrongs": ["Prokaryotes have multiple linear chromosomes; Eukaryotes have a single circular chromosome", "Both have identical chromosome arrangements", "Neither has any chromosomal DNA"], "exp": "Chromosome (DNA) arrangement: Prokaryotes \u2014 Single circular chromosome, lacks histones; Eukaryotes \u2014 Multiple linear chromosomes with histones.", "hack": "Circular+no histones = Prokaryote; Linear+histones = Eukaryote \u2014 pair these facts together."}, {"tier": "hot", "topic": "Cytology", "q": "Regarding membrane-enclosed organelles like lysosomes, Golgi complex, ER, mitochondria and chloroplasts, which statement is TRUE?", "correct": "They are present in Eukaryotes but absent in Prokaryotes", "wrongs": ["They are present in both Prokaryotes and Eukaryotes equally", "They are present in Prokaryotes but absent in Eukaryotes", "They are absent in both Prokaryotes and Eukaryotes"], "exp": "Membrane-Enclosed Organelles are absent in Prokaryotes; present in Eukaryotes (e.g. lysosomes, Golgi complex, ER, mitochondria, chloroplasts).", "hack": "The whole 'membrane-bound organelle' concept (mitochondria, ER, Golgi, lysosomes) is EUKARYOTE-exclusive."}, {"tier": "hot", "topic": "Cytology", "q": "How does prokaryotic flagella structure differ from eukaryotic flagella structure?", "correct": "Prokaryotic flagella consist of two protein building blocks; eukaryotic flagella are complex, made of multiple microtubules", "wrongs": ["Prokaryotic flagella are made of multiple microtubules; eukaryotic flagella are made of two protein blocks", "Both are structurally identical", "Neither prokaryotes nor eukaryotes have flagella"], "exp": "Flagella comparison: Prokaryotes \u2014 Consist of two protein building blocks; Eukaryotes \u2014 Complex, consist of multiple microtubules.", "hack": "Simple 2-protein flagella = Prokaryote. Complex multi-microtubule flagella (9+2 arrangement) = Eukaryote."}, {"tier": "hot", "topic": "Cytology", "q": "Comparing cell wall chemistry, which statement is correct?", "correct": "Prokaryotic cell walls are usually present and chemically complex (e.g. peptidoglycan); when eukaryotic cell walls are present, they are chemically simple", "wrongs": ["Prokaryotic cell walls are always absent; eukaryotic cell walls are always complex", "Both prokaryotic and eukaryotic cell walls are equally complex", "Neither prokaryotes nor eukaryotes ever have cell walls"], "exp": "Cell Wall comparison: Prokaryotes \u2014 usually present, chemically complex (typical bacterial cell wall includes peptidoglycan); Eukaryotes \u2014 when present, chemically simple.", "hack": "Peptidoglycan = a signature prokaryotic (bacterial) cell wall component, distinct from eukaryotic cellulose/chitin."}, {"tier": "hot", "topic": "Cytology", "q": "Why is Rough Endoplasmic Reticulum called 'rough' while Smooth ER is call
