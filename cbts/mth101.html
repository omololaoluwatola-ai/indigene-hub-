= −65."}, {"c": 5, "t": "Remainder Theorem", "k": "ex", "q": "If f(x) = 2x^{3} − 3x^{2} − 5x + 1, find the remainder when f(x) is divided by 2x − 5.", "o": ["1", "−1", "2", "0"], "e": "Put x = 5/2: f(5/2) = 125/4 − 75/4 − 25/2 + 1 = 1.", "v": null, "h": "For 2x − 5 use x = 5/2: 2(125/8) − 3(25/4) − 25/2 + 1 = 1. Set the divisor to zero to get the number."}, {"c": 5, "t": "Remainder Theorem", "k": "ex", "q": "Find the remainder when x^{5} − x − 1 is divided by (x − 1)(x − 2).", "o": ["30x − 31", "30x + 31", "31x − 30", "29x − 29"], "e": "Remainder is Ax + B. Put x = 1: A + B = −1. Put x = 2: 2A + B = 29. Subtract: A = 30, then B = −31. Remainder = 30x − 31.", "v": null, "h": "For a quadratic divisor write remainder = ax + b. Use f(1) = −1 and f(2) = 29: a + b = −1 and 2a + b = 29, so a = 30, b = −31."}, {"c": 5, "t": "Remainder Theorem", "k": "tu", "q": "Find the remainder when f(x) = 3x^{3} + 2x^{2} + x + 1 is divided by x − 3.", "o": ["103", "−103", "113", "93"], "e": "f(3) = 81 + 18 + 3 + 1 = 103.", "v": null, "h": "f(3) = 81 + 18 + 3 + 1 = 103. Substitute x = 3 directly."}, {"c": 5, "t": "Remainder Theorem", "k": "tu", "q": "Find the remainder when f(x) = 4x^{4} − 8x^{3} + 1 is divided by (x − 1)(x + 2).", "o": ["−44x + 41", "−43x + 41", "44x + 41", "−44x − 41"], "e": "Remainder is Ax + B. f(1) = −3 gives A + B = −3. f(−2) = 64 + 64 + 1 = 129 gives −2A + B = 129. Subtract: 3A = −132, so A = −44 and B = 41. Remainder = −44x + 41.", "v": null, "h": "Remainder is ax + b. f(1) = −3 and f(−2) = 129 gives a + b = −3 and −2a + b = 129, so a = −44 and b = 41."}, {"c": 5, "t": "Remainder Theorem", "k": "tu", "q": "Find the remainder when f(x) = 2x^{3} − 5x^{2} + x − 2 is divided by 2x − 1.", "o": ["−5/2", "5/2", "−3/2", "−7/2"], "e": "Put x = 1/2: 2/8 − 5/4 + 1/2 − 2 = −5/2.", "v": null, "h": "For 2x − 1 use x = 1/2: 2/8 − 5/4 + 1/2 − 2 = −5/2. Take care with the fractions."}, {"c": 5, "t": "Factor Theorem", "k": "ex", "q": "Which value of f(2) shows that (x − 2) is a factor of f(x) = x^{3} − 5x^{2} + 4x + 4?", "o": ["f(2) = 0", "f(2) = 4", "f(2) = −4", "f(2) = 8"], "e": "f(2) = 8 − 20 + 8 + 4 = 0. A zero remainder means (x − 2) is a factor by the Factor Theorem.", "v": null, "h": "A factor means the remainder is zero: f(2) = 8 − 20 + 8 + 4 = 0. So the answer is f(2) = 0."}, {"c": 5, "t": "Factor Theorem", "k": "ex", "q": "Given that x^{2} − 3x + 2 is a factor of x^{4} + ax^{2} + bx + 8, find a and b.", "o": ["a = −3, b = −6", "a = 3, b = −6", "a = −3, b = 6", "a = −6, b = −3"], "e": "x^{2} − 3x + 2 = (x − 1)(x − 2), so f(1) = 0 and f(2) = 0. f(1): a + b + 9 = 0. f(2): 4a + 2b + 24 = 0. Solving gives a = −3, b = −6.", "v": null, "h": "x² − 3x + 2 = (x − 1)(x − 2). Both x = 1 and x = 2 must make the polynomial 0: a + b = −9 and 4a + 2b = −24. Solve: a = −3, b = −6."}, {"c": 5, "t": "Factor Theorem", "k": "ex", "q": "Given that x^{2} − 3x + 2 is a factor of x^{4} + ax^{2} + bx + 8, completely factorise the polynomial.", "o": ["(x − 1)(x − 2)(x^{2} + 3x + 4)", "(x − 1)(x − 2)(x^{2} − 3x + 4)", "(x + 1)(x + 2)(x^{2} + 3x + 4)", "(x − 1)(x − 2)(x^{2} + 3x − 4)"], "e": "With a = −3, b = −6 the polynomial is x^{4} − 3x^{2} − 6x + 8. Dividing by x^{2} − 3x + 2 gives the quotient x^{2} + 3x + 4 (which has no real factors since 9 − 16 < 0). So it is (x − 1)(x − 2)(x^{2} + 3x + 4).", "v": null, "h": "Divide the polynomial by the known quadratic factor. The other factor is x² + 3x + 4 (constants multiply to 8 as 2 × 4). Its discriminant is negative, so it doesn't factorise further."}, {"c": 5, "t": "Partial Fractions", "k": "ex", "q": "Resolve 3/((x + 2)(2x − 1)) into partial fractions.", "o": ["6/(5(2x − 1)) − 3/(5(x + 2))", "6/(5(2x − 1)) + 3/(5(x + 2))", "3/(5(2x − 1)) − 6/(5(x + 2))", "6/(5(2x + 1)) − 3/(5(x − 2))"], "e": "Let 3 = A(2x − 1) + B(x + 2). x = −2: 3 = −5A so A = −3/5. x = 1/2: 3 = (5/2)B so B = 6/5. Hence 6/(5(2x − 1)) − 3/(5(x + 2)).", "v": null, "h": "Cover-up: at x = −2 the rest is 3/(2x − 1) = −3/5. At x = 1/2 the rest is 3/(x + 2) = 6/5. Put the coefficient over the matching bracket."}, {"c": 5, "t": "Partial Fractions", "k": "ex", "q": "Resolve 3x/((x + 1)(x − 2)) into partial fractions.", "o": ["1/(x + 1) + 2/(x − 2)", "1/(x + 1) − 2/(x − 2)", "2/(x + 1) + 1/(x − 2)", "−1/(x + 1) + 2/(x − 2)"], "e": "3x = A(x − 2) + B(x + 1). x = −1: −3 = −3A so A = 1. x = 2: 6 = 3B so B = 2. Hence 1/(x + 1) + 2/(x − 2).", "v": null, "h": "Cover-up: at x = −1 the rest is 3x/(x − 2) = 1. At x = 2 the rest is 3x/(x + 1) = 2. Check by adding them at x = 0."}, {"c": 5, "t": "Partial Fractions", "k": "ex", "q": "Resolve (2x + 3)/((x + 1)(2x + 1)(x − 3)) into partial fractions.", "o": ["1/(4(x + 1)) − 8/(7(2x + 1)) + 9/(28(x − 3))", "1/(4(x + 1)) + 8/(7(2x + 1)) + 9/(28(x − 3))", "1/(4(x + 1)) − 8/(7(2x + 1)) − 9/(28(x − 3))", "−1/(4(x + 1)) − 8/(7(2x + 1)) + 9/(28(x − 3))"], "e": "2x + 3 = A(2x + 1)(x − 3) + B(x + 1)(x − 3) + C(x + 1)(2x + 1). x = −1: 1 = 4A so A = 1/4. x = −1/2: 2 = −(7/4)B so B = −8/7. x = 3: 9 = 28C so C = 9/28.", "v": null, "h": "Three distinct linear factors, so three cover-ups: x = −1 gives 1/4, x = −1/2 gives −8/7 on (2x + 1) and x = 3 gives 9/28."}, {"c": 5, "t": "Partial Fractions", "k": "ex", "q": "Resolve (x + 1)/((x − 1)(x^{2} + 1)) into partial fractions.", "o": ["1/(x − 1) − x/(x^{2} + 1)", "1/(x − 1) + x/(x^{2} + 1)", "1/(x − 1) − 1/(x^{2} + 1)", "2/(x − 1) − x/(x^{2} + 1)"], "e": "Let it equal A/(x − 1) + (Bx + C)/(x^{2} + 1). x = 1: 2 = 2A so A = 1. Then (x + 1) − (x^{2} + 1) = x − x^{2} = −x(x − 1), so (Bx + C)/(x^{2} + 1) = −x/(x^{2} + 1). B = −1, C = 0.", "v": null, "h": "Linear factor and an irreducible quadratic. A = 1 by cover-up at x = 1. Then compare x²: 1 + B = 0, so B = −1, and the constant gives C = 0."}, {"c": 5, "t": "Partial Fractions", "k": "ex", "q": "Resolve (3x + 1)/((x + 1)(x − 1)^{2}) into partial fractions.", "o": ["−1/(2(x + 1)) + 1/(2(x − 1)) + 2/(x − 1)^{2}", "1/(2(x + 1)) + 1/(2(x − 1)) + 2/(x − 1)^{2}", "−1/(2(x + 1)) − 1/(2(x − 1)) + 2/(x − 1)^{2}", "−1/(2(x + 1)) + 1/(2(x − 1)) − 2/(x − 1)^{2}"], "e": "3x + 1 = A(x − 1)^{2} + B(x + 1)(x − 1) + C(x + 1). x = −1: −2 = 4A so A = −1/2. x = 1: 4 = 2C so C = 2. Compare x^{2}: 0 = A + B so B = 1/2.", "v": null, "h": "Repeated factor needs three fractions. A (x = −1): −1/2. C (x = 1): 4/2 = 2. Then B from x = 0: 1 = A − B + C, giving B = 1/2."}, {"c": 5, "t": "Partial Fractions", "k": "tu", "q": "Express 2/(x(x + 1)) in partial fractions.", "o": ["2/x − 2/(x + 1)", "2/x + 2/(x + 1)", "1/x − 1/(x + 1)", "2/x − 1/(x + 1)"], "e": "2 = A(x + 1) + Bx. x = 0: A = 2. x = −1: B = −2. So 2/x − 2/(x + 1).", "v": null, "h": "Cover-up: x = 0 gives 2/1 = 2, x = −1 gives 2/(−1) = −2. So 2/x − 2/(x + 1)."}, {"c": 5, "t": "Partial Fractions", "k": "tu", "q": "Express 1/((x − 1)(x + 3)) in partial fractions.", "o": ["1/(4(x − 1)) − 1/(4(x + 3))", "1/(4(x − 1)) + 1/(4(x + 3))", "1/(2(x − 1)) − 1/(2(x + 3))", "1/(4(x + 1)) − 1/(4(x − 3))"], "e": "1 = A(x + 3) + B(x − 1). x = 1: A = 1/4. x = −3: B = −1/4.", "v": null, "h": "Cover-up: at x = 1 the rest is 1/(x + 3) = 1/4. At x = −3 the rest is 1/(x − 1) = −1/4."}, {"c": 5, "t": "Partial Fractions", "k": "tu", "q": "Express 4x/((x + 2)(x + 3)) in partial fractions.", "o": ["−8/(x + 2) + 12/(x + 3)", "8/(x + 2) − 12/(x + 3)", "−8/(x + 2) − 12/(x + 3)", "−12/(x + 2) + 8/(x + 3)"], "e": "4x = A(x + 3) + B(x + 2). x = −2: −8 = A. x = −3: −12 = −B so B = 12.", "v": null, "h": "Cover-up: at x = −2: 4x/(x + 3) = −8. At x = −3: 4x/(x + 2) = 12. Check at x = 0: −4 + 4 = 0 ✓."}, {"c": 5, "t": "Partial Fractions", "k": "tu", "q": "Express (x − 5)/(x^{2} − 9) in partial fractions.", "o": ["4/(3(x + 3)) − 1/(3(x − 3))", "4/(3(x − 3)) − 1/(3(x + 3))", "4/(3(x + 3)) + 1/(3(x − 3))", "1/(3(x + 3)) − 4/(3(x − 3))"], "e": "x^{2} − 9 = (x − 3)(x + 3). x − 5 = A(x + 3) + B(x − 3). x = 3: −2 = 6A, A = −1/3. x = −3: −8 = −6B, B = 4/3. So 4/(3(x + 3)) − 1/(3(x − 3)).", "v": null, "h": "Factor the bottom: (x − 3)(x + 3). x = 3 gives −2/6 = −1/3. x = −3 gives −8/(−6) = 4/3."}, {"c": 5, "t": "Partial Fractions", "k": "tu", "q": "Express (4x − 3)/(2x^{2} − 5x − 3) in partial fractions.", "o": ["10/(7(2x + 1)) + 9/(7(x − 3))", "10/(7(2x + 1)) − 9/(7(x − 3))", "9/(7(2x + 1)) + 10/(7(x − 3))", "−10/(7(2x + 1)) + 9/(7(x − 3))"], "e": "2x^{2} − 5x − 3 = (2x + 1)(x − 3). Then 4x − 3 = A(x − 3) + B(2x + 1). x = 3: 9 = 7B so B = 9/7. x = −1/2: −5 = −(7/2)A so A = 10/7.", "v": null, "h": "Factor the bottom: 2x² − 5x − 3 = (2x + 1)(x − 3). x = 3 gives 9/7, and x = −1/2 gives (−5)/(−7/2) = 10/7."}, {"c": 5, "t": "Partial Fractions", "k": "tu", "q": "Express 6/((x + 1)(x − 2)(x + 3)) in partial fractions.", "o": ["−1/(x + 1) + 2/(5(x − 2)) + 3/(5(x + 3))", "1/(x + 1) + 2/(5(x − 2)) + 3/(5(x + 3))", "−1/(x + 1) + 3/(5(x − 2)) + 2/(5(x + 3))", "−1/(x + 1) − 2/(5(x − 2)) + 3/(5(x + 3))"], "e": "6 = A(x − 2)(x + 3) + B(x + 1)(x + 3) + C(x + 1)(x − 2). x = −1: 6 = −6A so A = −1. x = 2: 6 = 15B so B = 2/5. x = −3: 6 = 10C so C = 3/5.", "v": null, "h": "Cover-up gives x = −1: −1, x = 2: 2/5 and x = −3: 3/5. Check at x = 0: 6/(−6) = −1, and −1/1 + 2/(−10) + 3/15 = −1."}, {"c": 5, "t": "Partial Fractions", "k": "tu", "q": "Express 6/((x + 2)(x − 1)^{2}) in partial fractions.", "o": ["2/(3(x + 2)) − 2/(3(x − 1)) + 2/(x − 1)^{2}", "2/(3(x + 2)) + 2/(3(x − 1)) + 2/(x − 1)^{2}", "2/(3(x + 2)) − 2/(3(x − 1)) − 2/(x − 1)^{2}", "−2/(3(x + 2)) + 2/(3(x − 1)) + 2/(x − 1)^{2}"], "e": "6 = A(x − 1)^{2} + B(x + 2)(x − 1) + C(x + 2). x = −2: 6 = 9A so A = 2/3. x = 1: 6 = 3C so C = 2. Compare x^{2}: 0 = A + B so B = −2/3.", "v": null, "h": "Repeated factor (x − 1)². At x = −2: 6/9 = 2/3. At x = 1: 6/3 = 2. For the middle term use x = 0: 6/2 = 3."}, {"c": 5, "t": "Partial Fractions", "k": "tu", "q": "Express (2x − 3)/(x^{2}(x − 1)) in partial fractions.", "o": ["1/x + 3/x^{2} − 1/(x − 1)", "1/x − 3/x^{2} − 1/(x − 1)", "−1/x + 3/x^{2} + 1/(x − 1)", "1/x + 3/x^{2} + 1/(x − 1)"], "e": "2x − 3 = Ax(x − 1) + B(x − 1) + Cx^{2}. x = 0: −3 = −B so B = 3. x = 1: −1 = C. Compare x^{2}: 0 = A + C so A = 1.", "v": null, "h": "Repeated x² gives A/x + B/x² + C/(x − 1). x = 1 gives C = −1, x = 0 gives B = 3, then x = 2 gives A = 1."}, {"c": 5, "t": "Partial Fractions", "k": "tu", "q": "Express (2x^{2} − 5x + 6)/((2x − 1)^{2}(x + 2)) in partial fractions.", "o": ["−23/(25(2x − 1)) + 8/(5(2x − 1)^{2}) + 24/(25(x + 2))", "23/(25(2x − 1)) + 8/(5(2x − 1)^{2}) + 24/(25(x + 2))", "−23/(25(2x − 1)) − 8/(5(2x − 1)^{2}) + 24/(25(x + 2))", "−23/(25(2x − 1)) + 8/(5(2x − 1)^{2}) − 24/(25(x + 2))"], "e": "2x^{2} − 5x + 6 = A(2x − 1)(x + 2) + B(x + 2) + C(2x − 1)^{2}. x = −2: 24 = 25C so C = 24/25. x = 1/2: 4 = (5/2)B so B = 8/5. Compare x^{2}: 2 = 2A + 4C so A = −23/25.", "v": null, "h": "Repeated (2x − 1)². At x = −2 the coefficient is 24/25. At x = 1/2 the coefficient is 8/5. The remaining one comes from comparing x² terms."}, {"c": 5, "t": "Algebra of Polynomials", "k": "pr", "q": "What is the degree of the polynomial (x² + 1)(x³ − 2)?", "o": ["5", "6", "3", "2"], "e": "Degrees add when polynomials are multiplied: 2 + 3 = 5.", "v": null, "h": "Degrees add when you multiply: 2 + 3 = 5. The degree of a product is never less than the larger one."}, {"c": 5, "t": "Algebra of Polynomials", "k": "tr", "q": "If f(x) = x³ + x and g(x) = −x³ + 2, what is the degree of f(x) + g(x)?", "o": ["1", "3", "0", "2"], "e": "The x³ terms cancel, leaving x + 2, which has degree 1. The degree of a sum can drop.", "v": null, "h": "The x³ terms cancel: x³ + (−x³) = 0. Leaving x + 2, degree 1. A sum can drop in degree."}, {"c": 5, "t": "Algebra of Polynomials", "k": "pr", "q": "Find the coefficient of x² in the product (x + 2)(x² − 3x + 1).", "o": ["−1", "−3", "2", "1"], "e": "Expand: x³ − 3x² + x + 2x² − 6x + 2 = x³ − x² − 5x + 2. The x² coefficient is −3 + 2 = −1.", "v": null, "h": "Expand and watch the x² terms: x·(−3x) = −3x² and 2·x² = 2x². Total −1."}, {"c": 5, "t": "Solving Quadratic Equations", "k": "pr", "q": "Solve x² − 5x + 6 = 0.", "o": ["x = 2 or x = 3", "x = −2 or x = −3", "x = 1 or x = 6", "x = 5 or x = 6"], "e": "(x − 2)(x − 3) = 0 gives x = 2 or x = 3.", "v": null, "h": "Look for two numbers that multiply to 6 and add to −5: −2 and −3, so x = 2 or 3."}, {"c": 5, "t": "Solving Quadratic Equations", "k": "tr", "q": "Solve x² = 5x.", "o": ["x = 0 or x = 5", "x = 5 only", "x = 0 only", "x = ±5"], "e": "Move everything to one side: x(x − 5) = 0. Dividing both sides by x would lose the root x = 0.", "v": null, "h": "Never divide by x. Move to one side and factor: x(x − 5) = 0 gives x = 0 or 5."}, {"c": 5, "t": "Solving Quadratic Equations", "k": "tr", "q": "Solve (x − 2)(x − 3) = 6.", "o": ["x = 0 or x = 5", "x = 8 or x = 9", "x = 2 or x = 3", "x = −1 or x = 6"], "e": "Expand first: x² − 5x + 6 = 6, so x² − 5x = 0 and x = 0 or 5. The factor trick only works when the product equals ZERO.", "v": null, "h": "The factor trick needs zero on one side. Expand first: x² − 5x + 6 = 6, so x² − 5x = 0 and x = 0 or 5."}, {"c": 5, "t": "Solving Quadratic Equations", "k": "pr", "q": "Solve 2x² − x − 3 = 0.", "o": ["x = 3/2 or x = −1", "x = −3/2 or x = 1", "x = 3 or x = −1/2", "x = 3/2 or x = 1"], "e": "(2x − 3)(x + 1) = 0, so x = 3/2 or x = −1.", "v": null, "h": "Product 2 × (−3) = −6, sum −1: use 2 and −3. So (2x − 3)(x + 1) = 0."}, {"c": 5, "t": "Solving Quadratic Equations", "k": "pr", "q": "Use the formula to solve x² + 2x − 1 = 0.", "o": ["x = −1 ± √2", "x = 1 ± √2", "x = −1 ± √3", "x = −2 ± √2"], "e": "x = (−2 ± √(4 + 4))/2 = (−2 ± 2√2)/2 = −1 ± √2.", "v": null, "h": "x = (−2 ± √(4 + 4))/2. Simplify √8 = 2√2 and divide by 2: x = −1 ± √2."}, {"c": 5, "t": "Solving Quadratic Equations", "k": "pr", "q": "Solve x² − 6x + 13 = 0 by completing the square. How many real roots does it have?", "o": ["None, since (x − 3)² = −4", "Two, x = 3 ± 2", "One, x = 3", "Two, x = 3 ± √13"], "e": "(x − 3)² + 4 = 0 means (x − 3)² = −4, which is impossible for real x.", "v": null, "h": "Complete the square: (x − 3)² + 4 = 0 means (x − 3)² = −4. A square can't be negative, so there are no real roots."}, {"c": 5, "t": "Maximum and Minimum Values", "k": "pr", "q": "Find the maximum value of y = −x² + 4x + 1.", "o": ["5", "1", "4", "−5"], "e": "a = −1 so there is a maximum at x = 2. y = −4 + 8 + 1 = 5.", "v": null, "h": "x = −b/2a = 2 and y = −4 + 8 + 1 = 5. The negative x² means it is a maximum."}, {"c": 5, "t": "Maximum and Minimum Values", "k": "pr", "q": "Find the minimum value of y = x² − 6x + 13.", "o": ["4", "13", "3", "−4"], "e": "(x − 3)² + 4, so the minimum value is 4 at x = 3.", "v": null, "h": "Complete the square: x² − 6x + 13 = (x − 3)² + 4. Minimum is 4."}, {"c": 5, "t": "Maximum and Minimum Values", "k": "tr", "q": "Find the x-value where y = 2x² − 8x + 3 is smallest.", "o": ["x = 2", "x = −2", "x = 4", "x = −5"], "e": "x = −b/2a = 8/4 = 2. The question asks for x, not for the minimum value (which is −5).", "v": null, "h": "Careful: they ask for x, not the minimum value. x = −b/2a = 8/4 = 2."}, {"c": 5, "t": "Nature of Roots", "k": "pr", "q": "Find the discriminant of 2x² − 3x + 5.", "o": ["−31", "49", "−11", "31"], "e": "b² − 4ac = 9 − 40 = −31. Negative means no real roots.", "v": null, "h": "Discriminant = b² − 4ac = 9 − 40 = −31. Mind the c = 5 and a = 2."}, {"c": 5, "t": "Nature of Roots", "k": "pr", "q": "What can be said about the roots of x² − 6x + 9 = 0?", "o": ["Real and equal", "Real and distinct", "Complex", "Rational and distinct"], "e": "b² − 4ac = 36 − 36 = 0, so there are two equal real roots (x = 3 twice).", "v": null, "h": "b² − 4ac = 36 − 36 = 0, so the roots are equal. Or spot (x − 3)²."}, {"c": 5, "t": "Nature of Roots", "k": "pr", "q": "Find the values of k for which x² + kx + 4 = 0 has equal roots.", "o": ["k = 4 or k = −4", "k = 4 only", "k = 16", "k = 2 or k = −2"], "e": "k² − 16 = 0 gives k = ±4. Both signs work.", "v": null, "h": "Equal roots: k² − 16 = 0, so k = ±4. Two values, not one."}, {"c": 5, "t": "Nature of Roots", "k": "tr", "q": "Which condition means a quadratic has NO real roots?", "o": ["b² − 4ac < 0", "b² − 4ac > 0", "b² − 4ac = 0", "b² < 4a"], "e": "A negative discriminant means the square root of a negative number appears, so no real roots.", "v": null, "h": "No real roots means a negative discriminant: b² − 4ac < 0. Remember the direction."}, {"c": 5, "t": "Sum and Product of Roots", "k": "pr", "q": "If α and β are the roots of 3x² − 7x + 2 = 0, find α + β and αβ.", "o": ["7/3 and 2/3", "−7/3 and 2/3", "7/3 and −2/3", "2/3 and 7/3"], "e": "α + β = −b/a = 7/3 and αβ = c/a = 2/3.", "v": null, "h": "Sum = −b/a = 7/3 and product = c/a = 2/3. Two lines, no solving."}, {"c": 5, "t": "Sum and Product of Roots", "k": "tr", "q": "Find the sum of the roots of x² + 5x − 6 = 0.", "o": ["−5", "5", "6", "−6"], "e": "Sum of roots = −b/a = −5. The minus sign in the formula is easy to forget.", "v": null, "h": "Sum of roots = −b/a = −5. The negative sign is the trap."}, {"c": 5, "t": "Sum and Product of Roots", "k": "pr", "q": "If α and β are the roots of x² − 4x + 1 = 0, find α² + β².", "o": ["14", "16", "15", "18"], "e": "α² + β² = (α + β)² − 2αβ = 16 − 2 = 14.", "v": null, "h": "Use α² + β² = (α + β)² − 2αβ = 16 − 2 = 14."}, {"c": 5, "t": "Sum and Product of Roots", "k": "pr", "q": "If α and β are the roots of 2x² − 5x + 1 = 0, find 1/α + 1/β.", "o": ["5", "5/2", "2/5", "1/2"], "e": "1/α + 1/β = (α + β)/αβ = (5/2)/(1/2) = 5.", "v": null, "h": "1/α + 1/β = (α + β)/(αβ) = (5/2)/(1/2) = 5."}, {"c": 5, "t": "Forming Equations from Roots", "k": "pr", "q": "Form the quadratic equation whose roots are 2 and −3.", "o": ["x² + x − 6 = 0", "x² − x − 6 = 0", "x² + x + 6 = 0", "x² − 5x − 6 = 0"], "e": "Sum = −1, product = −6. x² − (sum)x + product = x² + x − 6 = 0.", "v": null, "h": "Sum = 2 + (−3) = −1, product = −6. Use x² − (sum)x + product = x² + x − 6."}, {"c": 5, "t": "Forming Equations from Roots", "k": "pr", "q": "If α and β are the roots of x² − 3x + 1 = 0, form the equation with roots α + 1 and β + 1.", "o": ["x² − 5x + 5 = 0", "x² − 5x + 1 = 0", "x² − x + 5 = 0", "x² − 3x + 5 = 0"], "e": "Sum = 3 + 2 = 5. Product = αβ + (α + β) + 1 = 1 + 3 + 1 = 5.", "v": null, "h": "New sum = 3 + 2 = 5. New product = αβ + (α + β) + 1 = 1 + 3 + 1 = 5."}, {"c": 5, "t": "Forming Equations from Roots", "k": "pr", "q": "If α and β are the roots of x² − 3x + 1 = 0, form the equation whose roots are 2α and 2β.", "o": ["x² − 6x + 4 = 0", "x² − 6x + 2 = 0", "x² − 3x + 4 = 0", "x² − 6x + 1 = 0"], "e": "Sum = 6. Product = 4αβ = 4. So x² − 6x + 4 = 0.", "v": null, "h": "New sum = 2 × 3 = 6 and new product = 4 × 1 = 4. Doubling roots multiplies the sum by 2 but the product by 4."}, {"c": 5, "t": "Roots of Cubic Equations", "k": "pr", "q": "What is the sum of the roots of x³ − 6x² + 11x − 6 = 0?", "o": ["6", "−6", "11", "−11"], "e": "Sum of roots = −b/a = 6. (The roots are 1, 2 and 3.)", "v": null, "h": "Sum of roots of a cubic = −b/a = 6. Don't forget the sign."}, {"c": 5, "t": "Roots of Cubic Equations", "k": "tr", "q": "Find the product of the roots of x³ + 2x² − 5x − 6 = 0.", "o": ["6", "−6", "−2", "5"], "e": "Product of roots of a cubic = −d/a = 6. The sign alternates: sum is −b/a, but the product is −d/a.", "v": null, "h": "Product of roots of a cubic = −d/a = 6. The product takes −d/a, not d/a."}, {"c": 5, "t": "Roots of Cubic Equations", "k": "pr", "q": "For 2x³ − 3x² + 5x − 7 = 0 with roots α, β, γ, find αβ + βγ + γα.", "o": ["5/2", "−5/2", "3/2", "7/2"], "e": "The sum of the pair products is c/a = 5/2.", "v": null, "h": "The sum of pair products of a cubic is c/a = 5/2. No sign change here."}, {"c": 5, "t": "Remainder Theorem", "k": "pr", "q": "Find the remainder when x³ − 2x + 1 is divided by (x − 2).", "o": ["5", "1", "−3", "7"], "e": "Remainder = f(2) = 8 − 4 + 1 = 5.", "v": null, "h": "Substitute x = 2: 8 − 4 + 1 = 5."}, {"c": 5, "t": "Remainder Theorem", "k": "tr", "q": "Find the remainder when 2x³ + x² − 5 is divided by (x + 1).", "o": ["−6", "4", "−4", "6"], "e": "Put x = −1 (not +1): −2 + 1 − 5 = −6.", "v": null, "h": "For (x + 1) substitute x = −1, not 1: −2 + 1 − 5 = −6."}, {"c": 5, "t": "Remainder Theorem", "k": "tr", "q": "Find the remainder when 4x³ − 2x² + x − 3 is divided by (2x − 1).", "o": ["−5/2", "−3", "5/2", "1/2"], "e": "Put x = 1/2: 4/8 − 2/4 + 1/2 − 3 = −5/2.", "v": null, "h": "For 2x − 1 use x = 1/2: 4/8 − 2/4 + 1/2 − 3 = −5/2."}, {"c": 5, "t": "Remainder Theorem", "k": "pr", "q": "The remainder when x² + kx + 1 is divided by (x − 1) is 5. Find k.", "o": ["3", "4", "5", "2"], "e": "f(1) = 1 + k + 1 = 5, so k = 3.", "v": null, "h": "Set f(1) = 1 + k + 1 = 5. So k = 3."}, {"c": 5, "t": "Factor Theorem", "k": "pr", "q": "Is (x − 1) a factor of x³ − 3x + 2?", "o": ["Yes, since f(1) = 0", "No, since f(1) = 2", "No, since f(−1) = 4", "Yes, since f(0) = 2"], "e": "f(1) = 1 − 3 + 2 = 0, so (x − 1) is a factor.", "v": null, "h": "Plug in x = 1: 1 − 3 + 2 = 0, so yes. A zero value means it's a factor."}, {"c": 5, "t": "Factor Theorem", "k": "pr", "q": "If (x − 2) is a factor of x³ − kx + 6, find k.", "o": ["7", "−7", "4", "5"], "e": "f(2) = 8 − 2k + 6 = 0, so k = 7.", "v": null, "h": "f(2) = 8 − 2k + 6 = 0 gives k = 7."}, {"c": 5, "t": "Factor Theorem", "k": "pr", "q": "Factorise x³ − 7x + 6 completely.", "o": ["(x − 1)(x − 2)(x + 3)", "(x + 1)(x + 2)(x − 3)", "(x − 1)(x + 2)(x + 3)", "(x − 1)(x − 2)(x − 3)"], "e": "f(1) = 0 and f(2) = 0, and the sum of roots is 0 so the third root is −3.", "v": null, "h": "Test x = 1 and x = 2 (both give 0). The sum of the roots is 0 (no x² term), so the third is −3."}, {"c": 5, "t": "Division of Polynomials", "k": "pr", "q": "Find the quotient when x³ − 1 is divided by x − 1.", "o": ["x² + x + 1", "x² − x + 1", "x² + 1", "x² − 1"], "e": "x³ − 1 = (x − 1)(x² + x + 1).", "v": null, "h": "x³ − 1 = (x − 1)(x² + x + 1) is a standard identity. Remember it."}, {"c": 5, "t": "Division of Polynomials", "k": "tr", "q": "Divide x³ + 8 by x + 2. What are the quotient and remainder?", "o": ["x² − 2x + 4, remainder 0", "x² + 2x + 4, remainder 0", "x² − 2x + 4, remainder 16", "x² + 4, remainder 8"], "e": "x³ + 8 = (x + 2)(x² − 2x + 4), and the remainder is f(−2) = −8 + 8 = 0.", "v": null, "h": "Sum of cubes: x³ + 8 = (x + 2)(x² − 2x + 4). The remainder at x = −2 is zero."}, {"c": 5, "t": "Partial Fractions", "k": "pr", "q": "Which form do we use for 1/((x − 1)(x + 2))?", "o": ["A/(x − 1) + B/(x + 2)", "A/((x − 1)(x + 2))", "(Ax + B)/((x − 1)(x + 2))", "A/(x − 1) × B/(x + 2)"], "e": "One simple fraction for each distinct linear factor.", "v": null, "h": "One simple fraction per DISTINCT linear factor: A/(x − 1) + B/(x + 2)."}, {"c": 5, "t": "Partial Fractions", "k": "pr", "q": "Which form do we use for 1/(x(x + 1)²)?", "o": ["A/x + B/(x + 1) + C/(x + 1)²", "A/x + B/(x + 1)²", "A/x + (Bx + C)/(x + 1)²", "A/x + B/(x + 1)"], "e": "A repeated factor needs one fraction for each power: (x + 1) and (x + 1)².", "v": null, "h": "A repeated factor needs one term for each power: (x + 1) and (x + 1)². So A/x + B/(x + 1) + C/(x + 1)²."}, {"c": 5, "t": "Partial Fractions", "k": "pr", "q": "Which form do we use for (x + 1)/((x − 2)(x² + 3))?", "o": ["A/(x − 2) + (Bx + C)/(x² + 3)", "A/(x − 2) + B/(x² + 3)", "(Ax + B)/(x − 2) + C/(x² + 3)", "A/(x − 2) + B/(x + 3)"], "e": "A quadratic factor that does not factorise needs a LINEAR numerator Bx + C.", "v": null, "h": "A quadratic that doesn't factorise needs a LINEAR top (Bx + C), not just a constant."}, {"c": 5, "t": "Partial Fractions", "k": "tr", "q": "(x² + 1)/((x − 1)(x + 1)) has the same degree on top and bottom. What must be done first?", "o": ["Divide to remove a whole number part", "Write A/(x − 1) + B/(x + 1) directly", "Cancel the x²", "Multiply out the denominator only"], "e": "Partial fractions need the numerator degree below the denominator degree. Dividing first gives 1 + 2/(x² − 1).", "v": null, "h": "If degrees are equal (top degree ≥ bottom degree) divide first. Partial fractions only work on proper fractions."}, {"c": 5, "t": "Partial Fractions", "k": "pr", "q": "Resolve 5/((x − 1)(x + 4)) into partial fractions.", "o": ["1/(x − 1) − 1/(x + 4)", "1/(x − 1) + 1/(x + 4)", "5/(x − 1) − 5/(x + 4)", "1/(x + 1) − 1/(x − 4)"], "e": "5 = A(x + 4) + B(x − 1). x = 1 gives A = 1. x = −4 gives B = −1.", "v": null, "h": "Cover-up: x = 1 gives 5/(1 + 4) = 1, and x = −4 gives 5/(−5) = −1."}, {"c": 5, "t": "Partial Fractions", "k": "pr", "q": "Resolve 1/(x² − 1) into partial fractions.", "o": ["1/(2(x − 1)) − 1/(2(x + 1))", "1/(x − 1) − 1/(x + 1)", "1/(2(x − 1)) + 1/(2(x + 1))", "1/(2(x + 1)) − 1/(2(x − 1))"], "e": "x² − 1 = (x − 1)(x + 1). 1 = A(x + 1) + B(x − 1). x = 1 gives A = 1/2. x = −1 gives B = −1/2.", "v": null, "h": "x² − 1 = (x − 1)(x + 1). Cover-up: x = 1 gives 1/2, x = −1 gives −1/2."}, {"c": 5, "t": "Partial Fractions", "k": "pr", "q": "In 7/((x − 1)(x + 2)) = A/(x − 1) + B/(x + 2), find A.", "o": ["7/3", "7", "−7/3", "1/3"], "e": "Cover up (x − 1) and put x = 1 in what remains: 7/(1 + 2) = 7/3.", "v": null, "h": "Cover-up: delete (x − 1) and put x = 1 in what is left: 7/(1 + 2) = 7/3."}, {"c": 6, "t": "Permutation", "k": "ex", "q": "In how many ways can 8 objects be arranged from 10 objects?", "o": ["1,814,400", "3,628,800", "45", "181,440"], "e": "^{10}P_{8} = 10!/(10 − 8)! = 10!/2! = 3,628,800/2 = 1,814,400.", "v": null, "h": "Order matters, so it is 10P8 = 10!/2! = 10 × 9 × … × 3. Divide by the leftover (10 − 8)!."}, {"c": 6, "t": "Permutation", "k": "ex", "q": "Find the number of ways of arranging 4 different conical flasks from 6 conical flasks.", "o": ["360", "15", "720", "24"], "e": "^{6}P_{4} = 6!/2! = 720/2 = 360.", "v": null, "h": "6P4 = 6 × 5 × 4 × 3 = 360. Write exactly 4 descending factors."}, {"c": 6, "t": "Permutation", "k": "ex", "q": "Find the number of arrangements that can be made using the letters of the word NIGERIAN.", "o": ["10,080", "40,320", "20,160", "5,040"], "e": "8 letters, with N twice and I twice: 8!/(2! × 2!) = 40,320/4 = 10,080.", "v": null, "h": "Repeated letters: N twice and I twice. 8!/(2! × 2!) = 40320/4 = 10,080."}, {"c": 6, "t": "Combination", "k": "ex", "q": "In how many ways can four boys be chosen from 6 boys?", "o": ["15", "360", "30", "24"], "e": "^{6}C_{4} = 6!/(4! 2!) = 15.", "v": null, "h": "6C4 = 6C2 (flip to the smaller number) = 6 × 5/2 = 15."}, {"c": 6, "t": "Combination", "k": "ex", "q": "In how many ways can a team of 11 players be selected from 14 boys?", "o": ["364", "1001", "2002", "182"], "e": "^{14}C_{11} = 14!/(11! 3!) = (14 × 13 × 12)/(3 × 2 × 1) = 364.", "v": null, "h": "14C11 = 14C3 = (14 × 13 × 12)/6 = 364. Choose the smaller of r and n − r."}, {"c": 6, "t": "Permutation", "k": "tu", "q": "Evaluate 17!/(8! 10!).", "o": ["2431", "24310", "4862", "243"], "e": "17!/(8! 10!) = [17!/(8! 9!)]/10 = ^{17}C_{8}/10 = 24,310/10 = 2431.", "v": null, "h": "8 + 10 is not 17, so it is not a pure combination. Write 17C8 = 24,310, which uses 8! × 9!, and divide by 10 to cover 10!/9!. Answer 2,431."}, {"c": 6, "t": "Permutation", "k": "tu", "q": "Evaluate 10!/8!.", "o": ["90", "80", "45", "720"], "e": "10!/8! = 10 × 9 = 90.", "v": null, "h": "10!/8! = 10 × 9 = 90. Cancel the common factorial."}, {"c": 6, "t": "Permutation", "k": "tu", "q": "Evaluate ^{8}P_{3}.", "o": ["336", "56", "512", "24"], "e": "^{8}P_{3} = 8 × 7 × 6 = 336.", "v": null, "h": "8P3 = 8 × 7 × 6 = 336. Three descending factors from 8."}, {"c": 6, "t": "Permutation", "k": "tu", "q": "Evaluate ^{17}P_{15}.", "o": ["177,843,714,048,000", "355,687,428,096,000", "88,921,857,024,000", "1,422,749,712,384,000"], "e": "^{17}P_{15} = 17!/2! = 355,687,428,096,000/2 = 177,843,714,048,000.", "v": null, "h": "17P15 = 17!/2!. It is huge, so just recognise the pattern n!/(n − r)!. Compare the number of digits (15 digits)."}, {"c": 6, "t": "Combination", "k": "tu", "q": "Evaluate ^{3}C_{2}.", "o": ["3", "6", "2", "1"], "e": "^{3}C_{2} = 3!/(2! 1!) = 3.", "v": null, "h": "3C2 = 3C1 = 3."}, {"c": 6, "t": "Combination", "k": "tu", "q": "Which of these is equal to ^{100}C_{86}?", "o": ["^{100}C_{14}", "^{100}C_{85}", "^{100}P_{14}", "^{86}C_{100}"], "e": "Use ^{n}C_{r} = ^{n}C_{n−r}: ^{100}C_{86} = ^{100}C_{14} = 44,186,942,677,323,600.", "v": null, "h": "nCr = nC(n − r), so 100C86 = 100C14. Match r + (n − r) = n."}, {"c": 6, "t": "Permutation", "k": "tu", "q": "In how many ways can the letters of the word MATHEMATICS be arranged?", "o": ["4,989,600", "39,916,800", "9,979,200", "19,958,400"], "e": "11 letters with M, A and T each twice: 11!/(2! 2! 2!) = 39,916,800/8 = 4,989,600.", "v": null, "h": "MATHEMATICS has 11 letters with M, A, T each twice: 11!/(2! 2! 2!) = 39,916,800/8 = 4,989,600."}, {"c": 6, "t": "Permutation", "k": "tu", "q": "In how many ways can the letters of the word STATIONARY be arranged?", "o": ["907,200", "1,814,400", "3,628,800", "453,600"], "e": "10 letters with T twice and A twice: 10!/(2! 2!) = 3,628,800/4 = 907,200.", "v": null, "h": "STATIONARY has 10 letters with T twice and A twice: 10!/(2! × 2!) = 3,628,800/4 = 907,200."}, {"c": 6, "t": "Permutation", "k": "tu", "q": "In how many ways can the letters of the word LAWAL be arranged?", "o": ["30", "60", "120", "15"], "e": "5 letters with L twice and A twice: 5!/(2! 2!) = 120/4 = 30.", "v": null, "h": "LAWAL has 5 letters, L twice and A twice: 5!/(2! 2!) = 120/4 = 30."}, {"c": 6, "t": "Permutation", "k": "tu", "q": "In how many ways can the letters of the word MEDIAN be arranged?", "o": ["720", "360", "120", "46,656"], "e": "All 6 letters are different: 6! = 720.", "v": null, "h": "MEDIAN has 6 different letters: 6! = 720. Check for repeats first."}, {"c": 6, "t": "Permutation", "k": "tu", "q": "Six people sit at a round table. In how many ways can two particular people sit next to each other?", "o": ["48", "240", "120", "24"], "e": "Treat the pair as one person: 5 units round a table give (5 − 1)! = 24 ways. The pair can swap places in 2 ways: 24 × 2 = 48.", "v": null, "h": "Glue the pair: treat them as one unit. 5 units at a round table give 4! = 24. The pair can swap: × 2 = 48."}, {"c": 6, "t": "Combination", "k": "tu", "q": "Seven men volunteer to dig a well. Find the number of ways five of them can be chosen for the job.", "o": ["21", "42", "2520", "35"], "e": "^{7}C_{5} = 7!/(5! 2!) = 21.", "v": null, "h": "7C5 = 7C2 = 21. Choosing 5 is the same as choosing the 2 to leave out."}, {"c": 6, "t": "Binomial Expansion", "k": "ex", "q": "What is the coefficient of a^{2}b^{3} in the expansion of (a + b)^{5}?", "o": ["10", "5", "20", "15"], "e": "(a + b)^{5} = a^{5} + 5a^{4}b + 10a^{3}b^{2} + 10a^{2}b^{3} + 5ab^{4} + b^{5}. The coefficient is ^{5}C_{3} = 10.", "v": null, "h": "The coefficient of a²b³ in (a + b)⁵ is 5C2 = 10. Use the power of a (or b) to pick r."}, {"c": 6, "t": "Binomial Expansion", "k": "ex", "q": "Expand (x + 1)^{5}.", "o": ["x^{5} + 5x^{4} + 10x^{3} + 10x^{2} + 5x + 1", "x^{5} + 4x^{4} + 6x^{3} + 4x^{2} + x + 1", "x^{5} + 5x^{4} + 10x^{3} + 5x^{2} + 10x + 1", "x^{5} + 10x^{4} + 5x^{3} + 5x^{2} + 10x + 1"], "e": "Use coefficients 1, 5, 10, 10, 5, 1 with a = x and b = 1.", "v": null, "h": "Pascal's row 5: 1, 5, 10, 10, 5, 1. Just write the coefficients next to the powers."}, {"c": 6, "t": "Binomial Expansion", "k": "ex", "q": "Expand (3x − 2)^{5}.", "o": ["243x^{5} − 810x^{4} + 1080x^{3} − 720x^{2} + 240x − 32", "243x^{5} + 810x^{4} + 1080x^{3} + 720x^{2} + 240x + 32", "243x^{5} − 810x^{4} − 1080x^{3} − 720x^{2} − 240x − 32", "81x^{5} − 270x^{4} + 360x^{3} − 240x^{2} + 80x − 32"], "e": "a = 3x, b = −2: (3x)^{5} + 5(3x)^{4}(−2) + 10(3x)^{3}(4) + 10(3x)^{2}(−8) + 5(3x)(16) + (−32) = 243x^{5} − 810x^{4} + 1080x^{3} − 720x^{2} + 240x − 32.", "v": null, "h": "Coefficients 1, 5, 10, 10, 5, 1 and powers of 3x and −2: 243, −810, 1080, −720, 240, −32. Check: put x = 1, the total must be (3 − 2)⁵ = 1."}, {"c": 6, "t": "Binomial Expansion", "k": "ex", "q": "Find the exact value of (1.01)^{5} using the binomial expansion.", "o": ["1.0510100501", "1.0510100510", "1.051", "1.0501010051"], "e": "(1 + 0.01)^{5} = 1 + 0.05 + 0.001 + 0.00001 + 0.0000000005 + 0.0000000001 ... = 1.0510100501.", "v": null, "h": "Write 1.01⁵ = (1 + 0.01)⁵: 1 + 0.05 + 0.001 + 0.00001 + 0.00000005 + 0.0000000001. The 'exact' answer has 10 decimals."}, {"c": 6, "t": "Binomial Expansion", "k": "ex", "q": "Find the first four terms of (x + 1)^{11} in descending powers of x.", "o": ["x^{11} + 11x^{10} + 55x^{9} + 165x^{8}", "x^{11} + 11x^{10} + 110x^{9} + 330x^{8}", "x^{11} + 10x^{10} + 45x^{9} + 120x^{8}", "x^{11} + 11x^{10} + 55x^{9} + 156x^{8}"], "e": "Coefficients are ^{11}C_{0}, ^{11}C_{1}, ^{11}C_{2}, ^{11}C_{3} = 1, 11, 55, 165.", "v": null, "h": "Coefficients 1, 11, 55, 165: 11C0, 11C1, 11C2 = 55, 11C3 = 165. Powers of x go down from 11."}, {"c": 6, "t": "Binomial Expansion", "k": "tu", "q": "Expand (b + 6)^{6}.", "o": ["b^{6} + 36b^{5} + 540b^{4} + 4320b^{3} + 19440b^{2} + 46656b + 46656", "b^{6} + 6b^{5} + 15b^{4} + 20b^{3} + 15b^{2} + 6b + 1", "b^{6} + 36b^{5} + 540b^{4} + 4320b^{3} + 19440b^{2} + 46656b + 6", "b^{6} + 36b^{5} + 360b^{4} + 2160b^{3} + 9720b^{2} + 46656b + 46656"], "e": "Coefficients 1, 6, 15, 20, 15, 6, 1 times powers of 6: 6, 36, 216, 1296, 7776, 46656 give 36, 540, 4320, 19440, 46656, 46656.", "v": null, "h": "Row 6: 1, 6, 15, 20, 15, 6, 1. Multiply by the powers of 6: 6, 36, 216, 1296, 7776, 46656."}, {"c": 6, "t": "Binomial Expansion", "k": "tu", "q": "Write the first three terms (descending powers of x) of (2x + 3y)^{7}.", "o": ["128x^{7} + 1344x^{6}y + 6048x^{5}y^{2}", "128x^{7} + 448x^{6}y + 672x^{5}y^{2}", "128x^{7} + 1344x^{6}y + 3024x^{5}y^{2}", "64x^{7} + 672x^{6}y + 3024x^{5}y^{2}"], "e": "(2x)^{7} = 128x^{7}; 7(2x)^{6}(3y) = 1344x^{6}y; 21(2x)^{5}(3y)^{2} = 21 × 32 × 9 = 6048x^{5}y^{2}.", "v": null, "h": "Coefficients 1, 7, 21 times powers of 2 and 3: 2⁷ = 128, 7 × 2⁶ × 3 = 1344, 21 × 2⁵ × 9 = 6048."}, {"c": 6, "t": "Binomial Expansion", "k": "tu", "q": "Expand (1 − 2x)^{6}.", "o": ["1 − 12x + 60x^{2} − 160x^{3} + 240x^{4} − 192x^{5} + 64x^{6}", "1 + 12x + 60x^{2} + 160x^{3} + 240x^{4} + 192x^{5} + 64x^{6}", "1 − 12x + 30x^{2} − 40x^{3} + 30x^{4} − 12x^{5} + x^{6}", "1 − 12x + 60x^{2} − 160x^{3} + 240x^{4} − 192x^{5} + 32x^{6}"], "e": "Coefficients 1, 6, 15, 20, 15, 6, 1 times powers of (−2x): 1, −2, 4, −8, 16, −32, 64.", "v": null, "h": "Row 6: 1, 6, 15, 20, 15, 6, 1 with (−2x)^r: signs alternate. 1, −12, 60, −160, 240, −192, 64. Check x = 1: (1 − 2)⁶ = 1."}, {"c": 6, "t": "Binomial Expansion", "k": "tu", "q": "Write the first three terms (descending powers of a) of (3a − 2b)^{8}.", "o": ["6561a^{8} − 34992a^{7}b + 81648a^{6}b^{2}", "6561a^{8} − 17496a^{7}b + 20412a^{6}b^{2}", "6561a^{8} + 34992a^{7}b + 81648a^{6}b^{2}", "2187a^{8} − 11664a^{7}b + 27216a^{6}b^{2}"], "e": "(3a)^{8} = 6561a^{8}; 8(3a)^{7}(−2b) = −34992a^{7}b; 28(3a)^{6}(4b^{2}) = 81648a^{6}b^{2}.", "v": null, "h": "Row 8: 1, 8, 28. Powers of 3 go down: 3⁸ = 6561, 8 × 3⁷ × (−2) = −34,992, 28 × 3⁶ × 4 = 81,648."}, {"c": 6, "t": "Binomial Expansion", "k": "tu", "q": "Find the term in x² in the expansion of (1 − x)^{7}.", "o": ["21x²", "−21x²", "35x²", "7x²"], "e": "The x² term is ^{7}C_{2}(−x)² = 21x².", "v": null, "h": "The x² term is 7C2 (−x)² = 21x². An even power makes the sign positive."}, {"c": 6, "t": "Binomial Expansion", "k": "tu", "q": "Find the term in x^{6} in the expansion of (1 − x²)^{7}.", "o": ["−35x^{6}", "35x^{6}", "−21x^{6}", "−7x^{6}"], "e": "x^{6} comes from (−x²)³: ^{7}C_{3}(−1)³x^{6} = −35x^{6}.", "v": null, "h": "Let y = x²: (1 − y)⁷, x⁶ means y³. Term = 7C3 (−y)³ = −35 x⁶."}, {"c": 6, "t": "Binomial Expansion", "k": "tu", "q": "Find the term in a²b⁴ in the expansion of (2a − 3b)^{6}.", "o": ["4860a²b⁴", "−4860a²b⁴", "1620a²b⁴", "2160a²b⁴"], "e": "^{6}C_{4}(2a)²(−3b)⁴ = 15 × 4 × 81 = 4860a²b⁴.", "v": null, "h": "Pick r = 4 for b⁴: 6C4 = 15. Then 2² = 4 and (−3)⁴ = 81. So 15 × 4 × 81 = 4860, positive."}, {"c": 6, "t": "Binomial Expansion", "k": "tu", "q": "Using the binomial theorem, evaluate (1.001)^{8} correct to 6 decimal places.", "o": ["1.008028", "1.008280", "1.080280", "1.008008"], "e": "(1 + 0.001)^{8} = 1 + 0.008 + 28(0.000001) + 56(0.000000001) + ... = 1.008028.", "v": null, "h": "Use (1 + 0.001)⁸ = 1 + 0.008 + 28(0.000001) + 56(0.000000001): 1.008 + 0.000028 = 1.008028. Stop where the next term is smaller than the 6th decimal."}, {"c": 6, "t": "Binomial Expansion", "k": "tu", "q": "Using the binomial theorem, evaluate (0.99)^{5} correct to 5 decimal places.", "o": ["0.95099", "0.95101", "0.90099", "1.05101"], "e": "(1 − 0.01)^{5} = 1 − 0.05 + 0.001 − 0.00001 + ... = 0.95099.", "v": null, "h": "Write 0.99 = 1 − 0.01. Then 1 − 0.05 + 0.001 − 0.00001 = 0.95099. Stop when the terms are below 5 decimals."}, {"c": 6, "t": "Binomial Expansion", "k": "tu", "q": "Using the binomial theorem, evaluate (1.01)^{9} correct to 5 decimal places.", "o": ["1.09369", "1.09000", "1.09368", "1.10369"], "e": "(1 + 0.01)^{9} = 1 + 0.09 + 36(0.0001) + 84(0.000001) + 126(0.00000001) + ... = 1.09369.", "v": null, "h": "(1 + 0.01)⁹ = 1 + 0.09 + 0.0036 + 0.000084 + 0.00000126 = 1.09369. Four terms give 5 decimal places."}, {"c": 6, "t": "Permutation", "k": "pr", "q": "Evaluate 5!.", "o": ["120", "25", "240", "60"], "e": "5! = 5 × 4 × 3 × 2 × 1 = 120.", "v": null, "h": "5! = 5 × 4 × 3 × 2 × 1 = 120."}, {"c": 6, "t": "Permutation", "k": "tr", "q": "What is the value of 0!?", "o": ["1", "0", "Undefined", "−1"], "e": "By definition 0! = 1. This is needed so that the formulas for nCr work when r = 0 or r = n.", "v": null, "h": "0! = 1 by definition. Memorise it, it's a classic trap."}, {"c": 6, "t": "Permutation", "k": "pr", "q": "Evaluate ^{7}P_{3}.", "o": ["210", "343", "35", "420"], "e": "^{7}P_{3} = 7 × 6 × 5 = 210.", "v": null, "h": "7P3 = 7 × 6 × 5 = 210. Three factors."}, {"c": 6, "t": "Permutation", "k": "pr", "q": "How many different arrangements can be made from the letters of the word BOOK?", "o": ["12", "24", "6", "22"], "e": "4 letters with O repeated twice: 4!/2! = 12. (24 would be correct if all letters were different.)", "v": null, "h": "BOOK has 4 letters with O twice: 4!/2! = 12."}, {"c": 6, "t": "Permutation", "k": "tr", "q": "How many different arrangements can be made from the letters of the word SUCCESS?", "o": ["420", "5,040", "840", "210"], "e": "7 letters with S three times and C twice: 7!/(3! × 2!) = 5040/12 = 420.", "v": null, "h": "SUCCESS has 7 letters: S three times and C twice. 7!/(3! × 2!) = 5040/12 = 420."}, {"c": 6, "t": "Permutation", "k": "tr", "q": "How many different arrangements can be made from the letters of the word LEVEL?", "o": ["30", "60", "120", "15"], "e": "5 letters with L twice and E twice: 5!/(2! × 2!) = 30.", "v": null, "h": "LEVEL has 5 letters: L twice, E twice. 5!/(2! 2!) = 30."}, {"c": 6, "t": "Permutation", "k": "pr", "q": "In how many ways can 5 different books be arranged on a shelf?", "o": ["120", "240", "60", "130"], "e": "5! = 120.", "v": null, "h": "Different objects in a row: 5! = 120."}, {"c": 6, "t": "Permutation", "k": "tr", "q": "Five people stand in a queue. In how many ways can they stand if two particular people, A and B, must stand together?", "o": ["48", "24", "120", "96"], "e": "Treat A and B as one block: 4! arrangements. The block can be arranged in 2 ways (AB or BA): 4! × 2 = 48.", "v": null, "h": "Glue A and B as one block: 4! = 24 arrangements, and A and B can swap, ×2 = 48."}, {"c": 6, "t": "Permutation", "k": "pr", "q": "In how many ways can 6 people sit around a round table?", "o": ["120", "720", "240", "60"], "e": "For a circular arrangement fix one person: (6 − 1)! = 120, not 6! = 720.", "v": null, "h": "Circular arrangement is (n − 1)! = 5! = 120. Fix one person, arrange the rest."}, {"c": 6, "t": "Permutation", "k": "pr", "q": "How many 3-digit numbers can be formed from the digits 1, 2, 3, 4, 5 if no digit is repeated?", "o": ["60", "125", "120", "30"], "e": "^{5}P_{3} = 5 × 4 × 3 = 60.", "v": null, "h": "Order matters: 5 × 4 × 3 = 60, i.e. 5P3."}, {"c": 6, "t": "Permutation", "k": "tr", "q": "How many 3-digit numbers can be formed from the digits 1, 2, 3, 4, 5 if digits MAY be repeated?", "o": ["125", "60", "250", "62"], "e": "Each of the three places can be filled in 5 ways: 5³ = 125. Repetition allowed means no reduction at each step.", "v": null, "h": "Repeats allowed: 5 choices in each of 3 places: 5³ = 125."}, {"c": 6, "t": "Permutation", "k": "tr", "q": "How many even 3-digit numbers can be formed from 1, 2, 3, 4, 5 with no repeated digit?", "o": ["24", "60", "30", "48"], "e": "The last digit must be 2 or 4 (2 choices). Then fill the first place in 4 ways and the middle in 3 ways: 2 × 4 × 3 = 24.", "v": null, "h": "Fill the restricted place first: the last digit must be 2 or 4 (2 ways). Then 4 × 3 for the other two: 2 × 12 = 24."}, {"c": 6, "t": "Combination", "k": "pr", "q": "Evaluate ^{8}C_{3}.", "o": ["56", "336", "112", "28"], "e": "^{8}C_{3} = 8!/(3! 5!) = (8 × 7 × 6)/(3 × 2 × 1) = 56.", "v": null, "h": "8C3 = (8 × 7 × 6)/(3 × 2 × 1) = 56."}, {"c": 6, "t": "Combination", "k": "pr", "q": "Evaluate ^{10}C_{7}.", "o": ["120", "720", "240", "60"], "e": "^{10}C_{7} = ^{10}C_{3} = (10 × 9 × 8)/6 = 120.", "v": null, "h": "10C7 = 10C3 = (10 × 9 × 8)/6 = 120. Flip to the smaller number."}, {"c": 6, "t": "Combination", "k": "pr", "q": "What is the value of ^{5}C_{0}?", "o": ["1", "0", "5", "Undefined"], "e": "There is exactly one way to choose nothing, so ^{n}C_{0} = 1.", "v": null, "h": "nC0 = 1 for any n."}, {"c": 6, "t": "Combination", "k": "pr", "q": "In how many ways can a committee of 3 be chosen from 8 people?", "o": ["56", "336", "112", "28"], "e": "Order does not matter in a committee, so use ^{8}C_{3} = 56.", "v": null, "h": "A committee has no order: 8C3 = 56. 'Chosen' means combination."}, {"c": 6, "t": "Combination", "k": "tr", "q": "In how many ways can a president and a secretary be chosen from 6 people?", "o": ["30", "15", "60", "40"], "e": "The two posts are different, so order matters: ^{6}P_{2} = 30.", "v": null, "h": "A president and a secretary are different jobs, so order matters: 6P2 = 30, not 6C2."}, {"c": 6, "t": "Combination", "k": "tr", "q": "In how many ways can a committee of 2 be chosen from 6 people?", "o": ["15", "30", "7", "25"], "e": "Order does not matter: ^{6}C_{2} = 15. (The president and secretary version, where order matters, gives 30.)", "v": null, "h": "A pair has no order: 6C2 = 15."}, {"c": 6, "t": "Combination", "k": "pr", "q": "A committee has 2 men chosen from 5 and 3 women chosen from 6. How many committees are possible?", "o": ["200", "30", "400", "100"], "e": "Multiply the independent choices: ^{5}C_{2} × ^{6}C_{3} = 10 × 20 = 200.", "v": null, "h": "'And' means multiply: 5C2 × 6C3 = 10 × 20 = 200."}, {"c": 6, "t": "Combination", "k": "tr", "q": "A committee of 3 is chosen from 4 men and 3 women. How many committees contain at least one woman?", "o": ["31", "3", "62", "15"], "e": "All committees: ^{7}C_{3} = 35. Committees with no woman: ^{4}C_{3} = 4. At least one woman: 35 − 4 = 31.", "v": null, "h": "'At least one' = total − none: 7C3 − 4C3 = 35 − 4 = 31. Avoid adding cases."}, {"c": 6, "t": "Combination", "k": "pr", "q": "There are 10 people at a meeting and each shakes hands with everyone else exactly once. How many handshakes are there?", "o": ["45", "90", "100", "22"], "e": "Each handshake is a pair: ^{10}C_{2} = 45.", "v": null, "h": "Every handshake is a pair of people: 10C2 = 45."}, {"c": 6, "t": "Combination", "k": "pr", "q": "If ^{n}C_{2} = 45, find n.", "o": ["10", "9", "11", "45"], "e": "n(n − 1)/2 = 45 gives n² − n − 90 = 0, so n = 10.", "v": null, "h": "nC2 = n(n − 1)/2 = 45 gives n(n − 1) = 90. Look for consecutive numbers that multiply to 90: 10 × 9."}, {"c": 6, "t": "Combination", "k": "pr", "q": "Evaluate ^{7}C_{3} + ^{7}C_{4}.", "o": ["70", "35", "140", "80"], "e": "Pascal's rule: ^{7}C_{3} + ^{7}C_{4} = ^{8}C_{4} = 70. Check: 35 + 35 = 70.", "v": null, "h": "Pascal: nCr + nC(r+1) = (n + 1)C(r+1). So 7C3 + 7C4 = 8C4 = 70."}, {"c": 6, "t": "Binomial Expansion", "k": "pr", "q": "Find the coefficient of x³ in the expansion of (1 + x)^{6}.", "o": ["20", "15", "40", "10"], "e": "The coefficient is ^{6}C_{3} = 20.", "v": null, "h": "The coefficient of x³ in (1 + x)⁶ is 6C3 = 20."}, {"c": 6, "t": "Binomial Expansion", "k": "pr", "q": "Write down the expansion of (a − b)³.", "o": ["a³ − 3a²b + 3ab² − b³", "a³ − 3a²b − 3ab² − b³", "a³ + 3a²b + 3ab² + b³", "a³ − 2a²b + 2ab² − b³"], "e": "The coefficients 1, 3, 3, 1 are the same as for (a + b)³ but the signs alternate when b is negative.", "v": null, "h": "For (a − b)³ the signs alternate: +, −, +, −. Coefficients 1, 3, 3, 1."}, {"c": 6, "t": "Binomial Expansion", "k": "pr", "q": "How many terms does the expansion of (a + b)^{9} have?", "o": ["10", "9", "8", "11"], "e": "There are n + 1 terms in the expansion of (a + b)^{n}.", "v": null, "h": "The number of terms is always n + 1 = 10."}, {"c": 6, "t": "Binomial Expansion", "k": "pr", "q": "Find the coefficient of x² in the expansion of (x + 2)^{5}.", "o": ["80", "40", "160", "90"], "e": "The term is ^{5}C_{2} x² (2)³ = 10 × 8 = 80.", "v": null, "h": "x² has partner 2³ (the power of the other letter is 5 − 2 = 3). Coefficient 5C3 × 8 = 80."}, {"c": 6, "t": "Binomial Expansion", "k": "tr", "q": "Find the coefficient of x³ in the expansion of (2x − 1)^{4}.", "o": ["−32", "32", "−8", "−4"], "e": "The term is ^{4}C_{3}(2x)³(−1) = 4 × 8 × (−1) = −32.", "v": null, "h": "Pick x³ from (2x)^3: 4C3 × 2³ × (−1) = 4 × 8 × (−1) = −32."}, {"c": 6, "t": "Binomial Expansion", "k": "pr", "q": "Find the sum of all the coefficients in the expansion of (1 + x)^{8}.", "o": ["256", "512", "128", "266"], "e": "Put x = 1: (1 + 1)^{8} = 256.", "v": null, "h": "Put x = 1 to get the sum of coefficients: (1 + 1)⁸ = 2⁸ = 256."}, {"c": 6, "t": "Binomial Expansion", "k": "tr", "q": "Find the constant term in the expansion of (x + 1/x)^{6}.", "o": ["20", "15", "40", "10"], "e": "The general term is ^{6}C_{r} x^{6−r}(1/x)^{r} = ^{6}C_{r} x^{6−2r}. The power of x is zero when r = 3, giving ^{6}C_{3} = 20.", "v": null, "h": "The constant term sits in the middle when the powers cancel: 6C3 = 20, since x³ × (1/x)³."}, {"c": 6, "t": "Binomial Expansion", "k": "pr", "q": "Find the coefficient of x² in the expansion of (1 − 2x)^{5}.", "o": ["40", "80", "20", "50"], "e": "The term is ^{5}C_{2}(−2x)² = 10 × 4 = 40. The sign is positive because the power is even.", "v": null, "h": "(−2x)² contributes (+4) and 5C2 = 10, so 10 × 4 = 40. Even power, positive."}, {"c": 6, "t": "Binomial Expansion", "k": "pr", "q": "Find the coefficient of x⁴ in the expansion of (x² + 1)^{4}.", "o": ["6", "4", "12", "3"], "e": "Each x² term comes from choosing x² twice: ^{4}C_{2} = 6.", "v": null, "h": "Let y = x²: need y², coefficient 4C2 = 6."}, {"c": 6, "t": "Binomial Expansion", "k": "tr", "q": "In the expansion of (x + 3)^{7} in descending powers of x, which term contains x⁴?", "o": ["The 4th term", "The 5th term", "The 3rd term", "The 7th term"], "e": "The general term is T_{r+1} = ^{7}C_{r} x^{7−r} 3^{r}. For x⁴, r = 3, so it is the 4th term (r + 1 = 4).", "v": null, "h": "The (r + 1)th term has x^{n−r}. For x⁴ in (x + 3)⁷, 7 − r = 4 gives r = 3, so it is the 4th term."}, {"c": 6, "t": "Binomial Expansion", "k": "pr", "q": "Use the binomial expansion to evaluate (1.02)⁴ correct to 4 decimal places.", "o": ["1.0824", "1.0800", "1.0816", "1.0832"], "e": "(1 + 0.02)⁴ = 1 + 4(0.02) + 6(0.0004) + 4(0.000008) + … = 1 + 0.08 + 0.0024 + 0.000032 ≈ 1.0824.", "v": null, "h": "1 + 4(0.02) + 6(0.0004) + 4(0.000008) = 1 + 0.08 + 0.0024 + 0.000032 = 1.082432, so 1.0824."}, {"c": 6, "t": "Binomial Expansion", "k": "pr", "q": "Use the binomial expansion to evaluate (0.98)⁵ correct to 4 decimal places.", "o": ["0.9039", "0.9000", "0.9100", "0.9139"], "e": "(1 − 0.02)⁵ = 1 − 0.1 + 0.004 − 0.00008 + … ≈ 0.9039.", "v": null, "h": "0.98 = 1 − 0.02. 1 − 5(0.02) + 10(0.0004) − 10(0.000008) = 1 − 0.1 + 0.004 − 0.00008 = 0.90392, so 0.9039."}, {"c": 6, "t": "Binomial Expansion", "k": "pr", "q": "The coefficient of x in the expansion of (1 + x)^{n} is 12. Find n.", "o": ["12", "24", "6", "22"], "e": "The coefficient of x is ^{n}C_{1} = n, so n = 12.", "v": null, "h": "The coefficient of x in (1 + x)ⁿ is nC1 = n, so n = 12 directly."}, {"c": 7, "t": "Addition and Subtraction of Matrices", "k": "ex", "q": "Let C = ⟦5,1,3;2,1,6⟧ and E = ⟦1,2,1;4,3,2⟧. Find C + E.", "o": ["⟦6,3,4;6,4,8⟧", "⟦6,2,4;6,4,8⟧", "⟦6,3,4;6,6,8⟧", "⟦6,3,4;6,4,10⟧"], "e": "Add corresponding entries: ⟦6,3,4;6,4,8⟧.", "v": null, "h": "Same order (2 × 3 each), so add entry by entry: 5 + 1, 1 + 2, 3 + 1, and so on. Check the first entry: 6."}, {"c": 7, "t": "Addition and Subtraction of Matrices", "k": "ex", "q": "Let E = ⟦1,2,1;4,3,2⟧ and F = ⟦3,2,4;1,3,2⟧. Find E + F.", "o": ["⟦4,4,5;5,6,4⟧", "⟦−4,4,5;5,6,4⟧", "⟦4,3,5;5,6,4⟧", "⟦4,4,5;7,6,4⟧"], "e": "Add corresponding entries: ⟦4,4,5;5,6,4⟧.", "v": null, "h": "Add entry by entry: first row 1 + 3, 2 + 2, 1 + 4. Always match positions."}, {"c": 7, "t": "Addition and Subtraction of Matrices", "k": "ex", "q": "With C = ⟦5,1,3;2,1,6⟧, E = ⟦1,2,1;4,3,2⟧ and F = ⟦3,2,4;1,3,2⟧, find (C + E) + F.", "o": ["⟦9,5,8;7,7,10⟧", "⟦9,5,10;7,7,10⟧", "⟦9,5,9;7,7,10⟧", "⟦9,5,8;7,7,11⟧"], "e": "C + E = ⟦6,3,4;6,4,8⟧, then add F: ⟦9,5,8;7,7,10⟧. This equals C + (E + F) because matrix addition is associative.", "v": null, "h": "Matrix addition is associative, so add all three entry by entry. Quick check on the top-left: 5 + 1 + 3 = 9."}, {"c": 7, "t": "Addition and Subtraction of Matrices", "k": "ex", "q": "Find ⟦x,1;4,2;2,3⟧ + ⟦1,−x;3,−3x;1,4⟧.", "o": ["⟦x + 1,1 − x;7,2 − 3x;3,7⟧", "⟦x + 1,1 + x;7,2 − 3x;3,7⟧", "⟦x + 1,1 − x;7,2 + 3x;3,7⟧", "⟦x − 1,1 − x;7,2 − 3x;3,7⟧"], "e": "Add entry by entry: (x + 1), (1 − x); (4 + 3), (2 − 3x); (2 + 1), (3 + 4).", "v": null, "h": "Add entry by entry and keep the unknowns together: x + 1, 1 + (−x) = 1 − x, 4 + 3, 2 − 3x, 2 + 1, 3 + 4."}, {"c": 7, "t": "Addition and Subtraction of Matrices", "k": "ex", "q": "Given M = ⟦2,3;1,2;5,4⟧ (3 × 2) and N = ⟦2,3;1,5⟧ (2 × 2), what can be said about M + N?", "o": ["It is not defined, because M and N are not of the same order", "It is defined and is a 3 × 2 matrix", "It is defined and is a 2 × 2 matrix", "It is defined only if N is symmetric"], "e": "Matrices can only be added when they have the same order. M is 3 × 2 and N is 2 × 2, so M + N is not defined.", "v": null, "h": "M is 3 × 2 and N is 2 × 2. Addition needs the SAME order, so it is not defined. Compare the orders, not the entries."}, {"c": 7, "t": "Addition and Subtraction of Matrices", "k": "ex", "q": "Let C = ⟦2,3,11;4,3,2;13,8,7⟧ and E = ⟦4,2,1;1,2,1;4,2,8⟧. Find E − C.", "o": ["⟦2,−1,−10;−3,−1,−1;−9,−6,1⟧", "⟦2,−1,−10;−3,−1,0;−9,−6,1⟧", "⟦2,−1,−10;−3,−1,−1;−9,−6,−1⟧", "⟦2,1,−10;−3,−1,−1;−9,−6,1⟧"], "e": "Subtract entry by entry (E minus C): ⟦2,−1,−10;−3,−1,−1;−9,−6,1⟧. Note E − C ≠ C − E.", "v": null, "h": "Subtract entry by entry in the order E − C (not C − E). First entry: 4 − 2 = 2."}, {"c": 7, "t": "Scalar Multiplication", "k": "ex", "q": "If A = ⟦3,1,4;2,2,5;1,−2,1⟧, find 5A.", "o": ["⟦15,5,20;10,10,25;5,−10,5⟧", "⟦15,5,20;10,10,−25;5,−10,5⟧", "⟦15,5,20;9,10,25;5,−10,5⟧", "⟦16,5,20;10,10,25;5,−10,5⟧"], "e": "Multiply every entry by 5: ⟦15,5,20;10,10,25;5,−10,5⟧.", "v": null, "h": "Scalar multiplication multiplies EVERY entry, including the negative one: 5 × (−2) = −10."}, {"c": 7, "t": "Scalar Multiplication", "k": "ex", "q": "Given M = ⟦1,5,7;3,−2,1;1,4,2⟧ and N = ⟦3,1,2;1,3,1;1,−2,−3⟧, evaluate k(M + N) where k is a scalar.", "o": ["⟦4k,6k,9k;4k,k,2k;2k,2k,−k⟧", "⟦4k,6k,9k;4k,k,2k;2k,2k,k⟧", "⟦4k,6k,9k;4k,5k,2k;2k,2k,−k⟧", "⟦4,6,9;4,1,2;2,2,−1⟧"], "e": "M + N = ⟦4,6,9;4,1,2;2,2,−1⟧. Multiply every entry by k.", "v": null, "h": "Add M + N first, then put k in front of every entry. First entry: (1 + 3)k = 4k."}, {"c": 7, "t": "Matrix Multiplication", "k": "ex", "q": "If M = ⟦1,8;9,−2⟧ and N = ⟦2,0;4,−1⟧, find MN.", "o": ["⟦34,−8;10,2⟧", "⟦34,−7;10,2⟧", "⟦34,−9;10,2⟧", "⟦34,−8;−10,2⟧"], "e": "Row by column: (1×2 + 8×4) = 34, (1×0 + 8×−1) = −8, (9×2 + −2×4) = 10, (9×0 + −2×−1) = 2. So MN = ⟦34,−8;10,2⟧.", "v": null, "h": "Row × column. Top-left: 1·2 + 8·4 = 34. Check: the trace of MN equals the trace of NM."}, {"c": 7, "t": "Matrix Multiplication", "k": "ex", "q": "If M = ⟦1,8;9,−2⟧ and N = ⟦2,0;4,−1⟧, find NM.", "o": ["⟦2,16;−5,34⟧", "⟦2,17;−5,34⟧", "⟦2,16;−5,36⟧", "⟦1,16;−5,34⟧"], "e": "Row of N by column of M gives ⟦2,16;−5,34⟧. Compare with MN: MN ≠ NM.", "v": null, "h": "NM is not MN. Top-left: 2·1 + 0·9 = 2. Check: trace of NM = 2 + 34 = 36, the same as MN's trace 34 + 2."}, {"c": 7, "t": "Matrix Multiplication", "k": "ex", "q": "Find GH where G = ⟦2,6,3;1,0,−1⟧ (2 × 3) and H = ⟦2,−1,4;3,1,2;4,0,1⟧ (3 × 3).", "o": ["⟦34,4,23;−2,−1,3⟧", "⟦34,4,−23;−2,−1,3⟧", "⟦34,4,23;−2,0,3⟧", "⟦34,4,23;−2,−1,4⟧"], "e": "GH is 2 × 3. Row 1: 4 + 18 + 12 = 34, −2 + 6 + 0 = 4, 8 + 12 + 3 = 23. Row 2: 2 + 0 − 4 = −2, −1 + 0 + 0 = −1, 4 + 0 − 1 = 3.", "v": null, "h": "(2 × 3)(3 × 3) is 2 × 3. Top-left: 2·2 + 6·3 + 3·4 = 34. Count the columns of the first and rows of the second."}, {"c": 7, "t": "Matrix Multiplication", "k": "ex", "q": "Evaluate EF given that E = ⟦8,2;6,1;2,3⟧ and F = ⟦−4,2,−1;3,5,1⟧.", "o": ["⟦−26,26,−6;−21,17,−5;1,19,1⟧", "⟦−26,26,−6;−21,17,−5;1,19,−1⟧", "⟦−27,26,−6;−21,17,−5;1,19,1⟧", "⟦−26,26,−6;−21,−17,−5;1,19,1⟧"], "e": "E is 3 × 2 and F is 2 × 3, so EF is 3 × 3. Working row by column gives ⟦−26,26,−6;−21,17,−5;1,19,1⟧.", "v": null, "h": "(3 × 2)(2 × 3) is 3 × 3. Top-left: 8(−4) + 2(3) = −26. Each entry is a row of E dotted with a column of F."}, {"c": 7, "t": "Matrix Multiplication", "k": "ex", "q": "If P = ⟦2,3;1,9⟧ and I is the 2 × 2 identity matrix, find IP.", "o": ["⟦2,3;1,9⟧", "⟦1,0;0,1⟧", "⟦2,1;3,9⟧", "⟦9,1;3,2⟧"], "e": "The identity matrix leaves any matrix unchanged: IP = P = ⟦2,3;1,9⟧.", "v": null, "h": "The identity matrix leaves any matrix unchanged: IP = P. No calculation."}, {"c": 7, "t": "Transpose of a Matrix", "k": "ex", "q": "Find the transpose of B = ⟦1,3,4;2,7,9;8,6,5⟧.", "o": ["⟦1,2,8;3,7,6;4,9,5⟧", "⟦1,2,8;3,7,6;4,9,4⟧", "⟦1,2,8;2,7,6;4,9,5⟧", "⟦1,2,8;3,7,−6;4,9,5⟧"], "e": "Rows become columns: B^{T} = ⟦1,2,8;3,7,6;4,9,5⟧.", "v": null, "h": "Rows become columns: write the first row as the first column. The diagonal (1, 7, 5) stays."}, {"c": 7, "t": "Transpose of a Matrix", "k": "ex", "q": "Find the transpose of C = ⟦1,4;3,2;6,1⟧.", "o": ["⟦1,3,6;4,2,1⟧", "⟦1,3,6;6,2,1⟧", "⟦1,3,6;5,2,1⟧", "⟦1,4,6;4,2,1⟧"], "e": "C is 3 × 2, so C^{T} is 2 × 3: ⟦1,3,6;4,2,1⟧.", "v": null, "h": "A 3 × 2 matrix becomes 2 × 3. First row of C (1, 4) is the first column of the answer."}, {"c": 7, "t": "Transpose of a Matrix", "k": "ex", "q": "Find the transpose of E = ⟦2,8;−7,3⟧.", "o": ["⟦2,−7;8,3⟧", "⟦2,7;8,3⟧", "⟦2,−8;8,3⟧", "⟦2,−7;9,3⟧"], "e": "Swap the off-diagonal entries: E^{T} = ⟦2,−7;8,3⟧.", "v": null, "h": "Swap the off-diagonal entries only: 8 and −7 trade places."}, {"c": 7, "t": "Transpose of a Matrix", "k": "ex", "q": "Is F = ⟦4,−1;−1,7⟧ symmetric?", "o": ["Yes, because F = F^{T}", "No, because F^{T} = −F", "No, because its diagonal entries differ", "Yes, because its determinant is zero"], "e": "F^{T} = ⟦4,−1;−1,7⟧ = F, so F is symmetric.", "v": null, "h": "Symmetric means entries mirror each other across the diagonal. The off-diagonal entries are both −1, so F = Fᵀ."}, {"c": 7, "t": "Transpose of a Matrix", "k": "ex", "q": "Find the transpose of G = ⟦1,3,1,5;−2,4,−1,−3;3,7,−5,1;2,6,1,−2⟧.", "o": ["⟦1,−2,3,2;3,4,7,6;1,−1,−5,1;5,−3,1,−2⟧", "⟦1,−2,3,2;3,4,7,6;1,−1,−5,1;6,−3,1,−2⟧", "⟦3,−2,3,2;3,4,7,6;1,−1,−5,1;5,−3,1,−2⟧", "⟦1,−2,3,2;3,4,7,6;1,−1,−4,1;5,−3,1,−2⟧"], "e": "Write the rows of G as columns: G^{T} = ⟦1,−2,3,2;3,4,7,6;1,−1,−5,1;5,−3,1,−2⟧.", "v": null, "h": "The first row (1, 3, 1, 5) becomes the first column. Do it row by row."}, {"c": 7, "t": "Determinants", "k": "ex", "q": "Find the determinant of A = ⟦3,7,1;2,4,10;6,−3,1⟧.", "o": ["478", "418", "−478", "538"], "e": "Expand along row 1: 3(4 + 30) − 7(2 − 60) + 1(−6 − 24) = 102 + 406 − 30 = 478.", "v": null, "h": "Expand along the first row: 3(4 + 30) − 7(2 − 60) + 1(−6 − 24) = 102 + 406 − 30 = 478. The middle term's sign is minus."}, {"c": 7, "t": "Determinants", "k": "ex", "q": "Find the determinant of B = ⟦1,0,3;2,4,1;−1,3,−2⟧.", "o": ["19", "−19", "29", "11"], "e": "Expand along row 1: 1(−8 − 3) − 0(−4 + 1) + 3(6 + 4) = −11 + 0 + 30 = 19.", "v": null, "h": "Expand along the row with a zero: 1(−8 − 3) − 0 + 3(6 + 4) = −11 + 30 = 19. The zero kills a whole term."}, {"c": 7, "t": "Determinants", "k": "ex", "q": "Given A = ⟦1,2;5,3⟧ and B = ⟦−4,1;2,5⟧, find det(BA).", "o": ["154", "−154", "164", "144"], "e": "BA = ⟦−4 + 5,−8 + 3;2 + 25,4 + 15⟧ = ⟦1,−5;27,19⟧. det = (1)(19) − (−5)(27) = 19 + 135 = 154. (Check: det A × det B = (−7)(−22) = 154.)", "v": null, "h": "det(BA) = det B × det A. det A = 3 − 10 = −7 and det B = −20 − 2 = −22. Product = 154. No need to multiply the matrices."}, {"c": 7, "t": "Determinants", "k": "ex", "q": "Find the determinant of ⟦1,2,1;3,4,2;1,4,1⟧.", "o": ["2", "−2", "0", "4"], "e": "1(4 − 8) − 2(3 − 2) + 1(12 − 4) = −4 − 2 + 8 = 2.", "v": null, "h": "Expand along row 1: 1(4 − 8) − 2(3 − 2) + 1(12 − 4) = −4 − 2 + 8 = 2."}, {"c": 7, "t": "Determinants", "k": "ex", "q": "Find the determinant of ⟦1,2,1;1,4,1;3,4,2⟧, which is the matrix ⟦1,2,1;3,4,2;1,4,1⟧ with two rows interchanged.", "o": ["−2", "2", "0", "−4"], "e": "Interchanging two rows changes the sign of the determinant. The original determinant is 2, so this one is −2. Direct expansion: 1(8 − 4) − 2(2 − 3) + 1(4 − 12) = 4 + 2 − 8 = −2.", "v": null, "h": "Swapping two rows flips the sign of the determinant: the previous matrix has det 2, so this one is −2."}, {"c": 7, "t": "Determinants", "k": "ex", "q": "Find the determinant of ⟦1,2,1;3,5,1;3,5,1⟧.", "o": ["0", "1", "−1", "5"], "e": "Two rows are identical, so the determinant is 0. Direct expansion: 1(5 − 5) − 2(3 − 3) + 1(15 − 15) = 0.", "v": null, "h": "Two identical rows (row 2 and row 3) make the determinant 0. Spot it in two seconds."}, {"c": 7, "t": "Inverse of a Matrix", "k": "ex", "q": "Find the inverse of A = ⟦1,3;5,2⟧.", "o": ["⟦−2/13,3/13;5/13,−1/13⟧", "⟦2/13,−3/13;−5/13,1/13⟧", "⟦−2,3;5,−1⟧", "⟦−2/13,5/13;3/13,−1/13⟧"], "e": "|A| = 2 − 15 = −13. adj A = ⟦2,−3;−5,1⟧. A^{−1} = (1/−13)⟦2,−3;−5,1⟧ = ⟦−2/13,3/13;5/13,−1/13⟧.", "v": null, "h": "det = 2 − 15 = −13. Swap the diagonal and change the signs of the other two: ⟦2,−3;−5,1⟧ ÷ (−13)."}, {"c": 7, "t": "Inverse of a Matrix", "k": "ex", "q": "Find the inverse of the diagonal matrix D = ⟦3,0,0;0,−1,0;0,0,2⟧.", "o": ["⟦1/3,0,0;0,−1,0;0,0,1/2⟧", "⟦−1/3,0,0;0,1,0;0,0,−1/2⟧", "⟦3,0,0;0,−1,0;0,0,2⟧", "⟦1/3,0,0;0,1,0;0,0,1/2⟧"], "e": "det D = 3(−1)(2) = −6. adj D = ⟦−2,0,0;0,6,0;0,0,−3⟧. D^{−1} = adj D / (−6) = ⟦1/3,0,0;0,−1,0;0,0,1/2⟧. For a diagonal matrix just invert each diagonal entry.", "v": null, "h": "The inverse of a diagonal matrix just inverts each diagonal entry: 1/3, 1/(−1), 1/2."}, {"c": 7, "t": "Inverse of a Matrix", "k": "ex", "q": "Let A = ⟦1,2,−1;3,1,5;3,−1,2⟧. Find adj A.", "o": ["⟦7,−3,11;9,5,−8;−6,7,−5⟧", "⟦6,−3,11;9,5,−8;−6,7,−5⟧", "⟦7,−3,11;10,5,−8;−6,7,−5⟧", "⟦7,−3,10;9,5,−8;−6,7,−5⟧"], "e": "Find the cofactors, then transpose. The cofactor matrix is ⟦7,9,−6;−3,5,7;11,−8,−5⟧, and its transpose is adj A = ⟦7,−3,11;9,5,−8;−6,7,−5⟧.", "v": null, "h": "adj A = transpose of the cofactor matrix. Check: A × adj A must be |A| × I, so the first row of A times the first column of adj A should equal |A| = 31."}, {"c": 7, "t": "Inverse of a Matrix", "k": "ex", "q": "Let A = ⟦1,2,−1;3,1,5;3,−1,2⟧. Find A · adj A.", "o": ["⟦31,0,0;0,31,0;0,0,31⟧", "⟦1,0,0;0,1,0;0,0,1⟧", "⟦13,0,0;0,13,0;0,0,13⟧", "⟦0,0,0;0,0,0;0,0,0⟧"], "e": "A · adj A = |A| I. With |A| = 31, this is 31 times the identity matrix.", "v": null, "h": "A · adj A = |A| × I. So all the diagonal entries equal |A| = 31 and the rest are 0. Check one entry: 7 + 18 + 6 = 31."}, {"c": 7, "t": "Inverse of a Matrix", "k": "ex", "q": "Let A = ⟦1,2,−1;3,1,5;3,−1,2⟧. Find |A|.", "o": ["31", "13", "−31", "−13"], "e": "|A| = 1(2 + 5) − 2(6 − 15) + (−1)(−3 − 3) = 7 + 18 + 6 = 31. (The notes print 13 at the end by slip; the working gives 31.)", "v": null, "h": "|A| = 1(2 + 5) − 2(6 − 15) + (−1)(−3 − 3) = 7 + 18 + 6 = 31. Use the first row, watching the minus signs."}, {"c": 7, "t": "Inverse of a Matrix", "k": "ex", "q": "Let A = ⟦1,2,−1;3,1,5;3,−1,2⟧. Find A^{−1}.", "o": ["(1/31)⟦7,−3,11;9,5,−8;−6,7,−5⟧", "(1/13)⟦7,−3,11;9,5,−8;−6,7,−5⟧", "(1/31)⟦7,9,−6;−3,5,7;11,−8,−5⟧", "(1/31)⟦−7,3,−11;−9,−5,8;6,−7,5⟧"], "e": "A^{−1} = adj A / |A| = (1/31)⟦7,−3,11;9,5,−8;−6,7,−5⟧.", "v": null, "h": "A⁻¹ = adj A ÷ |A|, so divide the adjoint by 31. Don't forget to divide every entry."}, {"c": 7, "t": "Polynomials of Matrices", "k": "ex", "q": "Let A = ⟦2,1;3,−1⟧ with A^{2} = ⟦7,1;3,4⟧ and f(t) = 3t^{2} − t + 2. Find f(A).", "o": ["⟦21,2;6,15⟧", "⟦21,2;−6,15⟧", "⟦22,2;6,15⟧", "⟦21,4;6,15⟧"], "e": "f(A) = 3A^{2} − A + 2I = ⟦21,3;9,12⟧ − ⟦2,1;3,−1⟧ + ⟦2,0;0,2⟧ = ⟦21,2;6,15⟧. (The notes print 19 in the last entry; the working gives 15.)", "v": null, "h": "f(A) = 3A² − A + 2I. The constant 2 becomes 2I, NOT a matrix of 2s. 3A² = ⟦21,3;9,12⟧, then subtract A and add 2I."}, {"c": 7, "t": "Polynomials of Matrices", "k": "ex", "q": "The matrix A = ⟦2,1;3,4⟧ has characteristic polynomial Δ(t) = t^{2} − 6t + 5. By the Cayley–Hamilton theorem, what is A^{2} − 6A + 5I?", "o": ["The zero matrix ⟦0,0;0,0⟧", "The identity matrix ⟦1,0;0,1⟧", "⟦7,6;18,19⟧", "⟦5,0;0,5⟧"], "e": "Every matrix satisfies its own characteristic polynomial: A^{2} − 6A + 5I = ⟦7,6;18,19⟧ − ⟦12,6;18,24⟧ + ⟦5,0;0,5⟧ = ⟦0,0;0,0⟧.", "v": null, "h": "Cayley–Hamilton: every matrix satisfies its own characteristic equation, so the result is the zero matrix. Check: trace 6, det 5 match Δ."}, {"c": 7, "t": "Polynomials of Matrices", "k": "ex", "q": "Find the characteristic polynomial Δ(t) = det(tI − A) of A = ⟦2,1;3,4⟧.", "o": ["t^{2} − 6t + 5", "t^{2} + 6t + 5", "t^{2} − 6t − 5", "t^{2} − 5t + 6"], "e": "det ⟮t − 2,−1;−3,t − 4⟯ = (t − 2)(t − 4) − 3 = t^{2} − 6t + 5.", "v": null, "h": "For a 2 × 2 matrix: Δ(t) = t² − (trace)t + det. Trace 2 + 4 = 6, det 8 − 3 = 5."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "ex", "q": "Solve the simultaneous equations by the inverse method: x + y = 7; 5x − 3y = −5.", "o": ["x = 2, y = 5", "x = 5, y = 2", "x = −2, y = 5", "x = 2, y = −5"], "e": "A = ⟦1,1;5,−3⟧, |A| = −3 − 5 = −8, A^{−1} = (1/−8)⟦−3,−1;−5,1⟧. X = A^{−1}B = (1/−8)(−21 + 5, −35 − 5) = (1/−8)(−16, −40) = (2, 5).", "v": null, "h": "Equations become AX = B with X = A⁻¹B. Fast check: put x = 2, y = 5 back in both equations: 7 and 10 − 15 = −5."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "ex", "q": "Solve by the inverse method: x₁ + x₂ = −3; −x₁ − 2x₂ = 10.", "o": ["x₁ = 4, x₂ = −7", "x₁ = −4, x₂ = 7", "x₁ = 7, x₂ = −4", "x₁ = 4, x₂ = 7"], "e": "|A| = −2 + 1 = −1, adj A = ⟦−2,−1;1,1⟧, A^{−1} = ⟦2,1;−1,−1⟧. X = A^{−1}B = (−6 + 10, 3 − 10) = (4, −7).", "v": null, "h": "Adding the two equations gives −x₂ = 7, so x₂ = −7. Then x₁ = −3 − x₂ = 4. Quick enough to avoid the inverse."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "ex", "q": "Solve the system using the inverse method: x + y − 2z = 5; 2x − 2y + z = 7; x + 3y − z = 10.", "o": ["x = 5, y = 2, z = 1", "x = 5, y = 2, z = 3", "x = 6, y = 2, z = 1", "x = −5, y = 2, z = 1"], "e": "Write AX = B. Δ = |A| = −14 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 5, y = 2, z = 1.", "v": null, "h": "Δ = −14. Check your answer in the first equation: 5 + 2 − 2 = 5 and in the second: 10 − 4 + 1 = 7."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "ex", "q": "Solve the system using the inverse method: 2x − 5y − z = 4; x + 3y − 2z = −8; 3x − 2y + z = 8.", "o": ["x = 1, y = −1, z = 3", "x = 1, y = 1, z = 3", "x = 0, y = −1, z = 3", "x = 1, y = −1, z = 5"], "e": "Write AX = B. Δ = |A| = 44 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 1, y = −1, z = 3.", "v": null, "h": "Add equation 1 and equation 3 to eliminate z: 5x − 7y = 12. Check x = 1, y = −1, z = 3 in equation 1: 2 + 5 − 3 = 4."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "ex", "q": "The currents in a d.c. circuit satisfy 5I₁ − 3I₂ + 4I₃ = 79; 7I₁ + 4I₂ − 5I₃ = 105; 4I₁ − 5I₂ + 5I₃ = 40. Use the inverse method to find I₁, I₂ and I₃ in amperes.", "o": ["I₁ = 15, I₂ = 20, I₃ = 16", "I₁ = 16, I₂ = 20, I₃ = 15", "I₁ = 15, I₂ = 16, I₃ = 20", "I₁ = −15, I₂ = 20, I₃ = 16"], "e": "det V = −64, adj V = ⟦−5,−5,−1;−55,9,53;−51,13,41⟧. X = V^{−1}B = (1/−64)(−960, −1280, −1024) = (15, 20, 16).", "v": null, "h": "Add equations 2 and 3: the I₃ terms cancel (−5 and +5) so you get 11I₁ − I₂ = 145. Then eliminate again."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "tu", "q": "Solve the system using the inverse method: x + y + z = 2; 5x − 2y − 2z = 3; 3x − 5y + z = −8.", "o": ["x = 1, y = 2, z = −1", "x = 1, y = 3, z = −1", "x = 1, y = −2, z = −1", "x = 1, y = 2, z = 0"], "e": "Write AX = B. Δ = |A| = −42 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 1, y = 2, z = −1.", "v": null, "h": "2 × eq1 + eq2 kills y and z at once: 7x = 7, so x = 1. Then solve the 2 × 2 system for y and z."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "tu", "q": "Solve the system using Cramer’s rule: 2x − y + z = 2; x + 3y − z = 6; x − y − 2z = 3.", "o": ["x = 2, y = 1, z = −1", "x = 3, y = 1, z = −1", "x = 4, y = 1, z = −1", "x = 2, y = 1, z = 1"], "e": "Write AX = B. Δ = |A| = −19 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 2, y = 1, z = −1.", "v": null, "h": "Δ = −19. Adding eq1 and eq2 eliminates z: 3x + 2y = 8, a quick check for your answer x = 2, y = 1."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "tu", "q": "Solve the system using the inverse method: 2x − y + 2z = −1; x + 3y − z = 5; 3x + y − 3z = 7.", "o": ["x = 1, y = 1, z = −1", "x = 0, y = 1, z = −1", "x = 3, y = 1, z = −1", "x = 1, y = 2, z = −1"], "e": "Write AX = B. Δ = |A| = −32 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 1, y = 1, z = −1.", "v": null, "h": "2 × eq2 + eq1 eliminates z: 4x + 5y = 9. A fast check on (1, 1, −1)."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "tu", "q": "Solve the system using Cramer’s rule: 4x − y + z = 10; x − 3y − z = 4; 3x − 7y − 5z = 8.", "o": ["x = 2, y = −1, z = 1", "x = 4, y = −1, z = 1", "x = 1, y = −1, z = 1", "x = 2, y = −1, z = 2"], "e": "Write AX = B. Δ = |A| = 32 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 2, y = −1, z = 1.", "v": null, "h": "Adding eq1 and eq2 eliminates z: 5x − 4y = 14. Check 5(2) − 4(−1) = 14."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "tu", "q": "Solve the system using the inverse method: x + y − z = −6; 2x + 2y − 3z = −17; 5x + 3y + z = −4.", "o": ["x = −3, y = 2, z = 5", "x = −3, y = 3, z = 5", "x = −3, y = 2, z = 7", "x = −3, y = 1, z = 5"], "e": "Write AX = B. Δ = |A| = −2 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = −3, y = 2, z = 5.", "v": null, "h": "Eq2 − 2 × eq1 gives −z = −5, so z = 5 immediately. Then x + y = −1 and 5x + 3y = −9."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "tu", "q": "Solve the system using Cramer’s rule: 2x + y − z = 1; 3x + 2y + z = 2; x − y − 2z = 5.", "o": ["x = 3, y = −4, z = 1", "x = 3, y = −5, z = 1", "x = 5, y = −4, z = 1", "x = 2, y = −4, z = 1"], "e": "Write AX = B. Δ = |A| = 6 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 3, y = −4, z = 1.", "v": null, "h": "Adding eq1 and eq2 eliminates z: 5x + 3y = 3. Check x = 3, y = −4: 15 − 12 = 3."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "tu", "q": "Solve the system using the inverse method: −x + 2y − 2z = −1; 3x − 2y + z = 10; x − 5y + 3z = −7.", "o": ["x = 5, y = 3, z = 1", "x = 5, y = 4, z = 1", "x = −5, y = 3, z = 1", "x = 3, y = 5, z = 1"], "e": "Write AX = B. Δ = |A| = 11 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 5, y = 3, z = 1.", "v": null, "h": "Adding eq1 and eq2 removes y: 2x − z = 9. Check x = 5, z = 1: 10 − 1 = 9."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "tu", "q": "Solve the system using Cramer’s rule: x − 2y + z = −3; 2x − 3y + z = −1; 4x − 5y − z = 9.", "o": ["x = 4, y = 2, z = −3", "x = 6, y = 2, z = −3", "x = 4, y = 4, z = −3", "x = 4, y = 2, z = −2"], "e": "Write AX = B. Δ = |A| = −2 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 4, y = 2, z = −3.", "v": null, "h": "Eq1 − eq2 gives −x + y = −2, so y = x − 2. Substitute to find x = 4 quickly."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "tu", "q": "Solve the system using the inverse method: 3x + y − z = 1; x + 3y + 4z = −9; 2x − 4y − 3z = −4.", "o": ["x = −2, y = 3, z = −4", "x = −2, y = 3, z = 4", "x = 0, y = 3, z = −4", "x = −2, y = 4, z = −4"], "e": "Write AX = B. Δ = |A| = 42 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = −2, y = 3, z = −4.", "v": null, "h": "4 × eq1 + eq2 removes z: 13x + 7y = −5. Check −26 + 21 = −5 for x = −2, y = 3."}, {"c": 7, "t": "Solving Systems by the Inverse Method", "k": "tu", "q": "Solve the system using Cramer’s rule: 3x − y + 3z = 450; 5x + 2y − 2z = 800; 2x + y − 2z = 200.", "o": ["x = 100, y = 300, z = 150", "x = 100, y = 300, z = 149", "x = 102, y = 300, z = 150", "x = 100, y = 300, z = 151"], "e": "Write AX = B. Δ = |A| = −9 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 100, y = 300, z = 150.", "v": null, "h": "Eq2 − eq3 gives 3x + y = 600, which cuts the work in half. Check x = 100, y = 300."}, {"c": 7, "t": "Cramer’s Rule", "k": "ex", "q": "For the system x + y − 2z = 5; 2x − 2y + z = 7; x + 3y − z = 10, find the determinant Δ of the coefficient matrix.", "o": ["−14", "14", "−10", "−70"], "e": "Δ = 1(2 − 3) − 1(−2 − 1) + (−2)(6 + 2) = −1 + 3 − 16 = −14. Since Δ ≠ 0 there is a unique solution.", "v": null, "h": "Δ = 1(2 − 3) − 1(−2 − 1) − 2(6 + 2) = −1 + 3 − 16 = −14. Don't flip the middle sign."}, {"c": 7, "t": "Cramer’s Rule", "k": "ex", "q": "Using Cramer’s rule on x + y − 2z = 5; 2x − 2y + z = 7; x + 3y − z = 10, where Δ = −14 and N_y = −28, find y.", "o": ["y = 2", "y = −2", "y = 1/2", "y = 5"], "e": "y = N_y/Δ = −28/−14 = 2. (Also N_x = −70 gives x = 5 and N_z = −14 gives z = 1.)", "v": null, "h": "y = N_y/Δ = (−28)/(−14) = 2. Two negatives make a positive."}, {"c": 7, "t": "Cramer’s Rule", "k": "ex", "q": "Solve the system using Cramer’s rule: 2x − y + 2z = 9; x − 2y − z = 4; 3x + 4y + z = 6.", "o": ["x = 3, y = −1, z = 1", "x = 3, y = −1, z = −1", "x = 3, y = 1, z = 1", "x = 4, y = −1, z = 1"], "e": "Write AX = B. Δ = |A| = 28 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 3, y = −1, z = 1.", "v": null, "h": "Adding eq2 and eq3 eliminates z: 4x + 2y = 10. Check x = 3, y = −1: 12 − 2 = 10."}, {"c": 7, "t": "Cramer’s Rule", "k": "ex", "q": "Solve by Cramer’s rule: 50x + 30y + 20z = 190; 15x + 25y + 15z = 100; 30x + 15y + 5z = 90. (Hint: divide the rows by 10, 5 and 5 first.)", "o": ["x = 2, y = 1, z = 3", "x = 2, y = 3, z = 1", "x = 1, y = 2, z = 3", "x = −2, y = 1, z = 3"], "e": "Divide the rows: 5x + 3y + 2z = 19; 3x + 5y + 3z = 20; 6x + 3y + z = 18. Δ = −17, N_x = −34, N_y = −17, N_z = −51. So x = 2, y = 1, z = 3.", "v": null, "h": "Divide each row first to get 5x + 3y + 2z = 19, 3x + 5y + 3z = 20, 6x + 3y + z = 18. The solution stays the same; the numbers are much smaller."}, {"c": 7, "t": "Gaussian Elimination", "k": "ex", "q": "Use Gaussian elimination to solve: 3x₂ + 4x₃ = 6; 2x₁ − x₂ + x₃ = 15; x₁ + x₂ + 2x₃ = 9.", "o": ["x₁ = 5, x₂ = −2, x₃ = 3", "x₁ = −5, x₂ = 2, x₃ = 3", "x₁ = 5, x₂ = 2, x₃ = −3", "x₁ = 3, x₂ = −2, x₃ = 5"], "e": "Rearrange so that the leading coefficient of row 1 is 1: x₁ + x₂ + 2x₃ = 9. Then R₂ − 2R₁ gives −3x₂ − 3x₃ = −3, and adding R₂ to R₃ gives x₃ = 3. Back-substitute: x₂ = −2, x₁ = 5.", "v": null, "h": "Put the row with leading coefficient 1 (x₁ + x₂ + 2x₃ = 9) on top. Check x₂ = −2, x₃ = 3 in the first equation: −6 + 12 = 6."}, {"c": 7, "t": "Gaussian Elimination", "k": "ex", "q": "Use Gaussian elimination to solve: 2x − y + z = 2; x + 3y − z = 6; y − z = 2.", "o": ["x = 2, y = 1, z = −1", "x = 1, y = 2, z = 0", "x = 2, y = −1, z = 1", "x = −2, y = 1, z = −1"], "e": "Put x + 3y − z = 6 first. R₂ − 2R₁ gives −7y + 3z = −10. Eliminate with y − z = 2 to get y = 1. Then z = −1 and x = 2. Check in the first equation: 4 − 1 − 1 = 2.", "v": null, "h": "Use the equation with a leading 1 (x + 3y − z = 6) as your pivot. Then check y − z = 2 with y = 1, z = −1."}, {"c": 7, "t": "Gaussian Elimination", "k": "tu", "q": "Use Gaussian elimination to solve: 3x₂ + 2x₃ = 8; 2x₁ − x₂ − x₃ = 1; x₁ + 2x₂ + x₃ = 6.", "o": ["x₁ = 3, x₂ = −2, x₃ = 7", "x₁ = −3, x₂ = 2, x₃ = 7", "x₁ = 3, x₂ = 2, x₃ = −7", "x₁ = 3, x₂ = −2, x₃ = −7"], "e": "Reorder with x₁ + 2x₂ + x₃ = 6 on top. R₂ − 2R₁ gives −5x₂ − 3x₃ = −11. Combine with 3x₂ + 2x₃ = 8 to get x₃ = 7, then x₂ = −2 and x₁ = 3.", "v": null, "h": "Put x₁ + 2x₂ + x₃ = 6 on top. Check x₁ = 3, x₂ = −2, x₃ = 7: 3(−2) + 2(7) = 8 ✓."}, {"c": 7, "t": "Gaussian Elimination", "k": "tu", "q": "Solve the system using Gaussian elimination: x − y + z = 100; 2x − 3y + 4z = 200; x + 2y − z = 300.", "o": ["x = 150, y = 100, z = 50", "x = 150, y = 100, z = 49", "x = 150, y = 101, z = 50", "x = 150, y = 100, z = −50"], "e": "Write AX = B. Δ = |A| = −4 ≠ 0, so a unique solution exists. Solving (X = A^{−1}B or Cramer’s rule) gives x = 150, y = 100, z = 50.", "v": null, "h": "Add eq1 and eq3: 2x + y = 400 (z cancels). Check 2(150) + 100 = 400."}, {"c": 7, "t": "Gaussian Elimination", "k": "tu", "q": "The forces on a body in equilibrium satisfy F₁ − F₂ = 7; F₁ + 2F₂ − F₃ = 23; F₂ − F₃ = 0. Use Gaussian elimination to find F₁, F₂ and F₃ in newtons.", "o": ["F₁ = 15, F₂ = 8, F₃ = 8", "F₁ = 8, F₂ = 15, F₃ = 8", "F₁ = 15, F₂ = −8, F₃ = 8", "F₁ = 15, F₂ = 8, F₃ = 7"], "e": "From F₂ − F₃ = 0, F₃ = F₂. Then the second equation gives F₁ + F₂ = 23. With F₁ − F₂ = 7: F₁ = 15 and F₂ = 8, so F₃ = 8.", "v": null, "h": "The third equation says F₂ = F₃. Substitute in the second: F₁ + F₂ = 23. With F₁ − F₂ = 7, add: F₁ = 15, then F₂ = F₃ = 8."}, {"c": 7, "t": "Applications of Matrices", "k": "tu", "q": "A car with uniform acceleration has velocity v = u + at. At t = 1.5 s, v = 55 m/s and at t = 2.5 s, v = 75 m/s. Using determinants, find u and a.", "o": ["u = 25 m/s and a = 20 m/s²", "u = 20 m/s and a = 25 m/s²", "u = 25 m/s and a = −20 m/s²", "u = 30 m/s and a = 20 m/s²"], "e": "Equations: u + 1.5a = 55 and u + 2.5a = 75. Δ = 2.5 − 1.5 = 1. N_u = 55(2.5) − 75(1.5) = 137.5 − 112.5 = 25. N_a = 75 − 55 = 20. So u = 25 and a = 20.", "v": null, "h": "No determinant needed: subtract the two equations. u + 1.5a = 55 and u + 2.5a = 75 give a = 20, then u = 25."}, {"c": 7, "t": "Applications of Matrices", "k": "tu", "q": "The acceleration ẍ, velocity ẋ and distance x of a mechanical system satisfy 4ẍ − 10ẋ + 10x = −6; 1.5ẍ + 0.5ẋ − 2x = 8.25; 0.5ẍ − ẋ + 5x = 6. Find ẍ, ẋ and x.", "o": ["ẍ = 6, ẋ = 4.5, x = 1.5", "ẍ = 4.5, ẋ = 6, x = 1.5", "ẍ = 6, ẋ = −4.5, x = 1.5", "ẍ = 6, ẋ = 4.5, x = 3"], "e": "Write AX = B with A = ⟦4,−10,10;1.5,0.5,−2;0.5,−1,5⟧, |A| = 69.5. Solving by the inverse method or Cramer’s rule gives ẍ = 6, ẋ = 4.5 and x = 1.5. Check in the first equation: 24 − 45 + 15 = −6.", "v": null, "h": "Clear the decimals first: multiply row 1 by 1/2 and row 2 by 4 and row 3 by 2 (e.g. 6ẍ + 2ẋ − 8x = 33). Then use Cramer's rule or elimination."}, {"c": 7, "t": "Applications of Matrices", "k": "tu", "q": "Solve the simultaneous equations by the inverse method: 3x − y = 1; 4x − 3y = −2.", "o": ["x = 1, y = 2", "x = 2, y = 1", "x = −1, y = 2", "x = 1, y = −2"], "e": "|A| = −9 + 4 = −5. y = 3x − 1, so 4x − 9x + 3 = −2 giving x = 1 and y = 2.", "v": null, "h": "Eliminate y: 3 × eq1 − eq2 gives 5x = 5, so x = 1 and y = 2. Quicker than finding an inverse."}, {"c": 7, "t": "Applications of Matrices", "k": "tu", "q": "Solve the simultaneous equations: x + y = 6; 2x − 6y = −8.", "o": ["x = 3.5, y = 2.5", "x = 2.5, y = 3.5", "x = 3, y = 3", "x = −3.5, y = 2.5"], "e": "y = 6 − x, so 2x − 36 + 6x = −8, 8x = 28, x = 3.5 and y = 2.5.", "v": null, "h": "Double eq1: 2x + 2y = 12. Subtract from eq2... the clean route is eq2 − 2 × eq1 = −8y = −20, so y = 2.5, x = 3.5."}, {"c": 7, "t": "Types of Matrices", "k": "pr", "q": "A matrix has 3 rows and 4 columns. What is its order?", "o": ["3 × 4", "4 × 3", "12", "7"], "e": "The order is rows × columns, so 3 × 4. It contains 12 entries.", "v": null, "h": "Order = rows × columns, so 3 × 4. Rows first."}, {"c": 7, "t": "Types of Matrices", "k": "tr", "q": "How many entries does a 3 × 4 matrix have?", "o": ["12", "7", "34", "4"], "e": "Rows times columns: 3 × 4 = 12 entries. (Adding gives 7, the usual slip.)", "v": null, "h": "Entries = rows × columns = 3 × 4 = 12."}, {"c": 7, "t": "Types of Matrices", "k": "pr", "q": "Which of these matrices is symmetric?", "o": ["⟦1,2;2,3⟧", "⟦1,2;3,4⟧", "⟦0,2;−2,0⟧", "⟦1,2;−2,3⟧"], "e": "A symmetric matrix equals its transpose, so a_{ij} = a_{ji}. Only ⟦1,2;2,3⟧ has equal off-diagonal entries.", "v": null, "h": "Symmetric means mirror across the diagonal: the off-diagonal 2 and 2 are equal."}, {"c": 7, "t": "Types of Matrices", "k": "tr", "q": "Which of these matrices is skew-symmetric?", "o": ["⟦0,2;−2,0⟧", "⟦1,2;−2,1⟧", "⟦0,2;2,0⟧", "⟦2,0;0,−2⟧"], "e": "A skew-symmetric matrix has a_{ij} = −a_{ji}, which forces zeros on the main diagonal. ⟦0,2;2,0⟧ is symmetric, not skew.", "v": null, "h": "Skew-symmetric: diagonal all zeros and mirror entries are negatives (2 and −2)."}, {"c": 7, "t": "Types of Matrices", "k": "pr", "q": "Which description fits a diagonal matrix?", "o": ["Only the main diagonal may have non-zero entries", "Only the first row is non-zero", "All entries are equal", "All entries below the diagonal are 1"], "e": "A diagonal matrix is a square matrix with zeros everywhere off the main diagonal.", "v": null, "h": "Diagonal matrix: only the main diagonal may be non-zero. (Zeros on the diagonal are also allowed.)"}, {"c": 7, "t": "Types of Matrices", "k": "pr", "q": "What is the determinant of the 3 × 3 identity matrix?", "o": ["1", "0", "3", "−1"], "e": "The determinant of an identity matrix is the product of its diagonal entries, 1 × 1 × 1 = 1.", "v": null, "h": "The determinant of any identity matrix is 1."}, {"c": 7, "t": "Addition and Subtraction of Matrices", "k": "pr", "q": "Find ⟦1,2;3,4⟧ + ⟦5,6;7,8⟧.", "o": ["⟦6,8;10,12⟧", "⟦6,9;10,12⟧", "⟦6,8;−10,12⟧", "⟦6,8;12,12⟧"], "e": "Add corresponding entries: ⟦6,8;10,12⟧.", "v": null, "h": "Add entry by entry: 1 + 5, 2 + 6, 3 + 7, 4 + 8."}, {"c": 7, "t": "Addition and Subtraction of Matrices", "k": "pr", "q": "Find ⟦5,6;7,8⟧ − ⟦1,2;3,4⟧.", "o": ["⟦4,4;4,4⟧", "⟦4,4;−4,4⟧", "⟦4,5;4,4⟧", "⟦4,4;3,4⟧"], "e": "Subtract corresponding entries: ⟦4,4;4,4⟧.", "v": null, "h": "Subtract entry by entry: every difference is 4."}, {"c": 7, "t": "Scalar Multiplication", "k": "pr", "q": "Find 3 × ⟦1,−2;0,4⟧.", "o": ["⟦3,−6;0,12⟧", "⟦5,−6;0,12⟧", "⟦2,−6;0,12⟧", "⟦3,−6;0,14⟧"], "e": "Multiply every entry by 3, including the zero: ⟦3,−6;0,12⟧.", "v": null, "h": "Multiply every entry by 3, including the zero (still 0): 3, −6, 0, 12."}, {"c": 7, "t": "Matrix Multiplication", "k": "pr", "q": "A is a 2 × 3 matrix and B is a 3 × 4 matrix. What is the order of AB?", "o": ["2 × 4", "3 × 3", "2 × 3", "4 × 2"], "e": "The inner numbers (3 and 3) match. The result has the outer numbers: 2 × 4.", "v": null, "h": "Inner numbers must match (3 = 3); the outer numbers give t
