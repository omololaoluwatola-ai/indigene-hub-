<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;500;600;700&display=swap');
  :root{
    --ember:#FF6A00; --ember2:#FF3D00; --gold:#FFC93C; --black:#0D0A08;
    --char:#1A1512; --card:#221B16; --text:#F3E9DC; --muted:#B9A88F;
    --good:#2ECC71; --bad:#FF4D4D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Exo 2',sans-serif; color:var(--text);
    background: radial-gradient(circle at 50% 0%, #2b1608 0%, var(--black) 60%);
    min-height:100vh;
  }
  h1,h2,h3,.logo{font-family:'Orbitron',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px;}
  .logo{
    text-align:center; font-weight:900; font-size:1.6rem; letter-spacing:2px;
    background:linear-gradient(90deg,var(--gold),var(--ember));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:10px 0 4px;
  }
  .sub{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:20px;letter-spacing:1px;}
  .card{
    background:linear-gradient(160deg,var(--card),var(--char));
    border:1px solid #3A2C1E; border-radius:14px; padding:20px;
    box-shadow:0 8px 24px rgba(0,0,0,.5); margin-bottom:16px;
  }
  h2{color:var(--gold); font-size:1.05rem; margin:0 0 14px;}
  label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px;}
  select, button{
    width:100%; padding:12px; border-radius:10px; border:1px solid #4A3826;
    background:#150F0B; color:var(--text); font-family:'Exo 2',sans-serif; font-size:.95rem;
  }
  .btn{
    background:linear-gradient(90deg,var(--ember2),var(--ember));
    border:none; font-weight:700; letter-spacing:.5px; color:#fff; cursor:pointer;
    margin-top:20px; padding:14px; box-shadow:0 4px 14px rgba(255,106,0,.35);
    transition:transform .15s;
  }
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:#2A2118;border:1px solid var(--ember);}
  .pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .pill{
    flex:1; min-width:100px; text-align:center; padding:10px 6px; border-radius:10px;
    border:1px solid #4A3826; cursor:pointer; font-size:.82rem; color:var(--muted);
  }
  .pill.active{border-color:var(--ember); color:var(--gold); background:#2A1B0E;}
  #topicWrap{display:none;}
  .progressbar{height:8px;border-radius:6px;background:#2A2118;overflow:hidden;margin-bottom:14px;}
  .progressfill{height:100%;background:linear-gradient(90deg,var(--ember2),var(--gold));width:0%;transition:width .3s;}
  .qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-bottom:8px;}
  .qtext{font-size:1.02rem;line-height:1.5;margin-bottom:16px;color:#fff;}
  .opt{
    display:block; width:100%; text-align:left; padding:13px 14px; margin-bottom:10px;
    border-radius:10px; border:1px solid #4A3826; background:#150F0B; color:var(--text);
    font-family:'Exo 2',sans-serif; font-size:.92rem; cursor:pointer;
  }
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good); background:rgba(46,204,113,.15); color:#8BFFB0;}
  .opt.wrong{border-color:var(--bad); background:rgba(255,77,77,.15); color:#FFB0B0;}
  .fb{
    margin-top:14px; padding:14px; border-radius:10px; font-size:.88rem; line-height:1.5;
    background:#150F0B; border-left:4px solid var(--ember); display:none;
  }
  .fb.show{display:block;}
  .hack{color:var(--gold); font-weight:700;}
  .scorebar{display:flex; justify-content:space-between; font-size:.82rem; color:var(--muted); margin-bottom:10px;}
  #resultCard{display:none;text-align:center;}
  #resultCard .big{font-family:'Orbitron',sans-serif;font-size:2.6rem;color:var(--gold);}
  .reviewitem{border-bottom:1px solid #3A2C1E;padding:10px 0;font-size:.85rem;}
  .reviewitem.wrong{color:#FFB0B0;}
  .reviewitem.right{color:#8BFFB0;}
  footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">INDIGENE</div>
  <div class="sub">MTH101 &middot; ELEMENTARY MATHEMATICS I &middot; CBT</div>

  <!-- SETUP SCREEN -->
  <div class="card" id="setupCard">
    <h2>🔥 Set Up Your Run</h2>

    <label>Mode</label>
    <div class="pillrow" id="modeRow">
      <div class="pill active" data-mode="full">Full CBT (200Q)</div>
      <div class="pill" data-mode="quick">Quick Drill (20Q)</div>
      <div class="pill" data-mode="half">Half Run (100Q)</div>
      <div class="pill" data-mode="topic">By Topic</div>
    </div>

    <div id="topicWrap">
      <label>Choose Topic</label>
      <select id="topicSelect">
        <option value="all">All Topics</option>
        <option value="sets">Unit 1 — Elementary Set Theory</option>
        <option value="setops">Unit 2 — Basic Set Operations</option>
        <option value="numsets">Unit 3 — Set of Numbers</option>
        <option value="seqseries">Sequences & Series (AP/GP)</option>
        <option value="quad">Quadratic Equations</option>
        <option value="induction">Mathematical Induction</option>
        <option value="complex">Complex Numbers</option>
        <option value="circle">Circular Measure</option>
      </select>
    </div>

    <label>Question Order</label>
    <select id="orderSelect">
      <option value="shuffle">Shuffled (recommended)</option>
      <option value="sequential">Sequential (by unit)</option>
    </select>

    <button class="btn" id="startBtn">🔥 START CBT</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="card" id="quizCard" style="display:none;">
    <div class="scorebar">
      <span id="scoreLabel">Score: 0/0</span>
      <span id="qCounter">Q 1</span>
    </div>
    <div class="progressbar"><div class="progressfill" id="progFill"></div></div>
    <div class="qmeta"><span id="qTopic"></span></div>
    <div class="qtext" id="qText"></div>
    <div id="optsWrap"></div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="nextBtn" style="display:none;">Next →</button>
  </div>

  <!-- RESULT SCREEN -->
  <div class="card" id="resultCard">
    <h2>🔥 Run Complete</h2>
    <div class="big" id="finalScore">0%</div>
    <p id="finalSub" style="color:var(--muted)"></p>
    <button class="btn" id="reviewBtn">Review Wrong Answers</button>
    <button class="btn secondary" id="restartBtn">Start New Run</button>
    <div id="reviewList" style="margin-top:16px;text-align:left;"></div>
  </div>

  <footer>INDIGENE Study Console &middot; MTH101 &middot; Fisher–Yates shuffled</footer>
</div>

<script>
/* ============ QUESTION BANK (200Q) ============ */
const BANK = [];
function add(topic, q, opts, correctIdx, hack){
  BANK.push({topic, q, opts, correctIdx, hack});
}

/* ---------- UNIT 1: SETS (26) ---------- */
add("sets","A set is best described as:",["A well-defined collection of objects","Only a list of numbers","A single number","An equation"],0,"A set can hold ANY well-defined objects — numbers, letters, even other sets.");
add("sets","Which is the tabular form of {x | x is a vowel}?",["{a,e,i,o,u}","{x is even}","{1,2,3}","∅"],0,"Tabular form lists members directly inside braces.");
add("sets","The set-builder notation reads B = {x | x is even} as:",["B is the set of x such that x is even","B equals x squared","B is empty","B contains only 2"],0,"The vertical line '|' is read as 'such that'.");
add("sets","If A = {1,3,7,10}, then 7 ∈ A means:",["7 belongs to A","7 is not in A","A equals 7","A is a subset of 7"],0,"∈ = 'belongs to' / 'is a member of'.");
add("sets","A set that has no elements is called the:",["Null/empty set","Universal set","Power set","Infinite set"],0,"The null set is denoted ∅ and contains nothing.");
add("sets","The null set ∅ is a subset of:",["Every set","No set","Only itself","Only infinite sets"],0,"∅ ⊂ every set, by definition.");
add("sets","Two sets A and B are equal if:",["Every element of A is in B and every element of B is in A","They have the same number of elements only","A ⊂ B only","They are disjoint"],0,"Equality requires mutual subset relationship, not just equal size.");
add("sets","{1,2,3} = {3,1,2} because:",["Order does not matter in sets","They are different sets","Repetition matters","Sets must be ordered"],0,"Sets are unordered collections — arrangement is irrelevant.");
add("sets","A set is finite if:",["Counting its elements comes to an end","It has infinite elements","It is empty","It has exactly one element"],0,"Finite = the counting process terminates.");
add("sets","N = {1,2,3,...} is an example of a(n):",["Infinite set","Finite set","Null set","Universal set"],0,"The counting never ends, so N is infinite.");
add("sets","A ⊂ B means:",["Every element of A is also in B","Every element of B is in A","A and B are equal","A and B are disjoint"],0,"Subset: x ∈ A implies x ∈ B.");
add("sets","B is a proper subset of A if:",["B ⊂ A and B ≠ A","B ⊂ A only","A ⊂ B","B = A"],0,"Proper subset excludes equality.");
add("sets","Two sets are comparable if:",["A ⊂ B or B ⊂ A","A = B only","A ∩ B = ∅","Neither is a subset of the other"],0,"Comparability means one is a subset of the other.");
add("sets","The universal set U is:",["The fixed set from which all sets under discussion are drawn","Always the empty set","Always infinite","A subset of every other set"],0,"U is the 'world' or context set.");
add("sets","The power set of S contains:",["All subsets of S","Only S itself","Only single elements of S","Only ∅"],0,"Power set = family of ALL subsets.");
add("sets","If S has 4 elements, the power set of S has:",["16 elements","4 elements","8 elements","12 elements"],0,"2⁴ = 16.");
add("sets","If S has 6 elements, |2^S| equals:",["64","36","12","6"],0,"2⁶ = 64.");
add("sets","Two sets with no elements in common are called:",["Disjoint","Comparable","Equal","Universal"],0,"Disjoint sets: A ∩ B = ∅.");
add("sets","A = {1,3,7,8}, B = {2,4,7,9}. A and B are:",["Not disjoint (7 is common)","Disjoint","Equal","Comparable"],0,"7 appears in both, so they are NOT disjoint.");
add("sets","A Venn diagram represents sets using:",["Circles/regions inside a rectangle (U)","Straight lines only","Numbers only","Tables"],0,"Venn-Euler diagrams use bounded plane regions.");
add("sets","If x is NOT a member of set A, we write:",["x ∉ A","x ∈ A","x ⊂ A","x = A"],0,"The slash negates the membership symbol.");
add("sets","Which notation shows 'B is a superset of A'?",["B ⊃ A","B ⊂ A","B = A","B ∉ A"],0,"⊃ reads 'contains' / is a superset of.");
add("sets","Axiom of Extension states two sets are equal if and only if:",["Every element in A belongs to B and vice versa","They have the same cardinality","One contains the other","Neither contains any element"],0,"This is the formal axiomatic version of set equality.");
add("sets","In an axiomatic development of set theory, the undefined terms are:",["'Element' and 'set'","'Number' and 'operation'","'Line' and 'point'","'Function' and 'domain'"],0,"These are the two primitive (undefined) terms.");
add("sets","Let A = {a,b}. Which is the correct power set 2^A?",["{{a,b},{a},{b},∅}","{a,b}","{{a,b}}","{a,b,∅}"],0,"Power set must include the empty set and the full set itself.");
add("sets","A family of sets whose members are themselves sets is called a:",["Family/class of sets","Universal set","Power series","Null family"],0,"Common practice to say 'family' or 'class' rather than 'set of sets'.");

/* ---------- UNIT 2: SET OPERATIONS (24) ---------- */
add("setops","A ∪ B is the set of elements that:",["Belong to A or B or both","Belong to both A and B only","Belong to A but not B","Belong to neither"],0,"Union = everything in A OR B (inclusive).");
add("setops","A ∩ B is the set of elements that:",["Belong to both A and B","Belong to A or B","Belong to A only","Belong to neither"],0,"Intersection = common elements only.");
add("setops","A − B is defined as elements that:",["Belong to A but not to B","Belong to B but not to A","Belong to both","Belong to neither"],0,"Difference keeps only A's exclusive elements.");
add("setops","The complement A′ consists of elements:",["In U but not in A","In A only","In both A and U","In neither U nor A"],0,"A′ = U − A.");
add("setops","S = {a,b,c,d}, T = {f,b,d,g}. S ∪ T =",["{a,b,c,d,f,g}","{b,d}","{a,c}","{f,g}"],0,"Union combines all unique elements from both sets.");
add("setops","S = {a,b,c,d}, T = {f,b,d,g}. S ∩ T =",["{b,d}","{a,c}","{f,g}","{a,b,c,d,f,g}"],0,"Only b and d are common to both.");
add("setops","V = multiples of 2, W = multiples of 3. V ∩ W =",["Multiples of 6","Multiples of 2 only","Multiples of 3 only","Empty set"],0,"Common multiples of 2 and 3 are multiples of 6.");
add("setops","A ∪ B is always equal to:",["B ∪ A","A ∩ B","A − B","B − A"],0,"Union is commutative.");
add("setops","(A ∩ B) is always a subset of:",["Both A and B","Neither A nor B","Only A","Only B"],0,"Intersection is always contained within each original set.");
add("setops","If A and B are disjoint, then A ∩ B =",["∅","U","A","B"],0,"No common elements means the intersection is empty.");
add("setops","A − B can be rewritten using complement as:",["A ∩ B′","A ∪ B′","A′ ∩ B","A′ ∪ B"],0,"Difference = intersection with the complement of B.");
add("setops","A ∪ A′ always equals:",["U","∅","A","A′"],0,"A set and its complement together make up the whole universal set.");
add("setops","A ∩ A′ always equals:",["∅","U","A","A′"],0,"A set and its complement share nothing in common.");
add("setops","(A′)′ equals:",["A","A′","U","∅"],0,"Double complement returns the original set.");
add("setops","If A ⊂ B, then A ∩ B equals:",["A","B","∅","U"],0,"When A is inside B, intersecting gives back A.");
add("setops","If A ⊂ B, then A ∪ B equals:",["B","A","∅","U"],0,"Union of a subset with its superset gives the superset.");
add("setops","If A ⊂ B, then B′ is related to A′ by:",["B′ ⊂ A′","A′ ⊂ B′","B′ = A′","No relation"],0,"Subset direction reverses under complementation.");
add("setops","If A ⊂ B, then A ∪ (B − A) equals:",["B","A","∅","U"],0,"Filling in the 'gap' between A and B returns B.");
add("setops","U = {1,...,9}, A = {1,2,3,4}. A′ =",["{5,6,7,8,9}","{1,2,3,4}","∅","{1,...,9}"],0,"Complement = everything in U except A's elements.");
add("setops","A = {1,2,3,4}, B = {2,4,6,8}, C = {3,4,5,6}. A ∪ C =",["{1,2,3,4,5,6}","{3,4}","{1,2,5,6}","{2,4,6,8}"],0,"Combine all unique elements of A and C.");
add("setops","A = {1,2,3,4}, B = {2,4,6,8}, C = {3,4,5,6}. B ∪ C =",["{2,3,4,5,6,8}","{4}","{2,8}","{1,2,3,4}"],0,"Combine all unique elements of B and C.");
add("setops","(A ∪ B)′ is equal to:",["A′ ∩ B′","A′ ∪ B′","A ∩ B","A ∪ B"],0,"De Morgan's Law: complement of union = intersection of complements.");
add("setops","(A ∩ B)′ is equal to:",["A′ ∪ B′","A′ ∩ B′","A ∪ B","A ∩ B"],0,"De Morgan's Law: complement of intersection = union of complements.");
add("setops","In probability texts, A ∩ B is sometimes written as:",["AB (set-theoretic product)","A + B","A − B","A/B"],0,"Some probability texts denote intersection by simple juxtaposition, AB.");

/* ---------- UNIT 3: SET OF NUMBERS (24) ---------- */
add("numsets","The set of natural numbers N is:",["{1,2,3,...}","{...,-1,0,1,...}","{p/q : p,q ∈ Z}","All real numbers"],0,"N is the set of positive integers used for counting.");
add("numsets","The set of integers Z includes:",["...,-2,-1,0,1,2,...","Only positive whole numbers","Only fractions","Only irrational numbers"],0,"Z includes negatives, zero, and positives.");
add("numsets","Integers are closed under all of these EXCEPT:",["Division","Addition","Subtraction","Multiplication"],0,"3 ÷ 7 is not an integer — division is the exception.");
add("numsets","Rational numbers Q are numbers that can be written as:",["p/q where p, q are integers and q ≠ 0","Non-terminating non-repeating decimals","Only whole numbers","√ of a negative number"],0,"That is the defining property of rational numbers.");
add("numsets","Rational numbers are closed under all FOUR basic operations except:",["Division by zero","Addition","Subtraction","Multiplication"],0,"Division works too, EXCEPT dividing by zero.");
add("numsets","Irrational numbers (Q′) are numbers that:",["Cannot be expressed as a ratio of integers","Are always negative","Are always whole numbers","Are a subset of Z"],0,"Q′ is the complement of Q within R.");
add("numsets","Which of the following is irrational?",["√2","3/4","5","0.5"],0,"√2 cannot be written as a ratio of two integers.");
add("numsets","The correct nesting order of number systems is:",["N ⊂ Z ⊂ Q ⊂ R","R ⊂ Q ⊂ Z ⊂ N","Z ⊂ N ⊂ Q ⊂ R","Q ⊂ Z ⊂ N ⊂ R"],0,"Naturals sit inside Integers, inside Rationals, inside Reals.");
add("numsets","A rational number's decimal expansion:",["Eventually repeats a block of digits","Never terminates or repeats","Is always a whole number","Cannot be found by division"],0,"Rationals give terminating or repeating decimals.");
add("numsets","3/8 as a decimal is:",["0.375","0.383","0.125","0.475"],0,"Dividing 3 by 8 gives 0.375 exactly (terminating).");
add("numsets","2/11 as a decimal is:",["0.181818... (repeating)","0.2","0.1111...","0.909090..."],0,"This is a repeating (non-terminating block) decimal.");
add("numsets","a < b means:",["b − a is positive","a − b is positive","a = b","b is negative"],0,"This is the formal definition of 'less than'.");
add("numsets","If a < b and c is negative, then:",["bc < ac","ac < bc","a = b","ac = bc"],0,"Multiplying an inequality by a negative number REVERSES it.");
add("numsets","|x| is defined as:",["x if x ≥ 0, and −x if x < 0","Always negative","Always x","x² always"],0,"Absolute value strips the sign, keeping magnitude only.");
add("numsets","|x| < 5 means:",["−5 < x < 5","x > 5 or x < −5","x = 5 only","x < 0"],0,"Absolute value inequality unpacks into a two-sided range.");
add("numsets","Geometrically, |x| represents:",["Distance from x to the origin","The value of x squared","Always a negative number","The reciprocal of x"],0,"|x| is a distance, so it's always non-negative.");
add("numsets","(2,5) as an interval means:",["2 and 5 are excluded (open interval)","2 and 5 are both included","Only 2 is included","Only 5 is included"],0,"Parentheses denote an open (excluded-endpoint) interval.");
add("numsets","[2,5] as an interval means:",["2 and 5 are both included (closed interval)","2 and 5 are excluded","Only one endpoint is included","It is an infinite interval"],0,"Square brackets denote a closed (included-endpoint) interval.");
add("numsets","[2,5) is called a(n):",["Half-open (closed-open) interval","Fully open interval","Fully closed interval","Infinite interval"],0,"One endpoint included, one excluded.");
add("numsets","The intersection of two intervals is always:",["An interval","Never an interval","Always empty","Always the whole real line"],0,"Intersecting two intervals yields another interval (possibly empty/a point).");
add("numsets","A = (1,∞) represents:",["All x greater than 1","All x less than 1","x = 1 only","−1 < x < 1"],0,"This is an infinite interval extending to the right.");
add("numsets","A set A is bounded if:",["A is a subset of some finite interval","A is infinite","A contains 0","A equals R"],0,"Boundedness means fitting inside [−M, M] for some M.");
add("numsets","Which of these is an unbounded set?",["{2,4,6,8,...}","{1, 1/2, 1/3,...}","{7,350,-473,42}","{0,1}"],0,"This set of even numbers grows without limit.");
add("numsets","If a set is finite, then it is necessarily:",["Bounded","Infinite","Unbounded","Empty"],0,"Every finite set automatically fits inside some finite range.");

/* ---------- SEQUENCES & SERIES (24) ---------- */
add("seqseries","A sequence is:",["A succession of terms following a rule/formula","Always finite","The sum of terms","Always increasing"],0,"A sequence is an ordered list generated by a formula for Un.");
add("seqseries","A series is:",["The sum of terms of a sequence","The same as a sequence","Always infinite","Only used for AP"],0,"Series = summation, Sequence = the list itself.");
add("seqseries","In an A.P., the common difference d is found by:",["Subtracting a term from the next term (constant)","Dividing consecutive terms","Multiplying terms","Squaring terms"],0,"d = U(n+1) − Un, and it must stay constant.");
add("seqseries","The nth term of an A.P. is given by:",["Un = a + (n−1)d","Un = ar^(n−1)","Un = a + nd","Un = a/n"],0,"This is the standard A.P. nth term formula.");
add("seqseries","Find the common difference: 3,5,7,9,11...",["2","3","5","-2"],0,"5 − 3 = 2, confirmed by 7 − 5 = 2.");
add("seqseries","Find the common difference: 102, 99, 96, 93...",["-3","3","99","-99"],0,"99 − 102 = −3.");
add("seqseries","7th term of an A.P. with a=102, d=−3:",["84","102","99","81"],0,"U7 = 102 + 6(−3) = 102 − 18 = 84.");
add("seqseries","Sum of first n terms of an A.P. is given by:",["Sn = (n/2)[2a + (n−1)d]","Sn = a·r^n","Sn = n·d","Sn = a/(1−r)"],0,"Standard A.P. sum formula, derived by pairing terms.");
add("seqseries","In a G.P., the common ratio r is found by:",["Dividing a term by the previous term (constant)","Subtracting terms","Adding terms","Squaring the first term"],0,"r = U(n+1)/Un, and it must stay constant.");
add("seqseries","The nth term of a G.P. is given by:",["Un = ar^(n−1)","Un = a + (n−1)d","Un = a·n","Un = a/n"],0,"Standard G.P. nth term formula.");
add("seqseries","Find the common ratio: 2,6,18,54,162...",["3","2","6","18"],0,"6/2 = 3, confirmed by 18/6 = 3.");
add("seqseries","Which of these is a G.P., not an A.P.?",["1, 2, 4, 8, 16","1, 3, 5, 7, 9","2, 4, 6, 8, 10","5, 10, 15, 20"],0,"Each term is double the previous — constant RATIO, not difference.");
add("seqseries","Which of these is an A.P., not a G.P.?",["3, 5, 7, 9, 11","1, 2, 4, 8, 16","2, 6, 18, 54","1, 10, 100, 1000"],0,"Each term adds 2 — constant DIFFERENCE, not ratio.");
add("seqseries","A series is written compactly using which symbol?",["Σ (sigma)","Δ (delta)","∏ (pi)","∫ (integral)"],0,"Σ denotes summation of sequence terms.");
add("seqseries","If Un = 2n+1, then U1 =",["3","1","2","5"],0,"U1 = 2(1)+1 = 3.");
add("seqseries","If Un = 2n+1, then U3 =",["7","5","6","9"],0,"U3 = 2(3)+1 = 7.");
add("seqseries","An A.P. models real-life situations like:",["Fixed salary increments each year","Compound interest","Population doubling","Radioactive decay"],0,"Constant addition each period matches an A.P. pattern.");

function fisherYates(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function shuffleOptions(q){
  const idxArr = q.opts.map((_,i)=>i);
  fisherYates(idxArr);
  const newOpts = idxArr.map(i=>q.opts[i]);
  const newCorrect = idxArr.indexOf(q.correctIdx);
  return {...q, opts:newOpts, correctIdx:newCorrect};
}

  let pool = [...BANK];
  const order = document.getElementById("orderSelect").value;

  if(selectedMode==="topic"){
    const t = document.getElementById("topicSelect").value;
    if(t!=="all") pool = pool.filter(q=>q.topic===t);
  }

  if(order==="shuffle") pool = fisherYates([...pool]);

  let n = pool.length;
  if(selectedMode==="quick") n = Math.min(20,pool.length);
  else if(selectedMode==="half") n = Math.min(100,pool.length);
  else if(selectedMode==="full") n = Math.min(200,pool.length);

  quizQuestions = pool.slice(0,n).map(shuffleOptions);
  currentIdx = 0; score = 0; answered = [];

  document.getElementById("setupCard").style.display="none";
  document.getElementById("quizCard").style.display="block";
  renderQuestion();
});

function renderQuestion(){
  const q = quizQuestions[currentIdx];
  document.getElementById("qCounter").textContent = `Q ${currentIdx+1} / ${quizQuestions.length}`;
  document.getElementById("scoreLabel").textContent = `Score: ${score}/${currentIdx}`;
  document.getElementById("progFill").style.width = `${(currentIdx/quizQuestions.length)*100}%`;
  document.getElementById("qTopic").textContent = topicLabel(q.topic);
  document.getElementById("qText").textContent = q.q;
  document.getElementById("fb").classList.remove("show");
  document.getElementById("nextBtn").style.display="none";

  const wrap = document.getElementById("optsWrap");
  wrap.innerHTML="";
  q.opts.forEach((opt,i)=>{
    const btn = document.createElement("button");
    btn.className="opt"; btn.textContent = opt;
    btn.addEventListener("click", ()=>selectAnswer(i));
    wrap.appendChild(btn);
  });
}

function topicLabel(t){
  const map={sets:"Unit 1 — Sets",setops:"Unit 2 — Set Operations",numsets:"Unit 3 — Set of Numbers",
  seqseries:"Sequences & Series",quad:"Quadratic Equations",induction:"Mathematical Induction",
  complex:"Complex Numbers",circle:"Circular Measure"};
  return map[t]||t;
}

function selectAnswer(i){
  const q = quizQuestions[currentIdx];
  const opts = document.querySelectorAll(".opt");
  opts.forEach(o=>o.disabled=true);
  const isCorrect = i===q.correctIdx;
  if(isCorrect) score++;
  opts[i].classList.add(isCorrect?"correct":"wrong");
  if(!isCorrect) opts[q.correctIdx].classList.add("correct");

  const fb = document.getElementById("fb");
  fb.innerHTML = (isCorrect? "✅ Correct! " : "❌ Not quite. ") +
    `<br><span class="hack">🔥 EXAM HACK:</span> ${q.hack}`;
  fb.classList.add("show");
  document.getElementById("nextBtn").style.display="block";

  answered.push({q:q.q, opts:q.opts, correctIdx:q.correctIdx, chosen:i, isCorrect, hack:q.hack});
}

document.getElementById("nextBtn").addEventListener("click", ()=>{
  currentIdx++;
  if(currentIdx>=quizQuestions.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
});

function finishQuiz(){
  document.getElementById("quizCard").style.display="none";
  document.getElementById("resultCard").style.display="block";
  const pct = Math.round((score/quizQuestions.length)*100);
  document.getElementById("finalScore").textContent = `${pct}%`;
  document.getElementById("finalSub").textContent = `You scored ${score} out of ${quizQuestions.length}`;
}

document.getElementById("reviewBtn").addEventListener("click", ()=>{
  const wrong = answered.filter(a=>!a.isCorrect);
  const list = document.getElementById("reviewList");
  if(wrong.length===0){
    list.innerHTML = "<p style='color:var(--good)'>🔥 Perfect run — no wrong answers!</p>";
    return;
  }
  list.innerHTML = wrong.map(a=>`
    <div class="reviewitem wrong">
      <b>${a.q}</b><br>
      Your answer: ${a.opts[a.chosen]}<br>
      Correct: ${a.opts[a.correctIdx]}<br>
      <span class="hack">Hack:</span> ${a.hack}
    </div>`).join("");
});

document.getElementById("restartBtn").addEventListener("click", ()=>{
  document.getElementById("resultCard").style.display="none";
  document.getElementById("setupCard").style.display="block";
});
</script>
</body>
</html>
