<style>
:root{
  --bg:#120a07; --bg2:#1a0f0a; --card:#1c110b; --line:#4a2a17;
  --fire:#ff6a1a; --fire2:#d4400f; --gold:#ffb347; --text:#f3e7dc; --mute:#b49a88;
  --ok:#2ecc71; --okbg:rgba(46,204,113,.12); --bad:#ff4d4d; --badbg:rgba(255,77,77,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#3a1a0b 0%,var(--bg) 55%) fixed;
  color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh;
  padding:20px 16px 40px;line-height:1.5;
}
#app{max-width:720px;margin:0 auto}
h1.brand{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--fire);text-align:center;
  letter-spacing:.08em;font-size:2.1rem;margin:8px 0 6px;text-shadow:0 0 18px rgba(255,106,26,.35)}
.sub{font-family:'Orbitron',sans-serif;text-align:center;color:var(--mute);font-size:.9rem;letter-spacing:.06em;margin:0 0 20px}
.panel{background:linear-gradient(180deg,var(--card),#150c08);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
.panel h2{font-family:'Orbitron',sans-serif;color:var(--gold);text-align:center;font-size:1.35rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run{background:#150c08;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer;transition:.15s}
.run .n{display:block;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold);font-size:1.5rem;margin-bottom:2px}
.run.sel{background:linear-gradient(135deg,var(--fire),var(--fire2));border-color:var(--gold);box-shadow:0 0 16px rgba(255,106,26,.35)}
.run.sel .n{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;cursor:pointer;
  background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-family:'Exo 2',sans-serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.03em;box-shadow:0 8px 22px rgba(255,106,26,.28)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#150c08;border:1px solid var(--line);color:var(--text);box-shadow:none}
.foot{color:var(--mute);text-align:center;font-size:.92rem;margin-top:16px}
.chaps{margin-top:14px;display:none}
.chaps.show{display:block}
.chaps .tools{display:flex;gap:8px;margin-bottom:8px}
.chaps .tools button{flex:1;background:#150c08;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;font-weight:600;cursor:pointer}
.chap{display:flex;align-items:center;gap:10px;background:#150c08;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.chap.on{border-color:var(--gold);background:#24140c}
.chap .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#000}
.chap.on .box{background:var(--gold);border-color:var(--gold)}
.chap .nm{flex:1;font-size:.98rem}
.chap .ct{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.85rem}

/* progress + sections */
.secs{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px 4px}
.sec{border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:20px;padding:5px 11px;font-size:.82rem;cursor:pointer;font-family:inherit}
.sec.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
details.cres{border:1px solid var(--line);background:#150c08;border-radius:14px;margin-top:10px}
details.cres>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.cres>summary::-webkit-details-marker{display:none}
.cres .sr,.revise .sr{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.cres .sr{padding:8px 14px;border-top:1px solid var(--line)}
.revise{border:1px solid var(--bad);background:var(--badbg);border-radius:14px;padding:12px 14px;margin-top:14px}
.revise .sr{padding:6px 0}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--mute);margin-bottom:8px}
.top .sc{font-family:'Orbitron',sans-serif;font-size:.85rem}
.top .sc b.g{color:var(--ok)} .top .sc b.r{color:var(--bad)}
.bar{height:6px;background:#2a170d;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .25s}
.chtag{display:inline-block;font-size:.78rem;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);
  color:var(--text);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-family:inherit;font-size:1.02rem;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#2a170d;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem}
.opt:not(.locked):hover{border-color:var(--fire)}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .l{background:var(--ok);color:#001a0a}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#2a0000}
.fb{border:1px solid var(--line);border-left:4px solid var(--gold);background:#1a0f0a;border-radius:12px;padding:12px 14px;margin-top:6px}
.fb .v{font-weight:700;margin-bottom:6px}
.fb .v.ok{color:var(--ok)} .fb .v.no{color:var(--bad)}
.fb .trap{display:inline-block;background:var(--fire);color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.fb .ex{margin:0 0 8px}
.fb .hk{color:var(--gold);font-weight:600}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:12px;padding:13px 8px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.nav button.primary{background:linear-gradient(135deg,var(--fire),var(--fire2));border:0;color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

/* map */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.ov h3{font-family:'Orbitron',sans-serif;color:var(--gold);margin:0 0 10px;font-size:1.05rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:38px;border-radius:8px;border:1px solid var(--line);background:#150c08;color:var(--mute);font-family:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
.map button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.map button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--gold)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:10px 0}

/* result */
.big{font-family:'Orbitron',sans-serif;font-size:3rem;color:var(--gold);text-align:center;margin:6px 0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;color:var(--mute)}
.stats b{color:var(--text)}
.msg{text-align:center;color:var(--text);margin:8px 0 6px}
.rv{border:1px solid var(--line);background:#150c08;border-radius:14px;padding:12px 14px;margin-top:12px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .you{color:var(--bad)} .rv .cor{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a170d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}
@media (max-width:420px){.q{font-size:1.08rem}h1.brand{font-size:1.8rem}}
</style>
</head>

<script>
const DATA = [{"t":"Functions & Mapping","s":["Functions & Mapping"],"q":[["A relation f between sets A and B is called a function if and only if:",["Every element of A has at least one image in B","Every element of A has exactly one image in B","Every element of B has exactly one pre-image in A","Every element of A and B are equal in number"],1,"A function assigns EVERY element of the domain to a UNIQUE (exactly one) element of the codomain. Having no image, or more than one image, disqualifies a relation from being a function.","'Every element must be used, and used only ONCE' — that's the whole definition in one line.",0,0],["In the function y = f(x), the set of all possible input values x is called the:",["Range","Codomain","Domain","Image"],2,"The domain is the set of values the independent variable x is allowed to take.","Domain = 'do-main' input door. Range = what actually comes OUT.",0,0],["The set of all actual output values produced by a function is called its:",["Domain","Range","Codomain","Source set"],1,"The range is the SUBSET of the codomain that is actually hit by the function — the set of images that actually occur.","Codomain is the target set BEFORE checking what's hit; Range is what's ACTUALLY hit. Range ⊆ Codomain always.",0,0],["For f: A → B, set B is called the:",["Domain","Range","Codomain","Image set"],2,"B, the 'target' set that f maps into, is called the codomain — it may contain elements that are never actually output (those form the range only).","Codomain is stated upfront in f: A→B — it's the whole target set, whether or not every element gets hit.",0,0],["A relation h : A → B, where A = {a,b,c,d}, is defined by h(a)=s, h(b)=u, h(b)=t, h(c)=u, h(d)=t. Why is h NOT a function?",["Because d has no image","Because b has two different images","Because s is not used","Because A and B have different sizes"],1,"h(b) is assigned BOTH u and t — an element of the domain cannot map to two different elements of the codomain. That single flaw disqualifies h from being a function.","'Two arrows leaving the same dot' is always the fastest way to spot a non-function in a mapping diagram.",0,0],["A relation g : A → B, where A = {a,b,c,d}, is defined by g(a)=s, g(b)=u, g(c)=u, g(d)=t. This relation IS a function because:",["Every element of B has a pre-image","No two elements of A share an image","Every element of A has exactly one image, even if shared","g is one-to-one"],2,"A function only requires each domain element to have exactly ONE image — it's perfectly fine for two different domain elements to share the SAME image. That's still a valid function (just not one-one).","TWO elements can point to the SAME target — that's allowed. The only sin is ONE element pointing to TWO targets, or an element pointing to NOTHING.",0,0],["In the correspondence 'to each item in a supermarket there corresponds a price', the item is the:",["Dependent variable","Independent variable","The range value of that correspondence","The codomain of that correspondence"],1,"The item is chosen freely (input), and the price DEPENDS on which item is chosen — so item = independent variable, price = dependent variable.","Whichever quantity you pick FIRST and freely is independent; whatever RESULTS from that choice is dependent.",0,0],["If P = 4L is the perimeter of a square office of side L, then in function language:",["P is a function of L; L is independent, P is dependent","L is a function of P; P is independent, L is dependent","P and L are both independent variables","This is not a valid function since P has multiple values for one L"],0,"P is written explicitly in terms of L (P = f(L) = 4L), so L is the independent variable and P, which depends on L, is the dependent variable.","Whatever sits alone on the left of the '=' is the dependent variable; whatever it's expressed IN TERMS OF is independent.",0,0],["The words 'function' and ______ are used interchangeably in most calculus texts.",["Relation","Mapping","Codomain","Interval"],1,"Every function is a specific kind of mapping (one with the added rule that each input has exactly one output), so 'function' and 'mapping' are commonly used as synonyms.","All functions are mappings, but not all mappings are functions unless they satisfy the one-image-per-input rule.",0,0],["y = f(x) is read as:",["y times f times x","f of x","f is x","y equals f multiplied by x"],1,"f(x) denotes the value the function f assigns to x, and is read 'f of x', NOT as a multiplication of f and x.","The brackets in f(x) are NOT multiplication — a classic beginner trap.",0,0],["A mapping is called one-one (injective) if:",["Every element of the co-domain has an image","Different elements in the domain have different images in the co-domain","Every element of the domain has the same image","The domain and co-domain are equal sets"],1,"One-one (injective) means distinct inputs always give distinct outputs — no two different domain elements are allowed to collide on the same image.","One-one = 'no two arrows land on the same target.' If any two dots share a landing spot, it fails one-one.",0,0],["A mapping is called onto (surjective) if:",["Every element of the co-domain is the image of some element","Every element in the domain has a unique image","The mapping is also one-one","The range is a proper subset of the co-domain"],0,"Onto means the range EQUALS the entire co-domain — nothing in the target set is left unhit.","Onto = 'every target gets hit at least once.' Range = Co-domain is the quick test.",0,0],["A mapping where every element of the domain is sent to the SAME single element of the co-domain is called:",["Identity mapping","One-one mapping","Constant mapping","Onto mapping"],2,"A constant mapping collapses the entire domain onto one fixed image — its range is a singleton set.","Constant mapping = every arrow lands on the exact same dot, no exceptions.",0,0],["A mapping f : A → A where f(a) = a for every element a in A is called:",["Constant mapping","Identity mapping","Onto mapping only","Signum mapping"],1,"The identity mapping sends every element to ITSELF — nothing changes under this mapping.","Identity mapping is the 'do-nothing' function — output always equals input.",0,0],["Which of the following mapping types is automatically BOTH one-one and onto?",["Constant mapping","Signum function","Identity mapping","Floor function"],2,"Since the identity mapping sends every element to itself, distinct inputs never collide (one-one) and every element of the co-domain (which equals the domain here) is hit (onto).","A mapping that's both one-one AND onto is called a BIJECTION — the identity mapping is the simplest possible example.",0,0],["A function whose domain is a singleton set (contains just one element) is ALWAYS a:",["Onto function","One-one function","Constant function","Identity function"],2,"With only one input available, that single input can only produce one output — automatically satisfying the definition of a constant function (range is a singleton).","One input, one output — technically constant by default, no matter what the rule looks like.",0,0],["The sum, product, and quotient of two constant functions is:",["Always a one-one function","Always an onto function","Always another constant function","Never defined"],2,"Constants combined by addition, multiplication, or division (when defined) still produce a single fixed value — so the result is still constant.","Constant ± constant, constant × constant, constant ÷ constant → still constant, every time.",0,0],["Can a constant mapping (with more than one element in the domain) ever be one-one?",["Yes, this is always possible","No, never (unless the domain has only one element)","Only when the co-domain happens to be infinite","Only when it also happens to be onto"],1,"A constant mapping sends every domain element to the SAME image — so as soon as the domain has 2+ elements, two different inputs share one output, breaking one-one.","Constant mappings and one-one mappings are natural enemies once the domain has more than 1 element.",0,0],["In an identity mapping f: A → A, what is the range of f?",["A proper subset of A","Empty set","Exactly equal to A","A single element of A"],2,"Since f(a)=a for every a in A, every element of A is hit — so the range is precisely A itself.","For identity mapping, Domain = Co-domain = Range, all exactly the same set.",0,0],["Which pair correctly matches a mapping type with its defining test?",["One-one — range equals co-domain","Onto — different inputs give different outputs","Constant — every input gives the same output","Identity — no elements have images"],2,"Constant mapping's defining feature is that every single input, regardless of value, produces the exact same output.","Don't mix up the tests — 'different in, different out' is ONE-ONE; 'nothing left unhit' is ONTO.",0,0],["f(x) = a_n x^n + a_(n-1)x^(n-1) + ... + a_1 x + a_0 is called a polynomial function of degree n provided:",["a_0 ≠ 0","a_n ≠ 0","n is even","All coefficients are positive"],1,"The degree of a polynomial is the highest power with a NON-ZERO coefficient — so a_n (the leading coefficient) must be nonzero for the degree to genuinely be n.","If the LEADING coefficient a_n were zero, the highest term would vanish and the 'degree n' label would be a lie.",0,0],["f(x) = 5 (a constant) is a polynomial of order/degree:",["1","0","Undefined","Infinity"],1,"A constant function corresponds to n = 0 in the general polynomial form, making it a 'polynomial of order zero'.","Constant → degree 0. Linear (a₀+a₁x) → degree 1. Just count the highest power of x present.",0,0],["f(x) = a₀ + a₁x (with a₁ ≠ 0) is called a:",["Quadratic function","Constant function","Linear function","Cubic function"],2,"This is the general first-degree polynomial — a straight-line (linear) function.","Straight line ↔ degree 1 ↔ 'linear'.",0,0],["A function h(x) = f(x)/g(x), where f and g are polynomials and g is not the zero polynomial, is called a:",["Irrational algebraic function","Rational algebraic function","Transcendental function","Logarithmic function"],1,"Any function expressible as the QUOTIENT of two polynomials is, by definition, a rational (algebraic) function.","'Rational' in maths always means 'a ratio' — here, a ratio of two polynomials.",0,0],["An algebraic function that CANNOT be expressed as the quotient of two polynomials is called:",["A rational algebraic function","An irrational algebraic function","A transcendental function","A constant function"],1,"When an algebraic function (one satisfying a polynomial equation in y) can't be written as a clean polynomial-over-polynomial ratio (e.g. it involves roots like √x), it's called irrational — still algebraic, just not rational.","Don't confuse 'irrational algebraic function' with 'transcendental' — irrational algebraic functions (like √x) still satisfy a polynomial equation; transcendental ones (like sin x) don't.",0,0],["Which of the following is classified as a TRANSCENDENTAL function?",["f(x) = x² + 3x - 1","f(x) = (2x-1)/(x+2)","f(x) = sin x","f(x) = √x"],2,"Transcendental functions are those that do NOT satisfy any polynomial equation P₀(x)yⁿ+...+Pₙ(x)=0 — trigonometric, exponential, and logarithmic functions all fall into this class. Polynomials, rational functions, and root functions are all algebraic, not transcendental.","If it involves sin, cos, tan, ln, log, or eˣ, it's transcendental — no polynomial equation can trap it.",0,0],["Which of these does NOT belong to the transcendental function family?",["Exponential function","Logarithmic function","Trigonometric function","Rational function"],3,"A rational function (ratio of two polynomials) is ALGEBRAIC, not transcendental — it's the odd one out among these four categories.","Odd-one-out trick: three of the options are 'transcendental family', one is 'algebraic family' — spot the mismatch.",0,0],["Logarithmic function f(x) = log_a(x) requires which condition(s) on the base a?",["a > 0 and a ≠ 1","a can be any real number","a must be negative","a must equal e only"],0,"By definition, f(x) = log_a(x) ⟺ x = aʸ, which requires x>0, a>0 and a≠1 (a base of 1 or a negative base makes the logarithm undefined/inconsistent).","Log base rules: base must be POSITIVE and NOT EQUAL TO 1 — memorize this pair together.",0,0],["If g(x) = a^x and f(z) = log_a(z), then g(f(z)) equals:",["z","a","log_a(a)","a·z"],0,"g and f are inverse functions of each other, so composing them returns the original input: a^(log_a z) = z.","Exponential and logarithm (same base) UNDO each other completely — that's the entire point of them being inverses.",0,0],["7ˣ is an example of a(n):",["Logarithmic function","Exponential function","Polynomial function","Rational function"],1,"f(x) = aˣ, with a fixed positive base and x as the variable EXPONENT, is the general form of an exponential function — 7ˣ fits this exactly.","Variable in the EXPONENT → exponential. Variable INSIDE the log → logarithmic. Don't mix them up.",0,0],["Trigonometric (circular) functions relate the angles of a triangle to:",["The area of the triangle","The length of its sides","The perimeter only","Its centroid"],1,"By definition, trigonometric functions like sine, cosine, and tangent express relationships between a triangle's angles and the LENGTHS of its sides.","SOH-CAH-TOA is literally angle-vs-side-length — the definition in a nutshell.",0,0],["Inverse trigonometric functions are also known as:",["Circular functions","Cyclometric functions","Hyperbolic functions","Exponential functions"],1,"Inverse trig functions (sin⁻¹x, cos⁻¹x, tan⁻¹x, etc.) carry the alternative name 'cyclometric functions'.","'Cyclometric' is just the formal alias for inverse trig — a common trick-question label.",0,0],["Hyperbolic functions like sinh x and cosh x are defined in terms of:",["Logarithmic functions","Exponential functions","Polynomial functions","Trigonometric functions only"],1,"sinh x = (eˣ − e⁻ˣ)/2 and cosh x = (eˣ + e⁻ˣ)/2 — both built directly from the exponential function.","Hyperbolic functions share NAMES with trig functions but are built from eˣ, not from angles on a circle.",0,0],["tanh x is defined as:",["(eˣ+e⁻ˣ)/2","(eˣ−e⁻ˣ)/(eˣ+e⁻ˣ)","(eˣ+e⁻ˣ)/(eˣ−e⁻ˣ)","2/(eˣ−e⁻ˣ)"],1,"tanh x = sinh x / cosh x = (eˣ−e⁻ˣ)/(eˣ+e⁻ˣ), matching the familiar tan = sin/cos pattern but with hyperbolic functions.","tanh mirrors tan = sin/cos exactly — just substitute the hyperbolic versions of sin and cos.",0,0],["The inverse hyperbolic functions (e.g. sinh⁻¹x, cosh⁻¹x) are the inverse functions of:",["The trigonometric functions","The hyperbolic functions","The logarithmic functions","The exponential functions directly"],1,"Just as sin⁻¹ inverts sin, sinh⁻¹ inverts sinh, and so on — inverse hyperbolic functions undo their corresponding hyperbolic function.","Match the '-h' family together: hyperbolic functions ↔ inverse HYPERBOLIC functions, a separate pairing from trig ↔ inverse trig.",0,0],["Which of these is an example of an inverse trigonometric function?",["y = sin x","y = sin⁻¹x","y = sinh x","y = eˣ"],1,"y = sin⁻¹x is precisely the inverse of the sine function, restricted appropriately so it remains single-valued.","The superscript '-1' after a trig name signals INVERSE trig, not '1 divided by' the function.",0,0],["sech x is defined as:",["1/sinh x","1/cosh x","1/tanh x","cosh x/sinh x"],1,"Just as sec x = 1/cos x, sech x = 1/cosh x — the reciprocal of the hyperbolic cosine.","Reciprocal-name pattern holds for hyperbolic too: sech=1/cosh, cosech=1/sinh, coth=1/tanh.",0,0],["cosech x is defined as:",["1/cosh x","1/sinh x","cosh x/sinh x","sinh x/cosh x"],1,"cosech x (also written csch x) is the reciprocal of sinh x, mirroring how cosec x = 1/sin x in ordinary trigonometry.","Watch the letters carefully — 'cosech' pairs with SINh (reciprocal), not coSH.",0,0],["For a constant function f(x) = c on domain A, which statement is FALSE?",["f(x) = c for every x in A","The range of f is a singleton {c}","f is automatically one-one if A has more than one element","The sum of two constant functions is still constant"],2,"A constant function with more than one element in its domain sends multiple inputs to the SAME output c — this directly violates one-one. So this statement is false (and is the odd one out).","Trap alert — 'constant' and 'one-one' contradict each other whenever the domain has 2+ elements.",0,0],["The identity function Id: ℝ → ℝ is defined by:",["Id(x) = 0 for all x","Id(x) = x for all x","Id(x) = 1 for all x","Id(x) = -x for all x"],1,"By definition, the identity function maps every real number to itself — Id(x) = x.","'Identity' = 'stays the same' — output is a carbon copy of the input.",0,0],["The signum function, sgn(x), takes which THREE values only?",["{-1, 0, 1}","{0, 1, 2}","{-1, 1}","All real numbers"],0,"sgn(x) = 1 if x>0, 0 if x=0, and −1 if x<0 — its range is exactly the three-element set {−1, 0, 1}.","Signum just reports the SIGN of a number as one of three flags: negative, zero, or positive.",0,0],["sgn(-7) equals:",["-7","-1","0","1"],1,"Since −7 is negative, sgn(−7) = −1 by definition (the signum function ignores magnitude, only reports sign).","Signum couldn't care less about magnitude — only the SIGN matters, so sgn(-7)=sgn(-0.001)=-1.",0,0],["The Heaviside step function H(x) is defined by H(x)=1 for x≥0 and H(x)=0 for x<0. What is the range of H?",["{0, 1}","{-1, 0, 1}","All non-negative reals","ℝ"],0,"H only ever outputs 0 or 1 — a two-value 'switch' function, so its range is exactly {0, 1}.","Heaviside is an on/off switch: 0 before the 'trigger' point, 1 from that point onward (unlike sgn, which has a middle zero-only value that isn't shared with negatives).",0,0],["The modulus (absolute value) function |x| satisfies which property for ALL real x?",["|x| < 0","|x| = 0 only when x is negative","|-x| = |x|","|x| = x always"],2,"The absolute value function is symmetric: reflecting x to −x doesn't change its distance from zero, so |−x| = |x| always holds. (|x| ≥ 0 always, and |x|=x only when x≥0, so the other options are false.)","|x| measures DISTANCE from zero — direction (sign) never matters, hence |-x|=|x|.",0,0],["For every real number x, the Floor function ⌊x⌋ gives:",["The smallest integer greater than or equal to x","The greatest integer less than or equal to x","The nearest integer to x","x rounded up always"],1,"Floor rounds DOWN to the nearest integer — it's the greatest integer that does not exceed x.","Floor = 'push down to the ground' — always rounds toward negative infinity.",0,0],["The Ceiling function ⌈x⌉ gives, for every real x:",["The greatest integer ≤ x","The smallest integer ≥ x","x itself if x is negative","The average of floor(x) and x"],1,"Ceiling rounds UP to the nearest integer — the smallest integer not less than x.","Ceiling = 'push up to the roof' — always rounds toward positive infinity.",0,0],["What are the floor and ceiling of 7.92 respectively?",["7 and 8","8 and 7","7 and 7","8 and 8"],0,"⌊7.92⌋ = 7 (round down) and ⌈7.92⌉ = 8 (round up).","For any non-integer, floor and ceiling are always exactly ONE apart.",0,0],["What are the floor and ceiling of -9.5?",["-10 and -9","-9 and -10","-9 and -9","-10 and -10"],0,"Floor rounds toward −∞: ⌊−9.5⌋ = −10. Ceiling rounds toward +∞: ⌈−9.5⌉ = −9.","With negatives, 'round down' means MORE negative — a common trap students fall into.",0,0],["For an INTEGER value like x = 8, what are floor(8) and ceiling(8)?",["7 and 9","8 and 8","8 and 9","7 and 8"],1,"When x is already an integer, both floor and ceiling simply return x itself, since x is trivially both the greatest integer ≤ x and the smallest integer ≥ x.","Floor and ceiling COLLAPSE to the same value whenever the input is already a whole number.",0,0],["A function f is said to be single-valued if:",["Each value of y corresponds to only one value of x","Each value of x corresponds to only one value of y","x and y are always equal","f has only one root"],1,"Single-valued means each input x produces exactly one output y — this is really just restating what makes something a function in the first place.","'Single-valued' is the book's other name for the core function rule — one clean output per input.",0,0],["A function f is called EVEN if, for every x in its domain:",["f(-x) = f(x)","f(-x) = -f(x)","f(x) = 0","f(-x) = 1/f(x)"],0,"An even function is symmetric about the y-axis: replacing x with −x leaves the output unchanged, f(−x)=f(x).","EVEN → mirror image across the y-axis. Think of x² — same output whether x is +3 or −3.",0,0],["A function f is called ODD if, for every x in its domain:",["f(-x) = f(x)","f(-x) = -f(x)","f is always negative","f(0) must equal 1"],1,"An odd function has 180° rotational symmetry about the origin: f(−x) = −f(x).","ODD → rotate 180° about the origin. Think of x³ — flipping the sign of x flips the sign of the output too.",0,0],["Which of the following is an EVEN function?",["f(x) = x³","f(x) = sin x","f(x) = x²","f(x) = x"],2,"f(x)=x² satisfies f(−x) = (−x)² = x² = f(x) — the defining property of an even function.","ALL even-power terms (x², x⁴, cos x, e^(-x²)) tend to be even functions.",0,0],["Which of the following is an ODD function?",["f(x) = cos x","f(x) = x²","f(x) = |x|","f(x) = sin x"],3,"sin(−x) = −sin(x) for all x, satisfying the odd-function definition exactly.","sin x is the classic odd function; cos x is the classic even function — never mix these two up.",0,0],["The graph of an odd function is symmetric with respect to:",["The y-axis","The x-axis","The origin","The line y = x"],2,"Odd functions have point symmetry about the origin — rotating the graph 180° about (0,0) maps it onto itself.","Even = y-axis mirror. Odd = origin rotation. Two totally different symmetries — don't confuse them.",0,0],["The graph of an even function is symmetric with respect to:",["The origin","The y-axis","The x-axis","No particular symmetry"],1,"Even functions mirror perfectly across the y-axis — the left half is a reflection of the right half.","'Even' and 'y-axis symmetry' should trigger together in your memory instantly.",0,0],["e^(-x²) is an example of a(n):",["Odd function","Even function","Neither even nor odd","Constant function"],1,"Since (−x)² = x² regardless of the sign of x, e^(−(−x)²) = e^(−x²) — so this function is even.","If x only ever appears SQUARED (or in any even power) inside a function, the whole function is typically even.",0,0],["For a function f: A → B, if f(x) is graphed, the y-coordinate of any point (x, f(x)) on the graph represents:",["The domain of f","The height of f above the point x","The codomain of f","A critical point"],1,"Since y=f(x), the y-coordinate of any graph point IS the value (height) of the function at that particular x.","Reading a graph is literally reading heights — the y-value at any x tells you f(x) directly.",0,0],["Which functions are NEITHER even nor odd, typically having no special symmetry about the y-axis or the origin?",["Polynomial functions with only even powers","Polynomial functions with only odd powers","Exponential functions like aˣ","Trigonometric sine functions"],2,"Exponential functions like aˣ generally satisfy neither f(−x)=f(x) nor f(−x)=−f(x) — they have no reflective or rotational symmetry, unlike pure even/odd-power polynomials or sin/cos.","Not every function is even or odd — exponentials like aˣ are the standard textbook example of 'neither'.",0,0],["If f(-x) = f(x) for all x, and also g(-x) = -g(x) for all x, then f is _____ and g is _____.",["odd; even","even; odd","even; even","odd; odd"],1,"f(−x)=f(x) is the even-function condition; g(−x)=−g(x) is the odd-function condition.","Match the SIGN pattern to the label: no sign change on f(-x) → even; sign flips → odd.",0,0],["f(x) = 1/x is an example of a rational function. What is a key feature of its graph?",["It passes cleanly through the origin point","It has a break (discontinuity) at x = 0","It forms an ordinary straight diagonal line","It stays bounded strictly between -1 and 1"],1,"1/x is undefined at x=0 (division by zero), so its graph has a vertical asymptote there — a clear gap/break in the curve.","Rational functions break wherever the DENOMINATOR hits zero — always check that first.",0,0],["The graph of f(x) = √x (for x ≥ 0) starts at the point:",["(0, 1)","(1, 0)","(0, 0)","(-1, 0)"],2,"Since √0 = 0, the square root function's graph begins right at the origin (0,0) and rises from there.","√x only accepts x ≥ 0, and its smallest possible output is 0 — so it must start exactly at the origin.",0,0],["Which function's graph is a straight line passing through the origin with slope 1?",["f(x) = x","f(x) = x²","f(x) = 1/x","f(x) = |x|"],0,"f(x) = x is the identity function — its graph is the straight line y = x, slope 1, through the origin.","The identity function's graph is the diagonal line every 'y=x' reflection is measured against.",0,0],["The graph of f(x) = x³ (cubing function) is symmetric about:",["The y-axis","The x-axis","The origin","The line y = -x"],2,"x³ is an odd function (since (−x)³ = −x³), so its graph has origin symmetry.","Any pure odd-power function (x, x³, x⁵...) is automatically origin-symmetric.",0,0],["The graph of f(x) = |x| (modulus function) forms what characteristic shape?",["A smooth, rounded parabola shape","A V-shape with a sharp corner at the origin","An ordinary straight diagonal line","A perfectly circular shape"],1,"|x| equals x for x≥0 and -x for x<0 — two straight-line pieces meeting at a sharp corner (0,0), forming a V shape.","|x|'s sharp corner at the origin means it is NOT differentiable there — a common exam trap.",0,0],["For the exponential graphs f(x)=aˣ with a>1 (e.g. 2ˣ, 3ˣ), as x → -∞, f(x) approaches:",["+∞","0","1","-∞"],1,"As x becomes very negative, aˣ (a>1) shrinks toward zero but never actually reaches it — the x-axis is a horizontal asymptote.","Exponential graphs with base > 1 hug the x-axis on the LEFT side and shoot up fast on the right.",0,0],["For f(x) = (1/2)ˣ, as x increases (x → +∞), f(x):",["Grows without bound","Approaches 0","Stays constant at 1","Becomes negative"],1,"With a base between 0 and 1, the exponential DECAYS as x increases, shrinking toward (but never reaching) 0.","Base > 1 → grows to the right. Base between 0 and 1 → decays to the right. Flip your intuition for fractional bases.",0,0],["All exponential curves of the form f(x) = aˣ (for any valid base a) pass through which common point?",["(1, 0)","(0, 1)","(0, 0)","(1, 1)"],1,"Since a⁰ = 1 for any positive base a ≠ 1, every exponential curve aˣ passes through (0, 1).","'Anything to the power 0 is 1' — that's why (0,1) is the universal meeting point of all exponential graphs.",0,0],["What is the domain of f(x) = 1/x?",["All real numbers","All real numbers except 0","All positive real numbers only","All real numbers except 1"],1,"1/x is defined for every real number EXCEPT x=0, where the function is undefined (division by zero).","Whenever you see a variable in the denominator, immediately ask 'what value makes this zero?' — that's excluded from the domain.",0,0],["What is the domain of f(x) = √x?",["All real numbers","x ≥ 0 only","x > 0 only","x ≤ 0 only"],1,"The square root of a negative number isn't real, so the domain is restricted to x ≥ 0 (zero is allowed since √0=0 is defined).","Even roots (√, ⁴√...) demand a NON-NEGATIVE input — always set the inside ≥ 0 to find the domain.",0,0]]},{"t":"Limits & Continuity","s":["Limits & Continuity"],"q":[["lim(x→c) f(x) = L means:",["f(c) = L exactly","As x approaches c, f(x) approaches L (f(c) need not equal L)","f is continuous at c","x always equals c"],1,"The limit describes the behaviour of f(x) as x approaches c — it says nothing about (and doesn't require) f actually being defined AT c itself.","A limit is about the JOURNEY toward c, not the destination — f(c) can even be undefined and the limit can still exist.",0,0],["The notation lim(x→c⁻) f(x) refers to the:",["Right-hand limit","Left-hand limit","Value of f at c","Limit as x→∞"],1,"The minus superscript on c⁻ signals x approaching c FROM THE LEFT (values slightly less than c).","Minus sign (c⁻) = coming from the left (below); plus sign (c⁺) = coming from the right (above).",0,0],["The notation lim(x→c⁺) f(x) refers to the:",["Left-hand limit","Right-hand limit","Two-sided limit","Value at infinity"],1,"The plus superscript on c⁺ means x approaches c FROM THE RIGHT (values slightly greater than c).","Think of c⁺ as 'just a tiny bit ABOVE c' — approaching from higher values.",0,0],["For lim(x→c) f(x) = L to exist (as a two-sided limit), what must be true?",["f(c) must be defined","The left-hand and right-hand limits must both exist and match","f must be a polynomial","c must equal L"],1,"A two-sided limit exists ONLY when approaching from the left and from the right both give the SAME value — if they disagree, the overall limit doesn't exist.","Left limit = Right limit is the golden rule — any mismatch means the limit simply does not exist (DNE).",0,0],["lim(x→1) (5x + 9) equals:",["9","14","5","1"],1,"Direct substitution: 5(1)+9 = 14. Polynomials are continuous everywhere, so the limit equals the direct plug-in value.","For any polynomial, limits are found by SIMPLE SUBSTITUTION — no special tricks needed.",0,0],["If lim(x→c⁻) f(x) = 3 and lim(x→c⁺) f(x) = 5, what can we conclude about lim(x→c) f(x)?",["It equals 4 (the average)","It equals 3","It equals 5","It does not exist"],3,"Since the left-hand and right-hand limits disagree (3 ≠ 5), the two-sided limit does not exist at c.","Never average mismatched one-sided limits — a disagreement simply means DNE, full stop.",0,0],["Which of these situations does NOT prevent lim(x→c) f(x) from existing?",["f undefined at c, but both one-sided limits still agree","The left-hand limit differs from the right-hand limit","f oscillates infinitely as x→c","f→+∞ as x→c"],0,"A limit can perfectly well exist even if f(c) itself is undefined — the limit only cares about the approach, not the destination point.","A 'hole' at x=c (undefined point) does NOT stop a limit from existing — only mismatched or infinite/oscillating behaviour does.",0,0],["lim(x→c) f(x) = L is sometimes described informally as: as x tends to c, f(x) tends to:",["c","L","0","Infinity always"],1,"By definition/notation, the limit value that f(x) approaches is called L — matching the right-hand side of the limit statement.","Read lim(x→c)f(x)=L literally: 'x heads toward c, and f(x) heads toward L' — two separate journeys.",0,0],["Limits are described in the textbook as categorised into two types:",["Positive and negative limits","Left and right limits","Finite and infinite limits only","Rational and irrational limits"],1,"The manual explicitly splits limits into those approaching 'from the left' and those approaching 'from the right' of a point c.","Left/right is the FIRST split you learn — infinite limits and special limits come later as extensions.",0,0],["Without limits, which branch of mathematics would 'not exist' according to the foundational idea in the textbook?",["Algebra","Calculus","Geometry","Statistics"],1,"Limits are the foundational building block of calculus — derivatives and integrals are both DEFINED using limits.","Every single calculus concept (derivative, integral, continuity) traces back to the limit concept — it's the bedrock.",0,0],["A function f is continuous at c FROM THE RIGHT if:",["f(c) is defined and lim(x→c⁺) f(x) = f(c)","lim(x→c⁻) f(x) exists only","f(c) simply equals zero at that point","f happens to be an ordinary polynomial"],0,"Right-continuity requires BOTH that f(c) is actually defined AND that the right-hand limit matches f(c) exactly.","Continuity always needs TWO things to line up: the function value AND the limit — matching them is the whole game.",0,0],["A function f is continuous at c FROM THE LEFT if:",["f(c) is defined and lim(x→c⁻) f(x) = f(c)","lim(x→c⁺) f(x) exists only","f evaluated one unit before c equals zero","f has no breaks anywhere in its whole domain"],0,"Left-continuity mirrors right-continuity but uses the LEFT-hand limit: f(c) must be defined and equal to lim(x→c⁻) f(x).","Swap 'right' for 'left' and the definition structure stays identical — just change which side you approach from.",0,0],["A function f is (two-sided) continuous at c if:",["f(c) is defined, and lim(x→c) f(x) = f(c)","f(c) simply equals zero at that point","f is differentiable at c","The domain of f consists of all real numbers"],0,"Full (two-sided) continuity at c requires f(c) to be defined AND the two-sided limit to exist and equal f(c) exactly.","Continuity = 'no jump, no hole, no break' — you can draw the graph through that point without lifting your pen.",0,0],["If lim(x→c) f(x) exists but does NOT equal f(c), then f is:",["Continuous at c","Discontinuous at c","Differentiable at c","Undefined everywhere"],1,"Even if the limit exists, a mismatch between the limit value and the actual function value f(c) makes f discontinuous at that point (a 'removable' discontinuity).","A limit existing is NOT the same as continuity — the limit must also MATCH the actual function value at that point.",0,0],["If f(c) is undefined, can f still have a limit at x = c?",["No, never","Yes — the limit depends on values near c, not at c itself","Only if f is a polynomial","Only if c = 0"],1,"Limits examine behaviour AROUND c, not the value exactly at c — so a limit can exist perfectly well even where f(c) itself is undefined (this is exactly why continuity is a STRONGER condition than 'limit exists').","This is precisely why continuity needs f(c) defined AS WELL AS the limit — the limit alone isn't enough.",0,0],["A point where a function's graph has a visible 'jump' (like a step) is a point where the function is:",["Continuous at that exact point","Discontinuous (jump discontinuity)","Differentiable at that exact point","Increasing at that exact point"],1,"A jump means the left-hand and right-hand limits disagree — the two-sided limit fails to exist, so the function is discontinuous there.","Visually, ANY place you'd need to lift your pen off the paper to draw the graph is a discontinuity.",0,0],["h(x) = (2+x)(x+1)/(9+x) has a point of discontinuity where:",["x = -2","x = -1","x = -9","x = 9"],2,"The function is undefined wherever the denominator is zero: 9+x=0 ⟹ x=-9.","For a rational function, discontinuities occur exactly where the DENOMINATOR vanishes — check that first, always.",0,0],["f(x) = (x²+x-6)/(x+7) is discontinuous at:",["x = 6","x = -6","x = 7","x = -7"],3,"Setting the denominator to zero: x+7=0 ⟹ x=-7, which is where f is undefined.","Ignore the numerator when hunting for discontinuities in a rational function — only the denominator's zeros matter.",0,0],["g(x) = (x²-4)/(x-1) is discontinuous at:",["x = 2","x = -2","x = 1","x = 4"],2,"The denominator x-1 equals zero when x=1, making g undefined (and discontinuous) exactly there.","A numerator having its OWN zeros (like x²-4=0 at x=±2) is irrelevant to discontinuity — only the bottom matters.",0,0],["For f(x)=5/(x+3), is f continuous at x = -3?",["Yes, always","No, f is undefined at x=-3, so it can't be continuous there","Yes, because 5 is a constant","Only if x is positive"],1,"Since f(-3) is undefined (division by zero), continuity — which REQUIRES f(c) to be defined — automatically fails at that point.","An undefined function value is an automatic, instant fail for continuity at that point — no further checking needed.",0,0],["According to the limit theorems, if f(x) = c (a constant), then lim(x→a) f(x) equals:",["a","c","0","Undefined"],1,"The limit of a constant function is simply that constant, regardless of what a is — nothing changes as x moves.","A constant never changes, so its limit anywhere is just... itself.",0,0],["lim(x→a) [c·f(x)] equals:",["c · lim(x→a) f(x)","lim(x→a) f(x) + c","c + lim(x→a) f(x)","f(a)/c"],0,"A constant multiplier can be pulled straight OUT of the limit — this is the constant-multiple rule for limits.","Constants are 'lazy' — they don't need to interact with the limiting process at all, just factor them out.",0,0],["lim(x→a) [f(x) ± g(x)] equals:",["lim f(x) ± lim g(x)","lim f(x) · lim g(x)","(lim f(x))^(lim g(x))","Undefined unless f=g"],0,"The limit of a sum (or difference) equals the sum (or difference) of the individual limits — provided both individual limits exist.","Limits DISTRIBUTE over addition and subtraction — split them apart term by term.",0,0],["lim(x→a) [f(x)·g(x)] equals:",["The sum of lim f(x) and lim g(x) instead","[lim f(x)]·[lim g(x)]","The quotient of lim f(x) and lim g(x) instead","Something that can never be determined at all"],1,"The limit of a product equals the product of the limits (again, provided each individual limit exists).","Product rule for limits: multiply the two SEPARATE limit answers together, don't try to multiply the functions first.",0,0],["lim(x→a) [f(x)/g(x)] equals [lim f(x)] / [lim g(x)], PROVIDED that:",["f(x) is a polynomial","lim(x→a) g(x) ≠ 0","g(x) is always positive","a = 0"],1,"The quotient rule for limits requires the denominator's limit to be NON-ZERO — otherwise the quotient of limits is undefined (though the original limit might still exist via other techniques, like factoring).","Division by a zero limit is the classic trigger for '0/0' indeterminate forms — that's when you factor/simplify FIRST.",0,0],["lim(x→a) ⁿ√f(x) equals ⁿ√[lim(x→a) f(x)], provided that:",["n is even only","n is odd only","The resulting nth root of that limit is a defined real number","f(x) is a constant"],2,"The nth-root limit rule requires that taking the nth root of the LIMIT actually produces a well-defined real result (e.g. no even root of a negative number).","Push the limit INSIDE the root sign — but always sanity-check that the resulting root actually makes sense (no negative under an even root).",0,0],["For any positive integer n, lim(x→a) 1/xⁿ (as a→∞) equals:",["1","0","∞","n"],1,"As x grows without bound, 1/xⁿ shrinks toward zero for any positive power n.","Anything of the form (constant)/xⁿ vanishes to 0 as x→∞ — a very common building block in bigger limit problems.",0,0],["Which limit law justifies splitting lim(x→2)[3x² + 5x] into lim(x→2)3x² + lim(x→2)5x?",["Product rule","Quotient rule","Sum rule","Constant rule"],2,"The Sum Rule for limits states that the limit of a sum equals the sum of the limits — that's exactly what justifies this split.","Whenever you see a '+' inside a limit, your first move is almost always to split via the Sum Rule.",0,0],["lim(x→a)[f(x)]ⁿ, where n is a positive integer, can be computed using which combination of limit laws?",["Sum rule only","The product rule applied repeatedly, n times over","Quotient rule only","This can never be computed"],1,"[f(x)]ⁿ = f(x)·f(x)·...·f(x) (n factors), so applying the product rule repeatedly gives lim[f(x)]ⁿ = [lim f(x)]ⁿ.","A power is just repeated multiplication — the product rule for limits extends naturally to any whole-number power.",0,0],["If lim(x→a) f(x) = A and lim(x→a) g(x) = B, then lim(x→a)[2f(x) - 3g(x)] equals:",["2A - 3B","2A + 3B","A - B","6AB"],0,"Combine the constant-multiple rule (pull out 2 and 3) with the difference rule (split the subtraction): 2·lim f(x) - 3·lim g(x) = 2A - 3B.","Stack the rules — constants factor out, then sums/differences split apart, evaluated piece by piece.",0,0],["Which of these is NOT one of the basic limit theorems given in the standard list (constant, constant-multiple, sum/difference, product, quotient, nth root)?",["The limit of a constant function is that constant","The limit of a sum is the sum of the limits","f(x)^g(x) always equals [lim f(x)]^[lim g(x)] unconditionally","The limit of an nth root is the nth root of the limit (when defined)"],2,"The general power law f(x)^g(x) isn't part of the basic listed limit theorems and does NOT hold unconditionally — special care (and often logarithms) is needed for variable exponents.","Stick to the SIX standard laws (constant, constant-multiple, sum, product, quotient, root) — anything fancier needs extra justification.",0,0],["The Quotient Rule for limits fails to directly apply when:",["The numerator's limit is zero","The denominator's limit is zero","Both f and g happen to be ordinary polynomial functions","x happens to be approaching some finite number"],1,"Division by a limit of zero is undefined — this is exactly when you need an alternative technique (factoring, rationalizing) rather than the direct quotient rule.","Denominator limit = 0 is your CUE to factor/simplify before plugging in — never divide by a limit of zero directly.",0,0],["lim(x→0) [sin x / x] equals:",["0","1","∞","undefined"],1,"This is one of the most important special limits in calculus: lim(x→0) sinx/x = 1. It's the foundation for differentiating sine from first principles.","sinx/x → 1 is THE most quoted special limit in exams — memorize it cold, no derivation needed on the spot.",0,0],["lim(x→0) [(1 - cos x)/x] equals:",["1","-1","0","∞"],2,"Near x=0, (1-cos x) behaves like x²/2 — much smaller than x — so the ratio (1-cosx)/x shrinks to 0 as x→0.","Pair this with sinx/x→1 — they're commonly tested TOGETHER as a matching pair, and it's easy to mix up which gives 0 and which gives 1.",0,0],["lim(x→∞) (1 + 1/x)ˣ equals:",["1","0","e","∞"],2,"This is the classical limit definition of Euler's number: lim(x→∞)(1+1/x)ˣ = e ≈ 2.71828.","This exact limit IS the definition of e — recognize the (1+1/x)ˣ pattern instantly.",0,0],["lim(x→0) (1 + x)^(1/x) equals:",["1","e","0","∞"],1,"This is an equivalent form of the definition of e, obtained by substituting x → 1/x in the previous special limit.","(1+1/x)ˣ as x→∞ and (1+x)^(1/x) as x→0 are the SAME limit in disguise — both give e.",0,0],["lim(x→0) [(eˣ - 1)/x] equals:",["0","1","e","-1"],1,"This special limit shows that near x=0, eˣ-1 behaves almost exactly like x itself, so their ratio approaches 1.","This limit is the reason d/dx(eˣ)=eˣ works out so cleanly at x=0 — a key building block.",0,0],["lim(x→1) [(x - 1)/ln x] equals:",["0","1","e","∞"],1,"As x approaches 1, both (x-1) and ln(x) approach 0 at essentially the same rate, so their ratio approaches 1.","This is the 'inverse partner' of (eˣ-1)/x→1 — same idea, flipped between exponential and logarithmic form.",0,0],["Which of these is NOT one of the six standard special limits listed in the textbook?",["lim(x→0) sinx/x = 1","lim(x→0)(1-cosx)/x = 0","lim(x→0) tanx/x² = 1","lim(x→∞)(1+1/x)ˣ = e"],2,"lim(x→0) tanx/x² is NOT among the standard six special limits (and it isn't even a finite, well-behaved limit) — it's the odd one out.","Trick-question radar — exam setters love slipping in a FAKE 'special limit' that looks plausible but isn't on the real list.",0,0],["lim(x→0) sin(3x)/x equals (using lim sinθ/θ = 1 as θ→0):",["1","3","1/3","0"],1,"Rewrite as 3·[sin(3x)/(3x)]. As x→0, 3x→0 too, so sin(3x)/(3x)→1, leaving 3·1 = 3.","Multiply top and bottom to force the EXACT sinθ/θ pattern — then whatever's left over outside is your answer's scaling factor.",0,0],["lim(x→0) sin(5x)/sin(2x) equals:",["5/2","2/5","1","0"],0,"Write as [sin5x/5x · 5x] / [sin2x/2x · 2x] = [sin5x/5x]/[sin2x/2x] · (5x/2x) → 1/1 · 5/2 = 5/2.","When two sine terms with different angle-multiples are divided, the answer is simply the RATIO of those multiples (here 5/2).",0,0],["lim(x→0) [1 - cos(2x)]/(2x) equals:",["0","1","2","1/2"],0,"Same pattern as (1-cosx)/x→0, just with 2x in place of x — the limit is still 0.","(1-cosθ)/θ → 0 no matter what's standing in for θ, as long as θ→0 too.",0,0],["lim(x→∞) (1 + 3/x)ˣ equals:",["1","e","e³","3"],2,"Generalizing the e-limit: lim(x→∞)(1+k/x)ˣ = e^k. With k=3, this gives e³.","(1+k/x)ˣ → eᵏ is the generalized version — swap in whatever constant sits where the '1' was.",0,0],["The six special limits are important mainly because they:",["Only apply to polynomial functions","Cannot be proven","Serve as building blocks for evaluating more complex trigonometric/exponential/logarithmic limits","Only work for x approaching infinity"],2,"These special limits act as ready-made 'tools' — once memorized, they let you quickly reduce complicated-looking trig/exp/log limits to simple algebra by pattern-matching.","Think of the special limits as your multiplication table for calculus — memorize them so pattern-matching becomes instant.",0,0],["lim(x→0) (x²+7x)/x, after factoring, simplifies to lim(x→0) of:",["x+7","x²","7/x","x-7"],0,"Factor the numerator: x²+7x = x(x+7). Cancel the common x with the denominator, leaving (x+7), whose limit as x→0 is 7.","Whenever direct substitution gives 0/0, FACTOR first and cancel — that's the standard first move.",0,0],["lim(x→-3) (x³+27)/(x+3) is evaluated by first factoring the numerator as a sum of cubes. What is the result?",["0","9","27","-27"],2,"x³+27 = (x+3)(x²-3x+9). Cancelling (x+3) leaves x²-3x+9, which at x=-3 gives 9+9+9 = 27.","Recognize sum-of-cubes patterns a³+b³=(a+b)(a²-ab+b²) — a common factoring trick in limit problems.",0,0],["lim(x→1) (x²-3x+2)/(x²-4x+3) simplifies, after factoring both top and bottom, to:",["1/2","2","-1/2","0"],0,"Factor: (x-2)(x-1)/[(x-3)(x-1)]. Cancel (x-1): (x-2)/(x-3). At x=1: (-1)/(-2) = 1/2.","Always factor BOTH numerator and denominator when you spot a common root causing 0/0 — the shared factor usually cancels cleanly.",0,0],["If direct substitution into lim(x→a) f(x)/g(x) gives the indeterminate form 0/0, the correct next step is to:",["Conclude the limit doesn't exist","State the limit is 0","Factor, simplify, or rationalize before substituting again","Immediately state the limit is 1"],2,"0/0 is 'indeterminate', not 'undefined' — it signals a common factor to cancel (via factoring or rationalizing) before you can correctly evaluate the limit.","0/0 is a SIGNAL to dig deeper, not a final answer — there's always more algebra to do.",0,0],["lim(x→2)(x³+2x-6) is evaluated by:",["Factoring first","Rationalizing the denominator","Direct substitution, since polynomials have no indeterminate forms","Cannot be evaluated"],2,"Polynomials have no denominators or roots to cause trouble — direct substitution always works cleanly: 8+4-6=6.","See a plain polynomial? Skip straight to substitution — there's nothing to simplify first.",0,0],["lim(x→∞) (4x³-x²+x-2)/(x³+3x²-3x+1) is evaluated by:",["Direct substitution of ∞","Dividing every term by the highest power of x present","Factoring the numerator only","Setting x = 0"],1,"For limits at infinity of rational functions, divide every term (top and bottom) by the highest power of x — this turns most terms into 'constant/x^n → 0', leaving just the ratio of leading coefficients.","At infinity, only the LEADING terms of top and bottom matter — dividing through by the highest power reveals this instantly.",0,0],["lim(x→∞) (4x³-x²+x-2)/(x³+3x²-3x+1) equals:",["4","1","0","∞"],0,"Since numerator and denominator have the SAME degree (3), the limit at infinity equals the ratio of their leading coefficients: 4/1 = 4.","Same top/bottom degree → limit = ratio of leading coefficients. Bigger top degree → limit = ±∞. Bigger bottom degree → limit = 0.",0,0],["Which of the following functions is continuous everywhere on its domain of definition (no points of discontinuity)?",["f(x) = 1/x","f(x) = (x²-4)/(x-1)","f(x) = 3 + cos x","f(x) = (2+x)(x+1)/(9+x)"],2,"3 + cos x is defined and continuous for ALL real x — no denominators or restrictions exist to cause a break anywhere.","Polynomials, sine, and cosine are continuous EVERYWHERE — only rational functions (and a few others) have potential break points.",0,0],["For f(x) = 5/(x+3), for what values of x is f continuous?",["All real x","All real x except x = -3","All real x except x = 3","Only for x > -3"],1,"f is a rational function, undefined (hence discontinuous) only where the denominator vanishes: x+3=0 ⟹ x=-3. It's continuous everywhere else.","'Continuous everywhere EXCEPT [the denominator's zero]' is the standard phrasing for rational-function continuity answers.",0,0],["lim(x→10) (1 - 2^(2x))/(1 + 2^x)... this type of limit is best evaluated by:",["Factoring 2^(2x) as (2^x)² via difference-of-squares","Immediately stating it's undefined","Using L'Hopital's rule only","Ignoring the exponents"],0,"Notice 2^(2x) = (2^x)², so 1-2^(2x) = (1-2^x)(1+2^x) — a difference-of-squares factoring that lets the (1+2^x) cancel with the denominator.","Spot disguised difference-of-squares patterns — (2^x)² is just 2^x squared, opening up the same old a²-b² factoring trick.",0,0],["lim(h→0) [4(x+h)³ - 4x³]/h is the type of limit used to define:",["Ordinary continuity of a function at a single point","The derivative of 4x³ (via first principles)","The definite integral of the function 4x³","The domain over which 4x³ is properly defined"],1,"This exact difference-quotient form, as h→0, is precisely how the derivative is defined from first principles.","Whenever you see [f(x+h)-f(x)]/h as h→0, recognize it INSTANTLY as a derivative-from-first-principles setup.",0,0],["g(x) = (x²-4)/(x-1). Which statement correctly describes its continuity?",["Discontinuous only at x=2 and x=-2","Discontinuous only at x=1","Continuous everywhere","Discontinuous at all integers"],1,"The denominator x-1 vanishes only at x=1 — that's the SOLE point of discontinuity; the numerator's roots (x=±2) don't cause any issue since the function is still defined and finite there.","Numerator zeros are a red herring for discontinuity hunting — only denominator zeros matter.",0,0],["When evaluating lim(x→2) (x³+2x-6), why can we simply substitute x=2 directly?",["Because the limit doesn't actually exist","Polynomials are continuous everywhere, so limit equals f(a)","Because 2 is a prime number","Because the function has a denominator"],1,"Polynomials are continuous everywhere on the real line — so for ANY polynomial, lim(x→a) f(x) = f(a) always, direct substitution is always valid.","'Polynomial = continuous everywhere' is the reason direct substitution NEVER fails for pure polynomial limits.",0,0],["For lim(x→∞) f(x) where f(x) = (2-3x)/(x²-5x+3), since the denominator's degree (2) exceeds the numerator's degree (1), the limit is:",["∞","The ratio of leading coefficients","0","Undefined (does not exist)"],2,"When the denominator grows faster (higher degree) than the numerator as x→∞, the whole fraction shrinks toward 0.","Bigger degree on the bottom → fraction shrinks to 0 at infinity, no matter what the coefficients are.",0,0],["Which statement BEST describes the relationship between continuity and the existence of a limit?",["They mean exactly the same thing","Continuity is a stronger condition than a limit merely existing","A limit existing always implies continuity","Continuity implies the limit does NOT exist"],1,"Having a limit exist at c is necessary but NOT sufficient for continuity — you additionally need f(c) to be defined and to match that limit value exactly. So continuity is a strictly stronger condition than 'the limit exists'.","Continuity = Limit exists + f(c) defined + they're EQUAL. All three boxes must be ticked.",0,0],["A function can have lim(x→c) f(x) existing, yet still fail to be continuous at c. This happens when:",["f(c) is undefined, or disagrees with the limit","The limit happens to be a positive number","c happens to be an integer","f happens to be a polynomial"],0,"This is exactly the 'removable discontinuity' scenario — the limit exists just fine, but f(c) either doesn't exist or disagrees with that limit value.","A 'hole' in a graph (removable discontinuity) is the textbook example: the limit exists at that x-value, but f(c) itself is either missing or wrong.",0,0],["If f is continuous at c, must lim(x→c) f(x) exist?",["No, never","Yes, necessarily","Only if c=0","Only for polynomials"],1,"Continuity's definition explicitly includes 'the limit exists AND equals f(c)' — so yes, continuity guarantees the limit exists.","Continuity implies the limit exists (always). But the limit existing does NOT automatically imply continuity — the arrow only works one way.",0,0],["At a jump discontinuity (like the Heaviside function at x=0), what is true about the one-sided limits?",["Both exist but disagree with each other","Both are undefined","Both equal f(0)","Neither one-sided limit exists"],0,"At a jump, the left-hand and right-hand limits both exist as finite numbers, but they simply don't match — so the two-sided limit fails to exist, and continuity fails too.","Jump discontinuities have TWO perfectly good one-sided limits that just refuse to agree with each other.",0,0],["A function that is continuous from the right at c but NOT from the left at c would show what behaviour on its graph?",["A smooth curve with no breaks","A jump at that exact point","A vertical asymptote","A horizontal line"],1,"Right-continuous-only means f(c) matches the right-hand limit but NOT the left-hand limit — typical of step functions like the Heaviside function at its jump point.","One-sided continuity (like at a step function's jump) is common in piecewise-defined functions — check each side separately.",0,0],["Is EVERY continuous function also differentiable?",["Yes, always","No, not necessarily","Only for trigonometric functions","Only if the domain is bounded"],1,"Continuity does NOT guarantee differentiability — |x| is a classic counterexample: it's perfectly continuous at 0, but has a sharp corner there, so no unique tangent (derivative) exists.","'Continuous' just means no gaps/jumps. 'Differentiable' additionally needs SMOOTHNESS (no sharp corners) — |x| at 0 breaks the second condition only.",0,0],["Is every differentiable function also continuous?",["No, never","Yes, necessarily","Only for constant functions","Only if the function is a polynomial"],1,"If a function has a well-defined derivative at a point, it must necessarily be continuous there too — differentiability is the stricter requirement, and it automatically brings continuity along with it.","The full hierarchy: Differentiable implies Continuous implies Limit exists. Each arrow only goes ONE way — never reverse it.",0,0],["For f(x)=(x-1)/x, comparing limits at x→0 and continuity at x=0:",["f is continuous at 0 since 0 is in the domain","f is discontinuous at x=0","The limit as x→0 exists and equals f(0)","f has no limit-related behaviour to discuss at x=0"],1,"Since f(0) itself is undefined (you cannot divide by zero), continuity automatically fails at x=0 — regardless of what the one-sided limits might individually do.","If f(c) is undefined, continuity fails INSTANTLY — you don't even need to check the limits to know that.",0,0],["Which type of discontinuity CAN be 'fixed' simply by redefining the function's value at that single point?",["Jump discontinuity","Infinite discontinuity","Removable discontinuity","Oscillating discontinuity"],2,"A removable discontinuity is exactly the case where the limit DOES exist — so simply redefining f(c) to equal that limit value patches the hole completely.","'Removable' is a hint in the name itself — you can literally remove/patch the discontinuity by filling in the correct single point.",0,0],["Which type of discontinuity CANNOT be fixed by redefining a single point?",["Removable discontinuity","Jump discontinuity","A hole in an otherwise polynomial graph","None of these can be fixed"],1,"At a jump discontinuity, no single value of f(c) can make both the left and right limits agree simultaneously — redefining one point can never fix a fundamental mismatch between two different one-sided limits.","Jump discontinuities are permanent — there's no single patch value that can satisfy two disagreeing limits at once.",0,0],["For a function to be continuous on a CLOSED interval [a,b], what special condition applies at the endpoints a and b?",["No special condition applies","Only one-sided continuity is needed at each end","f must be zero at both endpoints","f must be differentiable at both endpoints"],1,"At the left endpoint a, there's no x-values to the left within the interval, so only right-continuity is required there; similarly only left-continuity is required at b.","Endpoints of a closed interval only need ONE-SIDED continuity (whichever side is actually inside the interval).",0,0],["True or False: 'If lim(x→c) f(x) exists, then f MUST be continuous at c.'",["True, always","False, not necessarily","True, but only for trigonometric functions","False, because limits never really exist"],1,"This is a classic trap — a limit existing is necessary but not SUFFICIENT for continuity. You need the extra condition that f(c) is defined and equals the limit.","This exact 'limit exists therefore continuous' trap is one of the most common false statements planted in exam MCQs — always check f(c) too.",0,0]]},{"t":"Derivative Theory","s":["Extrema, Rolle's, MVT, Curve Sketching"],"q":[["The increment Δx of a variable x is defined as:",["The current numerical value of x itself","The change in x as it moves from x₀ to x₁, i.e. Δx = x₁ - x₀","A quantity that must always be positive","The derivative of x with respect to itself"],1,"Δx captures how much x has changed between two points, x₀ and x₁: Δx = x₁ - x₀ (it can be positive or negative).","The triangle symbol Δ always means 'change in' — Δx is simply new minus old.",0,0],["If Δy = f(x₀+Δx) - f(x₀), then the quotient Δy/Δx represents:",["The specific value of f evaluated right at the point x₀","The average rate of change of f over that interval","The complete domain over which f is properly defined","A fixed constant that always equals exactly one"],1,"Δy/Δx is precisely the average rate of change — how much y changes on average per unit change in x, over that specific interval.","Average rate of change is just 'rise over run' between two specific points — nothing fancier than that.",0,0],["As Δx → 0, the quotient Δy/Δx approaches:",["An infinitely large value no matter what function is used","The derivative (instantaneous rate of change) at x₀","Exactly zero no matter what function is being considered","Simply the value of y evaluated right at the point x₀"],1,"Shrinking the interval to an infinitesimally small width turns the AVERAGE rate of change into the INSTANTANEOUS rate of change — the derivative.","Average rate of change (over an interval) becomes instantaneous rate of change (at a single point) exactly when Δx→0 — that's the whole bridge from algebra to calculus.",0,0],["If x changes from x₀ to x₀+Δx, then x₁ (the new value) equals:",["x₀ - Δx","x₀ + Δx","Δx alone","x₀ · Δx"],1,"By definition, Δx = x₁ - x₀, so rearranging gives x₁ = x₀ + Δx.","Just algebra — rearrange Δx=x₁-x₀ to isolate x₁, and this pops right out.",0,0],["For y = f(x) = x², if x changes from 2 to 2.1, the increment Δy equals:",["0.1","0.21","0.41","4.41"],2,"Δy = f(2.1)-f(2) = (2.1)² - 2² = 4.41 - 4 = 0.41.","Always compute Δy as f(NEW) minus f(OLD), not the other way around — order matters for the sign.",0,0],["The average rate of change of f(x)=x² between x=2 and x=2.1 is:",["0.41","4.1","0.1","4"],1,"Δy/Δx = 0.41/0.1 = 4.1 — this approximates (and, as Δx→0, converges to) the true instantaneous derivative at x=2, which is 2(2)=4.","Notice how 4.1 is already very close to the TRUE derivative value of 4 — smaller Δx values get even closer, illustrating the limit process.",0,0],["Which of these is the CORRECT symbol relationship for increments?",["Δy = y₁ - y₀, where y₀=f(x₀) and y₁=f(x₁)","Δy is defined as y₀ minus y₁ instead","Δy is defined as y₀ plus y₁ instead","Δy is always a positive quantity by definition"],0,"Just like Δx, the y-increment is defined as NEW value minus OLD value: Δy = y₁ - y₀ = f(x₁) - f(x₀).","Consistency check — Δ always means 'later minus earlier', for both x and y increments alike.",0,0],["The 'average rate of change' concept is the direct forerunner (precursor) of which calculus concept?",["The integral","The derivative","The limit of a sequence","Continuity"],1,"Taking the average rate of change and shrinking the interval toward zero is EXACTLY how the derivative is built — average rate of change is the derivative's 'rough draft'.","Historical/conceptual order: increments → average rate of change → (shrink interval) → derivative. Know this chain.",0,0],["The derivative of f at x₀, f'(x₀), is formally defined as:",["f(x₀)/x₀","lim(Δx→0) [f(x₀+Δx) - f(x₀)]/Δx","f(x₀+1) - f(x₀)","The value of f at x₀+1"],1,"This is the first-principles (limit) definition of the derivative — the limit of the average rate of change as the interval shrinks to zero.","This exact formula IS the definition of differentiation — every derivative rule you learn is secretly built from this.",0,0],["Using first principles, if f(x) = x, then f'(x) equals:",["0","1","x","2x"],1,"f'(x) = lim(Δx→0) [(x+Δx)-x]/Δx = lim(Δx→0) Δx/Δx = lim(Δx→0) 1 = 1.","The identity function's slope is constantly 1 everywhere — matches the fact that y=x is a 45° line.",0,0],["Using first principles, if f(x) = x², then f'(x) equals:",["x","2x","x²","2"],1,"f'(x) = lim(Δx→0)[(x+Δx)²-x²]/Δx = lim(Δx→0)[2xΔx+(Δx)²]/Δx = lim(Δx→0)(2x+Δx) = 2x.","Expanding (x+Δx)² always leaves an isolated Δx factor in every extra term — that's what lets you cancel and take the limit safely.",0,0],["Using first principles, if f(x)=sin x, the key special limit needed in the derivation is:",["lim sinΔx/Δx = 1 and lim (cosΔx-1)/Δx = 0","lim(Δx→0) Δx = 0 only","lim(Δx→0) cosΔx = 0","No special limit is needed"],0,"Expanding sin(x+Δx) via the angle-sum formula splits the difference quotient into terms requiring BOTH special limits: sinΔx/Δx→1 and (cosΔx-1)/Δx→0.","This is exactly why those two special limits from Chapter 2 matter so much — they're the engine behind proving d/dx(sinx)=cosx.",0,0],["The result of differentiating sin x from first principles is:",["-cos x","cos x","-sin x","sin x"],1,"Working through the first-principles limit with the angle-sum expansion and the two special limits gives f'(x) = cos x.","sin↔cos, cos↔-sin — memorize this differentiation cycle even before doing the full first-principles proof.",0,0],["f'(x₀) can also be written using the alternative limit form:",["lim(x₁→x₀) [f(x₁)-f(x₀)]/(x₁-x₀)","The limit of f(x₁) multiplied by f(x₀)","The limit of f(x₁) added to f(x₀)","The limit of the average of f(x₁) and f(x₀)"],0,"This is the equivalent 'two-point' form of the derivative definition, using x₁→x₀ instead of Δx→0 — same idea, different notation.","Both derivative-definition forms (Δx-based and x₁-based) are mathematically IDENTICAL — just relabeled variables.",0,0],["The process of finding f'(x) is called:",["Integration","Differentiation","Limitation","Continuation"],1,"Finding the derivative of a function is, by definition, called differentiation.","Differentiation = finding the derivative. Integration = the REVERSE process — never confuse the two terms.",0,0],["f'(x₀) may or may not exist. It fails to exist typically when:",["The function f happens to be an ordinary polynomial expression","f has a sharp corner, vertical tangent, or discontinuity there","The function f happens to be positive throughout its domain","The specific point x₀ happens to equal zero exactly"],1,"Sharp corners (like |x| at 0), vertical tangents, and discontinuities all break the smooth limiting process required for a derivative to exist.","'Smooth and continuous' is the visual test — any corner, cusp, break, or vertical tangent kills differentiability at that point.",0,0],["A function f has a LOCAL (relative) MAXIMUM at x=c if:",["f(c) ≥ f(x) for ALL x in the entire domain","f(c) ≥ f(x) for all x in some open interval around c","f(c) = 0 at that point","f'(c) is undefined there"],1,"A local max only needs f(c) to be the largest value NEARBY (within some small neighbourhood) — not necessarily the largest overall.","'Local' = 'in its own neighbourhood only' — a local max can be smaller than values far away on the same graph.",0,0],["A function f has a GLOBAL (absolute) MAXIMUM at x=c if:",["f(c) ≥ f(x) for all x in some small interval only","f(c) ≥ f(x) for every x in the entire domain","f(c) is always negative","f'(c) always equals one"],1,"A global (absolute) maximum beats every single other value across the WHOLE domain, not just nearby points.","Global = 'the undisputed champion of the entire domain' — no exceptions anywhere.",0,0],["Is every global maximum automatically also a local maximum?",["No, never","Yes, necessarily","Only for polynomials","Only if the domain is a single point"],1,"If f(c) is at least as large as every value in the whole domain, it's trivially also at least as large as every value in any smaller neighbourhood around c — so global maxima are always local maxima too.","Global max implies Local max always. But Local max implies Global max is NOT guaranteed — the reverse direction can fail.",0,0],["Can a graph have several local maximum points but only ONE of them be the global maximum?",["No, all local maxima must be equal","Yes, the tallest one wins","No, a graph can only have one local maximum total","Only if the function is linear"],1,"A wavy graph can have multiple 'hills' (local maxima) of different heights — the single tallest hill overall is the global maximum.","Picture a mountain range — every peak is a local max, but only the tallest peak in the whole range is the global max.",0,0],["A function f has a LOCAL MINIMUM at x=c if:",["f(c) ≤ f(x) for all x in some open interval around c","f(c) ≥ f(x) for all x in some open interval around c","f(c) = 0 at that point","f is decreasing everywhere"],0,"A local minimum means f(c) is the SMALLEST value in its own nearby neighbourhood — the mirror image of the local max definition.","Flip the inequality direction to go from local MAX to local MIN — otherwise the definitions are structurally identical.",0,0],["According to Definition 1 in the textbook, f has a local minimum at c (where a<c<b) if there exists δ>0 such that:",["f(c) ≥ f(x) for all x with |x-c|<δ","f(c) ≤ f(x) for all x with |x-c|<δ","f(c) = f(x) for all such x","f'(c) is positive"],1,"This is the precise formal (delta-neighbourhood) definition: within a small enough neighbourhood of c, f(c) is less than or equal to every nearby value.","The δ here is just a formal way of saying 'zoom in close enough around c' — same intuition as before, just made rigorous.",0,0],["In the example graph with points A, B, C, D as local maxima and E, F, G, H as local minima, if D is the tallest peak and G is the lowest valley, then:",["D is the global minimum, G is the global maximum","D is the global maximum, G is the global minimum","All points are both local and global extrema","Neither D nor G is a global extremum"],1,"Among all local maxima (A,B,C,D), the tallest one (D) is the global maximum; among all local minima (E,F,G,H), the lowest one (G) is the global minimum.","To find the global extrema among several local ones, just compare their heights directly — tallest wins max, lowest wins min.",0,0],["Which pair of terms is used interchangeably in the textbook for the 'biggest/smallest overall' type of extremum?",["Local and relative","Global and absolute","Critical and stationary","Constant and identity"],1,"'Global' and 'absolute' are used as synonyms for the domain-wide extremum, just as 'local' and 'relative' are synonyms for the nearby-only extremum.","Local=Relative (nearby only). Global=Absolute (whole domain) — two synonym pairs to keep straight.",0,0],["Rolle's Theorem requires which THREE conditions on f over [a,b]?",["Continuous on [a,b], differentiable on (a,b), and f(a)=f(b)","f is a polynomial with f(a)=0 and f(b)=0","f is increasing on [a,b] only","f is bounded on [a,b] only"],0,"Rolle's Theorem needs: (1) continuity on the closed interval [a,b], (2) differentiability on the open interval (a,b), and (3) equal endpoint values f(a)=f(b).","Three checkboxes for Rolle's: Continuous [closed], Differentiable (open), Equal ENDpoints — miss any one and the theorem doesn't apply.",0,0],["If f satisfies the hypotheses of Rolle's Theorem on [a,b], the theorem GUARANTEES that:",["f is increasing throughout [a,b]","There exists at least one c in (a,b) with f'(c) = 0","f(c) = 0 for some specific c","f has no maximum or minimum"],1,"Rolle's Theorem concludes that somewhere strictly between a and b, the derivative must vanish — a stationary point must exist.","Rolle's conclusion is always about f'(c)=0 — a flat tangent line SOMEWHERE in the middle.",0,0],["f(x) = x² - 3x + 2 on [1,2]. Does f satisfy the conditions of Rolle's Theorem?",["No, since f(1) does not equal f(2)","Yes, since f(1)=f(2)=0 and f is a polynomial","No, since f is not differentiable","Yes, but only by coincidence"],1,"f(1)=1-3+2=0 and f(2)=4-6+2=0, so f(1)=f(2). Since f is a polynomial, it's automatically continuous and differentiable everywhere — all three Rolle's conditions are satisfied.","Polynomials AUTOMATICALLY pass the continuity/differentiability checks — you only need to verify the endpoint-equality condition by hand.",0,0],["f(x) = 5x - 3 on [0,2]. Does f satisfy Rolle's Theorem's conditions?",["Yes, all conditions hold","No, since f(0) does not equal f(2)","No, since f is not continuous","Yes, but the conclusion still fails"],1,"f(0)=-3 and f(2)=7 are NOT equal, so the crucial third condition (f(a)=f(b)) fails — Rolle's Theorem simply doesn't apply here.","A straight line with nonzero slope will basically NEVER satisfy f(a)=f(b) unless it's perfectly flat — a quick sanity check.",0,0],["For f(x) = x² - 3x + 2 on [1,2] (which satisfies Rolle's conditions), find the value of c guaranteed by the theorem.",["c = 1","c = 3/2","c = 2","c = 0"],1,"f'(x) = 2x-3. Setting f'(c)=0 gives 2c-3=0, so c=3/2, which indeed lies in the open interval (1,2).","Once you know Rolle's applies, just solve f'(x)=0 directly — that IS the value of c you're looking for.",0,0],["f(x)=x²+5x+6 on [-3,-2]. Verify: does f satisfy Rolle's Theorem, and if so, find c.",[
