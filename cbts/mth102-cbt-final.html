"No, since f(-3) does not equal f(-2)","Yes: f(-3)=f(-2)=0 and c=-5/2","Yes: f(-3)=f(-2)=1 and c=0","No, Rolle's cannot apply to quadratics"],1,"f(-3)=9-15+6=0 and f(-2)=4-10+6=0, so f(-3)=f(-2). f'(x)=2x+5=0 gives c=-5/2, which lies in (-3,-2).","Always double check your c value actually falls INSIDE the open interval (a,b) — if it doesn't, something went wrong.",0,0],["f(x) = (x-1)/x on [-1,1]. Why does Rolle's Theorem NOT apply here?",["Since f(-1) does not equal f(1)","Since f is not continuous on [-1,1]","Since f is not a polynomial","Since f'(x) never equals zero"],1,"f has a vertical asymptote/undefined point at x=0, which lies WITHIN [-1,1] — this breaks the continuity requirement, so Rolle's Theorem simply cannot be applied.","Always scan the WHOLE interval for hidden domain restrictions (like division by zero) before even checking the endpoint condition.",0,0],["What does Rolle's Theorem say happens GEOMETRICALLY at the point c?",["The curve crosses the x-axis there","The tangent line at c is horizontal","The curve has a vertical tangent at c","The curve is undefined at c"],1,"f'(c)=0 means zero slope — geometrically, the tangent line at that point is perfectly horizontal, which makes sense since the curve must 'turn around' somewhere between two equal-height endpoints.","Picture it visually: if a curve starts and ends at the same height, it MUST flatten out (horizontal tangent) somewhere in between.",0,0],["The Extreme Value Theorem (EVT) states that if f is continuous on a CLOSED and bounded interval [a,b], then:",["f must be differentiable everywhere throughout the interval [a,b]","f attains both a maximum and a minimum value on [a,b]","There must exist some x in [a,b] where f'(x) equals exactly zero","The endpoint values f(a) and f(b) must always be equal to each other"],1,"EVT guarantees existence of both a global max and a global min on a closed, bounded interval — continuity plus a closed bounded interval is enough to guarantee this, with no need for differentiability.","EVT needs only CONTINUITY + CLOSED BOUNDED INTERVAL — much lighter requirements than Rolle's or MVT, which need differentiability too.",0,0],["Why does the Extreme Value Theorem specifically require a CLOSED interval [a,b] (not open)?",["So extrema can't 'slip away' unattained near an excluded boundary","Because open intervals are considered discontinuous by definition","It's purely a stylistic convention with no real mathematical reason behind it","Closed intervals are always bounded automatically"],0,"On an OPEN interval, a function could approach a supremum/infimum value without ever actually reaching it (e.g. f(x)=x on (0,1) never attains a max) — closing the interval prevents this issue.","EVT's need for a CLOSED interval is exactly to stop extrema from being 'just out of reach' at an open boundary.",0,0],["Fermat's Theorem states that if f has a local extreme value at a point c strictly between a and b, and f is differentiable at c, then:",["f(c) = 0","f'(c) = 0","f''(c) = 0","f(c) is undefined"],1,"Fermat's Theorem is the key link between extrema and derivatives: at an interior local extremum where the derivative exists, that derivative MUST be zero.","Fermat's is basically Rolle's Theorem's parent idea — local extremum + differentiable ⟹ flat tangent (f'=0) there.",0,0],["Does Fermat's Theorem work in REVERSE — i.e. if f'(c)=0, must c be a local extremum?",["Yes, always — a zero derivative guarantees a local extremum every time","No, not necessarily — x³ at 0 is a counterexample","Only when the function happens to be a polynomial expression","Only when the function is continuous at every other point too"],1,"f'(c)=0 is NECESSARY but not SUFFICIENT for a local extremum — f(x)=x³ is the classic counterexample, where the derivative vanishes at 0 but the curve just flattens momentarily before continuing to rise (an inflection point, not an extremum).","'Flat tangent' does NOT automatically mean 'hilltop or valley' — x³ at the origin is the textbook counterexample proving the reverse direction fails.",0,0],["Fermat's Theorem specifically requires the extremum to occur at a point c that is:",["An endpoint of the interval","Strictly BETWEEN a and b (an interior point)","Equal to zero","Negative"],1,"Fermat's Theorem only applies to INTERIOR extrema — an extremum sitting right at an endpoint doesn't need f'(c)=0 at all (the function could still be increasing/decreasing right up to that boundary).","Endpoint extrema are exempt from Fermat's zero-derivative rule — only INTERIOR extrema are forced to have a flat tangent.",0,0],["In the proof of Fermat's Theorem for a local maximum at c, the key step is showing that the limit of [f(x)-f(c)]/(x-c) is:",["Both ≥0 from the left and ≤0 from the right","Always strictly positive, regardless of the direction of approach","Always strictly negative, regardless of the direction of approach","Undefined on both sides, which is why the theorem works at all"],0,"Approaching from the left, the difference quotient is ≥0 (since f is at its max); approaching from the right, it's ≤0. Since f is differentiable, both one-sided limits must be equal, and the only number that is both ≥0 and ≤0 is 0.","This is a classic 'sandwiched between two inequalities' proof technique — squeeze the derivative between ≥0 and ≤0 to force it to be exactly 0.",0,0],["The Extreme Value Theorem and Fermat's Theorem are often used TOGETHER because:",["They contradict each other","EVT confirms an extremum exists; Fermat's narrows down where to look","They are the exact same theorem","Neither theorem is useful practically"],1,"EVT confirms an extremum exists somewhere in [a,b]; Fermat's Theorem then narrows down the search to specific candidate points (where f'=0, or where f isn't differentiable, or the endpoints).","EVT says 'there IS a winner'; Fermat's says 'the winner must be among THESE specific candidates' — a perfect one-two combo for optimization problems.",0,0],["According to the theorem stated for closed intervals, if f is continuous on [a,b], there exist numbers m and M such that:",["m ≤ x ≤ M for each x in [a,b], with points α,β where f(α)=M and f(β)=m","f(a) = m and f(b) = M always","m and M must both be zero","f is constant between m and M"],0,"This restates the EVT precisely: f is bounded between some minimum m and maximum M on [a,b], and both bounds are ACTUALLY ACHIEVED at some points α and β in the interval.","EVT isn't just about boundedness — it insists the max/min values are actually HIT by the function, not just approached.",0,0],["The Mean Value Theorem (MVT) requires f to be:",["Continuous on [a,b] and differentiable on (a,b)","Continuous on (a,b) only","Differentiable on [a,b] only, with no continuity needed","A polynomial function only"],0,"MVT's hypotheses are slightly weaker than Rolle's (no equal-endpoints condition needed) but still require continuity on the closed interval and differentiability on the open interval.","MVT = Rolle's Theorem WITHOUT the equal-endpoints restriction — that's the only difference in hypotheses.",0,0],["The Mean Value Theorem concludes that there exists at least one point c in (a,b) such that:",["f'(c) equals exactly zero, just like in Rolle's Theorem","f'(c) = [f(b)-f(a)]/(b-a)","f(c) equals exactly zero somewhere in that interval","The two endpoint values f(a) and f(b) must be equal"],1,"MVT states the instantaneous rate of change at SOME point c exactly equals the average rate of change over the whole interval [a,b].","MVT's punchline: somewhere in the middle, the INSTANT slope matches the OVERALL AVERAGE slope of the secant line from a to b.",0,0],["Geometrically, the Mean Value Theorem says that the tangent line at c is:",["Perfectly vertical, with an undefined slope at that point","Parallel to the secant line joining (a,f(a)) and (b,f(b))","Perpendicular to the x-axis","Always horizontal"],1,"Since f'(c) equals the secant line's slope [f(b)-f(a)]/(b-a), the tangent at c must be PARALLEL to that secant line.","Rolle's Theorem is just a SPECIAL CASE of MVT where the secant line happens to be horizontal (because f(a)=f(b)).",0,0],["Let f(x)=x². Find the value of b (with b>1) such that the average rate of change of f from x=1 to x=b equals the instantaneous rate of change of f at x=2.",["b = 2","b = 3","b = 4","b = 1"],1,"f'(2)=4. Setting [f(b)-f(1)]/(b-1) = 4 gives (b²-1)/(b-1) = b+1 = 4, so b=3.","(b²-1)/(b-1) simplifies neatly to (b+1) by factoring the difference of squares — always look for this shortcut.",0,0],["For f(t) = t - t³ on [-2, 0], MVT applies. Which value(s) of c satisfy the theorem's conclusion?",["c = 2√3/3 only","c = -2√3/3 only (since 2√3/3 lies outside [-2,0])","Both positive and negative roots ±2√3/3 satisfy it equally","Only the midpoint value c = 0 satisfies the conclusion"],1,"Solving f'(c) = [f(0)-f(-2)]/2 gives 1-3c²=-3, so c²=4/3, c=±2√3/3. Only c=-2√3/3 actually lies within the interval [-2,0], so that's the valid answer.","MVT problems often give TWO algebraic solutions — always discard whichever one falls OUTSIDE the given interval.",0,0],["y = (x²-1)/x fails to satisfy the MVT hypothesis on any interval containing x=0 because:",["The function y is always positive throughout its whole domain","y is not defined (and not continuous) at x=0","The function y happens to be a plain polynomial expression","y has no derivative anywhere"],1,"The function has a vertical asymptote/undefined point right at x=0 — this breaks continuity, so MVT (which needs continuity on the closed interval) cannot be applied on any interval that includes x=0.","Always scan for hidden domain gaps INSIDE your interval before assuming MVT applies — a single bad point ruins it.",0,0],["MVT is used to prove that if f'(x) < 0 throughout an interval I, then f is:",["Constant on I","Strictly increasing on I","Strictly decreasing on I","Undefined on I"],2,"For any a<b in I, MVT gives f(b)-f(a)=f'(c)(b-a) for some c. Since f'(c)<0 and b-a>0, we get f(b)-f(a)<0, i.e. f(b)<f(a) — meaning f decreases as x increases.","This is exactly HOW the 'sign of f' tells you increasing/decreasing' rule is proven — MVT is the hidden machinery behind it.",0,0],["Which theorem is considered the MORE GENERAL version, with the other being a special case of it?",["Rolle's Theorem is more general; MVT is the special case","MVT is more general; Rolle's is the special case where f(a)=f(b)","They are unrelated theorems","EVT is a special case of Rolle's Theorem"],1,"MVT works for ANY continuous/differentiable f on [a,b], regardless of endpoint values. Rolle's Theorem is just MVT applied to the special situation where f(a)=f(b) (making the average rate of change exactly zero).","Remember the hierarchy: MVT is the general theorem; Rolle's is MVT's little sibling for the special 'equal endpoints' case.",0,0],["A point x=c in an interval I is called a CRITICAL point of f if c is:",["Always the midpoint of I","An endpoint, singular point, or stationary point","Only ever a stationary point","A point where f(c)=0"],1,"Critical points come in THREE flavours: endpoints of the interval, singular points (where the derivative fails to exist), and stationary points (where the derivative equals zero).","Three-way checklist for critical points — Endpoint? Singular (f' undefined)? Stationary (f'=0)? Any ONE of these three qualifies.",0,0],["A STATIONARY point of f is specifically a point x=x₀ where:",["f(x₀) = 0","f'(x₀) = 0","f is undefined","f''(x₀) = 0"],1,"'Stationary' refers to zero instantaneous rate of change — the derivative itself vanishes at that point.","Stationary = flat tangent = f'=0. Don't confuse this with a general 'critical point', which is a broader 3-way category.",0,0],["A SINGULAR point of f is a point where:",["f'(x) = 0","f'(x) is NOT defined","f(x) = 0","f is a polynomial"],1,"A singular point is where the derivative simply fails to exist — e.g. due to a sharp corner or vertical tangent (like |x| at x=0).","'Singular' hints at something 'breaking' or 'weird' happening — that's exactly where the derivative refuses to exist.",0,0],["For f(x) = x² - 6x + 5 on [0,3], the critical points are:",["Only x=3 (stationary point)","-1, 0, 2, and 5","Only the points 0 and 3, counted as endpoints together","x=6 only"],2,"Endpoints of [0,3] give x=0 and x=3. f'(x)=2x-6=0 gives the stationary point x=3 (which coincides with the right endpoint here). So the critical points are 0 and 3.","Always list ALL THREE types of critical points, then remove duplicates if a stationary point happens to coincide with an endpoint.",0,0],["The First Derivative Test says: if f'(x) > 0 just to the LEFT of c and f'(x) < 0 just to the RIGHT of c, then f has:",["A local minimum at c","A local maximum at c","No extremum at c","An inflection point at c"],1,"Increasing-then-decreasing (positive slope, then negative slope) around c describes exactly a 'hilltop' shape — a local maximum.","+ then − (like a hill going up then down) = LOCAL MAX. − then + (valley) = LOCAL MIN. Memorize this sign-pattern pairing.",0,0],["The First Derivative Test says: if f'(x) < 0 just to the LEFT of c and f'(x) > 0 just to the RIGHT of c, then f has:",["A local maximum at c","A local minimum at c","No conclusion can be drawn","An inflection point"],1,"Decreasing-then-increasing (negative slope, then positive slope) traces a 'valley' shape — a local minimum.","Think of it as literally watching a ball roll: down then up = it settled into a MINIMUM (valley bottom).",0,0],["The Second Derivative Test states: if f'(c)=0 and f''(c) > 0, then (c, f(c)) is:",["A relative maximum point","A relative minimum point","An inflection point","Undefined"],1,"A positive second derivative means the curve is concave UP at that point (like a smile/bowl shape) — combined with a flat tangent, that's exactly a local minimum.","f''>0 → 'smiles' (concave up) → MINIMUM. f''<0 → 'frowns' (concave down) → MAXIMUM. Picture the face emoji to remember this.",0,0],["The Second Derivative Test states: if f'(c)=0 and f''(c) < 0, then (c,f(c)) is:",["A relative minimum point","A relative maximum point","A stationary point only, nothing more","A singular point"],1,"A negative second derivative signals concave DOWN (frown shape) — paired with a flat tangent, this identifies a local maximum.","Negative curvature = 'sad face' shape = peak = MAXIMUM.",0,0],["For f(x)=2x³-3x²+1, f'(x)=6x²-6x=0 gives critical points x=0 and x=1. Using f''(x)=12x-6, classify x=0.",["f''(0)=-6<0, so x=0 is a local maximum","f''(0)=6>0, so x=0 is a local minimum","f''(0)=0, inconclusive","x=0 is not a critical point"],0,"f''(0) = 12(0)-6 = -6, which is negative — by the Second Derivative Test, this confirms x=0 gives a local MAXIMUM.","Always plug the critical x-value directly into f''(x) — the SIGN of the result (not its magnitude) is all that matters for classification.",0,0],["What does the Second Derivative Test conclude if f'(c)=0 AND f''(c)=0 as well?",["c is definitely a local maximum","c is definitely a local minimum","Inconclusive — fall back on the First Derivative Test","c cannot be a critical point"],2,"When both f'(c) and f''(c) vanish, the Second Derivative Test simply gives no information either way — f(x)=x⁴ (min) and f(x)=x³ (inflection) both have this at x=0, showing you genuinely can't tell without more work.","f''(c)=0 is a DEAD END for the second derivative test — don't force a conclusion, switch tools (first derivative test) instead.",0,0],["A function f is said to be CONCAVE UP on an interval I if:",["f' is decreasing throughout the whole interval I","f' is increasing on I (equivalently f''>0)","f is negative for every single value throughout I","f traces out a straight line throughout the interval I"],1,"Concave up means the slope itself keeps INCREASING as x increases — the curve bends upward like a bowl. This is equivalent to f''>0.","Concave UP = bowl shape = can 'hold water' = f''>0.",0,0],["A function f is said to be CONCAVE DOWN on an interval I if:",["f' is increasing throughout the whole interval I","f' is decreasing on I (equivalently f''<0)","f is always positive for every value throughout I","f has no derivative anywhere throughout the interval"],1,"Concave down means the slope keeps DECREASING — the curve bends downward like a dome/frown. Equivalent to f''<0.","Concave DOWN = dome shape = 'spills water' = f''<0.",0,0],["A point where the CONCAVITY of a function changes (from up to down, or down to up) is called:",["A critical point of the function","A stationary point of the function","An inflection point","A singular point of the function"],2,"An inflection point marks the specific location where the curve switches its bending direction — from concave up to concave down, or vice versa.","Inflection = 'the curve changes its mind about which way to bend' — a distinct concept from ordinary max/min points.",0,0],["At a genuine inflection point x₀ (assuming f'' exists there), what MUST be true about f''(x₀)?",["f''(x₀) must be positive","f''(x₀) must be negative","f''(x₀) must equal zero","f''(x₀) must be undefined"],2,"Since the sign of f'' flips across an inflection point, and f'' is assumed to exist there, it must pass through zero at that exact point.","f''=0 is NECESSARY for an inflection point (when f'' exists) — but just like f'=0 alone doesn't guarantee an extremum, f''=0 alone doesn't guarantee an inflection point either; the sign must actually CHANGE.",0,0],["A function f is called STRICTLY INCREASING on interval I if, for every x₁<x₂ in I:",["f(x₁) > f(x₂)","f(x₁) < f(x₂)","f(x₁) = f(x₂)","f(x₁) ≥ f(x₂)"],1,"Strictly increasing means larger x-values always strictly produce larger y-values, with no ties allowed.","'Increasing' matches the natural reading direction — as you scan left to right, the graph consistently climbs.",0,0],["According to the Monotone Theorem, if f'(x) > 0 throughout an interval I, then f is:",["Decreasing on I","Constant on I","Increasing on I","Concave down on I"],2,"A positive derivative everywhere on I means positive slope everywhere — the function consistently climbs, i.e. increases, throughout I.","Sign of f' tells you increasing/decreasing. Sign of f'' tells you concave up/down. Keep these two 'sign tests' completely separate in your mind.",0,0],["A VERTICAL asymptote of a curve occurs at x=a if:",["lim(x→a) f(x) = +∞ or -∞ (from at least one side)","The limit as x approaches infinity equals a exactly","The function value f(a) happens to equal zero","The function is perfectly continuous at that point a"],0,"A vertical asymptote is defined by the function's values blowing up to infinity (positive or negative) as x approaches some fixed a.","Vertical asymptotes usually show up exactly where a rational function's DENOMINATOR hits zero (while the numerator doesn't).",0,0],["A HORIZONTAL asymptote y=L of a curve occurs if:",["The limit as x approaches some finite value a equals L","lim(x→∞) f(x) = L or lim(x→-∞) f(x) = L","The function value at zero, f(0), happens to equal L","The derivative f'(x) equals L everywhere on the domain"],1,"A horizontal asymptote describes the function's END BEHAVIOUR — what value it settles toward as x heads to positive or negative infinity.","Vertical asymptotes happen at a FINITE x-value (function blows up). Horizontal asymptotes happen as x ITSELF goes to infinity (function settles down).",0,0],["When sketching a curve, the FIRST derivative primarily tells you:",["Where the curve is concave up or down","Where the curve is increasing or decreasing, and where local extrema occur","The y-intercept only","The domain of the function"],1,"f' governs the increasing/decreasing behaviour and pinpoints candidate local max/min locations via its sign changes.","First derivative = UP/DOWN direction of travel. Second derivative = SHAPE of the bend. Different jobs entirely.",0,0],["When sketching a curve, the SECOND derivative primarily tells you:",["Where the curve increases or decreases","Where the curve is concave up or down, and where inflection points occur","The exact roots of the function","The domain of the function"],1,"f'' governs the bending direction (concavity) of the graph, and its sign changes reveal inflection points.","If f' is the 'speedometer' (rate of change), think of f'' as the 'steering wheel' (how the curve bends).",0,0],["A function f is said to be an ODD function with graph symmetric about the origin. Sine (sin x) is an example. Which of these graph features would you EXPECT for an odd polynomial like x³-3x?",["Symmetric about the y-axis, like an even function would be","Symmetric about the origin (180° rotational symmetry)","No symmetry at all, since the powers involved are mismatched","Symmetric about the diagonal line y equals x instead"],1,"Since only odd powers of x appear (x³ and x, both odd), the function satisfies f(-x)=-f(x), giving origin symmetry.","A polynomial built ENTIRELY from odd-power terms is automatically an odd function — check every exponent is odd.",0,0],["For curve sketching, why do we check BOTH the first AND second derivative rather than just one?",["It's unnecessary — the first derivative alone already tells you everything needed","Because the first derivative reveals rising/falling behaviour while the second reveals bending shape — together they give a complete, accurate picture of the curve","The second derivative's sign always directly contradicts the first derivative's sign","Only the second derivative matters for sketching; the first can safely be skipped"],1,"Each derivative captures a DIFFERENT aspect of the curve's behaviour — direction of travel (1st) and bending shape (2nd). Using only one leaves you with an incomplete picture (e.g. you could miss inflection points using only f').","A complete curve-sketch summary table always has THREE rows: sign of f' (direction), sign of f'' (concavity), and the resulting shape symbol (⌣ or ⌢) — combine all three for the full picture.",0,0]]},{"t":"Differentiation Rules","s":["Product Rule","Quotient Rule","Chain Rule (Function of a Function)","Logarithmic Differentiation","Second Derivative","Implicit Differentiation"],"q":[["Differentiate y = (x^2)(sin(x)) with respect to x.",["dy/dx = x^2cos(x) + 2xsin(x)","dy/dx = -x^2cos(x) + 2xsin(x)","dy/dx = x^2cos(x) - 2xsin(x)","dy/dx = -x^2cos(x) - 2xsin(x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = x^2 -> du/dx = 2x. v = sin(x) -> dv/dx = cos(x). dy/dx = (sin(x))(2x) + (x^2)(cos(x)) = x^2cos(x) + 2xsin(x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (x^3)(e^(x)) with respect to x.",["dy/dx = x^3e^(x) + 3x^2e^(x)","dy/dx = -x^3e^(x) + 3x^2e^(x)","dy/dx = x^3e^(x) - 3x^2e^(x)","dy/dx = -x^3e^(x) - 3x^2e^(x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = x^3 -> du/dx = 3x^2. v = e^(x) -> dv/dx = e^(x). dy/dx = (e^(x))(3x^2) + (x^3)(e^(x)) = x^3e^(x) + 3x^2e^(x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (2x + 1)(cos(x)) with respect to x.",["dy/dx = -2xsin(x) - sin(x) + 2cos(x)","dy/dx = 2xsin(x) + sin(x) + 2cos(x)","dy/dx = -2xsin(x) - sin(x) - 2cos(x)","dy/dx = 2xsin(x) + sin(x) - 2cos(x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = 2x + 1 -> du/dx = 2. v = cos(x) -> dv/dx = -sin(x). dy/dx = (cos(x))(2) + (2x + 1)(-sin(x)) = -2xsin(x) - sin(x) + 2cos(x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (x)(ln(x)) with respect to x.",["dy/dx = ln(x) + 1","dy/dx = ln(x) - 1","dy/dx = 1 - ln(x)","dy/dx = -ln(x) - 1"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = x -> du/dx = 1. v = ln(x) -> dv/dx = 1/x. dy/dx = (ln(x))(1) + (x)(1/x) = ln(x) + 1.","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (x^2)(e^(2x)) with respect to x.",["dy/dx = 2x^2e^(2x) + 2xe^(2x)","dy/dx = -2x^2e^(2x) + 2xe^(2x)","dy/dx = 2x^2e^(2x) - 2xe^(2x)","dy/dx = -2x^2e^(2x) - 2xe^(2x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = x^2 -> du/dx = 2x. v = e^(2x) -> dv/dx = 2e^(2x). dy/dx = (e^(2x))(2x) + (x^2)(2e^(2x)) = 2x^2e^(2x) + 2xe^(2x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (sin(x))(cos(x)) with respect to x.",["dy/dx = -sin(x)^2 + cos(x)^2","dy/dx = sin(x)^2 + cos(x)^2","dy/dx = -sin(x)^2 - cos(x)^2","dy/dx = sin(x)^2 - cos(x)^2"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = sin(x) -> du/dx = cos(x). v = cos(x) -> dv/dx = -sin(x). dy/dx = (cos(x))(cos(x)) + (sin(x))(-sin(x)) = -sin(x)^2 + cos(x)^2.","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (x^3)(ln(x)) with respect to x.",["dy/dx = 3x^2ln(x) + x^2","dy/dx = 3x^2ln(x) - x^2","dy/dx = -3x^2ln(x) + x^2","dy/dx = -3x^2ln(x) - x^2"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = x^3 -> du/dx = 3x^2. v = ln(x) -> dv/dx = 1/x. dy/dx = (ln(x))(3x^2) + (x^3)(1/x) = 3x^2ln(x) + x^2.","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (3x^2)(sin(2x)) with respect to x.",["dy/dx = 6x^2cos(2x) + 6xsin(2x)","dy/dx = -6x^2cos(2x) + 6xsin(2x)","dy/dx = 6x^2cos(2x) - 6xsin(2x)","dy/dx = -6x^2cos(2x) - 6xsin(2x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = 3x^2 -> du/dx = 6x. v = sin(2x) -> dv/dx = 2cos(2x). dy/dx = (sin(2x))(6x) + (3x^2)(2cos(2x)) = 6x^2cos(2x) + 6xsin(2x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (x)(e^(-x)) with respect to x.",["dy/dx = -xe^(-x) + e^(-x)","dy/dx = xe^(-x) + e^(-x)","dy/dx = -xe^(-x) - e^(-x)","dy/dx = xe^(-x) - e^(-x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = x -> du/dx = 1. v = e^(-x) -> dv/dx = -e^(-x). dy/dx = (e^(-x))(1) + (x)(-e^(-x)) = -xe^(-x) + e^(-x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (x^2 + 1)(cos(3x)) with respect to x.",["dy/dx = -3x^2sin(3x) + 2xcos(3x) - 3sin(3x)","dy/dx = 3x^2sin(3x) + 2xcos(3x) + 3sin(3x)","dy/dx = -3x^2sin(3x) - 2xcos(3x) - 3sin(3x)","dy/dx = 3x^2sin(3x) - 2xcos(3x) + 3sin(3x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = x^2 + 1 -> du/dx = 2x. v = cos(3x) -> dv/dx = -3sin(3x). dy/dx = (cos(3x))(2x) + (x^2 + 1)(-3sin(3x)) = -3x^2sin(3x) + 2xcos(3x) - 3sin(3x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (sqrt(x))(e^(x)) with respect to x.",["dy/dx = sqrt(x)e^(x) + e^(x)/(2sqrt(x))","dy/dx = -sqrt(x)e^(x) + e^(x)/(2sqrt(x))","dy/dx = sqrt(x)e^(x) - e^(x)/(2sqrt(x))","dy/dx = -sqrt(x)e^(x) - e^(x)/(2sqrt(x))"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = sqrt(x) -> du/dx = 1/(2sqrt(x)). v = e^(x) -> dv/dx = e^(x). dy/dx = (e^(x))(1/(2sqrt(x))) + (sqrt(x))(e^(x)) = sqrt(x)e^(x) + e^(x)/(2sqrt(x)).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (x^4)(sin(x)) with respect to x.",["dy/dx = x^4cos(x) + 4x^3sin(x)","dy/dx = -x^4cos(x) + 4x^3sin(x)","dy/dx = x^4cos(x) - 4x^3sin(x)","dy/dx = -x^4cos(x) - 4x^3sin(x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = x^4 -> du/dx = 4x^3. v = sin(x) -> dv/dx = cos(x). dy/dx = (sin(x))(4x^3) + (x^4)(cos(x)) = x^4cos(x) + 4x^3sin(x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (5x)(cos(x)) with respect to x.",["dy/dx = -5xsin(x) + 5cos(x)","dy/dx = 5xsin(x) + 5cos(x)","dy/dx = -5xsin(x) - 5cos(x)","dy/dx = 5xsin(x) - 5cos(x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = 5x -> du/dx = 5. v = cos(x) -> dv/dx = -sin(x). dy/dx = (cos(x))(5) + (5x)(-sin(x)) = -5xsin(x) + 5cos(x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (x^2)(tan(x)) with respect to x.",["dy/dx = x^2tan(x)^2 + x^2 + 2xtan(x)","dy/dx = -x^2tan(x)^2 - x^2 + 2xtan(x)","dy/dx = x^2tan(x)^2 + x^2 - 2xtan(x)","dy/dx = -x^2tan(x)^2 - x^2 - 2xtan(x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = x^2 -> du/dx = 2x. v = tan(x) -> dv/dx = tan(x)^2 + 1. dy/dx = (tan(x))(2x) + (x^2)(tan(x)^2 + 1) = x^2tan(x)^2 + x^2 + 2xtan(x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (x^3 + 2x)(e^(x)) with respect to x.",["dy/dx = x^3e^(x) + 3x^2e^(x) + 2xe^(x) + 2e^(x)","dy/dx = -x^3e^(x) + 3x^2e^(x) - 2xe^(x) + 2e^(x)","dy/dx = x^3e^(x) - 3x^2e^(x) + 2xe^(x) - 2e^(x)","dy/dx = -x^3e^(x) - 3x^2e^(x) - 2xe^(x) - 2e^(x)"],0,"Product Rule: dy/dx = v(du/dx) + u(dv/dx). u = x^3 + 2x -> du/dx = 3x^2 + 2. v = e^(x) -> dv/dx = e^(x). dy/dx = (e^(x))(3x^2 + 2) + (x^3 + 2x)(e^(x)) = x^3e^(x) + 3x^2e^(x) + 2xe^(x) + 2e^(x).","'First times derivative of second, PLUS second times derivative of first.' A sign slip on EITHER term is the #1 trap — always double-check both + signs.",0,0],["Differentiate y = (x^2) / (x + 1) with respect to x.",["dy/dx = [x^2 + 2x all over (x + 1)^2]","dy/dx = [3x^2 + 2x all over (x + 1)^2]","dy/dx = [-x^2 - 2x all over (x + 1)^2]","dy/dx = [-3x^2 - 2x all over (x + 1)^2]"],0,"Quotient Rule: dy/dx = [v(du/dx) - u(dv/dx)] / v^2. u = x^2 -> du/dx = 2x. v = x + 1 -> dv/dx = 1. Numerator = (x + 1)(2x) - (x^2)(1) = x^2 + 2x. So dy/dx = [x^2 + 2x all over (x + 1)^2].","Remember 'LOW-d-HIGH minus HIGH-d-LOW, over LOW squared' — a sign slip on either half of the numerator is the classic trap here.",0,1],["Differentiate y = (sin(x)) / (x) with respect to x.",["dy/dx = [xcos(x) - sin(x) all over (x)^2]","dy/dx = [xcos(x) + sin(x) all over (x)^2]","dy/dx = [-xcos(x) + sin(x) all over (x)^2]","dy/dx = [-xcos(x) - sin(x) all over (x)^2]"],0,"Quotient Rule: dy/dx = [v(du/dx) - u(dv/dx)] / v^2. u = sin(x) -> du/dx = cos(x). v = x -> dv/dx = 1. Numerator = (x)(cos(x)) - (sin(x))(1) = xcos(x) - sin(x). So dy/dx = [xcos(x) - sin(x) all over (x)^2].","Remember 'LOW-d-HIGH minus HIGH-d-LOW, over LOW squared' — a sign slip on either half of the numerator is the classic trap here.",0,1],["Differentiate y = (x) / (cos(x)) with respect to x.",["dy/dx = [xsin(x) + cos(x) all over (cos(x))^2]","dy/dx = [-xsin(x) + cos(x) all over (cos(x))^2]","dy/dx = [-xsin(x) - cos(x) all over (cos(x))^2]","dy/dx = [xsin(x) - cos(x) all over (cos(x))^2]"],0,"Quotient Rule: dy/dx = [v(du/dx) - u(dv/dx)] / v^2. u = x -> du/dx = 1. v = cos(x) -> dv/dx = -sin(x). Numerator = (cos(x))(1) - (x)(-sin(x)) = xsin(x) + cos(x). So dy/dx = [xsin(x) + cos(x) all over (cos(x))^2].","Remember 'LOW-d-HIGH minus HIGH-d-LOW, over LOW squared' — a sign slip on either half of the numerator is the classic trap here.",0,1],["Differentiate y = (x^3) / (x^2 + 1) with respect to x.",["dy/dx = [x^4 + 3x^2 all over (x^2 + 1)^2]","dy/dx = [5x^4 + 3x^2 all over (x^2 + 1)^2]","dy/dx = [-x^4 - 3x^2 all over (x^2 + 1)^2]","dy/dx = [-5x^4 - 3x^2 all over (x^2 + 1)^2]"],0,"Quotient Rule: dy/dx = [v(du/dx) - |/4 + C","ln|x + 1|/4 + 5ln|x + 5|/4 + C","ln|x + 1|/4 - 5ln|x + 5|/4 + C"],0,"Write x/((x + 1)(x + 5)) = A/(x+1) + B/(x+5). Multiply through and solve for A, B by substituting x=-1 and x=-5. Each piece integrates to a ln| | term: -ln|x + 1|/4 + 5ln|x + 5|/4 + C.","Cover up each factor in turn and plug in the root that makes it zero — that instantly gives A and B. A sign slip on either term is the classic trap.",0,8],["Find ∫ 1/(x+2)^2 dx",["-1/(x + 2) + C","1/(x + 2) + C","1/(2(x + 2)) + C","-1/(2(x + 2)) + C"],0,"For a REPEATED linear factor (x+2)^2, apply the power rule directly (treat x+2 as a single variable): ∫(x+2)^(-2) dx = -1/(x + 2) + C.","A repeated factor just needs ordinary power-rule treatment — a sign slip or an off-by-one error in the resulting power/coefficient are the two classic traps.",0,8],["Find ∫ 1/(x+1)^2 dx",["-1/(x + 1) + C","1/(x + 1) + C","1/(2(x + 1)) + C","-1/(2(x + 1)) + C"],0,"For a REPEATED linear factor (x+1)^2, apply the power rule directly (treat x+1 as a single variable): ∫(x+1)^(-2) dx = -1/(x + 1) + C.","A repeated factor just needs ordinary power-rule treatment — a sign slip or an off-by-one error in the resulting power/coefficient are the two classic traps.",0,8],["Find ∫ 1/(x+3)^3 dx",["-1/(2x^2 + 12x + 18) + C","1/(2x^2 + 12x + 18) + C","1/(3(x + 3)^2) + C","-1/(3(x + 3)^2) + C"],0,"For a REPEATED linear factor (x+3)^3, apply the power rule directly (treat x+3 as a single variable): ∫(x+3)^(-3) dx = -1/(2x^2 + 12x + 18) + C.","A repeated factor just needs ordinary power-rule treatment — a sign slip or an off-by-one error in the resulting power/coefficient are the two classic traps.",0,8],["Find ∫ 1/(x+4)^2 dx",["-1/(x + 4) + C","1/(x + 4) + C","1/(2(x + 4)) + C","-1/(2(x + 4)) + C"],0,"For a REPEATED linear factor (x+4)^2, apply the power rule directly (treat x+4 as a single variable): ∫(x+4)^(-2) dx = -1/(x + 4) + C.","A repeated factor just needs ordinary power-rule treatment — a sign slip or an off-by-one error in the resulting power/coefficient are the two classic traps.",0,8],["Find ∫ 1/(x+5)^2 dx",["-1/(x + 5) + C","1/(x + 5) + C","1/(2(x + 5)) + C","-1/(2(x + 5)) + C"],0,"For a REPEATED linear factor (x+5)^2, apply the power rule directly (treat x+5 as a single variable): ∫(x+5)^(-2) dx = -1/(x + 5) + C.","A repeated factor just needs ordinary power-rule treatment — a sign slip or an off-by-one error in the resulting power/coefficient are the two classic traps.",0,8],["Find ∫ 1/(x+2)^3 dx",["-1/(2x^2 + 8x + 8) + C","1/(2x^2 + 8x + 8) + C","1/(3(x + 2)^2) + C","-1/(3(x + 2)^2) + C"],0,"For a REPEATED linear factor (x+2)^3, apply the power rule directly (treat x+2 as a single variable): ∫(x+2)^(-3) dx = -1/(2x^2 + 8x + 8) + C.","A repeated factor just needs ordinary power-rule treatment — a sign slip or an off-by-one error in the resulting power/coefficient are the two classic traps.",0,8],["Find ∫ (1) / [x(x^2 + 1)] dx  by partial fractions.",["ln|x| - ln|x^2 + 1|/2 + C","ln|x| + ln|x^2 + 1|/2 + C","-ln|x| - ln|x^2 + 1|/2 + C","-ln|x| + ln|x^2 + 1|/2 + C"],0,"Since x^2 + 1 is an IRREDUCIBLE quadratic, its partial-fraction numerator must be a general LINEAR expression (Bx+C), not just a constant. Split as A/(linear factor) + (Bx+C)/x^2 + 1, solve for A,B,C, then integrate. Result: ln|x| - ln|x^2 + 1|/2 + C.","Irreducible quadratic on the bottom -> its numerator MUST be (Bx+C), never just a constant. A sign slip on any one of the resulting three terms is the classic trap.",0,8],["Find ∫ (1) / [(x + 1)(x^2 + 4)] dx  by partial fractions.",["ln|x + 1|/5 - ln|x^2 + 4|/10 + tan^-1(x/2)/10 + C","ln|x + 1|/5 + ln|x^2 + 4|/10 + tan^-1(x/2)/10 + C","-ln|x + 1|/5 - ln|x^2 + 4|/10 + tan^-1(x/2)/10 + C","ln|x + 1|/5 - ln|x^2 + 4|/10 - tan^-1(x/2)/10 + C"],0,"Since x^2 + 4 is an IRREDUCIBLE quadratic, its partial-fraction numerator must be a general LINEAR expression (Bx+C), not just a constant. Split as A/(linear factor) + (Bx+C)/x^2 + 4, solve for A,B,C, then integrate. Result: ln|x + 1|/5 - ln|x^2 + 4|/10 + tan^-1(x/2)/10 + C.","Irreducible quadratic on the bottom -> its numerator MUST be (Bx+C), never just a constant. A sign slip on any one of the resulting three terms is the classic trap.",0,8],["Find ∫ (2x) / [(x - 1)(x^2 + 9)] dx  by partial fractions.",["ln|x - 1|/5 - ln|x^2 + 9|/10 + 3tan^-1(x/3)/5 + C","ln|x - 1|/5 + ln|x^2 + 9|/10 + 3tan^-1(x/3)/5 + C","-ln|x - 1|/5 - ln|x^2 + 9|/10 + 3tan^-1(x/3)/5 + C","ln|x - 1|/5 - ln|x^2 + 9|/10 - 3tan^-1(x/3)/5 + C"],0,"Since x^2 + 9 is an IRREDUCIBLE quadratic, its partial-fraction numerator must be a general LINEAR expression (Bx+C), not just a constant. Split as A/(linear factor) + (Bx+C)/x^2 + 9, solve for A,B,C, then integrate. Result: ln|x - 1|/5 - ln|x^2 + 9|/10 + 3tan^-1(x/3)/5 + C.","Irreducible quadratic on the bottom -> its numerator MUST be (Bx+C), never just a constant. A sign slip on any one of the resulting three terms is the classic trap.",0,8],["Find ∫ (x - 1) / [(x + 2)(x^2 + 1)] dx  by partial fractions.",["-3ln|x + 2|/5 + 3ln|x^2 + 1|/10 - tan^-1(x)/5 + C","3ln|x + 2|/5 + 3ln|x^2 + 1|/10 - tan^-1(x)/5 + C","-3ln|x + 2|/5 + 3ln|x^2 + 1|/10 + tan^-1(x)/5 + C","-3ln|x + 2|/5 - 3ln|x^2 + 1|/10 - tan^-1(x)/5 + C"],0,"Since x^2 + 1 is an IRREDUCIBLE quadratic, its partial-fraction numerator must be a general LINEAR expression (Bx+C), not just a constant. Split as A/(linear factor) + (Bx+C)/x^2 + 1, solve for A,B,C, then integrate. Result: -3ln|x + 2|/5 + 3ln|x^2 + 1|/10 - tan^-1(x)/5 + C.","Irreducible quadratic on the bottom -> its numerator MUST be (Bx+C), never just a constant. A sign slip on any one of the resulting three terms is the classic trap.",0,8],["Find ∫ (1) / [(x - 3)(x^2 + 1)] dx  by partial fractions.",["ln|x - 3|/10 - ln|x^2 + 1|/20 - 3tan^-1(x)/10 + C","ln|x - 3|/10 - ln|x^2 + 1|/20 + 3tan^-1(x)/10 + C","ln|x - 3|/10 + ln|x^2 + 1|/20 - 3tan^-1(x)/10 + C","-ln|x - 3|/10 - ln|x^2 + 1|/20 - 3tan^-1(x)/10 + C"],0,"Since x^2 + 1 is an IRREDUCIBLE quadratic, its partial-fraction numerator must be a general LINEAR expression (Bx+C), not just a constant. Split as A/(linear factor) + (Bx+C)/x^2 + 1, solve for A,B,C, then integrate. Result: ln|x - 3|/10 - ln|x^2 + 1|/20 - 3tan^-1(x)/10 + C.","Irreducible quadratic on the bottom -> its numerator MUST be (Bx+C), never just a constant. A sign slip on any one of the resulting three terms is the classic trap.",0,8],["Find ∫ (x) / [(x + 2)(x^2 + 4)] dx  by partial fractions.",["-ln|x + 2|/4 + ln|x^2 + 4|/8 + tan^-1(x/2)/4 + C","ln|x + 2|/4 + ln|x^2 + 4|/8 + tan^-1(x/2)/4 + C","-ln|x + 2|/4 + ln|x^2 + 4|/8 - tan^-1(x/2)/4 + C","-ln|x + 2|/4 - ln|x^2 + 4|/8 + tan^-1(x/2)/4 + C"],0,"Since x^2 + 4 is an IRREDUCIBLE quadratic, its partial-fraction numerator must be a general LINEAR expression (Bx+C), not just a constant. Split as A/(linear factor) + (Bx+C)/x^2 + 4, solve for A,B,C, then integrate. Result: -ln|x + 2|/4 + ln|x^2 + 4|/8 + tan^-1(x/2)/4 + C.","Irreducible quadratic on the bottom -> its numerator MUST be (Bx+C), never just a constant. A sign slip on any one of the resulting three terms is the classic trap.",0,8]]},{"t":"Application of Integration","s":["Areas, Volumes, Numerical Methods"],"q":[["The area under a curve y=f(x) from x=a to x=b is given by the DEFINITE integral, written as:",["∫f(x)dx (indefinite, no bounds)","∫ₐᵇ f(x)dx","f(b)-f(a) without integrating","f'(a) - f'(b)"],1,"The definite integral ∫ₐᵇf(x)dx has a clearly defined start (a) and end (b), which is exactly what's needed to compute a specific, bounded area.","'Definite' means the AREA IS CLEARLY DEFINED — bounded on both sides by actual numbers, unlike the indefinite integral which just gives a general antiderivative family.",0,0],["To find the area bounded by f(x)=x²/4, the x-axis, and the vertical lines x=1 and x=3, you compute:",["f(3) - f(1)","∫₁³ (x²/4) dx","∫₀³ (x²/4) dx - ∫₀¹ (x²/4) dx (same result as the previous option, shown differently)","f'(3) - f'(1)"],1,"The area under the curve between the given vertical bounds is exactly the definite integral of the function over that interval: ∫₁³(x²/4)dx.","'Area bounded by a curve, the x-axis, and two vertical lines' is EXAM CODE for 'set up a definite integral with those two x-values as your limits.'",0,0],["∫₁³ (x²/4) dx evaluates to:",["13/6","26/3","9/4","1/12"],0,"∫(x²/4)dx = x³/12. Evaluate: (3³)/12 - (1³)/12 = 27/12 - 1/12 = 26/12 = 13/6.","Always find the antiderivative FIRST, then apply the Fundamental Theorem: [F(x)] from a to b = F(b) - F(a).",0,0],["When finding the area bounded by f(x)=x² and the horizontal line y=4 (with the positive y-axis), the strategy for finding the limits of integration is to:",["Simply guess a few random x-values and hope they work","Find the intersection points of the boundary curves","Always default to using x=0 as the start and x=1 as the end","Integrate blindly across the entire range from negative to positive infinity"],1,"The limits of integration must match where the bounding curves actually meet — solving f(x)=x²=4 gives x=2 as one boundary, with x=0 given directly by the y-axis condition.","Whenever limits aren't explicitly given, SOLVE for the intersection points of the bounding curves — that's always your first move.",0,0],["For the region bounded by the positive y-axis, y=4, and f(x)=x², the area equals ∫₀² (4-x²)dx. Why is the integrand (4-x²) rather than just x²?",["Because y=4 is the top boundary and x² is the bottom one there","Because the number 4 happens to be a constant value","It's simply a typo, x² alone is correct","Because x² is supposedly always negative throughout that region"],0,"To find area BETWEEN two curves, you integrate (top function - bottom function). Here y=4 sits above the parabola on [0,2], so the integrand is (4-x²).","(TOP - BOTTOM) is the universal rule for area-between-curves problems — get the order right or your area comes out negative.",0,0],["∫₀² (4-x²) dx evaluates to:",["16/3","8","4","2/3"],0,"∫(4-x²)dx = 4x - x³/3. At x=2: 8 - 8/3 = 16/3. At x=0: 0. Area = 16/3 - 0 = 16/3.","Split the integral term by term before evaluating — much less error-prone than trying to do it all at once.",0,0],["If the graph of f(x) dips BELOW the x-axis over part of the interval [a,b], the plain definite integral ∫ₐᵇf(x)dx will:",["Still give the correct total geometric area with no adjustment needed at all","Give a negative contribution for that below-axis portion","Automatically double the true geometric area of that region","Always work out to equal exactly zero no matter what"],1,"Since integration below the x-axis produces negative values, a straightforward ∫ₐᵇf(x)dx will SUBTRACT that region's area rather than add it — you must split the integral and take absolute values region by region if you want true geometric area.","'Below the x-axis → negative sign' is the reason the textbook explicitly warns: sketch the curve FIRST to see where it dips negative before blindly integrating.",0,0],["The remark in the textbook about area-under-curve problems emphasizes that you should FIRST:",["Just guess the final numeric answer before doing any work","Sketch the curves first to see which one lies on top","Always assume whichever function is listed first must be the top curve","Skip straight into integrating without sketching or checking anything first"],1,"The manual's explicit remark: sketch first to determine which curve is 'on top' and to catch any sign issues from portions below the x-axis, BEFORE setting up the integral.","'Sketch first, integrate second' — this single habit prevents almost every sign-error mistake in area problems.",0,0],["∫₀¹ (x²-x) dx, representing the area between y=x²-x and the x-axis on [0,1], gives a NEGATIVE numeric result. What does this tell you?",["It must mean the whole calculation contains an arithmetic mistake","The curve y=x²-x lies below the x-axis on that whole interval","It means the area itself is genuinely negative in real physical life","It means the curve x²-x simply has no graph over that interval at all"],1,"x²-x = x(x-1) is indeed negative for all x strictly between 0 and 1 (since one factor is positive, the other negative) — a negative integral here correctly signals a below-axis region; the actual geometric area is |result|.","A negative definite-integral answer for an 'area' question is a RED FLAG that the curve dips below the axis — take the absolute value for the true area, don't just report the negative number.",0,0],["For a function with graph entirely ABOVE the x-axis on [a,b], the definite integral ∫ₐᵇf(x)dx will always be:",["Negative","Zero","Positive, matching the true area","Undefined"],2,"When the whole region lies above the x-axis, every infinitesimal strip contributes a positive value, so the integral is positive and equals the actual area with no adjustment needed.","'Above axis = matches area directly' is the SAFE, no-adjustment-needed case — always check this first before worrying about sign corrections.",0,0],["To find the area between curves f(x)=2-x² and g(x)=x, the FIRST step is to:",["Integrate immediately across the entire infinite range","Find the points of intersection by solving f(x)=g(x)","Simply assume the integration limits are -1 and 1","Differentiate both of the two given functions first"],1,"Solving 2-x²=x gives the x-values where the two curves cross — these become the limits of integration for the enclosed region.","'Area between two curves' ALWAYS starts with finding where they intersect (set them equal, solve for x).",0,0],["Solving 2-x² = x gives x²+x-2=0, which factors as (x+2)(x-1)=0. The intersection points are:",["x=2 and x=-1","x=-2 and x=1","x=1 and x=2","x=-1 and x=-2"],1,"(x+2)(x-1)=0 gives x=-2 or x=1 — these are the boundary x-values for the enclosed region.","Always double-check your factoring by re-expanding — (x+2)(x-1) = x²+x-2 ✓.",0,0],["For the region between f(x)=2-x² and g(x)=x on [-2,1], which function is on TOP?",["g(x)=x is on top throughout","f(x)=2-x² is on top throughout","They swap positions partway through","Cannot be determined without more information"],1,"Testing a point inside the interval, e.g. x=0: f(0)=2, g(0)=0, so f is above g there — and since they only cross at the two endpoints, f stays on top throughout the whole interval.","Test ANY single point strictly INSIDE your interval to instantly determine which curve is on top — no need to check every point.",0,0],["The area between f(x)=2-x² and g(x)=x on [-2,1] is set up as:",["∫₋₂¹ [x - (2-x²)] dx","∫₋₂¹ [(2-x²) - x] dx","∫₋₂¹ [(2-x²) + x] dx","∫₋₂¹ [(2-x²) · x] dx"],1,"Following the TOP-minus-BOTTOM rule, with f=2-x² on top and g=x on the bottom: the integrand is (2-x²)-x.","Once you know which curve is on top, just plug directly into (TOP - BOTTOM) — don't overthink it.",0,0],["∫₋₂¹ [(2-x²)-x] dx evaluates to:",["-9/2","9/2","-8/3","8/3"],1,"Simplify to ∫(2-x²-x)dx = 2x - x³/3 - x²/2. At x=1: 2-1/3-1/2=7/6. At x=-2: -4+8/3-2=-10/3. Difference: 7/6-(-10/3)=7/6+20/6=27/6=9/2.","When integrating a three-term polynomial like this, evaluate each term's contribution separately at both bounds to avoid arithmetic slips.",0,0],["If you accidentally set up the area-between-curves integral as (BOTTOM - TOP) instead of (TOP - BOTTOM), the result will be:",["Still exactly correct with no issue whatsoever","The correct magnitude but with the WRONG (negative) sign","Exactly double the true correct area value","Always work out to equal precisely zero"],1,"Swapping the order simply flips the sign of the result — the magnitude stays right, but you'd report a negative 'area', which is a red flag that the subtraction order was reversed.","A negative answer to an area-between-curves problem almost always means you swapped top and bottom — just flip the sign (or redo it in the correct order).",0,0],["When two curves cross MULTIPLE times within a region (not just twice), correctly finding the total enclosed area requires:",["A single integral over the whole span regardless of crossings","Splitting the integral at each crossing point","Ignoring the extra crossings","Doubling the final answer"],1,"Each time the curves cross, the identity of 'which one is on top' can swap — so you must split the integral at every crossing point and handle each piece with the correct (top-bottom) assignment.","Multiple crossings = multiple separate integrals, stitched together — never assume one curve stays on top the whole way if they cross more than twice.",0,0],["The area between two curves is a direct application of which broader principle?",["Area under one curve is the special case where the bottom is y=0","It has nothing to do with area under a single curve","Curves must always be straight lines for this to work","Only works for curves that never intersect"],0,"Area under one curve (relative to the x-axis) is literally the area-between-curves formula with g(x)=0 as the 'bottom' — the same top-minus-bottom logic applies uniformly.","Realizing 'area under one curve' is just 'area between a curve and y=0' unifies these two topics into ONE single idea to remember.",0,0],["To find the volume of a solid of revolution formed by rotating a region about the x-axis, the general formula (disk method) is:",["V = ∫ₐᵇ f(x) dx","V = π∫ₐᵇ [f(x)]² dx","V = 2π∫ₐᵇ f(x) dx","V = ∫ₐᵇ [f(x)]² dx"],1,"Each thin cross-sectional disk has radius f(x) and area π[f(x)]², so summing (integrating) these disk volumes from a to b gives V = π∫ₐᵇ[f(x)]²dx.","Don't forget the π AND the squaring — both come from the area-of-a-circle formula (πr²) applied to each thin disk.",0,0],["For the sphere derivation in the textbook, the curve C₁: x²+y²=R² is rotated about the x-axis. The volume differential dV(x) equals:",["πx² dx","πy² dx","2πy dx","π(x+y) dx"],1,"Each thin disk has radius equal to the curve's y-value at that x, so its cross-sectional area is πy², giving dV=πy²dx.","In the disk method, the 'radius' of each slice is always the y-value (height) of the curve being rotated — that's what gets squared and multiplied by π.",0,0],["Using y²=R²-x² for the sphere, the volume becomes V=π∫₋ᴿᴿ(R²-x²)dx, which evaluates to:",["πR³","(4/3)πR³","(2/3)πR³","4πR²"],1,"Evaluating the integral: π[R²x - x³/3] from -R to R = π[(R³-R³/3)-(-R³+R³/3)] = π[2R³-2R³/3] = π(4R³/3) = (4/3)πR³ — the familiar sphere volume formula.","This derivation is literally WHERE the famous sphere volume formula (4/3)πR³ comes from — it's not just memorized, it's built with calculus.",0,0],["The general strategy for finding a volume by integration, as described in the textbook, is to:",["Always simply assume the solid in question is a perfect sphere","Write dV = A(x)dx along the sweep direction","Skip straight to a formula without any setup","This method only ever works for solids with circular cross-sections"],1,"The general method: pick a sweep direction, find the cross-sectional area A(x) at each point, then integrate A(x)dx across the whole range — this works for any shape, not just spheres.","dV = A(x)dx is the UNIVERSAL volume-by-integration formula — the disk method (πr²) is just one specific case where A(x) happens to be a circle's area.",0,0],["For a solid where the cross-section perpendicular to the sweep direction is a SQUARE of side length s(x) (rather than a circular disk), the correct volume differential is:",["dV = π[s(x)]² dx","dV = [s(x)]² dx","dV = 2s(x) dx","dV = π s(x) dx"],1,"Since the cross-sectional area of a square with side s(x) is simply [s(x)]² (no π involved, unlike a circle), the volume differential is dV=[s(x)]²dx.","Only CIRCULAR cross-sections bring in a π — squares, triangles, and other shapes use their own ordinary area formulas instead.",0,0],["Finding the volume of a cone of base radius r and height h using integration requires setting up A(x) as the area of:",["A square that grows linearly with x","A circle whose radius shrinks linearly from r down to 0","A constant-size circle throughout","A triangle"],1,"As you slice a cone along its axis, each cross-section is a circle whose radius scales proportionally with distance from the apex — this linearly-shrinking radius is the key setup step before integrating πr(x)² over the height.","For a cone, always express the radius as a LINEAR function of x first (similar triangles), THEN plug that into the disk formula.",0,0],["In general, the volume-by-integration technique requires knowing (or being able to find) which key quantity at every point along the sweep direction?",["The function's ordinary first derivative value","The cross-sectional area A(x) of the solid at that point","The function's ordinary second derivative value","Only the domain of the function, nothing else"],1,"The entire volume-by-integration method hinges on being able to express A(x) — the cross-sectional area at each point — as a function of x; everything else follows from integrating that.","If you're stuck on a volume problem, ask yourself: 'What shape is my cross-section, and what's its area formula?' — that's 90% of the battle.",0,0],["Why does the disk-method volume formula V=π∫ₐᵇ[f(x)]²dx use [f(x)]² rather than just f(x)?",["It's purely an arbitrary mathematical convention with no real reason","Because a circle's area is π×radius², and f(x) is that radius","To make the integral easier to compute","Because f(x) is always negative otherwise"],1,"The area of a circle is πr² — since the disk's radius at position x is f(x), its area must be π[f(x)]², which is exactly why the function gets squared inside the integral.","The squaring isn't a calculus trick — it's just ordinary geometry (circle area = πr²) being applied slice by slice.",0,0],["The Trapezoidal Rule is used to approximate a definite integral primarily when:",["The function involved is always a simple polynomial expression","There's no elementary antiderivative available","The function happens to be negative throughout its whole domain","The interval of integration [a,b] stretches out to infinity"],1,"Functions like √(1-x³) or e^(-x²) have no simple closed-form antiderivative — the Trapezoidal Rule offers a numerical way to estimate the integral anyway, using straight-line approximations between sample points.","Numerical methods like Trapezoidal Rule are your BACKUP PLAN whenever a function refuses to integrate nicely by standard techniques.",0,0],["The Trapezoidal Rule approximates the area under a curve by replacing each strip with:",["A single flat-topped rectangle","A trapezoid (using a straight line to connect consecutive points)","A small triangular wedge","A perfect circular arc"],1,"Instead of a flat-topped rectangle, the Trapezoidal Rule connects consecutive sample points with a straight LINE, forming a trapezoid whose area is easy to compute and sum.","The name says it all — 'Trapezoidal' Rule uses TRAPEZOIDS (straight-line tops), a step up in accuracy from simple flat rectangles.",0,0],["The Trapezoidal Rule formula is: ∫ₐᵇf(x)dx ≈ (Δx/2)(y₀+2y₁+2y₂+...+2yₙ₋₁+yₙ). Why do the MIDDLE y-values get a factor of 2, while the first and last don't?",["It's simply an arbitrary stylistic choice with no real justification","Each interior point belongs to two adjacent trapezoids at once","Purely to make the final formula look visually symmetric","Because even-indexed sample points are always numerically larger"],1,"Every interior sample point (y₁ through yₙ₋₁) forms the boundary between two consecutive trapezoids and contributes to BOTH of them — hence the factor of 2. The very first (y₀) and very last (yₙ) points only belong to a single trapezoid each.","Picture the trapezoids lined up in a row — every 'internal wall' height is shared by its neighbours on both sides, so it counts twice; only the two outer walls stand alone.",0,0],["For the Trapezoidal Rule with n subintervals over [a,b], the width of each subinterval, Δx, equals:",["(b-a)","(b-a)/n","(b+a)/n","n/(b-a)"],1,"Dividing the total interval length (b-a) evenly among n subintervals gives a width of Δx=(b-a)/n for each piece.","Δx = (total length) ÷ (number of pieces) — the same basic idea as slicing a cake into n equal pieces.",0,0],["Using the Trapezoidal Rule with n=8 to estimate ∫₀⁵√(1-x²)dx requires computing Δx as:",["5/8 = 0.625","8/5 = 1.6","5-8 = -3","5×8 = 40"],0,"Δx = (b-a)/n = (5-0)/8 = 0.625.","Always compute Δx FIRST before building your table of x and y values — it sets up everything else.",0,0],["Increasing the number of subintervals n in the Trapezoidal Rule generally:",["Makes the numerical approximation noticeably worse overall","Makes the approximation better as trapezoids hug the curve closer","Has essentially no effect on the approximation's accuracy at all","Only actually works correctly when n is set to exactly eight"],1,"More (thinner) subintervals mean each straight-line trapezoid top more closely follows the actual curve, generally reducing approximation error.","More slices = more accuracy, in general — this is the whole logic behind numerical integration methods improving as n grows.",0,0],["Which of these correctly matches the coefficient PATTERN of the Trapezoidal Rule for n=4 (so 5 y-values, y₀ to y₄)?",["1, 2, 2, 2, 1","1, 4, 2, 4, 1","1, 1, 1, 1, 1","1, 3, 3, 3, 1"],0,"Trapezoidal Rule coefficients are always: 1 (first), then 2 repeated for every interior point, then 1 (last) — giving 1,2,2,2,1 for n=4.","Trapezoidal = 1-2-2-...-2-1 pattern. (Compare this later to Simpson's very different 1-4-2-4-...-1 pattern — don't mix the two up!)",0,0],["Simpson's Rule improves on the Trapezoidal Rule by approximating each pair of strips with:",["A single straight connecting line","A parabola (quadratic curve) fitted through three consecutive points","A perfect semicircular arc","A cubic curve through four points"],1,"Instead of straight lines, Simpson's Rule fits a smooth PARABOLA through each set of three consecutive points — generally hugging a curved function more accurately than straight-line trapezoids.","Trapezoidal = straight lines. Simpson's = parabolas. Curved approximations (Simpson's) are usually MORE accurate for smoothly curving functions.",0,0],["Simpson's Rule formula is: ∫ₐᵇf(x)dx ≈ (Δx/3)(y₀+4y₁+2y₂+4y₃+2y₄+...+4yₙ₋₁+yₙ). This formula REQUIRES that n (the number of subintervals) be:",["Any positive integer","An EVEN number","An odd number only","Exactly equal to 6"],1,"Simpson's Rule pairs up strips into groups of two (fitting a parabola through each trio of points), so the total number of subintervals n must be EVEN for this pairing to work out exactly.","Simpson's Rule needs an EVEN n — always double-check this before applying the formula, otherwise the coefficient pattern breaks down.",0,0],["In Simpson's Rule's coefficient pattern (1,4,2,4,2,4,...,4,1), the coefficients ALTERNATE between:",["The number 4 repeated on its own throughout","4 (odd-indexed points) and 2 (even-indexed interior points)","The number 1 repeated on its own throughout","The number 2 repeated on its own throughout"],1,"Odd-indexed y-values (y₁,y₃,y₅,...) get coefficient 4, while even-indexed INTERIOR y-values (y₂,y₄,...) get coefficient 2 — with the very first and last points getting coefficient 1.","Simpson's rhythm: 1, then alternate 4-2-4-2..., ending on 4, then 1. The 4's and 2's ALTERNATE, don't just repeat one number.",0,0],["Using Simpson's Rule with n=6 to estimate ∫₁⁴√(1-x²)dx requires Δx equal to:",["0.5","3/6=0.5 — same thing, so 0.5 either way","6","4"],0,"Δx = (b-a)/n = (4-1)/6 = 3/6 = 0.5.","The Δx formula is IDENTICAL for both Trapezoidal and Simpson's Rule — (b-a)/n — only the WEIGHTING coefficients differ between the two methods.",0,0],["Compared to the Trapezoidal Rule with the same number of subintervals, Simpson's Rule generally gives:",["A noticeably less accurate numerical approximation overall","A more accurate approximation via curved parabolic pieces","Exactly the identical numerical result every single time","A completely undefined or meaningless numerical result"],1,"Because Simpson's Rule uses curved (parabolic) approximating pieces rather than straight lines, it typically achieves higher accuracy for the same number of subintervals, especially for smoothly curving functions.","If accuracy really matters and n is even, Simpson's Rule is generally the smarter choice over the Trapezoidal Rule.",0,0],["Given the divisor in each formula, Trapezoidal Rule uses (Δx/2) as its overall multiplier, while Simpson's Rule uses:",["Δx/2 also","Δx/3","Δx/4","Δx alone, no division"],1,"Simpson's Rule formula has (Δx/3) as its overall scaling factor, distinguishing it from the Trapezoidal Rule's (Δx/2).","Quick formula ID trick — divide by 2 outside → Trapezoidal. Divide by 3 outside → Simpson's.",0,0],["Both the Trapezoidal Rule and Simpson's Rule fall under the broader category of:",["Exact, closed-form analytical integration methods","Approximate (numerical) integration methods","Differentiation techniques","Limit theorems"],1,"Neither method gives an EXACT symbolic antiderivative — both estimate the numeric VALUE of a definite integral using sample points, making them numerical/approximate integration techniques.","Both rules are ESTIMATES, not exact answers — they're specifically for when a clean antiderivative isn't available (or the function is only known from data points).",0,0]]}];
try{ if(window.IndigeneHistory&&IndigeneHistory.registerStruct) IndigeneHistory.registerStruct('MTH102',{title:'MTH 102 \u00b7 Elementary Mathematics II',chapters:DATA.map(function(c){return {t:c.t,n:c.q.length,s:c.s};})}); }catch(e){}
const SUBJECT_KEY = 'mth102';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// flatten
const ALL = [];
DATA.forEach((c,ci)=>c.q.forEach((q,qi)=>ALL.push({id:ci+'_'+qi, ch:ci, stem:q[0], opts:q[1], ans:q[2], exp:q[3], hack:q[4], trap:q[5], sec:q[6]})));
const TOTAL = ALL.length;
// questions already served in earlier runs (kept per browser) so new runs favour fresh ones
let SEEN = new Set();
try{ SEEN = new Set(JSON.parse(localStorage.getItem('mth102_seen')||'[]')); }catch(e){}
function saveSeen(){ try{ localStorage.setItem('mth102_seen', JSON.stringify([...SEEN])); }catch(e){} }
// shuffle, then put unseen questions first (random order inside each half)
function freshFirst(arr){ const a=shuffle(arr.slice()); return a.filter(q=>!SEEN.has(q.id)).concat(a.filter(q=>SEEN.has(q.id))); }
const FULL_N = 500;
// fair sample: every chapter is represented in proportion to its size
function sampleFair(n){
  const groups = DATA.map((_,ci)=>freshFirst(ALL.filter(q=>q.ch===ci)));
  const exact = groups.map(g=>g.length*n/TOTAL);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a,b)=>a+b,0);
  exact.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([f,i])=>{ if(left>0 && take[i]<groups[i].length){ take[i]++; left--; } });
  let out=[]; groups.forEach((g,i)=>{ out=out.concat(g.slice(0,take[i])); });
  return shuffle(out);
}

// optional access gate (cbt-lock.js) — never breaks the quiz if missing
let lock = null;
async function loadLock(){
  try { lock = await import('../cbt-lock.js'); }
  catch(e){ try { lock = await import('/cbt-lock.js'); } catch(e2){ lock = null; } }
}
const lockReady = loadLock();

const PASS = 50;
const grade = p => p>=70?'A':p>=60?'B':p>=50?'C':p>=45?'D':p>=40?'E':'F';
let mode = 'full', sel = new Set(), secSel = null, run = [], idx = 0, weakSpec = null;
// '2.3,4.all' = chapter 2 section 3, whole of chapter 4 (sent from the History tab or the result screen)
function specPool(spec){
  const want = spec.map(s=>s.split('.')); let pool = [];
  want.forEach(([c,s])=>{ const ci=(+c)-1; if(!DATA[ci]) return;
    pool = pool.concat(ALL.filter(q=>q.ch===ci && (s==='all' || q.sec===(+s)-1))); });
  pool = shuffle(pool); return pool.length>50 ? pool.slice(0,50) : pool;
}

function renderSetup(){
  const quick = 50, half = 250;
  const cards = [
    ['full', FULL_N, 'Full CBT'],
    ['quick', quick, 'Quick Drill'],
    ['half', half, 'Half Run'],
    ['session', '🎯', 'By Chapter']
  ];
  $('runs').innerHTML = cards.map(c=>`<button class="run${c[0]===mode?' sel':''}" data-m="${c[0]}"><span class="n">${c[1]}</span>${c[2]}</button>`).join('');
  document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; renderSetup(); });
  $('chaps').classList.toggle('show', mode==='session');
  $('chapList').innerHTML = DATA.map((c,i)=>{
    const on = sel.has(i);
    let x = `<div class="chap${on?' on':''}" data-i="${i}"><span class="box" style="border-radius:50%">${on?'●':''}</span><span class="nm">Ch ${i+1}. ${esc(c.t)}</span><span class="ct">${c.q.length}</span></div>`;
    if(on){
      x += '<div class="secs"><button class="sec'+(secSel===null?' on':'')+'" data-s="all">Whole chapter · '+c.q.length+'</button>'
        + c.s.map((sn,si)=>'<button class="sec'+(secSel===si?' on':'')+'" data-s="'+si+'">'+esc(sn)+' · '+c.q.filter(q=>q[6]===si).length+'</button>').join('') + '</div>';
    }
    return x;
  }).join('');
  document.querySelectorAll('.chap').forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; sel.clear(); sel.add(i); secSel=null; renderSetup(); });
  document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{ secSel = b.dataset.s==='all' ? null : +b.dataset.s; renderSetup(); });
}

function makeItem(q){
  return { q, perm: shuffle([0,1,2,3]), pick: null };   // perm = order of original options shown 
}

async function startQuiz(){
  if(mode==='session' && sel.size===0){ toast('Pick a chapter first'); return; }
  try{ await lockReady; }catch(e){}
  if(lock && typeof lock.checkCbtAccess==='function'){
    try{
      const r = await lock.checkCbtAccess(SUBJECT_KEY);
      if(r && r.blocked){ lock.renderCbtLockScreen($('app'), r.reason); return; }
    }catch(e){}
  }
  let pool;
  if(mode==='full') pool = sampleFair(FULL_N);
  else if(mode==='quick') pool = freshFirst(ALL).slice(0,50);
  else if(mode==='half') pool = sampleFair(250);
  else if(mode==='weak') pool = specPool(weakSpec||[]);
  else {
    pool = [];
    [...sel].sort((a,b)=>a-b).forEach(ci=>{ pool = pool.concat(ALL.filter(q=>q.ch===ci && (secSel===null || q.sec===secSel))); });
  }
  if(!pool.length){ toast('Nothing to practise there'); return; }
  begin(pool);
}

let startedAt = 0, isRetry = false, saved = false;
let reviewing=false;
function begin(pool, retry){
  reviewing=false; $('finishBtn').textContent='Finish & see score';
  run = pool.map(makeItem); idx = 0; startedAt = Date.now(); isRetry = !!retry; saved = false;
  if(!retry){ pool.forEach(q=>SEEN.add(q.id)); if(SEEN.size >= TOTAL) SEEN = new Set(); saveSeen(); }
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  window.scrollTo(0,0);
  renderQ();
}

function counts(){
  let ok=0,no=0;
  run.forEach(it=>{ if(it.pick!==null){ it.pick===it.q.ans ? ok++ : no++; } });
  return {ok,no};
}

function renderQ(){
  const it = run[idx], q = it.q, c = counts();
  $('qpos').textContent = `Q ${idx+1} / ${run.length}`;
  $('sOk').textContent = c.ok; $('sNo').textContent = c.no;
  $('bar').style.width = ((c.ok+c.no)/run.length*100)+'%';
  $('chtag').textContent = `Ch ${q.ch+1} · ${DATA[q.ch].t}`;
  $('qtext').textContent = q.stem;
  const L = ['A','B','C','D'];
  const answered = it.pick!==null || reviewing;
  $('opts').innerHTML = it.perm.map((oi,pos)=>{
    let cls='opt';
    if(answered){ cls+=' locked'; if(oi===q.ans) cls+=' correct'; else if(oi===it.pick) cls+=' wrong'; }
    return `<button class="${cls}" data-oi="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join('');
  if(!answered) document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  renderFb();
  $('prev').disabled = idx===0;
  $('next').textContent = idx===run.length-1 ? (reviewing?'Done ▶':'Finish ▶') : 'Next ▶';
}

function renderFb(){
  const it = run[idx], q = it.q;
  if(it.pick===null && !reviewing){ $('fb').innerHTML=''; return; }
  const good = it.pick===q.ans;
  const pos = 'ABCD'[it.perm.indexOf(q.ans)];
  $('fb').innerHTML = `<div class="fb">
    ${q.trap?'<span class="trap">⚠ TRAP QUESTION</span>':''}
    <div class="v ${good?'ok':'no'}">${good?'✅ Correct!':it.pick===null?'⏭ Skipped — the answer is '+pos:'❌ Not quite — the answer is '+pos}</div>
    <p class="ex">${esc(q.exp)}</p>
    <div class="hk">⏱ Speed hack: ${esc(q.hack)}</div>
  </div>`;
}

function choose(oi){
  const it = run[idx];
  if(it.pick!==null || reviewing) return;
  it.pick = oi;
  try{ if(lock && typeof lock.recordCbtQuestionUsed==='function') lock.recordCbtQuestionUsed(); }catch(e){}
  renderQ();
}

$('prev').onclick=()=>{ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0);} };
$('next').onclick=()=>{ if(idx<run.length-1){ idx++; renderQ(); window.scrollTo(0,0);} else if(reviewing) backToResult(); else finish(); };
function startReview(){
  reviewing=true; idx=0;
  $('finishBtn').textContent='Back to result';
  $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  renderQ(); window.scrollTo(0,0);
}
function backToResult(){ reviewing=false; $('finishBtn').textContent='Finish & see score'; finish(); }
$('finishBtn').onclick=()=>{
  if(reviewing){ backToResult(); return; }
  const left = run.filter(i=>i.pick===null).length;
  if(left===0){ finish(); return; }
  $('cmsg').textContent = left+' question(s) not answered yet. Finish anyway?';
  $('cov').classList.add('show');
};
$('cYes').onclick=()=>{ $('cov').classList.remove('show'); finish(); };
$('cNo').onclick=()=>$('cov').classList.remove('show');

function openMap(){
  $('map').innerHTML = run.map((it,i)=>{
    let c=''; if(it.pick!==null) c = it.pick===it.q.ans?'ok':'no';
    if(i===idx) c+=' cur';
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; $('ov').classList.remove('show'); renderQ(); window.scrollTo(0,0); });
  $('ov').classList.add('show');
}
$('mapBtn').onclick=openMap;
$('closeMap').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{ if(e.target.id==='ov') $('ov').classList.remove('show'); };

function saveHistory(c){
  if(saved || isRetry) return;
  const answered = c.ok + c.no;
  if(answered<=0) return;
  saved = true;
  try{
    if(window.IndigeneHistory && typeof window.IndigeneHistory.save==='function'){
      const topics = {};
      run.forEach(it=>{
        if(it.pick===null) return;
        const k = 'Ch '+(it.q.ch+1)+' · '+DATA[it.q.ch].s[it.q.sec];
        if(!topics[k]) topics[k]=[0,0];
        topics[k][1]++; if(it.pick===it.q.ans) topics[k][0]++;
      });
      window.IndigeneHistory.save({course:'MTH102', mode:'cbt', correct:c.ok, total:answered,
        secs:Math.round((Date.now()-startedAt)/1000), topics:topics});
    }
  }catch(e){}
}
function finish(){
  const c = counts(), n = run.length, un = n-c.ok-c.no;
  const pct = n? Math.round(c.ok/n*100):0;
  const msg = pct>=70?'Outstanding. You are ready for the exam. 🔥':pct>=50?'You passed. Keep pushing higher and clear every section.':pct>=40?'Close. Revise the failed sections and run again.':'Keep going. Read the failed sections again, then retry.';
  saveHistory(c);
  const chs = {}, secs = {};
  run.forEach(it=>{
    const q = it.q, good = it.pick===q.ans;
    const a = chs[q.ch] || (chs[q.ch] = {ok:0,n:0}); a.n++; if(good) a.ok++;
    const k = q.ch+'_'+q.sec; const b = secs[k] || (secs[k] = {ch:q.ch,sec:q.sec,ok:0,n:0}); b.n++; if(good) b.ok++;
  });
  const chKeys = Object.keys(chs).map(Number).sort((x,y)=>x-y);
  const pc = x => Math.round(x.ok/x.n*100);
  const need = ci => Math.max(8, Math.ceil(DATA[ci].q.length*0.4));
  const rows = chKeys.map(ci=>{
    const a = chs[ci], s = pc(a), full = a.n>=need(ci), ok = s>=PASS;
    const sr = Object.values(secs).filter(x=>x.ch===ci).sort((x,y)=>x.sec-y.sec).map(x=>`<div class="sr"><span>${esc(DATA[ci].s[x.sec])}</span><b class="${pc(x)>=PASS?'pass':'fail'}">${x.ok}/${x.n} · ${pc(x)}%</b></div>`).join('');
    return `<details class="cres"${(full&&!ok)?' open':''}><summary><span>Ch ${ci+1} · ${esc(DATA[ci].t)}</span><b class="${!full?'na':ok?'pass':'fail'}" style="white-space:nowrap">${s}/100 · ${grade(s)} · ${!full?'PRACTICE':ok?'PASS ✔':'FAIL ✖'}</b></summary>${sr}</details>`;
  }).join('');
  const weak = Object.values(secs).filter(x=>x.n>=2 && pc(x)<PASS).sort((x,y)=>x.ch-y.ch||x.sec-y.sec);
  const revise = weak.length ? `<div class="revise"><b>Revise these sections</b>${weak.map(x=>`<div class="sr"><span>Ch ${x.ch+1} · ${esc(DATA[x.ch].s[x.sec])}</span><b class="fail">${pc(x)}%</b></div>`).join('')}</div>` : '<p class="msg pass"><b>Every section in this run is at pass mark or above.</b></p>';
  const fullKeys = chKeys.filter(ci=>chs[ci].n>=need(ci));
  const passedN = fullKeys.filter(ci=>pc(chs[ci])>=PASS).length;
  const wrong = run.filter(it=>it.pick!==null && it.pick!==it.q.ans);
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  window.scrollTo(0,0);
  $('result').innerHTML = `
    <h2>Result</h2>
    <div class="big" style="font-size:2.2rem">${pct}/100 · ${grade(pct)}</div>
    <div class="stats"><span>Correct <b>${c.ok}</b></span><span>Wrong <b>${c.no}</b></span><span>Skipped <b>${un}</b></span><span>Total <b>${n}</b></span></div>
    <p class="msg"><b class="${pct>=PASS?'pass':'fail'}">${pct>=PASS?'PASS':'FAIL'}</b> · pass mark ${PASS}/100 · ${fullKeys.length?'chapters passed in this run '+passedN+'/'+fullKeys.length:'practice run, no chapter pass or fail'}</p>
    <p class="msg">${msg}</p>
    <h2 style="margin-top:16px">Score per chapter</h2>
    ${rows}
    <p class="msg" style="font-size:.8rem;color:var(--mute)">PRACTICE means this run had under 40% of that chapter's questions, so it shows a score but no pass or fail.</p>
    ${revise}
    ${weak.length?'<button class="btn" id="weakBtn">Practice these weak sections ('+weak.length+')</button>':''}
    <button class="btn" id="reviewBtn">Review answers${wrong.length?' ('+wrong.length+' wrong)':''}</button>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="/#history=MTH102">My history</a>
    ${wrong.length?`<button class="btn" id="retryWrong">Retry wrong answers (${wrong.length})</button>`:''}
    <button class="btn ghost" id="newRun">New run</button>
    `;
  $('reviewBtn').onclick=startReview;
  if($('weakBtn')) $('weakBtn').onclick=()=>{ weakSpec=weak.map(x=>(x.ch+1)+'.'+(x.sec+1)); mode='weak'; startQuiz(); };
  if($('retryWrong')) $('retryWrong').onclick=()=>begin(shuffle(wrong.map(w=>w.q)), true);
  $('newRun').onclick=()=>{ $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); renderSetup(); window.scrollTo(0,0); };
}

document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden') || $('ov').classList.contains('show') || $('cov').classList.contains('show')) return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ const it=run[idx]; if(it.pick===null){ choose(it.perm['abcd'.indexOf(k)]); } }
  else if(e.key==='ArrowRight') $('next').click();
  else if(e.key==='ArrowLeft') $('prev').click();
});

$('startBtn').onclick=startQuiz;
renderSetup();
