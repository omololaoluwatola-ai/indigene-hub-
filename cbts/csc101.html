<style>
:root{
  --bg:#120a07; --bg2:#1a0f0a; --card:#1c110b; --line:#4a2a17;
  --fire:#ff6a1a; --fire2:#d4400f; --gold:#ffb347; --text:#f3e7dc; --mute:#b49a88;
  --ok:#2ecc71; --okbg:rgba(46,204,113,.12); --bad:#ff4d4d; --badbg:rgba(255,77,77,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#3a1a0b 0%,var(--bg) 55%) fixed;
  color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh;
  padding:20px 16px 40px;line-height:1.5;
}
#app{max-width:720px;margin:0 auto}
h1.brand{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--fire);text-align:center;
  letter-spacing:.08em;font-size:2.1rem;margin:8px 0 6px;text-shadow:0 0 18px rgba(255,106,26,.35)}
.sub{font-family:'Orbitron',sans-serif;text-align:center;color:var(--mute);font-size:.9rem;letter-spacing:.06em;margin:0 0 20px}
.panel{background:linear-gradient(180deg,var(--card),#150c08);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
.panel h2{font-family:'Orbitron',sans-serif;color:var(--gold);text-align:center;font-size:1.35rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run{background:#150c08;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer;transition:.15s}
.run .n{display:block;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold);font-size:1.5rem;margin-bottom:2px}
.run.sel{background:linear-gradient(135deg,var(--fire),var(--fire2));border-color:var(--gold);box-shadow:0 0 16px rgba(255,106,26,.35)}
.run.sel .n{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;cursor:pointer;
  background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-family:'Exo 2',sans-serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.03em;box-shadow:0 8px 22px rgba(255,106,26,.28)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#150c08;border:1px solid var(--line);color:var(--text);box-shadow:none}
.foot{color:var(--mute);text-align:center;font-size:.92rem;margin-top:16px}
.chaps{margin-top:14px;display:none}
.chaps.show{display:block}
.chaps .tools{display:flex;gap:8px;margin-bottom:8px}
.chaps .tools button{flex:1;background:#150c08;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;font-weight:600;cursor:pointer}
.chap{display:flex;align-items:center;gap:10px;background:#150c08;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.chap.on{border-color:var(--gold);background:#24140c}
.chap .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#000}
.chap.on .box{background:var(--gold);border-color:var(--gold)}
.chap .nm{flex:1;font-size:.98rem}
.chap .ct{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.85rem}

/* progress + sections */
.secs{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px 4px}
.sec{border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:20px;padding:5px 11px;font-size:.82rem;cursor:pointer;font-family:inherit}
.sec.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
details.cres{border:1px solid var(--line);background:#150c08;border-radius:14px;margin-top:10px}
details.cres>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.cres>summary::-webkit-details-marker{display:none}
.cres .sr,.revise .sr{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.cres .sr{padding:8px 14px;border-top:1px solid var(--line)}
.revise{border:1px solid var(--bad);background:var(--badbg);border-radius:14px;padding:12px 14px;margin-top:14px}
.revise .sr{padding:6px 0}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--mute);margin-bottom:8px}
.top .sc{font-family:'Orbitron',sans-serif;font-size:.85rem}
.top .sc b.g{color:var(--ok)} .top .sc b.r{color:var(--bad)}
.bar{height:6px;background:#2a170d;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .25s}
.chtag{display:inline-block;font-size:.78rem;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);
  color:var(--text);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-family:inherit;font-size:1.02rem;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#2a170d;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem}
.opt:not(.locked):hover{border-color:var(--fire)}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .l{background:var(--ok);color:#001a0a}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#2a0000}
.fb{border:1px solid var(--line);border-left:4px solid var(--gold);background:#1a0f0a;border-radius:12px;padding:12px 14px;margin-top:6px}
.fb .v{font-weight:700;margin-bottom:6px}
.fb .v.ok{color:var(--ok)} .fb .v.no{color:var(--bad)}
.fb .trap{display:inline-block;background:var(--fire);color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.fb .ex{margin:0 0 8px}
.fb .hk{color:var(--gold);font-weight:600}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:12px;padding:13px 8px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.nav button.primary{background:linear-gradient(135deg,var(--fire),var(--fire2));border:0;color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

/* map */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.ov h3{font-family:'Orbitron',sans-serif;color:var(--gold);margin:0 0 10px;font-size:1.05rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:38px;border-radius:8px;border:1px solid var(--line);background:#150c08;color:var(--mute);font-family:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
.map button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.map button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--gold)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:10px 0}

/* result */
.big{font-family:'Orbitron',sans-serif;font-size:3rem;color:var(--gold);text-align:center;margin:6px 0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;color:var(--mute)}
.stats b{color:var(--text)}
.msg{text-align:center;color:var(--text);margin:8px 0 6px}
.rv{border:1px solid var(--line);background:#150c08;border-radius:14px;padding:12px 14px;margin-top:12px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .you{color:var(--bad)} .rv .cor{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a170d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}


/* ---- font sizes matched to GST 103 ---- */
#app{max-width:560px}
h1.brand{font-size:34px;letter-spacing:4px}
.sub{font-size:15px;line-height:1.5;letter-spacing:2px}
.panel h2{font-size:23px;letter-spacing:1px}
.run{font-size:18px}
.run .n{font-size:25px}
.btn{font-size:21px;padding:17px}
.btn.ghost{font-size:17px}
.top{font-size:14px}.top .sc{font-size:14px}
.chtag{font-size:12.5px;letter-spacing:1.5px}
.q{font-size:19px;line-height:1.5}
.opt{font-size:17px;line-height:1.4;padding:14px}
.opt .l{width:28px;height:28px;font-size:14px}
.fb{font-size:16px;line-height:1.55}
.fb .hk{font-size:15px}
.fb .trap{font-size:12px}
.nav button{font-size:17px}
.chap .nm{font-size:16.5px}.chap .ct{font-size:14px}
.chaps .tools button{font-size:15px}
.sec{font-size:14px}
details.cres>summary{font-size:16px}
.cres .sr,.revise .sr{font-size:15px}
.msg{font-size:17px;line-height:1.5}
.rv{font-size:16px;line-height:1.5}
.stats{font-size:16px}
.ov h3{font-size:19px}.leg{font-size:14px}.map button{font-size:15px;height:42px}
.toast{font-size:15px}
.pass{color:var(--ok)}.fail{color:var(--bad)}.na{color:var(--mute)}
/* figures: full image, natural aspect ratio, never cropped */
.fig{margin:0 -8px 14px;background:#fff7f0;border:1px solid var(--line);border-radius:12px;padding:4px}
.fig img{display:block;width:100%;height:auto;object-fit:contain;cursor:zoom-in}
.fig figcaption{font-size:13.5px;color:#5b3a22;text-align:center;padding:6px 4px 2px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;flex-direction:column;z-index:70}
.lb.show{display:flex}
.lbtop{display:flex;gap:10px;padding:10px;justify-content:flex-end}
.lbhint{flex:1;align-self:center;color:#cdb9aa;font-size:14px}
.lbtop button{background:#150c08;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer}
.lbscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;padding:8px}
.lbscroll img{width:100%;height:auto;max-width:none;flex:none;margin:auto;background:#fff7f0;border-radius:8px}
</style>
</head>
<body>
<div id="app">
  <h1 class="brand">INDIGENE</h1>
  <p class="sub" id="subtitle">CSC 101 CBT</p>

  <!-- SETUP -->
  <div class="panel" id="setup">
    <h2>Choose Your Run</h2>
    <div class="grid" id="runs"></div>
    <div class="chaps" id="chaps">
      <div id="chapList"></div>
    </div>
    <button class="btn" id="startBtn">START QUIZ</button>
  </div>

  <!-- QUIZ -->
  <div class="panel hidden" id="quiz">
    <div class="top"><span id="qpos">Q 1 / 1</span><span class="sc">✔ <b class="g" id="sOk">0</b> &nbsp; ✖ <b class="r" id="sNo">0</b></span></div>
    <div class="bar"><i id="bar"></i></div>
    <span class="chtag" id="chtag"></span>
    <p class="q" id="qtext"></p>
    <div id="qimg"></div>
    <div id="opts"></div>
    <div id="fb"></div>
    <div class="nav">
      <button id="prev">◀ Prev</button>
      <button id="mapBtn">Map</button>
      <button id="next" class="primary">Next ▶</button>
    </div>
    <button class="btn ghost" id="finishBtn" style="margin-top:12px;padding:12px">Finish &amp; see score</button>
  </div>

  <!-- RESULT -->
  <div class="panel hidden" id="result"></div>
</div>

<div class="ov" id="ov"><div class="box">
  <h3>Question Map</h3>
  <div class="leg"><span>🟩 correct</span><span>🟥 wrong</span><span>⬛ not answered</span></div>
  <div class="map" id="map"></div>
  <button class="btn ghost" id="closeMap" style="margin-top:14px;padding:12px">Close</button>
</div></div>
<div class="ov" id="cov"><div class="box">
  <h3>Finish quiz?</h3>
  <p id="cmsg" style="margin:0 0 6px"></p>
  <button class="btn" id="cYes" style="padding:13px">Finish now</button>
  <button class="btn ghost" id="cNo" style="padding:13px">Go back</button>
</div></div>
<div class="lb" id="lb"><div class="lbtop"><span class="lbhint">Tap Zoom + then drag to move around</span><button id="lbZ">Zoom +</button><button id="lbX">Close</button></div><div class="lbscroll" id="lbScroll"><img id="lbImg" alt=""></div></div>
<div class="toast" id="toast"></div>

<script>
const DATA = [{"t":"Generations of Computers","s":["Overview","1st Generation (1940–1956)","2nd Generation (1956–1963)","3rd Generation (1964–1971)","4th Generation (1971–present)","5th Generation"],"q":[["How many generations of computers are there currently?",["Three","Five","Four","Six"],1,"The book says there are currently five generations of computers.","Five generations, five letters in VTIMA.",0,0],["Computer generations are classified by technology used, computing speed, physical appearance and what else?",["Number of users","Applications","Country of origin","Brand name"],1,"The four bases are technology used, computing speed, physical appearance and applications.","Tech, speed, looks, uses.",0,0],["Each new generation of computers is generally...",["Smaller, faster and cheaper","Smaller, slower and cheaper","Bigger, slower and cheaper","Bigger, faster and dearer"],0,"Each generation is defined by a new technology that gives better, cheaper, smaller, faster and more efficient computers.","New generation = smaller, faster, cheaper.",0,0],["What is the memory aid for the technology of the five generations?",["VIMTA","VTMIA","VTIMA","TVIMA"],2,"VTIMA stands for Vacuum, Transistor, IC, Microprocessor, AI, in that order.","Say it like a word: V-TIM-A.",0,0],["Integrated circuits belong to which generation?",["3rd","2nd","5th","4th"],0,"The integrated circuit is the hallmark technology of the 3rd generation.","IC = 3. Microprocessor = 4.",1,0],["Transistors belong to which generation?",["4th","3rd","2nd","1st"],2,"Transistors replaced vacuum tubes in the 2nd generation.","Transistor = Two.",0,0],["Which technology defines the 4th generation?",["Transistor","Integrated circuit","Vacuum tube","Microprocessor"],3,"The microprocessor brought the fourth generation.","4th = everything on one chip.",0,0],["Artificial Intelligence is the base of which generation?",["5th","2nd","4th","3rd"],0,"The 5th generation is based on Artificial Intelligence.","AI is the last letter of VTIMA, so the last generation.",0,0],["Which years does the 1st generation cover?",["1940–1956","1971–present","1964–1971","1956–1963"],0,"The 1st generation runs from 1940 to 1956.","1st gen starts at 1940, the earliest date in the table.",0,0],["Which years does the 2nd generation cover?",["1964–1971","1956–1963","1971–present","1940–1956"],1,"The 2nd generation runs from 1956 to 1963. It starts where the 1st one ends.","1956 closes gen 1 and opens gen 2.",0,0],["Which years does the 3rd generation cover?",["1956–1963","1964–1971","1971–present","1940–1956"],1,"The 3rd generation runs from 1964 to 1971.","Ends in 1971, the year the 4th begins.",0,0],["The 1st generation used what for its circuitry?",["Transistors","Vacuum tubes","Integrated circuits","Microprocessors"],1,"1st generation computers used vacuum tubes for circuitry.","1st gen = V of VTIMA.",0,1],["The 1st generation used what for memory?",["Floppy disks","Silicon chips","Magnetic tapes","Magnetic drums"],3,"Vacuum tubes were used for circuitry and magnetic drums for memory.","Vacuum tubes + drums.",0,1],["Which language did 1st generation computers rely on?",["Symbolic language","COBOL","FORTRAN","Machine language"],3,"They relied on machine language, the lowest-level and hardest language, pure binary.","1st gen = binary only.",0,1],["Name a pair of first-generation computers.",["UNIVAC and ENIAC","Intel 4004 and ENIAC","UNIVAC and FORTRAN","COBOL and FORTRAN"],0,"UNIVAC and ENIAC are the examples of the 1st generation in the book.","UNIVAC and ENIAC were room-sized.",0,1],["Which is a disadvantage of vacuum tubes?",["They were very small","They were easy to program","They used very little power","They burned out often"],3,"Vacuum tubes burned out frequently, gave off a lot of heat and needed constant maintenance.","Tubes = hot and burn out.",0,1],["Which is an advantage listed for the 1st generation?",["Cheap to run","Small size","Very reliable","First device to hold memory"],3,"The book lists two advantages: the only electronic device of its kind at the time, and the first device to hold memory.","1st gen = first to hold memory.",0,1],["First generation computers were often...",["Enormous, taking up entire rooms","Pocket-sized","Desk-sized","Hand-held"],0,"They were enormous and could fill whole rooms.","1st gen = the biggest.",0,1],["In VUM, what does the U stand for?",["Uses no power","Uses a lot of power","Universal language","Unlimited memory"],1,"VUM means Vacuum tubes, Uses a lot of power, Machine language.","VUM: Vacuum, Use power, Machine.",0,1],["A computer that fills a room and needs vacuum tubes belongs to which generation?",["3rd","2nd","4th","1st"],3,"Anything that fits in a room and needs vacuum tubes is 1st generation.","Room + tubes = 1st gen.",1,1],["What replaced vacuum tubes in the 2nd generation?",["Microprocessors","Integrated circuits","Transistors","Magnetic drums"],2,"Transistors replaced vacuum tubes. This was the defining change.","Transistor = Tiny replacement for the tube.",0,2],["In the 2nd generation, computers moved from binary machine language to what?",["Pseudo-code","Assembly drawings","Natural language","Symbolic language"],3,"They moved from cryptic binary machine language to symbolic language.","2nd gen = Symbolic.",0,2],["Name two early high-level languages of the 2nd generation.",["C and Java","HTML and HTTP","COBOL and FORTRAN","UNIVAC and ENIAC"],2,"Early COBOL and FORTRAN came with the 2nd generation.","Two letters-words: COBOL and FORTRAN.",0,2],["Which generation first stored instructions in the computer's own memory?",["4th generation","3rd generation","1st generation","2nd generation"],3,"The 2nd generation computers were the first to store their instructions in their own memory. Many students wrongly pick the 1st.","Stored instructions = 2nd, not 1st.",1,2],["Which is an advantage of the 2nd generation over the 1st?",["No maintenance at all","Much more reliable","Used punched cards only","No heat at all"],1,"The 2nd generation was smaller, faster and much more reliable.","2nd gen = smaller, faster, more reliable.",0,2],["Which is a disadvantage of the 2nd generation?",["Still overheated quickly","Ran only machine language","Could not store instructions","Needed vacuum tubes"],0,"Transistor computers still overheated quickly and had maintenance problems.","Still hot, still needs repair.",0,2],["Which generation is the one with the FIRSTS: symbolic language, high-level languages and stored instructions?",["1st","3rd","2nd","5th"],2,"Transistor computers brought the first symbolic language, the first high-level languages and the first stored-instruction memory.","Firsts belong to gen 2.",0,2],["What is the hallmark technology of the 3rd generation?",["Microprocessor","Vacuum tube","Integrated circuit","Transistor alone"],2,"The integrated circuit (IC) was the hallmark of the 3rd generation.","3rd = IC.",0,3],["Transistors placed on silicon chips are called...",["Vacuum tubes","Semiconductors","Microprocessors","Superconductors"],1,"Miniaturised transistors on silicon chips are called semiconductors.","Semi = silicon chip.",0,3],["In the 3rd generation, users interacted with computers through...",["Punched cards and printouts","Voice and touch","Keyboards and monitors","Mouse and GUI only"],2,"Instead of punched cards and printouts, users used keyboards and monitors with an operating system.","3rd gen = the keyboard generation.",0,3],["What did the operating system allow in the 3rd generation?",["Many applications at one time","Learning and self-organisation","Voice recognition","Only one program at a time"],0,"The device could run many applications at one time, which is where multi-tasking begins.","OS = many programs together.",0,3],["Which is an advantage of integrated circuits?",["Very small in size","Slower performance","Very costly to produce","Very large in size"],0,"ICs are very small, improved performance and cheaper to produce.","IC = small, quick, cheap.",0,3],["Which is a disadvantage of integrated circuits?",["Complex to manufacture and repair","Cannot run many programs","Too big","Burn out like tubes"],0,"The book says ICs are sophisticated to manufacture or repair.","IC is clever, so hard to fix.",0,3],["An IC is...",["A magnetic drum","Transistors on one chip doing one function","The whole CPU on one chip","A type of vacuum tube"],1,"An IC is transistors on one chip performing one function. A microprocessor puts the entire CPU on one chip.","IC = one function. Microprocessor = whole CPU.",1,3],["What brought the 4th generation?",["The transistor","The integrated circuit","Artificial intelligence","The microprocessor"],3,"The microprocessor brought the fourth generation.","4th = Microprocessor.",0,4],["The microprocessor put thousands of integrated circuits onto...",["A punched card","A vacuum tube","A magnetic drum","A single silicon chip"],3,"Thousands of ICs were built onto a single silicon chip.","Thousands of ICs, one chip.",0,4],["Which 1971 chip located all components of the computer on one chip?",["UNIVAC","Intel 8086","Intel 4004","ENIAC"],2,"The Intel 4004 (1971) put the CPU, memory and input/output controls on one chip.","Learn it as a pair: Intel 4004 and 1971.",0,4],["In what year was the Intel 4004 chip made?",["1964","1963","1971","1956"],2,"The Intel 4004 chip is dated 1971, the year the 4th generation starts.","4004 goes with 1971.",0,4],["Which developments belong to the 4th generation?",["Punched cards and drums","Vacuum tubes and COBOL","GUIs, the mouse and handheld devices","Parallel processing only"],2,"The 4th generation saw GUIs, the mouse and handheld devices.","4th gen = point and click.",0,4],["Which statement is correct?",["Every IC is a microprocessor","Every microprocessor contains ICs","A microprocessor is a 3rd generation part","ICs and microprocessors are the same"],1,"Every microprocessor contains ICs, but not every IC is a microprocessor.","Microprocessor holds ICs, not the other way.",1,4],["What does GUI stand for?",["Graphical User Interface","Graphic Unit Input","General User Index","Grand Universal Interface"],0,"GUI means Graphical User Interface. It arrived with the 4th generation.","G-U-I: Graphical User Interface.",0,4],["The 5th generation is based on...",["Integrated circuits","The internet","Smartphones","Artificial Intelligence"],3,"The 5th generation is based on artificial intelligence, not on any gadget or the internet.","5th = AI, not smartphones.",1,5],["Which application of 5th generation computing already exists?",["Punched cards","Voice recognition","Vacuum tubes","Machine language"],1,"Voice recognition is one of the existing AI applications named in the book.","Talk to it: voice recognition.",0,5],["Which two technologies are used to make 5th generation AI real?",["Transistors and COBOL","Vacuum tubes and drums","Parallel processing and superconductors","Keyboards and monitors"],2,"The 5th generation uses parallel processing and superconductors.","Parallel + super.",0,5],["The goal of 5th generation computers is devices that respond to...",["Punched cards","Binary code only","Natural language input","Mouse clicks only"],2,"The goal is devices that respond to natural language input and are capable of learning and self-organisation.","5th gen = the thinking generation.",0,5],["Which pair is part of the goal of 5th generation computing?",["Learning and self-organisation","Typing and clicking","Heating and cooling","Printing and scanning"],0,"The goal includes natural language, learning and self-organisation.","Learn and organise itself.",0,5],["The 5th generation is said to be...",["Based on vacuum tubes","Still in development","Replaced by the 4th","Finished and obsolete"],1,"It is still in development, though some applications such as voice recognition exist.","Present and beyond = not finished.",0,5]]},{"t":"Computer Networks","s":["3.1 What Is a Network?","3.2 Medium and Functional Types","3.2.3 Topology","3.2.4 PAN, LAN, CAN, MAN, WAN","3.3 Internetwork","3.3.3 Internet and WWW","3.4 Networking Hardware"],"q":[["A computer network is a group of...",["Printers only","Interconnected computers","Standalone, unconnected computers","Software programs"],1,"A computer network is a group of interconnected computers that primarily share resources.","Network = connected computers.",0,0],["What is the minimum number of workstations for a network?",["Two","Three","Four","One"],0,"A network needs at least two computer devices, called workstations.","2 + Link + Share.",0,0],["The computer devices in a network are called...",["Protocols","Terminals only","Workstations","Routers"],2,"The book calls the devices on a network workstations. Each is a microcomputer or a supercomputer.","At least two workstations.",0,0],["Resources shared on a network fall into which two folds?",["Wired and wireless","Servers and clients","Software and hardware","Data and voice signals"],2,"Shared resources are software (application and system) and hardware (printers, scanners, peripherals).","Soft + Hard.",0,0],["A shared printer on a network is which kind of resource?",["Protocol","Hardware","Software","Medium"],1,"Printers, scanners and other peripherals are hardware resources.","You can touch it, so hardware.",0,0],["A network needs a medium of communication. It can be...",["Wireless only","Printed or written","Wired only","Wired or wireless"],3,"The physical connection can be wired or wireless.","Medium = wired or wireless.",0,0],["Which is NOT a parameter for classifying networks?",["Transmission medium","Topology","Geographical scalability","Cost of equipment"],3,"The four parameters are transmission medium, functional relationship, topology and geographical scalability.","M-F-T-G, no money in it.",0,1],["In M-F-T-G, what does F stand for?",["Frequency","Firewall","Functional relationship","Fibre"],2,"M-F-T-G is Medium, Functional, Topology, Geographical.","F = how the elements relate.",0,1],["Networks classified by transmission medium are...",["LAN and WAN","Client-server and peer-to-peer","Wired and wireless","Bus and star"],2,"By transmission medium, networks are either wired or wireless.","Medium = wired / wireless.",0,1],["Networks classified by functional relationship are...",["Client-server and peer-to-peer","Bus, star and ring","PAN, LAN, CAN, MAN and WAN types","Wired and wireless"],0,"Functional relationship (architecture) gives client-server and peer-to-peer.","Functional = Client-Server / P2P.",0,1],["Which are the wired media named in the notes?",["X-rays and gamma rays","Radio and satellite links","Optical fibre and Ethernet","Infrared and Bluetooth links"],2,"Wired media include optical fibre and Ethernet (twisted pair and coaxial cables).","Wire = fibre + Ethernet.",0,1],["Wireless networks connect devices using...",["Twisted pair cables","Optical fibre","Electromagnetic waves","Coaxial cables"],2,"Wireless networks use electromagnetic waves such as radio, satellite, visible light, infrared, X-rays and gamma rays.","No cable = waves.",0,1],["Which one is a wireless medium in the notes?",["Twisted pair","Optical fibre","Coaxial cable","Satellite"],3,"Radio, satellite, visible light, infrared, X-rays and gamma rays are wireless media.","Sky = wireless.",0,1],["Wired networks are often deployed with...",["Printers, scanners and fax machines only","Bluetooth and infrared only","Satellites and radio masts only","Hubs, switches, bridges and routers"],3,"Wired networks are often set up with hubs, switches, bridges and routers.","Wired uses the four network boxes.",0,1],["In the client-server model, the server is...",["A co-equal peer","Centralised","Decentralised","Not needed"],1,"The server is a centralised system connecting several clients.","Client-Server = Central boss.",0,1],["In a client-server network, what happens when more clients connect at the same time?",["Nothing changes","The server needs fewer resources","The server needs more resources","The clients need more resources"],2,"The more simultaneous clients, the more resources the server needs.","More clients, bigger server load.",0,1],["Peer-to-peer networks are...",["Hierarchical","Centralised","Decentralised","Controlled by one server"],2,"In peer-to-peer, computers pool resources in a decentralised system.","P2P = Pals with equal power.",0,1],["In a peer-to-peer network, the peers are...",["Hubs and routers","Bosses and workers","Co-equal nodes","Servers and clients"],2,"Peers are co-equal nodes in a non-hierarchical network.","Peer = equal.",0,1],["Network topology is the study of...",["The speed of the internet","The arrangement of links and nodes","The price of cables","The size of a country"],1,"Topology is the study of the arrangement or mapping of the links and nodes of a network.","Topology = layout.",0,2],["What are the three basic topologies in the notes?",["Bus, Ring, Hybrid","Star, Tree, Ring","Bus, Mesh, Tree","Bus, Star, Ring"],3,"The basic types are Bus, Star and Ring.","BSR.",0,2],["In a bus network, local computers share...",["One single bus","A closed loop","A central server","A token only"],0,"Bus computers share one single bus, a linear coaxial cable, into which devices tap.","BUS = one Backbone cable.",0,2],["A bus workstation connects to the cable through a...",["Router","Server","Tap","Token"],2,"Devices tap into the bus cable.","Tap into the bus.",0,2],["A bus tap is...",["A signal booster","Passive","Active","Powered by electricity"],1,"A tap is passive. It does not alter the signal and needs no electricity.","Tap = passive, no power.",1,2],["What lets a workstation on a bus send and receive?",["The server","Its NIC","The tap","A token"],1,"The workstation end has a NIC. The tap itself is passive.","NIC sends and receives.",1,2],["When one device transmits on a bus, what happens?",["All the others receive","No device receives","Only the server receives","Only the next device receives"],0,"On a bus, when one device transmits, all others receive.","Bus = everyone hears.",0,2],["In a star network, end-user computers are tied to...",["A central computer (server)","A single shared cable","Each other in one long straight line","A closed loop of tokens"],0,"Star computers are tied to a central server which controls transmissions of all other workstations.","STAR = Server at the centre.",0,2],["In a star topology, everything passes through...",["The tap","The last workstation","The token","The centre"],3,"Everything passes through the centre in a star network.","Star = through the middle.",0,2],["Ring computers are tied in a...",["Closed loop","Single tap","Straight line","Central hub only"],0,"Ring computers are tied in a closed loop and transmit on an equal basis using tokens.","RING = Rotating token.",0,2],["A ring network supports how many channels and in which direction?",["One channel, one direction","Many channels, one direction","Two channels, both directions","One channel, both directions"],0,"A ring supports only one channel of information, flowing in one direction.","Ring = one way.",0,2],["In a ring, who removes data that has circled round?",["The tap","The server","The original transmitting workstation","The receiving workstation"],2,"Data that has circled must be removed, otherwise it keeps circling. The original sender removes it, not the receiver.","Sender cleans up.",1,2],["In the figure, which topology is shown with the note \"one shared cable\"?",["Bus","Ring","Mesh","Star"],0,"Looking at the figure, the bus is the one with a single shared cable and devices hanging off it.","One cable line = bus.",0,2,"B1"],["In the figure, which topology has a SERVER box in the middle?",["Star","Bus","Tree","Ring"],0,"The star topology has a central server with every workstation joined to it.","Server in the centre = star.",0,2,"B1"],["In the figure, which topology shows arrows going one way round a loop (token passing)?",["Mesh","Star","Ring","Bus"],2,"The ring shows arrows in one direction around a closed loop.","Arrows in a loop = ring.",0,2,"B1"],["Which devices does a PAN connect?",["Servers in a campus","Devices in a whole city","Computers across many countries","Devices close to one person"],3,"A PAN is communication among devices close to one person, such as printers, fax machines, telephones and scanners.","PAN = Personal.",0,3],["About how far can a PAN reach?",["20–30 feet (6–9 m)","200–300 feet","2–3 feet","2–3 km"],0,"A PAN reaches about 20 to 30 feet, which is 6 to 9 metres.","Pan reaches 6–9 m.",0,3],["A wired PAN can use which buses?",["Ethernet and CAT 5","USB and FireWire","Bluetooth and infrared","802.11b and 802.11g"],1,"Wired PANs use buses like USB and FireWire.","USB + FireWire.",0,3],["The wireless version of a PAN (WPAN) uses...",["Leased telephone lines","CAT 5 and CAT 6","USB and FireWire","Infrared and Bluetooth"],3,"A WPAN works through infrared and Bluetooth.","Wireless PAN = Bluetooth.",0,3],["A LAN interconnects devices in...",["A whole country or region","A small area, home or office","A single city only","An entire city and its suburbs"],1,"A LAN joins devices in a small area (home, office, building) and broadcasts data at high transfer rates.","LAN = Local.",0,3],["LANs are typically based on...",["Ethernet","Leased lines","Infrared","Satellite"],0,"LANs are typically based on Ethernet.","LAN = Ethernet.",0,3],["A wired LAN on twisted pair CAT 5/CAT 6 runs at...",["10 Kb/s","1 Gb/s","56 kbps","1 Mb/s"],1,"Wired LAN on twisted pair CAT 5/CAT 6 runs at 1 Gb/s.","CAT 5/6 = 1 Gb/s.",0,3],["Which standards are used for wireless LANs in the notes?",["802.3 only","802.11b and 802.11g","HTTP and TCP","USB and FireWire"],1,"Wireless LANs use 802.11b and 802.11g.","Wireless = 802.11.",0,3],["Most LANs run at what speed?",["1–10 Tb/s","56 kbps only","1–2 kb/s","10–100 Mb/s"],3,"Most LANs run at 10 to 100 Mb/s, and 802.3 goes up to 10 Gb/s.","LAN = 10–100 Mb/s.",0,3],["The IEEE 802.3 standard goes up to what speed?",["100 Kb/s","1 Mb/s","56 kbps","10 Gb/s"],3,"802.3 goes up to 10 Gb/s.","802.3 = up to 10 Gb/s.",0,3],["A CAN connects...",["Two or more LANs in one contiguous area","Two continents","Two phones","Two cities"],0,"A CAN connects two or more LANs within a specific contiguous area such as a college campus, industrial complex or military base.","CAN = Campus.",1,3],["Which is an example of a CAN?",["One desk","A college campus","Two countries","A whole city"],1,"A CAN covers an area like a college campus, an industrial complex or a military base.","CAN = Campus.",0,3],["A MAN stays within...",["A continent","One metropolis, town or city","A whole country","One building only"],1,"A MAN connects two or more LANs or CANs but does not extend beyond the metropolis, town or city.","MAN = city limits.",1,3],["A WAN covers...",["One person","One room","A broad area, city to city or country to country","One campus only"],2,"A WAN covers a broad geographic area and often uses facilities from common carriers such as telephone companies.","WAN = Wide.",0,3],["Which network often uses leased telecom lines?",["PAN","LAN","WAN","WPAN"],2,"WANs often use transmission facilities from common carriers. LANs do not need leased telecom lines.","WAN leases, LAN does not.",1,3],["What is the memory phrase for PAN, LAN, CAN, MAN, WAN?",["Please Let Cats Move Away","People Love Cool Modern Websites","Pretty Little Cats Meow Wildly","Pretty Large Cats Meet Women"],2,"The book uses \"Pretty Little Cats Meow Wildly\" for smallest to biggest.","Smallest to biggest.",0,3],["In the figure, which network type has the shortest reach (about 6–9 m)?",["PAN","LAN","WAN","CAN"],0,"The figure puts PAN at the small end of the scale, at about 6 to 9 m.","Smallest end = PAN.",0,3,"B2"],["In the figure, which network type sits between LAN and MAN?",["WAN","CAN","PAN","WPAN"],1,"The scale runs PAN, LAN, CAN, MAN, WAN. CAN is in the middle.","PAN LAN CAN MAN WAN.",0,3,"B2"],["In the figure, which network type covers cities and countries?",["MAN","WAN","CAN","LAN"],1,"WAN is at the big end of the scale, covering cities and countries.","Biggest = WAN.",0,3,"B2"],["Two or more networks connected using a router make a...",["Peer group","Internetwork","Workstation","Topology"],1,"Two or more networks connected using a device such as a router form an internetwork.","Router joins networks.",0,4],["Which protocol does modern internetworking use?",["Ring Protocol","Internet Protocol","Bus Protocol","File Protocol only"],1,"Modern practice uses the Internet Protocol.","Internet joins by IP.",0,4],["What are the three variants of internetwork?",["Intranet, Extranet, Internet","Bus, Star, Ring","Intranet, Outernet, Internet","LAN, MAN, WAN"],0,"The three variants, by who administers and who participates, are intranet, extranet and internet.","IN, EX, INTER.",0,4],["An intranet is under...",["One administrative entity","Every user","Many governments","No control"],0,"An intranet is a set of interconnected networks using IP tools under one administrative entity.","INtranet = INside only.",0,4],["Who can access an intranet?",["Only clients and partners","Only the government","Anyone in the world","Only specific users"],3,"An intranet is closed to the rest of the world and only specific users can use it. It is usually a company's internal network.","Intranet = Inside users only.",0,4],["An extranet is limited to...",["One computer","The whole world","Only students","A single organisation, with limited connections to other organisations"],3,"An extranet is limited to a single organisation but has limited connections to the networks of other, usually trusted, organisations.","EXtranet = EXtra access for outsiders.",0,4],["Can an extranet be just one LAN?",["Yes, always","No, it needs at least one external connection","Yes, if it is wireless","Yes, if it has a server"],1,"An extranet cannot be a single LAN. It must have at least one connection to an external network and can be a CAN, MAN or WAN.","Extranet is never one LAN.",1,4],["Which statement about the Internet is correct?",["It is part of every intranet","It is owned by one company","It is a single LAN","It is not part of an intranet or extranet"],3,"The internet itself is not part of the intranet or extranet, though it can serve as a portal to parts of an extranet.","Internet stands apart.",1,4],["The Internet is a collection of...",["All networks","One network only","Computers in one office","Websites only"],0,"The internet is the collection of all networks (LAN, MAN, WAN and so on), thousands of networks and attached devices.","INTERnet = everyone, interconnected.",0,4],["Which large internetwork type has its own web server?",["PANs","Peer-to-peer groups","Ring networks","Large intranets"],3,"Large intranets have their own web server.","Big intranet = own web server.",0,4],["The Internet began as...",["HTTP","WWW","ARPANET","NSFNET only"],2,"The internet began as ARPANET, the Advanced Research Projects Agency NETwork.","Net started as ARPANET.",0,5],["ARPANET was developed by...",["Intel","The U.S. Post Office","The U.S. Department of Defence","A telephone company"],2,"ARPANET was developed by the U.S. Department of Defence.","Defence built it.",0,5],["ARPANET was developed in which decade?",["1960s","1990s","1980s","1940s"],0,"ARPANET came from the 1960s.","ARPANET → 1960s → 56 kbps.",0,5],["The original high-speed backbone supported what speed?",["10 Gb/s","56 Mb/s","56 kbps","100 Mb/s"],2,"The backbone supported 56 kbps and was later financed by the National Science Foundation (NSF).","56 kbps.",0,5],["Which body later financed the backbone?",["FUOYE","National Science Foundation (NSF)","Intel","Microsoft"],1,"The backbone was later financed by the National Science Foundation (NSF).","NSF funded the backbone.",0,5],["A protocol is...",["A type of cable","A set of rules for the format and transmission of data","A kind of server","A web page"],1,"A protocol is a set of rules determining the format and transmission of data.","Protocol = rules.",0,5],["What does TCP stand for?",["Terminal Connection Port","Transmission Control Protocol","Total Control Program","Transfer Cable Protocol"],1,"TCP is Transmission Control Protocol.","T-C-P as written.",0,5],["What does DHCP stand for?",["Digital Host Control Port","Dynamic Host Configuration Protocol","Direct Hardware Connection Protocol","Domain Host Control Page"],1,"DHCP is Dynamic Host Configuration Protocol.","D = Dynamic.",0,5],["Which protocol is used by service providers to exchange reachability of address ranges?",["ARP","DHCP","NAT","BGP"],3,"Service providers and large enterprises use BGP (Border Gateway Protocol).","B = Border gateway.",0,5],["The World Wide Web is...",["A kind of router","Another name for the Internet","A type of cable","A collection of documents on web servers"],3,"The WWW is a vast collection of electronic documents on web servers, accessed in a browser.","WWW = the shops on the road.",1,5],["Web pages are created with...",["TCP","BGP","HTTP","HTML"],3,"Web pages are made with HTML, HyperText Markup Language.","HTML builds the page.",0,5],["Which protocol delivers web page requests from browsers to a web server?",["HTML","ARP","NAT","HTTP"],3,"The web server software accepts HTTP requests from browsers, retrieves the page and returns it.","HTTP delivers.",0,5],["Which statement is correct?",["The WWW is one service that runs on the Internet","The Internet is a service on the WWW","The two are the same thing","The WWW is a hardware device"],0,"The internet is the collection of networks. The WWW is one service that runs on it.","Internet = roads, WWW = shops.",1,5],["What does a NIC provide?",["Web page storage","Virus protection","Routing between networks","Physical access to a networking medium"],3,"A Network Interface Card lets a computer communicate over a network and gives physical access to the medium.","NIC = the computer's door.",0,6],["A NIC gives low-level addressing through...",["Tokens","Router tables","MAC addresses","HTML tags"],2,"A NIC gives low-level addressing through MAC (Media Access Control) addresses.","NIC has a MAC name tag.",0,6],["What does MAC stand for in a MAC address?",["Main Access Circuit","Memory Address Card","Machine Address Code","Media Access Control"],3,"MAC is Media Access Control.","M = Media.",0,6],["A bridge connects multiple network...",["Segments","Viruses","Countries","Programs"],0,"A bridge connects multiple network segments to make an aggregate network. Routing is a different job.","Bridge = segments.",1,6],["How many types of bridge does the book list?",["3","2","4","5"],2,"The four are simple, multiport, learning/transparent and source route.","Four bridge types.",0,6],["What does a hub do with a packet arriving at one port?",["Copies it to all ports","Sends it to one port only","Drops it","Sends it to the router"],0,"A hub copies the packet to all ports. It is rudimentary.","Hub = Shouts to everyone.",1,6],["Which device forwards data only to the ports involved, using MAC addresses?",["Bridge","Hub","Switch","NIC"],2,"A switch forwards and filters data using MAC addresses and sends only to the ports involved.","Switch = Whispers.",1,6],["Which device forwards packets between networks using headers and forwarding tables?",["Switch","Router","Hub","NIC"],1,"A router forwards data packets between networks, using headers and forwarding tables to find the best path.","Router = Road map.",0,6],["A router is connected to at least...",["Two networks","Three printers","Four hubs","One computer"],0,"A router is connected to at least two networks, such as two LANs or WANs, or a LAN and its ISP's network.","Router = at least two networks.",0,6],["Which device finds the best path between networks?",["Bridge","NIC","Hub","Router"],3,"The router uses forwarding tables to find the best path.","Best path = router.",0,6],["A port is...",["A password","A type of virus","The circuit that links one device with another","A web page"],2,"A port is the circuit (hardware and circuitry) that links one device with another.","Port = link point.",1,6],["Which device connects segments rather than networks?",["Bridge","Firewall","Router","ISP"],0,"Bridge connects segments. Router connects networks.","Bridge = segments. Router = networks.",1,6]]},{"t":"Network Security & Malware","s":["3.5 Network Security","CIA and AAN","3.6 Viruses and Malware","3.7 Firewall and Antivirus"],"q":[["Network security is the protection of...",["Computing systems and their data","Only the room the server sits in","Only the printers and scanners","Only the network cables and wiring"],0,"Simply put, security is the protection of computing systems and the data they store or access.","Protect systems and data.",0,0],["Security protects information and property from theft, corruption or...",["Legal contracts","Natural disaster","Good passwords","Software updates"],1,"The objective is to protect against theft, corruption or natural disaster while keeping it accessible and productive for intended users.","Theft, corruption, disaster.",0,0],["Who needs high maintenance and advanced security against hackers?",["School children","Small home offices","Single users","Large businesses"],3,"Small home or office networks need basic security. Large businesses need high maintenance and advanced software and hardware.","Big business = big security.",0,0],["One-factor authentication uses something you...",["Are","Wear","Have","Know"],3,"One-factor uses something you know, such as a username and password.","1 = Know.",0,0],["Which is an example of one-factor authentication?",["Username and password","A retinal scan at the door","A fingerprint on a scanner","A security token (dongle)"],0,"A username and password is something you know.","Password = Know.",0,0],["Two-factor authentication adds something you...",["Know","Have","Are","Forget"],1,"Two-factor adds something you have, such as a security token, ATM card or mobile phone.","2 = + Have.",0,0],["Which is an example of something you HAVE?",["A retinal scan","A fingerprint on a scanner","Security token","A password you type"],2,"A security token (dongle), ATM card or mobile phone is something you have.","Have = hold it in hand.",0,0],["Three-factor authentication adds something...",["You have","You type","On your body","You know"],2,"Three-factor uses something on your body, such as a fingerprint or retinal scan.","3 = + Are (body).",0,0],["Which is an example of three-factor authentication?",["Username","Mobile phone","Retinal scan","ATM card"],2,"Fingerprints and retinal scans are something on your body.","Body = fingerprint, retina.",0,0],["What is the memory line for the three authentication levels?",["Read, Write, Run","See, Hear, Touch","Know, Have, Body","Type, Click, Log"],2,"1 = Know, 2 = Have, 3 = Body.","Know, Have, Body.",0,0],["CIA in security stands for...",["Confidentiality, Integrity, Availability","Confidentiality, Identity, Authority","Control, Identity, Access","Copy, Integrity, Audit"],0,"CIA protects the information: Confidentiality, Integrity, Availability.","CIA = data.",0,1],["AAN in security stands for...",["Authority, Availability, Name","Access, Audit, Network","Authentication, Availability, Non-repudiation","Authentication, Authorization, Non-repudiation"],3,"AAN concerns the people who use the information.","AAN = people.",0,1],["Which group does CIA protect?",["The routers and hubs","The network cables","Information","The people using it"],2,"CIA is about the information. AAN is about the people.","CIA for data, AAN for people.",0,1],["Confidentiality means...",["Information is always online","Only authorised people can read or copy information","Users cannot deny actions","Information never changes"],1,"Confidentiality means only authorised people read or copy information.","C = Can only be read by the right people.",0,1],["Loss of confidentiality means information was...",["Read or copied without permission","Made available to every user online","Deleted by the owner by mistake","Changed by someone without permission"],0,"Loss of confidentiality is someone not authorised reading or copying the information.","Confidentiality failure = READ.",1,1],["Loss of integrity means information was...",["Changed in unauthorised ways","Printed out by the owner","Read by someone not authorised","Copied by a stranger and kept"],0,"Loss of integrity is unauthorised changes, by human error or deliberate tampering.","Integrity failure = CHANGED.",1,1],["Integrity is especially crucial for...",["Electronic funds transfers","Public notice board posters","Game scores and rankings","Wallpapers and screensavers"],0,"Integrity is crucial for electronic funds transfers, air traffic control and financial accounting.","Money and flights must stay correct.",0,1],["Confidentiality is especially crucial for...",["Weather reports","Public news","Medical and insurance records","Game scores"],2,"It is crucial for research data, medical and insurance records, new product specs and investment strategies.","Private records need secrecy.",0,1],["Availability means information...",["Is encrypted so nobody can open it","Stays accessible to intended users","Is read-only for every user","Is hidden from everyone except admins"],1,"Availability means information stays accessible to intended users.","A = Able to get it.",0,1],["Authentication means...",["A user cannot deny an action","Hiding data","Proving who the user is","Deciding what a user may do"],2,"Authentication proves who the user is.","Authentication = identity.",0,1],["Authorization means...",["Proving who the user is","What the user is allowed to do","Keeping data available","A user cannot deny an action"],1,"Authorization defines what that user is allowed to do.","Authorization = permission.",0,1],["Non-repudiation means...",["Data stays secret","A user can change any record freely","A user proves identity","A user cannot deny what they did"],3,"Non-repudiation means the user cannot deny an action they performed.","Cannot say 'I didn't do it'.",0,1],["Malware is the general name for...",["Only viruses and worms","Useful but slow software","All harmful programs","Only spyware and adware"],2,"Malware is the general name for all programs harmful to a computer system.","Mal = bad.",0,2],["Which of these is malware?",["A browser","Spyware","A firewall","An antivirus"],1,"Malware includes viruses, Trojans, worms and spyware.","Spyware is bad software.",0,2],["A virus is a program that...",["Only watches your browsing habits and ads","Never copies itself","Only hides in games","Attaches to a program and copies itself"],3,"A virus attaches to, overwrites or replaces another program to reproduce itself without the user's knowledge.","Virus = Very good at copying.",0,2],["A virus must be ___ to operate.",["Renamed first","Executed","Printed out","Deleted first"],1,"A virus must be executed to operate.","No run, no virus.",0,2],["Which malware is the only kind that copies itself?",["Trojan horse","Logic bomb","Spyware","Virus"],3,"Only viruses reproduce. Trojans, logic bombs and spyware do not.","Can it reproduce? Only a virus.",1,2],["A Trojan horse is...",["A hardware device","Destructive code disguised in a harmless program","A program that always copies itself onto new files","A program that only tracks ads"],1,"A Trojan is disguised inside an innocent-looking program such as a game.","Trojan = Trick.",0,2],["A Trojan horse is named after...",["A king of Troy","A Roman road","A Greek goddess","The Greek wooden horse at Troy"],3,"It is named after the Greek wooden horse at Troy (Odysseus).","Wooden horse at Troy.",0,2],["Is a Trojan horse a virus?",["No, it does not reproduce","Yes, it copies itself to files","It is a hardware device","Yes, it is a worm in disguise"],0,"A Trojan is NOT a virus because it does not reproduce.","No copy, no virus.",1,2],["A logic bomb is like a Trojan but with...",["A hardware fault","A timing device","A firewall","A copy command"],1,"A logic bomb goes off at a particular date or time, or on a trigger.","Logic bomb = Later (timer).",0,2],["Which virus is given as an example of a logic bomb?",["UNIVAC","ENIAC","Michelangelo","Intel 4004"],2,"The book gives Michelangelo as the example.","Logic bomb, Michelangelo.",0,2],["Logic bombs are favoured by...",["Brand new students","Disgruntled ex-employees","Antivirus software vendors","Firewall manufacturers"],1,"The book says logic bombs are favoured by disgruntled ex-employees.","Angry ex-staff.",0,2],["Spyware is mostly...",["A hardware part","Not meant to damage the computer","A type of virus","Designed to erase files on the disk quickly"],1,"Spyware is usually not designed to damage the computer. It tracks internet habits and shows unwanted offers.","Spyware = Snooper.",0,2],["Spyware tracks your...",["Screen size","Printer colour","Internet habits","Keyboard brand"],2,"Spyware attaches to the OS in nefarious ways, tracking internet habits and showing unwanted sales offers.","Spy on browsing.",0,2],["Roughly what share of PCs is estimated to be infected with spyware?",["80% or more","About 20% of PCs","About 10% of PCs","About 40% of PCs"],0,"The notes estimate 80% or more of PCs are infected.","Four out of five.",0,2],["Is spyware a virus?",["Only on LANs","No, it does not replicate","Yes, always","Yes, it copies itself"],1,"Spyware is not a virus because it does not replicate.","Spyware is NOT a virus.",1,2],["Which malware spreads usually over network connections?",["Worm","Spyware","Trojan horse","Logic bomb"],0,"A worm is a program that spreads usually over network connections.","Worm = Wires.",0,2],["Worms are mostly found in...",["Calculators","Multi-user systems","One-person computers","Printers"],1,"Worms are mostly found in multi-user systems, not normally on one-person computers.","Worms like many users.",0,2],["Which memory line is right for the malware types?",["Virus = Very good at copying","Spyware = Spreads by wire and cable","Virus = Very hard to see on screen","Trojan = Tracks your habits online"],0,"Virus = Very good at copying. Trojan = Trick. Logic bomb = Later. Spyware = Snooper. Worm = Wires.","V, T, L, S, W.",0,2],["A firewall...",["Blocks unauthorised access to a network","Removes viruses by checking their signatures","Finds the best path between networks","Copies every packet to all the ports"],0,"A firewall restricts access between a protected network and the Internet or other networks.","Firewall = the wall.",1,3],["Firewalls come in which varieties?",["Hardware and software","Wired and wireless","Client and server","Paid and free only"],0,"A firewall can be hardware or software.","Hard + soft.",0,3],["A firewall protects against...",["Power cuts and voltage surges","Hard disk wear and tear over years","Offensive websites and hackers","Screen damage"],2,"A firewall protects against offensive websites and potential hackers.","Wall keeps hackers out.",0,3],["The firewall in the figure sits between...",["Internet and protected network","Two printers in the same office room","A keyboard and a monitor","Two hubs inside one office"],0,"The figure shows the firewall standing between the Internet and the protected or home network.","Firewall stands in the middle.",0,3,"C1"],["In the figure, the computers behind the firewall are called the...",["Extranet","Internet","Backbone","Protected / home network"],3,"The box behind the firewall is labelled the protected or home network.","Behind the wall = protected.",0,3,"C1"],["An antivirus must be...",["Used only on servers","Installed once only","Installed, active and updated","Switched off while you are online"],2,"Antivirus must be installed, running actively and updated.","Antivirus = Update it.",0,3],["New viruses are found...",["Never","Once a year","Once a decade","Almost daily"],3,"New viruses are found almost every day, so antivirus must be updated.","Daily threats, regular updates.",0,3],["Antivirus not updated for a month or more is equal to...",["A backup","No antivirus","A faster antivirus","A firewall"],1,"Software not updated for a month or more is equivalent to no antivirus.","A month old = useless.",1,3],["How does antivirus identify a known threat?",["By the MAC address","By the user's password","By a signature (footprint)","By the computer's colour"],2,"Vendors analyse new threats and create a signature (footprint) which is shipped in update files.","Antivirus = vaccine with signatures.",0,3],["Most vendors update virus definitions at least...",["Every ten years","Monthly","Yearly","Weekly"],3,"Most vendors update their virus definitions at least weekly.","Weekly updates.",0,3],["Which is a free antivirus option named in the notes?",["Avira","McAfee ViruScan","Sophos","Norton Antivirus"],0,"The free options named are Avira, Antivir and AVG.","Free: Avira, Antivir, AVG.",0,3],["Which is a paid antivirus product named in the notes?",["AVG","Avira","Antivir","Norton Antivirus"],3,"The paid products named are McAfee ViruScan, Norton Antivirus, Sophos and F-Secure.","Norton and McAfee cost money.",0,3],["McAfee ViruScan is from which company?",["Microsoft Corporation","Intel Corporation","Symantec Corporation","Network Associates"],3,"The notes list McAfee ViruScan (Network Associates) and Norton Antivirus (Symantec).","McAfee = Network Associates.",0,3],["Which pair is correct?",["Norton Antivirus — Network Associates","McAfee ViruScan — Symantec","Avira — Sophos","Norton Antivirus — Symantec"],3,"Norton Antivirus is from Symantec, McAfee ViruScan from Network Associates.","Norton = Symantec.",1,3],["Which does the job of blocking unauthorised access between networks?",["NIC","Switch","Firewall","Antivirus"],2,"A firewall blocks unauthorised access. Antivirus detects known malicious programs by signature.","Wall blocks, vaccine detects.",1,3]]},{"t":"Pseudocode","s":["Pseudocode Basics","Key Characteristics","Worked Example: Average"],"q":[["Pseudo-code is...",["An informal description of an algorithm","A type of virus found on networks","A compiled program that runs on any system","A machine language written in binary"],0,"Pseudo-code is an informal, high-level description of the operating principle of an algorithm.","Pseudo = fake code for humans.",0,0],["Pseudo-code is meant to be read by...",["Only routers","Machines, not humans","Only compilers","Humans, not machines"],3,"It uses programming-style structure but is meant for human reading, not machine reading.","Written for people.",0,0],["Which details does pseudo-code typically leave out?",["All comments and notes on the code","Variable declarations and system code","The whole idea of the algorithm itself","Loops and decision structures"],1,"It typically omits non-essential details such as variable declarations, system-specific code and some subroutines.","Leaves out the fussy bits.",0,0],["What is pseudo-code's main purpose?",["A clear, environment-independent description","To store large amounts of data safely","To replace the operating system on a machine","To make a program run faster on any computer"],0,"It is easier for people than real code and gives an environment-independent description of the key principles.","Easy to read, runs nowhere.",0,0],["Where is pseudo-code commonly used?",["On network cables","In antivirus updates","Textbooks, scientific publications and planning program development","Inside firewalls"],2,"It is commonly used in textbooks and scientific publications, and for planning program development.","Plan before you code.",0,0],["Pseudo-code is often written with a programming language augmented by...",["Natural language or compact maths notation","Hardware circuit diagrams and wiring layouts","Voice commands and spoken instructions","Binary digits and machine codes only"],0,"The language is augmented with natural-language description or compact mathematical notation.","Plain words plus maths.",0,0],["Pseudo-code is used to sketch the structure of a program...",["After the program is sold","While the computer is off","Only after testing","Before coding"],3,"It is used for sketching structure before coding.","Pseudo first, real code later.",0,0],["Which statement about pseudo-code syntax is correct?",["It follows HTML","It always follows Java","There is no standard syntax","It has one fixed ISO syntax"],2,"No standard syntax exists. It is not an executable program.","No standard, no compile.",1,1],["Is pseudo-code an executable program?",["Only on LANs","Yes","Yes, on Windows","No"],3,"Pseudo-code is not an executable program. It never compiles.","Fake code will NOT run.",1,1],["Pseudo-code is NOT the same as...",["Notes","Plain English","Skeleton programs","Flowcharts"],2,"Skeleton or dummy programs can be compiled without errors. Pseudo-code cannot.","Skeleton compiles. Pseudo does not.",1,1],["Which are graphical alternatives to pseudo-code?",["Packet charts","Bus and star topology charts","LAN and WAN charts","Flowcharts and UML charts"],3,"Flowcharts and UML (Unified Modelling Language) charts are graphical alternatives, but they take more space on paper.","Pictures instead of words.",0,1],["UML stands for...",["Unique Machine Logic","United Module Library","Unified Modelling Language","Universal Memory Link Layer"],2,"UML is Unified Modelling Language.","U-M-L as written.",0,1],["Which languages do pseudo-code writers borrow control structures from?",["HTML, HTTP, TCP and other protocols","Pascal, BASIC, C, C++, Java, ALGOL","COBOL only","ENIAC and UNIVAC"],1,"Writers borrow control structures from Pascal, BASIC, C, C++, Java, Lisp and ALGOL.","PBALC.",0,1],["The style of pseudo-code ranges from...",["From speech sound to moving video","From near-exact code to formatted prose","From printing pages to scanning them back in","From plain binary to hexadecimal"],1,"It can range from a near-exact imitation of a programming language to formatted prose.","From code-like to plain prose.",0,1],["What is a common habit in pseudo-code?",["Compiling it before giving it out to anyone","Replacing code blocks with one-line sentences","Writing out every variable declaration","Using only machine language code all the way through"],1,"Variable declarations are omitted, and function calls or code blocks (for example inside a loop) are replaced by one-line natural-language sentences.","One sentence per block.",0,1],["The memory line for pseudo-code is...",["Free code for networks","Fast code for machines","Fake code for humans","Final code for hardware"],2,"Pseudo means fake: it will not run and has no strict rules.","Pseudo = fake.",0,1],["In the average example, lines 20 and 30 set...",["Average and sum to N","N and number to 1","Counter and sum to 0","Counter to N"],2,"Lines 20–30 set counter and sum to 0 as starting values.","Start at 0.",0,2],["In the example, line 40 reads...",["N, how many numbers there are","The counter","The average","The sum"],0,"Line 40 (INPUT N) reads N, the number of values.","N = how many.",0,2],["What do lines 50–70 do?",["End the program","Read a number, add it to sum, add 1 to counter","Print the average","Set the counter to 0"],1,"Lines 50–70 read a number, add it to sum and add 1 to the counter.","Input, add, count.",0,2],["What does line 80 do?",["Ends the program","Loops back to line 50 while counter is less than N","Reads N","Prints the average"],1,"Line 80 loops back to line 50 while the counter is still less than N.","Line 80 = the loop test.",0,2],["What do lines 90–100 do?",["Work out the average and print it","Loop back to line 50","Read N","Set sum to 0"],0,"Lines 90–100: average = sum / N, then print it.","Divide, then print.",0,2],["What does line 110 do?",["INPUT N","END","PRINT average","GOTO line 50"],1,"Line 110 is END.","Last line = END.",0,2],["The formula used in the average example is...",["average = sum / N","average = counter + N","average = N − sum","average = sum × N"],0,"The average is the sum divided by N.","Average = SUM ÷ N.",0,2],["What is the loop skeleton for the average example?",["Divide, add, input, start","Input, print, count, end","Print, divide, input, end","Start at 0, input, add to sum, count up, repeat until N, divide, print"],3,"The book's skeleton is: Start at 0, Input, Add to sum, Count up, Repeat until N, Divide, Print.","Start, Input, Add, Count, Repeat, Divide, Print.",0,2],["In the example, what is the variable called counter used for?",["Storing the average","Storing the sum","Ending the program","Counting how many numbers have been read"],3,"The counter goes up by 1 each time a number is read, and the loop stops when it reaches N.","Counter counts the inputs.",0,2],["Which command in the example makes the program jump back to line 50?",["GOTO","PRINT","INPUT","END"],0,"Line 80 is IF (counter < N) THEN GOTO line 50.","GOTO = jump.",0,2]]},{"t":"OSI Model","s":["OSI Basics and Order","Layers 1 to 3","Layers 4 to 7","Devices and Protocols by Layer","Functions: Layers 1 to 3","Functions: Layers 4 to 7"],"q":[["OSI stands for...",["Online System Interface","Open Software Internet","Open Systems Interconnection","Optical Signal Interchange"],2,"OSI is the Open Systems Interconnection model, a reference model for how networks communicate.","O-S-I: Open Systems Interconnection.",0,0],["The OSI model is made up of how many layers?",["Seven","Five","Six","Four"],0,"The OSI model has seven layers.","OSI = 7 layers.",0,0],["Which body published the OSI model?",["IEEE","NSF","ISO","ARPA"],2,"The OSI model was published by the International Organization for Standardization (ISO).","OSI came from ISO.",0,0],["The OSI model is best described as...",["A reference model for network communication","A web browser","A type of cable","A brand of router"],0,"It is a reference model that splits network communication into seven layers. It is not a device or a product.","Model = guide, not hardware.",0,0],["Which layer is at the bottom of the OSI model?",["Network","Application","Transport","Physical"],3,"Layer 1 is the Physical layer. Layer 7 is the Application layer at the top.","Bottom = Physical.",0,0],["Which layer is at the top of the OSI model?",["Session","Presentation","Physical","Application"],3,"Layer 7 is the Application layer, the one closest to the user.","Top = Application.",0,0],["Which is the correct order of the layers from 1 to 7?",["Physical, Data Link, Network, Session, Transport, Presentation, Application","Physical, Data Link, Network, Transport, Session, Presentation, Application","Physical, Network, Data Link, Transport, Session, Presentation, Application","Application, Presentation, Session, Transport, Network, Data Link, Physical"],1,"From the bottom up: Physical, Data Link, Network, Transport, Session, Presentation, Application.","Please Do Not Throw Sausage Pizza Away.",1,0],["Which memory line gives the layers from Physical up to Application?",["All People Seem To Need Data Processing","Know, Have, Body","Pretty Little Cats Meow Wildly","Please Do Not Throw Sausage Pizza Away"],3,"Please Do Not Throw Sausage Pizza Away gives Physical, Data Link, Network, Transport, Session, Presentation, Application.","P-D-N-T-S-P-A, bottom up.",0,0],["Which memory line gives the layers from Application down to Physical?",["Please Do Not Throw Sausage Pizza Away","Virus Very good at copying","Hub Shouts, Switch Whispers","All People Seem To Need Data Processing"],3,"All People Seem To Need Data Processing gives Application, Presentation, Session, Transport, Network, Data Link, Physical.","A-P-S-T-N-D-P, top down.",0,0],["Which layer number is the Transport layer?",["6","5","4","3"],2,"The Transport layer is layer 4.","Transport = 4.",0,0],["Which layer number is the Network layer?",["3","5","2","4"],0,"The Network layer is layer 3.","Network = 3.",0,0],["Which layer sits between Transport and Presentation?",["Network","Data Link","Session","Application"],2,"The order is Transport (4), Session (5), Presentation (6).","Session is layer 5.",1,0],["Which layer deals with bits, cables and signals?",["Physical","Transport","Data Link","Network"],0,"The Physical layer handles the actual transmission of bits over the medium.","Layer 1 = bits and cables.",0,1],["The unit of data at the Physical layer is the...",["Segment","Bit","Frame","Packet"],1,"The Physical layer sends raw bits.","Layer 1 = bits.",0,1],["Which layer uses MAC addresses?",["Transport","Network","Physical","Data Link"],3,"The Data Link layer uses MAC addresses to deliver frames between devices on the same network.","MAC = Data Link.",0,1],["The unit of data at the Data Link layer is the...",["Frame","Bit","Segment","Packet"],0,"Data Link sends frames.","Layer 2 = frames.",0,1],["Which layer is responsible for routing and logical (IP) addressing?",["Network","Transport","Data Link","Session"],0,"The Network layer handles routing and IP addressing between networks.","Layer 3 = routes and IP.",0,1],["The unit of data at the Network layer is the...",["Bit","Frame","Segment","Packet"],3,"The Network layer sends packets.","Layer 3 = packets.",0,1],["Which layer finds the best path for data between different networks?",["Data Link","Presentation","Network","Physical"],2,"Choosing the path between networks is routing, which belongs to layer 3.","Path finding = Network.",0,1],["Layer 1 and layer 2 are which two layers?",["Network and Transport","Physical and Data Link","Physical and Network","Data Link and Network"],1,"Layer 1 is Physical and layer 2 is Data Link.","1 Physical, 2 Data Link.",0,1],["Which layer provides end-to-end delivery between two hosts?",["Network","Data Link","Session","Transport"],3,"The Transport layer manages end-to-end delivery and splits data into segments.","Layer 4 = end to end.",0,2],["The unit of data at the Transport layer is the...",["Frame","Packet","Segment","Bit"],2,"The Transport layer sends segments.","Layer 4 = segments.",0,2],["Which layer opens, manages and closes a session between two applications?",["Application","Session","Presentation","Transport"],1,"The Session layer sets up, manages and ends sessions.","Layer 5 = sessions.",0,2],["Which layer handles data format, encryption and compression?",["Session","Presentation","Transport","Application"],1,"The Presentation layer translates data formats and handles encryption and compression.","Layer 6 = format and encryption.",0,2],["Which layer is closest to the user?",["Presentation","Application","Transport","Session"],1,"The Application layer gives network services directly to the user's programs.","Layer 7 = the user's layer.",0,2],["Web browsing, email and file transfer services belong to which layer?",["Application","Physical","Network","Data Link"],0,"These are services used directly by the user, so they sit at the Application layer.","What the user sees = Application.",0,2],["Layers 5, 6 and 7 are called...",["Network, Transport, Session","Session, Presentation, Application","Transport, Session, Presentation","Physical, Data Link, Network"],1,"The top three layers are Session (5), Presentation (6) and Application (7).","Top three: S, P, A.",0,2],["Which layer is above the Transport layer?",["Physical","Session","Data Link","Network"],1,"Session (5) sits directly above Transport (4).","Transport 4, Session 5.",0,2],["Which OSI layer does a hub work at?",["Network","Transport","Physical","Data Link"],2,"A hub only copies the signal to all ports, so it works at the Physical layer.","Hub = Layer 1.",0,3],["Which OSI layer does a switch mainly work at?",["Application","Physical","Network","Data Link"],3,"A switch forwards using MAC addresses, which are layer 2.","Switch = Layer 2.",0,3],["Which OSI layer does a router work at?",["Session","Data Link","Network","Physical"],2,"A router forwards packets between networks using IP addressing, which is layer 3.","Router = Layer 3.",0,3],["Which layer does the IP protocol belong to?",["Transport","Network","Data Link","Application"],1,"IP (Internet Protocol) works at the Network layer.","IP = Network.",0,3],["Which layer does the TCP protocol belong to?",["Application","Transport","Session","Network"],1,"TCP (Transmission Control Protocol) works at the Transport layer.","TCP = Transport.",0,3],["Which layer does the HTTP protocol belong to?",["Presentation","Transport","Network","Application"],3,"HTTP works at the Application layer.","HTTP = Application.",0,3],["A NIC with a MAC address works mainly at which layer?",["Data Link","Transport","Network","Application"],0,"MAC addresses belong to the Data Link layer.","MAC = Layer 2.",0,3],["Which pair is correct?",["Router — Network layer","Switch — Physical layer","Hub — Network layer","Router — Data Link layer"],0,"Router is layer 3 (Network), switch is layer 2 (Data Link), hub is layer 1 (Physical).","Hub 1, Switch 2, Router 3.",1,3],["What is the main function of the Physical layer?",["Encrypts the data","Adds MAC addresses to frames","Sends raw bits over the medium","Routes packets between networks"],2,"The Physical layer only moves bits across the cable or air. It does not read them.","Layer 1 = just bits.",0,4],["Which layer turns bits into electrical, light or radio signals?",["Physical","Network","Data Link","Transport"],0,"Changing bits into signals on the cable or in the air is the Physical layer's job.","Bits to signals = Physical.",0,4],["Which layer defines cable types, connectors and voltage levels?",["Presentation","Data Link","Physical","Network"],2,"Cables, connectors and voltage levels are all physical things, so they belong to layer 1.","Cable, plug, voltage = layer 1.",0,4],["Which layer decides how fast the bits are sent (the data rate)?",["Session","Physical","Transport","Network"],1,"The Physical layer sets the data rate and keeps the sender and receiver in step bit by bit.","Speed on the wire = Physical.",0,4],["Which job does NOT belong to the Physical layer?",["Adding MAC addresses","Sending bits","Defining cable types","Setting voltage levels"],0,"MAC addresses are added at the Data Link layer. The Physical layer only sends bits.","MAC = layer 2, not layer 1.",1,4],["What is the main function of the Data Link layer?",["Delivers frames between devices on the same network","Translates data formats","Breaks data into segments","Finds the best path between networks"],0,"Data Link moves frames from one device to the next on the same network, using MAC addresses.","Layer 2 = same network, using frames.",0,4],["Which layer groups bits into frames?",["Data Link","Physical","Network","Transport"],0,"Framing, packing bits into frames, is done at the Data Link layer.","Frames = Data Link.",0,4],["Which layer adds the sender's and receiver's MAC addresses?",["Physical","Network","Data Link","Transport"],2,"Each frame carries a source and a destination MAC address, added at layer 2.","MAC in the frame header = layer 2.",0,4],["Which layer checks a frame for errors, for example with a CRC?",["Network","Physical","Session","Data Link"],3,"The Data Link layer adds a check to each frame so the receiver can spot errors.","Frame check = Data Link.",0,4],["Which layer controls which device may use the shared medium?",["Application","Physical","Transport","Data Link"],3,"Control of access to the medium is a Data Link job.","Who may send now = Data Link.",0,4],["What is the main function of the Network layer?",["Opens and closes sessions","Routes packets between networks using IP addresses","Sends raw bits as signals","Compresses the data"],1,"The Network layer moves packets from one network to another using IP addresses and routing.","Layer 3 = IP and routing.",0,4],["Which layer gives each device a logical (IP) address?",["Transport","Physical","Data Link","Network"],3,"Logical addressing is done at the Network layer. MAC addresses are the physical ones at layer 2.","IP = Network.",0,4],["Which layer picks the best path for a packet?",["Transport","Session","Data Link","Network"],3,"Path selection, or routing, is the main job of layer 3.","Best path = Network.",0,4],["Which layer forwards a packet from one network to another?",["Network","Session","Data Link","Physical"],0,"Passing packets on to the next network is routing, which is layer 3.","Between networks = layer 3.",0,4],["A MAC address is a ___ address and an IP address is a ___ address.",["Logical, physical","Physical, logical","Logical, logical","Physical, physical"],1,"MAC addresses are physical addresses (layer 2). IP addresses are logical addresses (layer 3).","MAC = physical. IP = logical.",1,4],["What is the main function of the Transport layer?",["End-to-end delivery between two hosts","Routing packets between networks","Delivering frames on one network","Translating data formats"],0,"Transport looks after delivery from the sending host to the receiving host, the whole way.","Layer 4 = end to end.",0,5],["Which layer breaks data into segments and puts it back together?",["Data Link","Session","Network","Transport"],3,"Segmentation at the sender and reassembly at the receiver are Transport jobs.","Cut up and rebuild = Transport.",0,5],["Which layer uses port numbers to reach the right application?",["Network","Session","Application","Transport"],3,"Port numbers tell the receiving host which program the data is for. That is done at the Transport layer.","Port number = Transport.",0,5],["Which layer makes sure lost data is sent again (reliable delivery)?",["Physical","Network","Transport","Presentation"],2,"TCP at the Transport layer uses acknowledgements and re-sends lost segments.","Re-send lost parts = Transport (TCP).",0,5],["Which layer handles acknowledgements between the two ends?",["Session","Application","Transport","Data Link"],2,"Acknowledgements from the receiving host back to the sender are a Transport function.","ACK between hosts = Transport.",0,5],["What is the main function of the Session layer?",["Splits data into segments","Opens, manages and closes sessions","Gives IP addresses","Encrypts data"],1,"The Session layer s
