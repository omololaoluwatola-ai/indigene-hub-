<style>
:root{
  --bg:#120a07; --bg2:#1a0f0a; --card:#1c110b; --line:#4a2a17;
  --fire:#ff6a1a; --fire2:#d4400f; --gold:#ffb347; --text:#f3e7dc; --mute:#b49a88;
  --ok:#2ecc71; --okbg:rgba(46,204,113,.12); --bad:#ff4d4d; --badbg:rgba(255,77,77,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#3a1a0b 0%,var(--bg) 55%) fixed;
  color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh;
  padding:20px 16px 40px;line-height:1.5;
}
#app{max-width:720px;margin:0 auto}
h1.brand{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--fire);text-align:center;
  letter-spacing:.08em;font-size:2.1rem;margin:8px 0 6px;text-shadow:0 0 18px rgba(255,106,26,.35)}
.sub{font-family:'Orbitron',sans-serif;text-align:center;color:var(--mute);font-size:.9rem;letter-spacing:.06em;margin:0 0 20px}
.panel{background:linear-gradient(180deg,var(--card),#150c08);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
.panel h2{font-family:'Orbitron',sans-serif;color:var(--gold);text-align:center;font-size:1.35rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run{background:#150c08;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer;transition:.15s}
.run .n{display:block;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold);font-size:1.5rem;margin-bottom:2px}
.run.sel{background:linear-gradient(135deg,var(--fire),var(--fire2));border-color:var(--gold);box-shadow:0 0 16px rgba(255,106,26,.35)}
.run.sel .n{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;cursor:pointer;
  background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-family:'Exo 2',sans-serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.03em;box-shadow:0 8px 22px rgba(255,106,26,.28)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#150c08;border:1px solid var(--line);color:var(--text);box-shadow:none}
.foot{color:var(--mute);text-align:center;font-size:.92rem;margin-top:16px}
.chaps{margin-top:14px;display:none}
.chaps.show{display:block}
.chaps .tools{display:flex;gap:8px;margin-bottom:8px}
.chaps .tools button{flex:1;background:#150c08;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;font-weight:600;cursor:pointer}
.chap{display:flex;align-items:center;gap:10px;background:#150c08;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.chap.on{border-color:var(--gold);background:#24140c}
.chap .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#000}
.chap.on .box{background:var(--gold);border-color:var(--gold)}
.chap .nm{flex:1;font-size:.98rem}
.chap .ct{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.85rem}

/* progress + sections */
.secs{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px 4px}
.sec{border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:20px;padding:5px 11px;font-size:.82rem;cursor:pointer;font-family:inherit}
.sec.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
details.cres{border:1px solid var(--line);background:#150c08;border-radius:14px;margin-top:10px}
details.cres>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.cres>summary::-webkit-details-marker{display:none}
.cres .sr,.revise .sr{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.cres .sr{padding:8px 14px;border-top:1px solid var(--line)}
.revise{border:1px solid var(--bad);background:var(--badbg);border-radius:14px;padding:12px 14px;margin-top:14px}
.revise .sr{padding:6px 0}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--mute);margin-bottom:8px}
.top .sc{font-family:'Orbitron',sans-serif;font-size:.85rem}
.top .sc b.g{color:var(--ok)} .top .sc b.r{color:var(--bad)}
.bar{height:6px;background:#2a170d;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .25s}
.chtag{display:inline-block;font-size:.78rem;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);
  color:var(--text);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-family:inherit;font-size:1.02rem;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#2a170d;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem}
.opt:not(.locked):hover{border-color:var(--fire)}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .l{background:var(--ok);color:#001a0a}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#2a0000}
.fb{border:1px solid var(--line);border-left:4px solid var(--gold);background:#1a0f0a;border-radius:12px;padding:12px 14px;margin-top:6px}
.fb .v{font-weight:700;margin-bottom:6px}
.fb .v.ok{color:var(--ok)} .fb .v.no{color:var(--bad)}
.fb .trap{display:inline-block;background:var(--fire);color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.fb .ex{margin:0 0 8px}
.fb .hk{color:var(--gold);font-weight:600}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:12px;padding:13px 8px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.nav button.primary{background:linear-gradient(135deg,var(--fire),var(--fire2));border:0;color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

/* map */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.ov h3{font-family:'Orbitron',sans-serif;color:var(--gold);margin:0 0 10px;font-size:1.05rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:38px;border-radius:8px;border:1px solid var(--line);background:#150c08;color:var(--mute);font-family:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
.map button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.map button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--gold)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:10px 0}

/* result */
.big{font-family:'Orbitron',sans-serif;font-size:3rem;color:var(--gold);text-align:center;margin:6px 0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;color:var(--mute)}
.stats b{color:var(--text)}
.msg{text-align:center;color:var(--text);margin:8px 0 6px}
.rv{border:1px solid var(--line);background:#150c08;border-radius:14px;padding:12px 14px;margin-top:12px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .you{color:var(--bad)} .rv .cor{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a170d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}
@media (max-width:420px){.q{font-size:1.08rem}h1.brand{font-size:1.8rem}}
</style>
</head>

<script>
const DATA = [{"t":"Taxonomy, Body Plan & Protozoa","s":["Taxonomy & Systematics","Nomenclature","Domains & Kingdoms","Symmetry & Body Plan","Cell Layers & Body Cavities","Levels of Organization","Protozoa: General Features","Phylum Rhizopoda (Amoeba)","Phylum Apicomplexa (Plasmodium)","Kinetoplastida & Euglena","Phylum Ciliophora"],"q":[["Who proposed the early taxonomic system that groups animals by physical and structural likeness?",["Robert Hooke","Charles Darwin","Carolus Linnaeus","Gregor Mendel"],2,"Linnaeus (1753) grouped organisms by shared structure, which is the 'natural system'.","Linnaeus = 1753 = naming and grouping.",0,0],["In what year is the Linnaean system dated in the book?",["1859","1758","1735","1753"],3,"The book gives Carolus Linnaeus (1753).","1753: remember 17-53, like a phone code.",0,0],["Biologists have so far described about how many animal species?",["140 million","4 million","1.4 million","14 thousand"],2,"The book puts it at about 1.4 million species, with thousands added yearly.","1.4 million. Do not inflate it.",0,0],["Taxonomy is best defined as:",["Grouping animals by where they live and what they eat","Giving each animal a common name in every country","Studying only the structure of fossils from old rocks","Classifying organisms in an ordered system that shows natural evolutionary relationships"],3,"Taxonomy classifies organisms in an ordered system showing evolutionary relationship.","Taxonomy = order + relationship.",0,0],["The study of identification, taxonomy, nomenclature and classification with regard to natural relationships is called:",["Systematics","Ecology","Morphology","Embryology"],0,"Systematics covers identification, naming and classification plus variation and evolution of taxa.","Systematics is the umbrella. Taxonomy sits under it.",0,0],["Which of these is NOT one of the goals of animal systematics?",["To identify all species of animals","To study how animals digest food","To evaluate evolutionary relationships among species","To group species into a hierarchy of taxa"],1,"The goals are identify, evaluate relationships, group into taxa, and naming. Digestion is physiology.","Goals all start with identify, evaluate, group, name. Digestion is the odd one.",1,0],["A single group in a taxonomic hierarchy is called a:",["Taxon","Genotype","Taxis","Taxa"],0,"One group is a taxon; the plural is taxa.","Singular taxon, plural taxa. Watch the trap.",1,0],["The plural of taxon is:",["Taxi","Taxa","Taxons","Taxae"],1,"Taxon (singular) and taxa (plural).","Taxon becomes taxa, like phenomenon and phenomena.",0,0],["Modern taxonomy is based mainly on:",["Evolutionary relationships","Body size and outer shape of the animal alone","The habitat where the animal is usually found","Colour patterns seen on the outer body"],0,"Modern taxonomy rests on evolutionary relationships, using many lines of evidence.","Modern = evolution.",0,0],["Which of these is used by taxonomists to study relationships?",["Karyotype (chromosome structure)","The time of day the animal feeds","Colour and pattern of the outer body","The local names given by villagers"],0,"Karyotypes, DNA, amino acids, embryology, breeding behaviour and distribution are all listed.","Pick the one that is a lab or structural evidence.",0,0],["Which is the correct order of ranks, from the most specific to the most inclusive?",["Species, family, genus, order, class, kingdom, phylum","Genus, species, family, class, order, phylum, kingdom","Kingdom, phylum, class, order, family, genus, species","Species, genus, family, order, class, phylum, kingdom"],3,"The book lists species, genus, family, order, class, phylum, kingdom as increasing inclusiveness.","S-G-F-O-C-P-K.",0,0],["In the ranking species to kingdom, which rank comes immediately after family?",["Phylum","Genus","Order","Class"],2,"Species, genus, family, then order.","Family then Order.",0,0],["Which rank is directly above genus?",["Family","Species","Order","Class"],0,"Genus sits inside family.","Genus goes up to Family.",0,0],["A taxon between two main ranks is shown by:",["Subdividing the ranks","Renaming the kingdom","Deleting one rank","Adding a common name"],0,"All ranks can be subdivided to show taxa that lie between them.","Sub-ranks fill the gaps.",0,0],["Nomenclature means:",["Dividing animals into body segments","Assigning a distinctive name to each species","Counting the species found in one habitat","Grouping species by body size alone"],1,"Nomenclature is the assignment of a distinctive name to each species.","Nomen = name.",0,1],["The current system of naming species uses:",["Colour codes","Trinomial names only","Binomial nomenclature","Common names"],2,"Each species gets two names, genus then species epithet.","Bi = two.",0,1],["In Homo sapiens, 'sapiens' is the:",["Genus name of the animal","Family name of the animal","Species epithet","Common name of the animal"],2,"The first word is the genus, the second is the species epithet.","First name = genus. Second = species.",0,1],["Which writing of a scientific name is correct?",["Homo Sapiens (italicised or underlined)","HOMO SAPIENS (italicised or underlined)","homo Sapiens (italicised or underlined)","Homo sapiens (italicised or underlined)"],3,"Genus is capitalised, species lowercase, whole name italicised or underlined.","Big first, small second, slanted.",0,1],["Why are common names unreliable in science?",["They are written in Latin and never change","They are controlled by an international code","They are the same in every country on Earth","They vary between countries and regions and one species can have many"],3,"Common names vary place to place, and some species have hundreds of names.","Common names change with place. Latin names do not.",0,1],["The scientific name of an organism is derived from which language?",["Latin","Yoruba","Greek only","Arabic"],0,"The book says the name is italicised because it is derived from Latin.","Scientific names = Latin.",0,1],["After Homo sapiens has been written in full, it can be shortened to:",["S. homo","H. sapiens","Homo s.","Hs."],1,"The genus may be abbreviated to its first letter after it has been printed in full once.","Keep the species, shorten the genus.",0,1],["When Hirudo medicinalis and Homo sapiens appear in the same document, how should the genera be written?",["Hirudo as H. and Homo in full","Both as H.","Both in full each time","Only the species names"],2,"Both genera start with 'H', so neither may be abbreviated.","Same first letter means no shortcut.",0,1],["Why must Homo and Hirudo not be abbreviated together in one document?",["Both begin with H and would be confused","Both names are the same in Latin","Both are genera of the same family","Both are species of one genus"],0,"If two genera share a first letter, abbreviating both would cause confusion.","Same letter, same confusion.",0,1],["Names of taxa above genus are written as:",["Words in brackets after the genus","Single words written in lowercase only","Two italicised words with a capital","Single non-italicised words"],3,"Taxa at all other ranks are given single, non-italicised names.","Above genus: one word, no italics.",0,1],["Which body controls the naming of animals?",["International Code of Zoological Nomenclature","National Council of Animal Names","World Health Organization of Taxonomists","International Union of Biological Sciences"],0,"The ICZN requires each animal to have one correct name.","ICZN = Zoological.",0,1],["The binomial system solves the problem of common names because:",["Names are changed each year by scientists","It lets every region choose its own name","No two kinds of animals share the same binomial name","Local people agree on a single name worldwide"],2,"Every animal has only one correct name under the ICZN.","One animal, one name.",0,1],["Tiger shark, timber wolf and daisy are examples of:",["Family names","Common names","Binomial names","Species epithets"],1,"They are everyday names, not scientific names.","Easy words = common names.",0,1],["How many domains are in the three-domain system?",["Five","Two","Six","Three"],3,"Bacteria, Archaea and Eukarya.","Three domains, six kingdoms.",0,2],["Which set lists the three domains?",["Animalia, Fungi, Bacteria","Archaea, Plantae, Animalia","Protista, Fungi, Plantae","Bacteria, Archaea, Eukarya"],3,"The three-domain system is Bacteria, Archaea, Eukarya.","BAE.",0,2],["How many kingdoms are in the six-kingdom system?",["Four","Three","Five","Six"],3,"The six kingdoms are Bacteria, Archaea, Protista, Plantae, Fungi, Animalia.","Six kingdoms.",0,2],["Which domain contains Protista, Plantae, Fungi and Animalia?",["Prokarya","Archaea","Bacteria","Eukarya"],3,"Those four kingdoms sit inside Eukarya.","Euk-arya = nucleus kingdoms.",0,2],["Which of these is NOT a kingdom in the six-kingdom system?",["Fungi","Protista","Archaea","Viruses"],3,"Viruses are not listed among the six.","Viruses are never in it.",1,2],["Protozoa belong to which kingdom in the book?",["Archaea","Protista","Animalia","Fungi"],1,"The book places Sub-Kingdom Protozoa under Kingdom Protista.","Proto = Protista.",0,2],["Animals are described in the book as:",["Multicellular fungi with chitin in walls","Unicellular autotrophs with cellulose walls","Multicellular autotrophs that make food","Multicellular or unicellular heterotrophs that lack cell walls"],3,"Animals are heterotrophic and lack cell walls.","No cell wall, no photosynthesis.",0,3],["Animals that have a backbone are called:",["Invertebrates","Vertebrates","Acoelomates","Radiata"],1,"Vertebrates have a backbone; invertebrates do not.","Vertebra = backbone.",0,3],["Which animals have the simplest body plan and show no symmetry?",["Sea urchins and starfishes","Sponges (Porifera)","Hydras and related polyps","Flatworms and ribbon worms"],1,"Sponges are asymmetrical.","No symmetry means sponge.",0,3],["A body plan describes an animal's:",["Age, sex and size at maturity","Shape, symmetry and internal organisation","Colour, size and speed of movement","Diet, habitat and breeding season"],1,"The book gives shape, symmetry and internal organisation.","Plan = shape, symmetry, inside.",0,3],["Radial symmetry is found in:",["Hydra, jellyfish and sea urchins","Earthworms, leeches and nereids","Beetles, crabs and spiders","Frogs, foxes and ladybird beetles"],0,"Tubular, vase or bowl shapes divided into like halves by more than two planes.","Round bodies are radial.",0,3],["The two phyla that are primarily radial are called the:",["Protostomes","Bilateria","Radiata","Acoelomates"],2,"Cnidaria and Ctenophora form the Radiata.","Radial = Radiata.",0,3],["Which pair of phyla make up the Radiata?",["Arthropoda and Chordata","Annelida and Mollusca","Nematoda and Platyhelminthes","Cnidaria and Ctenophora"],3,"These two are primarily radial.","C and C.",0,3],["In a radially symmetrical animal, the mouth is usually at:",["The tip of the posterior end","The lateral side of the body","One end of the longitudinal axis","The middle of the dorsal surface"],2,"One end of the longitudinal axis is usually the mouth.","Mouth on the axis end.",0,3],["Bilateral symmetry can be divided into two mirrored halves along:",["A central (median) plane","No plane at all","Many planes through the axis","A spiral line"],0,"Right and left halves on either side of one central plane.","One cut only.",0,3],["Why was the appearance of bilateral symmetry a major advancement?",["Bilateral animals no longer need a mouth","Radial animals move forward faster than bilateral ones","Bilateral animals can photosynthesise their food","Bilateral animals are better fitted for directional forward movement"],3,"Bilateral animals move forward better than radial ones.","Bilateral = forward movement.",0,3],["Cephalization is the:",["Loss of the head during development","Concentration of sensory and brain structures at the anterior end","Formation of a hard shell over the head","Division of the body into repeated segments"],1,"Bilateral animals tend to concentrate sensory and brain structures in front.","Cephal = head.",0,3],["Which term means 'towards the head'?",["Ventral","Anterior","Posterior","Dorsal"],1,"Anterior is towards the head, posterior towards the tail.","Anterior = front.",0,3],["The dorsal side of an animal is the:",["Belly","Tail","Head","Back"],3,"Dorsal is the back and ventral is the abdomen.","Dorsal = back (like a fin).",0,3],["The outer layer of an embryo that gives rise to the epidermis is the:",["Ectoderm","Mesoglea","Endoderm","Mesoderm"],0,"Ectoderm forms the epidermis.","Ecto = outside.",0,4],["The embryonic layer that forms the gastrodermis is the:",["Mesoderm","Endoderm","Ectoderm","Mesoglea"],1,"Endoderm lines the gut cavity as the gastrodermis.","Endo = inside.",0,4],["The non-cellular layer between epidermis and gastrodermis in two-layered animals is the:",["Mesoglea","Coelom","Mesoderm","Parenchyma"],0,"Mesoglea is a non-cellular layer between the two.","Mesoglea has no cells. Mesoderm has.",0,4],["What does the mesoderm give rise to?",["The inner gut lining called gastrodermis","The outer skin layer called epidermis","Supportive, contractile and blood tissues","The non-cellular jelly called mesoglea"],2,"The mesoderm gives supportive, contractile and blood tissues.","Meso = middle = muscle and blood.",0,4],["A body cavity is:",["A space inside the mouth that holds food","A fluid-filled space in which internal organs are suspended and separated from the body wall","A sac filled with air for floating","A hole in the body wall that leads to the gut"],1,"The book defines it as a fluid-filled space for organs.","Cavity = fluid space around organs.",0,4],["A true body cavity completely lined by mesoderm is the:",["Parenchyma","Coelom","Mesoglea","Pseudocoelom"],1,"A cavity completely lined by mesoderm is a coelom.","Complete lining = coelom.",0,4],["Why is the coelom described as 'a tube within a tube'?",["It is built from two layers of muscle only","The body has two mouths joined together","It contains only a gut and a heart","The gut tube lies inside the body wall tube, with fluid space between"],3,"The gut is a tube within the body-wall tube, giving greater flexibility.","Gut tube inside body tube.",0,4],["One extra job of the fluid-filled coelom in many worms is to act as a:",["Hydrostatic skeleton","Brain for coordination","Gill for gas exchange","Shell for protection"],0,"It aids movement and burrowing as a hydrostatic skeleton.","Fluid pushes, worm burrows.",0,4],["Animals with no body cavity are called:",["Acoelomates","Pseudocoelomates","Coelomates","Radiates"],0,"Flatworms have no body cavity.","A- = no.",0,4],["In acoelomates the region between epidermis and gut is filled with:",["Blood","Parenchyma","Mesoglea","Coelomic fluid"],1,"Mesoderm forms a spongy mass of cells called parenchyma.","Flatworm filling = parenchyma.",0,4],["Which group is pseudocoelomate?",["Flatworms","Molluscs","Annelids","Nematodes"],3,"The roundworms have a false body cavity.","Round worms, false cavity.",0,4],["A pseudocoelom is 'false' because it is:",["Lined entirely by endoderm cells","Missing the gut tube completely","Filled with parenchyma tissue","Not completely lined by mesoderm"],3,"The mesoderm lines only the interior of the cavity, not the outer gut wall.","False = partial lining.",0,4],["Which phyla listed in the book are all coelomates?",["Protozoa, annelids, nematodes, sponges, flatworms","Molluscs, annelids, arthropods, chordates, echinoderms","Nematodes, flatworms, sponges, cnidarians, ctenophores","Cnidarians, ctenophores, sponges, nematodes, flatworms"],1,"These five groups have true coeloms.","Five true coelom phyla: M A A C E.",0,4],["Which is the odd one out for body cavity type?",["Flatworm","Crab","Snail","Earthworm"],0,"Flatworms are acoelomate; the others are coelomate.","Odd one has no cavity.",1,4],["Which level of organisation is found in unicellular organisms?",["Organ","Tissue","Protoplasmic","Organ-system"],2,"All life functions are within one cell.","Proto = one cell.",0,5],["In the cellular level of organisation, there is:",["True organ systems control the body","One cell carries out all life functions","Fully formed organs run each function","A division of labour among cells"],3,"Cells are functionally differentiated but not organised into tissues.","Cellular = division of labour.",0,5],["The cell-tissue level of organisation is best shown by:",["Mammals with organ systems","Nemertean worms with a gut system","Flatworms with eyespots and organs","Cnidarians such as jellyfish"],3,"Jellyfish show the tissue plan, as in the nerve net.","Jelly = tissue.",0,5],["Which structure in cnidarians is an excellent example of a tissue?",["The gut","The gill","The nerve net","The shell"],2,"Nerve cells and processes form a definite tissue with a coordinating function.","Nerve net = tissue.",0,5],["Which phylum is the example for the tissue-organ level?",["Cnidaria","Porifera","Platyhelminthes","Echinodermata"],2,"Flatworms have eyespots, gut and reproductive organs.","Flatworms = organs.",0,5],["Which animals are the simplest to show the organ-system level?",["Nemertean worms","Sponges with loose cells","Flatworms with a blind gut","Jellyfish with a nerve net"],0,"Nemerteans have a complete digestive system distinct from the circulatory system.","Nemertean = first system.",0,5],["Which of these is the most complex level of organisation?",["Tissue-organ","Cell-tissue","Organ-system","Cellular"],2,"Organs working together form systems.","Systems come last.",0,5],["Put these in order from simplest to most complex: tissue, organ-system, cellular, protoplasmic, organ.",["Protoplasmic, tissue, cellular, organ, organ-system","Protoplasmic, cellular, tissue, organ, organ-system","Tissue, cellular, protoplasmic, organ-system, organ","Cellular, protoplasmic, organ, tissue, organ-system"],1,"The book moves protoplasmic, cellular, cell-tissue, tissue-organ, organ-system.","Cell, tissue, organ, system.",0,5],["Protozoa are all:",["Prokaryotes lacking a nucleus","Multicellular with a cell wall of chitin","Unicellular for all or part of their life cycle","Plants without chloroplasts or nuclei"],2,"They are unicellular although some species group in colonies.","Proto = single cell.",0,6],["Which membrane bounds the whole body of a protozoan?",["Chitin layer","Pellicle only","Plasmalemma","Cell wall"],2,"The entire body is bounded by the plasmalemma.","Plasma-lemma = cell membrane.",0,6],["The outer gelatinous region of protozoan cytoplasm is the:",["Nucleoplasm","Ectoplasm","Endoplasm","Mesoplasm"],1,"Ecto outer, endo inner and more fluid.","Ecto = outer.",0,6],["Which organelle expels excess water in protozoa?",["Trichocyst that discharges threads","Contractile vacuole","Golgi body that packages proteins","Lysosome that digests food"],1,"Contractile vacuoles do volume and osmotic regulation.","Contractile vacuole = water pump.",0,6],["Trichocysts and toxicysts are used mainly for:",["Photosynthesis in light","Digestion of food particles","Defence and predation","Reproduction by binary fission"],2,"Toxicysts discharge filaments that paralyse prey.","Toxi = poison.",0,6],["The commonest asexual reproduction in protozoa is:",["Conjugation","Spore formation only","Budding","Binary fission"],3,"One individual divides into two by mitosis.","Fission = split.",0,6],["In multiple fission the nucleus divides repeatedly:",["Only once","Without replicating","Before cytokinesis","After cytokinesis"],2,"Many daughter cells are produced almost simultaneously.","Many nuclei first, then split.",0,6],["Which is NOT a major means of protozoan locomotion?",["Cilia beating in waves","Flagella lashing in water","Muscular contraction","Pseudopodia flowing forward"],2,"Protozoa move by cilia, flagella or pseudopodia.","No muscles in single cells.",1,6],["Digestion in protozoa is:",["Entirely intracellular","Done in a stomach","Extracellular","Done by the mouth"],0,"Food is engulfed and digested in food vacuoles.","Inside the cell.",0,6],["How does the pH of the food vacuole change?",["Basic first, then acidic","Acidic first, then basic","Always neutral","Always acidic"],1,"The food vacuole is first acidic then becomes basic.","Acid then base.",0,6],["An association where one partner benefits without harming the other is:",["Predation","Parasitism","Commensalism","Mutualism"],2,"Commensalism: one benefits, no effect on the other.","Comm = no harm.",0,6],["The book says most protozoa are:",["Chemosynthetic","Autotrophic only","Lithotrophic","Heterotrophic"],3,"Nutrition is mostly heterotrophic, some saprozoic.","Eat others.",0,6],["Phylum Rhizopoda moves by:",["Cilia","Muscles","Pseudopodia","Flagella"],2,"Rhizopoda are amoebae with false feet.","Rhizo = root-like foot.",0,7],["Entamoeba histolytica causes:",["Elephantiasis","Malaria","Sleeping sickness","Amoebic dysentery"],3,"It is the causative agent of amoebic dysentery.","E. histolytica = dysentery.",0,7],["Which amoeba is listed as parasitic along with E. histolytica?",["Entamoeba gingivalis","Euglena viridis","Paramecium caudatum","Amoeba proteus"],0,"The book names Entamoeba gingivalis as another parasitic amoeba.","Gingiva = gum.",0,7],["An amoeba reacts to acidic water or bright light by:",["Dividing","Retreating","Advancing","Feeding faster"],1,"Adverse stimuli make it retreat; food makes it advance.","Bad stimulus, back off.",0,7],["Where is Amoeba proteus commonly found?",["Freshwater pools and bottom mud","Dry deserts and sandy dunes","Blood and tissues of mammals","Deep sea vents and cold rock pools"],0,"It lives in freshwater pools, ditches, ponds and slow streams.","Fresh and muddy.",0,7],["About how wide is Amoeba proteus?",["0.25 mm (250 microns)","2.5 cm across, easily visible","25 microns, much smaller than a bacterium","25 mm across, seen without a lens"],0,"It is about 0.25 mm and nearly invisible to the naked eye.","Quarter of a millimetre.",0,7],["The word 'Amoeba' comes from a Greek word meaning:",["Water","Foot","Round","Change"],3,"Amoebae means change.","Amoeba = change.",0,7],["The specific name 'proteus' comes from:",["A river in Greece with changing flow","The surname of the man who found it","A Greek sea-god who changed shape","A Latin plant name for pond weed"],2,"Proteus was a mythological Greek sea-god who constantly changed shape.","Proteus = shape-shifter.",0,7],["The pseudopodia of Amoeba are specifically called:",["Filopodia","Axopodia","Lobopodia","Cirri"],2,"Their blunt, finger-like rounded tips give the name lobopodia.","Lobe = blunt.",0,7],["Amoeba proteus has no:",["Nucleus","Ectoplasm","Cell wall","Plasma membrane"],2,"It has only a thin plasmalemma, no cell wall.","No wall.",0,7],["Nutrition of Amoeba is described as:",["Autotrophic, making food from light","Holozoic (zootrophic)","Saprophytic, absorbing dead matter","Chemosynthetic, using chemicals"],1,"Solid organic particles are ingested.","Holozoic = swallow solid food.",0,7],["How does Amoeba take in food?",["Through a cytostome beside the flagellum","At any point, generally at the advancing end","Through a fixed mouth at the front","Through gill slits on the sides"],1,"It has no mouth, food is ingested anywhere, usually at the front.","No mouth.",0,7],["The apical complex is typical of phylum:",["Apicomplexa","Ciliophora","Rhizopoda","Kinetoplastida"],0,"The apical complex distinguishes the phylum.","Apical = Apicomplexa.",0,8],["The apical complex can be seen only with:",["An electron microscope","A hand lens","The naked eye","A light microscope"],0,"It is visible only by electron microscopy.","Too small, use EM.",0,8],["Which structures belong to the apical complex?",["Rhoptries and micronemes","Paramylon and chloroplasts","Trichocysts and toxicysts","Pellicle and stigma"],0,"Rhoptries and micronemes help penetrate the host cell.","Rhoptry, microneme.",0,8],["Which is an Apicomplexan?",["Paramecium aurelia","Plasmodium falciparum","Trypanosoma brucei","Euglena viridis"],1,"Plasmodium, Toxoplasma, Eimeria are apicomplexans.","Plasmo = apical.",0,8],["Which vector transmits Plasmodium to humans?",["Male Anopheles mosquito","Female Aedes mosquito","Tsetse fly","Female Anopheles mosquito"],3,"Only female mosquitoes feed on blood.","Female Anopheles only.",0,8],["Why do only female mosquitoes transmit malaria?",["They need blood nutrients for egg production","Males live only in water","Males are larger and eat more","Males carry no parasites at all"],0,"They need blood to produce eggs.","Mother needs blood.",0,8],["The infective stage injected by the mosquito is the:",["Sporozoite","Gametocyte","Merozoite","Trophozoite"],0,"Sporozoites are in the saliva.","Spor, Spit.",0,8],["After injection, sporozoites go first to the:",["Brain","Kidney","Liver","Spleen"],2,"They penetrate hepatocytes (liver cells).","Liver first.",0,8],["Multiplication of the parasite in liver cells is called:",["Fertilization","Sporogony","Exoerythrocytic schizogony","Erythrocytic schizogony"],2,"It occurs outside red blood cells.","Exo = outside RBC.",0,8],["Schizogony is a form of asexual reproduction in which:",["The nucleus divides several times, then the cell divides into many merozoites","Two gametes fuse to give a zygote","One cell splits into two equal daughter cells","Spores germinate to give a new cell"],0,"The parent cell divides into as many merozoites as there are nuclei.","Many nuclei then many cells.",0,8],["Merozoites released from the liver invade:",["Hepatocytes only","Red blood cells","White blood cells","Platelets"],1,"They invade red blood cells and transform into trophozoites.","Merozoites go to RBCs.",0,8],["The young trophozoite takes a shape called:",["Crescent","Signet-ring","Star","Spindle"],1,"A feeding trophozoite looks like a signet ring.","Ring shape.",0,8],["In P. malariae, the intra-erythrocytic cycle takes:",["72 hours","96 hours","24 hours","48 hours"],0,"72hr for P. malariae; 48hr for P. falciparum, vivax and ovale.","Malariae = 72.",0,8],["Which species has a 48 hour intra-erythrocytic cycle?",["Plasmodium vivax","Eimeria tenella","Toxoplasma gondii","Plasmodium malariae"],0,"P. falciparum, vivax and ovale are 48hr.","Vivax = 48.",0,8],["Fever in malaria occurs when:",["Gametes fuse in the red blood cell","Erythrocytes burst and release merozoites and toxins","Sporozoites enter the liver cells","Zygotes form in the mosquito gut"],1,"Toxins have a pyrogenic effect each time cells burst.","Burst then fever.",0,8],["The stage taken up by the mosquito from the human blood is the:",["Sporozoite","Schizont","Gametocyte","Merozoite"],2,"Gametocytes mature into gametes in the mosquito.","Mosquito drinks gametocytes.",0,8],["Fertilization of Plasmodium occurs in the:",["Human red blood cell","Human liver","Stomach wall of the mosquito","Mosquito salivary gland"],2,"A microgamete fuses with a macrogamete in the stomach wall.","Fertilization in mosquito gut.",0,8],["The motile zygote of Plasmodium is the:",["Sporoblast","Oocyst","Ookinete","Sporozoite"],2,"The zygote elongates into a motile ookinete.","Ookinete moves.",0,8],["Sporozoites finally gather in the mosquito's:",["Legs and wings of the mosquito","Ovaries and eggs of the mosquito","Stomach wall of the mosquito","Salivary glands"],3,"They migrate to the salivary glands, making the mosquito infective.","Saliva spreads them.",0,8],["The oocyst forms:",["Within a human red blood cell","Beneath the skin of the human host","Inside the mosquito's ovary wall","Beneath the basal lamina of the midgut"],3,"The ookinete crosses the midgut and forms an oocyst under the basal lamina.","Oocyst on the gut wall.",0,8],["Which parasite is NOT an Apicomplexan?",["Toxoplasma gondii","Trypanosoma gambiense","Eimeria tenella","Cryptosporidium parvum"],1,"Trypanosoma is Kinetoplastida.","Trypano = tsetse not mosquito.",1,8],["Members of Kinetoplastida are characterised by a:",["Apical complex with rhoptries","Macronucleus controlling the cell","Pseudopodium at the front","Kinetosome (basal body) at the base of the flagellum"],3,"The kinetosome is the basal body.","Kineto = basal body.",0,9],["Which of these is a Kinetoplastid?",["Trypanosoma cruzi","Paramecium aurelia","Plasmodium ovale","Balantidium coli"],0,"Trypanosoma and Leishmania belong here.","Trypano and Leish.",0,9],["Another name for Kinetoplastida in the book is:",["Rhizopoda","Mastigophora","Sporozoa","Ciliata"],1,"It is written as Kinetoplastida (Mastigophora).","Mastigo = whip.",0,9],["Which genus contains Leishmania donovani?",["Euglena","Trypanosoma","Leishmania","Vorticella"],2,"Leishmania donovani and L. tropica are listed.","Donovani is Leishmania.",0,9],["Euglena viridis is a:",["Flagellate","Ciliate","Sporozoan","Amoeboid"],0,"It is a flagellate studied as a protozoan.","Euglena has a flagellum.",0,9],["Euglena viridis lives naturally in:",["Salt marshes and brackish lagoons","Blood of vertebrate hosts","Freshwater streams and ponds with vegetation","Dry soil and leaf litter"],2,"Its habitat is freshwater with plants.","Green water.",0,9],["The red eyespot of Euglena is the:",["Pellicle","Kinetosome","Reservoir","Stigma"],3,"The stigma helps orientation to light.","Stigma = eye.",0,9],["Paramylon bodies in Euglena are:",["Light-sensitive pigment spots","Starch-like food storage","Pigments that give the green colour","Water pumps that drain the cell"],1,"They are masses of starch-like material.","Para = storage.",0,9],["Euglena is green because of:",["Paramylon bodies stored in the cell","Chloroplasts bearing chlorophyll","The pellicle around the cell","The stigma that senses light"],1,"Oval chloroplasts give the greenish colour.","Green = chlorophyll.",0,9],["In the dark Euglena can feed by:",["Holozoic nutrition","Chemosynthesis","Photosynthesis","Saprozoic nutrition"],3,"It absorbs nutrients through its body surface.","Dark = absorb.",0,9],["The pellicle of Euglena is made of:",["Chitin plates like insects","Proteinaceous strips and microtubules","Cellulose plates like plants","Calcium carbonate like shells"],1,"Just beneath the outer membrane are strips and microtubules.","Pellicle = protein.",0,9],["Euglena survives adverse conditions by:",["Encysting","Hibernating","Migrating by legs","Forming a shell"],0,"It encysts.","Cyst = survive.",0,9],["Ciliates always have:",["At least one macronucleus and one micronucleus","Eight nuclei of one kind","Only one nucleus of one kind","No nucleus at all"],0,"Ciliates are multinucleate with both kinds of nuclei.","Two kinds of nuclei.",0,10],["Which is a ciliate?",["Plasmodium vivax","Euglena viridis","Paramecium caudatum","Amoeba proteus"],2,"Paramecium, Balantidium and Vorticella.","Para-mecium has cilia.",0,10],["Balantidium coli is:",["An apicomplexan","A flagellate","A free-living amoeba","A parasitic ciliate"],3,"Balantidium coli is a commensal or parasitic ciliate.","Coli lives in the colon.",0,10],["Cilia differ from flagella because cilia are:",["Found only in bacteria","Absent in all protozoa","Longer and fewer in number","Shorter and more numerous"],3,"Cilia resemble flagella but are shorter and more numerous.","Short and many.",0,10],["Which of these is the odd one out?",["Balantidium coli","Vorticella","Paramecium aurelia","Entamoeba histolytica"],1,"The first three are ciliates, Entamoeba is Rhizopoda.","Find the pseudopodia.",0,10]]},{"t":"Phylum Annelida","s":["Introduction & Characteristics","Biology of Annelids","Class Polychaeta","Polychaete Diversity","Class Oligochaeta","Earthworm Biology & Reproduction","Class Hirudinea (Leeches)"],"q":[["The name Annelida comes from 'Annelus' and 'ida', meaning:",["Many bristle worms","Soft-bodied animals","Little ring worms","Jointed feet"],2,"Annelus is 'little ring' and ida is 'worms'.","Ring = annelid.",0,0],["What is the most distinguishing feature of annelids?",["A shell","A backbone","Radial symmetry","Segmentation"],3,"Segmentation sets them apart from other worm-like creatures.","Ring means segment.",0,0],["The segments of an annelid are also called:",["Parenchyma","Annuli only","Radioles","Metameres"],3,"Segments are metameres.","Meta = repeated parts.",0,0],["Repetition of body parts along the body is known as:",["Cleavage","Metamerism","Symmetry","Cephalization"],1,"Metamerism is the repetition of body parts.","Metamerism = segments.",0,0],["About how many species are in phylum Annelida?",["150,000","15,000","1,500","50,000"],1,"The book gives approximately 15,000.","15 thousand.",0,0],["What separates one annelid segment from the next?",["A ring of chitinous bristles","A calcareous plate of calcium","A layer of striated muscle","A transverse septum"],3,"Each segment is separated from contiguous ones by a transverse septum.","Septum = wall between segments.",0,0],["Annelids are triploblastic with a well-developed:",["Parenchyma","Mesoglea","Coelom","Pseudocoelom"],2,"They have a true coelom.","Annelids are coelomates.",0,0],["The cuticle of an annelid is:",["Flexible and non-chitinous","Hard, chitinous and moulted","Absent from the body wall","Calcareous and shell-like"],0,"The body is covered with a flexible non-chitinous cuticle.","Soft cuticle, no chitin.",0,0],["In the body wall the muscle layers are arranged as:",["Only radial","Outer longitudinal and inner circular","Outer circular and inner longitudinal","Only longitudinal"],2,"Well-developed outer circular and inner longitudinal muscles.","Circular outside, longitudinal inside.",0,0],["Chitinous bristles of annelids are called:",["Cirri and palps","Annuli and septa","Chaetae (setae)","Radioles and pinnules"],2,"Chaetae are chitinous and borne on parapodia in some.","Chaeta = bristle.",0,0],["Which of these is a feature of the annelid digestive system?",["Complete (mouth and anus)","Mouth only, with no anus","Absent, food absorbed by skin","Blind sac with a single opening"],0,"Annelids have a complete digestive system.","Two openings.",0,0],["Annelid excretory units are segmentally arranged:",["Kidneys","Malpighian tubules","Flame cells","Nephridia"],3,"Excretory system consists of segmentally arranged nephridia.","Nephridia = worm kidneys.",0,0],["Which larva appears in the development of some annelids?",["Trochophore","Nauplius","Veliger","Glochidium"],0,"Some have a trochophore larva, others direct development.","Trocho = wheel larva.",0,0],["Annelid blood vascular system is:",["Open without pigment","Closed with haemoglobin","Absent","Open with haemocyanin"],1,"The blood vascular system is closed with haemoglobin.","Closed, red blood.",0,0],["Which of these is NOT true of annelids?",["They have no digestive tract","They are bilaterally symmetrical","They are segmented","They have a coelom"],0,"They have a complete tract; the statement is the false one.","Annelid gut is complete.",0,0],["The most familiar annelids are:",["Earthworms and freshwater worms","Starfishes and sea urchins","Crabs and freshwater prawns","Snails and freshwater clams"],0,"The book names earthworms and freshwater worms.","Think earthworm.",0,0],["The body shape of annelids is described as:",["Flattened discs","Radial","Globular","Vermiform"],3,"Vermiform means worm-like.","Vermi = worm.",0,0],["The annelid nervous system has a brain connected to:",["A ring of ganglia around the gut","A single dorsal hollow nerve cord","A diffuse nerve net in the skin","A pair of ventral longitudinal nerve cords"],3,"There is a ganglion in each segment along the ventral cords.","Ventral cord, ganglia each segment.",0,1],["In annelids the 'brain' is a:",["Dorsal ganglion","Nerve net","Cerebral vesicle","Ventral ganglion"],0,"The brain is a dorsal ganglion.","Brain on top.",0,1],["The circulatory system of an annelid is closed, meaning blood:",["Flows freely into open body spaces","Is confined to the head region","Is always enclosed in vessels","Is absent from the body"],2,"Blood stays inside vessels along the body and to each segment.","Closed = in tubes.",0,1],["How many hearts are given for earthworms?",["Five","One","Twelve","Two"],0,"Several hearts (5 in earthworms).","Five hearts.",0,1],["The excretory unit with ciliated funnels in annelids is a:",["Metanephridium","Green gland","Malpighian tubule","Protonephridium"],0,"Paired metameric metanephridia open to the outside via excretory pores.","Meta = segment kidneys.",0,1],["Metanephridia remove waste from:",["The gut","The mouth","The coelomic fluid","The blood only"],2,"Ciliated funnels collect waste from the coelomic fluid.","Funnel drains the coelom.",0,1],["Which organ system is NOT metameric in annelids?",["The nerve ganglia","The nephridia","The septa","The digestive system"],3,"The digestive system runs the whole length and is differentiated.","Gut is one long tube.",0,1],["Most annelids are:",["Hermaphroditic and self-fertilising","Hermaphroditic but cross-fertilise","Reproducing only by budding","Dioecious, with fixed separate sexes"],1,"They are hermaphrodites but usually cross-fertilise.","Both sexes, but swap.",0,1],["Which annelids release eggs and sperm into the sea, forming trochophore larvae?",["Earthworms","Leeches","Freshwater worms","Marine sandworms"],3,"Some marine sandworms are dioecious and shed gametes.","Sea worms shed gametes.",0,1],["Earthworms and leeches reproduce by:",["Self-fertilization only","Releasing sperm into open water","Pairing and reciprocal fertilization","Budding and fragmentation"],2,"They pair and fertilise one another reciprocally.","Pair and swap.",0,1],["Which is the correct list of annelid classes?",["Insecta, Arachnida, Crustacea","Polychaeta, Oligochaeta, Hirudinea","Bivalvia, Gastropoda, Cephalopoda","Aves, Mammalia, Reptilia"],1,"Class Polychaeta, Oligochaeta and Hirudinea.","Poly, Oligo, Hirudo.",0,1],["Polychaeta means:",["Few bristles","No bristles","Many bristles","Ring bristles"],2,"Poly = many, chaeta = bristle.","Poly = many.",0,2],["Polychaetes are mainly:",["Freshwater","Terrestrial","Marine","Parasites in birds"],2,"They  HAM is:",["Closed","Open","Lymphatic only","Absent"],1,"HAM has an open circulatory system.","Open.",0,1],["The ciliated funnel opening of a molluscan nephridium into the coelom is the:",["Osphradium","Nephridiopore","Mantle","Nephrostome"],3,"Inner ends open into coelom via the nephrostome.","Stome = mouth inside.",0,1],["Wastes leave the molluscan body through the:",["Radula","Nephridiopore","Siphon","Nephrostome"],1,"The nephridiopore is the external opening.","Pore = out.",0,1],["Molluscs excrete using:",["Malpighian tubules","Flame cells","Green glands","Metanephridia"],3,"Excretory organs are metanephridia.","Meta again.",0,1],["About how many species of molluscs exist?",["50,000 or more","1,000,000","500,000","5,000"],0,"The book states 50,000 or more.","Fifty thousand.",0,2],["Which set contains the 3 major characteristics shared by molluscs?",["Notochord, gill slits, hollow nerve cord","Radial symmetry, tentacles, stinging cells","Segmented body, jointed legs, chitin skeleton","Mantle with shell, mantle cavity, ventral muscular foot"],3,"The mantle, mantle cavity and ventral foot define molluscs.","Mantle, cavity, foot.",0,2],["Molluscs are:",["Segmented vertebrates","Segmented invertebrates","Unsegmented vertebrates","Unsegmented invertebrates"],3,"They lack a backbone and are unsegmented.","Soft and no rings.",0,2],["Which of these is NOT a feature of molluscs?",["True heart","True coelom","Bilateral symmetry","Segmented body"],3,"Molluscs are unsegmented.","Segmentation = annelids.",0,2],["The foot of a mollusc is placed:",["Dorsally","Anteriorly only","At the tail","Ventrally"],3,"A ventral, muscular foot.","Foot under.",0,2],["Most molluscs live in:",["Freshwater","Marine habitats","Soil","Land"],1,"Marine mostly, with few freshwater and land forms.","Mostly sea.",0,2],["Most molluscs live:",["In the open water as free swimmers","On trees and are mostly climbers","On the ocean bottom and are mostly sedentary","In soil and are mostly burrowers"],2,"Mos rawling slowly on the sea floor"],2,"They are free-swimming and quick.","Swimmers.",0,8],["Octopuses are found:",["Swimming only in the open ocean","Floating at the surface of rivers","Buried in the sand of deserts","Among rocks or crawling on the ocean bottom"],3,"They crawl among rocks.","Rock crawlers.",0,8],["Cephalopods are:",["Parasites","Carnivores","Herbivores","Filter feeders"],1,"They are carnivores.","Meat eaters.",0,9],["The 'parrot-like' structure that tears prey is the:",["Radula","Beak","Funnel","Siphon"],1,"A powerful parrot-like beak tears prey apart.","Parrot beak.",0,9],["In some octopuses, the salivary glands are modified into:",["Gills","Hearts","Poison glands","Ink sacs"],2,"They become poison glands.","Saliva = poison.",0,9],["Cephalopods swim by:",["Flapping of the shell valves","Jet propulsion using the mantle and siphon","Waves of the muscular foot","Beating cilia on the foot"],1,"Jet propulsion by muscular mantle and siphon.","Jet.",0,9],["During jet propulsion, water is drawn into the mantle cavity when the mantle:",["Relaxes","Dries","Contracts","Tears"],0,"Relaxing expands the cavity and water enters.","Relax = in.",0,9],["Water is forced out through the siphon when the mantle:",["Relaxes","Expands","Contracts","Dissolves"],2,"Contraction squeezes water out of the siphonal opening.","Squeeze = out.",0,9],["Tentacles and fins in cephalopods act as:",["Stabilizers","Shells","Sense organs","Gills"],0,"Streamlined body, tentacles and fins as stabilizers.","Stabilisers.",0,9],["Which defence structure do cephalopods possess?",["Shell door","Spines","Ink sac","Stinger"],2,"For protection they possess ink sacs.","Ink defence.",0,9],["The eye of cephalopods is of the:",["Pinhole only","Eyespot type","Compound type","Camera type"],3,"Well-developed camera-type eye.","Camera eye.",0,9],["Which statement about circulation in molluscs is correct?",["All molluscs have a closed circulatory system","Cephalopods are the only molluscan class with a closed system","Bivalves alone have a closed system","Chitons alone have a closed system"],1,"Only cephalopods are closed.","Only squids and octopus closed.",0,9],["Cephalopod sexes are:",["Separate","Hermaphrodite","Variable yearly","Absent"],0,"Sexes are separate.","Male and female.",0,9],["Sperm in cephalopods is transferred in packets called:",["Spermatophores","Sporocysts","Cocoons","Gametocytes"],0,"Sperm packets are spermatophores.","Packets.",0,9],["The male cephalopod transfers spermatophores using a:",["Tentacle","Siphon only","Radula","Shell"],0,"The male uses a tentacle to pick up and insert them.","Tentacle delivers.",0,9]]},{"t":"Phylum Arthropoda","s":["Overview & General Features","Exoskeleton, Molting & Joints","Tagmatization & Respiration","Senses & Digestion","Excretion & Reproduction","Classification & Trilobita","Myriapoda (Centipedes & Millipedes)","Subphylum Crustacea","Class Insecta","Why Insects Succeed & Their Importance","Class Arachnida","Merostomata & Pycnogonida","Insect Orders"],"q":[["The word arthropod means:",["Soft body parts","Many feet (many legs)","Jointed appendages (jointed legs)","Joined segments"],2,"Arthros = jointed, podus = legs.","Arthro = joint.",0,0],["Which is the largest phylum in the animal kingdom?",["Chordata","Arthropoda","Mollusca","Annelida"],1,"The book calls Arthropoda the largest phylum and the most successful group.","Largest = Arthropoda.",0,0],["The number of named arthropod species is over:",["50 thousand","100 thousand","1 million","1 thousand"],2,"Over 1 million named species.","Over a million.",0,0],["The arthropod exoskeleton is made of:",["Chitin","Calcium carbonate only","Cellulose","Keratin"],0,"Exoskeleton of chitin.","Chitin.",0,0],["Which three regions divide the body of an arthropod?",["Head, thorax, abdomen","Prostomium, peristomium, pygidium","Cephalon, mantle, foot","Head, trunk, tail"],0,"The body is usually in 3 regions.","HTA.",0,0],["Arthropod blood is blue because it contains:",["Haemocyanin","Chlorophyll","Melanin","Haemoglobin"],0,"Open blood system with haemocyanin that is blue.","Cyan = blue.",0,0],["Which of these is a feature of arthropods?",["Open blood system","Closed blood system with haemoglobin","Nephridia","No digestive tract"],0,"They have an open blood system.","Open, blue.",0,0],["Which structure do arthropods lack, unlike annelids and molluscs?",["Nephridia","Digestive system","Muscles","Nervous system"],0,"The book lists 'No nephridia'.","No nephridia in arthropods.",0,0],["Cilia are absent in arthropods except in:",["Peripatus","Crabs","Spiders","Beetles"],0,"No cilia except in Peripatus.","Peripatus is the exception.",0,0],["Arthropod sexes are:",["Nearly always separate","Changing yearly","Absent","Always hermaphrodite"],0,"Sexes nearly always separate.","Separate sexes.",0,0],["Some arthropods change form from larva to adult. This process is called:",["Tagmatization","Metamorphosis","Cephalization","Torsion"],1,"Some show metamorphosis.","Meta = change.",0,0],["Arthropod muscles are:",["Both striated and non-striated","Only smooth, like annelids","Absent, movement by body fluid","Only striated, with no smooth"],0,"Possession of striated and non-striated muscles.","Both types.",0,0],["Which part of the arthropod secretes the exoskeleton?",["The mantle","The nerve cord","The gut","The epidermis"],3,"The epidermis secretes the external skeleton.","Skin makes the shell.",0,1],["Which is NOT an advantage of an exoskeleton?",["It provides strong support","It acts as a barrier to infection","It gives rigid levers for muscles","It lets the animal grow without moulting"],3,"To grow, an arthropod must shed it; so it is not a growth advantage.","Exoskeleton limits growth.",0,1],["Why is the exoskeleton especially useful for land arthropods?",["It lets them make silk threads","It gives them gills on land","It helps them breathe in air","It stops internal tissues from drying out"],3,"It acts as a barrier against drying out.","Dry land, dry body.",0,1],["The shedding of the exoskeleton to allow growth is called:",["Cephalization","Molting (ecdysis)","Metamerism","Torsion"],1,"Molting or ecdysis.","Ecdysis = shed.",0,1],["At the joints of the exoskeleton:",["It is thickest","It remains thin and flexible","It turns to bone","It is absent from the body"],1,"At the junction between plates and cylinders it is thin and flexible.","Joint = thin.",0,1],["Arthropod muscles attach to:",["The inner side of the exoskeleton","The surface of the gut wall","The blood vessels in the body","The outer side of the cuticle"],0,"They attach to the inner side and function as a lever system.","Muscles inside the shell.",0,1],["Why can arthropods move quickly and efficiently?",["Jointed appendages work as a lever system with muscles","A hydrostatic coelom pushes them forward","They have a skeleton of cartilage","Cilia on the legs drive them"],0,"Jointed appendages and muscles as levers.","Joints + muscles = speed.",0,1],["A crab grows bigger but its shell cannot stretch. What must it do?",["Shed the shell and secrete a larger one","Grow a bony skeleton inside","Absorb the old shell into the body","Stop eating until the shell stretches"],0,"Molting or ecdysis lets it grow.","No stretch, so shed.",0,1],["The evolution of arthropods involved a reduction in:",["Jointed legs","Exoskeleton","Cephalization","Metamerism"],3,"Segments were lost or fused.","Fewer segments.",0,2],["The fusion of segments into functional groups is called:",["Ecdysis","Torsion","Metamerism","Tagmatization"],3,"Tagmatization.","Tagma = group.",0,2],["Why was tagmatization useful?",["All limbs were used only for walking","Segments fused so the body became shorter","Chitin was no longer secreted","Appendages became specialised for functions other than walking"],3,"Appendages specialised for prey capture, filter feeding, sensing and others.","Different jobs for limbs.",0,2],["High metabolic rates in arthropods require:",["Respiratory organs with a large surface area","A smaller body surface for gas","A closed system of blood vessels","A thicker exoskeleton around the body"],0,"Rapid oxygen delivery through organs with large surface areas.","Fast metabolism, big surface.",0,2],["Aquatic arthropods such as crabs and lobsters breathe with:",["Spiracles","Book lungs","Tracheae","Gills"],3,"They have gills, folds of tissue with a large surface.","Water = gills.",0,2],["Gills of arthropods are typically modifications of:",["The nerve cord and ganglia","The heart and its blood vessels","The gut lining or digestive glands","Appendages or body wall outgrowths"],3,"They are modified appendages or body wall outgrowths.","Gills from limbs.",0,2],["Insects breathe with:",["Gills","Green glands","Book lungs","Tracheae"],3,"Insects have tracheae.","Insect = trachea.",0,2],["Tracheae are:",["Folds of tissue with leaf-like plates","Branching networks of hollow air tubes","Sacs of fluid inside the gut","Chambers filled with blood and water"],1,"Air is sent to every cell in every tissue.","Air tubes.",0,2],["Spiders breathe using:",["Gills","Skin","Book lungs","Tracheae only"],2,"Book lungs have leaf-like plates.","Spider = book lung.",0,2],["In book lungs, air flows over plates while:",["Water flows through them","Blood flows through them","Nothing flows","Food flows through them"],1,"Air over the plates, blood through them.","Air out, blood in.",0,2],["Which pair is correctly matched?",["Spider - gills; Insect - gills","Spider - book lungs; Insect - tracheae","Insect - book lungs; Crab - tracheae","Crab - tracheae; Spider - gills"],1,"Spiders have book lungs and insects have tracheae.","Spiders book, insects tubes.",0,2],["The nervous system of arthropods has the same overall design as annelids:",["Anterior brain and double ventral nerve cord","A diffuse nerve net under the skin","Dorsal nerve cord and a brain behind","A ring of ganglia without a brain"],0,"Anterior brain and a double, ventral hollow nerve cord.","Brain front, cord belly. function freshFirst(arr){ const a=shuffle(arr.slice()); return a.filter(q=>!SEEN.has(q.id)).concat(a.filter(q=>SEEN.has(q.id))); }
const FULL_N = 500;
// fair sample: every chapter is represented in proportion to its size
function sampleFair(n){
  const groups = DATA.map((_,ci)=>freshFirst(ALL.filter(q=>q.ch===ci)));
  const exact = groups.map(g=>g.length*n/TOTAL);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a,b)=>a+b,0);
  exact.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([f,i])=>{ if(left>0 && take[i]<groups[i].length){ take[i]++; left--; } });
  let out=[]; groups.forEach((g,i)=>{ out=out.concat(g.slice(0,take[i])); });
  return shuffle(out);
}

    ['quick', quick, 'Quick Drill'],
    ['half', half, 'Half Run'],
    ['session', '🎯', 'By Chapter']
  ];
  $('runs').innerHTML = cards.map(c=>`<button class="run${c[0]===mode?' sel':''}" data-m="${c[0]}"><span class="n">${c[1]}</span>${c[2]}</button>`).join('');
  document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; renderSetup(); });
  $('chaps').classList.toggle('show', mode==='session');
  $('chapList').innerHTML = DATA.map((c,i)=>{
    const on = sel.has(i);
    let x = `<div class="chap${on?' on':''}" data-i="${i}"><span class="box" style="border-radius:50%">${on?'●':''}</span><span class="nm">Ch ${i+1}. ${esc(c.t)}</span><span class="ct">${c.q.length}</span></div>`;
    if(on){
      x += '<div class="secs"><button class="sec'+(secSel===null?' on':'')+'" data-s="all">Whole chapter · '+c.q.length+'</button>'
        + c.s.map((sn,si)=>'<button class="sec'+(secSel===si?' on':'')+'" data-s="'+si+'">'+esc(sn)+' · '+c.q.filter(q=>q[6]===si).length+'</button>').join('') + '</div>';
    }
    return x;
  }).join('');
  document.querySelectorAll('.chap').forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; sel.clear(); sel.add(i); secSel=null; renderSetup(); });
  document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{ secSel = b.dataset.s==='all' ? null : +b.dataset.s; renderSetup(); });
}

function makeItem(q){
  return { q, perm: shuffle([0,1,2,3]), pick: null };   // perm = order of original options shown 
}

async function startQuiz(){
  if(mode==='session' && sel.size===0){ toast('Pick a chapter first'); return; }
  try{ await lockReady; }catch(e){}
  if(lock && typeof lock.checkCbtAccess==='function'){
    try{
      const r = await lock.checkCbtAccess(SUBJECT_KEY);
      if(r && r.blocked){ lock.renderCbtLockScreen($('app'), r.reason); return; }
    }catch(e){}
  }
  let pool;
  if(mode==='full') pool = sampleFair(FULL_N);
  else if(mode==='quick') pool = freshFirst(ALL).slice(0,50);
  else if(mode==='half') pool = sampleFair(250);
  else if(mode==='weak') pool = specPool(weakSpec||[]);
  else {
    pool = [];
    [...sel].sort((a,b)=>a-b).forEach(ci=>{ pool = pool.concat(ALL.filter(q=>q.ch===ci && (secSel===null || q.sec===secSel))); });
  }
  if(!pool.length){ toast('Nothing to practise there'); return; }
  begin(pool);
}

let startedAt = 0, isRetry = false, saved = false;
let reviewing=false;
function begin(pool, retry){
  reviewing=false; $('finishBtn').textContent='Finish & see score';
  run = pool.map(makeItem); idx = 0; startedAt = Date.now(); isRetry = !!retry; saved = false;
  if(!retry){ pool.forEach(q=>SEEN.add(q.id)); if(SEEN.size >= TOTAL) SEEN = new Set(); saveSeen(); }
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  window.scrollTo(0,0);
  renderQ();
}

function counts(){
  let ok=0,no=0;
  run.forEach(it=>{ if(it.pick!==null){ it.pick===it.q.ans ? ok++ : no++; } });
  return {ok,no};
}

function renderQ(){
  const it = run[idx], q = it.q, c = counts();
  $('qpos').textContent = `Q ${idx+1} / ${run.length}`;
  $('sOk').textContent = c.ok; $('sNo').textContent = c.no;
  $('bar').style.width = ((c.ok+c.no)/run.length*100)+'%';
  $('chtag').textContent = `Ch ${q.ch+1} · ${DATA[q.ch].t}`;
  $('qtext').textContent = q.stem;
  const L = ['A','B','C','D'];
  const answered = it.pick!==null || reviewing;
  $('opts').innerHTML = it.perm.map((oi,pos)=>{
    let cls='opt';
    if(answered){ cls+=' locked'; if(oi===q.ans) cls+=' correct'; else if(oi===it.pick) cls+=' wrong'; }
    return `<button class="${cls}" data-oi="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join('');
  if(!answered) document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  renderFb();
  $('prev').disabled = idx===0;
  $('next').textContent = idx===run.length-1 ? (reviewing?'Done ▶':'Finish ▶') : 'Next ▶';
}

function renderFb(){
  const it = run[idx], q = it.q;
  if(it.pick===null && !reviewing){ $('fb').innerHTML=''; return; }
  const good = it.pick===q.ans;
  const pos = 'ABCD'[it.perm.indexOf(q.ans)];
  $('fb').innerHTML = `<div class="fb">
    ${q.trap?'<span class="trap">⚠ TRAP QUESTION</span>':''}
    <div class="v ${good?'ok':'no'}">${good?'✅ Correct!':it.pick===null?'⏭ Skipped — the answer is '+pos:'❌ Not quite — the answer is '+pos}</div>
    <p class="ex">${esc(q.exp)}</p>
    <div class="hk">⏱ Speed hack: ${esc(q.hack)}</div>
  </div>`;
}

function choose(oi){
  const it = run[idx];
  if(it.pick!==null || reviewing) return;
  it.pick = oi;
  try{ if(lock && typeof lock.recordCbtQuestionUsed==='function') lock.recordCbtQuestionUsed(); }catch(e){}
  renderQ();
}

$('prev').onclick=()=>{ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0);} };
$('next').onclick=()=>{ if(idx<run.length-1){ idx++; renderQ(); window.scrollTo(0,0);} else if(reviewing) backToResult(); else finish(); };
function startReview(){
  reviewing=true; idx=0;
  $('finishBtn').textContent='Back to result';
  $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  renderQ(); window.scrollTo(0,0);
}
function backToResult(){ reviewing=false; $('finishBtn').textContent='Finish & see score'; finish(); }
$('finishBtn').onclick=()=>{
  if(reviewing){ backToResult(); return; }
  const left = run.filter(i=>i.pick===null).length;
  if(left===0){ finish(); return; }
  $('cmsg').textContent = left+' question(s) not answered yet. Finish anyway?';
  $('cov').classList.add('show');
};
$('cYes').onclick=()=>{ $('cov').classList.remove('show'); finish(); };
$('cNo').onclick=()=>$('cov').classList.remove('show');

function openMap(){
  $('map').innerHTML = run.map((it,i)=>{
    let c=''; if(it.pick!==null) c = it.pick===it.q.ans?'ok':'no';
    if(i===idx) c+=' cur';
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; $('ov').classList.remove('show'); renderQ(); window.scrollTo(0,0); });
  $('ov').classList.add('show');
}
$('mapBtn').onclick=openMap;
$('closeMap').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{ if(e.target.id==='ov') $('ov').classList.remove('show'); };

function saveHistory(c){
  if(saved || isRetry) return;
  const answered = c.ok + c.no;
  if(answered<=0) return;
  saved = true;
  try{
    if(window.IndigeneHistory && typeof window.IndigeneHistory.save==='function'){
      const topics = {};
      run.forEach(it=>{
        if(it.pick===null) return;
        const k = 'Ch '+(it.q.ch+1)+' · '+DATA[it.q.ch].s[it.q.sec];
        if(!topics[k]) topics[k]=[0,0];
        topics[k][1]++; if(it.pick===it.q.ans) topics[k][0]++;
      });
      window.IndigeneHistory.save({course:'BIO102', mode:'cbt', correct:c.ok, total:answered,
        secs:Math.round((Date.now()-startedAt)/1000), topics:topics});
    }
  }catch(e){}
}
function finish(){
  const c = counts(), n = run.length, un = n-c.ok-c.no;
  const pct = n? Math.round(c.ok/n*100):0;
  const msg = pct>=70?'Outstanding. You are ready for the exam. 🔥':pct>=50?'You passed. Keep pushing higher and clear every section.':pct>=40?'Close. Revise the failed sections and run again.':'Keep going. Read the failed sections again, then retry.';
  saveHistory(c);
  const chs = {}, secs = {};
  run.forEach(it=>{
    const q = it.q, good = it.pick===q.ans;
    const a = chs[q.ch] || (chs[q.ch] = {ok:0,n:0}); a.n++; if(good) a.ok++;
    const k = q.ch+'_'+q.sec; const b = secs[k] || (secs[k] = {ch:q.ch,sec:q.sec,ok:0,n:0}); b.n++; if(good) b.ok++;
  });
  const chKeys = Object.keys(chs).map(Number).sort((x,y)=>x-y);
  const pc = x => Math.round(x.ok/x.n*100);
  const need = ci => Math.max(8, Math.ceil(DATA[ci].q.length*0.4));
  const rows = chKeys.map(ci=>{
    const a = chs[ci], s = pc(a), full = a.n>=need(ci), ok = s>=PASS;
    const sr = Object.values(secs).filter(x=>x.ch===ci).sort((x,y)=>x.sec-y.sec).map(x=>`<div class="sr"><span>${esc(DATA[ci].s[x.sec])}</span><b class="${pc(x)>=PASS?'pass':'fail'}">${x.ok}/${x.n} · ${pc(x)}%</b></div>`).join('');
    return `<details class="cres"${(full&&!ok)?' open':''}><summary><span>Ch ${ci+1} · ${esc(DATA[ci].t)}</span><b class="${!full?'na':ok?'pass':'fail'}" style="white-space:nowrap">${s}/100 · ${grade(s)} · ${!full?'PRACTICE':ok?'PASS ✔':'FAIL ✖'}</b></summary>${sr}</details>`;
  }).join('');
  const weak = Object.values(secs).filter(x=>x.n>=2 && pc(x)<PASS).sort((x,y)=>x.ch-y.ch||x.sec-y.sec);
  const revise = weak.length ? `<div class="revise"><b>Revise these sections</b>${weak.map(x=>`<div class="sr"><span>Ch ${x.ch+1} · ${esc(DATA[x.ch].s[x.sec])}</span><b class="fail">${pc(x)}%</b></div>`).join('')}</div>` : '<p class="msg pass"><b>Every section in this run is at pass mark or above.</b></p>';
  const fullKeys = chKeys.filter(ci=>chs[ci].n>=need(ci));
  const passedN = fullKeys.filter(ci=>pc(chs[ci])>=PASS).length;
  const wrong = run.filter(it=>it.pick!==null && it.pick!==it.q.ans);
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  window.scrollTo(0,0);
  $('result').innerHTML = `
    <h2>Result</h2>
    <div class="big" style="font-size:2.2rem">${pct}/100 · ${grade(pct)}</div>
    <div class="stats"><span>Correct <b>${c.ok}</b></span><span>Wrong <b>${c.no}</b></span><span>Skipped <b>${un}</b></span><span>Total <b>${n}</b></span></div>
    <p class="msg"><b class="${pct>=PASS?'pass':'fail'}">${pct>=PASS?'PASS':'FAIL'}</b> · pass mark ${PASS}/100 · ${fullKeys.length?'chapters passed in this run '+passedN+'/'+fullKeys.length:'practice run, no chapter pass or fail'}</p>
    <p class="msg">${msg}</p>
    <h2 style="margin-top:16px">Score per chapter</h2>
    ${rows}
    <p class="msg" style="font-size:.8rem;color:var(--mute)">PRACTICE means this run had under 40% of that chapter's questions, so it shows a score but no pass or fail.</p>
    ${revise}
    ${weak.length?'<button class="btn" id="weakBtn">Practice these weak sections ('+weak.length+')</button>':''}
    <button class="btn" id="reviewBtn">Review answers${wrong.length?' ('+wrong.length+' wrong)':''}</button>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="/#history=BIO102">My history</a>
    ${wrong.length?`<button class="btn" id="retryWrong">Retry wrong answers (${wrong.length})</button>`:''}
    <button class="btn ghost" id="newRun">New run</button>
    `;
  $('reviewBtn').onclick=startReview;
  if($('weakBtn')) $('weakBtn').onclick=()=>{ weakSpec=weak.map(x=>(x.ch+1)+'.'+(x.sec+1)); mode='weak'; startQuiz(); };
  if($('retryWrong')) $('retryWrong').onclick=()=>begin(shuffle(wrong.map(w=>w.q)), true);
  $('newRun').onclick=()=>{ $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); renderSetup(); window.scrollTo(0,0); };
}

document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden') || $('ov').classList.contains('show') || $('cov').classList.contains('show')) return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ const it=run[idx]; if(it.pick===null){ choose(it.perm['abcd'.indexOf(k)]); } }
  else if(e.key==='ArrowRight') $('next').click();
  else if(e.key==='ArrowLeft') $('prev').click();
});

$('startBtn').onclick=startQuiz;
renderSetup();
try{
  const pr = new URLSearchParams(location.search).get('practice');
  if(pr && /^[\d.,all]+$/.test(pr)){ weakSpec = pr.split(',').filter(Boolean); mode='weak'; startQuiz(); }
}catch(e){}
</script>
