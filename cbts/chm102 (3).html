"Acyl compounds","Carboxyl compounds","Carbonyl compounds","Hydroxyl compounds"],2,"They possess the carbonyl function C=O and have similar properties.","Aldehyde plus ketone, carbonyl.",0,0],["Acids, esters, acid chlorides and anhydrides contain the carbonyl function but",["Are classed as carbonyl compounds","Are classed as ketones","Are not classed as carbonyl compounds","Are classed as aldehydes"],2,"The book says they are not classified as carbonyl compounds.","Only aldehyde and ketone.",1,0],["Formaldehyde has the IUPAC name",["Propanal","Methanone","Methanal","Ethanal"],2,"HCHO.","Form, methanal.",0,0],["Acetaldehyde has the IUPAC name",["Propanal","Ethanone","Ethanal","Methanal"],2,"CH3CHO.","Acet, ethanal.",0,0],["Propionaldehyde has the IUPAC name",["Butanal","Propanal","Ethanal","Propanone"],1,"CH3CH2CHO.","Propion, propanal.",0,0],["Acetone has the IUPAC name",["Propanal","Butanone","Ethanone","Propanone"],3,"CH3COCH3 is also called 2-propanone.","Acetone, propanone.",0,0],["C6H5COCH3 is",["Acetophenone","Benzophenone","Benzaldehyde","Acetone"],0,"It has an aceto group on a phenyl ring.","Phenyl plus acetyl.",0,0],["C6H5COC6H5 is",["Benzophenone","Acetophenone","Benzaldehyde","Benzyl methyl ketone"],0,"It has two phenyl groups on the carbonyl.","Two phenyls.",0,0],["CH3CH2COCH3 is",["Propanone","2-Pentanone","2-Butanone","3-Pentanone"],2,"It is also called butan-2-one or methyl ethyl ketone.","Four carbons, one on C2.",0,0],["3-Pentanone is also called",["Propyl ketone","Isopropyl ketone","Ethyl ketone","Methyl ketone"],2,"CH3CH2COCH2CH3.","Two ethyls.",0,0],["3-Methyl-2-butanone is also called",["Methyl isopropyl ketone","Methyl ethyl ketone","Ethyl isopropyl ketone","Diisopropyl ketone"],0,"The carbonyl links a methyl and an isopropyl group.","Methyl plus isopropyl.",0,0],["Benzyl methyl ketone is also named",["2-Phenyl-1-propanone","Acetophenone","Benzophenone","1-Phenyl-2-propanone"],3,"The phenyl is on carbon 1 and the ketone on carbon 2.","Benzyl on C1.",0,0],["Oxidation of a primary alcohol gives first an",["Ether","Ketone","Aldehyde","Ester"],2,"The aldehyde is further oxidised to an acid.","1° alcohol, aldehyde.",0,1],["The aldehyde formed from an alcohol can be distilled off because it",["Is a solid at room temperature","Boils at a lower temperature than the alcohol","Boils at a higher temperature than the alcohol","Is insoluble in the reaction mixture"],1,"It can be distilled from a fractionating column before it is over-oxidised.","Aldehyde has lower bp.",0,1],["1-Butanol boils at 118 °C. The butanal made from it boils at",["100 °C","76 °C","118 °C","150 °C"],1,"The aldehyde has no hydrogen bonding.","Aldehyde is lower.",0,1],["Aromatic aldehydes can be made by oxidising",["Methylbenzene","Benzene","Benzoic acid","Phenol"],0,"CrO3 in acetic anhydride is used.","Toluene to benzaldehyde.",0,1],["Reduction of an acid chloride gives an aldehyde with",["NaOH","H2SO4","LiAlH4 excess","LiAlH(OBut)3"],3,"RCOCl gives RCHO.","Acid chloride to aldehyde.",0,1],["The Reimer–Tiemann reaction is used to make",["Aromatic ketones","Phenolic aldehydes","Aliphatic aldehydes","Esters"],1,"It uses phenol, chloroform and aqueous hydroxide.","Reimer–Tiemann, phenolic aldehyde.",0,1],["In the Reimer–Tiemann reaction, the CHO group goes to the",["Para position only of the phenol","Meta position of the phenol ring","Ortho position of the phenol","Side chain of the phenol ring"],2,"The book states CHO is introduced at the ortho position.","Ortho to the OH.",0,1],["The Reimer–Tiemann reaction uses phenol with",["Acetyl chloride and aluminium chloride","Bromine water at room temperature","Methanol and dilute mineral acid","Chloroform and aqueous hydroxide"],3,"The benzyl-type chloride is hydrolysed by the alkaline medium.","Phenol plus CHCl3.",0,1],["Oxidation of a secondary alcohol gives a",["Acid","Ketone","Ether","Aldehyde"],1,"CrO3 or K2Cr2O7 is used.","2° alcohol, ketone.",0,2],["Menthol is oxidised to",["Menthal","Menthene","Menthanoic acid","Menthone"],3,"A secondary alcohol gives a ketone.","Menthol, menthone.",0,2],["Oxidation of 2-propanol gives",["Propene","Propanone","Propanoic acid","Propanal"],1,"The secondary alcohol gives a ketone.","2-Propanol, acetone.",0,2],["Friedel–Crafts acylation uses benzene with an acid chloride and",["AlCl3","H2SO4 alone","NaOH","LiAlH4"],0,"The product is an aryl ketone.","Friedel–Crafts, AlCl3.",0,2],["Benzene with benzoyl chloride and AlCl3 gives",["Benzophenone","Acetophenone","Benzaldehyde","Toluene"],0,"C6H5COCl + C6H6 gives C6H5COC6H5 + HCl.","Benzoyl chloride, benzophenone.",0,2],["Benzene with acetic anhydride and AlCl3 gives",["Benzaldehyde and hydrogen chloride","Toluene and carbon dioxide gas","Benzophenone and ethanoic acid","Acetophenone and ethanoic acid"],3,"The anhydride acylates the ring.","Acetic anhydride, acetophenone.",0,2],["Organocadmium compounds react with acid chlorides to give",["Acids","Ketones","Alcohols","Aldehydes"],1,"R2Cd + 2R′COCl gives 2RCOR′ + CdCl2.","Cadmium, ketone.",0,2],["In the organocadmium method, R′ in the acid chloride must be",["An aryl or primary alkyl group","A halogen atom or a nitro group","Hydrogen or a hydroxyl group","A tertiary alkyl group only"],0,"The book states this condition.","Aryl or 1° alkyl.",0,2],["Di-n-butylcadmium with isobutyryl chloride gives",["3-Heptanone","2-Methyl-3-heptanone","Heptanal","2-Methyl-3-hexanone"],1,"The product is n-butyl isopropyl ketone.","Butyl plus isopropyl ketone.",0,2],["In acetoacetic ester synthesis, ethyl acetoacetate is first converted to its sodium derivative using",["Zinc","Sodium hydroxide","LiAlH4","Sodium ethoxide"],3,"It is then alkylated to give mono or disubstituted products.","Acetoacetic, NaOEt.",0,2],["After alkylation, the acetoacetic ester is hydrolysed and then",["Dehydrated to an alkene","Oxidised to an acid","Reduced to an alcohol","Decarboxylated to a ketone"],3,"CO2 is lost.","Hydrolyse, lose CO2.",0,2],["Aldehydes are oxidised by Tollens' reagent to give",["An alcohol and a silver mirror","An ester and a yellow solid","A carboxylic acid and a silver mirror","A ketone and a red precipitate"],2,"RCHO with Ag(NH3)2+ gives RCOO− and Ag.","Silver mirror, aldehyde.",0,3],["Tollens' reagent is",["Cu2+ tartrate in alkaline medium","Ag(NH3)2+ in alkaline medium","KMnO4 in cold dilute medium","CrO3 in acid medium with water"],1,"Ammonia is the complexing agent.","Silver ammonia complex.",0,3],["Ammonia is used in Tollens' reagent as",["An acid","A catalyst only","A reducing agent","A complexing agent"],3,"Silver ions readily form insoluble silver oxide, so an alkaline NH3 medium keeps it ionic.","Ammonia complexes silver.",0,3],["Ketones are",["Easily oxidised","Unreactive to all reagents","Always reduced","Not easily oxidised"],3,"But methyl ketones are oxidised by the haloform reaction.","Ketones resist.",0,3],["Methyl ketones can be oxidised by",["The Reformatsky reaction with zinc","The iodoform (haloform) reaction","The Cannizzaro reaction with NaOH","Tollens' reagent in alkaline medium"],1,"RCOCH3 gives RCOO− + CHI3.","Methyl ketone, iodoform.",0,3],["The iodoform formed is a",["Blue gas boiling at 119 °C","Red liquid boiling at 119 °C","White solid melting at 150 °C","Yellow solid melting at 119 °C"],3,"The book gives mp 119 °C.","Iodoform, yellow.",0,3],["Aldehydes are readily oxidised by reagents that oxidise",["Primary and secondary alcohols","Alkanes and other saturated compounds","Tertiary alcohols but nothing else","Ethers and other neutral compounds"],0,"Even mild oxidising agents like silver ion work.","Aldehydes oxidise easily.",0,3],["Reduction of an aldehyde gives a",["Primary alcohol","Tertiary alcohol","Alkane","Secondary alcohol"],0,"Reagents include H2/Ni, LiAlH4 or NaBH4.","Aldehyde to 1°.",0,4],["Reduction of a ketone gives a",["Acid","Primary alcohol","Secondary alcohol","Tertiary alcohol"],2,"Cyclopentanone gives cyclopentanol.","Ketone to 2°.",0,4],["Which reagent cannot reduce a C=C double bond?",["LiAlH4 in excess","H2/Ni","NaBH4","H2/Pt"],2,"NaBH4 is a mild reducing agent.","NaBH4 is mild.",0,4],["Acetophenone on reduction gives",["Phenylethyl alcohol","Phenol (hydroxybenzene)","Benzoic acid (benzenecarboxylic acid)","Benzyl alcohol (benzenemethanol)"],0,"The C=O becomes CH–OH.","Ketone to alcohol.",0,4],["Clemmensen reduction converts C=O to CH2 using",["Zn(Hg) and conc. HCl","NaBH4 in cold alcohol solvent","NH2NH2 with a strong base","LiAlH4 in dry ether solvent"],0,"It works in acidic medium.","Clemmensen, zinc and acid.",0,4],["Wolff–Kishner reduction uses",["NH2NH2 and base","LiAlH4","H2/Ni","Zn(Hg) and HCl"],0,"It works in basic medium.","Wolff–Kishner, hydrazine.",0,4],["If the product is sensitive to acid, you use",["Clemmensen reduction","Oxidation","Wolff–Kishner reduction","NaBH4 only"],2,"A basic medium is used when the product is acid sensitive.","Acid-sensitive, basic route.",0,4],["If the product is sensitive to base, you use",["Clemmensen reduction","Cannizzaro reaction","Wolff–Kishner reduction","Aldol reaction"],0,"An acidic medium is used when the product is base sensitive.","Base-sensitive, acid route.",0,4],["Cyclopentanone is reduced to cyclopentane by",["Tollens' reagent in alkaline medium","Cannizzaro reaction with strong base","NaBH4 in cold alcohol solvent","Clemmensen or Wolff–Kishner reduction"],3,"These convert C=O to CH2.","C=O to CH2.",0,4],["In the carbonyl group, the oxygen is",["Electron rich and the carbon electron deficient","Electron deficient and the carbon electron rich","Both electron deficient","Both electron rich"],0,"So nucleophiles attack the carbon.","O rich, C poor.",0,5],["Aldehydes and ketones mostly undergo",["Nucleophilic addition","Electrophilic addition","Elimination","Free radical substitution"],0,"The nucleophile attacks the carbon of C=O.","Carbonyl, nucleophilic addition.",0,5],["Methanal with a Grignard reagent then hydrolysis gives a",["Tertiary alcohol","Ketone","Primary alcohol","Secondary alcohol"],2,"HCHO + RMgX gives RCH2OH.","Methanal, 1°.",0,5],["Other aldehydes with a Grignard reagent give",["Primary alcohols","Ethers","Tertiary alcohols","Secondary alcohols"],3,"RCHO + R′MgX gives RR′CHOH.","Aldehyde, 2°.",0,5],["Ketones with a Grignard reagent give",["Acids","Tertiary alcohols","Secondary alcohols","Primary alcohols"],1,"The product has three R groups on the carbinol carbon.","Ketone, 3°.",0,5],["Carbonyl compounds with cyanide give",["Hydrazones","Cyanohydrins","Oximes","Acetals"],1,"The CN− adds to the carbon.","CN gives cyanohydrin.",0,5],["Benzaldehyde with NaCN/NaHSO3 gives",["Benzoin","Mandelic acid","Mandelonitrile","Benzonitrile"],2,"Hydrolysis then gives mandelic acid.","Benzaldehyde cyanohydrin, mandelonitrile.",0,5],["Hydrolysis of mandelonitrile with H2O/HCl gives",["Mandelic acid","Mandelonitrile oxide","Benzaldehyde","Benzoic acid"],0,"The nitrile becomes COOH.","Nitrile to acid.",0,5],["Hydroxylamine (H2N–OH) with a carbonyl compound gives an",["Hydrazone","Acetal","Oxime","Semicarbazone"],2,"For example ethanal gives acetal oxime.","Hydroxylamine, oxime.",0,5],["Hydrazine with a carbonyl compound gives a",["Semicarbazone","Oxime","Cyanohydrin","Hydrazone"],3,"Propanal gives propyl-hydrazone.","Hydrazine, hydrazone.",0,5],["Phenylhydrazine with a carbonyl compound gives a",["Phenylhydrazone","Semicarbazone","Hydrazone","Oxime"],0,"Benzaldehyde gives benzaldehyde phenylhydrazone.","Phenylhydrazine, phenylhydrazone.",0,5],["Semicarbazide with a carbonyl compound gives a",["Oxime","Phenylhydrazone","Hydrazone","Semicarbazone"],3,"The ammonia derivative is H2N–NHCONH2.","Semicarbazide, semicarbazone.",0,5],["An aldehyde with two moles of alcohol and HCl gives",["A cyanohydrin","An acetal","An ester","An oxime"],1,"Ethanal with ethanol gives ethanal diethyl acetal.","Two ROH, acetal.",0,5],["The Cannizzaro reaction occurs in aldehydes that",["Are ketones","Have a double bond","Have no α-hydrogen","Have an α-hydrogen"],2,"  acid"],2,"Two carbons with a CHO group.","Two carbons, al.",0,7],["The IUPAC name of CH3CH2CHO is",["Propan-1-al","Propanone","Propanal","Propanol"],2,"Three carbons. The CHO carbon is always 1, so no number.","CHO is 1.",0,7],["The IUPAC name of CH3CH2CH2CHO is",["Butanone","Butan-1-al","Butanal","Butanoic acid"],2,"Four carbons ending in –al.","Four carbons, al.",0,7],["The IUPAC name of CH3CH(CH3)CHO is",["2-Methylpropanone","3-Methylpropanal","1-Methylpropanal","2-Methylpropanal"],3,"The CHO carbon is 1, so the methyl is on 2.","CHO is 1.",0,7],["The IUPAC name of CH3CH(CH3)CH2CHO is",["3-Methylbutan-1-al","3-Methylbutanal","2-Methylbutanal","2-Methylbutan-3-al"],1,"Count from the CHO carbon. The methyl lands on carbon 3.","Count from CHO.",0,7],["The IUPAC name of CH2=CHCHO is",["Prop-1-enal","Propenone","Prop-2-enal","Propanal"],2,"CHO is carbon 1 and the double bond is between 2 and 3.","CHO 1, bond 2.",0,7],["The IUPAC name of C6H5CHO is",["Benzaldehyde","Benzyl alcohol","Benzoic acid","Acetophenone"],0,"A benzene ring with a CHO group.","Ring plus CHO.",0,7],["The IUPAC name of CH3COCH3 is",["Propanal","Propan-1-one","Propanone","Ethanone"],2,"A ketone ends in –one. The C=O is in the middle of three carbons.","Ketone, one.",0,7],["The IUPAC name of CH3COCH2CH3 is",["Butanal","Butan-2-one","Butan-3-one","Butan-1-one"],1,"Number from the end that gives the C=O the lower number.","Ketone takes the low number.",0,7],["The IUPAC name of CH3CH2COCH2CH3 is",["Pentanal","Pentan-3-one","Pentan-4-one","Pentan-2-one"],1,"The C=O is in the middle of five carbons.","Middle of five is 3.",0,7],["The IUPAC name of CH3COCH2CH2CH3 is",["Pentanal","Pentan-3-one","Pentan-4-one","Pentan-2-one"],3,"Number from the end nearer the C=O.","Nearest end.",0,7],["The IUPAC name of CH3COCH(CH3)CH3 is",["2-Methylbutan-2-one","3-Methylbutan-2-one","2-Methylbutan-3-one","3-Methylbutanal"],1,"C=O gets the lowest number, 2. The methyl is then on 3.","Ketone first.",0,7],["The IUPAC name of C6H5COCH3 is",["Benzophenone","Acetophenone","Phenylethanal","Benzaldehyde"],1,"A benzene ring attached to a COCH3 group.","Ring plus acetyl.",0,7],["In an aldehyde the carbon of the CHO group is",["Not counted in the chain","Always the last substituent","Numbered 2 in short chains","Always carbon 1, so no number is needed"],3,"It must be at the end of the chain.","CHO is 1.",0,7],["The suffix of a ketone is",["–oic acid","–one","–al","–ol"],1,"Propane becomes propanone.","Ketone, one.",0,7],["Which reagent turns C=O into CH2 and suits a product that dislikes base?",["NH2NH2 with a strong base","Zn(Hg) with conc. HCl","NaBH4 in cold ethanol solution","LiAlH4 in dry ether solvent"],1,"This is the Clemmensen reduction, done in acid.","Clemmensen, acid.",0,8],["The Cannizzaro reaction needs",["Conc. NaOH","Silver nitrate in ammonia","Dilute acid","Zn(Hg) and HCl"],0,"Aldehydes with no α-hydrogen self-oxidise and reduce.","Strong base.",0,8],["Which reagent separates aldehydes from ketones?",["Lucas reagent","Sodium hydrogencarbonate","Hinsberg reagent","Tollens' reagent"],3,"Aldehydes give a silver mirror. Ketones do not.","Silver mirror, aldehyde.",0,8],["Which test is positive for methyl ketones?",["I2 with NaOH (iodoform test)","CHCl3 with KOH on warming","Tollens' reagent in alkaline medium","Lucas reagent at room temperature"],0,"The yellow solid melts at 119 °C.","Methyl ketone, iodoform.",0,8],["Aldol condensation needs a carbonyl compound with",["An α-hydrogen","Only a carboxyl group","Only an aryl group","No α-hydrogen"],0,"Hydroxide removes an α-hydrogen to start the reaction.","α-H for aldol, none for Cannizzaro.",0,8],["How do you stop the oxidation of a primary alcohol at the aldehyde?",["Heat the mixture for a long time","Use conc. H2SO4 as the solvent","Distil the aldehyde off as it forms","Add excess oxidising agent and reflux"],2,"The aldehyde boils lower than the alcohol, so it escapes before it oxidises further.","Distil it out.",0,8],["Which compou ity.",0,5],["Phenylamine is a much weaker base than aliphatic amines because",["It has more alkyl groups than aliphatic ones","It is a gas at room temperature","The nitrogen electron pair is delocalised into the ring","It has no nitrogen atom in the molecule"],2,"The electron pair is withdrawn round the phenyl ring.","Ring delocalises N pair.",0,5],["The basic strength of phenylamine can be increased by putting on the ring",["A halogen atom at the 4-position","A nitro group at the 4-position","An electron-withdrawing group at the 4-position","An electron-releasing group, especially at the 4-position"],3,"This increases electron density on the ring.","Donor group helps.",0,5],["Alkylation of an amine with an alkyl halide forms",["An aldehyde, by oxidation of the amine","An amide, by loss of the halide","A higher amine, finally a quaternary ammonium salt","An alcohol, by replacement of the amino"],2,"R3N + RX gives R4N+X−.","More R on N.",0,6],["Quaternary ammonium salts are used to characterise",["Ketones","Primary amines","Aldehydes","Tertiary amines"],3,"They form from R3N and RX.","Quaternary, 3°.",0,6],["Acylation of an amine with acyl halide or acid anhydride gives",["An ester","An aldehyde","A nitrile","An amide"],3,"RNH2 + R′COX gives RNHCOR′ + HX.","Amine plus acyl, amide.",0,6],["Which amines do NOT undergo acylation?",["Primary amines","Tertiary amines","Secondary amines","Aniline"],1,"They have no hydrogen on nitrogen.","3° no H.",0,6],["Ethylamine with nitrous acid gives",["Ethane and nitrogen gas","A diazonium salt in solution","A nitrosamine in the solution","Ethanol, nitrogen and water"],3,"CH3CH2NH2 + HONO gives CH3CH2OH + N2 + H2O.","Aliphatic 1° amine, alcohol and N2.",0,6],["HONO is produced in situ because it is",["Unstable","A gas","Very expensive","Explosive when pure only"],0,"It is made from a mineral acid and a nitrite.","Make it fresh.",0,6],["Primary aromatic amines with HONO in the cold give a",["Alcohol","Nitrosamine","Phenol directly","Diazonium salt"],3,"This is the diazotisation reaction.","Aromatic 1°, diazonium.",0,6],["Warming a benzene diazonium salt with water gives",["Phenol and nitrogen","Aniline and nitrogen gas","Benzene and nitrogen gas","Nitrobenzene and water"],0,"N2 is evolved.","Diazonium plus water, phenol.",0,6],["Secondary amines with HONO give",["Amides","N-Nitrosamines","Diazonium salts","Alcohols"],1,"R2NH + HONO gives R2N–N=O + H2O.","2° amine, nitrosamine.",0,6],["N-Nitrosamines are",["Yellow oily and not basic","Acidic liquids","Colourless gases","White solids and basic"],0,"They are insoluble in aqueous solution.","Nitrosamine, yellow oil.",0,6],["Tertiary aliphatic amines with HONO",["Form alcohols with nitrogen gas","Form nitrosamines as yellow oils","Form diazonium salts in the cold","Dissolve in acid to form a salt without nitrosamine"],3,"They do not react with HONO in that way.","3° only forms salt.",0,6],["N,N-Dimethylaniline with HONO gives",["p-Nitroso-N,N-dimethylaniline","A diazonium salt of the aniline","N-Nitrosamine of the dimethylaniline","Aniline with two methyl groups lost"],0,"The nitroso group enters the ring at the para position.","Aromatic 3°, ring nitroso.",0,6],["The isocyanide (carbylamine) test uses",["I2 and NaOH","Tollens' reagent","CHCl3 and KOH","NaNO2 and HCl"],2,"RNH2 + CHCl3 + KOH gives RNC.","Chloroform plus KOH.",0,7],["A positive isocyanide test shows the presence of",["An alcohol","A tertiary amine","A primary amine","A secondary amine"],2,"The offensive odour of isocyanide shows it.","Bad smell, 1° amine.",0,7],["In the isocyanide test, which amines do NOT react?",["Secondary and tertiary amines","Methylamine and ethylamine only","Primary amines only, not aniline","Aniline and its derivatives only"],0,"Only 1° amines give the offensive smell.","2° and 3° no.",0,7],["The IUPAC name of CH3NH2 is",["Methanamide","Aminomethanal","Methanamine","Methaneamine"],2,"The e of methane is dropped before the suffix –amine.","Drop e, add amine.",0,8],["The IUPAC name of CH3CH2NH2 is",["Ethanamine","Aminoethanol","Ethanamide","Ethaneamine"],0,"Two carbons with an NH2 group.","Two carbons, amine.",0,8],["The IUPAC name of CH3CH2CH2NH2 is",["Propanamide","Propan-2-amine","Propan-1-amine","Propan-3-amine"],2,"The NH2 is on the end carbon.","End carbon, 1.",0,8],["The IUPAC name of CH3CH(NH2)CH3 is",["Propan-2-amine","Propan-3-amine","Propanamide","Propan-1-amine"],0,"The NH2 is on the middle carbon.","Middle, 2.",0,8],["The IUPAC name of CH3CH2CH2CH2NH2 is",["Butan-2-amine","Butanamide","Butan-4-amine","Butan-1-amine"],3,"The NH2 is on the end of a four-carbon chain.","End, 1.",0,8],["The IUPAC name of CH3CH(NH2)CH2CH3 is",["Butan-3-amine","Butan-2-amine","2-Methylpropan-1-amine","Butan-1-amine"],1,"Number from the end that gives the NH2 the lower number.","NH2 gets the low number.",0,8],["The IUPAC name of (CH3)3CNH2 is",["2-Methylpropan-1-amine","2-Methylbutan-2-amine","2-Methylpropan-2-amine","Butan-2-amine"],2,"Three-carbon chain with the NH2 and a methyl both on carbon 2.","Both on carbon 2.",0,8],["The IUPAC name of CH3CH(CH3)CH2NH2 is",["1-Methylpropan-2-amine","Butan-1-amine","2-Methylpropan-2-amine","2-Methylpropan-1-amine"],3,"The NH2 is on carbon 1 and the methyl on carbon 2.","Amine takes 1.",0,8],["The IUPAC name of CH3CH2CH(NH2)CH2CH3 is",["Pentan-2-amine","Pentan-3-amine","Pentan-4-amine","Pentan-1-amine"],1,"The NH2 is on the middle carbon of five.","Middle of five is 3.",0,8],["The IUPAC name of CH3CH(NH2)CH2CH2CH3 is",["Pentan-4-amine","Pentan-1-amine","Pentan-2-amine","Pentan-3-amine"],2,"Number from the end nearer the NH2.","Nearest end.",0,8],["The IUPAC name of CH3NHCH3 is",["2-Methylmethanamine","Dimethylmethanamine","N-Methylmethanamine","N,N-Dimethylmethanamine"],2,"The longest chain is the parent. The extra methyl is on nitrogen, so it is written N-methyl.","N marks a group on nitrogen.",0,8],["The IUPAC name of CH3CH2NHCH3 is",["N-Methylpropanamine","N-Methylethanamine","1-Methylethanamin ide","Tertiary amine","Secondary amine"],3,"Nitrogen carries two alkyl groups.","Two alkyls, secondary.",0,8],["(CH3)3N is a",["Tertiary amine","Primary amine","Secondary amine","Amide"],0,"Nitrogen carries three alkyl groups.","Three alkyls, tertiary.",0,8],["Ethanamide undergoes Hofmann degradation. The amine formed is",["Dimethylamine","Ethylamine","Methylamine","Propylamine"],2,"The amine has one carbon less than the amide.","Lose one carbon.",0,9],["Methyl bromide is treated with KCN and then reduced. The amine formed is",["Propylamine","Dimethylamine","Ethylamine","Methylamine"],2,"The nitrile route adds one carbon to the alkyl halide.","Nitrile adds a carbon.",0,9],["Which reagent set separates primary, secondary and tertiary amines?",["Hinsberg reagent followed by base","Fehling's solution on warming","Lucas reagent at room temperature","Tollens' reagent in alkaline medium"],0,"It is p-toluene sulphonyl chloride.","Hinsberg sorts amines.",0,9],["Which amine gives a yellow oily N-nitrosamine with HONO?",["Tertiary aliphatic amine","Secondary amine","Primary aromatic amine in the cold","Primary amine"],1,"A tertiary aliphatic amine just forms a salt. A primary aromatic amine gives a diazonium salt.","Secondary, nitrosamine.",0,9],["Which amine gives a diazonium salt with HONO in the cold?",["Ethylamine","Dimethylamine","Trimethylamine","Aniline"],3,"Ethylamine gives ethanol and nitrogen instead.","Aromatic 1° in cold.",0,9],["Which amine type gives N2 gas and an alcohol with nitrous acid?",["Tertiary amine","Secondary amine","Primary aliphatic amine","Aniline in the cold"],2,"RNH2 + HNO2 gives ROH + H2O + N2.","1° aliphatic, alcohol.",0,9],["Which is the weakest base?",["Ethylamine, an aliphatic amine","Methylamine, an aliphatic amine","Phenylamine (aniline)","Isopropylamine, an aliphatic amine"],2,"The nitrogen lone pair is delocalised into the ring.","Aryl is weak.",0,9],["Which method gives an amine with one more carbon than the alkyl halide?",["Hofmann deg try{ if(window.IndigeneHistory&&IndigeneHistory.registerStruct) IndigeneHistory.registerStruct('CHM102',{title:'CHM 102 \u00b7 Organic Chemistry',chapters:DATA.map(function(c){return {t:c.t,n:c.q.length,s:c.s};})}); }catch(e){}
const SUBJECT_KEY = 'chm102';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// flatten
const ALL = [];
DATA.forEach((c,ci)=>c.q.forEach((q,qi)=>ALL.push({id:ci+'_'+qi, ch:ci, stem:q[0], opts:q[1], ans:q[2], exp:q[3], hack:q[4], trap:q[5], sec:q[6]})));
const TOTAL = ALL.length;
// questions already served in earlier runs (kept per browser) so new runs favour fresh ones
let SEEN = new Set();
try{ SEEN = new Set(JSON.parse(localStorage.getItem('chm102_seen')||'[]')); }catch(e){}
function saveSeen(){ try{ localStorage.setItem('chm102_seen', JSON.stringify([...SEEN])); }catch(e){} }
// shuffle, then put unseen questions first (random order inside each half)
function freshFirst(arr){ const a=shuffle(arr.slice()); return a.filter(q=>!SEEN.has(q.id)).concat(a.filter(q=>SEEN.has(q.id))); }
const FULL_N = 500;
// fair sample: every chapter is represented in proportion to its size
function sampleFair(n){
  const groups = DATA.map((_,ci)=>freshFirst(ALL.filter(q=>q.ch===ci)));
  const exact = groups.map(g=>g.length*n/TOTAL);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a,b)=>a+b,0);
  exact.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([f,i])=>{ if(left>0 && take[i]<groups[i].length){ take[i]++; left--; } });
  let out=[]; groups.forEach((g,i)=>{ out=out.concat(g.slice(0,take[i])); });
  return shuffle(out);
}

// optional access gate (cbt-lock.js) — never breaks the quiz if missing
let lock = null;
async function loadLock(){
  try { lock = await import('../cbt-lock.js'); }
  catch(e){ try { lock = await import('/cbt-lock.js'); } catch(e2){ lock = null; } }
}
const lockReady = loadLock();

const PASS = 50;
const grade = p => p>=70?'A':p>=60?'B':p>=50?'C':p>=45?'D':p>=40?'E':'F';
let mode = 'full', sel = new Set(), secSel = null, run = [], idx = 0, weakSpec = null;
// '2.3,4.all' = chapter 2 section 3, whole of chapter 4 (sent from the History tab or the result screen)
function specPool(spec){
  const want = spec.map(s=>s.split('.')); let pool = [];
  want.forEach(([c,s])=>{ const ci=(+c)-1; if(!DATA[ci]) return;
    pool = pool.concat(ALL.filter(q=>q.ch===ci && (s==='all' || q.sec===(+s)-1))); });
  pool = shuffle(pool); return pool.length>50 ? pool.slice(0,50) : pool;
}

function renderSetup(){
  const quick = 50, half = 250;
  const cards = [
    ['full', FULL_N, 'Full CBT'],
    ['quick', quick, 'Quick Drill'],
    ['half', half, 'Half Run'],
    ['session', '🎯', 'By Chapter']
  ];
  $('runs').innerHTML = cards.map(c=>`<button class="run${c[0]===mode?' sel':''}" data-m="${c[0]}"><span class="n">${c[1]}</span>${c[2]}</button>`).join('');
  document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; renderSetup(); });
  $('chaps').classList.toggle('show', mode==='session');
  $('chapList').innerHTML = DATA.map((c,i)=>{
    const on = sel.has(i);
    let x = `<div class="chap${on?' on':''}" data-i="${i}"><span class="box" style="border-radius:50%">${on?'●':''}</span><span class="nm">Ch ${i+1}. ${esc(c.t)}</span><span class="ct">${c.q.length}</span></div>`;
    if(on){
      x += '<div class="secs"><button class="sec'+(secSel===null?' on':'')+'" data-s="all">Whole chapter · '+c.q.length+'</button>'
        + c.s.map((sn,si)=>'<button class="sec'+(secSel===si?' on':'')+'" data-s="'+si+'">'+esc(sn)+' · '+c.q.filter(q=>q[6]===si).length+'</button>').join('') + '</div>';
    }
    return x;
  }).join('');
  document.querySelectorAll('.chap').forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; sel.clear(); sel.add(i); secSel=null; renderSetup(); });
  document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{ secSel = b.dataset.s==='all' ? null : +b.dataset.s; renderSetup(); });
}

function makeItem(q){
  return { q, perm: shuffle([0,1,2,3]), pick: null };   // perm = order of original options shown 
}

async function startQuiz(){
  if(mode==='session' && sel.size===0){ toast('Pick a chapter first'); return; }
  try{ await lockReady; }catch(e){}
  if(lock && typeof lock.checkCbtAccess==='function'){
    try{
      const r = await lock.checkCbtAccess(SUBJECT_KEY);
      if(r && r.blocked){ lock.renderCbtLockScreen($('app'), r.reason); return; }
    }catch(e){}
  }
  let pool;
  if(mode==='full') pool = sampleFair(FULL_N);
  else if(mode==='quick') pool = freshFirst(ALL).slice(0,50);
  else if(mode==='half') pool = sampleFair(250);
  else if(mode==='weak') pool = specPool(weakSpec||[]);
  else {
    pool = [];
    [...sel].sort((a,b)=>a-b).forEach(ci=>{ pool = pool.concat(ALL.filter(q=>q.ch===ci && (secSel===null || q.sec===secSel))); });
  }
  if(!pool.length){ toast('Nothing to practise there'); return; }
  begin(pool);
}

let startedAt = 0, isRetry = false, saved = false;
let reviewing=false;
function begin(pool, retry){
  reviewing=false; $('finishBtn').textContent='Finish & see score';
  run = pool.map(makeItem); idx = 0; startedAt = Date.now(); isRetry = !!retry; saved = false;
  if(!retry){ pool.forEach(q=>SEEN.add(q.id)); if(SEEN.size >= TOTAL) SEEN = new Set(); saveSeen(); }
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  window.scrollTo(0,0);
  renderQ();
}

function counts(){
  let ok=0,no=0;
  run.forEach(it=>{ if(it.pick!==null){ it.pick===it.q.ans ? ok++ : no++; } });
  return {ok,no};
}

function renderQ(){
  const it = run[idx], q = it.q, c = counts();
  $('qpos').textContent = `Q ${idx+1} / ${run.length}`;
  $('sOk').textContent = c.ok; $('sNo').textContent = c.no;
  $('bar').style.width = ((c.ok+c.no)/run.length*100)+'%';
  $('chtag').textContent = `Ch ${q.ch+1} · ${DATA[q.ch].t}`;
  $('qtext').textContent = q.stem;
  const L = ['A','B','C','D'];
  const answered = it.pick!==null || reviewing;
  $('opts').innerHTML = it.perm.map((oi,pos)=>{
    let cls='opt';
    if(answered){ cls+=' locked'; if(oi===q.ans) cls+=' correct'; else if(oi===it.pick) cls+=' wrong'; }
    return `<button class="${cls}" data-oi="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join('');
  if(!answered) document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  renderFb();
  $('prev').disabled = idx===0;
  $('next').textContent = idx===run.length-1 ? (reviewing?'Done ▶':'Finish ▶') : 'Next ▶';
}

function renderFb(){
  const it = run[idx], q = it.q;
  if(it.pick===null && !reviewing){ $('fb').innerHTML=''; return; }
  const good = it.pick===q.ans;
  const pos = 'ABCD'[it.perm.indexOf(q.ans)];
  $('fb').innerHTML = `<div class="fb">
    ${q.trap?'<span class="trap">⚠ TRAP QUESTION</span>':''}
    <div class="v ${good?'ok':'no'}">${good?'✅ Correct!':it.pick===null?'⏭ Skipped — the answer is '+pos:'❌ Not quite — the answer is '+pos}</div>
    <p class="ex">${esc(q.exp)}</p>
    <div class="hk">⏱ Speed hack: ${esc(q.hack)}</div>
  </div>`;
}

function choose(oi){
  const it = run[idx];
  if(it.pick!==null || reviewing) return;
  it.pick = oi;
  try{ if(lock && typeof lock.recordCbtQuestionUsed==='function') lock.recordCbtQuestionUsed(); }catch(e){}
  renderQ();
}

$('prev').onclick=()=>{ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0);} };
$('next').onclick=()=>{ if(idx<run.length-1){ idx++; renderQ(); window.scrollTo(0,0);} else if(reviewing) backToResult(); else finish(); };
function startReview(){
  reviewing=true; idx=0;
  $('finishBtn').textContent='Back to result';
  $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  renderQ(); window.scrollTo(0,0);
}
function backToResult(){ reviewing=false; $('finishBtn').textContent='Finish & see score'; finish(); }
$('finishBtn').onclick=()=>{
  if(reviewing){ backToResult(); return; }
  const left = run.filter(i=>i.pick===null).length;
  if(left===0){ finish(); return; }
  $('cmsg').textContent = left+' question(s) not answered yet. Finish anyway?';
  $('cov').classList.add('show');
};
$('cYes').onclick=()=>{ $('cov').classList.remove('show'); finish(); };
$('cNo').onclick=()=>$('cov').classList.remove('show');

function openMap(){
  $('map').innerHTML = run.map((it,i)=>{
    let c=''; if(it.pick!==null) c = it.pick===it.q.ans?'ok':'no';
    if(i===idx) c+=' cur';
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; $('ov').classList.remove('show'); renderQ(); window.scrollTo(0,0); });
  $('ov').classList.add('show');
}
$('mapBtn').onclick=openMap;
$('closeMap').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{ if(e.target.id==='ov') $('ov').classList.remove('show'); };

function saveHistory(c){
  if(saved || isRetry) return;
  const answered = c.ok + c.no;
  if(answered<=0) return;
  saved = true;
  try{
    if(window.IndigeneHistory && typeof window.IndigeneHistory.save==='function'){
      const topics = {};
      run.forEach(it=>{
        if(it.pick===null) return;
        const k = 'Ch '+(it.q.ch+1)+' · '+DATA[it.q.ch].s[it.q.sec];
        if(!topics[k]) topics[k]=[0,0];
        topics[k][1]++; if(it.pick===it.q.ans) topics[k][0]++;
      });
      window.IndigeneHistory.save({course:'CHM102', mode:'cbt', correct:c.ok, total:answered,
        secs:Math.round((Date.now()-startedAt)/1000), topics:topics});
    }
  }catch(e){}
}
function finish(){
  const c = counts(), n = run.length, un = n-c.ok-c.no;
  const pct = n? Math.round(c.ok/n*100):0;
  const msg = pct>=70?'Outstanding. You are ready for the exam. 🔥':pct>=50?'You passed. Keep pushing higher and clear every section.':pct>=40?'Close. Revise the failed sections and run again.':'Keep going. Read the failed sections again, then retry.';
  saveHistory(c);
  const chs = {}, secs = {};
  run.forEach(it=>{
    const q = it.q, good = it.pick===q.ans;
    const a = chs[q.ch] || (chs[q.ch] = {ok:0,n:0}); a.n++; if(good) a.ok++;
    const k = q.ch+'_'+q.sec; const b = secs[k] || (secs[k] = {ch:q.ch,sec:q.sec,ok:0,n:0}); b.n++; if(good) b.ok++;
  });
  const chKeys = Object.keys(chs).map(Number).sort((x,y)=>x-y);
  const pc = x => Math.round(x.ok/x.n*100);
  const need = ci => Math.max(8, Math.ceil(DATA[ci].q.length*0.4));
  const rows = chKeys.map(ci=>{
    const a = chs[ci], s = pc(a), full = a.n>=need(ci), ok = s>=PASS;
    const sr = Object.values(secs).filter(x=>x.ch===ci).sort((x,y)=>x.sec-y.sec).map(x=>`<div class="sr"><span>${esc(DATA[ci].s[x.sec])}</span><b class="${pc(x)>=PASS?'pass':'fail'}">${x.ok}/${x.n} · ${pc(x)}%</b></div>`).join('');
    return `<details class="cres"${(full&&!ok)?' open':''}><summary><span>Ch ${ci+1} · ${esc(DATA[ci].t)}</span><b class="${!full?'na':ok?'pass':'fail'}" style="white-space:nowrap">${s}/100 · ${grade(s)} · ${!full?'PRACTICE':ok?'PASS ✔':'FAIL ✖'}</b></summary>${sr}</details>`;
  }).join('');
  const weak = Object.values(secs).filter(x=>x.n>=2 && pc(x)<PASS).sort((x,y)=>x.ch-y.ch||x.sec-y.sec);
  const revise = weak.length ? `<div class="revise"><b>Revise these sections</b>${weak.map(x=>`<div class="sr"><span>Ch ${x.ch+1} · ${esc(DATA[x.ch].s[x.sec])}</span><b class="fail">${pc(x)}%</b></div>`).join('')}</div>` : '<p class="msg pass"><b>Every section in this run is at pass mark or above.</b></p>';
  const fullKeys = chKeys.filter(ci=>chs[ci].n>=need(ci));
  const passedN = fullKeys.filter(ci=>pc(chs[ci])>=PASS).length;
  const wrong = run.filter(it=>it.pick!==null && it.pick!==it.q.ans);
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  window.scrollTo(0,0);
  $('result').innerHTML = `
    <h2>Result</h2>
    <div class="big" style="font-size:2.2rem">${pct}/100 · ${grade(pct)}</div>
    <div class="stats"><span>Correct <b>${c.ok}</b></span><span>Wrong <b>${c.no}</b></span><span>Skipped <b>${un}</b></span><span>Total <b>${n}</b></span></div>
    <p class="msg"><b class="${pct>=PASS?'pass':'fail'}">${pct>=PASS?'PASS':'FAIL'}</b> · pass mark ${PASS}/100 · ${fullKeys.length?'chapters passed in this run '+passedN+'/'+fullKeys.length:'practice run, no chapter pass or fail'}</p>
    <p class="msg">${msg}</p>
    <h2 style="margin-top:16px">Score per chapter</h2>
    ${rows}
    <p class="msg" style="font-size:.8rem;color:var(--mute)">PRACTICE means this run had under 40% of that chapter's questions, so it shows a score but no pass or fail.</p>
    ${revise}
    ${weak.length?'<button class="btn" id="weakBtn">Practice these weak sections ('+weak.length+')</button>':''}
    <button class="btn" id="reviewBtn">Review answers${wrong.length?' ('+wrong.length+' wrong)':''}</button>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="/#history=CHM102">My history</a>
    ${wrong.length?`<button class="btn" id="retryWrong">Retry wrong answers (${wrong.length})</button>`:''}
    <button class="btn ghost" id="newRun">New run</button>
    `;
  $('reviewBtn').onclick=startReview;
  if($('weakBtn')) $('weakBtn').onclick=()=>{ weakSpec=weak.map(x=>(x.ch+1)+'.'+(x.sec+1)); mode='weak'; startQuiz(); };
  if($('retryWrong')) $('retryWrong').onclick=()=>begin(shuffle(wrong.map(w=>w.q)), true);
  $('newRun').onclick=()=>{ $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); renderSetup(); window.scrollTo(0,0); };
}

document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden') || $('ov').classList.contains('show') || $('cov').classList.contains('show')) return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ const it=run[idx]; if(it.pick===null){ choose(it.perm['abcd'.indexOf(k)]); } }
  else if(e.key==='ArrowRight') $('next').click();
  else if(e.key==='ArrowLeft') $('prev').click();
});

$('startBtn').onclick=startQuiz;
renderSetup();
try{
  const pr = new URLSearchParams(location.search).get('practice');
  if(pr && /^[\d.,all]+$/.test(pr)){ weakSpec = pr.split(',').filter(Boolean); mode='weak'; startQuiz(); }
}catch(e){}
</script>
</body>
</html>
