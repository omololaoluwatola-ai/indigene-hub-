 sigma bond","Stronger than the sigma bond"],2,"The weaker pi bond breaks easily.","Pi weak.",0,2],["The colour of bromine solution disappears when added to unsaturated hydrocarbons because of",["A rearrangement","An addition reaction","A substitution reaction","An elimination reaction"],1,"Ethene plus Br2 gives colourless 1,2-dibromoethane.","Colour lost, addition.",0,2],["The product of ethene with bromine is",["1,2-Dibromoethane","Ethyne","Bromoethane","1,1-Dibromoethane"],0,"Br adds to each carbon of the double bond.","Br on both carbons.",0,2],["The multiple bond of an alkene or alkyne is attacked easily by",["Inert gases","Nucleophilic reagents","Neutral molecules only","Electrophilic reagents"],3,"It is a region of high electron density.","High electron density, electrophile.",0,2],["Alkynes add hydrogen in two steps, first giving",["An alkane then an alkene","An alcohol","An alkene and then an alkane","A ring compound"],2,"Two molecules of hydrogen add using a Ni or Pt catalyst.","Triple, double, single.",0,2],["Which catalyst is named for adding hydrogen to a double bond?",["AlCl3","Fe","Ni or Pt","H2SO4"],2,"The book writes H2/Ni or Pt catalyst for hydrogenation.","H2 uses Ni or Pt.",0,2],["An elimination reaction is",["The formation of a saturated compound from an alkene","The swapping of two atoms","The formation of an alkene from a saturated compound","The movement of a group"],2,"It is the reverse of addition.","Elimination makes the double bond.",0,3],["Elimination is characterised by",["Opening of a ring to a straight chain","Removal of a small molecule from adjacent carbons and formation of a double bond","Replacement of a hydrogen by a halogen","Addition of a small molecule to carbons"],1,"For example, an alcohol loses water to form an alkene.","Small molecule out.",0,3],["Heating ethanol with a strong acid catalyst gives",["Ethane and water","Ethene and water","Ethanal","Ethyl ether"],1,"H2SO4 removes H2O from adjacent carbons.","Alcohol minus water, alkene.",0,3],["A molecular rearrangement involves",["Removal of water from adjacent carbons","A change in the hydrocarbon skeleton with a group migrating","Addition of a halogen to a double bond","Loss of a double bond to form a ring"],1,"An atom or group migrates from one position to another.","Group migrates.",0,4],["In the book's example, 1-chlorobutane with AlCl3 rearranges to",["1,2-Dichlorobutane","Butane","2-Chlorobutane","Butene"],2,"The chlorine migrates to carbon 2 in the presence of a Lewis acid.","Cl moves to carbon 2.",0,4],["The Lewis acid used in that rearrangement is",["FeCl3","AlCl3","H2SO4","NaOH"],1,"1-Chlorobutane rearranges to 2-chlorobutane in the presence of AlCl3.","Lewis acid, AlCl3.",0,4],["A reaction mechanism is the",["Detailed steps by which reactants change into products","Final yield of a reaction product","Rate of heating used in a reaction","Colour change seen during a reaction"],0,"The book defines it as detailed knowledge of the steps involved in the change of reactants to products.","Mechanism, step by step.",0,4],["Which catalyst is used with hydrogen to saturate a C=C bond?",["Fe or AlCl3","Zn and Cr oxide","Alumina","Ni or Pt"],3,"The book writes H2 with Ni or Pt as the hydrogenation catalyst.","H2 needs Ni or Pt.",0,5],["Ethene is passed into bromine solution. The red-brown colour",["Disappears, forming 1,2-dibromoethane","Turns yellow, forming ethanol","Stays, because ethene is saturated","Turns green, forming bromoethane"],0,"Br2 adds across the double bond and the product is colourless.","Colour fades = unsaturated.",0,5],["Ethanol heated with a strong acid catalyst is an example of",["Molecular rearrangement","Elimination","Addition","Substitution"],1,"Water is removed from adjacent carbons and a double bond forms.","Lose water, make alkene.",0,5],["When an alkyne is hydrogenated, how many H2 add?",["One only, stopping at the alkane stage","None at all, as alkynes are unreactive","Three, giving a cycloalkane ring","Two, first giving an alkene and then an alkane"],3,"The triple bond takes two molecules of hydrogen in two steps.","Alkyne takes two H2.",0,5],["The attacking species in the substitution of haloalkane and of benzene are",["Nucleophile and electrophile respectively","Nucleophiles in both cases","Electrophiles in both cases","Electrophile and nucleophile respectively"],0,"Haloalkanes meet nucleophiles. The electron-rich benzene ring meets electrophiles.","Haloalkane Nu, benzene E.",0,5],["1-Chlorobutane changes to 2-chlorobutane with AlCl3. The reaction is",["A molecular rearrangement","An addition","A nucleophilic substitution","An elimination"],0,"The chlorine migrates to carbon 2 and AlCl3 acts as a Lewis acid.","Group moves, rearrangement.",0,5],["The bromine colour fades with which compound?",["Ethane","Ethene","Methane","Cyclohexane"],1,"Only unsaturated hydrocarbons add bromine and decolourise it.","Unsaturated fades Br2.",0,5]]},{"t":"Benzene","s":["Structure and properties of benzene","Derivatives and uses of benzene","Nomenclature of benzene compounds","Preparation of benzene","Reactions of benzene: electrophilic substitution","Nitration and sulphonation","Reagents, conditions and traps"],"q":[["Benzene is the prototype of",["A heterocyclic compound","An alicyclic compound","An aromatic compound","An aliphatic compound"],2,"The book calls it the prototype of an aromatic compound, unsaturated but showing a low degree of reactivity.","Benzene, aromatic.",0,0],["The molecular formula of benzene is",["C5H6","C6H12","C6H5","C6H6"],3,"Six carbons in a ring, each with one hydrogen.","Six and six.",0,0],["Benzene is classified as a",["Ketone with a C=O group","Alcohol with an OH group","Hydrocarbon","Ether with a C–O–C link"],2,"It contains only carbon and hydrogen.","C and H only.",0,0],["Kekulé's structure of benzene was proposed in",["1885","1875","1856","1865"],3,"The book gives the Kekulé structure as 1865.","Kekulé, 1865.",0,0],["Benzene was found to have how many monosubstituted products?",["One","Three","Four","Two"],0,"The Kekulé structure has only one monosubstituted product.","Mono, one.",0,0],["Every disubstituted derivative of benzene appears as how many isomers?",["Three","Four","Two","One"],0,"The three isomers are ortho, meta and para.","Di, three isomers.",0,0],["The three disubstituted isomers correspond to",["Alpha, beta and gamma","Ortho, meta and para","Primary, secondary and tertiary","Cis, trans and gem"],1,"They are the 1,2 (ortho), 1,3 (meta) and 1,4 (para) positions.","o, m, p.",0,0],["In benzene each carbon uses its three sp2 orbitals to bond with",["Three hydrogens","Two carbons and one hydrogen","One carbon and two hydrogens","Three carbons"],1,"Two orbitals form sigma bonds with two carbons and the third with hydrogen.","Two C and one H.",0,0],["Benzene undergoes mainly",["Elimination","Substitution rather than addition","Addition rather than substitution","Polymerisation"],1,"Substitution keeps the aromatic ring intact.","Benzene substitutes.",0,0],["All the bond angles in benzene are",["Equal","Different","Tetrahedral","Linear"],0,"The book says all the angles in benzene are equal.","Planar hexagon, equal.",0,0],["The boiling point of benzene is",["120 °C","60 °C","80 °C","100 °C"],2,"The book gives a boiling point of 80 °C and melting point of 5.5 °C.","Benzene boils at 80.",0,0],["The melting point of benzene is",["15.5 °C","0 °C","−5.5 °C","5.5 °C"],3,"Benzene is a colourless liquid with a melting point of 5.5 °C.","Melts 5.5.",0,0],["Benzene is",["Soluble in water at all ratios","Insoluble in water but soluble in organic solvents","Soluble in water only, not in solvents","Insoluble in all liquids at all"],1,"It is a good solvent for fats, resins, iodine, sulphur and phosphorus.","Non-polar, no water.",0,0],["Benzene burns with a",["Blue flame","Sooty flame","Smokeless flame","Green flame"],1,"The book says it is inflammable and burns with a sooty flame.","Benzene, soot.",0,0],["Benzene is described in the book as",["An antiseptic","Edible","Carcinogenic","Harmless"],2,"Benzene is carcinogenic.","Benzene, cancer risk.",0,0],["Which of these is a derivative of benzene?",["Aniline","Cyclohexane","Pentane","Ethanol"],0,"Phenol, toluene and aniline are derivatives of benzene.","Replace H on benzene.",0,1],["Linking two benzene rings gives",["Pyridine","Biphenyl","Naphthalene","Anthracene"],1,"Biphenyl is C6H5–C6H5.","Two linked, bi.",0,1],["Fused aromatic hydrocarbons include",["Naphthalene and anthracene","Pyridine and phenol, with one ring","Phenol and aniline, with one ring","Toluene and xylene, with one ring"],0,"Further loss of hydrogen gives fused rings.","Fused, naph, anthra.",0,1],["Replacing one CH of benzene with N gives",["Pyridazine","Pyridine","Pyrimidine","Pyrazine"],1,"Pyridine is C5H5N.","One N, pyridine.",0,1],["Replacing a second CH of benzene with N can give pyridazine, pyrimidine or",["Phenol","Pyridine","Pyrazine","Toluene"],2,"The result depends on the location of the second N.","Two N, pyrazine.",0,1],["Benzene cannot be converted into pyridine, although they are",["Isomers of the same formula","Soluble in water in all ratios","Identical in every property","Structurally related"],3,"The book states that although benzene and pyridine are structurally related, benzene cannot be converted into pyridine.","Related, not convertible.",1,1],["Benzene is mainly used as",["An intermediate to make other chemicals","A fuel additive for petrol only","A food preservative in drinks","A drug taken by mouth"],0,"Cyclohexane, ethylbenzene and nitrobenzene are made from it.","Benzene feeds other chemicals.",0,1],["More than half of benzene production goes into",["Cumene","Cyclohexane","Ethylbenzene","Nitrobenzene"],2,"Ethylbenzene is the precursor to styrene for polymers and plastics.","Ethylbenzene to styrene.",0,1],["Toluene is used as a substitute for benzene because it is",["A solid at room temperature","More toxic and has a narrower range","Less toxic and has a wider liquid range","Insoluble in organic solvents"],2,"The solvent properties are similar.","Toluene, safer.",0,1],["Toluene can also be processed into",["Benzene","Cyclohexane","Phenol","Aniline"],0,"The book says toluene is also processed into benzene.","Toluene returns to benzene.",0,1],["Nitrobenzene is a",["Monosubstituted benzene","Disubstituted benzene","Trisubstituted benzene","Polycyclic benzene"],0,"It has one –NO2 group on the ring.","One group, mono.",0,2],["Toluene, phenol and benzoic acid are examples of benzene names where",["The substituent is only a prefix","A new base name is formed","No substituent is present","Numbers are required"],1,"These are new base names for monosubstituted benzenes.","Toluene, phenol, benzoic acid.",0,2],["The positions of substituents on benzene can be shown by",["Alphabetical order of the groups only","Roman numerals such as I and II only","Greek letters such as α and β only","Numbers or o-, m-, p- prefixes"],3,"The book gives 1,3-dichlorobenzene as m-dichlorobenzene.","Numbers or o, m, p.",0,2],["1,3-Dichlorobenzene is also called",["Dichlorotoluene","m-Dichlorobenzene","o-Dichlorobenzene","p-Dichlorobenzene"],1,"1,3 is the meta position.","1,3 meta.",0,2],["The phenyl group name is usually used when the substituent has",["Only one carbon attached to the ring","Less than four carbons attached to the ring","More than four carbons attached to the ring","No carbon attached to the ring"],2,"The book gives this rule for phenyl naming.","Long chain, phenyl.",0,2],["1-Chloro-3-ethylbenzene lists the substituents",["By size","Alphabetically","By formula mass","Randomly"],1,"Chloro comes before ethyl.","C before E.",0,2],["In catalytic reforming, the hydrocarbon mixture has boiling points between",["60 and 200 °C","20 and 60 °C","200 and 350 °C","0 and 40 °C"],0,"The mixture is blended with hydrogen and passed over a catalyst.","Reforming, 60–200.",0,3],["The catalyst for catalytic reforming is",["Aluminium chloride, used in acylation","Nickel oxide, used in hydrogenation","Iron(III) chloride, used in halogenation","Bifunctional platinum chloride or rhenium chloride"],3,"The book says bifunctional platinum chloride or rhenium chloride catalyst.","Pt or Re chloride.",0,3],["Catalytic reforming temperature is",["80–100 °C","200–250 °C","1000 °C","500–525 °C"],3,"Pressures range from 8 to 50 atm.","Reforming, about 500.",0,3],["After reforming, aromatics are separated by extraction with",["Diethylene glycol or sulfolane","Hexane only, with no other solvent","Water only, with no organic solvent","Ethanol only, with no other solvent"],0,"Benzene is then separated by distillation.","Glycol or sulfolane.",0,3],["Toluene hydrodealkylation converts toluene to",["Phenol","Aniline","Xylene","Benzene"],3,"The reaction is C6H5CH3 + H2 → C6H6 + CH4.","Toluene loses CH3.",0,3],["The by-product of toluene hydrodealkylation is",["Methane","Ethane","Carbon dioxide","Water"],0,"Toluene undergoes dealkylation to benzene and methane.","Lose methyl, get methane.",0,3],["The catalysts for toluene hydrodealkylation are oxides of",["Sodium, potassium or calcium","Iron, nickel or copper","Chromium, molybdenum or platinum","Aluminium, zinc or tin"],2,"The temperature is 500–600 °C and the pressure is 40–60 atm.","Cr, Mo, Pt oxides.",0,3],["Decarboxylation of benzoic acid with soda lime gives",["Phenol, by loss of CO","Benzaldehyde, by loss of CO2","Toluene and water, by loss of H2O","Benzene and carbon dioxide"],3,"C6H5COOH loses CO2 to form benzene.","Lose CO2.",0,3],["The most common reaction of benzene is",["Elimination from the ring","Free radical addition to the ring","Electrophilic aromatic substitution","Nucleophilic addition to the ring"],2,"A proton is replaced by another group.","Benzene, electrophilic substitution.",0,4],["In halogenation of benzene, the catalyst is usually",["Fe or AlCl3","Ni or Pt","NaOH","H2SO4"],0,"The book says halogenation is usually catalysed by metals with empty d-orbitals.","Halogen, Fe.",0,4],["The metals used in halogenation can polarise the halogen because they have",["Empty d-orbitals","A large charge","Filled p-orbitals","No electrons"],0,"The empty d-orbitals can induce an electromeric effect on the substrate.","Empty d.",0,4],["Chlorination of benzene gives",["An alkyl chloride","An acid chloride","An aryl chloride","An alcohol"],2,"ArH + Cl2 gives ArCl + HCl.","Benzene plus Cl, aryl chloride.",0,4],["The first step of electrophilic substitution produces",["A neutral molecule with no charge","A positively charged electrophile","A negatively charged nucleophile","A free radical with one electron"],1,"The reactant produces a positively charged ion that attacks the ring.","Electrophile is positive.",0,4],["The electrophile in nitration is",["The nitronium ion (NO2+)","The nitrate ion (NO3−)","The nitrite ion (NO2−)","The hydronium ion"],0,"It is generated when sulphuric acid acts on nitric acid.","Nitration, NO2+.",0,5],["In generating the nitronium ion, sulphuric acid acts as the",["Catalyst only","Solvent only","Base, with nitric acid as acid","Acid, with nitric acid as the base"],3,"The stronger acid causes nitric acid to ionise.","H2SO4 is the acid.",0,5],["The carbocation formed when the nitronium ion attacks benzene is called",["Phenyl ion","Tropylium ion","Benzenonium ion","Carbanion"],2,"The carbocation is often called a benzenonium ion.","Benzene plus ion, benzenonium.",0,5],["The slow step in nitration of benzene is",["Formation of NO2+","Formation of the carbocation","Product separation","Loss of the hydrogen ion"],1,"Attack of NO2+ on benzene is slow and loss of H+ is fast.","Slow step, carbocation.",0,5],["After the carbocation forms, the reaction ends by loss of",["A hydrogen ion","An electron pair only","A carbon atom","A nitro group"],0,"HSO4− removes H+ and the ring keeps its resonance-stabilised aromatic character.","Lose H+, keep aromatic.",0,5],["Why does the carbocation not simply add a base like an alkene?",["The ring has no electrons to give","That would destroy the aromatic character of the ring","The base is too weak to add on","The ring is saturated and cannot add"],1,"Instead a hydrogen ion is removed to give the substitution product.","Keep the ring aromatic.",0,5],["Sulphonation of benzene gives",["Chlorobenzene, from chlorine","Nitrobenzene, from nitric acid","Phenol, from water","Benzene sulphonic acid"],3,"C6H6 + HOSO3H gives C6H5SO3H + H2O.","Sulphonation, sulphonic acid.",0,5],["Catalytic reforming to make aromatics runs at",["60–200 °C","300–350 °C","80–110 °C","500–525 °C"],3,"60–200 °C is the boiling range of the feed, not the reaction temperature.","Reforming, 500–525.",0,6],["The pressure range for catalytic reforming is",["1 to 5 atm","40 to 60 atm","8 to 50 atm","100 to 200 atm"],2,"40–60 atm belongs to toluene hydrodealkylation.","Reforming 8–50 atm.",0,6],["Toluene hydrodealkylation runs at",["200–300 °C and 10 atm","60–200 °C and 1 atm","500–600 °C and 40–60 atm","500–525 °C and 8–50 atm"],2,"The 500–525 °C and 8–50 atm figures belong to catalytic reforming.","Dealkylation, 40–60 atm.",0,6],["Which catalyst is used in catalytic reforming?",["Iron or aluminium chloride","Bifunctional platinum chloride or rhenium chloride","Oxides of chromium, molybdenum or platinum","Nickel or palladium on carbon"],1,"The oxides of chromium, molybdenum or platinum are for hydrodealkylation.","Reforming, Pt or Re chloride.",0,6],["Which catalyst is used in toluene hydrodealkylation?",["Fe or AlCl3","Soda lime","Bifunctional platinum chloride or rhenium chloride","Oxides of chromium, molybdenum or platinum"],3,"The platinum chloride catalyst is the one for reforming.","Dealkylation, metal oxides.",0,6],["Which reagent mixture nitrates benzene?",["Dilute HNO3 with water","Conc. HNO3 with conc. H2SO4","Conc. HCl with ZnCl2","HNO3 with FeBr3"],1,"Sulphuric acid helps nitric acid to give the nitronium ion, NO2+.","Nitric plus sulphuric.",0,6],["Which reagent and catalyst chlorinate benzene?",["HCl with ZnCl2 as catalyst","Cl2 in water at room temp","Cl2 with Ni as catalyst","Cl2 with Fe or AlCl3"],3,"Metals with empty d-orbitals polarise the halogen.","Halogen needs Fe or AlCl3.",0,6],["Benzene prefers substitution to addition because addition would",["Make the ring more stable","Need a nucleophilic reagent","Make the ring bigger","Destroy the aromatic ring"],3,"Substitution keeps the aromatic ring intact.","Keep the ring.",0,6],["After reforming, aromatics are removed from the mixture by extraction with",["Mercuric salts in water","Soda lime on heating","Diethylene glycol or sulfolane","Dilute sulphuric acid solution"],2,"Benzene is then separated by distillation.","Extract, then distil.",0,6]]},{"t":"Isomerism in Organic Chemistry","s":["Isomers and the two types","Chain isomerism","Position isomerism","Functional group, skeletal and tautomeric isomerism","Geometric isomerism","Optical isomerism","Racemic forms, diastereomers and meso compounds","Reagents, conditions and traps"],"q":[["Isomerism is broadly classified into",["Structural and stereo types","Chain and position types","Cis and trans types","Geometric and optical types"],0,"The book splits isomerism into structural isomerism and stereoisomerism.","Two big types: structural and stereo.",0,0],["Isomers are molecules that have the same",["Structural formula but different molecular formula","Functional group but different formula overall","Molecular formula but different arrangement of atoms","Molecular mass but different elements present"],2,"They share a molecular formula but differ in atom arrangement.","Same formula, different arrangement.",0,0],["Structural isomers are also called",["Optical isomers","Constitutional isomers","Geometric isomers","Conformational isomers"],1,"The book says structural isomers are also called constitutional isomers.","Structural, constitutional.",0,0],["Structural isomers have",["The same arrangement in space but different bonding","The same molecular formula but different structural formula","The same structural formula but a different molecular formula","Different molecular formula and different functional groups"],1,"The compounds are arranged in a completely different order.","Same molecular, different structural.",0,0],["Structural isomers in the same homologous series with the same functional groups",["Have identical chemical properties and identical physical properties","Have similar chemical properties but different physical properties","Have different chemical properties and similar physical ones","Have no chemical properties in common at all"],1,"Physical and chemical properties both differ if the isomers are in different series with different groups.","Same group, same chemistry.",0,0],["How many chain isomers does butane (C4H10) have?",["Five","One","Three","Two"],3,"There are only two butanes, but three pentanes and 18 octanes.","Butane, two.",0,0],["How many isomers does pentane (C5H12) have?",["Three","Four","Two","Five"],0,"The book says there are three pentanes.","Pentane, three.",0,0],["How many constitutional isomers does C8H18 have?",["35","18","12","8"],1,"The book says there are 18 octanes.","Octane, 18.",0,0],["The number of constitutional isomers of C20H42 is no fewer than",["36,319","1,366","3,319","366,319"],3,"The number of isomers increases greatly with the number of atoms.","20 carbons, 366,319.",0,0],["Chain isomerism arises from",["A double bond","Different functional groups","Movement of a functional group","Branching of the carbon chain"],3,"Butane has a straight-chain and a branched isomer.","Chain, branching.",0,1],["Which is a chain isomer of pentane?",["2,2-Dimethylpropane","Pentan-2-ol, with an OH group","Pent-1-ene, with a double bond","Cyclopentane, with a closed ring"],0,"The three chain isomers are pentane, 2-methylbutane and 2,2-dimethylpropane.","Same formula, branched.",0,1],["Which of these is a chain isomer of butane?",["2-Methylpropane","Butan-1-ol, an alcohol","But-1-ene, an alkene","Cyclobutane, a closed ring"],0,"2-Methylpropane (isobutane) is the branched isomer.","Branched butane.",0,1],["In position isomerism the",["Functional group changes but the skeleton stays","Number of atoms differs but the skeleton stays","Carbon skeleton stays the same but a group moves","Carbon skeleton changes but the group stays put"],2,"Important groups such as functional groups are moved around the skeleton.","Same skeleton, group moves.",0,2],["1-Bromopropane and 2-bromopropane are",["Functional group isomers","Geometric isomers","Chain isomers","Position isomers"],3,"The bromine is at the end in one and in the middle in the other.","Br moves, position.",0,2],["Butan-1-ol and butan-2-ol are",["Tautomers","Optical isomers","Chain isomers","Position isomers"],3,"The –OH group is on carbon 1 or 2 of the same skeleton.","OH moves, position.",0,2],["2-Methylpropan-1-ol and 2-methylpropan-2-ol are isomers of",["Pentanol","Butanal","Butanol","Propanol"],2,"The book lists them as the other two isomers of butanol.","C4H9OH, butanol.",0,2],["How many butanol isomers does the book list?",["Three","Four","Five","Two"],1,"They are butan-1-ol, butan-2-ol, 2-methylpropan-1-ol and 2-methylpropan-2-ol.","Butanol, four.",0,2],["In benzene rings, position isomerism arises from",["The length of the side chain attached","The number of double bonds in the ring","The size of the ring and its stability","The position of the substituent on the ring"],3,"Different positions of chlorine on the ring give different isomers.","Ring, position.",0,2],["Propanal and propanone are",["Functional group isomers","Position isomers of the carbonyl group","Geometric isomers about a double bond","Chain isomers of the carbon skeleton"],0,"Propanal is an aldehyde and propanone is a ketone, both C3H6O.","Aldehyde vs ketone.",0,3],["In functional group isomerism, the isomers have",["Different molecular formula","The same functional group","Different functional groups","Different carbon number"],2,"The book gives propanal and propanone as the example.","Different groups.",0,3],["Cyclopropane is isomeric with",["Propyne","Propene","Propanol","Propane"],1,"Cyclic alkanes are isomeric with alkenes.","Ring alkane, alkene.",0,3],["Skeletal isomers differ in",["The position of the group","The main carbon chain","Space arrangement","The functional group"],1,"This is most identifiable in secondary and tertiary alcohol isomers.","Skeleton, chain differs.",0,3],["Tautomers are structural isomers that",["Are mirror images of one another","Spontaneously interconvert even when pure","Differ in the number of carbon atoms","Cannot interconvert unless a catalyst is added"],1,"They have different chemical properties and distinct reactions.","Tautomers swap by themselves.",0,3],["Keto/enol tautomerism differs by the position of",["A carbon atom","A proton","A double bond only","A halogen"],1,"The proton is alternately on carbon or oxygen.","Proton moves.",0,3],["If interconversion of tautomers is fast enough,",["They cannot be isolated from each other","They form a racemic mixture on standing","They are always isolated as separate forms","They become enantiomers of each other"],0,"Fast interconversion prevents isolation.","Too fast to separate.",0,3],["Stereoisomers have the same",["Different atoms but the same arrangement in space","Molecular and structural formula but different arrangement in space","Molecular formula but different structural formula","Different functional groups but similar arrangement"],1,"They are classified by symmetry properties.","Same structure, different space.",0,4],["Geometric isomerism involves a",["Ring of six carbons with delocalised pi","Triple bond with a linear shape only","Single bond that allows free rotation fully","Double bond that does not allow free rotation"],3,"Usually a C=C bond. The isomers are not superimposable.","Double bond, no rotation.",0,4],["Cis-but-2-ene and trans-but-2-ene are",["Functional group isomers","Geometric isomers","Chain isomers","Optical isomers"],1,"The groups lie on the same or opposite side of the double bond.","Cis and trans, geometric.",0,4],["Maleic acid is the",["Position isomer of succinic acid","Trans isomer of butenedioic acid","Cis isomer of butenedioic acid","Optical isomer of fumaric acid"],2,"The book says cis-butenedioic acid is maleic acid.","Maleic, cis.",0,4],["Fumaric acid is the",["Trans isomer of butenedioic acid","Chain isomer of maleic acid","Cis isomer of butenedioic acid","Racemic form of maleic acid"],0,"The book says trans-butenedioic acid is fumaric acid.","Fumaric, trans.",0,4],["Optical isomerism occurs when an atom is bonded to",["A double bond and a single bond","Three different atoms or groups only","Two identical atoms or groups only","Four different atoms or groups"],3,"Usually a carbon atom. The isomers exist in pairs that are mirror images.","Four different, optical.",0,5],["Optical isomers exist as",["Cis and trans forms of the alkene","Mirror images of each other","Identical molecules in every respect","Chain forms of the same carbon skeleton"],1,"One isomer is the mirror image of the other.","Mirror pairs.",0,5],["Butan-2-ol shows optical isomerism because",["It has a double bond between the carbons","It is a ring with a hydroxyl group","Carbon 2 holds four different groups","It has two OH groups on the chain"],2,"The groups on C2 are H, OH, CH3 and C2H5.","Four different groups on C2.",0,5],["Non-superimposable mirror images are called",["Meso compounds","Tautomers","Diastereomers","Enantiomers"],3,"The central carbon with four different groups is the asymmetrical carbon.","Mirror images, enantiomers.",0,5],["An asymmetrical carbon atom is one attached to",["Two identical atoms or groups only","A double bond to a neighbouring carbon","Three hydrogens and one other group","Four different atoms or groups"],3,"It is the central carbon of the optical isomers.","Asymmetric, four different.",0,5],["A symmetry plane",["Joins two molecules into one compound","Is a point at the centre of the molecule","Divides a molecule into equivalent halves","Breaks a bond in the molecule"],2,"Like a mirror placed so one half is a mirror image of the other.","Plane splits in two.",0,5],["A chiral stereoisomer",["Has a plane of symmetry","Has a centre of symmetry","Has no plane or centre of symmetry","Is superimposable on its mirror image"],2,"A chiral stereoisomer is not superimposable on its mirror image.","Chiral, no symmetry.",0,5],["A racemic form is",["An equal mixture of the two enantiomers","A pair of diastereomers in equal amounts","A single pure enantiomer of the compound","A meso compound with a symmetry plane"],0,"The book says a mixture of equal members of each enantiomer is the racemic form.","Racemic, 50:50.",0,6],["Racemization is",["Conversion of an enantiomer into a racemic form","Separation of enantiomers into pure forms","Formation of a double bond from a single bond","Conversion of a cis isomer into a trans form"],0,"Racemization converts an enantiomer into a racemic mixture.","Racemization makes the mix.",0,6],["Resolution is",["Conversion of one enantiomer into a mixture of both","Removal of a double bond from the chain","Separation of a racemic form into individual enantiomers","Formation of a ring from a straight chain"],2,"Resolution separates the two enantiomers.","Resolution splits.",0,6],["Stereoisomers that are not mirror images are called",["Diastereomers","Enantiomers","Racemates","Tautomers"],0,"They occur in compounds having more than one chiral centre.","Not mirror, diastereomers.",0,6],["Diastereomers occur in compounds with",["Only a double bond","Only one chiral centre","More than one chiral centre","No chiral centre"],2,"The book's example is 2-chloro-3-pentanol.","Many centres, diastereomers.",0,6],["A molecule is achiral if it",["Is not superimposable on its mirror image","Is a racemic mixture of two forms","Is superimposable on its mirror image","Has four different groups on one carbon"],2,"Most achiral molecules have a plane or centre of symmetry.","Superimposable, achiral.",0,6],["Achiral molecules that contain a stereocentre are called",["Racemic forms","Diastereomers","Meso compounds","Enantiomers"],2,"The book calls achiral molecules with a stereocentre meso.","Achiral with stereocentre, meso.",0,6],["Which of these shows geometric (cis–trans) isomerism?",["But-2-ene","Ethene","Propene","But-1-ene"],0,"Each carbon of the double bond in but-2-ene has two different groups.","Two different groups each end.",0,7],["Why can ethene not show cis–trans isomerism?",["Ethene has a triple bond between its two carbons","Ethene has too many carbons in its chain to be fixed","Ethene has free rotation about its double bond always","Each carbon of the double bond holds two identical hydrogens"],3,"You need two different groups on each double-bond carbon.","Identical H, no cis-trans.",0,7],["Which of these shows optical isomerism?",["CH3CH(OH)COOH","CH3CH2OH","(CH3)2CHOH","CH3COOH"],0,"Carbon 2 holds four different groups: H, OH, CH3 and COOH.","Four different groups.",0,7]]},{"t":"Alcohols","s":["Classification and naming","Physical properties","Industrial preparation","Laboratory preparation: hydrolysis, Grignard and reduction","Oxymercuration, hydroboration, aldol and hydroxylation","Chemical properties","Oxidation and tests for alcohols","Naming practice: alcohols","Reagents, conditions and traps"],"q":[["The general formula of alcohols is",["CnH2nOH","CnH2n+1OH","CnH2n-1OH","CnH2n+2OH"],1,"Alcohols have at least one –OH (hydroxyl) group.","Alkyl plus OH.",0,0],["The functional group of alcohols is called the",["Carboxyl group","Carbonyl group","Hydroxyl group","Amino group"],2,"The book calls the –OH group the hydroxyl group.","OH, hydroxyl.",0,0],["Alcohols are classified as 1°, 2° or 3° by",["The boiling point of the alcohol formed","The number of R groups on the carbon bearing the OH","The number of carbons in the main chain","The number of OH groups in the molecule"],1,"Primary has one R, secondary two and tertiary three on the carbinol carbon.","Count R on the OH carbon.",0,0],["A tertiary alcohol has the OH carbon attached to",["One R group","Three R groups","Three hydrogens","Two R groups"],1,"The OH carbon has no hydrogen.","3° means three R.",0,0],["Alcohols are also classified by the number of OH groups per molecule as",["Primary, secondary and tertiary","Monohydric, dihydric and trihydric","Open and closed","Saturated and unsaturated"],1,"One OH is monohydric, two dihydric and three trihydric.","Mono, di, tri-hydric.",0,0],["Ethylene glycol (1,2-ethanediol) is a",["Dihydric alcohol","Tertiary alcohol","Trihydric alcohol","Monohydric alcohol"],0,"It has two –OH groups.","Two OH, dihydric.",0,0],["Glycerol (1,2,3-propanetriol) is a",["Trihydric alcohol","Dihydric alcohol","Monohydric alcohol","Primary alcohol only"],0,"It has three –OH groups.","Three OH, trihydric.",0,0],["In the carbinol system, CH3CH2OH is named",["Ethylcarbinol","Carbinol","Dimethylcarbinol","Methylcarbinol"],3,"The carbon bearing OH is called carbinol and the rest is the alkyl group.","Ethanol is methylcarbinol.",1,0],["Triphenylcarbinol has the carbinol carbon bonded to",["Three ethyl groups","One phenyl group","Three methyl groups","Three phenyl groups"],3,"The carbinol carbon carries three phenyl groups and the OH.","Tri, three phenyl.",0,0],["The IUPAC name of (CH3)2CHCH2CH2OH type 2-methylbutan-1-ol shows the OH is on carbon",["3","1","4","2"],1,"2-Methylbutan-1-ol has OH at C1 and methyl at C2.","Number from the OH.",0,0],["Ethylene glycol is also named",["1,1-Ethanediol","1,2-Ethanediol","1,3-Propanediol","Ethanol"],1,"Both OH groups are on adjacent carbons.","Glycol, 1,2-diol.",0,0],["The boiling point of alcohols increases with",["Increasing branching","Increasing molecular weight","Decreasing polarity","Decreasing molecular weight"],1,"It decreases with branching.","Heavier, higher boiling.",0,1],["Branching in an alcohol chain",["Increases the boiling point","Decreases the boiling point","Has no effect","Makes it a solid"],1,"Boiling point is affected by molecular weight and shape.","Branched, lower bp.",0,1],["Alcohols have higher boiling points than aldehydes of similar mass because of",["Higher dipole moment of the C=O group","Intermolecular hydrogen bonding","Ionic bonds between the molecules","Greater density of the liquid alcohol"],1,"The book notes that alcohols boil higher even though aldehydes are more polar.","Alcohols hydrogen bond.",1,1],["Which compound in the book's table has the highest boiling point?",["n-Pentane","n-Butyraldehyde","n-Butyl alcohol","n-Propyl chloride"],2,"The boiling points are 118, 76, 47 and 36 °C.","Hydrogen bond wins.",0,1],["The boiling point of ethylene glycol is",["97 °C","118 °C","197 °C","78 °C"],2,"It forms double intermolecular hydrogen bonding.","Two OH, very high bp.",0,1],["The boiling point of ethanol is",["78.3 °C","64.5 °C","118 °C","97 °C"],0,"The book gives 78.3 °C for ethanol.","Ethanol, 78.",0,1],["The boiling point of methanol is",["64.5 °C","97 °C","78.3 °C","100 °C"],0,"Methanol is the first member of the series with n = 1.","Methanol, 64.5.",0,1],["The solubility of alcohols in water decreases as",["The OH group increases in number","The molecule gets smaller in size","The temperature of the water falls","The R group (non-polar end) gets longer"],3,"Lower alcohols have infinite solubility in water.","Long R, less soluble.",0,1],["Lower alcohols have what solubility in water?",["Infinite","Very low","Zero","Moderate only"],0,"The solubility decreases with longer members.","Small alcohols mix fully.",0,1],["The melting point of alcohols",["Decreases with increasing molecular weight","Drops sharply with each extra carbon","Stays the same whatever the weight","Increases with increasing molecular weight"],3,"The book notes that ethanol and propanol show deviation from this trend.","Heavier, higher mp.",0,1],["Fermentation is the gradual decomposition of",["A larger organic molecule such as starch into simpler molecules","Ethanol into starch by the action of yeast","Ethene into alcohol by acid catalysis","Glucose into a polymer by strong heating"],0,"Starch is converted to ethanol and carbon dioxide in the presence of yeast enzymes.","Starch to ethanol.",0,2],["The enzymes for fermentation are supplied by",["Yeast","Bacteria in soil","Starch","Water"],0,"Yeast contains enzymes.","Yeast, enzymes.",0,2],["Distilling the fermented mixture gives about",["50% ethanol","20% ethanol","100% ethanol","90–95% ethanol"],3,"The crude alcohol is distilled to 90–95% ethanol.","Distillation, 90–95.",0,2],["The enzyme that changes maltose to glucose is",["Zymase","Lipase","Pepsin","Maltase"],3,"Maltase hydrolyses maltose into glucose and fructose units.","Maltase, maltose.",0,2],["The enzyme that changes glucose to ethanol and carbon dioxide is",["Zymase","Maltase","Amylase","Lipase"],0,"Zymase converts glucose/fructose into ethanol and CO2.","Zymase, ethanol.",0,2],["Ethanol can be further purified by redistilling with",["Ether","Acetone","Hexane","Benzene"],3,"The book says benzene is added and ethanol is redistilled at 78.3 °C.","Add benzene.",0,2],["Hydration of alkenes uses alkenes obtained from",["Petroleum cracking","Coal tar from the gas works","Fermentation of sugars by yeast","Wood distillation in a closed retort"],0,"The alkenes react with water or dilute H2SO4.","Alkene, cracking.",0,2],["Hydration of an alkene is carried out using",["H2O with dilute H2SO4","LiAlH4 in dry ether solvent","KMnO4 in cold dilute solution","NaOH in aqueous solution, warm"],0,"The alkene adds H and OH across the double bond.","Alkene plus water.",0,2],["Destructive distillation of wood gives a liquid called",["Wood spirit acid","Formic liquor","Pyroligneous acid","Pyrolytic oil"],2,"It contains methanol, ethanoic acid, acetone, methyl ethanoate, ammonia and amines.","Wood heat, pyroligneous.",0,2],["Methanol is made industrially by catalytic reduction of CO with a catalyst of",["Iron and aluminium","Zinc and chromium oxide","Nickel and platinum","Copper and tin"],1,"CO + 2H2 gives CH3OH.","CO + 2H2, Zn and Cr oxide.",0,2],["Hydrolysis of an alkyl halide with KOH gives",["An alkene","An acid","An alcohol","An ether"],2,"RX + KOH gives ROH + KX.","Halide to alcohol.",0,3],["Benzyl chloride with aqueous NaOH gives",["Phenol","Benzaldehyde","Benzyl alcohol","Toluene"],2,"The chlorine is replaced by OH.","Benzyl chloride, benzyl alcohol.",0,3],["Methanal (HCHO) with a Grignard reagent, then hydrolysis, gives a",["Secondary alcohol","Primary alcohol","Ketone","Tertiary alcohol"],1,"Methanal + GR gives a 1° alcohol.","HCHO, primary.",0,3],["Other aldehydes with a Grignard reagent give a",["Secondary alcohol","Primary alcohol","Tertiary alcohol","Ether"],0,"Other aldehydes + GR give 2° alcohols.","Aldehyde, secondary.",0,3],["Ketones with a Grignard reagent give a",["Secondary alcohol","Ether","Primary alcohol","Tertiary alcohol"],3,"Ketones + GR give 3° alcohols.","Ketone, tertiary.",0,3],["Ethylene oxide with a Grignard reagent gives a",["Primary alcohol","Tertiary alcohol","Secondary alcohol","Ketone"],0,"The product is a 1° alcohol.","Epoxide, primary.",0,3],["An ester with two moles of Grignard reagent gives a",["Ketone","Secondary alcohol","Primary alcohol","Tertiary alcohol"],3,"Ester + 2 GR gives a 3° alcohol.","Ester, two GR, tertiary.",0,3],["Reduction of an aldehyde gives a",["Primary alcohol","Secondary alcohol","Acid","Tertiary alcohol"],0,"Reduction of aldehydes gives 1° alcohols.","Aldehyde to primary.",0,3],["Reduction of a ketone gives a",["Tertiary alcohol","Secondary alcohol","Aldehyde","Primary alcohol"],1,"CH3COCH2CH3 gives butan-2-ol.","Ketone to secondary.",0,3],["A primary amine warmed with nitrous acid gives",["An acid","An ether","An alcohol","An aldehyde"],2,"RNH2 + HNO2 gives ROH + H2O + N2.","Amine to alcohol, N2 lost.",0,3],["Methylamine with nitrous acid gives",["Methanol","Methanal","Nitromethane","Ethanol"],0,"CH3NH2 + HNO2 gives CH3OH + H2O + N2.","Methylamine, methanol.",0,3],["Oxymercuration–demercuration adds water to a double bond in",["An anti-Markovnikov manner","A free radical manner","A syn manner only","A Markovnikov manner"],3,"The reagents are Hg(OAc)2 followed by NaBH4.","Hg gives Markovnikov.",0,4],["Hydroboration–oxidation adds water to a double bond in",["A Markovnikov manner of addition","An anti-Markovnikov manner","A random manner with no fixed pattern","A manner that gives no alcohol at all"],1,"The reagents are diborane (BH3)2 in THF, then H2O2/OH−.","Boron gives anti-Markovnikov.",0,4],["The solvent used in hydroboration is",["Water","THF","Ether only","Benzene"],1,"THF separates diborane from its dimer to the monomer.","Hydroboration, THF.",0,4],["The oxidation step of hydroboration uses",["LiAlH4 in dry ether solvent","KMnO4 in cold dilute solution","Zn with HCl in water","H2O2 with a base"],3,"Triethylborane is oxidised to ethanol and boric acid.","Borane oxidised by H2O2.",0,4],["Hydroboration–oxidation overall allows the addition of",["H–OH to the C=C double bond","H2 to the C=C double bond","Br–Br to the C=C double bond","H–Br to the C=C double bond"],0,"The product is an alcohol.","Alkene plus H–OH.",0,4],["Catalytic hydrogenation of α,β-unsaturated aldehydes and ketones gives",["Unsaturated alcohols","Acids","Ketones","Saturated alcohols"],3,"Addition takes place at both C=C and C=O bonds.","Hydrogenation, saturated alcohol.",0,4],["In the aldol route, ethanal gives aldol, then crotonaldehyde, and finally with H2/Ni",["Propanol","n-Butyl alcohol","Ethanol","Isobutyl alcohol"],1,"CH3CH=CHCHO + H2/Ni gives CH3CH2CH2CH2OH.","Four carbons, n-butyl.",0,4],["Carbonyl compounds can be reduced to alcohols by",["LiAlH4 or H2 with Ni, Pt or Pd","Na2Cr2O7 with dilute sulphuric acid","KMnO4 in acid or alkaline solution","HNO3 in concentrated solution"],0,"Aldehydes are reduced to 1° alcohols.","LiAlH4 reduces.",0,4],["NaBH4 does not reduce",["A C=O bond of a ketone","A C=O bond of an aldehyde","A C=C bond, even if conjugated","An aldehyde group on a chain"],2,"It is a mild reducing agent compared with LiAlH4 and is used to make unsaturated alcohols.","NaBH4 spares C=C.",0,4],["NaBH4 reduction of 3-phenyl-2-propenal gives",["A saturated alcohol","An acid","An unsaturated alcohol","An ether"],2,"The C=C remains and the CHO becomes CH2OH.","C=C stays.",0,4],["Acids are converted to esters before reduction because",["LiAlH4 is expensive","LiAlH4 is not strong enough","Esters are cheaper than alcohols","Acids cannot be reduced"],0,"The book says to use esters and then reduce them.","Acid to ester saves LiAlH4.",0,4],["Hydroxylation of an alkene with cold dilute KMnO4 gives a",["Glycol (syn-hydroxylation)","Ketone, by cleavage of the bond","Epoxide only, with no OH groups","Monohydric alcohol, by anti addition"],0,"Both OH groups add to the same face of the double bond.","KMnO4, glycol.",0,4],["Reactions with HX, PCl3 or PCl5, or conc. H2SO4 involve breaking of the",["C–OH bond","C–C bond","O–H bond","C–H bond"],0,"These reactions replace or remove the OH group.","HX, PCl5, C–OH.",0,5],["Reactions with active metals, esterification and oxidation involve breaking of the",["C–C bond","C–OH bond","O–H bond","C–H bond only"],2,"For O–H breaking, the order of reactivity is 1° > 2° > 3°.","Na, ester, oxidation, O–H.",0,5],["In reaction with HX, the order of reactivity of alcohols is",["All equal","3° > 2° > 1°","2° > 1° > 3°","1° > 2° > 3°"],1,"Alcohols react with HX in the order 3° > 2° > 1°.","HX, tertiary first.",0,5],["Reaction of an alcohol with PBr3 gives",["An alkene by loss of water","An alkyl bromide","An ether by loss of water","A carboxylic acid on oxidation"],1,"2-Methyl-1-propanol gives 1-bromo-2-methylpropane.","PBr3, bromide.",0,5],["Dehydration of ethanol with conc. H2SO4 gives",["Ethane","Ethanal","Ethene","Diethyl ether"],2,"Water is lost to form a double bond.","Ethanol minus water, ethene.",0,5],["Dehydrating agents for alcohols include",["KMnO4 in cold dilute solution","NaOH and KOH in hot solution","LiAlH4 in dry ether solvent","Alumina and conc. H2SO4"],3,"The book lists heat, a catalyst such as alumina, and conc. H2SO4.","Alumina or conc. acid.",0,5],["Ethanol reacts with sodium to give",["Ethanal and hydrogen","Sodium hydroxide and ethane","Sodium ethoxide and hydrogen","Ethene and water"],2,"2CH3CH2OH + 2Na gives 2CH3CH2ONa + H2.","Na on ROH, alkoxide and H2.",0,5],["Alkoxides react with alkyl halides to form",["Acids","Alcohols","Ethers","Alkenes"],2,"RONa + RCl gives ROR + NaCl.","Alkoxide plus halide, ether.",0,5],["Esterification is the reaction of an alcohol with",["An alkene to form an ether and water","An ether to form an alkane and water","A ketone to form an acid and water","An acid to form an ester and water"],3,"It is an acid-catalysed reversible reaction.","Acid plus alcohol, ester.",0,5],["Esterification with acids follows the order of reactivity",["2° > 3° > 1°","1° > 2° > 3°","3° > 2° > 1°","All equal"],1,"Primary alcohols are most reactive in esterification.","Ester, primary first.",0,5],["Ethanol and ethanoic acid react in acid to give",["Methyl ethanoate","Diethyl ether","Ethyl methanoate","Ethyl ethanoate"],3,"CH3COOH + CH3CH2OH gives CH3COOCH2CH3 + H2O.","Ethanol plus ethanoic acid, ethyl ethanoate.",0,5],["Alcohols can be oxidised by",["LiAlH4 in dry ether solvent","KMnO4 or K2Cr2O7","NaBH4 in cold alcohol solution","H2 with a Ni catalyst"],1,"The product depends on the type of alcohol and the oxidising agent.","Oxidisers, KMnO4 and dichromate.",0,6],["Oxidation of a primary alcohol gives first an aldehyde and then a",["Alkene by loss of water","Ether with a C–O–C link","Ketone with the same carbons","Carboxylic acid"],3,"RCH2OH gives RCHO then RCOOH.","1° gives aldehyde then acid.",0,6],["Oxidation of a secondary alcohol gives a",["Ether","Ketone","Aldehyde","Acid"],1,"R2CHOH gives RCOR.","2° gives ketone.",0,6],["Mild oxidising agents",["Do not affect tertiary alcohols","Oxidise tertiary alcohols to acids","Convert them to ethers","Oxidise tertiary alcohols to ketones"],0,"Only strong oxidising agents break C–C bonds in 3° alcohols.","3° resists mild oxidation.",0,6],["During oxidation, KMnO4 changes colour from",["Orange to green","Yellow to red","Purple to colourless","Colourless to purple"],2,"MnO4− is reduced to Mn2+, which is colourless.","Permanganate fades.",0,6],["Alcohols release hydrogen gas with",["Active metals such as Na and K","Water at room temperature","Dilute NaOH at room temperature","Dilute HCl at room temperature"],0,"Water can disturb the reaction.","Na, bubbles.",0,6],["Lucas reagent is",["HCl with ZnCl2","NaOH with I2","HNO3 with H2SO4","KMnO4 with H2SO4"],0,"It is used to tell 1°, 2° and 3° alcohols apart.","Lucas, HCl and ZnCl2.",0,6],["With Lucas reagent, which alcohol gives a cloudy halide immediately?",["Secondary","Primary","Methanol","Tertiary"],3,"The order is 3° > 2° > 1°, with 1° very slowly.","3° is instant.",0,6],["Alcohols that form a yellow precipitate in the iodoform test have",["A methyl group attached to the carbon bearing OH","A double bond next to the OH group","A phenyl ring with no other group","Two OH groups on the same carbon"],0,"CH3–CH(OH)–R gives iodoform, CHI3, with I2 and NaOH.","CH3–CHOH gives yellow iodoform.",0,6],["Sweet-smelling products formed when an alcohol reacts with an acid in H2SO4 are",["Ethers","Aldehydes","Esters","Alkenes"],2,"This is one of the tests for alcohols.","Sweet smell, ester.",0,6],["The IUPAC name of CH3OH is",["Methanol","Methanal","Methanoic acid","Methan-1-ol"],0,"One carbon. The final e of methane is dropped and –ol is added.","Drop the e, add ol.",0,7],["The IUPAC name of CH3CH2OH is",["Ethanal","Ethanoic acid","Ethanol","Ethoxyethane"],2,"Two carbons with an OH group.","Two carbons, ol.",0,7],["The IUPAC name of CH3CH2CH2OH is",["Propan-3-ol","Propanal","Propan-1-ol","Propan-2-ol"],2,"The OH is on the end carbon, which is carbon 1.","End carbon, 1.",0,7],["The IUPAC name of CH3CH(OH)CH3 is",["Propanone","Propan-3-ol","Propan-1-ol","Propan-2-ol"],3,"The OH is on the middle carbon.","Middle carbon, 2.",0,7],["The IUPAC name of CH3CH2CH2CH2OH is",["Butan-4-ol","Butan-2-ol","Butan-1-ol","Butanal"],2,"The OH is on the end of a four-carbon chain.","End, 1.",0,7],["The IUPAC name of CH3CH(OH)CH2CH3 is",["Butan-3-ol","Butan-2-ol","2-Methylpropan-2-ol","Butan-1-ol"],1,"Number from the end that gives OH the lower number.","OH takes the lowest number.",0,7],["The IUPAC name of (CH3)3COH is",["Butan-2-ol","2-Methylpropan-1-ol","1,1-Dimethylethanol","2-Methylpropan-2-ol"],3,"Three-carbon chain with the OH and a methyl both on carbon 2.","Both on carbon 2.",0,7],["The IUPAC name of CH3CH(CH3)CH2OH is",["1-Methylpropan-2-ol","Butan-1-ol","2-Methylpropan-1-ol","2-Methylpropan-2-ol"],2,"The OH is on carbon 1 and the methyl on carbon 2.","OH is the 1.",0,7],["The IUPAC name of CH3CH2CH2CH2CH2OH is",["Pentan-5-ol","Pentanal","Pentan-2-ol","Pentan-1-ol"],3,"Five carbons with the OH at the end.","Five carbons, end OH.",0,7],["The IUPAC name of CH3CH2CH(OH)CH2CH3 is",["Pentan-1-ol","Pentan-4-ol","Pentan-2-ol","Pentan-3-ol"],3,"The OH is on the middle carbon of five.","Middle of five is 3.",0,7],["The IUPAC name of CH3CH(OH)CH2CH2CH3 is",["2-Methylbutan-2-ol","Pentan-3-ol","Pentan-4-ol","Pentan-2-ol"],3,"Number from the end nearer the OH.","Nearest end to OH.",0,7],["The IUPAC name of CH3CH(CH3)CH2CH2OH is",["2-Methylbutan-1-ol","3-Methylbutan-1-ol","2-Methylbutan-4-ol","3-Methylbutan-2-ol"],1,"The OH gets carbon 1, so the methyl is on carbon 3.","OH first, methyl follows.",0,7],["The IUPAC name of CH3CH2CH(CH3)CH2OH is",["3-Methylbutan-1-ol","2-Methylbutan-2-ol","3-Methylbutan-4-ol","2-Methylbutan-1-ol"],3,"Carbon 1 holds the OH and carbon 2 holds the methyl.","Count from the OH.",0,7],["The IUPAC name of CH3C(CH3)(OH)CH2CH3 is",["2-Methylbutan-3-ol","3-Methylbutan-2-ol","3-Methylbutan-3-ol","2-Methylbutan-2-ol"],3,"The carbon with the OH and the methyl is carbon 2.","Same carbon, same number.",0,7],["The IUPAC name of CH3CH(OH)CH(CH3)CH3 is",["2-Methylbutan-2-ol","3-Methylbutan-2-ol","2-Methylbutan-3-ol","3-Methylbutan-1-ol"],1,"Number from the end that gives OH 2. The methyl is then on 3.","OH lowest first.",0,7],["The IUPAC name of CH3CH(OH)CH2CH(CH3)CH3 is",["2,4-Dimethylbutan-2-ol","2-Methylpentan-4-ol","4-Methylpentan-2-ol","4-Methylpentan-1-ol"],2,"OH must get the lowest number, which is 2. The methyl is then on 4.","OH wins the low number.",0,7],["The IUPAC name of (CH3)3CCH2OH is",["2,2-Dimethylbutan-1-ol","2,2-Dimethylpropan-1-ol","3,3-Dimethylpropan-1-ol","2,2-Dimethylpropan-3-ol"],1,"Three-carbon chain, OH on carbon 1, two methyls on carbon 2.","Two methyls, 2,2.",0,7],["The IUPAC name of HOCH2CH2OH is",["Ethane-1,1-diol","Ethane-1,2-diol","Ethanol-1,2","Ethan-1,2-diol"],1,"Two OH groups. The e of ethane is kept before the consonant d of diol.","Diol keeps the e.",0,7],["The IUPAC name of HOCH2CH(OH)CH2OH is",["Propane-1,2-diol","Propane-1,3-diol","Propane-1,2,3-triol","Propan-1,2,3-triol"],2,"Three OH groups, so triol. The e is kept.","Tri means three OH.",0,7],["The IUPAC name of HOCH2CH2CH2OH is",["Propane-1,3-triol","Propane-1,2-diol","Propane-1,3-diol","Propan-1,3-diol"],2,"The two OH groups are on the two end carbons.","Ends are 1 and 3.",0,7],["The IUPAC name of CH2=CHCH2OH is",["Prop-1-en-3-ol","Propen-1-ol","Prop-2-en-1-ol","Prop-2-en-3-ol"],2,"The OH gets the lowest number, so it is carbon 1 and the double bond is on 2.","OH has priority over the bond.",0,7],["The name of the six-carbon ring with one OH on it is",["Cyclohexanal","Cyclohexanol","Hydroxycyclohexane","Hexanol"],1,"The OH is shown by the suffix –ol, not by a prefix.","Ring plus ol.",0,7],["When naming an alcohol, the carbon chain is numbered to give the OH",["Always number 1","The same number as a methyl group","The highest possible number","The lowest possible number"],3,"The OH group decides the numbering.","OH takes the low number.",0,7],["The final e of the alkane name is ... when –ol is added to a single OH alcohol",["Changed to y","Kept","Dropped","Doubled"],2,"Propane becomes propanol. The e is lost before the vowel o.","Drop e before a vowel.",0,7],["Propan-2-ol is a",["Tertiary alcohol","Dihydric alcohol","Secondary alcohol","Primary alcohol"],2,"The carbon bearing the OH is attached to two other carbons.","Two carbons, secondary.",0,7],["2-Methylpropan-2-ol is a",["Tertiary alcohol","Primary alcohol","Secondary alcohol","Trihydric alcohol"],0,"The carbon with the OH is attached to three other carbons.","Three carbons, tertiary.",0,7],["Butan-1-ol is a",["Secondary alcohol","Tertiary alcohol","Dihydric alcohol","Primary alcohol"],3,"The carbon with the OH is attached to only one other carbon.","One carbon, primary.",0,7],["Which reagents add water to a double bond in an anti-Markovnikov way?",["Diborane in THF, then H2O2 with base","Cold dilute KMnO4 in water, then acid","Hg(OAc)2 first, then NaBH4 after it","Dilute H2SO4 with water on heating"],0,"This is hydroboration–oxidation.","Boron is anti.",0,8],["Which reagents add water to a double bond in a Markovnikov way?",["Cold dilute KMnO4","LiAlH4 in dry ether","Hg(OAc)2, then NaBH4","Diborane in THF, then H2O2"],2,"This is oxymercuration–demercuration.","Mercury is Markovnikov.",0,8],["Which reducing agent changes 3-phenylprop-2-enal to an unsaturated alcohol?",["H2 with Pd","H2 with Pt","H2 with Ni","NaBH4"],3,"NaBH4 reduces C=O and leaves C=C alone. H2 with a metal catalyst reduces both.","NaBH4 spares C=C.",0,8],["Which order is correct for alcohols in esterification?",["1° > 2° > 3°","2° > 1° > 3°","All are equal","3° > 2° > 1°"],0,"Reactions that break the O–H bond favour primary alcohols.","Ester, 1° first.",0,8],["Which order is correct for alcohols reacting with HX?",["3° > 2° > 1°","2° > 3° > 1°","All are equal","1° > 2° > 3°"],0,"Here the C–OH bond breaks, and tertiary is the easiest.","HX, 3° first.",0,8],["In the Lucas test, which alcohol reacts very slowly?",["Secondary alcohol","Tertiary alcohol","Primary alcohol","All react at once"],2,"Tertiary gives cloudiness at once, secondary slowly and primary very slowly.","1° is the slowest.",0,8],["Which dehydrating agent changes an alcohol to an alkene?",["Heating with alumina or conc. H2SO4","Cold dilute KMnO4 in plenty of water","Cold dilute H2SO4 in plenty of water","Heating with NaOH in water solution"],0,"Heat and an acid or alumina remove water.","Heat plus alumina or H2SO4.",0,8],["Which alcohol is NOT oxidised by mild oxidising agents?",["Propan-2-ol, a secondary alcohol","2-Methylpropan-2-ol","Butan-1-ol, a primary alcohol","Ethanol, a primary alcohol"],1,"A tertiary alcohol has no hydrogen on the carbon with the OH.","Tertiary stays.",0,8],["Oxidation of butan-2-ol with K2Cr2O7 gives",["2-Methylpropanal","Butanal","Butan-2-one","Butanoic acid"],2,"A secondary alcohol gives a ketone and stops.","2° makes ketone.",0,8],["Excess oxidising agent changes propan-1-ol finally to",["Propanoic acid","Propanal","Propanone","Propan-2-ol"],0,"A primary alcohol goes to the aldehyde and then to the acid.","1° goes to acid.",0,8],["Which alcohol gives a yellow precipitate with iodine and NaOH?",["Butan-1-ol","Propan-2-ol","Propan-1-ol","2-Methylpropan-2-ol"],1,"It has CH3–CH(OH)–R. The yellow solid is iodoform.","Methyl next to the OH carbon.",0,8],["To get pure ethanol from the 90–95% distillate, you add",["Water and boil","KMnO4 solution","Benzene and redistil at 118 °C","Benzene and redistil at 78.3 °C"],3,"The book says benzene is added and ethanol is redistilled at 78.3 °C.","Benzene, 78.3 °C.",0,8],["Which reagent changes an alkene to a glycol?",["Br2 in CCl4","Cold dilute KMnO4","H2 with Ni","Hot conc. KMnO4"],1,"Both OH groups add to the same face (syn-hydroxylation).","Cold and dilute.",0,8],["Which reagent steps turn a ketone into a tertiary alcohol?",["NaBH4 in ethanol, then water","H2 with Ni catalyst, heated","LiAlH4 in ether, then water","Grignard reagent, then hydrolysis"],3,"Ketones with Grignard reagents give tertiary alcohols. Reduction gives a secondary alcohol.","Ketone plus GR, 3°.",0,8],["Benzyl chloride is changed to benzyl alcohol using",["Dry HCl","LiAlH4 in ether","Aqueous NaOH","Conc. H2SO4"],2,"Hydroxide replaces the chlorine.","Hydroxide swaps Cl.",0,8]]},{"t":"Ethers","s":["Structure and nomenclature","Physical properties","Preparation of ethers","Chemical properties","Uses, hazards and cyclic ethers","Naming practice: ethers","Reagents, conditions and traps"],"q":[["An ether is a compound in which oxygen is bonded to",["A carbonyl carbon","Two R groups","One R group and one H","Two hydrogens"],1,"The general forms are R–O–R, Ar–O–R and Ar–O–Ar.","Ether, O between two R.",0,0],["The simplest ether is",["C6H5–O–C6H5","CH3–O–H","CH3CH2–O–CH2CH3","CH3–O–CH3"],3,"The common ether is diethyl ether, but the simplest is CH3–O–CH3.","Simplest, two methyls.",0,0],["The common ether, popularly called 'ether', is",["Dimethyl ether","Ethylene oxide","Diethyl ether","Anisole"],2,"It is CH3CH2–O–CH2CH3.","Ether means diethyl ether.",0,0],["Ethers are named as",["Hydroxy derivatives of alkanes","Alkoxy derivatives of alkanes","Carbonyl derivatives of alkanes","Amino derivatives of alkanes"],1,"For example methoxyethane and ethoxyethane.","Ether, alkoxy.",0,0],["CH3–O–CH2CH3 is named",["Methoxyethane","Methoxypropane","Dimethoxyethane","Ethoxymethane"],0,"The smaller group becomes the alkoxy prefix.","Short chain becomes methoxy.",0,0],["CH3CH2–O–CH2CH3 is named",["Diethoxy ethane","Ethanol ether","Methoxypropane","Ethoxyethane"],3,"It is also called diethyl ether.","Two ethyls, ethoxyethane.",0,0],["Anisole is",["Diphenyl ether","Phenol","Methoxybenzene","Ethoxybenzene"],2,"It is the simplest alkyl aryl ether.","Anisole, methoxybenzene.",0,0],["Ethers with two identical groups are called",["Symmetrical ethers","Cyclic ethers","Mixed ethers","Non-symmetrical ethers"],0,"Diethyl ether is an example.","Same groups, symmetrical.",0,0],["Ethers with two different groups are called",["Non-symmetrical ethers","Symmetrical ethers","Cyclic ethers","Simple ethers"],0,"Methyl ethyl ether is an example.","Different groups, non-symmetrical.",0,0],["When a group has no simple name, the ether is named as",["A ketone","A hydroxy derivative","An alkoxy derivative","An acid"],2,"For example 3-methoxyhexane or 4-ethoxybenzoic acid.","No simple name, alkoxy.",0,0],["The two C–O bonds in an ether do not cancel because",["The bonds are ionic","The molecule is linear","The C–O–C angle is not 180°","Oxygen has no lone pair"],2,"So ethers have some dipole moment.","Bent, so polar.",0,1],["The dipole moment of ethers is",["Higher than alcohols and well above alkanes","Less than alcohols but a little higher than alkanes","Equal to alkanes of similar mass","Zero, as in the non-polar alkanes"],1,"The hydrogen bonding in alcohols affects their boiling points.","Between alkane and alcohol.",0,1],["The water solubility of ethers arises from",["Intermolecular hydrogen bonding with water","Their high density compared with water","Ionic bonds formed with the water molecules","Chemical reaction with water to form alcohol"],0,"Ethers show solubility similar to alcohols.","Ether H-bonds with water.",0,1],["The Williamson synthesis is the reaction between",["An acid and an alcohol with a catalyst present","An alkene and water in the presence of acid","Two alcohols heated together in the acid","An alkyl halide and the Na or K salt of an alcohol or phenol"],3,"CH3CH2Br + CH3ONa gives CH3CH2OCH3 + NaBr.","Halide plus alkoxide.",0,2],["Aryl halides cannot be used in Williamson synthesis because",["They are insoluble in water and alcohol","They are too reactive towards the nucleophile","They have low reactivity to nucleophilic reagents","They are gases at room temperature always"],2,"Use an alkyl halide instead.","Aryl halide, unreactive.",0,2],["Dehydration of alcohols is suitable only for preparing",["Unsymmetrical ethers","Aryl ethers","Cyclic ethers","Symmetrical ethers"],3,"Only primary alcohols from propanol and below can be used.","Dehydration, symmetrical.",0,2],["Diethyl ether is made from ethanol and H2SO4 at about",["200–250 °C","50–60 °C","300 °C","130–140 °C"],3,"The side reaction forming an alkene predominates above 160 °C.","Ether, 130–140.",0,2],["At temperatures above 160 °C, dehydration of ethanol mainly gives",["An ester","An ether","An alkene","An acid"],2,"Ethene forms as the side reaction.","Too hot, alkene.",0,2],["In ether formation by dehydration, the second alcohol molecule acts as a",["Nucleophile","Electrophile","Catalyst","Leaving group"],0,"The protonated alcohol is the substrate.","Second alcohol attacks.",0,2],["Alkoxymercuration–demercuration uses an alkene, an alcohol and",["Mercuric chloride, then LiAlH4","Dilute H2SO4","Mercuric trifluoroacetate, then NaBH4","Sodium metal"],2,"The alkoxy mercurial compound is reduced to the ether.","Mercury then NaBH4.",0,2],["An advantage of alkoxymercuration is",["High yield with no side reactions","It needs no reducing agent afterwards","It works well for aryl halides too","Cheap mercury salts are used in it"],0,"The book lists high yield, absence of side reaction and speed.","High yield, clean.",0,2],["The drawback of alkoxymercuration is",["Many side reactions with the alkene","Steric hindrance from the large mercuric compound","A slow reaction rate at room temperature","A low yield of the ether product"],1,"The size of the mercuric compound causes steric hindrance.","Big Hg group.",0,2],["Addition of alcohols to alkenes in acid is suitable for making",["Cyclic ethers only","Symmetrical ethers only","Unsymmetrical ethers","Esters"],2,"Example: isobutene with methanol gives tert-butyl methyl ether.","Acid addition, unsymmetrical.",0,2],["Ethers belong to the group of",["Most reactive functional groups","Basic groups only","Least reactive functional groups","Acidic groups"],2,"So they are used as medium for many reactions.","Ethers, unreactive.",0,3],["Hydrogen halides react with ethers by",["Doing nothing","Cleaving the ether linkage","Adding to the oxygen only","Forming an ester"],1,"Diethyl ether + HBr gives ethanol and bromoethane.","HX cuts the C–O–C.",0,3],["Anisole with HI gives",["Benzene and methanol","Iodobenzene and methanol","Phenol and iodomethane","Toluene"],2,"The ether linkage is cleaved.","Anisole plus HI, phenol and CH3I.",0,3],["In excess hydrogen halide, the alcohol formed from an ether is",["Converted to alkyl halide","Oxidised to a carboxylic acid","Left unchanged by the halide","Dehydrated back to an ether"],0,"CH3OH + HI gives CH3I + H2O.","Excess HX, all halide.",0,3],["Diaryl ethers with HI",["Form phenols and aryl halides","Give no reaction","Are cleaved into two phenols","Form alkenes on heating"],1,"Diaryl ethers are not cleaved by acids such as HI or HBr.","Ar–O–Ar resists.",0,3],["Ethers form oxonium salts called",["Ammonium salts","Alkoxides","Etherates","Esters"],2,"They are analogues of ammonium salts.","Ether salts, etherates.",0,3],["Hydrolysis of an ether with dilute H2SO4 gives",["Alkenes","Acids","Ketones","Alcohols"],3,"The elements of water add as H+ and OH−.","Ether plus water, alcohols.",0,3],["Diethyl ether is a popular solvent because it",["Has low reactivity and high solubility for many compounds","Is denser than water and sinks in it","Is not flammable even near a flame","Is very reactive towards most compounds"],0,"It is also relatively cheap.","Unreactive solvent.",0,4],["Ethers have narcotic activity, so they are used as",["Anaesthetics","Dyes","Fertilisers","Antibiotics"],0,"Another use is as softeners for plastics.","Narcotic, anaesthetic.",0,4],["Ether fires should be put out with",["Dilute acid","CO2","Sand only","Water"],1,"Ether floats on water, so water spreads the fire.","Not water, use CO2.",0,4],["Ether vapour is",["Same as air","Heavier than water","Lighter than air","Denser than air"],3,"It may roll on a desktop for a long way when in flame.","Vapour rolls.",0,4],["Ethers exposed to air tend to form",["Alkenes","Peroxides","Acids","Alcohols"],1,"Peroxides are violently explosive and accumulate in the flask during distillation.","Old ether, peroxides.",0,4],["Ether peroxides can be removed by",["An oxidising agent like KMnO4","Water washing in a separating funnel","Heating the ether on a water bath","A reducing agent like FeSO4"],3,"They boil at a higher temperature so they build up on distillation.","Reduce peroxides with FeSO4.",0,4],["Which is a cyclic ether listed in the book?",["Tetrahydrofuran (THF)","Anisole, a methyl phenyl ether","Methoxyethane, an open chain ether","Diethyl ether, an open chain ether"],0,"The cyclic ethers are ethylene oxide, 1,4-dioxane and THF.","THF is a ring.",0,4],["The IUPAC name of CH3OCH3 is",["Methoxyethane","Methoxymethane","Dimethylmethane","Ethoxymethane"],1,"The smaller group with the oxygen becomes methoxy. The other is the parent.","Short chain plus O is the prefix.",0,5],["The IUPAC name of CH3OCH2CH3 is",["Ethoxymethane","Ethoxyethane","Methoxymethane","Methoxyethane"],3,"The longer chain is the parent and the shorter one with O is the alkoxy.","Longer chain is the parent.",0,5],["The IUPAC name of CH3CH2OCH2CH3 is",["Methoxyethane","Diethoxymethane","Ethoxyethane","Ethoxymethane"],2,"Both sides are ethyl. One becomes ethoxy and the other is ethane.","Ethoxy plus ethane.",0,5],["The IUPAC name of CH3OCH(CH3)CH3 is",["2-Propoxymethane","2-Methoxypropane","Methoxybutane","1-Methoxypropane"],1,"Methoxy sits on the middle carbon of propane.","Number the parent chain.",0,5],["The IUPAC name of CH3CH2OCH2CH2CH3 is",["1-Ethoxypropane","2-Ethoxypropane","3-Ethoxypropane","1-Propoxyethane"],0,"Propane is the longer parent chain. The ethoxy is on carbon 1.","Longer chain, lowest number.",0,5],["In the IUPAC name of an ether, the shorter group with the oxygen is named as",["A ring","The parent alkane","A suffix","An alkoxy prefix"],3,"The longer chain is the parent alkane.","Short side is alkoxy.",0,5],["Ethanol heated with H2SO4 at about 140 °C gives mainly",["Diethyl ether","Ethyl ethanoate","Ethanal","Ethene"],0,"Two alcohol molecules lose one water at 130–140 °C.","140 gives ether.",0,6],["Ethanol with H2SO4: which temperature gives ether and which gives alkene?",["Neither, as only alumina dehydrates ethanol","Both products form at 100 °C","130–140 °C ether; above 160 °C alkene","Above 160 °C ether; 130–140 °C alkene"],2,"Higher temperature favours elimination to ethene.","Low gives ether, high gives alkene.",0,6],["Which pair cannot be used in the Williamson synthesis?",["An aryl halide with an alkoxide","A methyl halide with a phenoxide","An ethyl halide with sodium ethoxide","A primary alkyl halide with an alkoxide"],0,"Aryl halides have low reactivity towards nucleophiles.","No aryl halides.",0,6],["Alkoxymercuration–demercuration of an alkene uses",["Silver oxide with an alcohol, then dilute HCl","Mercuric trifluoroacetate with an alcohol, then NaBH4","BH3 in THF solvent, then H2O2 with a base","Mercuric acetate with water, then NaBH4 solution"],1,"The alcohol, not water, is the nucleophile, so an ether forms.","Alcohol in, ether out.",0,6],["Which reagent cleaves the C–O bond of an ether?",["LiAlH4 in dry ether solvent","A hydrogen halide such as HI","NaOH solution on heating","Cold dilute KMnO4 solution"],1,"Ethers are very unreactive but hydrogen halides cleave them.","Only HX cuts ethers.",0,6],["Excess hydrogen halide on an ether finally gives",["Alcohols only","Higher ethers","Alkenes","Alkyl halide"],3,"The alcohol formed first is converted to an alkyl halide.","Excess HX, halide.",0,6],["Which ether does NOT react with HI?",["Diethyl ether, an open chain ether","Anisole, a methyl phenyl ether","Methoxyethane, a mixed ether","Diphenyl ether (a diaryl ether)"],3,"Diaryl ethers give no reaction.","Diaryl, no reaction.",0,6],["Unsymmetrical ethers are better made by",["Heating an alcohol with alumina only","Adding an alcohol to an alkene in acid","Oxidising an alcohol","Dehydrating one alcohol with H2SO4"],1,"Dehydration of one alcohol gives only symmetrical ethers.","Dehydration is symmetrical only.",0,6]]},{"t":"Epoxides","s":["Structure and preparation","Cleavage reactions","Reagents, conditions and traps"],"q":[["Epoxides are compounds containing",["A benzene ring with one oxygen","A four-membered ring with oxygen","A three-membered ring with oxygen","A carbonyl group on a chain"],2,"They are considered ethers but have unusual properties because of the ring.","Epoxide, three-ring ether.",0,0],["The most popular epoxide is",["Propylene oxide","Ethylene oxide","Styrene oxide","Tetrahydrofuran"],1,"The book calls ethylene oxide the most popular.","Epoxide, ethylene oxide.",0,0],["Epoxides are considered as",["Ethers with a three-membered ring","Esters with a cyclic carbon skeleton","Alcohols with a long carbon chain","Ketones with a strained ring bond"],0,"The three-membered ring gives unusual properties.","Ring ether.",0,0],["One method of preparing epoxides is from",["Amides","Halohydrins","Alkanes","Carboxylic acids"],1,"An alkene with X2/H2O gives a halohydrin, which is treated with base.","Halohydrin to epoxide.",0,0],["A halohydrin is formed from an alkene using",["X2 and H2O","H2 and Ni","LiAlH4","KMnO4"],0,"The halohydrin then loses HX with base to close the ring.","Halogen plus water.",0,0],["Ethylene oxide is made industrially by catalytic oxidation of ethene using",["Nickel","Silver (Ag)","Iron","Platinum"],1,"Ethene and oxygen give ethylene oxide over Ag.","Ethene to epoxide, Ag.",0,0],["Peroxybenzoic acid with a C=C bond gives",["A glycol and water as products","An epoxide and benzoic acid","An alcohol only, with no by-product","An ether and carbon dioxide gas"],1,"Styrene with peroxybenzoic acid gives styrene oxide and benzoic acid.","Peracid, epoxide.",0,0],["Styrene oxide forms from styrene and",["Hydrogen peroxide alone","Peroxybenzoic acid","Benzoic acid","Sulphuric acid"],1,"Benzoic acid is the other product.","Styrene, peracid.",0,0],["Acid-catalysed ring opening of ethylene oxide with ethanol gives",["2-Ethoxyethanol","Ethoxyethane","Ethylene glycol","Diethyl ether"],0,"The ring opens to give an ether-alcohol.","Epoxide plus ROH, ether-alcohol.",0,1],["Ethylene oxide with HBr gives",["Ethylene glycol","1,2-Dibromoethane","Bromoethane","2-Bromoethanol"],3,"The ring opens to give a bromo alcohol.","HX opens the ring.",0,1],["Base-catalysed ring opening of ethylene oxide with sodium ethoxide gives",["Diethyl ether","Ethanol","2-Ethoxyethanol","Ethylene glycol"],2,"The ethoxide attacks the ring carbon.","Alkoxide plus epoxide.",0,1],["Sodium phenoxide with ethylene oxide gives",["Ethylene glycol","2-Ethoxyethanol","2-Phenoxyethanol","Phenol"],2,"The phenoxide ion opens the ring.","Phenoxide gives phenoxyethanol.",0,1],["Ethylene oxide with a Grignard reagent, then hydrolysis, gives a",["Tertiary alcohol","Ketone","Secondary alcohol","Primary alcohol"],3,"The R group is extended by two carbon atoms.","Epoxide plus GR, primary.",0,1],["In the Grignard reaction with ethylene oxide, the R group is extended by",["Two carbon atoms","One carbon atom","No carbon atoms","Three carbon atoms"],0,"The book states the R group has been extended by two C atoms.","Two carbons added.",0,1],["Which reagent changes an alkene directly into an epoxide?",["H2 with Ni","Br2 and water","Peroxybenzoic acid","Cold dilute KMnO4"],2,"Benzoic acid is the other product.","Peroxy acid epoxidises.",0,2],["Ethylene oxide with HBr gives",["Ethane-1,2-diol","1,2-Dibromoethane","Bromoethane","2-Bromoethanol"],3,"The ring opens and bromine and OH end up on adjacent carbons.","Ring opens, Br and OH.",0,2],["Ethylene oxide with a Grignard reagent RMgX, then hydrolysis, gives",["RCH2OH","RCH(OH)CH3","R2CHOH","RCH2CH2OH"],3,"A primary alcohol with two extra carbons.","Adds two carbons.",0,2],["Ethylene oxide opened by ethanol (acid) or by sodium ethoxide (base) gives",["The same product, 2-ethoxyethanol","Ethane-1,2-diol in acid only","1-Ethoxyethanol in both","Ethoxyethane in base only"],0,"The catalyst type does not change the product here.","Acid or base, same product.",0,2]]},{"t":"Carboxylic Acids","s":["Structure and nomenclature","Preparation of carboxylic acids","Physical properties and acidity","Reactions of the acid group","Reactions at alkyl or aryl group","Tests, fatty acids and dicarboxylic acids","Naming practice: carboxylic acids","Reagents, conditions and traps"],"q":[["Carboxylic acids have at least one",["–NH2 group on the carbon end","–CHO group on the chain end","–COOH functional group","–OH group on the carbon only"],2,"They conform to the general formula CnH2n+1COOH.","Acid, COOH.",0,0],["The general formula of carboxylic acids is",["CnH2n-1COOH","CnH2nCOOH","CnH2n+1COOH","CnH2n+2COOH"],2,"Here n = 0, 1, 2, 3 and so on.","Alkyl plus COOH.",0,0],["Carboxylic acids owe their acidic property to the ability to",["Accept H+ from water and form a cation","Lose OH− in water and form an ion","Form hydrogen bonds with other molecules","Ionise and produce H+ that is transferable to a base"],3,"RCOOH + H2O gives RCOO− + H3O+.","Acid gives H+.",0,0],["In RCOOH + H2O ⇌ RCOO− + H3O+, the conjugate base of RCOOH is",["H3O+","RCOO−","RCOOH2+","H2O"],1,"H3O+ is the conjugate acid of H2O.","Acid minus H+.",0,0],["Formic acid is the common name of",["Ethanoic acid","Methanoic acid","Propanoic acid","Butanoic acid"],1,"HCOOH is formic acid or methanoic acid.","Form, one carbon.",0,0],["Acetic acid is also called",["Methanoic acid","Propanoic acid","Ethanoic acid","Butanoic acid"],2,"CH3COOH.","Acet, two carbons.",0,0],["Propionic acid is also called",["Butanoic acid","Ethanoic acid","Pentanoic acid","Propanoic acid"],3,"CH3CH2COOH.","Propion, three carbons.",0,0],["Valeric acid is also called",["Propanoic acid","Hexanoic acid","Pentanoic acid","Butanoic acid"],2,"CH3(CH2)3COOH has five carbons.","Valeric, five.",0,0],["Stearic acid is also called",["Tetradecanoic acid","Dodecanoic acid","Hexadecanoic acid","Octadecanoic acid"],3,"The book lists stearic acid or octadecanoic acid.","Stearic, 18 carbons.",0,0],["Benzoic acid is also named",["Benzene carboxylic acid","Phenyl ethanoic acid","Toluic acid","Benzyl acid"],0,"C6H5COOH.","Benzoic, benzene carboxylic.",0,0],["Branched and substituted acids are named as derivatives of",["Aldehydes of the same chain length","Straight chain acids","Alcohols of the same chain length","Esters of the same chain length"],1,"Greek letters α, β, γ and δ show the substituent position.","Branched, from straight.",0,0],["In a common name, the carbon next to the COOH is the",["α (alpha) carbon","δ (delta) carbon of the chain","β (beta) carbon of the chain","γ (gamma) carbon of the chain"],0,"The Greek letters run α, β, γ, δ along the chain.","Next to COOH, alpha.",0,0],["CH3CH2CH(CH3)COOH is",["Pentanoic acid","2-Methylpropanoic acid","2-Methylbutanoic acid","3-Methylbutanoic acid"],2,"The methyl is on carbon 2, which is the α carbon.","Count from COOH.",0,0],["CH3CH=CH–COOH is",["3-Butenoic acid","2-Butenoic acid","1-Butenoic acid","Butanoic acid"],1,"The double bond starts at carbon 2.","Acid is C1.",0,0],["Oxidation of a primary alcohol gives an acid through",["An ester intermediate","A ketone intermediate","An ether intermediate","An aldehyde intermediate"],3,"RCH2OH gives RCHO then RCOOH.","Alcohol, aldehyde, acid.",0,1],["Hydrolysis of a nitrile gives",["A carboxylic acid and ammonia","An amine and carbon dioxide","An aldehyde and some water","An alcohol and ammonia gas"],0,"RCH2CN with H2O/H+ and heat gives RCH2COOH + NH3.","Nitrile to acid.",0,1],["In making acids through nitriles, the alkyl bromide is first treated with",["LiAlH4"
