on-linear and dependent on the current","infinite once the flux is saturated"],2,"Permeability changes with flux density, so L becomes a function of current.","Saturation, non-linear.",0,2],["The self-induced e.m.f. is also called the",["forward e.m.f.","zero e.m.f.","peak e.m.f.","back e.m.f."],3,"It opposes any change in the current in the circuit.","Opposing e.m.f. is back e.m.f.",0,3],["Physically, self-inductance acts as",["inertia","gravity","friction","pressure"],0,"Self-inductance is the electromagnetic analogue of mass.","L is like mass.",0,3],["Work done against the back e.m.f. in setting up a current is stored as",["kinetic energy of the wire","magnetic potential energy","heat in the coil","electric potential energy"],1,"The work is stored as magnetic potential energy.","Stored in the magnetic field.",0,3],["The energy stored in an inductor carrying current I is",["W = ½L²I","W = LI²","W = ½LI²","W = ½LI"],2,"This is analogous to ½mv² for the kinetic energy of a particle.","Half L I squared.",0,3],["In the mechanical analogy, the inductance L corresponds to",["velocity v","mass m","force F","momentum p"],1,"L is analogous to m, so L is electrical inertia.","L is like m.",0,3],["In the mechanical analogy, the current I corresponds to",["mass m","force F","energy E","velocity v"],3,"W = ½LI² matches ½mv², so I matches v.","I is like v.",0,3],["Inductance opposes both the",["heating of the wire in a circuit","growth of current in a circuit only","decay of current in a circuit only","growth and decay of current in a circuit"],3,"L is electrical inertia and opposes both growth and decay of current.","Inertia resists any change.",0,3],["Mutual inductance is the opposition to the change of current in one coil due to",["the resistance of the wire","the earth's field","the presence of a second coil","a battery in series"],2,"It is the basic operating principle of the transformer, electric motors and generators.","Two coils interacting.",0,4],["Mutual inductance exists when",["current in one coil induces a voltage in an adjacent coil","a coil is placed in a steady field","current in a coil induces a voltage in the same coil","a coil has no core"],0,"The changing flux of the primary links the secondary.","Primary drives secondary.",0,4],["The mutual inductance M₂₁ is defined by",["M₂₁ = N₁Φ₂₁ / i₂","M₂₁ = N₂ i₁ / Φ₂₁","M₂₁ = N₂Φ₂₁ / i₁","M₂₁ = Φ₂₁ i₁ / N₂"],2,"The flux linkage in coil 2, divided by the current in coil 1.","N₂Φ₂₁ over i₁.",0,4],["The induced e.m.f. in coil 2 due to a changing current in coil 1 is",["ε₂ = −M di₁/dt","ε₂ = −di₁/M dt","ε₂ = −M i₁","ε₂ = +M i₁ dt"],0,"The induced e.m.f. is proportional to the rate of change of the current in coil 1.","Minus M times rate.",0,4],["The reciprocity theorem says that for two coils with no material medium between them",["M₁₂ = 0","M₁₂ = 2M₂₁","M₁₂ = M₂₁","M₁₂ = 1/M₂₁"],2,"Both constants are equal, so a single M describes the pair.","Reciprocity: M both ways.",0,4],["Mutual inductance depends on",["the temperature of the room and the supply","the colour and thickness of the insulation","the turns, the radii and the permeability of the medium","the battery voltage and the time of day"],2,"It depends only on geometric factors of the coils and on the properties of the medium around them.","Geometry and medium.",0,4],["The mutual inductance between two coils is measured in",["farad","henry","tesla","ohm"],1,"The SI unit is the henry, as for self-inductance.","Henry again.",0,4],["If the current in one coil becomes steady, the induced e.m.f. in the neighbouring coil is",["zero","infinite","doubled","maximum"],0,"No change in current means no change in flux, so no e.m.f. is induced.","Steady means nothing induced.",0,4],["Mutual inductance between two coils is related to their self-inductances by",["M = √(L₁L₂) for perfect coupling","M = L₁/L₂ for perfect coupling","M = L₁L₂ for perfect coupling","M = L₁ + L₂ for perfect coupling"],0,"Cross-multiplying gives M² = L₁L₂, assuming zero flux leakage.","Root of L₁ L₂.",0,5],["The coefficient of coupling k of two coils is a fraction between",["0 and 100","1 and 10","0 and 1","−1 and 0"],2,"k = 0 means no coupling and k = 1 means perfect coupling.","k from 0 to 1.",0,5],["With flux leakage, the mutual inductance is",["M = kL₁L₂","M = k√(L₁L₂)","M = √(L₁L₂)/k","M = k(L₁ + L₂)"],1,"The coefficient of coupling k corrects for the flux that does not link both coils.","Include k.",0,5],["Two coils with k = 1 are",["loosely coupled","tightly coupled only","not coupled","perfectly coupled"],3,"k = 1 is perfect magnetic coupling with no leakage.","k = 1 perfect.",0,5],["Two coils are said to be loosely coupled when k is",["greater than 0.5","less than 0.5","equal to 2","equal to 1"],1,"k > 0.5 means tightly coupled and k < 0.5 means loosely coupled.","Small k, loose.",0,5],["Two coils with equal self-inductance L have a mutual inductance, with perfect coupling, of",["M = L","M = L/2","M = L²","M = 2L"],0,"M = √(L × L) = L.","Root of L squared.",0,5],["The magnetic coupling between two coils can never reach 100% in practice because of",["the weight of the iron core in the coils","flux leakage and the position of the coils","the colour of the wire used in the coils","the supply voltage applied to the coils"],1,"In reality there is always some loss due to leakage and position.","Leakage prevents 100%.",0,5],["The mutual inductance of two coaxial solenoids of radius r₁ (inner) and turns N₁, N₂, length l, is",["M = μ₀N₁N₂πr₁² / l","M = μ₀N₁N₂ l / πr₁²","M = N₁N₂πr₁² / μ₀l","M = μ₀N₁N₂πr₁ / l"],0,"The flux of the inner solenoid is confined inside it, so only its area πr₁² counts.","Inner radius squared.",0,5],["Mutual inductance is the basic operating principle of the",["capacitor","transformer","resistor","diode"],1,"Transformers, electric motors and generators depend on mutual inductance.","Transformer: mutual.",0,6],["Which of these is a practical application of mutual inductance?",["Fuse","Capacitor","Transformer","Resistor"],2,"The book lists the electric motor, transformer and generator.","Transformer.",0,6],["The direction of the induced e.m.f. in the neighbouring coil is given by",["Boyle's law","Coulomb's law","Lenz's law","Ohm's law"],2,"The induced e.m.f. opposes the change that produces it.","Lenz again.",0,6],["A hollow air-cored coil of 500 turns produces a flux of 10 mWb with a current of 10 A. The self-inductance is",["500 mH","5 mH","50 mH","5 H"],0,"L = NΦ/I = 500 × 10 × 10⁻³ ÷ 10 = 0.5 H = 500 mH.","N times flux over I.",0,7],["For the same coil, the current rises from 0 to 10 A in 10 ms. The average self-induced e.m.f. is",["5 V","5000 V","50 V","500 V"],3,"V = L di/dt = 0.5 × (10 ÷ 0.01) = 500 V.","L times rate.",0,7],["Two inductors of 75 mH and 55 mH share a common core, and 0.75 of the flux of one links the other. The mutual inductance is",["130 mH","48.2 mH","36.1 mH","64.2 mH"],1,"M = k√(L₁L₂) = 0.75√(75 × 55) = 48.2 mH.","k times root of product.",0,7],["A small coil of area A and N₂ turns sits at the centre of a long solenoid of N₁ turns and length l. Their mutual inductance is",["M = μ₀N₁N₂A / l","M = μ₀N₁N₂ l / A","M = N₁N₂A / μ₀l","M = μ₀N₁A / N₂l"],0,"The solenoid field is μ₀N₁I/l. The flux linkage of the small coil is N₂BA, so M = μ₀N₁N₂A/l.","Field times area times turns.",0,7],["Tutorial 10.1: A crack in the magnetic path of an inductor will result in",["increased inductance","reduced inductance","unchanged inductance","zero inductance"],1,"A crack (air gap) raises the reluctance of the path, so less flux links the coil and the inductance falls.","Gap in the core, weaker coupling, lower L.",0,8],["Tutorial 10.7: If the current in one coil becomes steady, the e.m.f. induced in a neighbouring coil is",["zero","halved","doubled","infinite"],0,"Induced e.m.f. = −M dI/dt. A steady current has dI/dt = 0, so nothing is induced.","No change in current, no induced voltage.",0,8],["Tutorial 10.8: The flux linkage in coil 1 is 3 Wb, it has 500 turns, and the current in coil 2 is 2 A. The mutual inductance is",["300 H","750 H","500 H","450 H"],1,"M = N₁Φ₁/I₂ = (500)(3) ÷ 2 = 750 H.","Turns × flux ÷ current.",0,8],["Tutorial 10.11: With flux linkage 3 Wb in coil 1, current 2 A in coil 2 and M = 750 H, the number of turns in coil 1 is",["700","300","500","400"],2,"M = NΦ/I, so N = MI/Φ = (750)(2) ÷ 3 = 500 turns.","Make N the subject: N = MI/Φ.",0,8],["Tutorial 10.6: Reversing either the field or the current in a conductor carrying current in a magnetic field will",["reverse the force on the conductor","stop the force","double the force","leave the force unchanged"],0,"The force direction depends on the directions of both I and B. Flip one and the force flips.","Flip one, force flips.",0,8],["Tutorial 10.13: A practical application of mutual inductance is the",["capacitor","DC motor","generator","transformer"],3,"A transformer's two coils are coupled by mutual inductance.","Two coupled coils: transformer.",0,8]]},{"t":"Maxwell's Equations, Electromagnetic Oscillation and Waves","s":["Introduction to Maxwell's Equations","Gauss's Law for Electric Field","Gauss's Law for Magnetic Fields","Faraday's Law of Induction","Ampere's Law and Wave Equations","Electromagnetic Waves and Spectrum","Oscillation","Waves","Tutorial"],"q":[["In 1845, Michael Faraday explained the measurable effect of",["heat on the path of a beam of light","a magnetic field on a beam of light","gravity on the path of a beam of light","an electric field on a bar magnet"],1,"The book says that in 1845 Faraday explained the effect of a magnetic field on a beam of light.","1845: Faraday and light.",0,0],["Faraday could not give the details of his idea because he had",["no laboratory of his own to use","no interest in the nature of light","limited mathematical ability","no access to electric power supplies"],2,"His limited mathematical ability prevented him from giving the details.","Faraday: little maths.",0,0],["In 1865, Maxwell predicted the existence of",["stationary charges that produce no fields","electromagnetic waves travelling at light speed","sound waves that travel through a vacuum","magnetic monopoles inside bar magnets"],1,"The book says in 1865 Maxwell predicted electromagnetic waves propagating at the speed of light.","1865: Maxwell's waves.",0,0],["Maxwell was described as",["a student of Joseph Henry in America","a rival of Michael Faraday in physics","a young admirer of Michael Faraday","an older teacher of Michael Faraday"],2,"The book calls him a young admirer of Faraday.","Maxwell admired Faraday.",0,0],["Maxwell noticed the closeness of the speed of light to",["the product ε₀μ₀ of the two constants","the ratio ε₀/μ₀ of the two constants","the inverse square root of ε₀μ₀","the sum ε₀ + μ₀ of the two constants"],2,"He believed this closeness was more than a coincidence.","c = 1 over root ε₀μ₀.",0,0],["Maxwell's contributions to Faraday's theory led to",["three fundamental laws of electromagnetism","two fundamental equations of electromagnetism","five fundamental equations of electromagnetism","four fundamental equations of electromagnetism"],3,"The four equations can be written in integral and differential forms.","Four Maxwell equations.",0,0],["In integral form, Gauss's law says the flux through a closed surface is proportional to",["the magnetic field times the area","the total charge outside the surface divided by ε₀","the area of the surface divided by ε₀","the total enclosed charge divided by ε₀"],3,"Electric charge produces an electric field, and the flux through any closed surface is proportional to the enclosed charge divided by ε₀.","Flux follows enclosed charge.",0,1],["In differential form, Gauss's law (∇·E = ρ/ε₀) says the electric field",["diverges from + charge and converges on − charge","circulates around any enclosed charge","converges on + charge and diverges from − charge","is zero near every charge in the region"],0,"That is the meaning of the differential form.","Diverge from plus.",0,1],["The electric field is defined as",["the electric energy per unit charge","the electric force per unit area","the electric force per unit charge","the electric charge per unit force"],2,"E = F/q₀. The unit is N/C.","E = F over q₀.",0,1],["Charges located outside a closed surface",["contribute no net flux through it","double the net flux through it","reverse the sign of the flux through it","decide the whole flux through it"],0,"They give equal inward and outward flux, so the net contribution is zero.","Outside charge: net zero.",0,1],["The enclosed charge for a line of charge with linear density λ and length L is",["q = λ/L","q = L/λ","q = λL","q = λL²"],2,"Linear charge density λ is in C/m.","q = λ L.",0,1],["The enclosed charge for a surface with charge density σ and area A is",["q = σA²","q = σ/A","q = σA","q = A/σ"],2,"Surface charge density σ is in C/m².","q = σ A.",0,1],["The enclosed charge for a volume with charge density ρ and volume V is",["q = ρV","q = ρV²","q = ρ/V","q = V/ρ"],0,"Volume charge density ρ is in C/m³.","q = ρ V.",0,1],["The permittivity of free space ε₀ is about",["8.85 × 10¹² C²/(N·m²)","1.60 × 10⁻¹⁹ C²/(N·m²)","8.85 × 10⁻⁹ C²/(N·m²)","8.85 × 10⁻¹² C²/(N·m²)"],3,"The book gives ε₀ ≈ 8.85 × 10⁻¹², also written in farads per metre.","ε₀ = 8.85 e-12.",0,1],["Applying Gauss's law to a point charge enclosed by a sphere gives back",["Newton's law","Ohm's law","Faraday's law","Coulomb's law"],3,"The book notes that Gauss's law is only a restatement of Coulomb's law.","Gauss restates Coulomb.",0,1],["Five charges of +3 nC, −2 nC, +2 nC, +4 nC and −1 nC sit inside a closed surface. The total enclosed charge is",["4 nC","6 nC","10 nC","8 nC"],1,"3 − 2 + 2 + 4 − 1 = 6 nC.","Add with signs.",0,1],["The flux through that surface (ε₀ = 8.85 × 10⁻¹²) is about",["0.678 N·m²/C","678 N·m²/C","6.78 N·m²/C","67 800 N·m²/C"],1,"Φ = Q/ε₀ = 6 × 10⁻⁹ ÷ 8.85 × 10⁻¹² = 678 N·m²/C.","Divide by ε₀.",0,1],["Which of these is one of the three basic types of problems solved with Gauss's law?",["Finding the speed of a wave from its frequency and wavelength","Finding the resistance of a wire from its length and area","Finding the period of a pendulum from its length","Finding enclosed charge from the flux through a closed surface"],3,"The book lists finding flux from the charge distribution, finding enclosed charge from the flux, and visualising the field near a charged object.","Flux in, charge out.",0,1],["A proton sits at the centre of the rim of a hemispherical bowl. The flux through the bowl is",["all of q/ε₀, about 1.81 × 10⁻⁸ N·m²/C","zero, since the proton lies on the rim","half of q/ε₀, about 9.04 × 10⁻⁹ N·m²/C","twice q/ε₀, about 3.62 × 10⁻⁸ N·m²/C"],2,"The bowl is half the sphere, so it gets half of the total flux q/ε₀ = 1.81 × 10⁻⁸.","Half sphere, half flux.",0,1],["Gauss's law for magnetic fields says the total magnetic flux through any closed surface is",["equal to μ₀","zero","equal to the enclosed current","always positive"],1,"∮B·dA = 0.","Closed surface, zero flux.",0,2],["In differential form, Gauss's law for magnetism is",["∇·B = 0","∇×B = 0","∇·B = μ₀J","∇·B = ρ/ε₀"],0,"The divergence of the magnetic field at any point is zero.","Div B zero.",0,2],["Gauss's law for magnetism agrees with the observation that",["magnetic field lines always start on a north pole","isolated magnetic poles (monopoles) do exist","isolated magnetic poles (monopoles) do not exist","magnetic forces act on charges that are at rest"],2,"Magnetic field lines are continuous loops, so every closed surface has as many lines in as out.","No monopoles.",0,2],["Magnetic field lines are",["continuous loops","lines that start on north poles and stop","straight lines only","lines that start on charges"],0,"Because they are continuous loops, the net flux through a closed surface is zero.","Loops, no end.",0,2],["Charged particles feel a magnetic force only if they are",["placed inside a vacuum with no air around","exposed only to a very weak magnetic field","at rest with respect to the magnetic field","in motion with respect to the magnetic field"],3,"The Lorentz force F = qv × B needs motion.","Magnetic force needs motion.",0,2],["In integral form, Faraday's law says that a changing magnetic flux through a surface induces",["a steady magnetic field across the surface","an e.m.f. in the boundary of that surface","a charge on the surface of that boundary","a gravitational force on that surface"],1,"A changing flux induces an e.m.f. in any boundary path of that surface.","Changing flux, e.m.f.",0,3],["The induced e.m.f. in Faraday's law is ε = ",["−dΦ_B/dt","−Φ_B dt","+dΦ_B/dt","Φ_B/dt²"],0,"The minus sign shows that the induced e.m.f. opposes the changing flux.","Minus: opposes.",0,3],["A changing magnetic field induces",["a circulating electric field","no field","a gravitational field","a static electric field only"],0,"In differential form, a circulating electric field is produced by a magnetic field that changes with time.","Changing B makes circulating E.",0,3],["E.m.f. is a measure of",["the resistance that opposes current in a circuit","the energy that drives current round a circuit","the magnetic field produced by a circuit","the charge that is stored in a circuit"],1,"The book gives e.m.f. as the energy that causes current to flow.","E.m.f. drives current.",0,3],["Which of these works on Faraday's law?",["A resistor","A battery","A transformer","A capacitor"],2,"Transformers, induction cookers, electromagnetic flowmeters, electric guitars and electric violins use Faraday's law.","Transformer: Faraday.",0,3],["An induction cooker works on the principle of",["static electricity","thermal expansion","self-heating of a battery","mutual induction"],3,"It works on mutual induction, based on Faraday's law.","Induction cooker: mutual induction.",0,3],["An electromagnetic flowmeter records the",["velocity of fluids","temperature of fluids","mass of fluids","colour of fluids"],0,"It induces an e.m.f. to record the velocity of fluids.","Flowmeter: fluid speed.",0,3],["Which musical instruments find an application of Faraday's law?",["Acoustic guitar and wooden violin","Electric guitar and electric violin","Concert harp and xylophone bars","Brass trumpet and wooden flute"],1,"The book names the electric guitar and the electric violin.","Electric guitar and violin.",0,3],["The flux through a loop is Φ = (6t² + 7t + 1) mWb, with t in seconds. The induced e.m.f. at t = 2 s has magnitude",["12 mV","25 mV","31 mV","7 mV"],2,"ε = dΦ/dt = (12t + 7) mV = 12(2) + 7 = 31 mV.","Differentiate, then put in t.",0,3],["In integral form, Ampere's law says the line integral of the magnetic field around a closed path is proportional to",["the electric flux only","the length of the path only","the net current through the path","the charge on the path"],2,"A current-carrying conductor generates a magnetic field around it. The line integral is proportional to the net current enclosed.","B around loop, current inside.",0,4],["Maxwell's form of Ampere's law adds a term due to",["a changing resistance","a static charge","a steady electric field","a changing electric field"],3,"The differential form is ∇×B = μ₀J + μ₀ε₀ ∂E/∂t.","Changing E adds a term.",0,4],["From Maxwell's equations we can derive",["Boyle's law","Ohm's law","Hooke's law","the wave equation"],3,"For the electric field, ∇²E = μ₀ε₀ ∂²E/∂t², and a matching equation holds for B.","Maxwell gives the wave equation.",0,4],["The wave equations from Maxwell's equations contain the product",["μ₀ε₀","μ₀ − ε₀","μ₀ + ε₀","μ₀/ε₀"],0,"The coefficient of the time derivative is μ₀ε₀.","μ₀ times ε₀.",0,4],["Electromagnetism is the study of",["the interaction of electric and magnetic fields","the motion of sound waves through air alone","the behaviour of static electric charges only","the flow of heat between hot and cold bodies"],0,"It studies the facets of interaction between electricity and magnetism.","Electric plus magnetic.",0,5],["A static distribution of charges produces",["a magnetic field only","an electric field","a gravitational wave","no field"],1,"Charges in motion (a current) produce a magnetic field.","Static charge, E field.",0,5],["In an electromagnetic wave, the electric and magnetic fields are",["parallel to each other and to the wave direction","perpendicular to the wave but parallel to each other","perpendicular to each other and to the wave direction","zero except at the crest of the wave"],2,"The fields are at right angles to each other and to the direction of travel.","E, B and wave: all at 90°.",0,5],["Which of these is a similarity between electric and magnetic fields?",["Both act only on charges at rest","Both are always uniform","Both produce forces on charges","Neither can carry energy"],2,"Both produce forces on charges and both can transport energy.","Both push charges.",0,5],["Electric field energy is released in",["a compass","lightning","a transformer core","a permanent magnet"],1,"The book says electric field energy is used in electrical circuits and released in lightning. Magnetic field energy is carried through a transformer.","Lightning: electric field.",0,5],["The relation between speed, wavelength and frequency of electromagnetic radiation is",["c = f + λ","c = fλ","c = λ/f","c = f/λ"],1,"Speed equals frequency times wavelength.","c = f λ.",0,5],["In the electromagnetic spectrum, the order from microwaves up to the highest frequency is",["microwaves, X-rays, infrared, visible, ultraviolet, gamma rays","gamma rays, X-rays, ultraviolet, visible, infrared, microwaves","infrared, microwaves, ultraviolet, visible, gamma rays, X-rays","microwaves, infrared, visible, ultraviolet, X-rays, gamma rays"],3,"The book arranges the spectrum from microwaves to gamma rays.","Micro, infra, visible, UV, X, gamma.",0,5],["Among these, which has the highest energy?",["Gamma rays","Infrared radiation","Visible light","Microwaves"],0,"The higher the frequency, the higher the spectral energy. Gamma rays have the highest frequency.","Higher frequency, more energy.",0,5],["Amplitude modulation (AM) conveys information by changing the",["wavelength only","strength of the signal","frequency of the wave","speed of the wave"],1,"Frequency modulation (FM) changes the frequency of the wave instead.","AM: amplitude.",0,5],["Frequency modulation (FM) conveys information by changing the",["direction of travel","strength of the signal","resistance of the antenna","frequency of the wave"],3,"FM uses changes in the wave's frequency.","FM: frequency.",0,5],["FM is better than AM in",["the length of wire needed in the set","signal strength changes with distance","immunity to environmental influences","the speed at which it travels"],2,"The book says FM is superior in immunity to environmental influences.","FM resists interference.",0,5],["When an object moves back and forth, its motion is called",["rotational motion about an axis","projectile motion under gravity","linear motion at steady speed","oscillatory or periodic motion"],3,"Oscillation shows how waves, electricity and magnetism are related.","Back and forth, periodic.",0,6],["The amplitude of an oscillation is the",["number of oscillations per second","maximum displacement","time for one oscillation","distance between two crests"],1,"Amplitude is the maximum displacement.","Amplitude: biggest displacement.",0,6],["The period of an oscillation is the",["time taken to complete one oscillation","number of oscillations in one second","speed of the wave","maximum displacement"],0,"Frequency is the number of oscillations completed in one second.","Period: time for one.",0,6],["The frequency of an oscillation is the",["number of oscillations completed in one second","distance covered in one full oscillation","maximum displacement from the rest position","time taken to complete one oscillation"],0,"The unit is the hertz.","Frequency: per second.",0,6],["A vibration has a period of 0.01667 s. Its frequency is about",["600 Hz","6 Hz","0.06 Hz","60 Hz"],3,"f = 1/T = 1 ÷ 0.01667 = 60 Hz.","Invert the period.",0,6],["A building sways with a frequency of about 0.1 Hz. Its period is",["0.1 s","100 s","1 s","10 s"],3,"T = 1/f = 1 ÷ 0.1 = 10 s.","Invert the frequency.",0,6],["A wave is",["a fixed pattern that stays in one place","a steady flow of charge through a wire","a travelling disturbance from equilibrium","a stationary object at its rest position"],2,"That is the book's definition.","Wave: travelling disturbance.",0,7],["Mechanical waves",["require a medium or material for propagation","need no medium in order to propagate","are always transverse in every medium","travel only through a perfect vacuum"],0,"Electromagnetic waves do not need a medium.","Mechanical needs a medium.",0,7],["In a transverse wave, the particle displacement is",["random","perpendicular to the direction of propagation","parallel to the direction of propagation","always zero"],1,"In a longitudinal wave the displacement is parallel to the direction of propagation.","Transverse: right angle.",0,7],["In a longitudinal wave, the particle displacement is",["parallel to the direction of propagation","always zero","circular","perpendicular to the direction of propagation"],0,"The motion is along the direction in which the wave travels.","Longitudinal: along.",0,7],["The wavelength is the distance between",["two points on the same wavefront","a crest and the next trough along","two successive crests or two troughs","the wave source and the observer"],2,"Wavelength is denoted by λ.","Crest to crest.",0,7],["The relation between wave speed, frequency and wavelength is",["v = λ/f","v = f + λ","v = f/λ","v = fλ"],3,"Speed equals frequency times wavelength.","v = f λ.",0,7],["A water wave oscillates up and down three times each second. The distance between crests is 2 m. The wave speed is",["5 m/s","6 m/s","1.5 m/s","0.67 m/s"],1,"f = 3 Hz and λ = 2 m, so v = fλ = 6 m/s.","Multiply f by λ.",0,7],["The general form of a sinusoidal wave is",["y(x, t) = A sin(kx + ωt) ÷ φ","y(x, t) = A kx × ωt + φ","y(x, t) = A cos(x ÷ t) + φ","y(x, t) = A sin(kx − ωt + φ)"],3,"A is the amplitude, k the wavenumber, ω the angular frequency and φ the initial phase.","A sin(kx − ωt + φ).",0,7],["The wavenumber k of a wave is",["k = 2π/λ","k = 2π/f","k = λ/2π","k = 2πλ"],0,"k = 2π/λ.","k: 2π over wavelength.",0,7],["The angular frequency of a wave is",["ω = 2πf","ω = f²","ω = 2π/f²","ω = f/2π"],0,"ω = 2πf = 2π/T.","ω = 2πf.",0,7],["For the wave y = 0.2 sin(6.28x − 1.57t) metres, the amplitude is",["4 m","0.2 m","6.28 m","1.57 m"],1,"The amplitude is the coefficient in front of the sine.","Read A off the front.",0,7],["For the same wave, the period is",["4 s","2 s","1.57 s","0.25 s"],0,"T = 2π/ω = 2 × 3.14 ÷ 1.57 = 4 s.","T = 2π/ω.",0,7],["For the same wave, the wave speed is",["4 m/s","0.25 m/s","6.28 m/s","1.57 m/s"],1,"v = ω/k = 1.57 ÷ 6.28 = 0.25 m/s.","v = ω over k.",0,7],["Tutorial 11.2: The Sears Building in Chicago sways at about 0.1 Hz. Its period of vibration is",["1 s","100 s","0.1 s","10 s"],3,"T = 1/f = 1 ÷ 0.1 = 10 s.","T = 1/f.",0,8],["Tutorial 11.3: A water wave oscillates up and down 3 times each second and the distance between crests is 2 m. The wave speed is",["5 m/s","1.5 m/s","6 m/s","0.67 m/s"],2,"f = 3 Hz and λ = 2 m. v = fλ = 3 × 2 = 6 m/s.","v = fλ.",0,8],["Tutorial 11.5: For y = 0.2 sin(0.04t + 0.02x − 2/6), x in cm, the minimum distance between two particles vibrating in the same phase is",["0.02 cm","314 cm","157 cm","50 cm"],1,"k = 2π/λ = 0.02, so λ = 2π/0.02 = 314 cm.","Same-phase spacing is one wavelength.",0,8],["Tutorial 11.6: What is the electric flux through a sphere containing 15 protons and 10 electrons? (ε₀ = 8.85 × 10⁻¹² C²/N·m²)",["0","2.8 × 10⁻⁷ N·m²/C","9.0 × 10⁻⁸ N·m²/C","4.5 × 10⁻⁷ N·m²/C"],2,"Net charge = 5 × 1.6 × 10⁻¹⁹ = 8.0 × 10⁻¹⁹ C. Φ = q/ε₀ = 8.0 × 10⁻¹⁹ ÷ 8.85 × 10⁻¹² = 9.0 × 10⁻⁸ N·m²/C.","Protons minus electrons first, then divide by ε₀.",0,8],["Tutorial 11.8: A proton rests at the centre of a sphere. The flux through half the sphere is about (ε₀ = 8.85 × 10⁻¹²)",["9.0 × 10⁻⁷ N·m²/C","1.8 × 10⁻⁸ N·m²/C","0","9.0 × 10⁻⁹ N·m²/C"],3,"Total flux = e/ε₀ = 1.8 × 10⁻⁸. Half of it goes through a hemisphere: 9.0 × 10⁻⁹ N·m²/C.","Half the sphere, half the flux.",0,8]]}];

try{ if(window.IndigeneHistory&&IndigeneHistory.registerStruct) IndigeneHistory.registerStruct('PHY102',{title:'PHY 102 \u00b7 Electricity and Magnetism',chapters:DATA.map(function(c){return {t:c.t,n:c.q.length,s:c.s};})}); }catch(e){}
const SUBJECT_KEY = 'phy102';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// flatten
const ALL = [];
DATA.forEach((c,ci)=>c.q.forEach((q,qi)=>ALL.push({id:ci+'_'+qi, ch:ci, stem:q[0], opts:q[1], ans:q[2], exp:q[3], hack:q[4], trap:q[5], sec:q[6], img:q[7]||''})));
const TOTAL = ALL.length;
// questions already served in earlier runs (kept per browser) so new runs favour fresh ones
let SEEN = new Set();
try{ SEEN = new Set(JSON.parse(localStorage.getItem('phy102_seen')||'[]')); }catch(e){}
function saveSeen(){ try{ localStorage.setItem('phy102_seen', JSON.stringify([...SEEN])); }catch(e){} }
// shuffle, then put unseen questions first (random order inside each half)
function freshFirst(arr){ const a=shuffle(arr.slice()); return a.filter(q=>!SEEN.has(q.id)).concat(a.filter(q=>SEEN.has(q.id))); }
const FULL_N = 500;
// fair sample: every chapter is represented in proportion to its size
function sampleFair(n){
  const groups = DATA.map((_,ci)=>freshFirst(ALL.filter(q=>q.ch===ci)));
  const exact = groups.map(g=>g.length*n/TOTAL);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a,b)=>a+b,0);
  exact.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([f,i])=>{ if(left>0 && take[i]<groups[i].length){ take[i]++; left--; } });
  let out=[]; groups.forEach((g,i)=>{ out=out.concat(g.slice(0,take[i])); });
  return shuffle(out);
}

// optional access gate (cbt-lock.js) — never breaks the quiz if missing
let lock = null;
async function loadLock(){
  try { lock = await import('../cbt-lock.js'); }
  catch(e){ try { lock = await import('/cbt-lock.js'); } catch(e2){ lock = null; } }
}
const lockReady = loadLock();

const PASS = 50;
const grade = p => p>=70?'A':p>=60?'B':p>=50?'C':p>=45?'D':p>=40?'E':'F';
let mode = 'full', sel = new Set(), secSel = null, run = [], idx = 0, weakSpec = null;
// '2.3,4.all' = chapter 2 section 3, whole of chapter 4 (sent from the History tab or the result screen)
function specPool(spec){
  const want = spec.map(s=>s.split('.')); let pool = [];
  want.forEach(([c,s])=>{ const ci=(+c)-1; if(!DATA[ci]) return;
    pool = pool.concat(ALL.filter(q=>q.ch===ci && (s==='all' || q.sec===(+s)-1))); });
  pool = shuffle(pool); return pool.length>50 ? pool.slice(0,50) : pool;
}

function renderSetup(){
  const quick = 50, half = 250;
  const cards = [
    ['full', FULL_N, 'Full CBT'],
    ['quick', quick, 'Quick Drill'],
    ['half', half, 'Half Run'],
    ['session', '🎯', 'By Chapter']
  ];
  $('runs').innerHTML = cards.map(c=>`<button class="run${c[0]===mode?' sel':''}" data-m="${c[0]}"><span class="n">${c[1]}</span>${c[2]}</button>`).join('');
  document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; renderSetup(); });
  $('chaps').classList.toggle('show', mode==='session');
  $('chapList').innerHTML = DATA.map((c,i)=>{
    const on = sel.has(i);
    let x = `<div class="chap${on?' on':''}" data-i="${i}"><span class="box" style="border-radius:50%">${on?'●':''}</span><span class="nm">Ch ${i+1}. ${esc(c.t)}</span><span class="ct">${c.q.length}</span></div>`;
    if(on){
      x += '<div class="secs"><button class="sec'+(secSel===null?' on':'')+'" data-s="all">Whole chapter · '+c.q.length+'</button>'
        + c.s.map((sn,si)=>'<button class="sec'+(secSel===si?' on':'')+'" data-s="'+si+'">'+esc(sn)+' · '+c.q.filter(q=>q[6]===si).length+'</button>').join('') + '</div>';
    }
    return x;
  }).join('');
  document.querySelectorAll('.chap').forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; sel.clear(); sel.add(i); secSel=null; renderSetup(); });
  document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{ secSel = b.dataset.s==='all' ? null : +b.dataset.s; renderSetup(); });
}

function makeItem(q){
  return { q, perm: shuffle([0,1,2,3]), pick: null };   // perm = order of original options shown 
}

async function startQuiz(){
  if(mode==='session' && sel.size===0){ toast('Pick a chapter first'); return; }
  try{ await lockReady; }catch(e){}
  if(lock && typeof lock.checkCbtAccess==='function'){
    try{
      const r = await lock.checkCbtAccess(SUBJECT_KEY);
      if(r && r.blocked){ lock.renderCbtLockScreen($('app'), r.reason); return; }
    }catch(e){}
  }
  let pool;
  if(mode==='full') pool = sampleFair(FULL_N);
  else if(mode==='quick') pool = freshFirst(ALL).slice(0,50);
  else if(mode==='half') pool = sampleFair(250);
  else if(mode==='weak') pool = specPool(weakSpec||[]);
  else {
    pool = [];
    [...sel].sort((a,b)=>a-b).forEach(ci=>{ pool = pool.concat(ALL.filter(q=>q.ch===ci && (secSel===null || q.sec===secSel))); });
  }
  if(!pool.length){ toast('Nothing to practise there'); return; }
  begin(pool);
}

let startedAt = 0, isRetry = false, saved = false;
let reviewing=false;
function begin(pool, retry){
  reviewing=false; $('finishBtn').textContent='Finish & see score';
  run = pool.map(makeItem); idx = 0; startedAt = Date.now(); isRetry = !!retry; saved = false;
  if(!retry){ pool.forEach(q=>SEEN.add(q.id)); if(SEEN.size >= TOTAL) SEEN = new Set(); saveSeen(); }
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  window.scrollTo(0,0);
  renderQ();
}

function counts(){
  let ok=0,no=0;
  run.forEach(it=>{ if(it.pick!==null){ it.pick===it.q.ans ? ok++ : no++; } });
  return {ok,no};
}

function renderQ(){
  const it = run[idx], q = it.q, c = counts();
  $('qpos').textContent = `Q ${idx+1} / ${run.length}`;
  $('sOk').textContent = c.ok; $('sNo').textContent = c.no;
  $('bar').style.width = ((c.ok+c.no)/run.length*100)+'%';
  $('chtag').textContent = `Ch ${q.ch+1} · ${DATA[q.ch].t}`;
  $('qtext').textContent = q.stem;
  if(q.img&&IMGS[q.img]){ $('qimgEl').src=IMGS[q.img]; $('qimg').classList.remove('hidden'); } else { $('qimg').classList.add('hidden'); $('qimgEl').removeAttribute('src'); }
  const L = ['A','B','C','D'];
  const answered = it.pick!==null || reviewing;
  $('opts').innerHTML = it.perm.map((oi,pos)=>{
    let cls='opt';
    if(answered){ cls+=' locked'; if(oi===q.ans) cls+=' correct'; else if(oi===it.pick) cls+=' wrong'; }
    return `<button class="${cls}" data-oi="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join('');
  if(!answered) document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  renderFb();
  $('prev').disabled = idx===0;
  $('next').textContent = idx===run.length-1 ? (reviewing?'Done ▶':'Finish ▶') : 'Next ▶';
}

function renderFb(){
  const it = run[idx], q = it.q;
  if(it.pick===null && !reviewing){ $('fb').innerHTML=''; return; }
  const good = it.pick===q.ans;
  const pos = 'ABCD'[it.perm.indexOf(q.ans)];
  $('fb').innerHTML = `<div class="fb">
    ${q.trap?'<span class="trap">⚠ TRAP QUESTION</span>':''}
    <div class="v ${good?'ok':'no'}">${good?'✅ Correct!':it.pick===null?'⏭ Skipped — the answer is '+pos:'❌ Not quite — the answer is '+pos}</div>
    <p class="ex">${esc(q.exp)}</p>
    <div class="hk">⏱ Speed hack: ${esc(q.hack)}</div>
  </div>`;
}

function choose(oi){
  const it = run[idx];
  if(it.pick!==null || reviewing) return;
  it.pick = oi;
  try{ if(lock && typeof lock.recordCbtQuestionUsed==='function') lock.recordCbtQuestionUsed(); }catch(e){}
  renderQ();
}

$('prev').onclick=()=>{ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0);} };
$('next').onclick=()=>{ if(idx<run.length-1){ idx++; renderQ(); window.scrollTo(0,0);} else if(reviewing) backToResult(); else finish(); };
function startReview(){
  reviewing=true; idx=0;
  $('finishBtn').textContent='Back to result';
  $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  renderQ(); window.scrollTo(0,0);
}
function backToResult(){ reviewing=false; $('finishBtn').textContent='Finish & see score'; finish(); }
$('finishBtn').onclick=()=>{
  if(reviewing){ backToResult(); return; }
  const left = run.filter(i=>i.pick===null).length;
  if(left===0){ finish(); return; }
  $('cmsg').textContent = left+' question(s) not answered yet. Finish anyway?';
  $('cov').classList.add('show');
};
$('cYes').onclick=()=>{ $('cov').classList.remove('show'); finish(); };
$('cNo').onclick=()=>$('cov').classList.remove('show');

function openMap(){
  $('map').innerHTML = run.map((it,i)=>{
    let c=''; if(it.pick!==null) c = it.pick===it.q.ans?'ok':'no';
    if(i===idx) c+=' cur';
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; $('ov').classList.remove('show'); renderQ(); window.scrollTo(0,0); });
  $('ov').classList.add('show');
}
$('mapBtn').onclick=openMap;
$('closeMap').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{ if(e.target.id==='ov') $('ov').classList.remove('show'); };

function saveHistory(c){
  if(saved || isRetry) return;
  const answered = c.ok + c.no;
  if(answered<=0) return;
  saved = true;
  try{
    if(window.IndigeneHistory && typeof window.IndigeneHistory.save==='function'){
      const topics = {};
      run.forEach(it=>{
        if(it.pick===null) return;
        const k = 'Ch '+(it.q.ch+1)+' · '+DATA[it.q.ch].s[it.q.sec];
        if(!topics[k]) topics[k]=[0,0];
        topics[k][1]++; if(it.pick===it.q.ans) topics[k][0]++;
      });
      window.IndigeneHistory.save({course:'PHY102', mode:'cbt', correct:c.ok, total:answered,
        secs:Math.round((Date.now()-startedAt)/1000), topics:topics});
    }
  }catch(e){}
}
function finish(){
  const c = counts(), n = run.length, un = n-c.ok-c.no;
  const pct = n? Math.round(c.ok/n*100):0;
  const msg = pct>=70?'Outstanding. You are ready for the exam. 🔥':pct>=50?'You passed. Keep pushing higher and clear every section.':pct>=40?'Close. Revise the failed sections and run again.':'Keep going. Read the failed sections again, then retry.';
  saveHistory(c);
  const chs = {}, secs = {};
  run.forEach(it=>{
    const q = it.q, good = it.pick===q.ans;
    const a = chs[q.ch] || (chs[q.ch] = {ok:0,n:0}); a.n++; if(good) a.ok++;
    const k = q.ch+'_'+q.sec; const b = secs[k] || (secs[k] = {ch:q.ch,sec:q.sec,ok:0,n:0}); b.n++; if(good) b.ok++;
  });
  const chKeys = Object.keys(chs).map(Number).sort((x,y)=>x-y);
  const pc = x => Math.round(x.ok/x.n*100);
  const need = ci => Math.max(8, Math.ceil(DATA[ci].q.length*0.4));
  const rows = chKeys.map(ci=>{
    const a = chs[ci], s = pc(a), full = a.n>=need(ci), ok = s>=PASS;
    const sr = Object.values(secs).filter(x=>x.ch===ci).sort((x,y)=>x.sec-y.sec).map(x=>`<div class="sr"><span>${esc(DATA[ci].s[x.sec])}</span><b class="${pc(x)>=PASS?'pass':'fail'}">${x.ok}/${x.n} · ${pc(x)}%</b></div>`).join('');
    return `<details class="cres"${(full&&!ok)?' open':''}><summary><span>Ch ${ci+1} · ${esc(DATA[ci].t)}</span><b class="${!full?'na':ok?'pass':'fail'}" style="white-space:nowrap">${s}/100 · ${grade(s)} · ${!full?'PRACTICE':ok?'PASS ✔':'FAIL ✖'}</b></summary>${sr}</details>`;
  }).join('');
  const weak = Object.values(secs).filter(x=>x.n>=2 && pc(x)<PASS).sort((x,y)=>x.ch-y.ch||x.sec-y.sec);
  const revise = weak.length ? `<div class="revise"><b>Revise these sections</b>${weak.map(x=>`<div class="sr"><span>Ch ${x.ch+1} · ${esc(DATA[x.ch].s[x.sec])}</span><b class="fail">${pc(x)}%</b></div>`).join('')}</div>` : '<p class="msg pass"><b>Every section in this run is at pass mark or above.</b></p>';
  const fullKeys = chKeys.filter(ci=>chs[ci].n>=need(ci));
  const passedN = fullKeys.filter(ci=>pc(chs[ci])>=PASS).length;
  const wrong = run.filter(it=>it.pick!==null && it.pick!==it.q.ans);
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  window.scrollTo(0,0);
  $('result').innerHTML = `
    <h2>Result</h2>
    <div class="big" style="font-size:2.2rem">${pct}/100 · ${grade(pct)}</div>
    <div class="stats"><span>Correct <b>${c.ok}</b></span><span>Wrong <b>${c.no}</b></span><span>Skipped <b>${un}</b></span><span>Total <b>${n}</b></span></div>
    <p class="msg"><b class="${pct>=PASS?'pass':'fail'}">${pct>=PASS?'PASS':'FAIL'}</b> · pass mark ${PASS}/100 · ${fullKeys.length?'chapters passed in this run '+passedN+'/'+fullKeys.length:'practice run, no chapter pass or fail'}</p>
    <p class="msg">${msg}</p>
    <h2 style="margin-top:16px">Score per chapter</h2>
    ${rows}
    <p class="msg" style="font-size:.8rem;color:var(--mute)">PRACTICE means this run had under 40% of that chapter's questions, so it shows a score but no pass or fail.</p>
    ${revise}
    ${weak.length?'<button class="btn" id="weakBtn">Practice these weak sections ('+weak.length+')</button>':''}
    <button class="btn" id="reviewBtn">Review answers${wrong.length?' ('+wrong.length+' wrong)':''}</button>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="/#history=PHY102">My history</a>
    ${wrong.length?`<button class="btn" id="retryWrong">Retry wrong answers (${wrong.length})</button>`:''}
    <button class="btn ghost" id="newRun">New run</button>
    `;
  $('reviewBtn').onclick=startReview;
  if($('weakBtn')) $('weakBtn').onclick=()=>{ weakSpec=weak.map(x=>(x.ch+1)+'.'+(x.sec+1)); mode='weak'; startQuiz(); };
  if($('retryWrong')) $('retryWrong').onclick=()=>begin(shuffle(wrong.map(w=>w.q)), true);
  $('newRun').onclick=()=>{ $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); renderSetup(); window.scrollTo(0,0); };
}

document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden') || $('ov').classList.contains('show') || $('cov').classList.contains('show')) return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ const it=run[idx]; if(it.pick===null){ choose(it.perm['abcd'.indexOf(k)]); } }
  else if(e.key==='ArrowRight') $('next').click();
  else if(e.key==='ArrowLeft') $('prev').click();
});

$('startBtn').onclick=startQuiz;
renderSetup();
try{
  const pr = new URLSearchParams(location.search).get('practice');
  if(pr && /^[\d.,all]+$/.test(pr)){ weakSpec = pr.split(',').filter(Boolean); mode='weak'; startQuiz(); }
}catch(e){}
</script>
</body>
</html>
