<style>
:root{
  --bg:#120a07; --bg2:#1a0f0a; --card:#1c110b; --line:#4a2a17;
  --fire:#ff6a1a; --fire2:#d4400f; --gold:#ffb347; --text:#f3e7dc; --mute:#b49a88;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#3a1a0b 0%,var(--bg) 55%) fixed;
  color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh;
  padding:20px 16px 40px;line-height:1.5;
}
#app{max-width:720px;margin:0 auto}
h1.brand{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--fire);text-align:center;
  letter-spacing:.08em;font-size:2.1rem;margin:8px 0 6px;text-shadow:0 0 18px rgba(255,106,26,.35)}
.sub{font-family:'Orbitron',sans-serif;text-align:center;color:var(--mute);font-size:.9rem;letter-spacing:.06em;margin:0 0 20px}
.panel{background:linear-gradient(180deg,var(--card),#150c08);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
.panel h2{font-family:'Orbitron',sans-serif;color:var(--gold);text-align:center;font-size:1.35rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run{background:#150c08;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer;transition:.15s}
.run .n{display:block;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold);font-size:1.5rem;margin-bottom:2px}
.run.sel{background:linear-gradient(135deg,var(--fire),var(--fire2));border-color:var(--gold);box-shadow:0 0 16px rgba(255,106,26,.35)}
.run.sel .n{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;cursor:pointer;
  background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-family:'Exo 2',sans-serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.03em;box-shadow:0 8px 22px rgba(255,106,26,.28)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#150c08;border:1px solid var(--line);color:var(--text);box-shadow:none}
.foot{color:var(--mute);text-align:center;font-size:.92rem;margin-top:16px}
.chaps{margin-top:14px;display:none}
.chaps.show{display:block}
.chaps .tools{display:flex;gap:8px;margin-bottom:8px}
.chaps .tools button{flex:1;background:#150c08;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;font-weight:600;cursor:pointer}
.chap{display:flex;align-items:center;gap:10px;background:#150c08;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.chap.on{border-color:var(--gold);background:#24140c}
.chap .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#000}
.chap.on .box{background:var(--gold);border-color:var(--gold)}
.chap .nm{flex:1;font-size:.98rem}
.chap .ct{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.85rem}

/* progress + sections */
.secs{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px 4px}
.sec{border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:20px;padding:5px 11px;font-size:.82rem;cursor:pointer;font-family:inherit}
.sec.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
details.cres{border:1px solid var(--line);background:#150c08;border-radius:14px;margin-top:10px}
details.cres>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.cres>summary::-webkit-details-marker{display:none}
.cres .sr,.revise .sr{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.cres .sr{padding:8px 14px;border-top:1px solid var(--line)}
.revise{border:1px solid var(--bad);background:var(--badbg);border-radius:14px;padding:12px 14px;margin-top:14px}
.revise .sr{padding:6px 0}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--mute);margin-bottom:8px}
.top .sc{font-family:'Orbitron',sans-serif;font-size:.85rem}
.top .sc b.g{color:var(--ok)} .top .sc b.r{color:var(--bad)}
.bar{height:6px;background:#2a170d;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .25s}
.chtag{display:inline-block;font-size:.78rem;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);
  color:var(--text);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-family:inherit;font-size:1.02rem;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#2a170d;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem}
.opt:not(.locked):hover{border-color:var(--fire)}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .l{background:var(--ok);color:#001a0a}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#2a0000}
.fb{border:1px solid var(--line);border-left:4px solid var(--gold);background:#1a0f0a;border-radius:12px;padding:12px 14px;margin-top:6px}
.fb .v{font-weight:700;margin-bottom:6px}
.fb .v.ok{color:var(--ok)} .fb .v.no{color:var(--bad)}
.fb .trap{display:inline-block;background:var(--fire);color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.fb .ex{margin:0 0 8px}
.fb .hk{color:var(--gold);font-weight:600}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:12px;padding:13px 8px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.nav button.primary{background:linear-gradient(135deg,var(--fire),var(--fire2));border:0;color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

/* map */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.ov h3{font-family:'Orbitron',sans-serif;color:var(--gold);margin:0 0 10px;font-size:1.05rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:38px;border-radius:8px;border:1px solid var(--line);background:#150c08;color:var(--mute);font-family:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
.map button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.map button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--gold)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:10px 0}

/* result */
.big{font-family:'Orbitron',sans-serif;font-size:3rem;color:var(--gold);text-align:center;margin:6px 0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;color:var(--mute)}
.stats b{color:var(--text)}
.msg{text-align:center;color:var(--text);margin:8px 0 6px}
.rv{border:1px solid var(--line);background:#150c08;border-radius:14px;padding:12px 14px;margin-top:12px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .you{color:var(--bad)} .rv .cor{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a170d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}
@media (max-width:420px){.q{font-size:1.08rem}h1.brand{font-size:1.8rem}}

.qimg{position:relative;margin:0 0 12px;background:#fff;border-radius:10px;border:1px solid var(--line,#3a2218);overflow:hidden;cursor:zoom-in}
.qimg img{display:block;width:100%;height:auto;object-fit:contain}
.qimg .tapz{display:block;font-size:.72rem;background:#120a07;color:#ffb347;padding:4px 8px;text-align:center}
#lb{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}
#lb.show{display:flex}
#lbv{flex:1;overflow:auto;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch;text-align:center}
#lbv img{background:#fff;width:100%;height:auto;max-width:none;display:block;margin:0 auto}
#lbb{display:flex;gap:8px;justify-content:center;padding:10px;background:#120a07}
#lbb button{background:#2a160d;color:#ffb347;border:1px solid #ff6a1a;border-radius:8px;padding:10px 18px;font-size:1rem;font-weight:700}
</style>

<script>
const DATA = [{"t":"Electrostatics and Conservation Law of Electric Charges","s":["Electric Charge","Structure of Matter","Electric Charge Conservation","The Law of Charges","Conductors and Insulators","Charging by Induction","Coulomb's Law","Tutorial"],"q":[["Electrostatics is the science of what?",["Moving charges in a wire","Magnetic fields of magnets","Static (stationary) electricity","Heat flow in metals"],2,"The book defines electrostatics as the science of static, or stationary, electricity.","Static = stays still.",0,0],["How does electrostatics differ from current electricity?",["The charges do not flow","The charges flow in both directions","The charges flow in one direction only","It only happens in metals"],0,"In electrostatics the charges stay in place. In current electricity they flow.","Electrostatics: no flow.",0,0],["A plastic comb run through hair picks up small pieces of paper. This happens because the comb",["induces an opposite charge in the paper","turns the paper into a temporary magnet","reduces the weight of the paper itself","heats the paper until it clings on"],0,"The charged comb induces an opposite charge in the paper. Opposite charges attract, so the paper sticks to the comb.","Comb induces, opposites attract.",0,0],["How many kinds of electric charge are there?",["Three","Two","Four","One"],1,"There are exactly two kinds of charge. They are called negative and positive.","Two kinds: plus and minus.",0,0],["In the comb and paper example, the names negative and positive were given to the charge on",["the hair and the comb, respectively","the comb and the paper, respectively","the paper and the comb, respectively","the paper and the hair, respectively"],1,"The book says the comb carries negative charge and the paper carries positive charge.","Comb negative, paper positive.",0,0],["Which three particles describe the structure of an atom?",["Electron, proton, photon","Electron, neutron, ion","Proton, neutron, positron","Electron, proton, neutron"],3,"The atom is described by the negative electron, the positive proton and the uncharged neutron.","E, P, N.",0,1],["Which atomic particle carries no charge?",["Electron","Quark","Neutron","Proton"],2,"The neutron is uncharged. The proton is positive and the electron is negative.","Neutron = neutral.",0,1],["Where are the protons and neutrons found in an atom?",["In the nucleus at the centre","In orbits around the nucleus","In the electron cloud","On the outer shell"],0,"Protons and neutrons sit in the nucleus. The electrons orbit outside it.","Nucleus holds P and N.",0,1],["Protons and neutrons are made up of smaller entities called",["isotopes","quarks","photons","ions"],1,"The book says the nucleus particles are themselves made of entities called quarks.","Quarks make protons.",0,1],["What holds the electrons within a fixed distance of the nucleus?",["Strong nuclear force from the neutrons inside","Magnetic force from the protons in the nucleus","Gravitational pull of the whole nucleus mass","Attractive electric force from the positive nucleus"],3,"Electrons are held by the electric attraction of the positively charged nucleus.","Electrons: electric pull.",0,1],["What holds the protons and neutrons together inside the nucleus?",["The strong nuclear force","Gravitational pull of the electrons","The weak electric force","Electron repulsion"],0,"The attractive strong nuclear force binds the nucleus.","Nucleus glue = strong nuclear.",0,1],["The strong nuclear force is described as",["short range, not extending far beyond the nucleus","long range, reaching neighbouring atoms freely","identical to the electric force between charges","present only in metals and their alloys"],0,"It is a short range force and its effects do not extend far beyond the nucleus.","Strong but short range.",0,1],["Which particle has the smallest mass?",["All have equal mass","Proton","Electron","Neutron"],2,"Proton and neutron have nearly the same mass. The electron is far lighter.","Electron is the lightweight.",0,1],["The mass of an electron is about",["1.67 × 10⁻²⁷ kg","1.60 × 10⁻¹⁹ kg","9.11 × 10⁻²⁷ kg","9.11 × 10⁻³¹ kg"],3,"The book gives the electron mass as 9.109 × 10⁻³¹ kg. 1.67 × 10⁻²⁷ kg is the proton mass.","Electron e-31, proton e-27.",0,1],["The charge on a proton is",["−1.60 × 10⁻¹⁹ C","+1.60 × 10⁻²⁷ C","+1.60 × 10⁻¹⁹ C","+3.20 × 10⁻¹⁹ C"],2,"The proton carries +e, which is +1.60 × 10⁻¹⁹ C.","Proton +e.",0,2],["Which pair of particles has charges of the same magnitude?",["Proton and neutron","Electron and proton","Neutron and quark","Electron and neutron"],1,"The electron has -e and the proton +e. They are equal in size and opposite in sign.","e and p: same size, opposite sign.",0,2],["An atom is naturally neutral because it has",["more protons than neutrons","more electrons than protons","equal numbers of protons and electrons","equal numbers of protons and neutrons"],2,"Equal protons and electrons make the total charge zero.","P = E gives zero.",0,2],["A nitrogen atom has atomic number 7. Its total charge is",["+14e","−7e","zero","+7e"],2,"It has 7 protons and 7 electrons, so 7(+e) + 7(−e) = 0.","Neutral atom: sum is 0.",0,2],["Why does the orbiting electron not fall into the nucleus?",["Gravity from outside the atom pulls it outward","Attraction is balanced by the force from its circular motion","Neutrons in the nucleus shield it from protons","The strong nuclear force pushes it outward all the time"],1,"The electric attraction is balanced by the outward effect of its circular motion, so the orbit stays steady.","Pull in = push out.",0,2],["A comb rubbed on hair becomes negatively charged because it",["loses protons to the hair","loses neutrons to the hair","gains protons from the hair","gains electrons from the hair"],3,"Friction strips surface electrons from the hair and deposits them on the comb.","Comb gains electrons, goes negative.",0,3],["After rubbing, the hair becomes positively charged because it",["has lost electrons","has gained neutrons","has gained protons","has lost neutrons"],0,"The hair has fewer electrons than protons, so its overall charge is positive.","Lose electrons, go positive.",0,3],["The principle of conservation of charge says the algebraic sum of all charges in a closed system",["keeps increasing","always equals zero after rubbing","stays constant","keeps decreasing"],2,"The total charge of a closed system is constant.","Closed system: total fixed.",0,3],["In any charging process, charge is",["transferred, not created or destroyed","created on one object","created and destroyed in equal amounts","destroyed on the other"],0,"Charge is only moved from one object to another. The total does not change.","Move, never make.",0,3],["Charging is done by moving electrons and not protons because electrons are",["less strongly bonded in the atom","much heavier than the protons in it","found deep inside the nucleus itself","carrying no charge so nothing binds them"],0,"The proton is tied to the neutron by the nuclear force, so the loosely held electrons are the ones that move.","Easy to move = electrons.",0,3],["The SI unit of electric charge is the",["ampere","volt","farad","coulomb"],3,"Charge is measured in coulombs (C).","Charge = coulomb.",0,3],["Charge is quantized. This means the charge on any object is always",["an integer multiple of e","a multiple of the proton mass","a fraction of e","equal to zero"],0,"The charge of any object is a whole-number multiple of the basic unit e.","Charge comes in whole e's.",0,3],["An object has a net charge of +8.0 × 10⁻¹⁹ C. How many electrons were removed from it?",["50","8","5","0.2"],2,"n = 8.0 × 10⁻¹⁹ ÷ 1.60 × 10⁻¹⁹ = 5. The charge is positive, so 5 electrons were removed.","Divide by 1.6.",0,3],["From the book's table, the charge 3e equals",["8.0 × 10⁻¹⁹ C","4.8 × 10⁻¹⁹ C","3.2 × 10⁻¹⁹ C","6.4 × 10⁻¹⁹ C"],1,"3 × 1.60 × 10⁻¹⁹ = 4.8 × 10⁻¹⁹ C.","3 × 1.6 = 4.8.",0,3],["The law of charges states that",["all charges repel","like charges attract and unlike charges repel","like charges repel and unlike charges attract","all charges attract"],2,"Same signs repel. Opposite signs attract.","Opposites attract.",0,3],["Balloon B is negative. Balloon C is repelled by B. What is the charge on C?",["It cannot be known","Positive","Negative","Neutral"],2,"Only like charges repel, so repulsion proves C is negative.","Repel means same sign.",0,3],["Balloon B is negative and balloon A is attracted to B. What can you say about A?",["It is definitely positive","It is positive or neutral","It is definitely neutral","It is negative"],1,"A neutral object is also attracted by induction. So attraction alone does not prove A is positive.","Only repulsion is proof.",0,3],["Conductors are materials that",["let charges move freely through them","stop charges from moving through them","create new charges when they are rubbed","hold all of their electrons tightly bound"],0,"In a conductor charges can move through the material.","Conductor = charges move.",0,4],["Metals are good conductors because they have",["extra protons placed in their nuclei","no electrons in their outer shells at all","a very heavy nucleus holding charge back","outer electrons that are not tightly bound"],3,"The outermost electrons are loosely bound, so they move around the material easily.","Free outer electrons.",0,4],["Which of these is a conductor?",["Silver","Rubber","Glass","Dry air"],0,"Silver, copper and aluminium are conductors. Rubber, dry air and glass are insulators.","Metals conduct.",0,4],["Which of these is an insulator?",["Silver","Copper","Wood","Aluminium"],2,"Wood, rubber, glass, plastic, cloth and dry air are insulators.","Wood, rubber, glass = insulate.",0,4],["Insulators are materials in which electrons",["are completely absent","are always positive","move without any limit","cannot move freely"],3,"In an insulator the electrons stay bound and do not move freely through the material.","Insulator = stuck electrons.",0,4],["The process that lets a charged comb attract a neutral piece of paper is called",["electrostatic induction","thermal conduction","electrolysis","nuclear fission"],0,"The comb causes a shift of charge in the paper. This is electrostatic induction.","Induction = charge shift by nearness.",0,5],["A negative rod is brought near a neutral metal sphere. The electrons in the sphere",["leave the sphere completely","are pushed to the far side","stay evenly spread","are pulled to the near side"],1,"The negative rod repels electrons. They move away, leaving the near side positive.","Like repels electrons away.",0,5],["The separation of charge in a neutral body by a nearby charged rod is called",["radiation","polarization","conduction","ionization"],1,"The zones of negative and positive induced charge are called polarization.","Polarization = zones of + and −.",0,5],["The book gives an application of induced charge in the car industry. It is",["galvanizing","casting","welding","electrostatic painting"],3,"Electrostatic painting uses this induced charge effect.","Car paint uses induction.",0,5],["A rubbed balloon sticks to a wall because",["it turns into a magnet on the wall surface","air pressure pushes it flat against the wall","it passes protons across to the wall surface","it attracts the positive charges induced on the wall surface"],3,"The balloon's excess electrons repel electrons in the wall. The positive charges left behind attract the balloon.","Balloon induces opposite charge.",0,5],["A negatively charged comb attracts a neutral insulator. The net force is attractive because",["the negative charges in each molecule are nearer the comb","the comb passes protons into the insulator slowly","the positive charges in each molecule are nearer the comb","the insulator becomes a good conductor near the comb"],2,"The positive ends of the molecules are closer, so they feel a stronger force than the negative ends.","Near opposite wins.",0,5],["Coulomb's law says the electric force between two point charges is",["proportional to r and inversely proportional to q₁q₂","proportional to q₁q₂ and inversely proportional to r²","directly proportional to both q₁q₂ and r²","independent of both the charges and the distance"],1,"F depends directly on q₁q₂ and inversely on r².","F up with q, down with r².",0,6],["The distance between two point charges is doubled. The force becomes",["half","four times","double","one quarter"],3,"F is proportional to 1/r². Double r gives 1/4 of the force.","Double r, divide by 4.",0,6],["The distance between two point charges is halved. The force becomes",["half","one quarter","two times","four times"],3,"F is proportional to 1/r². Half the distance gives 4 times the force.","Half r, times 4.",0,6],["The distance between two point charges is tripled. The force becomes",["one ninth","one third","three times","nine times"],0,"F is proportional to 1/r², so 3² = 9 and the force falls to 1/9.","Triple r, divide by 9.",0,6],["One of two point charges is doubled and the distance stays the same. The force",["becomes four times","stays the same","halves","doubles"],3,"F is directly proportional to each charge.","Double q, double F.",0,6],["The value of the constant k in Coulomb's law is about",["1.60 × 10⁻¹⁹ N·m²/C²","9.11 × 10⁹ N·m²/C²","8.99 × 10⁻⁹ N·m²/C²","8.99 × 10⁹ N·m²/C²"],3,"The book gives k = 8.99 × 10⁹ N·m²/C².","k is about 9 billion.",0,6],["The electric forces between two point charges act",["at 45° to the line joining them","along the line joining them","in a random direction","perpendicular to the line joining them"],1,"The force directions are always along the line joining the two charges.","Force runs along the line.",0,6],["Two charges of the same sign exert forces on each other that are",["attractive","zero","repulsive","perpendicular"],2,"Same sign charges repel. Opposite sign charges attract.","Same sign, push apart.",0,6],["The forces between two point charges obey Newton's third law. So F₁₂ equals",["2F₂₁","zero","+F₂₁","−F₂₁"],3,"The force of q₂ on q₁ is equal in size and opposite in direction to the force of q₁ on q₂.","Equal and opposite.",0,6],["The absolute value signs in Coulomb's law make sure that",["the two charges are always of equal size","the distance between the charges is always positive","the force magnitude F is always positive","the force between the charges is always attractive"],2,"The absolute value gives the magnitude. The direction comes from the type of charges.","Bars give magnitude.",0,6],["In Coulomb's law, the charged objects are treated as point charges when they are",["touching each other","very small compared with the distance between them","very large compared with the distance between them","moving at high speed"],1,"A point charge is a charged object very small compared with the separation r.","Small object, big gap.",0,6],["The electron and proton of a hydrogen atom are 5.3 × 10⁻¹¹ m apart. The electric force between them is about",["8.2 × 10⁻¹⁸ N, attractive","8.2 × 10⁻⁸ N, repulsive","4.4 × 10⁻⁸ N, attractive","8.2 × 10⁻⁸ N, attractive"],3,"F = ke²/r² = (8.99 × 10⁹)(1.60 × 10⁻¹⁹)² ÷ (5.3 × 10⁻¹¹)² = 8.2 × 10⁻⁸ N. The charges are opposite, so it is attractive.","Opposite signs, so attractive.",0,6],["In the book's triangle example, q₂ = −2.0 μC and q₃ = +5.0 μC are 0.10 m apart. The force of q₂ on q₃ is",["90 N, attractive","0.90 N, attractive","9.0 N, attractive","9.0 N, repulsive"],2,"F = (8.99 × 10⁹)(2.0 × 10⁻⁶)(5.0 × 10⁻⁶) ÷ (0.10)² = 9.0 N. The charges have opposite signs, so it is attractive.","Opposite signs, attractive.",0,6],["Two point charges of +1.0 μC and +2.0 μC are 0.30 m apart. The force between them is about",["0.60 N","0.20 N","2.0 N","0.020 N"],1,"F = (8.99 × 10⁹)(1.0 × 10⁻⁶)(2.0 × 10⁻⁶) ÷ (0.30)² = 0.20 N. It is repulsive.","k × q₁q₂ ÷ r².",0,6],["Figure 1.5 shows how the electric force F changes with the separation between two charges. As the separation grows, the curve",["stays flat all the way along r","rises steeply at first, then flattens out","rises steadily in a straight line upward","falls steeply at first, then flattens toward zero"],3,"F varies as 1/r², so it drops quickly near the charges and flattens out as r gets large.","1/r² curve: falls, never reaches zero.",0,6,"fig1_5"],["Figure 1.3 shows a negatively charged rubber rod hanging by a thread. A positively charged glass rod is brought near it as in (a). The rubber rod",["is attracted toward the glass rod","does not move","loses all its charge","is repelled from the glass rod"],0,"Unlike charges attract. In (b), two negative rubber rods repel each other.","Unlike attract, like repel.",0,3,"fig1_3"],["Tutorial 1.3: What is the magnitude of the electric field at a point 2.0 m from a point charge of 4.0 nC?",["36 N/C","9.0 N/C","18 N/C","4.5 N/C"],1,"E = kq/r² = (8.99 × 10⁹)(4.0 × 10⁻⁹) ÷ (2.0)² = 9.0 N/C.","Square the distance first: 2² = 4, then 36 ÷ 4.",0,7],["Tutorial 1.7: A particle of charge +3.00 × 10⁻⁶ C is 12.0 cm from a second particle of charge −1.50 × 10⁻⁶ C. The magnitude of the force between them is",["0.34 N","2.81 N","33.7 N","5.62 N"],1,"F = kq₁q₂/r² = (8.99 × 10⁹)(3.00 × 10⁻⁶)(1.50 × 10⁻⁶) ÷ (0.120)² = 2.81 N. It is attractive.","Change cm to m before you square: 0.12² = 0.0144.",0,7],["Tutorial 1.9: Two tiny water drops each carry −1.00 × 10⁻¹⁶ C and are 1.00 cm apart. The force between them is about",["8.99 × 10⁻¹⁹ N","8.99 × 10⁻¹⁵ N","8.99 × 10⁻²³ N","8.99 × 10⁻¹⁷ N"],0,"F = kq²/r² = (8.99 × 10⁹)(1.00 × 10⁻¹⁶)² ÷ (0.0100)² = 8.99 × 10⁻¹⁹ N. It is repulsive.","Exponents: 9 − 32 + 4 = −19.",0,7],["Tutorial 1.9(b): How many excess electrons are on each drop of charge −1.00 × 10⁻¹⁶ C?",["6.25 × 10⁻³⁵","1.6 × 10³","625","160"],2,"n = q/e = (1.00 × 10⁻¹⁶) ÷ (1.6 × 10⁻¹⁹) = 625 electrons.","n = q ÷ e. Divide, do not multiply.",0,7],["Tutorial 1.11: A sodium ion (+e) and a chlorine ion (−e) in a salt crystal are 2.82 × 10⁻¹⁰ m apart. The force between them is",["2.89 × 10⁻⁹ N","1.45 × 10⁻⁹ N","2.89 × 10⁻¹⁹ N","8.17 × 10⁻⁹ N"],0,"F = ke²/r² = (8.99 × 10⁹)(1.6 × 10⁻¹⁹)² ÷ (2.82 × 10⁻¹⁰)² = 2.89 × 10⁻⁹ N, attractive.","Charge is e on each, so e² appears on top.",0,7],["Tutorial 1.6: Point charges 26.0 μC and −47.0 μC attract each other with a force of 5.70 N. What is the distance between them?",["2.78 m","1.39 m","1.93 m","0.139 m"],1,"r = √(kq₁q₂/F) = √[(8.99 × 10⁹)(26.0 × 10⁻⁶)(47.0 × 10⁻⁶) ÷ 5.70] = 1.39 m.","Make r the subject: r² = kq₁q₂/F, then take the root.",0,7],["Tutorial 1.8: Particles 1 and 2 sit at x = −a and x = +a. Particle 3 (charge +Q) is at x = +0.500a and feels zero net force. The ratio q₁/q₂ is",["9","3","−9","1/9"],0,"Distances to particle 3 are 1.5a and 0.5a. Equal and opposite forces need q₁/(1.5a)² = q₂/(0.5a)², so q₁/q₂ = 9.","Farther charge is 3 times the distance, so it needs 3² = 9 times the charge.",0,7],["Tutorial 1.8(b): With the same charges, particle 3 is moved to x = +1.50a and again feels zero net force. The ratio q₁/q₂ is",["25","−5","5","−25"],3,"Distances are 2.5a and 0.5a. Both charges are on the same side of particle 3, so the forces can only cancel if the charges have opposite signs: q₁/q₂ = −(2.5/0.5)² = −25.","Outside the pair: opposite signs, ratio is minus the distance ratio squared.",0,7],["Tutorial 1.4: q₁ = +4.00 nC at x = 0, q₂ = −1.20 nC at x = 6.00 cm and q₃ = −2.00 nC at x = 4.00 cm. The net force on q₃ has magnitude",["1.00 × 10⁻⁵ N","5.39 × 10⁻⁵ N","9.88 × 10⁻⁵ N","4.49 × 10⁻⁵ N"],2,"q₁ attracts q₃ with 4.50 × 10⁻⁵ N toward q₁. q₂ repels q₃ with 5.39 × 10⁻⁵ N, also away from q₂ and toward q₁. Both point the same way, so they add: 9.88 × 10⁻⁵ N.","Both pull the same way, so add them.",0,7],["Exercise 1.3: Two identical spheres of mass 3.0 × 10⁻⁷ kg hang from 0.15 m strings, each string making 5.0° with the vertical. The charge on each sphere is about",["2.8 × 10⁻¹⁰ C","1.4 × 10⁻¹⁰ C","7.0 × 10⁻¹¹ C","1.4 × 10⁻⁷ C"],1,"T cosθ = mg and T sinθ = F, so F = mg tanθ = 2.6 × 10⁻⁷ N. The spheres are r = 2L sinθ = 0.026 m apart. q = √(Fr²/k) = 1.4 × 10⁻¹⁰ C.","Resolve the tension, divide to get tanθ, then use Coulomb.",0,7]]},{"t":"Electric Field","s":["Introduction to Electric Field","Superposition of Electric Fields","Electric Dipole in a Field","Field of a Ring of Charge","Tutorial"],"q":[["An electric field is a region of space in which",["a magnet feels a force","no charge can exist","a charge feels an electric force","only a neutral body feels a force"],2,"The book defines an electric field as a region where a charge would be acted upon by an electric force.","Field = force zone.",0,0],["The electric field E at a point is defined as the force F on a small positive test charge q₀ divided by",["q₀²","F","the distance","q₀"],3,"E = F/q₀.","E = F over q₀.",0,0],["The direction of the electric field at a point is the direction of the force on",["a positive charge","a negative charge","a moving electron","a neutral body"],0,"E is a vector. Its direction is that of the force on a positive charge.","Positive charge sets direction.",0,0],["The unit of electric field is",["N/C","N·C","J/C·m²","C/N"],0,"E is force per charge, so its unit is newton per coulomb. It is also written as volt per metre (V/m).","N/C = V/m.",0,0],["The equation E = F/q₀ gives the field caused by",["the earth only","the test charge and the force together","the other charges around the test charge","the test charge itself"],2,"The field is caused by the other charges distributed about the test charge. It is not the field of the test charge.","Test charge only feels it.",0,0],["The magnitude of the electric field a distance r from an isolated point charge q is",["q / (4πε₀r³)","q² / (4πε₀r²)","q / (4πε₀r²)","q / (4πε₀r)"],2,"From Coulomb's law, E = F/q₀ = q / (4πε₀r²).","Inverse square, one q.",0,0],["For a point charge, the direction of E on the radial line is",["always inward","inward if q is positive and outward if q is negative","always outward","outward if q is positive and inward if q is negative"],3,"A positive test charge is pushed away by +q and pulled toward −q.","Positive out, negative in.",0,0],["The distance from a point charge is doubled. The electric field becomes",["four times","one quarter","half","double"],1,"E is proportional to 1/r². Double r gives one quarter of E.","Double r, divide by 4.",0,0],["Electric field is a",["unit of energy","vector quantity","scalar quantity","pure number"],1,"E has magnitude and direction, so it is a vector.","Field has direction.",0,0],["When a field is due to several point charges, the resultant field is found by the",["law of inertia","law of reflection","principle of superposition","principle of conservation of mass"],2,"The resultant field is the sum of the fields of the individual charges. This is the principle of superposition.","Many charges: add the fields.",0,1],["Under superposition, the resultant field is the",["vector sum of the individual fields","difference of the largest two fields","average of the individual fields","scalar sum of the individual fields"],0,"Fields are vectors, so they add as vectors with direction taken into account.","Add as vectors.",0,1],["Two fields of 3 N/C and 4 N/C act at right angles at a point. The resultant is",["7 N/C","12 N/C","5 N/C","1 N/C"],2,"The vector sum at right angles is √(3² + 4²) = 5 N/C.","3-4-5 triangle.",0,1],["A proton is released at rest in a uniform electric field. The book says its motion resembles",["a body gliding at constant speed on ice","a body falling in the earth's gravitational field","a body moving in a circle at steady speed","a pendulum swinging about its rest position"],1,"The acceleration is constant, like free fall.","Uniform field, like free fall.",0,1],["A particle of charge q and mass m is in a uniform field E. Its acceleration is",["q/(mE)","mE/q","qE/m","qm/E"],2,"F = qE and F = ma, so a = qE/m.","a = qE over m.",0,1],["Because the acceleration in a uniform field is constant, the motion can be solved with",["Coulomb's law for the force between two charges","the equations for motion at constant velocity","Ohm's law applied to the moving charge","the equations of uniformly accelerated motion"],3,"Constant acceleration means the Newton equations for uniform acceleration apply.","Constant a, use v = u + at.",0,1],["A proton starts from rest in a uniform field E. After moving a distance y, its speed squared is",["qEy/2m","2qE/(my)","2qEy/m","qEy/m"],2,"v² = 2ay with a = qE/m, so v² = 2qEy/m.","v² = 2ay.",0,1],["A charge q starts from rest in a uniform field E and moves a distance y. Its kinetic energy is",["qE/y","qy/E","Ey/q","qEy"],3,"K = ½mv² = ½m(2qEy/m) = qEy.","Work = force × distance.",0,1],["An electric dipole consists of",["one charged body next to one neutral body","two unequal charges of the same sign far apart","two equal charges of the same sign a small distance apart","two equal charges of opposite sign a small distance apart"],3,"A dipole is a pair of equal and opposite charges separated by a distance.","Equal and opposite pair.",0,2],["The dipole moment of a dipole is defined as",["charge plus separation","separation squared","charge times separation, p = qd","charge divided by separation"],2,"The book defines the dipole moment as qd.","p = q × d.",0,2],["The dipole moment vector points from",["−q to +q","+q to −q","the field to the dipole","the centre outward"],0,"The dipole moment is taken as a vector pointing from the negative charge to the positive charge.","Minus to plus.",0,2],["In a uniform electric field, the net force on an electric dipole is",["2qE","pE","qE","zero"],3,"The force qE on +q is cancelled by −qE on −q.","Equal and opposite forces.",0,2],["Although the net force on a dipole in a uniform field is zero, there is a net",["torque","charge","potential","current"],0,"The two forces act at different points, so they form a couple that gives a torque.","No force, but a turning effect.",0,2],["The magnitude of the torque on a dipole in a field is",["τ = pE","τ = pE sin θ","τ = pE cos θ","τ = p/(E sin θ)"],1,"The book gives τ = pE sin θ, where θ is the angle between p and E.","Torque uses sine.",0,2],["The torque on a dipole in a uniform field is greatest when the angle between p and E is",["90°","45°","180°","0°"],0,"sin θ is largest, equal to 1, at 90°.","Sine peaks at 90°.",0,2],["The torque on a dipole lying parallel to the field (θ = 0) is",["pE","zero","maximum","negative infinity"],1,"τ = pE sin 0 = 0.","Parallel, no torque.",0,2],["The torque from the field tends to",["discharge the dipole","make the dipole spin forever","align the dipole with the field","turn the dipole away from the field"],2,"The torque rotates the dipole until p lines up with E.","Torque lines it up.",0,2],["The potential energy of a dipole in a field is U = −pE cos θ. The book chooses zero potential energy when the dipole is",["opposite to the field (θ = 180°)","perpendicular to the field (θ = 90°)","far from the field","parallel to the field (θ = 0)"],1,"Only changes in potential energy matter, so U is taken as zero at 90°. That gives U = −pE cos θ.","cos 90° = 0.",0,2],["A dipole has its minimum potential energy when it is",["at 45° to the field","parallel to the field","opposite to the field","perpendicular to the field"],1,"U = −pE cos θ is lowest at θ = 0, where it equals −pE.","Parallel is lowest energy.",0,2],["When the field turns a dipole toward alignment, the work done by the field",["decreases the potential energy of the dipole","increases the potential energy of the dipole","creates new charge","has no effect on the energy"],0,"The work done by the field decreases the potential energy.","Field does work, energy drops.",0,2],["A ring of radius R carries total charge Q spread uniformly. The linear charge density is",["λ = 2πR / Q","λ = QR","λ = Q / πR²","λ = Q / 2πR"],3,"Charge per unit length is Q divided by the circumference 2πR.","Divide by circumference.",0,3],["At a point on the axis of a charged ring, the components of the field perpendicular to the axis",["double the axial field","cancel by symmetry","are equal to the axial part","add up to the full field"],1,"The y-contributions from opposite segments cancel. This is symmetry.","Sideways parts cancel.",0,3],["The total field of a uniformly charged ring at a point on its axis points",["toward the edge of the ring","along the axis","in no fixed direction","around the ring"],1,"Only the axial components survive, so the field is along the axis.","Axis only.",0,3],["The electric field on the axis of a ring, a distance z from its centre, is",["E = Qz / [4πε₀(R² + z²)^(3/2)]","E = QR / [4πε₀(R² + z²)^(3/2)]","E = Q / [4πε₀(R² + z²)]","E = Qz / [4πε₀(R² + z²)²]"],0,"The book's result is E = (1/4πε₀) Qz / (R² + z²)^(3/2).","z on top, power 3/2.",0,3],["At a very large distance z (z ≫ R) the field of the ring becomes",["Q z / (4πε₀R³)","zero","Q / (4πε₀R²)","Q / (4πε₀z²)"],3,"R can be ignored beside z, so E reduces to the point charge field.","Far away, ring acts as a point.",0,3],["Far from a charged ring, the field matches that of a point charge because",["at great distance the ring loses all of its charge","at great distance the ring behaves like an infinite sheet","at great distance the ring behaves like a point charge","far from it the field lines become closed loops"],2,"The book says this is expected, since a distant ring looks like a point charge.","Far = point charge.",0,3],["The field of a uniformly charged ring at its own centre (z = 0) is",["Q / (4πε₀R²)","maximum","infinite","zero"],3,"In E = Qz/[4πε₀(R² + z²)^(3/2)], putting z = 0 gives zero. The segments cancel in pairs.","z = 0 gives 0.",0,3],["Tutorial 2.2: A nucleus of charge −3e and another of charge +8e are 6.5 μm apart. The attractive force between them is about",["3.1 × 10⁻¹⁶ N","1.3 × 10⁻¹⁶ N","4.9 × 10⁻¹⁷ N","1.3 × 10⁻¹⁹ N"],1,"F = k(3e)(8e)/r² = (8.99 × 10⁹)(24)(1.6 × 10⁻¹⁹)² ÷ (6.5 × 10⁻⁶)² = 1.3 × 10⁻¹⁶ N.","3e times 8e = 24 e². Do not forget the 24.",0,4],["Tutorial 2.3: Three identical balls of charge 6.4 μC sit at the corners of an equilateral triangle of side 0.25 m. The resultant force on one ball is about",["10 N","17 N","5.9 N","3.7 N"],0,"Each of the other two pushes with F = kq²/r² = 5.9 N, 60° apart. Resultant = 2F cos30° = 1.73 × 5.9 = 10 N, directed away from the other two.","Two equal forces at 60°: resultant is 1.73 times one force.",0,4],["Tutorial 2.3(ii): The same triangle, but each ball now carries 0.99 μC. The resultant force on one ball is about",["0.14 N","0.41 N","2.4 N","0.24 N"],3,"F = kq²/r² = 0.141 N from each ball. Resultant = 2F cos30° = 0.244 N.","Same steps: F first, then multiply by 1.73.",0,4],["Tutorial 2.4: An electron enters a uniform electric field at right angles to it with speed v₀. Its path is",["a parabola","a straight line","a spiral","a circle"],0,"The field gives a constant force sideways while the speed along the entry direction stays v₀. Like a projectile, the path is a parabola.","Constant force + sideways start = parabola.",0,4]]},{"t":"Electric Field Lines, Dipoles and Charged Particles in a Field","s":["Electric Field Lines","Rules for Drawing Field Lines","Field Due to a Point Charge","Charged Particle in a Uniform Field","Electric Dipoles","Field Due to an Electric Dipole","Tutorial"],"q":[["An electric field line is",["a line joining two equal charges together","an imaginary line tangent to E at every point","the real path a free positive charge follows","a line along which the field is always zero"],1,"The book defines it as an imaginary line drawn so that its tangent at any point is the same as the direction of the electric field vector there.","Tangent = direction of E.",0,0],["The electric field vector E at a point is",["at 45° to the field line at that point","perpendicular to the field line at that point","opposite to the field line at that point","tangent to the field line at that point"],3,"E is tangent to the field line, in the same direction as the line.","E touches the line.",0,0],["The number of field lines per unit area is proportional to",["the size of the test charge","the magnitude of E","the mass of the charge","the distance from the charge"],1,"More lines per unit area means a stronger field.","Crowded lines, strong field.",0,0],["Where the electric field is strong, the field lines are",["far apart","absent","parallel only","close together"],3,"Lines are closer together where E is strong and far apart where E is weak.","Strong = close.",0,0],["Where the electric field is weak, the field lines are",["close together","crossing each other","closed loops","far apart"],3,"Weak field means the lines are far apart.","Weak = far apart.",0,0],["Electric field lines are",["imaginary lines","paths of electrons only","real wires of charge","lines of magnetic force"],0,"The book states that field lines are imaginary lines.","Imaginary, not real.",0,0],["Electric field lines emerge from",["positive charges and end on negative charges","positive charges and end on positive charges","negative charges and end on positive charges","neutral points and end on charges"],0,"Lines start on positive charge and end on negative charge.","Start plus, end minus.",0,1],["The number of lines leaving a positive charge is proportional to",["the mass of the charge","the distance to the next charge","the magnitude of the charge","the speed of the charge"],2,"A bigger charge has more lines emerging or ending.","Bigger charge, more lines.",0,1],["Two electric field lines",["never intersect","always intersect","sometimes intersect","are always perpendicular to each other"],0,"Field lines cannot cross. At a crossing point E would have two directions.","Lines never cross.",0,1],["The electric field lines diverge from a",["negative charge","positive charge","neutral body","zero potential point"],1,"Lines spread outward from a positive charge and converge on a negative charge.","Positive diverges.",0,1],["In a system with an excess of one type of charge, some field lines",["cross each other","form closed loops","disappear at the midpoint","start or end indefinitely"],3,"If there is no opposite charge to end on, some lines go on indefinitely.","Extra charge, open lines.",0,1],["Which statement about field lines is false?",["They are continuous","They remain parallel in a uniform field","They attract each other","They diverge from positive charge"],2,"The book lists this as the false one. Field lines do not attract each other.","Lines do not attract.",0,1],["Two parallel plates carry equal and opposite charge. Between them the field lines are",["parallel and uniform in the centre but fringe at the ends","crowded together at the centre but spread at the ends","circular in shape all the way between the plates","parallel and uniform right up to the plate edges"],0,"The field is uniform in the central part and bends outward (fringes) near the ends.","Uniform in the middle, fringes at edges.",0,1],["Figure 3.2(c) shows the field lines of two equal positive charges. The point midway between them, marked as the neutral point, is where",["the charge is negative","the electric field is zero","the field is strongest","the field lines end"],1,"The fields of the two equal charges are equal and opposite at the midpoint, so they cancel.","Equal and opposite cancel.",0,1,"fig3_2"],["To find the field of a point charge, we place a",["neutral body at a distance","magnet beside it","small positive test charge near it","large negative charge at the centre"],2,"The book places a positive test charge at a distance r and uses Coulomb's law.","Use a positive test charge.",0,2],["The force on a positive test charge from a point charge q is directed away from q if q is",["positive","negative","neutral","zero"],0,"Like charges repel. A positive q pushes the positive test charge away.","Positive pushes away.",0,2],["The field of a point charge is directed toward the charge if the charge is",["moving","neutral","negative","positive"],2,"A positive test charge is pulled toward a negative point charge.","Negative pulls in.",0,2],["The magnitude of the field of a point charge q at distance r is",["E = |q|r² / 4πε₀","E = |q| / (4πε₀r²)","E = |q| / (4πε₀r)","E = 4πε₀r² / |q|"],1,"E = (1/4πε₀)(|q|/r²).","q over 4πε₀r².",0,2],["A particle of charge q is placed in an electric field E. The electric force on it is",["qE²","qE","E/q","q/E"],1,"From E = F/q, the force is F = qE.","F = qE.",0,3],["If the electric force is the only force on a particle of mass m and charge q, its acceleration is",["a = q/(mE)","a = mE/q","a = qE/m","a = qEm"],2,"qE = ma, so a = qE/m.","Newton's second law.",0,3],["A charged particle in a uniform electric field has an acceleration that is",["zero","increasing steadily","inversely proportional to time","constant"],3,"E is uniform, so qE/m is constant.","Uniform field, constant a.",0,3],["An electric dipole is a pair of point charges with",["equal magnitude and opposite sign","equal magnitude and the same sign","unequal magnitude and the same sign","unequal magnitude and opposite sign"],0,"The dipole has a positive charge +q and a negative charge −q of the same magnitude, a distance d apart.","Equal size, opposite sign.",0,4],["A water molecule behaves like an electric dipole. The negative end is at the",["both ends equally","hydrogen end","centre of the molecule","oxygen end"],3,"The chemical bonds pull charge toward oxygen. This gives a net negative charge at the oxygen end and a net positive charge at the hydrogen end.","Oxygen negative.",0,4],["A water molecule is electrically neutral overall, but it is still a dipole because",["it has extra electrons","its charge is unevenly shared","it has no protons","it carries a net positive charge"],1,"The bonds shift charge toward the oxygen end. The positive and negative parts are apart.","Neutral overall, uneven inside.",0,4],["The electric dipole moment p is the product of",["charge and separation, p = qd","force and charge, p = Fq","charge and field strength, p = qE","mass and separation, p = md"],0,"p = qd.","p = q × d.",0,4],["The SI unit of dipole moment is",["coulomb per metre","volt per metre","coulomb-metre (C·m)","newton-metre"],2,"The book states that the unit of p is the coulomb-metre.","C times m.",0,4],["The dipole moment vector points from",["the positive charge to the negative charge","the midpoint to the positive charge","the midpoint to the negative charge","the negative charge to the positive charge"],3,"p is directed from the negative end to the positive end.","Negative to positive.",0,4],["Charges of +1.6 × 10⁻¹⁹ C and −1.6 × 10⁻¹⁹ C are 0.125 × 10⁻⁹ m apart. The dipole moment is",["2.0 × 10⁻²⁸ C·m","2.0 × 10⁻²⁹ C·m","1.3 × 10⁻²⁹ C·m","2.0 × 10⁻³⁰ C·m"],1,"p = qd = (1.6 × 10⁻¹⁹)(0.125 × 10⁻⁹) = 2.0 × 10⁻²⁹ C·m.","Multiply q by d.",0,4],["In a uniform field, the net force on a dipole is",["pE","zero","2qE","qE"],1,"The two forces are equal and opposite, so they cancel.","Forces cancel.",0,4],["For a point on the axis of a dipole, the nearer charge sets up a field that is",["zero","equal to the field of the farther charge","larger than the field of the farther charge","smaller than the field of the farther charge"],2,"The nearer particle gives the stronger field. The net field is the difference.","Closer means stronger.",0,5],["At large distances z (z ≫ d) on the axis of a dipole, the field is",["E = p / (2πε₀z³)","E = p / (2πε₀z²)","E = p / (4πε₀z)","E = p / (4πε₀z²)"],0,"The book's result is E = (1/2πε₀)(p/z³).","Dipole: 1/z³.",0,5],["Far along the axis, the dipole field falls with distance as",["1/z³","1/z²","1/z","1/z⁴"],0,"E is proportional to p/z³. This is faster than a single point charge, which falls as 1/z².","Dipole fades faster.",0,5],["The electric field at a point on the perpendicular bisector of a dipole is directed",["perpendicular to the dipole moment","along the dipole moment","opposite to the dipole moment","at 45° to the dipole moment"],2,"The book's answer is that the field there points opposite to p.","Bisector: against p.",0,5],["Tutorial 3.1: What is the force between point charges 15 μC and 10 μC placed 200 cm apart?",["1.35 N","0.0842 N","3.37 N","0.337 N"],3,"F = kq₁q₂/r² = (8.99 × 10⁹)(15 × 10⁻⁶)(10 × 10⁻⁶) ÷ (2.00)² = 0.337 N.","200 cm is 2 m, so r² = 4.",0,6],["Tutorial 3.3: A water molecule has an electric dipole moment of 6.2 × 10⁻³⁰ C·m. Taking the charge as e = 1.6 × 10⁻¹⁹ C, the distance between its positive and negative centres is about",["3.9 × 10⁻¹¹ m","1.95 × 10⁻¹¹ m","3.9 × 10⁻¹² m","7.8 × 10⁻¹² m"],0,"p = qd, so d = p/q = (6.2 × 10⁻³⁰) ÷ (1.6 × 10⁻¹⁹) = 3.9 × 10⁻¹¹ m.","d = p ÷ q. Exponent: −30 + 19 = −11.",0,6],["Tutorial 3.5: The electric dipole moment p is given by",["qE","Ed","Fd","qd"],3,"p = q × d, the size of one charge times the separation.","Charge times distance.",0,6],["Exercise 3.3: Charges +1 C and −1 C are 5 mm apart. The field on the axis 15 cm from the dipole is about",["5.3 × 10¹⁰ N/C","2.66 × 10⁷ N/C","2.66 × 10¹⁰ N/C","1.33 × 10¹⁰ N/C"],2,"p = qd = 0.005 C·m. On the axis E = 2kp/r³ = 2(8.99 × 10⁹)(0.005) ÷ (0.15)³ = 2.66 × 10¹⁰ N/C.","On the axis the field is 2kp/r³. On the bisector it is kp/r³.",0,6]]},{"t":"Electric Flux, Gauss's Law and Applications","s":["Electric Flux","Gauss's Law and Formula","The Gauss Theorem","Applications of Gauss's Law","Integral and Differential Forms","Using Gauss's Law","Worked Examples","Tutorial"],"q":[["Electric flux through a surface is found from",["Φ = EA cos θ","Φ = E + A","Φ = EA sin θ","Φ = E/A"],0,"Flux is the field times the area projected perpendicular to the field, so Φ = EA cos θ.","Flux uses cosine.",0,0],["The unit of electric flux is",["N·C/m²","V/m","N/C","N·m²/C"],3,"The book gives the unit of flux as N·m²/C.","E (N/C) times area (m²).",0,0],["Electric flux Φ_E is a",["unit of energy","vector quantity","unit of charge","scalar quantity"],3,"Flux is a scalar. It represents the number of field lines through a surface.","Flux is a number.",0,0],["Electric flux represents the",["force acting on the surface by the field","number of field lines passing through the surface","mass of material making up the surface","total charge sitting on the surface itself"],1,"Φ_E stands for the number of field lines through the surface.","Flux = lines through.",0,0],["For a closed surface, the area vector points",["outward","toward the nearest charge","inward","along the surface"],0,"By the book's convention, the area vector of a closed surface points in the outward direction.","Closed surface, normal out.",0,0],["The flux through a surface parallel to the field (normal at 90° to E) is",["equal to EA","negative EA","zero","maximum"],2,"cos 90° = 0, so no field lines pass through.","Parallel, no flux.",0,0],["Gauss's law states that the total electric flux out of a closed surface equals",["the total charge outside the surface","the enclosed charge multiplied by ε₀","the field times the volume","the enclosed charge divided by ε₀"],3,"The flux out of a closed surface is the charge enclosed divided by the permittivity ε₀.","Flux = Q over ε₀.",0,1],["The Gauss law formula is",["Φ = Q/ε₀","Φ = Q/ε₀²","Φ = ε₀/Q","Φ = Qε₀"],0,"Φ = Q/ε₀, where Q is the total charge inside the surface.","Q over epsilon.",0,1],["A point charge q is placed at the centre of a cube. The total flux through the cube is",["q/6ε₀","6q/ε₀","q/ε₀","zero"],2,"The total flux out of a closed surface is the enclosed charge divided by ε₀.","Whole cube: q/ε₀.",0,1],["A point charge q is at the centre of a cube. The flux through each face is",["q/ε₀","q/3ε₀","6q/ε₀","q/6ε₀"],3,"The six identical faces share the total flux q/ε₀ equally.","Divide by 6 faces.",0,1],["In Gauss's law, ε₀ is the",["permittivity of free space (electric constant)","permeability of free space (magnetic constant)","dielectric strength of air at normal pressure","charge of one electron in coulombs"],0,"ε₀ is the electric constant, also called the permittivity of free space.","ε₀ = permittivity.",0,1],["The charge Q in Gauss's law means",["the charge outside the surface","the charge on the surface of the nearest conductor","the charge of a test particle","the total charge inside the closed surface"],3,"Only the charge enclosed by the surface counts.","Count only what is inside.",0,1],["The Gauss theorem says the net flux through a closed surface is directly proportional to",["the volume of the surface","the net charge enclosed","the area of the surface","the distance to the nearest charge"],1,"The net flux is proportional to the net charge in the volume enclosed.","Flux follows enclosed charge.",0,2],["A closed surface encloses no charge. The net flux through it is",["negative","infinite","zero","positive"],2,"Field lines entering the surface equal the field lines leaving it, so the net flux is zero.","No charge inside, zero flux.",0,2],["If no charge is enclosed by a closed surface, the number of field lines entering",["is always zero","is greater than the number leaving","equals the number leaving","is less than the number leaving"],2,"The lines going in match the lines going out, so the net flux is zero.","In equals out.",0,2],["Charges outside a closed surface",["double the net flux through the surface","reduce the net flux to zero in all cases","decide only the sign of the net flux","do not contribute to the net flux through it"],3,"Only charges inside the surface contribute to the net electric flux.","Outside charges do not count.",0,2],["The electric flux from a closed surface depends on",["the size of the surface that is enclosed","the sources and sinks of the field inside it","the charges lying outside the surface","the shape of the surface that is chosen"],1,"Positive charges are sources and negative charges are sinks of the field. Charges outside do not add to the flux.","Count sources and sinks inside.",0,2],["Gauss's law is a restatement of",["Newton's first law","Lenz's law","Coulomb's law","Ohm's law"],2,"Applying the Gauss theorem to a point charge inside a sphere gives back Coulomb's law.","Gauss = Coulomb restated.",0,2],["The electric field at the centre of a charged ring (x = 0) is",["maximum","Q/(4πε₀R²)","infinite","zero"],3,"At the centre the formula E ∝ x gives E = 0.","Centre of ring: 0.",0,3],["For an infinite line of charge with linear density λ, the field at distance r is",["E = λr / ε₀","E = λ / (2ε₀)","E = λ / (2πε₀r)","E = λ / (4πε₀r²)"],2,"The book gives E = λ/(2πε₀r) for an infinite line of charge.","Line: 1/r.",0,3],["For an infinite line of charge, the field falls with distance as",["1/r³","1/r","it does not change","1/r²"],1,"E = λ/(2πε₀r), so it is proportional to 1/r.","Line: 1 over r.",0,3],["The field near a large plane sheet of charge with surface charge density σ is",["E = 2σ / ε₀","E = σ / ε₀²","E = σ / 2ε₀","E = σ / 4πε₀"],2,"The book gives E = σ/2ε₀ for a plane sheet of charge.","Sheet: half of σ/ε₀.",0,3],["The field between two oppositely charged parallel plates (a condenser) is",["E = σ / ε₀","E = σ / 2ε₀","E = σ","E = 2σ / ε₀"],0,"The book gives E = σ/ε₀ between the two plates, where σ is the surface charge density.","Plates: σ over ε₀.",0,3],["To find the field of an infinitely long line of charge, the book uses a Gaussian surface in the shape of a",["cube","sphere","cylinder","cone"],2,"A cylinder of radius r and length l, centred on the line, matches the cylindrical symmetry.","Line charge, cylinder.",0,3],["The field of an infinite line of charge points",["radially away from the line","toward the line","along the line","around the line in circles"],0,"By cylindrical symmetry the field points radially outward from a positively charged line.","Out from the line.",0,3],["The integral form of Gauss's law is",["∮E·dA = Qε₀","∮E·dA = Q/ε₀","∮E·dA = 0 always","∮E·dA = ε₀/Q"],1,"The flux is the surface integral of E over the closed surface, and it equals Q/ε₀.","Integral over surface = Q/ε₀.",0,4],["The differential form of Gauss's law relates the divergence of E at a point to",["the surface charge density σ at that point","the volume charge density ρ at that point","the potential at the origin of the axes","the total charge in the whole universe"],1,"The book states that the divergence of E equals the volume charge density divided by ε₀ at a particular point.","Divergence E = ρ/ε₀.",0,4],["In the differential form ∇·E = ρ/ε₀, the letter ρ stands for",["linear charge density","resistivity","volume charge density","surface charge density"],2,"ρ is the volume charge density at the point.","ρ for volume.",0,4],["Gauss's law is mainly used to find the electric field of charge distributions that have",["symmetry","no charge","moving charges only","a changing magnetic field"],0,"Gauss's law is normally used for charge distributions with symmetry.","Symmetry makes it easy.",0,5],["The first step in using Gauss's law to find a field is to",["guess the direction of the field at random","identify the symmetry of the charge distribution","find the potential at the origin first","choose the largest closed surface possible"],1,"First find the spatial symmetry. Then choose a Gaussian surface with the same symmetry.","Symmetry first.",0,5],["Which of these is one of the three types of symmetry used with Gauss's law?",["Elliptical symmetry","Triangular symmetry","Cylindrical symmetry","Cubic symmetry only"],2,"The three are spherical, cylindrical and planar symmetry.","Sphere, cylinder, plane.",0,5],["The three symmetries used with Gauss's law are",["spherical, cubic and linear","spherical, cylindrical and planar","cylindrical, cubic and conical","circular, conical and planar"],1,"Spherical, cylindrical and planar are the three the book lists.","Sphere, cylinder, plane.",0,5],["A Gaussian surface should be chosen so that it",["has the same symmetry as the charge distribution","is always chosen as a cube of unit side","passes through every charge in the system","touches the nearest conductor surface only"],0,"The surface must match the symmetry of the charge distribution so the integral is easy.","Match the symmetry.",0,5],["A uniform field E = 100 N/C acts along +x. The flux through a 10 cm × 10 cm square in the Y-Z plane, with its normal along +x, is",["0","1 N·m²/C","0.1 N·m²/C","10 N·m²/C"],1,"The normal is along E, so θ = 0. Φ = EA = 100 × (0.10)² = 1 N·m²/C.","Convert 10 cm to 0.1 m.",0,6],["A charge q sits inside a hollow conducting sphere. The charge on the inner surface of the sphere is",["zero","+q","+2q","−q"],3,"The field inside the conducting material is zero, so the net charge inside a Gaussian surface in the material is zero. The inner surface must hold −q.","Inner surface mirrors, opposite sign.",0,6],["A charge of −4 × 10⁻⁸ C is induced on the inner surface of a hollow conducting sphere that is given a total charge of 6 × 10⁻⁸ C. The charge on the outer surface is",["6 × 10⁻⁸ C","2 × 10⁻⁸ C","−4 × 10⁻⁸ C","10 × 10⁻⁸ C"],3,"Total charge is inner plus outer. 6 × 10⁻⁸ = (−4 × 10⁻⁸) + outer, so outer = 10 × 10⁻⁸ C.","Total = inner + outer.",0,6],["A charge 4 × 10⁻⁸ C is spread on a sphere. The field at 2 cm from its centre is about",["9 × 10³ N/C","9 × 10⁵ N/C","9 × 10⁹ N/C","1.8 × 10⁶ N/C"],1,"E = q/(4πε₀x²) = (9 × 10⁹)(4 × 10⁻⁸) ÷ (0.02)² = 9 × 10⁵ N/C.","kq over r².",0,6],["A charged particle floats above a large horizontal charged sheet when",["the electric force qE is greater than mg","the electric force qE equals its weight mg","the charged sheet is completely neutral","the electric force qE is half the weight"],1,"For it to stay at rest, the upward electric force must balance the weight, so qE = mg.","Balance the forces.",0,6],["A solid conducting sphere is surrounded by a concentric hollow shell. A charge is now given to the shell. The potential difference between the sphere and the shell",["does not change","increases","decreases","becomes zero"],0,"The potential on the shell and everywhere inside it changes by the same amount, so the difference stays the same.","Both shift together.",0,6],["Tutorial 4.1: What is the electric flux through a Gaussian surface containing 200 million electrons?",["+3.6 N·m²/C","−3.2 × 10⁻¹¹ N·m²/C","−0.36 N·m²/C","−3.6 N·m²/C"],3,"q = 2 × 10⁸ × (−1.6 × 10⁻¹⁹) = −3.2 × 10⁻¹¹ C. Φ = q/ε₀ = −3.2 × 10⁻¹¹ ÷ 8.85 × 10⁻¹² = −3.6 N·m²/C.","Electrons are negative, so the flux is negative.",0,7],["Tutorial 4.2: A uniformly charged solid insulating sphere of radius 0.25 m holds 3.4 pC in total. The field 0.15 m from the centre is about",["0.54 N/C","0.29 N/C","0.49 N/C","0.20 N/C"],1,"Inside, E = kQr/R³ = (8.99 × 10⁹)(3.4 × 10⁻¹²)(0.15) ÷ (0.25)³ = 0.29 N/C.","Inside a solid sphere, E grows with r: kQr/R³.",0,7],["Tutorial 4.3: An infinite line of charge carries 0.4 C per metre. The field 0.3 m from the line is about",["2.4 × 10¹⁰ N/C","7.2 × 10⁹ N/C","1.2 × 10¹¹ N/C","1.2 × 10¹⁰ N/C"],0,"E = λ/(2πε₀r) = 2kλ/r = 2(8.99 × 10⁹)(0.4) ÷ 0.3 = 2.4 × 10¹⁰ N/C.","Line charge: E = 2kλ/r.",0,7],["Tutorial 4.4: A −2 μC point charge sits at the centre of a cube of side 5 cm. The net flux through the cube is about",["−2.3 × 10⁵ N·m²/C","−2.3 × 10⁻⁷ N·m²/C","+2.3 × 10⁵ N·m²/C","−3.8 × 10⁴ N·m²/C"],0,"Φ = q/ε₀ = −2 × 10⁻⁶ ÷ 8.85 × 10⁻¹² = −2.3 × 10⁵ N·m²/C. The side length does not matter.","Net flux = q/ε₀. The cube size is a decoy.",0,7],["Tutorial 4.7: A cube of side 8.5 cm sits in a uniform field E = 7500 N/C with two faces perpendicular to the field. The net flux through the cube is",["108 N·m²/C","7500 N·m²/C","54 N·m²/C","zero"],3,"Flux in through one face equals flux out through the opposite face. The four side faces are parallel to the field and get none. Net flux = 0 (no charge inside).","What goes in comes out: net zero.",0,7],["Tutorial 4.7(b): For the same cube (side 8.5 cm, E = 7500 N/C), the magnitude of the flux through one face perpendicular to the field is",["6.4 × 10⁵ N·m²/C","7500 N·m²/C","54 N·m²/C","0"],2,"Φ = EA = 7500 × (0.085)² = 54 N·m²/C. It is negative on the entering face and positive on the leaving face.","Φ = E × L².",0,7],["Tutorial 4.8: A point charge q is near a very large plane. The flux through the plane due to that charge is",["q/(2ε₀)","zero","q/(4ε₀)","q/ε₀"],0,"By symmetry the plane catches half of the total flux q/ε₀ from the charge.","Plane catches half of the sphere's flux.",0,7]]},{"t":"Electric Potential","s":["Work Done in an Electric Field","Electric Potential and Potential Difference","Equipotential Surfaces","Potential Due to a Point Charge","Potential of a Group of Point Charges","Potential Due to an Electric Dipole","Continuous Charge Distribution","Tutorial"],"q":[["The work done when a force F moves a charge through a small distance ds is",["dW = F + ds","dW = ds/F","dW = F/ds","dW = F·ds"],3,"Work is force times displacement along the path.","Work = F · ds.",0,0],["The work done by the electrostatic force in moving a charge between two points",["does not depend on the path taken","changes with the path taken between them","is always zero for any two points","is always negative for any two points"],0,"The book says the work depends only on the end points, not on the path.","Path does not matter.",0,0],["Because the work done by the electric force is independent of path, the electric force is said to be",["non-uniform","conservative","frictional","dissipative"],1,"A force whose work does not depend on path is conservative. That is why we can define a potential energy.","Path-free work = conservative.",0,0],["The change in electric potential energy ΔU is",["equal to the work done by the electric force","the negative of the work done by the electric force","twice the work done by the electric force","always zero"],1,"ΔU = −W = −q∫E·ds.","ΔU = −W.",0,0],["The usual choice for the potential energy of a charge is U = 0 when the charge is",["at the origin","on the nearest conductor","infinitely far away","at the earth's surface"],2,"Only changes in potential energy have real meaning. The usual choice is U∞ = 0.","Zero at infinity.",0,0],["When a charge moves along the direction of the electric field, the work done by the field is",["negative","positive","infinite","zero"],1,"Moving with the field gives W > 0 and the potential decreases.","With the field, W is positive.",0,0],["When a charge moves against the electric field, the work done by the field is",["equal to qV","positive","zero","negative"],3,"Moving against E gives W < 0 and the potential increases.","Against the field, W is negative.",0,0],["Electric potential V is defined as",["potential energy per unit charge","force per unit charge at the point","work done per unit time by the field","charge per unit volume of space"],0,"Dividing the potential energy by the charge gives the electric potential, V = U/q.","V = U over q.",0,1],["The change in potential is related to the change in potential energy by",["ΔV = ΔU/q","ΔV = q/ΔU","ΔV = ΔU·q","ΔV = ΔU + q"],0,"ΔV = ΔU/q, where ΔU is the change in potential energy of the charge q.","ΔV = ΔU over q.",0,1],["The potential difference between two points is given by",["ΔV = ∫ds/E","ΔV = +∫E·ds","ΔV = −∫E² ds","ΔV = −∫E·ds"],3,"ΔV = −∫E·ds, taken along any path between the two points.","Minus integral of E dot ds.",0,1],["Electric potential is a",["scalar quantity","vector quantity","unit of force","unit of charge"],0,"The book states that electric potential is a scalar quantity.","Potential has no direction.",0,1],["The unit of electric potential is the volt, which equals",["one newton per coulomb","one joule per coulomb","one joule per second","one coulomb per joule"],1,"1 V = 1 J/C.","Volt = J/C.",0,1],["Multiplying a charge by a potential difference gives",["current","power","energy","force"],2,"ΔU = qΔV, so charge times potential difference is energy.","q × V = energy.",0,1],["One electron-volt is equal to",["9.11 × 10⁻³¹ J","1.60 × 10⁻¹⁹ C","1.60 × 10⁻¹⁹ J","1.60 × 10¹⁹ J"],2,"1 eV = (1.60 × 10⁻¹⁹ C)(1 V) = 1.60 × 10⁻¹⁹ J.","eV = e times 1 V.",0,1],["An electron moves through a potential difference of 1000 V. Its change in energy is",["1 eV","1000 eV","1000 J","1.6 eV"],1,"ΔU = qΔV, with q = e. The energy change is 1000 eV.","Electron: V equals eV.",0,1],["In a uniform field E, the potential difference between two points a distance d apart along the field is",["V = d/E","V = E + d","V = Ed","V = E/d"],2,"The book uses V = Ed. For example, a field of 25 V/m over 0.02 m gives 0.5 V.","V = E × d.",0,1],["A uniform field of 25 V/m acts over a distance of 0.02 m. The potential difference is",["1250 V","5 V","0.05 V","0.5 V"],3,"V = Ed = 25 × 0.02 = 0.5 V.","Multiply, mind the zeros.",0,1],["The work done in moving a charge q through a potential difference V is",["W = q/V","W = qV","W = qV²","W = V/q"],1,"Work equals charge times potential difference.","W = qV.",0,1],["An equipotential surface is a set of points that",["all carry zero net charge on them","all lie along one straight field line","all have the same electric potential","all have the same electric field strength"],2,"On an equipotential surface V has a given constant value.","Same V everywhere on it.",0,2],["Moving a charge between two points on the same equipotential surface needs",["negative work only","work equal to qE","maximum work","no work"],3,"ΔV = 0 between those points, so no work is done.","ΔV = 0, W = 0.",0,2],["Electric field lines and equipotential surfaces are",["at 45° to each other everywhere","perpendicular to each other","identical, forming one set of lines only","parallel to each other everywhere"],1,"The field lines are perpendicular to the equipotential surfaces everywhere.","Always at 90°.",0,2],["In a uniform electric field, the equipotential surfaces are",["planes lying along the direction of the field","curved surfaces that bend toward the plates","concentric spheres centred on the field source","parallel planes perpendicular to the field"],3,"The field lines are straight, parallel and equally spaced, so the equipotentials are parallel planes at right angles to them.","Uniform field, flat planes.",0,2],["On an equipotential surface, the quantity that must be constant is",["V","the charge","the force on a test charge","E"],0,"E does not need to be constant over an equipotential surface. Only V is constant.","Only V is fixed.",0,2],["In Figure 5.2 for a positive point charge, the equipotential surfaces are closely spaced near the origin. This shows that near the origin",["neither potential nor field changes there at all","the potential varies rapidly and the field is large","the potential is zero and the field is large","the field is zero but the potential varies"],1,"Closely spaced equipotentials mean V changes quickly with distance, so E is large.","Close surfaces, strong field.",0,2,"fig5_2"],["The electric potential at a distance r from an isolated point charge q (V = 0 at infinity) is",["V = q / (4πε₀r)","V = q / (4πε₀r²)","V = q² / (4πε₀r)","V = qr / 4πε₀"],0,"Integrating E = q/(4πε₀r²) from infinity to r gives V = q/(4πε₀r).","Potential: 1/r. Field: 1/r².",0,3],["Near a positive point charge, the potential falls as the distance r",["stays the same","becomes negative","increases","decreases"],2,"V = q/(4πε₀r) is large near the charge and drops as r grows.","Farther away, lower V.",0,3],["The potential of a point charge is proportional to",["r","r²","1/r²","1/r"],3,"V = q/(4πε₀r).","V goes as 1 over r.",0,3],["The distance from a point charge is doubled. The potential becomes",["double","one quarter","four times","half"],3,"V is proportional to 1/r.","Double r, half V.",0,3],["The potential at a point due to a group of point charges is",["the sum of the potentials of the individual charges","the product of the potentials of the charges","the vector sum of the fields of the charges","the potential of the largest charge on its own"],0,"V = (1/4πε₀) Σ qᵢ/rᵢ. It is a scalar sum.","Add the numbers.",0,4],["When finding the potential of a group of charges, the signs of the charges are",["used only for the nearest charge","included in the sum","reversed for negative charges","ignored"],1,"Each qᵢ carries its sign, so negative charges lower the total.","Keep the signs.",0,4],["For several charges, adding potentials is easier than adding fields because potential is",["a vector","a scalar","always positive","always zero"],1,"Scalars add as plain numbers. Fields are vectors and need directions.","Scalar sum, no directions.",0,4],["Charges of +q and −q are the same distance from a point P. The potential at P is",["kq/r","−2kq/r","2kq/r","zero"],3,"The two potentials are equal in size and opposite in sign, so the sum is zero.","Equal and opposite cancel.",0,4],["The potential at a point due to a dipole is",["the potential due to +q alone at that point","the vector sum of the potentials due to +q and −q","always zero at every point in the surrounding space","the algebraic sum of the potentials due to +q and −q"],3,"V_P = V₁ + V₂, taken with signs.","Add with signs.",0,5],["The potential of a dipole at a far point (r ≫ separation) at angle θ is",["V = p sin θ / (4πε₀r²)","V = p cos θ / (4πε₀r²)","V = p / (4πε₀r³)","V = p cos θ / (4πε₀r)"],1,"The book's result is V = p cos θ/(4πε₀r²).","Dipole potential uses cosine.",0,5],["The potential of a dipole depends on",["the sum q + d of the two quantities","the separation d only, not on the charge","the product qd, not on q or d alone","the charge q only, not on the separation"],2,"V depends on the dipole moment p, which is the product of charge and separation.","Only p matters.",0,5],["Far from a dipole, the potential falls with distance as",["1/r³","it does not change","1/r²","1/r"],2,"V = p cos θ/(4πε₀r²), so it goes as 1/r². A single charge gives 1/r.","Dipole potential: r squared.",0,5],["The potential of a dipole at a point on its perpendicular bisector (θ = 90°) is",["zero","maximum","negative infinity","p/(4πε₀r²)"],0,"cos 90° = 0, so V = 0 there.","cos 90° is zero.",0,5],["For a continuous charge distribution, the potential (with V = 0 at infinity) is found by",["multiplying the total charge by the distance","adding dq/(4πε₀r) over small charge elements","ignoring the elements and using the total q","adding the fields of the elements as vectors"],1,"Each small charge dq adds dV = dq/(4πε₀r). The sum becomes an integral.","Integrate dq over r.",0,6],["For a distribution with charge density ρ, the small charge dq of a volume element dτ is",["dq = ρ dτ","dq = dτ/ρ","dq = ρ + dτ","dq = ρ/dτ"],0,"The charge density is used to get the element of charge dq for each volume element.","dq = ρ dτ.",0,6],["Tutorial 5.1: An electron between two large parallel plates 12 cm apart feels a force of 3.9 × 10⁻¹⁵ N. The electric field between the plates is about",["2.4 × 10⁴ N/C","2.9 × 10³ N/C","4.7 × 10³ N/C","6.2 × 10⁻³⁵ N/C"],0,"E = F/e = (3.9 × 10⁻¹⁵) ÷ (1.6 × 10⁻¹⁹) = 2.4 × 10⁴ N/C.","E = F ÷ q.",0,7],["Tutorial 5.1(b): With E = 2.4 × 10⁴ N/C between plates 12 cm apart, the potential difference is about",["290 V","29 kV","2.9 kV","2.0 × 10⁵ V"],2,"ΔV = Ed = (2.4 × 10⁴)(0.12) = 2.9 × 10³ V.","ΔV = E × d. Use metres.",0,7],["Tutorial 5.2: An infinite non-conducting sheet has σ = 0.10 μC/m². How far apart are equipotential surfaces that differ by 50 V?",["1.8 cm","4.4 mm","8.8 mm","88 mm"],2,"E = σ/2ε₀ = 1.0 × 10⁻⁷ ÷ (2 × 8.85 × 10⁻¹²) = 5650 V/m. d = ΔV/E = 50 ÷ 5650 = 8.8 mm.","d = ΔV ÷ E, with E = σ/2ε₀ for a sheet.",0,7],["Tutorial 5.3: An empty hollow metal sphere is at +400 V with respect to ground. The potential at its centre is",["+800 V","+200 V","0 V","+400 V"],3,"Charge sits on the surface of a conductor and the inside is an equipotential, so the centre is at the same 400 V as the surface.","Inside a conductor, V is the same as on the surface.",0,7],["Tutorial 5.4: Two electrons are fixed 2.0 cm apart. A third electron is shot from infinity and stops midway between them. Its initial speed is about",["1.6 × 10² m/s","4.6 × 10⁻²⁶ m/s","1.0 × 10⁵ m/s","3.2 × 10² m/s"],3,"Each fixed electron is 1.0 cm away, so U = 2ke²/r = 4.6 × 10⁻²⁶ J. Set ½mv² = U: v = 3.2 × 10² m/s.","Kinetic energy turns into potential energy. Two charges, so double the term.",0,7],["Tutorial 5.5: The electric potential energy of two electrons 2.00 nm apart is about",["1.15 × 10⁻¹⁹ J","1.15 × 10⁻²⁸ J","2.3 × 10⁻¹⁹ J","5.8 × 10⁻²⁰ J"],0,"U = ke²/r = (8.99 × 10⁹)(1.6 × 10⁻¹⁹)² ÷ (2.00 × 10⁻⁹) = 1.15 × 10⁻¹⁹ J.","U = kq₁q₂/r. Exponents: 9 − 38 + 9 = −20, times the digits.",0,7],["Tutorial 5.5(b): If the separation between two electrons increases, their potential energy",["becomes negative","increases","decreases","stays the same"],2,"U = kq₁q₂/r. For like charges U is positive and falls as r grows.","Like charges: farther apart, less energy.",0,7],["Tutorial 5.6: A conducting sphere of radius 0.15 m is at 200 V (V = 0 at infinity). Its charge is about",["1.3 × 10¹¹ C","1.2 × 10⁻⁸ C","3.3 × 10⁻⁹ C","6.7 × 10⁻⁹ C"],2,"V = kq/r, so q = Vr/k = (200)(0.15) ÷ (8.99 × 10⁹) = 3.3 × 10⁻⁹ C.","q = Vr/k.",0,7],["Tutorial 5.6(b): The surface charge density on that sphere (q = 3.3 × 10⁻⁹ C, r = 0.15 m) is about",["3.3 × 10⁻⁹ C/m²","1.2 × 10⁻⁸ C/m²","7.4 × 10⁻⁸ C/m²","2.2 × 10⁻⁸ C/m²"],1,"σ = q/(4πr²) = 3.3 × 10⁻⁹ ÷ (4π × 0.0225) = 1.2 × 10⁻⁸ C/m².","Sphere area is 4πr².",0,7],["Tutorial 5.7: V = (2.0 V/m²)x² − (3.0 V/m²)y². The magnitude of the electric field at (3.0 m, 2.0 m) is",["6.0 V/m","12 V/m","24 V/m","17 V/m"],3,"E = −∇V. Eₓ = −4x = −12 V/m and E_y = +6y = +12 V/m. Magnitude = √(12² + 12²) = 17 V/m, at 135° from the +x axis.","E is minus the slope of V in each direction.",0,7],["Tutorial 5.9: Spheres A and B each carry +5.00 μC and are 1.00 m apart. The electric potential energy of the pair is",["0.0225 J","2.25 J","0.225 J","0.45 J"],2,"U = kq²/d = (8.99 × 10⁹)(5.00 × 10⁻⁶)² ÷ 1.00 = 0.225 J.","U = kq₁q₂/d.",0,7],["Tutorial 5.9(b): The string between A (5.00 g) and B (10.0 g) is cut. The force on each sphere is 0.225 N. The initial acceleration of sphere A is",["45 m/s²","22.5 m/s²","90 m/s²","0.225 m/s²"],0,"a = F/m = 0.225 ÷ 0.00500 = 45 m/s². Sphere B has half of that (22.5 m/s²).","Lighter sphere accelerates more. Convert grams to kg.",0,7],["Tutorial 5.9(c): A long time after the string is cut, the speed of the lighter sphere A (5.00 g, B is 10.0 g, U = 0.225 J) is about",["7.75 m/s","5.48 m/s","3.87 m/s","15.5 m/s"],0,"Momentum: mₐvₐ = m_Bv_B, so vₐ = 2v_B. Energy: ½mₐvₐ² + ½m_Bv_B² = 0.225 J gives v_B = 3.87 m/s and vₐ = 7.75 m/s.","Conserve momentum and energy. Lighter one moves faster.",0,7]]},{"t":"Conductors, Electric Current, Resistors and Resistance","s":["Types of Electricity and Charge Carriers","Classification of Materials","Electric Current","Ohm's Law","Resistance and Resistivity","Resistors","Series and Parallel Circuits","Electric Power and Joule's Law","Tutorial"],"q":[["Static electricity is usually produced by",["a transformer on an alternating supply","a generator turning at high speed","a chemical cell connected to a bulb","friction, e.g. rubbing ebonite with fur"],3,"The book gives rubbing an ebonite rod with fur as an example of static electricity from friction.","Static = friction.",0,0],["Current electricity deals with",["heat flow along a metal rod only","the continuous flow of electrons","charges held at rest on surfaces","the pull between magnetic poles"],1,"Current electricity is the branch that deals with continuous flow of electrons. It can be produced by a chemical cell or a generator.","Current = flow.",0,0],["The charge carriers in metals are",["ions","holes","protons","electrons"],3,"In metals the carriers are electrons (negative).","Metals: electrons.",0,0],["The charge carriers in a liquid (electrolyte) are",["free electrons and holes together","electrons only, with no ions","protons moving through the liquid","positive and negative ions"],3,"Liquids carry current by ions, both positive and negative.","Liquids: ions.",0,0],["The charge carriers in semiconductors are",["electrons and holes","protons and holes","electrons only","ions only"],0,"Semiconductors have electrons (−) and holes (+) as carrie
