rs.","Semiconductor: electrons and holes.",0,0],["The charge carriers in gases are",["holes and ions","electrons and ions","electrons only","protons only"],1,"In an ionised gas, such as plasma, both electrons and ions carry the current.","Gas: electrons and ions.",0,0],["Conductors are materials that",["conduct electricity only after being doped","allow electricity and heat to pass through them","conduct heat but never electricity","resist both electricity and heat strongly"],1,"Conductors are good carriers of electricity and heat. Examples are metals and the human body.","Conductors pass both.",0,1],["A material such as silicon or germanium is a",["conductor","superconductor","insulator","semiconductor"],3,"The book names silicon and germanium as semiconductors.","Si and Ge: semiconductors.",0,1],["A semiconductor conducts electricity",["more than a pure conductor and an insulator","exactly the same as a metallic conductor does","less than an insulator but more than a conductor","more than an insulator but less than a pure conductor"],3,"It sits between insulators such as glass and pure conductors such as aluminium and copper.","In the middle.",0,1],["The conductivity of a semiconductor can be changed by adding impurities. This is called",["polarization","plating","doping","annealing"],2,"Adding impurities to a semiconductor is called doping.","Impurities = doping.",0,1],["Insulators resist the flow of current because of their",["wide energy gap","high temperature only","overlapping bands","free protons"],0,"Insulators have a wide band or energy gap. Conductors have overlapping bands.","Insulator: wide gap.",0,1],["Which of these is an insulator in the book's list?",["Ceramics","Silicon","Aluminium","Copper"],0,"Wood, cork, paper, fabric and ceramics are insulators.","Ceramics insulate.",0,1],["Electric current is",["the work done per unit charge moved","the rate of flow of electric charge","the force acting on a single charge","the energy stored by a charged body"],1,"I = dq/dt, the quantity of charge flowing per second.","Current = charge per second.",0,2],["The SI unit of electric current is the",["coulomb","ampere","ohm","volt"],1,"The ampere is one coulomb per second.","Amp = C/s.",0,2],["One ampere is a flow of charge at the rate of",["one volt per ohm second","one coulomb per metre","one coulomb per second","one joule per second"],2,"1 A = 1 C/s.","Ampere is coulomb per second.",0,2],["A charge of 12 C flows past a point in 4 s. The current is",["48 A","8 A","3 A","0.33 A"],2,"I = q/t = 12 ÷ 4 = 3 A.","Divide charge by time.",0,2],["Electric current is measured with a device called an",["ammeter","rheostat","voltmeter","galvanometer shunt"],0,"The ammeter measures current.","Ammeter, amps.",0,2],["In alternating current (AC), the charge",["moves in one direction only","flows only in insulators","periodically reverses direction","stays at rest"],2,"AC reverses direction periodically. The usual waveform is a sine wave.","AC alternates.",0,2],["Direct current (DC) is a flow of charge",["that follows a sine wave","that stops and starts","that reverses every cycle","in one direction only"],3,"DC is unidirectional, one-way flow.","DC = one way.",0,2],["Which of these is a source of direct current?",["A battery","A radio antenna","A mains socket","A transformer"],0,"DC comes from batteries, thermocouples, solar cells and dynamo type sources.","Battery gives DC.",0,2],["The usual waveform of an AC power circuit is a",["straight line","sine wave","square pulse only","single spike"],1,"The usual waveform is a sine wave. Triangular, square and saw-tooth waves are also possible.","AC: sine wave.",0,2],["Ohm's law states that the current through a wire is directly proportional to",["the resistance of the wire at that temperature","the length of the wire squared at any temperature","the p.d. across its ends at constant temperature","the temperature of the wire at constant voltage"],2,"V is proportional to I provided the temperature of the wire stays constant.","I follows V.",0,3],["Ohm's law is written as",["V = IR","V = R/I","V = I²R","V = I/R"],0,"V = IR.","V = I R.",0,3],["The graph of V against I for an ohmic conductor is",["a circle","a horizontal line","a straight line","a parabola"],2,"V against I is linear.","Ohmic: straight line.",0,3],["The slope of a V against I graph gives the",["power of the wire","resistance of the wire","temperature of the wire","charge on the wire"],1,"Slope = V/I = R.","Slope is R.",0,3],["One of the limitations of Ohm's law is that",["the temperature must be constant","the wire must be stretched","the voltage must be zero","the current must be alternating"],0,"The book lists constant temperature, and the wire not being under tension.","Keep temperature fixed.",0,3],["Materials that do not obey Ohm's law are called",["semi-ohmic","anti-ohmic","non-ohmic","super-ohmic"],2,"The connection between V and I is more complicated in non-ohmic materials.","Non-ohmic.",0,3],["A voltmeter is connected",["in parallel with the part being measured","in series with the part being measured","only across the battery","to the earth"],0,"The voltmeter goes in parallel. The ammeter goes in series.","Voltmeter parallel, ammeter series.",0,3],["A current of 2 A flows through a 6 Ω resistor. The potential difference across it is",["0.33 V","12 V","3 V","8 V"],1,"V = IR = 2 × 6 = 12 V.","Multiply I by R.",0,3],["1 mA equals",["10⁻³ A","10⁻⁶ A","10³ A","10⁻⁹ A"],0,"1 mA = 10⁻³ A. 1 μA = 10⁻⁶ A.","milli = thousandth.",0,3],["The resistance of a wire is given by",["R = ρl/A","R = ρlA","R = l/ρA","R = ρA/l"],0,"R depends on length l, cross-sectional area A and the resistivity ρ.","Long raises R, thick lowers R.",0,4],["A long thin wire compared with a short thick wire has",["the same resistance","less resistance","no resistance","more resistance"],3,"Long thin wires give more resistance than short thick ones.","Long thin = more.",0,4],["The unit of resistivity is the",["ohm","ohm-metre (Ω·m)","siemens","ohm per metre"],1,"Resistivity ρ has the unit Ω·m.","ρ in ohm-metre.",0,4],["Conductivity and resistivity are",["equal","unrelated","inversely related","directly proportional"],2,"σ = 1/ρ. A good conductor has low resistivity.","Conductivity is 1/ρ.",0,4],["The unit of conductivity is",["Ω⁻¹m⁻¹","Ω·m⁻²","Ω","Ω·m"],0,"The book gives conductivity in Ω⁻¹m⁻¹.","Inverse of Ω·m.",0,4],["The resistance of a metal wire usually",["decreases as the temperature increases","increases as the temperature increases","stays constant","falls to zero at room temperature"],1,"Resistance usually increases with temperature.","Hot wire, more resistance.",0,4],["Materials with no or extremely low resistance at low temperatures are called",["superconductors","insulators","non-ohmic materials","semiconductors"],0,"Superconductors give no energy loss when current passes through them.","No resistance = super.",0,4],["Which of these does NOT affect the resistance of a wire?",["Its temperature","Its cross-sectional area","Its length","The colour of the wire"],3,"The factors are length, cross-sectional area, temperature and the nature of the material.","Colour does not count.",0,4],["The unit of resistance is the",["volt","ohm (Ω)","watt","ampere"],1,"Resistance is measured in ohms.","Resistance in ohms.",0,4],["A resistor is a material that",["creates a current in the circuit","removes all current from the circuit","stores charge for later release","opposes the free flow of current"],3,"A resistor is made of wire, carbon or graphite wound round an insulator.","Resistor opposes current.",0,5],["The metal wires used in wire-wound resistors are commonly",["nichrome or manganin","lead or tin","gold or platinum","copper or silver"],0,"Nichrome or manganin give high resistance and work at high temperature.","Nichrome and manganin.",0,5],["A fixed resistor is one whose resistance is",["zero at room temperature always","changing with the voltage across it","defined and not adjustable","adjustable using a sliding knob"],2,"A fixed resistor has a set value, such as a 2 Ω or a 5 Ω resistor.","Fixed = set value.",0,5],["Which of these is a variable resistor?",["A rheostat","A capacitor","A nichrome coil","A 5 Ω resistor"],0,"Resistance boxes and rheostats have adjustable resistance.","Rheostat adjusts.",0,5],["Resistors in series have the same",["current through each","voltage across each","resistance","power in each"],0,"In series the same current passes through each resistor.","Series: same current.",0,6],["The equivalent resistance of resistors in series is",["1/R = 1/R₁ + 1/R₂ + …","R = the smallest resistor","R = R₁ + R₂ + R₃ + …","R = R₁R₂R₃"],2,"Series resistances simply add.","Series: add.",0,6],["Resistors in parallel have the same",["power dissipated in each one","resistance value of each one","potential difference across each","current flowing through each one"],2,"In parallel the voltage is the same across each branch.","Parallel: same voltage.",0,6],["The equivalent resistance of resistors in parallel is given by",["R = R₁ + R₂ + R₃ + …","1/R = 1/R₁ + 1/R₂ + 1/R₃ + …","R = R₁R₂R₃ ÷ (R₁ + R₂ + R₃)","1/R = R₁ + R₂ + R₃ + …"],1,"Add the reciprocals, then take the reciprocal of the total.","Parallel: add reciprocals.",0,6],["Resistors of 8 Ω, 8 Ω and 4 Ω are connected in series to a 10 V battery. The current is",["2 A","0.2 A","0.5 A","5 A"],2,"R = 8 + 8 + 4 = 20 Ω. I = V/R = 10 ÷ 20 = 0.5 A.","Add first, then divide.",0,6],["Resistors of 8 Ω, 8 Ω and 4 Ω are connected in parallel. The total resistance is",["0.5 Ω","20 Ω","4 Ω","2 Ω"],3,"1/R = 1/8 + 1/8 + 1/4 = 1/2, so R = 2 Ω.","Parallel total is smaller than the smallest.",0,6],["Resistors of 8 Ω, 8 Ω and 4 Ω are in parallel across a 10 V battery. The current through the 4 Ω resistor is",["0.4 A","2.5 A","1.25 A","5 A"],1,"Each branch has 10 V. I = V/R = 10 ÷ 4 = 2.5 A.","Same V, use I = V/R.",0,6],["The total resistance of resistors in parallel is always",["equal to the largest resistor","more than the smallest resistor","equal to the sum","less than the smallest resistor"],3,"Adding more paths lowers the total resistance.","Parallel always lowers R.",0,6],["In the series-parallel circuit of Example 6.4, R₂ = 20 Ω and R₃ = 30 Ω are in parallel. Together they equal",["50 Ω","12 Ω","10 Ω","25 Ω"],1,"R = (20 × 30) ÷ (20 + 30) = 12 Ω.","Product over sum.",0,6,"fig6_6"],["In Example 6.4, R₁ = 38 Ω is in series with the 12 Ω parallel part, and the supply is 25 V. The current from the supply is",["2 A","0.66 A","0.5 A","1.5 A"],2,"Total R = 38 + 12 = 50 Ω. I = 25 ÷ 50 = 0.5 A.","Series part first.",0,6,"fig6_6"],["Electric power is",["the rate of doing work or using electrical energy","the charge passing a point each second","the force acting on a moving charge","the total energy stored in the circuit"],0,"Power is work done, or energy used, per second.","Power = energy per time.",0,7],["Electrical power can be written as",["P = V + I","P = VI","P = V/I","P = I/V"],1,"P = VI = I²R = V²/R.","P = V I.",0,7],["The unit of power is the watt, which equals",["one coulomb per second","one volt per ampere","one joule per coulomb","one joule per second"],3,"1 W = 1 J/s.","Watt = J/s.",0,7],["The power dissipated in a resistor R carrying current I is",["I/R²","IR²","R/I²","I²R"],3,"P = I²R. It appears as heat in the resistor.","I squared R.",0,7],["Heating of a resistor by the current passing through it is known as",["Ohmic cooling","Faraday heating","Joule heating","Coulomb heating"],2,"The power dissipated in a resistor heats it. This is Joule heating, as in an electric heater.","Joule heating.",0,7],["Joule's law gives the heat produced as",["H = I²Rt","H = IRt²","H = I²R/t","H = IR/t"],0,"H is proportional to I² (when R and t are constant), to R and to t.","H = I²Rt.",0,7],["By Joule's law, doubling the current through a resistor, with R and t fixed, makes the heat",["double","half","unchanged","four times"],3,"H is proportional to I², so doubling I gives 4 times the heat.","Double I, times 4.",0,7],["Electricity bills are charged for",["voltage, in volts supplied","power, in kilowatts used","energy, in kilowatt-hours","current, in amperes drawn"],2,"Companies bill for energy in kWh and not for power.","Bill = kWh.",0,7],["One kilowatt-hour is equal to",["6.0 × 10⁴ J","3.6 × 10⁶ J","1 × 10⁶ J","3.6 × 10³ J"],1,"1 kW·h = 3.6 × 10⁶ J.","3.6 million joules.",0,7],["A 100 W bulb is on for 2 hours each day for 30 days. Energy costs 0.10 per kWh. The cost for the month is",["6.00","60.00","0.06","0.60"],3,"Energy = 0.1 kW × 60 h = 6 kWh. Cost = 6 × 0.10 = 0.60, or 60 cents.","Convert W to kW first.",0,7],["Tutorial 6.3: A 75 V supply is connected across a 50 Ω resistor in parallel with a 35 Ω and a 40 Ω resistor in series. The total current is",["2.5 A","0.6 A","1.0 A","3.0 A"],0,"The series pair is 35 + 40 = 75 Ω. In parallel with 50 Ω: R = (50 × 75) ÷ 125 = 30 Ω. I = 75 ÷ 30 = 2.5 A.","Series first, then parallel, then Ohm's law.",0,8],["Tutorial 6.4: A 9.0 V accumulator with negligible internal resistance is connected to a 5 Ω resistor in series with a parallel pair of 5 Ω and 20 Ω. The total current is",["1.8 A","0.69 A","1.0 A","0.36 A"],2,"Parallel part: (5 × 20) ÷ 25 = 4 Ω. Total R = 5 + 4 = 9 Ω. I = 9 ÷ 9 = 1.0 A.","Product over sum, then add the series 5 Ω.",0,8],["Tutorial 6.5: A wire 20 m long with cross-sectional area 8 × 10⁻⁶ m² has resistivity 4 × 10⁻⁷ Ω·m. Its resistance is",["10 Ω","1.0 Ω","6.4 × 10⁻¹² Ω","0.10 Ω"],1,"R = ρL/A = (4 × 10⁻⁷)(20) ÷ (8 × 10⁻⁶) = 1.0 Ω.","R = ρL/A.",0,8],["Tutorial 6.5(ii): A wire of cross-sectional area 2π × 10⁻⁸ m² and resistivity 1.1 × 10⁻⁶ Ω·m has a resistance of 21 Ω (take π = 22/7). Its length is",["0.83 m","12 m","2.4 m","1.2 m"],3,"L = RA/ρ = (21)(2 × 22/7 × 10⁻⁸) ÷ (1.1 × 10⁻⁶) = 1.2 m.","Make L the subject: L = RA/ρ.",0,8],["Tutorial 6.6: An electric fan draws 0.75 A in a 240 V circuit. The utility rate is $0.50 per kWh. The cost of running it for 10 hours is",["$0.09","$9.00","$0.90","$1.80"],2,"P = VI = 240 × 0.75 = 180 W = 0.18 kW. Energy = 0.18 × 10 = 1.8 kWh. Cost = 1.8 × 0.50 = $0.90.","P = VI, then kW × hours × rate.",0,8],["Tutorial 6.7: The maximum power a 100 Ω resistor can dissipate is 8 W. The largest voltage across it is about",["12.5 V","800 V","0.28 V","28 V"],3,"P = V²/R, so V = √(PR) = √(8 × 100) = 28 V.","V = √(PR).",0,8]]},{"t":"Capacitors","s":["Introduction to Capacitors","Types and Dielectrics","Applications of Capacitors","Capacitance","Arrangement of Capacitors","Energy Stored in a Capacitor","Electric Field Energy Density","Worked Examples","Tutorial"],"q":[["A capacitor is a device used to",["store electrical charge","produce a steady current","amplify a voltage","block all current for ever"],0,"Capacitors store electrical charge, which can then be released in a controlled way.","Capacitor stores charge.",0,0],["The basic configuration of a capacitor is",["two conductors with +q and +q, kept apart by an insulator","one conductor wound into a coil with a steel core","two insulators pressed together with no gap between","two conductors with +q and −q, kept apart by an insulator"],3,"A capacitor has two conductors with +q and −q, usually separated by a non-conducting material called a dielectric.","Two plates plus dielectric.",0,0],["The non-conducting material between the plates of a capacitor is called the",["terminal","electrolyte","conductor","dielectric"],3,"The separating insulator is the dielectric.","Between plates: dielectric.",0,0],["The work done in placing charges on the plates of a capacitor is stored as",["heat energy released in the metal of the plates","potential energy in the electric field between the plates","magnetic energy of the current in the wires","kinetic energy of the charges moving on the plates"],1,"It takes work to place the charges, and this is stored as potential energy in the electric field.","Stored in the field.",0,0],["The simplest form of capacitor is the",["spherical capacitor","cylindrical capacitor","parallel plate capacitor","electrolytic capacitor"],2,"The book calls the parallel plate capacitor the simplest form.","Simplest: two parallel plates.",0,0],["Capacitors are generally divided into two common groups, which are",["series and parallel","fixed and variable","ceramic and glass","small and large"],1,"The groups are fixed capacitors and variable capacitors.","Fixed or variable.",0,1],["A variable capacitor has a capacitance that is",["adjustable (tunable or trimmer)","always zero until charged","independent of the plate area","fixed at the factory value"],0,"Variable capacitors have variable (trimmer) or adjustable (tunable) values.","Variable = adjustable.",0,1],["Many capacitors get their names from",["the dielectric used in them","the person who invented them","the colour of the casing","the voltage they hold"],0,"Many capacitors are named after their dielectric.","Name follows dielectric.",0,1],["In an aluminium electrolytic capacitor, the dielectric is",["polypropylene","paper","mica","aluminium oxide"],3,"The book's table gives aluminium oxide for aluminium electrolytic capacitors.","Aluminium electrolytic: aluminium oxide.",0,1],["In an air-gap capacitor, the dielectric is",["air","paper","mica","glass"],0,"An air-gap capacitor uses air between the plates.","Air-gap: air.",0,1],["A paper capacitor uses which dielectric?",["Air","Glass","Mica","Paper"],3,"Paper capacitors use paper as the dielectric.","Paper capacitor, paper.",0,1],["Which of these is a type of fixed capacitor?",["Trimmer resistor","Tuning coil","Rheostat","Ceramic capacitor"],3,"Ceramic, film and paper, electrolytic, polymer, super-capacitor, and mica or glass capacitors are fixed types.","Ceramic is fixed.",0,1],["In electrical circuits, large value capacitors are used for",["reducing resistance","energy storage, as in strobe lights","tuning radio sets only","coupling signals between amplifier stages"],1,"Large capacitors store charge, for example in strobe lights. They are also used in induction motors and for power factor correction.","Large: energy storage.",0,2],["Power factor correction in AC power distribution systems is an application of",["diodes","small value capacitors","large value capacitors","resistors"],2,"Large value capacitors are used for power factor correction.","Large for power factor.",0,2],["In electronic circuits, small value capacitors are used to",["store energy for large strobe lights","couple signals between stages of amplifiers","start heavy induction motors in factories","correct the power factor on mains lines"],1,"Small value capacitors couple signals, form filters and tuned circuits, and smooth rectified current.","Small: signals.",0,2],["When combined with resistors, capacitors can be used for",["removing all resistance","delaying voltage changes","producing a magnetic field","increasing the current"],1,"Capacitors with resistors delay voltage changes and can also act as voltage dividers.","R plus C gives delay.",0,2],["Capacitors in power supply systems are used to",["smooth the rectified current","rectify the current","reduce the voltage to zero","increase the frequency"],0,"They smooth rectified current in power supply systems.","Capacitor smooths.",0,2],["Adjustable capacitors are frequently used in",["power cables","tuned circuits","strobe lights","fuses"],1,"Standard capacitors are fixed, but adjustable ones are often used in tuned circuits.","Adjustable for tuning.",0,2],["Capacitance is defined as the ratio of",["the potential difference across it to the charge on it","the charge on the capacitor to the potential difference across it","the charge on one plate to the area of the plate","the energy stored in it to the charge on it"],1,"C = Q/V.","C = Q over V.",0,3],["The unit of capacitance is the",["tesla","henry","weber","farad"],3,"One farad is one coulomb per volt.","Farad = C/V.",0,3],["One farad equals",["one coulomb per volt","one coulomb per second","one joule per coulomb","one volt per coulomb"],0,"1 F = 1 C/V.","Farad: C per V.",0,3],["The capacitance of a parallel plate capacitor is",["C = ε₀A/d","C = ε₀Ad","C = A/ε₀d","C = ε₀d/A"],0,"C = ε₀A/d, where A is the area of one plate and d the separation.","Big area, small gap.",0,3],["For a parallel plate capacitor, doubling the plate separation d makes the capacitance",["four times","half","double","unchanged"],1,"C is inversely proportional to d.","d up, C down.",0,3],["For a parallel plate capacitor, doubling the plate area makes the capacitance",["unchanged","four times","double","half"],2,"C is directly proportional to A.","A up, C up.",0,3],["The capacitance of an isolated spherical conductor of radius R is",["C = ε₀R/4π","C = 4πε₀R","C = 4πε₀R²","C = 2πε₀R"],1,"The book gives C = Q/ΔV = 4πε₀R.","Sphere: 4πε₀R.",0,3],["The capacitance of a spherical capacitor with inner radius a and outer radius b is",["C = 4πε₀a²b²","C = 4πε₀(a + b)","C = 4πε₀ab/(b − a)","C = 4πε₀(b − a)/ab"],2,"The book's result is C = 4πε₀ (ab/(b − a)).","ab over (b minus a).",0,3],["The capacitance of a cylindrical capacitor of length L, inner radius a and outer radius b is",["C = ε₀L/(b − a)","C = 2πε₀L ln(b/a)","C = 4πε₀L / ln(b/a)","C = 2πε₀L / ln(b/a)"],3,"For the cylindrical capacitor, C = 2πε₀L/ln(b/a).","Cylinder: 2πε₀L over ln.",0,3],["Which one of these does NOT affect the capacitance of a capacitor?",["The dielectric","The area of the plates","The colour of the plates","The distance between the plates"],2,"The factors are plate separation, area, shape of the conductors and dielectric.","Colour does not matter.",0,3],["Capacitors in series have the same",["capacitance","charge on each","voltage across each","energy"],1,"Each capacitor in series carries the same charge Q.","Series: same Q.",0,4],["The equivalent capacitance of capacitors in series is given by",["C = C₁C₂C₃ ÷ (C₁ + C₂ + C₃)","C = C₁ + C₂ + C₃ + …","1/C = C₁ + C₂ + C₃ + …","1/C = 1/C₁ + 1/C₂ + 1/C₃ + …"],3,"Add the reciprocals of the capacitances.","Series C: reciprocals.",0,4],["Capacitors in parallel have the same",["energy stored in each of them","capacitance value of each one","potential difference across each","charge stored on every one of them"],2,"In parallel, the upper plates are at the same potential, and so are the lower plates.","Parallel: same V.",0,4],["The equivalent capacitance of capacitors in parallel is",["1/C = 1/C₁ + 1/C₂ + …","C = C₁C₂/(C₁ + C₂)","C = C₁ + C₂ + C₃ + …","C = the largest one"],2,"Parallel capacitances simply add.","Parallel C: add.",0,4],["In a series combination, the equivalent capacitance is always",["larger than the largest capacitor","smaller than the smallest capacitor","equal to the sum","equal to the average"],1,"Adding the reciprocals gives a larger 1/C, so a smaller C.","Series lowers C.",0,4],["For two capacitors in series, the total potential difference equals",["V₁ − V₂","V₁ ÷ V₂","V₁ × V₂","V₁ + V₂"],3,"V_ab = V_ac + V_cb.","Voltages add in series.",0,4],["In a parallel combination, the total charge is",["Q = Q₁ + Q₂","Q = Q₁Q₂","Q = Q₁ − Q₂","equal to the larger charge only"],0,"The equivalent capacitor carries the total charge Q₁ + Q₂.","Charges add in parallel.",0,4],["Capacitors of 2 μF and 6 μF are connected in parallel. The equivalent capacitance is",["4 μF","8 μF","12 μF","1.5 μF"],1,"C = C₁ + C₂ = 2 + 6 = 8 μF.","Parallel: just add.",0,4],["Capacitors of 3 μF and 6 μF are connected in series. The equivalent capacitance is",["9 μF","4.5 μF","18 μF","2 μF"],3,"1/C = 1/3 + 1/6 = 1/2, so C = 2 μF.","Product over sum: 18 ÷ 9.",0,4],["The energy stored in a capacitor comes from",["the heat inside the plates","the dielectric material itself","the work done in charging it","the air surrounding the capacitor"],2,"The energy comes from the work done in charging the capacitor.","Charging work is stored.",0,5],["The incremental work done in bringing a small charge dq to a capacitor at potential v is",["dW = dq/v","dW = C dq/q","dW = q dq C","dW = v dq = q dq/C"],3,"dW = v dq, and v = q/C.","dW = (q/C) dq.",0,5],["The energy stored in a capacitor is",["U = QC²/2","U = 2Q/C","U = Q²/2C","U = Q²C/2"],2,"Integrating q dq/C from 0 to Q gives U = Q²/2C. This also equals ½QV and ½CV².","U = Q² over 2C.",0,5],["The energy stored in a capacitor can also be written as",["U = ½CV²","U = ½C²V","U = CV²","U = ½V/C"],0,"Using Q = CV gives U = ½CV² = ½QV.","Half C V squared.",0,5],["The voltage across a capacitor is doubled. The stored energy becomes",["unchanged","half","double","four times"],3,"U = ½CV² is proportional to V².","Double V, times 4.",0,5],["The energy stored in a capacitor can be thought of as stored in",["the connecting wires and the battery","the electric field between the plates","the dielectric material's atoms alone","the metal of the two plates only"],1,"The book treats it as stored in the electric field in the region between the plates.","Energy lives in the field.",0,6],["The energy density of an electric field is",["u = ½ε₀E","u = ε₀E²","u = ½ε₀E²","u = ½E²/ε₀"],2,"Dividing U = ½CV² by the volume Ad gives u = ½ε₀E².","Half epsilon E squared.",0,6],["The result u = ½ε₀E² was found for a parallel plate capacitor. The book says it holds",["for air-filled capacitors only","for all capacitors, whatever their shape","for parallel plate capacitors only","for spherical capacitors only"],1,"It is the energy density of the electric field in general.","Result is general.",0,6],["Energy density is the stored energy per unit",["length","volume","area","charge"],1,"Energy density = U/(Ad), energy per unit volume.","Density = per volume.",0,6],["Capacitors of 15 μF, 10 μF, 6 μF and 3 μF are in series across 20 V. The equivalent capacitance is",["6 μF","0.67 μF","34 μF","1.5 μF"],3,"1/C = 1/15 + 1/10 + 1/6 + 1/3 = 0.667 per μF, so C = 1.5 μF.","Series: reciprocals add.",0,7,"fig7_ex1"],["In the same arrangement (15, 10, 6 and 3 μF in series across 20 V), the charge on each capacitor is",["20 μC","300 μC","1.5 μC","30 μC"],3,"Series capacitors carry the same charge. Q = C_eq ΔV = (1.5 μF)(20 V) = 30 μC.","Q = C_eq V.",0,7,"fig7_ex1"],["In the same arrangement, the voltage across the 3 μF capacitor is",["20 V","5 V","10 V","2 V"],2,"V = Q/C = 30 μC ÷ 3 μF = 10 V. The four voltages (2, 3, 5 and 10 V) add up to 20 V.","Smallest C takes largest V.",0,7,"fig7_ex1"],["Capacitors of 2.0 pF and 6.0 pF are connected in parallel across 120 V. The total charge is",["0.24 nC","0.72 nC","0.96 nC","9.6 nC"],2,"C = 8.0 pF. Q = CV = (8.0 × 10⁻¹² F)(120 V) = 0.96 nC. The charges are 0.24 nC and 0.72 nC.","Q = C_eq V.",0,7],["The absolute potential at 10 cm from a 2.0 μC charge is",["1.8 × 10⁵ V","1.8 × 10⁶ V","3.6 × 10⁴ V","1.8 × 10⁴ V"],0,"V = kq/r = (9.0 × 10⁹)(2.0 × 10⁻⁶) ÷ 0.10 = 1.8 × 10⁵ V.","kq over r.",0,7],["The absolute potential at 50 cm from a 2.0 μC charge is",["3.6 kV","9 kV","36 kV","180 kV"],2,"V = (9.0 × 10⁹)(2.0 × 10⁻⁶) ÷ 0.50 = 3.6 × 10⁴ V = 36 kV.","Five times farther, one fifth V.",0,7],["The work needed to carry a 0.05 μC charge from 50 cm to 10 cm from a 2.0 μC charge is",["72 mJ","7.2 J","0.72 mJ","7.2 mJ"],3,"W = q(V₁₀ − V₅₀) = (0.05 × 10⁻⁶)(1.44 × 10⁵) = 7.2 × 10⁻³ J.","W = q × ΔV.",0,7],["Tutorial 7.4: Two capacitors of 2 μF each are connected in parallel across 120 V. The charge on each capacitor is",["240 μC","480 μC","120 μC","60 μC"],0,"In parallel each capacitor has the full 120 V: Q = CV = (2 × 10⁻⁶)(120) = 240 μC.","Parallel: same V on each, so Q = CV.",0,8],["Tutorial 7.5: Between X and Y a 2 μF capacitor is in series with three identical capacitors C connected in parallel. The effective capacitance is 1.5 μF. The value of C is",["1 μF","3 μF","2 μF","6 μF"],2,"1/1.5 = 1/2 + 1/(3C). So 1/(3C) = 0.667 − 0.5 = 0.167, 3C = 6 μF and C = 2 μF.","Three in parallel is 3C. Then reciprocals add.",0,8],["Tutorial 7.6: A 2 μF and a 6 μF capacitor in parallel are in series with another 2 μF capacitor. The effective capacitance is",["1.6 μF","2.67 μF","0.8 μF","10 μF"],0,"Parallel part: 2 + 6 = 8 μF. In series with 2 μF: (8 × 2) ÷ 10 = 1.6 μF.","Add the parallel pair, then product over sum.",0,8],["Tutorial 7.6(b): The arrangement of effective capacitance 1.6 μF is connected to 10 V. The total energy stored is",["80 μJ","16 μJ","8 μJ","160 μJ"],0,"U = ½CV² = ½ (1.6 × 10⁻⁶)(10)² = 8.0 × 10⁻⁵ J = 80 μJ.","½CV². Do not forget the half.",0,8],["Tutorial 7.7: Three 120 pF capacitors, each charged to 0.50 kV, are connected in series. The potential difference between the end plates is",["0.17 kV","4.5 kV","1.5 kV","0.50 kV"],2,"In series the voltages add: 3 × 0.50 kV = 1.5 kV.","Series: voltages add.",0,8],["Tutorial 7.7(ii): For three 120 pF capacitors charged to 0.50 kV and connected in series, the charge on each capacitor is",["180 nC","60 μC","60 nC","20 nC"],2,"Q = CV = (120 × 10⁻¹²)(500) = 6.0 × 10⁻⁸ C = 60 nC. Series capacitors carry the same charge.","Q = CV with one capacitor's own values.",0,8],["Tutorial 7.7(iii): The energy stored in that series system (Cₑq = 40 pF, V = 1.5 kV) is",["45 μJ","4.5 μJ","15 μJ","90 μJ"],0,"U = ½CₑqV² = ½ (40 × 10⁻¹²)(1500)² = 4.5 × 10⁻⁵ J = 45 μJ.","Use the equivalent capacitance and the total voltage.",0,8],["Tutorial 7.8: Capacitors of 0.30 μF and 0.50 μF are connected in parallel. Their equivalent capacitance is",["0.20 μF","0.19 μF","0.15 μF","0.80 μF"],3,"Parallel capacitors add: 0.30 + 0.50 = 0.80 μF.","Parallel: just add.",0,8],["Tutorial 7.8(b): A charge of 200 μC is placed on the 0.30 μF and 0.50 μF parallel combination (0.80 μF). The potential difference across it is",["160 V","250 V","400 V","25 V"],1,"V = Q/C = 200 μC ÷ 0.80 μF = 250 V.","V = Q ÷ C.",0,8],["Tutorial 7.8(c): With 250 V across the parallel 0.30 μF and 0.50 μF capacitors, the charges on them are",["75 μC and 125 μC","125 μC and 75 μC","100 μC and 100 μC","200 μC and 200 μC"],0,"Q = CV: (0.30)(250) = 75 μC and (0.50)(250) = 125 μC. They add to 200 μC.","Same V, bigger C gets more charge.",0,8],["Tutorial 7.10: A 5.0 μF capacitor has 2000 V across its terminals. The energy stored is",["10 J","20 J","1.0 × 10⁻² J","5.0 J"],0,"U = ½CV² = ½ (5.0 × 10⁻⁶)(2000)² = 10 J.","½CV²: 2.5 × 10⁻⁶ × 4 × 10⁶.",0,8]]},{"t":"Gauss's Law and Magnetism","s":["Gauss's Law for Dielectrics","Magnetism","Magnetic Field","Magnetic Force on Moving Charges","Field Lines and Magnetic Flux","Charge in a Uniform Magnetic Field","Force on a Current-Carrying Conductor","Torque and Magnetic Dipole Moment","Worked Examples","Tutorial"],"q":[["In a dielectric material, the electrostatic field is changed because of",["radiation","polarization","conduction","diffusion"],1,"Polarization is the redistribution of positive and negative charge within the dielectric. It produces induced surface charges.","Dielectric: polarization.",0,0],["The permittivity ε is a measure of",["how strong a magnet becomes in the dielectric","how the field is affected by the dielectric","how much current the dielectric can carry","how fast charges move in the dielectric"],1,"The book defines it as a measure of how the electric field is influenced by the dielectric medium.","ε = effect of the medium.",0,0],["Gauss's law in vacuum says the divergence of E equals",["the charge density divided by ε₀","ε₀ divided by the charge density","the charge density times ε₀","the potential divided by ε₀"],0,"∇·E = ρ/ε₀.","Divergence E = ρ/ε₀.",0,0],["Gauss's law for dielectric materials has two forms, which are",["static form and time-varying form","integral form and differential form","vector form and scalar form only","free charge form and bound charge form"],1,"The book gives an integral form and a differential form.","Integral and differential.",0,0],["A dielectric placed between charged plates weakens the original field E₀ by the factor",["κ = ε₀/ε","κ = ε/ε₀","κ = ε − ε₀","κ = ε × ε₀"],1,"E = E₀/κ, where κ = ε/ε₀.","κ is ε over ε₀.",0,0],["The induced charge on the face of a dielectric next to a positive plate is",["zero","positive (+q′)","negative (−q′)","equal to +q"],2,"Polarization of the dielectric induces −q′ on its face next to the upper positive plate.","Face next to + is induced −.",0,0],["The electric displacement vector D is defined as",["D = ε₀E + P","D = ε₀P + E","D = E/ε₀ + P","D = ε₀E − P"],0,"D = ε₀E + P, where P is the dipole moment per unit volume.","D = ε₀E + P.",0,0],["In the integral form for dielectrics, the surface integral of D over a closed surface equals",["the free charge enclosed","the bound charge enclosed","zero always","the total charge outside"],0,"∮D·dA = q, the free charge enclosed within the surface.","D flux counts free charge.",0,0],["The polarization vector P is",["the charge per unit area","the potential per unit length","the force per unit charge","the dipole moment per unit volume"],3,"P is the dipole moment per unit volume.","P = dipole per volume.",0,0],["The bound (polarized) charge density is given by",["ρ_b = ∇·E","ρ_b = −∇·P","ρ_b = −∇·D","ρ_b = +∇·P"],1,"The accumulation of bound charges gives ρ_b = −∇·P.","Bound charge: minus div P.",0,0],["In differential form, the Gauss law for dielectrics says ∇·D equals",["the free charge density ρ_f","the total charge density ρ_b + ρ_f","zero","the bound charge density ρ_b"],0,"∇·D = ρ_f. The divergence of D depends only on the free charge density.","D sees only free charge.",0,0],["The word magnet was coined after an ancient town in Asia called",["Magnesia","Mesopotamia","Magellan","Magnetia"],0,"The book says the first magnetic effects were observed in the ancient town called Magnesia.","Magnet from Magnesia.",0,1],["Magnetism is the study of magnetic effects as magnetic forces interact only with",["stationary charges","neutral atoms only","moving charges","insulators"],2,"The book states that magnetic forces interact only with moving charges.","Magnetism needs motion.",0,1],["Like poles of magnets",["attract each other","cancel each other","repel each other","have no effect on each other"],2,"Like poles repel, and unlike poles attract.","Like repels.",0,1],["The magnetic effect of a bar magnet is strongest at",["the poles (ends)","a quarter of the way along","all points equally","the centre"],0,"The effect is stronger at the poles than at the centre of a magnet.","Strong at the ends.",0,1],["Magnetic poles always occur",["in groups of three at the ends","only in iron and steel magnets","alone, as single isolated poles","in equal and opposite pairs"],3,"Poles seem to occur in equal and opposite pairs, north and south.","N comes with S.",0,1],["The end of a freely rotating bar magnet that points north is called the",["neutral pole","north pole","magnetic equator","south pole"],1,"That end is the N pole of the magnet.","North-seeking end.",0,1],["Figure 8.3(b) shows bar magnets with N facing N and S facing S. The magnets",["become demagnetised","do not interact","repel each other","attract each other"],2,"Like poles brought close repel each other.","Like poles repel.",0,1,"fig8_3"],["The geographic north pole of the earth is close to a",["magnetic south pole","magnetic north pole","magnetic equator","neutral point"],0,"That is why the north pole of a compass needle points north.","Earth: north is magnetic south.",0,1],["A compass needle tends to align with",["the nearest wire","the gravitational field","the magnetic field at its position","the electric field at its position"],2,"The needle lines up with the local magnetic field.","Needle follows B.",0,1],["The deviation of a compass reading from geographic north is called",["magnetic variation angle only","magnetic flux","magnetic inclination","magnetic declination"],3,"Declination, also called magnetic variation, occurs because the earth's magnetic axis is not parallel to its rotation axis.","Declination: sideways error.",0,1],["The angle that the earth's magnetic field makes up or down from the horizontal is called",["magnetic variation","magnetic inclination","magnetic declination","magnetic dipole"],1,"Inclination is the up or down angle of the field.","Inclination: up or down.",0,1],["At the earth's magnetic poles, the magnetic field is",["horizontal","at 45° to the surface","zero","vertical"],3,"At the magnetic poles the field points straight up or down.","Poles: vertical.",0,1],["A moving charge or a current creates",["a gravitational field in the space around it","a magnetic field in the space around it","an electric field only, with no magnetic field","no field in the space around it"],1,"Moving charges or currents set up a magnetic field, which then acts on other moving charges or currents.","Motion makes B.",0,2],["Which of these uses magnetic forces on currents?",["A glass cartridge fuse","A ceramic capacitor","A carbon film resistor","A moving-coil galvanometer"],3,"The book lists electric motors, moving-coil galvanometers, microwave ovens, loudspeakers, printers and disk drives.","Galvanometer and motor.",0,2],["A neutral point in a magnetic field is where",["two equal and opposite fields give zero resultant","all the field lines end on a pole","the magnetic field is at its strongest","the field is uniform in every direction"],0,"At a neutral point the two fields cancel.","Equal and opposite cancel.",0,2],["The magnetic field lines of a long straight wire carrying current are",["circles concentric with the wire","straight lines parallel to the wire","ellipses along the wire","straight lines pointing away from the wire"],0,"The lines form circles around the wire as shown in Figure 8.5.","Circles around wire.",0,2],["The right-hand screw rule gives the direction of",["the force acting on a moving charge","the electric field around a charge","the magnetic field lines around a current","the induced current in a nearby coil"],2,"If a right-handed screw moves forward along the current, its rotation gives the direction of the field lines.","Screw forward = current.",0,2],["In the right-hand screw rule, the screw moves forward in the direction of the",["current","field","velocity of the compass","force"],0,"The forward motion of the screw is the current direction. Its turning shows the field lines.","Forward is current.",0,2],["A dot at the centre of a wire in a diagram means the current is",["flowing out of the paper","alternating","zero","flowing into the paper"],0,"The dot is the point of an approaching arrow, so the current comes out of the paper. A cross is the tail of a receding arrow.","Dot out, cross in.",0,2],["Magnetic field is denoted by",["H₀","M","F","B"],3,"B is the magnetic field, a vector field.","B for field.",0,2],["The direction of the magnetic field at a point is the direction",["of the electric force on a positive charge","in which the N pole of a compass needle tends to point","in which the S pole of a compass needle tends to point","of the current in the nearest wire"],1,"It is taken as the direction of the force on a magnetic north pole.","North pole shows B.",0,2],["The magnetic force on a charge q moving with velocity v in a field B is",["F = qE","F = qv/B","F = qv × B","F = qvB²"],2,"F = qv × B, with magnitude qvB sin θ.","F = q v cross B.",0,3],["The magnitude of the magnetic force on a moving charge is",["F = qB/v","F = qvB cos θ","F = qvB sin θ","F = qvB tan θ"],2,"θ is the angle between v and B.","Sine again.",0,3],["The magnetic force on a moving charge is always",["parallel to the field B","perpendicular to both v and B","opposite to the velocity v","parallel to the velocity v"],1,"F is perpendicular to the plane containing v and B.","Force at right angles.",0,3],["The magnetic force on a moving charge is zero when v and B are",["perpendicular to each other","at 45° to each other","at 60° to each other","parallel or antiparallel"],3,"sin 0° = sin 180° = 0, so there is no force.","Along the field, no force.",0,3],["The magnetic force on a moving charge is greatest when v and B are",["antiparallel to each other","at 30° to each other","parallel to each other","perpendicular to each other"],3,"sin 90° = 1, so F = qvB.","90° gives the maximum.",0,3],["For a negative charge, the magnetic force is",["equal to zero for any charge sign","opposite to the direction of v × B","along the direction of v","along the direction of v × B"],1,"For a positive charge, F is along v × B. For a negative charge it is reversed.","Negative reverses it.",0,3],["The SI unit of magnetic field B is the",["farad","henry","weber","tesla"],3,"The tesla (T) is also weber per square metre.","Tesla for B.",0,3],["One tesla is equal to",["one newton per coulomb","one volt per metre","one weber per square metre","one weber"],2,"1 T = 1 Wb/m² = 1 N/(A·m).","Tesla = Wb/m².",0,3],["The gauss is related to the tesla by",["1 G = 10⁴ T","1 G = 10⁻⁴ T","1 G = 1 T","1 G = 10⁻² T"],1,"The earth's field is of the order of 1 G, which is 10⁻⁴ T.","Gauss is tiny.",0,3],["The magnetic field of the earth is of the order of",["10² T","10⁻⁴ T (1 gauss)","10⁻¹⁰ T","1 T"],1,"The book gives about 10⁻⁴ T, which is 1 G.","Earth: one gauss.",0,3],["An instrument for measuring a magnetic field is a",["voltmeter (potentiometer)","ohmmeter (megger)","ammeter (galvanometer)","gaussmeter (magnetometer)"],3,"The gaussmeter or magnetometer measures B.","Gaussmeter for B.",0,3],["When both electric and magnetic fields act on a moving charge, the total force is",["F = q(E + v × B)","F = q(E − v × B)","F = qE × B","F = qvEB"],0,"This is called the Lorentz force. It is the vector sum of the electric and magnetic forces.","Lorentz force.",0,3],["The total force on a charge in both electric and magnetic fields is called the",["Ampere force","Faraday force","Coulomb force","Lorentz force"],3,"F = q(E + v × B) is the Lorentz force.","E plus v cross B: Lorentz.",0,3],["Outside a magnet, magnetic field lines point",["away from both poles","toward both poles","toward north poles and away from south poles","away from north poles and toward south poles"],3,"The arrowheads point away from the north poles and toward the south poles.","North out, south in.",0,4],["Magnetic field lines never intersect because",["the field is zero wherever they would meet","they carry no charge or any energy","the field direction at each point is unique","they repel each other at every crossing"],2,"At a crossing the field would have two directions, which is impossible.","One direction per point.",0,4],["The closer together magnetic field lines are, the",["smaller the flux","weaker the field","more uniform the field","stronger the field"],3,"Closer lines mean a larger field. Lines far apart mean a weaker field.","Close lines, strong field.",0,4],["In a uniform magnetic field, the lines are",["closed loops around every charge","curved and crowded toward one end","straight, parallel and equally spaced","circular and centred on a charge"],2,"That describes a uniform field.","Uniform: parallel lines.",0,4],["The magnetic flux through a loop of area A in a field B at angle θ to the normal is",["Φ_B = BA sin θ","Φ_B = B/A","Φ_B = BA cos θ","Φ_B = BA tan θ"],2,"θ is the angle between B and the area vector. Φ_B = ∫B·dA = BA cos θ.","Flux: cosine.",0,4],["The SI unit of magnetic flux is the",["tesla","gauss","ampere","weber"],3,"The weber (Wb) equals one tesla metre squared.","Weber for flux.",0,4],["One weber equals",["one newton per ampere","one tesla metre squared","one tesla","one tesla per metre"],1,"1 Wb = 1 T·m² = 1 N·m/A.","Wb = T·m².",0,4],["Magnetic flux is a",["unit of force","unit of field","scalar quantity","vector quantity"],2,"Φ_B is a scalar.","Flux is a scalar.",0,4],["Gauss's law for magnetism states that the total magnetic flux through any closed surface is",["equal to μ₀","equal to the enclosed current","always positive","always zero"],3,"∮B·dA = 0. Magnetic field lines have no beginning or end.","Closed surface, zero flux.",0,4],["Magnetic field B is sometimes called magnetic flux density because it is",["the force per unit charge in the field","the flux per unit area at right angles to B","the energy per unit volume of the field","the flux per unit length of the field line"],1,"B = dΦ_B/dA⊥.","B = flux per area.",0,4],["A charge moves at right angles to a uniform magnetic field. Its path is",["a circle at constant speed","a parabola","a straight line","a spiral with increasing speed"],0,"F and v are always perpendicular, so the force only changes the direction of motion.","Perpendicular force, circle.",0,5],["The radius of the circular path of a charge q of mass m and speed v in a field B is",["R = qB/mv","R = mv/qB","R = mB/qv","R = qvB/m"],1,"qvB = mv²/R gives R = mv/(qB) = p/(qB).","R = mv over qB.",0,5],["The magnetic force provides the",["gravitational force","frictional force","electric force","centripetal force"],3,"qvB = mv²/R.","Magnetic force centres the path.",0,5],["The angular velocity of a charge circling in a uniform magnetic field is",["ω = mB/q","ω = qB/m","ω = qm/B","ω = qBm"],1,"ω = v/R = qB/m.","Omega is qB over m.",0,5],["The cyclotron frequency is",["f = m/(2πqB)","f = 2πqB/m","f = qBm/2π","f = qB/(2πm)"],3,"f = ω/2π = qB/2πm.","f = qB/2πm.",0,5],["The cyclotron frequency of a charged particle in a magnetic field",["increases as the radius of the path increases","decreases as the speed of the particle rises","does not depend on the speed or radius of the path","is zero for every charged particle"],2,"It depends only on the charge-to-mass ratio and on B.","Not on speed or radius.",0,5],["The period of the circular orbit of a charge in a magnetic field is",["T = 2πm/qB","T = qB/2πm","T = m/qB","T = 2πqB/m"],0,"T = 1/f = 2πm/(qB).","T = 2πm over qB.",0,5],["The work done by the magnetic force on a moving charge is",["maximum","equal to qvB","negative","zero"],3,"The force is always perpendicular to the velocity, so the kinetic energy does not change.","Magnet does no work.",0,5],["A magnetic field changes the kinetic energy of a moving charged particle",["not at all","by doubling it","only if the charge is negative","by halving it"],0,"No work is done by the magnetic force, so the speed stays constant.","Direction changes, not speed.",0,5],["The force on a length l of straight wire carrying current I at right angles to a field B is",["F = BI/l","F = BIl²","F = B/Il","F = BIl"],3,"F = BIl. It is proportional to B, I and l.","F = B I l.",0,6],["The force on a current-carrying wire at an angle θ to the field is",["F = BIl sin θ","F = BIl tan θ","F = BIl/sin θ","F = BIl cos θ"],0,"θ is the angle between the wire (current) and the field.","Sine for angle.",0,6],["The magnetic force on a current-carrying wire is greatest when the wire is",["at 30° to the field direction","at right angles to the field","outside the region of the field","parallel to the field direction"],1,"sin 90° = 1.","Right angles, maximum.",0,6],["The force on a wire parallel to the magnetic field is",["maximum","negative","BIl","zero"],3,"sin 0° = 0.","Parallel, no force.",0,6],["Fleming's left-hand rule is used to find the direction of",["the force (thrust) on a current-carrying conductor","the electric field around a charged body","the magnetic flux through a coil of wire","the induced current in a moving conductor"],0,"It is also called the motor rule.","Left hand = motor.",0,6],["In Fleming's left-hand rule, the first finger points in the direction of the",["current","force","field","velocity"],2,"First finger = field, second finger = current, thumb = thrust.","F-B-I: first, B; second, I.",0,6],["In Fleming's left-hand rule, the second finger points in the direction of the",["current","field","flux","force"],0,"The thumb gives the thrust or force.","Second finger = current.",0,6],["In Fleming's left-hand rule, the thumb points in the direction of the",["force (thrust)","current","field","charge"],0,"The thumb predicts the direction of the force.","Thumb = thrust.",0,6],["The magnetic field B can be defined as the magnetic force per",["unit area of the wire facing the field","unit mass of the wire in the field","unit current length, at right angles to the field","unit charge at rest in the given field"],2,"B = F/Il.","B = F over Il.",0,6],["The loudspeaker and the electric motor both work by",["magnetic forces on conductors carrying current","heating of wires carrying a steady current","gravitational forces acting on the moving coil","electric forces on charges that are at rest"],0,"They both depend on magnetic forces on currents.","Speaker and motor: F = BIl.",0,6],["The net force on a current loop in a uniform magnetic field is",["maximum, with no torque at all","zero, with no torque at all","zero, but there is a net torque","equal to BIA, with no torque"],2,"The forces on opposite sides cancel, but they act at different points and give a torque.","Force zero, torque not.",0,7],["The torque on a current loop of area A is",["τ = BI/A","τ = BIA cos θ","τ = BIA tan θ","τ = BIA sin θ"],3,"θ is the angle between the field and the normal to the loop.","Torque: BIA sin θ.",0,7],["For a coil with N turns, the torque is",["τ = NBIA sin θ","τ = N + BIA","τ = BIA/N","τ = NBI/A"],0,"Each of the N turns adds its own torque.","Multiply by N.",0,7],["The torque on a current loop is greatest when",["the current is zero","the normal to the loop is parallel to the field","the loop is outside the field","the plane of the loop is parallel to the field"],3,"Then the normal is perpendicular to B and sin θ = 1.","Plane along B, max torque.",0,7],["The torque on a current loop is zero when the normal to the loop is",["perpendicular to the field direction","parallel or antiparallel to the field","at 60° to the direction of the field","at 45° to the direction of the field"],1,"θ = 0° or 180° gives sin θ = 0.","Normal along B, no torque.",0,7],["For a current loop in a magnetic field, the stable equilibrium position is when θ is",["180°","45°","0°","90°"],2,"At θ = 0° a small rotation produces a torque that turns the loop back.","0° stable.",0,7],["For a current loop in a magnetic field, the unstable equilibrium position is when θ is",["0°","270° only","90°","180°"],3,"At 180° the torque is zero, but any small rotation increases the angle further.","180° unstable.",0,7],["The magnetic dipole moment of a coil has magnitude",["μ = NIA","μ = IA/N","μ = NBIA","μ = NI/A"],0,"μ = NIA, with unit A·m².","μ = N I A.",0,7],["The torque on a magnetic dipole in a field is",["τ = μ/B","τ = μ + B","τ = μB sin θ","τ = μB cos θ"],2,"In vector form τ = μ × B.","Torque: μB sine.",0,7],["The direction of the magnetic moment of a current loop is",["along the wire carrying the current","perpendicular to the plane of the loop","lying in the plane of the loop itself","opposite to the current in the loop"],1,"By the right-hand rule, μ is perpendicular to the loop's plane.","Moment is the normal.",0,7],["The torque on a current loop tends to rotate it so that its axis becomes",["random","perpendicular to the magnetic field","parallel to the magnetic field","at 45° to the field"],2,"The torque turns the loop toward the position where μ is along B.","Loop turns to align.",0,7],["A proton (1.6 × 10⁻¹⁹ C) moves at 3.0 × 10⁵ m/s at 30° to a 2.0 T field. The magnetic force is",["4.8 × 10⁻¹⁴ N","8.3 × 10⁻¹⁴ N","9.6 × 10⁻¹⁴ N","4.8 × 10⁻¹⁹ N"],0,"F = qvB sin θ = (1.6 × 10⁻¹⁹)(3.0 × 10⁵)(2.0)(sin 30°) = 4.8 × 10⁻¹⁴ N.","sin 30° = 0.5.",0,8],["A beam of electrons moves in the same way as the proton beam in that example. The magnitude of the force is",["double, and in the same direction","zero, since electrons are negative","the same, but the direction is reversed","the same, and in the same direction"],2,"The electron charge has the same size and opposite sign, so the force has the same magnitude and opposite direction.","Opposite charge, opposite force.",0,8],["A straight wire 3.5 cm long carries 5 A at right angles to a 0.2 T field. The force is",["0.35 N","0.035 N","0.0035 N","3.5 N"],1,"F = BIl = 0.2 × 5 × 0.035 = 0.035 N.","Change cm to m.",0,8],["A galvanometer coil of 2 cm² and 100 turns carries 1 mA in a radial field of 0.2 T. The torque is",["2.0 × 10⁻⁶ N·m","4.0 × 10⁻⁹ N·m","4.0 × 10⁻⁴ N·m","4.0 × 10⁻⁶ N·m"],3,"τ = NBIA = 100 × 0.2 × 1 × 10⁻³ × 2 × 10⁻⁴ = 4.0 × 10⁻⁶ N·m.","Convert cm² to m².",0,8],["A circular coil of radius 0.0500 m has 30 turns and carries 5.00 A. The magnetic moment is",["1.18 A·m²","0.118 A·m²","5.89 A·m²","11.8 A·m²"],0,"μ = NIA = 30 × 5.00 × π × (0.0500)² = 1.18 A·m².","A = πr².",0,8],["The coil in that example sits in a 1.20 T field with μ at 90° to B. The torque is",["0.98 N·m","1.41 N·m","14.1 N·m","1.18 N·m"],1,"τ = μB sin 90° = 1.18 × 1.20 = 1.41 N·m.","Torque: μB.",0,8],["Electrons in a microwave oven magnetron circulate at 2450 MHz. The field needed is about",["0.877 T","0.0877 T","0.0177 T","8.77 × 10⁻⁴ T"],1,"B = 2πmf/q = 2π(9.11 × 10⁻³¹)(2450 × 10⁶) ÷ (1.6 × 10⁻¹⁹) = 0.0877 T.","B = 2πmf over q.",0,8],["Tutorial 8.4: A proton (1.6 × 10⁻¹⁹ C) moves at 23° to a 26 mT magnetic field and feels a force of 6.50 × 10⁻¹⁷ N. Its speed is about",["4.0 × 10⁴ m/s","1.6 × 10⁴ m/s","1.0 × 10⁷ m/s","1.6 × 10⁵ m/s"],0,"v = F/(qB sinθ) = 6.50 × 10⁻¹⁷ ÷ [(1.6 × 10⁻¹⁹)(0.026)(sin 23°)] = 4.0 × 10⁴ m/s.","v = F ÷ (qB sinθ). Convert mT to T.",0,9],["Tutorial 8.6: A magnetron emits waves at 2540 MHz. The magnetic field needed for electrons to circle at this frequency is about",["0.571 T","0.0143 T","0.0909 T","9.09 T"],2,"f = qB/2πm, so B = 2πfm/q = 2π(2.54 × 10⁹)(9.11 × 10⁻³¹) ÷ (1.6 × 10⁻¹⁹) = 0.0909 T.","B = 2πfm/q.",0,9],["Tutorial 8.7: An electron feels a magnetic force of 4.60 × 10⁻¹⁵ N when moving at 40.0° to a field of 3.50 × 10⁻³ T. Its speed is about",["1.64 × 10⁷ m/s","8.2 × 10⁶ m/s","1.28 × 10⁷ m/s","2.9 × 10⁷ m/s"],2,"v = F/(eB sinθ) = 4.60 × 10⁻¹⁵ ÷ [(1.6 × 10⁻¹⁹)(3.50 × 10⁻³)(sin 40°)] = 1.28 × 10⁷ m/s.","Same formula: F ÷ (qB sinθ).",0,9],["Tutorial 8.8: Electrons in a magnetron move at 3.7 × 10⁷ m/s in a uniform 2.0 T field. The radius of their orbit is about",["1.05 × 10⁻² m","1.05 × 10⁻⁴ m","5.3 × 10⁻⁵ m","2.1 × 10⁻⁴ m"],1,"r = mv/(eB) = (9.11 × 10⁻³¹)(3.7 × 10⁷) ÷ [(1.6 × 10⁻¹⁹)(2.0)] = 1.05 × 10⁻⁴ m.","r = mv ÷ (eB).",0,9],["Tutorial 8.9: A physicist wants radiation of frequency 2.00 THz from a magnetron. The magnetic field required is about",["11.4 T","0.716 T","71.6 T","450 T"],2,"B = 2πfm/e = 2π(2.00 × 10¹²)(9.11 × 10⁻³¹) ÷ (1.6 × 10⁻¹⁹) = 71.6 T.","2π f m ÷ e. THz means 10¹².",0,9]]},{"t":"Electromagnetic Induction","s":["Induced E.M.F.","Experiment on Induction","Faraday's Laws","Lenz's Law and Motional E.M.F.","A.C. and D.C. Generators","The Transformer","Biot-Savart Law","Ampere's Law","Worked Examples","Tutorial"],"q":[["Electromagnetic induction is the production of current or voltage whenever there is",["a stationary charge in a steady electric field","relative motion between a conductor and a magnetic field","a static magnet placed near an insulator","a steady current flowing in a long straight wire"],1,"Relative motion between the conductor and the magnet induces an e.m.f. in the circuit.","Induction needs relative motion.",0,0],["The induced e.m.f. increases with",["the colour and mass of the magnet used","the length of the connecting wires alone","speed of motion, number of turns and magnet strength","the resistance of the coil and the wire length"],2,"The book lists speed of the conductor or magnet, number of turns on the coil and strength of the magnet.","Faster, more turns, stronger magnet.",0,0],["The induced e.m.f. of a conductor moving at right angles to a field is",["ε = Blv","ε = B/lv","ε = Bl/v","ε = Bv/l"],0,"B, v and the conductor are all perpendicular to one another.","ε = B l v.",0,0],["The magnetic flux can be changed by changing",["only the wire length","B, A or θ","only B","only the resistance"],1,"Φ = BA cos θ, so the flux changes if B, the area A or the angle θ changes.","Change B, A or the angle.",0,0],["Which of these is a method of producing induced e.m.f.?",["Painting the coil","Changing the area of the coil","Increasing the coil's mass","Heating the coil to a high temperature"],1,"The three methods are changing B, changing the area (shrinking or stretching the coil), and changing the angle between B and the normal.","B, A, θ.",0,0],["A magnet is pushed into a solenoid connected to a galvanometer. The galvanometer",["burns out","shows no deflection","deflects","reads zero throughout"],2,"A deflection shows an induced current flowing while the magnet moves.","Moving magnet, deflection.",0,1],["When the magnet is held stationary inside the coil, the galvanometer shows",["a reversed deflection","a steady large deflection","a deflection that grows","no deflection"],3,"With no relative motion there is no induced current.","No motion, no current.",0,1],["When the magnet is withdrawn from the coil, the galvanometer deflects",["twice as far","not at all","in the same direction","in the opposite direction"],3,"A reverse current develops. The direction depends on the polarity and movement of the magnet.","Out reverses in.",0,1],["The current produced by relative motion of a magnet and coil is called",["a direct current","a leakage current","an induced current","a conventional current"],2,"It is called an induced current.","Induced by motion.",0,1],["The size of the induced current can be increased by",["using fewer turns","moving the magnet faster","keeping the magnet still","moving the magnet slower"],1,"A faster relative motion, a stronger magnet and more turns all give a larger induced current.","Faster gives more.",0,1],["Faraday's first law states that an e.m.f. is induced whenever",["the current in a long wire is steady","a magnet is placed near a wire","the magnetic flux linking a circuit changes","the resistance of the coil is changed"],2,"When the magnetic flux linking a circuit changes, an e.m.f. is induced in the circuit.","Flux changes, e.m.f.",0,2],["Faraday's second law states that the induced e.m.f. is proportional to",["the magnetic flux itself linking the circuit","the resistance of the circuit in ohms","the rate of change of flux linking the circuit","the length of the wire in the circuit"],2,"The magnitude depends on how fast the flux changes.","Rate of change matters.",0,2],["For a coil of N turns, the flux linkage is",["BA/N","NBA","N/BA","N + BA"],1,"Flux Φ = BA, so the flux linkage is NBA.","N times flux.",0,2],["The induced e.m.f. in a coil of N turns is",["ε = N Φ Δt","ε = −Δt/NΔΦ","ε = −N ΔΦ/Δt","ε = +N Φ/Δt"],2,"The negative sign shows that the induced e.m.f. opposes the change of flux.","N times rate of flux.",0,2],["Doubling the rate of change of flux through a coil makes the induced e.m.f.",["four times","halve","double","stay the same"],2,"ε is proportional to ΔΦ/Δt.","Double rate, double ε.",0,2],["Lenz's law states that an induced e.m.f. acts in a direction so as to",["oppose the motion or change producing it","act at right angles to the change","help the motion or change producing it","double the motion or change producing it"],0,"The induced e.m.f. flows in a direction that opposes the motion producing it.","Induced effect opposes cause.",0,3],["The minus sign in Faraday's law is a consequence of",["Ampere's law","Coulomb's law","Ohm's law","Lenz's law"],3,"The negative sign shows that the induced e.m.f. opposes the change of flux.","Minus sign is Lenz.",0,3],["In the right-hand rule for induced current, the thumb points in the direction of",["induced current","motion","force on the field","field"],1,"Thumb = motion, first finger = field, middle finger = induced current.","Thumb is motion.",0,3],["In the right-hand rule for induced current, the middle finger gives the direction of",["the field","the force","the induced current","the motion"],2,"The first finger points along the field and the middle finger along the induced current.","Middle finger = current.",0,3],["The induced e.m.f. in a straight conductor is greatest when it moves",["very slowly through the field","at right angles to the field lines","parallel to the field lines","at 30° to the field lines"],1,"It is maximum at right angles and zero when the conductor moves parallel to the field lines.","Cut the lines at 90°.",0,3],["The induced e.m.f. in a conductor moving parallel to the field lines is",["zero","infinite","maximum","Blv"],0,"No field lines are cut, so no e.m.f. is induced.","Parallel, nothing cut.",0,3],["A generator is a device that transforms",["chemical energy into heat","mechanical energy into electrical energy","heat into light","electrical energy into mechanical energy"],1,"The a.c. generator or dynamo converts mechanical energy into electrical energy.","Generator: motion to electricity.",0,4],["The three main parts of a simple a.c. generator are",["a battery, a coil and a switch","a magnet, an armature and two slip rings","a magnet, a commutator and a capacitor","a transformer, a core and a fuse"],1,"The armature has several turns of wire on a soft iron core. Carbon brushes rest on the slip rings.","Magnet, armature, slip rings.",0,4],["The carbon brushes in an a.c. generator",["wind the armature round the iron core","store charge for the external circuit","produce the magnetic field for the coil","carry current from the slip rings outward"],3,"The brushes rest on the slip rings and carry current away.","Brushes pick up the current.",0,4],["An a.c. generator operates on",["Fleming's left-hand rule","Ohm's law","Coulomb's law","Fleming's right-hand rule"],3,"The generator uses the right-hand rule for induced current.","Generator: right hand.",0,4],["When the coil of an a.c. generator is in the horizontal position, the induced e.m.f. is",["maximum","constant at 1 V","zero","half the maximum"],0,"No lines of force link the coil, but the rate of change of flux is maximum.","Flat coil, max e.m.f.",0,4],["When the coil of an a.c. generator is in the vertical position, the induced e.m.f. is",["zero","half of maximum","negative maximum","maximum"],0,"The flux linking the coil is maximum, but the rate of change of flux is zero.","Vertical, zero e.m.f.",0,4],["To change an a.c. generator into a d.c. generator, the slip rings are replaced by",["carbon brushes","two more slip rings","a soft iron core","a split ring commutator"],3,"A split ring commutator makes the induced current flow in one direction only.","Commutator gives d.c.",0,4],["A d.c. generator gives a steadier e.m.f. when the armature has",["one large coil with many more turns","many coils at equal angles to one another","a single slip ring and one coil","no iron core and a single slip ring"],1,"Many coils and a commutator with many segments give a steadier d.c.","More coils, steadier.",0,4],["Which of these will NOT increase the output of a simple generator?",["Rotating the coil faster","Winding the coil on a soft iron core","Using a stronger magnet","Reducing the number of turns"],3,"Output rises with more turns, stronger field, a soft iron core and faster rotation.","More turns, not fewer.",0,4],["The maximum induced e.m.f. of a rotating coil is",["E_max = NABω","E_max = NAB/ω","E_max = Bω/NA","E_max = NA/Bω"],0,"Here ω = 2πf is the angular speed of rotation.","N A B omega.",0,4],["The induced e.m.f. of a rotating coil varies with time as",["E = E_max cos t","E = E_max sin ωt","E = E_max/ωt","E = E_max ωt"],1,"The e.m.f. follows a sine wave.","Sine in time.",0,4],["If a d.c. dynamo has current passed through it, it becomes",["a capacitor","a rectifier","an electric motor","a transformer"],2,"The construction is the same. In a motor the current turns the coil, while in a dynamo the coil is turned to produce current.","Same build, reverse job.",0,4],["A transformer is a device used to",["increase or decrease an alternating voltage","change current into heat","store charge","increase or decrease a direct voltage"],0,"It steps up or steps down an alternating voltage.","Transformer changes a.c. voltage.",0,5],["The three main parts of a transformer are",["two capacitors, a laminated core and a fuse","a primary coil, a secondary coil and a laminated iron core","a magnet, two slip rings and carbon brushes","a battery, a switch, a bulb and a coil"],1,"Both coils are wound on the soft iron laminated core.","Primary, secondary, core.",0,5],["In a step-up transformer, the secondary coil has",["the same turns as the primary coil","fewer turns than the primary coil","no turns","more turns than the primary coil"],3,"More secondary turns give a higher output voltage.","Step up: more secondary turns.",0,5],["In a step-down transformer, the primary coil has",["more turns than the secondary coil","the same turns as the secondary coil","fewer turns than the secondary coil","a core of air"],0,"The primary has more turns, so the output voltage is lower.","Step down: fewer secondary turns.",0,5],["For a transformer, the secondary e.m.f. divided by the primary e.m.f. equals",["N_p / N_s","N_s / N_p","I_s / I_p","N_s × N_p"],1,"E_s/E_p = N_s/N_p.","Secondary over primary.",0,5],["For an ideal transformer (no energy loss), the power into the primary equals",["the power out of the secondary, V_pI_p = V_sI_s","half the power out of the secondary","zero because of flux leakage alone","twice the power out of the secondary"],0,"With no loss, the input power equals the output power.","Power in = power out.",0,5],["The efficiency of a transformer is",["output voltage ÷ input voltage","output power × input power","(output power ÷ input power) × 100%","(input power ÷ output power) × 100%"],2,"Efficiency = power in the secondary ÷ power in the primary × 100%.","Out over in.",0,5],["Heat losses in a transformer can be reduced by using",["a solid iron core","wire of high resistance","a thicker air gap","wire of low resistance"],3,"Heat loss comes from wire of high resistance in the coils.","Low resistance wire.",0,5],["Flux leakage in a transformer can be reduced by",["using a lighter wire","laminating the core","using a larger primary current","designing an efficient core"],3,"Flux leakage occurs when not all of the flux from the primary passes to the secondary.","Better core design.",0,5],["Eddy current losses in a transformer are reduced by",["removing the secondary coil","laminating the iron core","increasing the voltage","using a solid iron core"],1,"Eddy currents are caused by magnetic flux variation in the core. Laminating the core cuts them down.","Eddy: laminate.",0,5],["Hysteresis loss in a transformer comes from",["reversing the magnetisation of the core","the resistance of the copper wire used","flux that leaks out of the iron core","circulating eddy currents in the core"],0,"It is reduced by using soft iron cores.","Hysteresis: magnetisation reversals.",0,5],["The efficiency of a real transformer is less than 100% because of",["heat, flux leakage, eddy current and hysteresis losses","the core being made of iron rather than air","the voltage being alternating and not steady","heat and sound losses in the secondary only"],0,"These four losses mean the output power is less than the input power.","Four losses.",0,5],["The Biot-Savart law gives the magnetic field produced by",["a changing electric field only","a current-carrying element","a stationary charge","a magnet at rest only"],1,"It gives the field dB at a point due to a steady current in a small element dl.","Field of a current element.",0,6],["In the Biot-Savart law, μ₀ is the",["permittivity of free space","magnetic flux","permeability of free space","charge density"],2,"dB = (μ₀/4π) I dl sin θ / r², where μ₀ is the permeability of free space.","μ₀ is permeability.",0,6],["According to the Biot-Savart law, the field dB falls with distance r from the element as",["1/r²","1/r","r","1/r³"],0,"dB = (μ₀/4π) I dl sin θ / r².","Inverse square again.",0,6],["The magnetic field at the centre of a circular loop of radius R carrying current I is",["B = 2μ₀I / R","B = μ₀I / 4πR","B = μ₀I R / 2","B = μ₀I / 2R"],3,"The book gives B = μ₀I/2R at the centre of the loop.","Loop: μ₀I over 2R.",0,6],["The magnetic field at a distance r from a long straight wire carrying current I is",["B = μ₀I / 2r","B = μ₀ / 2πIr","B = μ₀I r / 2π","B = μ₀I / 2πr"],3,"B = (μ₀/2π)(I/r).","Straight wire: 1/r.",0,6],["The magnetic field inside an ideal solenoid of N turns and length L is",["B = μ₀NI / L","B = μ₀L / NI","B = NI / μ₀L","B = μ₀N / IL"],0,"The field depends on the turns per unit length.","Solenoid: μ₀ times turns per metre times I.",0,6],["The magnetic field at the centre of a semicircular wire of radius R carrying current I is",["B = μ₀I / 8R","B = μ₀I / πR","B = μ₀I / 2R","B = μ₀I / 4R"],3,"A semicircle gives half the field of a full loop, so B = μ₀I/4R.","Half of the loop.",0,6],["Ampere's law relates the magnetic field around a closed loop to",["the electric charge lying on the loop","the surface area enclosed by the loop","the electric current passing through the loop","the electrical resistance around the loop"],2,"It relates the integrated magnetic field around a closed loop to the current through the loop.","Loop of B, current inside.",0,7],["The magnetic field created by an electric current is proportional to",["the resistance of the wire, with ε₀ as constant","the size of the current, with μ₀ as constant","the charge at rest, with μ₀ as constant","the length of the wire, with ε₀ as constant"],1,"That is the statement of Ampere's law in the book.","B follows I.",0,7],["In the book's list, Ampere's law is described as",["the final Maxwell's equation","a form of Ohm's law","an unrelated law","the first Maxwell's equation"],0,"The book calls it the final Maxwell's equation.","Ampere is the last of Maxwell.",0,7],["A coil of 10 turns and area 5 cm² is at right angles to a flux density of 2 × 10⁻² T. The flux linkage is",["1 × 10⁻⁵ Wb","1 × 10⁻⁷ Wb","1 × 10⁻⁴ Wb","1 × 10⁻³ Wb"],2,"NBA = 10 × 2 × 10⁻² × 5 × 10⁻⁴ = 1 × 10⁻⁴ Wb.","Convert cm² to m².",0,8],["The flux linkage of that coil falls to zero in 10 s. The induced e.m.f. is",["1 × 10⁻² V","1 × 10⁻³ V","1 × 10⁻⁵ V","1 × 10⁻⁴ V"],2,"ε = ΔΦ/Δt = 1 × 10⁻⁴ ÷ 10 = 1 × 10⁻⁵ V.","Change over time.",0,8],["A transformer on a 120 V line has 200 turns in the primary and 50 turns in the secondary. The secondary voltage is",["30 V","480 V","7.5 V","120 V"],0,"V_s = (N_s/N_p)V_p = (50/200) × 120 = 30 V.","Secondary over primary.",0,8],["The 30 V secondary of that transformer drives a 100 Ω bulb. The secondary current is",["3 A","30 A","0.3 A","0.03 A"],2,"I = V/R = 30 ÷ 100 = 0.3 A.","Ohm's law.",0,8],["In that transformer the primary current is",["0.6 A","1.2 A","0.3 A","0.075 A"],3,"I_p = (N_s/N_p)I_s = (50/200) × 0.3 = 0.075 A. Check: 120 × 0.075 = 9 W = 30 × 0.3 W.","Power in = power out.",0,8],["A semicircular wire of radius 0.20 m carries 150 A. The field at its centre is about",["4.7 × 10⁻⁴ T","2.4 × 10⁻⁴ T","9.4 × 10⁻⁴ T","2.4 × 10⁻⁶ T"],1,"B = μ₀I/4R = (4π × 10⁻⁷)(150) ÷ (4 × 0.20) = 2.4 × 10⁻⁴ T.","Semicircle: μ₀I over 4R.",0,8],["An inductor of resistance 20 Ω is connected to a 12 V battery. The final current is",["1.7 A","12 A","240 A","0.6 A"],3,"When the current stops changing, dI/dt = 0 and I = E/R = 12 ÷ 20 = 0.6 A.","Final I = E/R.",0,8],["When the battery is first connected to the inductor, the current is zero and the induced e.m.f. equals",["twice the battery e.m.f.","zero","IR","the battery e.m.f."],3,"At t = 0, I = 0, so E − L dI/dt = 0. The induced e.m.f. cancels the battery.","Start: back e.m.f. equals E.",0,8],["As the current in the inductor circuit grows, its rate of change dI/dt",["stays constant","becomes negative at once","decreases","increases"],2,"dI/dt = (E − IR)/L, which gets smaller as I rises.","Growth slows.",0,8],["Tutorial 9.1: The primary coil of a transformer has 1000 turns and 240 V a.c. The secondary has 500 turns. The e.m.f. in the secondary is",["120 V","480 V","240 V","60 V"],0,"Vs/Vp = Ns/Np, so Vs = 240 × 500/1000 = 120 V.","Half the turns, half the voltage.",0,9],["Tutorial 9.3: 240 V a.c. is applied to the primary of a transformer and 60 V is wanted from the secondary. The ratio of secondary turns to primary turns is",["1/4","1/16","1/2","4"],0,"Ns/Np = Vs/Vp = 60/240 = 1/4.","Turns ratio equals voltage ratio.",0,9],["Tutorial 9.8: How much energy is stored in a 250 mH coil carrying a current of 0.02 A?",["2.5 × 10⁻³ J","5.0 × 10⁻³ J","5.0 × 10⁻⁵ J","1.0 × 10⁻⁴ J"],2,"U = ½LI² = ½ (0.250)(0.02)² = 5.0 × 10⁻⁵ J.","½LI². Square the current only.",0,9]]},{"t":"Inductance: Self-Inductance and Mutual Inductance","s":["Introduction to Inductance","Unit of Inductance","Self-Inductance of a Coil","Energy and Mechanical Equivalent","Mutual Inductance","Coaxial Solenoids and Coupling","Applications of Mutual Inductance","Worked Examples","Tutorial"],"q":[["Inductance is the property of an inductor to",["produce an opposing voltage when the current changes","store electric charge between two plates","produce a steady voltage from a steady current","resist only a steady direct current"],0,"The induced voltage opposes the change in the flow of current.","Inductance opposes change.",0,0],["An inductor stores energy in",["the electric field between its two plates","the magnetic field created by the current","the rise in temperature of the wire","the resistance of its copper wire"],1,"Inductance is the ability to store energy in the magnetic field created by the current flow.","Inductor: magnetic field.",0,0],["The opposing voltage generated by an inductor is proportional to",["the size of a steady current","the resistance of the circuit","the temperature of the coil","the rate of change of current"],3,"The opposing voltage is proportional to the rate of change in current.","Fast change, big voltage.",0,0],["Coils of wire are used as inductors because they",["lower the voltage across the circuit","reduce the strength of the magnetic field","increase the coupling of the magnetic field","stop the current from reaching the load"],2,"Coils increase the coupling of the magnetic field and so increase the effect.","Coils concentrate the field.",0,0],["Electronic components that use inductance include",["resistors, diodes and switches","coils, chokes and transformers","batteries, bulbs and fuses","capacitors, switches and fuses"],1,"The book names coils, inductors, chokes and transformers.","Coils, chokes, transformers.",0,0],["When an e.m.f. is induced in the same circuit by its own changing current, this is called",["polarization","mutual induction","conduction","self-induction"],3,"Induction in the same circuit is self-induction (L).","Same circuit: self.",0,0],["When the e.m.f. is induced in an adjacent circuit, it is called",["self-induction","electrolysis","thermal induction","mutual induction"],3,"Current changing in one coil induces an e.m.f. in a neighbouring coil. This is mutual induction (M).","Neighbour circuit: mutual.",0,0],["The SI unit of inductance is the",["henry","tesla","weber","farad"],0,"The henry (H) is named after Joseph Henry.","Henry for inductance.",0,1],["The unit of inductance, the henry, is named after",["Michael Faraday, an English physicist","James Maxwell, a Scottish physicist","Heinrich Lenz, a German physicist","Joseph Henry, an American physicist"],3,"The book says Joseph Henry, an American physicist, first discovered self-inductance in a single electric circuit.","Henry was American.",0,1],["Joseph Henry is credited with first discovering",["mutual inductance between two transformer coils","electromagnetic waves in free space","the charge carried by the electron","self-inductance in a single electric circuit"],3,"He first discovered self-inductance in a single circuit.","Henry: self-inductance.",0,1],["One henry is equal to one",["weber per volt","ampere per weber","weber per ampere","volt per coulomb"],2,"1 H = 1 Wb/A.","H = Wb/A.",0,1],["A coil has an inductance of one henry when a current changing at",["one coulomb per second induces one joule","one ampere per volt induces one second","one volt per second induces one ampere in it","one ampere per second induces one volt in it"],3,"That is the definition of one henry.","1 A/s gives 1 V.",0,1],["The induced voltage across an inductor is",["V_L = L di/dt","V_L = L/(di/dt)","V_L = i/L","V_L = L i²"],0,"The induced voltage equals L times the rate of change of current.","V = L di/dt.",0,1],["Self-inductance is the property of a coil that",["opposes the change of current flowing through it","removes the resistance of its own wire","opposes only a steady direct current in it","doubles any current flowing through it"],0,"It is due mainly to the self-induced e.m.f. in the coil.","Opposes change.",0,2],["Self-inductance acts only when the current is",["steady","direct and constant","changing","zero for ever"],2,"The property exists only for a changing current such as alternating current, not for a steady direct current.","Steady current, no effect.",0,2],["The self-induced e.m.f. in a coil resists the",["fall of the current only","rise and the fall of current","rise of the current only","steady current only, not changes"],1,"It resists the rise of current when current increases and resists the fall when current decreases.","Opposes growth and decay.",0,2],["When the current in a coil is increasing, the induced e.m.f. acts",["at right angles to the applied voltage","in the same direction as the applied voltage","with no direction","opposite to the applied voltage"],3,"The induced e.m.f. opposes the applied voltage when the current is increasing.","Rising current, opposing e.m.f.",0,2],["When the current in a coil is falling, the induced e.m.f. acts",["opposite to the applied voltage","in the same direction as the applied voltage","at right angles to the applied voltage","with zero size"],1,"It tries to keep the current going, so it acts in the same direction as the applied voltage.","Falling current, helping e.m.f.",0,2],["The self-inductance of a coil, from Faraday's law, is",["L = N dI/dΦ","L = N Φ I","L = N dΦ/dI","L = dΦ/N dI"],2,"The induced voltage V_L = −N dΦ/dt and V_L = −L dI/dt, giving L = N dΦ/dI.","L is N times flux per amp.",0,2],["The self-inductance of an air-cored solenoid of N turns, area A and length l is",["L = μ₀N²A / l","L = μ₀NA / l","L = μ₀N²l / A","L = N²A / μ₀l"],0,"L = μ₀N²A/l.","N squared!",0,2],["The inductance of a coil is proportional to",["the inverse of the turns","the cube of the number of turns","the number of turns","the square of the number of turns"],3,"L = μ₀N²A/l, so doubling N gives four times the inductance.","Turns squared.",0,2],["A coil with many turns compared with one with few turns has",["a lower inductance","a higher inductance","no inductance","the same inductance"],1,"Many turns give more flux linkage for a given current.","More turns, more L.",0,2],["Inductance can be increased by",["using a thinner former and a shorter core","removing the coil from around the core","reducing the number of turns in the coil","increasing the coil diameter or making the core longer"],3,"More wire is needed, so more lines of force are produced to give the required back e.m.f.","Bigger coil, more L.",0,2],["Winding a coil on a soft iron core, compared with an air core, makes the inductance",["zero","much smaller","much greater","the same"],2,"The ferromagnetic material concentrates the lines of force, so the flux is much stronger for the same current.","Iron core boosts L.",0,2],["A core with a relative permeability 1000 times that of free space makes the inductance",["100 times greater","unchanged","1000 times greater","1000 times smaller"],2,"The inductance rises in proportion to the permeability of the core.","L follows permeability.",0,2],["Examples of ferromagnetic core materials in the book include",["zinc, tin and magnesium","soft iron, cobalt and nickel","copper, silver and aluminium","glass, rubber and plastic"],1,"Ferromagnetic materials concentrate the lines of force.","Iron, cobalt, nickel.",0,2],["With a ferromagnetic core, the core's flux may quickly reach saturation. This makes the inductance",["constant and independent of the current","zero when the core is saturated","n
