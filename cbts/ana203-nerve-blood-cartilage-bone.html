ed to unmyelinated fibers."}, {"s": "Unmyelinated axons conduct impulses faster than myelinated axons.", "a": false, "e": "Myelinated axons conduct impulses FASTER than unmyelinated ones."}, {"s": "Nissl bodies within the neuronal cell body represent clusters of rough endoplasmic reticulum.", "a": true, "e": "Correct \u2014 Nissl bodies reflect the high protein synthesis activity of neurons."}, {"s": "Axon terminals, also called synaptic knobs, release neurotransmitters to communicate with other cells.", "a": true, "e": "Correct \u2014 this is where neurotransmitter release occurs at the synapse."}, {"s": "A synapse is the junction where a neuron communicates with another neuron or effector cell.", "a": true, "e": "Correct \u2014 this is the standard definition of a synapse."}, {"s": "Unipolar (pseudounipolar) neurons have a single process that splits into two branches.", "a": true, "e": "Correct \u2014 this is characteristic of most sensory neurons."}, {"s": "Unipolar neurons are typically found as sensory neurons in the dorsal root ganglia.", "a": true, "e": "Correct \u2014 a classic location for pseudounipolar neurons."}, {"s": "Bipolar neurons have two processes: one axon and one dendrite.", "a": true, "e": "Correct \u2014 this defines bipolar neuron structure."}, {"s": "Bipolar neurons are found in specialized sensory locations such as the retina and olfactory epithelium.", "a": true, "e": "Correct \u2014 these are classic bipolar neuron locations."}, {"s": "Multipolar neurons have many dendrites and a single axon.", "a": true, "e": "Correct \u2014 this defines multipolar neuron structure."}, {"s": "Multipolar neurons are the most common neuron type in the body.", "a": true, "e": "Correct \u2014 most CNS neurons, including motor neurons, are multipolar."}, {"s": "Motor neurons are typically classified as multipolar neurons.", "a": true, "e": "Correct \u2014 motor neurons have the classic multipolar structure."}, {"s": "Astrocytes are a type of neuroglia found in the central nervous system (CNS).", "a": true, "e": "Correct \u2014 astrocytes are CNS-specific glial cells."}, {"s": "Astrocytes help form and maintain the blood-brain barrier.", "a": true, "e": "Correct \u2014 this is one of astrocytes' key functions."}, {"s": "Astrocytes regulate the chemical environment around neurons, including ion and nutrient balance.", "a": true, "e": "Correct \u2014 this supportive/regulatory role is central to astrocyte function."}, {"s": "Oligodendrocytes are the myelinating glial cells of the central nervous system.", "a": true, "e": "Correct \u2014 oligodendrocytes myelinate CNS axons."}, {"s": "A single oligodendrocyte can myelinate segments of multiple different axons.", "a": true, "e": "Correct \u2014 this distinguishes oligodendrocytes from Schwann cells."}, {"s": "Schwann cells are the myelinating glial cells of the peripheral nervous system (PNS).", "a": true, "e": "Correct \u2014 Schwann cells myelinate PNS axons."}, {"s": "A single Schwann cell myelinates only one segment of a single axon.", "a": true, "e": "Correct \u2014 this one-to-one relationship distinguishes Schwann cells from oligodendrocytes."}, {"s": "Microglia are the resident immune cells of the central nervous system.", "a": true, "e": "Correct \u2014 microglia perform immune surveillance and phagocytosis in the CNS."}, {"s": "Microglia are derived from the same lineage as monocytes/macrophages.", "a": true, "e": "Correct \u2014 this reflects their immune cell origin."}, {"s": "Ependymal cells line the ventricles of the brain and the central canal of the spinal cord.", "a": true, "e": "Correct \u2014 this is the defining location of ependymal cells."}, {"s": "Ependymal cells are involved in the production of cerebrospinal fluid (CSF).", "a": true, "e": "Correct \u2014 ependymal cells contribute to CSF production, particularly in the choroid plexus."}, {"s": "Satellite cells are glial cells that surround and support neuron cell bodies within ganglia in the PNS.", "a": true, "e": "Correct \u2014 this is the specific role of satellite cells."}, {"s": "Astrocytes are considered part of the peripheral nervous system.", "a": false, "e": "Astrocytes are CNS glial cells, not PNS."}, {"s": "Oligodendrocytes and Schwann cells both perform the same myelinating function, but in different parts of the nervous system.", "a": true, "e": "Correct \u2014 CNS vs PNS myelination, respectively."}, {"s": "The peripheral nervous system includes all nerves and ganglia outside the brain and spinal cord.", "a": true, "e": "Correct \u2014 this is the standard definition of the PNS."}, {"s": "The central nervous system consists of the brain and spinal cord.", "a": true, "e": "Correct \u2014 this is the standard definition of the CNS."}, {"s": "Gray matter consists primarily of neuron cell bodies, dendrites, and unmyelinated fibers.", "a": true, "e": "Correct \u2014 this composition gives gray matter its color and appearance."}, {"s": "White matter consists primarily of myelinated axons.", "a": true, "e": "Correct \u2014 myelin gives white matter its characteristic pale color."}, {"s": "Neurons are generally considered to have limited to no capacity for mitotic division after maturity.", "a": true, "e": "Correct \u2014 most mature neurons are post-mitotic."}, {"s": "Neural stem cells exist in certain regions of the adult brain and can contribute to limited neurogenesis.", "a": true, "e": "Correct \u2014 e.g., the hippocampus retains some capacity for neurogenesis."}, {"s": "A nerve, in gross anatomy, is a bundle of axons located in the PNS.", "a": true, "e": "Correct \u2014 this is the definition of a peripheral nerve."}, {"s": "A tract, in the CNS, refers to a bundle of axons, analogous to a nerve in the PNS.", "a": true, "e": "Correct \u2014 tracts are the CNS equivalent of peripheral nerves."}, {"s": "A ganglion is a cluster of neuron cell bodies located outside the CNS.", "a": true, "e": "Correct \u2014 ganglia are PNS structures."}, {"s": "A nucleus, in neuroanatomy, refers to a cluster of neuron cell bodies within the CNS.", "a": true, "e": "Correct \u2014 this is distinct from the cell nucleus (organelle) terminology."}, {"s": "Action potentials are all-or-none electrical events triggered when a neuron's membrane reaches threshold.", "a": true, "e": "Correct \u2014 this describes the all-or-none principle of neuronal firing."}, {"s": "Neurotransmitters are chemical messengers released at synapses to transmit signals between cells.", "a": true, "e": "Correct \u2014 this is the definition of neurotransmitters."}, {"s": "Acetylcholine, dopamine, and serotonin are all examples of neurotransmitters.", "a": true, "e": "Correct \u2014 these are well-known neurotransmitter examples."}, {"s": "Chemical synapses involve direct electrical coupling between two neurons without neurotransmitter release.", "a": false, "e": "This describes electrical synapses (via gap junctions); chemical synapses DO use neurotransmitters."}, {"s": "Electrical synapses use gap junctions to allow direct ion flow between connected cells.", "a": true, "e": "Correct \u2014 this defines electrical synapses."}, {"s": "The resting membrane potential of a typical neuron is negative relative to the extracellular environment.", "a": true, "e": "Correct \u2014 the inside of a resting neuron is negatively charged relative to outside."}, {"s": "Depolarization refers to the membrane potential becoming less negative (more positive).", "a": true, "e": "Correct \u2014 this is the standard definition of depolarization."}, {"s": "Repolarization refers to the membrane potential returning toward its resting negative value after depolarization.", "a": true, "e": "Correct \u2014 this restores the neuron's resting state."}, {"s": "Multiple sclerosis (MS) is an autoimmune disease that damages myelin in the central nervous system.", "a": true, "e": "Correct \u2014 MS specifically targets CNS myelin, produced by oligodendrocytes."}, {"s": "Multiple sclerosis results in slowed or blocked nerve conduction due to myelin destruction.", "a": true, "e": "Correct \u2014 demyelination impairs saltatory conduction."}, {"s": "Guillain-Barr\u00e9 syndrome is an autoimmune condition that damages myelin in the peripheral nervous system.", "a": true, "e": "Correct \u2014 this condition targets PNS myelin (Schwann cells)."}, {"s": "Guillain-Barr\u00e9 syndrome commonly presents with ascending muscle weakness or paralysis.", "a": true, "e": "Correct \u2014 this is the classic clinical presentation."}, {"s": "Alzheimer's disease involves progressive neuronal loss and dysfunction, notably in memory-related brain regions.", "a": true, "e": "Correct \u2014 this reflects the neurodegenerative nature of Alzheimer's."}, {"s": "Parkinson's disease involves degeneration of dopamine-producing neurons in a specific brain region.", "a": true, "e": "Correct \u2014 loss of dopaminergic neurons in the substantia nigra is characteristic."}, {"s": "Neurons communicate with muscle cells at a specialized synapse called the neuromuscular junction.", "a": true, "e": "Correct \u2014 this is the specific term for the nerve-muscle synapse."}, {"s": "Peripheral nerve axons can regenerate to some degree following injury, unlike most CNS axons.", "a": true, "e": "Correct \u2014 PNS axons have a greater regenerative capacity than CNS axons."}, {"s": "Wallerian degeneration refers to the breakdown of the axon and myelin distal to a site of nerve injury.", "a": true, "e": "Correct \u2014 this is a key process following peripheral nerve damage."}, {"s": "The three meninges (dura mater, arachnoid mater, pia mater) are protective membranes covering the CNS.", "a": true, "e": "Correct \u2014 these layers protect the brain and spinal cord."}, {"s": "Cerebrospinal fluid (CSF) cushions and protects the brain and spinal cord.", "a": true, "e": "Correct \u2014 CSF provides mechanical protection and nutrient exchange."}, {"s": "The blood-brain barrier restricts the passage of many substances from the blood into the brain tissue.", "a": true, "e": "Correct \u2014 this barrier protects the CNS from harmful substances."}, {"s": "Astrocytes contribute structurally to the blood-brain barrier through their end-feet processes surrounding blood vessels.", "a": true, "e": "Correct \u2014 astrocyte end-feet are a structural component of this barrier."}, {"s": "Neuroglial cells outnumber neurons in the human nervous system.", "a": true, "e": "Correct \u2014 glial cells are generally more numerous than neurons."}, {"s": "A reflex arc is a neural pathway that allows for a rapid, often involuntary, response to a stimulus.", "a": true, "e": "Correct \u2014 reflex arcs bypass higher brain processing for speed."}, {"s": "Sensory (afferent) neurons carry information from receptors toward the central nervous system.", "a": true, "e": "Correct \u2014 'afferent' means 'carrying toward'."}, {"s": "Motor (efferent) neurons carry information from the central nervous system to effectors like muscles or glands.", "a": true, "e": "Correct \u2014 'efferent' means 'carrying away from'."}, {"s": "Interneurons are typically found within the CNS and connect sensory and motor neurons.", "a": true, "e": "Correct \u2014 interneurons often integrate and relay signals within the CNS."}, {"s": "The somatic nervous system controls voluntary skeletal muscle movement.", "a": true, "e": "Correct \u2014 this is the definition of the somatic nervous system."}, {"s": "The autonomic nervous system controls involuntary functions such as heart rate and digestion.", "a": true, "e": "Correct \u2014 this is the definition of the autonomic nervous system."}, {"s": "The sympathetic and parasympathetic divisions are the two main branches of the autonomic nervous system.", "a": true, "e": "Correct \u2014 these two divisions often have opposing effects."}, {"s": "Neuroglial tumors, such as gliomas, arise from glial cells rather than neurons.", "a": true, "e": "Correct \u2014 gliomas are named for their glial cell origin."}, {"s": "Neurons are generally more resistant to oxygen deprivation than most other cell types in the body.", "a": false, "e": "Neurons are actually highly SENSITIVE to oxygen deprivation, not resistant."}, {"s": "Neurons require a continuous supply of oxygen and glucose to function properly, given their high metabolic demand.", "a": true, "e": "Correct \u2014 this reflects the neuron's high energy requirements."}, {"s": "A synaptic cleft is the small gap between the presynaptic and postsynaptic membranes at a chemical synapse.", "a": true, "e": "Correct \u2014 this is the specific term for that gap."}, {"s": "Neurotransmitter receptors are located on the postsynaptic membrane.", "a": true, "e": "Correct \u2014 receptors bind neurotransmitters released from the presynaptic terminal."}, {"s": "Neuroglia can proliferate (undergo mitosis) throughout life, unlike most mature neurons.", "a": true, "e": "Correct \u2014 this partly explains why most CNS tumors (gliomas) arise from glial cells rather than neurons."}, {"s": "The perikaryon is another term specifically for the axon of a neuron.", "a": false, "e": "Perikaryon refers to the cell body (soma), not the axon."}, {"s": "Neurofilaments and microtubules within the axon help maintain its structure and support axonal transport.", "a": true, "e": "Correct \u2014 these cytoskeletal elements are essential to axon function."}, {"s": "Axonal transport allows movement of materials between the cell body and axon terminals.", "a": true, "e": "Correct \u2014 this transport is vital since protein synthesis mainly occurs in the soma."}, {"s": "Anterograde axonal transport moves materials from the cell body toward the axon terminal.", "a": true, "e": "Correct \u2014 'antero-' indicates forward movement, away from the soma."}, {"s": "Retrograde axonal transport moves materials from the axon terminal back toward the cell body.", "a": true, "e": "Correct \u2014 'retro-' indicates backward movement, toward the soma."}, {"s": "Neuroglia make up roughly half or more of the total cell population in the nervous system.", "a": true, "e": "Correct \u2014 glial cells are abundant support cells throughout the nervous system."}, {"s": "A synaptic vesicle stores neurotransmitters within the axon terminal before their release.", "a": true, "e": "Correct \u2014 vesicles package neurotransmitters for release into the synaptic cleft."}, {"s": "Peripheral nerve fibers can be classified based on the presence or absence of a myelin sheath.", "a": true, "e": "Correct \u2014 myelinated vs unmyelinated is a standard classification."}, {"s": "The endoneurium, perineurium, and epineurium are connective tissue layers that organize and protect peripheral nerves.", "a": true, "e": "Correct \u2014 these layers are analogous to the muscle connective tissue layers (endo/peri/epimysium)."}, {"s": "The endoneurium surrounds individual nerve fibers (axons) within a nerve.", "a": true, "e": "Correct \u2014 this is the innermost connective tissue layer of a nerve."}, {"s": "The perineurium surrounds bundles (fascicles) of nerve fibers within a nerve.", "a": true, "e": "Correct \u2014 this layer organizes fibers into fascicles."}, {"s": "The epineurium is the outermost connective tissue layer surrounding an entire peripheral nerve.", "a": true, "e": "Correct \u2014 this is the outer protective covering of a nerve."}, {"s": "Neuronal excitability depends on the presence of voltage-gated ion channels within the plasma membrane.", "a": true, "e": "Correct \u2014 these channels underlie action potential generation."}, {"s": "Sodium ions flow into the neuron during the depolarization phase of an action potential.", "a": true, "e": "Correct \u2014 sodium influx drives depolarization."}, {"s": "Potassium ions flow out of the neuron during the repolarization phase of an action potential.", "a": true, "e": "Correct \u2014 potassium efflux drives repolarization."}, {"s": "The refractory period is a brief period after an action potential during which a neuron cannot immediately fire again.", "a": true, "e": "Correct \u2014 this limits the maximum firing rate of a neuron."}, {"s": "Neuroplasticity refers to the nervous system's ability to reorganize and adapt in response to experience or injury.", "a": true, "e": "Correct \u2014 this underlies learning, memory, and recovery from certain injuries."}, {"s": "The neuronal cell body contains the Golgi apparatus, mitochondria, and other typical cellular organelles.", "a": true, "e": "Correct \u2014 the soma houses the standard complement of cell organelles."}, {"s": "A neuron typically has more than one axon extending from the cell body.", "a": false, "e": "A typical neuron has only ONE axon, though it may have multiple dendrites."}, {"s": "Neural tissue, along with muscle tissue, is classified as excitable tissue.", "a": true, "e": "Correct \u2014 both tissue types generate and respond to electrical signals."}, {"s": "Neuroglial cells generally do not generate or propagate action potentials.", "a": true, "e": "Correct \u2014 this distinguishes glia functionally from neurons."}, {"s": "Anencephaly and spina bifida are examples of neural tube defects arising from abnormal nervous system development.", "a": true, "e": "Correct \u2014 these congenital conditions result from incomplete neural tube closure."}, {"s": "A concussion involves temporary disruption of normal brain function due to trauma, without necessarily causing structural damage.", "a": true, "e": "Correct \u2014 this describes the typical nature of a concussion."}, {"s": "Neurodegenerative diseases involve progressive loss of structure or function of neurons over time.", "a": true, "e": "Correct \u2014 this is the general definition of neurodegenerative disease."}, {"s": "Local anesthetics work in part by blocking voltage-gated sodium channels, preventing action potential propagation.", "a": true, "e": "Correct \u2014 this is the mechanism of many local anesthetics."}, es (white blood cells) are the only formed elements of blood that contain a nucleus.", "a": true, "e": "Correct \u2014 this distinguishes WBCs from RBCs and platelets."}, {"s": "Leukocytes are primarily involved in the body's immune defense functions.", "a": true, "e": "Correct \u2014 this is the general role of white blood cells."}, {"s": "Granulocytes are white blood cells that contain visible cytoplasmic granules, including neutrophils, eosinophils, and basophils.", "a": true, "e": "Correct \u2014 this defines the granulocyte category."}, {"s": "Agranulocytes are white blood cells lacking visible cytoplasmic granules, including lymphocytes and monocytes.", "a": true, "e": "Correct \u2014 this defines the agranulocyte category."}, {"s": "Neutrophils are typically the most abundant type of white blood cell in a normal differential count.", "a": true, "e": "Correct \u2014 neutrophils usually make up the largest proportion of WBCs."}, {"s": "Neutrophils are considered the first responders in acute bacterial infections.", "a": true, "e": "Correct \u2014 neutrophils rapidly migrate to sites of bacterial infection."}, {"s": "Eosinophils increase in number during parasitic infections and allergic reactions.", "a": true, "e": "Correct \u2014 this is the classic clinical association with eosinophils."}, {"s": "Basophils are the least abundant type of white blood cell under normal conditions.", "a": true, "e": "Correct \u2014 basophils typically make up less than 1% of WBCs."}, {"s": "Basophils release histamine and heparin, contributing to inflammatory responses.", "a": true, "e": "Correct \u2014 these mediators play roles in allergic and inflammatory reactions."}, {"s": "Lymphocytes are key cells of the adaptive immune system, including B cells and T cells.", "a": true, "e": "Correct \u2014 lymphocytes drive adaptive (specific) immunity."}, {"s": "B lymphocytes are primarily responsible for producing antibodies.", "a": true, "e": "Correct \u2014 B cells differentiate into
