a.", "a": true, "e": "Correct \u2014 this is a physiological adaptation to lower oxygen availability."}, {"s": "Blood doping, sometimes used illicitly in sports, involves artificially increasing red blood cell count to enhance oxygen delivery.", "a": true, "e": "Correct \u2014 this reflects the performance-enhancing rationale behind blood doping."}, {"s": "A differential white blood cell count reports the relative percentages of each type of leukocyte in a blood sample.", "a": true, "e": "Correct \u2014 this is the standard definition of a differential count."}, {"s": "An abnormal increase in lymphocytes is often associated with viral infections.", "a": true, "e": "Correct \u2014 lymphocytosis is a common finding in many viral illnesses."}, {"s": "Neutrophilia (elevated neutrophil count) is often associated with acute bacterial infections.", "a": true, "e": "Correct \u2014 this is a classic clinical association."}, {"s": "Blood is essential for maintaining body temperature through the distribution of heat via circulation.", "a": true, "e": "Correct \u2014 this is one of blood's homeostatic functions."}, {"s": "The hematocrit test is performed by centrifuging a blood sample and measuring the packed red cell volume.", "a": true, "e": "Correct \u2014 this describes the standard hematocrit test procedure."}, {"s": "Erythrocyte sedimentation rate (ESR) is a test that can indicate the presence of inflammation in the body.", "a": true, "e": "Correct \u2014 elevated ESR often reflects an inflammatory process."}, {"s": "Blood plasma proteins contribute to maintaining blood osmotic pressure, which helps regulate fluid balance between blood and tissues.", "a": true, "e": "Correct \u2014 this is a key physiological role of plasma proteins, especially albumin."}, {"s": "A decrease in plasma albumin can lead to edema due to reduced osmotic pressure holding fluid within blood vessels.", "a": true, "e": "Correct \u2014 this explains edema formation in conditions like liver disease or malnutrition."}, {"s": "Neutrophils typically have a shorter circulating lifespan than lymphocytes.", "a": true, "e": "Correct \u2014 neutrophils are relatively short-lived compared to some long-lived lymphocytes."}, {"s": "Some memory lymphocytes can persist in the body for years, providing long-term immunity.", "a": true, "e": "Correct \u2014 memory B and T cells underlie long-lasting immunity."}, {"s": "Hemostasis involves three main steps: vascular spasm, platelet plug formation, and coagulation.", "a": true, "e": "Correct \u2014 these are the classic three phases of hemostasis."}, {"s": "Vascular spasm refers to the constriction of a damaged blood vessel to reduce blood loss.", "a": true, "e": "Correct \u2014 this is the first response to vessel injury."}, {"s": "Platelet plug formation involves platelets adhering to exposed collagen at a site of vessel injury.", "a": true, "e": "Correct \u2014 this is the second step of hemostasis."}, {"s": "Coagulation, the third step of hemostasis, involves formation of a stable fibrin clot.", "a": true, "e": "Correct \u2014 this stabilizes the platelet plug into a durable clot."}, {"s": "Anticoagulants such as heparin and warfarin are used clinically to reduce blood clotting.", "a": true, "e": "Correct \u2014 these are common anticoagulant medications."}, {"s": "Aspirin can inhibit platelet aggregation, reducing clot formation.", "a": true, "e": "Correct \u2014 this is why low-dose aspirin is used for cardiovascular protection."}, {"s": "Blood smears stained with Wright's or Giemsa stain are commonly used to examine blood cell morphology under a microscope.", "a": true, "e": "Correct \u2014 these are standard histological blood stains."}, {"s": "Understanding normal blood cell counts and morphology is essential for recognizing abnormal findings in clinical practice.", "a": true, "e": "Correct \u2014 this histological foundation supports future clinical diagnostic skills."}, {"s": "A high white blood cell count in a patient with fever and localized pain often supports a diagnosis of infection.", "a": true, "e": "Correct \u2014 leukocytosis is a common supportive finding in infection."}, {"s": "Megakaryocytes are found primarily within the bone marrow.", "a": true, "e": "Correct \u2014 this is the site where platelets are produced from megakaryocyte fragmentation."}, {"s": "Blood group antigens are inherited and remain constant throughout a person's life under normal circumstances.", "a": true, "e": "Correct \u2014 ABO/Rh blood type is genetically determined and stable."}, {"s": "A cross-match test is performed before blood transfusion to check compatibility between donor and recipient blood.", "a": true, "e": "Correct \u2014 this test helps prevent transfusion reactions."}, {"s": "Plasma can be separated from whole blood using an anticoagulant and centrifugation, without allowing the blood to clot.", "a": true, "e": "Correct \u2014 this is how plasma (as opposed to serum) is obtained."}, {"s": "Iron obtained from dietary sources or recycled RBC breakdown is essential for hemoglobin synthesis.", "a": true, "e": "Correct \u2014 iron is a core structural component of the heme group."}, {"s": "The spleen also serves as a reservoir for platelets and can sequester a portion of the body's total platelet supply.", "a": true, "e": "Correct \u2014 the spleen normally holds a portion of circulating platelets."}, {"s": "Splenectomy (removal of the spleen) can lead to changes in blood cell counts, including possible increases in platelets and abnormal red blood cells.", "a": true, "e": "Correct \u2014 the spleen's normal filtering and storage roles are lost after removal."}, {"s": "Blood is essential not only for oxygen transport but also for distributing nutrients, hormones, and immune cells throughout the body.", "a": true, "e": "Correct \u2014 this reflects blood's broad, multifunctional role."}, {"s": "A strong understanding of blood histology supports later study of hematology, immunology, and clinical laboratory diagnostics.", "a": true, "e": "Correct \u2014 this histological foundation is directly relevant to future clinical coursework."}, {"s": "Neutrophils, eosinophils, and basophils are collectively called granulocytes due to visible cytoplasmic granules.", "a": true, "e": "Correct \u2014 this is the defining feature shared by these three WBC types."}, {"s": "Lymphocytes and monocytes are collectively called agranulocytes since they lack visible cytoplasmic granules.", "a": true, "e": "Correct \u2014 this is the defining feature shared by these two WBC types."}, {"s": "An elevated platelet count is referred to as thrombocytosis.", "a": true, "e": "Correct \u2014 this is the standard term for high platelet counts."}, {"s": "Blood pH is normally maintained within a narrow, slightly alkaline range through buffering systems in the plasma.", "a": true, "e": "Correct \u2014 plasma buffers help maintain this tight pH range."}, {"s": "Chronic kidney disease can lead to anemia due to reduced erythropoietin production.", "a": true, "e": "Correct \u2014 the kidneys are the primary source of erythropoietin."}, {"s": "Blood transports metabolic wastes, such as carbon dioxide and urea, to organs responsible for their elimination.", "a": true, "e": "Correct \u2014 this is one of blood's key transport/excretory support functions."}, {"s": "A shift toward more immature neutrophils in the blood, sometimes called a 'left shift,' can indicate an active infection.", "a": true, "e": "Correct \u2014 this reflects increased bone marrow output during infection."}, {"s": "Blood clot formation that occurs inappropriately within an intact blood vessel is called thrombosis.", "a": true, "e": "Correct \u2014 this is the standard definition of thrombosis."}, {"s": "A thrombus that breaks free and travels through the bloodstream is called an embolus.", "a": true, "e": "Correct \u2014 this describes the transition from thrombus to embolus."}, {"s": "Disseminated intravascular coagulation (DIC) is a serious condition involving widespread activation of the clotting cascade throughout the body.", "a": true, "e": "Correct \u2014 this is the standard definition of DIC."}, {"s": "Cartilage is a type of specialized connective tissue with a firm yet flexible matrix.", "a": true, "e": "Correct \u2014 this defines cartilage's general physical properties."}, {"s": "Chondrocytes are the mature cells of cartilage, residing within spaces called lacunae.", "a": true, "e": "Correct \u2014 this is the standard location and terminology for cartilage cells."}, {"s": "Chondroblasts are immature cartilage cells responsible for producing new matrix.", "a": true, "e": "Correct \u2014 chondroblasts actively synthesize cartilage matrix."}, {"s": "Cartilage matrix contains ground substance rich in chondroitin sulfate.", "a": true, "e": "Correct \u2014 this glycosaminoglycan is a key ground substance component."}, {"s": "Cartilage is generally vascular, receiving a direct blood supply like most other connective tissues.", "a": false, "e": "Cartilage is AVASCULAR \u2014 it is nourished by diffusion via the perichondrium."}, {"s": "Cartilage is aneural, meaning it lacks nerve supply.", "a": true, "e": "Correct \u2014 this is a defining and frequently tested feature of cartilage."}, {"s": "The perichondrium is a layer of dense connective tissue surrounding most cartilage, except fibrocartilage.", "a": true, "e": "Correct \u2014 the perichondrium supplies nutrients and supports growth."}, {"s": "Appositional growth of cartilage involves new cartilage being added at the surface from the perichondrium.", "a": true, "e": "Correct \u2014 this is one of the two cartilage growth mechanisms."}, {"s": "Interstitial growth of cartilage involves chondrocytes dividing within their lacunae, expanding cartilage from within.", "a": true, "e": "Correct \u2014 this is the second cartilage growth mechanism."}, {"s": "Hyaline cartilage is the most common type of cartilage in the body.", "a": true, "e": "Correct \u2014 hyaline cartilage has widespread distribution."}, {"s": "Hyaline cartilage has a smooth, glassy appearance due to its fine collagen fiber network.", "a": true, "e": "Correct \u2014 this describes hyaline cartilage's characteristic look."}, {"s": "Hyaline cartilage is found covering the articular surfaces of many joints.", "a": true, "e": "Correct \u2014 articular cartilage is a classic hyaline cartilage example."}, {"s": "Hyaline cartilage forms the rings that support the trachea.", "a": true, "e": "Correct \u2014 tracheal cartilage rings are hyaline cartilage."}, {"s": "Hyaline cartilage forms the template for most of the fetal skeleton before being replaced by bone.", "a": true, "e": "Correct \u2014 this underlies the process of endochondral ossification."}, {"s": "Costal cartilage, which connects the ribs to the sternum, is composed of hyaline cartilage.", "a": true, "e": "Correct \u2014 this is a classic hyaline cartilage location."}, {"s": "Elastic cartilage contains abundant elastic fibers in addition to collagen fibers.", "a": true, "e": "Correct \u2014 elastic fibers give this cartilage type its flexibility."}, {"s": "Elastic cartilage is found in structures such as the external ear (pinna) and the epiglottis.", "a": true, "e": "Correct \u2014 these are classic elastic cartilage locations."}, {"s": "Elastic cartilage can bend and recoil back to its original shape due to its elastic fiber content.", "a": true, "e": "Correct \u2014 this describes elastic cartilage's key functional property."}, {"s": "Fibrocartilage is characterized by dense bundles of type I collagen fibers.", "a": true, "e": "Correct \u2014 this gives fibrocartilage its notable strength."}, {"s": "Fibrocartilage is considered the strongest and most resistant to compression and tension among the three cartilage types.", "a": true, "e": "Correct \u2014 this reflects its dense collagen composition."}, {"s": "Fibrocartilage is found in structures such as intervertebral discs, the pubic symphysis, and the menisci of the knee.", "a": true, "e": "Correct \u2014 these are classic fibrocartilage locations."}, {"s": "Fibrocartilage lacks a distinct perichondrium, unlike hyaline and elastic cartilage.", "a": true, "e": "Correct \u2014 this distinguishes fibrocartilage from the other two types."}, {"s": "Fibrocartilage blends directly into surrounding dense connective tissue due to its lack of a perichondrium.", "a": true, "e": "Correct \u2014 this reflects fibrocartilage's unique structural integration."}, {"s": "Cartilage generally heals more slowly than most other connective tissues after injury.", "a": true, "e": "Correct \u2014 the lack of blood supply significantly slows cartilage repair."}, {"s": "Osteoarthritis involves progressive degeneration of articular hyaline cartilage within joints.", "a": true, "e": "Correct \u2014 this is the pathological basis of osteoarthritis."}, {"s": "A herniated intervertebral disc occurs when the fibrocartilage of the disc ruptures, allowing its soft center to protrude.", "a": true, "e": "Correct \u2014 this describes disc herniation and its effect on nearby spinal nerves."}, {"s": "The nucleus pulposus is the soft, gel-like center of an intervertebral disc.", "a": true, "e": "Correct \u2014 this structure can herniate through a ruptured annulus fibrosus."}, {"s": "Cartilage tissue engineering and regenerative therapies remain an active area of research due to cartilage's poor natural healing capacity.", "a": true, "e": "Correct \u2014 this reflects ongoing clinical interest given cartilage's limited self-repair."}, {"s": "Chondrocytes, once mature, generally have a slower rate of division compared to many other cell types.", "a": true, "e": "Correct \u2014 cartilage's slow cellular turnover contributes to its slow healing."}, {"s": "All three cartilage types (hyaline, elastic, fibrocartilage) share the same basic avascular and aneural nature.", "a": true, "e": "Correct \u2014 these two properties are shared across all cartilage types, though fibrocartilage additionally lacks a perichondrium."}, {"s": "The knee meniscus is composed of fibrocartilage, providing shock absorption and stability to the joint.", "a": true, "e": "Correct \u2014 the menisci are classic fibrocartilage structures."}, {"s": "A torn meniscus tends to heal poorly, especially in its avascular inner regions.", "a": true, "e": "Correct \u2014 limited blood supply within cartilage impairs healing, especially centrally."}, {"s": "Cartilage in the nose (nasal septum and external nose) is primarily hyaline cartilage.", "a": true, "e": "Correct \u2014 this is a classic hyaline cartilage location."}, {"s": "Growth plates (epiphyseal plates) in growing long bones are composed of hyaline cartilage.", "a": true, "e": "Correct \u2014 this cartilage allows for longitudinal bone growth before ossification."}, {"s": "Chondromalacia refers to the softening and breakdown of cartilage, often affecting the patella (kneecap).", "a": true, "e": "Correct \u2014 this is a specific cartilage pathology."}, {"s": "Relapsing polychondritis is an autoimmune condition involving inflammation and destruction of cartilage throughout the body.", "a": true, "e": "Correct \u2014 this rare condition targets cartilage in multiple locations, including the ears and airway."}, {"s": "Cartilage matrix, despite lacking blood vessels, still allows for diffusion of nutrients and gases from nearby vascularized tissue.", "a": true, "e": "Correct \u2014 diffusion through the matrix compensates for the lack of direct blood supply."}, {"s": "The three types of cartilage can generally be distinguished histologically by their differing fiber composition and appearance.", "a": true, "e": "Correct \u2014 collagen vs elastic fiber content, and matrix appearance, help differentiate the types under the microscope."}, {"s": "Cartilage's resistance to compression makes it well suited for weight-bearing joint surfaces.", "a": true, "e": "Correct \u2014 this property underlies hyaline cartilage's role at joint surfaces."}, {"s": "A cartilage biopsy showing chondrocytes in lacunae within a glassy, homogeneous matrix is most consistent with hyaline cartilage.", "a": true, "e": "Correct \u2014 this description matches classic hyaline cartilage histology."}, {"s": "A cartilage biopsy showing abundant wavy elastic fibers throughout the matrix is most consistent with elastic cartilage.", "a": true, "e": "Correct \u2014 this description matches classic elastic cartilage histology."}, {"s": "A cartilage biopsy showing dense, parallel bundles of collagen fibers with chondrocytes arranged in rows is most consistent with fibrocartilage.", "a": true, "e": "Correct \u2014 this description matches classic fibrocartilage histology."}, {"s": "Cartilage repair after injury is generally more successful in younger individuals due to greater cellular activity.", "a": true, "e": "Correct \u2014 younger tissue generally has more regenerative capacity."}, {"s": "Cartilage forms an important structural component of the outer ear, larynx, trachea, and bronchi, among other structures.", "a": true, "e": "Correct \u2014 cartilage provides structural support in these respiratory and auditory structures."}, {"s": "Achondroplasia is a genetic disorder affecting cartilage growth, leading to a form of dwarfism.", "a": true, "e": "Correct \u2014 this condition specifically impairs endochondral ossification at growth plates."}, {"s": "Cartilage's compressive strength comes largely from its ground substance's ability to retain water, resisting deformation under load.", "a": true, "e": "Correct \u2014 the hydrated ground substance helps cartilage resist compressive forces."}, {"s": "Costochondritis is inflammation of the costal cartilage connecting the ribs to the sternum, causing chest pain.", "a": true, "e": "Correct \u2014 this is a specific clinical condition involving costal (hyaline) cartilage."}, {"s": "Cartilage lacks the capacity for significant self-repair largely due to its avascular nature and low cellular turnover.", "a": true, "e": "Correct \u2014 this combination explains cartilage's characteristically poor healing."}, {"s": "Hyaline cartilage, despite being the most common type, is also relatively more prone to age-related degeneration, such as in osteoarthritis.", "a": true, "e": "Correct \u2014 articular hyaline cartilage is a common site of degenerative joint changes with age."}, {"s": "The three cartilage types differ primarily in the type and amount of fibers within their extracellular matrix.", "a": true, "e": "Correct \u2014 fiber composition (collagen only, collagen + elastic, or dense collagen) is the key distinguishing factor."}, {"s": "Chondroitin sulfate supplements are sometimes used, with variable evidence, in an attempt to support joint cartilage health.", "a": true, "e": "Correct \u2014 this reflects a common (though debated) clinical/OTC use."}, {"s": "Cartilage can calcify under certain pathological or age-related conditions, despite normally remaining uncalcified.", "a": true, "e": "Correct \u2014 calcified cartilage can occur, for example, in aging costal cartilage."}, {"s": "The epiglottis, composed of elastic cartilage, helps cover the airway during swallowing.", "a": true, "e": "Correct \u2014 this reflects both the location and function of elastic cartilage here."}, {"s": "Cartilage's slow interstitial growth contributes to why cartilage injuries in adults often do not fully resolve without intervention.", "a": true, "e": "Correct \u2014 limited chondrocyte division slows natural repair in adults."}, {"s": "A key exam distinction is that fibrocartilage is the only type of cartilage lacking a perichondrium.", "a": true, "e": "Correct \u2014 this is one of the most frequently tested fibrocartilage-specific facts."}, {"s": "Cartilage matrix composition can be assessed histologically using stains that highlight glycosaminoglycans, such as toluidine blue.", "a": true, "e": "Correct \u2014 such stains help visualize cartilage ground substance components."}, {"s": "The pubic symphysis, a fibrocartilaginous joint, can widen slightly during childbirth to help accommodate delivery.", "a": true, "e": "Correct \u2014 hormonal changes during pregnancy allow slight symphyseal widening."}, {"s": "Articular cartilage lacks a perichondrium on its joint-facing surface, unlike cartilage elsewhere in the body.", "a": true, "e": "Correct \u2014 this allows a smooth, low-friction joint surface."}, {"s": "Cartilage's mechanical properties make it well-suited to both provide flexibility (as in the trachea) and resist compression (as in joints), depending on its type and location.", "a": true, "e": "Correct \u2014 this reflects the functional diversity of cartilage across the three types."}, {"s": "Understanding cartilage histology is foundational for later study of orthopedic and rheumatologic conditions.", "a": true, "e": "Correct \u2014 cartilage knowledge underlies much of joint and connective tissue pathology."}, {"s": "Cartilage, along with bone, is classified under the broader category of specialized connective tissue, distinct from connective tissue proper.", "a": true, "e": "Correct \u2014 this reflects the standard connective tissue classification hierarchy."}, {"s": "A strong grasp of the three cartilage types and their distinguishing features is essential preparation for understanding bone histology, which follows a related but distinct developmental and structural pattern.", "a": true, "e": "Correct \u2014 cartilage knowledge, especially hyaline cartilage, underlies understanding of endochondral bone formation."}, {"s": "Cartilage's flexibility combined with its resistance to compression makes it ideal for structures needing both support and shock absorption.", "a": true, "e": "Correct \u2014 this dual property underlies cartilage's varied roles throughout the body."}, {"s": "Bone and cartilage together represent the two major rigid or semi-rigid specialized connective tissues supporting the skeletal system.", "a": true, "e": "Correct \u2014 cartilage and bone work together in skeletal support and development."}, {"s": "Cartilage grows in two ways: appositional growth (from the perichondrium) and interstitial growth (from within, by dividing chondrocytes).", "a": true, "e": "Correct \u2014 these are the two recognized cartilage growth mechanisms."}, {"s": "Interstitial growth occurs mainly during the early stages of cartilage development, before the matrix becomes too rigid to allow internal expansion.", "a": true, "e": "Correct \u2014 as matrix stiffens, interstitial growth becomes limited."}, {"s": "Appositional growth continues to occur throughout life at the surface of cartilage, provided the perichondrium remains intact.", "a": true, "e": "Correct \u2014 this allows for continued thickening of cartilage from its outer surface."}, {"s": "Chondrocytes in lacunae are often found in small clusters called isogenous groups, resulting from recent interstitial division.", "a": true, "e": "Correct \u2014 isogenous groups reflect recent cell division within a shared lacuna space."}, {"s": "The extracellular matrix of hyaline cartilage appears relatively homogeneous and glassy due to the fine collagen fibers being masked by ground substance.", "a": true, "e": "Correct \u2014 this masking effect gives hyaline cartilage its name (hyalos = glass)."}, {"s": "Elastic cartilage's matrix, when stained appropriately, reveals a dense network of branching elastic fibers not visible with standard H&E staining alone.", "a": true, "e": "Correct \u2014 special stains like Verhoeff's are used to highlight elastic fibers."}, {"s": "Fibrocartilage typically demonstrates alternating layers of chondrocytes and thick collagen fiber bundles.", "a": true, "e": "Correct \u2014 this layered arrangement reflects the tissue's role in resisting both compression and tension."}, {"s": "Cartilage tissue is relatively resistant to degradation by many proteolytic enzymes due to its dense matrix organization.", "a": true, "e": "Correct \u2014 this matrix density contributes to cartilage's durability, despite its slow repair."}, {"s": "Costal cartilage tends to calcify with age, which can be observed on x-rays in older individuals.", "a": true, "e": "Correct \u2014 this is a normal age-related change in some hyaline cartilage."}, {"s": "The trachea's hyaline cartilage rings are C-shaped rather than complete circles, allowing for esophageal expansion during swallowing.", "a": true, "e": "Correct \u2014 the open posterior portion accommodates the adjacent esophagus."}, {"s": "Cartilaginous joints, such as the pubic symphysis, allow for limited movement compared to freely movable synovial joints.", "a": true, "e": "Correct \u2014 cartilaginous joints are generally less mobile than synovial joints."}, {"s": "The larynx contains multiple pieces of cartilage, some of which are hyaline and some elastic, depending on their specific location and function.", "a": true, "e": "Correct \u2014 for example, the thyroid cartilage is hyaline while the epiglottis is elastic."}, {"s": "Cartilage canals are small vascular channels sometimes found in larger masses of developing cartilage to aid nutrient diffusion.", "a": true, "e": "Correct \u2014 these transient channels help support nutrition in thicker cartilage during development."}, {"s": "A chondroma is a benign tumor composed of cartilage tissue.", "a": true, "e": "Correct \u2014 this is a standard benign tumor arising from cartilage."}, {"s": "A chondrosarcoma is a malignant tumor arising from cartilage-producing cells.", "a": true, "e": "Correct \u2014 this is the malignant counterpart to a chondroma."}, {"s": "Cartilage's ground substance is highly hydrated, which contributes to its ability to resist compressive forces.", "a": true, "e": "Correct \u2014 water retention within the matrix is key to cartilage's mechanical properties."}, {"s": "Aging is associated with decreased water content and elasticity within cartilage tissue.", "a": true, "e": "Correct \u2014 this contributes to age-related joint stiffness and cartilage degeneration."}, {"s": "Articular cartilage lacks both a perichondrium and direct vascular supply on its joint surface, relying entirely on synovial fluid diffusion for nutrition.", "a": true, "e": "Correct \u2014 this unique nutritional pathway makes articular cartilage particularly vulnerable to slow healing."}, {"s": "Chondrocyte viability and function can be assessed in laboratory and research settings to study cartilage health and degeneration.", "a": true, "e": "Correct \u2014 this reflects ongoing cartilage-related research relevant to conditions like osteoarthritis."}, {"s": "Cartilage's classification into hyaline, elastic, and fibrocartilage is based primarily on differences in matrix fiber composition.", "a": true, "e": "Correct \u2014 fiber type and density are the primary basis for this classification."}, {"s": "The three types of cartilage each serve distinct mechanical roles suited to their specific fiber composition and tissue location.", "a": true, "e": "Correct \u2014 this structure-function relationship is a central theme in cartilage histology."}, {"s": "Cartilage that has calcified is sometimes an early step preceding replacement by bone during endochondral ossification.", "a": true, "e": "Correct \u2014 calcified cartilage is an intermediate stage in this bone formation process."}, {"s": "Chondrocytes can respond to changes in mechanical loading by altering their matrix production, similar to how osteocytes respond in bone.", "a": true, "e": "Correct \u2014 cartilage, like bone, shows some capacity for mechanically-responsive remodeling."}, {"s": "Hyaline cartilage's smooth surface at joints significantly reduces friction during movement.", "a": true, "e": "Correct \u2014 this frictionless quality is essential for healthy joint function."}, {"s": "Loss of articular cartilage smoothness and thickness is a hallmark finding in osteoarthritis on imaging or examination.", "a": true, "e": "Correct \u2014 cartilage thinning and surface irregularity are classic osteoarthritis findings."}, {"s": "Cartilage-derived growth factors and signaling molecules play roles in regulating both cartilage and adjacent bone development.", "a": true, "e": "Correct \u2014 this reflects cartilage's regulatory role in skeletal development, especially at growth plates."}, {"s": "A solid understanding of the three cartilage types supports recognition of related pathologies, such as arthritis, disc herniation, and cartilage tumors, in clinical practice.", "a": true, "e": "Correct \u2014 this histological foundation is directly applicable to a range of clinical conditions."}, {"s": "Cartilage is present not only in joints and the respiratory tract but also transiently as the main skeletal tissue of the early embryo.", "a": true, "e": "Correct \u2014 the embryonic skeleton is initially composed largely of cartilage before ossification."}, {"s": "Elastic cartilage of the ear can be permanently deformed by prolonged pressure or trauma, unlike its usual ability to recoil from typical bending.", "a": true, "e": "Correct \u2014 while elastic cartilage recoils from normal bending, prolonged or severe trauma (like 'cauliflower ear') can cause lasting deformity."}, {"s": "The relative proportion of collagen versus elastic fibers differs significantly among hyaline, elastic, and fibrocartilage, driving their distinct mechanical properties.", "a": true, "e": "Correct \u2014 this compositional difference underlies each type's specific function."}, {"s": "Cartilage's lack of blood vessels means healing after injury relies almost entirely on slow diffusion-based nutrient delivery.", "a": true, "e": "Correct \u2014 this diffusion dependency is the core reason cartilage heals so slowly."}, {"s": "The three types of cartilage share chondrocytes as their resident cell type, despite differing matrix compositions.", "a": true, "e": "Correct \u2014 chondrocytes are common to all cartilage types, though the surrounding matrix differs."}, {"s": "Cartilage plays a key role in the flexible support of the respiratory tract, from the nose through the bronchi.", "a": true, "e": "Correct \u2014 cartilage rings and plates support airway patency throughout much of the respiratory tract."}, {"s": "Fibrocartilage's dense collagen structure makes it particularly well suited to withstand both compressive and tensile forces simultaneously.", "a": true, "e": "Correct \u2014 this dual resistance is why fibrocartilage is found in high-stress locations like intervertebral discs."}, {"s": "The pinna (external ear) relies on elastic cartilage to maintain its shape while allowing flexibility.", "a": true, "e": "Correct \u2014 this is a classic example of elastic cartilage's structural role."}, {"s": "Damage to elastic cartilage in the ear, such as from repeated trauma, can lead to a permanently deformed 'cauliflower ear.'", "a": true, "e": "Correct \u2014 this is a well-known clinical consequence of elastic cartilage injury."}, {"s": "The intervertebral discs, composed of fibrocartilage with a gel-like center, help absorb shock between vertebrae.", "a": true, "e": "Correct \u2014 this structure is essential for spinal shock absorption."}, {"s": "Hyaline cartilage's smooth, resilient surface makes it the primary cartilage type found at movable joint surfaces.", "a": true, "e": "Correct \u2014 this property supports its role in reducing joint friction."}, {"s": "Cartilage matrix components, including collagen and proteoglycans, are continuously turned over, albeit slowly, throughout life.", "a": true, "e": "Correct \u2014 even mature cartilage undergoes slow matrix remodeling."}, {"s": "Cartilage's mechanical resilience stems from a combination of collagen fiber tensile strength and proteoglycan-associated water retention.", "a": true, "e": "Correct \u2014 this combination gives cartilage its unique compressive and tensile properties."}, {"s": "The study of cartilage structure and function is relevant to fields including orthopedics, sports medicine, and rheumatology.", "a": true, "e": "Correct \u2014 cartilage health is central to many joint-related clinical specialties."}, {"s": "Articular cartilage damage, once significant, often does not fully regenerate to its original structure and function.", "a": true, "e": "Correct \u2014 this reflects cartilage's limited intrinsic healing capacity."}, {"s": "Chondroitin sulfate and other proteoglycans in cartilage matrix help retain water, contributing to the tissue's compressive strength.", "a": true, "e": "Correct \u2014 this water-retention property is central to cartilage's ability to resist compression."}, {"s": "Hyaline cartilage, elastic cartilage, and fibrocartilage collectively provide the body with a range of support types from rigid-yet-smooth to highly flexible to extremely tough.", "a": true, "e": "Correct \u2014 this range reflects the functional diversity of the three cartilage types."}, {"s": "A solid understanding of the differences between hyaline, elastic, and fibrocartilage is one of the most frequently tested comparison areas in histology exams.", "a": true, "e": "Correct \u2014 this comparison is a recurring theme across histology assessments."}, {"s": "Cartilage's embryonic role as the initial skeletal framework highlights its importance not just in adults but throughout human development.", "a": true, "e": "Correct \u2014 cartilage plays a foundational developmental role before much of it is replaced by bone."}, {"s": "The presence of a perichondrium is a useful histological clue that a cartilage sample is either hyaline or elastic cartilage, not fibrocartilage.", "a": true, "e": "Correct \u2014 since fibrocartilage lacks a perichondrium, its presence rules fibrocartilage out."}, {"s": "Chondrocytes, when actively synthesizing matrix, show prominent rough endoplasmic reticulum and Golgi apparatus, similar to other matrix-secreting cells.", "a": true, "e": "Correct \u2014 this reflects their active protein and matrix component synthesis."}, {"s": "Cartilage's relative avascularity, compared to the highly vascular bone tissue it can be replaced by (in endochondral ossification), is a key structural distinction between the two tissues.", "a": true, "e": "Correct \u2014 this vascularity difference is central to understanding the transition from cartilage to bone in development."}, {"s": "A key clinical takeaway from cartilage histology is that joint cartilage injuries often require different management strategies than fractures, due to differences in healing capacity.", "a": true, "e": "Correct \u2014 this reflects the real-world clinical relevance of understanding cartilage's limited healing."}, {"s": "Cartilage tissue, despite lacking blood vessels and nerves, remains a living, metabolically active tissue due to its resident chondrocytes.", "a": true, "e": "Correct \u2014 chondrocytes maintain ongoing, if slow, metabolic activity within the matrix."}, {"s": "The relative rigidity of hyaline cartilage compared to the greater flexibility of elastic cartilage reflects their differing elastic fiber content.", "a": true, "e": "Correct \u2014 elastic fiber abundance is the key differentiating factor here."}, {"s": "Understanding cartilage's structure, types, and limitations directly supports understanding of common orthopedic conditions encountered in clinical practice.", "a": true, "e": "Correct \u2014 this histological knowledge underlies much of orthopedic clinical reasoning."}, {"s": "Bone is a specialized connective tissue with a hard, mineralized extracellular matrix.", "a": true, "e": "Correct \u2014 mineralization is the defining feature of bone matrix."}, {"s": "Bone matrix consists of both an organic component (mainly collagen) and an inorganic mineral component (calcium phosphate/hydroxyapatite).", "a": true, "e": "Correct \u2014 this combination gives bone both flexibility and hardness."}, {"s": "The organic component of bone matrix, before mineralization, is referred to as osteoid.", "a": true, "e": "Correct \u2014 osteoid is unmineralized bone matrix secreted by osteoblasts."}, {"s": "Bone tissue is generally avascular, similar to cartilage.", "a": false, "e": "Bone is highly VASCULAR, unlike cartilage."}, {"s": "Osteoprogenitor cells are stem cells capable of differentiating into osteoblasts.", "a": true, "e": "Correct \u2014 these are the precursor cells for bone-forming osteoblasts."}, {"s": "Osteoblasts are the bone cells responsible for building new bone matrix.", "a": true, "e": "Correct \u2014 osteoblasts secrete osteoid, which then mineralizes."}, {"s": "Osteocytes are mature bone cells that maintain the bone matrix and reside within lacunae.", "a": true, "e": "Correct \u2014 osteocytes are former osteoblasts trapped within the matrix they built."}, {"s": "Osteoclasts are large, multinucleated cells responsible for breaking down (resorbing) bone tissue.", "a": true, "e": "Correct \u2014 osteoclasts perform bone resorption."}, {"s": "Osteoclasts are derived from the same osteoprogenitor lineage as osteoblasts and osteocytes.", "a": false, "e": "Osteoclasts are derived from the monocyte/macrophage lineage, NOT the osteoprogenitor lineage."}, {"s": "Osteoclasts originate from precursor cells related to monocytes and macrophages found in blood.", "a": true, "e": "Correct \u2014 this reflects their distinct hematopoietic origin."}, {"s": "Lacunae are small spaces within bone matrix that house osteocytes.", "a": true, "e": "Correct \u2014 this is the standard location for osteocytes."}, {"s": "Canaliculi are tiny channels connecting lacunae, allowing nutrient and waste exchange between osteocytes.", "a": true, "e": "Correct \u2014 these channels support osteocyte survival despite being embedded in hard matrix."}, {"s": "Compact bone is dense and forms the outer shaft (diaphysis) of long bones.", "a": true, "e": "Correct \u2014 compact bone provides structural strength to the bone shaft."}, {"s": "Spongy (cancellous) bone has a lattice-like structure of trabeculae, without organized osteons.", "a": true, "e": "Correct \u2014 this porous structure distinguishes spongy bone from compact bone."}, {"s": "Spongy bone is typically found at the ends (epiphyses) of long bones and within flat bones.", "a": true, "e": "Correct \u2014 this is the typical location of spongy bone."}, {"s": "Spongy bone often houses red bone marrow, which is involved in blood cell production.", "a": true, "e": "Correct \u2014 the trabecular spaces of spongy bone commonly contain red marrow."}, {"s": "An osteon (Haversian system) is the basic structural unit of compact bone.", "a": true, "e": "Correct \u2014 osteons make up the bulk of compact bone tissue."}, {"s": "The central (Haversian) canal of an osteon contains blood vessels and nerves.", "a": true, "e": "Correct \u2014 this canal supplies the osteon with blood and innervation."}, {"s": "Concentric lamellae are rings of mineralized bone matrix arranged around the central canal of an osteon.", "a": true, "e": "Correct \u2014 this layered arrangement is characteristic of osteon structure."}, {"s": "Volkmann's (perforating) canals connect Haversian canals to each other and to the periosteum.", "a": true, "e": "Correct \u2014 these canals link the vascular supply within compact bone."}, {"s": "Haversian canals run parallel to the long axis of the bone.", "a": true, "e": "Correct \u2014 this orientation distinguishes them from Volkmann's canals."}, {"s": "Volkmann's canals run perpendicular (transverse) to the long axis of the bone.", "a": true, "e": "Correct \u2014 this transverse orientation distinguishes them from Haversian canals."}, {"s": "The periosteum is a connective tissue membrane covering the outer surface of bone, except at joint surfaces.", "a": true, "e": "Correct \u2014 the periosteum supports bone nutrition, growth, and repair."}, {"s": "The endosteum lines the internal surfaces of bone, including the medullary cavity.", "a": true, "e": "Correct \u2014 the endosteum is the internal analog to the periosteum."}, {"s": "Intramembranous ossification is the process by which bone forms directly from mesenchymal tissue, without a cartilage intermediate.", "a": true, "e": "Correct \u2014 this is the mechanism for flat bone formation, such as skull bones."}, {"s": "Endochondral ossification is the process by which bone forms by replacing a pre-existing hyaline cartilage template.", "a": true, "e": "Correct \u2014 this is the mechanism responsible for most long bone formation."}, {"s": "Most long bones of the limbs form through endochondral ossification.", "a": true, "e": "Correct \u2014 this reflects the cartilage-to-bone developmental pathway for limb bones."}, {"s": "Flat bones of the skull typically form through intramembranous ossification.", "a": true, "e": "Correct \u2014 this is a classic example of this ossification pathway."}, {"s": "The epiphyseal plate (growth plate) is composed of hyaline cartilage and allows for longitudinal bone growth.", "a": true, "e": "Correct \u2014 growth plate cartilage is progressively replaced by bone as a person grows."}, {"s": "Once the epiphyseal plate fully ossifies (closes), longitudinal bone growth stops.", "a": true, "e": "Correct \u2014 plate closure marks the end of height/length increase in a bone."}, {"s": "Bone remodeling is a continuous process involving both bone formation (osteoblasts) and bone resorption (osteoclasts).", "a": true, "e": "Correct \u2014 this ongoing balance maintains healthy bone tissue throughout life."}, {"s": "Osteoporosis results from an imbalance favoring bone resorption over bone formation, leading to decreased bone density.", "a": true, "e": "Correct \u2014 this describes the underlying pathology of osteoporosis."}, {"s": "Osteoporosis increases the risk of fractures due to weakened, less dense bone tissue.", "a": true, "e": "Correct \u2014 this is a major clinical consequence of osteoporosis."}, {"s": "Osteopetrosis, sometimes called 'marble bone disease,' results from defective osteoclast function, leading to overly dense but brittle bone.", "a": true, "e": "Correct \u2014 impaired resorption leads to abnormal bone accumulation and structural weakness."}, {"s": "Rickets, occurring in children, results from vitamin D deficiency leading to poor bone mineralization.", "a": true, "e": "Correct \u2014 this leads to soft, poorly mineralized bones in children."}, {"s": "Osteomalacia is the adult equivalent of rickets, also caused by inadequate bone mineralization, often due to vitamin D deficiency.", "a": true, "e": "Correct \u2014 this reflects the same underlying mineralization defect occurring after growth plates have closed."}, {"s": "Calcium and phosphate are the primary minerals that give bone its hardness.", "a": true, "e": "Correct \u2014 these minerals form hydroxyapatite crystals within the bone matrix."}, {"s": "Parathyroid hormone (PTH) generally increases blood calcium levels by promoting osteoclast activity and bone resorption.", "a": true, "e": "Correct \u2014 this is a key hormonal regulator of bone and calcium metabolism."}, {"s": "Calcitonin generally decreases blood calcium levels by inhibiting osteoclast activity.", "a": true, "e": "Correct \u2014 calcitonin has roughly opposite effects to PTH on calcium regulation."}, {"s": "Bone serves not only a structural role but also as a mineral reservoir, particularly for calcium and phosphate.", "a": true, "e": "Correct \u2014 bone is central to whole-body calcium homeostasis."}, {"s": "The medullary cavity, found within the diaphysis of long bones, typically contains yellow (fatty) marrow in adults.", "a": true, "e": "Correct \u2014 this reflects the typical adult distribution of marrow types."}, {"s": "Red bone marrow is the primary site of blood cell production (hematopoiesis) within bone.", "a": true, "e": "Correct \u2014 red marrow houses hematopoietic stem cells."}, {"s": "Yellow bone marrow is composed primarily of adipose tissue and has reduced blood-cell-forming activity compared to red marrow.", "a": true, "e": "Correct \u2014 yellow marrow is largely fat-storing rather than hematopoietically active."}, {"s": "A bone fracture typically heals through a sequence involving hematoma formation, callus formation, and bone remodeling.", "a": true, "e": "Correct \u2014 this describes the general phases of fracture healing."}, {"s": "Osteogenesis imperfecta, sometimes called 'brittle bone disease,' is a genetic disorder involving defective collagen production affecting bone strength.", "a": true, "e": "Correct \u2014 this condition leads to bones that fracture easily."}, {"s": "Paget's disease of bone involves abnormal, disorganized bone remodeling, leading to enlarged but weakened bone.", "a": true, "e": "Correct \u2014 this reflects excessive and disorganized osteoclast/osteoblast activity."}, {"s": "Bone density can be measured clinically using techniques such as DEXA (dual-energy X-ray absorptiometry) scans.", "a": true, "e": "Correct \u2014 DEXA scanning is the standard clinical method for assessing bone density."}, {"s": "Weight-bearing exercise can help stimulate bone formation and maintain bone density.", "a": true, "e": "Correct \u2014 mechanical loading is a known stimulus for osteoblast activity."}, {"s": "Osteocytes can sense mechanical stress on bone and help regulate bone remodeling in response.", "a": true, "e": "Correct \u2014 osteocytes act as mechanosensors within the bone matrix."}, {"s": "Bone marrow transplantation is a medical procedure sometimes used to treat certain blood cancers or bone marrow failure conditions.", "a": true, "e": "Correct \u2014 this reflects a clinical application related to bone marrow function."}, {"s": "A key exam distinction is that osteoblasts 'build' bone while osteoclasts 'break down' bone.", "a": true, "e": "Correct \u2014 this build vs break-down distinction is central to bone histology."}, {"s": "Osteocytes are considered relatively metabolically less active than osteoblasts, focusing on matrix maintenance rather than active new matrix production.", "a": true, "e": "Correct \u2014 osteocytes are more quiescent compared to the actively synthesizing osteoblasts."}, {"s": "Bone tissue can be classified structurally as either compact (dense) or spongy (cancellous).", "a": true, "e": "Correct \u2014 this is the primary structural classification of mature bone."}, {"s": "Woven bone, an immature form of bone tissue, has a more disorganized collagen fiber arrangement compared to mature lamellar bone.", "a": true, "e": "Correct \u2014 woven bone is a temporary, less organized bone type seen during rapid formation or repair."}, {"s": "Lamellar bone, the mature form of bone tissue, has a highly organized, layered structure.", "a": true, "e": "Correct \u2014 this organized lamellar arrangement provides greater strength than woven bone."}, {"s": "Bone matrix mineralization primarily involves the deposition of hydroxyapatite crystals along collagen fibers.", "a": true, "e": "Correct \u2014 this describes the mineralization process at a structural level."}, {"s": "Alkaline phosphatase, an enzyme produced by osteoblasts, plays a role in promoting bone mineralization.", "a": true, "e": "Correct \u2014 this enzyme helps regulate local phosphate availability for mineralization."}, {"s": "Bone metastasis, the spread of cancer to bone, can cause either increased bone destruction (osteolytic) or increased bone formation (osteoblastic) lesions, depending on the cancer type.", "a": true, "e": "Correct \u2014 this reflects the variable effects different cancers can have on bone remodeling."}, {"s": "Understanding bone cell types and their functions is essential for understanding the pathophysiology of many metabolic and structural bone diseases.", "a": true, "e": "Correct \u2014 this histological foundation directly supports understanding clinical bone pathology."}, {"s": "The distinction between compact and spongy bone, along with knowledge of osteon structure, forms a core foundation for understanding skeletal histology and physiology.", "a": true, "e": "Correct \u2014 this knowledge underlies much of orthopedic and skeletal science."}, {"s": "A comprehensive understanding of both cartilage and bone histology completes the study of specialized connective tissue within the broader connective tissue category.", "a": true, "e": "Correct \u2014 cartilage, bone, and blood together make up the specialized connective tissue category."}, {"s": "Bone remodeling allows bones to adapt their structure in response to mechanical loading over time (Wolff's law).", "a": true, "e": "Correct \u2014 this principle describes bone's ability to remodel according to the stresses placed on it."}, {"s": "A comprehensive grasp of bone histology, alongside cartilage and blood, completes the picture of specialized connective tissue in ANA203.", "a": true, "e": "Correct \u2014 these three tissue types round out the specialized connective tissue category."}, {"s": "Bone tissue contains a higher proportion of inorganic mineral content by weight compared to its organic content.", "a": true, "e": "Correct \u2014 mineral (mostly calcium phosphate) makes up roughly two-thirds of bone's dry weight."}, {"s": "Collagen fibers within bone matrix provide tensile strength and some flexibility, preventing the bone from being overly brittle.", "a": true, "e": "Correct \u2014 this organic component balances the hardness provided by minerals."}, {"s": "Demineralized bone (with minerals removed but collagen intact) becomes flexible and rubbery, demonstrating the mineral's role in rigidity.", "a": true, "e": "Correct \u2014 this classic demonstration shows the separate contributions of organic and inorganic components."}, {"s": "Deproteinized bone (with organic collagen removed but minerals intact) becomes brittle and fractures easily, demonstrating collagen's role in flexibility.", "a": true, "e": "Correct \u2014 this shows that mineral alone, without collagen, is brittle."}, {"s": "Osteoblasts, once surrounded by the matrix they secrete, differentiate into osteocytes.", "a": true, "e": "Correct \u2014 this describes the maturation pathway from osteoblast to osteocyte."}, {"s": "Osteoclasts are typically found within small depressions in bone surfaces called Howship's lacunae (resorption pits).", "a": true, "e": "Correct \u2014 these pits mark areas of active bone resorption by osteoclasts."}, {"s": "The ruffled border of an osteoclast increases its surface area for efficient bone matrix resorption.", "a": true, "e": "Correct \u2014 this specialized structure enhances the osteoclast's resorptive capacity."}, {"s": "Osteoclasts secrete acids and enzymes that dissolve both the mineral and organic components of bone matrix during resorption.", "a": true, "e": "Correct \u2014 this dual dissolution allows complete matrix breakdown."}, {"s": "Bone remodeling units, involving coordinated activity of osteoblasts and osteoclasts, continuously replace old bone tissue with new bone throughout life.", "a": true, "e": "Correct \u2014 this ongoing process maintains bone health and structural integrity."}, {"s": "The periosteum contains an outer fibrous layer and an inner cellular (osteogenic) layer containing osteoprogenitor cells.", "a": true, "e": "Correct \u2014 this two-layer structure supports both protection and bone-forming potential."}, {"s": "Sharpey's fibers are collagen fibers that anchor the periosteum firmly to the underlying bone.", "a": true, "e": "Correct \u2014 these fibers provide strong periosteal attachment, especially at tendon/ligament insertion sites."}, {"s": "Bone is classified by shape into categories such as long, short, flat, and irregular bones.", "a": true, "e": "Correct \u2014 this is the standard gross anatomical classification of bones by shape."}, {"s": "Long bones, such as the femur, have a shaft (diaphysis) and two ends (epiphyses).", "a": true, "e": "Correct \u2014 this is the classic long bone structure."}, {"s": "The metaphysis of a long bone is the region between the diaphysis and epiphysis, containing the growth plate in growing individuals.", "a": true, "e": "Correct \u2014 this transitional zone is where longitudinal growth occurs."}, {"s": "Articular cartilage, a thin layer of hyaline cartilage, covers the epiphyseal surfaces of bones at joints.", "a": true, "e": "Correct \u2014 this cartilage reduces friction and cushions joint surfaces."}, {"s": "Trabecular (spongy) bone has a greater surface area relative to its volume compared to compact bone, supporting faster metabolic turnover.", "a": true, "e": "Correct \u2014 this structural feature explains spongy bone's relatively higher metabolic activity."}, {"s": "Compact bone provides most of the structural weight-bearing strength in the shafts of long bones.", "a": true, "e": "Correct \u2014 dense compact bone resists bending and torsional forces along the shaft."}, {"s": "The medullary cavity is the central, hollow region of the diaphysis in long bones.", "a": true, "e": "Correct \u2014 this cavity typically houses bone marrow."}, {"s": "Bone marrow within the medullary cavity can shift between red (hematopoietic) and yellow (fatty) types depending on age and physiological demand.", "a": true, "e": "Correct \u2014 this reflects the dynamic nature of marrow composition."}, {"s": "Osteoblasts express high levels of alkaline phosphatase, an enzyme important for the mineralization process.", "a": true, "e": "Correct \u2014 alkaline phosphatase activity is a marker of active bone formation."}, {"s": "Bone resorption releases calcium and phosphate into the bloodstream, contributing to systemic mineral homeostasis.", "a": true, "e": "Correct \u2014 this reflects bone's role as a mineral reservoir."}, {"s": "Hormonal regulation of bone remodeling includes parathyroid hormone, calcitonin, vitamin D, and sex hormones such as estrogen.", "a": true, "e": "Correct \u2014 multiple hormones interact to regulate bone metabolism."}, {"s": "Estrogen generally helps inhibit excessive osteoclast activity, and its decline after menopause is linked to increased bone loss.", "a": true, "e": "Correct \u2014 this explains the increased osteoporosis risk seen after menopause."}, {"s": "Postmenopausal osteoporosis is a common condition linked to decreased estrogen levels and resulting increased bone resorption.", "a": true, "e": "Correct \u2014 this is a well-established clinical association."}, {"s": "Bone healing after a fracture typically progresses through stages including hematoma formation, soft callus formation, hard (bony) callus formation, and remodeling.", "a": true, "e": "Correct \u2014 these are the recognized stages of fracture repair."}, {"s": "A hematoma forms at a fracture site shortly after injury, due to bleeding from damaged blood vessels within and around the bone.", "a": true, "e": "Correct \u2014 this is the initial step in the fracture healing cascade."}, {"s": "A soft callus, composed largely of fibrocartilage, forms during the early stages of fracture healing to stabilize the fracture site.", "a": true, "e": "Correct \u2014 this temporary structure provides initial stabilization before ossification."}, {"s": "A hard (bony) callus eventually replaces the soft callus, providing more solid stabilization during fracture healing.", "a": true, "e": "Correct \u2014 this reflects progression toward more solid bone repair."}, {"s": "Bone remodeling during the final stage of fracture healing gradually restores the bone's original shape and strength over time.", "a": true, "e": "Correct \u2014 this remodeling phase can continue for months to years after the initial injury."}, {"s": "Nonunion refers to a fracture that fails to heal properly, often due to inadequate blood supply, mobility at the fracture site, or infection.", "a": true, "e": "Correct \u2014 this is a recognized complication of fracture healing."}, {"s": "Osteomyelitis is an infection of bone tissue, which can be caused by bacteria reaching the bone via the bloodstream or direct spread from nearby tissue.", "a": true, "e": "Correct \u2014 this is the standard definition of osteomyelitis."}, {"s": "Bone tissue's high vascularity, while generally supporting healing, can also allow infections to spread more readily through the bloodstream to bone.", "a": true, "e": "Correct \u2014 this reflects a trade-off of bone's rich blood supply."}, {"s": "Bone density naturally peaks in early adulthood and tends to gradually decline with age thereafter.", "a": true, "e": "Correct \u2014 this reflects the typical lifetime pattern of bone mass."}, {"s": "Adequate calcium and vitamin D intake during childhood and adolescence supports achieving optimal peak bone mass.", "a": true, "e": "Correct \u2014 this nutritional foundation is important for long-term bone health."}, {"s": "Bone scans using radioactive tracers can help detect areas of abnormal bone metabolism, such as fractures, infections, or tumors.", "a": true, "e": "Correct \u2014 this nuclear medicine technique highlights areas of increased bone turnover."}, {"s": "Osteosarcoma is a malignant bone tumor that most commonly arises in the metaphysis of long bones in adolescents.", "a": true, "e": "Correct \u2014 this is the classic demographic and location pattern for osteosarcoma."}, {"s": "Bone's compressive strength is generally greater than its tensile strength, similar to many other structural materials.", "a": true, "e": "Correct \u2014 this mechanical property influences the typical patterns seen in bone fractures."}, {"s": "Stress fractures can occur in bone due to repetitive mechanical loading without adequate time for remodeling and repair.", "a": true, "e": "Correct \u2014 this reflects an imbalance between bone microdamage and repair capacity."}, {"s": "Bone's ability to remodel in response to mechanical stress means bones subjected to greater loads, such as in athletes, can become denser over time.", "a": true, "e": "Correct \u2014 this reflects Wolff's law of bone adaptation to mechanical loading."}, {"s": "Immobilization or prolonged bed rest can lead to decreased bone density due to reduced mechanical loading.", "a": true, "e": "Correct \u2014 this reflects the importance of mechanical stimulation for maintaining bone mass."}, {"s": "Space travel and the resulting microgravity environment can lead to significant bone density loss in astronauts.", "a": true, "e": "Correct \u2014 reduced mechanical loading in microgravity accelerates bone loss."}, {"s": "Bone's structural organization into osteons is a hallmark feature specifically of compact bone, not spongy bone.", "a": true, "e": "Correct \u2014 spongy bone trabeculae lack the organized osteon structure seen in compact bone."}, {"s": "Trabeculae in spongy bone are oriented along lines of mechanical stress, optimizing strength while minimizing weight.", "a": true, "e": "Correct \u2014 this reflects the mechanically efficient design of spongy bone architecture."}, {"s": "The skull's flat bones consist of two layers of compact bone (tables) sandwiching a layer of spongy bone called the diploe.", "a": true, "e": "Correct \u2014 this three-layer 'sandwich' structure is characteristic of flat cranial bones."}, {"s": "Bone tissue analysis, including histological examination, can help diagnose various metabolic bone diseases in clinical and research settings.", "a": true, "e": "Correct \u2014 bone biopsy and histology remain valuable diagnostic tools."}, {"s": "The overall study of bone structure, cells, and function is sometimes referred to as osteology.", "a": true, "e": "Correct \u2014 this is the standard term for the study of bone."}, {"s": "Bone tissue, despite its hardness, remains a dynamic and living tissue capable of growth, repair, and remodeling throughout life.", "a": true, "e": "Correct \u2014 this dynamic nature distinguishes living bone from inert structural materials."}, {"s": "The mineral component of bone provides compressive strength, while the collagen component provides tensile strength and some flexibility.", "a": true, "e": "Correct \u2014 this division of mechanical roles is fundamental to bone's composite structure."}, {"s": "Osteoblasts, osteocytes, and osteoclasts each play distinct, complementary roles in bone formation, maintenance, and resorption.", "a": true, "e": "Correct \u2014 this coordinated cellular activity underlies healthy bone physiology."}, {"s": "A key exam distinction is that osteoclasts, unlike osteoblasts and osteocytes, do NOT arise from osteoprogenitor cells.", "a": true, "e": "Correct \u2014 this lineage difference (monocyte origin) is a frequently tested bone histology fact."}, {"s": "Compact bone's osteon-based structure provides significant strength while allowing for the vascular supply needed by embedded osteocytes.", "a": true, "e": "Correct \u2014 the osteon design balances strength with metabolic support."}, {"s": "Spongy bone's trabecular structure reduces overall bone weight while still providing structural support, particularly in areas of lower mechanical stress.", "a": true, "e": "Correct \u2014 this design offers an efficient strength-to-weight ratio."}, {"s": "Bone remodeling rates can vary throughout the skeleton, with some regions turning over bone tissue more rapidly than others.", "a": true, "e": "Correct \u2014 remodeling rates differ based on location and mechanical demand."}, {"s": "The concept of peak bone mass refers to the maximum bone density and strength typically achieved in early adulthood.", "a": true, "e": "Correct \u2014 this represents the high point of the lifetime bone density curve."}, {"s": "After reaching peak bone mass, bone density generally undergoes a gradual, age-related decline unless specific interventions or conditions accelerate this process.", "a": true, "e": "Correct \u2014 this reflects the typical trajectory of bone density with normal aging."}, {"s": "Bone's structural organization allows it to withstand everyday mechanical stresses, such as walking, running, and lifting, without failure under normal conditions.", "a": true, "e": "Correct \u2014 this reflects bone's overall mechanical competence in healthy individuals."}, {"s": "A comprehensive understanding of bone histology supports later clinical learning in fields such as orthopedics, endocrinology, and radiology.", "a": true, "e": "Correct \u2014 bone histology knowledge underlies much of this related clinical coursework."}, {"s": "The interplay between hormonal regulation (e.g., PTH, calcitonin, vitamin D) and cellular activity (osteoblasts, osteoclasts) governs overall bone health and calcium balance.", "a": true, "e": "Correct \u2014 this integrated hormonal-cellular system regulates skeletal and mineral homeostasis."}, {"s": "Bone's dual role as both a structural organ and a metabolic/mineral reservoir makes it central to whole-body calcium and phosphate regulation.", "a": true, "e": "Correct \u2014 this dual function distinguishes bone from purely structural tissues."}, {"s": "Fracture risk generally increases with decreasing bone density, all else being equal.", "a": true, "e": "Correct \u2014 lower bone density is directly associated with increased fragility and fracture risk."}, {"s": "Children's bones tend to be more flexible than adult bones, partly due to a higher proportion of organic (collagen) matrix relative to mineral content.", "a": true, "e": "Correct \u2014 this relative composition contributes to the classic 'greenstick fracture' pattern seen in children."}, {"s": "A greenstick fracture, more common in children, involves an incomplete break where the bone bends and cracks but does not fully separate.", "a": true, "e": "Correct \u2014 this reflects the greater flexibility of immature bone."}, {"s": "Bone tissue's response to injury (fracture healing) shares some similarities with soft tissue wound healing, including an initial inflammatory phase.", "a": true, "e": "Correct \u2014 both processes begin with hematoma/inflammation before progressing to repair."}, {"s": "The presence of osteoid, unmineralized bone matrix, can be assessed histologically to evaluate bone formation activity.", "a": true, "e": "Correct \u2014 osteoid seams are examined in bone biopsies to assess mineralization status."}, {"s": "Excessive osteoid without adequate mineralization is a histological hallmark of conditions like osteomalacia.", "a": true, "e": "Correct \u2014 this reflects impaired mineralization despite ongoing matrix production."}, {"s": "Bone's vascular supply, delivered via nutrient arteries and periosteal vessels, supports its relatively high metabolic activity compared to cartilage.", "a": true, "e": "Correct \u2014 this vascularity is a key structural and functional distinction from cartilage."}, {"s": "A well-rounded understanding of osteon structure, bone cell types, and bone formation processes provides a strong foundation for the remainder of ANA203's histology content.", "a": true, "e": "Correct \u2014 bone histology integrates many concepts from earlier topics, like connective tissue and cartilage."}, {"s": "The distinct hardness of bone, compared to the flexibility of cartilage, directly reflects their differing degrees of matrix mineralization.", "a": true, "e": "Correct \u2014 mineralization level is the key structural difference driving these mechanical property differences."}, {"s": "Understanding both the cellular and structural aspects of bone tissue is essential before transitioning to the cytology portion of the ANA203 curriculum.", "a": true, "e": "Correct \u2014 this completes the histology component before moving into cellular-level (cytology) study."}, {"s": "Together, cartilage, bone, and blood represent the three specialized connective tissue types studied within ANA203's histology curriculum.", "a": true, "e": "Correct \u2014 these three, alongside connective tissue proper, complete the connective tissue category in this course."}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  const q = QUESTIONS[order[current]];
  document.getElementById('statementText').textContent = q.s;
  document.getElementById('qCounter').textContent = `Question ${current + 1} / ${order.length}`;
  document.getElementById('progressFill').style.width = `${(current / order.length) * 100}%`;
  document.getElementById('liveScore').textContent = `✅ ${correctCount}   ❌ ${incorrectCount}`;
  selected = null;
  locked = false;
  document.getElementById('trueBtn').className = 'tf-btn';
  document.getElementById('falseBtn').className = 'tf-btn';
  document.getElementById('lockBtn').disabled = true;
  document.getElementById('lockBtn').style.display = 'block';
  document.getElementById('feedbackBox').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('trueBtn').disabled = false;
  document.getElementById('falseBtn').disabled = false;
}

function selectAnswer(val) {
  if (locked) return;
  selected = val;
  document.getElementById('trueBtn').className = 'tf-btn' + (val === true ? ' selected-true' : '');
  document.getElementById('falseBtn').className = 'tf-btn' + (val === false ? ' selected-false' : '');
  document.getElementById('lockBtn').disabled = false;
}

async function lockAnswer() {
  if (selected === null || locked) return;
  locked = true;
  try{
    const { recordCbtQuestionUsed } = await import('../cbt-lock.js');
    if(recordCbtQuestionUsed) await recordCbtQuestionUsed('ana203-nerve-blood-cartilage-bone');
  }catch(e){ /* dormant/misconfigured lock never blocks the quiz */ }
  const q = QUESTIONS[order[current]];
  const isCorrect = selected === q.a;
  document.getElementById('trueBtn').disabled = true;
  document.getElementById('falseBtn').disabled = true;
  document.getElementById('lockBtn').style.display = 'none';

  const fb = document.getElementById('feedbackBox');
  const lbl = document.getElementById('feedbackLabel');
  const txt = document.getElementById('feedbackText');

  if (isCorrect) {
    correctCount++;
    fb.className = 'feedback correct';
    lbl.textContent = '✅ CORRECT';
  } else {
    incorrectCount++;
    fb.className = 'feedback incorrect';
    lbl.textContent = `❌ INCORRECT — Correct answer: ${q.a ? 'TRUE' : 'FALSE'}`;
    wrongAnswers.push({ s: q.s, correct: q.a, chosen: selected, e: q.e });
  }
  txt.textContent = q.e;
  document.getElementById('liveScore').textContent = `✅ ${correctCount}   ❌ ${incorrectCount}`;
  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
  current++;
  loadQuestion();
}

function showFinal() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('finalCard').style.display = 'block';
  const total = order.length;
  const pct = Math.round((correctCount / total) * 100);
  document.getElementById('finalScoreText').textContent = pct + '%';
  document.getElementById('finalCorrect').textContent = correctCount;
  document.getElementById('finalIncorrect').textContent = incorrectCount;
  document.getElementById('finalTotal').textContent = total;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  wrongAnswers.forEach(w => {
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `<div class="q">${w.s}</div><div class="ans">Your answer: ${w.chosen ? 'TRUE' : 'FALSE'} &nbsp;|&nbsp; Correct: ${w.correct ? 'TRUE' : 'FALSE'}<br>${w.e}</div>`;
    reviewList.appendChild(div);
  });
}

function toggleReview() {
  const rl = document.getElementById('reviewList');
  rl.style.display = rl.style.display === 'block' ? 'none' : 'block';
}

function restartQuiz() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  current = 0;
  correctCount = 0;
  incorrectCount = 0;
  wrongAnswers = [];
  document.getElementById('finalCard').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('reviewList').style.display = 'none';
  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
