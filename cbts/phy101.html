 2, "explanation": "This is the law of equal areas.", "hack": "Second law = equal areas, equal times."}, {"q": "According to Kepler's second law, a planet moves fastest when it is", "options": ["Farthest from the Sun", "At the minor axis", "Exactly at the focus", "Closest to the Sun"], "answer": 3, "explanation": "To sweep equal areas, the planet must go faster at small radius.", "hack": "Near the Sun = hurry."}, {"q": "Kepler's third law says that T² is proportional to", "options": ["The cube of the semi-major axis", "The square of the semi-major axis", "The semi-major axis itself", "The mass of the planet"], "answer": 0, "explanation": "T² = K a³ (Eq. 12.9).", "hack": "T squared ~ a cubed."}, {"q": "Newton's form of Kepler's third law is", "options": ["T² = (4π/GMₛ) a²", "T² = (4π²/GMₛ) a³", "T = (4π²/GMₛ) a³", "T² = GMₛ a³ / 4π²"], "answer": 1, "explanation": "K = 4π²/(GMₛ), found from gravitation as the centripetal force.", "hack": "Four pi squared over GM."}, {"q": "For orbits around the Sun, K is about", "options": ["2.97 × 10¹⁹ s²/m³", "9.80 × 10⁻¹⁹ s²/m³", "2.97 × 10⁻¹⁹ s²/m³", "6.67 × 10⁻¹¹ s²/m³"], "answer": 2, "explanation": "The notes give K = K_s ≈ 2.97 × 10⁻¹⁹ s²/m³.", "hack": "Negative nineteen: tiny."}, {"q": "In Kepler's third law the constant K depends on", "options": ["The mass of the planet only", "Both masses equally", "The planet's speed", "The mass of the Sun, not on the planet"], "answer": 3, "explanation": "K = 4π²/(GMₛ) is independent of the planet's mass.", "hack": "Sun's mass in, planet's mass out."}, {"q": "In T² = K a³, 'a' denotes the", "options": ["Semi-major axis of the orbit", "Semi-minor axis of the orbit", "Distance between the foci", "Orbit's circumference"], "answer": 0, "explanation": "a = AB/2 is half the longest diameter of the ellipse.", "hack": "a is the long half-axis."}, {"q": "The eccentricity of a circle is", "options": ["One", "Zero", "Infinity", "Equal to a"], "answer": 1, "explanation": "The focus-to-centre distance is ea, with e = 0 for a circle.", "hack": "Circle = zero eccentricity."}, {"q": "As the eccentricity of an ellipse gets larger, the ellipse becomes", "options": ["More circular", "Smaller in a", "More elongated", "A straight point"], "answer": 2, "explanation": "Large e means a more pronounced (stretched) ellipse.", "hack": "e up = stretched."}, {"q": "The distance from the centre to each focus of an ellipse is", "options": ["a / e", "e + a", "b / a", "e × a"], "answer": 3, "explanation": "The notes state 'distance from one focus to the centre is ea'.", "hack": "Focus distance = ea."}, {"q": "The escape speed is the speed needed", "options": ["To leave the Earth and never return", "To stay in a circular orbit", "To fall from rest in a second", "To lift off at constant weight"], "answer": 0, "explanation": "At escape speed total energy is zero, so the object goes to infinity.", "hack": "Escape = never come back."}, {"q": "The expression for escape speed from a planet is", "options": ["v = √(GM / R)", "v = √(2GM / R)", "v = 2GM / R", "v = √(2GM R)"], "answer": 1, "explanation": "From ½mv² = GMm/R (Eq. 12.12).", "hack": "Root of 2GM over R."}, {"q": "The escape speed from the Earth is about", "options": ["9.8 km/s", "7.9 km/s", "11.2 km/s", "3.0 km/s"], "answer": 2, "explanation": "v_esc = √(2GMₑ/Rₑ) ≈ 11.2 km/s.", "hack": "Earth = 11.2."}, {"q": "The escape speed of an object depends on", "options": ["The object's mass and the planet's radius", "The object's mass only", "Neither mass, only the planet's radius", "The planet's mass and radius, not the object's mass"], "answer": 3, "explanation": "m cancels in ½mv² = GMm/R.", "hack": "Bullet or rocket: same escape speed."}, {"q": "Of the bodies listed in the notes, the one with the largest escape speed is", "options": ["Jupiter (60 km/s)", "Saturn (36 km/s)", "Neptune (24 km/s)", "Earth (11.2 km/s)"], "answer": 0, "explanation": "Jupiter has 60 km/s, Saturn 36, Neptune 24, Uranus 22.", "hack": "Biggest planet, biggest escape speed."}, {"q": "The Moon's escape speed in the notes' table is about", "options": ["11.2 km/s", "2.3 km/s", "5.0 km/s", "4.3 km/s"], "answer": 1, "explanation": "Moon 2.3 km/s, Mars 5.0 km/s, Mercury 4.3 km/s.", "hack": "Moon: low gravity, low v_esc."}, {"q": "In physics, work is done on an object when", "options": ["A force is applied but nothing moves", "The object only holds still at a height", "A force moves the object through a distance", "The object has mass"], "answer": 2, "explanation": "Work needs both force and displacement.", "hack": "No movement, no work."}, {"q": "A person holding a heavy suitcase stationary does, in the physics sense,", "options": ["Positive work equal to mg", "Negative work equal to mg", "Work equal to mass × time", "No work on the suitcase"], "answer": 3, "explanation": "The displacement is zero, so W = Fd cosθ = 0.", "hack": "Holding still = zero work."}, {"q": "The work done by a constant force F at angle θ to the displacement d is", "options": ["W = F d cosθ", "W = F d sinθ", "W = F d / cosθ", "W = F cosθ / d"], "answer": 0, "explanation": "W is the scalar (dot) product F·d.", "hack": "Cosine goes with the component along d."}, {"q": "The SI unit of work is", "options": ["Newton (N)", "Joule (J)", "Watt (W)", "Pascal (Pa)"], "answer": 1, "explanation": "1 J = 1 N·m.", "hack": "Joule for work and energy."}, {"q": "One joule is the work done by a force of 1 N moving an object", "options": ["For 1 s at constant speed", "1 m at right angles to the force", "1 m in the direction of the force", "1 kg through 1 m"], "answer": 2, "explanation": "J = N·m with F and d parallel.", "hack": "1 N × 1 m."}, {"q": "Work is a", "options": ["Vector quantity along the force", "Vector quantity along displacement", "Scalar that is always positive", "Scalar quantity, positive or negative"], "answer": 3, "explanation": "W = F·d is a scalar and can be negative.", "hack": "Dot product gives a scalar."}, {"q": "The work done is zero when the angle between the force and displacement is", "options": ["90°", "0°", "45°", "180°"], "answer": 0, "explanation": "cos 90° = 0, e.g. the normal force on a horizontal slide.", "hack": "Perpendicular means no work."}, {"q": "The work done is negative when the angle between F and d is", "options": ["Between 0° and 90°", "Between 90° and 180°", "Exactly 0°", "Exactly 90°"], "answer": 1, "explanation": "cosθ is negative for obtuse angles, e.g. friction at 180°.", "hack": "Opposing force = negative work."}, {"q": "The work done by friction on a sliding block is", "options": ["Positive", "Always zero", "Negative", "Equal to the weight"], "answer": 2, "explanation": "Friction opposes motion (θ = 180°) so W = −fd.", "hack": "Friction always takes energy out."}, {"q": "Energy is defined as", "options": ["The rate of doing work", "The force over a distance", "The product of mass and speed", "The capacity to perform work"], "answer": 3, "explanation": "Energy and work share the joule.", "hack": "Energy = ability to do work."}, {"q": "Potential energy is energy due to an object's", "options": ["Position", "Motion", "Charge only", "Colour"], "answer": 0, "explanation": "Stored energy due to position or configuration.", "hack": "Potential = position."}, {"q": "The gravitational potential energy of a mass m at height h is", "options": ["½mgh", "mgh", "mg/h", "mh/g"], "answer": 1, "explanation": "PE = weight × height.", "hack": "Weight times height."}, {"q": "Kinetic energy is energy due to an object's", "options": ["Position", "Height", "Motion", "Temperature only"], "answer": 2, "explanation": "KE = ½mv².", "hack": "Kinetic = motion."}, {"q": "The kinetic energy of an object of mass m and speed v is", "options": ["m v²", "½ m v", "m v / 2", "½ m v²"], "answer": 3, "explanation": "KE = ½mv².", "hack": "Half m v squared."}, {"q": "If the speed of a body is doubled, its kinetic energy becomes", "options": ["Four times as large", "Twice as large", "Eight times as large", "Unchanged"], "answer": 0, "explanation": "KE ∝ v², so 2² = 4.", "hack": "Speed doubles, KE quadruples."}, {"q": "If the mass of a body is doubled at the same speed, its kinetic energy becomes", "options": ["Four times as large", "Twice as large", "Half as large", "Unchanged"], "answer": 1, "explanation": "KE ∝ m.", "hack": "KE is linear in mass."}, {"q": "The work–energy theorem states that the net work done on a body equals", "options": ["Its final potential energy", "Its change in momentum", "The change in its kinetic energy", "The force multiplied by time"], "answer": 2, "explanation": "W_net = KE_f − KE_i = ΔKE.", "hack": "Net work = ΔKE."}, {"q": "A body at rest is accelerated so that its KE rises from 0 to 200 J. The net work done on it is", "options": ["100 J", "400 J", "0 J", "200 J"], "answer": 3, "explanation": "W = ΔKE = 200 − 0.", "hack": "Work = change in KE."}, {"q": "The law of conservation of energy states that energy", "options": ["Cannot be created or destroyed, only transformed", "Is always destroyed by friction", "Is created whenever work is done", "Is conserved only for light"], "answer": 0, "explanation": "Total energy stays constant; forms change.", "hack": "Energy only changes costume."}, {"q": "In a mechanical system with no friction, the total energy is", "options": ["Decreasing", "Constant", "Increasing", "Zero"], "answer": 1, "explanation": "PE + KE stays constant when only conservative forces act.", "hack": "No friction, no loss."}, {"q": "A body falls freely from rest through height h. Just before it hits the ground, its KE equals", "options": ["Half its original PE", "Zero", "Its original potential energy mgh", "Twice its original PE"], "answer": 2, "explanation": "All the PE has turned into KE.", "hack": "Top PE = bottom KE."}, {"q": "At the half-way point of a free fall from height h, the potential and kinetic energies are", "options": ["PE twice KE", "KE twice PE", "Both zero", "Equal, each mgh/2"], "answer": 3, "explanation": "At h/2: PE = mg(h/2) and KE = mgh − mgh/2.", "hack": "Half-way: half PE, half KE."}, {"q": "The speed of a body falling freely from rest through height h is", "options": ["v = √(2gh)", "v = √(gh)", "v = 2gh", "v = gh²"], "answer": 0, "explanation": "mgh = ½mv².", "hack": "Root two g h."}, {"q": "For a swinging pendulum bob, the maximum speed occurs at the", "options": ["Highest point", "Lowest point", "Mid-height", "Point of maximum PE"], "answer": 1, "explanation": "KE is greatest where PE is smallest.", "hack": "Lowest point = fastest."}, {"q": "At the highest point of a swing, the bob has", "options": ["Only kinetic energy", "Maximum kinetic energy", "Only potential energy", "Zero total energy"], "answer": 2, "explanation": "It is momentarily at rest, so KE = 0.", "hack": "Top of swing: v = 0."}, {"q": "A stretched rubber band possesses", "options": ["Kinetic energy only", "No energy", "Charge only", "Potential energy"], "answer": 3, "explanation": "Stored by its stretched configuration.", "hack": "Stretched means stored."}], "tutorial": [{"q": "Problem 12.1(a): A 50 kg body is raised to 2 m above the ground. Its potential energy is (g = 9.8 m/s²)", "options": ["980 J", "490 J", "100 J", "1960 J"], "answer": 0, "explanation": "PE = mgh = 50 × 9.8 × 2 = 980 J.", "hack": "Multiply mass × 9.8 × height.", "src": "Problem 12.1(a)"}, {"q": "Problem 12.1(b)(i): The body is allowed to fall. Its kinetic energy when half-way down is", "options": ["980 J", "490 J", "245 J", "0 J"], "answer": 1, "explanation": "At h/2, half of mgh has become KE: ½ × 980 = 490 J.", "hack": "Half-way → half the PE has become KE.", "src": "Problem 12.1(b)"}, {"q": "Problem 12.1(b)(ii): The kinetic energy just before impact with the floor is", "options": ["490 J", "1960 J", "980 J", "0 J"], "answer": 2, "explanation": "All PE converts to KE: mgh = 980 J.", "hack": "Just before impact: KE = original PE.", "src": "Problem 12.1(b)"}, {"q": "Problem 12.1: At the half-way point of this fall, the potential energy is", "options": ["980 J", "245 J", "0 J", "490 J"], "answer": 3, "explanation": "PE = mg(h/2) = 50 × 9.8 × 1 = 490 J.", "hack": "Half height, half PE.", "src": "Problem 12.1"}, {"q": "Problem 12.2: A trailer pulls a car with 900 N on a level road at 70 km/h. The distance covered in 15 min is about", "options": ["17.5 km", "10.5 km", "1.05 km", "70 km"], "answer": 0, "explanation": "d = vt = (70 km/h)(0.25 h) = 17.5 km.", "hack": "15 min = 0.25 h.", "src": "Problem 12.2"}, {"q": "Problem 12.2: The work done by the trailer on the car in those 15 minutes is about", "options": ["1.58 × 10⁶ J", "1.58 × 10⁷ J", "1.58 × 10⁸ J", "6.3 × 10⁷ J"], "answer": 1, "explanation": "W = Fd = 900 × 17 500 = 1.575 × 10⁷ J ≈ 1.58 × 10⁷ J.", "hack": "Convert km to m before multiplying.", "src": "Problem 12.2"}, {"q": "Problem 12.2: The speed 70 km/h expressed in m/s is about", "options": ["252 m/s", "7.0 m/s", "19.4 m/s", "42.0 m/s"], "answer": 2, "explanation": "70 ÷ 3.6 = 19.44 m/s.", "hack": "km/h ÷ 3.6 = m/s.", "src": "Problem 12.2"}, {"q": "Problem 12.3: A 1600 kg vehicle moves at 15 m/s on a level road. Its initial kinetic energy is", "options": ["360 kJ", "24 kJ", "90 kJ", "180 kJ"], "answer": 3, "explanation": "KE = ½ × 1600 × 15² = 180 000 J.", "hack": "½ m v² with v squared first.", "src": "Problem 12.3"}, {"q": "Problem 12.3: The brakes do 90 kJ of work. The vehicle's remaining kinetic energy is", "options": ["90 kJ", "180 kJ", "270 kJ", "0 kJ"], "answer": 0, "explanation": "KE_f = 180 − 90 = 90 kJ (W = ΔKE with W negative).", "hack": "Braking work subtracts from KE.", "src": "Problem 12.3"}, {"q": "Problem 12.3: After the 90 kJ of braking work, the vehicle's speed is about", "options": ["7.5 m/s", "10.6 m/s", "15 m/s", "5.3 m/s"], "answer": 1, "explanation": "v = √(2 × 90 000 / 1600) = √112.5 = 10.6 m/s.", "hack": "½mv² = 90 000 → v² = 112.5.", "src": "Problem 12.3"}, {"q": "Problem 12.3: The total work required to stop the vehicle completely is", "options": ["90 kJ", "360 kJ", "180 kJ", "15 kJ"], "answer": 2, "explanation": "W = KE_i − 0 = 180 kJ.", "hack": "Stopping work = initial KE.", "src": "Problem 12.3"}], "exercises": [{"q": "Example 12.1: Three 0.3 kg balls sit at the corners of a 0.4–0.3–0.5 m right triangle. The force on the cue ball from the ball 0.4 m away is", "options": ["6.67 × 10⁻¹¹ N", "7.65 × 10⁻¹¹ N", "1.50 × 10⁻¹⁰ N", "3.75 × 10⁻¹¹ N"], "answer": 3, "explanation": "F = G(0.3)(0.3)/0.4² = 6.67×10⁻¹¹ × 0.09/0.16 = 3.75 × 10⁻¹¹ N.", "hack": "Smaller distance, larger force: 0.3 m pulls harder than 0.4 m.", "src": "Example 12.1"}, {"q": "Example 12.1: The force from the ball 0.3 m away is", "options": ["6.67 × 10⁻¹¹ N", "3.75 × 10⁻¹¹ N", "7.65 × 10⁻¹¹ N", "2.25 × 10⁻¹¹ N"], "answer": 0, "explanation": "F = G(0.3)(0.3)/0.3² = G = 6.67 × 10⁻¹¹ N.", "hack": "Equal masses and r = 0.3 → 0.09/0.09 = 1.", "src": "Example 12.1"}, {"q": "Example 12.1: The magnitude of the net force on the cue ball (forces at right angles) is", "options": ["1.04 × 10⁻¹⁰ N", "7.65 × 10⁻¹¹ N", "2.92 × 10⁻¹¹ N", "3.75 × 10⁻¹¹ N"], "answer": 1, "explanation": "F = √(6.67² + 3.75²) × 10⁻¹¹ = 7.65 × 10⁻¹¹ N.", "hack": "Perpendicular forces → Pythagoras.", "src": "Example 12.1"}, {"q": "Example 12.1: The direction of the net force from the larger component is θ = tan⁻¹(3.75/6.67) =", "options": ["60.7°", "45.0°", "29.3°", "33.7°"], "answer": 2, "explanation": "tan θ = 0.562, so θ = 29.3°.", "hack": "tan θ = opposite/adjacent = 0.562.", "src": "Example 12.1"}, {"q": "Exercise 12.1: Masses of 200 kg and 500 kg are 25 m apart. The gravitational attraction is about", "options": ["2.67 × 10⁻⁷ N", "1.07 × 10⁻⁵ N", "4.27 × 10⁻¹⁰ N", "1.07 × 10⁻⁸ N"], "answer": 3, "explanation": "F = 6.67×10⁻¹¹ × 200 × 500 / 25² = 1.07 × 10⁻⁸ N.", "hack": "Tiny G × 10⁵ ÷ 625.", "src": "Exercise 12.1"}, {"q": "Example 12.2: A space station weighs 4.22 × 10⁶ N on Earth. Its mass is about", "options": ["4.31 × 10⁵ kg", "4.14 × 10⁷ kg", "4.22 × 10⁶ kg", "3.80 × 10⁶ kg"], "answer": 0, "explanation": "m = W/g = 4.22×10⁶ ÷ 9.8 = 4.31 × 10⁵ kg.", "hack": "Mass = weight ÷ 9.8.", "src": "Example 12.2"}, {"q": "Example 12.2: The value of g at an altitude of 350 km is about", "options": ["9.80 m/s²", "8.83 m/s²", "0.00 m/s²", "7.50 m/s²"], "answer": 1, "explanation": "g = GMₑ/(Rₑ + h)² = 8.83 m/s². The notes also write 320 km by mistake in one line; the calculation uses 350 km.", "hack": "At 350 km g is only about 10% less.", "src": "Example 12.2"}, {"q": "Example 12.2: The weight of that space station in orbit at 350 km is about", "options": ["4.22 × 10⁶ N", "3.80 × 10⁵ N", "3.80 × 10⁶ N", "0 N"], "answer": 2, "explanation": "W = mg = 4.31×10⁵ × 8.83 = 3.80 × 10⁶ N.", "hack": "Weight drops only ~10% at ISS height. Astronauts float because of free fall, not zero g.", "src": "Example 12.2"}, {"q": "Exercise 12.3: Take M_sun = 2×10³⁰ kg, M_earth = 6×10²⁴ kg, r = 1.5×10¹¹ m. The Sun–Earth gravitational force is about", "options": ["5.34 × 10²¹ N", "3.56 × 10²⁰ N", "1.07 × 10²³ N", "3.56 × 10²² N"], "answer": 3, "explanation": "F = 6.67×10⁻¹¹ × 2×10³⁰ × 6×10²⁴ / (1.5×10¹¹)² = 3.56 × 10²² N.", "hack": "Square the distance: (1.5e11)² = 2.25e22.", "src": "Exercise 12.3"}, {"q": "Example 12.3: With T = 3.156 × 10⁷ s and a = 1.496 × 10¹¹ m, the mass of the Sun is about", "options": ["1.99 × 10³⁰ kg", "1.99 × 10²⁷ kg", "5.98 × 10²⁴ kg", "1.99 × 10³³ kg"], "answer": 0, "explanation": "M = 4π²a³/(GT²) = 1.99 × 10³⁰ kg.", "hack": "Known mass of the Sun: ≈ 2 × 10³⁰ kg.", "src": "Example 12.3"}, {"q": "Exercise 12.4: Mercury (orbital radius 5.8 × 10¹⁰ m) goes round the Sun (1.99 × 10³⁰ kg). Its period in Earth days is about", "options": ["365 days", "88 days", "225 days", "27 days"], "answer": 1, "explanation": "T = 2π√(a³/GM) ≈ 7.6 × 10⁶ s ≈ 88 days.", "hack": "Mercury's year is 88 days, shorter than Venus (225) and Earth (365).", "src": "Exercise 12.4"}, {"q": "Exercise 12.5: Using Mₑ = 5.97×10²⁴ kg, M_moon = 7.35×10²² kg and r = 3.84×10⁸ m, the force of Earth on the Moon is about", "options": ["1.98 × 10²² N", "2.04 × 10¹⁷ N", "1.98 × 10²⁰ N", "7.65 × 10²⁰ N"], "answer": 2, "explanation": "F = GMₑM_m/r² = 1.98 × 10²⁰ N.", "hack": "Convert the distance to metres: 3.84 × 10⁸ m.", "src": "Exercise 12.5"}, {"q": "Exercise 12.6: An 80 kg man stands 10 m from a 65 kg woman. The gravitational attraction between them is about", "options": ["3.5 × 10⁻⁶ N", "5.2 × 10⁻⁷ N", "3.5 × 10⁻¹¹ N", "3.5 × 10⁻⁹ N"], "answer": 3, "explanation": "F = 6.67×10⁻¹¹ × 80 × 65 / 10² = 3.47 × 10⁻⁹ N.", "hack": "Tiny: this is why people don't visibly attract.", "src": "Exercise 12.6"}, {"q": "Exercise 12.7: The force the Earth exerts on the Moon compared with the force the Moon exerts on the Earth is", "options": ["Equal in magnitude", "Much larger, because Earth is heavier", "Much smaller, because the Moon is lighter", "Zero, because they are far apart"], "answer": 0, "explanation": "Newton's third law: action and reaction are equal and opposite (both ≈ 1.98 × 10²⁰ N).", "hack": "Third law beats mass difference.", "src": "Exercise 12.7"}, {"q": "Exercise 12.8(i): A satellite in a circular orbit at altitude h has speed", "options": ["v = GMₑ/(Rₑ + h)", "v = √(GMₑ/(Rₑ + h))", "v = √(GMₑ/h)", "v = √(2GMₑ/(Rₑ + h))"], "answer": 1, "explanation": "Gravity supplies the centripetal force: GMₑm/r² = mv²/r with r = Rₑ + h.", "hack": "Escape has the 2; orbit does not.", "src": "Exercise 12.8(i)"}, {"q": "Exercise 12.8(ii): A geosynchronous satellite has orbital period", "options": ["90 minutes", "12 hours", "24 hours", "27 days"], "answer": 2, "explanation": "It must turn once per sidereal day to stay over one point.", "hack": "Geosynchronous = same period as Earth's spin.", "src": "Exercise 12.8(ii)"}, {"q": "Exercise 12.8(ii): The radius of a geosynchronous orbit is about", "options": ["6.4 × 10⁶ m", "3.8 × 10⁸ m", "4.2 × 10⁵ m", "4.2 × 10⁷ m"], "answer": 3, "explanation": "r = (GMₑT²/4π²)^(1/3) = 4.22 × 10⁷ m.", "hack": "About 36 000 km above the surface.", "src": "Exercise 12.8(ii)"}, {"q": "Exercise 12.8(ii): The speed of a geosynchronous satellite through space is about", "options": ["3.07 km/s", "7.9 km/s", "11.2 km/s", "0.46 km/s"], "answer": 0, "explanation": "v = 2πr/T = 2π(4.22×10⁷)/86 400 ≈ 3.07 km/s.", "hack": "Farther orbit means slower speed.", "src": "Exercise 12.8(ii)"}, {"q": "Exercise 12.9: Moon 2 orbits at radius 2r. If Moon 1 at r feels force F, the force on Moon 2 (equal mass) is", "options": ["F/2", "F/4", "2F", "4F"], "answer": 1, "explanation": "F ∝ 1/r², so doubling r gives one quarter.", "hack": "Inverse square: 2² = 4.", "src": "Exercise 12.9"}, {"q": "Exercise 12.10: A ball thrown horizontally so fast that it orbits close to the Earth has acceleration of magnitude about", "options": ["0 m/s²", "19.6 m/s²", "9.8 m/s² (≈ g)", "4.9 m/s²"], "answer": 2, "explanation": "Only gravity acts; the centripetal acceleration equals g at that height.", "hack": "Orbit is continuous free fall.", "src": "Exercise 12.10"}, {"q": "Exercise 12.11: Using Rₑ = 6.37 × 10⁶ m and g = 9.80 m/s², the average density of the Earth is about", "options": ["1.0 × 10³ kg/m³", "5.5 × 10⁶ kg/m³", "2.7 × 10² kg/m³", "5.5 × 10³ kg/m³"], "answer": 3, "explanation": "ρ = 3g/(4πGRₑ) ≈ 5.5 × 10³ kg/m³.", "hack": "Earth is 5.5 times denser than water.", "src": "Exercise 12.11"}, {"q": "Exercise 12.12: The escape speed from the Earth's surface is about", "options": ["11.2 km/s", "7.9 km/s", "9.8 km/s", "2.3 km/s"], "answer": 0, "explanation": "v = √(2GMₑ/Rₑ) = 1.12 × 10⁴ m/s.", "hack": "Earth escape: 11.2 km/s.", "src": "Exercise 12.12"}, {"q": "Exercise 12.12: The kinetic energy needed per kilogram to escape from the Earth is about", "options": ["6.3 × 10³ J/kg", "6.3 × 10⁷ J/kg", "1.2 × 10⁵ J/kg", "9.8 × 10⁷ J/kg"], "answer": 1, "explanation": "KE/m = ½v² = ½(1.12×10⁴)² = 6.3 × 10⁷ J/kg.", "hack": "Multiply by the mass to get the total energy.", "src": "Exercise 12.12"}, {"q": "Example 12.4: A 5.0 kg block is drawn 6 m at constant speed by a 10 N rope at 30° above horizontal. The work done by the rope is", "options": ["60.0 J", "30.0 J", "52.0 J", "26.0 J"], "answer": 2, "explanation": "W = Fd cos30° = 10 × 6 × 0.866 = 52.0 J.", "hack": "Use the horizontal component.", "src": "Example 12.4"}, {"q": "Example 12.4: The work done by friction on the block is", "options": ["+52.0 J", "−60.0 J", "0 J", "−52.0 J"], "answer": 3, "explanation": "Constant speed means friction = F cos30°, opposite to d, so W = −52.0 J.", "hack": "Friction at 180° gives negative work.", "src": "Example 12.4"}, {"q": "Example 12.4: The total (net) work done on the block is", "options": ["0 J", "52.0 J", "104 J", "−52.0 J"], "answer": 0, "explanation": "52.0 + (−52.0) = 0, consistent with no change in KE.", "hack": "Constant speed → ΔKE = 0 → W_net = 0.", "src": "Example 12.4"}, {"q": "Example 12.4: The coefficient of kinetic friction is about", "options": ["0.05", "0.20", "0.50", "0.87"], "answer": 1, "explanation": "N = mg − F sin30° = 49 − 5 = 44 N; f = 10 cos30° = 8.66 N; μ = 8.66/44 ≈ 0.20.", "hack": "The rope lifts the block partly: N < mg.", "src": "Example 12.4"}, {"q": "Example 12.5: A proton accelerates at 3.6 × 10¹⁵ m/s² through 3.5 cm from u = 2.4 × 10⁷ m/s. The final v² is about", "options": ["3.28 × 10¹⁴ m²/s²", "5.76 × 10¹⁴ m²/s²", "8.28 × 10¹⁴ m²/s²", "2.52 × 10¹⁴ m²/s²"], "answer": 2, "explanation": "v² = u² + 2as = 5.76×10¹⁴ + 2.52×10¹⁴ = 8.28 × 10¹⁴. (The notes print 3.28, a slip.)", "hack": "Add the two terms.", "src": "Example 12.5"}, {"q": "Example 12.5: The change in the proton's kinetic energy (m = 1.67 × 10⁻²⁷ kg) is about", "options": ["2.1 × 10⁻¹⁰ J", "4.2 × 10⁻¹³ J", "2.1 × 10⁻²⁷ J", "2.1 × 10⁻¹³ J"], "answer": 3, "explanation": "ΔKE = ½m(v² − u²) = m a s = 1.67×10⁻²⁷ × 3.6×10¹⁵ × 0.035 = 2.1 × 10⁻¹³ J.", "hack": "ΔKE = mas, no need for v at all.", "src": "Example 12.5"}, {"q": "Example 12.6: A 2 kg body moves at 8 m/s along +x and a constant 0.5 N retarding force acts. The distance to stop is", "options": ["128 m", "64 m", "256 m", "32 m"], "answer": 0, "explanation": "−0.5 d = 0 − ½(2)(8²) = −64 → d = 128 m.", "hack": "d = initial KE ÷ force = 64 ÷ 0.5.", "src": "Example 12.6"}, {"q": "Example 12.6: The work done by the retarding force in stopping the body is", "options": ["+64 J", "−64 J", "−128 J", "0 J"], "answer": 1, "explanation": "W = ΔKE = 0 − 64 = −64 J.", "hack": "Stopping removes all KE.", "src": "Example 12.6"}, {"q": "Example 12.7: A bob swings between 1.5 m (lowest) and 2.5 m (highest) above the ground. Its maximum speed is about", "options": ["3.1 m/s", "6.3 m/s", "4.4 m/s", "9.8 m/s"], "answer": 2, "explanation": "v = √(2g(h₂ − h₁)) = √(2 × 9.8 × 1.0) = 4.4 m/s.", "hack": "Use the height difference, not the heights.", "src": "Example 12.7"}, {"q": "Example 12.7: Why does the answer not depend on the mass of the bob?", "options": ["Because the bob has no weight at the top", "Because tension does negative work", "Because g depends on the bob", "Mass cancels in ½mv² = mg(h₂ − h₁)"], "answer": 3, "explanation": "m appears on both sides of the energy equation and cancels.", "hack": "Energy method: mass cancels.", "src": "Example 12.7"}, {"q": "Example 12.7: At the lowest point of the swing the bob has", "options": ["Maximum KE and minimum PE", "Maximum PE and zero KE", "Equal PE and KE", "Zero total energy"], "answer": 0, "explanation": "PE converts to KE as the bob descends.", "hack": "Low = fast.", "src": "Example 12.7"}]}];
const $=id=>document.getElementById(id);
const SECS=[["concept","Concept questions"],["tutorial","Tutorial"],["exercises","Past Questions"],["all","Whole Chapter"]];
const TOTAL=DATA.reduce((a,d)=>a+d.concept.length+d.tutorial.length+d.exercises.length,0);
const MODES=[
 {id:"full",name:"Full CBT",big:TOTAL,n:TOTAL},
 {id:"quick",name:"Quick Drill",big:50,n:50},
 {id:"half",name:"Half Run",big:Math.round(TOTAL/2),n:Math.round(TOTAL/2)},
 {id:"session",name:"By Session",big:"🎯"}];
let mode="full",run=[],i=0,score=0,locked=false;
function fy(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a}
function pool(ch,sec){const c=DATA.find(d=>d.chapter==ch);const t=s=>c[s].map(q=>({...q,ch:c.chapter,sec:s,ct:c.title}));return sec=="all"?[...t("concept"),...t("tutorial"),...t("exercises")]:t(sec)}
function allQs(){return DATA.flatMap(d=>pool(d.chapter,"all"))}
// UI setup
$("tiles").innerHTML=MODES.map(m=>`<button class="tile" data-m="${m.id}"><b>${m.big}</b>${m.name}</button>`).join("");
function setMode(m){mode=m;document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("sel",t.dataset.m==m))}
document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{setMode(t.dataset.m);if(t.dataset.m=="session")showChapters()});setMode("full");
let sesBack=()=>show("menu");
function showChapters(){
 show("session");$("sesTitle").textContent="By Session";
 const S=[["concept","Concept"],["tutorial","Tutorial"],["exercises","Past Questions"]];
 $("sesBody").innerHTML=DATA.map(d=>`<div class="chh"><i>${d.chapter}</i>Chapter ${d.chapter}: ${esc(d.title)}</div><div class="list">`+S.map(([k,n])=>`<button class="row" data-c="${d.chapter}" data-s="${k}"><span>${n}</span><small>${d[k].length} Qs</small></button>`).join("")+`</div>`).join("");
 document.querySelectorAll("#sesBody .row").forEach(b=>b.onclick=()=>startRun(pool(+b.dataset.c,b.dataset.s)));
 sesBack=()=>show("menu")}
$("sesBack").onclick=()=>sesBack();
function show(id){["menu","session","quiz","result"].forEach(s=>$(s).classList.toggle("hide",s!=id));scrollTo(0,0)}
function startRun(qs){
 run=fy(qs).map(q=>({q,order:fy([0,1,2,3]),pick:null}));
 i=0;score=0;show("quiz");render()}
$("start").onclick=()=>{
 if(mode=="session"){showChapters();return}
 startRun(fy(allQs()).slice(0,MODES.find(m=>m.id==mode).n))};
function render(){
 const r=run[i],q=r.q;locked=false;
 $("qn").textContent=`Question ${i+1} / ${run.length}`;$("sc").textContent=`Score ${score}`;
 $("pb").style.width=(i/run.length*100)+"%";
 const secName=SECS.find(s=>s[0]==q.sec)[1];
 $("qbody").innerHTML=`<span class="tag">Ch ${q.ch} · ${secName}${q.src?" · "+q.src:""}</span><div class="q">${esc(q.q)}</div>`+
  r.order.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="l">${"ABCD"[k]}</span><span>${esc(q.options[oi])}</span></button>`).join("")+`<div id="fb"></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
 $("next").disabled=true;$("next").textContent=i==run.length-1?"SEE RESULTS":"NEXT";
}
function choose(k){
 if(locked)return;locked=true;const r=run[i],q=r.q;r.pick=r.order[k];
 const ok=r.pick==q.answer;if(ok)score++;
 document.querySelectorAll(".opt").forEach((b,idx)=>{b.disabled=true;if(r.order[idx]==q.answer)b.classList.add("ok");else if(idx==k)b.classList.add("bad")});
 $("fb").innerHTML=`<div class="fb"><b class="${ok?"g":"r"}">${ok?"✓ Correct":"✗ Wrong"}</b><br>${esc(q.explanation)}<div class="h">🔥 EXAM HACK: ${esc(q.hack)}</div></div>`;
 $("sc").textContent=`Score ${score}`;$("next").disabled=false}
$("next").onclick=()=>{if(i<run.length-1){i++;render()}else finish()};
$("quit").onclick=()=>finish();
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
let filt="all";
function finish(){
 const ans=run.filter(r=>r.pick!==null).length;
 $("rs").textContent=`${score} / ${run.length}`;
 $("rsub").textContent=`${Math.round(score/run.length*100)}% · answered ${ans} · wrong ${ans-score} · skipped ${run.length-ans}`;
 filt="all";drawFilters();drawRev();show("result")}
function drawFilters(){
 $("flt").innerHTML=[["all","All"],["w","Wrong"],["c","Correct"],["s","Skipped"]].map(([k,n])=>`<button class="${filt==k?"on":""}" data-k="${k}">${n}</button>`).join("");
 document.querySelectorAll("#flt button").forEach(b=>b.onclick=()=>{filt=b.dataset.k;drawFilters();drawRev()})}
function drawRev(){
 $("rev").innerHTML=run.map((r,n)=>{const q=r.q;const st=r.pick===null?"s":r.pick==q.answer?"c":"w";if(filt!="all"&&filt!=st)return"";
  return `<div class="rv ${st}"><span class="tag">#${n+1} · Ch ${q.ch}${q.src?" · "+q.src:""}</span><div>${esc(q.q)}</div>
  <div class="a">Your answer: <span class="${st=="c"?"g":"r"}">${r.pick===null?"— skipped —":esc(q.options[r.pick])}</span></div>
  <div class="a">Correct: <span class="g">${esc(q.options[q.answer])}</span></div>
  <div class="fb">${esc(q.explanation)}<div class="h">🔥 EXAM HACK: ${esc(q.hack)}</div></div></div>`}).join("")||"<p class='sub'>Nothing here.</p>"}
$("again").onclick=()=>show("menu");
</script></body></html>
