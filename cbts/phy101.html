dicular to the lever arm, the torque is", "options": ["τ = 0", "τ = rF/2", "τ = F/r", "τ = rF"], "answer": 3, "explanation": "At θ = 90°, sin 90° = 1, so τ = rF (maximum).", "hack": "Push at 90° for the biggest twist."}, {"q": "The torque on a body is zero when the force acts at an angle of", "options": ["0° to the lever arm", "90° to the lever arm", "45° to the lever arm", "60° to the lever arm"], "answer": 0, "explanation": "sin 0° = 0, so a force pointing along the lever arm produces no turning.", "hack": "Pushing straight at the hinge never opens the door."}, {"q": "A force of 10 N acts at 30° to a lever arm of 0.5 m. The torque is", "options": ["5 N·m", "2.5 N·m", "4.3 N·m", "0.25 N·m"], "answer": 1, "explanation": "τ = rF sinθ = 0.5 × 10 × 0.5 = 2.5 N·m.", "hack": "sin 30° = ½: just halve rF."}, {"q": "The SI unit of torque is the", "options": ["Newton per metre", "Kilogram-metre squared", "Newton-metre", "Joule per second"], "answer": 2, "explanation": "Torque = force × distance, so N·m.", "hack": "N × m. Do not confuse with kg·m² (that is I)."}, {"q": "Torque is a", "options": ["Scalar quantity", "Dimensionless quantity", "Fundamental quantity", "Vector quantity"], "answer": 3, "explanation": "It has both magnitude and direction.", "hack": "Torque, momentum, force: vectors."}, {"q": "The direction of the torque vector is found using the", "options": ["Right-hand rule", "Left-hand rule", "Parallelogram law", "Principle of moments"], "answer": 0, "explanation": "Curl the right-hand fingers from the lever arm toward the force; the thumb gives the direction.", "hack": "Fingers curl r → F, thumb = torque."}, {"q": "By convention, torque is positive when it produces", "options": ["Clockwise rotation", "Counterclockwise rotation", "No rotation", "Rotation about a moving axis"], "answer": 1, "explanation": "Counterclockwise is positive; clockwise is negative.", "hack": "CCW = +, CW = −."}, {"q": "The moment arm (lever arm) is", "options": ["Distance from the axis to the centre of mass only", "The length of the force vector drawn on a diagram", "Perpendicular distance from the axis to the force's line of action", "The distance through which the force moves"], "answer": 2, "explanation": "Torque depends on how far from the pivot the force acts, measured perpendicular to its line.", "hack": "Always measure the SHORTEST (perpendicular) distance to the line of force."}, {"q": "A long wrench turns a bolt more easily because it", "options": ["Reduces the force needed to zero", "Reduces the moment of inertia of the bolt", "Increases the mass of the bolt", "Increases the lever arm and so the torque"], "answer": 3, "explanation": "A longer arm gives larger torque for the same force.", "hack": "Stuck nut? Longer spanner = bigger r = bigger τ."}, {"q": "A door is easiest to open when pushed", "options": ["Near the handle, far from the hinge", "Near the hinge, far from the handle", "Exactly at the hinge", "Along the plane of the door"], "answer": 0, "explanation": "A larger distance from the axis produces more torque.", "hack": "Handles are placed far from hinges for a reason."}, {"q": "For a body to be in rotational equilibrium, the net torque must be", "options": ["Equal to the net force", "Zero", "Equal to its weight", "Greater than zero"], "answer": 1, "explanation": "Clockwise and counterclockwise torques cancel, so there is no angular acceleration.", "hack": "Balanced torques = no change in spin."}, {"q": "The relationship between torque and angular acceleration is", "options": ["τ = Iω", "τ = α/I", "τ = Iα", "τ = Iθ"], "answer": 2, "explanation": "The rotational form of F = ma.", "hack": "F = ma → τ = Iα."}, {"q": "A body with I = 4 kg·m² has angular acceleration 3 rad/s². The net torque is", "options": ["7 N·m", "1.33 N·m", "48 N·m", "12 N·m"], "answer": 3, "explanation": "τ = Iα = 4 × 3 = 12 N·m.", "hack": "Multiply, do not divide: τ = Iα."}, {"q": "A 40 N child sits 1.5 m from the pivot of a balanced see-saw. A second child sits 3 m on the other side. The second child's weight is", "options": ["20 N", "80 N", "40 N", "60 N"], "answer": 0, "explanation": "Balance: 40 × 1.5 = F × 3, so F = 20 N.", "hack": "Twice as far, half the weight."}, {"q": "The vector product of two vectors gives", "options": ["A scalar equal to |A||B|cosθ", "A third vector perpendicular to both", "A vector parallel to A", "A vector in the plane of A and B"], "answer": 1, "explanation": "A × B is perpendicular to the plane containing A and B.", "hack": "CROSS = vector, DOT = scalar."}, {"q": "The magnitude of the vector product A × B is", "options": ["|A||B| cosθ", "|A| + |B|", "|A||B| sinθ", "|A||B| tanθ"], "answer": 2, "explanation": "θ is the angle between A and B.", "hack": "CROSS = SIN, DOT = COS."}, {"q": "The cross product of two parallel vectors is", "options": ["Maximum", "Equal to |A||B|", "Equal to |A| + |B|", "Zero"], "answer": 3, "explanation": "Parallel vectors have θ = 0° and sin 0° = 0.", "hack": "Parallel = no twist = zero."}, {"q": "The cross product has its largest magnitude when the vectors are", "options": ["Perpendicular to each other", "Parallel to each other", "Equal in magnitude", "Pointing the same way"], "answer": 0, "explanation": "sin 90° = 1 gives the maximum value |A||B|.", "hack": "90° gives maximum cross product."}, {"q": "A and B have magnitudes 3 and 4 with an angle of 30° between them. The magnitude of A × B is", "options": ["12", "6", "10.4", "7"], "answer": 1, "explanation": "|A × B| = 3 × 4 × sin 30° = 12 × 0.5 = 6.", "hack": "sin 30° = ½."}, {"q": "Which statement about the cross product is correct?", "options": ["A × B = B × A", "A × B = |A||B|", "A × B = −(B × A)", "A × B = 0 always"], "answer": 2, "explanation": "The cross product is not commutative; reversing the order reverses the direction.", "hack": "ORDER MATTERS: swap and add a minus."}, {"q": "The direction of A × B is given by the", "options": ["Left-hand rule", "Triangle law", "Parallelogram law", "Right-hand rule"], "answer": 3, "explanation": "Point the fingers along A, curl toward B, and the thumb gives A × B.", "hack": "Fingers A → B, thumb = A × B."}, {"q": "In component form, A × B is evaluated using a", "options": ["3 × 3 determinant with i, j, k in the top row", "Sum of the products of like components", "Ratio of the magnitudes of A and B", "Difference of the two magnitudes"], "answer": 0, "explanation": "The determinant has i j k, then A's components, then B's components.", "hack": "Top row i j k, then A, then B."}, {"q": "In the determinant expansion of A × B, the j component is", "options": ["AxBz − AzBx", "AzBx − AxBz", "AyBz − AzBy", "AxBy − AyBx"], "answer": 1, "explanation": "The middle term carries a minus sign when expanded, giving j(AzBx − AxBz).", "hack": "i: y z. j: z x. k: x y (cyclic)."}, {"q": "Torque expressed as a vector product is", "options": ["τ = F × r", "τ = r · F", "τ = r × F", "τ = F / r"], "answer": 2, "explanation": "The position vector (axis to point of application) crossed into the force.", "hack": "r THEN F: τ = r × F."}, {"q": "The vector product is used in physics to define", "options": ["Work and kinetic energy", "Mass and volume", "Speed and distance", "Torque and angular momentum"], "answer": 3, "explanation": "τ = r × F and L = r × p are both cross products.", "hack": "Cross product: τ, L, and magnetic force."}, {"q": "The magnetic force on a moving charge is", "options": ["F = q(v × B)", "F = q(v · B)", "F = qv/B", "F = qB/v"], "answer": 0, "explanation": "The Lorentz force uses the cross product of velocity and magnetic field.", "hack": "The force is perpendicular to both v and B."}, {"q": "The area of a parallelogram formed by two adjacent sides A and B is", "options": ["|A · B|", "|A × B|", "|A| + |B|", "|A|/|B|"], "answer": 1, "explanation": "The magnitude of the cross product equals the parallelogram's area.", "hack": "CROSS magnitude = AREA."}, {"q": "A parallelogram has adjacent sides 5 and 4 with 30° between them. Its area is", "options": ["20", "17.3", "10", "9"], "answer": 2, "explanation": "Area = 5 × 4 × sin 30° = 10.", "hack": "Area = ab sinθ."}, {"q": "The moment of force about a pivot equals", "options": ["Mass × square of the distance", "Force × time taken", "Force ÷ perpendicular distance", "Force × perpendicular distance from the pivot"], "answer": 3, "explanation": "Torque (moment) = F × r, with r perpendicular to the line of action.", "hack": "Moment = F × d."}, {"q": "The moment of inertia of a body is its", "options": ["Resistance to change in its rotational motion", "Tendency to rotate under a force", "Rate of rotation about its axis", "Energy stored while rotating"], "answer": 0, "explanation": "Bodies with large I are hard to start or stop spinning.", "hack": "I = rotational laziness."}, {"q": "The moment of inertia of a set of particles is", "options": ["I = Σ mᵢrᵢ", "I = Σ mᵢrᵢ²", "I = Σ mᵢ/rᵢ²", "I = Σ rᵢ²/mᵢ"], "answer": 1, "explanation": "Each particle contributes its mass times the square of its distance from the axis.", "hack": "m r SQUARED."}, {"q": "Two particles, 2 kg at 3 m and 1 kg at 2 m from the axis, have a total moment of inertia of", "options": ["14 kg·m²", "8 kg·m²", "22 kg·m²", "13 kg·m²"], "answer": 2, "explanation": "I = 2(3²) + 1(2²) = 18 + 4 = 22 kg·m².", "hack": "Square the distance BEFORE multiplying by mass."}, {"q": "Moment of inertia depends strongly on", "options": ["The angular velocity of the body", "The torque applied to the body", "The time for which it spins", "How the mass is distributed about the axis"], "answer": 3, "explanation": "Mass farther from the axis gives a larger I.", "hack": "Same mass, farther out = harder to spin."}, {"q": "The SI unit of moment of inertia is", "options": ["kg·m²", "kg·m", "N·m", "kg·m²/s"], "answer": 0, "explanation": "From I = Σ m r², mass times length squared.", "hack": "kg × m². kg·m²/s is angular momentum."}, {"q": "The moment of inertia of a solid sphere about an axis through its centre is", "options": ["(1/2)MR²", "(2/5)MR²", "MR²", "(2/3)MR²"], "answer": 1, "explanation": "The notes use I = (2/5)MR² for a solid sphere (Example 6.3).", "hack": "Sphere 2/5, disc 1/2."}, {"q": "The moment of inertia of a solid disc about its central axis perpendicular to the plane is", "options": ["(2/5)MR²", "MR²", "(1/2)MR²", "(1/4)MR²"], "answer": 2, "explanation": "Used in Example 6.10 and Problem 6.1: I = ½MR².", "hack": "Disc = half. Sphere = two-fifths."}, {"q": "The two conditions for equilibrium of a beam are", "options": ["Upward force = total moment, and speed = acceleration", "Total mass = total length, and force = torque", "Net force = 0 and net speed = 0 for the beam", "Upward force = downward force, and clockwise moments = anticlockwise moments"], "answer": 3, "explanation": "Both the net force and the net moment about any point must be zero.", "hack": "Forces balance AND moments balance."}, {"q": "When taking moments about a point, the unknown force acting at that point", "options": ["Gives no moment, so it drops out of the equation", "Gives the largest moment", "Must be taken as zero in value", "Must be doubled"], "answer": 0, "explanation": "Its lever arm is zero, so choosing that point removes the unknown.", "hack": "Take moments about the point with the unknown you do not want."}, {"q": "When the coordinate axes are rotated counterclockwise by θ, the new x-coordinate is", "options": ["x′ = x cosθ − y sinθ", "x′ = x cosθ + y sinθ", "x′ = −x sinθ + y cosθ", "x′ = x sinθ + y cosθ"], "answer": 1, "explanation": "The notes give x′ = x cosθ + y sinθ.", "hack": "x′ keeps +,+ with cos then sin."}, {"q": "When the coordinate axes are rotated counterclockwise by θ, the new y-coordinate is", "options": ["y′ = x sinθ + y cosθ", "y′ = x cosθ + y sinθ", "y′ = −x sinθ + y cosθ", "y′ = −x cosθ + y sinθ"], "answer": 2, "explanation": "The notes give y′ = −x sinθ + y cosθ.", "hack": "y′ starts with a MINUS on the x sinθ term."}, {"q": "Rotating the axes by 45° counterclockwise gives x′ equal to", "options": ["(x − y)/√2", "(y − x)/√2", "(x + y)/2", "(x + y)/√2"], "answer": 3, "explanation": "cos 45° = sin 45° = 1/√2, so x′ = (x + y)/√2.", "hack": "At 45°, both cos and sin are 1/√2."}, {"q": "Rotating the axes by 45° counterclockwise gives y′ equal to", "options": ["(−x + y)/√2", "(x + y)/√2", "(x − y)/√2", "(−x − y)/√2"], "answer": 0, "explanation": "y′ = −x sin45° + y cos45° = (−x + y)/√2.", "hack": "Minus on x, plus on y."}, {"q": "The point (2, 0) is described after the axes are rotated 90° counterclockwise by", "options": ["(0, 2)", "(0, −2)", "(−2, 0)", "(2, 0)"], "answer": 1, "explanation": "x′ = 2cos90° + 0 = 0; y′ = −2 sin90° + 0 = −2.", "hack": "Axes turn one way, the point appears to turn the other way."}, {"q": "Rotation of coordinate axes is useful in", "options": ["Measuring mass and charge directly", "Defining the units of time", "Simplifying equations and analysing stresses", "Calculating only straight-line speed"], "answer": 2, "explanation": "Aligning axes with principal directions simplifies engineering stress analysis and conic-section equations.", "hack": "Turn the axes to make the equation simple."}, {"q": "Angular momentum of a single particle is defined by", "options": ["L = r · p", "L = p/r", "L = r + p", "L = r × p"], "answer": 3, "explanation": "Position vector crossed with linear momentum.", "hack": "L = r × p, same pattern as τ = r × F."}, {"q": "The angular momentum of a rigid body about a fixed axis is", "options": ["L = Iω", "L = Iα", "L = ½Iω²", "L = I/ω"], "answer": 0, "explanation": "Moment of inertia times angular velocity.", "hack": "L = Iω compares with p = mv."}, {"q": "The SI unit of angular momentum is", "options": ["kg·m²", "kg·m²/s", "kg·m/s", "N·m"], "answer": 1, "explanation": "L = Iω, so (kg·m²)(rad/s) = kg·m²/s.", "hack": "Linear momentum is kg·m/s; angular has m²."}, {"q": "A particle of mass m moves in a circle of radius r at speed v. Its angular momentum about the centre is", "options": ["L = mv/r", "L = ½mv²", "L = mvr", "L = mv²r"], "answer": 2, "explanation": "v is perpendicular to r, so L = m r v.", "hack": "mass × speed × radius."}, {"q": "A 3 kg particle moves at 2 m/s in a circle of radius 5 m. Its angular momentum is", "options": ["15 kg·m²/s", "7.5 kg·m²/s", "10 kg·m²/s", "30 kg·m²/s"], "answer": 3, "explanation": "L = mvr = 3 × 2 × 5 = 30 kg·m²/s.", "hack": "Multiply all three."}, {"q": "The rate of change of angular momentum equals the", "options": ["Net torque", "Net force", "Moment of inertia", "Angular velocity"], "answer": 0, "explanation": "dL/dt = τ.", "hack": "dp/dt = F for linear; dL/dt = τ for rotation."}, {"q": "If no external torque acts on a system, its angular momentum", "options": ["Decreases steadily", "Remains constant", "Increases steadily", "Becomes zero"], "answer": 1, "explanation": "This is conservation of angular momentum.", "hack": "τ = 0 → L = constant."}, {"q": "A planet moves from aphelion toward perihelion. Its speed", "options": ["Decreases", "Stays the same", "Increases", "Becomes zero"], "answer": 2, "explanation": "Angular momentum is conserved, so a smaller r means a larger v.", "hack": "Close to the Sun = fast."}, {"q": "A skater spinning with no external torque pulls her arms in and I halves. Her angular velocity", "options": ["Halves", "Stays the same", "Quadruples", "Doubles"], "answer": 3, "explanation": "Iω is constant, so if I halves, ω doubles.", "hack": "I down, ω up: the product is fixed."}, {"q": "In a rigid body rotating about a fixed axis, the quantity that is the same for every point is", "options": ["Angular velocity", "Linear speed", "Centripetal acceleration", "Distance travelled"], "answer": 0, "explanation": "All points sweep the same angle in the same time.", "hack": "Same ω for all, v = ωr grows with r."}], "tutorial": [{"q": "Problem 6.1(a): A solid disc of mass 2 kg and radius 0.5 m rotates about its central axis. Its moment of inertia is", "options": ["0.5 kg·m²", "0.25 kg·m²", "1.0 kg·m²", "0.125 kg·m²"], "answer": 1, "explanation": "I = ½MR² = ½ × 2 × (0.5)² = ½ × 2 × 0.25 = 0.25 kg·m².", "hack": "Disc = ½MR². Square the radius first: 0.25.", "src": "Problem 6.1"}, {"q": "Problem 6.1(b): The disc (I = 0.25 kg·m²) rotates at 20 rad/s. Its rotational kinetic energy is", "options": ["12.5 J", "25 J", "50 J", "100 J"], "answer": 2, "explanation": "K = ½Iω² = ½ × 0.25 × 400 = 50 J. (The notes print 12.5 J, which is the value for ω = 10 rad/s; for ω = 20 rad/s the correct answer is 50 J.)", "hack": "Doubling ω quadruples K: 12.5 × 4 = 50.", "src": "Problem 6.1"}, {"q": "Problem 6.2(a): A wheel starts from rest with angular acceleration 4 rad/s². Its angular velocity after 5 s is", "options": ["9 rad/s", "10 rad/s", "25 rad/s", "20 rad/s"], "answer": 3, "explanation": "ω = ω₀ + αt = 0 + 4 × 5 = 20 rad/s.", "hack": "Starting from rest: ω = αt.", "src": "Problem 6.2"}, {"q": "Problem 6.2(b): For the same wheel, the angle turned through in the 5 s is", "options": ["50 rad", "100 rad", "20 rad", "25 rad"], "answer": 0, "explanation": "θ = ½αt² = ½ × 4 × 25 = 50 rad.", "hack": "Rotational version of s = ½at².", "src": "Problem 6.2"}, {"q": "Problem 6.3 (step 1): A flywheel of mass 10 kg and radius 0.2 m is treated as a solid disc. Its moment of inertia is", "options": ["0.4 kg·m²", "0.2 kg·m²", "2 kg·m²", "0.1 kg·m²"], "answer": 1, "explanation": "I = ½MR² = ½ × 10 × 0.04 = 0.2 kg·m².", "hack": "0.2² = 0.04, not 0.4.", "src": "Problem 6.3"}, {"q": "Problem 6.3 (step 2): The flywheel (I = 0.2 kg·m²) is acted on by a torque of 5 N·m. Its angular acceleration is", "options": ["12.5 rad/s²", "1 rad/s²", "25 rad/s²", "50 rad/s²"], "answer": 2, "explanation": "α = τ/I = 5 ÷ 0.2 = 25 rad/s².", "hack": "Dividing by 0.2 is the same as multiplying by 5.", "src": "Problem 6.3"}, {"q": "Problem 6.4 (step 1): A student holds two 2 kg dumbbells 1 m from the axis. Neglecting the stool, the initial moment of inertia is", "options": ["2 kg·m²", "8 kg·m²", "1 kg·m²", "4 kg·m²"], "answer": 3, "explanation": "I = 2 × (2 kg × 1²) = 4 kg·m².", "hack": "Two masses: add both contributions.", "src": "Problem 6.4"}, {"q": "Problem 6.4 (step 2): The student, spinning at 2 rad/s, pulls the dumbbells in to 0.25 m. The new angular velocity is", "options": ["32 rad/s", "16 rad/s", "8 rad/s", "4 rad/s"], "answer": 0, "explanation": "I₂ = 2 × 2 × 0.25² = 0.25 kg·m². I₁ω₁ = I₂ω₂, so ω₂ = 4 × 2 ÷ 0.25 = 32 rad/s.", "hack": "Distance ÷ 4 means I ÷ 16, so ω × 16: 2 × 16 = 32.", "src": "Problem 6.4"}, {"q": "Problem 6.5: Angular displacement is measured in", "options": ["Degrees only", "Radians or degrees", "Radians only", "Revolutions per minute"], "answer": 1, "explanation": "Angle can be given in radians or degrees (or revolutions). RPM is a rate, not a displacement.", "hack": "RPM has 'per minute', so it is a speed, not a displacement.", "src": "Problem 6.5"}, {"q": "Problem 6.6: In a rigid body rotating about a fixed axis, which quantity is the same for all points?", "options": ["Tangential speed", "Centripetal acceleration", "Angular speed", "Tangential acceleration magnitude"], "answer": 2, "explanation": "Every point turns through the same angle in the same time. Speeds and accelerations depend on r.", "hack": "Same ω for everyone; v = ωr changes with r.", "src": "Problem 6.6"}, {"q": "Problem 6.7: Moment of inertia depends on", "options": ["Mass only, whatever the axis", "Shape only, without the mass", "Angular velocity of the body", "Mass distribution about the axis"], "answer": 3, "explanation": "I = Σmr² depends on how the mass is spread relative to the axis.", "hack": "I = Σ m r²: both m AND where it is.", "src": "Problem 6.7"}, {"q": "Problem 6.8: If the net external torque on a system is zero, then its", "options": ["Angular momentum is conserved", "Angular velocity is always constant", "Rotational kinetic energy is conserved", "Moment of inertia is constant"], "answer": 0, "explanation": "dL/dt = τ = 0, so L is constant. I and ω can individually change (skater).", "hack": "Zero torque conserves L, not ω.", "src": "Problem 6.8"}, {"q": "Problem 6.9: A door is pushed at two points by equal, opposite, collinear forces, giving no net torque. The door's rotational motion", "options": ["Must speed up", "Remains unchanged in ω", "Must slow down", "Cannot be determined"], "answer": 1, "explanation": "Zero net torque means zero angular acceleration, so ω stays the same.", "hack": "Net τ = 0 → α = 0 → ω unchanged.", "src": "Problem 6.9"}, {"q": "Problem 6.10: The work done by a constant torque τ through an angle θ is", "options": ["τ/θ", "½τθ", "τθ", "Iω²"], "answer": 2, "explanation": "Rotational analogue of W = Fd: W = τθ.", "hack": "W = Fd → W = τθ.", "src": "Problem 6.10"}], "exercises": [{"q": "Example 6.1: A wheel has angular displacement θ = 5t². What is its angular velocity at t = 4 s?", "options": ["20 rad/s", "80 rad/s", "160 rad/s", "40 rad/s"], "answer": 3, "explanation": "ω = dθ/dt = 10t. At t = 4 s, ω = 10 × 4 = 40 rad/s.", "hack": "Differentiate: 5t² → 10t.", "src": "Example 6.1"}, {"q": "Example 6.2: A disc accelerates from rest to 20 rad/s in 5 s. Its angular acceleration is", "options": ["4 rad/s²", "100 rad/s²", "0.25 rad/s²", "15 rad/s²"], "answer": 0, "explanation": "α = Δω/Δt = 20 ÷ 5 = 4 rad/s².", "hack": "Change in ω divided by time.", "src": "Example 6.2"}, {"q": "Example 6.3 (step 1): A solid sphere of mass 2 kg and radius 0.2 m rotates about an axis through its centre. Its moment of inertia is", "options": ["0.04 kg·m²", "0.032 kg·m²", "0.16 kg·m²", "0.32 kg·m²"], "answer": 1, "explanation": "I = (2/5)MR² = 0.4 × 2 × 0.04 = 0.032 kg·m². (The notes round this to 0.03 but use 0.032 for the next step.)", "hack": "Sphere = 2/5. 0.4 × 2 × 0.04 = 0.032.", "src": "Example 6.3"}, {"q": "Example 6.3 (step 2): That sphere spins at 10 rad/s. Its rotational kinetic energy is", "options": ["0.16 J", "3.2 J", "1.6 J", "16 J"], "answer": 2, "explanation": "K = ½Iω² = ½ × 0.032 × 100 = 1.6 J.", "hack": "100 × 0.032 = 3.2, half of it = 1.6.", "src": "Example 6.3"}, {"q": "Example 6.4: A 20 N force is applied perpendicular to a door at 0.8 m from the hinge. The torque is", "options": ["25 N·m", "1.6 N·m", "160 N·m", "16 N·m"], "answer": 3, "explanation": "θ = 90°, so τ = rF = 0.8 × 20 = 16 N·m.", "hack": "Perpendicular: just r × F.", "src": "Example 6.4"}, {"q": "Example 6.5: A 50 N force acts at 60° to a wrench handle 0.3 m long. The torque is approximately", "options": ["13 N·m", "15 N·m", "7.5 N·m", "26 N·m"], "answer": 0, "explanation": "τ = rF sinθ = 0.3 × 50 × 0.866 = 12.99 ≈ 13 N·m.", "hack": "sin 60° = 0.866, and 15 × 0.866 ≈ 13.", "src": "Example 6.5"}, {"q": "Example 6.6(a): For A = 3i + 7j + 3k and B = 5i + 2j + 4k, A·B equals", "options": ["22", "41", "−29", "15"], "answer": 1, "explanation": "A·B = 3(5) + 7(2) + 3(4) = 15 + 14 + 12 = 41.", "hack": "Dot product: multiply like components, then add.", "src": "Example 6.6"}, {"q": "Example 6.6(b): For the same A and B, A × B equals", "options": ["22i − 3j − 29k", "−22i − 3j + 29k", "22i + 3j − 29k", "28i + 12j − 35k"], "answer": 2, "explanation": "i: 7·4 − 3·2 = 22; j: 3·5 − 3·4 = 3; k: 3·2 − 7·5 = −29.", "hack": "j is the cyclic term z·x − x·z, so (3)(5) − (3)(4) = +3.", "src": "Example 6.6"}, {"q": "Example 6.6(c): With C = 4i − 3j + 2k, the value of (A × C)·B is", "options": ["21", "41", "−29", "−21"], "answer": 3, "explanation": "A × C = 23i + 6j − 37k. Dotting with B = 5i + 2j + 4k gives 115 + 12 − 148 = −21.", "hack": "Cross first, then dot: the result is a scalar.", "src": "Example 6.6"}, {"q": "Example 6.7: A 50 N force acts perpendicular to a wrench 0.3 m from the pivot. The torque is", "options": ["15 N·m", "150 N·m", "1.5 N·m", "167 N·m"], "answer": 0, "explanation": "τ = F × r = 50 × 0.3 = 15 N·m.", "hack": "Multiply: 50 × 0.3 = 15.", "src": "Example 6.7"}, {"q": "Example 6.8 (Q): A weightless beam rests on pivots C and D, 8 m apart. A 20 N load hangs 2 m from C. Taking moments about C, the reaction Q at D is", "options": ["15 N", "5 N", "10 N", "2.5 N"], "answer": 1, "explanation": "20 × 2 = Q × 8, so Q = 5 N.", "hack": "Pivot at C kills P: only the 20 N load and Q give moments.", "src": "Example 6.8"}, {"q": "Example 6.8 (P): In the same beam, the reaction P at C is", "options": ["5 N", "10 N", "15 N", "20 N"], "answer": 2, "explanation": "P + Q = 20 N, so P = 20 − 5 = 15 N. Check about D: P × 8 = 20 × 6 gives P = 15 N.", "hack": "P and Q must add up to the load: 15 + 5 = 20.", "src": "Example 6.8"}, {"q": "Example 6.9: A 2 kg particle moves at 3 m/s on a circle of radius 4 m. Its angular momentum about the centre is", "options": ["12 kg·m²/s", "6 kg·m²/s", "48 kg·m²/s", "24 kg·m²/s"], "answer": 3, "explanation": "L = mrv = 2 × 4 × 3 = 24 kg·m²/s.", "hack": "Multiply the three numbers: 2 × 4 × 3.", "src": "Example 6.9"}, {"q": "Example 6.10 (step 1): A solid disc of mass 5 kg and radius 0.5 m rotates about its central axis. Its moment of inertia is", "options": ["0.625 kg·m²", "1.25 kg·m²", "2.5 kg·m²", "0.3125 kg·m²"], "answer": 0, "explanation": "I = ½MR² = ½ × 5 × 0.25 = 0.625 kg·m².", "hack": "0.5² = 0.25, then half of 5 is 2.5; 2.5 × 0.25 = 0.625.", "src": "Example 6.10"}, {"q": "Example 6.10 (step 2): The same disc spins at 10 rad/s. Its angular momentum is", "options": ["62.5 kg·m²/s", "6.25 kg·m²/s", "3.125 kg·m²/s", "0.0625 kg·m²/s"], "answer": 1, "explanation": "L = Iω = 0.625 × 10 = 6.25 kg·m²/s.", "hack": "Shift the decimal one place: 0.625 → 6.25.", "src": "Example 6.10"}, {"q": "Example 6.11: A 500 kg satellite orbits at r = 7.0 × 10⁶ m with speed 8000 m/s. Its angular momentum about Earth's centre is", "options": ["2.8 × 10¹² kg·m²/s", "5.6 × 10¹³ kg·m²/s", "2.8 × 10¹³ kg·m²/s", "2.8 × 10¹⁴ kg·m²/s"], "answer": 2, "explanation": "L = mrv = 500 × 7.0×10⁶ × 8000 = 2.8 × 10¹³ kg·m²/s.", "hack": "5 × 7 × 8 = 280, and the powers add: 10² × 10⁶ × 10³ = 10¹¹, so 280 × 10¹¹ = 2.8 × 10¹³.", "src": "Example 6.11"}]}, {"chapter": 7, "title": "Newton's Laws of Motion, Statics and Dynamics", "concept": [{"q": "Newton's laws of motion are the foundation of", "options": ["Quantum field theory", "Nuclear physics only", "Special relativity only", "Classical (Newtonian) mechanics"], "answer": 3, "explanation": "They explain most familiar motion and form classical mechanics.", "hack": "Newton = classical. Einstein = very fast. Quantum = very small."}, {"q": "Newton's laws need modification only for", "options": ["Speeds near the speed of light or very small sizes such as atoms", "Objects heavier than one tonne at rest", "Any motion on a rough surface", "Motion that lasts longer than one hour"], "answer": 0, "explanation": "At extreme speeds or atomic scales classical mechanics breaks down.", "hack": "Everyday life = Newton works fine."}, {"q": "The first law deals with the case where the net force on a body is", "options": ["Equal to its weight", "Zero", "Equal to its mass", "Greater than zero"], "answer": 1, "explanation": "When the net force is zero, the motion of the body does not change.", "hack": "1st law = ZERO net force. 2nd law = NON-zero net force."}, {"q": "The second law relates force to", "options": ["Velocity alone", "Position alone", "Acceleration", "Temperature"], "answer": 2, "explanation": "When the net force is not zero the body accelerates: ΣF = ma.", "hack": "F, m, a: second law has all three."}, {"q": "The third law is about", "options": ["The motion of a body with zero net force", "The relationship between force and acceleration", "The weight of a body at different places", "The forces two interacting bodies exert on each other"], "answer": 3, "explanation": "Every interaction produces a pair of forces, one on each body.", "hack": "Third law = pairs, two bodies."}, {"q": "A rigid body is one in which", "options": ["The relative positions of any two particles do not change under forces", "All particles move at different speeds", "The mass changes with the force applied", "Particles move freely apart"], "answer": 0, "explanation": "Rigid means the body keeps its shape under the action of forces.", "hack": "RIGID = shape stays fixed."}, {"q": "The branch of mechanics dealing with bodies at rest is", "options": ["Dynamics", "Statics", "Kinematics", "Kinetics"], "answer": 1, "explanation": "Statics = rest; dynamics = motion.", "hack": "STATics = STATionary."}, {"q": "The branch of mechanics dealing with bodies in motion is", "options": ["Statics", "Equilibrium", "Dynamics", "Elasticity"], "answer": 2, "explanation": "Dynamics deals with motion.", "hack": "DYNamics = DYNamic, moving."}, {"q": "Kinematics deals with motion", "options": ["Only when the net force is zero", "Together with the forces causing it", "Of bodies at rest only", "Without referring to the forces causing it"], "answer": 3, "explanation": "Kinematics describes motion; kinetics includes the forces.", "hack": "KINEMATICS = describe only. KINETICS = with forces."}, {"q": "The study of motion that includes the forces causing it is called", "options": ["Kinetics", "Kinematics", "Statics", "Optics"], "answer": 0, "explanation": "Kinetics refers to the forces causing motion.", "hack": "Kinetics = forces included."}, {"q": "A force is best defined as", "options": ["A quantity of matter in a body", "A push or a pull, an interaction between bodies", "The rate of change of distance", "A measure of how fast a body moves"], "answer": 1, "explanation": "A better definition is that force is an interaction between two bodies or between a body and its environment.", "hack": "Force = interaction."}, {"q": "Force is a", "options": ["Scalar quantity", "Dimensionless ratio", "Vector quantity", "Pure number"], "answer": 2, "explanation": "You can push or pull in different directions, so direction matters.", "hack": "Force has a direction: vector."}, {"q": "The SI unit of force is the", "options": ["Joule", "Watt", "Pascal", "Newton"], "answer": 3, "explanation": "1 N is the force that gives 1 kg an acceleration of 1 m/s².", "hack": "N = kg·m/s²."}, {"q": "Which of these is a contact force?", "options": ["Friction", "Gravitation", "Electric force", "Magnetic force"], "answer": 0, "explanation": "Push, pull, tension, normal reaction and friction are contact forces; gravitational, electric and magnetic are long-range.", "hack": "Contact = touching. Field forces act across space."}, {"q": "Which of these is a long-range (field) force?", "options": ["Tension in a rope", "Gravitational force", "Normal reaction", "Frictional force"], "answer": 1, "explanation": "Gravity, electric and magnetic forces act even when bodies are separated.", "hack": "Field forces: GEM = Gravity, Electric, Magnetic."}, {"q": "The normal force on an object always acts", "options": ["Parallel to the surface of contact", "Vertically upward, whatever the surface", "Perpendicular to the surface of contact", "Along the direction of motion"], "answer": 2, "explanation": "'Normal' means perpendicular, whatever the angle of the surface.", "hack": "NORMAL = at 90° to the surface."}, {"q": "The friction force acts", "options": ["Perpendicular to the surface, upward", "Along the motion, helping sliding", "Toward the centre of the Earth", "Parallel to the surface, opposing sliding"], "answer": 3, "explanation": "Friction opposes sliding or attempted sliding.", "hack": "Friction fights the motion."}, {"q": "The tension force is the", "options": ["Pulling force exerted by a stretched rope or cord", "Pushing force of a surface on an object", "Force of attraction between two magnets", "Force that opposes sliding on a floor"], "answer": 0, "explanation": "A rope pulls on the object it is attached to.", "hack": "Rope = tension. Always pulls, never pushes."}, {"q": "The gravitational force that the Earth exerts on a body is called its", "options": ["Mass", "Weight", "Momentum", "Inertia"], "answer": 1, "explanation": "Weight is the Earth's pull on the body.", "hack": "Weight = pull of gravity."}, {"q": "Mass is defined as", "options": ["The gravitational pull on a body", "The force needed to lift a body", "The quantity of matter in a body", "The speed at which a body falls"], "answer": 2, "explanation": "Mass measures how much matter a body has.", "hack": "Mass = amount of stuff."}, {"q": "The SI unit of mass is", "options": ["Newton", "Gram per second", "Joule", "Kilogram"], "answer": 3, "explanation": "Mass is measured in kg with a beam balance.", "hack": "kg for mass, N for weight."}, {"q": "Mass is a", "options": ["Scalar quantity", "Vector quantity", "Force", "Field"], "answer": 0, "explanation": "It has magnitude only.", "hack": "Mass scalar, weight vector."}, {"q": "Weight is a", "options": ["Scalar quantity", "Vector quantity", "Fundamental quantity", "Dimensionless quantity"], "answer": 1, "explanation": "Weight is a force, and it points toward the centre of the Earth.", "hack": "Weight is a force, so vector."}, {"q": "A beam balance (equal-arm balance) is used to measure", "options": ["Weight", "Force", "Mass", "Acceleration"], "answer": 2, "explanation": "It compares the unknown mass with a known mass, so the result does not depend on g.", "hack": "Beam balance = mass. Spring balance = weight."}, {"q": "A spring balance is used to measure", "options": ["Mass", "Density", "Volume", "Weight"], "answer": 3, "explanation": "The stretch of the spring shows the gravitational force in newtons.", "hack": "SPRING = force in newtons."}, {"q": "The relationship between mass and weight is", "options": ["w = mg", "w = m/g", "w = g/m", "w = m + g"], "answer": 0, "explanation": "Weight equals mass times the acceleration due to gravity.", "hack": "Weight = mass × g."}, {"q": "The value of g used in the notes is", "options": ["8.9 m/s²", "9.8 m/s²", "980 m/s²", "1.62 m/s²"], "answer": 1, "explanation": "g = 9.8 m/s² (9.80 on Earth's surface).", "hack": "g ≈ 9.8, nearly 10."}, {"q": "The mass of an object is", "options": ["Smaller on the Moon than on Earth", "Zero in space", "Constant, independent of location", "Larger at higher altitude"], "answer": 2, "explanation": "Mass never changes with location; weight does.", "hack": "Mass travels with you. Weight does not."}, {"q": "The weight of an object depends on", "options": ["Its colour", "Its temperature only", "The speed it travels at", "Its location, through the value of g"], "answer": 3, "explanation": "w = mg; different places have different g.", "hack": "Move to a different planet: m same, w changes."}, {"q": "A body becomes weightless when", "options": ["Gravitational force vanishes, though its mass is unchanged", "Its mass becomes zero", "Its volume becomes zero", "It moves at constant speed"], "answer": 0, "explanation": "Weightless means no gravitational force; the mass is still the same.", "hack": "Weightless ≠ massless."}, {"q": "A 60 kg person on Earth (g = 9.8 m/s²) has a weight of", "options": ["60 N", "588 N", "6.1 N", "5880 N"], "answer": 1, "explanation": "w = mg = 60 × 9.8 = 588 N.", "hack": "Multiply by about 10 and subtract a little."}, {"q": "A 1.00 kg mass weighs how much on the Moon, where g = 1.62 m/s²?", "options": ["9.80 N", "0.165 N", "1.62 N", "1.00 N"], "answer": 2, "explanation": "w = mg = 1.00 × 1.62 = 1.62 N, while its mass stays 1.00 kg.", "hack": "Moon: weight is about one-sixth."}, {"q": "A 1.00 kg mass on the Moon has a mass of", "options": ["1.62 kg", "0.165 kg", "9.80 kg", "1.00 kg"], "answer": 3, "explanation": "Mass does not change with location; only weight does.", "hack": "Mass is the same everywhere."}, {"q": "A 2.49 × 10⁴ N car has a mass closest to", "options": ["2540 kg", "24 900 kg", "254 kg", "25 kg"], "answer": 0, "explanation": "m = w/g = 2.49×10⁴ ÷ 9.80 ≈ 2540 kg.", "hack": "Divide the weight by about 10."}, {"q": "Newton's first law states that a body at rest or moving uniformly in a straight line stays that way unless", "options": ["Its mass changes", "An external force acts on it", "Its volume changes", "Its weight is removed"], "answer": 1, "explanation": "A net external force is needed to change the state of rest or uniform motion.", "hack": "No force, no change."}, {"q": "Newton's first law is also known as the law of", "options": ["Reaction", "Gravitation", "Inertia", "Acceleration"], "answer": 2, "explanation": "Inertia is the tendency of a body to keep its state of motion.", "hack": "1st = INERTIA, 2nd = F = ma, 3rd = REACTION."}, {"q": "Inertia of a body increases with its", "options": ["Speed", "Volume only", "Temperature", "Mass"], "answer": 3, "explanation": "The more massive the body, the more inertia it has.", "hack": "Heavier = harder to start or stop."}, {"q": "A body moving with constant velocity has", "options": ["Zero net force and zero acceleration", "A constant net force", "Increasing speed", "Zero mass"], "answer": 0, "explanation": "Constant velocity means a = 0, so ΣF = 0.", "hack": "Constant velocity does NOT need a force."}, {"q": "A rotating fan keeps turning for a while after it is switched off because of", "options": ["Friction only", "Inertia", "Gravity", "The third law"], "answer": 1, "explanation": "The notes use this as an example of the first law.", "hack": "Fan keeps spinning: inertia."}, {"q": "Newton's second law is expressed as", "options": ["ΣF = m/a", "ΣF = a/m", "ΣF = ma", "ΣF = m + a"], "answer": 2, "explanation": "Net force equals mass times acceleration.", "hack": "F = ma."}, {"q": "Newton's second law in terms of momentum is", "options": ["F = P·t", "F = P/m", "F = m·P", "F = dP/dt"], "answer": 3, "explanation": "Force equals the rate of change of momentum.", "hack": "Force = rate of change of momentum."}, {"q": "Linear momentum is the product of", "options": ["Mass and velocity", "Mass and acceleration", "Force and distance", "Mass and time"], "answer": 0, "explanation": "P = mv.", "hack": "P = mv."}, {"q": "The product F × t is called", "options": ["Momentum", "Impulse", "Power", "Work"], "answer": 1, "explanation": "Impulse is measured in N·s and equals the change in momentum.", "hack": "Force × time = impulse."}, {"q": "The SI unit of impulse is", "options": ["N·m", "N/s", "N·s", "kg·m²"], "answer": 2, "explanation": "Impulse = force × time.", "hack": "N·s = kg·m/s, same as momentum."}, {"q": "The acceleration of a body is in the same direction as the", "options": ["Velocity always", "Weight", "Friction", "Net force"], "answer": 3, "explanation": "ΣF = ma, so a points along ΣF.", "hack": "a follows ΣF, not necessarily v."}, {"q": "A body of mass 15 kg is acted on by a net force of 45 N. Its acceleration is", "options": ["3 m/s²", "30 m/s²", "0.33 m/s²", "675 m/s²"], "answer": 0, "explanation": "a = F/m = 45 ÷ 15 = 3 m/s².", "hack": "F ÷ m."}, {"q": "A net force of 20 N produces an acceleration of 5 m/s². The mass is", "options": ["100 kg", "4 kg", "0.25 kg", "25 kg"], "answer": 1, "explanation": "m = F/a = 20 ÷ 5 = 4 kg.", "hack": "Mass = F ÷ a."}, {"q": "If the same net force acts on a body and its mass is doubled, the acceleration", "options": ["Is doubled", "Stays the same", "Is halved", "Becomes zero"], "answer": 2, "explanation": "a = F/m, so a doubled m gives half the a.", "hack": "More mass, less acceleration."}, {"q": "A force of 10.0 N acts on a 2.00 kg body. The acceleration is", "options": ["20.0 m/s²", "0.200 m/s²", "12.0 m/s²", "5.00 m/s²"], "answer": 3, "explanation": "a = F/m = 10.0 ÷ 2.00 = 5.00 m/s².", "hack": "10 ÷ 2."}, {"q": "Newton's first and second laws are valid only in a", "options": ["Non-accelerating (inertial) frame of reference", "Frame that accelerates", "Frame that is spinning", "Frame in free fall only"], "answer": 0, "explanation": "They hold in an inertial frame.", "hack": "INERTIAL = not accelerating."}, {"q": "Newton's third law states that for every action there is", "options": ["A smaller opposite reaction", "An equal and opposite reaction", "An equal reaction in the same direction", "An unequal reaction"], "answer": 1, "explanation": "Same magnitude, opposite direction.", "hack": "Equal and opposite."}, {"q": "The action and reaction forces in the third law act on", "options": ["The same body", "Neither body", "Different bodies", "Only the heavier body"], "answer": 2, "explanation": "Because they act on different bodies, they never cancel each other.", "hack": "A→B and B→A: two bodies, so no cancellation."}, {"q": "In the third law, F(A on B) is related to F(B on A) by", "options": ["F(A on B) = F(B on A)", "F(A on B) = 2F(B on A)", "F(A on B) = 0", "F(A on B) = −F(B on A)"], "answer": 3, "explanation": "Equal magnitude, opposite direction.", "hack": "Equal in size, flipped in sign."}, {"q": "A bird hits a plane's windshield. Which experiences the greater force?", "options": ["Both feel the same force", "The bird", "The plane", "The plane, since it is heavier"], "answer": 0, "explanation": "By the third law the two forces are equal and opposite.", "hack": "Equal force, but different acceleration."}, {"q": "In the bird-and-plane collision, which has the greater acceleration?", "options": ["The plane, because its mass is larger", "The bird, because its mass is smaller", "Both, because forces are equal", "Neither, since the forces cancel"], "answer": 1, "explanation": "Same force but a = F/m, so the smaller mass accelerates more.", "hack": "Same F, smaller m = bigger a."}, {"q": "A particle is in equilibrium when", "options": ["ΣF = ma with a ≠ 0", "ΣF = mg", "ΣF = 0", "ΣF = F/m"], "answer": 2, "explanation": "In equilibrium the net force is zero.", "hack": "Equilibrium = ΣF = 0."}, {"q": "For a particle that is not in equilibrium, the relation used is", "options": ["ΣF = 0", "ΣF = mg only", "ΣF = m/a", "ΣF = ma"], "answer": 3, "explanation": "Newton's second law for dynamics.", "hack": "Dynamics = ma."}, {"q": "A net force of 120 N acts on a 60.0 kg person. The acceleration is", "options": ["2.0 m/s²", "0.5 m/s²", "7200 m/s²", "20 m/s²"], "answer": 0, "explanation": "a = 120 ÷ 60.0 = 2.0 m/s².", "hack": "Example 7.1 pattern: a = ΣF/m."}, {"q": "A truck of mass 20 000 kg on a level track is given a = 1.5 m/s². The forward force needed is", "options": ["13 333 N", "30 000 N", "196 000 N", "300 N"], "answer": 1, "explanation": "F = ma = 20 000 × 1.5 = 30 000 N.", "hack": "Remove the zeros: 2 × 1.5 = 3."}, {"q": "For a truck on a level track, the normal force equals", "options": ["ma", "mg − ma", "mg", "Zero"], "answer": 2, "explanation": "No vertical acceleration, so N = mg.", "hack": "Level track: N = weight."}, {"q": "A lift accelerates upward with acceleration a. The floor's reaction R on a passenger of weight W is", "options": ["R = W − ma", "R = W", "R = ma − W", "R = W + ma"], "answer": 3, "explanation": "R − W = ma, so R = W + ma. The passenger feels heavier.", "hack": "Going UP faster: you feel HEAVIER."}, {"q": "When the lift accelerates upward, the passenger feels", "options": ["Heavier than normal", "Lighter than normal", "Weightless", "No change at all"], "answer": 0, "explanation": "R is larger than W.", "hack": "Up fast = pressed into the floor."}, {"q": "A person slides down a rope with downward acceleration a, tension T and weight mg. The correct equation is", "options": ["T − mg = ma", "mg − T = ma", "mg + T = ma", "T = ma"], "answer": 1, "explanation": "Downward is the direction of motion, so mg − T = ma.", "hack": "Take the direction of motion as positive."}, {"q": "The friction force on a sliding box is calculated from", "options": ["F = μ/N", "F = N/μ", "F = μN", "F = μmg² only"], "answer": 2, "explanation": "Friction = coefficient of friction × normal force.", "hack": "Friction = μ × N."}, {"q": "A box is pulled with a force at an angle above the horizontal. The normal force is", "options": ["Greater than mg", "Equal to mg", "Zero always", "Less than mg"], "answer": 3, "explanation": "The upward component of the pull supports part of the weight, so N = mg − F sinθ.", "hack": "Pull up and forward: lighter on the floor."}, {"q": "A 70 kg box (g = 9.81 m/s²) on a level floor has a normal force of about", "options": ["687 N", "70 N", "6.9 N", "7.1 N"], "answer": 0, "explanation": "N = mg = 70 × 9.81 = 687 N.", "hack": "70 × 9.8."}, {"q": "A free-body diagram shows", "options": ["All the forces in the universe", "All the forces acting on a single body", "Only the forces the body exerts", "Only the weight of the body"], "answer": 1, "explanation": "Draw one body and every force acting on it.", "hack": "One body, ALL forces ON it."}, {"q": "A cyclist of mass 100 kg has a net forward force of 140 N. Her acceleration is", "options": ["14 m/s²", "0.71 m/s²", "1.4 m/s²", "0.14 m/s²"], "answer": 2, "explanation": "a = 140 ÷ 100 = 1.4 m/s².", "hack": "Divide by 100: move the decimal two places."}, {"q": "A force that reduces the speed of a body acts", "options": ["In the same direction as its motion", "Perpendicular to its weight", "Along its velocity", "Opposite to its motion"], "answer": 3, "explanation": "A negative sign on F means it retards the motion.", "hack": "Negative F = braking force."}], "tutorial": [{"q": "Problem 7.1: Which pair contains only scalar quantities?", "options": ["Mass and temperature", "Force and velocity", "Mass and displacement", "Weight and speed"], "answer": 0, "explanation": "Mass and temperature have magnitude only. Force, velocity, displacement and weight are vectors.", "hack": "Scalar = size only. Speed is scalar, velocity is vector.", "src": "Problem 7.1"}, {"q": "Problem 7.1: Which pair contains only vector quantities?", "options": ["Mass and force", "Force and acceleration", "Speed and velocity", "Time and acceleration"], "answer": 1, "explanation": "Force and acceleration have both magnitude and direction.", "hack": "Vectors: F, a, v, weight, momentum.", "src": "Problem 7.1"}, {"q": "Problem 7.2(a): A watermelon weighs 44.0 N on Earth's surface. Its mass is", "options": ["44.0 kg", "431 kg", "4.49 kg", "7.97 kg"], "answer": 2, "explanation": "m = w/g = 44.0 ÷ 9.80 = 4.49 kg.", "hack": "Divide by 9.8.", "src": "Problem 7.2"}, {"q": "Problem 7.2(b): On Io (g = 1.81 m/s²), the same watermelon has a weight of", "options": ["44.0 N", "4.49 N", "79.6 N", "8.13 N"], "answer": 3, "explanation": "Mass stays 4.49 kg. w = mg = 4.49 × 1.81 = 8.13 N.", "hack": "Mass is unchanged. Only weight changes with g.", "src": "Problem 7.2"}, {"q": "Problem 7.3(a): A pack weighs 17.5 N on Earth and 3.24 N on an asteroid. The asteroid's g is", "options": ["1.81 m/s²", "5.40 m/s²", "0.185 m/s²", "9.80 m/s²"], "answer": 0, "explanation": "m = 17.5/9.80 = 1.79 kg. g = w/m = 3.24 ÷ 1.79 = 1.81 m/s². Or g = 9.80 × (3.24/17.5).", "hack": "Weights scale like g: 9.8 × 3.24/17.5.", "src": "Problem 7.3"}, {"q": "Problem 7.3(b): The mass of the pack on the asteroid is", "options": ["0.332 kg", "1.79 kg", "17.5 kg", "3.24 kg"], "answer": 1, "explanation": "Mass is the same everywhere: 17.5 ÷ 9.80 = 1.79 kg.", "hack": "Mass never changes with place.", "src": "Problem 7.3"}, {"q": "Problem 7.4: A 48.0 N horizontal force on a box on frictionless ice gives an acceleration of 3.00 m/s². The mass is", "options": ["144 kg", "0.0625 kg", "16.0 kg", "51.0 kg"], "answer": 2, "explanation": "m = F/a = 48.0 ÷ 3.00 = 16.0 kg.", "hack": "m = F ÷ a.", "src": "Problem 7.4"}, {"q": "Problem 7.5(a): An 80.0 N force pushes a block of ice from rest through 11.0 m in 5.00 s. The mass of the block is", "options": ["29.1 kg", "182 kg", "36.4 kg", "90.9 kg"], "answer": 3, "explanation": "s = ½at² gives a = 2 × 11.0 ÷ 25.0 = 0.88 m/s². m = F/a = 80.0 ÷ 0.88 = 90.9 kg.", "hack": "Find a from s = ½at² first, then m = F/a.", "src": "Problem 7.5"}, {"q": "Problem 7.5(b): The worker stops pushing after 5.00 s. In the next 5.00 s the block moves", "options": ["22.0 m", "11.0 m", "44.0 m", "0 m"], "answer": 0, "explanation": "With no friction and no force, v stays at 0.88 × 5.00 = 4.4 m/s. Distance = 4.4 × 5.00 = 22.0 m.", "hack": "No force means constant velocity (first law).", "src": "Problem 7.5"}, {"q": "Problem 7.6(a): A 32.5 kg crate at rest is acted on by a net force of 140 N. The acceleration is", "options": ["0.232 m/s²", "4.31 m/s²", "43.1 m/s²", "9.80 m/s²"], "answer": 1, "explanation": "a = F/m = 140 ÷ 32.5 = 4.31 m/s².", "hack": "140 ÷ 32.5 is a little over 4.", "src": "Problem 7.6"}, {"q": "Problem 7.6(b): That crate travels how far in 10.0 s?", "options": ["43.1 m", "431 m", "215 m", "108 m"], "answer": 2, "explanation": "s = ½at² = ½ × 4.31 × 100 = 215 m.", "hack": "t² = 100, so s = 50a.", "src": "Problem 7.6"}, {"q": "Problem 7.6(c): The crate's speed at the end of 10.0 s is", "options": ["21.5 m/s", "215 m/s", "4.31 m/s", "43.1 m/s"], "answer": 3, "explanation": "v = at = 4.31 × 10.0 = 43.1 m/s.", "hack": "v = at: move the decimal.", "src": "Problem 7.6"}, {"q": "Problem 7.7: A 4.80 kg bucket is lifted by a cord that breaks at 60.0 N. The maximum upward acceleration is", "options": ["2.70 m/s²", "12.5 m/s²", "9.80 m/s²", "7.10 m/s²"], "answer": 0, "explanation": "T − mg = ma. a = (60.0 − 4.80 × 9.80)/4.80 = (60.0 − 47.0)/4.80 = 2.70 m/s².", "hack": "Cord must also support the weight: T − mg = ma.", "src": "Problem 7.7"}, {"q": "Problem 7.8(a): A 10.0 N force acts on a 2.00 kg body. The acceleration is", "options": ["20.0 m/s²", "5.00 m/s²", "0.200 m/s²", "8.00 m/s²"], "answer": 1, "explanation": "a = F/m = 10.0 ÷ 2.00 = 5.00 m/s².", "hack": "F ÷ m.", "src": "Problem 7.8"}, {"q": "Problem 7.8(b): The weight of the 2.00 kg body is", "options": ["2.00 N", "10.0 N", "19.6 N", "4.90 N"], "answer": 2, "explanation": "w = mg = 2.00 × 9.80 = 19.6 N.", "hack": "Weight = 2 × 9.8, not the applied 10 N.", "src": "Problem 7.8"}, {"q": "Problem 7.8(c): If the force is doubled, the acceleration becomes", "options": ["5.00 m/s²", "2.50 m/s²", "20.0 m/s²", "10.0 m/s²"], "answer": 3, "explanation": "a = F/m is proportional to F: 20.0 ÷ 2.00 = 10.0 m/s².", "hack": "Double F = double a.", "src": "Problem 7.8"}, {"q": "Problem 7.9: A man weighs 900 N on Earth. His weight on Jupiter (g = 25.9 m/s²) is about", "options": ["2380 N", "900 N", "341 N", "23 300 N"], "answer": 0, "explanation": "m = 900 ÷ 9.80 = 91.8 kg. w = 91.8 × 25.9 ≈ 2380 N.", "hack": "Scale by g ratio: 900 × (25.9/9.8) ≈ 900 × 2.64.", "src": "Problem 7.9"}, {"q": "Problem 7.10: A stone weighing 180 N accelerates upward at 1.5 m/s². The force applied is about", "options": ["180 N", "208 N", "27.5 N", "153 N"], "answer": 1, "explanation": "m = 180 ÷ 9.8 = 18.4 kg. F = m(g + a) = 18.4 × 11.3 ≈ 208 N.", "hack": "Lifting while accelerating up: F = weight + ma.", "src": "Problem 7.10"}, {"q": "Problem 7.11: A professor (65.0 kg) pushes a cart (12.0 kg) with equipment (7.0 kg). She pushes back on the floor with 150 N; opposing forces total 24.0 N. The acceleration is", "options": ["1.79 m/s²", "0.286 m/s²", "1.50 m/s²", "2.31 m/s²"], "answer": 2, "explanation": "Total mass = 84.0 kg. Net force = 150 − 24.0 = 126 N. a = 126 ÷ 84.0 = 1.50 m/s².", "hack": "Add all three masses, subtract the opposing force.", "src": "Problem 7.11"}, {"q": "Problem 7.12: A 60.0 kg person weighs 100.0 N on the Moon. The Moon's g is", "options": ["0.600 m/s²", "9.80 m/s²", "6000 m/s²", "1.67 m/s²"], "answer": 3, "explanation": "g = w/m = 100.0 ÷ 60.0 = 1.67 m/s².", "hack": "g = weight ÷ mass.", "src": "Problem 7.12"}, {"q": "Problem 7.13: Which has greater value, a newton of gold on Earth or a newton of gold on the Moon?", "options": ["The newton of gold on the Moon", "The newton of gold on the Earth", "The value is the same, regardless", "None of the above"], "answer": 0, "explanation": "One newton of gold is 1/g kg. On the Moon g is smaller, so 1 N corresponds to more mass (about 0.62 kg vs 0.10 kg) and so more gold. (The notes give no answer key; this is the physics answer.)", "hack": "Gold's value follows mass, not weight. Smaller g means more mass per newton.", "src": "Problem 7.13"}, {"q": "Problem 7.14: Two forces act on a block on a frictionless floor: I: 5 N right and 3 N up; II: 5 N right and 3 N left; III: 5 N right and 3 N right; IV: 5 N right and 3 N up-right (about 45°). The ranking of the horizontal acceleration, greatest first, is", "options": ["II, I, IV, III", "III, IV, I, II", "III, I, IV, II", "IV, III, I, II"], "answer": 1, "explanation": "Horizontal net forces: III = 8 N, IV ≈ 5 + 3cos45° ≈ 7.1 N, I = 5 N (3 N is vertical), II = 5 − 3 = 2 N.", "hack": "Only HORIZONTAL components count. Add the ones in line, subtract the opposing ones.", "src": "Problem 7.14"}, {"q": "Problem 7.15: When a bird collides with the windshield of a fast-moving plane, which experiences the impact force with the larger magnitude?", "options": ["The bird", "The plane", "The same force is experienced by both", "Not enough information is given"], "answer": 2, "explanation": "The two forces are an action-reaction pair, so they are equal in size and opposite in direction.", "hack": "Third law: EQUAL forces. Always.", "src": "Problem 7.15"}, {"q": "Problem 7.16: In that collision, which experiences the greater acceleration?", "options": ["The plane", "The same acceleration is experienced by both", "Not enough information is given", "The bird"], "answer": 3, "explanation": "The forces are equal but a = F/m, and the bird has a far smaller mass.", "hack": "Same force, smaller mass, bigger acceleration.", "src": "Problem 7.16"}, {"q": "Problem 7.17: A net horizontal force of 130 N acts on a 60.0 kg person. The acceleration is", "options": ["2.17 m/s²", "0.462 m/s²", "7800 m/s²", "21.7 m/s²"], "answer": 0, "explanation": "a = 130 ÷ 60.0 = 2.17 m/s².", "hack": "130 ÷ 60 is just above 2.", "src": "Problem 7.17"}, {"q": "Problem 7.18: A 3000 N boulder is given a horizontal acceleration of 20.0 m/s². The horizontal force needed is about", "options": ["3000 N", "6120 N", "150 N", "60 000 N"], "answer": 1, "explanation": "m = 3000 ÷ 9.80 = 306 kg. F = ma = 306 × 20.0 ≈ 6120 N.", "hack": "Convert weight to mass first: m = w/g.", "src": "Problem 7.18"}, {"q": "Problem 7.19: A mass m has position x(t) = At + Bt³. The net force on it is", "options": ["F = 3mBt²", "F = mA + 3mBt", "F = 6mBt", "F = 6Bt"], "answer": 2, "explanation": "v = dx/dt = A + 3Bt². a = dv/dt = 6Bt. F = ma = 6mBt.", "hack": "Differentiate twice: Bt³ → 3Bt² → 6Bt; the At term vanishes.", "src": "Problem 7.19"}, {"q": "Problem 7.20: A 3.50 kg bucket is lifted by a cord that breaks at 65.7 N. The maximum upward acceleration is", "options": ["18.8 m/s²", "9.80 m/s²", "2.70 m/s²", "8.97 m/s²"], "answer": 3, "explanation": "a = (T − mg)/m = (65.7 − 34.3) ÷ 3.50 = 8.97 m/s².", "hack": "T − mg = ma with mg = 34.3 N.", "src": "Problem 7.20"}, {"q": "Problem 7.21(i): A watermelon weighs 52.0 N on Earth. Its mass is", "options": ["5.31 kg", "52.0 kg", "193 kg", "13.98 kg"], "answer": 0, "explanation": "m = 52.0 ÷ 9.80 = 5.31 kg.", "hack": "Divide by 9.8.", "src": "Problem 7.21"}, {"q": "Problem 7.21(ii): On Mars (g = 3.72 m/s²), that watermelon weighs", "options": ["52.0 N", "19.7 N", "5.31 N", "14.0 N"], "answer": 1, "explanation": "Mass is 5.31 kg on Mars too. w = 5.31 × 3.72 = 19.7 N.", "hack": "Same mass, new g.", "src": "Problem 7.21"}, {"q": "Problem 7.22(a): A book weighs 3.60 N where g = 9.8 m/s². Its mass is", "options": ["35.3 kg", "3.60 kg", "0.367 kg", "2.72 kg"], "answer": 2, "explanation": "m = w/g = 3.60 ÷ 9.8 = 0.367 kg.", "hack": "Small weight, small mass: w ÷ g.", "src": "Problem 7.22"}, {"q": "Problem 7.22(b): At the same location, a dog of mass 16.0 kg weighs", "options": ["16.0 N", "1.63 N", "9.8 N", "157 N"], "answer": 3, "explanation": "w = mg = 16.0 × 9.8 = 157 N.", "hack": "16 × 9.8.", "src": "Problem 7.22"}, {"q": "Problem 7.23: A 2800 N boulder is given a horizontal acceleration of 15.0 m/s². The horizontal force needed is about", "options": ["4290 N", "2800 N", "187 N", "42 000 N"], "answer": 0, "explanation": "m = 2800 ÷ 9.80 = 286 kg. F = ma = 286 × 15.0 ≈ 4290 N.", "hack": "Weight to mass first, then multiply by a.", "src": "Problem 7.23"}], "exercises": [{"q": "Example 7.1: A net horizontal force of 120 N acts on a 60.0 kg person on the edge of a pool. The acceleration is", "options": ["0.50 m/s²", "2.0 m/s²", "7200 m/s²", "20 m/s²"], "answer": 1, "explanation": "a = ΣF/m = 120 ÷ 60.0 = 2.0 m/s².", "hack": "120 ÷ 60 = 2.", "src": "Example 7.1"}, {"q": "Example 7.2: The net force needed to give a 165 kg refrigerator an acceleration of 2.40 m/s² is", "options": ["68.8 N", "3960 N", "396 N", "39.6 N"], "answer": 2, "explanation": "ΣF = ma = 165 × 2.40 = 396 N.", "hack": "165 × 2.4: 165 × 2 = 330, plus 165 × 0.4 = 66.", "src": "Example 7.2"}, {"q": "Example 7.3: A 64.0 N horizontal force on a box on frictionless ice produces an acceleration of 8.00 m/s². The mass is", "options": ["512 kg", "0.125 kg", "72.0 kg", "8.00 kg"], "answer": 3, "explanation": "m = ΣF/a = 64.0 ÷ 8.00 = 8.00 kg.", "hack": "64 ÷ 8 = 8.", "src": "Example 7.3"}, {"q": "Example 7.4 (part 1): A 20 000 kg truck on level track accelerates at 1.5 m/s². The forward force needed is", "options": ["30 000 N", "196 000 N", "13 300 N", "300 N"], "answer": 0, "explanation": "F = ma = 20 000 × 1.5 = 30 000 N.", "hack": "Horizontal: F = ma.", "src": "Example 7.4"}, {"q": "Example 7.4 (part 2): For the same truck, the force exerted by the track (normal force) is", "options": ["30 000 N", "196 000 N", "226 000 N", "166 000 N"], "answer": 1, "explanation": "ΣFᵧ = 0, so N = mg = 20 000 × 9.8 = 196 000 N.", "hack": "No vertical acceleration: N = mg.", "src": "Example 7.4"}, {"q": "Example 7.5: Four rockets each give thrust T on a 2100 kg sled with initial acceleration 49 m/s² against friction of 650 N. The total thrust 4T is", "options": ["About 1.0 × 10⁴ N", "About 2.6 × 10⁵ N", "About 1.0 × 10⁵ N", "About 6.5 × 10² N"], "answer": 2, "explanation": "4T = ma + f = 2100 × 49 + 650 = 102 900 + 650 ≈ 1.0 × 10⁵ N.", "hack": "Thrust must beat friction AND supply ma: 4T = ma + f.", "src": "Example 7.5"}, {"q": "Example 7.5 (individual thrust): Each rocket's thrust T is about", "options": ["1.0 × 10⁴ N", "4.1 × 10⁵ N", "6.5 × 10³ N", "2.6 × 10⁴ N"], "answer": 3, "explanation": "T = 1.04 × 10⁵ ÷ 4 ≈ 2.6 × 10⁴ N. (The notes print 1.0 × 10⁴ N, which is an arithmetic slip; dividing 1.0 × 10⁵ by 4 gives about 2.5 × 10⁴ N.)", "hack": "Divide the TOTAL by 4: 10.4 ÷ 4 = 2.6.", "src": "Example 7.5"}, {"q": "Example 7.6(a): A 0.400 kg soccer ball has acceleration a = 3.00i + 7.00j m/s². The resultant force is", "options": ["1.20i + 2.80j N", "7.50i + 17.5j N", "3.00i + 7.00j N", "2.80i + 1.20j N"], "answer": 0, "explanation": "F = ma = 0.400(3.00i + 7.00j) = 1.20i + 2.80j N.", "hack": "Multiply each component by the mass.", "src": "Example 7.6"}, {"q": "Example 7.6(b): The magnitude and direction of that resultant force are", "options": ["3.05 N at 23.2° above +x", "3.05 N at 66.8° above +x", "4.00 N at 66.8° above +x", "1.20 N at 66.8° above +x"], "answer": 1, "explanation": "F = √(1.20² + 2.80²) = √9.28 = 3.05 N. θ = tan⁻¹(2.80/1.20) = 66.8°. (The magnitude is garbled in the notes; the calculation gives 3.05 N.)", "hack": "Angle = tan⁻¹(y/x); the larger y-component means an angle above 45°.", "src": "Example 7.6"}, {"q": "Example 7.7 (x): A 4.0 kg particle has F₁ = 10.0 N at 30° above +x, F₂ = 40.0 N down, F₃ = 5.0 N toward −x, F₄ = 2.0 N up. Its x-acceleration is", "options": ["0.57 m/s²", "−8.3 m/s²", "0.92 m/s²", "3.7 m/s²"], "answer": 2, "explanation": "ΣFₓ = 10.0 cos30° − 5.0 = 3.66 N. aₓ = 3.66 ÷ 4.0 ≈ 0.92 m/s².", "hack": "Only F₁ and F₃ have x-components.", "src": "Example 7.7"}, {"q": "Example 7.7 (y): For the same particle, the y-acceleration is", "options": ["+8.3 m/s²", "−33 m/s²", "−0.92 m/s²", "−8.3 m/s²"], "answer": 3, "explanation": "ΣF_y = 10.0 sin30° + 2.0 − 40.0 = −33 N. a_y = −33 ÷ 4.0 ≈ −8.3 m/s² (downward).", "hack": "F₁ sin30° is 5 N, then add F₄ and subtract F₂.", "src": "Example 7.7"}, {"q": "Example 7.7 (direction): The acceleration of that particle points at about", "options": ["276° from the +x axis", "84° from the +x axis", "6° from the +x axis", "96° from the +x axis"], "answer": 0, "explanation": "tan⁻¹(8.3/0.92) ≈ 84° below the +x axis, which is 360° − 84° = 276°.", "hack": "Mostly downward with a small +x part: just short of 270°.", "src": "Example 7.7"}, {"q": "Example 7.8: A cyclist and bike (100 kg) have a forward push F = 320 N against drag D = 180 N. The acceleration is", "options": ["5.0 m/s²", "1.4 m/s²", "3.2 m/s²", "0.71 m/s²"], "answer": 1, "explanation": "F − D = ma, so a = (320 − 180) ÷ 100 = 1.4 m/s².", "hack": "Net force = 140 N; divide by 100.", "src": "Example 7.8"}, {"q": "Example 7.9: A constant force reduces the velocity of a 5.0 kg object from 7.0 m/s to 3.0 m/s in 3.0 s. The force is", "options": ["+6.7 N", "−3.3 N", "−6.7 N", "−20 N"], "answer": 2, "explanation": "a = (3.0 − 7.0)/3.0 = −1.33 m/s². F = 5.0 × (−1.33) = −6.7 N, a retarding force.", "hack": "Velocity falling means a negative force.", "src": "Example 7.9"}, {"q": "Example 7.10: A 62 kg passenger rides a lift accelerating upward at 1.5 m/s². The reaction force of the lift floor is about", "options": ["608 N", "93 N", "515 N", "700 N"], "answer": 3, "explanation": "R = m(g + a) = 62 × (9.8 + 1.5) ≈ 700 N.", "hack": "Going up: R = W + ma.", "src": "Example 7.10"}, {"q": "Example 7.11: A 45 kg woman slides down a rope that can bear only 300 N. Her minimum acceleration is about", "options": ["3.1 m/s²", "9.8 m/s²", "6.7 m/s²", "0.31 m/s²"], "answer": 0, "explanation": "mg = 441 N. Unbalanced force = 441 − 300 = 141 N. a = 141 ÷ 45 = 3.1 m/s².", "hack": "Rope holds back 300 N; the rest accelerates her.", "src": "Example 7.11"}, {"q": "Example 7.12: A 70 kg box is pushed by a 400 N horizontal force with μ = 0.50. The friction force is about", "options": ["35 N", "344 N", "200 N", "687 N"], "answer": 1, "explanation": "N = mg = 687 N. F_f = μN = 0.50 × 687 ≈ 344 N.", "hack": "Friction = μ × N, with N = mg on level ground.", "src": "Example 7.12"}, {"q": "Example 7.12 (acceleration): With a 400 N push and 344 N friction on the 70 kg box, the acceleration is about", "options": ["5.7 m/s²", "1.1 m/s²", "0.80 m/s²", "0.080 m/s²"], "answer": 2, "explanation": "ΣFₓ = 400 − 344 = 56 N. a = 56 ÷ 70 = 0.80 m/s².", "hack": "Net force over mass: 56 ÷ 70.", "src": "Example 7.12"}, {"q": "Example 7.13: A 70 kg box is pulled by 400 N at 30° above horizontal, with μ_k = 0.50. The normal force is about", "options": ["687 N", "887 N", "343 N", "486 N"], "answer": 3, "explanation": "N + 400 sin30° = mg, so N = 687 − 200 = 486 N (the notes use 486 N, then 485 N, as a rounding slip).", "hack": "The upward component of the pull reduces N.", "src": "Example 7.13"}, {"q": "Example 7.13 (acceleration): For that box, the acceleration is about", "options": ["1.5 m/s²", "5.7 m/s²", "0.80 m/s²", "2.2 m/s²"], "answer": 0, "explanation": "400 cos30° = 346 N. F_f = 0.50 × 486 = 243 N. a = (346 − 243) ÷ 70 ≈ 1.5 m/s².", "hack": "Pulling at an angle: smaller N, smaller friction, bigger a than Example 7.12.", "src": "Example 7.13"}, {"q": "Rolls-Royce example: A 2.49 × 10⁴ N car makes an emergency stop with net force −1.83 × 10⁴ N. Its acceleration is", "options": ["−0.735 m/s²", "−7.20 m/s²", "−9.80 m/s²", "−72.0 m/s²"], "answer": 1, "explanation": "m = w/g = 2540 kg. a = −1.83 × 10⁴ ÷ 2540 = −7.20 m/s².", "hack": "Convert weight to mass before dividing.", "src": "Mass and weight example (Rolls-Royce)"}]}, {"chapter": 8, "title": "Dynamics of Particles and Frictional Forces", "concept": [{"q": "A particle in physics is idealised as", "options": ["A point mass with no rotational inertia", "A body with a definite orientation", "A rigid body spinning on an axis", "A mass with no weight"], "answer": 0, "explanation": "It has a position and a mass but no orientation or rotational inertia.", "hack": "PARTICLE = POINT. Size and spin ignored."}, {"q": "Which situation is a good place to treat the body as a particle?", "options": ["Calculating how a spinning top wobbles", "Calculating the orbit of a small satellite", "Finding the torque on a door", "Studying how a wheel rotates"], "answer": 1, "explanation": "The satellite is tiny compared with its orbit and its orientation does not matter.", "hack": "Treat as a particle when size and orientation are irrelevant."}, {"q": "A particle is in equilibrium when the net force on it is", "options": ["Constant and nonzero", "Equal to its weight", "Zero", "Equal to its mass"], "answer": 2, "explanation": "Newton's first law: ΣF = 0 means no change in the state of motion.", "hack": "EQUILIBRIUM = ZERO NET FORCE."}, {"q": "A particle in equilibrium is either", "options": ["At rest or accelerating uniformly", "Moving with changing speed", "Moving in a circle at changing speed", "At rest or moving with constant velocity"], "answer": 3, "explanation": "Equilibrium includes both static (at rest) and dynamic (constant velocity) cases.", "hack": "Static = still. Dynamic = steady speed in a line."}, {"q": "Static equilibrium refers to a particle that is", "options": ["At rest", "Moving with constant velocity", "Accelerating uniformly", "Falling freely"], "answer": 0, "explanation": "Static means the particle does not move.", "hack": "STATic = STAY."}, {"q": "Dynamic equilibrium refers to a particle that is", "options": ["At rest", "Moving with constant velocity", "Moving with constant acceleration", "Changing direction"], "answer": 1, "explanation": "ΣF = 0 but the particle still moves at steady velocity.", "hack": "Cruising plane: dynamic equilibrium."}, {"q": "Which of these is a particle in equilibrium?", "options": ["A ball thrown upward at its highest point, falling", "A car braking to a stop", "An airplane flying straight and level at constant speed", "A stone dropped from a tower"], "answer": 2, "explanation": "Constant velocity means zero acceleration, so the net force is zero.", "hack": "Steady speed, straight line: equilibrium."}, {"q": "For a particle in equilibrium, in component form", "options": ["ΣFₓ = ma, ΣFᵧ = ma and ΣF_z = ma", "ΣFₓ + ΣFᵧ = mg", "ΣF = mg in every direction", "ΣFₓ = 0, ΣFᵧ = 0 and ΣF_z = 0"], "answer": 3, "explanation": "The sum of forces in each direction is zero.", "hack": "Resolve, then set each direction to zero."}, {"q": "To solve an equilibrium problem the forces are first", "options": ["Resolved into perpendicular components", "Added as scalars", "Multiplied together", "Converted to energies"], "answer": 0, "explanation": "Resolve into x, y (and z), then set the component sums to zero.", "hack": "RESOLVE → SUM = 0 → SOLVE."}, {"q": "A 250 N weight hangs at each end of a rope over a light frictionless pulley hung from a chain. The tension in the chain is", "options": ["250 N", "500 N", "125 N", "750 N"], "answer": 1, "explanation": "The pulley is in equilibrium: T_chain = 250 + 250 = 500 N.", "hack": "Chain carries BOTH weights."}, {"q": "Three forces keep a particle in equilibrium. Their vector sum is", "options": ["Equal to the largest force", "Equal to the sum of their magnitudes", "Zero", "Equal to the weight"], "answer": 2, "explanation": "ΣF = 0 for equilibrium.", "hack": "Three forces in equilibrium close into a triangle."}, {"q": "Dynamics of particles is the study of", "options": ["Motion described without any forces", "Particles that are always at rest", "The mass of individual atoms only", "Motion of particles and the forces causing it"], "answer": 3, "explanation": "Dynamics links the motion with the forces responsible.", "hack": "DYNAMICS = motion + forces."}, {"q": "A particle is in the dynamic (non-equilibrium) case when", "options": ["The net force is not zero", "The net force is zero", "Its velocity is constant", "Its acceleration is zero"], "answer": 0, "explanation": "Nonzero net force means acceleration and changing velocity.", "hack": "ΣF ≠ 0 → accelerating."}, {"q": "For a particle that accelerates, the governing law is", "options": ["ΣF = 0", "ΣF = ma", "ΣF = mv²", "ΣF = m/a"], "answer": 1, "explanation": "Newton's second law applies to any body that is not in equilibrium.", "hack": "Any acceleration problem: use ΣF = ma."}, {"q": "Two types of interaction mentioned for a particle are", "options": ["Push–push and pull–pull", "Static and dynamic only", "Body–body (contact) and body–field", "Scalar and vector"], "answer": 2, "explanation": "Contact between bodies, or a field acting at a distance.", "hack": "Contact or field."}, {"q": "An upward force of 1.2 × 10⁴ N acts on a 2.0 × 10³ kg lift. Its acceleration is about", "options": ["+3.8 m/s², i.e. upward", "+6.0 m/s², i.e. upward", "−9.8 m/s², i.e. downward", "−3.8 m/s², i.e. downward"], "answer": 3, "explanation": "F − mg = ma: 12 000 − 19 600 = −7600 N, so a = −3.8 m/s².", "hack": "Pull is LESS than weight, so it still accelerates downward."}, {"q": "The impulse of a force on a body equals the change in its", "options": ["Momentum", "Kinetic energy", "Mass", "Potential energy"], "answer": 0, "explanation": "Ft = mv − mu.", "hack": "IMPULSE = Δ MOMENTUM."}, {"q": "Impulse is the product of", "options": ["Force and the distance it acts over", "Force and the time it acts", "Mass and velocity", "Mass and acceleration"], "answer": 1, "explanation": "J = Ft.", "hack": "Force × TIME = impulse; force × DISTANCE = work."}, {"q": "Momentum is the product of", "options": ["Mass and acceleration", "Force and time", "Mass and velocity", "Force and distance"], "answer": 2, "explanation": "p = mv.", "hack": "P = mv."}, {"q": "The principle of conservation of linear momentum states that the total momentum of a system stays constant if", "options": ["The kinetic energy stays constant", "The masses are equal", "All the collisions are elastic", "No external force acts on the system"], "answer": 3, "explanation": "Isolated system: total momentum before = total momentum after.", "hack": "No external force, no momentum change."}, {"q": "For two colliding bodies, the conservation of momentum is written", "options": ["m_A u_A + m_B u_B = m_A v_A + m_B v_B", "m_A u_A − m_B u_B = m_A v_A + m_B v_B", "m_A v_A = m_B v_B always", "m_A + m_B = u_A + u_B"], "answer": 0, "explanation": "Total momentum before the collision equals total momentum after it.", "hack": "u = before, v = after. Sum on each side."}, {"q": "Frictional force acts between", "options": ["Two bodies far apart", "Two surfaces in contact", "A body and a magnetic field", "Two charges"], "answer": 1, "explanation": "Friction is a contact force.", "hack": "No touching, no friction."}, {"q": "Without friction between the tyres and the road, a car", "options": ["Would accelerate faster", "Would stop at once", "Could not accelerate, brake or turn", "Would use less fuel while braking"], "answer": 2, "explanation": "Friction between tyre and road provides the force needed to drive and steer.", "hack": "Friction is why we can move at all."}, {"q": "Air drag is", "options": ["A force that pushes bodies upward", "The weight of the air", "A long-range force", "The frictional force of air on a moving body"], "answer": 3, "explanation": "It lowers fuel economy but makes parachutes work.", "hack": "Air drag = friction from air."}, {"q": "Kinetic friction is the friction force that acts when a body", "options": ["Slides over a surface", "Rests on a surface", "Moves through a vacuum", "Is about to start moving"], "answer": 0, "explanation": "Kinetic means moving.", "hack": "KINETIC = MOVING."}, {"q": "Static friction is the friction force that acts when a body", "options": ["Slides at constant speed", "Rests on a surface and is not sliding", "Rolls down a slope", "Falls freely"], "answer": 1, "explanation": "It resists the start of motion.", "hack": "STATIC = STAYING."}, {"q": "The kinetic friction force is given by", "options": ["f_k = μ_k / N", "f_k = N / μ_k", "f_k = μ_k N", "f_k = μ_k mg² only"], "answer": 2, "explanation": "Coefficient of kinetic friction times the normal force.", "hack": "f = μN."}, {"q": "The maximum static friction force is given by", "options": ["f_s(max) = μ_s / N", "f_s(max) = μ_k N", "f_s(max) = N / μ_s", "f_s(max) = μ_s N"], "answer": 3, "explanation": "Static friction can take any value up to μ_s N.", "hack": "Static friction: ≤ μN."}, {"q": "The magnitude of static friction obeys", "options": ["f_s ≤ μ_s N", "f_s = μ_k N always", "f_s ≥ μ_s N always", "f_s = mg always"], "answer": 0, "explanation": "It equals the applied force until the limit μ_s N is reached.", "hack": "Static friction is as big as it needs to be, up to μN."}, {"q": "A crate at rest is pushed horizontally with 50 N and does not move. The friction force is", "options": ["0 N", "50 N", "μ_k N", "Greater than 50 N"], "answer": 1, "explanation": "Horizontal equilibrium: applied force = friction = 50 N.", "hack": "At rest: friction exactly cancels the push."}, {"q": "For the same pair of surfaces, the coefficients of friction normally satisfy", "options": ["μ_s less than μ_k", "μ_s equal to μ_k always", "μ_s greater than μ_k", "μ_s = 0"], "answer": 2, "explanation": "It takes more force to start a box than to keep it moving.", "hack": "Starting is harder than keeping going."}, {"q": "The coefficient of friction has", "options": ["Units of newtons", "Units of kg", "Units of N/m", "No units"], "answer": 3, "explanation": "It is a ratio of two forces.", "hack": "N ÷ N = no unit."}, {"q": "A 100 N normal force and 20 N kinetic friction give μ_k equal to", "options": ["0.20", "5.0", "2.0", "0.05"], "answer": 0, "explanation": "μ = f/N = 20 ÷ 100 = 0.20.", "hack": "Friction over normal."}, {"q": "The maximum static friction on a body with N = 40 N and μ_s = 0.5 is", "options": ["80 N", "20 N", "0.0125 N", "40 N"], "answer": 1, "explanation": "f_max = μ_s N = 0.5 × 40 = 20 N.", "hack": "Multiply μ by N."}, {"q": "A box of mass 2.0 kg slides with deceleration 4.0 m/s² on a level floor. μ_k is about", "options": ["0.20", "2.4", "0.41", "4.9"], "answer": 2, "explanation": "μ_k mg = ma, so μ_k = a/g = 4.0 ÷ 9.8 = 0.41.", "hack": "Level floor: μ = a/g."}, {"q": "A crate is pulled at constant speed by a rope above the horizontal. Compared with its weight, the normal force is", "options": ["Greater than the weight", "Equal to the weight", "Zero", "Smaller than the weight"], "answer": 3, "explanation": "N = w − T sinθ, because the rope supports part of the load.", "hack": "Pull up: N drops. Push down: N rises."}, {"q": "A crate moves at constant velocity. Which statement is correct?", "options": ["The net force on it is zero", "The net force is in the direction of motion", "The net force equals its weight", "The friction force is zero"], "answer": 0, "explanation": "Constant velocity means a = 0, so ΣF = 0.", "hack": "Constant velocity = balanced forces."}, {"q": "Uniform circular motion is motion", "options": ["At constant velocity on a circular path", "At constant speed on a circular path", "At increasing speed on a circle", "In a straight line at constant speed"], "answer": 1, "explanation": "The speed is constant but the direction keeps changing.", "hack": "Same speed, changing direction."}, {"q": "In uniform circular motion the acceleration is directed", "options": ["Along the velocity", "Away from the centre", "Toward the centre of the circle", "Opposite to the velocity"], "answer": 2, "explanation": "Centripetal acceleration points to the centre.", "hack": "CENTRI-PETAL = centre-seeking."}, {"q": "The period T of uniform circular motion is", "options": ["T = v / 2πr", "T = 2πv / r", "T = r / v²", "T = 2πr / v"], "answer": 3, "explanation": "Circumference divided by speed.", "hack": "Time = distance ÷ speed, distance = 2πr."}, {"q": "A particle moves at 10π m/s on a circle of radius 5 m. Its period is", "options": ["1 s", "π s", "0.5 s", "10 s"], "answer": 0, "explanation": "T = 2πr/v = 2π × 5 ÷ 10π = 1 s.", "hack": "2π × 5 = 10π, which cancels the speed."}, {"q": "The centripetal acceleration of a particle in uniform circular motion is", "options": ["a = v / r²", "a = v² / r", "a = vr", "a = r / v²"], "answer": 1, "explanation": "Speed squared over radius istance squared, times G.", "hack": "Inverse SQUARE law."}, {"q": "If the distance between two masses is doubled, the gravitational force becomes", "options": ["Half", "One quarter", "Double", "Four times"], "answer": 1, "explanation": "F ∝ 1/r², so doubling r gives (1/2)² = 1/4 of the force.", "hack": "Double distance → ÷4. Triple → ÷9."}, {"q": "If one of the two masses is doubled, the gravitational force", "options": ["Is halved", "Becomes four times", "Doubles", "Stays the same"], "answer": 2, "explanation": "F is proportional to each mass.", "hack": "Force scales directly with either mass."}, {"q": "A spherical planet attracts as if all its mass were", "options": ["Spread on its surface", "Located at its poles", "Zero", "Concentrated at its centre"], "answer": 3, "explanation": "For spheres, treat the mass as a point at the centre.", "hack": "Sphere = point at the middle."}, {"q": "Gravitational acceleration at a place is independent of the", "options": ["Mass of the falling object", "Mass of the planet", "Distance from the planet's centre", "Radius of the planet"], "answer": 0, "explanation": "Both F and m cancel the object's mass in a = F/m.", "hack": "Heavy and light fall together."}, {"q": "The gravitational potential energy of a body of mass m at distance r from the centre of the Earth (mass M) is", "options": ["+GMm / r", "−GMm / r", "−GMm / r²", "GMm r"], "answer": 1, "explanation": "The notes derive U = −GMm/r, with zero at infinity.", "hack": "Negative: bound to the planet."}, {"q": "The gravitational potential energy at infinite distance from the Earth is", "options": ["Negative and large", "Positive and large", "Zero", "Equal to −GMm/R"], "answer": 2, "explanation": "The reference point (U = 0) is at infinity.", "hack": "Far away, no attraction, U = 0."}, {"q": "Escape velocity is the", "options": ["Speed of a satellite in a low orbit", "Speed of a body falling at the surface", "Maximum speed of the planet itself", "Minimum speed needed to leave a planet for good"], "answer": 3, "explanation": "With that speed the body reaches infinity without further propulsion.", "hack": "Escape = minimum speed to never return."}, {"q": "The escape velocity is given by", "options": ["v_esc = √(2GM / r)", "v_esc = √(GM / r)", "v_esc = 2GM / r", "v_esc = GM / r²"], "answer": 0, "explanation": "From kinetic energy = magnitude of gravitational potential energy.", "hack": "Escape: √(2GM/r). Orbit: √(GM/r)."}, {"q": "The escape velocity does NOT depend on the", "options": ["Mass of the attracting planet", "Mass or direction of the escaping object", "Radius of the attracting planet", "Value of the constant G"], "answer": 1, "explanation": "It depends only on the planet's mass and radius.", "hack": "Direction and object's mass do not matter."}, {"q": "A planet with a larger mass (same radius) has an escape velocity that is", "options": ["Smaller", "The same", "Larger", "Zero"], "answer": 2, "explanation": "v_esc ∝ √M.", "hack": "Heavier planet = harder to leave."}, {"q": "A planet with a smaller radius (same mass) has an escape velocity that is", "options": ["Smaller", "The same", "Negative", "Larger"], "answer": 3, "explanation": "v_esc ∝ 1/√r.", "hack": "Closer to the centre = stronger pull."}, {"q": "The escape velocity from the Earth's surface is about", "options": ["11.2 km/s", "2.4 km/s", "7.9 km/s", "340 m/s"], "answer": 0, "explanation": "The notes give about 11.2 km/s (11.17 km/s).", "hack": "Earth 11.2, Moon 2.4."}, {"q": "The escape velocity from the Moon is about", "options": ["11.2 km/s", "2.4 km/s", "7.9 km/s", "0.24 km/s"], "answer": 1, "explanation": "The Moon's is far smaller than Earth's.", "hack": "Moon is a small world: 2.4."}, {"q": "The orbital speed of a satellite in a circular orbit of radius r is", "options": ["v = √(2GM / r)", "v = GM / r", "v = √(GM / r)", "v = GM / r²"], "answer": 2, "explanation": "Gravity supplies the centripetal force: GMm/r² = mv²/r.", "hack": "Gravity = centripetal force."}, {"q": "In
