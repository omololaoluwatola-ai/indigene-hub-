tellites are commonly used for", "options": ["Mapping the poles", "Global navigation (GPS)", "Scientific research on the ISS", "Weather monitoring and television broadcasting"], "answer": 3, "explanation": "A fixed position over the equator suits communications.", "hack": "Always overhead: TV and weather."}, {"q": "Global navigation systems such as GPS use", "options": ["Medium Earth Orbit", "Low Earth Orbit", "Geostationary orbit", "Polar orbit"], "answer": 0, "explanation": "MEO lies between LEO and GEO.", "hack": "GPS = MEO."}, {"q": "A polar orbit passes", "options": ["Over the equator only", "Over or near the Earth's poles", "Only over the oceans", "Only over one fixed point"], "answer": 1, "explanation": "As the Earth rotates below, the satellite views the whole globe.", "hack": "Polar = poles, whole-Earth mapping."}, {"q": "The Earth's escape velocity is about 11.2 km/s. An orbiting satellite at the surface would be moving at about", "options": ["15.8 km/s", "11.2 km/s", "7.9 km/s", "5.6 km/s"], "answer": 2, "explanation": "v_orbit = v_esc/√2 = 11.2 ÷ 1.414 ≈ 7.9 km/s.", "hack": "Divide the escape speed by 1.41."}, {"q": "A particle in uniform circular motion has centripetal acceleration that", "options": ["Decreases with force and increases with mass", "Is independent of both force and mass", "Is zero", "Increases with force and decreases with mass"], "answer": 3, "explanation": "a = F/m from Newton's second law.", "hack": "a = F/m again."}, {"q": "Gravitational forces cause objects to orbit in", "options": ["Circular or elliptical paths", "Straight lines only", "Zigzag paths", "Parabolic paths only"], "answer": 0, "explanation": "Orbits are circles or ellipses; a body that moves too fast escapes.", "hack": "Orbit = circle or ellipse."}], "tutorial": [{"q": "Problem 8.1: A 52 N sled is pulled at constant speed along a cement sidewalk by a horizontal 36 N force. The coefficient of kinetic friction is", "options": ["1.44", "0.69", "0.31", "0.52"], "answer": 1, "explanation": "T = 1/(830 rev/min) = 1.2 × 10⁻³ min = 0.072 s.", "hack": "Period = 60 s ÷ 830 rev.", "src": "Example 8.7"}, {"q": "Example 8.7 (speed): The speed of the outer edge of that wheel is about", "options": ["0.25 m/s", "2.5 m/s", "25 m/s", "40 m/s"], "answer": 2, "explanation": "v = 2πr/T = 2π × 0.29 ÷ 0.072 ≈ 25 m/s.", "hack": "v = 2πr/T.", "src": "Example 8.7"}]}, {"chapter": 9, "title": "Conservation Laws", "concept": [{"q": "A conservation law states that a measurable quantity of an isolated system", "options": ["Always increases with time", "Does not change with time", "Always decreases with time", "Changes only in a collision"], "answer": 1, "explanation": "In classical physics, energy, momentum, angular momentum, mass and charge are conserved in an isolated system.", "hack": "ISOLATED SYSTEM = constant total."}, {"q": "Which of these is conserved in classical physics for an isolated system?", "options": ["Velocity", "Force", "Angular momentum", "Acceleration"], "answer": 2, "explanation": "Energy, linear momentum, angular momentum, mass and electric charge are conserved.", "hack": "Conserved: E, p, L, charge, mass."}, {"q": "The principle of conservation of linear momentum says that the total momentum is constant when", "options": ["The kinetic energy is constant", "All bodies have equal masses", "Collisions are perfectly elastic", "No external force acts on the system"], "answer": 3, "explanation": "Without an external force, total momentum before = total momentum after.", "hack": "No outside push, no change in total p."}, {"q": "Linear momentum is defined as the product of", "options": ["Mass and velocity", "Mass and acceleration", "Force and time", "Mass and speed squared"], "answer": 0, "explanation": "p = mv.", "hack": "p = mv."}, {"q": "A rocket moves forward because", "options": ["The exhaust gases push against the outside air", "Its forward momentum balances the exhaust's backward momentum", "Its mass keeps increasing as the fuel burns", "Gravity pulls it forward along its path"], "answer": 1, "explanation": "Momentum is conserved: rocket forward = exhaust backward.", "hack": "Rocket and gas swap momentum."}, {"q": "In a collision of two bodies with no external force, the total momentum", "options": ["Is larger after", "Is smaller after", "Is the same before and after", "Is zero before"], "answer": 2, "explanation": "m_A u_A + m_B u_B = m_A v_A + m_B v_B.", "hack": "Before = after, always (if isolated)."}, {"q": "In a collision, the force A exerts on B and the force B exerts on A are", "options": ["Equal in size and in the same direction", "Larger on the heavier body", "Zero if the bodies are at rest", "Equal in size and opposite in direction"], "answer": 3, "explanation": "Newton's third law is used to derive conservation of momentum.", "hack": "F_AB = −F_BA."}, {"q": "The conservation of momentum for two colliding bodies is derived using Newton's", "options": ["Third law", "First law", "Law of gravitation", "Law of cooling"], "answer": 0, "explanation": "F_AB = −F_BA, with F = rate of change of momentum.", "hack": "Action–reaction gives conserved momentum."}, {"q": "A 1 kg ball at 12 m/s hits a 2 kg ball moving at 24 m/s in the opposite direction. The total momentum before the collision is", "options": ["+36 kg·m/s", "−36 kg·m/s", "−60 kg·m/s", "+60 kg·m/s"], "answer": 1, "explanation": "Taking the first direction as positive: 1 × 12 + 2 × (−24) = −36 kg·m/s.", "hack": "Opposite directions: opposite signs."}, {"q": "In a perfectly inelastic collision where the bodies stick together, which is conserved?", "options": ["Kinetic energy only", "Both momentum and kinetic energy", "Momentum only", "Neither momentum nor kinetic energy"], "answer": 2, "explanation": "Momentum is conserved whenever no external force acts; kinetic energy is lost in an inelastic collision.", "hack": "Momentum ALWAYS (if isolated). KE only if elastic."}, {"q": "A bullet embeds in a block on a frictionless surface. What is conserved?", "options": ["Kinetic energy alone", "Both momentum and kinetic energy", "Neither momentum nor kinetic energy", "Momentum alone"], "answer": 3, "explanation": "No external force acts, so momentum is conserved; the collision is inelastic, so KE is not.", "hack": "Embedded = inelastic: p yes, KE no."}, {"q": "In an elastic collision, the total kinetic energy", "options": ["Is the same before and after", "Is larger after", "Is smaller after", "Is zero after"], "answer": 0, "explanation": "Elastic collisions conserve both momentum and kinetic energy.", "hack": "Elastic = KE kept."}, {"q": "The coefficient of restitution e for two bodies is", "options": ["e = (v₂ + v₁)/(u₁ + u₂)", "e = (v₂ − v₁)/(u₁ − u₂)", "e = (u₁ − u₂)/(v₂ − v₁)", "e = (v₁ − v₂)/(u₁ + u₂)"], "answer": 1, "explanation": "Relative speed of separation over relative speed of approach.", "hack": "e = SEPARATION ÷ APPROACH."}, {"q": "A stationary body explodes into parts. The total momentum of the parts is", "options": ["Equal to the mass", "Equal to the kinetic energy", "Zero", "Greater than zero"], "answer": 2, "explanation": "The initial momentum was zero and is conserved, so the parts' vector sum is zero.", "hack": "Start at rest → parts' momenta cancel."}, {"q": "A 3 kg body at rest explodes into three equal parts. Two parts fly off at right angles with 2 m/s and 3 m/s. The third part's momentum is", "options": ["+(2i + 3j) kg·m/s", "−(3i + 2j) kg·m/s", "(2i − 3j) kg·m/s", "−(2i + 3j) kg·m/s"], "answer": 3, "explanation": "Each part is 1 kg. p₃ = −(p₁ + p₂) = −(2i + 3j).", "hack": "Third piece cancels the other two."}, {"q": "A third piece of that explosion experiences the change in momentum −(2i + 3j) kg·m/s in 10⁻³ s. The average force on it is", "options": ["(−2i − 3j) × 10³ N", "(2i + 3j) × 10³ N", "(−2i − 3j) × 10⁻³ N", "(2i − 3j) × 10⁻³ N"], "answer": 0, "explanation": "F = Δp/t = −(2i + 3j) ÷ 10⁻³ = (−2i − 3j) × 10³ N.", "hack": "Dividing by 10⁻³ multiplies by 1000."}, {"q": "Conservation of angular momentum states that a rotating body keeps spinning at the same rate unless", "options": ["An external force of any kind acts", "An external torque acts on it", "Its mass increases", "Its speed exceeds 1 rad/s"], "answer": 1, "explanation": "With zero net external torque, L is constant.", "hack": "No torque, no change in L."}, {"q": "Angular momentum is a", "options": ["Scalar quantity", "Dimensionless quantity", "Vector quantity", "Force"], "answer": 2, "explanation": "L has magnitude and direction.", "hack": "Vector, like torque."}, {"q": "The angular momentum of a rigid body is given by", "options": ["L = Iα", "L = ½Iω²", "L = I/ω", "L = Iω"], "answer": 3, "explanation": "Moment of inertia times angular velocity.", "hack": "L = Iω."}, {"q": "The unit of angular momentum is", "options": ["kg·m²/s", "kg·m/s", "kg·m²", "N·m"], "answer": 0, "explanation": "(kg·m²)(rad/s).", "hack": "Extra m² compared with linear momentum."}, {"q": "An ice skater pulls in her arms while spinning. Her moment of inertia", "options": ["Increases, so her angular velocity increases", "Decreases, so her angular velocity increases", "Stays constant, so her angular velocity stays constant", "Decreases, so her angular velocity decreases"], "answer": 1, "explanation": "Iω is constant (no external torque), so a smaller I means a larger ω.", "hack": "Arms in = spin faster."}, {"q": "When the skater pulls her arms in, her rotational kinetic energy", "options": ["Decreases, because she loses energy", "Stays exactly the same", "Increases, because she does work", "Becomes zero"], "answer": 2, "explanation": "The work done pulling in the arms increases the rotational kinetic energy.", "hack": "Same L, smaller I: KE = L²/2I goes up."}, {"q": "The net torque on a spinning skater is nearly zero because", "options": ["Gravity is zero when she is on ice", "She has no mass at the pivot point", "Her arms are always fully extended", "Friction is small and acts near the pivot"], "answer": 3, "explanation": "Little friction between skate and ice, and it acts near the axis.", "hack": "Small friction near the pivot = tiny torque."}, {"q": "The moment of inertia of a point mass m at distance r from the axis is", "options": ["I = mr²", "I = mr", "I = ½mr²", "I = m/r²"], "answer": 0, "explanation": "I = Σmr² for a collection of particles.", "hack": "m times r SQUARED."}, {"q": "The moment of inertia of a sphere about its centre is", "options": ["I = ½MR²", "I = (2/5)MR²", "I = MR²", "I = (1/3)MR²"], "answer": 1, "explanation": "From the table: 2mr²/5.", "hack": "Sphere: 2/5."}, {"q": "The moment of inertia of a solid cylinder about its axis of symmetry is", "options": ["I = (2/5)MR²", "I = MR²", "I = ½MR²", "I = (1/12)MR²"], "answer": 2, "explanation": "From the table: mr²/2.", "hack": "Cylinder/disc: ½."}, {"q": "The moment of inertia of a thin rod of length L about its centre is", "options": ["I = (1/3)ML²", "I = ½ML²", "I = ML²", "I = (1/12)ML²"], "answer": 3, "explanation": "From the table: mL²/12 (about the centre).", "hack": "Centre 1/12. End 1/3."}, {"q": "The moment of inertia of a thin rod of length L about one end is", "options": ["I = (1/3)ML²", "I = (1/12)ML²", "I = ½ML²", "I = ML²/4"], "answer": 0, "explanation": "From the table: mL²/3 (about one end).", "hack": "End is 4 × centre: 1/3 = 4/12."}, {"q": "A 12 kg rod of length 1 m rotates about its centre. Its moment of inertia is", "options": ["4 kg·m²", "1 kg·m²", "6 kg·m²", "12 kg·m²"], "answer": 1, "explanation": "I = (1/12)ML² = (1/12)(12)(1)² = 1 kg·m².", "hack": "12 cancels the 1/12."}, {"q": "A 12 kg rod of length 1 m rotates about one end. Its moment of inertia is", "options": ["1 kg·m²", "12 kg·m²", "4 kg·m²", "2 kg·m²"], "answer": 2, "explanation": "I = (1/3)ML² = (1/3)(12)(1)² = 4 kg·m².", "hack": "12 ÷ 3."}, {"q": "The moment of inertia of a ring about its centre, perpendicular to its plane, is", "options": ["I = ½MR²", "I = (2/5)MR²", "I = (1/12)MR²", "I = MR²"], "answer": 3, "explanation": /s", "7.5 rad/s"], "answer": 0, "explanation": "ω = αt = 2.5 × 5 = 12.5 rad/s.", "hack": "From rest: ω = αt."}, {"q": "For the same turntable, the angular displacement in 5 s is", "options": ["62.5 rad", "31.25 rad", "12.5 rad", "15.6 rad"], "answer": 1, "explanation": "θ = ½αt² = ½ × 2.5 × 25 = 31.25 rad, about 4.97 rev.", "hack": "Square the 5 first: 25."}, {"q": "The centripetal (radial) acceleration of a rotating particle is", "options": ["a_R = rα", "a_R = vr", "a_R = v²/r", "a_R = v/r²"], "answer": 2, "explanation": "It points toward the centre. Also a_R = ω²r.", "hack": "Centripetal: v²/r = ω²r."}, {"q": "The tangential acceleration of a rotating particle is", "options": ["a_T = v²/r", "a_T = ω²r", "a_T = r/α", "a_T = rα"], "answer": 3, "explanation": "a_T = dv/dt = r dω/dt = rα.", "hack": "Tangential: r α. Radial: ω² r."}, {"q": "The magnitude of the total acceleration of a point in rotation is", "options": ["√(a_R² + a_T²)", "a_R + a_T", "a_R − a_T", "a_R × a_T"], "answer": 0, "explanation": "The two components are perpendicular.", "hack": "Pythagoras."}, {"q": "A wheel at a constant angular velocity of 15 rad/s has a point 0.50 m from the axis. Its radial acceleration is", "options": ["7.5 m/s²", "112.5 m/s²", "225 m/s²", "30 m/s²"], "answer": 1, "explanation": "a_R = ω²r = 225 × 0.50 = 112.5 m/s².", "hack": "ω² = 225, then × 0.5."}, {"q": "For a wheel at constant angular velocity, the tangential acceleration is", "options": ["Equal to ω²r", "Equal to rω", "Zero", "Equal to g"], "answer": 2, "explanation": "a_T = rα and α = 0.", "hack": "Constant ω means α = 0."}, {"q": "A stone on a string of length 1 m has mass 0.5 kg and tension 80 N. The frequency is about", "options": ["4 Hz", "0.5 Hz", "20 Hz", "2 Hz"], "answer": 3, "explanation": "T = mω²r = m4π²f²r, so f² = 80/(0.5 × 4π² × 1) ≈ 4.05 and f ≈ 2 Hz.", "hack": "Tension supplies the centripetal force."}, {"q": "A marble just loses contact with the top of a loop (no force at B). The speed satisfies", "options": ["V² = gR", "V² = 2gR", "V = gR", "V² = g/R"], "answer": 0, "explanation": "At the top only gravity supplies the centripetal force: mg = mV²/R.", "hack": "Top of a loop, no contact: v² = gR."}, {"q": "For that marble, the force it exerts at the bottom point A (same speed) is", "options": ["mg", "2mg", "3mg", "mg/2"], "answer": 1, "explanation": "F_A = mg + mV²/R = mg + mgR/R = 2mg.", "hack": "mg + mg = 2mg."}, {"q": "Two objects rotate at the same frequency, at radii r and 3r, with masses m and 9m. The ratio of their centripetal forces F₁/F₂ is", "options": ["1/3", "1/9", "1/27", "27"], "answer": 2, "explanation": "F = mω²r, so F₂ = 9m × ω² × 3r = 27 F₁.", "hack": "9 × 3 = 27."}, {"q": "The law of conservation of charge states that the total charge of an isolated system", "options": ["Always increases", "Always decreases", "Becomes zero", "Remains constant"], "answer": 3, "explanation": "Charge can be created in pairs, but the net amount stays the same.", "hack": "Net charge never changes."}, {"q": "In pair production, a high-energy photon produces", "options": ["An electron and a positron", "Two electrons", "Two positrons", "A proton and an electron"], "answer": 0, "explanation": "The positive and negative charges cancel, so total charge is conserved.", "hack": "Pair = opposite charges, net zero."}, {"q": "The law of conservation of energy states that energy", "options": ["Can be created but is never destroyed", "Is never created or destroyed, but changes form", "Can be destroyed but is never created", "Is always lost to the surroundings as heat"], "answer": 1, "explanation": "In an isolated system the sum of all forms of energy stays constant.", "hack": "Energy only changes form."}, {"q": "At the top of a pendulum's swing, the energy is", "options": ["All kinetic energy", "Half kinetic, half potential", "All potential energy", "Zero"], "answer": 2, "explanation": "The pendulum stops momentarily, so KE is zero.", "hack": "Top = potential. Bottom = kinetic." les with velocities 2i m/s and 3j m/s. If the explosion lasts 10⁻³ s, the average force on the third piece is", "options": ["(−2i − 3j) × 10³ N", "(2i + 3j) × 10³ N", "(2i − 3j) × 10⁻³ N", "None of these"], "answer": 0, "explanation": "Each piece has mass 1 kg. p₃ = −(2i + 3j). F = Δp/t = (−2i − 3j) ÷ 10⁻³ = (−2i − 3j) × 10³ N.", "hack": "Third piece = minus the other two; divide by the time.", "src": "Exercise 9.1"}], "exercises": [{"q": "Example 9.1: A 1 kg ball at 12 m/s collides head-on with a 2 kg ball at 24 m/s in the opposite direction, with e = 2/3. The final velocity of the 1 kg ball is", "options": ["+14 m/s", "−28 m/s", "−4 m/s", "−12 m/s"], "answer": 1, "explanation": "v₁ + 2v₂ = −36 and v₂ − v₁ = (2/3)(36) = 24. So 3v₂ = −12, v₂ = −4 and v₁ = −28 m/s.", "hack": "Two equations: momentum, and e = separation ÷ approach.", "src": "Example 9.1"}, {"q": "Example 9.1 (second ball): The final velocity of the 2 kg ball is", "options": ["+14 m/s", "−28 m/s", "−4 m/s", "+4 m/s"], "answer": 2, "explanation": "From the equations, v₂ = −4 m/s (the notes print +14 m/s, which does not satisfy v₁ + 2v₂ = −36).", "hack": "Check: −28 + 2(−4) = −36.", "src": "Example 9.1"}, {"q": "Example 9.2: A bullet hits and becomes embedded in a target on a frictionless surface. What is conserved?", "options": ["Kinetic energy alone", "Both momentum and kinetic energy", "Neither momentum nor kinetic energy", "Momentum alone"], "answer": 3, "explanation": "No external force acts so momentum is conserved. The collision is inelastic so kinetic energy is not. (The notes' working says this, though their last printed option reads 'neither'.)", "hack": "Stuck together = inelastic: momentum only.", "src": "Example 9.2"}, {"q": "Example 9.3: The moment of inertia of a thin rod (5 kg, 5 m long) about one end is", "options": ["125/3 ≈ 41.7 kg·m²", "25/3 ≈ 8.3 kg·m²", "125/12 ≈ 10.4 kg·m²", "125 kg·m²"], "answer": 0, "explanation": "I = (1/3)ML² = (1/3)(5)(5²) = 125/3 ≈ 41.7 kg·m². (The notes' 25/3 drops a factor of 5.)", "hack": "5 × 5² = 125. Then ÷ 3.", "src": "Example 9.3"}, {"q": "Example 9.4: That rod rotates at 200 rad/s. Its angular momentum is", "options": ["≈ 1667 kg·m²/s", "≈ 8333 kg·m²/s", "≈ 2083 kg·m²/s", "≈ 25 000 kg·m²/s"], "answer": 1, "explanation": "L = Iω = (125/3)(200) = 25 000/3 ≈ 8333 kg·m²/s. (The notes' 5000/3 follows from their 25/3.)", "hack": "L = Iω with I = 125/3.", "src": "Example 9.4"}, {"q": "Example 9.5: A 20 kg disc about its centre has L = 520 kg·m²/s at 2 rad/s. Its radius is", "options": ["26 m", "2.6 m", "5.1 m", "13 m"], "answer": 2, "explanation": "520 = ½(20)R²(2) = 20R², so R² = 26 and R = 5.1 m.", "hack": "L = ½MR²ω; solve for R².", "src": "Example 9.5"}, {"q": "Example 9.6: A hollow ball (I = (2/3)MR²) of radius 0.2 m rolls at 170 rad/s with L = 5 kg·m²/s. Its mass is", "options": ["0.55 kg", "3.3 kg", "11 kg", "1.1 kg"], "answer": 3, "explanation": "5 = (2/3)M(0.2²)(170), so M = 5 ÷ 4.53 = 1.1 kg. (The notes print 22/3 once; they actually calculate with 2/3.)", "hack": "Hollow thin sphere: 2/3. Solid: 2/5.", "src": "Example 9.6"}, {"q": "Example 9.7(a): An object on a 0.5 m string makes 4 rotations in one second. Its period is", "options": ["¼ s", "4 s", "½ s", "2 s"], "answer": 0, "explanation": "T = 1/f = 1/4 s.", "hack": "Reciprocal.", "src": "Example 9.7"}, {"q": "Example 9.7(b): The tangential velocity of that object, taking π = 3 as in the notes, is", "options": ["6 m/s", "12 m/s", "24 m/s", "3 m/s"], "answer": 1, "explanation": "v = 2πfr = 2 × 3 × 4 × 0.5 = 12 m/s (exactly 4π ≈ 12.6 m/s).", "hack": "2πfr: 2 × 3 × 4 × 0.5.", "src": "Example 9.7"}, {"q": "Example 9.7(c): Its angular velocity, taking π = 3, is", "options": ["12 rad/s", "8 rad/s", "24 rad/s", "48 rad/s"], "answer": 2, "explanation": "ω = 2πf = 2 × 3 × 4 = 24 rad/s (exactly 8π ≈ 25.1 rad/s).", "hack": "2π × 4.", "src": "Example 9.7"}, {"q": "Example 9.8: A mass m rotates with angular velocity ω at radius r. Its kinetic energy is", "options": ["½mωr²", "½mω²r", "mω²r²", "½mω²r²"], "answer": 3, "explanation": "K = ½mv² with v = ωr.", "hack": "Substitute v = ωr.", "src": "Example 9.8"}, {"q": "Example 9.9: A 0.5 kg stone on a 1 m rope has rope tension 80 N. The frequency is", "options": ["2 Hz", "4 Hz", "1 Hz", "8 Hz"], "answer": 0, "explanation": "80 = m·4π²f²·r = 0.5 × 4 × 9.87 × f², so f² = 4.05 and f ≈ 2 Hz.", "hack": "Tension is the centripetal force.", "src": "Example 9.9"}, {"q": "Example 9.10: An object makes 120 revolutions in one minute. Its frequency and period are", "options": ["120 Hz and 1/120 s", "2 Hz and ½ s", "0.5 Hz and 2 s", "2 Hz and 2 s"], "answer": 1, "explanation": "f = 120/60 = 2 rev/s; T = 1/f = 1/2 s.", "hack": "Per minute → per second: ÷ 60.", "src": "Example 9.10"}, {"q": "Example 9.11: A device does 1800 revolutions in 6 minutes. Taking π = 3, its period and angular velocity are", "options": ["5 s and 30 rad/s", "0.2 s and 5 rad/s", "0.2 s and 30 rad/s", "0.2 s and 60 rad/s"], "answer": 2, "explanation": "T = 360 s ÷ 1800 = 0.2 s; ω = 2π/T = 6/0.2 = 30 rad/s (π = 3).", "hack": "6 minutes = 360 s.", "src": "Example 9.11"}, {"q": "Example 9.12: A marble just loses contact at the top point B of a track (no force on the surface at B). The force it exerts on the surface at point A (with the same speed) is", "options": ["mg", "3mg", "mg/2", "2mg"], "answer": 3, "explanation": "At B: mg = mV²/R, so V² = gR. At A: F = mg + mV²/R = mg + mg = 2mg.", "hack": "Weight + centripetal term, and they are equal.", "src": "Example 9.12"}, {"q": "Example 9.13: Two objects rotate at the same frequency, one of mass m at radius r and one of mass 9m at radius 3r. The ratio F₁/F₂ of their centripetal forces is", "options": ["1/27", "1/9", "1/3", "27"], "answer": 0, "explanation": "F ∝ m r (same ω). F₁/F₂ = (m × r)/(9m × 3r) = 1/27.", "hack": "F = mω²r: mass ratio 9 × radius ratio 3.", "src": "Example 9.13"}, {"q": "Example 9.14(a): A turntable starts from rest with α = 2.5 rad/s². After 5 s its angular displacement is", "options": ["62.5 rad", "31.25 rad", "12.5 rad", "15.6 rad"], "answer": 1, "explanation": "θ = ½αt² = ½ × 2.5 × 25 = 31.25 rad (4.97 rev).", "hack": "θ = ½αt².", "src": "Example 9.14"}, {"q": "Example 9.14(b): After 5 s, the angular velocity is", "options": ["6.25 rad/s", "31.25 rad/s", "12.5 rad/s", "2.5 rad/s"], "answer": 2, "explanation": "ω = αt = 12.5 rad/s (the notes write the unit as rad/s², a typo).", "hack": "ω = αt: unit rad/s.", "src": "Example 9.14"}, {"q": "Example 9.15(a): A body spins at 2 rev/s with α = 0.5 rev/s². After 10 s the angular velocity is", "options": ["7π rad/s (3.5 rev/s)", "10π rad/s (5 rev/s)", "28π rad/s (14 rev/s)", "14π rad/s (7 rev/s)"], "answer": 3, "explanation": "ω₀ = 4π rad/s, α = π rad/s². ω = 4π + 10π = 14π rad/s.", "hack": "Convert rev to rad by × 2π first.", "src": "Example 9.15"}, {"q": "Example 9.15(b): For the same body, the angular displacement in 10 s is", "options": ["90π rad (45 rev)", "45π rad (22.5 rev)", "50π rad (25 rev)", "140π rad (70 rev)"], "answer": 0, "explanation": "θ = 4π(10) + ½π(100) = 40π + 50π = 90π rad.", "hack": "40π + 50π.", "src": "Example 9.15"}, {"q": "Example 9.16(i): A fan blade 3 cm in diameter spins at 5 rev/s with angular acceleration 3 rev/s². After 2 s the angular velocity is", "options": ["32π rad/s (16 rev/s)", "22π rad/s (11 rev/s)", "11π rad/s (5.5 rev/s)", "16π rad/s (8 rev/s)"], "answer": 1, "explanation": "ω₀ = 10π rad/s, α = 6π rad/s². ω = ω₀ + αt = 10π + 6π × 2 = 22π rad/s. (The notes' intermediate line writes 10π × 2 + 6π × 2 = 32π, but their later steps use 22π.)", "hack": "Only α is multiplied by t: 5 + 3 × 2 = 11 rev/s.", "src": "Example 9.16"}, {"q": "Example 9.16(ii): For the same blade, the number of revolutions completed in the 2 s is", "options": ["34 rev", "10 rev", "16 rev", "22 rev"], "answer": 2, "explanation": "θ = ω₀t + ½αt² = 10π(2) + ½(6π)(2²) = 20π + 12π = 32π rad = 16 rev. (The notes use t² = 4² and get 68π, 34 rev, which is a slip.)", "hack": "In rev: 5 × 2 + ½ × 3 × 4 = 10 + 6 = 16.", "src": "Example 9.16"}, {"q": "Example 9.16(iii): The tangential velocity of the blade tip at t = 2 s (radius 1.5 cm) is about", "options": ["2.07 m/s", "0.52 m/s", "69.1 m/s", "1.04 m/s"], "answer": 3, "explanation": "v = ωr = 22π × 0.015 = 1.04 m/s. (The notes take r = 3 cm, the diameter, and get 2.07 m/s.)", "hack": "Radius is HALF the diameter.", "src": "Example 9.16"}, {"q": "Example 9.16(iv): The resultant acceleration of the tip at t = 2 s (radius 1.5 cm) is about", "options": ["71.7 m/s²", "142.8 m/s²", "0.283 m/s²", "35.8 m/s²"], "answer": 0, "explanation": "a_R = v²/r = 1.04²/0.015 ≈ 71.7 m/s²; a_T = rα = 0.015 × 6π = 0.283 m/s². Resultant = √(a_R² + a_T²) ≈ 71.7 m/s². (The notes' 142.8 m/s² comes from using r = 3 cm.)", "hack": "a_R dwarfs a_T, so the resultant is about a_R.", "src": "Example 9.16"}]}, {"chapter": 10, "title": "Space and Time; Galilean Invariance", "concept": [{"q": "In 1905 Einstein published important papers on Brownian motion, the photoelectric effect and", "options": ["The theory of gravitation", "Quantum chromodynamics", "The special theory of relativity", "The law of cooling"], "answer": 2, "explanation": "These three papers made 1905 his 'miracle year'.", "hack": "1905 trio: Brownian motion, photoelectric effect, special relativity."}, {"q": "Einstein based the special theory of relativity on", "options": ["One single equation", "Three laws of motion", "Four conservation laws", "Two simple postulates"], "answer": 3, "explanation": "The first postulate is the principle of relativity.", "hack": "TWO postulates."}, {"q": "The principle of relativity is also called", "options": ["Galilean relativity or Galilean invariance", "Newton's third law", "The uncertainty principle", "Kepler's law"], "answer": 0, "explanation": "It states that the laws of motion are the same in all inertial frames.", "hack": "Principle of relativity = Galilean relativity (low speeds)."}, {"q": "In physics, space refers to", "options": ["A one-dimensional quantity", "Three-dimensional coordinate points", "A force field", "A kind of energy"], "answer": 1, "explanation": "Space is the arrangement of all possible point locations.", "hack": "SPACE = 3 dimensions (x, y, z)."}, {"q": "Time is described in the notes as", "options": ["A three-dimensional quantity", "A force in disguise", "A one-dimensional quantity independent of space", "Dependent on position"], "answer": 2, "explanation": "In classical mechanics time is separate from space.", "hack": "TIME = 1 dimension."}, {"q": "In classical mechanics, time and space are", "options": ["Fused into one entity", "Both zero-dimensional", "Both vectors", "Separate from each other"], "answer": 3, "explanation": "In relativity they are combined into space-time.", "hack": "Classical = separate. Relativity = fused."}, {"q": "In special relativity, time and space are combined to form", "options": ["Four-dimensional space-time", "Three-dimensional space alone", "Two-dimensional flat surfaces", "A one-dimensional time line"], "answer": 0, "explanation": "Three space dimensions plus time give four dimensions.", "hack": "Fourth dimension = TIME."}, {"q": "According to Einstein's relativity, the fourth dimension is", "options": ["Mass", "Time", "Curvature", "Charge"], "answer": 1, "explanation": "Space-time has three spatial dimensions and one time dimension.", "hack": "4D = x, y, z + time."}, {"q": "Motion is defined as", "options": ["Change of mass with its volume", "Change of colour with heating", "Change of position with time", "Staying at a constant position"], "answer": 2, "explanation": "An object moves if it occupies different positions at different times.", "hack": "No change of position = at rest."}, {"q": "According to Newton, space and time are", "options": ["Relative, different for each observer", "Variable, dependent on how fast you move", "Created whenever a body begins to move", "Absolute, independent of all objects"], "answer": 3, "explanation": "Newton regarded both as absolute and flowing on regardless of events.", "hack": "Newton = absolute. Einstein = relative."}, {"q": "Newton regarded which objects as being at rest to define positions?", "options": ["The distant stars", "The nearby planets", "The Earth's surface", "The Sun itself"], "answer": 0, "explanation": "Positions were defined relative to the distant stars.", "hack": "Newton's fixed reference: distant stars."}, {"q": "According to astronomers, cosmological objects are", "options": ["All at rest in an absolute space", "Not at rest in any absolute space", "Fixed to the surface of the Earth", "Moving at the speed of light"], "answer": 1, "explanation": "Hence the position of an object is defined by an observer with respect to himself.", "hack": "Nothing is truly at rest."}, {"q": "A frame of reference is", "options": ["A rigid wooden frame placed around a diagram", "A force that acts on every moving body", "Coordinates describing position, velocity and acceleration", "A unit for measuring the time elapsed"], "answer": 2, "explanation": "It is an arbitrary set of space-time coordinates attached to an observer.", "hack": "FRAME = coordinates + observer."}, {"q": "The observer defines the position of an object", "options": ["With respect to absolute space", "With respect to the distant stars only", "With respect to the object", "With respect to himself"], "answer": 3, "explanation": "This local space is the observer's frame of reference.", "hack": "Observer-centred."}, {"q": "The coordinate system most often used to locate an object is the", "options": ["Rectangular (Cartesian) system", "Spherical polar system only", "Cylindrical system only", "Time system"], "answer": 0, "explanation": "Cartesian coordinates (x, y, z) are used generally.", "hack": "Cartesian = x, y, z."}, {"q": "Cylindrical coordinates are written as", "options": ["(x, y, z)", "(ρ, φ, z)", "(r, θ, φ)", "(x, t)"], "answer": 1, "explanation": "Spherical polar coordinates are (r, θ, φ).", "hack": "Cylindrical: ρ, φ, z. Spherical: r, θ, φ."}, {"q": "Spherical polar coordinates are written as", "options": ["(x, y, z)", "(ρ, φ, z)", "(r, θ, φ)", "(x, y, t)"], "answer": 2, "explanation": "r is the distance, θ and φ are angles.", "hack": "r + two angles."}, {"q": "A space-time event is specified by", "options": ["Spatial coordinates alone, no time", "Temporal coordinates alone only", "The mass and charge of a body", "Spatial and temporal coordinates"], "answer": 3, "explanation": "Position coordinates plus time: (x, y, z, t).", "hack": "Event = where + when."}, {"q": "Galilean invariance states that the laws of motion", "options": ["Are the same in all inertial frames", "Differ in every frame", "Hold only at rest", "Hold only in accelerating frames"], "answer": 0, "explanation": "It is the principle of relativity.", "hack": "Same laws in all inertial frames."}, {"q": "An inertial frame of reference is one that", "options": ["Is constantly speeding up or slowing", "Moves at constant velocity, no acceleration", "Rotates steadily about a fixed point", "Has a clock running at another rate"], "answer": 1, "explanation": "In an inertial frame, an object with no force does not accelerate.", "hack": "INERTIAL = not accelerating."}, {"q": "Frames of reference are classified into", "options": ["Fast and slow-moving frames", "True and fictional frames", "Inertial and non-inertial", "Real and imagined frames"], "answer": 2, "explanation": "Newton's first and second laws hold in inertial frames.", "hack": "Two types: inertial / non-inertial."}, {"q": "Newton's laws of motion are not valid in a", "options": ["Inertial frame", "Frame moving with uniform velocity", "Frame at rest", "Non-inertial frame"], "answer": 3, "explanation": "Accelerating frames show fictitious effects.", "hack": "Non-inertial = laws fail in the usual form."}, {"q": "Which of these is an example of a non-inertial frame?", "options": ["A merry-go-round", "A stationed train", "A ship moving at constant velocity in a harbour", "A car cruising at constant speed in a straight line"], "answer": 0, "explanation": "Rotating means accelerating (centripetal acceleration).", "hack": "Spinning = accelerating = non-inertial."}, {"q": "Which of these can be classified as a frame that is not accelerating?", "options": ["A rotating fan", "A stationed train", "A merry-go-round", "A car braking hard"], "answer": 1, "explanation": "Rest or constant velocity means no acceleration.", "hack": "Stationed (parked) = inertial."}, {"q": "A rope whirled around with a stone attached rotating at constant speed is a", "options": ["Inertial (non-accelerating) system", "System at rest relative to the stone", "Non-inertial (accelerating) system", "System with zero net acceleration"], "answer": 2, "explanation": "Circular motion has centripetal acceleration even at constant speed.", "hack": "Circular motion: always accelerating."}, {"q": "Galileo illustrated relative motion with the example of", "options": ["A falling apple", "A swinging pendulum", "A spinning top", "A ship on a smooth sea"], "answer": 3, "explanation": "An observer in a cabin could not tell whether the ship moved or stood still.", "hack": "Galileo = ship."}, {"q": "In a ship moving at constant velocity on a smooth sea, an observer below deck", "options": ["Cannot tell by experiment if it moves", "Can easily detect the ship's motion", "Feels a steady backward force", "Sees dropped objects drift sideways"], "answer": 0, "explanation": "All mechanical experiments give the same results as at rest.", "hack": "Smooth sailing: no experiment reveals it."}, {"q": "Among Newton's axioms is that", "options": ["Time is different in each inertial frame", "Absolute space exists where his laws hold", "Space and time are fused together", "Inertial frames must accelerate"], "answer": 1, "explanation": "Newton also assumed all inertial frames share a universal time.", "hack": "Absolute space + universal time."}, {"q": "In Newtonian mechanics, all inertial frames share", "options": ["A common position", "A common speed", "A universal time", "A common mass"], "answer": 2, "explanation": "This is why t' = t in the Galilean transformation.", "hack": "Clocks agree: t' = t."}, {"q": "Two frames used in the Galilean transformation must have", "options": ["A changing relative velocity", "A relative acceleration", "A relative rotation", "A constant relative velocity"], "answer": 3, "explanation": "Otherwise the law of inertia would not hold in both.", "hack": "Constant relative velocity only."}, {"q": "Frame S′ moves with speed v along +x relative to S. The Galilean transformation gives x′ =", "options": ["x − vt", "x + vt", "x/vt", "x − v/t"], "answer": 0, "explanation": "x′ = x − vt, y′ = y, z′ = z, t′ = t.", "hack": "Subtract what the frame has travelled."}, {"q": "In the Galilean transformation, the y and z coordinates", "options": ["Are reduced by vt", "Are unchanged", "Are increased by vt", "Become zero"], "answer": 1, "explanation": "The motion is along x only: y′ = y, z′ = z.", "hack": "Only x changes."}, {"q": "The Galilean transformation for time is", "options": ["t′ = t − vx", "t′ = t/v", "t′ = t", "t′ = vt"], "answer": 2, "explanation": "Time is universal in Newtonian physics.", "hack": "Time unchanged."}, {"q": "A frame S′ moves at 20 m/s along +x. An event is at x = 100 m when t = 3 s. In S′, x′ is", "options": ["160 m", "80 m", "−40 m", "40 m"], "answer": 3, "explanation": "x′ = x − vt = 100 − 20 × 3 = 40 m.", "hack": "Subtract vt = 60."}, {"q": "The Galilean velocity transformation is", "options": ["u′ₓ = uₓ − v", "u′ₓ = uₓ + v²", "u′ₓ = uₓ/v", "u′ₓ = v − uₓ²"], "answer": 0, "explanation": "Differentiate x′ = x − vt with t′ = t.", "hack": "New speed = old speed − frame speed."}, {"q": "A car moves at 30 m/s in frame S. A frame S′ moves at 10 m/s in the same direction. The car's speed in S′ is", "options": ["40 m/s", "20 m/s", "300 m/s", "3 m/s"], "answer": 1, "explanation": "u′ = u − v = 30 − 10 = 20 m/s.", "hack": "Chase the car at 10 and it seems slower by 10."}, {"q": "A particle has velocity 12 m/s in a frame moving at 37 m/s relative to the first frame along +x. Its velocity in the first frame is", "options": ["25 m/s", "−25 m/s", "49 m/s", "444 m/s"], "answer": 2, "explanation": "u = u′ + v = 12 + 37 = 49 m/s.", "hack": "Going back: add the frame speed."}, {"q": "Under the Galilean transformation, velocity is", "options": ["Invariant", "Always zero", "Always equal to c", "Not invariant"], "answer": 3, "explanation": "Velocities differ by the relative velocity of the frames.", "hack": "Velocity changes frame to frame."}, {"q": "Under the Galilean transformation, acceleration is", "options": ["Invariant", "Not invariant", "Zero in one frame only", "Doubled"], "answer": 0, "explanation": "a′ = a because the relative velocity v is constant.", "hack": "Constant v: da/dt cancels it."}, {"q": "Which of the following is NOT Galilean invariant?", "options": ["Force", "Velocity", "Acceleration", "Time"], "answer": 1, "explanation": "Force, acceleration and time are the same in both frames; velocity differs by v.", "hack": "Only velocity changes."}, {"q": "Which of the following quantities is Galilean invariant?", "options": ["Displacement", "Kinetic energy", "Acceleration", "Linear momentum"], "answer": 2, "explanation": "a′ = a.", "hack": "Acceleration, force, time."}, {"q": "Newton's second law F = ma is", "options": ["Valid only in one frame", "Valid only at rest", "Invariant only for gravity", "The same in all inertial frames"], "answer": 3, "explanation": "Since a′ = a and m is the same, F′ = F.", "hack": "F = ma is invariant."}, {"q": "The force F in Newton's second law, under a Galilean transformation, is", "options": ["Unchanged", "Increased by mv", "Reduced by mv", "Zero"], "answer": 0, "explanation": "F′ = ma′ = ma = F.", "hack": "Force is the same in both frames."}, {"q": "Since force is Galilean invariant, the law of universal gravitation is", "options": ["Not invariant", "Also Galilean invariant", "Invariant only in space", "Valid only at rest"], "answer": 1, "explanation": "F = GMm/r² uses the same F in each frame.", "hack": "Same force, same law."}, {"q": "The law of conservation of linear momentum for a collision is", "options": ["Not Galilean invariant", "Valid in one frame only", "Galilean invariant", "False in moving frames"], "answer": 2, "explanation": "Example 10.3 shows the same form in all inertial frames.", "hack": "Momentum law is the same in each inertial frame."}, {"q": "In Example 10.3, adding v to every velocity in the momentum equation leaves a leftover term", "options": ["m₁m₂v on one side, uncancelled", "A term mv² on the right side only", "Zero on the left and mv on the right", "(m₁ + m₂)v on both sides, cancels"], "answer": 3, "explanation": "Subtracting gives m₁u′₁ + m₂u′₂ = m₁v′₁ + m₂v′₂.", "hack": "Equal extra terms on both sides cancel."}, {"q": "The law of conservation of kinetic energy in an elastic collision is", "options": ["Also Galilean invariant", "Not Galilean invariant", "Valid only in the rest frame", "False in any moving frame"], "answer": 0, "explanation": "Exercise 10.3: show it using the transformed velocities.", "hack": "KE law: same form in all inertial frames."}, {"q": "The relative velocity of two frames must be constant because otherwise", "options": ["Time would stop running in one frame", "The law of inertia would not hold in both", "Mass would change between the frames", "Light would travel at different speeds"], "answer": 1, "explanation": "An accelerating frame is not inertial.", "hack": "Constant relative v = both frames inertial."}, {"q": "A girl on a bicycle passes a friend at a bus stop, and 60 s later the friend catches a bus 126 m away (in the girl's frame). The bicycle's speed is", "options": ["0.48 m/s", "7560 m/s", "2.10 m/s", "21 m/s"], "answer": 2, "explanation": "speed = distance/time = 126 ÷ 60 = 2.10 m/s.", "hack": "Distance ÷ time."}, {"q": "A police car at 30 m/s catches a truck at 20 m/s in 25 s. The truck's initial lead was", "options": ["750 m", "500 m", "1250 m", "250 m"], "answer": 3, "explanation": "Closing speed = 30 − 20 = 10 m/s; 10 × 25 = 250 m.", "hack": "Use the closing speed."}, {"q": "The velocity of the police car relative to the truck is", "options": ["10 m/s", "50 m/s", "20 m/s", "600 m/s"], "answer": 0, "explanation": "30 − 20 = 10 m/s (Galilean subtraction).", "hack": "Same direction: subtract."}, {"q": "The statement 'all laws of motion are the same in all inertial frames' is called", "options": ["Universal gravitation", "Galilean relativity", "The Heisenberg principle", "Kepler's laws"], "answer": 1, "explanation": "This is the principle of relativity of the notes.", "hack": "Same laws, all inertial frames."}, {"q": "A coordinate system is introduced in order to", "options": ["Measure the mass of bodies directly", "Create the forces acting on bodies", "Describe physical events in space and time", "Slow down the passage of time itself"], "answer": 2, "explanation": "It specifies positions, motion and events.", "hack": "COORDINATES describe where and when."}, {"q": "The most inertial frame is one that is", "options": ["Rotating steadily", "Falling toward a planet", "Speeding up", "Not accelerating"], "answer": 3, "explanation": "An unaccelerated rocket is an ideal inertial frame.", "hack": "Zero acceleration is the test."}], "tutorial": [{"q": "Exercise 10.1: A girl rides a bicycle at constant speed. She passes a friend at a bus stop (event 1). 60 s later, the friend catches a bus (event 2). The events are 126 m apart in the girl's frame. The bicycle's speed is", "options": ["2.10 m/s", "0.48 m/s", "7.6 m/s", "21.0 m/s"], "answer": 0, "explanation": "v = 126 m ÷ 60 s = 2.10 m/s (the notes' answer).", "hack": "Distance ÷ time.", "src": "Exercise 10.1"}, {"q": "Exercise 10.2: A police car at 30 m/s catches a truck travelling at 20 m/s, 25 s after first sighting it. How far ahead was the truck when first sighted?", "options": ["750 m", "250 m", "500 m", "125 m"], "answer": 1, "explanation": "Relative speed = 30 − 20 = 10 m/s. Distance gained in 25 s = 10 × 25 = 250 m.", "hack": "Gap closed = relative speed × time.", "src": "Exercise 10.2"}, {"q": "Exercise 10.3: To show that conservation of kinetic energy is Galilean invariant, the hint uses the expression", "options": ["m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂", "½m₁u₁ + ½m₂u₂ = ½m₁v₁ + ½m₂v₂", "½m₁u₁² + ½m₂u₂² = ½m₁v₁² + ½m₂v₂²", "m₁u₁² − m₂u₂² = m₁v₁² − m₂v₂²"], "answer": 2, "explanation": "Substitute u = u′ + v for every velocity: the cross terms v(m₁u′₁ + m₂u′₂) cancel by momentum conservation, and the v² terms cancel on both sides, leaving ½m₁u′₁² + ½m₂u′₂² = ½m₁v′₁² + ½m₂v′₂².", "hack": "Expand (u′ + v)²: the 2u′v terms cancel via momentum, v² cancels by mass.", "src": "Exercise 10.3"}, {"q": "Problem 10.1: Which of the following is NOT Galilean invariant?", "options": ["Force", "Acceleration", "Time", "Velocity"], "answer": 3, "explanation": "Velocity changes by the relative velocity of the frames. Force, acceleration and time are the same.", "hack": "Only VELOCITY changes.", "src": "Problem 10.1"}, {"q": "Problem 10.2: An arbitrary set of coordinates that describes the position, velocity and acceleration of objects is called a", "options": ["Reference frame", "Single observer", "Origin point", "Fixed point"], "answer": 0, "explanation": "That is the definition of a frame of reference.", "hack": "Coordinates + describe motion = frame.", "src": "Problem 10.2"}, {"q": "Problem 10.3: The Galilean transformation for a frame moving at constant velocity v along the positive y axis is", "options": ["x′ = x − vt, y′ = y, z′ = z, t′ = t", "x′ = x, y′ = y − vt, z′ = z, t′ = t", "x′ = x − vt, y′ = y − vt, z′ = z, t′ = t", "x′ = x, y′ = y, z′ = z, t′ = t"], "answer": 1, "explanation": "Only the coordinate along the motion (y) changes.", "hack": "Subtract vt from the coordinate that moves.", "src": "Problem 10.3"}, {"q": "Problem 10.4: 'All laws of motion are the same in all inertial frames of reference' is a statement of", "options": ["Universal gravitation", "The Heisenberg principle", "Galilean relativity", "Kepler's laws"], "answer": 2, "explanation": "That is the principle of relativity (Galilean invariance).", "hack": "Same laws everywhere = relativity.", "src": "Problem 10.4"}, {"q": "Problem 10.5: An inertial frame of reference is one that", "options": ["Moves at several different velocities", "Is constantly accelerating forward", "Does not share a universal time", "Is in relative motion to absolute space"], "answer": 3, "explanation": "The notes describe an inertial frame as a frame in uniform relative motion to absolute space, in which objects do not accelerate under zero force.", "hack": "Inertial = no acceleration; the other three options are false.", "src": "Problem 10.5"}, {"q": "Problem 10.6: In physics, frames of reference are classified into two main types:", "options": ["Inertial and non-inertial", "Fast and slow-moving frames", "True and fictional frames", "Real and imagined frames"], "answer": 0, "explanation": "Inertial frames do not accelerate; non-inertial frames do.", "hack": "Classification is by acceleration.", "src": "Problem 10.6"}, {"q": "Problem 10.7: According to Einstein's theory of relativity, the fourth dimension is considered to be", "options": ["The horizontal dimension", "The time dimension", "The curled dimension", "The space dimension"], "answer": 1, "explanation": "Space-time = three space dimensions plus time.", "hack": "4D = 3 space + TIME.", "src": "Problem 10.7"}, {"q": "Problem 10.8: Which of the following quantities is Galilean invariant?", "options": ["Momentum", "Velocity", "Acceleration", "Kinetic energy"], "answer": 2, "explanation": "a′ = a. Momentum, velocity and kinetic energy change when v is added to every velocity (although their conservation LAWS keep the same form).", "hack": "Quantity vs law: the acceleration value itself is unchanged.", "src": "Problem 10.8"}, {"q": "Problem 10.9: Which of the following is the odd one out?", "options": ["An athlete running at constant speed in a straight line", "A moving vehicle maintaining constant velocity", "A stationary ship in a harbour", "A rope whirled around a stone, rotating at constant velocity"], "answer": 3, "explanation": "The other three are inertial (zero acceleration); circular motion always has centripetal acceleration.", "hack": "Circular motion is NEVER inertial.", "src": "Problem 10.9"}, {"q": "Problem 10.10: ....... defines the position of an object at any instant in time with respect to himself.", "options": ["Observer", "Spectator", "Passenger", "Spaceman"], "answer": 0, "explanation": "The notes: the position of an object is always defined by the observer with respect to himself.", "hack": "OBSERVER = person at the origin of the frame.", "src": "Problem 10.10"}, {"q": "Problem 10.11: Which of the following can be classified as a frame of reference that is not accelerating?", "options": ["A merry-go-round", "A stationed train", "A rotating fan", "The Earth"], "answer": 1, "explanation": "A stationary train has zero acceleration; merry-go-round and fan rotate, and the Earth rotates and orbits.", "hack": "Not accelerating = parked, steady.", "src": "Problem 10.11"}, {"q": "Problem 10.12: The spatial and temporal coordinates of a physical event describe its ....... event.", "options": ["Velocity-time", "Space-temperature", "Space-time", "Speed-temperature"], "answer": 2, "explanation": "(x, y, z) and t together specify a space-time event.", "hack": "Where + when = space-time.", "src": "Problem 10.12"}, {"q": "Problem 10.13: Which of the following frames is most inertial?", "options": ["The Earth", "The Sun", "The centre of our galaxy", "An unaccelerated rocket"], "answer": 3, "explanation": "Earth rotates and orbits, the Sun orbits the galaxy, and an unaccelerated rocket by definition does not accelerate. (The notes give no key; this follows from the definition.)", "hack": "Inertial = zero acceleration.", "src": "Problem 10.13"}, {"q": "Problem 10.14: The laws of motion are not valid in a system which is", "options": ["Non-inertial", "At rest", "Inertial", "Moving with uniform velocity"], "answer": 0, "explanation": "The usual laws hold in inertial frames only.", "hack": "Accelerating frame = laws break.", "src": "Problem 10.14"}, {"q": "Problem 10.15: Which of the following is introduced to describe physical events that occur in space and time, such as the motion of bodies?", "options": ["Universal system", "Coordinate system", "Origin", "Galilean transformation"], "answer": 1, "explanation": "A coordinate system is introduced to specify positions and times of events.", "hack": "Coordinates describe events.", "src": "Problem 10.15"}], "exercises": [{"q": "Example 10.1 (setup): A boat starting at rest moves at 10 m/s along +x relative to the water (frame 1, stationary). Frame 2 is on the boat and the frames coincide at t = 0. The transformation used is", "options": ["x₁ = x₂ − vt", "x₁ = x₂/vt", "x₁ = x₂ + vt", "x₁ = v/t"], "answer": 2, "explanation": "Frame 2 moves in +x at v, so x₁ = x₂ + vt, y₁ = y₂, z₁ = z₂, t₁ = t₂.", "hack": "Going from the moving frame to the stationary one: ADD vt.", "src": "Example 10.1"}, {"q": "Example 10.1: At t = 120 s an event happens at x₂ = 50 m in the boat's frame. Its position in frame 1 is", "options": ["1200 m", "170 m", "−1150 m", "1250 m"], "answer": 3, "explanation": "x₁ = x₂ + vt = 50 + 10 × 120 = 1250 m.", "hack": "50 + 1200.", "src": "Example 10.1"}, {"q": "Example 10.2 (setup): Frame 2 moves along +x at 37 m/s. A particle has velocity U′ = (12, 0, 0) m/s in frame 2. The transformation used to find U in frame 1 is", "options": ["Uₓ = U′ₓ + v", "Uₓ = U′ₓ − v", "Uₓ = U′ₓ v", "Uₓ = U′ₓ/v"], "answer": 0, "explanation": "Frame 2 moves relative to frame 1 at +v, so velocities in frame 1 are larger by v.", "hack": "Back to the stationary frame: add v.", "src": "Example 10.2"}, {"q": "Example 10.2: With v = 37 m/s and U′ = (12, 0, 0) m/s, the velocity of the particle in frame 1 is", "options": ["(25, 0, 0) m/s", "(49, 0, 0) m/s", "(−25, 0, 0) m/s", "(444, 0, 0) m/s"], "answer": 1, "explanation": "Uₓ = 12 + 37 = 49 m/s; U_y = U_z = 0.", "hack": "12 + 37.", "src": "Example 10.2"}, {"q": "Example 10.3 (step 1): To show momentum conservation is Galilean invariant, each velocity is rewritten as", "options": ["u = u′ − v² for every velocity", "u = u′v for every velocity", "u = u′ + v for every velocity", "u = u′/v for every velocity"], "answer": 2, "explanation": "u₁ = u′₁ + v, u₂ = u′₂ + v, v₁ = v′₁ + v, v₂ = v′₂ + v.", "hack": "Each velocity picks up the same +v.", "src": "Example 10.3"}, {"q": "Example 10.3 (step 2): After substituting, the extra terms are", "options": ["(m₁ − m₂)v on the left only", "Zero on the left and mv on the right", "m₁m₂v on each side, which add", "(m₁ + m₂)v on each side, which cancel"], "answer": 3, "explanation": "m₁v + m₂v appears on both sides, so subtracting leaves m₁u′₁ + m₂u′₂ = m₁v′₁ + m₂v′₂.", "hack": "Same extra term both sides, so it cancels.", "src": "Example 10.3"}, {"q": "Example 10.3 (conclusion): The result shows the momentum conservation law is", "options": ["The same in different inertial frames", "True only in the rest frame", "False in any moving frame", "Dependent on the relative velocity"], "answer": 0, "explanation": "The primed equation has exactly the same form as the original.", "hack": "Same form = invariant.", "src": "Example 10.3"}]}, {"chapter": 11, "title": "Relativity of Simultaneity, Time Interval and Length", "concept": [{"q": "The consequences of relativity (simultaneity, time interval, length) are noticeable only when objects move", "options": ["At about the speed of sound in air", "At everyday speeds like those of cars", "At rest relative to the observer", "At a large fraction of the speed of light"], "answer": 3, "explanation": "At ordinary speeds the effects are insignificant.", "hack": "Relativity effects need speeds near c."}, {"q": "The relativity of simultaneity says that events simultaneous in one frame", "options": ["Need not be simultaneous in a moving frame", "Are always simultaneous in every frame", "Never occur at all in a moving frame", "Always occur later in the rest frame"], "answer": 0, "explanation": "Simultaneity is not absolute; it depends on the observer's frame.", "hack": "Same moment for you ≠ same moment for me."}, {"q": "According to the notes, simultaneity is", "options": ["Absolute and the same for everyone", "Not absolute; it depends on the frame", "Zero for light signals only, always", "Fixed by the rotation of the Earth"], "answer": 1, "explanation": "It depends on the frame of reference.", "hack": "No universal 'now'."}, {"q": "In the frame at rest, a light signal is sent from the midpoint B toward A and C. The light reaches A and C", "options": ["At A first", "At C first", "At the same time", "Never"], "answer": 2, "explanation": "Equal distances at the same light speed give equal times.", "hack": "Midpoint, same speed, same arrival time."}, {"q": "In the moving frame S′, the same light reaches A and C", "options": ["At the same time", "Only at A", "Only at C", "At different times"], "answer": 3, "explanation": "In S′ the arrival is not simultaneous: A runs to meet the light and C runs away from it.", "hack": "One observer runs toward the light, the other runs away."}, {"q": "In the moving frame, the observer A is described as", "options": ["Running to meet the signal", "Running away from the signal", "Standing still", "Moving at the speed of light"], "answer": 0, "explanation": "A moves toward the light so it arrives earlier.", "hack": "A meets it, C flees."}, {"q": "In the moving frame, the observer C is described as", "options": ["Running to meet the signal", "Running away from the signal", "Standing still", "Moving faster than the signal"], "answer": 1, "explanation": "C moves away so the signal needs longer to catch up.", "hack": "C is chased by the light."}, {"q": "The line joining simultaneous events on a space-time diagram (t against x) is", "options": ["Parallel to the t-axis", "At 45° to both axes", "Parallel to the x-axis", "A vertical line"], "answer": 2, "explanation": "Points with the same t lie along a line parallel to the x-axis.", "hack": "Same t = horizontal line."}, {"q": "The light signal from B in the diagram follows lines of the form", "options": ["x = x_B ± c/t", "x = ct²", "x = x_B + t/c", "x = x_B ± ct"], "answer": 3, "explanation": "The signal moves forward and backward at speed c.", "hack": "Distance = speed × time, both ways."}, {"q": "The Lorentz factor is defined as", "options": ["γ = 1/√(1 − β²)", "γ = √(1 − β²)", "γ = 1/√(1 + β²)", "γ = √(1 + β²)"], "answer": 0, "explanation": "β = v/c.", "hack": "γ = 1 over square root of (1 − β²). Always ≥ 1."}, {"q": "The quantity β is defined as", "options": ["β = c/v", "β = v/c", "β = v²", "β = vc"], "answer": 1, "explanation": "β is the speed as a fraction of the speed of light.", "hack": "β = v ÷ c."}, {"q": "The value of γ at very low speed (v ≪ c) is approximately", "options": ["0", "∞", "1", "c"], "answer": 2, "explanation": "β² is tiny, so γ ≈ 1 and relativistic effects vanish.", "hack": "Slow = γ ≈ 1."}, {"q": "As v approaches c, γ", "options": ["Approaches 1", "Becomes zero", "Becomes negative", "Becomes very large"], "answer": 3, "explanation": "1 − β² goes to 0, so γ grows without bound.", "hack": "Near c, γ explodes."}, {"q": "The Lorentz factor can never be", "options": ["Less than 1", "Greater than 1", "Equal to 1", "Greater than 5"], "answer": 0, "explanation": "γ ≥ 1 for all speeds below c.", "hack": "γ = 1 or bigger."}, {"q": "At v = 0.6c, the value of γ is", "options": ["0.8", "1.25", "1.67", "2.29"], "answer": 1, "explanation": "γ = 1/√(1 − 0.36) = 1/0.8 = 1.25.", "hack": "0.6 → 0.8 → 1/0.8. Nice 3-4-5 triangle."}, {"q": "At v = 0.8c, the value of γ is about", "options": ["0.6", "1.25", "1.67", "2.29"], "answer": 2, "explanation": "γ = 1/√(1 − 0.64) = 1/0.6 = 1.67.", "hack": "0.8 → 0.6 → 1/0.6."}, {"q": "At v = 0.9c, the value of γ is about", "options": ["1.11", "1.67", "5.0", "2.29"], "answer": 3, "explanation": "γ = 1/√(1 − 0.81) = 1/0.436 = 2.29 (the notes round to 2.3).", "hack": "0.9 → 0.436 → 2.29."}, {"q": "The time difference between two events in S′, for events simultaneous in S, is", "options": ["Δt′ = −γ(v/c²)Δx", "Δt′ = γ(v/c²)Δx²", "Δt′ = −γ(c/v)Δx", "Δt′ = −(v/c²)Δx/γ²"], "answer": 0, "explanation": "Equation 11.7 of the notes.", "hack": "Simultaneity shift = −γ v Δx / c²."}, {"q": "In the simultaneity equation, the time difference in S′ is zero only if", "options": ["Δx = c, the events are far apart", "Δx = 0, the events are at the same place", "v = c, the frames equal light speed", "γ = 0 for the frame"], "answer": 1, "explanation": "With Δt = 0 and Δx = 0, there is no shift. For Δx ≠ 0 and v ≠ 0 the events are not simultaneous in S′.", "hack": "Same place + same time = simultaneous for all."}, {"q": "The transformation of time is t′ =", "options": ["γ(t + vx)", "t − vx", "γ(t − vx/c²)", "γ(t − vx)/c"], "answer": 2, "explanation": "Equation 11.1 of the notes.", "hack": "Time picks up a vx/c² term."}, {"q": "Two events, Δx = 100 m apart and simultaneous in S, are seen from S′ moving at 0.9c. The time difference in S′ is about", "options": ["−6.9 μs", "+0.69 μs", "−0.30 μs", "−0.69 μs"], "answer": 3, "explanation": "Δt′ = −γvΔx/c² = −2.29 × 0.9 × 100 / (3 × 10⁸) = −6.9 × 10⁻⁷ s = −0.69 μs.", "hack": "γ × β × Δx / c."}, {"q": "A moving clock, as seen by an observer at rest, ticks", "options": ["More slowly than a clock at rest", "Faster than a clock at rest", "At exactly the same rate", "Backward in time"], "answer": 0, "explanation": "This is time dilation.", "hack": "Moving clocks run slow."}, {"q": "Time dilation means the time interval between two events", "options": ["Appears shorter in the frame where the clock moves", "Appears longer in the frame where the clock moves", "Is the same in all frames", "Is zero in every frame"], "answer": 1, "explanation": "The moving clock's ticks are stretched out.", "hack": "Moving frame = stretched time."}, {"q": "The proper time is the time interval measured", "options": ["In the frame where the clock is moving", "By the fastest observer", "In the frame where the clock is at rest", "By an observer far away"], "answer": 2, "explanation": "The observer and clock share the same inertial frame.", "hack": "Proper = same frame as the clock."}, {"q": "A light clock consists of", "options": ["Two lenses with a laser beam inside", "A pendulum swinging beside a mirror", "A spring with a mass attached to it", "Two mirrors with a light beam between them"], "answer": 3, "explanation": "One tick is the light going from one mirror to the other and back.", "hack": "Light bouncing between two mirrors."}, {"q": "For mirrors separated by d, the proper time for one tick of a light clock is", "options": ["Δτ = 2d/c", "Δτ = d/2c", "Δτ = 2c/d", "Δτ = d·c"], "answer": 0, "explanation": "Light travels 2d (there and back) at speed c.", "hack": "Distance 2d divided by speed c."}, {"q": "A light clock has mirrors 1.5 m apart. Its proper tick is", "options": ["10⁻⁹ s", "10⁻⁸ s", "5 × 10⁻⁹ s", "10⁻⁷ s"], "answer": 1, "explanation": "Δτ = 2d/c = 3 ÷ (3 × 10⁸) = 10⁻⁸ s.", "hack": "3 m ÷ 3 × 10⁸ m/s."}, {"q": "The time dilation equation is", "options": ["Δt = Δτ√(1 − u²/c²)", "Δt = Δτ(1 − u²/c²)", "Δt = Δτ/√(1 − u²/c²)", "Δt = Δτ/(1 + u²/c²)"], "answer": 2, "explanation": "Δt = γΔτ.", "hack": "Moving time = γ × proper time."}, {"q": "In the derivation of time dilation, the light path in the moving light clock forms", "options": ["A full circle, so π must be used", "A single straight line, no geometry", "A parabola, so calculus must be used", "A right-angled triangle (Pythagoras' theorem)"], "answer": 3, "explanation": "Half-path: (cΔt/2)² = d² + (uΔt/2)².", "hack": "Slanted light path = Pythagoras."}, {"q": "A clock that ticks every 10 s at rest is moving at 0.6c. An observer at rest measures the interval as", "options": ["12.5 s", "8 s", "10 s", "16.7 s"], "answer": 0, "explanation": "Δt = γΔτ = 1.25 × 10 = 12.5 s.", "hack": "Moving time is LONGER: multiply by γ."}, {"q": "A muon lives 2.2 μs at rest and moves at 0.99c. Its lifetime measured in the lab is about", "options": ["0.31 μs", "15.6 μs", "2.2 μs", "7.1 μs"], "answer": 1, "explanation": "γ = 7.09; 2.2 × 7.09 ≈ 15.6 μs.", "hack": "γ ≈ 7 at 0.99c."}, {"q": "Time dilation is symmetric in the sense that", "options": ["Only the moving observer ages less", "Only the resting observer ages less", "Each sees the other's clock running slow", "Neither clock ever appears to run slow"], "answer": 2, "explanation": "Each frame sees clocks in the other frame running slowly.", "hack": "Both see the other's clock slow."}, {"q": "In Example 11.1, the pion has a proper lifetime of 8.4 × 10⁻¹⁷ s. In the lab its lifetime is 4.2 × 10⁻¹⁶ s. The value of γ is", "options": ["0.2", "50", "25", "5"], "answer": 3, "explanation": "γ = 4.2 × 10⁻¹⁶ ÷ 8.4 × 10⁻¹⁷ = 5.", "hack": "Lab ÷ rest = γ."}, {"q": "For that pion, γ = 5 gives a speed of", "options": ["0.98c", "0.2c", "0.5c", "0.80c"], "answer": 0, "explanation": "β = √(1 − 1/γ²) = √(1 − 0.04) = 0.98.", "hack": "γ = 5 → β = √0.96."}, {"q": "Length contraction is also known as", "options": ["Newtonian shrinkage", "Lorentz contraction", "Galilean contraction", "Doppler shift"], "answer": 1, "explanation": "The notes call it Lorentz contraction.", "hack": "Length contraction = Lorentz contraction."}, {"q": "A moving object appears contracted", "options": ["In the direction perpendicular to its motion", "In all directions equally", "In the direction parallel to its motion", "Only in its width"], "answer": 2, "explanation": "Only the length along the motion shrinks.", "hack": "Squeezed along the motion only."}, {"q": "The length contraction equation is", "options": ["L = L₀/√(1 − u²/c²)", "L = L₀(1 − u²/c²)²", "L = L₀(1 + u²/c²)", "L = L₀√(1 − u²/c²)"], "answer": 3, "explanation": "L = L₀/γ.", "hack": "Length = proper length ÷ γ."}, {"q": "The proper length L₀ is the length", "options": ["Measured where the object is at rest", "Measured where the object is moving", "Measured at the speed of light only", "Always shorter than the moving length"], "answer": 0, "explanation": "L₀ is the rest length.", "hack": "Rest frame = proper length = longest."}, {"q": "The proper length is always", "options": ["The shortest length of the object", "The longest length of the object", "Equal to the contracted length", "Zero"], "answer": 1, "explanation": "Moving observers measure L = L₀/γ ≤ L₀.", "hack": "Moving = shorter."}, {"q": "A 10 m rod moves at 0.8c along its length. Its measured length is", "options": ["16.7 m", "8 m", "6 m", "10 m"], "answer": 2, "explanation": "L = 10 × √(1 − 0.64) = 10 × 0.6 = 6 m.", "hack": "0.8 → 0.6."}, {"q": "A spaceship of proper length 20 m moves at 0.6c. Its measured length is", "options": ["25 m", "12 m", "20 m", "16 m"], "answer": 3, "explanation": "L = 20 × 0.8 = 16 m.", "hack": "0.6 → 0.8."}, {"q": "A rocket measured as 5.5 m by an Earth observer moves at 0.95c. The astronaut's measured (proper) length is about", "options": ["17.6 m", "1.7 m", "5.2 m", "5.5 m"], "answer": 0, "explanation": "L₀ = L/√(1 − 0.95²) = 5.5 ÷ 0.312 = 17.6 m.", "hack": "Divide by 0.312."}, {"q": "At 0.95c the factor √(1 − β²) is about", "options": ["0.05", "0.312", "0.95", "3.2"], "answer": 1, "explanation": "1 − 0.9025 = 0.0975; its square root is 0.312.", "hack": "γ = 3.2 at 0.95c."}, {"q": "As speed increases toward c, a moving rod's measured length", "options": ["Increases without limit", "Stays constant", "Decreases toward zero", "Doubles"], "answer": 2, "explanation": "L = L₀/γ shrinks as γ grows.", "hack": "Faster = flatter."}, {"q": "Which statement is a consequence of special relativity?", "options": ["Galilean transformation", "Absolute time", "Universal space", "Time dilation"], "answer": 3, "explanation": "Length contraction, time dilation, simultaneity and velocity transformation come from special relativity; the Galilean transformation is classical.", "hack": "Relativity: LTS (Length, Time, Simultaneity)."}, {"q": "Which of these is NOT a consequence of the principles of special relativity?", "options": ["Coordinate system", "Length contraction", "Time dilation", "Velocity transformation"], "answer": 0, "explanation": "A coordinate system is a tool, not a consequence.", "hack": "Tools aren't consequences."}, {"q": "An event is characterised by", "options": ["Space and velocity", "Space and time", "Velocity and time", "Acceleration only"], "answer": 1, "explanation": "An event has coordinates (x, y, z) and a time t.", "hack": "Where + when."}, {"q": "An inertial reference frame can also be called a", "options": ["A Lorentz clock and nothing else", "A frame of reference, nothing more", "Galilean frame or inertial space", "A space-time interval of two events"], "answer": 2, "explanation": "The notes accept 'Galilean reference frame' and 'inertial space'.", "hack": "Inertial = Galilean = inertial space."}, {"q": "Which of these is the odd one out?", "options": ["Length contraction", "Time dilation", "Relativity of simultaneity", "Galilean transformation"], "answer": 3, "explanation": "The other three are relativistic effects; the Galilean transformation is Newtonian.", "hack": "Galileo = classical."}, {"q": "The speed of light c is about", "options": ["3 × 10⁸ m/s", "3 × 10⁶ m/s", "3 × 10⁵ m/s", "3 × 10¹⁰ m/s"], "answer": 0, "explanation": "c ≈ 3.0 × 10⁸ m/s.", "hack": "300 000 km/s."}, {"q": "At low speeds the relativistic formulas reduce to", "options": ["Zero for every quantity measured", "The classical (Galilean) results", "Infinite values for every quantity", "Negative values for every quantity"], "answer": 1, "explanation": "γ → 1, so time and length are unchanged.", "hack": "Slow speeds: Newton wins."}, {"q": "An observer sees a light signal sent from the midpoint B reach A and C simultaneously. This happens in the", "options": ["Moving frame S′ only", "Both frames, always", "Rest frame S", "Neither frame"], "answer": 2, "explanation": "In the rest frame, equal distances give equal times.", "hack": "Rest frame = simultaneous."}], "tutorial": [{"q": "Problem 11.1: An event is characterised by", "options": ["Space and velocity", "Velocity and time", "Acceleration only", "Space and time"], "answer": 3, "explanation": "An event is specified by where and when it happens.", "hack": "Event = space + time.", "src": "Problem 11.1"}, {"q": "Problem 11.2: An inertial reference frame can be referred to as", "options": ["C and D only (Galilean frame, inertial space)", "A and B only (Lorentz frame, any frame)", "B only (frame of reference, no more)", "A only (Lorentz reference frame only)"], "answer": 0, "explanation": "The notes' key is E: both 'Galilean reference frame' and 'inertial space'.", "hack": "Inertial = Galilean = inertial space.", "src": "Problem 11.2"}, {"q": "Problem 11.3: The following are consequences of the principles of special relativity EXCEPT", "options": ["Length contraction", "Coordinate system", "Time dilation", "Velocity transformation"], "answer": 1, "explanation": "A coordinate system is a tool, not a consequence. (The notes' option C, Galilean transformation, is classical but is not the answer they mark.)", "hack": "The key marks A.", "src": "Problem 11.3"}, {"q": "Problem 11.4: In the rest frame, three observers A, B, C are equally spaced and light is sent from B. The time difference T between the arrivals at A and C is", "options": ["T = 1", "T = 2", "T = 0 (B only)", "A and B only"], "answer": 2, "explanation": "Equal distances at the same light speed give equal times, so there is no time difference. The notes' key is E (B only: T = 0).", "hack": "Same distance, same speed = zero difference.", "src": "Problem 11.4"}, {"q": "Problem 11.5: The mathematical expression for relativity of simultaneity is", "options": ["Δt′ = γ(v/c²)Δx", "Δt′ = −γ(v²/c²)Δx", "Δt′ = γ(v/c)Δx", "Δt′ = −γ(v/c²)Δx"], "answer": 3, "explanation": "Equation 11.7. The notes' key is B.", "hack": "Minus sign, γ, v over c squared, times Δx.", "src": "Problem 11.5"}, {"q": "Problem 11.6: The Lorentz factor used in time dilation and length contraction is", "options": ["γ = 1/√(1 − β²)", "γ = √(1 − β²)", "γ = 1/√(1 + β²)", "γ = √(1 + β²)"], "answer": 0, "explanation": "The notes' key is A.", "hack": "γ ≥ 1, so the root sits in the denominator.", "src": "Problem 11.6"}], "exercises": [{"q": "Exercise 11.1 (γ): Two events are simultaneous in S at x₁ = 0 and x₂ = 100 m. For S′ moving at 0.9c, the Lorentz factor is", "options": ["0.436", "2.29", "1.67", "4.26"], "answer": 1, "explanation": "γ = 1/√(1 − 0.81) = 1/0.436 = 2.29 (the notes round to 2.3).", "hack": "0.9 → √0.19 = 0.436 → 1/0.436.", "src": "Exercise 11.1"}, {"q": "Exercise 11.1: The time difference of those events in S′ is about", "options": ["−6.9 μs", "+0.69 μs", "−0.69 μs", "−0.23 μs"], "answer": 2, "explanation": "Δt′ = −γvΔx/c² = −2.29 × 0.9 × 100 ÷ (3 × 10⁸) = −6.9 × 10⁻⁷ s = −0.69 μs. (The notes write 1000 m instead of 100 m and print −6.9 μs.)", "hack": "Use the stated Δx = 100 m.", "src": "Exercise 11.1"}, {"q": "Example 11.1 (relation): For the pion, the time-dilation equation is rearranged to find the speed from", "options": ["t′ = t√(1 − U²/c²)", "t′ = t(1 − U²/c²)", "t′ = t/(1 + U²/c²)", "t′ = t/√(1 − U²/c²)"], "answer": 3, "explanation": "t′ is the lab (dilated) lifetime and t the proper lifetime.", "hack": "Lab time is longer: divide by the root.", "src": "Example 11.1"}, {"q": "Example 11.1: A π⁰ has a rest lifetime of 8.4 × 10⁻¹⁷ s and is observed to live 4.2 × 10⁻¹⁶ s in the lab. Its speed is", "options": ["0.98c", "0.50c", "0.20c", "0.96c"], "answer": 0, "explanation": "γ = 5, so U = c√(1 − 1/25) = c√0.96 = 0.98c.", "hack": "Ratio 5 → 0.98c.", "src": "Example 11.1"}, {"q": "Example 11.2 (setup): A rocket passes the Earth at 0.95c and is measured as 5.5 m long. For the astronaut inside, this 5.5 m is the", "options": ["Proper length of the rocket itself", "Contracted length measured on Earth", "Length measured with the rocket at rest", "Length in the rocket's own rest frame"], "answer": 1, "explanation": "The Earth observer sees a moving rocket, so the measured length is the contracted one.", "hack": "Moving object: contracted length.", "src": "Example 11.2"}, {"q": "Example 11.2: Then the rocket's length as measured by the astronaut inside is", "options": ["1.7 m", "5.5 m", "17.6 m", "5.2 m"], "answer": 2, "explanation": "L = L₀√(1 − 0.95²), so L₀ = 5.5 ÷ 0.312 = 17.6 m.", "hack": "Divide by the small factor 0.312.", "src": "Example 11.2"}]}, {"chapter": 12, "title": "Universal Gravitation, Work and Energy", "concept": [{"q": "Newton's law of universal gravitation says every particle in the Universe attracts every other particle with a force that is", "options": ["Proportional to the product of masses and inverse to r²", "Proportional to the sum of masses and inverse to r", "Proportional to r and inverse to the product of masses", "Independent of masses but proportional to r squared"], "answer": 0, "explanation": "F = G m₁m₂ / r²: direct in each mass, inverse-square in distance.", "hack": "Masses on top, distance squared at the bottom."}, {"q": "The gravitational force between two masses m₁ and m₂ a distance r apart has magnitude", "options": ["F = G m₁m₂ / r", "F = G m₁m₂ / r²", "F = G (m₁ + m₂) / r²", "F = G m₁m₂ r²"], "answer": 1, "explanation": "This is Eq. 12.1 of the notes.", "hack": "G times both masses over r squared."}, {"q": "The SI value of the universal gravitational constant G is about", "options": ["6.67 × 10¹¹ N·m²/kg²", "9.80 × 10⁻¹¹ N·m²/kg²", "6.67 × 10⁻¹¹ N·m²/kg²", "6.67 × 10⁻¹ N·m²/kg²"], "answer": 2, "explanation": "G = 6.673 × 10⁻¹¹ N·m²/kg², a very small number, so gravity between everyday objects is tiny.", "hack": "Negative eleven: gravity is feeble between small masses."}, {"q": "The SI unit of G can be written as", "options": ["N·kg/m²", "N·m/kg", "kg·m²/N", "N·m²/kg²"], "answer": 3, "explanation": "Rearranging F = Gm₁m₂/r² gives G = Fr²/(m₁m₂) → N·m²/kg².", "hack": "Units: force × metre² ÷ kg²."}, {"q": "The force that makes an apple fall to the ground is the same one that keeps the Moon in orbit. This was the insight of", "options": ["Isaac Newton", "Johannes Kepler", "Galileo Galilei", "Albert Einstein"], "answer": 0, "explanation": "Newton recognised that the force pulling the apple to Earth is universal gravitation.", "hack": "Newton = apple = gravity."}, {"q": "If the distance between two masses is doubled, the gravitational force becomes", "options": ["One half of its value", "One quarter of its value", "Twice its value", "Four times its value"], "answer": 1, "explanation": "F ∝ 1/r², so (1/2)² gives 1/4.", "hack": "Double r → divide F by 4."}, {"q": "If the distance between two masses is halved, the gravitational force becomes", "options": ["Twice its value", "One half of its value", "Four times its value", "One quarter of its value"], "answer": 2, "explanation": "F ∝ 1/r²; halving r multiplies F by 2² = 4.", "hack": "Half r → multiply F by 4."}, {"q": "If the distance between two masses is tripled, the force becomes", "options": ["One third of its value", "Three times its value", "Nine times its value", "One ninth of its value"], "answer": 3, "explanation": "F ∝ 1/r²; (1/3)² = 1/9.", "hack": "Triple r → divide F by 9."}, {"q": "If both masses are doubled and the distance is unchanged, the force becomes", "options": ["Four times its value", "Twice its value", "Unchanged", "Eight times its value"], "answer": 0, "explanation": "F ∝ m₁m₂ so 2 × 2 = 4.", "hack": "Each mass doubles the force once."}, {"q": "If one mass is doubled and the distance is doubled, the force becomes", "options": ["Twice its value", "One half of its value", "One quarter of its value", "Unchanged"], "answer": 1, "explanation": "F ∝ m/r² → 2/4 = 1/2.", "hack": "Multiply the factors: 2 ÷ 4 = ½."}, {"q": "Mass m₁ pulls on m₂ with force F. The force m₂ exerts on m₁ is", "options": ["Smaller by the ratio m₁/m₂", "Larger by the ratio m₂/m₁", "Equal in size and opposite in direction", "Zero for the smaller mass"], "answer": 2, "explanation": "They form a Newton's third-law action–reaction pair, F₁₂ = −F₂₁.", "hack": "Third law: the Earth pulls you exactly as hard as you pull it."}, {"q": "The negative sign in F₁₂ = −G (m₁m₂/r²) r̂ shows that the force on particle 2 is", "options": ["Directed away from particle 1 (repulsive)", "Perpendicular to the line joining them", "Always smaller than that on particle 1", "Directed toward particle 1 (attractive)"], "answer": 3, "explanation": "Gravity is always attractive; the minus sign points toward the other mass.", "hack": "Gravity only pulls, never pushes."}, {"q": "Gravitational forces between everyday objects, like two students, are not noticed because", "options": ["G is extremely small and the masses are small", "Gravity acts only on planets and stars", "Gravity needs the objects to touch", "Friction cancels the gravitational force"], "answer": 0, "explanation": "With G ~ 10⁻¹¹ and masses of tens of kg the force is of order 10⁻⁹ N.", "hack": "Tiny G, tiny masses, tiny force."}, {"q": "The principle of superposition states that the net gravitational force on a particle from several others is", "options": ["The arithmetic sum of the force magnitudes", "The vector sum of the individual forces", "Equal to the largest individual force", "The product of the individual forces"], "answer": 1, "explanation": "F_net = F₁₂ + F₁₃ + … + F₁ₙ, added as vectors.", "hack": "Forces add as vectors, not just numbers."}, {"q": "Three bodies pull on the same particle in different directions. To find the net force you must", "options": ["Multiply the three force values", "Add only their magnitudes", "Add the forces as vectors", "Use only the nearest body"], "answer": 2, "explanation": "Gravitational forces are vectors, so use components and superposition.", "hack": "Components first, then Pythagoras."}, {"q": "The gravitational force on an object of mass m at the Earth's surface gives a free-fall acceleration g equal to", "options": ["G Mₑ / Rₑ", "G m / Rₑ²", "G Mₑ m / Rₑ", "G Mₑ / Rₑ²"], "answer": 3, "explanation": "mg = G Mₑ m / Rₑ², and m cancels (Eq. 12.7).", "hack": "g does not contain the falling mass."}, {"q": "The free-fall acceleration g at the Earth's surface does NOT depend on", "options": ["The mass of the falling object", "The mass of the Earth", "The radius of the Earth", "The constant G"], "answer": 0, "explanation": "m cancels in mg = GMₑm/Rₑ².", "hack": "Heavy and light fall alike (no air)."}, {"q": "At a height h above the Earth's surface, the free-fall acceleration is", "options": ["g = G Mₑ / h²", "g = G Mₑ / (Rₑ + h)²", "g = G Mₑ / (Rₑ − h)²", "g = G Mₑ h / Rₑ²"], "answer": 1, "explanation": "Distance is measured from the Earth's centre: Rₑ + h.", "hack": "Always measure r from the centre, not the surface."}, {"q": "As altitude above the Earth's surface increases, g", "options": ["Increases", "Stays exactly constant", "Decreases", "First rises, then falls"], "answer": 2, "explanation": "The denominator (Rₑ + h)² grows, so g falls (Table 12.1: 9.8 → 1.49 m/s² at 10 000 km).", "hack": "Higher up, weaker pull."}, {"q": "In the notes' table, g at an altitude of 10 000 km is about", "options": ["9.80 m/s²", "4.53 m/s²", "0.13 m/s²", "1.49 m/s²"], "answer": 3, "explanation": "The table lists 1.49 m/s² at 10 000 km and 0.13 m/s² at 50 000 km.", "hack": "Remember 1.49 and 0.13 (the far end)."}, {"q": "The mass of an astronaut in orbit compared with his mass on Earth is", "options": ["The same", "Smaller, because g is smaller", "Zero, because he floats", "Larger, because of speed"], "answer": 0, "explanation": "Mass is intrinsic; only weight (mg) changes with location.", "hack": "Mass stays, weight changes."}, {"q": "The weight of an object at altitude compared with its weight at the surface is", "options": ["More, because it is higher", "Less, because g is smaller there", "The same, because mass is fixed", "Zero for every altitude"], "answer": 1, "explanation": "W = mg and g decreases with height.", "hack": "Weight follows g, mass does not."}, {"q": "Johannes Kepler (1571–1630) worked out", "options": ["The law of universal gravitation", "The laws of thermodynamics", "Three empirical laws of planetary motion", "The principle of relativity"], "answer": 2, "explanation": "Kepler's laws were empirical; Newton later explained them.", "hack": "Kepler described, Newton explained."}, {"q": "Kepler's first law states that planets move in", "options": ["Circular orbits with the Sun at the centre", "Parabolic paths with the Sun at the vertex", "Straight lines at the Sun's speed", "Elliptical orbits with the Sun at one focus"], "answer": 3, "explanation": "Orbits are ellipses with the Sun at one focus.", "hack": "First law = ellipse, Sun at a focus."}, {"q": "In Kepler's first law, the second focus of the orbit is", "options": ["Empty", "Occupied by the Moon", "Occupied by the planet's twin", "Occupied by a star"], "answer": 0, "explanation": "Only the Sun occupies one focus; the other is empty.", "hack": "Only one focus has the Sun."}, {"q": "Any object bound to another by an inverse-square force moves in", "options": ["A straight line", "An elliptical path", "A spiral that expands", "A square path"], "answer": 1, "explanation": "Inverse-square attraction gives conic-section orbits; bound ones are ellipses.", "hack": "Inverse-square → ellipse."}, {"q": "Kepler's second law says the line from the Sun to a planet sweeps out", "options": ["Equal distances in equal times", "Equal angles in equal distances", "Equal areas in equal time intervals", "Equal speeds in equal areas"], "answer":
