<script>
const DATA=[{"chapter": 1, "title": "Dimensions, Units and Conversions", "concept": [{"q": "Measurement is best described as", "options": ["Estimating the size of a quantity without using any standard at all", "Finding the size of a quantity by comparing it with a standard of the same kind", "Counting the number of objects present without regard to their size", "Naming the type of quantity without giving any numerical value"], "answer": 1, "explanation": "Measurement = comparing an unknown quantity with a known standard of the same nature (the unit).", "hack": "MEASURE = COMPARE. If an option says 'estimate' or 'name only', it has no standard, so it is not measurement."}, {"q": "Which statement correctly separates a dimension from a unit?", "options": ["Length is a unit; the metre is a dimension of it", "Length and metre are both dimensions of mass", "Length is a dimension; the metre is a unit of it", "Length and metre are both units of the same standard"], "answer": 2, "explanation": "A dimension is the kind of quantity (no numbers); a unit is a standard amount of that dimension used to give it a number.", "hack": "Dimension = 'WHAT KIND' (L, M, T). Unit = 'HOW MUCH' (m, kg, s). Dimension first, unit second."}, {"q": "In mechanics, the three basic quantities are", "options": ["Length, force and time", "Mass, speed and time", "Length, mass and energy", "Length, mass and time"], "answer": 3, "explanation": "Every other mechanical quantity (force, energy, speed...) is built from L, M and T.", "hack": "Mnemonic: L-M-T = 'Let Me Think'. Force, speed and energy are never basic: they are built from L, M, T."}, {"q": "How many primary (basic) dimensions are listed in the notes?", "options": ["Seven", "Three", "Five", "Nine"], "answer": 0, "explanation": "The seven are mass, length, time, temperature, electric current, amount of light and amount of matter.", "hack": "Seven = 7 SI base units. Only the first FOUR (M, L, T, temperature) matter for mechanics and thermal work."}, {"q": "Which of these is NOT one of the seven primary dimensions?", "options": ["Temperature", "Force", "Electric current", "Amount of matter"], "answer": 1, "explanation": "Force is a secondary (derived) dimension: F = ma, so it is built from M, L and T.", "hack": "Odd-one-out trap: anything with 'F = ma' behind it (force, energy, power, pressure) is DERIVED, never primary."}, {"q": "What is the SI unit of the amount of matter?", "options": ["Candela (cd)", "Kelvin (K)", "Mole (mol)", "Ampere (A)"], "answer": 2, "explanation": "Amount of matter is counted in moles. Candela is for amount of light, kelvin for temperature, ampere for current.", "hack": "Mole = Matter (both start with M). Candela = Candle = light."}, {"q": "What is the SI unit of the amount of light?", "options": ["Mole (mol)", "Kelvin (K)", "Ampere (A)", "Candela (cd)"], "answer": 3, "explanation": "The candela is the SI unit for the amount of light.", "hack": "CANdela = CANdle = light."}, {"q": "Which is the SI unit of temperature in the table of basic units?", "options": ["Kelvin (K)", "Rankine (R)", "Slug", "Candela (cd)"], "answer": 0, "explanation": "SI uses kelvin; the BG and English systems use the Rankine scale.", "hack": "K for Kelvin = SI; R for Rankine = the old British/English systems."}, {"q": "In the BG (British Gravitational) system, the basic unit of mass is the", "options": ["Pound-mass (lbm)", "Slug", "Kilogram (kg)", "Mole (mol)"], "answer": 1, "explanation": "SI mass = kg, BG mass = slug, English mass = pound-mass (lbm).", "hack": "SLUG = 'Sluggish' = heavy: 1 slug is about 14.59 kg. kg is SI, slug is BG, lbm is English."}, {"q": "In the English system, the basic unit of mass is the", "options": ["Slug", "Kilogram (kg)", "Pound-mass (lbm)", "Foot (ft)"], "answer": 2, "explanation": "The table lists lbm (pound-mass) as the English unit of mass; the foot is a unit of length.", "hack": "lbm = pound-MASS. Do not mix it up with pound-force."}, {"q": "The SI unit of force, written in base units, is", "options": ["kg·m²/s²", "kg/(m·s²)", "kg·m/s", "kg·m/s²"], "answer": 3, "explanation": "Newton = kg·m/s², from F = ma (mass × acceleration).", "hack": "N = 'kg m per s-squared'. Add one more metre (kg·m²/s²) and you have the joule instead."}, {"q": "The SI unit of pressure is the", "options": ["Pascal (N/m²)", "Newton (kg·m/s²)", "Joule (N·m)", "Watt (J/s)"], "answer": 0, "explanation": "Pressure = force per area, so its unit is N/m², called the pascal (Pa).", "hack": "Pressure = Pascal = N per m². 'P for P'."}, {"q": "The SI unit of energy is the", "options": ["Watt (J/s)", "Joule (N·m)", "Pascal (N/m²)", "Newton (kg·m/s²)"], "answer": 1, "explanation": "Energy is measured in joules, 1 J = 1 N·m.", "hack": "Joule = Newton × metre (force times distance). Watt is joule per second, which is POWER."}, {"q": "The SI unit of power is the", "options": ["Joule (N·m)", "Pascal (N/m²)", "Watt (J/s)", "Newton (kg·m/s²)"], "answer": 2, "explanation": "Power is energy per unit time: 1 W = 1 J/s.", "hack": "WATT = work per second. Per-second units (J/s) always point to power."}, {"q": "Dimensions built from combinations of the primary dimensions are called", "options": ["Primary dimensions", "Basic dimensions", "Independent dimensions", "Secondary dimensions"], "answer": 3, "explanation": "Anything obtained by combining primary dimensions (force, energy, pressure...) is a secondary dimension.", "hack": "Primary = basic = independent = fundamental (all the same family). Secondary = derived."}, {"q": "Primary (basic) dimensions are defined as", "options": ["Independent dimensions from which others are obtained", "Combinations of other dimensions", "Dimensions with no units at all", "Quantities that have no direction"], "answer": 0, "explanation": "They are independent and fundamental; every other dimension is obtained from them.", "hack": "Primary = parent, secondary = child. A parent cannot be made from anything else."}, {"q": "Since October 1983 the metre has been defined as the distance travelled by light in vacuum in", "options": ["1/9 192 631 770 of a second", "1/299 792 458 of a second", "1/186 000 of a second", "1/3 000 000 of a second"], "answer": 1, "explanation": "This fixes the speed of light in vacuum at exactly 299 792 458 m/s.", "hack": "Metre = light and 299 792 458 (the speed of light). The 9 192 631 770 number belongs to the SECOND."}, {"q": "Before 1983 the metre was defined as the distance between two lines on", "options": ["A copper rod kept in England", "A steel tape kept in America", "A platinum-iridium bar kept in France", "A wooden stick kept in Sèvres"], "answer": 2, "explanation": "The older standard was a specific platinum-iridium bar stored under controlled conditions in France, but its accuracy was limited.", "hack": "Old metre = a BAR (a thing). New metre = LIGHT (a constant of nature)."}, {"q": "In A.D. 1120 the king of England fixed the yard as the distance from", "options": ["His elbow to the tip of his middle finger", "His heel to the tip of his big toe", "His shoulder to the ground", "The tip of his nose to the end of his outstretched arm"], "answer": 3, "explanation": "The yard was originally based on the king's own body: nose tip to outstretched arm.", "hack": "Yard = the king's body: nose tip to outstretched arm. Old standards used bodies; the modern metre uses light."}, {"q": "The standard kilogram is a cylinder made of", "options": ["Platinum-iridium alloy", "Pure gold", "Stainless steel", "Caesium-133"], "answer": 0, "explanation": "The standard mass is a platinum-iridium cylinder established in 1887.", "hack": "Pt-Ir = Platinum-Iridium. Caesium belongs to the clock (second), not the kilogram."}, {"q": "The standard kilogram is kept at the International Bureau of Weights and Measures at", "options": ["Greenwich, England", "Sèvres, France", "Geneva, Switzerland", "Washington, USA"], "answer": 1, "explanation": "The platinum-iridium standard mass is held at Sèvres, France.", "hack": "Kilogram lives in Sèvres (France) and dates from 1887. Do not confuse with the second (caesium)."}, {"q": "The standard mass has not been changed since 1887 mainly because platinum-iridium is", "options": ["The lightest known alloy", "A liquid at room temperature", "An unusually stable alloy", "A cheap everyday metal"], "answer": 2, "explanation": "Platinum-iridium is very stable, so the standard does not change with time.", "hack": "STABLE = never changes = good standard. Reason questions: pick 'stable'."}, {"q": "The SI second is defined as how many periods of radiation from the caesium-133 atom?", "options": ["299 792 458", "6 022 137 000", "1 660 540 210", "9 192 631 770"], "answer": 3, "explanation": "In 1967 the second was defined as 9 192 631 770 vibration periods of caesium-133 radiation.", "hack": "SECOND = caesium = 9 192 631 770 (ten digits). Metre = 299 792 458 (nine digits)."}, {"q": "The atom used as the 'reference clock' for the SI second is", "options": ["Caesium-133", "Carbon-12", "Platinum-193", "Hydrogen-1"], "answer": 0, "explanation": "The second is defined from caesium-133 radiation. Carbon-12 is the reference for atomic mass and the mole.", "hack": "Clock = Caesium (C-for-Clock). Carbon-12 = mole and atomic mass unit."}, {"q": "Matter is best defined as a substance that", "options": ["Has no mass and no volume", "Has inertia and occupies space", "Exists only as a gas", "Is always made of one atom"], "answer": 1, "explanation": "Matter has inertia (mass) and takes up physical space.", "hack": "Matter = Mass + Space (two-part definition). Option with 'no mass' is automatically wrong."}, {"q": "The three most familiar material particles are", "options": ["The atom, molecule and compound", "The solid, liquid and gas", "The electron, proton and neutron", "The metre, kilogram and second"], "answer": 2, "explanation": "Electrons, protons and neutrons combine to form atoms.", "hack": "e-p-n are PARTICLES; atom, molecule, compound are COMBINATIONS; solid, liquid, gas are STATES."}, {"q": "The three most common states of matter are", "options": ["Atom, molecule and compound", "Proton, neutron and electron", "Mass, length and time", "Solid, liquid and gas"], "answer": 3, "explanation": "Matter commonly exists as solid, liquid or gas.", "hack": "SLG = Solid, Liquid, Gas (low energy to high energy)."}, {"q": "The state (phase) in which a substance exists depends on its", "options": ["Temperature and pressure", "Colour and shape", "Name and symbol", "Charge and spin only"], "answer": 0, "explanation": "A single element or compound can be solid, liquid or gas depending on temperature and pressure.", "hack": "State of matter = TP (Temperature and Pressure)."}, {"q": "The nucleus of the atom was discovered in", "options": ["1887", "1911", "1967", "1983"], "answer": 1, "explanation": "After the 1911 discovery of the nucleus, each atom was modelled as electrons surrounding a central nucleus.", "hack": "Date triangle: 1887 = standard kg, 1911 = nucleus, 1967 = second, 1983 = metre."}, {"q": "According to the atomic model in the notes, each atom consists of", "options": ["A nucleus surrounding a central electron", "Only neutrons packed together", "Electrons surrounding a central nucleus", "A single proton in a cloud of gas"], "answer": 2, "explanation": "Electrons orbit a central nucleus (made of protons and neutrons).", "hack": "Nucleus = centre, electrons = around the outside."}, {"q": "About how many different kinds of atoms (chemical elements) exist, according to the notes?", "options": ["Exactly 7", "About 12", "Only 3", "More than 100"], "answer": 3, "explanation": "There are more than 100 kinds of atoms, each kind forming a unique chemical element.", "hack": "'Over 100' is the number to remember (the periodic table). Seven is the count of PRIMARY DIMENSIONS, not elements."}, {"q": "A combination of atoms forms a", "options": ["Molecule", "Quark", "Electron", "Neutron"], "answer": 0, "explanation": "Atoms join to form molecules, and atoms and/or molecules can join to form compounds.", "hack": "Atoms → Molecule → Compound (bigger each time)."}, {"q": "Density is defined as", "options": ["Volume per unit mass", "Mass per unit volume", "Mass per unit length", "Force per unit area"], "answer": 1, "explanation": "ρ = M/V, the mass in one unit of volume.", "hack": "ρ = M ÷ V: Mass over Volume. Flip it and you get the wrong option."}, {"q": "The SI unit of density is", "options": ["kg·m³", "m³/kg", "kg/m³", "kg/m²"], "answer": 2, "explanation": "Mass (kg) divided by volume (m³) gives kg/m³.", "hack": "Density has a division line: kg ON TOP, m³ UNDERNEATH."}, {"q": "Aluminium has a density of 2.70 g/cm³. What is the mass of a 10.0 cm³ piece of it?", "options": ["2.70 g", "270 g", "0.270 g", "27.0 g"], "answer": 3, "explanation": "m = ρV = 2.70 g/cm³ × 10.0 cm³ = 27.0 g.", "hack": "Mass = density × volume: just slide the decimal point one place for 10 cm³."}, {"q": "Lead has a density of 11.3 g/cm³. What is the mass of a 10.0 cm³ piece of it?", "options": ["113 g", "11.3 g", "1130 g", "1.13 g"], "answer": 0, "explanation": "m = ρV = 11.3 × 10.0 = 113 g, which is more than four times the mass of the same volume of aluminium.", "hack": "Lead is about 4× denser than aluminium. Same volume → lead is about 4× heavier."}, {"q": "The atomic mass of lead used in the notes is", "options": ["27.0 u", "207 u", "12 u", "113 u"], "answer": 1, "explanation": "Lead is 207 u and aluminium is 27.0 u, which is partly why lead is denser.", "hack": "Pb = 207 (big), Al = 27 (small). 113 is the MASS of 10 cm³ of lead, not its atomic mass."}, {"q": "One atomic mass unit (1 u) is equal to", "options": ["1.66 × 10⁻²⁴ kg", "6.02 × 10²³ kg", "1.66 × 10⁻²⁷ kg", "9.11 × 10⁻³¹ kg"], "answer": 2, "explanation": "1 u = 1.660 × 10⁻²⁷ kg = 1.660 × 10⁻²⁴ g (see the mass conversion table).", "hack": "Unit trap: ×10⁻²⁷ is in kg, ×10⁻²⁴ is in grams. Kilograms are smaller numbers (more negative power)."}, {"q": "The atomic mass of an element is the", "options": ["Number of protons in the nucleus only", "Mass of one mole in kilograms", "Total mass of all electrons", "Average mass of one atom over all its isotopes"], "answer": 3, "explanation": "Atomic mass is the average mass of one atom in a sample containing all the element's isotopes.", "hack": "ATOMIC MASS = AVERAGE (because of isotopes)."}, {"q": "The mass of a nucleus is measured relative to the nucleus of which isotope?", "options": ["Carbon-12", "Caesium-133", "Hydrogen-1", "Platinum-195"], "answer": 0, "explanation": "Carbon-12 is the reference isotope for atomic mass and for the mole.", "hack": "C-12 = the mole and mass reference. Cs-133 = the clock."}, {"q": "One mole of a substance contains as many particles as there are atoms in", "options": ["1 g of hydrogen", "12 g of carbon-12", "1 kg of carbon-12", "12 kg of platinum-iridium"], "answer": 1, "explanation": "By definition, 1 mol contains as many particles as 12 g of carbon-12.", "hack": "MOLE = 12 g of C-12. Grams, not kilograms."}, {"q": "Avogadro's number is approximately", "options": ["6.022 × 10⁻²³ particles/mol", "9.19 × 10⁹ particles/mol", "6.022 × 10²³ particles/mol", "3.00 × 10⁸ particles/mol"], "answer": 2, "explanation": "N_A = 6.022 × 10²³ particles per mole.", "hack": "AVOGADRO = ABOVE (positive power) 10²³: a HUGE number of particles per mole."}, {"q": "1 mol of aluminium and 1 mol of lead contain", "options": ["More atoms in lead", "More atoms in aluminium", "No atoms in common unit", "The same number of atoms"], "answer": 3, "explanation": "Any mole of any substance contains Avogadro's number of particles.", "hack": "A mole is a COUNT, not a mass. Same count for every substance; only the mass differs."}, {"q": "The mass of 1 mol of aluminium (atomic mass 27.0 u) is", "options": ["27.0 g", "27.0 kg", "6.02 × 10²³ g", "12.0 g"], "answer": 0, "explanation": "The mass in one mole of any element is its atomic mass expressed in grams.", "hack": "Atomic mass in u → molar mass in g/mol. Same number, change the unit."}, {"q": "The dimension of volume is", "options": ["L²", "L³", "L/T", "M/L³"], "answer": 1, "explanation": "Volume is length × length × length.", "hack": "Dimension power = space dimensions: area L², volume L³."}, {"q": "The dimension of acceleration is", "options": ["L/T", "L²/T", "L/T²", "M·L/T²"], "answer": 2, "explanation": "Acceleration = change in velocity (L/T) per time (T), so L/T².", "hack": "Acceleration has T SQUARED underneath. Velocity has T only."}, {"q": "The dimension of density is", "options": ["M·L³", "L³/M", "M/L²", "M/L³"], "answer": 3, "explanation": "ρ = M/V, and V has dimension L³.", "hack": "Density: [M] on top, [L³] below, same as the unit kg/m³."}, {"q": "The dimension of force, from F = ma, is", "options": ["M·L/T²", "M·L²/T²", "M·L/T", "M/(L·T²)"], "answer": 0, "explanation": "[F] = [M][L/T²] = ML/T².", "hack": "Force = ML T⁻². Energy is the same with one extra L: ML² T⁻²."}, {"q": "Which operation is impossible to evaluate (dimensionally invalid)?", "options": ["3 m + 2 cm", "3 kg + 2 s", "3 s + 2 min", "3 m × 2 kg"], "answer": 1, "explanation": "Only quantities of the same dimension can be added. Mass and time cannot be added, but m + cm and s + min can after converting units.", "hack": "ADD/SUBTRACT needs SAME dimension. MULTIPLY/DIVIDE is always allowed."}, {"q": "Rule 1 of dimensional analysis says that terms which are added or subtracted must", "options": ["Have the same numerical value", "Be written in different units", "Have the same dimensions", "Be dimensionless"], "answer": 2, "explanation": "If D = A + B + C, then A, B and C must all have the same dimension as D.", "hack": "PLUS and MINUS need MATCHING dimensions (Rule 1)."}, {"q": "Rule 2 of dimensional analysis says that dimensions", "options": ["Add and subtract like numbers", "Never change under any operation", "Must always cancel to zero", "Multiply and divide like algebraic quantities"], "answer": 3, "explanation": "Dimensions obey the rules of multiplication and division, e.g. [A][B]/[C].", "hack": "×/÷ combine dimensions (Rule 2): 1.5 m × 3.0 kg = 4.5 m·kg is perfectly valid."}, {"q": "Rule 3 says the argument of sin x, ln x or exp x must be", "options": ["Dimensionless", "Measured in metres", "A force", "Measured in seconds"], "answer": 0, "explanation": "In scientific equations, arguments of transcendental functions must have no dimensions.", "hack": "sin, ln, exp want a PURE NUMBER inside the bracket (Rule 3)."}, {"q": "Numbers such as ½ and π have dimensions of", "options": ["Length", "None (they are dimensionless)", "Time", "Mass"], "answer": 1, "explanation": "Pure numbers carry no dimension, so they do not change the dimension of an expression.", "hack": "Numbers are invisible to dimensions: ignore ½, 2, π, 4/3 when you check."}, {"q": "Which of these can dimensional analysis NOT determine?", "options": ["The dimension of a quantity", "Whether an equation is dimensionally consistent", "A dimensionless constant such as ½ in s = ½at²", "The powers m and n in s = k·aᵐtⁿ"], "answer": 2, "explanation": "Dimensional analysis checks dimensions and finds exponents, but it cannot supply pure numbers like ½ or k.", "hack": "Dimensional analysis gives POWERS, never the NUMBER in front."}, {"q": "When converting units, the units can be treated like", "options": ["Quantities that are always added", "Constants that never change", "Numbers that are ignored", "Algebraic quantities that can cancel"], "answer": 3, "explanation": "Units multiply, divide and cancel like algebra, so write the conversion factor so the unwanted unit cancels.", "hack": "Write the unwanted unit on the BOTTOM of the conversion factor so it cancels."}, {"q": "1 kilometre is equal to", "options": ["10³ m", "10² m", "10⁻³ m", "10⁵ m"], "answer": 0, "explanation": "From the length table, 1 km = 10³ m = 10⁵ cm.", "hack": "kilo = 1000. 1 km = 1000 m = 100 000 cm."}, {"q": "1 inch is equal to", "options": ["30.48 cm", "2.540 cm", "0.3048 cm", "25.40 cm"], "answer": 1, "explanation": "From the table, 1 inch = 2.540 cm (= 2.540 × 10⁻² m).", "hack": "Inch = 2.54 cm; foot = 30.48 cm (12 inches × 2.54)."}, {"q": "1 foot is equal to", "options": ["0.0254 m", "3.048 m", "0.3048 m", "1.609 m"], "answer": 2, "explanation": "From the table, 1 ft = 0.3048 m = 30.48 cm.", "hack": "1 ft = 0.3048 m ≈ 30 cm. 1.609 is the mile in KILOMETRES."}, {"q": "1 mile is equal to about", "options": ["0.3048 km", "2.540 km", "16.09 km", "1.609 km"], "answer": 3, "explanation": "From the length table, 1 mile = 1.609 km = 1609 m.", "hack": "Mile ≈ 1.6 km. Foot ≈ 0.3 m. Inch ≈ 2.5 cm."}, {"q": "1 slug is equal to about", "options": ["14.59 kg", "1.459 kg", "0.4536 kg", "1.660 kg"], "answer": 0, "explanation": "The mass conversion table gives 1 slug = 14.59 kg.", "hack": "Slug = 14.59 kg (bigger than 10 kg: sluggish!)."}, {"q": "1 hour is equal to", "options": ["360 s", "3600 s", "6000 s", "86 400 s"], "answer": 1, "explanation": "From the time table, 1 h = 3600 s. 86 400 s is one day.", "hack": "Hour = 60 × 60 = 3600 s. Day = 24 × 3600 = 86 400 s."}, {"q": "1 day is equal to", "options": ["3.600 × 10³ s", "8.640 × 10³ s", "8.640 × 10⁴ s", "3.156 × 10⁷ s"], "answer": 2, "explanation": "1 day = 24 h × 3600 s = 86 400 s = 8.640 × 10⁴ s. 3.156 × 10⁷ s is one year.", "hack": "Day = 86 400 s (eight-six-four-oh-oh). Year = 3.156 × 10⁷ s."}, {"q": "1 metric ton is equal to", "options": ["100 kg", "10 kg", "1 000 000 kg", "1000 kg"], "answer": 3, "explanation": "The mass table notes that 1 metric ton = 1 000 kg.", "hack": "Metric ton = 1000 kg = 10⁶ g."}, {"q": "Convert 72 km/h to m/s.", "options": ["20 m/s", "72 m/s", "259 m/s", "7.2 m/s"], "answer": 0, "explanation": "72 km/h = 72 × 1000 m ÷ 3600 s = 20 m/s.", "hack": "km/h → m/s: divide by 3.6. (72 ÷ 3.6 = 20.)"}, {"q": "Convert 3.5 km to centimetres.", "options": ["3.5 × 10³ cm", "3.5 × 10⁵ cm", "3.5 × 10⁻² cm", "3.5 × 10⁸ cm"], "answer": 1, "explanation": "1 km = 10⁵ cm, so 3.5 km = 3.5 × 10⁵ cm.", "hack": "km → cm: add FIVE zeros (10⁵). km → m is only three."}, {"q": "Convert 2 hours to seconds.", "options": ["120 s", "3600 s", "7200 s", "72 000 s"], "answer": 2, "explanation": "2 × 3600 s = 7200 s.", "hack": "hours × 3600 = seconds."}, {"q": "Which equation gives a result with the dimension of length for a car moving with acceleration a for time t from rest?", "options": ["x = ½at", "x = at³", "x = a/t²", "x = ½at²"], "answer": 3, "explanation": "[a][t²] = (L/T²)(T²) = L, so ½at² has the dimension of length. The others have dimensions L/T (½at), LT (at³) and L/T⁴ (a/t²).", "hack": "Shortcut: for length you need a·t² (the T² cancels the T² in a)."}], "tutorial": [{"q": "How many grams of copper are needed to make a hollow spherical shell of inner radius 5.70 cm and outer radius 5.75 cm? (density of copper = 8.92 g/cm³)", "options": ["184 g", "7 103 g", "138 g", "20.6 g"], "answer": 0, "explanation": "Shell volume = (4/3)π(5.75³ − 5.70³) = 20.59 cm³. Mass = ρV = 8.92 × 20.59 ≈ 184 g. Using only the outer sphere, or dropping the 4/3, gives the wrong values.", "hack": "Hollow shell = BIG sphere minus SMALL sphere. Never forget the 4/3, and multiply by density last.", "src": "Problem 1.1"}, {"q": "A hollow copper sphere has outer radius 5.75 cm and inner radius 5.70 cm. What is the volume of copper in it?", "options": ["796 cm³", "20.6 cm³", "20.6 m³", "1.84 cm³"], "answer": 1, "explanation": "V = (4/3)π(5.75³ − 5.70³) = 20.59 cm³ (the metal only, not the empty centre).", "hack": "Subtract the CUBES of the radii, not the radii themselves: r_outer³ − r_inner³.", "src": "Problem 1.1"}, {"q": "A small iron cube has edge 5.00 × 10⁻⁶ cm and density 7.86 g/cm³. What is its mass?", "options": ["3.93 × 10⁻⁵ g", "1.97 × 10⁻¹⁰ g", "9.83 × 10⁻¹⁶ g", "1.25 × 10⁻¹⁶ g"], "answer": 2, "explanation": "V = (5.00 × 10⁻⁶ cm)³ = 1.25 × 10⁻¹⁶ cm³, so m = ρV = 7.86 × 1.25 × 10⁻¹⁶ = 9.825e-16 g. Forgetting to cube the edge or to multiply by density gives the wrong answers.", "hack": "A cube means EDGE CUBED (power of 3). Power of the answer = 3 × (−6) = −18, then × 7.86 × 1.25 → 10⁻¹⁶.", "src": "Problem 1.2(a)"}, {"q": "For the same iron cube (mass 9.83 × 10⁻¹⁶ g, molar mass 55.9 g/mol), how many iron atoms does it contain?", "options": ["5.92 × 10⁸ atoms", "3.31 × 10¹⁰ atoms", "1.76 × 10⁻¹⁷ atoms", "1.06 × 10⁷ atoms"], "answer": 3, "explanation": "Number of moles = m/M = 9.825 × 10⁻¹⁶ / 55.9 = 1.76 × 10⁻¹⁷ mol. Atoms = moles × N_A = 1.76 × 10⁻¹⁷ × 6.022 × 10²³ ≈ 1.06e+07.", "hack": "Atoms = (mass ÷ molar mass) × 6.022 × 10²³. Mass ÷ M first (gives moles), THEN × N_A.", "src": "Problem 1.2(b)"}, {"q": "The radius of a circle inscribed in a triangle of sides a, b, c is r = [(s − a)(s − b)(s − c)/s]^(1/2), where s = (a + b + c)/2. Is this formula dimensionally consistent for a length r?", "options": ["Yes, the right-hand side has dimension L", "No, the right-hand side has dimension L²", "No, the right-hand side has dimension L³", "No, the right-hand side is dimensionless"], "answer": 0, "explanation": "Each of (s − a), (s − b), (s − c), s has dimension L. So the bracket is L³/L = L², and its square root is L, the same as r.", "hack": "Count lengths: three on top, one below → L². Square root halves the power → L. ✔", "src": "Problem 1.3"}, {"q": "A particle's displacement under uniform acceleration is s = k·aᵐtⁿ with k dimensionless. Which exponents make the equation dimensionally correct?", "options": ["m = 2 and n = 1", "m = 1 and n = 2", "m = 1 and n = 1", "m = 2 and n = 2"], "answer": 1, "explanation": "[aᵐtⁿ] = (L/T²)ᵐ Tⁿ = LᵐT^(n−2m). This must equal L¹T⁰, so m = 1 and n − 2m = 0, giving n = 2.", "hack": "Match powers: L power gives m. T power: n − 2m = 0, so n = 2m. Result: s ∝ a t².", "src": "Problem 1.4"}, {"q": "From the dimensional analysis of s = k·aᵐtⁿ, can this method give the numerical value of the constant k?", "options": ["Yes, it gives k = 1 exactly", "Yes, it gives k = 2 exactly", "No, it cannot give the value of a dimensionless constant", "Yes, it gives k = ½ exactly"], "answer": 2, "explanation": "Dimensional analysis fixes only the exponents. The number k (which turns out to be ½) must come from experiment or a full derivation.", "hack": "Dimensional analysis = POWERS, not NUMBERS.", "src": "Problem 1.4"}, {"q": "Hair grows at a rate of 1/32 cm per day. Express this rate in nanometres per second.", "options": ["86.8 nm/s", "36.2 nm/s", "0.00362 nm/s", "3.62 nm/s"], "answer": 3, "explanation": "1 cm = 10⁷ nm and 1 day = 86 400 s. Rate = (1/32) × 10⁷ / 86 400 = 3.62 nm/s.", "hack": "cm → nm is ×10⁷ (not 10⁸ or 10⁹). day → s is ÷86 400 (not ÷3600).", "src": "Problem 1.5"}, {"q": "Atoms in a molecule are about 0.1 nm apart. If hair grows at 3.62 nm/s, about how many atomic layers are added each second?", "options": ["About 36 layers per second", "About 3.6 layers per second", "About 360 layers per second", "About 0.36 layers per second"], "answer": 0, "explanation": "Layers per second = 3.62 nm/s ÷ 0.1 nm per layer ≈ 36 layers/s.", "hack": "Dividing by 0.1 is the same as multiplying by 10: 3.62 → 36.2.", "src": "Problem 1.5"}, {"q": "A solid piece of lead has mass 23.94 g and volume 2.10 cm³. What is the density of lead in SI units?", "options": ["11.4 kg/m³", "1.14 × 10⁴ kg/m³", "1.14 × 10⁷ kg/m³", "1.14 × 10⁻² kg/m³"], "answer": 1, "explanation": "ρ = 23.94 g / 2.10 cm³ = 11.4 g/cm³. Since 1 g/cm³ = 1000 kg/m³, ρ = 11400 kg/m³ = 1.14 × 10⁴ kg/m³.", "hack": "g/cm³ → kg/m³: multiply by 1000. (Water: 1 g/cm³ = 1000 kg/m³.)", "src": "Problem 1.6"}], "exercises": [{"q": "The mass of a solid cube is 856 g and each edge is 5.35 cm. What is the density of the solid in SI units?", "options": ["5.59 kg/m³", "5.59 × 10⁶ kg/m³", "5.59 × 10³ kg/m³", "5.59 × 10⁻³ kg/m³"], "answer": 2, "explanation": "m = 0.856 kg and V = (5.35 × 10⁻² m)³ = 1.531e-04 m³. ρ = 0.856 / 1.531e-04 = 5590 kg/m³ = 5.59 × 10³ kg/m³.", "hack": "In g/cm³ the answer is 5.59. Multiply by 1000 to get kg/m³ → 5.59 × 10³.", "src": "Example 1.1"}, {"q": "In Example 1.1 (cube of mass 856 g, edge 5.35 cm), what is the volume of the cube in SI units?", "options": ["1.53 × 10⁻⁶ m³", "1.53 × 10⁻² m³", "1.53 × 10² m³", "1.53 × 10⁻⁴ m³"], "answer": 3, "explanation": "V = (5.35 × 10⁻² m)³ = 5.35³ × 10⁻⁶ m³ = 1.531e-04 m³.", "hack": "Cube the power too: (10⁻²)³ = 10⁻⁶. Then 153 × 10⁻⁶ = 1.53 × 10⁻⁴.", "src": "Example 1.1"}, {"q": "What is the result of adding two measured lengths, 40 m + 11 cm?", "options": ["40.11 m, equal to 4011 cm", "51 cm", "40.11 cm", "4011 m"], "answer": 0, "explanation": "Convert to the same unit first: 11 cm = 0.11 m, so the sum is 40.11 m. In centimetres, 4000 cm + 11 cm = 4011 cm. Both express the same length.", "hack": "Same dimension (length) but different units: CONVERT first, then add.", "src": "Example 1.2"}, {"q": "What is the result of 1.5 m × 3.0 kg?", "options": ["4.5 kg/m", "4.5 kg·m", "4.5 m", "Impossible to evaluate"], "answer": 1, "explanation": "Rule 2: dimensions multiply, so [L] × [M] = [LM]. The product is valid: 4.5 kg·m.", "hack": "Multiplication ALWAYS works with different units. Only + and − need matching units.", "src": "Example 1.3"}, {"q": "In the frustum volume V = (h/3)(B² + Bb + b²), what is the dimension of each term inside the bracket?", "options": ["L", "L³", "L²", "Dimensionless"], "answer": 2, "explanation": "B², Bb and b² each have two lengths multiplied: L². The bracket is L² and h/3 adds L, so V has dimension L³.", "hack": "Inside the bracket: two letters multiplied, so L². Times h gives L³ = volume.", "src": "Example 1.4"}, {"q": "Is the formula V = (h/3)(B² + Bb + b²) dimensionally correct for a volume?", "options": ["No, the right side has dimension L²", "No, the right side has dimension L⁴", "No, the right side is dimensionless", "Yes, both sides have dimension L³"], "answer": 3, "explanation": "[h][B²] = L · L² = L³, and Bb and b² also give L² inside the bracket. All terms agree and equal the dimension of volume.", "hack": "Volume must come out as L³: one h (L) times a bracket of area terms (L²).", "src": "Example 1.4"}, {"q": "Check the equation x_f − x_i = v_i·t − ½at². Is it dimensionally consistent?", "options": ["Yes, every term has dimension L", "No, the last term has dimension L/T", "No, the middle term has dimension L/T", "No, the first term is dimensionless"], "answer": 0, "explanation": "x_f − x_i = L. v_i t = (L/T)(T) = L. ½at² = (L/T²)(T²) = L. All terms are lengths, so the equation is consistent.", "hack": "Test each term separately. All three must reduce to L. The ½ is ignored.", "src": "Example 1.5"}, {"q": "What is the dimension of the term ½at² in x_f − x_i = v_i t − ½at²?", "options": ["L/T", "L", "L/T²", "T²"], "answer": 1, "explanation": "[½at²] = (L/T²) × T² = L. The ½ is dimensionless.", "hack": "a·t² = (L/T²)·T² → the T² cancel, leaving L.", "src": "Example 1.5"}, {"q": "What is the result of 1.5 m − 3.0 kg·m/s?", "options": ["−1.5 m", "−1.5 kg·m²", "Impossible to evaluate (dimensionally invalid)", "−1.5 kg"], "answer": 2, "explanation": "1.5 m has dimension L but 3.0 kg·m/s has dimension ML/T. By Rule 1, quantities of different dimensions cannot be subtracted.", "hack": "Subtraction needs the SAME units on both sides. Different units = invalid, no answer.", "src": "Exercise 1.1"}, {"q": "Is the equation mgh = mc²/(1 − (v/c)²) − mc² dimensionally consistent? (m is mass, g acceleration, c velocity, h length)", "options": ["No, mgh has dimension ML/T²", "No, mc² has dimension ML/T", "No, (v/c)² has dimension T²", "Yes, every term has dimension ML²/T²"], "answer": 3, "explanation": "[mgh] = M(L/T²)(L) = ML²/T². [mc²] = M(L/T)² = ML²/T². v/c is dimensionless, so (v/c)² and the '1 −' are fine. All terms agree.", "hack": "v/c = velocity ÷ velocity = dimensionless, so the bracket is a plain number. Then compare mgh with mc².", "src": "Exercise 1.2"}, {"q": "What is the dimension of the energy term mgh used in Exercise 1.2?", "options": ["M·L²/T²", "M·L/T²", "M·L²/T", "M·L/T"], "answer": 0, "explanation": "mgh = (mass)(acceleration)(length) = M · (L/T²) · L = ML²/T², the dimension of energy.", "hack": "Energy = force × distance = (ML/T²) × L = ML²/T².", "src": "Exercise 1.2"}, {"q": "In m·v²/r = G·Mm/r², where m and M are masses, r is a radius and v a velocity, what are the dimensions of G?", "options": ["L²/(M·T²)", "L³/(M·T²)", "M·L/T²", "L/(M·T)"], "answer": 1, "explanation": "Left side: m v²/r = M(L²/T²)/L = ML/T². Right side: G·M²/L². So [G] = (ML/T²)(L²)/(M²) = L³/(MT²).", "hack": "Solve for G: G = v² r / M. Dimension: (L²/T²)(L)/M = L³/(M T²).", "src": "Exercise 1.3"}, {"q": "Is x = (4/3)ut / (1 − 2gt²/x) dimensionally valid? (x length, u velocity, g acceleration)", "options": ["No, it is dimensionally invalid", "Valid only if t = 1 s", "Yes, it is dimensionally valid", "Cannot be decided"], "answer": 2, "explanation": "ut has dimension (L/T)(T) = L, so the numerator is a length. gt²/x = (L/T²)(T²)/L is dimensionless, so '1 − 2gt²/x' is fine. The right side is L, matching x.", "hack": "Hunt for the '1 −' trap: whatever is subtracted from 1 must be dimensionless. Here gt²/x cancels fully. ✔", "src": "Exercise 1.4(a)"}, {"q": "Is x = vt / (1 − mgt²) dimensionally valid? (x length, v velocity, m mass, g acceleration)", "options": ["Yes, it is dimensionally valid", "Valid only if m = 1 kg", "Valid for any value of t", "No, it is dimensionally invalid"], "answer": 3, "explanation": "mgt² has dimension M·(L/T²)·T² = ML, not dimensionless. It cannot be subtracted from the pure number 1, so the equation is invalid.", "hack": "'1 − (something)' demands (something) = pure number. mgt² keeps M·L left over → ✘.", "src": "Exercise 1.4(b)"}]}, {"chapter": 2, "title": "Kinematics: Displacement, Time and Velocity", "concept": [{"q": "Kinematics is the branch of classical mechanics that describes motion", "options": ["Only when the forces acting are known", "Only for bodies that remain at rest", "Without considering the causes of the motion", "By studying only the masses involved"], "answer": 2, "explanation": "Kinematics describes how bodies move (position, velocity, acceleration) without asking what force causes the motion.", "hack": "KINEMATICS = 'KINE' = movement only. No forces allowed. If the question mentions 'cause' or 'force', that is dynamics."}, {"q": "Kinematics is often referred to as the", "options": ["Chemistry of motion", "Arithmetic of forces", "Algebra of energy", "Geometry of motion"], "answer": 3, "explanation": "Because it describes motion using positions and paths only, it is called the 'geometry of motion'.", "hack": "KINEMATICS = GEOMETRY (shapes and paths, no forces)."}, {"q": "The study of the causes of motion is called", "options": ["Dynamics", "Kinematics", "Statics", "Optics"], "answer": 0, "explanation": "Dynamics studies the causes of motion (forces); kinematics studies the motion itself.", "hack": "DYNAMICS = 'dynamite' = forces that cause things to move. KINEMATICS = just the movement."}, {"q": "The study of motion itself, without concern for its cause, is called", "options": ["Dynamics", "Kinematics", "Thermodynamics", "Electrostatics"], "answer": 1, "explanation": "That is the definition of kinematics.", "hack": "No cause, no force = kinematics."}, {"q": "Classical mechanics, in the notes, is the study of the motion of bodies, including", "options": ["Only bodies moving at the speed of light", "Only bodies moving in a circle", "The special case in which the bodies remain at rest", "Only bodies that have no mass"], "answer": 2, "explanation": "A body at rest is treated as a special case of motion with zero velocity.", "hack": "Rest = special case of motion (velocity = 0). Not a separate subject."}, {"q": "Newton's Philosophiae Naturalis Principia Mathematica, the Principia, appeared in", "options": ["1911", "1887", "1967", "1687"], "answer": 3, "explanation": "The notes link classical mechanics to the principles first set out by Sir Isaac Newton in the Principia (1687).", "hack": "Newton = 1687 (3 digits like 'six-eight-seven'). Do not mix with 1887 (standard kg) or 1911 (nucleus)."}, {"q": "In a plane, the Cartesian coordinates of a point are written as", "options": ["(x, y)", "(r, θ)", "(v, a)", "(m, t)"], "answer": 0, "explanation": "Cartesian coordinates use x and y; polar coordinates use r and θ.", "hack": "Cartesian = x, y. Polar = r, θ ('r' for radius, θ for angle)."}, {"q": "Polar coordinates of a point are written using", "options": ["x and y", "r and θ", "x and r", "y and θ"], "answer": 1, "explanation": "r is the distance from the origin and θ is the angle from the x-axis.", "hack": "Polar = distance + angle = r and θ."}, {"q": "Converting from polar to Cartesian coordinates, x equals", "options": ["r sin θ", "r tan θ", "r cos θ", "r / cos θ"], "answer": 2, "explanation": "From the right-angled triangle, adjacent = hypotenuse × cos θ, so x = r cos θ.", "hack": "x goes with cos, y goes with sin. Horizontal side = adjacent = cos."}, {"q": "Converting from polar to Cartesian coordinates, y equals", "options": ["r cos θ", "r tan θ", "r / sin θ", "r sin θ"], "answer": 3, "explanation": "Opposite = hypotenuse × sin θ, so y = r sin θ.", "hack": "y = r sin θ. (Think: y is the 'opposite' side, and SOH says sin = opposite/hypotenuse.)"}, {"q": "Which relation connects x, y and r?", "options": ["r² = x² + y²", "r = x + y", "r² = x² − y²", "r = x² + y²"], "answer": 0, "explanation": "It is Pythagoras' theorem for the right-angled triangle formed by x, y and r.", "hack": "Pythagoras: hypotenuse² = sum of squares. r is the hypotenuse."}, {"q": "The angle θ of a point (x, y) from the x-axis satisfies", "options": ["tan θ = x/y", "tan θ = y/x", "sin θ = y/x", "cos θ = y/x"], "answer": 1, "explanation": "tan θ = opposite/adjacent = y/x.", "hack": "TOA: Tan = Opposite/Adjacent = y over x."}, {"q": "In SOH-CAH-TOA, sin θ equals", "options": ["Adjacent / hypotenuse", "Opposite / adjacent", "Opposite / hypotenuse", "Hypotenuse / opposite"], "answer": 2, "explanation": "SOH: Sine = Opposite over Hypotenuse.", "hack": "SOH-CAH-TOA: S-O-H = Sin Opposite Hypotenuse."}, {"q": "In SOH-CAH-TOA, cos θ equals", "options": ["Opposite / hypotenuse", "Opposite / adjacent", "Adjacent / opposite", "Adjacent / hypotenuse"], "answer": 3, "explanation": "CAH: Cosine = Adjacent over Hypotenuse.", "hack": "C-A-H = Cos Adjacent Hypotenuse."}, {"q": "In SOH-CAH-TOA, tan θ equals", "options": ["Opposite / adjacent", "Adjacent / opposite", "Opposite / hypotenuse", "Adjacent / hypotenuse"], "answer": 0, "explanation": "TOA: Tangent = Opposite over Adjacent.", "hack": "T-O-A = Tan Opposite Adjacent."}, {"q": "Displacement is defined as the", "options": ["Total length of the path travelled", "Change in position of an object", "Rate of change of velocity", "Distance divided by time"], "answer": 1, "explanation": "Displacement depends only on where the object starts and ends, not on the route taken.", "hack": "DISPLACEMENT = DIFFERENCE in position (final minus initial). Path length is a different thing."}, {"q": "In one dimension, displacement is written as", "options": ["Δx = x_i − x_f", "Δx = x_f + x_i", "Δx = x_f − x_i", "Δx = x_f / x_i"], "answer": 2, "explanation": "Displacement = final position minus initial position.", "hack": "'Final minus initial': FINAL comes first, always."}, {"q": "If the displacement x(t) of a body is positive, the body is", "options": ["To the left of the chosen origin", "Exactly at the origin", "Moving with zero velocity", "To the right of the chosen origin"], "answer": 3, "explanation": "Positive displacement means the body lies to the right of the origin; negative means to the left.", "hack": "Positive = RIGHT, negative = LEFT (like the number line)."}, {"q": "If the displacement x(t) of a body is negative, the body is", "options": ["To the left of the chosen origin", "To the right of the chosen origin", "Exactly at the origin", "Always moving to the left"], "answer": 0, "explanation": "A negative sign only says the body is on the left of the origin at that time, not how it is moving.", "hack": "Negative position is only about WHERE, not about how fast or which way it moves."}, {"q": "Motion can take place in", "options": ["One dimension only", "One, two or three dimensions", "Two dimensions only", "Four dimensions only"], "answer": 1, "explanation": "The notes say motion can be 1-D, 2-D or 3-D.", "hack": "1-D, 2-D, 3-D. This chapter works mostly in 1-D (a straight line)."}, {"q": "Average speed is defined as", "options": ["Displacement divided by elapsed time", "Change of velocity divided by time", "Total path length divided by elapsed time", "Final position divided by time"], "answer": 2, "explanation": "Average speed = path length / elapsed time (Eq. 2.6).", "hack": "SPEED uses the PATH (how far you actually travelled). VELOCITY uses DISPLACEMENT."}, {"q": "Average velocity is defined as", "options": ["Path length divided by elapsed time", "Change of speed divided by time", "Distance multiplied by time", "Displacement divided by elapsed time"], "answer": 3, "explanation": "Average velocity = Δx / Δt = (x_f − x_i)/(t_f − t_i).", "hack": "Velocity = displacement ÷ time. 'V for Vector, D for Displacement.'"}, {"q": "Average velocity is calculated using", "options": ["(x_f − x_i)/(t_f − t_i)", "(x_f + x_i)/(t_f + t_i)", "(t_f − t_i)/(x_f − x_i)", "(x_f − x_i) × (t_f − t_i)"], "answer": 0, "explanation": "Eq. 2.8: v̄ = Δx/Δt = (x_f − x_i)/(t_f − t_i).", "hack": "Change in x over change in t. Position on top, time below."}, {"q": "Which statement about speed and velocity in one dimension is correct?", "options": ["Average velocity is always positive, while average speed can be negative", "Average speed is always positive, while average velocity can be positive or negative", "Both are always negative", "Both are always zero"], "answer": 1, "explanation": "In one dimension the sign of velocity shows direction; speed has no direction so it is never negative.", "hack": "SPEED never negative. VELOCITY can be negative (it carries direction)."}, {"q": "The formula d = vt (distance = speed × time) should be used only", "options": ["When the body is at rest", "When the acceleration is large", "When the speed stays constant, or over small time intervals", "When the displacement is negative"], "answer": 2, "explanation": "Real speeds change from time to time, so d = vt works only for constant (or average) speed over a short interval.", "hack": "d = vt needs CONSTANT speed. If speed changes, use the constant-acceleration equations."}, {"q": "A body that has a large acceleration can, at a given instant, be", "options": ["Moving at infinite speed", "Always moving in the direction of its acceleration", "Unable to have any displacement", "Standing still"], "answer": 3, "explanation": "Position, velocity and acceleration are independent. A ball at the top of its path has zero velocity but non-zero acceleration.", "hack": "TRICK: 'v = 0' does NOT mean 'a = 0'. Top of a throw: v = 0, a ≠ 0."}, {"q": "According to the notes, position, velocity and acceleration are", "options": ["Independent quantities", "Always equal to each other", "Always opposite in direction", "The same quantity in different units"], "answer": 0, "explanation": "Specifying one of them does not specify the others.", "hack": "Three INDEPENDENT quantities: knowing one tells you nothing about the others."}, {"q": "A body moves with constant speed v from x = 0 at t = 0. Its position at time t is", "options": ["x = v/t", "x = vt", "x = ½vt²", "x = v + t"], "answer": 1, "explanation": "Constant speed means x increases linearly with time: x = vt.", "hack": "Linear graph of x against t = constant speed."}, {"q": "A body at position x₀ at t = 0 moves with constant speed v. Its position at time t is", "options": ["x = x₀ − vt always", "x = x₀ vt", "x = x₀ + vt", "x = vt²"], "answer": 2, "explanation": "Start from the initial position and add the displacement vt.", "hack": "New position = old position + v·t."}, {"q": "Acceleration is defined as", "options": ["The change of an object's position per unit time", "The total distance travelled", "The speed at the start", "The change of an object's velocity per unit time"], "answer": 3, "explanation": "ā = Δv/Δt = (v_f − v_i)/(t_f − t_i).", "hack": "Speed-up rate. Velocity change per second: m/s per s = m/s²."}, {"q": "Average acceleration is calculated using", "options": ["(v_f − v_i)/(t_f − t_i)", "(x_f − x_i)/(t_f − t_i)", "(v_f + v_i)/(t_f + t_i)", "(t_f − t_i)/(v_f − v_i)"], "answer": 0, "explanation": "Eq. 2.9: ā = Δv/Δt.", "hack": "Same pattern as velocity, but with v on top instead of x."}, {"q": "Negative acceleration is called", "options": ["Displacement", "Deceleration", "Inertia", "Free fall"], "answer": 1, "explanation": "The notes call negative acceleration deceleration.", "hack": "NEGATIVE a = DECELERATION (as the notes name it). A sign only; check the direction of v."}, {"q": "The speed of a decelerating body", "options": ["Increases with time", "Stays constant", "Decreases with time", "Is always zero"], "answer": 2, "explanation": "Deceleration means the body is slowing down.", "hack": "Decelerating = slowing down."}, {"q": "For constant acceleration and a body starting from rest at t = 0, the velocity at time t is", "options": ["v = a/t", "v = ½at²", "v = a + t", "v = at"], "answer": 3, "explanation": "Velocity increases linearly with time: v ∝ t, v = at.", "hack": "From rest: initial speed is zero, so v = v₀ + at becomes v = at."}, {"q": "A body with speed v₀ at t = 0 and constant acceleration a has velocity at time t", "options": ["v = v₀ + at", "v = v₀ − at always", "v = v₀at", "v = v₀ + ½at²"], "answer": 0, "explanation": "Start with v₀ and add the velocity gained, at.", "hack": "Memorise this as: 'Final = Initial + (a × t)'."}, {"q": "Instantaneous acceleration is defined as", "options": ["lim (Δx/Δt) as Δt → ∞", "lim (Δv/Δt) as Δt → 0", "Δv × Δt", "Δx/Δv"], "answer": 1, "explanation": "Take the time interval smaller and smaller so the average becomes the acceleration at one instant: a = dv/dt.", "hack": "INSTANTANEOUS = LIMIT with Δt → 0."}, {"q": "For constant acceleration, the average velocity can be written as", "options": ["(v₀ − v)/2", "v₀ × v", "(v₀ + v)/2", "v₀ + v"], "answer": 2, "explanation": "With uniform acceleration the average velocity is the mean of the starting and final velocities (Eq. 2.12).", "hack": "Average of start and finish ONLY works for constant acceleration."}, {"q": "Which equation links v, v₀, a and displacement without involving time?", "options": ["v = v₀ + at", "Δx = v₀t + ½at²", "Δx = (v₀ + v)t", "v² = v₀² + 2aΔx"], "answer": 3, "explanation": "v² = v₀² + 2aΔx has no t in it.", "hack": "NO TIME GIVEN? Use v² = v₀² + 2aΔx."}, {"q": "Which equation links displacement, v₀, a and time but NOT the final velocity?", "options": ["Δx = v₀t + ½at²", "v² = v₀² + 2aΔx", "v = v₀ + at", "v = (v₀ + v)/2"], "answer": 0, "explanation": "Δx = v₀t + ½at² contains no v.", "hack": "NO FINAL VELOCITY? Use Δx = v₀t + ½at²."}, {"q": "Which equation links v, v₀, a and time but NOT displacement?", "options": ["v² = v₀² + 2aΔx", "v = v₀ + at", "Δx = v₀t + ½at²", "Δx = ½(v₀ + v)"], "answer": 1, "explanation": "v = v₀ + at contains no displacement.", "hack": "NO DISTANCE? Use v = v₀ + at."}, {"q": "A vector is a quantity that has", "options": ["Size only", "Direction only", "Both size and direction", "Neither size nor direction"], "answer": 2, "explanation": "A vector has a magnitude and a direction.", "hack": "VECTOR = size + direction. e.g. velocity, displacement, acceleration."}, {"q": "Which of these is a vector, according to the notes' wind example?", "options": ["Mass of the air", "Time of the day", "Temperature of the air", "Wind velocity"], "answer": 3, "explanation": "Wind blows with some speed AND in some direction, so wind velocity is a vector.", "hack": "If you can say 'towards the north', it is a vector."}, {"q": "For a vector r = (x, y), the x-component is", "options": ["r cos θ", "r sin θ", "r tan θ", "r / cos θ"], "answer": 0, "explanation": "r_x = x = r cos θ and r_y = y = r sin θ.", "hack": "Horizontal = cos, vertical = sin (when θ is measured from the x-axis)."}, {"q": "A car starts from rest and accelerates uniformly at 2 m/s² for 6 s. What is its final speed?", "options": ["3 m/s", "12 m/s", "24 m/s", "8 m/s"], "answer": 1, "explanation": "v = at = 2 × 6 = 12 m/s.", "hack": "From rest: v = a·t. Just multiply."}, {"q": "A body moving at 5 m/s accelerates at 3 m/s² for 4 s. What is its final velocity?", "options": ["12 m/s", "9 m/s", "17 m/s", "32 m/s"], "answer": 2, "explanation": "v = v₀ + at = 5 + 3 × 4 = 17 m/s.", "hack": "Do not forget the starting 5: Final = Initial + at."}, {"q": "A cyclist moving at 10 m/s decelerates at 2 m/s² for 3 s. What is his final speed?", "options": ["16 m/s", "6 m/s", "−4 m/s", "4 m/s"], "answer": 3, "explanation": "v = v₀ + at = 10 + (−2)(3) = 4 m/s.", "hack": "Deceleration → put a MINUS in front of a."}, {"q": "A body starts from rest and accelerates at 4 m/s² for 5 s. What distance does it cover?", "options": ["50 m", "20 m", "100 m", "25 m"], "answer": 0, "explanation": "Δx = v₀t + ½at² = 0 + ½ × 4 × 25 = 50 m.", "hack": "From rest: distance = ½at². Square the time FIRST (5² = 25), then × ½ × a."}, {"q": "A body with initial speed 3 m/s accelerates at 2 m/s² for 4 s. What distance does it cover?", "options": ["12 m", "28 m", "16 m", "44 m"], "answer": 1, "explanation": "Δx = v₀t + ½at² = 3 × 4 + ½ × 2 × 16 = 12 + 16 = 28 m.", "hack": "Two pieces: 12 m (from the starting speed) + 16 m (from acceleration) = 28 m."}, {"q": "A body starts from rest and accelerates uniformly at 5 m/s² over a distance of 40 m. What is its final speed?", "options": ["400 m/s", "10 m/s", "20 m/s", "200 m/s"], "answer": 2, "explanation": "v² = v₀² + 2aΔx = 0 + 2 × 5 × 40 = 400, so v = 20 m/s.", "hack": "No time given → v² = 2aΔx. Don't forget the final square root."}, {"q": "A runner moves from x = 10 m to x = 70 m in 20 s. What is the average velocity?", "options": ["3.5 m/s", "4 m/s", "60 m/s", "3 m/s"], "answer": 3, "explanation": "v̄ = Δx/Δt = (70 − 10)/20 = 3 m/s.", "hack": "Subtract the positions first (70 − 10 = 60 m), then ÷ 20 s."}, {"q": "A body moves from x = 50 m to x = 20 m in 6 s. What is its average velocity?", "options": ["−5 m/s", "+5 m/s", "−30 m/s", "+8.3 m/s"], "answer": 0, "explanation": "v̄ = (20 − 50)/6 = −30/6 = −5 m/s. The minus sign shows motion towards decreasing x.", "hack": "Final minus initial = (20 − 50) = −30. Negative result = moving left."}, {"q": "A runner runs 100 m out and 100 m back to the start in 40 s. Which pair gives the average speed and the average velocity?", "options": ["0 m/s and 5 m/s", "5 m/s and 0 m/s", "5 m/s and 5 m/s", "2.5 m/s and 0 m/s"], "answer": 1, "explanation": "Path length = 200 m, so average speed = 200/40 = 5 m/s. Displacement = 0 (back at start), so average velocity = 0.", "hack": "Round trip = displacement 0, so average VELOCITY = 0 but average SPEED is not."}, {"q": "The polar coordinates of the point (x, y) = (3, 4) m are", "options": ["r = 7 m, θ = 53.1°", "r = 5 m, θ = 36.9°", "r = 5 m, θ = 53.1°", "r = 25 m, θ = 53.1°"], "answer": 2, "explanation": "r = √(3² + 4²) = 5 m. tan θ = 4/3 so θ = 53.1°.", "hack": "3-4-5 triangle. θ = tan⁻¹(y/x) = tan⁻¹(4/3)."}, {"q": "A point has polar coordinates r = 10 m and θ = 30°. What are its Cartesian coordinates (x, y)?", "options": ["(5.00 m, 8.66 m)", "(10 m, 30 m)", "(3.00 m, 10 m)", "(8.66 m, 5.00 m)"], "answer": 3, "explanation": "x = 10 cos 30° = 8.66 m and y = 10 sin 30° = 5.00 m.", "hack": "30° → sin 30° = 0.5 and cos 30° = 0.866. x is the big one."}, {"q": "A car going at 20 m/s brakes uniformly at 5 m/s² to rest. How long does it take to stop?", "options": ["4 s", "100 s", "0.25 s", "15 s"], "answer": 0, "explanation": "From v = v₀ + at: 0 = 20 − 5t, so t = 4 s.", "hack": "Final speed 0 → t = v₀ ÷ a (ignore the sign)."}, {"q": "A car increases its speed from 10 m/s to 30 m/s in 5 s. What is its average acceleration?", "options": ["8 m/s²", "4 m/s²", "40 m/s²", "2 m/s²"], "answer": 1, "explanation": "a = Δv/Δt = (30 − 10)/5 = 4 m/s².", "hack": "Change in speed first (20), then ÷ time (5)."}, {"q": "A body's speed rises uniformly from 4 m/s to 10 m/s. What is its average velocity over this time?", "options": ["14 m/s", "6 m/s", "7 m/s", "40 m/s"], "answer": 2, "explanation": "v̄ = (v₀ + v)/2 = (4 + 10)/2 = 7 m/s.", "hack": "Uniform change → average = midpoint of the two velocities."}, {"q": "What are the SI units of acceleration?", "options": ["m/s", "m·s²", "s/m²", "m/s²"], "answer": 3, "explanation": "Acceleration is (m/s) per second = m/s².", "hack": "Velocity m/s, acceleration m/s²: each 'per second' adds one more s underneath."}], "tutorial": [{"q": "A train starts at rest, accelerates uniformly at a for 5 minutes, runs at constant speed for 5 minutes, then decelerates at the same rate a to rest in 5 minutes. It travels 10 km in all. Find a.", "options": ["0.0556 m/s²", "0.111 m/s²", "0.0333 m/s²", "0.556 m/s²"], "answer": 0, "explanation": "t = 300 s each. Phase 1: ½a(300)² = 45 000a. Phase 2: (300a)(300) = 90 000a. Phase 3: 45 000a. Total = 180 000a = 10 000 m, so a = 0.0556 m/s².", "hack": "Convert first: 5 min = 300 s, 10 km = 10 000 m. Three pieces: 45 000a + 90 000a + 45 000a = 180 000a.", "src": "Problem 2.1"}, {"q": "For the train in Problem 2.1 (a = 0.0556 m/s²), what is its constant cruising speed?", "options": ["8.33 m/s", "16.7 m/s", "33.3 m/s", "0.0556 m/s"], "answer": 1, "explanation": "v = at = 0.0556 × 300 = 16.7 m/s (about 60 km/h).", "hack": "Cruising speed = a × time of acceleration = 0.0556 × 300.", "src": "Problem 2.1"}, {"q": "A ball is dropped from a height of 10 m. At the same moment another ball is thrown vertically upwards from the ground at 10 m/s. After how many seconds do they meet?", "options": ["0.5 s", "2.0 s", "1.0 s", "1.43 s"], "answer": 2, "explanation": "Both balls feel the same gravity, so only the relative motion matters: the gap of 10 m closes at 10 m/s, giving t = 10/10 = 1.0 s. (Check: 10 − 4.9t² = 10t − 4.9t² gives t = 1.)", "hack": "Same g on both balls cancels out. Closing speed = 0 + 10 = 10 m/s, gap = 10 m → t = 1 s.", "src": "Problem 2.2"}, {"q": "A ball is dropped from a height of 10 m. At the same moment another ball is thrown upwards from the ground at 10 m/s. How high above the ground do they collide? (g = 9.8 m/s²)", "options": ["5.0 m", "4.9 m", "10 m", "5.1 m"], "answer": 3, "explanation": "They meet at t = 1.0 s. Height of the thrown ball: 10(1) − ½(9.8)(1)² = 5.1 m. The dropped ball: 10 − 4.9 = 5.1 m, which agrees.", "hack": "Find t = 1 s first, then put it into EITHER ball's equation. Dropped ball: 10 − 4.9 = 5.1.", "src": "Problem 2.2"}, {"q": "Which method finds the resultant of two velocity vectors?", "options": ["Add the vectors, using components or the parallelogram/triangle rule", "Add only their magnitudes as plain numbers", "Multiply the two magnitudes together", "Subtract the smaller magnitude from the bigger"], "answer": 0, "explanation": "Velocities are vectors, so they add by direction as well as size. Break each into x and y components, add components, then use R = √(Rx² + Ry²).", "hack": "Vectors add by COMPONENTS, never by just adding the sizes (unless they point the same way).", "src": "Problem 2.3"}, {"q": "After finding the components Rx and Ry of the resultant of two velocity vectors, the angle the resultant makes with the x-axis is", "options": ["θ = tan⁻¹(Rx/Ry)", "θ = tan⁻¹(Ry/Rx)", "θ = sin⁻¹(Rx·Ry)", "θ = cos⁻¹(Rx + Ry)"], "answer": 1, "explanation": "tan θ = opposite/adjacent = Ry/Rx. Then take the inverse tangent.", "hack": "TOA again: tan θ = y ÷ x. Use the calculator's tan⁻¹.", "src": "Problem 2.3"}, {"q": "The magnitude of the resultant of two perpendicular velocity vectors of 3 m/s and 4 m/s is", "options": ["7 m/s", "1 m/s", "5 m/s", "12 m/s"], "answer": 2, "explanation": "R = √(3² + 4²) = 5 m/s.", "hack": "Perpendicular vectors → Pythagoras (3-4-5). Not 3 + 4.", "src": "Problem 2.3"}], "exercises": [{"q": "The Cartesian coordinates of a point in the xy-plane are (3.50 m, 2.50 m). What is the distance r of the point from the origin?", "options": ["6.00 m", "18.5 m", "3.00 m", "4.30 m"], "answer": 3, "explanation": "r = √(x² + y²) = √(12.25 + 6.25) = √18.5 = 4.30 m. Choosing 18.5 forgets the square root.", "hack": "Square, add, then SQUARE ROOT. If you land on 18.5, you stopped one step early.", "src": "Example 2.1"}, {"q": "For the point (3.50 m, 2.50 m), what is the polar angle θ measured from the x-axis?", "options": ["35.5°", "54.5°", "45.0°", "0.714°"], "answer": 0, "explanation": "tan θ = y/x = 2.5/3.5 = 0.714, so θ = tan⁻¹(0.714) = 35.5°. 0.714 is the tangent, not the angle.", "hack": "Take tan⁻¹ of y/x. 0.714 is only the ratio. The angle is under 45° because y < x.", "src": "Example 2.1"}, {"q": "An airplane accelerates down a runway at 3.20 m/s² for 32.8 s before lifting off. What distance does it travel before take-off?", "options": ["105 m", "1720 m", "860 m", "3440 m"], "answer": 1, "explanation": "Starting from rest, d = v_i·t + ½at² = 0 + ½(3.20)(32.8)² = 1721 m, i.e. about 1720 m.", "hack": "From rest: d = ½at². Square the time FIRST: 32.8² = 1076.", "src": "Example 2.2"}, {"q": "A car starts from rest and accelerates uniformly for 5.21 s over a distance of 110 m. What is its acceleration?", "options": ["21.1 m/s²", "4.05 m/s²", "8.10 m/s²", "10.1 m/s²"], "answer": 2, "explanation": "d = ½at² gives a = 2d/t² = 220/27.14 = 8.10 m/s². Using a = d/t² forgets the factor 2.", "hack": "Rearrange d = ½at² → a = 2d/t². Don't forget the 2 on top.", "src": "Example 2.3"}, {"q": "A race car accelerates uniformly from 18.5 m/s to 46.1 m/s in 2.47 s. What is its acceleration?", "options": ["27.6 m/s²", "22.4 m/s²", "5.60 m/s²", "11.2 m/s²"], "answer": 3, "explanation": "a = Δv/Δt = (46.1 − 18.5)/2.47 = 27.6/2.47 = 11.2 m/s².", "hack": "Subtract speeds FIRST (46.1 − 18.5 = 27.6) then ÷ time.", "src": "Example 2.4"}, {"q": "The race car in Example 2.4 goes from 18.5 m/s to 46.1 m/s in 2.47 s. What distance does it cover?", "options": ["79.8 m", "114 m", "39.9 m", "159.6 m"], "answer": 0, "explanation": "With uniform acceleration, d = ½(v_i + v_f)t = ½(18.5 + 46.1)(2.47) = 79.8 m.", "hack": "Average speed (32.3 m/s) × time (2.47 s). Average speed = midpoint of the two speeds.", "src": "Example 2.4"}, {"q": "A bullet moving at 367 m/s embeds in clay and stops after penetrating 0.0621 m. What is its acceleration, assuming uniform acceleration?", "options": ["+1.08 × 10⁶ m/s²", "−1.08 × 10⁶ m/s²", "−2.17 × 10⁶ m/s²", "−5.4 × 10⁵ m/s²"], "answer": 1, "explanation": "v² = u² + 2ad with v = 0: a = −u²/(2d) = −134 689/0.1242 = -1.084e+06 m/s². The minus sign shows the bullet slows down.", "hack": "Final speed 0 → a = −u²/(2d). Don't forget the 2 and the negative sign.", "src": "Example 2.8"}, {"q": "What does the negative sign in the bullet's acceleration (−1.08 × 10⁶ m/s²) show?", "options": ["The bullet speeds up", "The bullet moves backwards", "The bullet slows down", "The bullet has no mass"], "answer": 2, "explanation": "A negative acceleration, here opposite to the motion, means the speed decreases (deceleration).", "hack": "Minus on 'a' while v is positive = slowing down.", "src": "Example 2.8"}, {"q": "A car travelling at 22.4 m/s skids to a stop in 2.55 s. Assuming uniform acceleration, what is its skidding distance?", "options": ["57.1 m", "8.78 m", "14.3 m", "28.6 m"], "answer": 3, "explanation": "d = ½(v_i + v_f)t = ½(22.4 + 0)(2.55) = 28.6 m. (Using d = v·t = 57.1 m wrongly ignores the slowing down.)", "hack": "Average speed when slowing to zero = HALF the starting speed. 22.4/2 × 2.55.", "src": "Example 2.9"}, {"q": "With what speed in m/s must an object be thrown upward to reach a height of 91.5 m? (Take g = 9.8 m/s², no air resistance.)", "options": ["42.3 m/s", "1790 m/s", "21.2 m/s", "896 m/s"], "answer": 0, "explanation": "At the top v = 0, so 0 = u² + 2(−9.8)(91.5), giving u² = 1793.4 and u = 42.3 m/s. Forgetting the final square root gives 1790.", "hack": "u = √(2gh). Always finish with the square root. Check size: 1790 m/s is a rocket, not a throw.", "src": "Example 2.10"}, {"q": "Using 1 m/s = 2.23 mi/hr, what is a throwing speed of 42.3 m/s in miles per hour?", "options": ["19.0 mi/hr", "94.4 mi/hr", "42.3 mi/hr", "9.44 mi/hr"], "answer": 1, "explanation": "42.3 × 2.23 = 94.3 mi/hr.", "hack": "m/s → mi/hr: MULTIPLY by 2.23 (miles/hour numbers are bigger than m/s).", "src": "Example 2.10"}, {"q": "Michael Jordan has a vertical leap of 1.29 m. What is his take-off speed? (g = 9.8 m/s²)", "options": ["25.3 m/s", "2.52 m/s", "5.03 m/s", "12.6 m/s"], "answer": 2, "explanation": "At the peak v = 0, so u² = 2gh = 2(9.8)(1.29) = 25.28 and u = 5.03 m/s. 25.3 is u², not u.", "hack": "u = √(2gh) again. If your answer is 25.3, you forgot the square root.", "src": "Example 2.11"}, {"q": "Michael Jordan leaps with take-off speed 5.03 m/s. What is his total hang time (up and back down)? (g = 9.8 m/s²)", "options": ["0.513 s", "2.06 s", "0.257 s", "1.03 s"], "answer": 3, "explanation": "Time to peak = u/g = 5.03/9.8 = 0.513 s. Hang time = 2 × 0.513 = 1.03 s.", "hack": "Up time = down time. Total = 2 × (u/g). 0.513 is only half of the story.", "src": "Example 2.11"}]}, {"chapter": 3, "title": "Motion in One Dimension", "concept": [{"q": "The location of a particle moving along a line is specified by its", "options": ["Acceleration, a", "Mass, m", "Momentum, p", "Coordinate, x or y"], "answer": 3, "explanation": "The particle's position is given by its coordinate (x or y), which changes with time as it moves.", "hack": "WHERE = coordinate x(t). It is the starting point of every kinematics question."}, {"q": "The displacement of a particle that moves from x₁ to x₂ is", "options": ["Δx = x₂ − x₁", "Δx = x₁ − x₂", "Δx = x₂ + x₁", "Δx = x₂ / x₁"], "answer": 0, "explanation": "Displacement is the change in position: final minus initial.", "hack": "Always 'LAST minus FIRST': x₂ − x₁."}, {"q": "The average speed of a particle is defined as the", "options": ["Displacement per total time taken", "Total distance travelled per total time taken", "Change of velocity per time", "Final position per time"], "answer": 1, "explanation": "Average speed = total distance travelled divided by total time.", "hack": "SPEED → DISTANCE. VELOCITY → DISPLACEMENT."}, {"q": "A particle has displacement Δx in time Δt. Its average velocity is", "options": ["Δt/Δx", "Δx × Δt", "Δx/Δt", "Δx + Δt"], "answer": 2, "explanation": "Average velocity = displacement ÷ time interval, v̄ = Δx/Δt = (x₂ − x₁)/(t₂ − t₁).", "hack": "v̄ = Δx/Δt: position change on top, time change below."}, {"q": "Speed is described in the notes as a", "options": ["Force divided by mass", "Mass divided by volume", "Energy divided by distance", "Rate: distance divided by time"], "answer": 3, "explanation": "Speed is a rate, something (distance) divided by time.", "hack": "SPEED = a RATE = per time. 'm per s'."}, {"q": "The SI unit of speed is", "options": ["m/s", "m·s", "m/s²", "s/m"], "answer": 0, "explanation": "Distance (m) divided by time (s).", "hack": "Speed m/s; acceleration m/s² (extra 's' under the line)."}, {"q": "Which statement about speed and velocity is correct?", "options": ["Speed is a vector, while velocity is a scalar", "Speed is a scalar, while velocity is a vector", "Both are scalars", "Both are vectors"], "answer": 1, "explanation": "Speed has magnitude only; velocity has magnitude and direction.", "hack": "SPEED = Scalar (S for S). VELOCITY = Vector (V for V)."}, {"q": "Instantaneous velocity is defined as the limit of the average velocity when", "options": ["The time interval Δt becomes very large (Δt → ∞)", "The displacement becomes zero for all times", "The time interval Δt becomes as small as we can imagine (Δt → 0)", "The acceleration becomes zero"], "answer": 2, "explanation": "v = lim Δx/Δt as Δt → 0 (Eq. 3.2).", "hack": "INSTANTANEOUS = shrink Δt to ZERO."}, {"q": "The instantaneous speed is", "options": ["The average of the initial and final velocities", "The total distance divided by total time", "The slope of the v–t graph", "The magnitude (absolute value) of the instantaneous velocity"], "answer": 3, "explanation": "Instantaneous speed = |instantaneous velocity|, the velocity without its sign or direction.", "hack": "Speed = |velocity|. The car's speedometer drops the sign."}, {"q": "On a graph of position x against time t, the instantaneous velocity at a point is", "options": ["The slope of the tangent to the curve at that point", "The area under the curve", "The height of the curve", "The length of the curve"], "answer": 0, "explanation": "Slope of x–t = velocity.", "hack": "x–t graph: SLOPE = velocity. Flat tangent means v = 0."}, {"q": "A car's speedometer shows its", "options": ["Average speed", "Instantaneous speed", "Displacement", "Acceleration"], "answer": 1, "explanation": "A speedometer gives the speed at that exact moment of time.", "hack": "Speedometer = NOW (instantaneous). Total distance ÷ total time = average."}, {"q": "Average speed, as opposed to instantaneous speed, is the", "options": ["Speed at any given moment of time", "Slope of the tangent to the curve", "Total distance covered over a time interval", "Rate of change of acceleration"], "answer": 2, "explanation": "Average speed is based on the whole interval; instantaneous speed is at one moment.", "hack": "AVERAGE = whole trip. INSTANTANEOUS = one moment."}, {"q": "When a particle's velocity changes from v₁ to v₂ between times t₁ and t₂, its average acceleration is", "options": ["(x₂ − x₁)/(t₂ − t₁)", "(v₂ + v₁)/(t₂ + t₁)", "(t₂ − t₁)/(v₂ − v₁)", "(v₂ − v₁)/(t₂ − t₁)"], "answer": 3, "explanation": "Average acceleration = change in velocity ÷ time taken (Eq. 3.3).", "hack": "a = Δv/Δt. 'v' on top means acceleration; 'x' on top means velocity."}, {"q": "Instantaneous acceleration is given by", "options": ["a = lim (Δv/Δt) as Δt → 0", "a = lim (Δx/Δt) as Δt → 0", "a = Δx × Δt", "a = Δt/Δv"], "answer": 0, "explanation": "The limit of Δv/Δt gives the acceleration at one instant (Eq. 3.4).", "hack": "Same limit trick, but on velocity."}, {"q": "If the acceleration a is positive, the velocity is instantaneously", "options": ["Decreasing", "Increasing", "Constant at zero", "Equal to g"], "answer": 1, "explanation": "The notes say: a positive means v is instantaneously increasing.", "hack": "+a → v goes UP (numerically). −a → v goes DOWN."}, {"q": "If the acceleration a is negative, the velocity is instantaneously", "options": ["Increasing", "Always negative", "Decreasing", "Constant"], "answer": 2, "explanation": "A negative a means v is decreasing at that instant.", "hack": "Careful: v decreasing does not always mean the SPEED decreases (if v is already negative)."}, {"q": "The word retardation or deceleration is used when", "options": ["The acceleration is in the same direction as the velocity", "The velocity is zero for all time", "The body is in free fall only", "The acceleration is opposite to the instantaneous velocity (the motion)"], "answer": 3, "explanation": "Deceleration means the acceleration opposes the motion, so the speed falls.", "hack": "DECELERATION = a opposite to v."}, {"q": "The magnitude of free-fall acceleration near the Earth's surface is", "options": ["9.8 m/s²", "8.9 m/s²", "98 m/s²", "0.98 m/s²"], "answer": 0, "explanation": "Near the Earth's surface a freely falling object has a constant downward acceleration of 9.8 m/s², called g.", "hack": "g = 9.8 m/s² (nine-point-eight, NOT eight-point-nine). Many exams round to 10."}, {"q": "The constant free-fall acceleration g is directed", "options": ["Upwards", "Downwards", "Horizontally", "Along the velocity always"], "answer": 1, "explanation": "Gravity pulls objects toward the Earth, so g is downward.", "hack": "g points DOWN, whatever the ball is doing."}, {"q": "With the y-axis pointing straight up, the acceleration of a freely falling object is", "options": ["a_y = +9.8 m/s² = +g", "a_y = 0", "a_y = −9.8 m/s² = −g", "a_y = −98 m/s²"], "answer": 2, "explanation": "Up is positive, gravity is downward, so a_y = −g.", "hack": "UP positive → g gets a MINUS sign. That is the sign trap in every free-fall question."}, {"q": "In the free-fall equations of the notes, the effect of air is", "options": ["Assumed to double the acceleration", "Assumed to be the only force", "Assumed to reverse the direction", "Assumed to be zero"], "answer": 3, "explanation": "The notes assume that air has no effect on the falling object.", "hack": "'Neglect air resistance' = use g only."}, {"q": "The assumption that air has no effect becomes a bad assumption for", "options": ["An object that falls for a long distance", "An object that is dropped from 1 m", "An object that is at rest", "An object in a vacuum"], "answer": 0, "explanation": "Over long falls, air resistance has time to matter.", "hack": "Longer fall → air matters more. (Parachutes!)"}, {"q": "Velocity is obtained from position x(t) by", "options": ["Integrating: v = ∫x dt", "Differentiating: v = dx/dt", "Multiplying: v = x·t", "Adding: v = x + t"], "answer": 1, "explanation": "v = dx/dt, the derivative of position with respect to time.", "hack": "x → v → a means differentiate once, then again."}, {"q": "Acceleration is related to position x(t) by", "options": ["a = dx/dt", "a = ∫x dt", "a = d²x/dt²", "a = x/t"], "answer": 2, "explanation": "a = dv/dt = d²x/dt²: two derivatives of x.", "hack": "Two steps down: a = x'' (double derivative)."}, {"q": "A particle has position x = 4t² (x in m, t in s). Its velocity is", "options": ["4t m/s", "8 m/s", "2t m/s", "8t m/s"], "answer": 3, "explanation": "v = dx/dt = 4 × 2t = 8t.", "hack": "Power rule: bring the power down and multiply, then lower the power by one."}, {"q": "A particle has position x = 5t³ (SI units). Its acceleration is", "options": ["30t m/s²", "15t² m/s²", "5t m/s²", "30 m/s²"], "answer": 0, "explanation": "v = 15t², then a = d(15t²)/dt = 30t.", "hack": "Differentiate twice: 5t³ → 15t² → 30t."}, {"q": "A particle has position x = 3t + 2 (SI units). Its velocity is", "options": ["3t m/s", "3 m/s, constant", "2 m/s", "3t + 2 m/s"], "answer": 1, "explanation": "dx/dt = 3 (the constant 2 vanishes), so the velocity is constant and the acceleration is zero.", "hack": "Straight-line x–t graph = constant velocity = slope 3."}, {"q": "A particle has position x = 10 + 4t − t² (SI units). What is its velocity at t = 1 s?", "options": ["3 m/s", "13 m/s", "2 m/s", "4 m/s"], "answer": 2, "explanation": "v = 4 − 2t, so at t = 1 s, v = 4 − 2 = 2 m/s.", "hack": "Differentiate FIRST, then substitute t. Plugging t into x gives position, not velocity."}, {"q": "On an x–t graph, a horizontal section (zero slope) means the particle has", "options": ["Constant non-zero acceleration", "Infinite velocity", "Negative speed", "Zero velocity (it is at rest)"], "answer": 3, "explanation": "Slope of x–t is velocity, so zero slope means v = 0.", "hack": "Flat x–t line = standing still."}, {"q": "On an x–t graph, a steeper straight line means", "options": ["A greater speed", "A smaller speed", "A larger mass", "A longer time only"], "answer": 0, "explanation": "A steeper slope means a larger change in x per unit time, so higher speed.", "hack": "Steeper = faster."}, {"q": "A ball is dropped from rest (free fall). Its speed after 3 s is (g = 9.8 m/s², no air resistance)", "options": ["9.8 m/s", "29.4 m/s", "44.1 m/s", "14.7 m/s"], "answer": 1, "explanation": "v = gt = 9.8 × 3 = 29.4 m/s. (44.1 is the distance fallen in 3 s.)", "hack": "From rest: v = g·t. Not ½gt²: that is the distance."}, {"q": "A ball is dropped from rest. How far does it fall in 2 s? (g = 9.8 m/s²)", "options": ["9.8 m", "39.2 m", "19.6 m", "4.9 m"], "answer": 2, "explanation": "s = ½gt² = ½ × 9.8 × 4 = 19.6 m.", "hack": "Distance from rest = 4.9t². With t = 2: 4.9 × 4 = 19.6."}, {"q": "A ball is thrown straight up at 14.7 m/s. How long does it take to reach its highest point? (g = 9.8 m/s²)", "options": ["3.0 s", "0.67 s", "14.7 s", "1.5 s"], "answer": 3, "explanation": "At the top v = 0, so t = u/g = 14.7/9.8 = 1.5 s.", "hack": "Time to top = u ÷ g. Total flight (back to start) would be double."}, {"q": "A ball is thrown straight up at 19.6 m/s. What maximum height does it reach? (g = 9.8 m/s²)", "options": ["19.6 m", "39.2 m", "9.8 m", "384 m"], "answer": 0, "explanation": "From v² = u² − 2gh with v = 0: h = u²/(2g) = 384.16/19.6 = 19.6 m.", "hack": "h = u²/(2g). Don't forget to divide by 2g (not just g)."}, {"q": "At the highest point of a ball thrown straight up, its velocity and acceleration are", "options": ["v = 0 and a = 0", "v = 0 and a = −9.8 m/s²", "v = 9.8 m/s and a = 0", "v = −9.8 m/s and a = 9.8 m/s"], "answer": 1, "explanation": "At the top the ball is momentarily at rest, but gravity still acts, so a = −g.", "hack": "Top of the flight: v = 0 BUT a ≠ 0. Classic trap."}, {"q": "A ball is thrown vertically upward and returns to the launch point (no air resistance). The time going up compared with the time coming down is", "options": ["Longer going up", "Longer coming down", "Equal", "Zero going up"], "answer": 2, "explanation": "With no air resistance the motion is symmetric, so the two times are equal.", "hack": "No air = symmetric flight. Up time = down time, launch speed = return speed."}, {"q": "An object is dropped from rest. Its initial velocity u is", "options": ["9.8 m/s", "Equal to g", "Equal to the final velocity", "Zero"], "answer": 3, "explanation": "'Dropped' or 'released' from rest means u = 0.", "hack": "Dropped = u = 0. Thrown = u ≠ 0."}, {"q": "Convert 90 km/h to m/s.", "options": ["25 m/s", "90 m/s", "324 m/s", "2.5 m/s"], "answer": 0, "explanation": "90 × 1000 m / 3600 s = 25 m/s.", "hack": "km/h ÷ 3.6 = m/s. 90 ÷ 3.6 = 25."}, {"q": "A runner covers 300 m in 50 s. What is the average speed?", "options": ["15 000 m/s", "6 m/s", "0.167 m/s", "350 m/s"], "answer": 1, "explanation": "Average speed = 300/50 = 6 m/s.", "hack": "Distance ÷ time: 300 ÷ 50 = 6."}, {"q": "A particle moves from x = 4 m to x = −2 m in 3 s. What is its average velocity?", "options": ["+2 m/s", "−6 m/s", "−2 m/s", "+0.67 m/s"], "answer": 2, "explanation": "v̄ = (−2 − 4)/3 = −6/3 = −2 m/s. The minus sign means motion in the −x direction.", "hack": "Last minus first: (−2) − 4 = −6."}, {"q": "A man walks 6 m east and then 2 m west. His total distance travelled and displacement are", "options": ["4 m and 8 m east", "8 m and 8 m east", "4 m and 4 m east", "8 m and 4 m east"], "answer": 3, "explanation": "Distance adds every step: 6 + 2 = 8 m. Displacement is net change: 6 − 2 = 4 m east.", "hack": "DISTANCE adds everything. DISPLACEMENT cancels back-and-forth."}, {"q": "A car with initial velocity 20 m/s decelerates uniformly at 4 m/s². How long does it take to stop?", "options": ["5 s", "80 s", "0.2 s", "16 s"], "answer": 0, "explanation": "From v = u + at: 0 = 20 − 4t, so t = 5 s.", "hack": "Stop → v = 0 → t = u/a (ignore the sign)."}, {"q": "A body goes from 10 m/s to 20 m/s uniformly in 6 s. What distance does it cover?", "options": ["60 m", "90 m", "120 m", "180 m"], "answer": 1, "explanation": "s = ½(u + v)t = ½(10 + 20)(6) = 90 m.", "hack": "Average speed (15 m/s) × time (6 s) = 90 m."}, {"q": "A body starts from rest with acceleration 10 m/s² over a distance of 45 m. Its final speed is", "options": ["900 m/s", "15 m/s", "30 m/s", "21.2 m/s"], "answer": 2, "explanation": "v² = 2as = 2 × 10 × 45 = 900, so v = 30 m/s.", "hack": "No time given → v² = u² + 2as. Finish with a square root."}, {"q": "Which equation do you use when the time is NOT given and not wanted?", "options": ["v = u + at", "s = ut + ½at²", "s = ½(u + v)t", "v² = u² + 2as"], "answer": 3, "explanation": "v² = u² + 2as is the only one of these with no t.", "hack": "Equation chooser: whichever variable is missing, use the equation that lacks it."}, {"q": "A particle has negative velocity. This means it is", "options": ["Moving in the negative x direction", "At rest", "Accelerating", "Decelerating"], "answer": 0, "explanation": "The sign of velocity tells the direction along the axis.", "hack": "Negative velocity = going left, nothing else."}, {"q": "A particle has positive velocity and negative acceleration. Its speed is", "options": ["Increasing", "Decreasing", "Constant", "Zero"], "answer": 1, "explanation": "Acceleration opposes the motion, so the particle slows down.", "hack": "Signs OPPOSITE (v +, a −) = slowing. Signs SAME = speeding up."}, {"q": "A particle has negative velocity and negative acceleration. Its speed is", "options": ["Decreasing", "Constant", "Increasing", "Zero"], "answer": 2, "explanation": "Both point in the −x direction, so the particle speeds up while moving left.", "hack": "Signs SAME (both −) = speeding up."}, {"q": "A particle is moving with constant velocity. Its acceleration is", "options": ["Equal to its velocity", "Equal to g", "Constantly increasing", "Zero"], "answer": 3, "explanation": "a = Δv/Δt and v does not change, so a = 0.", "hack": "Constant v → a = 0 (straight-line x–t graph)."}, {"q": "A runner completes one full lap of a track and returns to her starting point. Her displacement is", "options": ["Zero", "Equal to the length of the track", "Half the length of the track", "Twice the length of the track"], "answer": 0, "explanation": "She finishes at the starting point, so the net change in position is zero even though the distance is not.", "hack": "Back to start = displacement 0."}, {"q": "The average velocity of a moving particle depends on", "options": ["Only its mass", "The initial and final times used to find the displacement", "Only its colour", "Nothing, it is always constant"], "answer": 1, "explanation": "The notes say the average velocity
