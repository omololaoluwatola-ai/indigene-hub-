 for a moving particle depends on the chosen initial and final times.", "hack": "Average over WHICH interval? Change the interval and the average changes."}], "tutorial": [{"q": "An object moving at 3 m/s accelerates uniformly for 4 s. Its displacement over this time is 24 m. What is its final velocity?", "options": ["12 m/s", "6 m/s", "9 m/s", "15 m/s"], "answer": 2, "explanation": "From s = ut + ½at²: 24 = 12 + 8a so a = 1.5 m/s². Then v = u + at = 3 + 1.5 × 4 = 9 m/s. Check: ½(3 + 9)(4) = 24 ✓.", "hack": "Shortcut: s = ½(u + v)t → 24 = ½(3 + v)(4) → v = 9. No acceleration needed.", "src": "Problem 3.1"}, {"q": "A person runs one complete lap of a 400 m oval track in 2 minutes. Which statement is correct?", "options": ["The person's displacement is 400 m", "The person's velocity is 200 m/min", "The person's velocity is 150 m/min", "The person's displacement is 0 m"], "answer": 3, "explanation": "She ends where she began, so the displacement is 0 and the average velocity is 0. (Her average SPEED is 400/2 = 200 m/min.)", "hack": "Full lap = back at start = displacement 0 = velocity 0. 200 m/min is the SPEED.", "src": "Problem 3.2"}, {"q": "A person runs one complete lap of a 400 m oval track in 2 minutes. What is the average speed?", "options": ["200 m/min", "0 m/min", "150 m/min", "800 m/min"], "answer": 0, "explanation": "Average speed = total distance/time = 400 m / 2 min = 200 m/min.", "hack": "Speed uses total DISTANCE (400), not displacement (0).", "src": "Problem 3.2"}, {"q": "A car starts from rest and accelerates at 2 m/s². How long does it take to travel the same distance that another car moving at a constant 20 m/s travels in the same time?", "options": ["10 s", "20 s", "40 s", "5 s"], "answer": 1, "explanation": "Set the distances equal: ½(2)t² = 20t, so t² = 20t and t = 20 s.", "hack": "Equal distances: ½at² = vt → t = 2v/a = 2(20)/2 = 20 s.", "src": "Problem 3.3"}, {"q": "A golf ball is released from the top of a very tall building. Neglecting air resistance, how far has it fallen after 6.00 s? (g = 9.8 m/s²)", "options": ["58.8 m", "353 m", "176 m", "29.4 m"], "answer": 2, "explanation": "s = ½gt² = ½ × 9.8 × 36 = 176.4 m below the release point (y = −176 m with up positive).", "hack": "From rest: distance = 4.9t². 4.9 × 36 = 176.4.", "src": "Problem 3.4"}, {"q": "A golf ball is released from the top of a very tall building. What is its velocity after 6.00 s? (g = 9.8 m/s², no air resistance, up positive)", "options": ["+58.8 m/s", "−176 m/s", "−29.4 m/s", "−58.8 m/s"], "answer": 3, "explanation": "v = −gt = −9.8 × 6 = −58.8 m/s. The minus sign means downward.", "hack": "With up positive, falling = negative velocity. v = −gt.", "src": "Problem 3.4"}, {"q": "The position of a particle on the x-axis is x = 13.2 + 8.9t² + 1.2t³ (SI units). What is its acceleration at t = 2.6 s?", "options": ["36.5 m/s²", "17.8 m/s²", "23.1 m/s²", "40.2 m/s²"], "answer": 0, "explanation": "v = 17.8t + 3.6t², a = 17.8 + 7.2t. At t = 2.6 s: a = 17.8 + 7.2(2.6) = 36.5 m/s².", "hack": "Differentiate twice, THEN put t = 2.6. The constant 13.2 disappears at the first step.", "src": "Problem 3.5"}, {"q": "A stone is thrown up from a platform with an initial velocity of 19 m/s. How long does it take to reach the maximum height? (g = 9.8 m/s²)", "options": ["3.88 s", "1.94 s", "0.52 s", "19.0 s"], "answer": 1, "explanation": "At the top v = 0: t = u/g = 19/9.8 = 1.94 s.", "hack": "Time to top = u/g. Don't double it; doubling gives the total flight time.", "src": "Problem 3.6"}, {"q": "A lift is moving downward with acceleration 3 m/s². A ball is released 1.7 m above the lift floor. How long does it take to hit the floor? (g = 9.8 m/s²)", "options": ["0.59 s", "0.42 s", "0.71 s", "1.00 s"], "answer": 2, "explanation": "Relative to the lift, the ball accelerates at 9.8 − 3 = 6.8 m/s² from rest. 1.7 = ½(6.8)t², so t² = 0.5 and t = 0.71 s.", "hack": "Subtract the accelerations: 9.8 − 3 = 6.8 (relative acceleration). Then 1.7 = 3.4t².", "src": "Problem 3.7"}, {"q": "An airplane lands on a runway at 50 m/s and decelerates at 10 m/s² to a velocity of 20 m/s. What distance does it travel on the runway?", "options": ["210 m", "175 m", "125 m", "105 m"], "answer": 3, "explanation": "v² = u² + 2as gives 20² = 50² + 2(−10)s, so 400 = 2500 − 20s and s = 105 m.", "hack": "No time given → v² = u² + 2as. Put a minus on the deceleration.", "src": "Problem 3.8"}, {"q": "A particle's position is x = 3t² − 12t + 20 (SI units). At what time is the particle at rest?", "options": ["2 s", "4 s", "6 s", "0.5 s"], "answer": 0, "explanation": "v = dx/dt = 6t − 12. At rest v = 0, so t = 2 s.", "hack": "At rest = velocity zero = set dx/dt = 0.", "src": "Problem 3.9"}, {"q": "The position of a particle is x = 3t³ − 2t² + 6 (SI units). What is its instantaneous velocity at t = 3 s?", "options": ["81 m/s", "69 m/s", "63 m/s", "117 m/s"], "answer": 1, "explanation": "v = dx/dt = 9t² − 4t, so v(3) = 81 − 12 = 69 m/s.", "hack": "Differentiate first, then substitute. (Substituting into x gives position: 69 m.)", "src": "Problem 3.10"}, {"q": "The position of a particle is x = 30t² − 5t³ (SI units). At what time is its acceleration zero?", "options": ["4 s", "6 s", "2 s", "12 s"], "answer": 2, "explanation": "v = 60t − 15t², a = 60 − 30t. Setting a = 0 gives t = 2 s.", "hack": "Zero acceleration = set the SECOND derivative to zero. Here x'' = 60 − 30t.", "src": "Problem 3.11"}, {"q": "A mango falls from a height of 125 m. Taking g = 10 m/s², in how many seconds does it reach the ground?", "options": ["2.5 s", "12.5 s", "25 s", "5.0 s"], "answer": 3, "explanation": "From rest, h = ½gt²: 125 = 5t², so t² = 25 and t = 5 s. (With g = 9.8 m/s² you would get 5.05 s.)", "hack": "t = √(2h/g) = √(250/10) = √25 = 5. Check the g value your lecturer uses.", "src": "Problem 3.12"}, {"q": "A bicycle accelerates uniformly from rest. At time t its velocity is v. At what time will its velocity be 4v?", "options": ["4t", "2t", "8t", "16t"], "answer": 0, "explanation": "From rest v = at, so v is proportional to t. Four times the velocity needs four times the time: 4t.", "hack": "From rest, v ∝ t: ×4 in speed = ×4 in time. (Distance ∝ t², so ×4 time gives ×16 distance.)", "src": "Problem 3.13"}, {"q": "A runner starts from rest and accelerates uniformly for 2 s. The total displacement is 12 m. What is the final velocity?", "options": ["6 m/s", "12 m/s", "24 m/s", "3 m/s"], "answer": 1, "explanation": "s = ½at² gives 12 = ½a(4), so a = 6 m/s². Then v = at = 12 m/s. Check: s = ½vt = ½(12)(2) = 12 ✓.", "hack": "From rest: s = ½vt, so v = 2s/t = 2(12)/2 = 12.", "src": "Problem 3.14"}, {"q": "A car moving at speed v comes to rest in a displacement d. A second car moving at 2v comes to rest in a displacement 2d. What is the ratio of the first car's acceleration to the second's?", "options": ["2 : 1", "1 : 1", "1 : 2", "1 : 4"], "answer": 2, "explanation": "From v² = 2ad, a = v²/(2d). First car: a₁ = v²/(2d). Second: a₂ = (2v)²/(2·2d) = v²/d. So a₁/a₂ = 1/2.", "hack": "a ∝ v²/d. Speed doubled → ×4; distance doubled → ÷2; net ×2 for the second car.", "src": "Problem 3.15"}], "exercises": [{"q": "A fastball is thrown at 160 km/h. What is this speed in m/s?", "options": ["576 m/s", "2.67 m/s", "160 m/s", "44.4 m/s"], "answer": 3, "explanation": "160 × 1000 m / 3600 s = 44.4 m/s. (The notes write m s⁻², which is a typo; speed is m/s.)", "hack": "km/h ÷ 3.6 = m/s. 160 ÷ 3.6 = 44.4.", "src": "Example 3.1"}, {"q": "A fastball travels at 160 km/h. How long does it take to reach home plate 18.4 m away?", "options": ["0.414 s", "0.115 s", "8.70 s", "2.41 s"], "answer": 0, "explanation": "t = Δx/v = 18.4 / 44.4 = 0.414 s. Using 160 directly without converting gives 0.115 s.", "hack": "Convert to m/s BEFORE dividing, or the units will not match the metres.", "src": "Example 3.1"}, {"q": "An electron's position is x = 16te⁻ᵗ m (t in s). Its velocity is", "options": ["16e⁻ᵗ m/s", "16e⁻ᵗ(1 − t) m/s", "−16te⁻ᵗ m/s", "16e⁻ᵗ(1 + t) m/s"], "answer": 1, "explanation": "Product rule: v = 16e⁻ᵗ + 16t(−e⁻ᵗ) = 16e⁻ᵗ(1 − t).", "hack": "Product rule on t·e⁻ᵗ: (t)'e⁻ᵗ + t(e⁻ᵗ)' = e⁻ᵗ − te⁻ᵗ.", "src": "Example 3.2"}, {"q": "For the electron with x = 16te⁻ᵗ m, at what time does it momentarily stop?", "options": ["0 s", "2 s", "1 s", "e s"], "answer": 2, "explanation": "v = 16e⁻ᵗ(1 − t) = 0 only when 1 − t = 0, since e⁻ᵗ is never zero. So t = 1 s.", "hack": "'Momentarily stops' = v = 0. e⁻ᵗ can never be zero, so the other factor must be.", "src": "Example 3.2"}, {"q": "How far is the electron (x = 16te⁻ᵗ m) from the origin when it momentarily stops?", "options": ["16.0 m", "43.5 m", "2.17 m", "5.89 m"], "answer": 3, "explanation": "At t = 1 s: x = 16(1)e⁻¹ = 16/2.718 = 5.89 m.", "hack": "x(1) = 16/e = 16 ÷ 2.718 = 5.89.", "src": "Example 3.2"}, {"q": "The position of a particle is x = 20t − 5t³ (SI units). At what positive time is its velocity zero?", "options": ["1.15 s", "1.33 s", "0.75 s", "4.00 s"], "answer": 0, "explanation": "v = 20 − 15t² = 0 gives t² = 20/15 = 1.33, so t = 1.15 s (the negative root is rejected).", "hack": "Set v = 0, solve for t², then TAKE THE SQUARE ROOT (1.33 is t²).", "src": "Example 3.3"}, {"q": "For x = 20t − 5t³ (SI units), when is the acceleration zero?", "options": ["At t = 1.15 s", "At t = 0", "At t = 2.31 s", "At no time"], "answer": 1, "explanation": "v = 20 − 15t² and a = dv/dt = −30t. This is zero only at t = 0. (The notes' value −30(±1.15) is the acceleration at the instants when v = 0.)", "hack": "a = −30t is a straight line through the origin: it is zero only at t = 0.", "src": "Example 3.3"}, {"q": "A spot on a screen moves according to x = 9.00t − 0.750t³ (x in cm, t in s). At what time after starting is it instantaneously at rest?", "options": ["3.46 s", "1.50 s", "2.00 s", "4.00 s"], "answer": 2, "explanation": "v = 9.00 − 2.25t² = 0 gives t² = 4.00, so t = 2.00 s (the negative root is not allowed because the clock starts at 0).", "hack": "At rest → v = 0. Solve 9 − 2.25t² = 0. Compare with 3.46 s, which is when x = 0.", "src": "Example 3.4(a)"}, {"q": "For the spot with x = 9.00t − 0.750t³ cm, where is it when it is instantaneously at rest (t = 2.00 s)?", "options": ["x = 18.0 cm", "x = 6.00 cm", "x = 15.0 cm", "x = 12.0 cm"], "answer": 3, "explanation": "x(2.00) = 9.00(2.00) − 0.750(2.00)³ = 18.0 − 6.0 = 12.0 cm, inside the 15.0 cm screen.", "hack": "Put t = 2 into x (not into v). 18 − 6 = 12.", "src": "Example 3.4(b)"}, {"q": "For the spot with x = 9.00t − 0.750t³ cm, what is its acceleration at t = 2.00 s?", "options": ["−9.0 cm/s²", "−4.5 cm/s²", "+9.0 cm/s²", "−18 cm/s²"], "answer": 0, "explanation": "v = 9.00 − 2.25t², so a = −4.50t. At t = 2.00 s: a = −9.0 cm/s².", "hack": "a = dv/dt = −4.5t. A minus sign: the spot is slowing in the +x direction.", "src": "Example 3.4(c)"}, {"q": "The spot has x = 9.00t − 0.750t³ cm. In which direction does it move just BEFORE coming to rest at t = 2.00 s?", "options": ["In the −x direction", "In the +x direction", "It is not moving", "Perpendicular to the screen"], "answer": 1, "explanation": "At t = 2.00 s, a is negative and v = 0, so v must be falling from positive to negative. Just before, v was positive.", "hack": "v goes + → 0 → −. Before the stop it was +.", "src": "Example 3.4(d)"}, {"q": "The spot has x = 9.00t − 0.750t³ cm. In which direction does it move just AFTER t = 2.00 s?", "options": ["In the +x direction", "It stays at rest", "In the −x direction", "Perpendicular to the screen"], "answer": 2, "explanation": "Because a < 0 at that time, v becomes negative just after the stop.", "hack": "After the turning point the sign flips: v < 0, so it heads back toward x = 0.", "src": "Example 3.4(e)"}, {"q": "For x = 9.00t − 0.750t³ cm, when does the spot first reach an edge of the screen (x = 0 or x = 15.0 cm) after t = 0?", "options": ["2.00 s", "4.00 s", "1.73 s", "3.46 s"], "answer": 3, "explanation": "Set x = 0: t(9.00 − 0.750t²) = 0, so t² = 12.0 and t = 3.46 s. The maximum x is 12.0 cm, so it never reaches 15.0 cm.", "hack": "Factor out t, then solve 9 − 0.75t² = 0: t² = 12, t = 3.46.", "src": "Example 3.4(f)"}, {"q": "A jet lands at 100 m/s and decelerates at 5 m/s² until it stops. What is the minimum time it needs to stop?", "options": ["20 s", "500 s", "5 s", "95 s"], "answer": 0, "explanation": "t = (v − v₀)/a = (0 − 100)/(−5) = 20 s.", "hack": "Stop → t = v₀/a = 100 ÷ 5 = 20.", "src": "Example 3.5(a)"}, {"q": "A jet lands at 100 m/s and decelerates at 5 m/s². What is the minimum runway length it needs?", "options": ["0.50 km", "1.0 km", "2.0 km", "0.80 km"], "answer": 1, "explanation": "x = ½(v₀ + v)t = ½(100 + 0)(20) = 1000 m = 1.0 km.", "hack": "Average speed 50 m/s × 20 s = 1000 m. Check: 100²/(2×5) = 1000.", "src": "Example 3.5(b)"}, {"q": "Can a jet that lands at 100 m/s and decelerates at 5 m/s² land safely on a 0.80 km runway?", "options": ["Yes, it needs only 0.5 km", "Yes, it needs exactly 0.80 km", "No, it needs at least 1.0 km", "No, it needs at least 2.0 km"], "answer": 2, "explanation": "The minimum stopping distance is 1.0 km, which is longer than the 0.80 km runway.", "hack": "Compare units: 1000 m needed vs 800 m available → not enough.", "src": "Example 3.5(b)"}, {"q": "A particle's position is x = 2t³ − 2t² + 3 (SI units). What is its instantaneous acceleration at t = 2 s?", "options": ["24 m/s²", "8 m/s²", "40 m/s²", "20 m/s²"], "answer": 3, "explanation": "v = 6t² − 4t and a = 12t − 4. At t = 2 s: a = 24 − 4 = 20 m/s².", "hack": "Two derivatives: 2t³ → 6t² → 12t. Then subtract 4. Constants disappear.", "src": "Example 3.6"}, {"q": "The position of a particle is x = 3t³ − 2t² + 6 (SI units). What is its velocity at t = 3 s?", "options": ["69 m/s", "81 m/s", "63 m/s", "27 m/s"], "answer": 0, "explanation": "v = 9t² − 4t, so v(3) = 81 − 12 = 69 m/s.", "hack": "Differentiate first, then substitute t = 3.", "src": "Example 3.7"}, {"q": "A body's position is x = 3t³ − 2t² + 6 (m, with t in s). What is its displacement be es.", "hack": "CONTACT = touching. Non-contact = acts at a distance."}, {"q": "Which of these is a non-contact force?", "options": ["Tension in a string", "Friction on a surface", "Force from a spring", "Gravitational force"], "answer": 3, "explanation": "Gravitational, electrical and magnetic forces act at a distance.", "hack": "Non-contact (action at a distance): Gravity, Electric, Magnetic = G-E-M."}, {"q": "The friction force is calculated using", "options": ["f = μN", "f = N/μ", "f = μ/N", "f = μN²"], "answer": 0, "explanation": "f = μN, where N is the normal force and μ the coefficient of friction.", "hack": "Friction = mu × Normal. Not mu × weight unless the surface is flat."}, {"q": "Static friction between a block and a table is balanced against the applied force. As the applied force increases, static friction", "options": ["Decreases to zero", "Increases until it reaches its maximum (limiting) value", "Stays constant at its limiting value from the start", "Becomes negative"], "answer": 1, "explanation": "Static friction adjusts to match the applied force up to the limiting value.", "hack": "Static friction is SELF-ADJUSTING up to a limit."}, {"q": "The maximum static friction depends on", "options": ["The size of the contact area between them", "The speed at which the body is sliding", "The nature of the surfaces and the normal force", "The colour and the shape of the surfaces"], "answer": 2, "explanation": "(f_s)max = μN, independent of the contact area.", "hack": "Max static friction: μ and N, NOT area."}, {"q": "If the external force exceeds the limiting friction, the block", "options": ["Stays at rest on the surface", "Loses all its mass at once", "Starts floating above the surface", "Starts moving on the surface"], "answer": 3, "explanation": "Once F exceeds (f_s)max, static friction can no longer balance it and sliding begins.", "hack": "F > limiting friction → it moves."}, {"q": "Rolling friction arises mainly because", "options": ["The surfaces in contact flex a little over a finite area", "The rolling body has no mass, so nothing resists it", "The surface is perfectly rigid and perfectly smooth", "The wheel is not really touching the road at all"], "answer": 0, "explanation": "A finite area of the body touches the surface as it rolls, and the surfaces flex a little, so motion is opposed.", "hack": "Rolling friction example: bicycle wheel on the road."}, {"q": "A pseudo force is", "options": ["A real force that is produced by electric charges", "An imaginary force seen from an accelerating frame", "A force that can exist only inside a vacuum", "The force of gravity that acts on the Moon"], "answer": 1, "explanation": "When we observe an object from an accelerating body, an imaginary (pseudo) force F = ma appears to act on it, where a is the acceleration of the observing frame.", "hack": "Pseudo = FAKE force. It appears only in accelerating frames."}, {"q": "A 5 kg object is observed from a vehicle accelerating at 2 m/s². The magnitude of the pseudo force on the object is", "options": ["2.5 N", "7 N", "10 N", "20 N"], "answer": 2, "explanation": "F_p = ma = 5 × 2 = 10 N (directed opposite to the vehicle's acceleration).", "hack": "Pseudo force = mass of the OBSERVED object × acceleration of the OBSERVER."}, {"q": "The gravitational force between two bodies is", "options": ["Directly proportional to the distance between them and inversely proportional to their masses", "Inversely proportional to the product of the masses and directly proportional to the distance", "Independent of the distance between them but proportional to the sum of the masses", "Directly proportional to the product of the masses and inversely proportional to distance squared"], "answer": 3, "explanation": "F ∝ M₁M₂/r².", "hack": "GRAVITY: masses on top, r² below."}, {"q": "If the distance between two masses is doubled, the gravitational force between them becomes", "options": ["One quarter", "Half", "Double", "Four times"], "answer": 0, "explanation": "F ∝ 1/r², so doubling r divides F by 2² = 4.", "hack": "Double the distance → ÷4. Triple → ÷9."}, {"q": "If both masses are doubled (distance fixed), the gravitational force becomes", "options": ["Double", "Four times", "Half", "Unchanged"], "answer": 1, "explanation": "F ∝ M₁M₂, so doubling both gives 2 × 2 = 4 times.", "hack": "Both masses ×2 → force ×4."}, {"q": "Coulomb's law says the electric force between two point charges is", "options": ["Directly proportional to the distance and inversely proportional to the product of the charges", "Independent of the distance but proportional to the sum of the two charges involved", "Inversely proportional to distance squared and directly proportional to the product of the charges", "Inversely proportional to the charges and directly proportional to the distance cubed"], "answer": 2, "explanation": "F = k q₁q₂/r².", "hack": "Coulomb's law has the same shape as gravity: product on top, r² below."}, {"q": "The magnetic force on a charge q moving with velocity v in a magnetic field B is", "options": ["F = qvB cos θ", "F = qB/v", "F = q/(vB)", "F = qvB sin θ"], "answer": 3, "explanation": "θ is the angle between the velocity and the magnetic-field vectors.", "hack": "Magnetic force: sin θ (zero when the charge moves along the field)."}, {"q": "Momentum is defined as", "options": ["The product of mass and velocity", "The ratio of mass to velocity", "The product of force and distance", "The sum of mass and speed"], "answer": 0, "explanation": "p = mv.", "hack": "p = m·v. 'P' for 'mass-times-Pace'."}, {"q": "The SI unit of momentum is", "options": ["kg·m/s²", "kg·m/s", "kg·m²/s²", "N/s"], "answer": 1, "explanation": "p = mv, so the unit is kg × m/s = kg·m/s (equal to N·s).", "hack": "Momentum kg·m/s; force kg·m/s². One more 's' = force."}, {"q": "Momentum is", "options": ["A scalar quantity", "A dimensionless quantity", "A vector quantity", "Always positive"], "answer": 2, "explanation": "Momentum has magnitude and direction (the direction of the velocity).", "hack": "p = mv, and v is a vector, so p is a vector."}, {"q": "Momentum is a measure of", "options": ["How hot an object becomes when it moves", "How bright a luminous object appears to be", "How large an object is in terms of volume", "How difficult it is to stop a moving object"], "answer": 3, "explanation": "A larger mass or a higher velocity makes a moving object harder to stop.", "hack": "Momentum = 'stopping difficulty'."}, {"q": "The two factors that affect momentum are", "options": ["Mass and velocity", "Mass and temperature", "Charge and time", "Force and distance"], "answer": 0, "explanation": "p = mv.", "hack": "Mass and velocity: the two letters in mv."}, {"q": "A fast-moving baseball has more momentum than a slow one because of its larger", "options": ["Mass", "Velocity", "Charge", "Density"], "answer": 1, "explanation": "Same mass, higher velocity, so more momentum.", "hack": "Same mass → compare speeds."}, {"q": "Angular momentum of an object moving in a circular path is given in the notes as", "options": ["P_a = mv/r", "P_a = mv", "P_a = mvr", "P_a = mr/v"], "answer": 2, "explanation": "It is the product of the linear momentum (mv) and the radius r of the path.", "hack": "Angular momentum = linear momentum × radius = mvr."}, {"q": "A 2 kg object moves at 3 m/s. Its momentum is", "options": ["1.5 kg·m/s", "5 kg·m/s", "18 kg·m/s", "6 kg·m/s"], "answer": 3, "explanation": "p = mv = 2 × 3 = 6 kg·m/s.", "hack": "Just multiply: mass × velocity."}, {"q": "A net force of 10 N acts on a 2 kg body. Its acceleration is", "options": ["5 m/s²", "20 m/s²", "0.2 m/s²", "12 m/s²"], "answer": 0, "explanation": "a = F/m = 10/2 = 5 m/s².", "hack": "Force ÷ mass. Check units: N/kg = m/s²."}, {"q": "A force of 20 N acts on a body for 0.5 s. The impulse is", "options": ["40 N·s", "10 N·s", "20.5 N·s", "10 N"], "answer": 1, "explanation": "I = Ft = 20 × 0.5 = 10 N·s.", "hack": "Impulse = F × t. Careful: the unit is N·s, not N."}, {"q": "A friction coefficient μ = 0.3 acts on a block with normal force 50 N. The friction force is", "options": ["166 N", "0.006 N", "15 N", "150 N"], "answer": 2, "explanation": "f = μN = 0.3 × 50 = 15 N.", "hack": "Multiply mu by N. (Dividing gives the silly 166.)"}, {"q": "A 5 kg gun fires a 0.01 kg bullet at 400 m/s. What is the recoil speed of the gun?", "options": ["80 m/s", "2000 m/s", "0.08 m/s", "0.8 m/s"], "answer": 3, "explanation": "Total momentum starts at zero: 5v + 0.01(400) = 0, so v = −0.8 m/s. The gun moves backward at 0.8 m/s.", "hack": "Equal and opposite momenta: mass(gun) × v(gun) = mass(bullet) × v(bullet). Heavy gun, small recoil speed."}, {"q": "A 2 kg body moving at 6 m/s collides with and sticks to a 4 kg body at rest. What is their common velocity?", "options": ["2 m/s", "3 m/s", "6 m/s", "1.5 m/s"], "answer": 0, "explanation": "m₁u₁ = (m₁ + m₂)v gives 2 × 6 = 6v, so v = 2 m/s.", "hack": "Stick together: total momentum ÷ TOTAL mass. 12 ÷ 6 = 2."}, {"q": "The momentum of a 1000 kg car moving at 20 m/s is", "options": ["2000 kg·m/s", "20 000 kg·m/s", "200 000 kg·m/s", "50 kg·m/s"], "answer": 1, "explanation": "p = mv = 1000 × 20 = 20 000 kg·m/s.", "hack": "mv = 1000 × 20. Count the zeros."}, {"q": "Momentum is NOT conserved when", "options": ["The bodies in the system collide with each other", "The bodies in the system stick together", "A net external force acts on the system", "No external force acts on the system"], "answer": 2, "explanation": "Gravity, friction or any other net external force changes the total momentum.", "hack": "NET EXTERNAL FORCE kills conservation of momentum."}, {"q": "Relative motion means the motion of an object measured", "options": ["Only with respect to the Sun at all times and places", "Only in a vacuum with no air present around it", "Without choosing any reference frame whatsoever", "With respect to another object or frame of reference"], "answer": 3, "explanation": "All motion is relative since there is no absolute fixed point; our perception depends on our frame of reference.", "hack": "'Relative to WHAT?' is always the first question."}, {"q": "The velocity of car A relative to car B is", "options": ["V_AB = V_A − V_B", "V_AB = V_A + V_B always", "V_AB = V_B − V_A", "V_AB = V_A × V_B"], "answer": 0, "explanation": "Both velocities are measured relative to the observer, and V_AB is their vector difference.", "hack": "AB = A minus B (first letter minus second letter)."}, {"q": "Car A moves at 30 m/s and car B at 20 m/s in the same direction. The velocity of A relative to B is", "options": ["50 m/s", "10 m/s", "600 m/s", "1.5 m/s"], "answer": 1, "explanation": "V_AB = 30 − 20 = 10 m/s in the same direction.", "hack": "Same direction → subtract. Opposite directions → add."}, {"q": "Two cars move towards each other at 30 m/s and 20 m/s. The speed of one relative to the other is", "options": ["10 m/s", "25 m/s", "50 m/s", "600 m/s"], "answer": 2, "explanation": "In opposite directions the relative speed is the sum: 30 + 20 = 50 m/s.", "hack": "Head-on: ADD speeds. Chasing: SUBTRACT speeds."}], "tutorial": [{"q": "A cyclist starts from rest and accelerates uniformly at 1.5 m/s² for 8 s, then moves at constant velocity for 10 s. What is the maximum velocity reached?", "options": ["15 m/s", "6 m/s", "1.5 m/s", "12 m/s"], "answer": 3, "explanation": "v = u + at = 0 + 1.5 × 8 = 12 m/s.", "hack": "From rest: v = a·t = 1.5 × 8 = 12.", "src": "Problem 4.1(a)"}, {"q": "The cyclist accelerates from rest at 1.5 m/s² for 8 s. What distance does she travel during the acceleration?", "options": ["48 m", "96 m", "12 m", "24 m"], "answer": 0, "explanation": "s = ½at² = ½(1.5)(8²) = 48 m.", "hack": "Square the time first: 64. Then × 1.5 × ½ = 48.", "src": "Problem 4.1(b)"}, {"q": "The cyclist accelerates for 8 s to 12 m/s, then moves at constant velocity for 10 s. What is the total displacement?", "options": ["120 m", "168 m", "48 m", "216 m"], "answer": 1, "explanation": "Acceleration phase 48 m + constant-speed phase 12 × 10 = 120 m. Total = 168 m.", "hack": "Add the two phases: 48 + 120 = 168. Pieces first, total last.", "src": "Problem 4.1(c)"}, {"q": "A soccer ball is kicked horizontally from a height of 2 m at 20 m/s. Ignoring air resistance (g = 10 m/s²), how long does it take to hit the ground?", "options": ["0.20 s", "1.0 s", "0.63 s", "0.40 s"], "answer": 2, "explanation": "Vertical motion from rest: 2 = ½(10)t², so t² = 0.4 and t = 0.632 s ≈ 0.63 s.", "hack": "The 20 m/s horizontal speed is IRRELEVANT for fall time. Only height and g matter.", "src": "Problem 4.2(a)"}, {"q": "A soccer ball is kicked horizontally from a height of 2 m at 20 m/s (g = 10 m/s²). What is its horizontal range?", "options": ["40.0 m", "20.0 m", "6.32 m", "12.6 m"], "answer": 3, "explanation": "Range = horizontal speed × time of flight = 20 × 0.632 = 12.6 m.", "hack": "Range = v_x × t. The horizontal speed never changes (no air resistance).", "src": "Problem 4.2(b)"}, {"q": "A soccer ball is kicked horizontally from a height of 2 m at 20 m/s (g = 10 m/s²). What are its velocity components just before impact?", "options": ["v_x = 20 m/s and v_y = 6.32 m/s downward", "v_x = 20 m/s and v_y = 0 m/s at impact", "v_x = 6.32 m/s and v_y = 20 m/s downward", "v_x = 0 m/s and v_y = 6.32 m/s downward"], "answer": 0, "explanation": "v_x stays 20 m/s. v_y = gt = 10 × 0.632 = 6.32 m/s downward.", "hack": "Horizontal speed stays; vertical speed grows as g·t.", "src": "Problem 4.2(c)"}, {"q": "Why does a passenger in a car continue to move forward when the car suddenly stops?", "options": ["Because the stopped car pushes the passenger forward", "Because of inertia: the body keeps its state of motion", "Because gravity pulls the passenger towards the front", "Because the passenger has no mass at all in the car"], "answer": 1, "explanation": "Newton's first law: the passenger keeps moving at the car's former velocity until a force (seat belt, friction) changes it.", "hack": "Sudden stop → body keeps going. That's inertia, not a 'forward push'.", "src": "Problem 4.3"}, {"q": "In the ideal frictionless case, an object given a push on a flat surface would", "options": ["Stop immediately after the push", "Move with ever-increasing acceleration", "Continue moving with constant velocity", "Move in a circle round the pusher"], "answer": 2, "explanation": "With no net force (no friction) the object keeps its velocity (Newton's first law). In real life, friction slows it.", "hack": "Ideal = no friction = keeps going forever. Real = friction stops it.", "src": "Problem 4.3"}, {"q": "A 5 kg box is pushed across a frictionless surface by a 20 N force at 30° to the horizontal. What is the acceleration of the box?", "options": ["4.00 m/s²", "2.00 m/s²", "0.29 m/s²", "3.46 m/s²"], "answer": 3, "explanation": "Only the horizontal component accelerates the box: F cos 30° = 17.3 N, so a = 17.3/5 = 3.46 m/s².", "hack": "Use cos 30° = 0.866 for the HORIZONTAL part: 20 × 0.866 = 17.3, then ÷ 5.", "src": "Problem 4.4(a)"}, {"q": "A 5 kg box is pushed across a frictionless surface by a 20 N force directed 30° below the horizontal. Taking g = 10 m/s², what is the normal force?", "options": ["60 N", "50 N", "40 N", "67.3 N"], "answer": 0, "explanation": "The push has a downward component 20 sin 30° = 10 N, so N = mg + 10 = 50 + 10 = 60 N. (This assumes the push is directed downward at 30° and g = 10 m/s².)", "hack": "Pushing DOWN on a box adds to the weight: N = mg + F sin θ.", "src": "Problem 4.4(b)"}, {"q": "A 20 N force acts at 30° to the horizontal. What is the horizontal component of the force?", "options": ["10 N", "17.3 N", "20 N", "11.5 N"], "answer": 1, "explanation": "F_x = F cos 30° = 20 × 0.866 = 17.3 N. The vertical component is 20 sin 30° = 10 N.", "hack": "Angle measured from the horizontal → horizontal uses COS.", "src": "Problem 4.4(c)"}, {"q": "A rocket accelerates upward from rest with a net acceleration of 15 m/s². What is its velocity after 5 s?", "options": ["3 m/s", "37.5 m/s", "75 m/s", "15 m/s"], "answer": 2, "explanation": "v = u + at = 0 + 15 × 5 = 75 m/s.", "hack": "From rest: v = a·t.", "src": "Problem 4.5(a)"}, {"q": "A rocket has a net upward acceleration of 15 m/s² (g = 10 m/s²) and the thrust is 2000 N. What is its mass?", "options": ["133 kg", "200 kg", "100 kg", "80 kg"], "answer": 3, "explanation": "Thrust − weight = ma, so 2000 − 10m = 15m, 2000 = 25m and m = 80 kg.", "hack": "Thrust must beat weight AND give acceleration: F = m(a + g) = m × 25.", "src": "Problem 4.5(b)"}, {"q": "A rocket with a net upward acceleration of 15 m/s² starts from rest. What height does it reach in 5 s?", "options": ["187.5 m", "375.0 m", "75.0 m", "93.8 m"], "answer": 0, "explanation": "h = ½at² = ½(15)(25) = 187.5 m.", "hack": "From rest: h = ½at² = 7.5 × 25.", "src": "Problem 4.5(c)"}, {"q": "An 80 kg firefighter slides down a pole with a downward acceleration of 2 m/s² (g = 10 m/s²). What is the frictional force on the firefighter?", "options": ["800 N", "640 N", "160 N", "960 N"], "answer": 1, "explanation": "Taking down as positive: mg − f = ma, so f = m(g − a) = 80(10 − 2) = 640 N upward.", "hack": "f = m(g − a): the friction is what is LEFT after the acceleration takes its share of the weight.", "src": "Problem 4.6(a)"}, {"q": "An 80 kg firefighter slides down a pole with a downward acceleration of 2 m/s² (g = 10 m/s²). What is the force the pole exerts on the firefighter?", "options": ["640 N downward", "800 N upward", "640 N upward", "160 N upward"], "answer": 2, "explanation": "The pole's force is the upward friction force on the firefighter: 640 N.", "hack": "Pole's force on person = the friction = 640 N, directed UP (against the slide).", "src": "Problem 4.6(b)"}, {"q": "The pole exerts 640 N upward on the firefighter. By Newton's third law, what force does the firefighter exert on the pole?", "options": ["640 N upward", "800 N downward", "160 N downward", "640 N downward"], "answer": 3, "explanation": "Action–reaction pair: equal in size (640 N) and opposite in direction (downward on the pole).", "hack": "Third-law partner: same size, opposite direction, on the OTHER object.", "src": "Problem 4.6(c)"}, {"q": "Two masses of 2 kg and 5 kg are 1 m apart in space. What is the gravitational force between them? (G = 6.67 × 10⁻¹¹ N·m²/kg²)", "options": ["6.67 × 10⁻¹⁰ N", "3.34 × 10⁻¹⁰ N", "6.67 × 10⁻¹¹ N", "1.33 × 10⁻⁹ N"], "answer": 0, "explanation": "F = Gm₁m₂/r² = 6.67 × 10⁻¹¹ × 2 × 5 / 1² = 6.67e-10 N.", "hack": "F = G × (2 × 5) ÷ 1² = 10G = 6.67 × 10⁻¹⁰.", "src": "Problem 4.7"}, {"q": "Why is the gravitational force between the 2 kg and 5 kg masses negligible compared with Earth's gravity on them?", "options": ["The two masses are too hot to attract each other at all", "G is tiny, so force is noticeable only for planet-sized masses", "Gravity does not act between such small bodies", "The distance of 1 m is far too large for any force"], "answer": 1, "explanation": "The attraction is ~10⁻¹⁰ N, while the Earth pulls the 2 kg mass with about 20 N, because the Earth's mass is enormous.", "hack": "F = Gm₁m₂/r² with tiny G: only planet-sized masses give noticeable force.", "src": "Problem 4.7"}, {"q": "Two point charges, +3 C and −2 C, are 0.5 m apart in a vacuum (k = 9 × 10⁹ N·m²/C²). What is the electrostatic force between them?", "options": ["2.16 × 10¹¹ N, repulsive", "1.08 × 10¹¹ N, attractive", "2.16 × 10¹¹ N, attractive", "5.4 × 10¹⁰ N, attractive"], "answer": 2, "explanation": "F = kq₁q₂/r² = 9 × 10⁹ × 3 × 2 / 0.25 = 2.16e+11 N. Opposite charges attract.", "hack": "Unlike charges attract. Compute k × 6 ÷ 0.25: dividing by 0.25 multiplies by 4.", "src": "Problem 4.8(a)"}, {"q": "The electrostatic force between the charges is 2.16 × 10¹¹ N. What is the acceleration of the −2 C charge if its mass is 0.01 kg?", "options": ["2.16 × 10⁹ m/s²", "2.16 × 10¹¹ m/s²", "2.16 × 10¹⁵ m/s²", "2.16 × 10¹³ m/s²"], "answer": 3, "explanation": "a = F/m = 2.16 × 10¹¹ / 0.01 = 2.16e+13 m/s². (This uses the charges as printed in the notes, +3 C and −2 C.)", "hack": "Dividing by 0.01 multiplies by 100: 10¹¹ → 10¹³.", "src": "Problem 4.8(b)"}, {"q": "Why can the electric force act between two charges without any contact?", "options": ["It is a non-contact force acting through the electric field", "It is a contact force carried by friction between charges", "It can act only if a solid medium joins the charges", "It acts only on bodies that are electrically neutral"], "answer": 0, "explanation": "Electric, gravitational and magnetic forces are non-contact (action-at-a-distance) forces.", "hack": "Non-contact trio: Gravity, Electric, Magnetic.", "src": "Problem 4.8(c)"}, {"q": "A satellite in a circular orbit has centripetal force equal to the gravitational force. If g is the gravitational acceleration at its height and r the orbital radius, the orbital speed is", "options": ["v = g r", "v = √(g r)", "v = √(g/r)", "v = g/r"], "answer": 1, "explanation": "Equating mv²/r = mg gives v² = gr, so v = √(gr).", "hack": "mv²/r = mg: the mass cancels, leaving v² = gr.", "src": "Problem 4.9(a)"}, {"q": "For a satellite in a circular orbit of radius r and speed v, the period of one orbit is", "options": ["T = v/(2πr)", "T = πr²/v", "T = 2πr/v", "T = 2πv/r"], "answer": 2, "explanation": "In one period the satellite travels the circumference 2πr at speed v.", "hack": "Period = circumference ÷ speed.", "src": "Problem 4.9(b)"}, {"q": "A 1000 kg satellite is where g = 8 m/s². By Newton's third law, the satellite pulls the Earth with a force of", "options": ["80 N, directed towards the satellite", "8000 N, directed away from the satellite", "Zero", "8000 N, directed towards the satellite"], "answer": 3, "explanation": "Earth pulls the satellite with mg = 1000 × 8 = 8000 N. The satellite pulls the Earth with an equal and opposite force of 8000 N (towards the satellite).", "hack": "Third law: the Earth feels the SAME force as the satellite. Weight = mg = 8000 N.", "src": "Problem 4.9(c)"}, {"q": "A 0.2 kg ball is thrown upward at 20 m/s (g = 10 m/s²). What is its maximum height?", "options": ["20 m", "40 m", "10 m", "2 m"], "answer": 0, "explanation": "At the top v = 0: h = u²/(2g) = 400/20 = 20 m.", "hack": "h = u²/(2g). 400 ÷ 20 = 20.", "src": "Problem 4.10(a)"}, {"q": "A 0.2 kg ball is thrown upward (g = 10 m/s²). What is the net force on the ball at the top of its flight?", "options": ["Zero", "2 N downward", "2 N upward", "20 N downward"], "answer": 1, "explanation": "At the top v = 0 but gravity still acts: F = mg = 0.2 × 10 = 2 N downward.", "hack": "Top of flight: v = 0 but force ≠ 0. F = mg.", "src": "Problem 4.10(b)"}, {"q": "A 0.2 kg ball is thrown upward (g = 10 m/s²). By Newton's third law, what force does the ball exert on the Earth throughout the motion?", "options": ["2 N downward on the Earth", "20 N upward on the Earth", "2 N upward on the Earth", "Zero, because the Earth is huge"], "answer": 2, "explanation": "The Earth pulls the ball down with 2 N, so the ball pulls the Earth up with 2 N, whatever the ball is doing.", "hack": "Reaction = same size, opposite direction, on the OTHER body. Size is mg all through the flight.", "src": "Problem 4.10(c)"}, {"q": "A 60 kg skater moving east at 5 m/s collides head-on with an 80 kg skater moving west at 4 m/s. They grab each other and move together. What is their final velocity? (East positive)", "options": ["+0.14 m/s (0.14 m/s east)", "−4.5 m/s (4.5 m/s west)", "+0.5 m/s (0.5 m/s east)", "−0.14 m/s (0.14 m/s west)"], "answer": 3, "explanation": "60(5) + 80(−4) = (60 + 80)v, so 300 − 320 = 140v and v = −20/140 = -0.14 m/s, i.e. 0.14 m/s towards the west.", "hack": "Pick a sign convention: east +, west −. Add the signed momenta, divide by the TOTAL mass.", "src": "Problem 4.11"}], "exercises": [{"q": "A force of 10 N acts on a body moving in a straight line with initial momentum 20 kg·m/s. What is its final momentum after 5 s?", "options": ["70 kg·m/s", "50 kg·m/s", "30 kg·m/s", "250 kg·m/s"], "answer": 0, "explanation": "F = (p_f − p_i)/t gives 10 = (p_f − 20)/5, so p_f = 50 + 20 = 70 kg·m/s.", "hack": "Impulse = F × t = 50 is the CHANGE. Add it to the starting 20.", "src": "Example 4.1"}, {"q": "In Example 4.1, a 10 N force acts for 5 s. What is the impulse delivered?", "options": ["2 N·s", "50 N·s", "15 N·s", "70 N·s"], "answer": 1, "explanation": "Impulse = F × t = 10 × 5 = 50 N·s, which equals the change in momentum.", "hack": "Impulse = change in momentum, NOT the final momentum.", "src": "Example 4.1"}, {"q": "What happens to the momentum of an object if its velocity is doubled (mass unchanged)?", "options": ["It is halved", "It is quadrupled", "It is doubled", "It is unchanged"], "answer": 2, "explanation": "p = mv, so p₂/p₁ = 2mv/mv = 2.", "hack": "p ∝ v. Double v → double p. (Kinetic energy is the one that goes ×4.)", "src": "Example 4.2"}, {"q": "A 15 000 kg truck coasts at 2.5 m/s on a frictionless track when a load of rice is dumped straight down into it. The truck's speed afterwards is 2.0 m/s. What is the mass of the rice?", "options": ["2500 kg", "7500 kg", "3000 kg", "3750 kg"], "answer": 3, "explanation": "m_t u_t = (m_t + m_r)v gives 37 500 = (15 000 + m_r)(2.0) = 30 000 + 2m_r, so m_r = 7500/2 = 3750 kg. (The notes' last step wrote 2500 kg, which is an arithmetic slip.)", "hack": "37 500 − 30 000 = 7 500, then ÷ 2 (coefficient of m_r) = 3750.", "src": "Example 4.3"}, {"q": "In Example 4.3, why does the truck slow down when the rice is dumped in?", "options": ["Momentum is conserved while mass increases, so speed falls", "Friction on the track increases as the rice is added", "The rice pushes the truck backward as it lands", "The truck loses mass when it receives the load"], "answer": 0, "explanation": "The track is frictionless and the rice adds no horizontal momentum; the same momentum is shared by a larger mass, so v decreases.", "hack": "Momentum constant, mass up → velocity down.", "src": "Example 4.3"}, {"q": "A motorboat travels at 4 m/s east and meets a current of 3.0 m/s north. What is the magnitude of the resultant velocity?", "options": ["7 m/s", "5 m/s", "1 m/s", "12 m/s"], "answer": 1, "explanation": "The components are perpendicular, so V_R = √(3² + 4²) = 5 m/s.", "hack": "3-4-5 triangle. Perpendicular velocities use Pythagoras, never plain addition.", "src": "Example 4.4"}, {"q": "The boat travels at 4 m/s east and meets a current of 3.0 m/s north. What is the direction of the resultant velocity?", "options": ["53.1° north of east", "36.9° south of east", "36.9° north of east", "45° north of east"], "answer": 2, "explanation": "tan θ = 3/4 = 0.75, so θ = tan⁻¹(0.75) = 36.9°, measured from the east direction towards north.", "hack": "tan θ = opposite/adjacent = north/east = 3/4. Angle from the EAST direction.", "src": "Example 4.4"}]}, {"chapter": 5, "title": "Vectors and Fundamental Laws of Mechanics", "concept": [{"q": "In physics, anything that can be measured is called a", "options": ["Physical constant", "Physical quantity", "Physical process", "Physical boundary"], "answer": 1, "explanation": "Mass, length, temperature, force, speed, work and time are examples of physical quantities.", "hack": "MEASURABLE = QUANTITY. Quantities are split into scalars and vectors."}, {"q": "Physical quantities are separated into two types, which are", "options": ["Scalars and tensors", "Vectors and matrices", "Scalars and vectors", "Units and dimensions"], "answer": 2, "explanation": "The notes divide quantities into scalars (magnitude only) and vectors (magnitude and direction).", "hack": "Only TWO types in this course: S and V."}, {"q": "A scalar quantity is completely described by its", "options": ["Direction alone", "Magnitude and direction", "Point of application", "Magnitude alone"], "answer": 3, "explanation": "A scalar needs only a number with a unit, for example 30 m/s.", "hack": "Scalar = Size only. 'S for Size, S for Scalar'."}, {"q": "Which of these is a scalar quantity?", "options": ["Density", "Torque", "Momentum", "Magnetic field"], "answer": 0, "explanation": "Length, time, density, charge, volume and work are scalars. Torque, momentum and magnetic field are vectors.", "hack": "Odd-one-out: if it has no direction (density), it is the scalar."}, {"q": "The numerical value of a scalar together with its unit is called its", "options": ["Direction", "Magnitude", "Resultant", "Dimension"], "answer": 1, "explanation": "For a car speed of 30 m/s, the 30 and the unit m/s together make the magnitude.", "hack": "Number + unit = magnitude."}, {"q": "A vector quantity needs which of the following for its complete description?", "options": ["Magnitude alone, with a unit", "Direction alone, with no size", "Both magnitude and direction", "A unit alone, with no value"], "answer": 2, "explanation": "A vector must state how big it is and which way it points.", "hack": "VECTOR = Value + Vector's direction (both)."}, {"q": "Which of these is a vector quantity?", "options": ["Volume", "Charge", "Work", "Acceleration"], "answer": 3, "explanation": "Momentum, force, torque, magnetic field, acceleration and velocity are vectors; volume, charge and work are scalars.", "hack": "Vectors: M-F-T-M-A-V (Momentum, Force, Torque, Magnetic field, Acceleration, Velocity)."}, {"q": "A force of 10 N applied vertically from above and the same force applied horizontally will", "options": ["Have different effects because the direction differs", "Have identical effects because the magnitude is the same", "Have no effect because forces are scalars", "Cancel each other out completely"], "answer": 0, "explanation": "A force is a vector, so its direction matters as well as its magnitude.", "hack": "Same size, different direction = different effect. Force is a vector."}, {"q": "A vector is represented graphically by an arrow whose length represents the", "options": ["Direction of the vector", "Magnitude of the vector", "Mass of the vector", "Time taken by the vector"], "answer": 1, "explanation": "Length = magnitude. The arrow head shows the direction.", "hack": "LENGTH = size; HEAD = direction."}, {"q": "In the vector AC, the point A is called the", "options": ["Terminal point", "Origin of the axes", "Initial point", "Resultant point"], "answer": 2, "explanation": "A is the starting (initial) point and C is the terminal point.", "hack": "A → C: tail = initial, head = terminal."}, {"q": "The magnitude of a vector a is written |a| and is", "options": ["Always negative", "Sometimes imaginary", "Always zero", "Always positive"], "answer": 3, "explanation": "The modulus of a vector is a length, so it cannot be negative.", "hack": "|a| ≥ 0 always."}, {"q": "A vector in three dimensions is written in components as", "options": ["A = Aₓi + A_y j + A_z k", "A = Aₓ + A_y + A_z", "A = Aₓ × A_y × A_z", "A = Aₓi × A_y j"], "answer": 0, "explanation": "i, j and k are unit vectors in the +x, +y and +z directions.", "hack": "Components go with i, j, k: three arrows added."}, {"q": "The unit vectors i, j and k point in the positive directions of", "options": ["The y, z and x planes", "The x, y and z axes", "The radial directions only", "The time axes"], "answer": 1, "explanation": "i is along +x, j along +y and k along +z, and each has magnitude 1.", "hack": "i-j-k = x-y-z, in alphabet order."}, {"q": "A position vector OP gives the position of a point P", "options": ["Relative to the Sun", "Relative to the previous point", "Relative to the origin O", "Without any reference"], "answer": 2, "explanation": "A fixed origin O is chosen and OP gives the location of P with respect to it.", "hack": "Position vector always starts at the ORIGIN."}, {"q": "A unit vector in the direction of A is defined by", "options": ["Â = A × |A|", "Â = |A|/A", "Â = A + |A|", "Â = A/|A|"], "answer": 3, "explanation": "A unit vector is the vector divided by its magnitude.", "hack": "Divide by its own length: it shrinks to size 1."}, {"q": "The magnitude of any unit vector is", "options": ["1", "0", "10", "Infinite"], "answer": 0, "explanation": "A unit vector gives only direction and has magnitude 1.", "hack": "UNIT = 1."}, {"q": "Any vector A can be written in terms of its unit vector as", "options": ["A = |A| + Â", "A = |A| Â", "A = Â/|A|", "A = |A|²Â"], "answer": 1, "explanation": "Magnitude times direction gives the vector back.", "hack": "Vector = size × direction."}, {"q": "A zero (null) vector is a vector which has", "options": ["Unit magnitude and any direction", "Zero magnitude and a fixed direction", "Zero magnitude and no specific direction", "Infinite magnitude and no direction"], "answer": 2, "explanation": "The position vector at the origin is a zero vector.", "hack": "Zero vector: nothing there, so no direction either."}, {"q": "Two vectors are said to be equal if they have", "options": ["The same magnitude but any direction", "The same direction but any magnitude", "The same initial point but any size", "The same magnitude and the same direction"], "answer": 3, "explanation": "Both magnitude and direction must agree.", "hack": "EQUAL = same size AND same direction."}, {"q": "Parallel (like) vectors are vectors which have", "options": ["The same direction, though not necessarily the same magnitude", "Opposite directions and the same magnitude", "The same magnitude and perpendicular directions", "The same initial point and the same terminal point"], "answer": 0, "explanation": "Parallel vectors point the same way, but their lengths may differ.", "hack": "Equal ⇒ parallel, but parallel ⇏ equal."}, {"q": "Two vectors acting in opposite directions are called", "options": ["Parallel (like) vectors", "Anti-parallel (unlike) vectors", "Orthogonal vectors", "Concurrent vectors"], "answer": 1, "explanation": "Anti-parallel vectors act in opposite directions.", "hack": "ANTI = opposite."}, {"q": "Vectors that have the same initial point are called", "options": ["Coplanar (same-plane) vectors", "Orthogonal (right-angle) vectors", "Concurrent (co-initial) vectors", "Null (zero-length) vectors"], "answer": 2, "explanation": "Co-initial vectors all start from one point.", "hack": "CO-INITIAL = same start."}, {"q": "Vectors lying in the same plane are called", "options": ["Concurrent vectors", "Orthogonal vectors", "Equal vectors", "Coplanar vectors"], "answer": 3, "explanation": "Coplanar means in the same plane.", "hack": "CO-PLANAR = same plane."}, {"q": "Two vectors are orthogonal when the angle between them is", "options": ["90°", "0°", "180°", "45°"], "answer": 0, "explanation": "Orthogonal means perpendicular.", "hack": "Orthogonal = 90° = right angle."}, {"q": "The negative of a vector is a vector with", "options": ["The same magnitude and the same direction", "The same magnitude but opposite direction", "Zero magnitude and the same direction", "Double magnitude and opposite direction"], "answer": 1, "explanation": "−A has the same length as A but points the other way.", "hack": "Minus sign = flip the arrow."}, {"q": "When two vectors are added, we must consider", "options": ["Only their magnitudes, as plain numbers", "Only their directions, not the sizes", "Both their magnitudes and their directions", "Only their initial points on the page"], "answer": 2, "explanation": "Adding vectors is not the same as adding their magnitudes, unless they are parallel.", "hack": "Vectors add as ARROWS, not as plain numbers."}, {"q": "The triangle law of vector addition states that if two vectors are represented by two sides of a triangle taken in order, their resultant is", "options": ["The longest side taken in the same order", "The sum of the lengths of the two sides", "Always zero", "The third side taken in the opposite order"], "answer": 3, "explanation": "Draw a, then b from the end of a, and join the beginning of a to the end of b.", "hack": "HEAD-TO-TAIL: resultant goes from first tail to last head."}, {"q": "The parallelogram law says that the resultant of two vectors with a common initial point is represented by", "options": ["The diagonal of the parallelogram through that point", "The shorter side of the parallelogram itself", "The perpendicular drawn from the common point", "The area enclosed by the parallelogram sides"], "answer": 0, "explanation": "The two vectors are adjacent sides, and the diagonal from the common point is the resultant.", "hack": "Parallelogram: tail-to-tail, resultant is the DIAGONAL."}, {"q": "The law of polygon of vector addition says that the resultant of several vectors is represented by", "options": ["The first side of the polygon taken alone", "The closing side of the polygon taken in the opposite order", "The largest side of the polygon in length", "The total perimeter of the whole polygon"], "answer": 1, "explanation": "Place the vectors head-to-tail; the closing side from the start to the end is R = A + B + C + D.", "hack": "Polygon: chain them head-to-tail, close the shape = resultant."}, {"q": "In component form, A + B equals", "options": ["(Aₓ × Bₓ)i + (A_y × B_y)j + (A_z × B_z)k", "(Aₓ − Bₓ)i + (A_y − B_y)j + (A_z − B_z)k", "(Aₓ + Bₓ)i + (A_y + B_y)j + (A_z + B_z)k", "(Aₓ + A_y + A_z)(Bₓ + B_y + B_z)"], "answer": 2, "explanation": "Add the matching components.", "hack": "Add i-with-i, j-with-j, k-with-k."}, {"q": "In component form, A − B equals", "options": ["(Aₓ + Bₓ)i + (A_y + B_y)j + (A_z + B_z)k", "(Bₓ − Aₓ)i + (B_y − A_y)j + (B_z − A_z)k", "(Aₓ − B_z)i + (A_y − B_y)j + (A_z − Bₓ)k", "(Aₓ − Bₓ)i + (A_y − B_y)j + (A_z − B_z)k"], "answer": 3, "explanation": "Subtract the matching components, A first.", "hack": "Subtraction order matters: A − B ≠ B − A."}, {"q": "The scalar (dot) product of A and B is", "options": ["A·B = AₓBₓ + A_yB_y + A_zB_z", "A·B = AₓBₓi + A_yB_yj + A_zB_zk", "A·B = (A_y B_z − A_z B_y)i + …", "A·B = |A||B| sin θ"], "answer": 0, "explanation": "The dot product is a number (scalar), found by multiplying matching components and adding.", "hack": "DOT = a plain NUMBER. Multiply like components, then add."}, {"q": "The dot product of A and B can also be written as", "options": ["AB sin θ", "AB cos θ", "AB tan θ", "A/B cos θ"], "answer": 1, "explanation": "θ is the angle between the two vectors.", "hack": "DOT goes with COS: 'D-C' (Dot–Cos)."}, {"q": "The dot product of two perpendicular vectors is", "options": ["One", "Equal to AB", "Zero", "Infinite"], "answer": 2, "explanation": "cos 90° = 0, so A·B = 0.", "hack": "Perpendicular ⇒ dot product = 0."}, {"q": "Which is correct for the unit vectors?", "options": ["i·i = 0 and i·j = 1", "i·i = 0 and i·j = 0", "i·i = 1 and i·j = 1", "i·i = 1 and i·j = 0"], "answer": 3, "explanation": "A unit vector dotted with itself is 1; with a perpendicular unit vector it is 0.", "hack": "Same letters: 1. Different letters: 0."}, {"q": "The vector (cross) product of A and B has magnitude", "options": ["AB sin θ", "AB cos θ", "AB tan θ", "A + B sin θ"], "answer": 0, "explanation": "|A × B| = |A||B| sin θ.", "hack": "CROSS goes with SIN: 'C-S' (Cross–Sin)."}, {"q": "The result of a cross product A × B is", "options": ["A scalar", "A vector", "A unit of length", "A pure number"], "answer": 1, "explanation": "A × B is a vector perpendicular to both A and B.", "hack": "Cross = Vector, Dot = scalar (the dot is a small point: a number)."}, {"q": "The direction of A × B is given by", "options": ["The left-hand rule only", "The direction of A", "The right-hand rule", "The direction of B"], "answer": 2, "explanation": "Index finger along A, middle finger along B, thumb gives A × B.", "hack": "Right hand: index = A, middle = B, thumb = A × B."}, {"q": "The unit-vector cross products are given by", "options": ["i × j = 1 and j × k = 1", "i × j = 0 and j × k = 0", "i × i = k and j × j = i", "i × j = k and j × k = i"], "answer": 3, "explanation": "Perpendicular unit vectors give the third unit vector. A unit vector crossed with itself gives zero.", "hack": "Cyclic order i→j→k→i gives plus. Same letters give zero."}, {"q": "A × A for any vector A is", "options": ["The zero vector", "The unit vector", "A²", "A scalar equal to |A|"], "answer": 0, "explanation": "sin 0° = 0, so a vector crossed with itself (or any parallel vector) gives zero.", "hack": "Parallel vectors: cross product = 0, dot product = maximum."}, {"q": "The process of splitting a vector into components is called", "options": ["Resultant of the vector", "Resolution of the vector", "Inversion of the vector", "Rotation of the vector"], "answer": 1, "explanation": "If the components are along two perpendicular directions they are called rectangular components.", "hack": "RESOLVE = split. RESULTANT = combine."}, {"q": "A vector R at angle θ to the x-axis has x-component", "options": ["R sin θ", "R tan θ", "R cos θ", "R / cos θ"], "answer": 2, "explanation": "Rₓ = R cos θ and R_y = R sin θ.", "hack": "x pairs with cos when θ is measured from the x-axis."}, {"q": "A vector R at angle θ to the x-axis has y-component", "options": ["R cos θ", "R tan θ", "R / sin θ", "R sin θ"], "answer": 3, "explanation": "R_y = R sin θ.", "hack": "y pairs with sin when θ is measured from the x-axis."}, {"q": "The magnitude of a resultant with components Rₓ and R_y is", "options": ["R = √(Rₓ² + R_y²)", "R = Rₓ + R_y", "R = Rₓ² + R_y²", "R = √(Rₓ² − R_y²)"], "answer": 0, "explanation": "It follows from Pythagoras' theorem.", "hack": "Square, add, then square-root."}, {"q": "The angle φ of a resultant with the x-axis satisfies", "options": ["tan φ = Rₓ/R_y", "tan φ = R_y/Rₓ", "sin φ = R_y Rₓ", "cos φ = R_y/Rₓ"], "answer": 1, "explanation": "tan φ = opposite/adjacent = R_y/Rₓ.", "hack": "TOA: tan = y over x."}, {"q": "In the cosine rule for the resultant of two vectors a and b with angle α between them (tail to tail), R² equals", "options": ["a² + b² − 2ab cos α", "a² − b² + 2ab cos α", "a² + b² + 2ab cos α", "a + b + 2ab cos α"], "answer": 2, "explanation": "For two vectors with a common initial point, the resultant magnitude is given by R² = a² + b² + 2ab cos α.", "hack": "Tail-to-tail angle: PLUS 2ab cos α. (Triangle-side angle uses minus.)"}, {"q": "Newton's first law in this chapter defines force as", "options": ["The internal energy that every body possesses at rest", "The mass of a body multiplied by its own speed", "The distance that a body travels in every second", "The external agency that changes a body's state of rest or motion"], "answer": 3, "explanation": "A body continues at rest or uniform motion in a straight line unless compelled by an external agency, which is called force.", "hack": "FORCE = what breaks the first law's laziness."}, {"q": "A boat floats at rest because its weight and the upward buoyant force are", "options": ["Equal and opposite, so the resultant is zero", "Equal and in the same direction", "Both zero, because water has no force", "Unequal, so the boat sinks slowly"], "answer": 0, "explanation": "Equal and opposite forces give a zero resultant, so the boat does not accelerate (Newton's first law).", "hack": "Floating = weight balanced by buoyancy = resultant 0."}, {"q": "If the water beneath a floating boat were suddenly removed, the boat would", "options": ["Remain at rest", "Accelerate downward", "Accelerate upward", "Move sideways at constant speed"], "answer": 1, "explanation": "A non-zero resultant (weight only) acts, so the boat accelerates downward.", "hack": "Remove the support force → resultant ≠ 0 → acceleration."}, {"q": "Newton's second law in this chapter, F = ma, follows from", "options": ["Force being proportional to the velocity", "Force being equal to the energy of a body", "Force being proportional to the rate of change of momentum", "Force being proportional to the distance travelled"], "answer": 2, "explanation": "F ∝ rate of change of momentum = m × rate of change of velocity = ma when the mass is constant.", "hack": "F ∝ Δ(mv)/Δt → F = ma (constant mass)."}, {"q": "According to Newton's third law, in a pair of interacting objects the forces are", "options": ["Equal in size and opposite in direction, acting on the same object", "Unequal in size and in the same direction", "Equal in size and in the same direction", "Equal in size and opposite in direction, acting on the two different objects"], "answer": 3, "explanation": "Forces always come in action–reaction pairs, one on each object.", "hack": "A pair needs TWO objects. They never cancel each other."}, {"q": "The force which produces unit acceleration in a body of mass 1 kg is", "options": ["One newton", "One joule", "One watt", "One pascal"], "answer": 0, "explanation": "From F = ma with m = 1 kg and a = 1 m/s², F = 1 N.", "hack": "1 N = 1 kg × 1 m/s²."}, {"q": "Which of the following is NOT one of the four characteristics needed to specify a force completely?", "options": ["Magnitude", "Temperature of application", "Point of application", "Line of action"], "answer": 1, "explanation": "The four are magnitude, point of application, line of action and direction.", "hack": "Four things: size, where it acts, along which line, which way."}, {"q": "An interaction between two objects requires", "options": ["A single force acting on one object", "A change in the masses of the objects", "A pair of forces acting on the two objects", "No force at all"], "answer": 2, "explanation": "In every interaction there is a pair of forces, one on each object. Pushing a wall gives a push from the wall on you.", "hack": "Interaction = TWO forces on TWO objects."}, {"q": "In Newton's third law, the equal and opposite forces exist", "options": ["Only if the objects have equal masses", "Only if the objects are moving", "Only if the objects are small", "Regardless of the mass or size of the objects"], "answer": 3, "explanation": "The notes say in all interactions, regardless of mass or size.", "hack": "A bug and a windscreen feel EQUAL forces."}, {"q": "The magnitude of the vector 3i + 4j is", "options": ["5", "7", "12", "1"], "answer": 0, "explanation": "√(3² + 4²) = √25 = 5.", "hack": "3-4-5 triangle."}, {"q": "The unit vector in the direction of 3i + 4j is", "options": ["3i + 4j", "0.6i + 0.8j", "0.8i + 0.6j", "0.3i + 0.4j"], "answer": 1, "explanation": "Divide by the magnitude 5: (3/5)i + (4/5)j.", "hack": "Divide each component by 5, NOT by 10."}, {"q": "A force of 10 N acts at 30° above the x-axis. Its x-component and y-component are", "options": ["5.00 N and 8.66 N", "10 N and 30 N", "8.66 N and 5.00 N", "3.00 N and 10 N"], "answer": 2, "explanation": "Fₓ = 10 cos 30° = 8.66 N and F_y = 10 sin 30° = 5.00 N.", "hack": "30° from the x-axis: the x part is the BIG one (cos 30° = 0.866)."}, {"q": "Two vectors of magnitudes 4 and 5 have an angle of 60° between them. Their dot product is", "options": ["20", "17.3", "9", "10"], "answer": 3, "explanation": "A·B = AB cos 60° = 4 × 5 × 0.5 = 10.", "hack": "cos 60° = ½, so half of 20."}, {"q": "Two vectors of magnitudes 4 and 5 have an angle of 30° between them. The magnitude of their cross product is", "options": ["10", "17.3", "20", "9"], "answer": 0, "explanation": "|A × B| = AB sin 30° = 4 × 5 × 0.5 = 10.", "hack": "sin 30° = ½."}, {"q": "If A = 2i + 3j and B = i − j, then A + B is", "options": ["i + 4j", "3i + 2j", "3i + 4j", "2i + 3j"], "answer": 1, "explanation": "Add components: (2 + 1)i + (3 − 1)j = 3i + 2j.", "hack": "i with i, j with j."}, {"q": "If A = 2i + 3j and B = i − j, then A − B is", "options": ["3i + 2j", "i − 2j", "i + 4j", "−i − 4j"], "answer": 2, "explanation": "Subtract components: (2 − 1)i + (3 − (−1))j = i + 4j. Subtracting a negative adds.", "hack": "Watch the double negative: 3 − (−1) = 4."}, {"q": "If A = 2i + 3j and B = i − j, then A·B is", "options": ["5", "1", "2", "−1"], "answer": 3, "explanation": "A·B = (2)(1) + (3)(−1) = 2 − 3 = −1.", "hack": "Multiply like components then add: 2 + (−3)."}], "tutorial": [{"q": "Which statement correctly defines scalar and vector quantities?", "options": ["A scalar has magnitude only (e.g. mass, time); a vector has magnitude and direction (e.g. force, velocity)", "A scalar has magnitude and direction (e.g. mass, time); a vector has magnitude only (e.g. force, velocity)", "A scalar has direction only (e.g. force, velocity); a vector has magnitude only (e.g. mass, time)", "A scalar is any quantity with a unit (e.g. mass, force); a vector is any quantity without a unit (e.g. time, velocity)"], "answer": 0, "explanation": "Scalars are completely described by a number and unit; vectors also need a direction.", "hack": "SCALAR = Size only (mass, time). VECTOR = Value + direction (force, velocity).", "src": "Problem 5.1"}, {"q": "The volume of a petrol tank is a", "options": ["Vector", "Scalar", "Unit vector", "Zero vector"], "answer": 1, "explanation": "Volume has only magnitude.", "hack": "Volume, area, length, work = scalars.", "src": "Problem 5.2(a)"}, {"q": "A length measured in metres (or in miles) is a", "options": ["Vector", "Unit vector", "Scalar", "Null vector"], "answer": 2, "explanation": "Length has magnitude only. (Displacement, which has direction, would be a vector.)", "hack": "LENGTH = scalar. DISPLACEMENT = vector. Changing units does not change the type.", "src": "Problem 5.2(b,c)"}, {"q": "The angular velocity of a flywheel is a", "options": ["Scalar", "Zero vector", "Unit scalar", "Vector"], "answer": 3, "explanation": "Angular velocity has a magnitude and a direction (along the axis of rotation).", "hack": "Anything called 'velocity' is a vector.", "src": "Problem 5.2(d)"}, {"q": "The relative velocity of two aircraft is a", "options": ["Vector", "Scalar", "Zero scalar", "Unit scalar"], "answer": 0, "explanation": "Velocity, relative or not, has direction.", "hack": "RELATIVE VELOCITY: still a velocity, so vector.", "src": "Problem 5.2(e)"}, {"q": "The work done by a force is a", "options": ["Vector", "Scalar", "Unit vector", "Cross product"], "answer": 1, "explanation": "Work is a dot product of force and displacement, which is a scalar.", "hack": "Work = F·d (dot = scalar).", "src": "Problem 5.2(f)"}, {"q": "Electrostatic potential and the area of a classroom are both", "options": ["Vectors", "Unit vectors", "Scalars", "One scalar and one vector"], "answer": 2, "explanation": "Both have magnitude only.", "hack": "Potential, area, volume = scalars.", "src": "Problem 5.2(g,h)"}, {"q": "Given A = 3i + 7j + k and C = 2i − 3j + 2k, find A + C.", "options": ["i + 10j − k", "5i + 10j + 3k", "6i − 21j + 2k", "5i + 4j + 3k"], "answer": 3, "explanation": "Add matching components: (3 + 2)i + (7 − 3)j + (1 + 2)k = 5i + 4j + 3k.", "hack": "i with i, j with j, k with k.", "src": "Problem 5.3(a)"}, {"q": "Given A = 3i + 7j + k and B = 4i + 2j − 4k, find A·B.", "options": ["22", "30", "−30", "14"], "answer": 0, "explanation": "A·B = (3)(4) + (7)(2) + (1)(−4) = 12 + 14 − 4 = 22.", "hack": "Dot product gives a number. Multiply like components, add: 12 + 14 − 4.", "src": "Problem 5.3(b)"}, {"q": "Given A = 3i + 7j + k and B = 4i + 2j − 4k, find A × B.", "options": ["−30i − 16j − 22k", "−30i + 16j − 22k", "30i + 16j + 22k", "−30i + 16j + 22k"], "answer": 1, "explanation": "i: 7(−4) − 1(2) = −30. j: −[3(−4) − 1(4)] = 16. k: 3(2) − 7(4) = −22.", "hack": "Determinant: the middle (j) term carries a MINUS sign in front.", "src": "Problem 5.3(c)"}, {"q": "Given A = 3i + 7j + k and C = 2i − 3j + 2k, find 3A + C.", "options": ["9i + 21j + 3k", "11i + 18j + 3k", "11i + 18j + 5k", "5i + 4j + 3k"], "answer": 2, "explanation": "3A = 9i + 21j + 3k. Add C: (9 + 2)i + (21 − 3)j + (3 + 2)k = 11i + 18j + 5k.", "hack": "Multiply by 3 first, THEN add C.", "src": "Problem 5.3(d)"}, {"q": "Given A = 3i + 7j + k, B = 4i + 2j − 4k and C = 2i − 3j + 2k, find (A × B) × C.", "options": ["−34i − 16j + 58k", "34i + 16j − 58k", "−96i + 40j + 8k", "−34i + 16j + 58k"], "answer": 3, "explanation": "A × B = −30i + 16j − 22k. Then (−30, 16, −22) × (2, −3, 2): i: 16(2) − (−22)(−3) = −34; j: −[(−30)(2) − (−22)(2)] = 16; k: (−30)(−3) − 16(2) = 58. (The notes' 'A×B×C' is read here as (A×B)×C, since the order of the cross products matters.)", "hack": "Do the first cross product completely before the second. Cross products are not associative.", "src": "Problem 5.3(e)"}, {"q": "Four coplanar forces act at point O: 80 N along +x; 90 N at 45° above +x; 100 N at 30° above the −x axis; 160 N at 20° below the −x axis. What is the magnitude of the resultant, to two significant figures?", "options": ["110 N", "58 N", "93 N", "160 N"], "answer": 0, "explanation": "Rₓ = -93.3 N and R_y = 58.9 N, so R = √(Rₓ² + R_y²) = 110.4 N ≈ 110 N (1.1 × 10² N).", "hack": "Resolve each force, add all x, add all y, then Pythagoras. Left-pointing forces have negative x.", "src": "Problem 5.4"}, {"q": "For the four forces in Problem 5.4, the resultant (Rₓ = −93.3 N, R_y = +58.9 N) points in which quadrant, at about what angle from +x?", "options": ["First quadrant, about 32° from +x", "Second quadrant, about 148° from +x", "Third quadrant, about 212° from +x", "Fourth quadrant, about 328° from +x"], "answer": 1, "explanation": "Rₓ is negative and R_y is positive, so the resultant lies in the second quadrant: θ = 180° − tan⁻¹(58.9/93.3) = 147.7°.", "hack": "Signs tell the quadrant: x negative, y positive = up-left.", "src": "Problem 5.4"}, {"q": "Three forces are F₁ = (20i − 36j + 73k) N, F₂ = (−17i + 21j − 46k) N and F₃ = (−12k) N. What is the resultant vector?", "options": ["(3i − 15j + 27k) N", "(37i − 57j + 119k) N", "(3i − 15j + 15k) N", "(3i + 15j − 15k) N"], "answer": 2, "explanation": "i: 20 − 17 = 3. j: −36 + 21 = −15. k: 73 − 46 − 12 = 15.", "hack": "Add each axis separately. Don't forget F₃'s −12k in the k column.", "src": "Problem 5.5"}, {"q": "What is the magnitude of the resultant (3i − 15j + 15k) N, to two significant figures?", "options": ["33 N", "15 N", "459 N", "21 N"], "answer": 3, "explanation": "R = √(3² + 15² + 15²) = √459 = 21.4 N ≈ 21 N. (459 is R² before the square root.)", "hack": "Three components under the root, then take the root.", "src": "Problem 5.5"}, {"q": "If A = 7i − 6j, B = −3i + 12j and C = 4i − 4j, find A + B + C.", "options": ["8i + 2j", "14i + 2j", "8i − 22j", "8i + 10j"], "answer": 0, "explanation": "i: 7 − 3 + 4 = 8. j: −6 + 12 − 4 = 2.", "hack": "Column by column: i column, then j column.", "src": "Problem 5.6(a)"}, {"q": "If A = 7i − 6j and B = −3i + 12j, find A − B.", "options": ["4i + 6j", "10i − 18j", "−10i + 18j", "10i + 6j"], "answer": 1, "explanation": "i: 7 − (−3) = 10. j: −6 − 12 = −18.", "hack": "Minus a negative becomes plus: 7 − (−3) = 10.", "src": "Problem 5.6(b)"}, {"q": "If A = 7i − 6j and C = 4i − 4j, find A − C.", "options": ["11i − 10j", "3i − 10j", "3i − 2j", "−3i + 2j"], "answer": 2, "explanation": "i: 7 − 4 = 3. j: −6 − (−4) = −2.", "hack": "Subtract each component; −6 − (−4) = −2, not −10.", "src": "Problem 5.6(c)"}, {"q": "If A = 3i − 2j + k, the unit vector in the direction of A is", "options": ["(3i − 2j + k)/14", "(3i − 2j + k)/6", "(3i + 2j + k)/√14", "(3i − 2j + k)/√14"], "answer": 3, "explanation": "|A| = √(9 + 4 + 1) = √14 = 3.74, so Â = (3i − 2j + k)/√14 = 0.802i − 0.535j + 0.267k.", "hack": "Magnitude = √(sum of squares) = √14 (not 14). Divide every component by it.", "src": "Problem 5.7"}], "exercises": [{"q": "For A = 3i + 7j + 3k and B = 5i + 2j + 4k, what is A·B?", "options": ["41", "15", "−21", "34"], "answer": 0, "explanation": "A·B = (3)(5) + (7)(2) + (3)(4) = 15 + 14 + 12 = 41.", "hack": "Dot: multiply like components and add: 15 + 14 + 12.", "src": "Example 5.1(a)"}, {"q": "For A = 3i + 7j + 3k and B = 5i + 2j + 4k, what is A × B?", "options": ["22i − 3j − 29k", "22i + 3j − 29k", "−22i + 3j + 29k", "41i + 3j − 29k"], "answer": 1, "explanation": "i: 7(4) − 3(2) = 22. j: −[3(4) − 3(5)] = 3. k: 3(2) − 7(5) = −29.", "hack": "j-term has a leading minus: −(12 − 15) = +3.", "src": "Example 5.1(b)"}, {"q": "For A = 3i + 7j + 3k and C = 4i − 3j + 2k, what is A × C?", "options": ["23i − 6j − 37k", "5i + 6j − 37k", "23i + 6j − 37k", "−23i + 6j + 37k"], "answer": 2, "explanation": "i: 7(2) − 3(−3) = 23. j: −[3(2) − 3(4)] = 6. k: 3(−3) − 7(4) = −37.", "hack": "Careful with signs: 14 + 9 = 23 and −9 − 28 = −37.", "src": "Example 5.1(c)"}, {"q": "For A = 3i + 7j + 3k, B = 5i + 2j + 4k and C = 4i − 3j + 2k, what is (A × C)·B?", "options": ["21", "41", "−37", "−21"], "answer": 3, "explanation": "A × C = 23i + 6j − 37k. Dot with B: 23(5) + 6(2) + (−37)(4) = 115 + 12 − 148 = −21.", "hack": "Cross first, then dot. The result is a NUMBER (scalar), not a vector.", "src": "Example 5.1(c)"}, {"q": "Five coplanar forces act on an object: 19 N along +x; 15 N at 60°; 28 N at 135°; 20 N at 210°; 22 N along −y. What is the x-component of the resultant?", "options": ["−10.6 N", "+10.6 N", "−0.8 N", "+0.8 N"], "answer": 0, "explanation": "Rₓ = 19 + 15 cos 60° + 28 cos 135° + 20 cos 210° = 19 + 7.5 − 19.8 − 17.3 = -10.6 N.", "hack": "cos is negative in quadrants 2 and 3 (135°, 210°).", "src": "Example 5.2"}, {"q": "For the same five forces, what is the y-component of the resultant?", "options": ["−0.8 N", "+0.8 N", "+10.6 N", "−10.6 N"], "answer": 1, "explanation": "R_y = 0 + 15 sin 60° + 28 sin 135° + 20 sin 210° − 22 = 13.0 + 19.8 − 10.0 − 22 = 0.8 N.", "hack": "The 22 N force is straight down (−y) and has no x-component.", "src": "Example 5.2"}, {"q": "For the five forces (Rₓ = −10.6 N, R_y = 0.8 N), what are the magnitude and direction of the resultant?", "options": ["10.6 N at 4.3° from the +x axis", "10.6 N at 184.3° from the +x axis", "10.6 N at 175.7° from the +x axis", "0.8 N at 175.7° from the +x axis"], "answer": 2, "explanation": "R = √(10.6² + 0.8²) ≈ 10.6 N. φ = tan⁻¹(0.8/10.6) = 4.3°, and since Rₓ < 0 and R_y > 0, θ = 180° − 4.3° = 175.7°.", "hack": "Find the small reference angle first, then place it in the correct quadrant: 180° − 4.3°.", "src": "Example 5.2"}, {"q": "In the parallelogram law (Example 5.3), forces of 4 units and 3 units act at A along AB and AC. Which line represents their resultant?", "options": ["The side BD of the parallelogram", "The side AB of the parallelogram", "The side CD of the parallelogram", "The diagonal AD of the parallelogram"], "answer": 3, "explanation": "The two forces are adjacent sides AB and AC; the diagonal AD through A represents the resultant in magnitude and direction.", "hack": "Resultant = the DIAGONAL starting from the common point.", "src": "Example 5.3"}]}, {"chapter": 6, "title": "Rotational Motion", "concept": [{"q": "Rotational motion is best described as motion of a body", "options": ["Along a straight line only", "Under gravity alone, falling", "Around a fixed axis or point", "Without any force acting"], "answer": 2, "explanation": "Every point of the object moves in a circular path around the axis, at different distances from the centre.", "hack": "ROTATE = go ROUND an axis."}, {"q": "Which of these is an example of rotational motion?", "options": ["A stone dropped from a cliff", "A bullet fired horizontally", "A box sliding down a slope", "The blades of an electric fan"], "answer": 3, "explanation": "Fan blades, spinning tops, planets on their axes and car wheels all rotate about an axis.", "hack": "If it SPINS on an axis (fan, top, wheel) it is rotational."}, {"q": "In rotational motion, points on the object at different distances from the axis move in", "options": ["Circular paths of different radii", "Straight lines of equal length", "Parabolic paths of equal height", "Circular paths of equal radius"], "answer": 0, "explanation": "Each point goes round the axis in its own circle; points farther out trace larger circles.", "hack": "Same axis, different circles: far points travel farther."}, {"q": "Angular displacement can be expressed in", "options": ["Radians only, never degrees", "Radians, degrees or revolutions", "Metres, feet or kilometres", "Newtons, joules or watts"], "answer": 1, "explanation": "The notes list radians, degrees and revolutions as units of angular position.", "hack": "Angle units: RAD, DEG, REV."}, {"q": "One complete revolution is equal to", "options": ["180° or π rad", "90° or π/2 rad", "360° or 2π rad", "57.3° or 1 rad"], "answer": 2, "explanation": "1 rev = 360° = 2π rad.", "hack": "FULL TURN = 2π. Half turn = π."}, {"q": "One radian is approximately equal to", "options": ["360 degrees", "3.14 degrees", "6.28 degrees", "57.3 degrees"], "answer": 3, "explanation": "1 rad = 180°/π ≈ 57.3°.", "hack": "360° ÷ 6.28 = 57.3°."}, {"q": "A radian is the angle subtended at the centre of a circle by an arc that is", "options": ["Equal in length to the radius", "Equal in length to the diameter", "Equal in length to the circumference", "Half the length of the radius"], "answer": 0, "explanation": "When arc length = radius, the angle is exactly 1 rad.", "hack": "ARC = RADIUS means 1 radian."}, {"q": "The angle θ in radians is given in terms of arc length l and radius r by", "options": ["θ = l × r", "θ = l / r", "θ = r / l", "θ = l / r²"], "answer": 1, "explanation": "θ = arc length ÷ radius.", "hack": "Think 'arc over radius'. Long arc, same radius = bigger angle."}, {"q": "The radian is a", "options": ["Unit of length", "Unit of time", "Dimensionless number", "Unit of force"], "answer": 2, "explanation": "θ = l/r is a length divided by a length, so the dimensions cancel.", "hack": "m ÷ m = no dimensions."}, {"q": "An arc of length 3 m on a circle of radius 1.5 m subtends an angle of", "options": ["4.5 rad", "0.5 rad", "1.5 rad", "2 rad"], "answer": 3, "explanation": "θ = l/r = 3 ÷ 1.5 = 2 rad.", "hack": "Divide arc by radius."}, {"q": "Three complete revolutions correspond to an angle of", "options": ["6π rad", "3π rad", "3 rad", "9π rad"], "answer": 0, "explanation": "3 × 2π = 6π rad ≈ 18.85 rad.", "hack": "Each turn is 2π, so multiply by the number of turns."}, {"q": "Angular position describes", "options": ["The rate at which a body spins", "The orientation of a line relative to a fixed direction", "The mass distribution of a body", "The force needed to turn a body"], "answer": 1, "explanation": "It shows how far an object has rotated from a reference (zero) angle.", "hack": "Position = 'where it is pointing', not 'how fast'."}, {"q": "Angular velocity is the", "options": ["Rate of change of linear speed with time", "Product of torque and angular position", "Rate of change of angular position with time", "Change in moment of inertia with time"], "answer": 2, "explanation": "ω = dθ/dt = Δθ/Δt.", "hack": "Angular velocity = angle per second."}, {"q": "The SI unit of angular velocity is", "options": ["Metres per second", "Radians per second squared", "Newton metres", "Radians per second"], "answer": 3, "explanation": "ω is measured in rad/s.", "hack": "Velocity unit has one 'per second'."}, {"q": "Angular acceleration is the", "options": ["Rate of change of angular velocity", "Rate of change of angular position only", "Rate of change of linear position", "Product of force and distance"], "answer": 0, "explanation": "α = dω/dt; it says how fast the spinning speeds up or slows down.", "hack": "α comes from ω the way a comes from v."}, {"q": "The SI unit of angular acceleration is", "options": ["rad/s", "rad/s²", "N·m", "kg·m²"], "answer": 1, "explanation": "α = Δω/Δt, so its unit is (rad/s)/s = rad/s².", "hack": "Acceleration always carries 'per second squared'."}, {"q": "The rotational kinetic energy of a body is given by", "options": ["½mv²", "Iω", "½Iω²", "τθ²"], "answer": 2, "explanation": "K = ½ I ω², where I is the moment of inertia and ω the angular velocity.", "hack": "Replace m with I and v with ω in ½mv²."}, {"q": "A body with I = 2 kg·m² spins at ω = 3 rad/s. Its rotational kinetic energy is", "options": ["18 J", "6 J", "12 J", "9 J"], "answer": 3, "explanation": "K = ½Iω² = ½ × 2 × 9 = 9 J.", "hack": "Square ω first (9), then take half of I (1)."}, {"q": "The rotational analogue of linear displacement is", "options": ["Angular displacement", "Angular momentum", "Moment of inertia", "Torque"], "answer": 0, "explanation": "The notes pair θ with linear displacement.", "hack": "Pairs: θ↔x, ω↔v, α↔a, τ↔F, I↔m."}, {"q": "The rotational analogue of mass is the", "options": ["Torque", "Moment of inertia", "Angular velocity", "Angular momentum"], "answer": 1, "explanation": "I plays the same role for rotation that m plays for straight-line motion.", "hack": "I = rotational 'mass'."}, {"q": "The rotational analogue of force is", "options": ["Angular velocity", "Moment of inertia", "Torque", "Angular displacement"], "answer": 2, "explanation": "Torque causes angular acceleration just as force causes linear acceleration.", "hack": "τ = 'twisting force'."}, {"q": "In rotational motion, the centripetal force on a point is directed", "options": ["Away from the axis of rotation", "Along the direction of rotation", "Opposite to the direction of rotation", "Toward the axis of rotation"], "answer": 3, "explanation": "Centripetal force pulls points toward the axis.", "hack": "CENTRI-PETAL = centre-SEEKING."}, {"q": "The tangential force on a rotating body causes", "options": ["Angular acceleration", "Constant angular velocity", "Zero net torque", "Rotational equilibrium"], "answer": 0, "explanation": "A push along the circular path speeds up or slows down the spinning.", "hack": "Tangential = along the path = changes the spin rate."}, {"q": "Torque is best described as the", "options": ["Resistance of an object to being rotated", "Tendency of a force to rotate an object about an axis", "Rate at which an object rotates", "Energy stored in a rotating object"], "answer": 1, "explanation": "Torque is the rotational effect of a force, often called a 'rotational force'.", "hack": "Torque = turning effect."}, {"q": "The torque produced by a force F at lever arm r and angle θ is", "options": ["τ = rF cosθ", "τ = r/F", "τ = rF sinθ", "τ = F/(r sinθ)"], "answer": 2, "explanation": "θ is the angle between the force and the lever arm.", "hack": "TORQUE = r F SIN. The angle must be between r and F."}, {"q": "When the force is perpen
