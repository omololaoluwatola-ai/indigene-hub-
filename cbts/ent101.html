<style>
:root{
  --bg:#120a07; --bg2:#1a0f0a; --card:#1c110b; --line:#4a2a17;
  --fire:#ff6a1a; --fire2:#d4400f; --gold:#ffb347; --text:#f3e7dc; --mute:#b49a88;
  --ok:#2ecc71; --okbg:rgba(46,204,113,.12); --bad:#ff4d4d; --badbg:rgba(255,77,77,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#3a1a0b 0%,var(--bg) 55%) fixed;
  color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh;
  padding:20px 16px 40px;line-height:1.5;
}
#app{max-width:720px;margin:0 auto}
h1.brand{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--fire);text-align:center;
  letter-spacing:.08em;font-size:2.1rem;margin:8px 0 6px;text-shadow:0 0 18px rgba(255,106,26,.35)}
.sub{font-family:'Orbitron',sans-serif;text-align:center;color:var(--mute);font-size:.9rem;letter-spacing:.06em;margin:0 0 20px}
.panel{background:linear-gradient(180deg,var(--card),#150c08);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
.panel h2{font-family:'Orbitron',sans-serif;color:var(--gold);text-align:center;font-size:1.35rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run{background:#150c08;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer;transition:.15s}
.run .n{display:block;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold);font-size:1.5rem;margin-bottom:2px}
.run.sel{background:linear-gradient(135deg,var(--fire),var(--fire2));border-color:var(--gold);box-shadow:0 0 16px rgba(255,106,26,.35)}
.run.sel .n{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;cursor:pointer;
  background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-family:'Exo 2',sans-serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.03em;box-shadow:0 8px 22px rgba(255,106,26,.28)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#150c08;border:1px solid var(--line);color:var(--text);box-shadow:none}
.foot{color:var(--mute);text-align:center;font-size:.92rem;margin-top:16px}
.chaps{margin-top:14px;display:none}
.chaps.show{display:block}
.chaps .tools{display:flex;gap:8px;margin-bottom:8px}
.chaps .tools button{flex:1;background:#150c08;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;font-weight:600;cursor:pointer}
.chap{display:flex;align-items:center;gap:10px;background:#150c08;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.chap.on{border-color:var(--gold);background:#24140c}
.chap .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#000}
.chap.on .box{background:var(--gold);border-color:var(--gold)}
.chap .nm{flex:1;font-size:.98rem}
.chap .ct{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.85rem}

/* progress + sections */
.secs{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px 4px}
.sec{border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:20px;padding:5px 11px;font-size:.82rem;cursor:pointer;font-family:inherit}
.sec.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
details.cres{border:1px solid var(--line);background:#150c08;border-radius:14px;margin-top:10px}
details.cres>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.cres>summary::-webkit-details-marker{display:none}
.cres .sr,.revise .sr{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.cres .sr{padding:8px 14px;border-top:1px solid var(--line)}
.revise{border:1px solid var(--bad);background:var(--badbg);border-radius:14px;padding:12px 14px;margin-top:14px}
.revise .sr{padding:6px 0}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--mute);margin-bottom:8px}
.top .sc{font-family:'Orbitron',sans-serif;font-size:.85rem}
.top .sc b.g{color:var(--ok)} .top .sc b.r{color:var(--bad)}
.bar{height:6px;background:#2a170d;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .25s}
.chtag{display:inline-block;font-size:.78rem;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);
  color:var(--text);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-family:inherit;font-size:1.02rem;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#2a170d;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem}
.opt:not(.locked):hover{border-color:var(--fire)}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .l{background:var(--ok);color:#001a0a}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#2a0000}
.fb{border:1px solid var(--line);border-left:4px solid var(--gold);background:#1a0f0a;border-radius:12px;padding:12px 14px;margin-top:6px}
.fb .v{font-weight:700;margin-bottom:6px}
.fb .v.ok{color:var(--ok)} .fb .v.no{color:var(--bad)}
.fb .trap{display:inline-block;background:var(--fire);color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.fb .ex{margin:0 0 8px}
.fb .hk{color:var(--gold);font-weight:600}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:12px;padding:13px 8px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.nav button.primary{background:linear-gradient(135deg,var(--fire),var(--fire2));border:0;color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

/* map */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.ov h3{font-family:'Orbitron',sans-serif;color:var(--gold);margin:0 0 10px;font-size:1.05rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:38px;border-radius:8px;border:1px solid var(--line);background:#150c08;color:var(--mute);font-family:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
.map button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.map button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--gold)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:10px 0}

/* result */
.big{font-family:'Orbitron',sans-serif;font-size:3rem;color:var(--gold);text-align:center;margin:6px 0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;color:var(--mute)}
.stats b{color:var(--text)}
.msg{text-align:center;color:var(--text);margin:8px 0 6px}
.rv{border:1px solid var(--line);background:#150c08;border-radius:14px;padding:12px 14px;margin-top:12px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .you{color:var(--bad)} .rv .cor{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a170d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}
@media (max-width:420px){.q{font-size:1.08rem}h1.brand{font-size:1.8rem}}
</style>
</head>

  <!-- SETUP -->

</div></div>

<script>
const DATA = [{"t":"Origin and Concepts of Entrepreneurship","s":["Origin of the Concept","Key Definitions","Types of Entrepreneurs","Roles and Characteristics","Mintzberg's Managerial Roles","Specific Entrepreneurial Roles"],"q":[["Who first introduced the concept \"entrepreneur\", per Schumpeter (1951)?",["John Stuart Mill","Alfred Marshall","Jean-Baptiste Say","Richard Cantillon"],3,"Cantillon, a French economist, first introduced the concept and saw the entrepreneur as a risk taker.","Cantillon = coined it. Say came later.",0,0],["The word \"entrepreneur\" comes from the French \"entreprendre\", which means:",["To manage","To undertake","To invest","To trade"],1,"Entreprendre means to undertake.","Entre-prendre = undertake.",0,0],["Which year is given for Jean-Baptiste Say identifying the entrepreneur as a new economic phenomenon?",["1821","1934","1755","1890"],0,"Say (1821) saw the entrepreneur as a new economic phenomenon.","Say = 1821.",0,0],["Who stressed the importance of entrepreneurship to economic growth?",["David McClelland","Alfred Marshall","John Stuart Mill","Richard Cantillon"],2,"Mill stressed the significance of entrepreneurship for economic growth.","Mill = growth.",0,0],["Alfred Marshall (1890) formally recognised entrepreneurship as:",["A source of finance","A form of risk taking","A type of management","A factor of production"],3,"Marshall saw entrepreneurship as a factor of production, linked to creating organisations.","Marshall = 1890 = factor of production.",0,0],["Which pair is matched correctly?",["Say, 1890","Cantillon, 1755","Schumpeter, 1755","Marshall, 1821"],1,"Cantillon coined the term in 1755, Say 1821, Marshall 1890.","1755 Cantillon, 1821 Say, 1890 Marshall.",0,0],["Entrepreneurship is best described as a function that involves:",["Selling goods at a profit only","Routine running of a business","Avoiding all business risk","Exploiting opportunities in a market"],3,"The book defines it as exploiting opportunities in a market, including setting up, nurturing and sustaining a business.","Opportunity = entrepreneurship.",0,1],["Schumpeter (1934) described entrepreneurship as:",["Identifying market opportunities","Creation of new organisations","Innovation applied to business","Self-employment of any sort"],2,"Schumpeter linked entrepreneurship with innovation and combining resources.","Schumpeter = innovation.",0,1],["Who defined entrepreneurship as the creation of new organisations?",["Gartner (1988)","Penrose (1963)","Schumpeter (1934)","Knight (1921)"],0,"Gartner (1988) saw it as creating new organisations.","Gartner = new organisations.",0,1],["Penrose (1963) described entrepreneurship as:",["Identifying opportunities in the economic system","Applying innovation to business","Creating new organisations","Predicting changes in the market"],0,"Penrose saw it as an activity of identifying opportunities within the economic system.","Penrose = opportunities.",0,1],["Knight (1921) said entrepreneurs:",["Avoid uncertainty","Predict and act upon market change","Only copy existing firms","Create new organisations"],1,"Knight saw entrepreneurs as people who predict and act on change in markets.","Knight = predict change.",0,1],["An entrepreneur who works inside an existing organisation is called an:",["Investor","Imitator","Technopreneur","Intrapreneur"],3,"An intrapreneur pursues opportunities as a visionary within an existing organisation.","Intra = inside.",0,1],["Technopreneur is an individual whose business is in:",["Retail trade","Public service","Agriculture","High technology"],3,"Ogundele (2007) describes the technopreneur as combining technological innovation with entrepreneurial spirit.","Techno = high tech.",0,1],["Who among these cannot start his own business but still seeks opportunity within an organisation?",["Technopreneur","Intrapreneur","Social entrepreneur","Entrepreneur"],1,"The intrapreneur works within an existing firm.","Intra = cannot go solo.",0,1],["The four types of entrepreneurs listed by Rockstar (2008) are:",["Creative, Imitating, Fabian, Drone","Innovative, Imitating, Fabian, Drone","Innovative, Social, Fabian, Drone","Innovative, Imitating, Passive, Drone"],1,"The four types are Innovative, Imitating, Fabian and Drone.","I-I-F-D.",0,2],["Which entrepreneur invests heavily in R&D to bring in something new?",["Fabian","Innovative","Imitating","Drone"],1,"The innovative type is preoccupied with introducing something new.","Innovative = new + R&D.",0,2],["A \"copy cat\" entrepreneur who does it better than the original is:",["Innovative","Drone","Imitating","Fabian"],2,"The imitating type replicates an existing system in a better way.","Imitating = copy better.",0,2],["The very careful and lazy entrepreneur who shies away from innovation is:",["Innovative","Imitating","Fabian","Drone"],2,"Fabian entrepreneurs are cautious and avoid change.","Fabian = cautious.",0,2],["The \"old school\" entrepreneur resistant to change is called a:",["Imitator","Fabian","Drone","Technopreneur"],2,"Drone entrepreneurs stick to traditional methods.","Drone = old school.",0,2],["Entrepreneurs act as agents of:",["Political, social and legal change","Economic, social and technological change","Social, financial and legal change","Economic, cultural and religious change"],1,"The three behavioural roles are economic, social and technological change.","E-S-T change.",0,3],["Which characteristic of entrepreneurship involves product and production-technique innovation?",["Creative activity","Involves risk","Dynamic process","Purposeful activity"],0,"Creative activity covers innovation in product and production technique.","Creative = innovation.",0,3],["Entrepreneurship is a \"dynamic process\" because it must:",["Follow one fixed set of rules","Avoid competition completely","Depend on a single product line","Account for a changing business environment"],3,"The process must respond to the dynamic business environment.","Dynamic = changing environment.",0,3],["According to Driessen and Zwart (2010), how many main characteristics do successful entrepreneurs have?",["Five","Eight","Three","Two"],2,"There are 3 main and 5 secondary characteristics.","3 main + 5 secondary.",0,3],["Which is one of the three main characteristics in Driessen and Zwart (2010)?",["Endurance","Need for power","Tolerance of ambiguity","Need for achievement"],3,"The main three are need for achievement, internal locus of control and risk taking propensity.","nAch, ILOC, RTP.",0,3],["Which of these is a secondary characteristic in Driessen and Zwart (2010)?",["Risk taking propensity","Internal locus of control","Endurance","Need for achievement"],2,"The five secondary ones include endurance, need for power and need for affiliation.","Secondary = Aut, Pow, ToA, Aff, End.",0,3],["Mintzberg published the managerial roles in which year?",["1973","1890","1986","1971"],0,"Henry Mintzberg identified the roles in 1973.","Mintzberg = 1973.",0,4],["How many managerial roles did Mintzberg identify?",["Ten","Seven","Twelve","Five"],0,"The book lists ten roles.","Ten roles.",0,4],["The role of arbitrating conflict to keep harmony is the:",["Liaison","Disturbance handler","Monitor","Resource allocator"],1,"The disturbance handler settles conflicts.","Conflict = disturbance.",0,4],["Deciding how scarce resources are used is the:",["Resource allocator","Figure head","Monitor","Negotiator"],0,"The resource allocator decides how scarce resources are shared out.","Scarce = allocator.",0,4],["Performing ceremonial duties for the business is the:",["Figure head role","Leader role","Liaison role","Spokesman role"],0,"The figure head represents the organisation in ceremonies.","Ceremony = figure head.",0,4],["The role that links the business to outside parties is the:",["Liaison role","Monitor role","Leader role","Negotiator role"],0,"The liaison builds links with outsiders.","Liaison = outside link.",0,4],["Launching new ideas and bearing risk is the:",["Leader role","Spokesman role","Monitor role","Entrepreneurial role"],3,"This is the entrepreneurial role, the basic role of the entrepreneur.","New ideas + risk = entrepreneurial.",0,4],["Which is a social role of the entrepreneur (Ogundele, 2007)?",["Mobilising savings","Bearing uncertainty risk","Creating jobs","Adapting imported technology"],2,"Job creation is a social role.","Social = jobs, wealth spread.",0,5],["Mobilising savings is an example of an entrepreneur's:",["Political role","Technological role","Economic role","Social role"],2,"Mobilising savings and bearing the risk of uncertainty are economic roles.","Savings = economic.",0,5],["Adapting imported technology to the local setting is a:",["Economic role","Managerial role","Social role","Technological role"],3,"Ogundele puts it under technological roles.","Adapting tech = technological.",0,5]]},{"t":"Motivation, Creativity and Innovation","s":["Motivational Influences","Non-Motivational Influences","Entrepreneurship Variables","Creativity vs Innovation","Stages and Factors of Creativity","Forms and Degrees of Innovation","Moore's Taxonomy and Innovation Phases"],"q":[["Who is the father of the need for achievement theory?",["David McClelland","Begley","Teoh and Foo","Albert Bandura"],0,"McClelland's theory says high N Ach people take moderately difficult goals with clear feedback.","McClelland = N Ach.",0,0],["People high in N Ach prefer tasks that have:",["Tasks with no clear feedback","Moderate difficulty and clear feedback","Tasks with very high risk","Tasks with no risk at all"],1,"They pursue moderately difficult goals with clear feedback.","N Ach = moderate + feedback.",0,0],["Begley (1995) said entrepreneurs have a willingness to take:",["No risks","Only safe risks","Moderate risks","Very high risks"],2,"Risk taking propensity means taking moderate risks, an offshoot of N Ach.","Risk propensity = moderate.",0,0],["Ability to respond positively to unclear situations is called:",["Locus of control","Self-efficacy","Drive","Tolerance for ambiguity"],3,"Teoh and Foo (1997) describe it this way.","Unclear situation = ambiguity.",0,0],["A person with an internal locus of control believes that:",["Fate decides outcomes","Others decide outcomes","His own actions decide outcomes","Luck decides outcomes"],2,"Internal locus pushes people toward entrepreneurship.","Internal = me.",0,0],["Task-specific self-confidence is called:",["Self-efficacy","Desire for independence","Egoistic passion","Drive"],0,"Bandura (1997) is linked with self-efficacy.","Efficacy = confidence in a task.",0,0],["Drive, as a motivational influence, has how many aspects?",["Five","Four","Six","Three"],1,"The four aspects are ambition, goals, energy and stamina, and persistence.","Drive = 4.",0,0],["A passionate and selfish love of the work itself is called:",["Egoistic passion","Desire for independence","Drive","Self-efficacy"],0,"Shane et al. (2003) use this term.","Ego = selfish love of work.",0,0],["Amit et al. (2009) said entrepreneurs act when they have:",["No ideas","High salaries","More to lose","Less to lose"],3,"This is opportunity cost, the dark side of motivation.","Opportunity cost = less to lose.",0,1],["Evans and Leighton (1989) found that older workers are more likely to become entrepreneurs because they:",["Have no family","Are less educated","Had time to build capital","Have more energy"],2,"Stocks of financial capital build up over time.","Older = more capital.",0,1],["Aldrich and Zimmer (1986) linked entrepreneurship to:",["Personal savings","Social ties to investors","Family background","Career transition"],1,"Entrepreneurs embed themselves in social contexts.","Aldrich = social ties.",0,1],["Which of these is a life-path circumstance?",["Drive","Self-efficacy","Egoistic passion","Negative displacement"],3,"Life-path circumstances include unsatisfactory work environment, negative displacement, career transition and positive pull.","Life-path = displacement, transition, pull.",0,1],["Which two factors affect the supply of entrepreneurship?",["Money and time to spare","Opportunity and willingness","Skill and good luck","Risk and expected profit"],1,"Supply depends on opportunity and willingness.","Supply = opportunity + willingness.",0,2],["Opportunity is shaped by the individual's ability and the:",["Number of friends","Size of the family","Level of profit","Macro-economic environment"],3,"The two shapers are intuition or ability and the general macro-economic environment.","Opportunity = ability + macro environment.",0,2],["Creativity is defined as the:",["Ability to bring something new into existence","The process of doing new things","The act of copying other firms","The sale of newly made products"],0,"The emphasis is on ability, not activity.","Creativity = ability.",0,3],["Innovation is defined as the:",["Ability to imagine new things","Copying existing ideas","Process of doing new things","Discovery of old ideas"],2,"Innovation turns creative ideas into marketplace reality.","Innovation = process.",0,3],["According to Holt (1992), creativity is a prerequisite for:",["Risk taking","Invention only","Innovation","Imitation"],2,"Creativity must come before innovation.","Creativity first, then innovation.",0,3],["An invention becomes an innovation once it is:",["Commercialised","Discovered","Patented","Advertised"],0,"Desouza et al. (2007) said commercialisation makes it an innovation.","Invention + sold = innovation.",0,3],["How many stages of creativity did Holt (1992) list?",["Six","Four","Five","Seven"],2,"The five stages are germination, preparation, incubation, illumination and verification.","G-P-I-I-V.",0,4],["The first stage of creativity in Holt's (1992) list is:",["Idea germination","Incubation","Preparation","Illumination"],0,"Germination is the seeding stage where interest begins.","Germination first.",0,4],["The stage where the mind works on the idea subconsciously is:",["Verification","Illumination","Incubation","Preparation"],2,"Incuba ens at the:",["Norming stage","Forming stage","Performing stage","Stormy stage"],3,"Members resist what the task asks of them.","Stormy = resistance.",0,1],["Open exchange and growing cooperation mark the:",["Norming stage","Adjusting stage","Stormy stage","Forming stage"],0,"Cooperation develops at norming.","Norming = cooperation.",0,1],["The stage where changes are made based on feedback is:",["Norming","Adjusting","Performing","Forming"],1,"Adjusting is the last stage in the book.","Adjusting = feedback.",0,1],["Group formation because of nearness in space is explained by:",["Propinquity","Balance theory","Homans' theory","Exchange theory"],0,"Propinquity is affiliation due to physical closeness.","Propinquity = proximity.",0,2],["George Homans' theory is built on activities, interactions and:",["Sentiments","Attitudes","Rewards","Costs"],0,"More shared activities lead to more interaction and stronger sentiments.","Homans = A-I-S.",0,2],["Balance theory was put forward by:",["David McClelland","Henry Mintzberg","George Homans","Theodore Newcomb"],3,"Attraction rests on similar attitudes toward shared objects or goals.","Newcomb = balance.",0,2],["Which theory says rewards must exceed costs for people to join a group?",["Homans' theory","Balance theory","Propinquity","Exchange theory"],3,"Exchange theory is based on reward and cost outcomes.","Exchange = reward over cost.",0,2],["An intimate face-to-face group that shapes social nature is a:",["Work group","Formal group","Primary group","Command group"],2,"Primary groups shape ideals and social nature.","Primary = intimate.",0,3],["A group made through formal authority for a given purpose is a:",["Reference group","Informal group","Primary group","Formal group"],3,"Formal groups are created by authority.","Formal = created by authority.",0,3],["A group that emerges unofficially, often as cliques, is:",["Task force","Informal","Formal","Command"],1,"Informal groups form inside formal ones.","Informal = clique.",0, function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// flatten
const ALL = [];
DATA.forEach((c,ci)=>c.q.forEach((q,qi)=>ALL.push({id:ci+'_'+qi, ch:ci, stem:q[0], opts:q[1], ans:q[2], exp:q[3], hack:q[4], trap:q[5], sec:q[6]})));
const TOTAL = ALL.length;
// questions already served in earlier runs (kept per browser) so new runs favour fresh ones
let SEEN = new Set();
try{ SEEN = new Set(JSON.parse(localStorage.getItem('ent101_seen')||'[]')); }catch(e){}
function saveSeen(){ try{ localStorage.setItem('ent101_seen', JSON.stringify([...SEEN])); }catch(e){} }
// shuffle, then put unseen questions first (random order inside each half)
function freshFirst(arr){ const a=shuffle(arr.slice()); return a.filter(q=>!SEEN.has(q.id)).concat(a.filter(q=>SEEN.has(q.id))); }
const FULL_N = Math.min(500, TOTAL), HALF_N = TOTAL>=500 ? 250 : Math.round(TOTAL/2);
// fair sample: every chapter is represented in proportion to its size
function sampleFair(n){
  const groups = DATA.map((_,ci)=>freshFirst(ALL.filter(q=>q.ch===ci)));
  const exact = groups.map(g=>g.length*n/TOTAL);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a,b)=>a+b,0);
  exact.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([f,i])=>{ if(left>0 && take[i]<groups[i].length){ take[i]++; left--; } });
  let out=[]; groups.forEach((g,i)=>{ out=out.concat(g.slice(0,take[i])); });
  return shuffle(out);
}

function specPool(spec){
  const want = spec.map(s=>s.split('.')); let pool = [];
  want.forEach(([c,s])=>{ const ci=(+c)-1; if(!DATA[ci]) return;
    pool = pool.concat(ALL.filter(q=>q.ch===ci && (s==='all' || q.sec===(+s)-1))); });
  pool = shuffle(pool); return pool.length>50 ? pool.slice(0,50) : pool;
}

function renderSetup(){
  const quick = Math.min(50, TOTAL), half = HALF_N;
  const cards = [
    ['full', FULL_N, 'Full CBT'],
    ['quick', quick, 'Quick Drill'],
    ['half', half, 'Half Run'],
    ['session', '🎯', 'By Chapter']
  ];
  $('runs').innerHTML = cards.map(c=>`<button class="run${c[0]===mode?' sel':''}" data-m="${c[0]}"><span class="n">${c[1]}</span>${c[2]}</button>`).join('');
  document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; renderSetup(); });
  $('chaps').classList.toggle('show', mode==='session');
  $('chapList').innerHTML = DATA.map((c,i)=>{
    const on = sel.has(i);
    let x = `<div class="chap${on?' on':''}" data-i="${i}"><span class="box" style="border-radius:50%">${on?'●':''}</span><span class="nm">Ch ${i+1}. ${esc(c.t)}</span><span class="ct">${c.q.length}</span></div>`;
    if(on){
      x += '<div class="secs"><button class="sec'+(secSel===null?' on':'')+'" data-s="all">Whole chapter · '+c.q.length+'</button>'
        + c.s.map((sn,si)=>'<button class="sec'+(secSel===si?' on':'')+'" data-s="'+si+'">'+esc(sn)+' · '+c.q.filter(q=>q[6]===si).length+'</button>').join('') + '</div>';
    }
    return x;
  }).join('');
  document.querySelectorAll('.chap').forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; sel.clear(); sel.add(i); secSel=null; renderSetup(); });
  document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{ secSel = b.dataset.s==='all' ? null : +b.dataset.s; renderSetup(); });
}

function makeItem(q){
  return { q, perm: shuffle([0,1,2,3]), pick: null };   // perm = order of original options shown 
}

async function startQuiz(){
  if(mode==='session' && sel.size===0){ toast('Pick a chapter first'); return; }
  try{ await lockReady; }catch(e){}
  if(lock && typeof lock.checkCbtAccess==='function'){
    try{
      const r = await lock.checkCbtAccess(SUBJECT_KEY);
      if(r && r.blocked){ lock.renderCbtLockScreen($('app'), r.reason); return; }
    }catch(e){}
  }
  let pool;
  if(mode==='full') pool = sampleFair(FULL_N);
  else if(mode==='quick') pool = freshFirst(ALL).slice(0,Math.min(50,TOTAL));
  else if(mode==='half') pool = sampleFair(HALF_N);
  else if(mode==='weak') pool = specPool(weakSpec||[]);
  else {
    pool = [];
    [...sel].sort((a,b)=>a-b).forEach(ci=>{ pool = pool.concat(ALL.filter(q=>q.ch===ci && (secSel===null || q.sec===secSel))); });
  }
  if(!pool.length){ toast('Nothing to practise there'); return; }
  begin(pool);
}

let startedAt = 0, isRetry = false, saved = false;
let reviewing=false;
function begin(pool, retry){
  reviewing=false; $('finishBtn').textContent='Finish & see score';
  run = pool.map(makeItem); idx = 0; startedAt = Date.now(); isRetry = !!retry; saved = false;
  if(!retry){ pool.forEach(q=>SEEN.add(q.id)); if(SEEN.size >= TOTAL) SEEN = new Set(); saveSeen(); }
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  window.scrollTo(0,0);
  renderQ();
}

function counts(){
  let ok=0,no=0;
  run.forEach(it=>{ if(it.pick!==null){ it.pick===it.q.ans ? ok++ : no++; } });
  return {ok,no};
}

function renderQ(){
  const it = run[idx], q = it.q, c = counts();
  $('qpos').textContent = `Q ${idx+1} / ${run.length}`;
  $('sOk').textContent = c.ok; $('sNo').textContent = c.no;
  $('bar').style.width = ((c.ok+c.no)/run.length*100)+'%';
  $('chtag').textContent = `Ch ${q.ch+1} · ${DATA[q.ch].t}`;
  $('qtext').textContent = q.stem;
  const L = ['A','B','C','D'];
  const answered = it.pick!==null || reviewing;
  $('opts').innerHTML = it.perm.map((oi,pos)=>{
    let cls='opt';
    if(answered){ cls+=' locked'; if(oi===q.ans) cls+=' correct'; else if(oi===it.pick) cls+=' wrong'; }
    return `<button class="${cls}" data-oi="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join('');
  if(!answered) document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  renderFb();
  $('prev').disabled = idx===0;
  $('next').textContent = idx===run.length-1 ? (reviewing?'Done ▶':'Finish ▶') : 'Next ▶';
}

function renderFb(){
  const it = run[idx], q = it.q;
  if(it.pick===null && !reviewing){ $('fb').innerHTML=''; return; }
  const good = it.pick===q.ans;
  const pos = 'ABCD'[it.perm.indexOf(q.ans)];
  $('fb').innerHTML = `<div class="fb">
    ${q.trap?'<span class="trap">⚠ TRAP QUESTION</span>':''}
    <div class="v ${good?'ok':'no'}">${good?'✅ Correct!':it.pick===null?'⏭ Skipped — the answer is '+pos:'❌ Not quite — the answer is '+pos}</div>
    <p class="ex">${esc(q.exp)}</p>
    <div class="hk">⏱ Speed hack: ${esc(q.hack)}</div>
  </div>`;
}

function choose(oi){
  const it = run[idx];
  if(it.pick!==null || reviewing) return;
  it.pick = oi;
  try{ if(lock && typeof lock.recordCbtQuestionUsed==='function') lock.recordCbtQuestionUsed(); }catch(e){}
  renderQ();
}

$('prev').onclick=()=>{ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0);} };
$('next').onclick=()=>{ if(idx<run.length-1){ idx++; renderQ(); window.scrollTo(0,0);} else if(reviewing) backToResult(); else finish(); };
function startReview(){
  reviewing=true; idx=0;
  $('finishBtn').textContent='Back to result';
  $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  renderQ(); window.scrollTo(0,0);
}
function backToResult(){ reviewing=false; $('finishBtn').textContent='Finish & see score'; finish(); }
$('finishBtn').onclick=()=>{
  if(reviewing){ backToResult(); return; }
  const left = run.filter(i=>i.pick===null).length;
  if(left===0){ finish(); return; }
  $('cmsg').textContent = left+' question(s) not answered yet. Finish anyway?';
  $('cov').classList.add('show');
};
$('cYes').onclick=()=>{ $('cov').classList.remove('show'); finish(); };
$('cNo').onclick=()=>$('cov').classList.remove('show');

function openMap(){
  $('map').innerHTML = run.map((it,i)=>{
    let c=''; if(it.pick!==null) c = it.pick===it.q.ans?'ok':'no';
    if(i===idx) c+=' cur';
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; $('ov').classList.remove('show'); renderQ(); window.scrollTo(0,0); });
  $('ov').classList.add('show');
}
$('mapBtn').onclick=openMap;
$('closeMap').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{ if(e.target.id==='ov') $('ov').classList.remove('show'); };

function saveHistory(c){
  if(saved || isRetry) return;
  const answered = c.ok + c.no;
  if(answered<=0) return;
  saved = true;
  try{
    if(window.IndigeneHistory && typeof window.IndigeneHistory.save==='function'){
      const topics = {};
      run.forEach(it=>{
        if(it.pick===null) return;
        const k = 'Ch '+(it.q.ch+1)+' · '+DATA[it.q.ch].s[it.q.sec];
        if(!topics[k]) topics[k]=[0,0];
        topics[k][1]++; if(it.pick===it.q.ans) topics[k][0]++;
      });
      window.IndigeneHistory.save({course:'ENT101', mode:'cbt', correct:c.ok, total:answered,
        secs:Math.round((Date.now()-startedAt)/1000), topics:topics});
    }
  }catch(e){}
}
function finish(){
  const c = counts(), n = run.length, un = n-c.ok-c.no;
  const pct = n? Math.round(c.ok/n*100):0;
  const msg = pct>=70?'Outstanding. You are ready for the exam. 🔥':pct>=50?'You passed. Keep pushing higher and clear every section.':pct>=40?'Close. Revise the failed sections and run again.':'Keep going. Read the failed sections again, then retry.';
  saveHistory(c);
  const chs = {}, secs = {};
  run.forEach(it=>{
    const q = it.q, good = it.pick===q.ans;
    const a = chs[q.ch] || (chs[q.ch] = {ok:0,n:0}); a.n++; if(good) a.ok++;
    const k = q.ch+'_'+q.sec; const b = secs[k] || (secs[k] = {ch:q.ch,sec:q.sec,ok:0,n:0}); b.n++; if(good) b.ok++;
  });
  const chKeys = Object.keys(chs).map(Number).sort((x,y)=>x-y);
  const pc = x => Math.round(x.ok/x.n*100);
  const need = ci => Math.max(8, Math.ceil(DATA[ci].q.length*0.4));
  const rows = chKeys.map(ci=>{
    const a = chs[ci], s = pc(a), full = a.n>=need(ci), ok = s>=PASS;
    const sr = Object.values(secs).filter(x=>x.ch===ci).sort((x,y)=>x.sec-y.sec).map(x=>`<div class="sr"><span>${esc(DATA[ci].s[x.sec])}</span><b class="${pc(x)>=PASS?'pass':'fail'}">${x.ok}/${x.n} · ${pc(x)}%</b></div>`).join('');
    return `<details class="cres"${(full&&!ok)?' open':''}><summary><span>Ch ${ci+1} · ${esc(DATA[ci].t)}</span><b class="${!full?'na':ok?'pass':'fail'}" style="white-space:nowrap">${s}/100 · ${grade(s)} · ${!full?'PRACTICE':ok?'PASS ✔':'FAIL ✖'}</b></summary>${sr}</details>`;
  }).join('');
  const weak = Object.values(secs).filter(x=>x.n>=2 && pc(x)<PASS).sort((x,y)=>x.ch-y.ch||x.sec-y.sec);
  const revise = weak.length ? `<div class="revise"><b>Revise these sections</b>${weak.map(x=>`<div class="sr"><span>Ch ${x.ch+1} · ${esc(DATA[x.ch].s[x.sec])}</span><b class="fail">${pc(x)}%</b></div>`).join('')}</div>` : '<p class="msg pass"><b>Every section in this run is at pass mark or above.</b></p>';
  const fullKeys = chKeys.filter(ci=>chs[ci].n>=need(ci));
  const passedN = fullKeys.filter(ci=>pc(chs[ci])>=PASS).length;
  const wrong = run.filter(it=>it.pick!==null && it.pick!==it.q.ans);
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  window.scrollTo(0,0);
  $('result').innerHTML = `
    <h2>Result</h2>
    <div class="big" style="font-size:2.2rem">${pct}/100 · ${grade(pct)}</div>
    <div class="stats"><span>Correct <b>${c.ok}</b></span><span>Wrong <b>${c.no}</b></span><span>Skipped <b>${un}</b></span><span>Total <b>${n}</b></span></div>
    <p class="msg"><b class="${pct>=PASS?'pass':'fail'}">${pct>=PASS?'PASS':'FAIL'}</b> · pass mark ${PASS}/100 · ${fullKeys.length?'chapters passed in this run '+passedN+'/'+fullKeys.length:'practice run, no chapter pass or fail'}</p>
    <p class="msg">${msg}</p>
    <h2 style="margin-top:16px">Score per chapter</h2>
    ${rows}
    <p class="msg" style="font-size:.8rem;color:var(--mute)">PRACTICE means this run had under 40% of that chapter's questions, so it shows a score but no pass or fail.</p>
    ${revise}
    ${weak.length?'<button class="btn" id="weakBtn">Practice these weak sections ('+weak.length+')</button>':''}
    <button class="btn" id="reviewBtn">Review answers${wrong.length?' ('+wrong.length+' wrong)':''}</button>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="/#history=ENT101">My history</a>
    ${wrong.length?`<button class="btn" id="retryWrong">Retry wrong answers (${wrong.length})</button>`:''}
    <button class="btn ghost" id="newRun">New run</button>
    `;
  $('reviewBtn').onclick=startReview;
  if($('weakBtn')) $('weakBtn').onclick=()=>{ weakSpec=weak.map(x=>(x.ch+1)+'.'+(x.sec+1)); mode='weak'; startQuiz(); };
  if($('retryWrong')) $('retryWrong').onclick=()=>begin(shuffle(wrong.map(w=>w.q)), true);
  $('newRun').onclick=()=>{ $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); renderSetup(); window.scrollTo(0,0); };
}

document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden') || $('ov').classList.contains('show') || $('cov').classList.contains('show')) return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ const it=run[idx]; if(it.pick===null){ choose(it.perm['abcd'.indexOf(k)]); } }
  else if(e.key==='ArrowRight') $('next').click();
  else if(e.key==='ArrowLeft') $('prev').click();
});

$('startBtn').onclick=startQuiz;
renderSetup();
try{
  const pr = new URLSearchParams(location.search).get('practice');
  if(pr && /^[\d.,all]+$/.test(pr)){ weakSpec = pr.split(',').filter(Boolean); mode='weak'; startQuiz(); }
}catch(e){}
</script>
