<style>
:root{
  --bg:#120a07; --bg2:#1a0f0a; --card:#1c110b; --line:#4a2a17;
  --fire:#ff6a1a; --fire2:#d4400f; --gold:#ffb347; --text:#f3e7dc; --mute:#b49a88;
  --ok:#2ecc71; --okbg:rgba(46,204,113,.12); --bad:#ff4d4d; --badbg:rgba(255,77,77,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#3a1a0b 0%,var(--bg) 55%) fixed;
  color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh;
  padding:20px 16px 40px;line-height:1.5;
}
#app{max-width:720px;margin:0 auto}
h1.brand{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--fire);text-align:center;
  letter-spacing:.08em;font-size:2.1rem;margin:8px 0 6px;text-shadow:0 0 18px rgba(255,106,26,.35)}
.sub{font-family:'Orbitron',sans-serif;text-align:center;color:var(--mute);font-size:.9rem;letter-spacing:.06em;margin:0 0 20px}
.panel{background:linear-gradient(180deg,var(--card),#150c08);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
.panel h2{font-family:'Orbitron',sans-serif;color:var(--gold);text-align:center;font-size:1.35rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run{background:#150c08;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer;transition:.15s}
.run .n{display:block;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold);font-size:1.5rem;margin-bottom:2px}
.run.sel{background:linear-gradient(135deg,var(--fire),var(--fire2));border-color:var(--gold);box-shadow:0 0 16px rgba(255,106,26,.35)}
.run.sel .n{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;cursor:pointer;
  background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-family:'Exo 2',sans-serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.03em;box-shadow:0 8px 22px rgba(255,106,26,.28)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#150c08;border:1px solid var(--line);color:var(--text);box-shadow:none}
.foot{color:var(--mute);text-align:center;font-size:.92rem;margin-top:16px}
.chaps{margin-top:14px;display:none}
.chaps.show{display:block}
.chaps .tools{display:flex;gap:8px;margin-bottom:8px}
.chaps .tools button{flex:1;background:#150c08;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;font-weight:600;cursor:pointer}
.chap{display:flex;align-items:center;gap:10px;background:#150c08;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.chap.on{border-color:var(--gold);background:#24140c}
.chap .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#000}
.chap.on .box{background:var(--gold);border-color:var(--gold)}
.chap .nm{flex:1;font-size:.98rem}
.chap .ct{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.85rem}

/* progress + sections */
.secs{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px 4px}
.sec{border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:20px;padding:5px 11px;font-size:.82rem;cursor:pointer;font-family:inherit}
.sec.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
details.cres{border:1px solid var(--line);background:#150c08;border-radius:14px;margin-top:10px}
details.cres>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.cres>summary::-webkit-details-marker{display:none}
.cres .sr,.revise .sr{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.cres .sr{padding:8px 14px;border-top:1px solid var(--line)}
.revise{border:1px solid var(--bad);background:var(--badbg);border-radius:14px;padding:12px 14px;margin-top:14px}
.revise .sr{padding:6px 0}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem;color:var(--mute);margin-bottom:8px}
.top .sc{font-family:'Orbitron',sans-serif;font-size:.85rem}
.top .sc b.g{color:var(--ok)} .top .sc b.r{color:var(--bad)}
.bar{height:6px;background:#2a170d;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width .25s}
.chtag{display:inline-block;font-size:.78rem;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-bottom:10px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#150c08;border:1.5px solid var(--line);
  color:var(--text);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-family:inherit;font-size:1.02rem;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#2a170d;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem}
.opt:not(.locked):hover{border-color:var(--fire)}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .l{background:var(--ok);color:#001a0a}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#2a0000}
.fb{border:1px solid var(--line);border-left:4px solid var(--gold);background:#1a0f0a;border-radius:12px;padding:12px 14px;margin-top:6px}
.fb .v{font-weight:700;margin-bottom:6px}
.fb .v.ok{color:var(--ok)} .fb .v.no{color:var(--bad)}
.fb .trap{display:inline-block;background:var(--fire);color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.fb .ex{margin:0 0 8px}
.fb .hk{color:var(--gold);font-weight:600}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--line);background:#150c08;color:var(--text);border-radius:12px;padding:13px 8px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.nav button.primary{background:linear-gradient(135deg,var(--fire),var(--fire2));border:0;color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

/* map */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.ov h3{font-family:'Orbitron',sans-serif;color:var(--gold);margin:0 0 10px;font-size:1.05rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.map button{height:38px;border-radius:8px;border:1px solid var(--line);background:#150c08;color:var(--mute);font-family:inherit;font-weight:600;cursor:pointer;font-size:.82rem}
.map button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.map button.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--gold)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:10px 0}

/* result */
.big{font-family:'Orbitron',sans-serif;font-size:3rem;color:var(--gold);text-align:center;margin:6px 0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;color:var(--mute)}
.stats b{color:var(--text)}
.msg{text-align:center;color:var(--text);margin:8px 0 6px}
.rv{border:1px solid var(--line);background:#150c08;border-radius:14px;padding:12px 14px;margin-top:12px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .you{color:var(--bad)} .rv .cor{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a170d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}
.foot{text-align:center;color:var(--mute);font-size:.8rem;line-height:1.5;margin:14px 6px 0}
.tm{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--gold);min-width:3.2em;text-align:center}
.tm.warn{color:var(--bad)}
.qimg{margin:0 0 12px}
@media (max-width:420px){.q{font-size:1.08rem}h1.brand{font-size:1.8rem}}
</style>
</head>

<script>
const DATA = [{"t":"Introduction to Physiology and Levels of Organisation","s":["Anatomy and physiology","Branches of physiology","Levels of organisation","Tissues and body systems"],"q":[["Which statement correctly separates anatomy from physiology?",["Anatomy describes body structures and how they relate, while physiology explains how those parts work","Anatomy explains how body parts work together, while physiology names the parts and records where they sit","Anatomy studies the chemical reactions inside cells, while physiology studies only the shape of whole organs","Anatomy covers living tissue during disease, while physiology covers the structure of healthy organs only"],0,"Anatomy is the science of structure and the relationships among parts. Physiology is the science of how those parts function.","Anatomy = Arrangement. Physiology = Performance.",0,0],["The thin, wide surface of the lung alveoli suits gas exchange. This example shows that:",["structure and function are inseparable, because a part is built the way it is for the job it does","function is fixed only after an organ has finished growing to its full adult size and shape","anatomy and physiology are learned by separate methods that never overlap in any one body system","the shape of each organ is random, with no real link to the work that it performs in the body"],0,"A structure is built the way it is because of its job. This is why physiology is always taught with anatomy in mind.","Shape fits job. If you can see the structure, guess the function.",0,0],["A lecturer compares a car's parts to anatomy. Which part of the same comparison is physiology?",["Naming the engine, wheels and steering, and saying where each is fixed on the frame","Explaining how the engine, wheels and steering work together to make the car move","Listing the metals and plastics from which every part of the car was made and finished","Drawing the outline of the car from the front, the side and from above on paper"],1,"In the car picture, anatomy names the parts. Physiology explains how they cooperate to produce movement.","Naming = anatomy. Working together = physiology.",0,0],["Physiology is best defined as the study of:",["body structures, meaning what the parts are and where they sit","body defences, meaning how the body fights disease-causing agents","body chemistry, meaning only the molecules found inside the cells","body functions, meaning how the body parts work and why"],3,"Physiology is the science (study) of body functions: how the body parts work.","Physio = function. Pick the answer that talks about working.",0,0],["Which branch of physiology studies hormones and how they control body functions?",["Neurophysiology","Immunology","Renal physiology","Endocrinology"],3,"Endocrinology deals with hormones, the chemical regulators carried in the blood.","Hormone in the stem = endocrine in the answer.",0,1],["The study of the functional properties of nerve cells is called:",["Endocrinology","Cell physiology","Exercise physiology","Neurophysiology"],3,"Neurophysiology covers the functional properties of nerve cells. Cell physiology is wider and is the base of all the other branches.","Neuro = nerve. Do not let cell physiology tempt you, it is broader.",1,1],["Pathophysiology is best defined as the study of:",["how nerve cells produce and conduct electrical signals","how the body defends itself against disease-causing agents","how cells and organs change during muscular activity","how normal function goes wrong in disease"],3,"Pathophysiology describes how function goes wrong in disease. This is the branch where nursing lives.","Patho = disease. Physiology gone wrong.",0,1],["Which branch of physiology deals with the functions of the heart and blood vessels?",["Respiratory physiology","Renal physiology","Gastrointestinal physiology","Cardiovascular physiology"],3,"Cardiovascular physiology studies the heart and blood vessels.","Cardio = heart. Vascular = vessels.",0,1],["Changes in cell and organ function brought on by muscular activity are studied in:",["exercise physiology","immunology","renal physiology","reproductive physiology"],0,"Exercise physiology covers changes in cell and organ functions due to muscular activity.","Muscle work in the stem = exercise in the answer.",0,1],["Which branch studies the functions of the air passageways and lungs?",["Respiratory physiology","Cardiovascular physiology","Renal physiology","Neurophysiology"],0,"Respiratory physiology studies the air passageways and lungs. Kidneys belong to renal physiology.","Air and lungs = respiratory. Kidneys = renal.",0,1],["Which list gives the levels of structural organisation from smallest to largest?",["Chemical, tissue, cell, organ, system, organism","Cell, chemical, tissue, system, organ, organism","Chemical, cell, tissue, organ, system, organism","Chemical, cell, organ, tissue, system, organism"],2,"The body is built stepwise, like letters to words to sentences, from chemicals to cells, tissues, organs, systems and the whole organism.","Chemicals Create Tiny Organs, Systems, Organisms.",0,2],["Which definition matches the cell as given in your guide?",["The basic structural and functional unit of life, and the smallest living unit in the body","A group of tissues that work together, with a recognisable shape and a specific function","A set of related organs that share one common function and work together inside the body","A cluster of atoms and molecules, such as water, glucose and amino acids, in the cytoplasm"],0,"The cell is the basic structural and functional unit of an organism. Examiners like this exact wording.","Learn it word for word: basic structural AND functional unit.",0,2],["An organ is best described as a structure that:",["is made of one tissue type repeated over a large flat sheet that lines a body cavity or tube","is made of two or more different tissue types, with a specific function and a recognisable shape","is made of identical cells and the materials around them, all working together for one function","is made of related systems that share a common function and work together inside the whole body"],1,"An organ contains at least two different tissue types. The stomach, skin, heart, liver and brain are examples.","Organ = two or more tissues. One tissue alone is just a tissue.",0,2],["In the lecturer's language comparison, tissues correspond to:",["Words","Paragraphs","Sentences","Letters"],2,"Letters = chemicals, words = cells, sentences = tissues, paragraphs = organs, chapters = systems, the book = organism.","Tissue = sentence. Organ = paragraph.",0,2],["Which of these is the best example of an organ?",["Nerve cell","Stomach","Epithelial tissue","Amino acid"],1,"The stomach contains epithelial, connective, muscular and nervous tissue, so it is an organ.","Ask: does it contain several tissue types? Then it is an organ.",0,2],["Which level of organisation has the whole human being as its example?",["Organ system","Cellular","Tissues","Organism"],3,"The organism is all the systems of the body working together, one complete human being.","Top of the ladder = organism.",0,2],["The four basic tissue types are:",["epithelial, connective, skeletal and cardiac","muscular, nervous, glandular and vascular","epithelial, connective, muscular and nervous","epithelial, adipose, muscular and lymphoid"],2,"Every organ is built from the four basic tissues. Skeletal and cardiac are types of muscle, not separate basic tissues.","Every Child Must Nap: Epithelial, Connective, Muscular, Nervous.",0,3],["Which tissue is specialised to generate and conduct electrical signals?",["Muscular tissue","Nervous tissue","Connective tissue","Epithelial tissue"],1,"Nervous tissue generates and conducts electrical signals for communication and control. Muscle also uses action potentials but its main job is contraction.","Signals = nervous. Shortening = muscular.",1,3],["Bone, blood, fat and cartilage all belong to which basic tissue type?",["Connective tissue","Epithelial tissue","Muscular tissue","Nervous tissue"],0,"Connective tissue supports, binds and protects. Bone, blood, fat, cartilage and tendons are all connective tissue.","Blood is a connective tissue. This catches many people.",1,3],["Which system's main job is the slow control of body functions by hormones?",["Nervous system","Endocrine system","Integumentary system","Lymphatic system"],1,"The endocrine system uses hormones for slow control. The nervous system gives fast control by electrical signals and neurotransmitters.","Nervous = fast. Endocrine = slow.",0,3]]},{"t":"Homeostasis and the Body's Feedback Control","s":["Internal environment","Homeostasis and set points","Feedback loop parts","Negative feedback","Positive feedback and feedforward","Hemostasis note"],"q":[["Claude Bernard named the fluid that bathes the cells the:",["milieu extérieur, meaning the external environment","milieu intérieur, meaning the internal environment","homeostasis, meaning the steady state of the body","transcellular fluid, meaning fluid in sealed spaces"],1,"Bernard called the extracellular fluid the milieu intérieur. Cells survive only if it stays within narrow limits.","Bernard = internal environment. Cannon = the word homeostasis.",0,0],["Most of the 100 trillion cells in the body are bathed directly in:",["intracellular fluid","cerebrospinal fluid","extracellular fluid","pure plasma inside capillaries"],2,"Most cells do not touch the outside world. They sit in extracellular fluid, the internal environment.","Cells live in the ECF, not in the air.",0,0],["The word homeostasis was coined by:",["Walter Cannon, in 1929","Claude Bernard, in 1929","Walter Cannon, in 1865","Huxley and Huxley, in 1954"],0,"Cannon coined homeostasis in 1929 (homeo = similar, stasis = standing still). Bernard gave the idea of the internal environment.","Bernard gave the room, Cannon gave the word for keeping it steady.",1,1],["Homeostasis is best described as:",["a dynamic equilibrium, with values swinging a little around a set point","a rigid state, in which every value stays exactly on one fixed number","a one-way process, which pushes the values further and further from normal","a resting state, in which all organs stop adjusting their activity"],0,"It is a steady state, not a frozen one. Values swing slightly around the set point.","Steady does not mean still.",0,1],["Normal core body temperature is about:",["36.5 to 37.5 °C","35.0 to 36.0 °C","38.0 to 39.0 °C","33.5 to 34.5 °C"],0,"Core temperature is held at about 37 °C.","37 is the centre of the range.",0,1],["Normal arterial blood pH is:",["7.35 to 7.45","6.80 to 7.00","7.55 to 7.65","7.00 to 7.20"],0,"Arterial pH is held between 7.35 and 7.45.","7.4 plus or minus 0.05.",0,1],["Fasting blood glucose is normally about:",["3.9 to 5.6 mmol/L (70 to 100 mg/dL)","7.0 to 9.0 mmol/L (126 to 162 mg/dL)","1.5 to 2.5 mmol/L (27 to 45 mg/dL)","10.0 to 12.0 mmol/L (180 to 216 mg/dL)"],0,"Fasting glucose is about 3.9 to 5.6 mmol/L. Higher values point towards diabetes.","Think 4 to 6 mmol/L.",0,1],["Which pair gives the normal plasma sodium and potassium?",["Na+ 3.5 to 5.0 mmol/L and K+ 135 to 145 mmol/L","Na+ 14 to 20 mmol/L and K+ 140 to 150 mmol/L","Na+ 135 to 145 mmol/L and K+ 3.5 to 5.0 mmol/L","Na+ 100 to 110 mmol/L and K+ 8.0 to 10.0 mmol/L"],2,"Plasma is a sodium-rich fluid. Potassium is low outside the cell and high inside.","Outside: Na big, K small. Inside: the reverse.",1,1],["Normal arterial PO2 and PCO2 are about:",["40 mmHg and 95 to 100 mmHg","60 mmHg and 100 mmHg","150 mmHg and 20 mmHg","95 to 100 mmHg and 40 mmHg"],3,"Arterial blood carries high oxygen (about 95 to 100 mmHg) and a PCO2 of about 40 mmHg.","O2 high, CO2 40.",0,1],["Which list gives the six parts of a feedback loop in the correct order?",["Receptor, efferent pathway, control centre, afferent pathway, effector, response","Effector, afferent pathway, control centre, efferent pathway, receptor, response","Receptor, afferent pathway, control centre, efferent pathway, effector, response","Receptor, afferent pathway, effector, efferent pathway, control centre, response"],2,"The signal goes in, is compared, and goes out: receptor, afferent, centre, efferent, effector, response.","R-A-C-E-E-R. Ronke Always Cooks Egusi, Eba and Rice.",0,2],["In temperature control, the control centre (integrator) is the:",["skin thermoreceptors","hypothalamus","sweat glands","sensory nerves"],1,"The hypothalamus compares the real temperature with the set point and decides the response.","Control centre = the brain part that decides.",0,2],["The afferent pathway in a feedback loop carries information:",["away from the control centre towards the effector","towards the control centre","from the effector back to the receptor only","between two effectors inside the same organ"],1,"Afferent means arriving. Efferent means exiting.","Afferent Arrives. Efferent Exits.",0,2],["In the temperature loop, sweat glands and skin blood vessels play the role of:",["receptors","the afferent pathway","the control centre","effectors"],3,"Effectors carry out the response. Sweating and skin vasodilation lose heat.","Effector = the doer.",0,2],["In an endocrine feedback loop, the efferent pathway is:",["a sensory nerve returning from the skin","a motor nerve leaving the spinal cord","the hormone travelling in the blood","the cerebrospinal fluid around the brain"],2,"For endocrine loops, the hormone in the blood plays the part of the efferent pathway.","Nerve loop = nerve out. Endocrine loop = hormone out.",1,2],["Which statement defines negative feedback?",["The response opposes the original change and so stabilises the variable","The response amplifies the original change until an event is completed","The response begins before the variable has changed at all","The response switches off the receptor so no further change is detected"],0,"In negative feedback a rise is pushed down and a fall is pushed up. Most homeostatic controls work this way.","Negative = No-change.",0,3],["Blood pressure rises. Which baroreceptor reflex response follows?",["More sympathetic and less parasympathetic output, so heart rate and vessel tone rise","More ADH release only, so the kidney holds on to extra water","Less receptor firing, so the medulla raises vessel tone even further","Less sympathetic and more parasympathetic output, so heart rate and vessel tone fall"],3,"Baroreceptors fire more, the medulla lowers sympathetic and raises parasympathetic output, and BP falls.","BP up = brakes on the heart.",0,3],["After a meal glucose rises. Which cells release insulin?",["Alpha cells of the pancreas","Chief cells of the parathyroid","Medullary cells of the adrenal gland","Beta cells of the pancreas"],3,"Beta cells release insulin. Alpha cells release glucagon in fasting.","Beta = insulin. Alpha = glucagon.",1,3],["A fall in plasma calcium causes release of:",["insulin from the beta cells of the pancreas","aldosterone from the zona glomerulosa of the cortex","oxytocin from the posterior pituitary gland","parathyroid hormone from the parathyroid glands"],3,"Low Ca2+ raises PTH, which makes bone release calcium, the kidney retain it and the gut absorb more.","Low calcium = PTH.",0,3],["Rising arterial CO2 is detected by chemoreceptors. What does the body do next?",["It breathes slower and shallower to hold on to the extra CO2","It releases ADH to retain water and so dilute the extra CO2","It dilates skin vessels to lose heat along with the extra CO2","It breathes faster and deeper to blow off the extra CO2"],3,"The medullary respiratory centre speeds and deepens breathing, so CO2 falls back towards normal.","CO2 up = breathe harder.",0,3],["Dehydration raises plasma osmolarity. Which response follows?",["Insulin release and loss of thirst","Oxytocin release and sweating","Glucagon release and dilute urine","Thirst and ADH release"],3,"Osmoreceptors trigger thirst and ADH, so water is drunk and the kidney retains water.","Thick blood = thirst and ADH.",0,3],["Which statement about gain is correct?",["Blood pressure is held more tightly than temperature, because its gain is much higher","Both are held equally tightly, because their gains are about the same","Temperature is held more tightly than blood pressure, because its gain is much higher","Gain measures how fast a response starts and not how well the error is corrected"],2,"Gain = correction divided by remaining error. Temperature gain is about 33, baroreceptor gain about 2 to 3.","Big gain = tight control. Temperature 33, BP 2 to 3.",1,3],["Fever is best explained as:",["a hypothalamic set point that has been raised","a failure of the receptors to detect the temperature","a loss of all negative feedback in the skin","a rise in heat loss that the control centre cannot stop"],0,"In fever the thermostat is reset higher, so the body works to reach the new, higher value.","Fever = set point up, not control lost.",1,3],["Which one is NOT an example of positive feedback?",["Uterine contractions during childbirth","Formation of a blood clot","The rising phase of an action potential","Blood glucose falling back after a meal"],3,"Glucose control uses negative feedback. Childbirth, clotting and the action potential all use positive feedback.","Positive loops end in an event: birth, clot, spike.",1,4],["During labour, stretch of the cervix leads to release of:",["oxytocin from the posterior pituitary","ADH from the posterior pituitary","oxytocin from the anterior pituitary","oestrogen from the posterior pituitary"],0,"Oxytocin makes the womb squeeze harder, which stretches the cervix more, which releases more oxytocin.","Posterior pituitary stores and releases oxytocin.",1,4],["The positive feedback loop of blood clotting stops when:",["the platelets run out of calcium and stop clumping","the clot forms and seals the injured area","the fibrin mesh is dissolved by plasmin straight away","the vessel wall relaxes and blood flow resumes at once"],1,"Thrombin activates more clotting factors until the clot is formed. The loop ends because the job is done.","Positive feedback stops when the event is complete.",0,4],["The positive feedback loop of the action potential is ended by:",["the sodium-potassium pump removing sodium at once","sodium channel inactivation and potassium channel opening","calcium entering the axon and raising the threshold","voltage-gated channels running out of ATP after one spike"],1,"Na channels inactivate by themselves and K channels open, which brings the voltage back down.","The loop is switched off by the channels themselves.",1,4],["Why is positive feedback not a homeostatic mechanism?",["It acts too slowly to correct any change in the internal environment at all","It only works in the nervous system and never in the endocrine system","It pushes a process to completion instead of keeping the variable steady","It can only respond to a fall in a variable and never to any rise in it"],2,"Positive feedback amplifies a change and does not maintain stability. It stops only when something outside the loop ends it.","Negative = stay. Positive = push further.",0,4],["Feedforward control means that the body:",["waits until the variable moves and then corrects it completely","amplifies the change until an all-or-none event is complete","starts the correction before the variable has actually moved","uses only local tissue metabolites instead of nerves or hormones"],2,"Feedforward predicts a change and acts early, so deviations are smaller.","Forward = before.",0,4],["Which is an example of feedforward control?",["Heart rate and breathing rise at the start of exercise, before blood gases change","Glucagon is released from the alpha cells as blood glucose falls during a long fast","Sweating begins only after the core temperature has risen above 37 °C in a hot room","Insulin is released from beta cells after glucose has already entered the blood"],0,"Other options all wait for the variable to change. Feedforward acts early, like salivation at the smell of food.","Does it act before the change? Then it is feedforward.",1,4],["Which control is fast and which is slow and long-lasting?",["The endocrine system is fast, and the nervous system is slow and long-lasting","Both are fast, but the endocrine system lasts for a shorter time","Both are slow, but the nervous system acts over a much wider area","The nervous system is fast, and the endocrine system is slow and long-lasting"],3,"Nerves use electrical signals and act quickly. Hormones travel in blood and act slowly for longer.","Nerve = fast. Hormone = slow.",0,4],["Hemostasis (haemostasis) as a real topic means:",["the maintenance of a steady internal body environment","the destruction of old red cells mainly in the spleen","the dissolving of a clot after the vessel has healed","the process that stops bleeding from a damaged vessel"],3,"Hemostasis (haem = blood) stops bleeding. Homeostasis keeps the internal environment steady. Do not mix them.","Homeo = home stays the same. Hemo = blood stops flowing out.",1,5],["Which sequence lists the steps of hemostasis in order?",["Platelet plug, vascular spasm, coagulation, fibrinolysis, clot retraction and repair","Vascular spasm, platelet plug, coagulation, clot retraction and repair, fibrinolysis","Vascular spasm, coagulation, platelet plug, clot retraction and repair, fibrinolysis","Coagulation, vascular spasm, platelet plug, fibrinolysis, clot retraction and repair"],1,"The vessel contracts first, then platelets plug it, then the cascade makes a fibrin clot, the clot retracts, and plasmin dissolves it later.","Spasm, Plug, Clot, Retract, Dissolve.",0,5],["The clotting cascade needs which two substances in particular?",["Sodium and vitamin C","Potassium and vitamin D","Calcium and vitamin K","Iron and vitamin A"],2,"Calcium and vitamin K are needed for the common pathway, prothrombin to thrombin to fibrin.","K is for Koagulation. Calcium is factor IV.",0,5],["In the common pathway of coagulation, thrombin converts:",["prothrombin into plasmin","fibrinogen into fibrin","plasmin into fibrin","fibrin into fibrinogen"],1,"Prothrombin becomes thrombin, and thrombin turns fibrinogen into the fibrin mesh that traps cells.","Thrombin makes fibrin.",0,5],["Platelets stick to exposed collagen with the help of which factor?",["Plasmin, the enzyme that digests fibrin clots","Thromboxane A2 alone, released by the platelets","Albumin, the most abundant protein in the plasma","von Willebrand factor, made by endothelial cells"],3,"Adhesion uses von Willebrand factor. Platelets then release ADP and thromboxane A2 for aggregation.","vWF = the glue for adhesion.",1,5],["Which enzyme dissolves the clot once healing is complete?",["Plasmin","Thrombin","Fibrinogen","Prothrombin"],0,"Fibrinolysis uses plasmin to break down the fibrin clot.","Plasmin = clot-eater.",0,5]]},{"t":"The Cell: Structure, Organelles and Nucleus","s":["Cell in general","Cytoplasm and cytoskeleton","Ribosomes, ER and Golgi","Mitochondria and other organelles","The nucleus"],"q":[["The three principal parts of a cell are:",["the plasma membrane, the cytosol alone, and the endoplasmic reticulum","the plasma membrane, the cytoplasm with its organelles, and the nucleus","the nucleus, the mitochondria with their cristae, and the Golgi complex","the cytoskeleton, the free ribosomes, and the nuclear envelope with pores"],1,"A cell has two compartments, nucleus and cytoplasm, and the cytoplasm is bounded by the plasma membrane.","Membrane, Cytoplasm, Nucleus: wall, ground, town hall.",0,0],["About how many cells does the human body contain?",["More than 100 trillion","About 100 million","About 10 billion","About 1 trillion exactly"],0,"There are more than 100 trillion cells, each about 10^-5 m across.","100 trillion. Say it with confidence.",0,0],["Which cells are largely unable to divide?",["Mature neurons and skeletal muscle fibres","Basal epithelial cells of the skin surface","Cells that line the small intestine wall","White blood cell precursors in bone marrow"],0,"Almost all cells can reproduce. Exceptions are mature red cells, mature neurons and skeletal muscle fibres.","Nerves and muscle do not divide much.",1,0],["Which statement is true of ALL cells?",["They all contain many nuclei so that protein can be made quickly in large amounts","They change nutrients into energy and deliver end-products into the surrounding fluid","They all contract and shorten when they are stimulated electrically or by hormones","They all conduct action potentials along their plasma membrane to distant cells"],1,"All cells share a general structure, general mechanisms for making energy, and release of wastes or secretions.","Do not generalise from muscle or nerve to all cells.",0,0],["In the 'cell as a town' picture, the nucleus is the:",["town hall, which keeps the master plans (DNA)","town wall and gate, which controls entry and exit","power station, which makes ATP from food and oxygen","post office, which sorts and sends products"],0,"The nucleus keeps the DNA plans and gives orders. The membrane is the wall, the mitochondria the power station and the Golgi the post office.","Nucleus = town hall.",0,0],["The cytosol forms about what share of cell volume?",["About 15%","About 90%","About 30%","About 55%"],3,"Cytosol is the fluid part of the cytoplasm, about 55% of cell volume, and 75 to 90% water.","Just over half the cell.",0,1],["Glycolysis takes place in the:",["mitochondrial matrix, in a series of 4 reactions giving 36 ATP","nucleolus, in a series of 10 reactions giving 2 ATP","rough ER lumen, in a series of 4 reactions giving 2 ATP","cytosol, in a series of 10 reactions giving 2 ATP per glucose"],3,"Enzymes in the cytosol catalyse glycolysis: 10 reactions, 2 ATP from one glucose.","Cytosol, 10 reactions, 2 ATP.",0,1],["Which list gives the cytoskeleton filaments in increasing diameter?",["Microtubules, intermediate filaments, microfilaments","Intermediate filaments, microfilaments, microtubules","Microfilaments, intermediate filaments, microtubules","Microfilaments, microtubules, intermediate filaments"],2,"Microfilaments are about 7 nm, intermediate filaments 8 to 12 nm, microtubules about 25 nm.","Mama Is Mighty: Micro-filaments, Intermediate, Micro-tubules.",0,1],["Which cytoskeleton filament is made of actin and myosin and drives muscle contraction and cell locomotion?",["Microtubules","Microfilaments","Intermediate filaments","The centrosome"],1,"Microfilaments are the thinnest and generate movement as well as mechanical support.","Actin = micro-filament.",0,1],["Microtubules are built from which protein?",["Actin","Keratin-like fibres of many types","Tubulin","Myosin"],2,"Microtubules are long hollow tubes of tubulin that begin at the centrosome.","Tubulin = tubes.",0,1],["Which filaments are exceptionally strong and found where the cell is under mechanical stress?",["Actin microfilaments","Spindle microtubules","Centrioles in the cell","Intermediate filaments"],3,"Intermediate filaments stabilise organelle position, such as the nucleus, and help cells attach to each other.","Intermediate = strong cables.",0,1],["The centrosome is made of:",["a pair of ribosomal subunits and their messenger RNA, within a double membrane","a stack of flattened cisternae with vesicles, enclosed by a single membrane","a ring of nuclear pores and associated lamins, enclosed in a double membrane","a pair of centrioles and pericentriolar material, with no surrounding membrane"],3,"The centrosome is non-membranous. It forms the mitotic spindle in cell division.","Centrosome = spindle organiser.",1,1],["Ribosomes make proteins, and their name reflects a high content of:",["messenger RNA (mRNA)","ribosomal RNA (rRNA)","transfer RNA (tRNA)","deoxyribonucleic acid (DNA)"],1,"Ribosomes consist of two subunits rich in rRNA. tRNA sits between the subunits and brings amino acids.","Ribosome = rRNA.",0,2],["Where are the two ribosomal subunits made?",["Together in the Golgi complex, then split in the cytoplasm","Separately in the smooth ER, then joined in the nucleus","Separately in the nucleolus, then joined in the cytoplasm","Together in the mitochondria, then exported to the cytosol"],2,"The subunits are made in the nucleolus, leave the nucleus separately and join in the cytoplasm.","Nucleolus builds, cytoplasm joins.",0,2],["Bound ribosomes on the rough ER make proteins destined for:",["use free inside the cytosol of the cell that made them","import into the nucleus through nuclear pores after release","use inside the mitochondrial matrix only, for energy release","organelles, the plasma membrane or export from the cell"],3,"Bound ribosomes make proteins for organelles, membrane insertion, or export. Free ribosomes make cytosol proteins.","Bound = export. Free = home use.",0,2],["Which statement separates rough ER from smooth ER?",["Rough ER is studded with ribosomes and makes secretory proteins, while smooth ER has none and makes lipids","Rough ER has no ribosomes and makes steroids, while smooth ER is studded with ribosomes and makes proteins","Rough ER is found only in muscle cells, while smooth ER is found only in liver cells","Rough ER stores calcium in muscle, while smooth ER makes phospholipids only"],0,"Rough ER carries ribosomes. Smooth ER synthesises fatty acids and steroids and detoxifies drugs.","Rough = Ribosomes. Smooth = Steroids, Sugar release, Sarcoplasmic reticulum, Safety.",0,2],["Which of these is a function of smooth ER?",["Making secretory proteins on bound ribosomes for export","Joining carbohydrates to proteins to form glycoproteins","Detoxifying lipid-soluble drugs and alcohol in liver cells","Making ribosomal subunits inside the nucleolus of the cell"],2,"Smooth ER detoxifies, makes steroids and fatty acids, and in muscle forms the sarcoplasmic reticulum.","Detox sits in smooth ER.",1,2],["In liver, kidney and intestinal cells, a smooth ER enzyme removes phosphate from:",["ATP, so that ADP can be returned to the mitochondria","creatine phosphate, so that energy is released for sprints","glucose-6-phosphate, so free glucose can enter the blood","fructose-1,6-bisphosphate, so that glycolysis can speed up"],2,"Smooth ER glucose-6-phosphatase lets glucose leave the cell and enter the blood.","Sugar release = smooth ER.",1,2],["In skeletal muscle, smooth ER forms the:",["sarcolemma, which carries the action potential along the fibre","sarcoplasmic reticulum, which stores and releases calcium","T-tubule system, which carries the action potential inwards","myofibril, which holds the thick and thin filaments"],1,"The sarcoplasmic reticulum is specialised smooth ER and holds the calcium for contraction.","SR = muscle's smooth ER.",0,2],["The Golgi complex is best described as a:",["stack of 3 to 20 cristae folded in mitochondria that make most of the ATP","ring of 3 to 20 nuclear pores in the envelope that control movement into the nucleus","stack of 3 to 20 cisternae that modify, sort and package proteins from the rough ER","network of 3 to 20 tubules in the smooth ER that detoxify lipid-soluble drugs"],2,"The Golgi receives proteins from the rough ER, modifies them, sorts them and ships them in vesicles.","ER makes, Golgi ships.",0,2],["Which vesicle carries finished protein out of the cell by exocytosis?",["A transport vesicle bound for the lysosome","A secretory vesicle from the Golgi complex","A peroxisome from the smooth ER","A mitochondrion from the cytosol"],1,"The Golgi forms secretory vesicles, membrane vesicles and transport vesicles for lysosomes.","Secretory = leaves the cell.",0,2],["Mitochondria generate most of the cell's ATP by:",["aerobic respiration","anaerobic glycolysis","phosphocreatine breakdown","fermentation in the cytosol"],0,"They are the powerhouses. Muscle and liver cells have many.","Mitochondria = Make More ATP (with oxygen).",0,3],["The folded inner membrane of a mitochondrion is called the:",["matrix","cisternae","cristae","cytosol"],2,"The outer membrane is smooth. The inner membrane is folded into cristae and the fluid centre is the matrix.","Cristae = folds.",0,3],["Which fact about mitochondria is correct?",["They have a single smooth membrane and no DNA","They contain their own ribosomes and DNA","They are made of non-membranous rod-like centrioles","They are found only in cells that divide rapidly"],1,"Mitochondria hold their own ribosomes and DNA, and make some of their own proteins.","Own DNA, own ribosomes.",1,3],["During apoptosis, which protein leaks from mitochondria into the cytosol?",["Tubulin subunits","Hemoglobin A","Cytochrome c","Troponin C"],2,"Cytochrome c starts a cascade of protein-digesting enzymes called caspases.","Cytochrome c leaks, caspases kill.",1,3],["Which of these triggers apoptosis?",["A rise in ATP above normal levels together with a plentiful oxygen supply","Large numbers of free radicals, DNA damage, or lack of oxygen and nutrients","An excess of growth factors and survival signals in the surrounding fluid","The normal activity of the sodium-potassium pump in a resting healthy cell"],1,"Apoptosis is orderly, genetically programmed cell death. Growth-factor DEPRIVATION is a trigger, not excess.","Damage and deprivation, not excess.",1,3],["Lysosomes are best described as:",["spherical vesicles that break down hydrogen peroxide with catalase","non-membranous masses of two rod-like centrioles at right angles","membranous sacs that store and release many substances in the cytoplasm","membranous sacs that digest foreign molecules and damaged organelles"],3,"Lysosomes are the cell's stomach and dustbin. Peroxisomes handle peroxide.","Lysosome = lysis = digestion.",0,3],["Peroxisomes contain enzymes that:",["digest damaged organelles using strong acid hydrolase enzymes","detoxify harmful molecules and break down hydrogen peroxide","build the spindle fibres used in mitosis and cell division","make steroid hormones from cholesterol in the adrenal cortex"],1,"Peroxisomes are spherical membranous vesicles that neutralise poisons including hydrogen peroxide.","Peroxisome = peroxide handler.",0,3],["Cilia and flagella are:",["minute projections that move particles along the surface or move the cell","rod-like centrioles that organise the spindle fibres during cell division","membranous sacs that store and release many substances in the cytoplasm","ribosome-studded tubes that carry newly made protein out of the whole cell"],0,"Cilia move particles. A sperm flagellum moves the cell itself.","Cilia sweep. Flagellum swims.",0,3],["Which organelle is non-membranous and organises the spindle?",["The lysosome","The centrosome","The peroxisome","The vacuole"],1,"The centrosome is a mass of two centrioles without a membrane.","No membrane = centrosome (and ribosome).",1,3],["The nuclear envelope is:",["a double membrane, with the outer layer continuous with the rough ER","a single membrane, with the inner layer continuous with the Golgi","a double membrane, with the inner layer continuous with the cytosol","a triple membrane, with the outer layer continuous with the plasma membrane"],0,"Both layers are lipid bilayers. The ER lumen continues into the space between them.","Nuclear outer membrane = rough ER.",1,4],["How do large molecules such as RNAs and proteins cross the nuclear pores?",["By selective active transport","By simple diffusion down a gradient","By osmosis through aquaporins","By facilitated diffusion with a GLUT carrier"],0,"Small molecules and ions diffuse through. Large ones need selective active transport.","Big cargo = active transport.",0,4],["Nucleoli are best described as:",["membrane-bound sacs of protein and lipid, where proteins are modified and then sorted","non-membranous clusters of protein, DNA and RNA, where rRNA is made and subunits assembled","double-membrane sacs with folded cristae, where ATP is produced by aerobic respiration","stacks of flattened cisternae, where lipids are secreted and glycoproteins are made"],1,"Nucleoli are ribosome factories, and are prominent in cells that make a lot of protein.","Nucleolus = makes ribosomes.",0,4],["Chromatin is:",["the double membrane that surrounds the nucleus and has pores in it","the complex of DNA, proteins and some RNA that makes up chromosomes","the dense non-membranous mass that makes ribosomal RNA in the nucleus","the ring of proteins that forms each nuclear pore in the envelope"],1,"In a non-dividing cell, chromatin looks like a diffuse granular mass.","Chromatin = DNA plus protein.",0,4],["Human somatic cells normally have:",["23 chromosomes, all from the mother","92 chromosomes, 46 from each parent","44 chromosomes, 22 from each parent","46 chromosomes, 23 from each parent"],3,"Each chromosome is a long DNA molecule coiled with proteins.","46 = 23 + 23.",0,4],["Which cell has NO nucleus when mature?",["Skeletal muscle fibre","Red blood cell","Liver cell","Motor neuron"],1,"Mature red cells have no nucleus. Skeletal muscle fibres have many nuclei.","Red cell: none. Muscle fibre: many.",1,4],["Damage to the smooth ER enzymes of liver cells by alcohol matters clinically because:",["ribosomes detach from the rough ER and stop making all secretory proteins","the Golgi complex can no longer package proteins for export from the cell","mitochondria release cytochrome c and the liver cell divides rapidly instead","drugs compete for the same detoxifying enzymes, so drug interactions can occur"],3,"Drug interactions occur because several drugs compete for the same smooth ER enzymes.","Smooth ER = detox = drug interactions.",1,4]]},{"t":"The Cell (Plasma) Membrane","s":["Features and fluid mosaic model","Membrane lipids","Membrane proteins","Carbohydrates and clinical links"],"q":[["The plasma membrane is about how thick?",["About 10 nanometres","About 100 nanometres","About 1 micrometre","About 1 nanometre"],0,"The membrane is about 10 nm thick, and is a flexible fluid structure.","10 nm.",0,0],["The membrane is described as selectively permeable because it:",["controls what enters and leaves the cell","lets every dissolved substance pass in both directions equally","blocks every substance, including oxygen and carbon dioxide","allows only water through and blocks all dissolved solutes"],0,"Selective permeability means some substances cross and others do not.","Selective = controlled.",0,0],["The fluid mosaic model describes the membrane as:",["a rigid single layer of proteins, with a few lipids attached to its inner surface only","a double layer of carbohydrates, with lipids embedded between the two layers and no proteins","a solid wall of cholesterol, with proteins attached to the outside only and no phospholipids","a double layer of lipids with proteins embedded in it and carbohydrates on the outer surface"],3,"It is called fluid because lipids and many proteins move sideways within the layer.","Fluid = lipids move. Mosaic = proteins scattered like tiles.",0,0],["Which of the following is the composition of the membrane according to Dr Ajeigbe's slide (share of the whole membrane)?",["Proteins 41%, lipids 55%, carbohydrates 3%","Proteins 25%, lipids 55%, carbohydrates 20%","Proteins 55%, lipids 41%, carbohydrates 3%","Proteins 55%, lipids 25%, carbohydrates 20%"],2,"Within the 41% lipid share, phospholipids are 25%, cholesterol 12% and glycolipids 4%.","55 protein, 41 lipid, 3 carbohydrate (Ajeigbe).",1,0],["Dr Saka's slide gives the lipid breakdown as phospholipids about 75%, cholesterol about 20% and glycolipids about 5%. Why does this look different from Dr Ajeigbe's numbers?",["Saka measured a different type of cell, while Ajeigbe measured only red blood cell membranes","Saka is wrong, because the two slides measure exactly the same thing and so must always agree","Saka gives the share within the lipids only, while Ajeigbe gives the share of the whole membrane","Saka counted the proteins as lipids too, while Ajeigbe separated the two groups correctly"],2,"The two are different measurements. Quote the version from the lecturer who set the question.","Share of lipids vs share of whole membrane.",1,0],["Why can oxygen, carbon dioxide and steroids cross the membrane easily?",["They are lipid-soluble and slide through the oily middle of the bilayer","They are water-soluble and pass through open protein channels freely","They are charged and are pulled in by the negative charge inside the cell","They are large molecules and are carried across by transport vesicles"],0,"The hydrophobic core lets fat-soluble substances cross, but blocks water-soluble ions and glucose.","Oily passes oily.",0,0],["The lipid bilayer is made from which three kinds of lipid molecule?",["Phospholipids, cholesterol and glycolipids","Triglycerides, cholesterol and glycoproteins","Phospholipids, steroids and glycoproteins","Triglycerides, phospholipids and glycolipids"],0,"Glycolipids carry carbohydrate chains on the outer layer. Glycoproteins are proteins, not lipids.","Phospho, Chole, Glyco-lipid.",1,1],["In a phospholipid, the head is:",["polar and hydrophilic, facing the watery fluid","non-polar and hydrophobic, facing the middle of the membrane","polar and hydrophobic, facing the cytoskeleton","non-polar and hydrophilic, facing the nucleus"],0,"The glycerol-phosphate head is polar and water-loving. The two fatty-acid tails are non-polar and water-fearing.","Head Happy with water, Tails Terrified.",0,1],["The two fatty-acid tails of a phospholipid:",["point outwards into the extracellular fluid around the cell","point outwards into the cytosol on the inside of the cell","point towards each other into the middle of the membrane","lie flat along the outer surface of the membrane as a coat"],2,"The hydrophobic tails hide in the middle, away from water.","Tails in the middle = oily core.",0,1],["Cholesterol in the membrane:",["makes the membrane completely rigid at all temperatures, so that nothing can cross it","carries most of the negative charge found on the outer surface of the cell membrane","forms channels through which sodium and potassium ions pass in and out of the cell","keeps the membrane stable and fluid, neither too rigid in the cold nor too fluid when warm"],3,"Cholesterol sits between phospholipids and buffers fluidity.","Cholesterol = temperature stabiliser.",0,1],["Glycolipids act as:",["ion channels that open when a chemical ligand binds to them","cell-identity markers that take part in cell recognition","enzymes that break down ATP at the outer surface of the cell","anchors that link the membrane to the inner cytoskeleton"],1,"Glycolipids carry carbohydrate chains on the outer layer and are recognition markers.","Glyco = sugar tag = ID card.",0,1],["What is the main effect of the hydrophobic core of the bilayer?",["It speeds up the passage of sodium and potassium ions freely","It restricts the passage of water and water-soluble ions","It blocks the passage of oxygen and carbon dioxide gases","It carries proteins from one side of the cell to the other"],1,"The oily middle blocks water-soluble things, so they must use protein doors.","Oil blocks water.",0,1],["Integral proteins differ from peripheral proteins in that integral proteins:",["attach loosely to the polar heads at the inner or outer surface","extend into or through the lipid bilayer and are firmly embedded","lie only on the outer surface and carry the carbohydrate chains","are found only in the nuclear envelope and in the mitochondria of the cell"],1,"Most integral proteins are transmembrane. Peripheral proteins are attached to the surface.","Integral = Inside. Peripheral = on the Periphery.",0,2],["Which membrane proteins form pores that let specific ions such as potassium through?",["Ion channels","Linkers","Cell-identity markers","Peripheral enzymes"],0,"Most channels are selective and some have gates that open and close.","Channel = door for one ion.",0,2],["A carrier protein:",["anchors a neighbouring cell to the extracellular matrix of the tissue","binds a hormone at the surface and changes the activity of the cell","forms a sugar coat that gives the cell a negative surface charge","selectively moves a polar substance or ion from one side to the other"],3,"Carriers act like taxis that pick up one passenger, for example glucose.","Carrier = taxi.",0,2],["Membrane receptors are:",["channels that stay permanently open and let all small ions and water cross freely","markers that tell the immune system which blood group a cell has and whether it is foreign","recognition sites, each binding one specific molecule such as a hormone or neurotransmitter","enzymes that break down lipids in the middle of the bilayer and release ATP for the cell"],2,"Receptors act like doorbells. A hormone fits one and the cell responds.","Receptor = doorbell.",0,2],["Linkers in the membrane:",["form pores that let water, urea and other small solutes pass freely through the bilayer","anchor proteins in neighbouring cells together, or to filaments inside and outside the cell","bind calcium inside the muscle fibre and change the shape of the thin filament there","split ATP to power the sodium-potassium pump and move ions against their gradients"],1,"Linkers are hooks that join cells to each other.","Linker = hook.",0,2],["Which mnemonic lists the jobs of membrane proteins?",["C-R-I-E-L: Channels and carriers, Receptors, Identity markers, Enzymes, Linkers","C-R-A-B-S: Channels and cotransporters, Receptors, Antigens, Bonds, Sugars","L-I-P-I-D: Linkers, Ion pumps only, Pores, Identity markers, Detectors","P-R-O-T-E: Pumps, Receptors, Osmosis, Transporters, Enzymes of the cytosol"],0,"Structural support can be added as a further function.","Can Rice Inspire Everyone's Love?",1,2],["Dr Saka defines peripheral proteins as those that:",["span the full thickness of the bilayer from the cytosol to the ECF","are bound by covalent bonds to the fatty acid tails inside the bilayer","are found only on the inner surface and never on the outer","are attached to the surface of the membrane rather than embedded in it"],3,"Learn the definition (embedded vs attached to a surface) first, then the roles.","Peripheral = surface.",1,2],["Membrane carbohydrates are attached mostly as:",["glycoproteins and glycolipids on the outer surface, forming the glycocalyx","glycogen and starch granules stuck on the inner surface of the cell membrane","free sugar molecules dissolved in the hydrophobic middle of the bilayer","cellulose fibres on the outer surface that give the membrane its stiffness"],0,"Together they form the sugar coat. About nine tenths are glycoproteins.","Glycocalyx = sugar coat.",0,3],["Which of these is a function of membrane carbohydrates?",["They give most cells an overall negative surface charge","They make the inside of the cell strongly positive at rest","They carry the electrical current along the nerve axon","They split ATP to run the sodium-potassium pump in the cell"],0,"Carbohydrates also attach cells, act as receptor substances and take part in immune reactions.","Sticky, signalling, safety, negative charge.",0,3],["The ABO blood group markers are examples of:",["ion channels made of integral proteins that span the whole membrane","enzymes made of peripheral proteins on the inner surface of the cell","linkers made of protein filaments in the cytoskeleton of the cell","cell-identity markers made of membrane glycoproteins and glycolipids"],3,"A transfusion mismatch makes red cells agglutinate and haemolyse.","ABO = identity markers on red cells.",0,3],["The bedside cross-match before a transfusion exists because of:",["ion channels found on the red cell membrane","membrane carbohydrate markers on the red cells","the haemoglobin carried inside the red cell","the nucleus and DNA inside the mature red cell"],1,"A mismatch causes agglutination and haemolysis.","Cross-match = carbohydrate markers.",1,3],["Many drugs, such as beta-blockers and salbutamol, begin their action at:",["membrane receptor proteins","the double nuclear envelope","the mitochondrial matrix","the Golgi cisternae stack"],0,"Drug action usually begins at a membrane protein.","Drugs knock on the membrane door first.",0,3],["Cell-identity markers allow a cell to:",["recognise cells of the same kind and respond to dangerous foreign cells","pump sodium out and potassium in using ATP and keep the cell volume steady","synthesise steroids and detoxify lipid-soluble drugs in the liver cell","divide by mitosis whenever growth factors arrive in the surrounding fluid"],0,"They help during tissue formation and in recognising foreign cells.","Markers = who am I, who are you.",0,3],["Which of the following is NOT a function of membrane carbohydrates?",["Attaching neighbouring cells to each other at the surface","Forming the pore through which sodium crosses at rest","Acting as receptor substances for hormones and drugs","Taking part in immune reactions against foreign cells"],1,"Pores are formed by integral proteins, not by carbohydrates.","Carbohydrates stick, signal and protect. They do not form pores.",1,3],["A membrane that has lost its cholesterol would most likely:",["stop all transport of oxygen and carbon dioxide across it at once, in both directions","lose its negative surface charge but stay equally stable and fluid","become unstable, either too rigid in the cold or too fluid when warm","lose every integral protein at once and become a plain lipid sheet of membrane"],2,"Cholesterol keeps the membrane stable and fluid across temperature changes.","No cholesterol, no buffer.",1,3]]},{"t":"Body Fluids and Fluid Compartments","s":["Compartments and measurement","Calculations","ECF and ICF composition","Water balance and factors","Control and dehydration"],"q":[["Water makes up about what percentage of the body weight of an average young adult male?",["40%","20%","73%","60%"],3,"Total body water is about 60% of body weight. 73% is the figure for infants.","60-40-20: water, inside cells, outside cells.",1,0],["Total body water is divided between the compartments as follows:",["ICF about two thirds and ECF about one third","ICF about one third and ECF about two thirds","ICF about three quarters and ECF about one quarter","ICF and ECF are about equal halves of the total"],0,"Two thirds of body water is inside the cells and one third is outside.","Inside is the bigger share.",0,0],["Intracellular fluid is about what percentage of body weight?",["40%","20%","60%","15%"],0,"ICF is 40% of body weight, ECF 20%, total 60%.","60-40-20.",0,0],["Plasma makes up what share of the extracellular fluid?",["25%","75%","5%","15%"],0,"Plasma is 25% of ECF and interstitial fluid 75%. The 5% and 15% are shares of body weight.","Careful: share of ECF vs share of body weight.",1,0],["Which of the following is a transcellular fluid?",["Interstitial fluid","Plasma","Intracellular fluid","Cerebrospinal fluid"],3,"Transcellular fluid is a small part of ECF separated by an epithelial lining: CSF, pleural, peritoneal, pericardial and synovial fluids, intraocular fluid and digestive secretions.","Sealed-off fluids = transcellular.",0,0],["According to the dilution principle, the volume of a compartment is found as:",["the concentration of marker multiplied by the amount injected, corrected for losses","the amount of marker injected multiplied by its concentration, corrected for dilution","the concentration of marker divided by the amount injected, corrected for body weight","the amount of marker injected divided by its concentration, corrected for losses"],3,"A known amount of marker is injected, allowed to mix, and its concentration measured.","Volume = amount / concentration.",0,0],["Which marker is used to measure plasma volume?",["Inulin","Heavy water (D2O)","Sucrose","Evans blue dye"],3,"Plasma: Evans blue or radio-iodinated albumin. TBW: heavy water or antipyrine. ECF: inulin, sodium or sucrose.","Blue dye stays in blood.",1,0],["Inulin is used to measure the volume of:",["total body water","plasma","extracellular fluid","intracellular fluid"],2,"Inulin, sodium and sucrose distribute through the ECF.","Inulin = ECF.",0,0],["Intracellular fluid volume is found by:",["subtracting plasma volume from ECF volume","adding plasma volume to interstitial fluid","subtracting ECF from total body water","subtracting total body water from ECF"],2,"ICF = TBW minus ECF. Interstitial = ECF minus plasma.","ICF is the leftover after you take out ECF.",0,0],["What is the total body water of a 70 kg man?",["28 litres","42 litres","14 litres","35 litres"],1,"60% of 70 kg is 42 L.","60% x 70.",0,1],["What is the ICF volume of a 70 kg man?",["28 litres","42 litres","14 litres","10.5 litres"],0,"40% of 70 kg is 28 L, which is also two thirds of 42 L.","40% x 70.",0,1],["What is the ECF volume of a 70 kg man?",["28 litres","42 litres","14 litres","10.5 litres"],2,"20% of 70 kg is 14 L, which is also one third of 42 L.","20% x 70.",0,1],["What is the interstitial fluid volume of a 70 kg man?",["roughly 3.5 litres","about 14 litres","about 10.5 litres","about 28 litres"],2,"Interstitial fluid is 75% of the 14 L ECF.","Three quarters of ECF.",0,1],["What is the plasma volume of a 70 kg man, using the guide's figures?",["10.5 litres","5 litres","3.5 litres","14 litres"],2,"Plasma is 25% of 14 L, which is 3.5 L. Blood volume (about 5 L) is bigger because it includes red cells.","One quarter of ECF.",1,1],["Total body water of a 60 kg man is:",["24 litres","12 litres","30 litres","36 litres"],3,"60% of 60 kg is 36 L.","0.6 x 60.",0,1],["ICF of an 80 kg man is:",["48 litres","16 litres","32 litres","24 litres"],2,"40% of 80 kg is 32 L.","0.4 x 80.",0,1],["Plasma volume of a 50 kg man, taking plasma as 5% of body weight, is:",["2.5 litres","7.5 litres","10 litres","5 litres"],0,"5% of 50 kg is 2.5 L.","5% = 0.05.",0,1],["Interstitial fluid is what percentage of body weight?",["5%","15%","20%","25%"],1,"Of the 20% outside the cells, 15% is interstitial fluid and 5% is plasma.","60-40-20, then 15 and 5.",0,1],["Sodium concentration in ECF and ICF is about:",["14 mmol/L outside and 142 mmol/L inside","4.2 mmol/L outside and 140 mmol/L inside","142 mmol/L outside and 14 mmol/L inside","108 mmol/L outside and 4 mmol/L inside"],2,"Sodium is the main ECF cation.","Na out, K in.",0,2],["Potassium concentration in ECF and ICF is about:",["140 mmol/L outside and 4.2 mmol/L inside","142 mmol/L outside and 14 mmol/L inside","24 mmol/L outside and 10 mmol/L inside","4.2 mmol/L outside and 140 mmol/L inside"],3,"Sodium and potassium are almost mirror images of each other across the membrane.","Ten-fold swaps: Na 142/14, K 4/140.",0,2],["Which of these ions is found mainly OUTSIDE the cell?",["Chloride","Potassium","Magnesium","Phosphate"],0,"Chloride is 108 mmol/L in ECF and 4 mmol/L in ICF. Potassium, magnesium and phosphate are higher inside.","ECF is the salty sea: Na and Cl.",0,2],["Which set of substances is characteristic of ICF?",["High sodium, high chloride and high bicarbonate","High sodium, high calcium and low protein","High potassium, high phosphate and high protein","High chloride, low potassium and low phosphate"],2,"ICF is the potassium farm: K, phosphate and protein.","Inside: K and proteins.",0,2],["What keeps the sodium and potassium concentration differences between ECF and ICF in place?",["Osmosis, driven by the plasma proteins","Simple diffusion through the lipid bilayer","The sodium-potassium pump, using ATP","Vesicular transport of sodium out of the cell"],2,"The pump keeps bailing sodium out and pulling potassium in. These gradients give the resting potential.","Pump = bailing the boat.",0,2],["Which wastes are carried in the ECF for removal?",["Oxygen, glucose and amino acids, with extra fatty acids and vitamins","Proteins, phosphates and potassium, with extra magnesium and iron","Albumin, haemoglobin and fibrinogen, with extra platelets and cells","Carbon dioxide, urea and uric acid, with excess water and ions"],3,"The ECF delivers nutrients (O2, glucose, fatty acids, amino acids) and collects wastes (CO2, urea, uric acid).","Nutrients in, wastes out, both via ECF.",1,2],["Which age group has the highest percentage of body water?",["Infants, about 73%","Adult males, about 60%","The elderly, about 45%","Adult females, about 50%"],0,"Infants have the most water and highest turnover, so they dehydrate fastest.","Baby = 73%. Old = 45%.",0,3],["Obese people have a lower percentage of body water because:",["fat tissue pulls water out of the cells","fat tissue contains little water","they lose more water through the skin","their kidneys excrete water faster"],1,"Fat holds little water, so the same applies to adult women, who carry more fat.","More fat, less water.",0,3],["Normal total daily water intake and total output are each about:",["1400 ml","6600 ml","2100 ml","2300 ml"],3,"In steady state intake equals output. 1400 ml is urine and 6600 ml is the total in prolonged heavy exercise.","Normal: 2300 in, 2300 out.",1,3],["In prolonged heavy exercise, daily sweat loss rises to about:",["350 ml","1400 ml","650 ml","5000 ml"],3,"Sweat rises from about 100 ml to 5000 ml per day, while urine falls from 1400 to 500 ml.","Exercise: sweat up, urine down.",0,3],["Insensible water loss at rest comes from:",["the skin (about 350 ml) and the lungs (about 350 ml)","the skin (about 100 ml) and the lungs (about 1400 ml)","the skin (about 350 ml) and the faeces (about 100 ml)","the sweat glands (about 100 ml) and the kidneys (about 1400 ml)"],0,"Insensible loss is water you lose without noticing, through skin and breath.","Insensible = not sensed.",0,3],["The hormone that retains water in the kidney and is released with thirst in dehydration is:",["Aldosterone","Insulin","ADH","Oxytocin"],2,"ADH retains water. Aldosterone retains sodium and therefore water.","ADH = anti-diuretic = keeps water.",0,4],["Pure water loss leads to which changes in the compartments?",["ECF and ICF volumes rise, and the osmolarity of both falls","ECF volume falls, but ICF volume rises, with no change in osmolarity","ICF volume falls, but ECF volume is unchanged in size","ECF and ICF volumes fall, and the osmolarity of both rises"],3,"Water leaves both compartments, so both shrink and both become more concentrated.","Lose water: both shrink, both concentrate.",1,4],["Which of these is a sign of dehydration?",["A rise in haemoglobin and haematocrit","A fall in haemoglobin and haematocrit","Increased skin elasticity and a moist tongue","Firm eyeballs with raised intraocular tension"],0,"Blood becomes concentrated (haemoconcentration), so Hb and PCV rise.","Thicker blood = higher PCV.",0,4],["Haemoglobin rises in dehydration because:",["red cells multiply rapidly in the marrow to carry more oxygen","the bone marrow releases extra haemoglobin directly into the plasma","the spleen releases stored red cells that are rich in haemoglobin","plasma volume falls while the number of red cells stays the same"],3,"The red cell number is unchanged but the plasma is less, so the blood is more concentrated.","Less water, same cells, higher concentration.",0,4],["In dehydration, blood pressure begins to fall after about how much water loss?",["4 to 6 litres","1 to 2 litres","10 to 12 litres","0.5 litres"],0,"Fall in BP is seen if 4 to 6 L is lost. The heart rate rises to compensate.","4 to 6 litres.",1,4],["Why do infants dehydrate fastest?",["They have the highest percentage of water and the highest water turnover","They have the lowest percentage of water and the highest metabolic heat","They have an immature thirst centre and so cannot ask for enough fluid","They have proportionally larger kidneys that quickly excrete extra water"],0,"Infants have about 73% water. The elderly (45%) also have little reserve.","High water share, high turnover.",0,4],["Which bedside signs does a nurse look for in dehydration?",["Moist mouth, good skin turgor, pale dilute urine and high blood pressure","Dry mouth, poor skin turgor, dark concentrated urine and low blood pressure","Swollen ankles, bounding pulse, frothy sputum and raised jugular venous pressure","Cold clammy hands, fine tremor, rapid breathing and a very high temperature"],1,"Sunken fontanelle in infants is another sign. Intake and output are recorded on the fluid balance chart.","Dry in, dry out.",0,4],["Treatment of dehydration is:",["fluid restriction with diuretics to remove extra ECF","high-sodium diet with no extra water for 24 hours","insulin infusion to move water into the cells","fluid replacement, orally with ORS or intravenously"],3,"Replacing the water lost restores both compartments.","ORS works because of Na-glucose co-transport.",0,4]]},{"t":"Transport Through the Cell Membrane","s":["Channels and categories","Simple diffusion","Osmosis and tonicity","Facilitated diffusion","Primary active transport","Secondary active transport","Vesicular transport and comparisons"],"q":[["Lipid-soluble substances such as O2, CO2, alcohol and steroids cross the membrane:",["only through gated sodium channels","only by carrier proteins using ATP","only inside vesicles by exocytosis","directly through the lipid bilayer"],3,"Fat-soluble substances dissolve in the oily middle. Water-soluble ones use channels and carriers.","Oily passes oily.",0,0],["Voltage-gated channels open in response to:",["binding of a chemical messenger","stretch or pressure on the membrane","a change in membrane potential","none of these, because they stay open all the time"],2,"The Na and K channels of the nerve action potential are voltage-gated.","Voltage in the name, voltage opens it.",0,0],["The nicotinic ACh receptor channel at the neuromuscular junction is a:",["voltage-gated channel","mechanically gated channel","leak channel","ligand-gated channel"],3,"It opens when acetylcholine binds.","Ligand = chemical key.",0,0],["Which channel type is found in touch and hearing receptors?",["Ligand-gated ion channels","Mechanically gated channels","Voltage-gated ion channels","Leak (non-gated) channels"],1,"Mechanically gated channels open with stretch or pressure.","Touch = mechanical.",0,0],["Which always-open channel sets the resting membrane potential?",["Voltage-gated sodium channel","Nicotinic ACh channel","Potassium leak channel","Voltage-gated calcium channel"],2,"K leak channels let potassium out, making the inside negative.","K leak = rest.",0,0],["Passive transport differs from active transport because passive transport:",["needs ATP as metabolic energy and runs up the gradient","needs ATP as metabolic energy but runs down the gradient","needs no metabolic energy (ATP) and runs down the gradient","needs no metabolic energy (ATP) but runs up the gradient"],2,"Passive transport is downhill and free. Active transport is uphill and pays ATP.","Passive = Downhill = Free.",0,0],["The three types of passive transport are:",["simple diffusion, primary active transport and osmosis","facilitated diffusion, secondary active transport and endocytosis","simple diffusion, facilitated diffusion and osmosis","osmosis, exocytosis and primary active transport"],2,"Active transport is primary and secondary. Vesicular transport is separate and needs ATP.","Some Friends Own: Simple, Facilitated, Osmosis.",0,0],["Which substance CANNOT cross the membrane by simple diffusion?",["Large polar molecules such as glucose","Non-polar molecules such as oxygen","Small polar covalent molecules such as CO2","Water, which is small and uncharged"],0,"Glucose, charged ions, proteins and nucleic acids need other routes.","Big and polar means no entry.",0,0],["Simple diffusion is powered by:",["ATP split by a carrier protein embedded in the membrane","the sodium gradient built by the pump across the membrane","the thermal (kinetic) energy of the diffusing molecules","the electrical pull of the negative cell interior only"],2,"It needs no cellular metabolic energy.","Random motion does the work.",0,1],["At equilibrium, simple diffusion:",["stops completely because all molecules stop moving at once","reverses direction so that the original gradient forms again","stops producing net movement, although molecules keep moving","continues at the same net rate until the cell becomes full"],2,"Equal concentrations on both sides mean no net change.","Movement continues, net change stops.",0,1],["Which change would SLOW the rate of diffusion?",["A greater surface area, as when microvilli line the small intestine","A thicker membrane, as when fluid fills the lung in pulmonary oedema","A higher temperature, which speeds up the movement of molecules","A steeper concentration gradient between the two sides of the membrane"],1,"Fick's law: rate is proportional to area times gradient times permeability, divided by thickness.","Thickness is in the denominator.",1,1],["Which statement matches Fick's law?",["Rate is proportional to (thickness x concentration difference x permeability) divided by area","Rate is proportional to (permeability x thickness x temperature) divided by concentration difference","Rate is proportional to (surface area x thickness) divided by (temperature x permeability)","Rate is proportional to (area x concentration difference x permeability) divided by thickness"],3,"Everything on top speeds diffusion. Thickness slows it.","Area, gradient, permeability up. Thickness down.",0,1],["Microvilli in the small intestine and kidney tubule increase:",["surface area for diffusion","membrane thickness","the electrical gradient","the osmotic pressure of plasma"],0,"More area means more diffusion.","Microvilli = more area.",0,1],["Why are positive ions pulled into a cell with a negative inside, even if their concentration inside is already higher?",["The membrane pumps them in using ATP against the chemical gradient, ignoring the electrical charge","Electrical and chemical gradients add or oppose, and the net electrochemical gradient decides","The chemical gradient always overrules the electrical gradient for every positive ion in the cell","Positive ions are carried inside vesicles, so neither gradient is involved in their movement"],1,"For ions the driving force has a chemical and an electrical part.","Ions feel two forces, not one.",1,1],["Which of these is an example of simple diffusion?",["Glucose entering a muscle cell through GLUT4","Sodium leaving a neuron through the pump","An antibody crossing an epithelium inside a vesicle","Oxygen moving from the lungs into the blood"],3,"Oxygen and carbon dioxide move by simple diffusion down their gradients.","Gases = simple diffusion.",0,1],["Simple diffusion is described as 'non-carrier-mediated' because:",["it needs a carrier protein, although no ATP is used in the process","it needs no protein carrier, only the lipid bilayer or open channels","it needs both a carrier protein and ATP to move the molecule across","it depends on vesicles that are pinched off from the cell membrane"],1,"Facilitated diffusion is the carrier-mediated passive type.","No carrier, no saturation.",0,1],["Osmosis is best defined as:",["net movement of solute across a membrane from high to low water concentration using ATP energy","net movement of water across a membrane against its own gradient using a carrier and ATP","net diffusion of water across a semipermeable membrane towards the higher solute concentration","net diffusion of solute across the membrane until the water concentration becomes equal"],2,"Water moves towards the higher solute concentration. Salt is a magnet for water.","Salt sucks water.",0,2],["Which two conditions are needed for osmosis?",["A difference in water temperature, and a membrane permeable to the solute","ATP from the cell, and a membrane that contains carrier proteins for water","A difference in solute concentration, and a membrane impermeable to the solute","A transport vesicle in the cytoplasm, and a membrane with calcium channels"],2,"Without a solute difference or a solute-blocking membrane, water has no net movement.","Gradient plus barrier.",0,2],["Osmotic pressure depends on:",["the size of the osmotically active particles, not their number per litre","the temperature of the solution itself, not the number of particles","the thickness of the membrane itself, not the number of particles","the number of osmotically active particles per litre, not their size"],3,"About 1 mOsm/L gives about 19.3 mmHg of osmotic pressure.","Count particles, not size.",0,2],["Colloid osmotic (oncotic) pressure is due to:",["sodium ions, which draw water into the cells of the body","glucose molecules, which pull water out of all the cells","red blood cells, which fill the lumen of the capillary","plasma proteins, which help hold water in the capillaries"],3,"Proteins cannot cross the capillary wall easily, so they hold water in the blood.","Oncotic = protein pull.",0,2],["A red blood cell in an isotonic solution:",["gains water by osmosis, swells and may burst","loses water by osmosis, shrinks and crenates","keeps its shape, with no net water movement","releases its haemoglobin and turns pale at once"],2,"0.9% NaCl (normal saline) is isotonic.","Isotonic = nothing happens.",0,2],["A red blood cell placed in pure water will:",["shrink and become crenated","swell and burst (haemolysis)","keep its normal biconcave shape","release sodium and gain potassium"],1,"Pure water is hypotonic, so water rushes in.","Hypo = Hippo: fat and burst.",0,2],["A red blood cell in 3% saline will:",["lose water, shrink and become crenated","gain water by osmosis, swell and burst","stay the same shape with no change in size","gain sodium by active transport, then swell"],0,"3% saline is hypertonic. Water is drawn out of the cell.","Hyper = shrivel.",0,2],["Which of these is isotonic with red blood cells?",["0.45% NaCl","3% NaCl","0.9% NaCl","Pure water"],2,"0.45% is hypotonic. 3% is hypertonic. 5% dextrose is isotonic only until the glucose is used.","Normal saline = 0.9%.",0,2],["Why is 5% d
