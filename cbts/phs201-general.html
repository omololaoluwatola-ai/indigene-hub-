extrose (D5W) said to become hypotonic in the body?",["The glucose is metabolised, leaving free water","The kidney excretes all the glucose unchanged at once","Its sodium is removed by the pump in the red cells","The red cells swell and release extra solute"],0,"It is isotonic in the bag but behaves as free water once the glucose is used.","Sugar burns, water stays.",1,2],["Hypertonic saline is reserved for:",["routine replacement of fluid lost in mild diarrhoea or vomiting in children","all patients who cannot drink after minor surgery and need maintenance fluid","treating simple dehydration in infants and children being managed at home","severe hyponatraemia and raised intracranial pressure, under close monitoring"],3,"Wrong fluids can shift water into or out of brain cells.","Hypertonic saline is a special-use fluid.",1,2],["Facilitated diffusion is:",["carrier-mediated, up the gradient and with direct ATP use","non-carrier, down the gradient and with no ATP","carrier-mediated, down the gradient and with no ATP","carrier-mediated, up the gradient and with indirect ATP use"],2,"Carriers do not mean active. Active means ATP and uphill.","Taxi, but free, and downhill only.",1,3],["Facilitated diffusion shows saturation because:",["the number of carriers is limited and all become busy at a maximum rate (Vmax)","ATP supply runs out when the concentration of the substance becomes very high","the membrane becomes steadily thicker as the concentration of the substance rises","the electrical gradient reverses direction when the concentration is very high"],0,"Simple diffusion does not saturate.","Limited taxis, limited rate.",0,3],["In muscle and fat cells, insulin raises the number of which carrier in the membrane?",["SGLT","GLUT4","Na/K ATPase","Ca ATPase"],1,"More GLUT4 carriers mean more glucose enters the cell by facilitated diffusion.","Insulin = GLUT4.",0,3],["Which pair is carried across by facilitated diffusion?",["Oxygen and carbon dioxide","Glucose and most amino acids","Steroids and alcohol","Sodium and potassium against their gradients"],1,"They are too large and polar for the bilayer.","Big polar nutrients ride the free taxi.",0,3],["Which feature is found in facilitated diffusion but NOT in simple diffusion?",["Saturation and high specificity","Use of ATP and movement uphill","Net movement down its gradient","Driving by thermal energy alone"],0,"Both are passive and downhill.","Saturation, specificity, competition.",1,3],["Compared with simple diffusion at low concentrations, facilitated diffusion is:",["slower, because carriers must first bind ATP","the same speed, because both are passive","unable to operate, because the gradient is too small","faster, because carriers help the substance across"],3,"At low concentration carriers give faster transport, then saturate at high concentration.","Carriers help at low levels.",1,3],["A competitive inhibitor can slow facilitated diffusion because it:",["pumps the substance back out of the cell using ATP","binds the same carrier and blocks the carrier site","thickens the membrane and slows the diffusion rate","abolishes the concentration gradient across the cell"],1,"Carriers are specific and can be competitively inhibited.","Carrier = shared taxi.",0,3],["In primary active transport, energy comes from:",["the sodium gradient that was built earlier by a pump in the membrane","direct hydrolysis of ATP by the carrier, which is itself an ATPase","the thermal and kinetic energy of the molecules as they diffuse","the electrical gradient across the membrane acting on charged ions"],1,"The carrier is phosphorylated by ATP and changes shape.","Primary = ATP directly.",0,4],["Each cycle of the sodium-potassium pump moves:",["2 Na+ out and 3 K+ in","3 Na+ in and 2 K+ out","2 Na+ in and 3 K+ out","3 Na+ out and 2 K+ in"],3,"It uses one ATP per cycle.","The bigger number, 3, goes with sodium, and sodium leaves.",0,4],["The sodium-potassium pump is called electrogenic because it:",["removes one net positive charge from the cell each cycle","adds one net positive charge to the cell during each cycle","moves equal numbers of positive and negative ions each cycle","stops all ion movement through the leak channels in the cell"],0,"3 positives go out and 2 come in. This adds about -4 mV to the resting potential.","Lose a positive, gain negativity.",0,4],["The pump uses about what share of the energy of a neuron?",["About 5%","About 20% at most","Up to about 70%","About 100%"],2,"In cells generally the pump uses about one third of ATP, and up to 70% in neurons.","Neurons are pump-heavy.",1,4],["The sodium-potassium pump is inhibited by:",["omeprazole and ranitidine (acid blockers)","ouabain and digoxin (cardiac glycosides)","lignocaine and bupivacaine (anaesthetics)","tetraethylammonium and 4-aminopyridine"],1,"Digoxin is used in heart failure for this reason. Omeprazole blocks the H/K ATPase.","Digoxin and ouabain block the Na/K pump.",1,4],["Which is NOT one of the four functions of the steep Na/K gradient?",["Providing energy for coupled transport","Regulating the basal metabolic rate","Keeping cell volume steady","Making ATP from glucose in the cytosol"],3,"The four functions are Coupling, BMR, Impulses and Osmosis.","Coupling, BMR, Impulses, Osmosis.",1,4],["The pump helps to keep cell volume steady by:",["removing sodium, which would otherwise draw water into the cell","pulling water out of the cell through direct use of ATP energy","adding potassium, which draws water out of the cell by osmosis","opening aquaporins on the outer surface of the cell to let water out"],0,"Sodium is osmotically active. If it stayed in, water would follow and the cell would swell.","No pump, swollen cell.",0,4],["Calcium ATPase keeps cytosolic calcium at about:",["10^-3 mol/L (as outside)","10^-5 mol/L (moderate)","10^-1 mol/L (very high)","10^-7 mol/L (very low)"],3,"It pumps calcium out of the cell or into the SR or ER. During contraction calcium rises to about 10^-5 M.","Calcium is kept very low at rest.",1,4],["Where does the H+/K+ ATPase secrete acid, and which drug blocks it?",["Gastric chief cells, blocked by digoxin","Kidney collecting duct only, blocked by ouabain","Gastric parietal cells, blocked by omeprazole","Muscle sarcolemma, blocked by atropine"],2,"It also acidifies urine in the kidney. Omeprazole is a proton-pump inhibitor.","PPIs block the proton pump.",0,4],["Which of these is an example of primary active transport?",["Na-glucose co-transport","Na-Ca exchange","Calcium ATPase","Cl-HCO3 exchange in red cells"],2,"The others are secondary active transporters using the sodium gradient.","ATPase in the name = primary.",1,4],["The sarcoplasmic reticulum calcium pump (SERCA) is essential for:",["muscle relaxation","muscle contraction only","the resting membrane potential only","the action potential upstroke"],0,"SERCA pumps calcium back into the SR using ATP, allowing relaxation.","ATP is needed to relax too.",0,4],["Which statement about digoxin is correct?",["It activates the Na/K pump and is used in hypertension","It blocks the H/K pump and is used in ulcers","It blocks the Ca pump and is used in tetany","It blocks the Na/K pump and is used in heart failure"],3,"Pump inhibition raises intracellular sodium and calcium, strengthening the heart contraction.","Digoxin = pump blocker for the heart.",1,4],["Secondary active transport uses energy from:",["the sodium gradient, which was built by the pump using ATP","direct hydrolysis of ATP by the carrier protein itself","the thermal energy of the diffusing molecules as they move","the electrical gradient across the cell membrane only"],0,"ATP is used indirectly, to keep the sodium gradient in place.","Waterfall that turns a wheel.",0,5],["In co-transport (symport), the second substance moves:",["in the opposite direction to sodium, out of the cell","in the same direction as sodium, into the cell","through a vesicle, with sodium in a second vesicle","against sodium, using direct ATP hydrolysis"],1,"Symport = same direction. Antiport = opposite direction.","Sym = Same.",0,5],["Which of these is an example of counter-transport (antiport)?",["Na-glucose co-transport (SGLT)","Na-amino acid co-transport","GLUT4 in muscle","Na-Ca exchange"],3,"Na-Ca and Na-H exchange and Cl-HCO3 exchange are antiports.","Antiport = Against.",0,5],["Oral rehydration solution works because of:",["Na-glucose co-transport, which helps sodium and water be absorbed in diarrhoea","the sodium-potassium pump, which pushes water into the gut lumen using ATP","simple diffusion of glucose, which drags sodium and water in by osmosis only","facilitated diffusion of sodium alone, which needs no energy source at all"],0,"Glucose helps sodium absorption, and water follows.","ORS = secondary active transport saving lives.",0,5],["Why is the Na-glucose co-transport called SECONDARY active transport?",["ATP is used directly by the carrier itself to move glucose up its gradient","no ATP is used at any stage, because sodium enters by simple diffusion","ATP is used indirectly to keep the sodium gradient, not by the carrier itself","glucose moves down its gradient, so the transport is only passive diffusion"],2,"Sodium flows downhill and drags glucose uphill.","No direct ATP on the carrier.",0,5],["Loop and thiazide diuretics act by:",["blocking the sodium-potassium pump in every cell","blocking the H/K ATPase in the stomach","blocking sodium co-transporters in the kidney","activating aquaporins in the collecting duct"],2,"Digoxin blocks the pump. Diuretics block kidney co-transporters.","Diuretics block Na co-transporters.",1,5],["Which feature is the same for primary and secondary active transport?",["The carrier protein is itself an ATPase enzyme","The main solute moves against its gradient","ATP is split directly by the carrier protein","The sodium gradient is the energy source used"],1,"Primary uses ATP directly. Secondary uses the sodium gradient. Both move the solute uphill.","Both are uphill.",1,5],["Which of these is a form of endocytosis?",["Exocytosis, transcytosis and facilitated diffusion of glucose","Osmosis, simple diffusion and primary active transport","Phagocytosis, pinocytosis and receptor-mediated endocytosis","Symport, antiport, uniport and facilitated diffusion"],2,"Endocytosis takes material into the cell in vesicles and needs ATP.","Phagocytosis = cell eating. Pinocytosis = cell drinking.",0,6],["Which example uses receptor-mediated endocytosis in clathrin-coated pits?",["Release of acetylcholine from a motor nerve ending","Uptake of LDL cholesterol and transferrin-bound iron","Movement of oxygen into red blood cells by diffusion","Glucose absorption in the proximal kidney tubule cells"],1,"Neutrophils engulfing bacteria is phagocytosis.","LDL and iron come in by receptor-mediated endocytosis.",1,6],["Exocytosis is calcium-dependent and is used for:",["hormone secretion and neurotransmitter release","uptake of LDL cholesterol through coated pits","engulfing bacteria by neutrophils and macrophages","movement of oxygen across the alveoli into blood"],0,"The vesicle fuses with the plasma membrane and releases its contents.","Calcium in = vesicle out.",0,6],["Transcytosis is:",["exocytosis on one side and diffusion on the other","endocytosis followed by digestion inside a lysosome","endocytosis on one side of the cell and exocytosis on the other","primary active transport followed by secondary active transport"],2,"An example is antibody transfer across epithelia.","Trans = across.",1,6],["Which of these does NOT use a carrier protein?",["Facilitated diffusion of glucose","The sodium-potassium ATPase pump","Na-glucose co-transport in gut","Osmosis through the lipid bilayer"],3,"Water crosses the bilayer or aquaporins, down its gradient.","Osmosis has no carrier.",0,6],["Which list names the factors that affect the rate of diffusion?",["ATP supply, carrier number, membrane charge and age of the cell","Vesicle size, gene activity, pH of cytosol and number of ribosomes","Concentration gradient, permeability, temperature and surface area","Sodium level, calcium level, magnesium level and chloride level"],2,"Thickness slows diffusion; the other four listed in the correct answer speed it.","Gradient, Permeability, Temperature, Area.",0,6],["Which of these moves substances uphill but uses ATP only indirectly?",["Primary active transport","Secondary active transport","Carrier-mediated diffusion","Diffusion through the bilayer"],1,"Only secondary active transport is uphill with indirect ATP use.","Indirect = secondary.",0,6]]},{"t":"Membrane Potentials","s":["Membrane potential basics","Diffusion and Nernst potentials","Goldman equation and permeability","Resting membrane potential","Terms and clinical links"],"q":[["The membrane potential is defined as:",["the number of ions inside the cell compared with the number outside, measured in mmol/L","the electrical charge carried by the plasma proteins inside the cell, measured in coulombs","the hydrostatic pressure difference between the two sides of the membrane, measured in mmHg","the voltage difference between the inside and the outside of the cell, measured in millivolts"],3,"By convention the outside is zero, so the inside is negative at rest.","Outside = 0. Inside = negative.",0,0],["Which two things are needed to create a membrane potential?",["Equal ion distribution, and a membrane that is equally permeable to all the ions","Unequal water distribution, and a membrane that is completely impermeable to all ions","Unequal ion distribution, and a membrane selectively permeable to some of those ions","Equal protein distribution, and a membrane that is permeable only to chloride ions"],2,"Pumps make the unequal distribution. Channels give selective permeability.","Gradient plus selectivity.",0,0],["At rest the membrane potential of large nerve fibres and skeletal muscle is about:",["-70 mV","+35 mV","-90 mV","-55 mV"],2,"Many neurons sit around -70 mV, but large nerve fibres and skeletal muscle are about -90 mV.","-90 for nerve fibre and skeletal muscle.",0,0],["Which resting membrane potentials are correctly matched to tissue?",["Cardiac muscle about -50 to -60 mV, smooth muscle about -85 to -90 mV","Cardiac muscle about +35 mV, smooth muscle about -55 mV","Cardiac muscle about -85 to -90 mV, smooth muscle about -50 to -60 mV","Cardiac muscle about -10 mV, smooth muscle about -90 mV"],2,"Red blood cells are about -10 mV.","Heart is like skeletal muscle. Smooth muscle is less negative.",1,0],["The charge difference across the membrane involves:",["the majority of ions throughout the cell and all of the extracellular fluid volume","every sodium ion in the body fluids, which is why the entire cell becomes positive","only the proteins inside the cell, because the ions play no part in the voltage","only a thin layer of ions right next to the membrane, a tiny fraction of all the ions"],3,"The bulk of the fluid on both sides stays electrically neutral.","Thin film of charge, not a whole cell of it.",1,0],["The diffusion (equilibrium) potential for an ion is the voltage at which:",["the chemical force falls to zero, so that no ion moves through any open channel","the electrical force is zero, so the ion moves only by its concentration gradient","the electrical force exactly balances the chemical force, so net movement is zero","the pump takes over from the channels and moves the ion across using ATP energy"],2,"At that voltage the inward electrical pull equals the outward chemical push.","Tug of war with equal ropes.",0,1],["At 37 °C the Nernst potential for a cation is calculated as:",["E = +61 x log (concentration inside / concentration outside)","E = -94 x log (concentration outside / concentration inside)","E = +61 x log (concentration outside / concentration outside)","E = -61 x log (concentration inside / concentration outside)"],3,"The sign for positive ions is negative. For anions it is positive.","Cations: minus 61, inside over outside.",0,1],["What is the Nernst potential for potassium (140 mmol/L inside, 4 mmol/L outside)?",["About +94 mV","About -61 mV","About +61 mV","About -94 mV"],3,"-61 x log 35 = -61 x 1.54 = about -94 mV.","K = -94.",0,1],["What is the Nernst potential for sodium (14 mmol/L inside, 142 mmol/L outside)?",["About -61 mV","About +94 mV","About +61 mV","About -94 mV"],2,"-61 x log 0.1 = -61 x (-1) = +61 mV.","Mostly outside = positive.",0,1],["What is the Nernst potential for chloride, using the guide's value?",["About -70 mV","About +70 mV","About -94 mV","About +61 mV"],0,"Chloride is passively distributed in line with the potential.","K -94, Na +61, Cl -70.",1,1],["Calculate the Nernst potential for potassium if the inside is 100 mmol/L and the outside is 10 mmol/L.",["+61 mV","-122 mV","-61 mV","-10 mV"],2,"The ratio is 10 and the log of 10 is 1, so E = -61 x 1 = -61 mV.","Ratio 10 gives 61.",0,1],["Why is the sodium Nernst potential positive while the potassium one is negative?",["Sodium is mostly outside, so the inside would need to be positive to stop sodium entering","Sodium is mostly inside, so the inside would need to be negative to stop sodium leaving","Sodium is a negatively charged ion in plasma, while potassium is a positively charged ion","Sodium has a higher resting permeability than potassium in nearly every excitable cell"],0,"Both are cations and both start with -61. The log of the sodium ratio is negative, giving +61.","Mostly out = positive. Mostly in = negative.",1,1],["If the concentration of potassium outside the cell rises, the potassium Nernst potential becomes:",["more negative","less negative","unchanged","positive"],1,"A smaller inside/outside ratio gives a smaller log, so the potential moves towards zero. That is why hyperkalaemia depolarises cells.","Raise outside K, E(K) moves toward zero.",1,1],["Nernst values are calculated and not fixed because:",["they change whenever the inside or outside concentrations change","they depend only on the size of the cell and the age of the person","they are set by the sodium-potassium pump in every type of cell","they are fixed by the membrane thickness and its cholesterol content"],0,"The -94 and +61 mV apply only to the normal concentrations.","Same recipe, new numbers.",0,1],["The Goldman equation gives the membrane potential:",["when only one ion is involved, using its concentrations alone","when the pump is blocked and no ion is moving across the membrane","when several ions are involved, each with its own permeability","when the cell is dead and all the gradients have disappeared"],2,"The Nernst equation is for one ion. The Goldman equation covers several.","One ion = Nernst. Many = Goldman.",0,2],["Which three factors decide the membrane potential in the Goldman equation?",["The size of each ion, the number of pumps, and the thickness of the membrane layer","The body temperature, the ATP supply, and the volume of the cell and its organelles","The number of channels, the cholesterol content, and the net charge of the proteins","The charge of each ion, its permeability, and its concentrations inside and outside"],3,"The ion with the greatest permeability dominates.","Charge, Permeability, Concentration (CPC).",0,2],["At rest the membrane is about how many times more permeable to K+ than to Na+?",["About 5000 times","50 to 100 times","About 2 times","About 1 time (equal)"],1,"Resting potential therefore sits close to the potassium potential.","Rest = 50 to 100. Spike = 5000.",1,2],["During the action potential, permeability to Na+ rises about:",["approximately 100-fold","approximately 10-fold","approximately 2-fold","approximately 5000-fold"],3,"The voltage then swings towards the sodium Nernst potential of +61 mV.","Spike = 5000.",1,2],["The resting potential is close to E(K) rather than E(Na) because:",["potassium concentration is higher outside the cell than inside it","the resting membrane is far more permeable to K+ than to Na+","sodium cannot enter the cell through any of the open channels","the pump removes all of the sodium from inside the cell at rest"],1,"The ion with the greatest permeability dominates the voltage.","K is the King of rest.",0,2],["The resting membrane potential is the potential across the membrane of an excitable cell:",["at the peak of the action potential","during the absolute refractory period","at the threshold of firing","when it is not producing impulses"],3,"At rest the inside is negative and nothing is firing.","Rest = no impulse.",0,3],["The potassium diffusion potential on its own is about -94 mV. Sodium leak then:",["makes the potential less negative, to about -86 mV","makes the potential more negative, to about -100 mV","makes the potential positive, to about +35 mV","has no effect on the potential at all"],0,"Positive sodium entering reduces the negativity.","Na leak nudges up.",0,3],["The sodium-potassium pump adds about how much to the resting potential?",["+4 mV","-40 mV","-0.4 mV","-4 mV"],3,"3 positive charges leave and 2 enter, so one positive charge is lost each cycle. Minus 86 minus 4 gives minus 90.","K = -94, Na to -86, pump -4, result -90.",0,3],["Which list gives the contributors to the resting potential, in the correct order?",["Na+ leak (-86), K+ leak (-94), Na/K pump (+4), giving a net -90 mV","Na/K pump (-94), K+ leak (-4), Na+ leak (-86), giving -90 mV","K+ leak (-94), Na+ leak (to -86), Na/K pump (-4), giving -90 mV","K+ leak (-86), Na/K pump (-94), Na+ leak (-4), giving -90 mV"],2,"K sets it, Na nudges it up, the pump nudges it down.","K, Na, Pump: -94, -86, -4.",1,3],["Which contributor to the resting potential is the dominant one?",["Sodium diffusion into the cell at rest","Direct electrogenic action of the pump alone","Potassium diffusion through leak channels","The negative charge carried by chloride ions"],2,"K diffusion alone gives about -94 mV.","K is the King.",0,3],["The sodium-potassium pump matters most for the resting potential in the long term because it:",["makes all of the resting voltage by itself, without any ion leak","stops all the potassium from leaving through the leak channels","keeps the sodium and potassium gradients from running down","blocks the firing of action potentials during the resting state"],2,"The -4 mV is small. The pump's bigger job is to keep the gradients alive.","Pump saves the gradients.",1,3],["Which negatively charged particles inside the cell cannot cross the membrane?",["Sodium and calcium ions in the cytosol","Potassium and magnesium ions in the cytosol","Large proteins, phosphates and sulphates","Calcium and hydrogen ions in the cytosol"],2,"They help leave the inside negative, together with the Donnan effect.","Big anions are trapped.",0,3],["Why does the potassium potential differ from the resting potential?",["Because the potassium concentration is different in every type of cell","Because potassium leaves the cell through voltage-gated channels only","Because a little sodium leaks in and the pump adds a small extra negativity","Because the pump uses up all the potassium that leaks out of the cell"],2,"-94 mV with a Na leak becomes -86 mV, then the pump brings it to about -90 mV.","-94 to -86 to -90.",1,3],["Depolarisation means that the membrane potential:",["becomes more negative than the resting level of the cell","returns to the resting level after the action potential has fired","stays fixed at -90 mV, with no change in the voltage at all","becomes less negative, moving towards zero or even positive"],3,"Sodium entering the cell is the usual cause.","De = lose the negativity.",0,4],["A change from -90 mV to -100 mV is called:",["hyperpolarisation","partial depolarisation","slow repolarisation","positive overshoot"],0,"Hyper means more than normal. The inside becomes more negative than rest.","Hyper = more negative.",0,4],["Repolarisation is:",["the fall of the potential below the resting level after the spike","the rise of the potential from the resting level up to threshold","the return of the potential to the resting level after depolarisation","the part of the spike above zero, where the inside becomes positive"],2,"Potassium leaving the cell is the usual cause.","Re = return.",0,4],["Overshoot is:",["the critical level of depolarisation at which the action potential fires","the part of the action potential above zero, where the inside is positive","the dip below the resting level that follows the end of the whole spike","the slow depolarisation that is seen during accommodation of the nerve"],1,"Threshold is the trigger level at about -55 mV.","Overshoot = above zero.",0,4],["Threshold potential is about:",["-90 mV","-55 mV","+35 mV","-70 mV"],1,"It is the critical depolarisation at which an action potential fires.","Rest -90, trigger -55, peak +35.",0,4],["In hyperkalaemia the resting membrane potential becomes:",["more negative, further from threshold","positive, above threshold at all times","less negative, closer to threshold","unchanged, because potassium has no effect"],2,"Cells are first more excitable, then fail to repolarise. Severe hyperkalaemia can stop the heart.","High K outside = depolarised.",1,4],["In hypokalaemia the cells are:",["depolarised, with spasm and tetany","unchanged, because sodium dominates","permanently at threshold, with continuous firing","hyperpolarised, with weakness and arrhythmias"],3,"Low K outside makes the K gradient steeper, so the inside becomes more negative.","Low K = hyperpolarised.",1,4],["Which statement correctly lists the Nernst values and resting potential?",["E(K) -61 mV, E(Na) +94 mV, E(Cl) -90 mV, resting about -70 mV","E(K) -94 mV, E(Na) +61 mV, E(Cl) -70 mV, resting about -90 mV","E(K) +94 mV, E(Na) -61 mV, E(Cl) -70 mV, resting about -90 mV","E(K) -94 mV, E(Na) -61 mV, E(Cl) +70 mV, resting about -90 mV"],1,"Learn K = -94, Na = +61, Cl = -70.","Say it like a phone number.",1,4],["Which fact explains why serum potassium is monitored so closely?",["Small changes alter the resting potential of nerve, muscle and heart cells","Potassium is the main cation in plasma and sets the plasma osmolarity","Potassium alone controls the volume of the extracellular fluid space","Potassium is the main buffer that controls the blood pH in plasma"],0,"Hyper- and hypokalaemia both cause arrhythmias and weakness.","K matters because it sets rest.",1,4]]},{"t":"Physiology of Excitable Tissues","s":["Excitable tissues and properties","Stimulus, rheobase and chronaxie","Neuron and glia","Graded potentials versus action potentials","Factors affecting excitability"],"q":[["Excitable tissues are tissues whose cells can:",["divide rapidly in response to a stimulus by entering mitosis","respond to a stimulus by generating an action potential","store glycogen in response to a stimulus using insulin signals","contract without any electrical change in the membrane"],1,"Nerve and muscle are the main excitable tissues. Some gland cells, such as pancreatic beta cells, also are.","No Action, No Movement (NAM).",0,0],["All cells have a resting membrane potential, but only excitable cells:",["have voltage-gated Na+ and K+ channels that allow an action potential","have a sodium-potassium pump that keeps the ionic gradients steady","have a negative charge inside the membrane from trapped anions","have potassium leak channels that set the resting level near -90 mV"],0,"Everyone rests, only nerve and muscle fire.","Rest is universal. Firing is special.",1,0],["Which property is possessed by muscle only?",["Excitability","Conductivity","Refractoriness","Contractility"],3,"Nerve and muscle share excitability, conductivity and refractoriness. Only muscle can shorten.","Contractility = muscle only.",1,0],["Refractoriness is:",["the ability to conduct an action potential along a fibre at constant speed and without loss of size","the ability to respond to a stimulus by producing an action potential at any time","the stable negative potential across the membrane of a neuron at rest, near -70 mV","a short period after an action potential during which excitability is reduced or absent"],3,"It makes the impulse travel one way and limits firing frequency.","Refractory = recovering.",0,0],["Which of these is NOT a type of stimulus?",["Electrical (a pulse of current)","Metabolic (blood sugar level)","Mechanical (touch or pressure)","Thermal (heat or cold on skin)"],1,"Types of stimulus are electrical, chemical, mechanical and thermal.","Electric, Chemical, Mechanical, Thermal.",1,0],["A subthreshold stimulus produces:",["only a local, graded potential that dies out","a full action potential that travels along the fibre","a larger action potential than a threshold stimulus","no change in the membrane potential at all"],0,"Too weak to reach about -55 mV, so no spike.","Below threshold = no spike.",0,1],["A suprathreshold stimulus produces:",["the same action potential as a threshold stimulus, because the response is all-or-none","a larger action potential, because a stronger stimulus opens more sodium channels","a smaller action potential, because of accommodation in the membrane near the peak","no action potential, because the membrane is still in its refractory period"],0,"In a whole nerve it may recruit more fibres, but each fibre fires the same-size spike.","Strength changes frequency and recruitment, not size.",0,1],["Rheobase is:",["the time for which a current of twice the rheobase must flow to excite the tissue","the minimum strength of a long-lasting current that just produces an action potential","the minimum time that a current of rheobase strength must flow to excite the tissue","the adjustment of the membrane when a stimulus rises slowly towards threshold"],1,"Chronaxie is the time for twice the rheobase. Utilisation time is for the rheobase current.","Rheobase = strength. Chronaxie = time at 2x.",1,1],["A short chronaxie means the tissue is:",["less excitable","fully inexcitable","permanently depolarised","more excitable"],3,"Think of how fast a button responds.","Short chronaxie = jumpy tissue.",0,1],["Accommodation occurs when:",["a stimulus is very strong, so extra Na channels open at once and the spike grows larger","a stimulus rises slowly, so Na channels inactivate and K channels open before threshold is reached","a stimulus is applied repeatedly, so the pump runs out of ATP and the membrane depolarises","a stimulus is subthreshold, so a local potential spreads along the fibre and dies out"],1,"The membrane adjusts and fails to fire even when the voltage reaches threshold.","Slow push = no spike.",1,1],["Which part of the neuron is the trigger zone where the action potential starts?",["The dendrites and their many spines","The cell body (soma) and its nucleus","The axon terminals and their boutons","The axon hillock and initial segment"],3,"It has the highest density of voltage-gated Na channels.","Hillock = trigger zone.",0,2],["Dendrites:",["receive signals and conduct them towards the soma","conduct the action potential away from the soma","release neurotransmitter by exocytosis into the cleft","make the myelin sheath of axons in the CNS"],0,"Dendrites are Door in. The axon is Away.","Dendrites = Door in.",0,2],["Which cell forms the myelin sheath in the PNS?",["Schwann cell","Oligodendrocyte","Astrocyte","Microglia"],0,"A Schwann cell myelinates one segment of one axon. An oligodendrocyte myelinates several axons in the CNS.","Schwann = Single axon, PNS.",0,2],["Which cell myelinates several axons in the CNS?",["Schwann cell","Satellite cell","Oligodendrocyte","Ependymal cell"],2,"Oligo means few or many branches. One cell, many axons, central.","Oligodendrocyte = One cell, many axons.",0,2],["Astrocytes:",["are the phagocytic immune cells of the brain that engulf debris and dead cells","line the ventricles and make cerebrospinal fluid in the choroid plexus tissue","support cell bodies inside peripheral ganglia and form a thin capsule round them","support neurons, form the blood-brain barrier and take up K+ and neurotransmitters"],3,"Microglia are phagocytes. Ependymal cells line ventricles. Satellite cells support PNS cell bodies.","Astrocytes: support, barrier, uptake.",1,2],["Which type of neuron carries information TO the central nervous system?",["Sensory (afferent)","Motor (efferent)","Interneuron","Multipolar neuron only"],0,"Motor neurons carry commands from the CNS to muscles and glands.","Afferent Arrives.",0,2],["Nodes of Ranvier are:",["the junctions between nerve and muscle","the spaces between two sarcomeres","the folds of the motor end-plate","gaps in the myelin sheath"],3,"Voltage-gated Na channels are concentrated at the nodes.","Nodes = gaps in myelin.",0,2],["Which feature belongs to a graded potential?",["Its size varies with stimulus strength and it fades with distance","It has a fixed size and keeps full size along the entire axon length","It has an absolute refractory period lasting about one millisecond","It always begins with hyperpolarisation below the resting level"],0,"Graded potentials are decremental and can sum.","Graded = whisper.",0,3],["Which feature belongs to an action potential?",["Variable size, decremental, with no refractory period","All-or-none, non-decremental, with a refractory period","All-or-none, decremental, with a long refractory period","Variable size, non-decremental, with temporal summation"],1,"An action potential keeps full size along the whole axon.","Action = gunshot.",0,3],["Graded potentials sum (add up) at:",["the nodes of Ranvier","the motor end-plate only","the axon hillock","the axon terminals"],2,"If the total reaches threshold (about -55 mV), an action potential fires.","Sum at the hillock.",0,3],["An EPSP is:",["a hyperpolarising graded potential that moves the neuron away from threshold","a depolarising graded potential that moves the neuron towards threshold","an action potential in a postsynaptic neuron","a refractory period after a spike"],1,"An IPSP is the hyperpolarising one.","E = Excite. I = Inhibit.",0,3],["A stronger stimulus is signalled by:",["a bigger action potential in each fibre as the stimulus rises","a higher frequency of action potentials and more fibres activated","a longer absolute refractory period in each stimulated fibre","a more positive resting potential in the stimulated fibres"],1,"Strength is coded by frequency, not size.","Strength = frequency.",0,3],["Where do graded potentials occur?",["Only the axon, from hillock to terminals","Dendrites, soma, receptors and the end-plate","Only the nodes of Ranvier and the axon hillock","Only the myelinated internodes of the axon"],1,"Action potentials occur on the axon and muscle sarcolemma.","Graded near the start. Action along the axon.",1,3],["Which channels mainly produce a graded potential?",["Voltage-gated Na and K channels of the axon","Ligand-gated or mechanically gated channels","Resting leak channels of the axon membrane","Calcium ATPase pumps of the cell membrane"],1,"Voltage-gated channels make the action potential.","Graded = ligand. Action = voltage.",1,3],["Hypocalcaemia causes excitability to:",["decrease, with weakness and flaccid paralysis","stay normal, with no change in the nerve","increase, with tingling, spasms and tetany","fall at first and then rise suddenly"],2,"Na channels open more easily when extracellular calcium is low.","Low calcium = jumpy nerves.",0,4],["Hypercalcaemia causes:",["decreased excitability, with weakness","increased excitability, with tetany","no change in nerve excitability at all","spontaneous firing of motor nerves"],0,"Calcium stabilises the membrane. Ca calms.","High calcium = sleepy nerves.",0,4],["Local anaesthetics such as lignocaine work by:",["blocking voltage-gated K channels, so the cell cannot repolarise","blocking voltage-gated Na channels, so pain action potentials cannot start","blocking nicotinic receptors, so the muscle cannot contract","blocking calcium pumps, so the nerve ending cannot release transmitter"],1,"Thin fibres (C and A-delta) are blocked first, so pain goes before touch and motor power.","Lignocaine blocks Na.",0,4],["Tetrodotoxin (puffer fish) and saxitoxin:",["block K channels","block Ca ATPase","block Na channels","block Na/K ATPase"],2,"Tetraethylammonium blocks K channels.","TTX = Na blocker. TEA = K blocker.",1,4],["Tetraethylammonium (TEA) blocks:",["Na channels","Ca channels","K channels","nicotinic receptors"],2,"Without K channels, repolarisation is slowed.","TEA = Potassium channel blocker.",1,4],["Hypoxia and cold reduce excitability because:",["ATP-dependent pumps fail","sodium channels are permanently open","calcium is released from the SR","myelin is removed from the axon"],0,"Without ATP the pump cannot restore the gradients.","No ATP, no pumping, no signals.",1,4],["After thyroid surgery, damage to the parathyroid glands may cause:",["flaccid paralysis of the limb muscles from raised blood calcium","bradycardia with muscle weakness from raised blood potassium","tingling around the mouth and carpopedal spasm from hypocalcaemia","hypertension with headache from raised plasma sodium levels"],2,"Trousseau sign is carpopedal spasm. The nurse should have calcium gluconate ready.","Low calcium after thyroid surgery.",1,4],["High extracellular K+ first increases and then abolishes excitability because:",["the resting potential moves further from threshold, and then K channels stay open","the pump stops at first and then restarts at a faster rate once the cell recovers","the resting potential moves closer to threshold, and then Na channels stay inactivated","calcium enters the cell at first and is then pumped out by the sodium-calcium exchanger"],2,"Persistent depolarisation inactivates the Na channels (depolarisation block).","Up, then blocked.",1,4]]},{"t":"The Action Potential in the Nerve Cell","s":["Definition and positive feedback","Voltage-gated channels","Phases and voltages","All-or-none and refractory periods","Conduction and fibre types","Synapse and clinical links"],"q":[["An action potential is best defined as:",["a rapid, transient, all-or-none change of membrane potential that propagates without losing size","a slow, graded change of membrane potential that fades as it spreads along the membrane","a steady, constant membrane potential that holds the inside negative at rest","a rapid, graded change of membrane potential that grows larger as it spreads"],0,"In a large nerve fibre it goes from about -90 mV to about +35 mV and back in roughly 1 ms.","Fast, all-or-none, does not fade.",0,0],["How long does the nerve action potential last in a large nerve fibre?",["About 100 milliseconds","About 1 second","About 10 microseconds","About 1 millisecond"],3,"Muscle action potentials last longer, 1 to 5 ms.","Nerve spike = 1 ms.",0,0],["The depolarisation phase is called a positive feedback event because:",["K+ exit hyperpolarises the membrane, which opens more K+ channels and lets out more K+","Na+ entry hyperpolarises the membrane, which closes the Na+ channels it passed through","Na+ entry depolarises the membrane, which opens more Na+ channels and lets in more Na+","K+ exit depolarises the membrane, which opens more Na+ channels and lets in more Na+"],2,"The vicious cycle is ended by Na channel inactivation and K channel opening.","More in, more open, more in.",0,0],["The action potential heads towards +61 mV but peaks at about +35 mV because:",["the sodium-potassium pump removes Na+ faster than it can enter","Na+ channels inactivate and K+ begins to leave before E(Na) is reached","calcium enters the axon and blocks the open Na+ channels","the membrane becomes impermeable to all ions at the peak"],1,"The voltage never reaches ENa, +61 mV.","Peak +35, not +61.",1,0],["During one action potential, the ion concentrations inside and outside the cell:",["barely change, because only a tiny fraction of the ions move","change greatly, so the pump must act at once to reset them","reverse completely, so Na+ is then higher inside than K+","stay constant, because no ions cross the membrane at all"],0,"The pump restores the gradients slowly over time. High firing rates need ATP and oxygen.","Tiny fraction moves per spike.",1,0],["Threshold is typically how much less negative than the resting potential?",["About 15 to 20 mV","About 1 to 2 mV","About 50 to 60 mV","About 90 mV"],0,"From -70 to -90 mV, threshold at about -55 mV is 15 to 20 mV less negative.","Rest -90, threshold -55.",1,0],["The voltage-gated sodium channel has:",["two gates, an activation gate and an inactivation gate","one gate, an activation gate that closes slowly","two gates, both of which open at the same speed","three gates, one of which is the T-tubule gate"],0,"The activation gate is near the outside, and the inactivation gate near the inside.","Na has two gates, K has one.",0,1],["At rest (-90 mV), the sodium channel has:",["activation gate open and inactivation gate closed, so no Na+ enters","both gates open, so Na+ enters slowly","both gates closed, so the channel is inactivated","activation gate closed and inactivation gate open, so no Na+ enters"],3,"At threshold the activation gate opens quickly. About 0.5 ms later the inactivation gate closes.","Rest: A closed, I open.",0,1],["When the membrane reaches threshold, the sodium channel:",["closes its inactivation gate fast, and Na+ permeability falls to zero","opens its activation gate fast, and Na+ permeability rises up to 5000-fold","opens its inactivation gate slowly, and Na+ permeability rises slightly","closes its activation gate slowly, and Na+ permeability falls by half"],1,"Na+ rushes in and the inside becomes positive.","Activation = the fast gate that lets Na in.",0,1],["What closes the sodium channel at the peak of the action potential?",["The activation gate, which closes after about 5 ms","The inactivation gate, which closes after about 0.5 ms","The potassium gate, which closes after about 0.5 ms","The sodium-potassium pump, which closes it after about 5 ms"],1,"The inactivation gate cannot reopen until the membrane has returned to about the resting level.","Inactivation = the late shut-off.",0,1],["The voltage-gated potassium channel has:",["one gate, closed at rest, that opens slowly on depolarisation","two gates, closed at rest, that open quickly on depolarisation","one gate, open at rest, that closes slowly on depolarisation","two gates, open at rest, that close quickly on depolarisation"],0,"It opens just as the Na channels are inactivating, so K+ leaves and repolarises the cell.","K: one slow gate.",0,1],["The undershoot after the spike (after-hyperpolarisation) is caused by:",["Na+ channels that open slowly, so extra Na+ keeps entering","the pump, which adds a large extra negativity","Cl- channels that open at the peak of the spike","K+ channels that close slowly, so extra K+ keeps leaving"],3,"Slow closing of the K gate means K+ keeps leaving beyond the resting level.","Slow K close = dip below rest.",0,1],["Which statement about the speed of the gates is correct?",["Na activation is slow, Na inactivation is fast, and K opening is fast","Na activation is fast, Na inactivation is fast, and K opening is slow","Na activation is slow, Na inactivation is slow, and K opening is fast","Na activation is fast, Na inactivation is slow, and K opening is slow"],3,"Fast Na gives the fast rise. Slow K gives the late fall.","Fast Na = fast rise. Slow K = late fall.",1,1],["Which sequence lists the phases of the nerve action potential in order?",["Resting, threshold, stimulus, depolarisation, hyperpolarisation, repolarisation","Resting, stimulus, threshold, depolarisation, repolarisation, hyperpolarisation","Stimulus, resting, depolarisation, threshold, repolarisation, hyperpolarisation","Resting, stimulus, depolarisation, threshold, hyperpolarisation, repolarisation"],1,"The six phases are R-S-T-D-R-H.","Run, Stop, Take Drink, Rest, Home.",0,2],["Which values correctly give the nerve action potential's resting, threshold and peak voltages?",["-55 mV, -90 mV and +35 mV","-90 mV, +35 mV and -55 mV","-90 mV, -55 mV and +35 mV","-70 mV, -90 mV and +61 mV"],2,"Some neurons rest at -70 mV, but the guide's large-fibre value is -90 mV.","-90, -55, +35.",0,2],["Depolarisation to the peak is caused by:",["K+ efflux through voltage-gated K+ channels","Cl- influx through ligand-gated Cl- channels","Ca2+ efflux through the calcium ATPase","Na+ influx through voltage-gated Na+ channels"],3,"Sodium in is the way up.","Na in = up.",0,2],["Repolarisation is caused by:",["Na+ channel activation and K+ influx","Na+ channel inactivation and K+ efflux","Cl- channel opening and Na+ efflux","pump inactivation and Ca2+ influx"],1,"Potassium out is the way down.","K out = down.",0,2],["Between the resting potential and threshold, the stimulus produces:",["a local, graded depolarisation","an all-or-none spike of full size","a hyperpolarising after-potential","an absolute refractory period"],0,"At threshold, Na entry exceeds K exit and the vicious cycle begins.","Below threshold = local response.",0,2],["The sodium-potassium pump's role after an action potential is to:",["cause the upstroke of the next action potential","cause the fall of the potential from +35 mV","slowly restore the Na+ and K+ gradients","open the Na+ activation gates for the next spike"],2,"The pump does not make the spike. It tidies up after it.","Pump = housekeeping.",1,2],["On the action potential curve shown, which letter marks the repolarisation phase, in which K+ leaving the cell brings the voltage back down?",["A","D","B","C"],1,"C is the peak (about +35 mV). D is the falling phase. A is rest and B is threshold.","Peak, then fall.",0,2,"<svg viewBox='0 0 320 190' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-width:420px;display:block;margin:0 auto 12px;background:#150c08;border:1px solid #4a2a17;border-radius:12px'><line x1='20' y1='70' x2='305' y2='70' stroke='#b49a88' stroke-dasharray='4 4' stroke-width='1'/><text x='24' y='64' fill='#b49a88' font-size='10' font-family='sans-serif'>0 mV</text><path d='M20 150 L75 150 L95 118 Q112 70 122 28 Q134 20 140 40 Q150 100 168 148 Q178 165 195 160 Q212 152 225 150 L305 150' fill='none' stroke='#ff6a1a' stroke-width='3' stroke-linejoin='round'/><circle cx='45' cy='150' r='11' fill='#2a170d' stroke='#ffb347'/><text x='45' y='154' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>A</text><circle cx='92' cy='103' r='11' fill='#2a170d' stroke='#ffb347'/><text x='92' y='107' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>B</text><circle cx='128' cy='14' r='11' fill='#2a170d' stroke='#ffb347'/><text x='128' y='18' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>C</text><circle cx='166' cy='98' r='11' fill='#2a170d' stroke='#ffb347'/><text x='166' y='102' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>D</text><circle cx='196' cy='180' r='9' fill='#2a170d' stroke='#ffb347'/><text x='196' y='184' fill='#ffb347' font-size='11' text-anchor='middle' font-family='sans-serif' font-weight='bold'>E</text><text x='250' y='140' fill='#b49a88' font-size='10' font-family='sans-serif'>-90 mV</text></svg>"],["On the same curve, which letter marks threshold (about -55 mV), where Na+ channels open in large numbers?",["A","C","B","D"],2,"A is the resting level. B is where the vicious cycle starts. C is the peak.","Threshold = the corner where the climb begins.",0,2,"<svg viewBox='0 0 320 190' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-width:420px;display:block;margin:0 auto 12px;background:#150c08;border:1px solid #4a2a17;border-radius:12px'><line x1='20' y1='70' x2='305' y2='70' stroke='#b49a88' stroke-dasharray='4 4' stroke-width='1'/><text x='24' y='64' fill='#b49a88' font-size='10' font-family='sans-serif'>0 mV</text><path d='M20 150 L75 150 L95 118 Q112 70 122 28 Q134 20 140 40 Q150 100 168 148 Q178 165 195 160 Q212 152 225 150 L305 150' fill='none' stroke='#ff6a1a' stroke-width='3' stroke-linejoin='round'/><circle cx='45' cy='150' r='11' fill='#2a170d' stroke='#ffb347'/><text x='45' y='154' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>A</text><circle cx='92' cy='103' r='11' fill='#2a170d' stroke='#ffb347'/><text x='92' y='107' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>B</text><circle cx='128' cy='14' r='11' fill='#2a170d' stroke='#ffb347'/><text x='128' y='18' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>C</text><circle cx='166' cy='98' r='11' fill='#2a170d' stroke='#ffb347'/><text x='166' y='102' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>D</text><circle cx='196' cy='180' r='9' fill='#2a170d' stroke='#ffb347'/><text x='196' y='184' fill='#ffb347' font-size='11' text-anchor='middle' font-family='sans-serif' font-weight='bold'>E</text><text x='250' y='140' fill='#b49a88' font-size='10' font-family='sans-serif'>-90 mV</text></svg>"],["What is the best description of the points E and A on the action potential curve?",["E is the overshoot above zero, and A is the threshold","E is the threshold, and A is the undershoot below rest","E is the undershoot below rest, and A is the resting level","E is the resting level, and A is the overshoot above zero"],2,"The curve returns to rest after dipping slightly below it.","E is below rest, A is rest.",1,2,"<svg viewBox='0 0 320 190' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-width:420px;display:block;margin:0 auto 12px;background:#150c08;border:1px solid #4a2a17;border-radius:12px'><line x1='20' y1='70' x2='305' y2='70' stroke='#b49a88' stroke-dasharray='4 4' stroke-width='1'/><text x='24' y='64' fill='#b49a88' font-size='10' font-family='sans-serif'>0 mV</text><path d='M20 150 L75 150 L95 118 Q112 70 122 28 Q134 20 140 40 Q150 100 168 148 Q178 165 195 160 Q212 152 225 150 L305 150' fill='none' stroke='#ff6a1a' stroke-width='3' stroke-linejoin='round'/><circle cx='45' cy='150' r='11' fill='#2a170d' stroke='#ffb347'/><text x='45' y='154' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>A</text><circle cx='92' cy='103' r='11' fill='#2a170d' stroke='#ffb347'/><text x='92' y='107' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>B</text><circle cx='128' cy='14' r='11' fill='#2a170d' stroke='#ffb347'/><text x='128' y='18' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>C</text><circle cx='166' cy='98' r='11' fill='#2a170d' stroke='#ffb347'/><text x='166' y='102' fill='#ffb347' font-size='12' text-anchor='middle' font-family='sans-serif' font-weight='bold'>D</text><circle cx='196' cy='180' r='9' fill='#2a170d' stroke='#ffb347'/><text x='196' y='184' fill='#ffb347' font-size='11' text-anchor='middle' font-family='sans-serif' font-weight='bold'>E</text><text x='250' y='140' fill='#b49a88' font-size='10' font-family='sans-serif'>-90 mV</text></svg>"],["The absolute refractory period is:",["from the peak to the end of the undershoot, when a strong stimulus can fire a second spike","from rest to threshold, when a graded potential can sum with another one","from the end of the undershoot to rest, when every stimulus fires a spike","from threshold to about the end of repolarisation, when no stimulus can fire a second spike"],3,"It lasts about 1 ms. Na channels are open or inactivated and cannot reopen.","Absolute = absolutely no.",0,3],["The relative refractory period occurs during:",["early depolarisation, when a weaker stimulus can fire a spike","the resting period, when any stimulus fires a spike","the peak of the action potential, when no stimulus can fire a spike","late repolarisation and the after-hyperpolarisation, when a stronger stimulus can fire a spike"],3,"Some Na channels have recovered, but K channels are open and the membrane is hyperpolarised.","Relative = really needs more.",0,3],["A very strong stimulus during the absolute refractory period will:",["produce a second action potential of larger size","fail to produce a second action potential","produce a second action potential of smaller size","produce two action potentials one after the other"],1,"The Na channel inactivation gates are shut and cannot reopen until the membrane returns to about resting level.","Inactivation gates are shut.",0,3],["In the relative refractory period a stronger stimulus is needed because:",["more Na+ channels are ready, the membrane is closer to threshold, and K+ has stopped leaving","fewer Na+ channels are ready, the membrane is further from threshold, and K+ is still leaving","all Na+ channels are inactivated, the membrane is at threshold, and Na+ is still entering","fewer K+ channels are ready, the membrane is further from rest, and Na+ is still leaving"],1,"Those are three reasons. All of them make a normal push fail.","Fewer channels, longer climb, K pulling against you.",1,3],["Which is an importance of the refractory periods?",["They make the impulse travel faster along the fibre","They make the impulse travel in one direction only","They allow summation of action potentials","They increase the size of each action potential"],1,"The segment behind the impulse is refractory, so it cannot fire again.","One way, speed limit, no tetanus in nerve.",0,3],["With an absolute refractory period of about 1 ms, the maximum firing frequency is about:",["100 impulses per second","10 impulses per second","1000 impulses per second","10 000 impulses per second"],2,"One spike per millisecond gives 1000 per second.","1 ms = 1000 per second.",1,3],["The all-or-none law states that:",["the size of the action potential grows as the stimulus strength grows","the action potential fades as it travels along the axon","the stimulus must always reach the peak value before any response","below threshold no action potential fires, and at or above threshold a full-size one fires"],3,"Strength is coded by the frequency of action potentials, not their size.","Doorbell: same ring however hard you press.",0,3],["The action potential travels along the fibre by:",["pumps that move ions along the length of the axon","local circuit currents that depolarise the next patch of membrane to threshold","vesicles that carry the voltage from one end to the other","calcium waves that open K+ channels ahead of the spike"],1,"It moves as a wave of depolarisation without losing size, in one direction because the region behind is refractory.","Dominoes.",0,4],["Conduction in an unmyelinated fibre is:",["continuous, slow, and costly in energy","saltatory, fast, and cheap in energy","continuous, fast, and cheap in energy","saltatory, slow, and costly in energy"],0,"Every patch of membrane must fire, so many ions move and the pump uses more ATP.","Crawling, slow, costly.",0,4],["Saltatory conduction means the impulse:",["jumps from one node of Ranvier to the next","slides continuously along the myelin sheath","leaps from one neuron to the next across the synapse","travels in both directions from the centre of the axon"],0,"Saltare means to leap. Na channels are packed at the nodes, about 1 mm apart.","Express bus, only big stops.",0,4],["Two advantages of saltatory conduction are:",["much higher speed (up to 100 times) and higher energy use","slightly higher speed (up to 2 times) and lower energy use","no change in speed, but higher energy use","much higher speed (up to 100 times) and lower energy use"],3,"Only the nodes depolarise, so fewer ions move and the pump uses less ATP.","Faster and cheaper.",0,4],["Which factor INCREASES conduction velocity?",["A thinner fibre without myelin","A thicker fibre with myelin","Cooling of the nerve","Pressure on the nerve"],1,"Thick fibres have lower internal resistance. Cold, pressure, ischaemia and demyelination slow conduction.","Thick, myelinated, warm = fast.",0,4],["Multiple sclerosis and Guillain-Barre syndrome both:",["damage the neuromuscular junction, so ACh cannot reach the receptors","damage myelin, so saltatory conduction slows or fails","damage the sarcomere, so thick and thin filaments cannot overlap","damage the pump, so the resting potential is lost"],1,"Multiple sclerosis affects the CNS. Guillain-Barre syndrome affects the PNS.","MS = CNS demyelination. GBS = PNS demyelination.",0,4],["Which nerve fibre type is the fastest, with a velocity of about 70 to 120 m/s?",["A-delta","B","C","A-alpha"],3,"A-alpha carries motor signals to skeletal muscle and position sense.","Alpha is first and fastest.",0,4],["A-delta fibres carry:",["sharp, fast pain and cold","dull, slow pain and warmth","touch and pressure","motor signals to muscle spindles"],0,"A-beta carries touch and pressure. A-gamma goes to muscle spindles. C fibres carry dull pain and warmth.","Delta = sharp pain.",1,4],["Type B nerve fibres are:",["postganglionic autonomic fibres, thin and unmyelinated, at 0.5 to 2 m/s","motor fibres to skeletal muscle, thick and myelinated, at 70 to 120 m/s","touch fibres, medium and myelinated, at 30 to 70 m/s","preganglionic autonomic fibres, thin and myelinated, at 3 to 15 m/s"],3,"B is Before the ganglion. C is after.","B for Before.",0,4],["Type C nerve fibres:",["have thin myelin, are medium speed, and carry sharp pain, cold and preganglionic autonomic signals","have no myelin, are the fastest, and carry motor signals to skeletal muscle and position sense","have thick myelin, are fast, and carry touch, pressure and muscle spindle signals","have no myelin, are the slowest, and carry dull pain, warmth and postganglionic autonomic signals"],3,"C is Crawling: slowest, no myelin.","C = slowest.",0,4],["Which lists the nerve fibres from fastest to slowest?",["A-alpha, A-beta, A-gamma, A-delta, B, C","A-alpha, A-gamma, A-beta, A-delta, C, B","A-beta, A-alpha, A-delta, A-gamma, B, C","C, B, A-delta, A-gamma, A-beta, A-alpha"],0,"Always Be Good, Don't Be Cruel.","Alpha, Beta, Gamma, Delta, B, C.",0,4],["The red and white muscle fibre types (type 1, type 2) are different from nerve fibre types (A, B, C) in that:",["muscle fibre types classify axons by speed, while nerve fibre types classify muscle cells","muscle fibre types classify muscle cells, while nerve fibre types classify axons by speed","both classify axons, but one is used in the CNS and the other in the PNS","both classify muscle cells, but one is used in skeletal and the other in smooth muscle"],1,"Type 1 muscle is slow and red. Nerve type A is the fastest.","Red and white = muscle. A, B, C = nerve.",1,4],["At the axon terminal the action potential opens:",["voltage-gated sodium channels, and Na+ leaves the terminal","ligand-gated potassium channels, and K+ enters the terminal","voltage-gated chloride channels, and Cl- leaves the terminal","voltage-gated calcium channels, and Ca2+ enters the terminal"],3,"Calcium makes the transmitter vesicles fuse with the membrane and release by exocytosis.","Calcium in, transmitter out.",0,5],["With a local anaesthetic, which sensation goes first?",["Motor power, because thick A-alpha fibres are blocked first","Touch, because A-beta fibres are blocked first","Position sense, because A-alpha fibres are blocked first","Pain, because thin C and A-delta fibres are blocked first"],3,"Pain goes before touch and motor power.","Thin fibres go first.",1,5],["Why does severe hyperkalaemia cause flaccid weakness and arrhythmias?",["The membrane is hyperpolarised, so Na channels stay closed and cells cannot fire","The membrane is depolarised, so Na channels stay inactivated and cells cannot fire","The membrane is at threshold, so K channels stay open and cells fire continuously","The membrane is at rest, so the pump stops and cells lose all ATP"],1,"Inactivated Na channels cannot reopen until the membrane repolarises.","High K, stuck gates.",1,5]]},{"t":"The Action Potential in Skeletal Muscle","s":["NMJ structure and motor unit","Events at the NMJ","Drugs and diseases of the NMJ","The muscle action potential","T-tubules and comparison"],"q":[["Skeletal muscle fibres are supplied by:",["gamma motor neurons, which are C fibres","alpha motor neurons, which are A-alpha fibres","sensory neurons, which are B fibres","autonomic neurons, which are A-delta fibres"],1,"The link between nerve ending and muscle fibre is the neuromuscular junction.","Alpha = fast motor.",0,0],["The synaptic cleft at the NMJ is about:",["20 to 30 nm wide and contains acetylcholinesterase","2 to 3 mm wide and contains acetylcholine receptors","200 to 300 nm wide and contains choline acetyltransferase","20 to 30 micrometres wide and contains calcium channels"],0,"AChE sits in the basal lamina in the cleft.","Cleft = AChE.",0,0],["The motor end-plate is:",["a swollen region of the axon terminal with a very high density of calcium channels","a long region of the T-tubule with a very high density of ryanodine receptors","a thick region of the basal lamina with a very high density of AChE","a folded region of the sarcolemma with a very high density of nicotinic ACh receptors"],3,"Junctional folds increase the area for receptors.","End-plate = receptors.",0,0],["The axon terminal of a motor neuron contains about 300,000 vesicles of:",["noradrenaline","glutamate","acetylcholine","calcium"],2,"Vesicles are released at active zones near calcium channels.","NMJ transmitter = ACh.",0,0],["A motor unit is:",["one muscle fibre plus all the motor neurons that supply it","one motor neuron plus all the muscle fibres it supplies","one fascicle plus all of the nerves around it","one sarcomere plus the two Z discs on either side"],1,"Each muscle fibre has only one NMJ.","One neuron, many fibres.",0,0],["How many neuromuscular junctions does one skeletal muscle fibre have?",["Two","One","Several, spread along the fibre","None, because it is activated by diffusion"],1,"One axon branches to many fibres, but each fibre has only one NMJ.","One fibre, one junction.",1,0],["Which sequence lists the events at the neuromuscular junction in order?",["ACh release, action potential in the axon, receptor binding, Ca2+ entry, muscle action potential, end-plate potential","Action potential in the axon, ACh release, Ca2+ entry, end-plate potential, receptor binding, muscle action potential","Ca2+ entry, receptor binding, action potential in the axon, ACh release, end-plate potential, muscle action potential","Action potential in the axon, Ca2+ entry, ACh release, receptor binding, end-plate potential, muscle action potential"],3,"AP, Ca in, ACh out, Receptor, EPP, muscle AP.","ACARE-A.",0,1],["Calcium entering the nerve terminal makes:",["the vesicles fuse with the membrane and release ACh by exocytosis","the receptors on the end-plate open and let Na+ in","the AChE break down ACh in the cleft","the muscle fibre shorten at once"],0,"Calcium triggers release. Calcium in means ACh out.","Ca in = ACh out.",0,1],["Each vesicle (quantum) contains about how many ACh molecules?",["About 10 000","About 100","About 1 000 000","About 10"],0,"The vesicle count (300 000) and the quantum size (10 000) are different numbers.","Quantum = 10 000.",1,1],["The nicotinic ACh receptor is:",["a voltage-gated channel with four domains, opened by depolarisation","a mechanically gated channel, opened by stretch of the end-plate","a ligand-gated channel with five subunits, needing two ACh molecules to open","a G-protein coupled receptor, linked to a second messenger"],2,"It lets Na+ in (mainly) and K+ out.","Two ACh per channel.",1,1],["The end-plate potential is produced mainly by:",["K+ entering the muscle fibre through the opened receptor channels","Ca2+ leaving the muscle fibre through the opened receptor channels","Cl- entering the muscle fibre through the opened receptor channels","Na+ entering the muscle fibre through the opened receptor channels"],3,"The EPP is about 50 to 75 mV, which is far above threshold.","Sodium in at the muscle.",0,1],["Why does every nerve impulse reliably produce a muscle action potential?",["The end-plate potential is just at threshold, with no extra margin","The end-plate potential is far above threshold (high safety factor)","The muscle fibre has no refractory period, so every stimulus fires","The nerve action potential spreads directly into the muscle fibre"],1,"A high safety factor means the EPP always reaches threshold.","Big EPP, always fires.",1,1],["ACh in the cleft is removed by:",["choline acetyltransferase, which splits it into acetate and choline","acetylcholinesterase, which splits it into acetate and choline","reuptake of intact ACh into the muscle fibre","diffusion of ACh into the capillaries only"],1,"Choline is taken back into the terminal to make new ACh.","One impulse, one twitch.",0,1],["Choline acetyltransferase is the enzyme that:",["makes new ACh in the nerve terminal from choline","breaks ACh down in the synaptic cleft","opens the ligand-gated channels at the end-plate","binds calcium in the sarcoplasmic reticulum"],0,"Choline from AChE action is recycled into new ACh.","Make = ChAT. Break = AChE.",1,1],["The EPP spreads to the neighbouring sarcolemma, where it:",["opens ligand-gated Na+ channels and starts a muscle contraction directly","opens voltage-gated K+ channels and hyperpolarises the muscle","opens voltage-gated Na+ channels and starts a muscle action potential","opens ryanodine receptors and releases calcium at once"],2,"The muscle action potential then spreads along the sarcolemma.","EPP triggers the spike.",0,1],["The ACh receptors at the end-plate are:",["voltage-gated, not ligand-gated","ligand-gated, not voltage-gated","mechanically gated, not ligand-gated","leak channels, always open"],1,"Voltage-gated Na channels are found in the sarcolemma around the end-plate.","Ligand = key and lock.",1,1],["Curare (tubocurarine) causes paralysis because it:",["blocks release of ACh from the nerve terminal","inhibits AChE and raises ACh in the cleft","competes with ACh at the nicotinic receptors","destroys the ACh receptors by autoantibodies"],2,"It produces flaccid paralysis and is used in anaesthesia.","Curare Competes at the receptor.",0,2],["Botulinum toxin causes flaccid paralysis because it:",["blocks release of ACh by cleaving SNARE proteins","competes with ACh at the nicotinic receptors","inhibits AChE and raises ACh in the cleft","blocks Na channels in the nerve axon"],0,"It is used cosmetically as Botox.","Botox Blocks the release.",0,2],["Succinylcholine is a depolarising blocker. It causes:",["immediate flaccid paralysis with no twitching","spasm, then flaccid paralysis","initial twitching (fasciculations), then paralysis","weakness that improves with use"],2,"It keeps the receptors persistently activated.","Twitch first, then paralysis.",1,2],["Neostigmine is used because it:",["inhibits AChE, reverses a curare block and treats myasthenia gravis","blocks ACh receptors, causes paralysis and treats spasticity","blocks ACh release, causes paralysis and treats dystonia","blocks Ca channels, causes weakness and treats hypertension"],0,"More ACh stays in the cleft.","Neostigmine Needs AChE blocked.",0,2],["Organophosphate poisoning causes:",["ACh excess from irreversible AChE inhibition, with spasm and then paralysis","ACh deficiency from blocked release, with flaccid paralysis only","receptor blockade, with flaccid paralysis only","weakness that improves with use, from Ca channel antibodies"],0,"Insecticides and nerve gases are organophosphates.","AChE blocked for good.",0,2],["Myasthenia gravis is caused by:",["antibodies against presynaptic Ca channels, with weakness that improves with use","loss of dystrophin from the sarcolemma, with progressive weakness","autoantibodies that destroy ACh receptors, with fatigable weakness","destruction of motor neurons by a virus, with flaccid paralysis"],2,"Typical signs are drooping eyelids and double vision.","Worse with use.",0,2],["Lambert-Eaton syndrome differs from myasthenia gravis in that its weakness:",["worsens with use, because the antibodies are against postsynaptic ACh receptors","improves with use, because the antibodies are against presynaptic Ca channels","improves with use, because the antibodies are against dystrophin","worsens with use, because the antibodies are against AChE"],1,"Repeated firing builds up calcium and helps release.","L-E = presynaptic, better with use.",1,2],["A patient given suxamethonium or rocuronium for surgery needs ventilator support because:",["the drugs block the respiratory centre in the brainstem","the drugs constrict the bronchi through muscarinic receptors","the drugs paralyse respiratory muscles at the neuromuscular junction","the drugs reduce the carrying capacity of haemoglobin"],2,"Skeletal muscle includes the diaphragm and intercostals.","NMJ blockade includes the breathing muscles.",0,2],["Which three agents are remembered as B-C-N of the junction?",["Botulinum toxin, calcium and ACh","Biperiden, curare and nicotine","Botulinum toxin, curare and neostigmine","Bupivacaine, calcium and neostigmine"],2,"B blocks release, C competes at the receptor, N needs AChE blocked.","B-C-N.",1,2],["The resting membrane potential of skeletal muscle is about:",["-80 to -90 mV","-55 mV","-50 to -60 mV","+30 to +35 mV"],0,"Threshold is about -55 mV, and the peak about +30 to +35 mV.","Muscle rests like large nerve.",0,3],["The skeletal muscle action potential lasts about:",["10 to 100 ms","1 to 5 ms","0.1 ms","1 second"],1,"It is longer than the nerve spike (about 1 ms) but much shorter than the twitch.","Muscle AP: 1 to 5 ms.",0,3],["The conduction velocity of the skeletal muscle action potential is about:",["70 to 120 m/s","30 to 70 m/s","0.5 to 2 m/s","3 to 5 m/s"],3,"Muscle has no myelin, so conduction is continuous and slow.","Muscle 3 to 5, nerve up to 120.",0,3],["Because the muscle action potential is much shorter than the contraction:",["a second action potential can never arrive, so only single twitches are possible","a second action potential can arrive before relaxation, so summation and tetanus are possible","the muscle must relax fully before another action potential can arrive","the contraction is always cut short by the next action potential"],1,"The absolute refractory period (1 to 3 ms) is shorter than the contraction.","Short spike, long twitch.",1,3],["Which feature distinguishes the muscle action potential from the nerve action potential?",["It begins at the end-plate, not at the axon hillock","It uses different ions, mainly Ca2+ instead of Na+","It is all-or-none, while the nerve one is graded","It starts with hyperpolarisation, not depolarisation"],0,"Nerve AP starts at the hillock by summation of EPSPs. Muscle AP starts at the end-plate (EPP).","Same ions, different start.",1,3],["Which statement about the skeletal muscle action potential is correct?",["It uses voltage-gated Ca channels only, unlike a nerve","It uses voltage-gated Na and K channels, like a nerve","It is conducted by saltatory conduction along the fibre","It travels at 70 to 120 m/s along the sarcolemma"],1,"Na in and K out, just as in the nerve, with continuous conduction.","Muscle AP = nerve AP, slower.",1,3],["T-tubules are:",["extensions of the sarcoplasmic reticulum that store calcium in the fibre","folds of the end-plate that carry receptors for ACh","bundles of thin filaments that anchor to the Z disc","invaginations of the sarcolemma that carry the action potential deep into the fibre"],3,"They pass around every myofibril at the A-I junction in skeletal muscle.","T for tunnel.",0,4],["A triad consists of:",["one terminal cisterna and two T-tubules of the sarcolemma","one Z disc and two thick filaments of myosin","one T-tubule and two terminal cisternae of the sarcoplasmic reticulum","one motor neuron and two muscle fibres in a motor unit"],2,"The T-tubule lies between two terminal cisternae.","Tri = three parts.",0,4],["Why must the muscle action potential travel down the T-tubules?",["The fibre is thin, so the signal must be slowed to let calcium be released","The fibre has no sarcolemma, so the signal must travel through the SR","The fibre has myelin, so the signal must jump from node to node","The fibre is thick, so the signal must reach the deep contractile proteins at almost the same time"],3,"A signal only at the surface would make the middle contract late.","Telephone lines to every corner.",0,4],["Which numbers correctly compare nerve and skeletal muscle action potentials?",["Nerve up to 70 to 120 m/s and about 1 ms, muscle 3 to 5 m/s and 1 to 5 ms","Nerve 3 to 5 m/s and 1 to 5 ms, muscle up to 70 to 120 m/s and about 1 ms","Nerve up to 70 to 120 m/s and 1 to 5 ms, muscle 3 to 5 m/s and about 1 ms","Nerve and muscle both about 3 to 5 m/s and about 1 ms"],0,"Muscle has no myelin and a longer spike.","Nerve fast and short, muscle slow and long.",1,4],["Name three agents that interfere with neuromuscular transmission, by mechanism. Which set is correct?",["Curare blocks AChE, botulinum toxin blocks the receptor, organophosphates block release","Curare blocks release, botulinum toxin blocks AChE, organophosphates block the receptor","Curare blocks the receptor, botulinum toxin blocks release, organophosphates block AChE","Curare blocks release, botulinum toxin blocks the receptor, organophosphates block AChE"],2,"A common exam question.","Curare = receptor. Botox = release. OP = enzyme.",1,4]]},{"t":"Mechanism of Skeletal Muscle Contraction","s":["Muscle types and organisation","Sarcomere and proteins","Excitation-contraction coupling","Cross-bridge cycle and relaxation","Energy and fatigue","Mechanics of contraction","Fibre types and disorders"],"q":[["Which muscle type is voluntary, striated and has many peripheral nuclei per fibre?",["Skeletal muscle","Cardiac muscle","Smooth muscle","Myoepithelial cells"],0,"Cardiac has one or two central nuclei. Smooth has one central nucleus and no striations.","Many nuclei at the edge = skeletal.",0,0],["Which of these is NOT a property of skeletal muscle?",["Excitability (responds to a stimulus with an impulse)","Extensibility (can be stretched beyond resting length)","Automaticity (self-firing without any nerve supply)","Elasticity (recoils to its length after stretching)"],2,"Skeletal muscle needs a nerve to fire. Pacemaker activity belongs to the heart.","Skeletal muscle never fires on its own.",1,0],["Which list gives the organisation of skeletal muscle from largest to smallest?",["Muscle, fibre, fascicle, myofibril, myofilament","Muscle, fascicle, fibre, myofibril, myofilament","Muscle, fascicle, myofibril, fibre, myofilament","Muscle, fascicle, fibre, myofilament, myofibril"],1,"My Friend Found My Monkey.","Bundle, cell, strand, thread.",0,0],["The connective tissue that wraps each individual muscle fibre is the:",["perimysium","epimysium","endomysium","tendon sheath"],2,"Epi covers the whole muscle, peri covers each fascicle, endo covers each fibre.","Endo = inside, around one cell.",0,0],["The perimysium surrounds:",["each muscle fibre","the whole muscle","each myofibril","each fascicle"],3,"Every Person Eats: epi, peri, endo, from outside to inside.","Peri sits in the middle layer.",1,0],["The sarcolemma is the muscle fibre's:",["smooth endoplasmic reticulum","plasma membrane","cytoplasm","contractile filament"],1,"The action potential travels along it.","Sarco + lemma = muscle skin.",0,0],["The sarcoplasmic reticulum is the muscle's version of the:",["smooth endoplasmic reticulum, which stores calcium","rough endoplasmic reticulum, which stores calcium","Golgi apparatus, which packages and sorts calcium","mitochondrion, which generates the calcium ions"],0,"It ends in terminal cisternae beside the T-tubules.","SR = calcium store.",0,0],["Which of these is a function of skeletal muscle?",["Manufacture of red blood cells in the marrow","Storage of bile before it enters the gut","Heat production, especially in shivering","Secretion of digestive hormones into blood"],2,"Muscle also gives posture, movement and joint stability.","Shivering is muscle making heat.",0,0],["The sarcomere is the segment of myofibril between:",["two adjacent Z discs","two adjacent M lines","two adjacent H zones","two adjacent A bands"],0,"At rest it is about 2.0 to 2.2 micrometres long.","Z to Z.",0,1],["The A band is the region that contains:",["only the thin actin filaments and the Z disc","only the Z disc with its alpha-actinin anchors","only the gap between two successive Z discs","the full length of the thick myosin filaments"],3,"It is dark, and it does not change length when the muscle contracts.","A for Always the same.",0,1],["The I band contains:",["thick filaments only, and it spans the M line","thin filaments only, and it spans the Z disc","both filaments, and it spans the H zone","titin only, and it spans the A band"],1,"It shortens on contraction.","I = thin only.",0,1],["The H zone is the centre of the A band, where there are:",["thin filaments only, with no overlap by thick filaments","both filaments in full overlap","no filaments, only the M line","thick filaments only, with no overlap by thin filaments"],3,"It narrows and may disappear in contraction.","H = thick alone.",0,1],["When a muscle contracts, which band stays the same length?",["I band","H zone","A band","The distance between Z discs"],2,"I and H shrink, A always stays.","A always stays.",0,1],["Which statement about the sliding-filament theory is correct?",["Thick filaments shorten as they pull in while the thin filaments stay the same","Both sets of filaments shorten as they overlap more and the A band narrows","Thin filaments slide towards the centre while the filaments keep their length","Thin filaments fold back on themselves at the M line as the sarcomere shortens"],2,"Huxley and Huxley proposed it in 1954.","Rope moves, arms do not shrink.",0,1],["The thick filament is made of:",["actin, with a head that carries a calcium-binding site and a troponin strand","myosin, with a head that carries an ATPase and an actin-binding site","tropomyosin, with a head that carries a troponin complex and an ATPase site","titin, with a head that carries a myosin-binding site and a calcium pocket"],1,"About 200 myosin molecules lie in one filament.","Myosin = motor.",0,1],["At rest, which protein covers the myosin-binding sites on actin?",["Troponin C, attached to the thick filament","Titin, spanning the Z disc to the M line","Dystrophin, anchored under the sarcolemma","Tropomyosin, lying in the groove of actin"],3,"Troponin shifts it away when calcium binds.","Tropomyosin = the traffic cop.",0,1],["Which troponin subunit binds calcium?",["Troponin T","Troponin I","Tropomyosin","Troponin C"],3,"T binds tropomyosin, C binds calcium, I inhibits.","Two Cats Inside.",0,1],["Troponin I:",["binds calcium ions released into the sarcoplasm","anchors the troponin complex onto tropomyosin","inhibits the interaction between actin and myosin","connects actin filaments to the sarcolemma membrane"],2,"The I stands for inhibitory.","I = Inhibits.",0,1],["Titin is a giant elastic protein that:",["runs from the Z disc to the M line and gives passive tension","runs along the whole thin filament and sets its exact length","links actin to the sarcolemma and gives the muscle its strength","binds calcium inside the sarcoplasmic reticulum and stores it"],0,"Nebulin sets thin filament length. Dystrophin links actin to the membrane.","Titin is the biggest and the springiest.",0,1],["Which protein is missing in Duchenne muscular dystrophy?",["Dystrophin, which anchors actin to the sarcolemma","Nebulin, which sets the length of the thin filament","Titin, which spans from the Z disc to the M line","Troponin T, which binds the comple
