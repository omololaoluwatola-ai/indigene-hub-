x to tropomyosin"],0,"It links actin to the sarcolemma.","D for Duchenne, D for dystrophin.",0,1],["Nebulin:",["runs from Z disc to M line and gives elasticity","binds calcium ions and moves tropomyosin aside","lies along the thin filament and sets its length","forms the head and hinge of the myosin molecule"],2,"Titin is the elastic one.","Nebulin = thin filament ruler.",1,1],["Which sequence correctly gives the steps of excitation-contraction coupling?",["Muscle action potential, T-tubule, RyR, DHPR, calcium release, troponin C, tropomyosin moves","Muscle action potential, T-tubule, DHPR, RyR, calcium release, troponin C, tropomyosin moves","Muscle action potential, DHPR, T-tubule, calcium release, RyR, tropomyosin moves, troponin C","T-tubule, muscle action potential, DHPR, RyR, troponin C, calcium release, tropomyosin moves"],1,"It is the story of the whole course in one line.","AP, tubule, DHPR, RyR, Ca, TnC, tropomyosin.",0,2],["The voltage sensor in the T-tubule membrane is the:",["ryanodine receptor (calcium release channel, RyR1)","dihydropyridine receptor (L-type calcium channel)","nicotinic acetylcholine receptor on the end-plate","sodium-potassium ATPase (the electrogenic pump)"],1,"In skeletal muscle it is physically linked to RyR1.","DHPR senses, RyR releases.",0,2],["The calcium release channel in the terminal cisterna of the SR is the:",["ryanodine receptor (RyR1) calcium channel","dihydropyridine receptor, a voltage sensor","SERCA pump, which returns calcium to the SR","troponin C, the calcium binder on actin"],0,"DHPR changes shape and opens it by a mechanical link.","RyR = release.",0,2],["In cardiac muscle, the ryanodine receptor is opened by:",["calcium entering from outside (calcium-induced calcium release)","a direct mechanical link to the DHPR, as in skeletal muscle","a rise in sodium inside the cell from the action potential","acetylcholine released from the motor end-plate onto the cell"],0,"Skeletal muscle uses a direct mechanical link instead.","Heart = calcium triggers calcium.",0,2],["Free cytosolic calcium rises during contraction from about:",["10^-3 M to 10^-1 M or more","10^-5 M to 10^-7 M or less","10^-9 M to 10^-8 M or so","10^-7 M to 10^-5 M or more"],3,"It is a rise of about 100-fold.","Seven to five.",0,2],["Calcium causes the muscle to contract by:",["binding tropomyosin, which drags troponin I away from the myosin heads","binding myosin, which then drags the actin filament towards the Z disc","binding actin directly, which pulls troponin T off the thick filament","binding troponin C, which pulls tropomyosin off the myosin-binding sites"],3,"Without calcium, the cover stays on.","Calcium is the key.",0,2],["Which statement about the T-tubule system and E-C coupling is correct?",["The tubules and SR together make a dyad, where the calcium signal is passed to the voltage channel","The transverse tubules alone make a triad, and the SR plays no part in passing the voltage signal","The tubules and SR together make a triad, where the voltage signal is passed to the calcium channel","The SR alone makes a triad, and the transverse tubules are used only for the storage of calcium"],2,"One T-tubule sits between two terminal cisternae.","Triad = 1 tubule + 2 cisternae.",0,2],["Which sequence gives the four steps of the cross-bridge cycle?",["Attachment, detachment, power stroke, re-cocking","Power stroke, attachment, re-cocking, detachment","Re-cocking, attachment, detachment, power stroke","Attachment, power stroke, detachment, re-cocking"],3,"A Powerful Dog Runs.","A-P-D-R.",0,3],["In the cross-bridge cycle, ATP is needed to:",["supply the energy that drives the power stroke itself","detach the myosin head from actin and to re-cock it","bind calcium ions to troponin C on the thin filament","open the ryanodine receptor in the terminal cisterna"],1,"The power stroke uses energy from ATP split earlier.","ATP lets go, it does not pull.",0,3],["One power stroke moves the thin filament by about:",["1 micrometre","1 millimetre","10 nanometres","100 nanometres"],2,"Thousands of heads cycle again and again to give a visible contraction.","Tiny steps, many heads.",1,3],["A myosin head that is cocked carries:",["ADP and inorganic phosphate, from split ATP","intact ATP that has not yet been hydrolysed","nothing bound at all, in its rigor position","calcium and ADP, bound to its actin site"],0,"The power stroke releases ADP and Pi.","Cocked = loaded with the split products.",0,3],["During relaxation, the calcium pump that returns Ca2+ to the SR is:",["the sodium-potassium ATPase","SERCA, a calcium ATPase","the ryanodine receptor","the dihydropyridine receptor"],1,"Calcium is then bound to calsequestrin inside the SR.","SERCA = pump back.",0,3],["Which protein binds calcium inside the sarcoplasmic reticulum?",["Calsequestrin, in the terminal cisternae","Troponin C, on the thin actin filament","Calmodulin, in the cytosol of the fibre","Myoglobin, in the sarcoplasm of the fibre"],0,"It stores calcium in the terminal cisternae.","Calsequestrin = the SR's calcium bag.",0,3],["Rigor mortis happens because:",["too much ATP is made, so myosin heads detach too often","no ATP is made, so myosin heads cannot detach from actin","calcium is pumped out of the muscle by SERCA","tropomyosin covers all the binding sites permanently"],1,"It begins 3 to 4 hours after death and is maximal at about 12 hours.","No ATP, no release.",0,3],["Rigor mortis disappears after about 24 to 72 hours because:",["muscle proteins break down","ATP production restarts in the cells","calcium returns to the SR","troponin removes tropomyosin"],0,"It is not a reversible contraction.","Rigor ends by decay.",0,3],["The muscle returns to its resting length after relaxation by:",["an active reverse power stroke of the myosin heads","passive recoil of titin, gravity and opposing muscles","a second action potential in the motor neuron axon","the active shortening of the thick filaments by ATP"],1,"Muscles can only pull. They cannot push.","Muscle pulls only.",0,3],["Which is the correct order of energy sources for a maximal effort, from fastest to longest lasting?",["Stored ATP, anaerobic glycolysis, phosphocreatine, aerobic respiration","Phosphocreatine, stored ATP, aerobic respiration, anaerobic glycolysis","Aerobic respiration, anaerobic glycolysis, phosphocreatine, stored ATP","Stored ATP, phosphocreatine, anaerobic glycolysis, aerobic respiration"],3,"Three fuel tanks.","Tiny, quick, dirty, clean.",0,4],["Stored ATP in a muscle fibre lasts about:",["10 to 15 seconds","1 to 3 seconds","1 to 2 minutes","several hours"],1,"Phosphocreatine adds to give a total of 10 to 15 seconds.","Only a couple of seconds.",0,4],["Phosphocreatine regenerates ATP by the action of:",["creatine kinase, which moves a phosphate from creatine phosphate to ADP","ATP synthase, which moves a phosphate from creatine phosphate to AMP","lactate dehydrogenase, which moves a phosphate from lactate to ADP","pyruvate kinase, which moves a phosphate from pyruvate to ADP"],0,"CP + ADP gives creatine + ATP.","Creatine kinase = fast refill.",0,4],["Anaerobic glycolysis gives how much ATP per glucose and ends in which product?",["2 ATP and lactate","30 to 32 ATP and carbon dioxide","2 ATP and carbon dioxide","30 to 32 ATP and lactate"],0,"It is fast but inefficient, and lactate builds up. It lasts about 1 to 2 minutes.","2 ATP, lactate.",0,4],["Aerobic oxidative phosphorylation yields about:",["2 to 4 ATP per glucose","10 to 12 ATP per glucose","100 to 120 ATP per glucose","30 to 32 ATP per glucose"],3,"It happens in the mitochondria and needs oxygen from myoglobin and blood.","About 30.",0,4],["Which activity depends mainly on phosphocreatine?",["A marathon run or a long-distance cycle","Standing still or walking slowly for an hour","A 100-metre sprint or a single heavy lift","A 3-kilometre jog or a brisk long swim"],2,"The marathon is aerobic.","Short and explosive = phosphocreatine.",0,4],["Oxygen debt (EPOC) after hard exercise is the oxygen needed to:",["build up lactate in the working muscle and keep the heart rate and breathing high","restore ATP and phosphocreatine, clear lactate in the liver and refill myoglobin","break down muscle proteins to amino acids for energy and rebuild the glycogen","clear the carbon dioxide trapped in the muscle capillaries and alveoli only"],1,"That is why breathing stays fast after exercise.","Repay what you borrowed.",0,4],["Which is a cause of muscle fatigue?",["Depletion of ATP and glycogen with build-up of lactate, H+ and phosphate","Excess ATP and glycogen with removal of lactate, H+ and phosphate","Excess calcium in the T-tubule with removal of potassium from the sarcolemma","Loss of myosin from the thick filament with excess calcium in the SR"],0,"Ionic disturbance also plays a part.","Fuel down, waste up.",0,4],["Which is an isometric contraction?",["Lifting a cup slowly up to the mouth","Pushing against a wall without moving","Lowering a weight slowly to the floor","Walking steadily up a long staircase"],1,"Tension rises but length stays constant.","Iso-metric = same length.",0,5],["The biceps lowering a heavy weight slowly is an example of:",["concentric contraction","eccentric contraction","isometric contraction","tetanus"],1,"The muscle lengthens under load.","Eccentric = lengthening.",0,5],["A twitch is:",["the response to repeated action potentials at high frequency","the response to a single action potential in the motor neuron","the sustained steady contraction of a muscle at complete rest","the gradual loss of tension in a fatigued muscle after exercise"],1,"It has a latent, a contraction and a relaxation period.","One impulse, one twitch.",0,5],["The latent period of a twitch is the time between the:",["start of tension and the peak of tension, covering the power strokes of myosin","peak of tension and the end of tension, covering the calcium re-uptake into the SR","stimulus and the start of tension, covering the action potential and E-C coupling","end of tension and the next stimulus, covering the recovery of the ATP stores"],2,"No force is yet seen.","Latent = nothing visible yet.",0,5],["Complete (fused) tetanus occurs when:",["stimuli arrive at a low frequency, so tension is wavy and rather weak","stimuli arrive at a high frequency, so tension is smooth and maximal","a single stimulus is applied, so only a single small twitch results","stimuli stop completely, so the muscle relaxes fully between twitches"],1,"Normal voluntary contraction behaves this way.","Fast firing = smooth.",0,5],["Summation of twitches is possible in skeletal muscle because:",["the muscle action potential (1 to 5 ms) is much shorter than the contraction","the muscle action potential (1 to 5 ms) is much longer than the contraction","the refractory period lasts as long as the whole contraction and relaxation","the neuromuscular junction releases more ACh with every successive impulse"],0,"A second stimulus can arrive before the muscle relaxes.","Short spike, long twitch.",0,5],["Treppe (the staircase effect) is:",["the gradual fall in tension of a muscle that has been fatigued","the smooth fusion of successive twitches during complete tetanus","the gradual loss of tone in a denervated muscle after injury","the gradual rise in the first few twitches of a rested muscle"],3,"More calcium is available, and the muscle warms.","Warm-up effect.",0,5],["Recruitment of motor units means:",["making each motor unit fire at a lower frequency","increasing the length of the sarcomere in the muscle","activating more motor units to get a stronger contraction","removing the larger motor units from the pool first"],2,"Small units are recruited first and large units last (size principle).","More units, more force.",0,5],["Which muscles have the smallest motor units, for the finest control?",["Back and leg muscles","Gluteal muscles","Eye and hand muscles","Calf muscles"],2,"They have 3 to 10 fibres per neuron. Big units have hundreds to thousands.","Fine control = few fibres per neuron.",0,5],["Muscle tone is:",["a large, sudden, short-lived tension in a muscle after a single stimulus","a small, steady tension in a resting muscle, kept up by spinal reflexes","a complete loss of tension in a resting muscle caused by nerve damage","a sustained tetanic contraction in a resting muscle caused by a reflex"],1,"It depends on the stretch reflex.","Tone = idle tension.",0,5],["The force of a muscle is greatest at a sarcomere length of about:",["2.0 to 2.2 micrometres","1.0 to 1.2 micrometres","3.5 to 4.0 micrometres","5.0 to 6.0 micrometres"],0,"That is the best overlap of thick and thin filaments.","Optimal = resting length.",0,5],["If a muscle is overstretched, force falls because:",["overlap of thick and thin filaments is increased, so the filaments collide","calcium release is reduced, so troponin cannot uncover the binding sites","ATP production is reduced, so the myosin heads cannot detach from actin","overlap of thick and thin filaments is reduced, so fewer cross-bridges form"],3,"If too short, thin filaments collide in the centre.","Too stretched = too little overlap.",0,5],["As the load on a muscle increases, its velocity of shortening:",["decreases, and reaches zero when the load equals the maximum force","increases, and reaches its maximum when the load equals the maximum force","stays constant, whatever the load","increases at first and then falls to zero at heavy loads"],0,"At that point the contraction is isometric.","Heavier = slower.",0,5],["Type I (slow oxidative) fibres are:",["white, poor in myoglobin and mitochondria, and quick to fatigue","red, rich in myoglobin and mitochondria, and resistant to fatigue","red, rich in myoglobin and glycogen, and quick to fatigue","white, poor in myoglobin and glycogen, and resistant to fatigue"],1,"They are used for posture and marathon running, for example the soleus.","Slow Red Oxen Endure.",0,6],["Type IIx (fast glycolytic) fibres are best suited for:",["standing posture and marathon running","sprinting and powerful short bursts","walking and middle-distance running","continuous breathing movements"],1,"They have large diameter, few mitochondria and fatigue quickly.","Fast White Sprinters.",0,6],["Which fibre type uses both aerobic and anaerobic metabolism and is moderately fatigue resistant?",["Type I","Type IIx","Smooth muscle fibre","Type IIa"],3,"Intermediate in speed, diameter and endurance.","IIa sits in the middle.",0,6],["Which pair of terms is correctly matched?",["Atrophy and enlarged fibres with resistance training","Hypertrophy and shrinkage of fibres from disuse","Hypertrophy and enlarged fibres with resistance training","Contracture and a sustained contraction from low calcium"],2,"Atrophy follows disuse, denervation or ageing.","Hyper = bigger.",0,6],["Tetany, as distinct from a contracture, is:",["sustained contraction from high calcium, as opposed to shortening with an action potential","shortening without an action potential, as opposed to sustained contraction from low calcium","weakness from low calcium, as opposed to shortening from high calcium","sustained contraction from low calcium, as opposed to shortening without an action potential"],3,"Contracture is seen in ATP depletion, for example.","Tetany = low calcium.",0,6],["Poliomyelitis causes paralysis because it:",["blocks acetylcholine receptors on the end-plate","removes dystrophin from the sarcolemma of the fibre","destroys the motor neurons that supply the muscle","blocks calcium release from the terminal cisternae"],2,"It is a lower motor neuron disease.","Polio kills the nerve cell, not the muscle.",0,6],["Rhabdomyolysis is:",["breakdown of muscle with release of myoglobin into the blood","autoimmune destruction of ACh receptors at the end-plate","inherited loss of dystrophin from the muscle fibre","viral destruction of motor neurons in the spinal cord"],0,"Myoglobin can damage the kidney.","Rhabdo = muscle melting.",1,6],["Intramuscular injections are given into large muscles such as the deltoid and gluteal muscles because:",["the fibres are mostly red and slow","the nerve supply is absent in those muscles","the sarcolemma is thin in those muscles","abundant capillaries absorb the drug well"],3,"Vastus lateralis is also used.","Big muscle, big blood supply.",0,6],["Bed rest and plaster casts are managed with early mobilisation and passive exercises to prevent:",["hypertrophy and tetanus","atrophy and contractures","rigor and rhabdomyolysis","myasthenia and cramps"],1,"Atrophy starts within days of immobility.","Use it or lose it.",0,6]]},{"t":"Autonomic Nervous System (Overview)","s":["Divisions and pathway","Sympathetic versus parasympathetic","Transmitters and receptors","Effects on organs","Clinical links and drugs"],"q":[["The somatic nervous system differs from the autonomic nervous system in that it:",["uses two neurons from the CNS to the effector","supplies smooth muscle, cardiac muscle and glands","uses one neuron from the CNS to the skeletal muscle","works entirely without voluntary control"],2,"ANS = two neurons, somatic = one.","Somatic goes straight, ANS has a stop.",0,0],["The autonomic nervous system supplies:",["skeletal muscle only, through the alpha motor neurons","skeletal muscle and smooth muscle of the viscera only","smooth muscle, cardiac muscle and the glands of the body","cardiac muscle and the bones of the axial skeleton only"],2,"It works mainly through reflexes to maintain homeostasis.","ANS = involuntary targets.",0,0],["The three divisions of the autonomic nervous system are:",["sympathetic, somatic and the enteric divisions","parasympathetic, somatic and central divisions","sympathetic, central and peripheral divisions","sympathetic, parasympathetic and enteric divisions"],3,"The enteric system is the gut's own nervous system.","Sympathetic, parasympathetic, enteric.",0,0],["The preganglionic autonomic neuron is:",["thin and unmyelinated (type C fibre), with its cell body in the CNS","thin and myelinated (type B fibre), with its cell body in the CNS","thick and myelinated (type A fibre), with its cell body in a ganglion","thick and unmyelinated (type B fibre), with its cell body in a ganglion"],1,"The postganglionic one is unmyelinated (C) with its cell body in a ganglion.","B for Before the ganglion.",0,0],["The postganglionic autonomic neuron is:",["myelinated (type B fibre), with its cell body in the CNS","unmyelinated (type C fibre), with its cell body in a ganglion","myelinated (type A fibre), with its cell body in a ganglion","unmyelinated (type A fibre), with its cell body in the CNS"],1,"That is why it conducts slowly.","C for after.",0,0],["The central nervous system is made up of:",["the cranial and spinal nerves","the somatic and autonomic nerves","the brain and the spinal cord","the brain and the cranial nerves"],2,"Everything else is the peripheral nervous system.","CNS = brain + cord.",0,0],["The sympathetic preganglionic fibres originate from:",["the craniosacral region (cranial nerves III, VII, IX, X and S2 to S4)","the cervical region only (C1 to C4)","the sacral region only (S2 to S4)","the thoracolumbar region (T1 to L2)"],3,"ThoracoLumbar = Sympathetic.","Two Legs run away.",0,1],["The parasympathetic preganglionic fibres originate from:",["the thoracolumbar region (lateral horn cells of T1 to L2 segments)","the cervicothoracic region (cranial nerves V, VI, VIII, XI and C1 to C8)","the craniosacral region (cranial nerves III, VII, IX, X and S2 to S4)","the lumbosacral region (lateral horn cells of L1 to L5 segments)"],2,"CranioSacral = Parasympathetic.","Cranial + sacral.",0,1],["Which cranial nerve carries most of the parasympathetic supply to the thorax and abdomen?",["The facial nerve (VII)","The vagus nerve (X)","The oculomotor nerve (III)","The glossopharyngeal nerve (IX)"],1,"The vagus slows the heart.","Vagus = wandering and widespread.",0,1],["The ganglia of the sympathetic system are:",["close to the target organ, with long preganglionic and short postganglionic fibres","close to the target organ, with short preganglionic and long postganglionic fibres","close to the spinal cord, with short preganglionic and long postganglionic fibres","close to the spinal cord, with long preganglionic and short postganglionic fibres"],2,"The parasympathetic system is the opposite.","Sympathetic: short pre, long post.",0,1],["The ganglia of the parasympathetic system are:",["close to the spinal cord in the chain, with short preganglionic and long postganglionic fibres","inside the brain stem itself, with long preganglionic and very long postganglionic fibres","close to or inside the target organ, with long preganglionic and short postganglionic fibres","within the sympathetic chain, with very short preganglionic and short postganglionic fibres"],2,"Its effects are discrete and short-lived.","Parasympathetic: long pre, short post.",0,1],["The spread of sympathetic effects is:",["discrete and short-lived, to one organ only","widespread and long-lasting, as in mass discharge","widespread and short-lived, to the gut only","discrete and long-lasting, to the heart only"],1,"Adrenaline released into the blood prolongs the effect.","Sympathetic spreads, parasympathetic is specific.",0,1],["Which situation is mainly under sympathetic control?",["Fight, flight and fright","Digestion after a meal","Passing urine","Salivation at the sight of food"],0,"The E situations: excitement, exercise, emergency, embarrassment.","Sympathy = stress.",0,1],["Which of these is a parasympathetic situation?",["Digestion","Exercise","Emergency","Embarrassment"],0,"The D situations: digestion, defecation, diuresis.","Rest and digest.",0,1],["What does SLUDD stand for?",["Sweating, lacrimation, urination, digestion, dilatation","Salivation, lacrimation, ureter relaxation, dilatation, defecation","Salivation, lacrimation, urination, digestion, defecation","Sweating, lung dilatation, urination, digestion, defecation"],2,"These are all parasympathetic effects.","SLUDD = parasympathetic.",0,1],["The preganglionic transmitter in both sympathetic and parasympathetic systems is:",["noradrenaline, acting on alpha receptors","acetylcholine, acting on muscarinic receptors","acetylcholine, acting on nicotinic receptors","noradrenaline, acting on beta receptors"],2,"Both systems share ACh at the ganglion.","Same at the ganglion.",0,2],["The postganglionic transmitter of the parasympathetic system is:",["noradrenaline, acting on adrenergic receptors","acetylcholine, acting on nicotinic receptors","adrenaline, acting on beta receptors","acetylcholine, acting on muscarinic receptors"],3,"Atropine blocks these receptors.","Para = ACh muscarinic.",0,2],["The postganglionic transmitter of most sympathetic fibres is:",["acetylcholine, acting on the muscarinic receptors","noradrenaline, acting on alpha and beta receptors","acetylcholine, acting on the nicotinic receptors","dopamine, acting only on the muscarinic receptors"],1,"Sweat glands are the exception, using ACh.","Sympathetic = noradrenaline.",0,2],["Sweat glands are supplied by:",["sympathetic fibres that release noradrenaline","parasympathetic fibres that release acetylcholine","parasympathetic fibres that release noradrenaline","sympathetic fibres that release acetylcholine"],3,"They are called sympathetic cholinergic fibres.","The odd one out.",0,2],["The adrenal medulla acts like:",["a modified parasympathetic ganglion that releases acetylcholine into the blood stream","a motor end-plate that releases acetylcholine onto the skeletal muscle fibres directly","a sensory receptor that releases noradrenaline onto the afferent nerve fibres in the skin","a modified sympathetic ganglion that releases adrenaline and noradrenaline into the blood"],3,"About 80% of its output is adrenaline.","Medulla = adrenaline 80%.",0,2],["Which receptor type does the neurotransmitter at a skeletal muscle end-plate act on?",["Nicotinic receptors","Muscarinic receptors","Alpha receptors","Beta receptors"],0,"The somatic system uses ACh on nicotinic receptors.","NMJ = nicotinic.",0,2],["Which statement about adrenergic receptors is correct?",["Beta-2 receptors constrict the bronchi","Alpha receptors dilate the bronchi","Muscarinic receptors dilate the bronchi","Beta-2 receptors dilate the bronchi"],3,"Salbutamol works on beta-2 receptors.","Beta-2 = airways open.",1,2],["Sympathetic stimulation of the heart:",["decreases the rate and the force of contraction","increases the rate but decreases the force","decreases the rate but increases the force","increases the rate and the force of contraction"],3,"Vagal stimulation (parasympathetic) slows the heart.","Sympathetic speeds up.",0,3],["Parasympathetic stimulation of the pupil causes:",["dilatation (mydriasis)","no change in size","constriction (miosis)","loss of the light reflex"],2,"Sympathetic stimulation dilates it.","Para = pupil shrinks.",0,3],["Sympathetic stimulation of the bronchi causes:",["dilatation, through beta-2 receptors","constriction, through muscarinic receptors","dilatation, through muscarinic receptors","constriction, through alpha receptors"],0,"Parasympathetic stimulation constricts them.","Fight or flight needs air.",0,3],["Sympathetic stimulation of gut motility and secretion:",["increases them","has no effect","decreases them","stops them permanently"],2,"Parasympathetic stimulation increases them.","Digestion is paused in an emergency.",0,3],["The sympathetic effect on the salivary glands is:",["profuse watery saliva","small amounts of thick saliva","no saliva at all, with painful dryness","excess saliva with mucus only"],1,"Parasympathetic gives profuse watery saliva.","Dry mouth with fear.",0,3],["On the urinary bladder, parasympathetic stimulation:",["contracts the detrusor muscle, causing micturition","relaxes the detrusor muscle and closes the sphincter","contracts the detrusor muscle and closes the sphincter","relaxes the detrusor muscle and opens the sphincter"],0,"Sympathetic stimulation relaxes the detrusor and closes the sphincter.","Para = pass urine.",0,3],["On the liver, sympathetic stimulation causes:",["glycogen synthesis, lowering the blood glucose","ketone production only, with no change in glucose","glycogenolysis, raising the blood glucose","protein synthesis, with a fall in blood glucose"],2,"Parasympathetic stimulation favours glycogen synthesis.","Run needs sugar.",0,3],["Which organ has sympathetic vasoconstriction but little direct parasympathetic effect?",["Blood vessels of the skin and gut","The heart muscle and the SA node","The bronchial tree of the lungs","The detrusor muscle of the bladder"],0,"Blood is shifted to muscles in an emergency.","Skin and gut go pale.",0,3],["Which of these is NOT a sympathetic effect?",["Dilatation of the pupil by the radial muscle","Increased cellular metabolism in most tissues","Increased sweating from the palms and body","Slowing of the heart rate via the vagus nerve"],3,"The vagus is parasympathetic.","Vagus = slow the heart.",0,3],["Atropine is used because it:",["blocks beta receptors, lowering the heart rate and blood pressure and narrowing airways","blocks muscarinic receptors, raising heart rate, drying secretions and dilating the pupils","stimulates alpha receptors, raising blood pressure and constricting the skin vessels","inhibits acetylcholinesterase, raising ACh in the cleft and slowing the heart rate down"],1,"Before surgery, it dries secretions.","Atropine = anti-muscarinic.",0,4],["Propranolol lowers heart rate and blood pressure because it:",["blocks muscarinic receptors","blocks nicotinic receptors","blocks alpha receptors only","blocks beta receptors"],3,"Beta-blockers are used in hypertension and angina.","Propranolol = beta-blocker.",0,4],["Adrenaline is given in anaphylaxis and cardiac arrest because it:",["acts on muscarinic receptors, lowering blood pressure and constricting the airways","acts on nicotinic receptors, raising blood pressure and constricting the airways","acts on alpha and beta receptors, raising blood pressure and opening the airways","blocks beta receptors, lowering blood pressure and opening the airways"],2,"It works at the vessels, heart and bronchi together.","Adrenaline = alpha and beta.",0,4],["Neostigmine raises ACh levels because it:",["increases ACh synthesis in the nerve terminal","inhibits acetylcholinesterase","blocks muscarinic receptors","blocks choline reuptake"],1,"It is used in myasthenia gravis and to reverse curare.","Neostigmine boosts ACh.",0,4],["Why does an anaphylaxis patient need adrenaline rather than atropine?",["Atropine opens the airways just as well but cannot raise the blood pressure","Atropine raises the blood pressure well but cannot open the narrowed airways","Atropine does not open the airways or support the blood pressure as adrenaline does","Atropine causes constriction of the airways and a further fall in blood pressure"],2,"Adrenaline acts at beta-2 and alpha receptors.","Anaphylaxis: adrenaline first.",0,4],["A patient on a beta-blocker may not show a rapid pulse when in shock because:",["the parasympathetic effect on the heart is blocked","the nicotinic receptors at the ganglion are blocked","the sympathetic effect on the heart is blocked","the adrenal medulla cannot release adrenaline"],2,"The nurse should not rely on pulse alone.","Beta-blocker hides the pulse.",0,4],["Atropine causes a dry mouth because it:",["blocks the beta receptors in the salivary glands","blocks the muscarinic receptors in the salivary glands","blocks the nicotinic receptors in the salivary glands","blocks the alpha receptors in the salivary glands"],1,"Parasympathetic stimulation produces profuse watery saliva.","Dry mouth = anticholinergic.",0,4]]},{"t":"Rapid Revision Sheets","s":["Numbers to memorise","Master mnemonics","Whole-course story and mixed recall"],"q":[["Total body water as a percentage of body weight in a young adult male is about:",["40%","20%","75%","60%"],3,"ICF is 40%, ECF is 20%.","60-40-20.",0,0],["For a 70 kg man, the intracellular fluid volume is about:",["28 litres","14 litres","42 litres","10 litres"],0,"40% of 70 kg = 28 kg, about 28 litres.","ICF = 40% of the body weight.",0,0],["For a 70 kg man, the extracellular fluid volume is about:",["28 litres","42 litres","14 litres","3.5 litres"],2,"20% of 70 kg = 14 litres. Plasma is 5%, so about 3.5 litres.","ECF = 20%.",0,0],["Which values give the Na+ concentration outside and inside the cell?",["14 mmol/L outside and 142 mmol/L inside","4.2 mmol/L outside and 140 mmol/L inside","140 mmol/L outside and 4.2 mmol/L inside","142 mmol/L outside and 14 mmol/L inside"],3,"K is the reverse: 4.2 outside, 140 inside.","Na outside, K inside.",0,0],["The Nernst potentials for K+, Na+ and Cl- are respectively about:",["+61 mV, -94 mV and -70 mV","-70 mV, -94 mV and +61 mV","-94 mV, -70 mV and +61 mV","-94 mV, +61 mV and -70 mV"],3,"The resting potential is close to E(K) because of the K leak channels.","K is King of rest.",0,0],["How many Na+ and K+ ions are moved by one turn of the sodium-potassium pump?",["2 Na+ out and 3 K+ in","3 Na+ in and 2 K+ out","3 Na+ out and 2 K+ in","3 Na+ out and 3 K+ in"],2,"One ATP is used per cycle, and the pump is electrogenic.","3 out, 2 in.",0,0],["The normal daily water intake and output in an adult are each about:",["2300 ml","500 ml","6000 ml","1000 ml"],0,"Balance keeps body fluid constant.","About 2.3 litres a day.",0,0],["The glycolysis pathway has:",["10 reactions and a net yield of 2 ATP","5 reactions and a net yield of 30 ATP","10 reactions and a net yield of 30 ATP","5 reactions and a net yield of 2 ATP"],0,"It takes place in the cytosol.","Ten steps, two ATP.",0,0],["Water makes up what percentage of body weight in an infant, an elderly person and an adult female?",["About 45%, 73% and 60%","About 60%, 45% and 73%","About 73%, 45% and 40 to 50%","About 73%, 60% and 40 to 50%"],2,"Fat holds little water, so more fat means less water.","Infants hold the most water.",0,0],["The cell membrane is about how thick?",["10 nanometres","10 micrometres","1 millimetre","100 nanometres"],0,"It is too thin to see with a light microscope.","10 nm.",0,0],["Humans have how many chromosomes in each somatic cell?",["23 (one set)","44 (22 pairs)","46 (23 pairs)","48 (24 pairs)"],2,"One of each pair comes from each parent.","46 in total.",0,0],["What does the mnemonic 'Ronke Always Cooks Egusi, Eba and Rice' stand for?",["Receptor, afferent, effector, centre, efferent, response","Response, afferent, centre, efferent, effector, receptor","Receptor, efferent, centre, afferent, effector, response","Receptor, afferent, centre, efferent, effector, response"],3,"It lists the parts of a feedback loop in order.","The control loop.",0,1],["'Every Child Must Nap' is the mnemonic for:",["the four main layers of the plasma membrane and its proteins","the four basic tissues: epithelial, connective, muscular, nervous","the four steps of the cross-bridge cycle in the muscle sarcomere","the four phases of the nerve action potential in a myelinated axon"],1,"Cardiac, skeletal and smooth muscle fall under 'M'.","ECMN = four tissues.",0,1],["'Mama Is Mighty' helps you remember the cytoskeleton filaments in order of size. They are:",["microtubules, intermediate filaments, microfilaments","microfilaments, intermediate filaments, microtubules","intermediate filaments, microfilaments, microtubules","microfilaments, microtubules, intermediate filaments"],1,"Smallest to largest.","M-I-M.",0,1],["'Some Friends Own' stands for the types of passive transport:",["secondary transport, facilitated diffusion and endocytosis","simple diffusion, facilitated diffusion and osmosis","simple diffusion, filtration and osmosis","symport, facilitated diffusion and osmosis"],1,"None of them uses cellular energy.","Passive = no ATP.",0,1],["Symport and antiport differ in that:",["symport moves two substances the same way, while antiport moves them in opposite ways","symport moves two substances opposite ways, while antiport moves them the same way","symport uses ATP directly at the pump, while antiport needs no ATP or carrier","symport crosses the membrane through lipids, while antiport uses ion channels only"],0,"Sym = same, Anti = against.","Sym = Same; Anti = Against.",0,1],["A red blood cell placed in a hypotonic solution will:",["swell and may burst (haemolysis)","shrink and become crenated","stay the same size","release its haemoglobin by shrinking"],0,"Hypo = Hippo. Hypertonic solutions shrink cells.","Hypo = Hippo.",0,1],["What does 'K is King of rest; Na is the actor of the spike' mean?",["Sodium sets the resting potential, and potassium produces the action potential","Potassium sets the threshold, and sodium sets the peak","Sodium sets the pump rate, and potassium sets the refractory period","Potassium sets the resting potential, and sodium produces the action potential"],3,"At rest the membrane is most permeable to K+. In the spike, Na+ rushes in.","King at rest, actor in the spike.",0,1],["Which pair correctly matches the refractory period with its mnemonic?",["Absolute means a stronger stimulus can fire it, and relative means no stimulus can","Absolute means absolutely no stimulus can fire it, and relative means a stronger one can","Absolute means a weaker stimulus can fire it, and relative means a normal one can","Absolute means any stimulus can fire it, and relative means no stimulus can"],1,"Relative = Really needs more.","Absolutely no.",0,1],["'Always Be Good, Don't Be Cruel' gives the fibre order from fastest to slowest:",["A-alpha, A-gamma, A-beta, A-delta, B, C","A-beta, A-alpha, A-gamma, A-delta, B, C","A-alpha, A-beta, A-gamma, A-delta, B, C","A-alpha, A-beta, A-delta, A-gamma, C, B"],2,"Speeds range from 70 to 120 m/s to 0.5 to 2 m/s.","ABGDBC.",0,1],["What does 'ACARE-A' stand for?",["Action potential, ACh, calcium, receptor, end-plate potent try{ if(window.IndigeneHistory&&IndigeneHistory.registerStruct) IndigeneHistory.registerStruct('PHS201G',{title:'PHS 201 \u00b7 General Physiology',chapters:DATA.map(function(c){return {t:c.t,n:c.q.length,s:c.s};})}); }catch(e){}
const SUBJECT_KEY = 'phs201-general';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// flatten
const ALL = [];
DATA.forEach((c,ci)=>c.q.forEach((q,qi)=>ALL.push({id:ci+'_'+qi, ch:ci, stem:q[0], opts:q[1], ans:q[2], exp:q[3], hack:q[4], trap:q[5], sec:q[6], img:q[7]||''})));
const TOTAL = ALL.length;
// questions already served in earlier runs (kept per browser) so new runs favour fresh ones
let SEEN = new Set();
try{ SEEN = new Set(JSON.parse(localStorage.getItem('phs201g_seen')||'[]')); }catch(e){}
function saveSeen(){ try{ localStorage.setItem('phs201g_seen', JSON.stringify([...SEEN])); }catch(e){} }
// shuffle, then put unseen questions first (random order inside each half)
function freshFirst(arr){ const a=shuffle(arr.slice()); return a.filter(q=>!SEEN.has(q.id)).concat(a.filter(q=>SEEN.has(q.id))); }
const FULL_N = 500;
// fair sample: every chapter is represented in proportion to its size
function sampleFair(n){
  const groups = DATA.map((_,ci)=>freshFirst(ALL.filter(q=>q.ch===ci)));
  const exact = groups.map(g=>g.length*n/TOTAL);
  const take = exact.map(Math.floor);
  let left = n - take.reduce((a,b)=>a+b,0);
  exact.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([f,i])=>{ if(left>0 && take[i]<groups[i].length){ take[i]++; left--; } });
  let out=[]; groups.forEach((g,i)=>{ out=out.concat(g.slice(0,take[i])); });
  return shuffle(out);
}

// optional access gate (cbt-lock.js) — never breaks the quiz if missing
let lock = null;
async function loadLock(){
  try { lock = await import('../cbt-lock.js'); }
  catch(e){ try { lock = await import('/cbt-lock.js'); } catch(e2){ lock = null; } }
}
const lockReady = loadLock();

const PASS = 50;
const grade = p => p>=70?'A':p>=60?'B':p>=50?'C':p>=45?'D':p>=40?'E':'F';
let mode = 'full', sel = new Set(), secSel = null, run = [], idx = 0, weakSpec = null;
// '2.3,4.all' = chapter 2 section 3, whole of chapter 4 (sent from the History tab or the result screen)
function specPool(spec){
  const want = spec.map(s=>s.split('.')); let pool = [];
  want.forEach(([c,s])=>{ const ci=(+c)-1; if(!DATA[ci]) return;
    pool = pool.concat(ALL.filter(q=>q.ch===ci && (s==='all' || q.sec===(+s)-1))); });
  pool = shuffle(pool); return pool.length>50 ? pool.slice(0,50) : pool;
}

function renderSetup(){
  const quick = 50, half = 100;
  const cards = [
    ['full', FULL_N, 'Full CBT'],
    ['quick', quick, 'Quick Drill'],
    ['half', half, 'Half Run'],
    ['session', '🎯', 'By Topic']
  ];
  $('runs').innerHTML = cards.map(c=>`<button class="run${c[0]===mode?' sel':''}" data-m="${c[0]}"><span class="n">${c[1]}</span>${c[2]}</button>`).join('');
  document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; renderSetup(); });
  $('chaps').classList.toggle('show', mode==='session');
  $('chapList').innerHTML = DATA.map((c,i)=>{
    const on = sel.has(i);
    let x = `<div class="chap${on?' on':''}" data-i="${i}"><span class="box" style="border-radius:50%">${on?'●':''}</span><span class="nm">Ch ${i+1}. ${esc(c.t)}</span><span class="ct">${c.q.length}</span></div>`;
    if(on){
      x += '<div class="secs"><button class="sec'+(secSel===null?' on':'')+'" data-s="all">Whole chapter · '+c.q.length+'</button>'
        + c.s.map((sn,si)=>'<button class="sec'+(secSel===si?' on':'')+'" data-s="'+si+'">'+esc(sn)+' · '+c.q.filter(q=>q[6]===si).length+'</button>').join('') + '</div>';
    }
    return x;
  }).join('');
  document.querySelectorAll('.chap').forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; sel.clear(); sel.add(i); secSel=null; renderSetup(); });
  document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{ secSel = b.dataset.s==='all' ? null : +b.dataset.s; renderSetup(); });
}

function makeItem(q){
  return { q, perm: shuffle([0,1,2,3]), pick: null };   // perm = order of original options shown 
}

async function startQuiz(){
  if(mode==='session' && sel.size===0){ toast('Pick a chapter first'); return; }
  try{ await lockReady; }catch(e){}
  if(lock && typeof lock.checkCbtAccess==='function'){
    try{
      const r = await lock.checkCbtAccess(SUBJECT_KEY);
      if(r && r.blocked){ lock.renderCbtLockScreen($('app'), r.reason); return; }
    }catch(e){}
  }
  let pool;
  if(mode==='full') pool = sampleFair(FULL_N);
  else if(mode==='quick') pool = freshFirst(ALL).slice(0,50);
  else if(mode==='half') pool = sampleFair(100);
  else if(mode==='weak') pool = specPool(weakSpec||[]);
  else {
    pool = [];
    [...sel].sort((a,b)=>a-b).forEach(ci=>{ pool = pool.concat(ALL.filter(q=>q.ch===ci && (secSel===null || q.sec===secSel))); });
  }
  if(!pool.length){ toast('Nothing to practise there'); return; }
  begin(pool);
}

let startedAt = 0, isRetry = false, saved = false;
let reviewing=false;
function begin(pool, retry){
  reviewing=false; $('finishBtn').textContent='Finish & see score';
  run = pool.map(makeItem); idx = 0; startedAt = Date.now(); isRetry = !!retry; saved = false;
  if(!retry){ pool.forEach(q=>SEEN.add(q.id)); if(SEEN.size >= TOTAL) SEEN = new Set(); saveSeen(); }
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  window.scrollTo(0,0);
  renderQ();
}

function counts(){
  let ok=0,no=0,to=0;
  run.forEach(it=>{ if(it.pick===-1) to++; else if(it.pick!==null){ it.pick===it.q.ans ? ok++ : no++; } });
  return {ok,no,to};
}
// 20 second timer per question: +1 right, -1/2 wrong, 0 on timeout or skip
const TIME_LIMIT = 20;
let tmr = null, deadline = 0;
function stopTimer(){ if(tmr){ clearInterval(tmr); tmr=null; } }
function paintTimer(){
  const left = Math.max(0, Math.ceil((deadline-Date.now())/1000));
  const t=$('tm'); t.textContent = left+'s'; t.classList.toggle('warn', left<=5);
  return left;
}
function startTimer(){
  stopTimer();
  deadline = Date.now()+TIME_LIMIT*1000; paintTimer();
  tmr = setInterval(()=>{
    if(paintTimer()<=0){
      stopTimer();
      const it = run[idx];
      if(it && it.pick===null && !reviewing){ it.pick = -1; renderQ(); }
    }
  },250);
}

function renderQ(){
  const it = run[idx], q = it.q, c = counts();
  $('qpos').textContent = `Q ${idx+1} / ${run.length}`;
  $('sOk').textContent = c.ok; $('sNo').textContent = c.no;
  $('bar').style.width = ((c.ok+c.no+c.to)/run.length*100)+'%';
  $('chtag').textContent = `Ch ${q.ch+1} · ${DATA[q.ch].t}`;
  $('qtext').textContent = q.stem;
  $('qimg').innerHTML = q.img || '';
  const L = ['A','B','C','D'];
  const answered = it.pick!==null || reviewing;
  if(answered){ stopTimer(); $('tm').textContent = it.pick===-1 ? 'time up' : (reviewing ? '' : '✔'); $('tm').classList.toggle('warn', it.pick===-1); } else startTimer();
  $('opts').innerHTML = it.perm.map((oi,pos)=>{
    let cls='opt';
    if(answered){ cls+=' locked'; if(oi===q.ans) cls+=' correct'; else if(oi===it.pick) cls+=' wrong'; }
    return `<button class="${cls}" data-oi="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.opts[oi])}</span></button>`;
  }).join('');
  if(!answered) document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  renderFb();
  $('prev').disabled = idx===0;
  $('next').textContent = idx===run.length-1 ? (reviewing?'Done ▶':'Finish ▶') : 'Next ▶';
}

function renderFb(){
  const it = run[idx], q = it.q;
  if(it.pick===null && !reviewing){ $('fb').innerHTML=''; return; }
  const good = it.pick===q.ans;
  const pos = 'ABCD'[it.perm.indexOf(q.ans)];
  $('fb').innerHTML = `<div class="fb">
    ${q.trap?'<span class="trap">⚠ TRAP QUESTION</span>':''}
    <div class="v ${good?'ok':'no'}">${good?'✅ Correct! +1':it.pick===-1?'⏰ Time up (0 marks) — the answer is '+pos:it.pick===null?'⏭ Skipped — the answer is '+pos:'❌ Not quite (−½) — the answer is '+pos}</div>
    <p class="ex">${esc(q.exp)}</p>
    <div class="hk">⏱ Speed hack: ${esc(q.hack)}</div>
  </div>`;
}

function choose(oi){
  const it = run[idx];
  if(it.pick!==null || reviewing) return;
  it.pick = oi;
  try{ if(lock && typeof lock.recordCbtQuestionUsed==='function') lock.recordCbtQuestionUsed(); }catch(e){}
  renderQ();
}

$('prev').onclick=()=>{ if(idx>0){ idx--; renderQ(); window.scrollTo(0,0);} };
$('next').onclick=()=>{ if(idx<run.length-1){ idx++; renderQ(); window.scrollTo(0,0);} else if(reviewing) backToResult(); else finish(); };
function startReview(){
  stopTimer(); reviewing=true; idx=0;
  $('finishBtn').textContent='Back to result';
  $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
  renderQ(); window.scrollTo(0,0);
}
function backToResult(){ stopTimer(); reviewing=false; $('finishBtn').textContent='Finish & see score'; finish(); }
$('finishBtn').onclick=()=>{
  if(reviewing){ backToResult(); return; }
  const left = run.filter(i=>i.pick===null).length;
  if(left===0){ finish(); return; }
  $('cmsg').textContent = left+' question(s) not answered yet. Finish anyway?';
  $('cov').classList.add('show');
};
$('cYes').onclick=()=>{ $('cov').classList.remove('show'); finish(); };
$('cNo').onclick=()=>$('cov').classList.remove('show');

function openMap(){
  $('map').innerHTML = run.map((it,i)=>{
    let c=''; if(it.pick!==null) c = it.pick===it.q.ans?'ok':'no';
    if(i===idx) c+=' cur';
    return `<button class="${c}" data-i="${i}">${i+1}</button>`;
  }).join('');
  document.querySelectorAll('#map button').forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; $('ov').classList.remove('show'); renderQ(); window.scrollTo(0,0); });
  $('ov').classList.add('show');
}
$('mapBtn').onclick=openMap;
$('closeMap').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{ if(e.target.id==='ov') $('ov').classList.remove('show'); };

function saveHistory(c){
  if(saved || isRetry) return;
  const answered = c.ok + c.no;
  if(answered<=0) return;
  saved = true;
  try{
    if(window.IndigeneHistory && typeof window.IndigeneHistory.save==='function'){
      const topics = {};
      run.forEach(it=>{
        if(it.pick===null||it.pick===-1) return;
        const k = 'Ch '+(it.q.ch+1)+' · '+DATA[it.q.ch].s[it.q.sec];
        if(!topics[k]) topics[k]=[0,0];
        topics[k][1]++; if(it.pick===it.q.ans) topics[k][0]++;
      });
      window.IndigeneHistory.save({course:'PHS201G', mode:'cbt', correct:c.ok, total:answered,
        secs:Math.round((Date.now()-startedAt)/1000), topics:topics});
    }
  }catch(e){}
}
function finish(){
  stopTimer();
  const c = counts(), n = run.length, un = n-c.ok-c.no-c.to;
  const marks = c.ok - c.no*0.5;
  const pct = n? Math.max(0,Math.round(marks/n*100)):0;
  const msg = pct>=70?'Outstanding. You are ready for the exam. 🔥':pct>=50?'You passed. Keep pushing higher and clear every section.':pct>=40?'Close. Revise the failed sections and run again.':'Keep going. Read the failed sections again, then retry.';
  saveHistory(c);
  const chs = {}, secs = {};
  run.forEach(it=>{
    const q = it.q, good = it.pick===q.ans;
    const a = chs[q.ch] || (chs[q.ch] = {ok:0,n:0}); a.n++; if(good) a.ok++;
    const k = q.ch+'_'+q.sec; const b = secs[k] || (secs[k] = {ch:q.ch,sec:q.sec,ok:0,n:0}); b.n++; if(good) b.ok++;
  });
  const chKeys = Object.keys(chs).map(Number).sort((x,y)=>x-y);
  const pc = x => Math.round(x.ok/x.n*100);
  const need = ci => Math.max(8, Math.ceil(DATA[ci].q.length*0.4));
  const rows = chKeys.map(ci=>{
    const a = chs[ci], s = pc(a), full = a.n>=need(ci), ok = s>=PASS;
    const sr = Object.values(secs).filter(x=>x.ch===ci).sort((x,y)=>x.sec-y.sec).map(x=>`<div class="sr"><span>${esc(DATA[ci].s[x.sec])}</span><b class="${pc(x)>=PASS?'pass':'fail'}">${x.ok}/${x.n} · ${pc(x)}%</b></div>`).join('');
    return `<details class="cres"${(full&&!ok)?' open':''}><summary><span>Ch ${ci+1} · ${esc(DATA[ci].t)}</span><b class="${!full?'na':ok?'pass':'fail'}" style="white-space:nowrap">${s}/100 · ${grade(s)} · ${!full?'PRACTICE':ok?'PASS ✔':'FAIL ✖'}</b></summary>${sr}</details>`;
  }).join('');
  const weak = Object.values(secs).filter(x=>x.n>=2 && pc(x)<PASS).sort((x,y)=>x.ch-y.ch||x.sec-y.sec);
  const revise = weak.length ? `<div class="revise"><b>Revise these sections</b>${weak.map(x=>`<div class="sr"><span>Ch ${x.ch+1} · ${esc(DATA[x.ch].s[x.sec])}</span><b class="fail">${pc(x)}%</b></div>`).join('')}</div>` : '<p class="msg pass"><b>Every section in this run is at pass mark or above.</b></p>';
  const fullKeys = chKeys.filter(ci=>chs[ci].n>=need(ci));
  const passedN = fullKeys.filter(ci=>pc(chs[ci])>=PASS).length;
  const wrong = run.filter(it=>it.pick!==null && it.pick!==it.q.ans);
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
  window.scrollTo(0,0);
  $('result').innerHTML = `
    <h2>Result</h2>
    <div class="big" style="font-size:2.2rem">${pct}/100 · ${grade(pct)}</div>
    <p class="msg" style="text-align:center">Marks: ${marks} out of ${n} (+1 right, −½ wrong, 0 timeout)</p>
    <div class="stats"><span>Correct <b>${c.ok}</b></span><span>Wrong <b>${c.no}</b></span><span>Timed out <b>${c.to}</b></span><span>Skipped <b>${un}</b></span><span>Total <b>${n}</b></span></div>
    <p class="msg"><b class="${pct>=PASS?'pass':'fail'}">${pct>=PASS?'PASS':'FAIL'}</b> · pass mark ${PASS}/100 · ${fullKeys.length?'chapters passed in this run '+passedN+'/'+fullKeys.length:'practice run, no chapter pass or fail'}</p>
    <p class="msg">${msg}</p>
    <h2 style="margin-top:16px">Score per chapter</h2>
    ${rows}
    <p class="msg" style="font-size:.8rem;color:var(--mute)">PRACTICE means this run had under 40% of that chapter's questions, so it shows a score but no pass or fail.</p>
    ${revise}
    ${weak.length?'<button class="btn" id="weakBtn">Practice these weak sections ('+weak.length+')</button>':''}
    <button class="btn" id="reviewBtn">Review answers${wrong.length?' ('+wrong.length+' wrong)':''}</button>
    <a class="btn ghost" style="text-align:center;text-decoration:none" href="/#history=PHS201G">My history</a>
    ${wrong.length?`<button class="btn" id="retryWrong">Retry wrong answers (${wrong.length})</button>`:''}
    <button class="btn ghost" id="newRun">New run</button>
    `;
  $('reviewBtn').onclick=startReview;
  if($('weakBtn')) $('weakBtn').onclick=()=>{ weakSpec=weak.map(x=>(x.ch+1)+'.'+(x.sec+1)); mode='weak'; startQuiz(); };
  if($('retryWrong')) $('retryWrong').onclick=()=>begin(shuffle(wrong.map(w=>w.q)), true);
  $('newRun').onclick=()=>{ $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); renderSetup(); window.scrollTo(0,0); };
}

document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden') || $('ov').classList.contains('show') || $('cov').classList.contains('show')) return;
  const k=e.key.toLowerCase();
  if('abcd'.includes(k) && k.length===1){ const it=run[idx]; if(it.pick===null){ choose(it.perm['abcd'.indexOf(k)]); } }
  else if(e.key==='ArrowRight') $('next').click();
  else if(e.key==='ArrowLeft') $('prev').click();
});

$('startBtn').onclick=startQuiz;
renderSetup();
try{
  const pr = new URLSearchParams(location.search).get('practice');
  if(pr && /^[\d.,all]+$/.test(pr)){ weakSpec = pr.split(',').filter(Boolean); mode='weak'; startQuiz(); }
}catch(e){}
</script>
</body>
</html>
