<style>
:root{--bg:#0f0805;--bg2:#1a0f0a;--card:#150d09;--line:#4a2a14;--fire:#ff6a1a;--fire2:#c9380f;--gold:#ffb347;--txt:#f3e6d8;--mut:#b49a84;--ok:#2fbf71;--bad:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 500px at 50% -120px,#3a1a0a 0%,var(--bg) 60%) fixed,var(--bg);color:var(--txt);font-family:'Exo 2',system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top) 0 40px}
#app{max-width:720px;margin:0 auto;padding:22px 16px}
h1.brand{font-family:Orbitron,sans-serif;font-weight:900;letter-spacing:.12em;color:var(--fire);text-align:center;margin:8px 0 4px;font-size:clamp(30px,9vw,46px)}
.sub{text-align:center;color:var(--mut);letter-spacing:.08em;font-size:15px;margin:0 8px 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 18px;box-shadow:0 0 40px #0008}
h2.ttl{font-family:Orbitron,sans-serif;color:var(--gold);text-align:center;font-weight:700;font-size:clamp(20px,6vw,28px);margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.run{background:#1b100a;border:1.5px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;color:var(--txt);cursor:pointer;font:inherit}
.run b{display:block;font-family:Orbitron,sans-serif;font-size:26px;color:var(--gold);margin-bottom:2px}
.run span{font-weight:600;font-size:17px}
.run.sel{background:linear-gradient(135deg,var(--fire),var(--fire2));border-color:var(--gold)}
.run.sel b,.run.sel span{color:#fff}
.sess{margin-top:14px;display:none;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#120a06}
.sess.show{display:block}
.srow{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #2d1a0d;color:var(--txt);padding:12px 14px;font:inherit;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow small{color:var(--gold);white-space:nowrap;font-weight:600}
.srow.sel{background:#3a1b0c;box-shadow:inset 3px 0 0 var(--fire)}
.srow.past{color:var(--gold);font-weight:700}
.go{display:block;width:100%;margin-top:20px;border:0;border-radius:16px;padding:18px;font:700 20px 'Exo 2',sans-serif;color:#fff;background:linear-gradient(135deg,var(--fire),var(--fire2));box-shadow:0 8px 26px #ff6a1a44;cursor:pointer}
.go:disabled{opacity:.5}
.foot{color:var(--mut);text-align:center;font-size:14.5px;margin:18px 6px 0;letter-spacing:.03em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--mut);margin-bottom:8px}
.top b{color:var(--gold)}
.quit{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.bar{height:6px;background:#2a170c;border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--fire),var(--gold));width:0}
.tag{display:inline-block;font-size:11.5px;letter-spacing:.1em;font-weight:700;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:2px 10px;margin:0 6px 8px 0}
.tag.t2{border-color:var(--line);color:var(--mut);font-weight:500;letter-spacing:.02em}
.qtext{font-size:19px;font-weight:600;margin:6px 0 14px;white-space:pre-line}
.qimg{display:block;max-width:100%;border-radius:10px;margin:0 0 14px;background:#fff}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#1b100a;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;color:var(--txt);font:inherit;font-size:16.5px;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:#2d1a0d;color:var(--gold);font-family:Orbitron,sans-serif;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.ok{border-color:var(--ok);background:#0f2a1b}.opt.ok .l{background:var(--ok);color:#04150b}
.opt.bad{border-color:var(--bad);background:#33100f}.opt.bad .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:6px;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;background:#120a06;padding:14px}
.fb.ok{border-left-color:var(--ok)}.fb.bad{border-left-color:var(--bad)}
.fb h4{margin:0 0 6px;font-family:Orbitron,sans-serif;font-size:14px;letter-spacing:.06em}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
.fb p{margin:0 0 10px;white-space:pre-line}
.hack{background:#2a1507;border-radius:10px;padding:10px 12px;color:var(--gold);font-weight:600}
.hack em{font-style:normal;font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.08em;display:block;margin-bottom:2px;color:var(--fire)}
.res{text-align:center}
.big{font-family:Orbitron,sans-serif;font-size:56px;font-weight:900;color:var(--gold);margin:6px 0}
.res p{color:var(--mut)}
.btn2{display:block;width:100%;margin-top:12px;background:#1b100a;border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:14px;font:600 16.5px 'Exo 2',sans-serif;cursor:pointer}
.rev{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:#120a06;text-align:left}
.rev .q{font-weight:600;margin-bottom:6px;white-space:pre-line}
.rev .y{color:var(--bad)}.rev .c{color:var(--ok)}
.rev p{margin:6px 0 0;color:var(--mut);white-space:pre-line}
@media(max-width:380px){.grid{gap:8px}.qtext{font-size:17.5px}}
</style>
</head>

var CBT_ID='chm101';
var CH=["Physical Quantities and Error Treatments", "Structure of the Atom", "States of Matter", "The Mole Concept and Avogadro’s Number", "Determination of Relative and Average Atomic Masses", "Stoichiometry and Chemical Equations", "Acids, Bases and Salts", "Chemical Bonding and Intermolecular Forces", "Chemical Equilibrium and Thermodynamics", "Introductory Chemical Kinetics and Nuclear Chemistry", "Introduction to Colligative Properties of Liquids", "Reduction-Oxidation Reactions"];
var QS=[{"ch": 0, "k": "exercise", "s": "Ch1 p.3 Table 2 (applied)", "q": "A block has a mass of 2.7 kg and a volume of 0.001 m³. Its density in the SI derived unit is:", "o": ["270 kg/m³", "2700 kg/m³", "2.7 kg/m³", "0.0027 kg/m³"], "a": 1, "e": "Density = mass / volume = 2.7 kg ÷ 0.001 m³ = 2700 kg/m³. Multiplying instead of dividing gives 0.0027; forgetting the 0.001 gives 2.7; mis-moving the decimal gives 270.", "h": "Divide by a small volume → big density."}, {"ch": 0, "k": "exercise", "s": "Ch1 p.2-3 velocity relation (applied)", "q": "An object covers a displacement of 150 m in 12 s. Using velocity = displacement/time, its velocity is:", "o": ["138 m/s", "12.5 m/s", "0.08 m/s", "1800 m/s"], "a": 1, "e": "v = 150 m ÷ 12 s = 12.5 m/s. Multiplying gives 1800; inverting gives 0.08; subtracting gives 138, which has no meaning.", "h": "Velocity = distance ÷ time; units m/s."}, {"ch": 0, "k": "exercise", "s": "Ch1 p.3 Table 2 (applied)", "q": "A current of 3 A flows uniformly through a cross-section of 0.5 m². The current density in SI units is:", "o": ["1.5 A/m²", "6 A/m²", "6 A·m²", "0.17 A/m²"], "a": 1, "e": "Current density = current ÷ area = 3 A ÷ 0.5 m² = 6 A/m². Multiplying gives 1.5, and a product unit (A·m²) is wrong because the unit must be per area.", "h": "Per area means divide."}, {"ch": 0, "k": "exercise", "s": "Ch1 p.3 Table 2 (applied)", "q": "A speed changes by 20 m/s in 4 s. The acceleration, in the SI derived unit, is:", "o": ["0.2 m/s²", "5 m/s", "5 m/s²", "80 m/s²"], "a": 2, "e": "a = Δv/t = 20 m/s ÷ 4 s = 5 m/s². Multiplication gives 80, losing the 's²' meaning; 5 m/s has the wrong unit; inverting gives 0.2.", "h": "Acceleration unit has s²; check your unit."}, {"ch": 0, "k": "example", "s": "Ch1 p.4 text (energy loss example)", "q": "Scientist 1 obtained 22.60, 22.75 and 22.98 per cent for an energy loss. Scientist 2 obtained 22.63, 22.62 and 22.62 per cent. Which statement is correct?", "o": ["Scientist 2's results are more accurate because they have more digits", "Scientist 1's results are more precise because their mean is higher", "The two sets are equally precise because both are near 22.6", "Scientist 2's results are more precise because they vary much less"], "a": 3, "e": "The spread for scientist 1 is 22.98 - 22.60 = 0.38, while for scientist 2 it is 22.63 - 22.62 = 0.01. Smaller variation among replicates means better precision. Nothing is said about the true value so accuracy cannot be judged here.", "h": "Smaller spread = more precise."}, {"ch": 0, "k": "example", "s": "Ch1 p.5 text (0.428 m example)", "q": "A length is given as 0.428 m ± 0.002 m. The absolute error and relative error (as a percentage) are respectively:", "o": ["0.002 m and 0.467 %", "0.002 m and 4.67 %", "0.002 and 0.467 m", "0.428 m and 0.467 %"], "a": 0, "e": "Absolute error = 0.002 m (it keeps the unit). Relative error = 0.002 ÷ 0.428 = 0.00467, which is 0.467 %. 4.67 % mis-places the decimal; relative error has no unit.", "h": "Absolute in metres, relative in %."}, {"ch": 0, "k": "exercise", "s": "Ch1 p.5 text (variant)", "q": "The mass of a sample is 25.0 g ± 0.1 g. The percentage relative error is:", "o": ["0.04 %", "0.4 %", "0.1 %", "4 %"], "a": 1, "e": "Relative error = 0.1 ÷ 25.0 = 0.004, which is 0.4 %. Using 0.1 alone gives 0.1 %; forgetting ×100 gives 0.004 (0.004 % misread as 0.04 %).", "h": "0.1/25 = 1/250 = 0.4 %."}, {"ch": 0, "k": "exercise", "s": "Ch1 p.5 text (variant)", "q": "A volume is recorded as 0.250 L ± 0.005 L. The percentage relative error is:", "o": ["0.5 %", "5 %", "0.02 %", "2.0 %"], "a": 3, "e": "0.005 ÷ 0.250 = 0.020, so 2.0 %. 0.02 % forgets the ×100; 5 % divides by the error's own digit by mistake; 0.5 % moves the decimal wrongly.", "h": "0.005/0.25 = 1/50 = 2 %."}, {"ch": 0, "k": "exercise", "s": "Ch1 p.5 text (variant)", "q": "A length is 12.50 cm ± 0.05 cm. Its percentage relative error is:", "o": ["0.05 %", "0.4 %", "4 %", "0.04 %"], "a": 1, "e": "0.05 ÷ 12.50 = 0.004, i.e. 0.4 %. Stating the absolute error as the percentage (0.05 %) is a mix-up of absolute and relative error.", "h": "Divide error by the value, then × 100."}, {"ch": 0, "k": "exercise", "s": "Ch1 p.5 text (variant)", "q": "A reading of 2.50 V has an absolute error of ± 0.02 V. The relative error expressed as a percentage is:", "o": ["8 %", "0.8 %", "125 %", "0.08 %"], "a": 1, "e": "0.02 ÷ 2.50 = 0.008 = 0.8 %. Moving the decimal point wrongly gives 8 % or 0.08 %; 1.25 % comes from 2.50 ÷ 0.02 = 125 inverted.", "h": "Absolute ÷ value, then ×100."}, {"ch": 0, "k": "exercise", "s": "Ch1 p.5 text (variant)", "q": "A student measures 50.0 mL with a relative error of 2 %. The absolute error, in mL, is:", "o": ["1.0 mL", "2.0 mL", "25 mL", "0.04 mL"], "a": 0, "e": "Absolute error = relative error × quantity = 0.02 × 50.0 mL = 1.0 mL. Dividing the quantity by 2 % (50/0.02 = 2500) or using 2.0 are errors.", "h": "Reverse: absolute = fraction × quantity."}, {"ch": 0, "k": "concept", "s": "Ch1 p.1 text", "q": "A physical quantity that is determined quantitatively is described as:", "o": ["an individual property of a concrete object, such as its length, width or height", "a property shared by all bodies of one kind, such as being heavy or light", "the standard of comparison fixed by convention for a given kind of property", "a ratio of two units chosen by the observer, such as metres per second"], "a": 0, "e": "A quantity is a property you can measure on a real object, like its length or height. A fixed standard you compare with is a unit, not a quantity. A ratio of units has nothing to do with it.", "h": "Quantity = property being measured; unit = the standard you compare it with."}, {"ch": 0, "k": "concept", "s": "Ch1 p.1 text", "q": "The value of a physical quantity is expressed as:", "o": ["a certain number of the units accepted for that quantity", "a ratio of the quantity to its own estimated error, with no units", "a fixed dimension that does not change whichever unit is chosen for it", "the uncertainty attached to the quantity, written in the same units"], "a": 0, "e": "Value = number × unit, e.g. 0.528 m is 0.528 times the unit metre. The error and the ratio to the error are separate things.", "h": "Value = number × unit. Always write both."}, {"ch": 0, "k": "concept", "s": "Ch1 p.1 text", "q": "The act of comparing a physical quantity with a unit is called:", "o": ["calculation from a formula", "estimation by judgement", "calibration of the instrument", "measurement"], "a": 3, "e": "Comparing a quantity with a unit is measurement. Calibration is checking an instrument against a standard, which is a different job.", "h": "Measurement = comparison with a unit."}, {"ch": 0, "k": "trap", "s": "Ch1 p.1 text", "q": "The measure of a particular physical quantity is defined as:", "o": ["the product of that physical quantity and its unit of measurement", "the difference between the quantity and the unit it is compared with", "the ratio of that physical quantity to the unit", "the ratio of the unit to that physical quantity being measured"], "a": 2, "e": "Measure = quantity / unit. For example, 3 m ÷ 1 m = 3. Inverting the ratio (unit/quantity) or multiplying are the tempting wrong forms.", "h": "⚠ TRAP: it is quantity ÷ unit, not unit ÷ quantity."}, {"ch": 0, "k": "concept", "s": "Ch1 p.1 text", "q": "A set of fundamental units sufficient for measuring the properties of the class of phenomena under consideration is called:", "o": ["a scale of errors used for that class of phenomena", "a table of standard conversion factors for every unit", "a set of derived quantities obtained by algebra", "a system of units"], "a": 3, "e": "A set of fundamental units enough to measure a class of phenomena is a system of units. Derived quantities are built from the base ones. Sig figs and errors are not part of the definition.", "h": "Fundamental units that cover the phenomena = system of units."}, {"ch": 0, "k": "concept", "s": "Ch1 p.2 text", "q": "The abbreviation SI comes from the French name:", "o": ["La Science Internationale d'Unités", "Le Système International d'Unités", "Le Standard International des Unités", "Le Système International des Unités de Mesure"], "a": 1, "e": "SI is universally abbreviated from the French Le Système International d'Unités, the modern metric system of measurement.", "h": "SI = Système International."}, {"ch": 0, "k": "concept", "s": "Ch1 p.2 text", "q": "The SI is founded on how many base units, and what is assumed about the base quantities?", "o": ["seven base units for seven quantities, three of which are obtained from the other four by formulae", "seven base units for seven base quantities assumed to be mutually independent", "seven base units for seven base quantities that are all derived from one another", "five base units for five base quantities assumed to be independent"], "a": 1, "e": "SI has seven base units for seven base quantities, and they are taken as independent of each other. None is derived from another, so 'five' and 'three from four' are wrong.", "h": "7 base units, independent of each other."}, {"ch": 0, "k": "trap", "s": "Ch1 p.2 Table 1", "q": "What is the SI base unit of mass?", "o": ["tonne", "gram", "kilogram", "milligram"], "a": 2, "e": "The SI base unit of mass is the kilogram, not the gram. The gram is just a sub-multiple of it. Milligram and tonne are also multiples.", "h": "⚠ TRAP: the base unit of mass is the kilogram, not the gram."}, {"ch": 0, "k": "trap", "s": "Ch1 p.2 Table 1", "q": "What is the SI base unit of thermodynamic temperature?", "o": ["kelvin", "degree Celsius", "degree Fahrenheit", "joule"], "a": 0, "e": "Kelvin is the base unit of thermodynamic temperature. Celsius and Fahrenheit are other scales, and joule measures energy.", "h": "⚠ TRAP: SI temperature is kelvin, written K without a degree sign."}, {"ch": 0, "k": "concept", "s": "Ch1 p.2 Table 1", "q": "Which pairing of SI base quantity and SI base unit is correct?", "o": ["Luminous intensity: lumen", "Amount of substance: mole", "Time: minute", "Electric current: volt"], "a": 1, "e": "Amount of substance goes with the mole. Current is the ampere, luminous intensity is the candela, and time is the second. Volt, lumen and minute are not base units.", "h": "Current = ampere, luminous intensity = candela, time = second."}, {"ch": 0, "k": "concept", "s": "Ch1 p.2 Table 1", "q": "The SI base unit for electric current is the:", "o": ["ohm", "volt", "ampere", "coulomb"], "a": 2, "e": "Current is measured in amperes. Volt, coulomb and ohm are all derived units.", "h": "Current: ampere, symbol I."}, {"ch": 0, "k": "concept", "s": "Ch1 p.2 Table 1", "q": "The SI base quantity whose unit is the candela is:", "o": ["electric current in a conductor", "thermodynamic temperature of a body", "luminous intensity", "amount of substance in a sample"], "a": 2, "e": "Candela is the unit of luminous intensity. Mole is for amount of substance, ampere for current, kelvin for temperature.", "h": "Candela = luminous intensity."}, {"ch": 0, "k": "trap", "s": "Ch1 p.2-3 Tables 1 and 2", "q": "Which of the following is NOT one of the seven SI base quantities?", "o": ["Length of an object", "Mass of a body", "Electric current in a wire", "Volume"], "a": 3, "e": "Volume is derived (length cubed, so m³). Length, mass and electric current are base quantities.", "h": "⚠ TRAP: area, volume, speed, density are all derived, never base."}, {"ch": 0, "k": "trap", "s": "Ch1 p.2-3 Tables 1 and 2", "q": "Which of the following is NOT an SI base unit?", "o": ["kilogram", "candela", "kelvin", "newton"], "a": 3, "e": "Newton (kg·m/s²) is a derived unit. Kilogram, candela and kelvin are base units, so they are the wrong choices here.", "h": "Base units are only 7: m, kg, s, A, K, mol, cd. Anything else is derived."}, {"ch": 0, "k": "concept", "s": "Ch1 p.2-3 text", "q": "Quantities obtained from base quantities through algebraic relationships are called:", "o": ["dimensionless constants of the system of units", "fundamental quantities that cannot be reduced any further", "independent quantities chosen by convention", "derived quantities"], "a": 3, "e": "Quantities obtained from base quantities by algebraic relationships are derived quantities. They carry derived units; base quantities carry the fundamental ones.", "h": "Base → fundamental units; derived → derived units."}, {"ch": 0, "k": "concept", "s": "Ch1 p.3 text", "q": "Velocity = displacement ÷ time. If displacement and time are chosen as base quantities, then:", "o": ["velocity then has no unit within that system of units", "velocity must also be chosen as a base quantity of the system", "velocity becomes a derived quantity", "velocity becomes a dimensionless quantity with no unit"], "a": 2, "e": "If displacement and time are base quantities, velocity is derived from them. It still has a unit (m/s) so it is not dimensionless, and it is not a base quantity.", "h": "Velocity = displacement ÷ time → derived."}, {"ch": 0, "k": "trap", "s": "Ch1 p.3 Table 2", "q": "The SI derived unit of density is:", "o": ["kg/m²", "m³/kg", "g/m³", "kg/m³"], "a": 3, "e": "Density = mass / volume, so the SI unit is kg/m³ (kilogram, not gram, since kg is the base unit). kg/m² has area instead of volume; m³/kg is inverted.", "h": "⚠ TRAP: density = mass ÷ volume, base mass unit is kg, so kg/m³."}, {"ch": 0, "k": "concept", "s": "Ch1 p.3 Table 2", "q": "The SI derived unit of acceleration is:", "o": ["m²/s", "m/s", "m·s²", "m/s²"], "a": 3, "e": "Acceleration is change in velocity per unit time, (m/s)/s = m/s². m/s is speed itself.", "h": "Velocity m/s; acceleration m/s²: one more 'per second'."}, {"ch": 0, "k": "concept", "s": "Ch1 p.3 Table 2", "q": "The SI derived unit of current density is:", "o": ["A·m²", "A/m³", "A/m²", "kg/m³"], "a": 2, "e": "Current density is current per unit area, so its unit is ampere per square metre (A/m²). kg/m³ is density.", "h": "Current density = current ÷ area = A/m²."}, {"ch": 0, "k": "concept", "s": "Ch1 p.3 Table 2", "q": "The SI derived units of area and volume are respectively:", "o": ["m² and m³", "cm² and cm³", "m and m²", "m³ and m²"], "a": 0, "e": "Area is m² and volume is m³. Centimetre units are not SI, and swapping the two powers is a common slip.", "h": "Area is square (²), volume is cube (³)."}, {"ch": 0, "k": "concept", "s": "Ch1 p.3 text", "q": "A length recorded as 0.528 m implies an uncertainty of about:", "o": ["0.528 m", "0.0001 m", "0.001 m", "0.01 m"], "a": 2, "e": "The last digit (thousandths) is the uncertain one, so the implied uncertainty is about 0.001 m. Reporting 0.5 would imply 0.1 m and 0.52819667 would imply 0.00000001 m.", "h": "Last written digit = the uncertain digit."}, {"ch": 0, "k": "trap", "s": "Ch1 p.3 text", "q": "The measurement 0.528 m is said to have:", "o": ["three decimal places", "three significant figures", "one significant figure", "four significant figures"], "a": 1, "e": "The significant digits are 5, 2 and 8. The leading 0 only fixes the decimal point. Sig figs have nothing to do with counting decimal places, even though both happen to be three here.", "h": "⚠ TRAP: sig figs ≠ decimal places."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text", "q": "A length of 0.528 m is rewritten as 52.8 cm. How many significant figures does 52.8 cm have?", "o": ["two", "four", "three", "one"], "a": 2, "e": "Changing units does not change the number of significant figures. Sig figs are not decimal places, so 52.8 cm is still three.", "h": "⚠ TRAP: converting units never changes sig figs."}, {"ch": 0, "k": "concept", "s": "Ch1 p.3 text", "q": "Recording a measurement as 0.52819667 m (instead of 0.528 m) would wrongly imply that the length is known to:", "o": ["about 0.00000001 m", "about 0.001 m", "about 0.1 m", "about 0.0001 m"], "a": 0, "e": "The last digit is in the 10⁻⁸ place, so the number implies a precision of 0.00000001 m, which no ordinary measurement achieves. Report only as many figures as are consistent with the estimated error.", "h": "Too many digits = over-claiming precision."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text", "q": "If the estimated error in a length of 0.528 m is 0.02 m, the correct way to report the result is:", "o": ["0.5 ± 0.02 m", "0.528 ± 0.02 m", "0.53 ± 0.02 m", "0.528 ± 0.020 m"], "a": 2, "e": "The accepted convention is that only one uncertain digit is reported. Because the error is in the hundredths place, the value is rounded to the hundredths: 0.53 ± 0.02 m. Reporting 0.528 would show two uncertain digits.", "h": "⚠ TRAP: the value must end in the same decimal place as the error."}, {"ch": 0, "k": "concept", "s": "Ch1 p.4 text", "q": "The accepted convention for reporting a measurement is that:", "o": ["only digits that are exactly known are ever reported", "every digit shown on the calculator display is reported", "two uncertain digits are always reported together", "only one uncertain digit is reported"], "a": 3, "e": "You report only one uncertain digit, and it is the last one. Writing every calculator digit over-states how well you know the value.", "h": "One uncertain digit, the last one."}, {"ch": 0, "k": "concept", "s": "Ch1 p.4 text", "q": "A zero in a number is significant when:", "o": ["it appears at the very start of the number written", "it is the final digit of the number once rounded", "it comes directly after the decimal point in the number", "there is a non-zero digit anywhere to its left"], "a": 3, "e": "The rule: if the zero has a non-zero digit anywhere to its left, the zero is significant, otherwise it is not. So 5.00 has 3 and 0.0005 has 1 (the leading zeros have nothing non-zero to their left).", "h": "Leading zeros never count; zeros after a non-zero digit do."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text", "q": "How many significant figures does 5.00 have?", "o": ["2", "3", "1", "0"], "a": 1, "e": "Both zeros have the non-zero digit 5 to their left, so they are significant: 5, 0, 0 gives 3. Counting only the 5 (answer 1) is the usual mistake.", "h": "Trailing zeros after a decimal point count."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text", "q": "How many significant figures does 0.0005 have?", "o": ["5", "1", "2", "4"], "a": 1, "e": "The three zeros before the 5 have no non-zero digit to their left, so they are not significant. Only the 5 counts, giving 1 significant figure.", "h": "Leading zeros are placeholders only."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text", "q": "How many significant figures does 1.0005 have?", "o": ["1", "2", "4", "5"], "a": 3, "e": "The three zeros sit between non-zero digits (1 on the left), so they are significant. All five digits count, giving 5.", "h": "Zeros trapped between non-zero digits always count."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text", "q": "The number 6000 should be written as which of the following to show clearly that it has ONE significant figure?", "o": ["6000.0", "6.0 × 10³", "6.00 × 10³", "6 × 10³"], "a": 3, "e": "6000 on its own is not well defined. Writing 6 × 10³ shows one sig fig; 6.00 × 10³ shows three; 6.0 × 10³ has two and 6000.0 has five.", "h": "Use scientific notation to remove ambiguity."}, {"ch": 0, "k": "concept", "s": "Ch1 p.4 text", "q": "Which of the following expresses 6000 with THREE significant figures?", "o": ["6.0 × 10³", "6 × 10³", "6.000 × 10³", "6.00 × 10³"], "a": 3, "e": "6.00 × 10³ has three sig figs. 6 × 10³ has one, 6.0 × 10³ has two, and 6.000 × 10³ has four.", "h": "Count digits in the coefficient only."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text", "q": "A number such as 6000, written without a decimal point or exponent, is described as:", "o": ["always one significant figure", "always four significant figures", "exactly two significant figures", "not well defined"], "a": 3, "e": "Without scientific notation you cannot tell how many of those zeros are significant, so 6000 is 'not well defined'. Write 6 × 10³ or 6.00 × 10³ to be clear.", "h": "Ambiguous trailing zeros → use powers of ten."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text (variant)", "q": "How many significant figures are in 0.0072?", "o": ["3", "2", "4", "1"], "a": 1, "e": "The zeros before 7 have no non-zero digit to their left, so they are not significant. Only 7 and 2 count, so 2 significant figures.", "h": "Start counting at the first non-zero digit."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text (variant)", "q": "How many significant figures are in 4.050?", "o": ["4", "1", "2", "3"], "a": 0, "e": "The zero between 4 and 5 is significant (non-zero digit on its left). The final zero also has a non-zero digit to its left, so it counts too. Digits 4, 0, 5, 0 give 4.", "h": "Final zero after a decimal point counts."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text (variant)", "q": "How many significant figures are in 0.00300?", "o": ["3", "5", "1", "2"], "a": 0, "e": "The leading zeros do not count. The 3 and the two trailing zeros (each with 3 to their left) count: 3 significant figures. Counting all digits after the decimal point gives 5, the usual error.", "h": "Strip leading zeros, count the rest."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text (variant)", "q": "How many significant figures are in 20.04?", "o": ["2", "4", "1", "3"], "a": 1, "e": "Both zeros are significant: the first lies after 2 (non-zero to its left) and the second lies between 2 and 4. So 2, 0, 0, 4 gives 4.", "h": "Embedded zeros always count."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text (variant)", "q": "How many significant figures are in 1.200 × 10⁴?", "o": ["4", "5", "2", "3"], "a": 0, "e": "Only the coefficient 1.200 counts, and its two trailing zeros follow non-zero digits so they are significant: 4 figures. The power of ten, 10⁴, contributes none.", "h": "The × 10ⁿ part is never counted."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text (variant)", "q": "How many significant figures are in 3.0 × 10⁻⁵?", "o": ["3", "2", "6", "1"], "a": 1, "e": "The coefficient 3.0 has two figures (the zero follows the 3). The exponent does not count, and the zeros implied by the 10⁻⁵ placeholder are not part of the count.", "h": "Count the coefficient only."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text (variant)", "q": "Which of the following numbers has exactly THREE significant figures?", "o": ["0.045", "4500", "0.00450", "0.0045"], "a": 2, "e": "0.00450: leading zeros do not count, but 4, 5 and the final 0 do, giving 3. 0.0045 and 0.045 have 2, and 4500 is not well defined.", "h": "Final zero after a decimal point is the tie-breaker."}, {"ch": 0, "k": "concept", "s": "Ch1 p.4 text (variant)", "q": "Which of the following numbers has the SAME number of significant figures as 1.0005?", "o": ["20.003", "0.0011", "0.0020", "5.00"], "a": 0, "e": "1.0005 has 5. 20.003 also has 5 (all zeros are between non-zero digits). 0.0020 has 2, 5.00 has 3, and 0.0011 has 2.", "h": "Trapped zeros count."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4 text", "q": "Precision refers to:", "o": ["the number of decimal places that the instrument is able to display", "the size of the one-sided error present in a measurement", "the closeness of a measurement to the true or accepted value of the quantity", "the extent of reproducibility among replicate measurements of the same quantity"], "a": 3, "e": "Precision is how well repeat measurements agree with each other. Closeness to the true value is accuracy.", "h": "⚠ TRAP: precision = agreement among repeats; accuracy = agreement with truth."}, {"ch": 0, "k": "concept", "s": "Ch1 p.4 text", "q": "Accuracy refers to:", "o": ["the closeness of a measurement, or of the mean of several, to the true or accepted value", "the closeness of replicate measurements to one another, however far they are from the true value", "the number of significant figures that the measurement is quoted with after rounding", "the size of the smallest division that can be read on the measuring instrument"], "a": 0, "e": "Accuracy is closeness to the true or accepted value, and it applies to the mean of several readings too. Closeness of replicates to each other is precision.", "h": "Accuracy asks: close to the TRUE value?"}, {"ch": 0, "k": "trap", "s": "Ch1 p.5 text", "q": "In the archery analogy, arrows that land close together but far from the bull's-eye represent:", "o": ["good accuracy but poor precision", "good accuracy and good precision", "good precision but poor accuracy", "poor accuracy and poor precision"], "a": 2, "e": "Precision is how close together the arrows are; accuracy is how close each lands to the bull's-eye. Tight grouping away from the centre means precise but inaccurate.", "h": "Bull's-eye = true value. Cluster = precision."}, {"ch": 0, "k": "trap", "s": "Ch1 p.4-5 text (variant)", "q": "Three determinations by Student A are 10.1, 10.2, 10.1 and by Student B are 9.8, 10.3, 10.0. The true value is 10.00. Which statement is correct?", "o": ["B is more precise since it has the wider range of readings", "A is both more precise and more accurate than B", "A is more precise, but B's mean is closer to the true value", "B is more precise because its mean is exactly 10.0"], "a": 2, "e": "A: range 0.1, mean 10.133. B: range 0.5, mean 10.033. A's replicates agree better (precision), but B's mean is nearer 10.00 (accuracy). A wide range means poorer precision.", "h": "⚠ TRAP: judge precision by spread, accuracy by the mean vs the true value."}, {"ch": 0, "k": "trap", "s": "Ch1 p.5 text", "q": "Which statement about accuracy and precision is correct?", "o": ["A series of replicates can be very precise yet highly inaccurate", "Accuracy and precision mean the same thing in chemistry", "A precise series of replicates is always accurate as well", "Accuracy can be judged meaningfully even when the precision is poor"], "a": 0, "e": "Replicates can agree closely and still all be far from the true value. So high precision does not guarantee accuracy.", "h": "Precise ≠ accurate."}, {"ch": 0, "k": "concept", "s": "Ch1 p.5 text", "q": "It is quite meaningless to consider the accuracy of a series of values unless:", "o": ["the errors in the measurement are purely systematic in origin", "all the replicate values are exactly identical to each other", "the true value is exactly zero for the quantity being measured", "the precision is reasonably good"], "a": 3, "e": "Judging accuracy only makes sense when the replicates agree reasonably well. They do not have to be identical.", "h": "Check precision first, then accuracy."}, {"ch": 0, "k": "concept", "s": "Ch1 p.5 text", "q": "Which statement about error in measurements is correct?", "o": ["The only issue is whether error exists, not how large it is", "Careful scientists can remove error from a measurement completely", "Error is always present and can be minimised but not completely eliminated", "Error is present only when the instruments used are faulty"], "a": 2, "e": "The scientist is concerned not with whether error is present but with how much error and uncertainty exist. Error is always present and will not be completely eliminated.", "h": "Question is 'how much error?', never 'is there error?'"}, {"ch": 0, "k": "concept", "s": "Ch1 p.5 text", "q": "The absolute error in a measured quantity is:", "o": ["the number of significant figures present in the quantity", "the uncertainty in the quantity, with the same units as the quantity", "the true value minus the mean, expressed in per cent", "the uncertainty divided by the quantity itself, with no units"], "a": 1, "e": "Absolute error is the uncertainty in the same units as the quantity (0.002 m in 0.428 ± 0.002 m). Dividing by the quantity gives the relative error instead.", "h": "Absolute error carries units; relative error does not."}, {"ch": 0, "k": "trap", "s": "Ch1 p.5 text", "q": "The relative error (also called fractional error) is obtained by:", "o": ["dividing the quantity by the absolute error in it", "subtracting the absolute error from the quantity itself", "multiplying the absolute error by the quantity measured", "dividing the absolute error by the quantity itself"], "a": 3, "e": "Relative error = absolute error ÷ quantity. Inverting it, multiplying, or subtracting each give a different quantity with wrong units or meaning.", "h": "⚠ TRAP: error on TOP, quantity on the BOTTOM."}, {"ch": 0, "k": "concept", "s": "Ch1 p.5 text", "q": "Relative errors are:", "o": ["always larger than the absolute error of the quantity", "dimensionless", "measured in the same units as the quantity itself", "expressed in kelvin like the base quantities"], "a": 1, "e": "Relative error is absolute error ÷ quantity, so the units cancel. It is not always bigger than the absolute error, and kelvin has nothing to do with it.", "h": "Units cancel → no unit."}, {"ch": 0, "k": "concept", "s": "Ch1 p.5 text", "q": "To report a relative error as a percentage, one:", "o": ["multiplies the quantity by its fractional error", "divides the fractional error by 100", "multiplies the fractional error by 100", "multiplies the absolute error by 100 directly"], "a": 2, "e": "Percentage error = (absolute error ÷ quantity) × 100. Dividing by 100 would shrink it instead.", "h": "Fraction × 100 = per cent."}, {"ch": 0, "k": "trap", "s": "Ch1 p.5 text (variant)", "q": "A 0.1 g error occurs in weighing a 5 g sample and another 0.1 g error in a 50 g sample. Which statement is correct?", "o": ["The 5 g sample has the smaller relative error because its mass is the smaller of the two", "Both samples have the same relative error because the absolute error in each case is 0.1 g", "Both have the same absolute error, but the 5 g sample has the larger relative error", "The 50 g sample has the larger relative error because its mass is larger than the other"], "a": 2, "e": "Relative errors are 0.1/5 = 2 % and 0.1/50 = 0.2 %. The same absolute error hurts more on a smaller sample, like a 1 mm slip on a skate wheel versus a truck tyre.", "h": "⚠ TRAP: same absolute error ≠ same relative error."}, {"ch": 0, "k": "concept", "s": "Ch1 p.5 text", "q": "A 1 mm error in the diameter of a skate wheel is probably more serious than a 1 mm error in a truck tyre. This illustrates that:", "o": ["relative error is usually more significant than absolute error", "the two kinds of error are always equally significant", "absolute error is more significant than relative error in practice", "error depends only on the age of the instrument used"], "a": 0, "e": "Both errors have the same absolute size (1 mm), but the skate wheel is much smaller, so the relative error is far greater. That is why relative error is usually more informative.", "h": "Judge seriousness by relative error."}, {"ch": 0, "k": "trap", "s": "Ch1 p.6 text", "q": "Errors can be arbitrarily divided into two categories, called:", "o": ["systematic (indeterminate) and random (determinate) errors", "systematic (determinate) and random (indeterminate) errors", "absolute (determinate) and relative (indeterminate) errors", "precise (determinate) and accurate (indeterminate) errors"], "a": 1, "e": "Systematic errors are determinate; random errors are indeterminate. Absolute/relative describe how an error is expressed, not its cause.", "h": "Systematic = determinate; random = indeterminate."}, {"ch": 0, "k": "concept", "s": "Ch1 p.6 text (underlined)", "q": "Systematic errors are best described as:", "o": ["one-sided errors which can be traced to a specific source", "two-sided errors that scatter about the true value and have no source", "errors that vary unpredictably in both size and direction", "errors that affect only the precision and never the accuracy"], "a": 0, "e": "Systematic errors are one-sided and can be traced to a source in the method or the apparatus. Scatter in both directions is random error.", "h": "Systematic = one-sided + traceable."}, {"ch": 0, "k": "trap", "s": "Ch1 p.6 text", "q": "An analytical balance consistently reads 0.05 g higher than the true mass. This is an example of:", "o": ["a random error, because it can be removed by averaging many readings", "a random error, because the balance is an instrument that gives scatter", "a systematic error, because it is one-sided and linked to instrument calibration", "a relative error, because the offset is stated in grams and not in per cent"], "a": 2, "e": "A constant, one-sided offset points to calibration. Averaging repeats does not remove it, and absolute/relative are ways of expressing error, not its type.", "h": "⚠ TRAP: averaging fixes random error, not systematic."}, {"ch": 0, "k": "concept", "s": "Ch1 p.7 text", "q": "Which of the following is a typical effect of systematic errors?", "o": ["They tend to make observed or calculated values consistently too high or too low", "They affect the precision of the results more than the accuracy", "They are eliminated completely by repeating the experiment many times", "They make replicate values scatter randomly on both sides of the true value"], "a": 0, "e": "Systematic errors push the values consistently too high or too low. Results become inaccurate while replicates still agree, and repeating does not reduce them.", "h": "Consistent bias → accuracy suffers."}, {"ch": 0, "k": "trap", "s": "Ch1 p.7 text", "q": "A systematic error in an experiment affects mainly the:", "o": ["precision of the results, with little effect on accuracy", "precision and accuracy equally in all cases", "accuracy of the results, with little effect on the precision of replicates", "number of significant figures only"], "a": 2, "e": "A systematic error can leave results highly inaccurate while replicates stay close together but away from the true value. So precision is hardly touched.", "h": "⚠ TRAP: systematic → inaccurate yet still precise."}, {"ch": 0, "k": "concept", "s": "Ch1 p.6 text", "q": "Which of the following is NOT one of the three courses a systematic error may follow?", "o": ["It may disappear completely when the experiment is repeated", "It may persist as a random error", "Its magnitude may vary systematically with the experimental conditions", "It may remain relatively constant, independent of the experimental conditions"], "a": 0, "e": "The three courses are: (a) constant and independent of conditions, (b) varies systematically with conditions, (c) may persist as a random error. Disappearing on repetition is not listed.", "h": "Three courses: constant, systematic variation, random."}, {"ch": 0, "k": "concept", "s": "Ch1 p.6 text", "q": "If the error in a measurement proves to be constant in magnitude, you should consider:", "o": ["possibilities such as instrument calibration", "that no source of error exists in the method used", "the number of decimal places that appear in the answer", "only random fluctuations in the room temperature during the work"], "a": 0, "e": "A constant error suggests an instrumental cause such as calibration. If the error varies systematically, the parameter linked to the variation often indicates the cause.", "h": "Constant error → check calibration."}, {"ch": 0, "k": "concept", "s": "Ch1 p.6-7 text", "q": "Atmospheric humidity causes an apparently random error because a chemical absorbs water during the experiment. This shows that:", "o": ["the chemical must have been impure, so the error is relative and not systematic", "humidity produces a true random error that no control could remove", "a systematic error can never be traced back to a changing experimental condition", "an apparently random error may really be systematic, linked to an uncontrolled condition"], "a": 3, "e": "A humidity change means a chemical is absorbing water, so the 'random' error has a real cause you did not control. That makes it systematic.", "h": "Seemingly random can hide a systematic cause."}, {"ch": 0, "k": "trap", "s": "Ch1 p.7 text", "q": "How can the danger of retaining unrecognised one-sided errors be minimised?", "o": ["By varying at least some experimental factors in replicate experiments", "By reporting more significant figures in the final answer", "By repeating exactly the same procedure a great many times over", "By avoiding any estimate of the size of the residual error"], "a": 0, "e": "Repeating the same procedure repeats the same bias. Varying experimental factors in replicates helps expose one-sided errors.", "h": "⚠ TRAP: identical repeats hide systematic error."}, {"ch": 0, "k": "concept", "s": "Ch1 p.7 text", "q": "In critical analyses, duplicate sets of samples should be analysed by entirely different methods because:", "o": ["random errors cannot occur in procedures that use different methods", "different methods remove the need for any replicate analysis at all", "the same systematic errors are unlikely to show up to the same extent in different procedures", "different methods always give identical results, which confirms the first method was right"], "a": 2, "e": "Different methods are unlikely to share the same systematic errors to the same extent, so agreement between them gives confidence in the accuracy.", "h": "Two independent methods guard against systematic error."}, {"ch": 0, "k": "concept", "s": "Ch1 p.6 text", "q": "When the origin of a systematic error is understood, it is often possible to:", "o": ["ignore it completely, because it behaves like a random error", "convert it into a relative error without any further work", "remove it only by increasing the number of replicate analyses", "deduce a correction factor that can be applied to the final result"], "a": 3, "e": "Once you know where a systematic error comes from, you can usually work out a correction factor, or at least estimate what error is left.", "h": "Known bias → apply a correction."}, {"ch": 0, "k": "concept", "s": "Ch1 p.7 text", "q": "Which statement about random errors is correct?", "o": ["They are always one-sided, making results too high", "Their cause may or may not be known", "They can be traced to a single fixed source in the method", "Their cause is always known before the experiment begins"], "a": 1, "e": "Random errors may have a known cause or not. They are not one-sided and they do not trace back to one fixed source.", "h": "Random = cause may be unknown."}, {"ch": 0, "k": "concept", "s": "Ch1 p.7 text", "q": "A student judges when a container is filled exactly to a calibration mark, and the judgement varies slightly each time. This is an example of:", "o": ["a relative error, since the volume read changes slightly each time", "random error, since personal judgment is required in the measurement", "a systematic error, since the same calibration mark is used every time", "an absolute error, since the calibration mark carries a unit of volume"], "a": 1, "e": "Reading a dial or judging when a container is exactly at the mark depends on personal judgement, and that varies from reading to reading, so it is random error.", "h": "Judgement calls → random error."}, {"ch": 0, "k": "concept", "s": "Ch1 p.7 text", "q": "Which of the following is a source of random error arising within the method itself?", "o": ["Impurity of a supposedly pure material", "A wrongly labelled unit printed on the ruler being used", "A flask calibrated at a different temperature from the one in use", "A balance that is miscalibrated by a fixed amount in grams"], "a": 0, "e": "Impurity of a supposedly pure material, and variations in stirring or mixing speed, are random errors inside the method. A fixed miscalibration would be systematic.", "h": "Method-level random errors: impurity, stirring, mixing speed."}, {"ch": 0, "k": "concept", "s": "Ch1 p.7 text", "q": "Random variations in room temperature introduce which type of error into analytical results?", "o": ["relative error only, because temperature is stated in kelvin", "systematic error that always pushes the results one way", "random error", "no error at all, since temperature is a physical constant"], "a": 2, "e": "Random changes in room temperature and other surroundings add random error to results.", "h": "Fluctuating surroundings → random."}, {"ch": 1, "k": "example", "s": "Ch2 p.11 Millikan", "q": "The charge on an electron is 1.6 × 10⁻¹⁹ C and its mass is 9.1 × 10⁻²⁸ g. The charge-to-mass ratio in C/g is:", "o": ["1.76 × 10¹¹ C/g", "1.76 × 10⁸ C/g", "5.69 × 10⁻⁹ C/g", "1.46 × 10⁻⁴⁶ C/g"], "a": 1, "e": "e/m = 1.6 × 10⁻¹⁹ ÷ 9.1 × 10⁻²⁸ = 1.76 × 10⁸ C/g. Inverting gives 5.69 × 10⁻⁹; multiplying gives 1.46 × 10⁻⁴⁶; 1.76 × 10¹¹ is the value in C/kg, not C/g.", "h": "⚠ TRAP: grams vs kilograms changes the answer by 10³."}, {"ch": 1, "k": "example", "s": "Ch2 p.12 Millikan", "q": "An oil drop carries a total charge of 4.8 × 10⁻¹⁹ C. How many excess electrons does it carry?", "o": ["5", "4", "2", "3"], "a": 3, "e": "4.8 × 10⁻¹⁹ ÷ 1.6 × 10⁻¹⁹ = 3. The answer must be a whole number.", "h": "Total charge ÷ 1.6 × 10⁻¹⁹ = number of electrons."}, {"ch": 1, "k": "example", "s": "Ch2 p.12 Millikan", "q": "What is the total charge on 7 electrons?", "o": ["2.29 × 10⁻²⁰ C", "1.12 × 10⁻¹⁹ C", "1.12 × 10⁻¹⁷ C", "1.12 × 10⁻¹⁸ C"], "a": 3, "e": "7 × 1.6 × 10⁻¹⁹ = 1.12 × 10⁻¹⁸ C. Dividing 1.6 by 7 gives 2.29 × 10⁻²⁰, and the others are power-of-ten slips.", "h": "Count × 1.6 × 10⁻¹⁹."}, {"ch": 1, "k": "example", "s": "Ch2 p.14 Fig 5", "q": "In the instrument shown, the sample passes through the stages in which order?", "o": ["Acceleration → ionisation → deflection → detection", "Ionisation → deflection → acceleration → detection", "Ionisation → acceleration → deflection → detection", "Detection → deflection → acceleration → ionisation"], "a": 2, "e": "The vaporised sample is first ionised, the ions are accelerated, bent by the electromagnet, and finally detected and recorded.", "h": "I-A-D-D: Ionise, Accelerate, Deflect, Detect.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAIVApEDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAEFAgQGAwf/xABWEAACAgECBAMEBQcHBgoJBQAAA m⁻¹, the wavelength of the FIRST line of the Balmer series (n = 3) is:", "o": ["365 nm", "656 nm", "1.52 × 10⁶ nm", "486 nm"], "a": 1, "e": "1/λ = 1.097 × 10⁷ × (1/4 − 1/9) = 1.524 × 10⁶ m⁻¹, so λ = 6.56 × 10⁻⁷ m = 656 nm. 486 nm is the second line, 365 nm the series limit.", "h": "First Balmer line = red, 656 nm."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.19 Exercise b", "q": "Using the same equation and R = 1.097 × 10⁷ m⁻¹, the SECOND line of the Balmer series (n = 4) has a wavelength of:", "o": ["486 nm", "2.06 × 10⁶ nm", "656 nm", "434 nm"], "a": 0, "e": "1/λ = 1.097 × 10⁷ × (1/4 − 1/16) = 2.057 × 10⁶ m⁻¹, so λ = 486 nm. 656 nm is the first line and 434 nm the third.", "h": "Balmer: 656, 486, 434, 410."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.19 Exercise c", "q": "The first line of the Lyman series (n = 2 → 1) has a wavelength of (R = 1.097 × 10⁷ m⁻¹):", "o": ["656 nm", "102.6 nm", "121.5 nm", "91.2 nm"], "a": 2, "e": "1/λ = 1.097 × 10⁷ × (1 − 1/4) = 8.23 × 10⁶ m⁻¹, so λ = 1.215 × 10⁻⁷ m = 121.5 nm. 102.6 nm is the second line and 91.2 nm the limit.", "h": "Lyman starts at 121.5 nm (UV)."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.19 Exercise c", "q": "The second line of the Lyman series (n = 3 → 1) has a wavelength of (R = 1.097 × 10⁷ m⁻¹):", "o": ["121.5 nm", "97.2 nm", "486 nm", "102.6 nm"], "a": 3, "e": "1/λ = 1.097 × 10⁷ × (1 − 1/9) = 9.75 × 10⁶ m⁻¹, so λ = 102.6 nm. 121.5 is the first line, 97.2 the third.", "h": "Bigger jump, shorter wavelength."}, {"ch": 1, "k": "example", "s": "Ch2 p.16 Bohr", "q": "If the energy of the electron in the first orbit is E₁, the energy in the second orbit is:", "o": ["2E₁", "E₁/4", "E₁/2", "4E₁"], "a": 1, "e": "Eₙ = E₁/n², so E₂ = E₁/4. It is a smaller negative number, which means higher energy.", "h": "⚠ TRAP: it is n², not n."}, {"ch": 1, "k": "example", "s": "Ch2 p.16 Bohr", "q": "Which Bohr orbit has an energy of −Rch/9?", "o": ["The first orbit (n = 1)", "The third orbit (n = 3)", "The second orbit (n = 2)", "The fourth orbit (n = 4)"], "a": 1, "e": "Eₙ = −Rch/n², and 9 = 3². So n = 3.", "h": "n² in the denominator tells you the orbit."}, {"ch": 1, "k": "example", "s": "Ch2 p.17 Example", "q": "For hydrogen, which relationship between energy changes is correct?", "o": ["ΔE(3→1) = ΔE(3→2) + ΔE(2→1)", "ΔE(3→1) = ΔE(3→2) × ΔE(2→1)", "ΔE(3→1) = ΔE(2→1) − ΔE(3→2)", "ΔE(3→1) = ΔE(3→2) − ΔE(2→1)"], "a": 0, "e": "The two steps 3→2 and 2→1 add up to the full jump 3→1. The book works it by adding, even though its heading prints a minus sign.", "h": "Energies add over steps."}, {"ch": 1, "k": "example", "s": "Ch2 p.17 Example", "q": "Let K = Rch. The energy change for the jump n = 2 → n = 1 is K(1 − 1/4) and for n = 3 → n = 2 is K(1/4 − 1/9). The energy change for n = 3 → n = 1 is therefore:", "o": ["8K/9", "3K/4", "2K/3", "5K/36"], "a": 0, "e": "3K/4 + 5K/36 = 27K/36 + 5K/36 = 32K/36 = 8K/9. Same as K(1 − 1/9).", "h": "Add the steps or use 1 − 1/9 directly."}, {"ch": 1, "k": "example", "s": "Ch2 p.17 Bohr", "q": "What is the maximum number of electrons in the M shell (n = 3)?", "o": ["32", "18", "9", "8"], "a": 1, "e": "2n² = 2 × 3² = 18. The value 9 is n², which is the number of orbitals in that shell.", "h": "⚠ TRAP: n² orbitals, 2n² electrons."}, {"ch": 1, "k": "example", "s": "Ch2 p.17 Bohr", "q": "What is the maximum number of electrons in the N shell (n = 4)?", "o": ["32", "18", "16", "8"], "a": 0, "e": "2n² = 2 × 16 = 32. 16 is the number of orbitals.", "h": "N = 32."}, {"ch": 1, "k": "example", "s": "Ch2 p.18-19 Example", "q": "A body of mass 0.23 mg moves with a wavelength of 1.45 × 10⁻²⁵ m. Using ν = h/mλ with h = 6.63 × 10⁻³⁴ J s, the value of ν is:", "o": ["1.99 × 10⁻⁵", "1.99 × 10⁻²", "2.88 × 10⁻²⁷", "1.99 × 10¹"], "a": 1, "e": "Convert 0.23 mg to 2.3 × 10⁻⁷ kg. ν = 6.63 × 10⁻³⁴ ÷ (2.3 × 10⁻⁷ × 1.45 × 10⁻²⁵) = 1.99 × 10⁻² (the book gets 1.988 × 10⁻²). Wrong mg→kg conversions give the other powers of ten.", "h": "⚠ TRAP: mg → kg is × 10⁻⁶."}, {"ch": 1, "k": "example", "s": "Ch2 p.18-19 Example", "q": "A body of mass 0.50 mg has a wavelength of 2.0 × 10⁻²⁵ m. Using ν = h/mλ with h = 6.63 × 10⁻³⁴ J s, ν is:", "o": ["6.63 × 10⁻³", "1.33 × 10⁻²⁷", "6.63 × 10⁻⁶", "6.63 × 10⁰"], "a": 0, "e": "0.50 mg = 5.0 × 10⁻⁷ kg. ν = 6.63 × 10⁻³⁴ ÷ (5.0 × 10⁻⁷ × 2.0 × 10⁻²⁵) = 6.63 × 10⁻³. Leaving out λ gives 1.33 × 10⁻²⁷.", "h": "Mass in kg first."}, {"ch": 1, "k": "example", "s": "Ch2 p.18-19 Example", "q": "A body of mass 0.80 mg has a wavelength of 3.2 × 10⁻²⁶ m. Using ν = h/mλ with h = 6.63 × 10⁻³⁴ J s, ν is:", "o": ["2.59 × 10⁻²", "2.59 × 10¹", "8.29 × 10⁻²⁸", "2.59 × 10⁻⁵"], "a": 0, "e": "0.80 mg = 8.0 × 10⁻⁷ kg. ν = 6.63 × 10⁻³⁴ ÷ (8.0 × 10⁻⁷ × 3.2 × 10⁻²⁶) = 2.59 × 10⁻².", "h": "Same method, new numbers."}, {"ch": 1, "k": "example", "s": "Ch2 p.19 levels", "q": "Adding the capacity of the s, p and d subshells gives the maximum number of electrons in the third shell, which is:", "o": ["32", "14", "10", "18"], "a": 3, "e": "2 + 6 + 10 = 18, which agrees with 2n² for n = 3.", "h": "3rd shell: 2 + 6 + 10."}, {"ch": 1, "k": "example", "s": "Ch2 p.20 config", "q": "Which is the correct electron configuration of argon (Z = 18)?", "o": ["1s² 2s² 2p⁶ 3s² 3p⁶", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s²", "1s² 2s² 2p⁶ 3s² 3d⁶", "1s² 2s² 2p⁶ 3s² 3p⁴"], "a": 0, "e": "Fill in order: 1s, 2s, 2p, 3s, 3p. That uses 2 + 2 + 6 + 2 + 6 = 18 electrons. Adding 4s² would be 20 (calcium).", "h": "Count the electrons: total must equal Z."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.20 Exercise 1", "q": "The book asks for the electronic configuration of an element M \"whose atomic mass is 17\". Reading this as atomic NUMBER 17, the configuration is:", "o": ["1s² 2s² 2p⁶ 3s² 3p³", "1s² 2s² 2p⁶ 3s² 3p⁵", "1s² 2s² 2p⁶ 3s¹ 3p⁶", "1s² 2s² 2p⁶ 3s² 3p⁶"], "a": 1, "e": "Configurations depend on the number of electrons, which is the atomic number, not the atomic mass. Z = 17 is chlorine, with 7 electrons in its outer shell.", "h": "⚠ TRAP: electrons = atomic NUMBER, never mass."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.20 Exercise 2", "q": "What is the electron configuration of the K⁺ ion (Z = 19)?", "o": ["1s² 2s² 2p⁶ 3s² 3p⁶ 4s²", "1s² 2s² 2p⁶ 3s² 3p⁶", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹", "1s² 2s² 2p⁶ 3s² 3p⁵"], "a": 1, "e": "A positive ion has lost electrons. K⁺ has 18 electrons, the same as argon. The 4s electron is the one that goes.", "h": "Positive ion: take electrons from the outermost shell."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.20 Exercise 2", "q": "What is the electron configuration of the Ca²⁺ ion (Z = 20)?", "o": ["1s² 2s² 2p⁶ 3s² 3p⁶ 4s²", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹", "1s² 2s² 2p⁶ 3s² 3p⁴", "1s² 2s² 2p⁶ 3s² 3p⁶"], "a": 3, "e": "Ca has 20 electrons. Losing two 4s electrons leaves 18, the argon configuration.", "h": "Ca²⁺ = Ar."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.20 Exercise 2", "q": "What is the electron configuration of the Al³⁺ ion (Z = 13)?", "o": ["1s² 2s² 2p⁶ 3s²", "1s² 2s² 2p⁶ 3s¹", "1s² 2s² 2p⁶ 3s² 3p¹", "1s² 2s² 2p⁶"], "a": 3, "e": "Al has 13 electrons. Losing three leaves 10, the neon configuration. The three lost are 3p¹ and 3s².", "h": "Al³⁺ = Ne."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.20 Exercise 3", "q": "What is the electron configuration of the Cl⁻ ion (Z = 17)?", "o": ["1s² 2s² 2p⁶ 3s² 3p⁶", "1s² 2s² 2p⁶ 3s¹ 3p⁶", "1s² 2s² 2p⁶ 3s² 3p⁴", "1s² 2s² 2p⁶ 3s² 3p⁵"], "a": 0, "e": "A negative ion has gained electrons. Cl has 17, so Cl⁻ has 18, the same as argon.", "h": "Cl⁻ = Ar."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.20 Exercise 3", "q": "What is the electron configuration of the F⁻ ion (Z = 9)?", "o": ["1s² 2s² 2p⁶", "1s² 2s² 2p⁴", "1s² 2s² 2p⁶ 3s¹", "1s² 2s² 2p⁵"], "a": 0, "e": "F has 9 electrons; gaining one gives 10, the neon configuration.", "h": "F⁻ = Ne."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.20 Exercise 3", "q": "What is the electron configuration of the O²⁻ ion (Z = 8)?", "o": ["1s² 2s² 2p⁶ 3s²", "1s² 2s² 2p⁴", "1s² 2s² 2p⁶", "1s² 2s² 2p⁵"], "a": 2, "e": "O has 8 electrons. Gaining two gives 10, the neon configuration.", "h": "O²⁻ = Ne."}, {"ch": 1, "k": "exercise", "s": "Ch2 p.20 Exercise 3", "q": "How many electrons are in a bromide ion, Br⁻ (Br: Z = 35)?", "o": ["34", "36", "35", "37"], "a": 1, "e": "Br has 35 electrons and gains one to form Br⁻, giving 36 (the krypton configuration).", "h": "Negative ion: add electrons to Z."}, {"ch": 1, "k": "example", "s": "Ch2 p.20 Exercise 2", "q": "How many electrons are in a Ca²⁺ ion (Z = 20)?", "o": ["18", "20", "22", "2"], "a": 0, "e": "Ca²⁺ has lost two electrons from the 20 in the neutral atom, so 20 − 2 = 18.", "h": "Charge tells you the change: + loses, − gains."}, {"ch": 1, "k": "example", "s": "Ch2 p.21 noble gas", "q": "Which is the noble gas (shorthand) notation for magnesium (Z = 12)?", "o": ["[He] 3s²", "[Ar] 3s²", "[Ne] 3s²", "[Ne] 3s¹"], "a": 2, "e": "Mg = 1s² 2s² 2p⁶ 3s². The first ten electrons are the neon core, leaving 3s².", "h": "Core = the noble gas just before the element."}, {"ch": 1, "k": "example", "s": "Ch2 p.21 noble gas", "q": "Which is the noble gas notation for fluorine (Z = 9)?", "o": ["[He] 2p⁵", "[He] 2s² 2p⁵", "[Ne] 2s² 2p⁵", "[He] 2s² 2p⁶"], "a": 1, "e": "F = 1s² 2s² 2p⁵. Replace 1s² with [He] to get [He] 2s² 2p⁵.", "h": "Write the core, then everything after it."}, {"ch": 1, "k": "example", "s": "Ch2 p.21 noble gas", "q": "The noble gas notation for potassium (Z = 19) is:", "o": ["[Ne] 4s¹", "[Ar] 4s¹", "[Ar] 3d¹", "[Kr] 4s¹"], "a": 1, "e": "Argon accounts for the first 18 electrons, and the 19th goes into 4s.", "h": "K = [Ar]4s¹."}, {"ch": 1, "k": "example", "s": "Ch2 p.22 valence", "q": "How many valence electrons does calcium (Z = 20) have?", "o": ["1", "10", "2", "8"], "a": 2, "e": "Ca = [Ar] 4s², so two outer electrons.", "h": "Same as the group number for main groups."}, {"ch": 1, "k": "example", "s": "Ch2 p.23 table", "q": "Using the shell table, how are the electrons of phosphorus (Z = 15) arranged in the K, L and M shells?", "o": ["2, 7, 6", "2, 8, 8", "2, 5, 8", "2, 8, 5"], "a": 3, "e": "K takes 2, L takes 8, and the remaining 5 go into M.", "h": "Fill K, L, M in order: 2, 8, then the rest."}, {"ch": 1, "k": "example", "s": "Ch2 p.23 table", "q": "From the shell table, calcium (Z = 20) has its electrons arranged in the K, L, M and N shells as:", "o": ["2, 8, 8, 2", "2, 8, 10", "2, 8, 18, 2", "2, 8, 9, 1"], "a": 0, "e": "M stops at 8 for Ar, K and Ca, so the last two electrons go into the N shell.", "h": "Ar, K, Ca: M holds only 8 here."}, {"ch": 1, "k": "example", "s": "Ch2 p.21 box", "q": "How many unpaired electrons does a nitrogen atom (1s² 2s² 2p³) have?", "o": ["1", "0", "3", "2"], "a": 2, "e": "The three 2p electrons go into the three 2p orbitals one each (Hund's rule), so all three are unpaired.", "h": "N = 3 unpaired."}, {"ch": 1, "k": "example", "s": "Ch2 p.21 box", "q": "How many unpaired electrons does an oxygen atom (1s² 2s² 2p⁴) have?", "o": ["4", "3", "0", "2"], "a": 3, "e": "The 4th electron pairs up with one in 2p, leaving two orbitals singly occupied.", "h": "O = 2 unpaired."}, {"ch": 1, "k": "example", "s": "Ch2 p.21 box", "q": "How many unpaired electrons does fluorine (1s² 2s² 2p⁵) have?", "o": ["1", "5", "0", "2"], "a": 0, "e": "In 2p⁵, two orbitals are full and one has a single electron.", "h": "F = 1 unpaired."}, {"ch": 1, "k": "example", "s": "Ch2 p.20 quantum", "q": "For n = 3, the allowed values of the azimuthal quantum number l are:", "o": ["0, 1, 2 and 3", "1, 2 and 3", "−2, −1, 0, 1 and 2", "0, 1 and 2"], "a": 3, "e": "l runs from 0 to n − 1, so 0, 1 and 2 (the 3s, 3p and 3d subshells).", "h": "l = 0 to n − 1."}, {"ch": 1, "k": "example", "s": "Ch2 p.20 quantum", "q": "How many orbitals are in the third shell (n = 3)?", "o": ["6", "9", "3", "18"], "a": 1, "e": "The number of orbitals in a shell is n², which is 9. They hold up to 18 electrons.", "h": "Orbitals n², electrons 2n²."}, {"ch": 1, "k": "example", "s": "Ch2 p.23 Döbereiner", "q": "Which of these is one of Döbereiner's triads?", "o": ["Lithium, beryllium, boron", "Carbon, nitrogen, oxygen", "Calcium, strontium, barium", "Sodium, magnesium, aluminium"], "a": 2, "e": "His triads were Cl–Br–I, S–Se–Te, Ca–Sr–Ba and Li–Na–K. Each is a group down the table, not a row across it.", "h": "Triads go down a group."}, {"ch": 1, "k": "example", "s": "Ch2 p.23 Döbereiner", "q": "Taking Cl = 35.5 and I = 126.9, the triad rule predicts the atomic weight of bromine to be about:", "o": ["81.2", "67.1", "162.4", "45.7"], "a": 0, "e": "Average of the outer two: (35.5 + 126.9) ÷ 2 = 81.2. The real value is close to 79.9.", "h": "Middle = (first + third) ÷ 2."}, {"ch": 1, "k": "example", "s": "Ch2 p.23 Döbereiner", "q": "Taking Ca = 40.1 and Ba = 137.3, the triad rule predicts the atomic weight of strontium to be about:", "o": ["74.2", "177.4", "48.6", "88.7"], "a": 3, "e": "(40.1 + 137.3) ÷ 2 = 88.7. The real value, 87.6, is close.", "h": "Add the outer two, halve."}, {"ch": 1, "k": "example", "s": "Ch2 p.30 Example 1", "q": "Which of Li, K and Ti has the largest atomic radius?", "o": ["Li and Ti are equal", "K", "Li", "Ti"], "a": 1, "e": "Potassium has four shells, so it is the biggest by far. The book's answer lists Ti last, which does not fit real atomic radii.", "h": "Look for the most shells."}, {"ch": 1, "k": "example", "s": "Ch2 p.30 Example 1", "q": "Which of Be, Mg and Zn has the largest atomic radius?", "o": ["Zn", "All three are equal", "Mg", "Be"], "a": 2, "e": "Mg has three shells and Be only two, so Mg > Be. Zn is smaller than Mg because its extra protons pull the electrons in. The book's key puts Zn last, which does not match real data.", "h": "⚠ TRAP: Zn is smaller than Mg."}, {"ch": 1, "k": "example", "s": "Ch2 p.28 ionisation", "q": "Which of Li, Na and K has the highest first ionisation energy?", "o": ["All are equal", "Li", "K", "Na"], "a": 1, "e": "Li is the smallest atom in the group, so its outer electron is held most tightly.", "h": "Up the group = higher IE."}, {"ch": 1, "k": "example", "s": "Ch2 p.30 Example 2", "q": "Arrange N, O and Be in decreasing order of first ionisation energy.", "o": ["N > O > Be", "O > N > Be", "Be > N > O", "N > Be > O"], "a": 0, "e": "N has a half-filled 2p³ subshell, which makes it more stable and harder to ionise than O. Be has the lowest value here. The book writes the order as O, N, Be, but N is higher than O.", "h": "⚠ TRAP: N beats O because 2p³ is half-filled."}, {"ch": 1, "k": "example", "s": "Ch2 p.30 Example 2", "q": "Arrange Mg, Al and Na in decreasing order of first ionisation energy.", "o": ["Mg > Na > Al", "Na > Mg > Al", "Mg > Al > Na", "Al > Mg > Na"], "a": 2, "e": "Na is lowest because it has just one outer electron. Mg is higher than Al because Al's outer electron is in 3p, which is easier to remove than Mg's 3s pair.", "h": "Mg > Al, a famous dip."}, {"ch": 1, "k": "example", "s": "Ch2 p.29 ionic radius", "q": "Which is larger, the Na⁺ ion or the K⁺ ion?", "o": ["They are the same size", "K⁺", "Cannot be compared", "Na⁺"], "a": 1, "e": "Similarly charged ions increase in size down a group. K⁺ has one more shell.", "h": "Down the group, ions get bigger."}, {"ch": 1, "k": "example", "s": "Ch2 p.29 ionic radius", "q": "Which of the ions Na⁺, Mg²⁺ and Al³⁺ has the smallest radius?", "o": ["Na⁺", "Al³⁺", "Mg²⁺", "They are the same size"], "a": 1, "e": "All three have 10 electrons, but Al³⁺ has the most protons (13) pulling them in. Positive ions shrink from left to right in a period.", "h": "Same electrons, more protons = smaller."}, {"ch": 1, "k": "example", "s": "Ch2 p.30 EN", "q": "Which is more electronegative, sodium or chlorine?", "o": ["Chlorine", "Neither has electronegativity", "They are equal", "Sodium"], "a": 0, "e": "Cl is far to the right of Na in the same period, so its nuclear charge pulls shared electrons harder.", "h": "Right of the same period wins."}, {"ch": 1, "k": "concept", "s": "Ch2 p.8 text", "q": "Which early Greek philosopher believed that the universe is made of matter and that matter is made up of atoms?", "o": ["Empedocles", "Aristotle", "Democritus", "Thales"], "a": 2, "e": "Democritus is the one the book names. He saw the atom as a tiny, solid, indivisible object, and he reasoned this out with logic, not experiment.", "h": "Democritus = \"D\" for Dalton's grandfather idea: atoms."}, {"ch": 1, "k": "concept", "s": "Ch2 p.8 text", "q": "Democritus' picture of the atom was that it is:", "o": ["a tiny, indivisible, solid object", "a nucleus surrounded by orbiting electrons", "a positive sphere with electrons inside it", "a wave spread around a central nucleus"], "a": 0, "e": "That was the earliest idea: a hard little particle that cannot be cut. The other three pictures came much later (Thomson, Rutherford/Bohr, wave mechanics).", "h": "Oldest model = solid ball. Each new model added a part."}, {"ch": 1, "k": "concept", "s": "Ch2 p.8 Dalton", "q": "Dalton's atomic theory is regarded as important because it was the first scientific theory to relate:", "o": ["the position of an element to its atomic number", "the charge on the electron to the mass of the electron", "chemical changes to the structure, properties and behaviour of the atom", "the colours of flames to the energy of electrons"], "a": 2, "e": "Dalton connected what happens in a reaction to what atoms do. Flame colours, e/m and atomic number all came later.", "h": "Dalton = chemistry explained by atoms."}, {"ch": 1, "k": "trap", "s": "Ch2 p.8 Dalton", "q": "According to Dalton, during a chemical reaction atoms are:", "o": ["created from energy as the products form", "destroyed at the reactants and rebuilt from nothing", "rearranged, but not broken apart, created or destroyed", "broken into protons and electrons then rejoined"], "a": 2, "e": "Atoms only change partners. That is why a balanced equation has the same atoms on both sides.", "h": "Reaction = swapping partners, not making or killing atoms."}, {"ch": 1, "k": "trap", "s": "Ch2 p.8 Dalton", "q": "Which part of Dalton's theory was shown to be wrong by J. J. Thomson's discovery of the electron?", "o": ["Atoms are rearranged during a reaction", "Atoms are indivisible", "Atoms combine to form compounds", "Atoms of one element are identical"], "a": 1, "e": "Thomson found a particle smaller than the atom, so the atom is not indivisible. The other postulates were not what his experiment attacked.", "h": "⚠ TRAP: electron found = \"indivisible\" dies."}, {"ch": 1, "k": "concept", "s": "Ch2 p.8 Dalton", "q": "Dalton said that atoms of different elements differ in:", "o": ["whether they can form compounds", "number of nuclei only", "mass and other properties", "the charge on the nucleus only"], "a": 2, "e": "Atoms of one element are alike; atoms of different elements differ in mass and other properties.", "h": "Same element = same atom; different element = different mass."}, {"ch": 1, "k": "concept", "s": "Ch2 p.8 Dalton", "q": "In a given compound, Dalton said the different types of atoms are always present in:", "o": ["the same relative numbers", "equal numbers of each type", "numbers that change with the sample size", "any ratio that the chemist chooses"], "a": 0, "e": "That is the law of constant composition: water always has H and O in the same fixed ratio.", "h": "Compound = fixed recipe."}, {"ch": 1, "k": "concept", "s": "Ch2 p.9 Faraday", "q": "Who gave the first evidence that electric charge is not continuous but exists as discrete particles?", "o": ["Michael Faraday", "Robert Millikan", "J. J. Thomson", "Ernest Rutherford"], "a": 0, "e": "Faraday's electrolysis showed the electricity needed to deposit one mole of a monovalent atom is always the same, which suggested charge comes in fixed packets.", "h": "Faraday first hinted; Thomson found; Millikan measured."}, {"ch": 1, "k": "concept", "s": "Ch2 p.9 Faraday", "q": "Compared with depositing 1 mole of a monovalent element, depositing 1 mole of a divalent element needs:", "o": ["four times as much electricity", "half as much electricity", "the same amount of electricity", "twice as much electricity"], "a": 3, "e": "Each divalent atom takes two units of charge, so the quantity is a whole-number multiple of the monovalent one.", "h": "Charge comes in whole-number multiples."}, {"ch": 1, "k": "concept", "s": "Ch2 p.9 Faraday", "q": "In the cathode-ray experiments of the late 19th century, a high voltage was applied across a gas at:", "o": ["low pressure, and a stream of particles moved from the cathode to the anode", "low pressure, and a stream moved from the anode to the cathode", "high pressure, and a stream moved from the cathode to the anode", "high pressure, and a stream moved from the anode to the cathode"], "a": 0, "e": "The glow was seen at low pressure, and the rays travel from the negative plate (cathode) to the positive plate (anode).", "h": "Cathode rays leave the cathode."}, {"ch": 1, "k": "concept", "s": "Ch2 p.9 Faraday", "q": "Which scientists are named in the book as having carried out the late 19th-century cathode-ray tube experiments?", "o": ["Rutherford and Moseley", "Dalton and Mendeleev", "Crookes and Goldstein", "Bohr and Planck"], "a": 2, "e": "The book credits experiments of this kind to scientists like Crookes and Goldstein.", "h": "Crookes tube = cathode rays."}, {"ch": 1, "k": "concept", "s": "Ch2 p.10 Thomson", "q": "J. J. Thomson's cathode-ray experiments were carried out in:", "o": ["1897", "1864", "1829", "1869"], "a": 0, "e": "1897. The other dates belong to Döbereiner (1829), Newlands (1864) and Mendeleev (1869).", "h": "1897 = electron."}, {"ch": 1, "k": "concept", "s": "Ch2 p.10 Thomson", "q": "By deflecting the beam with a magnetic field and then bringing it back with an electric field, Thomson was able to determine the:", "o": ["mass of the proton", "charge-to-mass ratio (e/m) of the electron", "number of electrons in an atom", "charge on the neutron"], "a": 1, "e": "Balancing the two fields gave him e/m. He could not get e or m separately; Millikan supplied e later.", "h": "Thomson = e/m."}, {"ch": 1, "k": "trap", "s": "Ch2 p.11 Thomson", "q": "The charge-to-mass ratio of the cathode-ray particles was found to be:", "o": ["different for each cathode material, about 1.6 × 10⁻¹⁹ C/g", "different for each cathode material, about 1.76 × 10⁸ C/g", "the same whatever the cathode material, about 1.76 × 10⁸ C/g", "the same whatever the cathode material, about 1.76 × 10⁻⁸ C/g"], "a": 2, "e": "Since e/m did not change with the metal, the particles were the same in all atoms. They were named electrons.", "h": "Same particle in every material = universal electron."}, {"ch": 1, "k": "concept", "s": "Ch2 p.11 Thomson", "q": "In the magnetic-field step of Thomson's experiment, the magnetic force acting on each electron causes it to:", "o": ["move on in a straight line unchanged", "come to rest on the screen", "accelerate in the direction of the force", "lose its negative charge"], "a": 2, "e": "The beam bends because each electron is pushed sideways by the force, which is how the deflection was measured.", "h": "Force on a charge = it bends."}, {"ch": 1, "k": "concept", "s": "Ch2 p.12 Millikan", "q": "After Thomson's work, the atom was pictured as:", "o": ["a cloud of waves with no fixed orbits or positions at all", "a sphere of positive electricity with negative electrons embedded in it", "a tiny positive nucleus with electrons circling far from it", "a hard indivisible particle with no parts inside it at all"], "a": 1, "e": "This is the \"plum pudding\" idea: positive charge and mass spread uniformly through the atom, with electrons dotted in it.", "h": "Thomson = pudding with plums."}, {"ch": 1, "k": "concept", "s": "Ch2 p.11 Millikan", "q": "Millikan's oil-drop experiment gave:", "o": ["the first evidence that atoms are divisible", "the final evidence that electrons are discrete particles", "the existence of the nucleus", "the atomic number of each element"], "a": 1, "e": "By measuring the charge on tiny oil drops he showed charge comes only in multiples of one basic unit.", "h": "Millikan = charge of one electron."}, {"ch": 1, "k": "concept", "s": "Ch2 p.11 Millikan", "q": "In the oil-drop experiment, a drop hangs motionless between two charged plates. This happens when:", "o": ["q = mg + E", "Eq = m/g", "E = mgq", "Eq = mg"], "a": 3, "e": "The upward electric force Eq balances the downward weight mg. Then q = mg/E, so the charge on the drop can be calculated.", "h": "Hover = Eq equals mg."}, {"ch": 1, "k": "trap", "s": "Ch2 p.12 Millikan", "q": "The charges measured on different oil drops were always:", "o": ["multiples of 9.1 × 10⁻²⁸ C", "random values with no common unit", "small whole-number multiples of 1.6 × 10⁻¹⁹ C", "the same value of 1.6 × 10⁻¹⁹ C for every drop"], "a": 2, "e": "The drops carried different numbers of electrons, so the totals varied, but always as whole-number multiples of one electron's charge.", "h": "Drops differ; the unit does not."}, {"ch": 1, "k": "concept", "s": "Ch2 p.12 Rutherford", "q": "Rutherford bombarded thin metal foils with alpha particles. He found that most of the particles:", "o": ["bounced back along their path", "were captured by the atoms in the foil", "passed straight through the foil", "were stopped inside the foil"], "a": 2, "e": "That showed most of the atom is empty space.", "h": "Most through = mostly empty."}, {"ch": 1, "k": "trap", "s": "Ch2 p.12 Rutherford", "q": "The occasional alpha particle that was deflected through 90° or more, or bounced back, showed that:", "o": ["the metal foil was too thick for the alpha particles to cross", "alpha particles are strongly attracted towards the electrons", "electrons are embedded evenly through a positive sphere", "the positive charge and most of the mass are concentrated in a very small nucleus"], "a": 3, "e": "Only a tiny, dense, positive centre could turn a heavy alpha particle around. That contradicts Thomson's even spread.", "h": "Bounce back = tiny dense nucleus."}, {"ch": 1, "k": "concept", "s": "Ch2 p.12 Rutherford", "q": "If Thomson's model were correct, what would be expected when alpha particles hit the gold foil?", "o": ["They would be stopped and absorbed inside the foil", "All would be deflected through about 90° by each atom", "Nothing hard enough to change their motion, so all pass through", "Most would bounce straight back from the gold atoms"], "a": 2, "e": "With charge spread thinly through the atom, there is nothing concentrated enough to deflect an alpha particle. The big deflections therefore disproved Thomson.", "h": "Thomson predicts a smooth pass."}, {"ch": 1, "k": "concept", "s": "Ch2 p.13 Rutherford", "q": "Rutherford described firing alpha particles at gold foil as being like firing a high-powered rifle at:", "o": ["a steel plate", "tissue paper", "a sheet of glass", "a wooden door"], "a": 1, "e": "His surprise was that some particles bounced back from something he expected to be as flimsy as tissue paper.", "h": "Rifle at tissue paper."}, {"ch": 1, "k": "concept", "s": "Ch2 p.12 Rutherford", "q": "In the Rutherford apparatus shown, which part detects the particles after they pass through the foil?", "o": ["The alpha-particle emitter", "The gold foil", "The slit", "The detecting screen"], "a": 3, "e": "The emitter fires the beam through a slit at the foil, and the detecting screen around it shows where the particles land.", "h": "Source → slit → foil → screen.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAE9AtYDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAEDBAUGBwII/8QATBAAAQMDAwEEBgYHBQYEBwEAAQACAwQFEQYSITETQVFhBxQiMnGRFSNSgaGxFjNCYnLB0SRTc4KSNENjg5PhJTVEVBcmRVVkovDx/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//EACERAQEBAAICAwEAAwAAAAAAAAABEQISIVExQWFSAxOh/9oADAMBAAIRAxEAPwDqqIiAoUogwk1g7W4GqkuNW6Hfv9Wc5pjz8s/isTWWu0w3p1yFbWS1rhtEdPKXEDwwOgW1z07Khu2Vu5uehPBUxQRwjEUbGDwa3CDQW0FDSPqW01PqG -ray wavelength; C and b are constants and Z is linked to the atomic number.", "h": "λ always means wavelength."}, {"ch": 1, "k": "concept", "s": "Ch2 p.14 text", "q": "An atomic mass unit (a.m.u.) is defined as:", "o": ["one-sixteenth the mass of an oxygen atom", "the mass of one hydrogen molecule", "the mass of one electron", "one-twelfth the mass of a carbon-12 atom"], "a": 3, "e": "Carbon-12 is the reference. On this scale a proton and a neutron are each almost exactly 1.", "h": "amu = 1/12 of C-12."}, {"ch": 1, "k": "trap", "s": "Ch2 p.14 text", "q": "On the atomic mass unit scale, the masses of a proton and a neutron are each almost exactly:", "o": ["0.0005", "0", "1840", "1.0"], "a": 3, "e": "Proton and neutron are both close to 1 u. The electron is the tiny one. Note the book's table prints 0 for the neutron and 1 for the electron, which is a misprint.", "h": "⚠ TRAP: electron is the near-zero one."}, {"ch": 1, "k": "trap", "s": "Ch2 p.14 text", "q": "Which of these particles has a negligible mass compared with the other two?", "o": ["Electron", "Alpha-particle nucleus", "Neutron", "Proton"], "a": 0, "e": "The electron is about 1/1840 of a proton. The book's table prints 1 for electrons, which is a misprint; protons and neutrons are the ones near 1.", "h": "Electron = lightest."}, {"ch": 1, "k": "concept", "s": "Ch2 p.14 text", "q": "The charges on the proton, neutron and electron are respectively:", "o": ["positive, none, negative", "negative, none, positive", "positive, negative, none", "none, positive, negative"], "a": 0, "e": "Proton +, neutron nil, electron −.", "h": "P positive, N neutral, E negative."}, {"ch": 1, "k": "concept", "s": "Ch2 p.15 spectrum", "q": "A line spectrum is used to identify an element because:", "o": ["the lines are the same for all elements", "the lines do not depend on the element", "the pattern of lines is characteristic of that element", "it measures the mass of the nucleus"], "a": 2, "e": "Every element gives its own pattern of coloured lines, like a fingerprint.", "h": "Line spectrum = element fingerprint."}, {"ch": 1, "k": "concept", "s": "Ch2 p.15 spectrum", "q": "Which element gives the simplest line spectrum?", "o": ["Helium", "Hydrogen", "Sodium", "Carbon"], "a": 1, "e": "The hydrogen atom has one electron and gives the simplest set of lines, which is why Bohr used it.", "h": "H = simplest atom, simplest spectrum."}, {"ch": 1, "k": "concept", "s": "Ch2 p.15 Fig 6", "q": "In the hydrogen line spectrum shown, which series lies in the infra-red region?", "o": ["Balmer series", "Lyman series", "None of the series", "Paschen series"], "a": 3, "e": "Lyman is ultraviolet, Balmer is partly visible and Paschen is infra-red.", "h": "L-U, B-V, P-I: Lyman UV, Balmer visible, Paschen IR.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAEdAvgDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAQMEBwII/8QAURAAAQQCAAQCBgUHCAcGBQUAAQACAwQFEQYSITETUQcUIkFhcRUygaGxFiNCUpHB0SQzU2JykqKyNUNUc4KT4SU0RGNkwhcmJ0WDNoSjs/D/xAAWAQEBAQAAAAAAAAAAAAAAAAAAAQL/xAAZEQEBAQEBAQAAAAAAAAAAAAAAEQFBITH/2gAMAwEAAhEDEQA/APVUREBERAREQEREBERAREQEREBERAREQFgjayiCOGCxgum56hX9aLucy8g5ubz2pBZRAREQYKLKIMLKIgIiIMaTSyiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIvlz2sG3ODR8Sg+kXyHA9iCjXtcNtII8wUH0iIgIiICIiAiLkyOSqYuv496dkEPMG87zobPZB1Ht0QKEj4uwczXGLIxPDRskA6A3ry81uk4ixkdKS4600V45fBc8NJ9vetdkEsi+WPD2Nc07DhsLiy+XqYeu2e7IWMe8Rt00klx7IO9Fhp2AR2KygIiICLBOlE4vPQZPJ5CjCx4fReGSOdrTifJBLoiICIiAsbXzK7kje/vytJXmY9Ks2tuxket6/nT5oPTtptQE3ED2XXQNhbr6PNsEnZ2D2Xzj8/NbuYmF0cbW3ajp363sEa6D70WLDtNqIr5OaTiWzjXMb4MVZsof7ySdaWcvkpaOQxcEbWlluZ0bye4AbsaREssrB7KIwOSnv2Moyfl1Vtuhj5Rr2QB3QTCIsFAWVEcM358jjpJrBBe2xIwaGujXEBS6AiIgLCFRfE80tfAX5oHujlZCS1ze4KCVRc+PeZKNd7iS50TSSe5Ol0ICIiAi
