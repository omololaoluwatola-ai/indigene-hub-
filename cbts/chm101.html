 ³⁷Cl (36.9659 u). If the average atomic mass of chlorine is 35.45 u, the percent natural abundance of ³⁵Cl is:", "o": ["24.10 %", "35.45 %", "75.90 %", "50.00 %"], "a": 2, "e": "x(34.9688) + (1 − x)(36.9659) = 35.45 gives x = 0.7590, so 75.90 % ³⁵Cl and 24.10 % ³⁷Cl. The 24.10 % belongs to the heavier isotope.", "h": "Average near 35.45 = mostly Cl-35."}, {"ch": 4, "k": "exercise", "s": "Ch5 p.50 Exercise 3", "q": "With the same chlorine data, the percent natural abundance of ³⁷Cl is:", "o": ["75.90 %", "64.55 %", "37.00 %", "24.10 %"], "a": 3, "e": "Subtract from 100: 100 − 75.90 = 24.10 %.", "h": "Cl-35 : Cl-37 is about 3 : 1."}, {"ch": 4, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of boron from these data: ¹⁰B = 10.0129 u (19.9%); ¹¹B = 11.0093 u (80.1%).", "o": ["10.81 u", "10.51 u", "10.21 u", "1081 u"], "a": 0, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 10.81 u. The simple mean (10.51) ignores abundance, the swapped-abundance answer (10.21) mixes up which isotope is common, and 1081 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean."}, {"ch": 4, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of lithium from these data: ⁶Li = 6.0151 u (7.5%); ⁷Li = 7.016 u (92.5%).", "o": ["6.52 u", "6.94 u", "694 u", "6.09 u"], "a": 1, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 6.94 u. The simple mean (6.52) ignores abundance, the swapped-abundance answer (6.09) mixes up which isotope is common, and 694 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean."}, {"ch": 4, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of magnesium from these data: ²⁴Mg = 23.985 u (78.99%); ²⁵Mg = 24.986 u (10.0%); ²⁶Mg = 25.983 u (11.01%).", "o": ["24.31 u", "2431 u", "25.31 u", "24.98 u"], "a": 0, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 24.31 u. The simple mean (24.98) ignores abundance, the swapped-abundance answer (25.31) mixes up which isotope is common, and 2431 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean."}, {"ch": 4, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of bromine from these data: ⁷⁹Br = 78.918 u (50.69%); ⁸¹Br = 80.916 u (49.31%).", "o": ["79.90 u", "7990 u", "79.93 u", "79.92 u"], "a": 0, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 79.90 u. The simple mean (79.92) ignores abundance, the swapped-abundance answer (79.93) mixes up which isotope is common, and 7990 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean."}, {"ch": 4, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of silver from these data: ¹⁰⁷Ag = 106.905 u (51.84%); ¹⁰⁹Ag = 108.905 u (48.16%).", "o": ["107.94 u", "10787 u", "107.91 u", "107.87 u"], "a": 3, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 107.87 u. The simple mean (107.91) ignores abundance, the swapped-abundance answer (107.94) mixes up which isotope is common, and 10787 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean."}, {"ch": 4, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of chlorine from these data: ³⁵Cl = 34.9688 u (75.78%); ³⁷Cl = 36.9659 u (24.22%).", "o": ["35.45 u", "3545 u", "36.48 u", "35.97 u"], "a": 0, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 35.45 u. The simple mean (35.97) ignores abundance, the swapped-abundance answer (36.48) mixes up which isotope is common, and 3545 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean."}, {"ch": 4, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of gallium from these data: ⁶⁹Ga = 68.9256 u (60.11%); ⁷¹Ga = 70.9247 u (39.89%).", "o": ["69.72 u", "69.93 u", "6972 u", "70.13 u"], "a": 0, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 69.72 u. The simple mean (69.93) ignores abundance, the swapped-abundance answer (70.13) mixes up which isotope is common, and 6972 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean."}, {"ch": 4, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of nitrogen from these data: ¹⁴N = 14.0031 u (99.63%); ¹⁵N = 15.0001 u (0.37%).", "o": ["15.00 u", "14.50 u", "1401 u", "14.01 u"], "a": 3, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 14.01 u. The simple mean (14.50) ignores abundance, the swapped-abundance answer (15.00) mixes up which isotope is common, and 1401 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean."}, {"ch": 4, "k": "example", "s": "Ch5 p.49 variant", "q": "Boron has two isotopes, ¹⁰B (10.0129 u) and ¹¹B (11.0093 u). Its average atomic mass is 10.81 u. The percent abundance of ¹⁰B is:", "o": ["10.81 %", "80.00 %", "50.00 %", "20.00 %"], "a": 3, "e": "Let ¹⁰B = x. 10.0129x + 11.0093(1 − x) = 10.81, so x = (11.0093 − 10.81) ÷ (11.0093 − 10.0129) = 0.2000, which is 20.00 %. 80.00 % is the other isotope.", "h": "Put x and 1 − x, then solve one equation."}, {"ch": 4, "k": "example", "s": "Ch5 p.49 variant", "q": "Gallium has two isotopes, ⁶⁹Ga (68.9256 u) and ⁷¹Ga (70.9247 u). Its average atomic mass is 69.723 u. The percent abundance of ⁶⁹Ga is:", "o": ["69.723 %", "60.11 %", "39.89 %", "50.00 %"], "a": 1, "e": "Let ⁶⁹Ga = x. 68.9256x + 70.9247(1 − x) = 69.723, so x = (70.9247 − 69.723) ÷ (70.9247 − 68.9256) = 0.6011, which is 60.11 %. 39.89 % is the other isotope.", "h": "Put x and 1 − x, then solve one equation."}, {"ch": 4, "k": "example", "s": "Ch5 p.49 variant", "q": "Bromine has two isotopes, ⁷⁹Br (78.918 u) and ⁸¹Br (80.916 u). Its average atomic mass is 79.904 u. The percent abundance of ⁷⁹Br is:", "o": ["49.35 %", "79.904 %", "50.00 %", "50.65 %"], "a": 3, "e": "Let ⁷⁹Br = x. 78.918x + 80.916(1 − x) = 79.904, so x = (80.916 − 79.904) ÷ (80.916 − 78.918) = 0.5065, which is 50.65 %. 49.35 % is the other isotope.", "h": "Put x and 1 − x, then solve one equation."}, {"ch": 4, "k": "example", "s": "Ch5 p.49 variant", "q": "Lithium has two isotopes, ⁶Li (6.0151 u) and ⁷Li (7.016 u). Its average atomic mass is 6.941 u. The percent abundance of ⁶Li is:", "o": ["50.00 %", "92.51 %", "7.49 %", "6.941 %"], "a": 2, "e": "Let ⁶Li = x. 6.0151x + 7.016(1 − x) = 6.941, so x = (7.016 − 6.941) ÷ (7.016 − 6.0151) = 0.0749, which is 7.49 %. 92.51 % is the other isotope.", "h": "Put x and 1 − x, then solve one equation."}, {"ch": 4, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of silicon: ²⁸Si = 27.9769 u (92.23 %), ²⁹Si = 28.9765 u (4.68 %), ³⁰Si = 29.9738 u (3.09 %).", "o": ["28.98 u", "28.09 u", "2809 u", "29.90 u"], "a": 1, "e": "0.9223 × 27.9769 + 0.0468 × 28.9765 + 0.0309 × 29.9738 = 28.09 u. The plain mean of the three masses is 28.98 u.", "h": "Mostly Si-28, so the answer is just above 28."}, {"ch": 4, "k": "example", "s": "Ch5 p.49 variant", "q": "Rubidium has two isotopes, ⁸⁵Rb (84.9118 u) and ⁸⁷Rb (86.9092 u), and an average atomic mass of 85.468 u. The percent abundance of ⁸⁷Rb is:", "o": ["50.00 %", "27.85 %", "72.15 %", "85.468 %"], "a": 1, "e": "Let ⁸⁵Rb = x: 84.9118x + 86.9092(1 − x) = 85.468 gives x = 0.7215. So ⁸⁷Rb = 1 − x = 27.85 %. The 72.15 % belongs to ⁸⁵Rb.", "h": "Solve for the lighter, then subtract from 100."}, {"ch": 4, "k": "example", "s": "Ch5 p.49 variant", "q": "Copper has two isotopes, ⁶³Cu (62.9296 u) and ⁶⁵Cu (64.9278 u), and an average atomic mass of 63.546 u. The percent abundance of ⁶⁵Cu is:", "o": ["69.15 %", "63.546 %", "30.85 %", "50.00 %"], "a": 2, "e": "Let ⁶³Cu = x: 62.9296x + 64.9278(1 − x) = 63.546 gives x = 0.6915. So ⁶⁵Cu = 1 − x = 30.85 %. The 69.15 % belongs to ⁶³Cu.", "h": "Solve for the lighter, then subtract from 100."}, {"ch": 4, "k": "example", "s": "Ch5 p.49 variant", "q": "Silver has two isotopes, ¹⁰⁷Ag (106.905 u) and ¹⁰⁹Ag (108.905 u), and an average atomic mass of 107.868 u. The percent abundance of ¹⁰⁹Ag is:", "o": ["107.868 %", "48.15 %", "50.00 %", "51.85 %"], "a": 1, "e": "Let ¹⁰⁷Ag = x: 106.905x + 108.905(1 − x) = 107.868 gives x = 0.5185. So ¹⁰⁹Ag = 1 − x = 48.15 %. The 51.85 % belongs to ¹⁰⁷Ag.", "h": "Solve for the lighter, then subtract from 100."}, {"ch": 4, "k": "example", "s": "Ch5 p.50 variant", "q": "Boron has two isotopes. ¹⁰B has mass 10.0129 u and abundance 19.9 %. The average atomic mass is 10.81 u. The mass of the other isotope is:", "o": ["10.41 u", "11.01 u", "8.82 u", "11.61 u"], "a": 1, "e": "a₁m₁ + a₂m₂ = average, so m₂ = (10.81 − 0.19899999999999998 × 10.0129) ÷ 0.801 = 11.01 u.", "h": "Subtract the known contribution, then divide by the other fraction."}, {"ch": 4, "k": "example", "s": "Ch5 p.50 variant", "q": "Lithium has two isotopes. ⁶Li has mass 6.0151 u and abundance 7.5 %. The average atomic mass is 6.941 u. The mass of the other isotope is:", "o": ["7.02 u", "7.87 u", "6.48 u", "6.49 u"], "a": 0, "e": "a₁m₁ + a₂m₂ = average, so m₂ = (6.941 − 0.075 × 6.0151) ÷ 0.925 = 7.02 u.", "h": "Subtract the known contribution, then divide by the other fraction."}, {"ch": 4, "k": "example", "s": "Ch5 p.50 variant", "q": "Chlorine has two isotopes. ³⁵Cl has mass 34.9688 u and abundance 75.78 %. The average atomic mass is 35.453 u. The mass of the other isotope is:", "o": ["36.97 u", "35.94 u", "8.95 u", "35.21 u"], "a": 0, "e": "a₁m₁ + a₂m₂ = average, so m₂ = (35.453 − 0.7578 × 34.9688) ÷ 0.242 = 36.97 u.", "h": "Subtract the known contribution, then divide by the other fraction."}, {"ch": 4, "k": "example", "s": "Ch5 p.48 Example 1", "q": "In the carbon example, the contribution of ¹²C (12.00000 u, 98.892 %) to the average atomic mass is:", "o": ["12.000 u", "11.867 u", "0.1441 u", "1186.7 u"], "a": 1, "e": "0.98892 × 12.00000 = 11.86704 u. The 0.1441 u is ¹³C's share.", "h": "Each isotope contributes mass × fraction."}, {"ch": 4, "k": "example", "s": "Ch5 p.48 Example 1", "q": "In the carbon example, the contribution of ¹³C (13.00335 u, 1.108 %) to the average atomic mass is:", "o": ["0.1441 u", "13.003 u", "11.867 u", "14.41 u"], "a": 0, "e": "0.01108 × 13.00335 = 0.14408 u. Add this to 11.86704 to get 12.0111 u.", "h": "Small abundance, small contribution."}, {"ch": 4, "k": "example", "s": "Ch5 p.50 Exercise 1", "q": "The fractional abundance of ²⁰Ne (90.51 %) is:", "o": ["0.009051", "9.051", "0.9051", "90.51"], "a": 2, "e": "Divide the percentage by 100.", "h": "% ÷ 100."}, {"ch": 4, "k": "example", "s": "Ch5 p.50 Exercise 1", "q": "In the neon data, which isotope contributes the most to the average atomic mass?", "o": ["All three equally", "²²Ne", "²¹Ne", "²⁰Ne"], "a": 3, "e": "²⁰Ne is 90.51 % of the atoms, so its share is about 18.10 u out of the 20.18 u total.", "h": "Biggest abundance wins."}, {"ch": 4, "k": "example", "s": "Ch5 p.50 Exercise 1", "q": "The abundances of three isotopes of an element are listed. Which set is possible for a complete natural sample?", "o": ["90.51 %, 0.27 %, 9.22 %", "90.51 %, 2.70 %, 9.22 %", "91.51 %, 0.27 %, 9.22 %", "90.51 %, 0.27 %, 9.02 %"], "a": 0, "e": "Abundances must add to 100 %. Only 90.51 + 0.27 + 9.22 = 100.00.", "h": "Add them up."}, {"ch": 4, "k": "example", "s": "Ch5 p.48 Example 1", "q": "How many ¹³C atoms would you expect in a sample of 10 000 carbon atoms, given ¹³C = 1.108 %?", "o": ["About 1108", "About 111", "About 11", "About 9889"], "a": 1, "e": "10 000 × 0.01108 = 110.8, so about 111. The 9889 is the number of ¹²C.", "h": "Total × fraction."}, {"ch": 4, "k": "example", "s": "Ch5 p.50 Exercise 3", "q": "In a sample of 2000 chlorine atoms, about how many are ³⁷Cl if ³⁷Cl is 24.10 % of chlorine?", "o": ["About 24", "About 4820", "About 482", "About 1518"], "a": 2, "e": "2000 × 0.2410 = 482. The 1518 are ³⁵Cl.", "h": "Count = fraction × total."}, {"ch": 4, "k": "example", "s": "Ch5 p.50 Exercise 1", "q": "Which value best represents the average atomic mass of neon?", "o": ["20.18 u", "19.99 u", "21.99 u", "20.99 u"], "a": 0, "e": "It sits just above 20 because ²⁰Ne dominates, with small shares from ²¹Ne and ²²Ne. The three given values are the individual isotope masses.", "h": "Average ≠ any single isotope mass."}, {"ch": 4, "k": "concept", "s": "Ch5 p.48 text", "q": "By international convention, the modern standard for atomic mass is:", "o": ["carbon-12, assigned a mass of exactly 12 u", "carbon-14, assigned a mass of exactly 14 u", "oxygen-16, assigned a mass of exactly 16 u", "hydrogen-1, assigned a mass of exactly 1 u"], "a": 0, "e": "The pristine isotope carbon-12 is the reference. All other atomic masses are compared with it.", "h": "C-12 = exactly 12."}, {"ch": 4, "k": "concept", "s": "Ch5 p.48 text", "q": "An atomic mass unit (u) is exactly:", "o": ["one-sixteenth the mass of an oxygen atom", "the mass of one electron", "the mass of one hydrogen atom", "one-twelfth the mass of a ¹²C atom"], "a": 3, "e": "Defined from carbon-12, so 1 u is a little less than the mass of a proton.", "h": "1 u = 1/12 of C-12."}, {"ch": 4, "k": "concept", "s": "Ch5 p.48 text", "q": "The atomic mass of an element is defined as:", "o": ["the sum of the masses of all of its isotopes", "the mass number of its lightest known isotope", "the mass of its single most abundant isotope", "the weighted average mass of its natural isotopes"], "a": 3, "e": "Each isotope counts in proportion to how much of it occurs in nature.", "h": "Atomic mass = weighted average."}, {"ch": 4, "k": "concept", "s": "Ch5 p.48 text", "q": "To estimate the average atomic mass of an element, you need to know:", "o": ["the atomic number and number of electrons", "the mass number of the most abundant isotope only", "the number of neutrons in the heaviest isotope", "the atomic mass of each isotope and its fractional natural abundance"], "a": 3, "e": "Masses without abundances are not enough; abundances without masses are not enough.", "h": "Need mass + abundance for every isotope."}, {"ch": 4, "k": "trap", "s": "Ch5 p.48 text", "q": "The average atomic mass of carbon is 12.0111 u rather than exactly 12 because:", "o": ["the ¹²C atom is slightly heavier than 12 u itself", "carbon atoms gain a little mass in compounds", "electrons add extra mass to every carbon atom", "natural carbon has a little heavier ¹³C mixed with ¹²C"], "a": 3, "e": "Only pure ¹²C is exactly 12 u. The 1.108 % of ¹³C pulls the average up a little.", "h": "Average ≠ any one isotope."}, {"ch": 4, "k": "trap", "s": "Ch5 p.48 text", "q": "To convert a percent abundance to a fractional abundance you:", "o": ["multiply by the atomic number", "divide by 100", "multiply by 100", "divide by the atomic mass"], "a": 1, "e": "98.892 % = 98.892 ÷ 100 = 0.98892. Missing this step makes the answer 100 times too big.", "h": "% ÷ 100 first."}, {"ch": 4, "k": "concept", "s": "Ch5 p.49 Example 2", "q": "For an element with two isotopes, if the fractional abundance of one isotope is x, the other is:", "o": ["1 + x", "1 − x", "100 − x", "x − 1"], "a": 1, "e": "The two fractions add up to 1 (or the two percentages to 100). 100 − x would only work for percentages.", "h": "x and (1 − x)."}, {"ch": 4, "k": "concept", "s": "Ch5 p.48 text", "q": "An element has two isotopes with masses 35 u and 37 u. Its average atomic mass is 35.45 u. This shows that:", "o": ["the heavier isotope is more abundant", "the element has a third isotope", "the lighter isotope is more abundant", "both isotopes are equally abundant"], "a": 2, "e": "The average is nearer to 35 than to 37, so most atoms are the lighter isotope.", "h": "Average close to one isotope = that one dominates."}, {"ch": 4, "k": "trap", "s": "Ch5 p.48 text", "q": "A student averages the masses 10.013 u and 11.009 u of two isotopes of boron by adding them and dividing by 2. What is wrong?", "o": ["The masses must be added without dividing", "The mass numbers should have been used instead", "Abundances were ignored; a weighted average is needed", "Nothing, a simple mean is always correct"], "a": 2, "e": "A simple mean treats both isotopes as equally common, which is not true in nature. Boron is about 80 % ¹¹B.", "h": "⚠ TRAP: mean vs weighted mean."}, {"ch": 4, "k": "concept", "s": "Ch5 p.48 text", "q": "Isotopes of the same element have the same:", "o": ["number of neutrons but different protons", "atomic mass and mass number", "atomic number but different mass numbers", "mass number but different atomic numbers"], "a": 2, "e": "Same protons, different neutrons.", "h": "Isotopes: same Z, different A."}, {"ch": 4, "k": "concept", "s": "Ch5 p.48 text", "q": "The mass of a single ¹²C atom is exactly:", "o": ["12 g", "12.011 u", "6 u", "12 u"], "a": 3, "e": "¹²C defines the scale. The 12.011 u is the average for natural carbon.", "h": "Single C-12 = 12 u."}, {"ch": 4, "k": "trap", "s": "Ch5 p.48 text", "q": "The relative atomic masses of elements like chlorine (35.45) are not whole numbers because:", "o": ["atoms of chlorine have fractional numbers of protons", "neutrons have fractional masses in every atom", "they are weighted averages over isotopes of different mass", "electrons are counted into the mass number as well"], "a": 2, "e": "Mass numbers are whole numbers, but averages over isotopes usually are not.", "h": "Not whole = isotope mix."}, {"ch": 4, "k": "concept", "s": "Ch5 p.48 text", "q": "The percent abundances of all the isotopes of an element add up to:", "o": ["1000 %", "1 %", "10 %", "100 %"], "a": 3, "e": "They describe the whole natural sample.", "h": "Always 100 %."}, {"ch": 4, "k": "trap", "s": "Ch5 p.48 text", "q": "Which statement correctly separates atomic mass from mass number?", "o": ["Atomic mass counts only protons; mass number counts only neutrons", "Atomic mass is a weighted average; mass number is a whole count for one isotope", "They are the same quantity for every element in the table", "Atomic mass is a whole number; mass number is a weighted average"], "a": 1, "e": "Mass number belongs to one isotope and is always a whole number. Atomic mass averages them and can be a decimal.", "h": "A is whole, atomic mass is averaged."}, {"ch": 4, "k": "trap", "s": "Ch5 p.50 Exercise 3", "q": "If chlorine had equal amounts of ³⁵Cl (34.9688 u) and ³⁷Cl (36.9659 u), its average atomic mass would be:", "o": ["35.45 u", "35.97 u", "37.97 u", "36.00 u"], "a": 1, "e": "(34.9688 + 36.9659) ÷ 2 = 35.97 u. The real value is 35.45 u because ³⁵Cl is more abundant.", "h": "Equal abundance = plain mean."}, {"ch": 4, "k": "trap", "s": "Ch5 p.48 text", "q": "Two isotopes have masses 20 u and 22 u. If the average atomic mass is 20.4 u, the abundance of the 22 u isotope is closest to:", "o": ["2 %", "80 %", "20 %", "50 %"], "a": 2, "e": "x(22) + (1 − x)(20) = 20.4 gives x = 0.2, so 20 %. The 20 u isotope makes up 80 %.", "h": "Average near 20 = mostly the 20 u isotope."}, {"ch": 5, "k": "example", "s": "Ch6 p.51 Example 1", "q": "Balance Fe + O₂ → Fe₂O₃. The coefficients (Fe, O₂, Fe₂O₃) are:", "o": ["2, 1, 1", "2, 3, 2", "4, 3, 2", "4, 2, 3"], "a": 2, "e": "Oxygen is odd on the right (3 per Fe₂O₃), so take 2 Fe₂O₃ to get 6 O, which needs 3 O₂. Six O on the left, six on the right. Now Fe: 4 on the right, so 4 Fe. Answer 4Fe + 3O₂ → 2Fe₂O₃.", "h": "Fix the element that appears in only one place on each side last; use the O count to start."}, {"ch": 5, "k": "example", "s": "Ch6 p.51 Example 2", "q": "Balance C₂H₆ + O₂ → CO₂ + H₂O. The coefficient of O₂ is:", "o": ["7", "5", "3.5", "4"], "a": 0, "e": "Start with C and H: 2C₂H₆ + O₂ → 4CO₂ + 6H₂O. Oxygen on the right is 8 + 6 = 14, so O₂ needs 7. Written as 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O. If you leave it as 1 C₂H₆ you get 3.5 O₂, which is correct ratio but not whole numbers.", "h": "Hydrocarbon combustion: balance C, then H, then O last. Clear fractions by doubling."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.51 Exercise i", "q": "Balance H₂ + O₂ → H₂O. The coefficients (H₂, O₂, H₂O) are:", "o": ["1, 1, 1", "1, 2, 2", "2, 2, 2", "2, 1, 2"], "a": 3, "e": "Two O atoms in O₂ need two H₂O, which gives four H, so two H₂. 2H₂ + O₂ → 2H₂O.", "h": "Never change a subscript to balance; H₂O₂ is a different compound."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.51 Exercise ii", "q": "Balance SiCl₄ + H₂O → SiO₂ + HCl. The coefficient of HCl is:", "o": ["4", "8", "1", "2"], "a": 0, "e": "SiCl₄ has four Cl so you need 4HCl. That brings 4 H, so 2H₂O, which supplies the 2 O for SiO₂. SiCl₄ + 2H₂O → SiO₂ + 4HCl.", "h": "Balance the element with the biggest number first (Cl here)."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.51 Exercise iii", "q": "Balance PCl₅ + H₂O → H₃PO₄ + HCl. The coefficients of H₂O and HCl are:", "o": ["4 and 4", "5 and 4", "3 and 5", "4 and 5"], "a": 3, "e": "Five Cl give 5HCl. Four O in H₃PO₄ means 4H₂O, which gives 8 H on the left and 3 + 5 = 8 on the right. PCl₅ + 4H₂O → H₃PO₄ + 5HCl.", "h": "Count H last; it should come out equal by itself if O and Cl are right."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.51 Exercise iv", "q": "Balance CaO + P₄O₁₀ → Ca₃(PO₄)₂. The coefficient of CaO is:", "o": ["4", "3", "2", "6"], "a": 3, "e": "P₄O₁₀ has 4 P, so you need 2Ca₃(PO₄)₂, which carries 6 Ca. Then 6CaO + P₄O₁₀ → 2Ca₃(PO₄)₂. Oxygen: 6 + 10 = 16 and 2 × 8 = 16.", "h": "Balance Ca and P first, check O at the end."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.51 Exercise v", "q": "Complete combustion of CH₃CH₂CH₂CH(OH)CH₂OH (C₅H₁₂O₂) gives CO₂ and H₂O. The coefficient of O₂ is:", "o": ["8", "6.5", "5", "7"], "a": 3, "e": "C₅H₁₂O₂ + xO₂ → 5CO₂ + 6H₂O. Oxygen on the right is 10 + 6 = 16. The compound already holds 2 O, so O₂ supplies 14 O, which is 7 O₂.", "h": "The O already inside the compound reduces how much O₂ you need."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.51 Exercise vi", "q": "Balance MnO₄⁻ + H⁺ + 5e⁻ → Mn²⁺ + H₂O. The coefficients of H⁺ and H₂O are:", "o": ["5 and 4", "8 and 4", "8 and 2", "4 and 2"], "a": 1, "e": "Four O in MnO₄⁻ give 4H₂O, which needs 8 H⁺. Check charge: −1 + 8 − 5 = +2, matching Mn²⁺. ⚠ The book prints the product as Mn₂⁺, which is a typo; it is Mn²⁺ (charge 2+).", "h": "⚠ TRAP: half-equations must balance atoms AND charge. Balance O with H₂O, then H with H⁺."}, {"ch": 5, "k": "example", "s": "Ch6 p.51 variant", "q": "Balance C₃H₈ + O₂ → CO₂ + H₂O. The coefficients (C₃H₈, O₂, CO₂, H₂O) are:", "o": ["1, 3, 3, 4", "2, 5, 6, 8", "1, 4, 3, 5", "1, 5, 3, 4"], "a": 3, "e": "3 C give 3CO₂, 8 H give 4H₂O, so O on the right is 6 + 4 = 10, which is 5 O₂.", "h": "Propane burns with 5 O₂."}, {"ch": 5, "k": "example", "s": "Ch6 p.58 Example", "q": "Balance C₆H₆ + O₂ → CO₂ + H₂O (this is the equation used for the benzene stoichiometry example). The coefficients are:", "o": ["1, 15, 6, 6", "2, 15, 12, 6", "2, 12, 12, 6", "1, 7.5, 6, 3"], "a": 1, "e": "1 C₆H₆ needs 7.5 O₂; double everything to clear the fraction: 2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O.", "h": "Fractions in an equation? Double it."}, {"ch": 5, "k": "example", "s": "Ch6 p.51 variant", "q": "Balance Al + O₂ → Al₂O₃. The coefficients (Al, O₂, Al₂O₃) are:", "o": ["4, 2, 2", "2, 1, 1", "4, 3, 2", "2, 3, 1"], "a": 2, "e": "O: 3 per Al₂O₃ and 2 per O₂, so least common multiple is 6, giving 2Al₂O₃ and 3O₂. Then Al is 4.", "h": "Same pattern as Fe₂O₃: 4, 3, 2."}, {"ch": 5, "k": "example", "s": "Ch6 p.51-52 Example", "q": "Calculate the percentage of nitrogen in magnesium nitrate, Mg(NO₃)₂ (Mg = 24.31, N = 14.01, O = 16.00).", "o": ["27.78 %", "18.89 %", "9.45 %", "14.01 %"], "a": 1, "e": "Molar mass = 24.31 + 2(14.01) + 6(16.00) = 148.33 g/mol. Nitrogen contributes 2 × 14.01 = 28.02. 28.02 ÷ 148.33 × 100 = 18.89 %. Using one N only gives 9.45 %.", "h": "⚠ TRAP: multiply by the subscript outside the bracket too: (NO₃)₂ means 2 N and 6 O."}, {"ch": 5, "k": "example", "s": "Ch6 p.51-52 Example", "q": "In the same compound, Mg(NO₃)₂, the percentage of oxygen is about:", "o": ["43.15 %", "64.72 %", "16.39 %", "32.36 %"], "a": 1, "e": "96.00 ÷ 148.33 × 100 = 64.72 %. Mg is 16.39 % and N is 18.89 %, and the three add to 100.", "h": "Percentages of all elements must add to 100."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.52 Exercise i", "q": "Calculate the percentage of oxygen in C₃H₈O₃ (glycerol).", "o": ["48.00 %", "34.78 %", "17.39 %", "52.17 %"], "a": 3, "e": "Molar mass = 36 + 8 + 48 = 92 g/mol. Oxygen = 48 ÷ 92 × 100 = 52.17 %. The 34.78 % comes from counting only 2 O.", "h": "Count atoms from the subscripts, then divide by the whole molar mass."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.52 Exercise ii", "q": "Calculate the percentage of oxygen in (NH₄)₂SO₄.", "o": ["24.24 %", "54.55 %", "48.48 %", "12.12 %"], "a": 2, "e": "Molar mass = 2(14 + 4) + 32 + 64 = 132 g/mol. Oxygen = 64 ÷ 132 × 100 = 48.48 %.", "h": "The bracket (NH₄)₂ doubles N and H but does not touch O."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.52 Exercise iii", "q": "Calculate the percentage of oxygen in N(CH₂CH₂OH)₃, which is C₆H₁₅NO₃.", "o": ["32.21 %", "25.50 %", "10.74 %", "48.00 %"], "a": 0, "e": "Expand the formula: 3 × (CH₂CH₂OH) gives C₆H₁₅O₃, plus N. Molar mass = 72 + 15 + 14 + 48 = 149. Oxygen = 48 ÷ 149 × 100 = 32.21 %.", "h": "⚠ TRAP: expand brackets fully, the H in OH counts as well (15 H, not 12)."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 5a", "q": "What is the mass of Al in 1.5 kg of AlCl₃ (Al = 27, Cl = 35.5)?", "o": ["101.1 g", "606.7 g", "303.4 g", "27.0 g"], "a": 2, "e": "Molar mass of AlCl₃ = 27 + 106.5 = 133.5. Fraction of Al = 27/133.5 = 0.2022. 0.2022 × 1500 g = 303.4 g.", "h": "Mass of element = (element mass ÷ molar mass) × sample mass."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 5b", "q": "What is the mass of Al in 1.5 kg of Al₂O₃?", "o": ["794.1 g", "529.4 g", "397.1 g", "1500 g"], "a": 0, "e": "Molar mass of Al₂O₃ = 54 + 48 = 102. Al = 54/102 × 1500 = 794.1 g. Using one Al gives 397.1 g.", "h": "Two Al atoms per formula unit."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 5c", "q": "What is the mass of Al in 1.5 kg of alum, KAl(SO₄)₂·12H₂O (K = 39, S = 32)?", "o": ["303.4 g", "76.0 g", "85.4 g", "170.9 g"], "a": 2, "e": "Molar mass = 39 + 27 + 2(96) + 12(18) = 474 g/mol. Al = 27/474 × 1500 = 85.4 g. Leaving out the water of crystallisation gives 258 and a wrong 157 g.", "h": "⚠ TRAP: water of crystallisation (·12H₂O) is part of the molar mass."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 6c", "q": "Calculate the percentage of K in K₂SO₄.", "o": ["44.83 %", "18.39 %", "39.00 %", "22.41 %"], "a": 0, "e": "Molar mass = 78 + 32 + 64 = 174. K = 78/174 × 100 = 44.83 %. S would be 18.39 %.", "h": "Two K per formula unit."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 6b", "q": "Calculate the percentage of C in CH₄.", "o": ["25 %", "12 %", "75 %", "33.3 %"], "a": 2, "e": "Molar mass of CH₄ = 12 + 4 = 16. C = 12/16 × 100 = 75 %, H = 25 %.", "h": "Methane is three-quarters carbon by mass."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 6a", "q": "Calculate the percentage of Li in LiBr (Li = 6.94, Br = 79.9).", "o": ["8.68 %", "50.00 %", "92.01 %", "7.99 %"], "a": 3, "e": "6.94 ÷ 86.84 × 100 = 7.99 %. The 92.01 % is bromine.", "h": "Light atom, heavy partner: tiny percentage."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 6d", "q": "Calculate the percentage of Cu in CuSO₄ (Cu = 63.5).", "o": ["60.19 %", "63.50 %", "20.07 %", "39.81 %"], "a": 3, "e": "Molar mass = 63.5 + 32 + 64 = 159.5. Cu = 63.5/159.5 × 100 = 39.81 %.", "h": "Check the answer is below 100 and that the other percentages are consistent."}, {"ch": 5, "k": "example", "s": "Ch6 p.52-53 Example 1", "q": "Phenol contains 76.57 % C, 6.49 % H and 17.00 % O by mass (C = 12, H = 1, O = 16). Its empirical formula is:", "o": ["C₆H₆O₂", "C₆H₁₂O", "C₆H₆O", "C₃H₃O"], "a": 2, "e": "Moles: C 76.57/12 = 6.38, H 6.49/1 = 6.49, O 17.00/16 = 1.06. Divide by the smallest (1.06): C 6.0, H 6.1, O 1. So C₆H₆O.", "h": "Percent → grams (assume 100 g) → moles → divide by smallest → whole numbers."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.53 Exercise 1", "q": "Cyclohexanol contains 71.95 % C, 12.08 % H and 15.97 % O (C = 12.011, H = 1.0079, O = 15.99). Its empirical formula is:", "o": ["C₆H₁₂O", "C₆H₁₂O₂", "C₃H₆O", "C₆H₆O"], "a": 0, "e": "Moles: C 5.990, H 11.985, O 0.9987. Divide by 0.9987: 6.00 : 12.00 : 1. So C₆H₁₂O, which is also the molecular formula.", "h": "When the ratio comes out clean, stop. Do not multiply further."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.53 Exercise 2", "q": "Mebutamate contains 51.70 % C, 8.68 % H, 12.06 % N and 27.55 % O (C = 12.011, H = 1.0079, N = 14.0067, O = 15.999). Its empirical formula is:", "o": ["C₅H₁₀NO₂", "C₅H₁₀N₂O₂", "C₅H₅NO", "C₁₀H₂₀N₂O₄"], "a": 0, "e": "Moles: C 4.304, H 8.612, N 0.861, O 1.722. Divide by 0.861: 5 : 10 : 1 : 2. The formula C₁₀H₂₀N₂O₄ is the molecular formula, which is twice the empirical one.", "h": "Empirical means simplest ratio, so never quote a formula that can still be divided down."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.53 Exercise 3", "q": "A compound contains 19.3 % C, 2.5 % H and 11.69 % N (C = 12.011, H = 1.0079, N = 14.0067). Based only on these three elements, the C : H : N mole ratio is closest to:", "o": ["1 : 1 : 1", "3 : 4 : 2", "1 : 2 : 1", "2 : 3 : 1"], "a": 3, "e": "Moles: C 1.607, H 2.48, N 0.835. Divide by 0.835: C 1.92, H 2.97, N 1. That is 2 : 3 : 1. ⚠ The three percentages only add up to 33.5 %, so the rest of the compound is another element the book left out. Without it you cannot give the true empirical formula.", "h": "⚠ TRAP: check that the percentages add up to 100 before you start."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.53 Exercise 4", "q": "Ascorbic acid (vitamin C) contains 40.91 % C, 4.58 % H and 54.51 % O. Its empirical formula is:", "o": ["CH₂O", "C₆H₈O₆", "C₃H₃O₃", "C₃H₄O₃"], "a": 3, "e": "Moles: C 3.409, H 4.58, O 3.407. Divide by 3.407: 1 : 1.344 : 1. 1.344 is close to 4/3, so multiply by 3 to get 3 : 4 : 3. C₃H₄O₃. The real vitamin C is C₆H₈O₆.", "h": "⚠ TRAP: a ratio of 1.33 means multiply by 3, do not round to 1."}, {"ch": 5, "k": "example", "s": "Ch6 p.54-55 Example 1", "q": "A 0.10 g sample of an alcohol (C, H and O only) burns to give 0.1910 g CO₂ and 0.1172 g H₂O (C = 12, H = 1, O = 16). The empirical formula is:", "o": ["C₃H₈O", "C₂H₄O", "C₂H₆O", "CH₃O"], "a": 2, "e": "C = 0.1910 × 12/44 = 0.0521 g. H = 0.1172 × 2/18 = 0.0130 g. O by difference = 0.10 − 0.0651 = 0.0349 g. Moles: C 0.00434, H 0.0130, O 0.00218. Divide by 0.00218: 2 : 6 : 1. C₂H₆O. ⚠ The book prints 0.1772 g in one line, but the data (and the answer) use 0.1172 g.", "h": "Combustion: CO₂ gives the carbon, H₂O gives the hydrogen, oxygen is found by difference."}, {"ch": 5, "k": "example", "s": "Ch6 p.54-55 Example 1", "q": "In the combustion analysis above, how is the mass of oxygen in the alcohol found?", "o": ["Sample mass minus mass of C and H", "By adding the masses of CO₂ and H₂O", "From the mass of CO₂ only", "From the mass of H₂O only"], "a": 0, "e": "The oxygen in the CO₂ and H₂O partly comes from the O₂ gas used for burning, so you cannot read it from the products. You subtract C and H from the sample mass.", "h": "⚠ TRAP: never get O from the products. Use difference."}, {"ch": 5, "k": "example", "s": "Ch6 p.56 Example 2", "q": "A gas contains 2.34 g of N and 5.34 g of O (N = 14, O = 16). Its empirical formula is:", "o": ["NO", "N₂O₅", "N₂O", "NO₂"], "a": 3, "e": "Moles: N 2.34/14 = 0.167, O 5.34/16 = 0.334. Divide by 0.167: 1 : 2. So NO₂.", "h": "If you are given masses, skip the percent step and go straight to moles."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.56 Exercise", "q": "A hydrocarbon burns to give 3.007 g CO₂ and 1.845 g H₂O. Its empirical formula is:", "o": ["CH₂", "C₂H₅", "CH₃", "CH₄"], "a": 2, "e": "C = 3.007 × 12/44 = 0.8201 g, which is 0.06834 mol. H = 1.845 × 2/18 = 0.2050 g, which is 0.2050 mol. Ratio H : C = 3.00, so CH₃ (really C₂H₆, ethane). ⚠ The book says the sample was 25 g, but C + H come to only 1.025 g, so the sample mass must be about 1.025 g.", "h": "⚠ TRAP: in hydrocarbon burning, C mass + H mass must equal the sample mass. Use that to spot wrong data."}, {"ch": 5, "k": "example", "s": "Ch6 p.57 Example", "q": "Fruit sugar has a molar mass of 180.2 and empirical formula CH₂O. Its molecular formula is:", "o": ["CH₂O", "C₆H₁₂O₆", "C₁₂H₂₄O₁₂", "C₃H₆O₃"], "a": 1, "e": "Empirical mass = 12 + 2 + 16 = 30. n = 180.2 ÷ 30 = 6.007, which is 6. (CH₂O)₆ = C₆H₁₂O₆.", "h": "n = molar mass ÷ empirical mass; n must be a whole number."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.57 Exercise 1", "q": "Adenine has a molar mass of 135.1 and consists of 44.45 % C, 3.73 % H and 52.82 % N. Its molecular formula is:", "o": ["C₁₀H₁₀N₁₀", "C₂H₂N₂", "C₅H₅N₅", "CHN"], "a": 2, "e": "Moles: C 3.70, H 3.70, N 3.77. Ratio 1 : 1 : 1, so empirical CHN with mass 27.0. n = 135.1 ÷ 27.0 = 5. C₅H₅N₅.", "h": "Do the empirical formula first, then n."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.57 Exercise 2", "q": "A compound has 49.02 % C, 2.74 % H and 48.24 % Cl, and a molar mass of 147.0 (Cl = 35.45). Its molecular formula is:", "o": ["C₆H₄Cl₂", "C₃H₂Cl₂", "C₆H₄Cl", "C₃H₂Cl"], "a": 0, "e": "Moles: C 4.08, H 2.72, Cl 1.36. Divide by 1.36: 3 : 2 : 1. Empirical C₃H₂Cl has mass 73.45. 147.0 ÷ 73.45 = 2, so C₆H₄Cl₂.", "h": "Check by adding up: C₆H₄Cl₂ = 72 + 4 + 70.9 = 146.9."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.57 Exercise 3", "q": "The empirical formula of hydroquinone is C₃H₃O. If its molar mass is 110, its molecular formula is:", "o": ["C₃H₃O", "C₆H₆O", "C₆H₆O₂", "C₉H₉O₃"], "a": 2, "e": "Empirical mass = 36 + 3 + 16 = 55. n = 110 ÷ 55 = 2. C₆H₆O₂.", "h": "Quick check: 110 is exactly 2 × 55."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.58 Exercise 4", "q": "Ethylene (28.0 g/mol), cyclohexane (84.0 g/mol) and 1-pentene (70.0 g/mol) all have the empirical formula CH₂. Their molecular formulae are respectively:", "o": ["C₂H₄, C₆H₁₂, C₅H₁₀", "CH₂, C₃H₆, C₅H₁₀", "C₂H₄, C₅H₁₀, C₆H₁₂", "C₂H₄, C₆H₁₂, C₄H₈"], "a": 0, "e": "CH₂ = 14. n = 28/14 = 2, 84/14 = 6, 70/14 = 5. So C₂H₄, C₆H₁₂, C₅H₁₀.", "h": "Divide each molar mass by 14."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.58 Exercise 5", "q": "A liquid has empirical formula NO₂ and molar mass 92.0. Its molecular formula is:", "o": ["NO₂", "N₂O₂", "N₄O₈", "N₂O₄"], "a": 3, "e": "NO₂ = 46. 92 ÷ 46 = 2, so N₂O₄.", "h": "Brown NO₂ dimerises to colourless N₂O₄."}, {"ch": 5, "k": "example", "s": "Ch6 p.58 Example", "q": "How many moles of CO₂ are produced when 4.30 mol of C₆H₆ burns completely? (2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O)", "o": ["12.9 mol", "51.6 mol", "25.8 mol", "8.60 mol"], "a": 2, "e": "2 mol C₆H₆ give 12 mol CO₂, so 4.30 × 12/2 = 25.8 mol. ⚠ The book’s working line writes 4.60 mol by mistake; the data is 4.30 mol.", "h": "Mole ratio = coefficient ratio, 6 CO₂ per C₆H₆."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.58 Exercise 1", "q": "How many moles of H₂O are produced from 0.40 mol of C₆H₆ in 2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O?", "o": ["2.4 mol", "0.13 mol", "0.40 mol", "1.2 mol"], "a": 3, "e": "0.40 × 6/2 = 1.2 mol H₂O.", "h": "Three H₂O per C₆H₆."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.59 Exercise 2", "q": "What mass of HCl is produced from 15.0 g of PCl₃ in PCl₃ + 3H₂O → 3HCl + H₃PO₃? (P = 31, Cl = 35.5, H = 1)", "o": ["3.98 g", "35.8 g", "5.97 g", "11.9 g"], "a": 3, "e": "PCl₃ = 137.5 g/mol, so 15.0 g = 0.1091 mol. × 3 gives 0.3273 mol HCl × 36.5 = 11.9 g. Without the ×3 you get 3.98 g. ⚠ The book calls the reactant “phosphorous tetrachloride”, but PCl₃ is phosphorus trichloride.", "h": "⚠ TRAP: HCl comes in threes. Use the equation, not the name."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.59 Exercise 3", "q": "What mass of Al is required to produce 4.0 g of H₂ in 2Al + 3H₂SO₄ → Al₂(SO₄)₃ + 3H₂? (Al = 27, H = 1)", "o": ["36 g", "18 g", "27 g", "54 g"], "a": 0, "e": "4.0 g H₂ = 2.0 mol. Al : H₂ = 2 : 3, so Al = 2.0 × 2/3 = 1.333 mol × 27 = 36 g. ⚠ The book’s printed equation shows the H₂ coefficient clumsily; with 3H₂ the answer is 36 g.", "h": "Convert grams → moles → ratio → grams."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.59 Exercise 4", "q": "How many grams of CO₂ form when 73.9 g of propane burns? (C₃H₈ + 5O₂ → 3CO₂ + 4H₂O)", "o": ["221.7 g", "110.9 g", "73.9 g", "24.6 g"], "a": 0, "e": "Propane = 44 g/mol, so 73.9 g = 1.680 mol. CO₂ = 3 × 1.680 = 5.039 mol × 44 = 221.7 g. Notice CO₂ has the same molar mass as propane, so the answer is exactly 3 × 73.9.", "h": "Because M(C₃H₈) = M(CO₂) = 44, the mass is simply tripled."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.59 Exercise 5", "q": "How many grams of oxygen can be obtained from 2.50 g of KClO₃ (K = 39, Cl = 35.5, O = 16) in 2KClO₃ → 2KCl + 3O₂?", "o": ["0.65 g", "0.98 g", "2.50 g", "1.47 g"], "a": 1, "e": "KClO₃ = 122.5 g/mol, so 2.50 g = 0.02041 mol. O₂ = 0.02041 × 3/2 = 0.03061 mol × 32 = 0.98 g.", "h": "3 O₂ per 2 KClO₃ means ×1.5."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.70 Exercise 2", "q": "What mass of CO and H₂ are needed to make 5.0 kg of CH₃OH in CO + 2H₂ → CH₃OH? (C = 12, H = 1, O = 16)", "o": ["5.0 kg CO and 0.625 kg H₂", "4.375 kg CO and 0.625 kg H₂", "4.375 kg CO and 1.25 kg H₂", "2.5 kg CO and 2.5 kg H₂"], "a": 1, "e": "CH₃OH = 32 g/mol, so 5000 g = 156.25 mol. CO = 156.25 mol × 28 = 4375 g. H₂ = 2 × 156.25 = 312.5 mol × 2 = 625 g. Check: 4375 + 625 = 5000 g.", "h": "Check by conservation of mass: reactants must add up to the product mass."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 4a", "q": "How many grams of KClO₃ must react to produce 4.00 mol of O₂ (2KClO₃ → 2KCl + 3O₂)?", "o": ["327 g", "490 g", "122.5 g", "218 g"], "a": 0, "e": "KClO₃ = 2/3 × 4.00 = 2.667 mol × 122.5 = 326.7 g.", "h": "Go from the wanted product back to the reactant."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 4b", "q": "How many grams of O₂ come from the complete decomposition of 9.25 g of KClO₃?", "o": ["6.04 g", "3.62 g", "9.25 g", "2.41 g"], "a": 1, "e": "9.25 ÷ 122.5 = 0.07551 mol. × 3/2 = 0.1133 mol O₂ × 32 = 3.62 g.", "h": "Multiply by 1.5, not 2/3, when going from KClO₃ to O₂."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 4c", "q": "How many moles of KClO₃ must decompose to prepare 12.0 g of O₂?", "o": ["0.56 mol", "0.25 mol", "0.14 mol", "0.375 mol"], "a": 1, "e": "12.0 g O₂ = 0.375 mol. KClO₃ = 0.375 × 2/3 = 0.25 mol.", "h": "Always check the direction of the ratio."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 4d", "q": "How many grams of KCl are produced when 11.0 g of O₂ forms in the same reaction? (K = 39, Cl = 35.5)", "o": ["17.1 g", "25.6 g", "34.1 g", "11.0 g"], "a": 0, "e": "11.0 g O₂ = 0.3438 mol. KCl : O₂ = 2 : 3, so KCl = 0.2292 mol × 74.5 = 17.1 g.", "h": "KCl = 74.5 g/mol."}, {"ch": 5, "k": "example", "s": "Ch6 p.60 Example 1", "q": "5.0 mol of Ba reacts with 12.0 mol of water in Ba + 2H₂O → Ba(OH)₂ + H₂. The limiting reagent is:", "o": ["H₂", "Ba", "H₂O", "Ba(OH)₂"], "a": 1, "e": "5.0 mol Ba needs 10 mol H₂O, and 12 mol is available, so Ba runs out first.", "h": "Work out how much of B is needed to use up all of A."}, {"ch": 5, "k": "example", "s": "Ch6 p.60 Example 1", "q": "In the Ba + 2H₂O reaction (5.0 mol Ba, 12.0 mol water), the amount of water left unreacted is:", "o": ["7.0 mol", "2.0 mol", "5.0 mol", "10 mol"], "a": 1, "e": "Water used = 10 mol, so 12 − 10 = 2.0 mol is left over.", "h": "Excess = supplied − used."}, {"ch": 5, "k": "example", "s": "Ch6 p.60-61 Example 2", "q": "25.0 g of N₂ reacts with 5.0 g of H₂ (N = 14, H = 1) in N₂ + 3H₂ → 2NH₃. The limiting reagent is:", "o": ["H₂", "Both are used up exactly", "N₂", "NH₃"], "a": 0, "e": "25 g N₂ would need 5.357 g H₂, but only 5.0 g is available, so H₂ runs out first. Note that H₂ is limiting even though it has far more moles (2.5 mol) than N₂ (0.89 mol). It needs 3 mol for every 1 mol of N₂.", "h": "⚠ TRAP: the one with more moles or the bigger mass is not automatically in excess."}, {"ch": 5, "k": "example", "s": "Ch6 p.61 Example 2", "q": "From the same reaction (25.0 g N₂, 5.0 g H₂), the mass of NH₃ that forms is:", "o": ["34.0 g", "28.33 g", "30.36 g", "56.7 g"], "a": 1, "e": "Base the calculation on the limiting reagent, H₂: 6 g H₂ gives 34 g NH₃, so 5.0 g gives 5/6 × 34 = 28.33 g. The 30.36 g would come from N₂ (25 g × 34/28 = 30.36 g), but N₂ is in excess.", "h": "Product is always based on the limiting reagent."}, {"ch": 5, "k": "example", "s": "Ch6 p.61 Example 2", "q": "In the same reaction, the mass of N₂ left over after H₂ is used up is about:", "o": ["20.0 g", "23.33 g", "1.67 g", "5.36 g"], "a": 2, "e": "H₂ used = 5.0 g, which takes 5/6 × 28 = 23.33 g N₂. Left over = 25.0 − 23.33 = 1.67 g.", "h": "Excess = start − used."}, {"ch": 5, "k": "example", "s": "Ch6 p.61-62 Example", "q": "40.00 g of Mg reacts with 17.00 g of N₂ in 3Mg + N₂ → Mg₃N₂ (Mg = 24.3, N = 14). The limiting reagent is:", "o": ["Mg", "Mg₃N₂", "N₂", "Neither"], "a": 0, "e": "Mg = 1.646 mol. N₂ = 17.00/28 = 0.607 mol. Mg needs 3 × 0.607 = 1.82 mol of itself to use up the N₂, but only 1.646 mol is available. So Mg is limiting. ⚠ The book mixed up the figures (27.9 g instead of 72.9 g for 3 mol Mg) and claimed N₂ was limiting.", "h": "⚠ TRAP: 3 mol Mg = 72.9 g, not 27.9 g. A slip here flips the answer."}, {"ch": 5, "k": "example", "s": "Ch6 p.61-62 Example", "q": "In the Mg + N₂ reaction (40.00 g Mg, 17.00 g N₂), the correct theoretical yield of Mg₃N₂ (100.9 g/mol) is:", "o": ["100.9 g", "61.26 g", "55.36 g", "30.30 g"], "a": 2, "e": "Mg limiting: 1.646 mol ÷ 3 = 0.5487 mol Mg₃N₂ × 100.9 = 55.36 g. The book got 61.26 g by taking N₂ as limiting (17/28 × 100.9).", "h": "Theoretical yield comes from the TRUE limiting reagent."}, {"ch": 5, "k": "example", "s": "Ch6 p.62 Example", "q": "In the same reaction, the mass of the excess N₂ that remains is about:", "o": ["0 g", "15.4 g", "1.64 g", "13.1 g"], "a": 2, "e": "N₂ used = 0.5487 mol × 28 = 15.36 g. Left = 17.00 − 15.36 = 1.64 g.", "h": "Mg is limiting, so N₂ is the excess one."}, {"ch": 5, "k": "example", "s": "Ch6 p.62-63 Example", "q": "The book gets 96.32 % yield for Mg₃N₂ from the percent yield formula. Which formula did it use?", "o": ["Theoretical yield ÷ actual yield × 100", "Actual yield ÷ theoretical yield × 100", "Limiting reagent ÷ excess reagent × 100", "(Actual − theoretical) ÷ theoretical × 100"], "a": 1, "e": "% yield = actual ÷ theoretical × 100. The book used 59.01 g ÷ 61.26 g × 100 = 96.32 %. ⚠ The question also writes the actual yield as 59.01 mg while the solution uses g, and with the correct theoretical yield (55.36 g) 59.01 g would give over 100 %, which is impossible.", "h": "⚠ TRAP: percent yield can never be above 100 %. If it is, check the limiting reagent or the units."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.63 Exercise 1", "q": "Which is the more effective antacid: 0.50 g of NaHCO₃ or 0.50 g of Mg(OH)₂ (Na = 23, H = 1, C = 12, O = 16, Mg = 24.3)? Reaction with HCl: NaHCO₃ takes 1 HCl per mole, Mg(OH)₂ takes 2.", "o": ["Mg(OH)₂", "Cannot tell without the volume of acid", "Both are equally effective", "NaHCO₃"], "a": 0, "e": "NaHCO₃ = 84 g/mol, so 0.50 g = 0.00595 mol, neutralising 0.00595 mol HCl. Mg(OH)₂ = 58.3 g/mol, so 0.50 g = 0.00858 mol, neutralising 2 × 0.00858 = 0.01715 mol HCl. That is nearly 3 times more. ⚠ The book writes the first compound as “Na₂HCO₃”; the right formula is NaHCO₃ (sodium hydrogencarbonate).", "h": "The better antacid neutralises more moles of acid per gram."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.63 Exercise 1", "q": "How many moles of HCl does 0.50 g of Mg(OH)₂ (58.3 g/mol) neutralise?", "o": ["0.0086 mol", "0.0172 mol", "0.0060 mol", "0.50 mol"], "a": 1, "e": "0.50 ÷ 58.3 = 0.00858 mol. × 2 = 0.0172 mol.", "h": "2 HCl per Mg(OH)₂."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.63 Exercise 2", "q": "12.0 g of HCl is mixed with 14.5 g of FeS in FeS + 2HCl → FeCl₂ + H₂S (H = 1, Cl = 35.5, Fe = 56, S = 32). The mass of H₂S that can form is:", "o": ["5.59 g", "12.0 g", "5.60 g", "11.2 g"], "a": 0, "e": "HCl = 12.0/36.5 = 0.3288 mol. FeS = 14.5/88 = 0.1648 mol, which would need 0.3295 mol HCl. HCl is just short, so HCl is limiting. H₂S = 0.3288/2 = 0.1644 mol × 34 = 5.59 g. FeS would suggest 5.60 g, so the two are very close and you must be careful with the sums. ⚠ The book writes the product as FeCl; it is FeCl₂.", "h": "⚠ TRAP: two limiting-reagent answers can differ by only 0.01 g. Compare moles needed vs moles available."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.63 Exercise 2", "q": "In the FeS + 2HCl reaction (12.0 g HCl, 14.5 g FeS), the limiting reagent is:", "o": ["HCl", "FeCl₂", "FeS", "H₂S"], "a": 0, "e": "FeS needs 0.3295 mol HCl but only 0.3288 mol is available.", "h": "Tiny difference, same method."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.63 Exercise 3", "q": "What mass of acetic acid (60 g/mol) is needed to make 150 g of ethyl acetate (88 g/mol) if the percent yield is 80 % and ethanol is in excess?", "o": ["136.4 g", "102.3 g", "81.8 g", "127.8 g"], "a": 3, "e": "At 80 % yield you must aim for a higher theoretical yield: 150 ÷ 0.80 = 187.5 g ester = 2.131 mol. 1 : 1 ratio, so acetic acid = 2.131 × 60 = 127.8 g. If you ignored the yield you would get 102.3 g.", "h": "⚠ TRAP: yield below 100 % means you need MORE reactant, divide by the fraction."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.64 Exercise 4", "q": "15.0 g of isopentyl alcohol (88 g/mol) reacts with 26.9 g of acetic acid (60 g/mol) in a 1 : 1 reaction to give isopentyl acetate (130 g/mol). The theoretical yield of the ester is:", "o": ["52.0 g", "45.0 g", "19.5 g", "22.2 g"], "a": 3, "e": "Alcohol = 15.0/88 = 0.1705 mol. Acid = 26.9/60 = 0.4483 mol. Alcohol is limiting. Ester = 0.1705 × 130 = 22.2 g. The 52.0 g would come from the acid, which is in excess.", "h": "Compare moles, then choose the smaller."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.64 Exercise 4ii", "q": "If the yield of the isopentyl acetate reaction is 80 %, the actual yield is:", "o": ["17.7 g", "22.2 g", "12.5 g", "27.7 g"], "a": 0, "e": "Actual = 0.80 × 22.2 = 17.7 g. ⚠ The book says “actual yield of isopentyl alcohol”, but alcohol is a reactant. It means the ester product.", "h": "Actual = % yield × theoretical."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.64 Exercise 5a", "q": "50.0 g of toluene (C₇H₈, 92 g/mol) and 100.0 g of HNO₃ (63 g/mol) react: C₇H₈ + 3HNO₃ → C₇H₅(NO₂)₃ + 3H₂O. The theoretical yield of TNT (227 g/mol) is:", "o": ["123.4 g", "227 g", "75.8 g", "120.1 g"], "a": 3, "e": "Toluene = 0.5435 mol needs 1.630 mol HNO₃, but only 1.587 mol is present. So HNO₃ is limiting. TNT = 1.587/3 × 227 = 120.1 g. Taking toluene as limiting would give 123.4 g.", "h": "⚠ TRAP: the 3 in front of HNO₃ shifts the limiting reagent."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.64 Exercise 5b", "q": "If 105.0 g of TNT is actually obtained from the above reaction (theoretical 120.1 g), the percent yield is:", "o": ["85.1 %", "114.4 %", "105 %", "87.4 %"], "a": 3, "e": "105.0 ÷ 120.1 × 100 = 87.4 %.", "h": "Use the right theoretical yield."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 7", "q": "CS₂ + 3Cl₂ → CCl₄ + S₂Cl₂. 20.0 g of CS₂ (76 g/mol) and 24.0 g of Cl₂ (71 g/mol) give 12.3 g of CCl₄ (154 g/mol). The percent yield is:", "o": ["46.7 %", "70.9 %", "100 %", "61.5 %"], "a": 1, "e": "CS₂ = 0.263 mol. Cl₂ = 0.338 mol, but 3 mol Cl₂ is needed per CS₂, so Cl₂ is limiting. CCl₄ = 0.338/3 = 0.1127 mol × 154 = 17.35 g. Yield = 12.3/17.35 × 100 = 70.9 %. (The book does not print the balanced equation.)", "h": "Cl₂ is the limiting reagent: the 3 makes it run out."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 8a", "q": "130.0 g of Fe₂O₃ (160 g/mol) reacts with 130.0 g of CO (28 g/mol): Fe₂O₃ + 3CO → 2Fe + 3CO₂. The maximum mass of Fe formed (Fe = 56) is:", "o": ["45.5 g", "91.0 g", "182 g", "121 g"], "a": 1, "e": "Fe₂O₃ = 0.8125 mol, CO = 4.643 mol. Fe₂O₃ needs only 2.4375 mol CO, so Fe₂O₃ is limiting. Fe = 2 × 0.8125 = 1.625 mol × 56 = 91.0 g.", "h": "Limiting reagent first, then product."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 8b", "q": "In the same reaction, the excess reagent and the mass left over are:", "o": ["CO, 61.7 g", "CO, 2.2 g", "Fe₂O₃, 61.7 g", "CO, 130.0 g"], "a": 0, "e": "CO used = 3 × 0.8125 = 2.4375 mol = 68.25 g. Left over = 130.0 − 68.25 = 61.75 g, which is about 61.7 g. The 2.2 g is the number of moles, not the mass.", "h": "⚠ TRAP: a mol answer is not a gram answer. Read the unit asked for."}, {"ch": 5, "k": "example", "s": "Ch6 p.64-65 Example 1", "q": "What is the molarity of a solution made by dissolving 13.5 g of NaOH in enough water to make 2500 mL? (Na = 23, O = 16, H = 1)", "o": ["5.4 M", "0.0054 M", "0.135 M", "0.338 M"], "a": 2, "e": "Moles = 13.5 ÷ 40 = 0.3375 mol. Volume = 2.5 L. M = 0.3375 ÷ 2.5 = 0.135 M. Forgetting to convert mL to L gives 0.000135 and not dividing by 40 gives 5.4.", "h": "⚠ TRAP: convert mL to litres first. 2500 mL = 2.5 L."}, {"ch": 5, "k": "example", "s": "Ch6 p.65 Example 2a", "q": "The concentrations of the ions in 0.50 M K₂SO₄ are:", "o": ["0.50 M K⁺ and 1.0 M SO₄²⁻", "0.50 M K⁺ and 0.50 M SO₄²⁻", "1.0 M K⁺ and 0.50 M SO₄²⁻", "1.5 M K⁺ and 0.50 M SO₄²⁻"], "a": 2, "e": "K₂SO₄ → 2K⁺ + SO₄²⁻. Two K⁺ per formula unit gives 2 × 0.50 = 1.0 M. The sulphate is 0.50 M. ⚠ The book prints the sulphate ion without its charge.", "h": "Subscript in front of an ion multiplies its concentration."}, {"ch": 5, "k": "example", "s": "Ch6 p.65 Example 2b", "q": "The concentration of Cl⁻ in 2.0 M HCl is:", "o": ["4.0 M", "2.0 M", "1.0 M", "0.5 M"], "a": 1, "e": "HCl is a strong acid that dissociates completely into H⁺ and Cl⁻ in a 1 : 1 ratio, so 2.0 M each.", "h": "1 : 1 salt gives equal ion concentrations."}, {"ch": 5, "k": "example", "s": "Ch6 p.66 Example 3", "q": "How many moles of Na⁺ are in 15 cm³ of 0.8 M NaCl?", "o": ["0.8 mol", "12 mol", "0.012 mol", "0.024 mol"], "a": 2, "e": "15/1000 × 0.8 = 0.012 mol NaCl, giving 0.012 mol Na⁺ and 0.012 mol Cl⁻.", "h": "Moles = M × V (in litres)."}, {"ch": 5, "k": "example", "s": "Ch6 p.66 Example 4", "q": "What mass of HNO₃ (63 g/mol) is in 300 mL of 0.30 M HNO₃?", "o": ["5.67 g", "0.09 g", "2.1 g", "18.9 g"], "a": 0, "e": "0.30 × 0.300 = 0.09 mol × 63 = 5.67 g.", "h": "mass = M × V(L) × molar mass."}, {"ch": 5, "k": "example", "s": "Ch6 p.67 Percent Example 1", "q": "What is the percentage by mass (m/m) of NaCl in a solution of 1.5 g NaCl in 45 g water?", "o": ["1.5 %", "3.23 %", "30 %", "3.33 %"], "a": 1, "e": "Mass of solution = 1.5 + 45 = 46.5 g. 1.5/46.5 × 100 = 3.23 %. Dividing by the water only (3.33 %) is the usual slip.", "h": "⚠ TRAP: the denominator is the whole solution, not the solvent."}, {"ch": 5, "k": "example", "s": "Ch6 p.67 Percent Example 2", "q": "What is the mass percent of ethanol in a solution of 2.0 g ethanol in 110.0 g water?", "o": ["2.0 %", "55 %", "1.786 %", "1.818 %"], "a": 2, "e": "2.0 ÷ 112.0 × 100 = 1.786 %.", "h": "Add solute and solvent first."}, {"ch": 5, "k": "example", "s": "Ch6 p.68 Example 1", "q": "25.0 g of I₂ (254 g/mol) is dissolved in 200 g of CCl₄. The molality is:", "o": ["0.39 m", "0.49 m", "0.098 m", "2.45 m"], "a": 1, "e": "25/254 = 0.0984 mol. 200 g = 0.200 kg. m = 0.0984 ÷ 0.200 = 0.49 mol/kg.", "h": "Molality = moles per kg of SOLVENT."}, {"ch": 5, "k": "example", "s": "Ch6 p.68-69 Example 2", "q": "A 1.65 M H₂SO₄ solution (98 g/mol) has a density of 1.29 g/mL. Its molality is:", "o": ["0.83 m", "1.28 m", "1.46 m", "1.65 m"], "a": 2, "e": "1000 mL weighs 1290 g. H₂SO₄ = 1.65 × 98 = 161.7 g. Water = 1290 − 161.7 = 1128.3 g = 1.1283 kg. m = 1.65 ÷ 1.1283 = 1.46. ⚠ The book mislabels the density unit as g/mol and the final unit as M; it should be g/mL and m.", "h": "Mass of solvent = mass of solution − mass of solute."}, {"ch": 5, "k": "example", "s": "Ch6 p.69 Example", "q": "What is the mole fraction of glucose (180 g/mol) in a 30 % (m/m) aqueous glucose solution? (H₂O = 18 g/mol)", "o": ["0.04", "0.17", "0.96", "0.30"], "a": 0, "e": "100 g solution has 30 g glucose (0.167 mol) and 70 g water (3.89 mol). x = 0.167 ÷ (0.167 + 3.89) = 0.041. The 0.96 is the mole fraction of water.", "h": "Mole fractions of all components add up to 1."}, {"ch": 5, "k": "example", "s": "Ch6 p.70 Example", "q": "How do you prepare 500 mL of 2.0 M acetic acid from a 16.0 M stock?", "o": ["Add 62.5 mL of stock to 500 mL of water", "Pipette 62.5 mL of stock into a 500 mL flask and make up to the mark with water", "Pipette 250 mL of stock into 500 mL flask and make up to the mark", "Add 437.5 mL of stock to 62.5 mL of water"], "a": 1, "e": "M₁V₁ = M₂V₂, so V₁ = 2.0 × 500 ÷ 16.0 = 62.5 mL. The final volume must be 500 mL, so you dilute up to the mark in a volumetric flask. ⚠ Adding 62.5 mL to 500 mL of water makes 562.5 mL and the concentration would be wrong.", "h": "⚠ TRAP: “make up to the mark” means the FINAL volume is 500 mL."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.70 Exercise 1", "q": "What volume of 5.0 M HCl is needed to prepare 0.70 L of 0.10 M HCl?", "o": ["0.14 mL", "35 mL", "7.0 mL", "14 mL"], "a": 3, "e": "V₁ = M₂V₂ ÷ M₁ = 0.10 × 700 ÷ 5.0 = 14 mL.", "h": "Use the same unit for V₁ and V₂."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.70 Exercise 3", "q": "What mass of water must be added to 425 g of formaldehyde to prepare a 50 % (w/w) solution?", "o": ["850 g", "425 g", "212.5 g", "50 g"], "a": 1, "e": "For 50 % w/w, solute mass = solvent mass, so 425 g of water is needed. Total solution is 850 g.", "h": "50 % w/w means solute = solvent in mass."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 9a", "q": "A 26.0 % (m/m) KI solution has a density of 1.30 g/mL. How many grams of KI are in 70.0 mL of it?", "o": ["26.0 g", "23.7 g", "91.0 g", "18.2 g"], "a": 1, "e": "70.0 mL × 1.30 = 91.0 g solution. KI = 0.260 × 91.0 = 23.7 g. Forgetting the density gives 18.2 g.", "h": "Volume × density first to get mass of solution."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 9b", "q": "How many grams of the same KI solution (26.0 % m/m) contain 25.0 g of KI?", "o": ["6.5 g", "96.2 g", "25.0 g", "125 g"], "a": 1, "e": "25.0 ÷ 0.260 = 96.2 g of solution.", "h": "Divide solute mass by the fraction."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 9c", "q": "How many mL of the same KI solution (26.0 % m/m, density 1.30 g/mL) contain 20.0 g of KI?", "o": ["5.2 mL", "20.0 mL", "76.9 mL", "59.2 mL"], "a": 3, "e": "20.0 ÷ 0.260 = 76.92 g solution. ÷ 1.30 g/mL = 59.2 mL. The 76.9 is the mass, not the volume. ⚠ The book writes KL by mistake for KI.", "h": "⚠ TRAP: final step is mass ÷ density to get volume."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.71 Exercise 10", "q": "What is the % (m/m) of HNO₃ (63 g/mol) in a 3.0 molal solution?", "o": ["31.5 %", "3.0 %", "18.9 %", "15.9 %"], "a": 3, "e": "3.0 m means 3.0 mol (189 g) in 1000 g water. Total mass = 1189 g. 189/1189 × 100 = 15.9 %. The 18.9 comes from dividing by the water only.", "h": "Add the solute to the solvent for the total mass."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.72 Exercise 11i", "q": "How many moles of CaCl₂ are in 13.05 mL of 3.00 M CaCl₂?", "o": ["0.0392 mol", "0.00435 mol", "39.2 mol", "0.235 mol"], "a": 0, "e": "13.05 mL = 0.01305 L. 0.01305 × 3.00 = 0.03915 mol. Not converting mL to L gives 39.2.", "h": "Moles = M × V in litres."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.72 Exercise 11ii", "q": "How many moles of (NH₄)₂SO₄ are in 1,200 mL of 0.25 M solution?", "o": ["0.30 mol", "300 mol", "0.21 mol", "4.8 mol"], "a": 0, "e": "1.200 L × 0.25 M = 0.30 mol.", "h": "1200 mL is 1.2 L."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.72 Exercise 11iii", "q": "How many moles of HCl are in 180 mL of 0.21 M HCl?", "o": ["0.038 mol", "38 mol", "0.0038 mol", "0.86 mol"], "a": 0, "e": "0.180 × 0.21 = 0.0378 mol, about 0.038 mol.", "h": "Always change mL to L first."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.72 Exercise 12a", "q": "Concentrated HCl is 37.0 % (m/m) with density 1.19 g/mL (HCl = 36.5 g/mol). Its molarity is:", "o": ["37.0 M", "10.1 M", "16.1 M", "12.1 M"], "a": 3, "e": "1 L weighs 1190 g. HCl = 0.370 × 1190 = 440.3 g = 12.06 mol. So 12.1 M.", "h": "Molarity = (% × density × 10) ÷ molar mass."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.72 Exercise 12b", "q": "For the same concentrated HCl (37.0 % m/m, 1.19 g/mL), the molality is:", "o": ["12.1 m", "1.01 m", "16.1 m", "10.1 m"], "a": 2, "e": "Take 100 g: 37.0 g HCl = 1.014 mol, water = 63.0 g = 0.0630 kg. m = 1.014 ÷ 0.0630 = 16.1 mol/kg. Molality is bigger than molarity here because the solvent mass is smaller than the solution volume in kg terms.", "h": "Use 100 g of solution as the basis."}, {"ch": 5, "k": "exercise", "s": "Ch6 p.72 Exercise 12c", "q": "For the same HCl (37.0 % m/m), the mole fraction of HCl is:", "o": ["0.0630", "0.775", "0.370", "0.225"], "a": 3, "e": "100 g solution: HCl = 1.014 mol; water = 63.0/18 = 3.50 mol. x = 1.014 ÷ 4.514 = 0.225.", "h": "Do not use mass fraction in place of mole fraction."}, {"ch": 5, "k": "concept", "s": "Ch6 p.51", "q": "Which of these is NOT allowed when balancing a chemical equation?", "o": ["Multiplying every coefficient by the same number", "Placing a coefficient in front of a formula", "Changing a subscript inside a formula", "Using fractions as an intermediate step"], "a": 2, "e": "Subscripts define what the substance is. Change them and you have changed the compound. Only coefficients may be adjusted.", "h": "Coefficients yes, subscripts never."}, {"ch": 5, "k": "concept", "s": "Ch6 p.50", "q": "In a chemical equation the symbol (aq) means:", "o": ["precipitate formed", "dissolved in water", "gas", "heated strongly"], "a": 1, "e": "The book lists (g) gas, (l) liquid, (s) solid, (aq) aqueous solution, Δ or ht heat, and ↓ or ppt precipitate.", "h": "Learn the state symbols, they are free marks."}, {"ch": 5, "k": "concept", "s": "Ch6 p.50", "q": "The symbol ↓ placed beside a product in an equation shows that the product is:", "o": ["a precipitate", "dissolved in water", "a gas escaping", "a liquid"], "a": 0, "e": "↓ (or ppt) marks a solid precipitate. A gas is marked with ↑ or (g).", "h": "↓ falls to the bottom (solid), ↑ goes up (gas)."}, {"ch": 5, "k": "concept", "s": "Ch6 p.50", "q": "Which law is the reason a chemical equation must be balanced?", "o": ["Boyle’s law", "Avogadro’s law", "Conservation of mass", "Law of definite proportions only"], "a": 2, "e": "Atoms are neither created nor destroyed in a reaction, so the number of each kind of atom must be the same on both sides.", "h": "Balanced equation = conservation of mass in action."}, {"ch": 5, "k": "concept", "s": "Ch6 p.52 variant", "q": "Percentage of nitrogen in (NH₄)₂SO₄ (H = 1, N = 14, S = 32, O = 16) is:", "o": ["42.42 %", "10.61 %", "14.00 %", "21.21 %"], "a": 3, "e": "28 ÷ 132 × 100 = 21.21 %. This is why ammonium sulphate is a good nitrogen fertiliser.", "h": "N appears twice in the formula."}, {"ch": 5, "k": "concept", "s": "Ch6 p.52 variant", "q": "Percentage of nitrogen in Ca(NO₃)₂ (Ca = 40, N = 14, O = 16) is:", "o": ["25.45 %", "17.07 %", "8.54 %", "34.15 %"], "a": 1, "e": "Molar mass = 40 + 2(14) + 6(16) = 164. N = 28/164 × 100 = 17.07 %.", "h": "Same bracket trap as the Mg(NO₃)₂ example."}, {"ch": 5, "k": "concept", "s": "Ch6 p.52 variant", "q": "Percentage of carbon in CaCO₃ (Ca = 40, C = 12, O = 16) is:", "o": ["24 %", "12 %", "40 %", "48 %"], "a": 1, "e": "Molar mass = 100, carbon is 12 of the 100 units, so 12 %. Ca is 40 % and O is 48 %.", "h": "CaCO₃ = 100 g/mol, so percent = mass directly."}, {"ch": 5, "k": "concept", "s": "Ch6 p.52 variant", "q": "Percentage of Al in Al₂(SO₄)₃ (Al = 27, S = 32, O = 16) is:", "o": ["27.00 %", "15.79 %", "31.58 %", "7.89 %"], "a": 1, "e": "Molar mass = 54 + 96 + 192 = 342. Al = 54/342 × 100 = 15.79 %.", "h": "Al₂(SO₄)₃: 2 Al, 3 S, 12 O."}, {"ch": 5, "k": "concept", "s": "Ch6 p.54", "q": "Empirical formula of hydrogen peroxide (H₂O₂) is:", "o": ["H₂O", "H₂O₂", "HO₂", "HO"], "a": 3, "e": "Divide the subscripts by their highest common factor, 2. H₂O₂ becomes HO.", "h": "Divide by the HCF."}, {"ch": 5, "k": "concept", "s": "Ch6 p.54", "q": "In calculating an empirical formula you get the mole ratio 1 : 1.5. You should:", "o": ["round 1.5 up to 2 and use 1 : 2", "multiply both by 3 to get 3 : 4.5", "round 1.5 down to 1 and use 1 : 1", "multiply both by 2 to get 2 : 3"], "a": 3, "e": "A decimal of .5 means multiply by 2; .33 or .67 means multiply by 3; .25 or .75 means multiply by 4. Rounding a big gap like 0.5 changes the compound.", "h": "Only round when you are within about 0.1 of a whole number."}, {"ch": 5, "k": "concept", "s": "Ch6 p.54", "q": "A ratio of C : H : O = 1 : 1.33 : 1 is converted to whole numbers by multiplying through by:", "o": ["4", "3", "2", "5"], "a": 1, "e": "1.33 is 4/3, so ×3 gives 3 : 4 : 3.", "h": ".33 → ×3, .5 → ×2, .25 → ×4."}, {"ch": 5, "k": "concept", "s": "Ch6 p.54 variant", "q": "A compound is 40.0 % C, 6.7 % H and 53.3 % O (C = 12, H = 1, O = 16). Its empirical formula is:", "o": ["CH₂O₂", "CH₂O", "C₂H₃O", "CHO"], "a": 1, "e": "Moles: C 3.33, H 6.7, O 3.33. Divide by 3.33: 1 : 2 : 1. CH₂O (glucose, acetic acid and methanal all share it).", "h": "Memorise CH₂O: it is the empirical formula of glucose."}, {"ch": 5, "k": "concept", "s": "Ch6 p.54 variant", "q": "A hydrocarbon is 85.7 % C and 14.3 % H (C = 12, H = 1). Its empirical formula is:", "o": ["C₂H₃", "CH₃", "CH₂", "CH"], "a": 2, "e": "Moles: C 7.14, H 14.3. Divide by 7.14: 1 : 2. CH₂, the empirical formula of every alkene.", "h": "Alkenes and cycloalkanes are all CH₂."}, {"ch": 5, "k": "concept", "s": "Ch6 p.54 variant", "q": "An oxide of iron is 70.0 % Fe and 30.0 % O (Fe = 56, O = 16). Its empirical formula is:", "o": ["FeO₂", "Fe₂O₃", "FeO", "Fe₃O₄"], "a": 1, "e": "Moles: Fe 70/56 = 1.25, O 30/16 = 1.875. Ratio 1 : 1.5, multiply by 2 to get 2 : 3. Fe₂O₃.", "h": "A ratio of 1 : 1.5 always becomes 2 : 3."}, {"ch": 5, "k": "concept", "s": "Ch6 p.54 variant", "q": "A compound of sodium, carbon and oxygen has 43.4 % Na, 11.3 % C and 45.3 % O (Na = 23, C = 12, O = 16). The formula is:", "o": ["Na₂C₂O₃", "Na₂CO₃", "NaCO₃", "NaHCO₃"], "a": 1, "e": "Moles: Na 1.887, C 0.942, O 2.831. Divide by 0.942: 2 : 1 : 3. Na₂CO₃.", "h": "Always divide by the smallest number of moles."}, {"ch": 5, "k": "concept", "s": "Ch6 p.54 variant", "q": "A compound contains 52.2 % C, 13.0 % H and 34.8 % O (C = 12, H = 1, O = 16). Its empirical formula is:", "o": ["C₂H₄O", "C₃H₈O", "C₂H₆O", "CH₃O"], "a": 2, "e": "Moles: C 4.35, H 13.0, O 2.175. Divide by 2.175: 2 : 6 : 1.", "h": "Ethanol and dimethyl ether both give C₂H₆O."}, {"ch": 5, "k": "concept", "s": "Ch6 p.56 variant", "q": "A sample of an oxide contains 3.20 g of S and 4.80 g of O (S = 32, O = 16). The empirical formula is:", "o": ["SO₂", "SO", "SO₃", "S₂O₃"], "a": 2, "e": "Moles: S 0.100, O 0.300. Ratio 1 : 3. SO₃.", "h": "Masses given: divide by atomic mass directly."}, {"ch": 5, "k": "concept", "s": "Ch6 p.54", "q": "What does the empirical formula of a compound tell you?", "o": ["The shape of the molecule", "The molar mass of the compound", "The actual number of atoms in a molecule", "The simplest whole-number ratio of atoms"], "a": 3, "e": "It gives only the ratio. Two different compounds (CH₂O and C₆H₁₂O₆) can share one empirical formula.", "h": "Empirical = simplest ratio; molecular = real count."}, {"ch": 5, "k": "concept", "s": "Ch6 p.57", "q": "The book’s table gives the molecular formula of hydrogen peroxide as N₂O₂ and of hydrazine as H₂N₄. The correct formulae are:", "o": ["H₂O and NH₂", "HO and NH₂", "H₂O₂ and NH₂", "H₂O₂ and N₂H₄"], "a": 3, "e": "⚠ The table has misprints. Hydrogen peroxide is H₂O₂ (empirical HO) and hydrazine is N₂H₄ (empirical NH₂). Do not copy the book’s wrong versions in an exam.", "h": "⚠ TRAP: hydrazine is N₂H₄, not H₂N₄."}, {"ch": 5, "k": "concept", "s": "Ch6 p.57", "q": "Which pair is correctly matched (empirical formula : molecular formula)?", "o": ["CH₂O : C₆H₁₂O₆ (n = 6)", "CH : C₂H₄ (n = 2)", "NH₂ : NH₄ (n = 2)", "HO : H₂O (n = 2)"], "a": 0, "e": "CH₂O × 6 = C₆H₁₂O₆. CH × 2 is C₂H₂, not C₂H₄; NH₂ × 2 is N₂H₄; HO × 2 is H₂O₂.", "h": "Multiply every subscript by n."}, {"ch": 5, "k": "concept", "s": "Ch6 p.57 variant", "q": "A compound has empirical formula CH₂O and molar mass 60. Its molecular formula is:", "o": ["C₄H₈O₄", "CH₂O", "C₂H₄O₂", "C₃H₆O₃"], "a": 2, "e": "60 ÷ 30 = 2, so (CH₂O)₂ = C₂H₄O₂ (acetic acid).", "h": "n = 60/30 = 2."}, {"ch": 5, "k": "concept", "s": "Ch6 p.57 variant", "q": "Benzene has empirical formula CH and molar mass 78. Its molecular formula is:", "o": ["C₂H₂", "C₆H₆", "C₃H₃", "C₆H₁₂"], "a": 1, "e": "CH = 13. 78 ÷ 13 = 6, so C₆H₆.", "h": "Benzene = (CH)₆."}, {"ch": 5, "k": "concept", "s": "Ch6 p.57 variant", "q": "Phosphorus(V) oxide has empirical formula P₂O₅ (142 g/mol per empirical unit) and molar mass 284. The molecular formula is:", "o": ["P₂O₅", "P₆O₁₅", "P₄O₅", "P₄O₁₀"], "a": 3, "e": "284 ÷ 142 = 2, so (P₂O₅)₂ = P₄O₁₀. This is the same P₄O₁₀ used in the balancing exercise.", "h": "Multiply both subscripts by n."}, {"ch": 5, "k": "concept", "s": "Ch6 p.57", "q": "To convert an empirical formula to a molecular formula you must also know:", "o": ["its melting point", "the percentage composition", "the density of the compound", "the molar mass of the compound"], "a": 3, "e": "n = molar mass ÷ empirical mass. Percentage composition gives only the empirical formula.", "h": "Two formulas, two pieces of data."}, {"ch": 5, "k": "concept", "s": "Ch6 p.58 variant", "q": "In N₂ + 3H₂ → 2NH₃, how many moles of NH₃ form from 6.0 mol of H₂?", "o": ["2.0 mol", "4.0 mol", "6.0 mol", "9.0 mol"], "a": 1, "e": "6.0 × 2/3 = 4.0 mol.", "h": "Ratio H₂ : NH₃ = 3 : 2."}, {"ch": 5, "k": "concept", "s": "Ch6 p.58 variant", "q": "In N₂ + 3H₂ → 2NH₃, what mass of NH₃ forms from 10 g of H₂ with excess N₂? (N = 14, H = 1)", "o": ["56.7 g", "28.3 g", "170 g", "113 g"], "a": 0, "e": "10 g H₂ = 5.0 mol. NH₃ = 5.0 × 2/3 = 3.333 mol × 17 = 56.7 g.", "h": "Moles first; never use mass ratios directly from the equation without molar masses."}, {"ch": 5, "k": "concept", "s": "Ch6 p.58 variant", "q": "CaCO₃ → CaO + CO₂. What mass of CO₂ forms when 50 g of CaCO₃ decomposes? (Ca = 40, C = 12, O = 16)", "o": ["44 g", "22 g", "50 g", "28 g"], "a": 1, "e": "CaCO₃ = 100, so 50 g = 0.5 mol. 1 : 1 ratio gives 0.5 mol CO₂ × 44 = 22 g.", "h": "CaCO₃ = 100 g/mol makes this an easy mark."}, {"ch": 5, "k": "concept", "s": "Ch6 p.58 variant", "q": "In 2H₂ + O₂ → 2H₂O, the mass of hydrogen needed to make 36 g of water is:", "o": ["8 g", "36 g", "2 g", "4 g"], "a": 3, "e": "36 g water = 2 mol, so 2 mol H₂ = 4 g.", "h": "Water: 18 g/mol."}, {"ch": 5, "k": "concept", "s": "Ch6 p.58 variant", "q": "In 2Mg + O₂ → 2MgO, 12.15 g of Mg (Mg = 24.3) gives what mass of MgO (O = 16)?", "o": ["12.15 g", "40.30 g", "10.08 g", "20.15 g"], "a": 3, "e": "12.15 g Mg = 0.5 mol. MgO = 0.5 mol × 40.3 = 20.15 g.", "h": "Equation ratio is 1 : 1 for Mg : MgO."}, {"ch": 5, "k": "concept", "s": "Ch6 p.58", "q": "Stoichiometric coefficients in a balanced equation tell you the ratio of:", "o": ["masses of the substances", "molar masses", "moles of the substances", "volumes of liquids only"], "a": 2, "e": "The coefficients are mole ratios (and, for gases at the same T and P, volume ratios). They are not mass ratios.", "h": "Coefficients are in MOLES, not grams."}, {"ch": 5, "k": "concept", "s": "Ch6 p.58", "q": "The usual route in a mass-to-mass stoichiometry problem is:", "o": ["moles → grams → mole ratio", "grams → volume → moles", "grams → moles → mole ratio → moles → grams", "grams → grams using the coefficients"], "a": 2, "e": "Convert the given mass to moles, use the balanced-equation ratio, then convert the answer back to grams.", "h": "G-M-R-M-G."}, {"ch": 5, "k": "concept", "s": "Ch6 p.62", "q": "If the actual yield is 17.0 g and the theoretical yield is 20.0 g, the percent yield is:", "o": ["85 %", "3.0 %", "117.6 %", "15 %"], "a": 0, "e": "17.0 ÷ 20.0 × 100 = 85 %.", "h": "Actual over theoretical, always."}, {"ch": 5, "k": "concept", "s": "Ch6 p.61", "q": "The actual yield of a reaction is always less than the theoretical yield because of:", "o": ["the law of conservation of mass failing", "the equation being unbalanced", "the limiting reagent being in excess", "side reactions and losses"], "a": 3, "e": "The book names side reactions, impurities, losses during the reaction and weighing errors.", "h": "Real chemistry loses product."}, {"ch": 5, "k": "concept", "s": "Ch6 p.59", "q": "The limiting reagent is the reactant that:", "o": ["has the smallest molar mass of the two", "is used up first and so limits the product", "is present in the largest quantity overall", "is always the solid reactant used"], "a": 1, "e": "It runs out first, which stops the reaction. The product depends on it. The other reagent is the excess reagent.", "h": "Amount present is not the same as limiting."}, {"ch": 5, "k": "concept", "s": "Ch6 p.59", "q": "In a reaction between A and B in a 1 : 1 ratio, you mix 4 mol of A and 5 mol of B. The product depends on:", "o": ["Neither, because 9 mol are present", "B, and 1 mol of A is left over", "A, and 1 mol of B is left over", "Both A and B equally"], "a": 2, "e": "A is used up after 4 mol of B has reacted, leaving 1 mol B. So A is limiting.", "h": "The book’s own illustration of limiting reagent."}, {"ch": 5, "k": "concept", "s": "Ch6 p.60 variant", "q": "2H₂ + O₂ → 2H₂O. 4.0 g of H₂ reacts with 16.0 g of O₂. Limiting reagent and mass of water formed:", "o": ["H₂, 36 g", "H₂, 18 g", "O₂, 18 g", "O₂, 36 g"], "a": 2, "e": "H₂ = 2 mol (needs 1 mol O₂). O₂ = 0.5 mol. O₂ runs out. Water = 2 × 0.5 = 1 mol = 18 g.", "h": "O₂ is the limiting reagent when mass is low."}, {"ch": 5, "k": "concept", "s": "Ch6 p.60 variant", "q": "2Al + 3Cl₂ → 2AlCl₃. 5 mol of Al is mixed with 6 mol of Cl₂. The moles of AlCl₃ formed are:", "o": ["4 mol", "3 mol", "6 mol", "5 mol"], "a": 0, "e": "Cl₂ is limiting: 6 mol Cl₂ makes 6 × 2/3 = 4 mol AlCl₃. Al would give 5 mol, but Cl₂ runs out first.", "h": "Pick the smaller product amount."}, {"ch": 5, "k": "concept", "s": "Ch6 p.60 variant", "q": "N₂ + 3H₂ → 2NH₃. 3 mol N₂ and 6 mol H₂ are mixed. The moles of NH₃ formed are:", "o": ["3 mol", "6 mol", "12 mol", "4 mol"], "a": 3, "e": "H₂ is limiting: 6 × 2/3 = 4 mol. N₂ would give 6 mol.", "h": "Smaller answer wins."}, {"ch": 5, "k": "concept", "s": "Ch6 p.62 variant", "q": "The theoretical yield of a product is 25.0 g and 20.0 g is obtained. The percent yield is:", "o": ["80 %", "5 %", "125 %", "20 %"], "a": 0, "e": "20.0 ÷ 25.0 × 100 = 80 %.", "h": "Never above 100."}, {"ch": 5, "k": "concept", "s": "Ch6 p.64 variant", "q": "5.85 g of NaCl (58.5 g/mol) is dissolved in water to make 250 mL of solution. The molarity is:", "o": ["0.40 M", "0.10 M", "1.0 M", "0.023 M"], "a": 0, "e": "5.85/58.5 = 0.100 mol ÷ 0.250 L = 0.40 M.", "h": "0.100 mol ÷ 0.25 L."}, {"ch": 5, "k": "concept", "s": "Ch6 p.64 variant", "q": "The mass of NaOH (40 g/mol) needed to make 500 mL of 0.25 M solution is:", "o": ["20 g", "10 g", "5.0 g", "2.5 g"], "a": 2, "e": "0.25 × 0.500 = 0.125 mol × 40 = 5.0 g.", "h": "Moles = M × V(L)."}, {"ch": 5, "k": "concept", "s": "Ch6 p.64 variant", "q": "The mass of Na₂CO₃ (106 g/mol) needed for 250 mL of 0.10 M solution is:", "o": ["26.5 g", "1.06 g", "10.6 g", "2.65 g"], "a": 3, "e": "0.10 × 0.250 = 0.025 mol × 106 = 2.65 g.", "h": "Standard solutions in titration."}, {"ch": 5, "k": "concept", "s": "Ch6 p.65 variant", "q": "In 0.10 M Al₂(SO₄)₃ the concentrations of Al³⁺ and SO₄²⁻ are:", "o": ["0.20 M and 0.30 M", "0.10 M and 0.10 M", "0.30 M and 0.20 M", "0.20 M and 0.10 M"], "a": 0, "e": "Al₂(SO₄)₃ → 2Al³⁺ + 3SO₄²⁻. Multiply 0.10 by 2 and by 3.", "h": "Subscripts become multipliers."}, {"ch": 5, "k": "concept", "s": "Ch6 p.65 variant", "q": "The concentration of Cl⁻ in 0.20 M CaCl₂ is:", "o": ["0.40 M", "0.10 M", "0.20 M", "0.60 M"], "a": 0, "e": "CaCl₂ → Ca²⁺ + 2Cl⁻, so 2 × 0.20 = 0.40 M.", "h": "CaCl₂ gives two chlorides."}, {"ch": 5, "k": "concept", "s": "Ch6 p.65 variant", "q": "The number of moles of Cl⁻ in 25 mL of 0.20 M MgCl₂ is:", "o": ["0.010 mol", "0.0050 mol", "0.050 mol", "0.20 mol"], "a": 0, "e": "MgCl₂ = 0.025 × 0.20 = 0.0050 mol. Cl⁻ = 2 × 0.0050 = 0.010 mol.", "h": "Moles of salt first, then multiply by ion count."}, {"ch": 5, "k": "concept", "s": "Ch6 p.66 variant", "q": "10 g of sugar in 250 mL of solution is what % (w/v)?", "o": ["4 %", "2.5 %", "10 %", "40 %"], "a": 0, "e": "w/v is grams per 100 mL: 10 ÷ 250 × 100 = 4 % w/v.", "h": "% w/v is g per 100 mL."}, {"ch": 5, "k": "concept", "s": "Ch6 p.66 variant", "q": "5 g of sugar dissolved in 95 g of water gives what % (m/m)?", "o": ["5.26 %", "95 %", "5 %", "0.05 %"], "a": 2, "e": "5 ÷ (5 + 95) × 100 = 5 %.", "h": "Solution = solute + solvent."}, {"ch": 5, "k": "concept", "s": "Ch6 p.67 variant", "q": "4.0 g of NaOH (40 g/mol) is dissolved in 500 g of water. The molality is:", "o": ["0.40 m", "0.20 m", "0.10 m", "0.0080 m"], "a": 1, "e": "4.0/40 = 0.10 mol ÷ 0.500 kg = 0.20 mol/kg.", "h": "Divide by kg of water."}, {"ch": 5, "k": "concept", "s": "Ch6 p.69 variant", "q": "A solution contains 1 mol of ethanol and 4 mol of water. The mole fraction of ethanol is:", "o": ["0.25", "0.20", "0.80", "4.0"], "a": 1, "e": "1 ÷ (1 + 4) = 0.20. Water is 0.80.", "h": "Mole fraction has no unit."}, {"ch": 5, "k": "concept", "s": "Ch6 p.69 variant", "q": "46 g of ethanol (46 g/mol) is mixed with 18 g of water (18 g/mol). The mole fraction of water is:", "o": ["1.0", "0.28", "0.50", "0.72"], "a": 2, "e": "Ethanol = 1 mol, water = 1 mol. x(water) = 1/2 = 0.50.", "h": "Convert grams to moles first."}, {"ch": 5, "k": "concept", "s": "Ch6 p.69 variant", "q": "The sum of the mole fractions of all components in a solution is:", "o": ["1", "depends on the solute", "0", "100"], "a": 0, "e": "x(A) + x(B) + … = 1, always.", "h": "Mole fractions add to 1 (not 100)."}, {"ch": 5, "k": "concept", "s": "Ch6 p.70 variant", "q": "25 mL of 2.0 M HCl is diluted to 100 mL. The new concentration is:", "o": ["2.0 M", "0.020 M", "0.50 M", "8.0 M"], "a": 2, "e": "M₂ = M₁V₁ ÷ V₂ = 2.0 × 25 ÷ 100 = 0.50 M.", "h": "Diluting 4× divides the concentration by 4."}, {"ch": 5, "k": "concept", "s": "Ch6 p.70 variant", "q": "The final volume when 20 mL of 5.0 M acid is diluted to 0.50 M is:", "o": ["180 mL", "100 mL", "200 mL", "2.0 mL"], "a": 2, "e": "V₂ = M₁V₁ ÷ M₂ = 5.0 × 20 ÷ 0.50 = 200 mL. Water added = 180 mL.", "h": "⚠ TRAP: the question asks for final volume, not water added."}, {"ch": 5, "k": "concept", "s": "Ch6 p.66", "q": "Molarity is defined as:", "o": ["grams of solute per litre of solvent", "moles of solute per kg of solvent", "moles of solute per mole of solution", "moles of solute per litre of solution"], "a": 3, "e": "Molarity (M) = mol/L of SOLUTION. Molality (m) = mol per kg of SOLVENT.", "h": "M and m: litre of solution vs kg of solvent."}, {"ch": 5, "k": "concept", "s": "Ch6 p.67", "q": "Why does molality not change with temperature while molarity does?", "o": ["Molality uses moles and molarity uses grams", "Molarity uses solvent only", "Molality includes the solvent volume", "Molality uses mass, and molarity uses volume"], "a": 3, "e": "Mass does not change with temperature, but volume expands or contracts. Colligative properties use molality for this reason.", "h": "Mass is fixed; volume is not."}, {"ch": 5, "k": "concept", "s": "Ch6 p.69", "q": "A standard solution is one whose concentration is:", "o": ["always 1 M", "always made from a solid", "exactly known", "very high"], "a": 2, "e": "A standard solution has an exactly known concentration. A stock solution is a highly concentrated standard solution used to make diluted ones.", "h": "Standard = exactly known; stock = concentrated."}, {"ch": 5, "k": "concept", "s": "Ch6 p.69", "q": "The relationship used to dilute a stock solution is:", "o": ["M₁V₁ = M₂V₂", "M₁/V₁ = M₂/V₂", "M₁ + V₁ = M₂ + V₂", "M₁M₂ = V₁V₂"], "a": 0, "e": "The number of moles of solute (M × V) does not change on dilution.", "h": "Moles before = moles after."}, {"ch": 5, "k": "concept", "s": "Ch6 p.66", "q": "The best piece of glassware for making up a standard solution to an exact volume is:", "o": ["a beaker", "a conical flask", "a volumetric flask", "a measuring cylinder"], "a": 2, "e": "A volumetric flask has a single calibration mark for an accurate final volume.", "h": "Beakers are only for rough work."}, {"ch": 5, "k": "concept", "s": "Ch6 p.66", "q": "When diluting concentrated acid it is safest to:", "o": ["add both at once", "add the acid slowly to water", "add water quickly to the acid", "heat the acid first"], "a": 1, "e": "Dilution of strong acids releases heat. Adding acid to water keeps the heat spread in a large volume of water.", "h": "Acid to water, like “do as you oughta”."}, {"ch": 5, "k": "concept", "s": "Ch6 p.50", "q": "Which concentration unit is expressed in mol per kg of solvent?", "o": ["Normality", "Molality", "Molarity", "Mole fraction"], "a": 1, "e": "Molality (m) is mol solute / kg solvent.", "h": "Molality: kg solvent."}, {"ch": 5, "k": "concept", "s": "Ch6 p.50", "q": "Stoichiometry is mostly concerned with:", "o": ["the energy levels of the electrons", "the speed at which reactions occur", "the shapes of the molecules formed", "the amounts of substances in a reaction"], "a": 3, "e": "The book says stoichiometry deals with the quantities of chemical species involved in a reaction.", "h": "Quantity, not speed."}, {"ch": 6, "k": "example", "s": "Ch7 p.80 Example 1a", "q": "Calculate the pH of a solution that is 0.030 M in H⁺.", "o": ["0.030", "12.5", "2.5", "1.5"], "a": 3, "e": "pH = −log[H⁺] = −log(0.030) = 1.52, which is 1.5 to two figures. A value like 12.5 is the pOH-side mistake: this is an acid, so pH must be below 7.", "h": "Strong acid, small number, pH between 1 and 2."}, {"ch": 6, "k": "example", "s": "Ch7 p.80 Example 1b", "q": "Calculate the pH of a solution that is 2.0 × 10⁻² M in OH⁻.", "o": ["1.7", "2.0", "12.3", "13.7"], "a": 2, "e": "pOH = −log(2.0 × 10⁻²) = 1.70. pH = 14 − 1.70 = 12.3. Stopping at 1.7 gives the pOH, not the pH.", "h": "⚠ TRAP: given [OH⁻], you get pOH first, then subtract from 14."}, {"ch": 6, "k": "example", "s": "Ch7 p.80 Example 1c", "q": "If the pH of an aqueous system is 8.5, the [H⁺] is:", "o": ["1.18 × 10⁻⁹ M", "3.16 × 10⁻⁶ M", "8.5 × 10⁻¹⁴ M", "3.16 × 10⁻⁹ M"], "a": 3, "e": "[H⁺] = 10^(−pH) = 10^(−8.5) = 3.16 × 10⁻⁹ M. The negative sign belongs in the exponent. The book writes it as “log⁻¹(−8.5)”, which means the same thing.", "h": "[H⁺] = 10 to the power of minus pH."}, {"ch": 6, "k": "example", "s": "Ch7 p.82 Example 1", "q": "What is the pH of a buffer containing 1.0 M CH₃COOH and 1.0 M CH₃COONa (Ka = 1.8 × 10⁻⁵)?", "o": ["4.74", "7.00", "5.74", "3.74"], "a": 0, "e": "pKa = −log(1.8 × 10⁻⁵) = 4.74. With equal salt and acid, log(1.0/1.0) = 0, so pH = pKa = 4.74.", "h": "Equal amounts of acid and salt: pH = pKa."}, {"ch": 6, "k": "example", "s": "Ch7 p.82-83 Example 2", "q": "0.10 mol of HCl gas is added to 1 L of the buffer above (1.0 M CH₃COOH, 1.0 M CH₃COO⁻, no volume change). The new pH is:", "o": ["1.00", "5.74", "4.74", "4.66"], "a": 3, "e": "HCl is a strong acid. The 0.10 mol H⁺ turns 0.10 mol acetate into acetic acid. Acid = 1.1 M, salt = 0.9 M. pH = 4.74 + log(0.9/1.1) = 4.74 − 0.09 = 4.66. The pH barely moves, which is what a buffer is for. ⚠ The book prints Ka as 1.08 × 10⁻⁵ in this line, a typo for
