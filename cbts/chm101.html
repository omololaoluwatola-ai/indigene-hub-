 combining.", "h": "⚠ TRAP: kJ and J must match."}, {"ch": 8, "k": "concept", "s": "Ch9 p.106 variant", "q": "ΔH = −40 kJ and ΔS = −100 J/K. At 300 K, ΔG is:", "o": ["−10 kJ", "−70 kJ", "+10 kJ", "−40.03 kJ"], "a": 0, "e": "TΔS = 300 × (−100) = −30 000 J = −30 kJ. ΔG = −40 − (−30) = −10 kJ.", "h": "Careful with the double negative."}, {"ch": 8, "k": "concept", "s": "Ch9 p.106", "q": "The activation energy is:", "o": ["the difference in free energy of products and reactants", "the heat released by the reaction", "the energy of the products", "the energy barrier reactants must overcome to react"], "a": 3, "e": "It is the difference between the energy of the reactants and that of the activated complex (transition state).", "h": "Hill to climb before the reaction goes."}, {"ch": 8, "k": "concept", "s": "Ch9 p.107", "q": "The Arrhenius equation is:", "o": ["k = Ae^(Ea/RT)", "k = Ae^(−Ea/RT)", "k = A ln(Ea/RT)", "k = A + Ea/RT"], "a": 1, "e": "The negative exponent means k increases as T increases or Ea decreases.", "h": "Minus Ea over RT."}, {"ch": 8, "k": "concept", "s": "Ch9 p.107", "q": "A plot of ln k against 1/T gives a straight line with slope:", "o": ["−R/Ea", "ln A", "Ea/R", "−Ea/R"], "a": 3, "e": "ln k = ln A − (Ea/R)(1/T), so slope = −Ea/R and intercept = ln A. ⚠ The book’s sketch labels the slope “Ea/R”, but the line slopes downward and the text gives −Ea/R.", "h": "⚠ TRAP: the slope is negative."}, {"ch": 8, "k": "concept", "s": "Ch9 p.107", "q": "In the plot of ln k against 1/T, the intercept is:", "o": ["ln k only", "ln A", "Ea/R", "−Ea"], "a": 1, "e": "At 1/T = 0 the equation gives ln k = ln A.", "h": "Intercept is the pre-exponential factor."}, {"ch": 8, "k": "concept", "s": "Ch9 p.107", "q": "In an exothermic energy-profile diagram, the products lie:", "o": ["lower in energy than the reactants", "at the same level as the reactants", "at the top of the barrier", "higher in energy than the reactants"], "a": 0, "e": "Energy is released, shown as a drop from reactants to products. In an endothermic reaction the products are higher.", "h": "Exo: products lower."}, {"ch": 8, "k": "concept", "s": "Ch9 p.107", "q": "The step that determines the rate of a reaction in the energy profile is:", "o": ["forming the activated complex at the peak", "the final energy of the whole system", "forming the products at the end", "the initial concentration of reactants"], "a": 0, "e": "The number of molecules with enough energy to reach the top of the barrier determines the rate.", "h": "Slowest step = highest barrier."}, {"ch": 8, "k": "concept", "s": "Ch9 p.108", "q": "Enthalpy of formation is the heat change when:", "o": ["one mole of a compound forms from its elements", "one mole of acid is neutralised", "one mole of solute dissolves in water", "one mole of a compound burns in oxygen"], "a": 0, "e": "It is written ΔHf. Combustion, solution and neutralisation are other types in the book.", "h": "Formation: elements → 1 mol compound."}, {"ch": 8, "k": "concept", "s": "Ch9 p.108", "q": "Enthalpy of combustion is the heat evolved when:", "o": ["one mole of solute dissolves", "one mole of a compound forms from elements", "one mole of a substance is completely oxidised", "one mole of water forms"], "a": 2, "e": "Combustion means burning in oxygen.", "h": "Burn 1 mole completely."}, {"ch": 8, "k": "concept", "s": "Ch9 p.108", "q": "Enthalpy of neutralisation is the heat evolved when:", "o": ["one equivalent of acid is neutralised by one of base in dilute solution", "one mole of gas is compressed in a closed vessel", "one mole of a salt is dissolved in water", "one mole of any acid is added to any base available"], "a": 0, "e": "It is defined for one equivalent of acid and base, in dilute solution.", "h": "Dilute acid + base → salt + water."}, {"ch": 8, "k": "concept", "s": "Ch9 p.108", "q": "Enthalpy of solution is the heat change when one mole of solute:", "o": ["precipitates from solution", "dissolves in a large excess of water", "dissolves in a small amount of water", "evaporates from the solution"], "a": 1, "e": "Large excess means further dilution produces no more heat change.", "h": "Infinite dilution."}, {"ch": 8, "k": "concept", "s": "Ch9 p.109", "q": "Enthalpy of fusion is the enthalpy change for converting one mole of:", "o": ["liquid to gas at the boiling point", "liquid to solid at any temperature", "solid directly to gas", "solid to liquid at the melting point"], "a": 3, "e": "It is mostly endothermic. Vaporisation is liquid to gas at the boiling point, and sublimation is solid directly to gas.", "h": "Fusion = melting."}, {"ch": 8, "k": "concept", "s": "Ch9 p.109", "q": "Enthalpy of sublimation refers to converting one mole of:", "o": ["solid turning into liquid", "vapour turning into liquid", "solid turning directly into vapour", "liquid turning into vapour"], "a": 2, "e": "Sublimation skips the liquid state, e.g. dry ice (solid CO₂) becoming gas.", "h": "Sublime = solid → gas."}, {"ch": 9, "k": "exercise", "s": "Ch10 p.117 Question 1i", "q": "For A → P the rate is 0.050, 0.100 and 0.200 M/hr when [A] is 0.170, 0.340 and 0.680 M. The order of reaction is:", "o": ["zero order", "third order", "first order", "second order"], "a": 2, "e": "Doubling [A] doubles the rate (0.050 → 0.100 → 0.200), so rate ∝ [A]¹. If it were second order, doubling [A] would quadruple the rate. ⚠ The book writes the rate unit as “m/hr”, which should be M/hr.", "h": "Double the concentration: rate ×2 = first order; ×4 = second order; ×1 = zero order."}, {"ch": 9, "k": "exercise", "s": "Ch10 p.117 Question 1ii", "q": "For the same data (rate 0.050 M/hr at [A] = 0.170 M, first order), the rate constant is:", "o": ["0.0085 hr⁻¹", "0.294 hr⁻¹", "0.294 M/hr", "3.40 hr⁻¹"], "a": 1, "e": "rate = k[A], so k = 0.050 ÷ 0.170 = 0.294. For a first-order reaction the unit of k is hr⁻¹ (time⁻¹), not M/hr. Inverting the ratio gives 3.40.", "h": "First order: k has units of 1/time."}, {"ch": 9, "k": "exercise", "s": "Ch10 p.121 Question 2", "q": "In ²⁵⁴₉₈Cf → ᵃ_bPd + ¹³²₅₂Te + 4¹₀n the palladium isotope is:", "o": ["¹¹⁸₅₂Pd", "¹¹⁸₄₆Pd", "¹²²₄₆Pd", "¹¹⁴₄₆Pd"], "a": 1, "e": "Mass: 254 = a + 132 + 4(1), so a = 118. Charge: 98 = b + 52 + 0, so b = 46. The neutrons have Z = 0.", "h": "Conserve mass number and atomic number separately."}, {"ch": 9, "k": "exercise", "s": "Ch10 p.121 Question 2", "q": "In ²³⁸U → ²³⁴Th + ⁴₂α, followed by ²³⁴Th → ²³⁴Th + ᶜ_dγ, the gamma ray has:", "o": ["c = 1 and d = 0", "c = 0 and d = 1", "c = 4 and d = 2", "c = 0 and d = 0"], "a": 3, "e": "A gamma ray carries no mass and no charge, so it does not change the nuclide: ²³⁴Th* → ²³⁴Th + ⁰₀γ.", "h": "Gamma: A = 0, Z = 0."}, {"ch": 9, "k": "exercise", "s": "Ch10 p.122 Question 3", "q": "The half-life of a radioactive sample is 60 days. The fraction of the original nuclei left after 120 days is:", "o": ["1/8", "1/3", "1/4", "1/2"], "a": 2, "e": "120 days = 2 half-lives. (1/2)² = 1/4.", "h": "n half-lives → (½)ⁿ."}, {"ch": 9, "k": "exercise", "s": "Ch10 p.124 Question 4a", "q": "The alpha emission of americium-243 is written:", "o": ["²⁴³₉₅Am → ²³⁹₉₃Np + ⁴₂He", "²⁴³₉₅Am → ²⁴⁷₉₇Bk + ⁴₂He", "²⁴³₉₅Am → ²³⁹₉₃Pu + ⁴₂He", "²⁴³₉₅Am → ²⁴³₉₆Cm + ⁰₋₁e"], "a": 0, "e": "Alpha emission lowers A by 4 and Z by 2: 243 − 4 = 239, 95 − 2 = 93. Element 93 is neptunium (Np).", "h": "Alpha: A − 4, Z − 2."}, {"ch": 9, "k": "exercise", "s": "Ch10 p.124 Question 4b", "q": "Iron-59 has a half-life of 45 days. The fraction left after 90 days is:", "o": ["1/8", "1/4", "1/90", "1/2"], "a": 1, "e": "90 days = 2 half-lives, so (½)² = ¼, or 25 %.", "h": "Divide time by half-life first."}, {"ch": 9, "k": "example", "s": "Ch10 p.120-121 Example", "q": "In ²³⁵₉₂U + ¹₀n → ⁹⁰₃₈Sr + ?? + 3¹₀n the missing nuclide is:", "o": ["¹⁴³₅₄Xe", "¹⁴⁴₅₄Xe", "¹⁴⁶₅₄Xe", "¹⁴³₅₂Xe"], "a": 0, "e": "Left: A = 235 + 1 = 236 and Z = 92. Right (known): A = 90 + 3 = 93, Z = 38. Missing: A = 236 − 93 = 143, Z = 92 − 38 = 54. That is xenon-143.", "h": "Subtract the known side from the total."}, {"ch": 9, "k": "example", "s": "Ch10 p.112 Example", "q": "Bismuth-210 (t½ = 5 days) decays by alpha emission to thallium-206. Starting with 100 g of Bi-210, the masses of Bi-210 and Tl-206 after 10 days are:", "o": ["25 g and 75 g", "0 g and 100 g", "12.5 g and 87.5 g", "50 g and 50 g"], "a": 0, "e": "10 days = 2 half-lives: Bi = 100 × ¼ = 25 g. The rest, 75 g, has become Tl (the book rounds the 206/210 mass loss away).", "h": "Half of what is left decays every half-life."}, {"ch": 9, "k": "concept", "s": "Ch10 p.111", "q": "Chemical kinetics is the study of:", "o": ["the shapes of the molecules involved", "the position of chemical equilibrium", "the speeds of reactions and how they occur", "the heat changes that go with reactions"], "a": 2, "e": "The book says kinetics deals with reaction rate and sheds light on how the reaction occurs (the mechanism).", "h": "Kinetics = speed and mechanism."}, {"ch": 9, "k": "concept", "s": "Ch10 p.111", "q": "Which of these affects the rate of a chemical reaction?", "o": ["Only the mass of the products", "Only the colour of the reactants", "Only the volume of the container", "Concentration, temperature and catalyst"], "a": 3, "e": "The book names concentration, temperature and catalyst among the factors.", "h": "C-T-C."}, {"ch": 9, "k": "concept", "s": "Ch10 p.111", "q": "A rate law is an equation relating:", "o": ["the reaction rate to reactant concentration", "the rate to the temperature of the reaction only", "the equilibrium constant to the catalyst used", "the enthalpy change to the entropy change"], "a": 0, "e": "For A → P, rate = −Δ[A]/Δt = Δ[P]/Δt = k[A]ˣ.", "h": "Rate vs concentration."}, {"ch": 9, "k": "concept", "s": "Ch10 p.111", "q": "For A → P, the rate in terms of A is written with a negative sign because:", "o": ["the rate of a reaction is always negative", "[A] falls, yet the rate must be positive", "A is a product, not a reactant, here", "the reaction is endothermic overall, so negative"], "a": 1, "e": "Δ[A] is negative, so −Δ[A]/Δt is positive. Rates of loss of reactants carry a minus sign, rates of formation of products a plus.", "h": "Minus sign × negative change = positive rate."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112", "q": "For aA + bB → cC + dD the rate is:", "o": ["−(1/a)Δ[A]/Δt = (1/c)Δ[C]/Δt", "−Δ[A]/Δt = −Δ[B]/Δt always", "Δ[A]/Δt = Δ[D]/Δt always", "−a Δ[A]/Δt = c Δ[C]/Δt"], "a": 0, "e": "Each concentration change is divided by its coefficient so that every species gives the same single rate. For 2A → B, B forms at half the rate A is used.", "h": "Divide by the coefficient."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112", "q": "In R = k[A]ᵐ[B]ⁿ, the overall order of reaction is:", "o": ["m + n", "m − n", "a + b from the balanced equation", "m × n"], "a": 0, "e": "The overall order is the sum of the exponents. The book notes that m ≠ a and n ≠ b in general.", "h": "⚠ TRAP: orders come from experiment, not from the balanced equation coefficients."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112", "q": "Can the order of a reaction be read directly from the coefficients of the balanced equation?", "o": ["No, every reaction is always first order", "Yes, it always equals the coefficients", "Yes, but this works only for gases", "No, only experiment shows it (elementary steps aside)"], "a": 3, "e": "The book says m ≠ a and n ≠ b. Only for a single elementary step do the exponents match the molecularity.", "h": "Orders are measured, not copied."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112", "q": "If a reactant has an exponent of 0 in the rate law, then:", "o": ["the reaction cannot happen", "the rate does not depend on its concentration", "the rate doubles if its concentration doubles", "the rate is proportional to its square"], "a": 1, "e": "Zero order in that reactant means changing its concentration has no effect on the rate.", "h": "Exponent 0 = no effect."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112", "q": "If the rate is first order in A and [A] is doubled, the rate:", "o": ["halves", "stays the same", "quadruples", "doubles"], "a": 3, "e": "Rate ∝ [A]¹, so ×2 on concentration gives ×2 on rate.", "h": "Order 1: same factor."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112", "q": "If the rate is second order in A and [A] is doubled, the rate:", "o": ["becomes twice as great", "becomes eight times greater", "becomes four times greater", "is unchanged"], "a": 2, "e": "Rate ∝ [A]², so 2² = 4. The book says the rate is quadrupled.", "h": "Order 2: factor squared."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112", "q": "If the rate is second order in A and [A] is tripled, the rate:", "o": ["increases twenty-seven times", "increases three times", "increases nine times", "increases six times"], "a": 2, "e": "3² = 9.", "h": "Square the factor."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112", "q": "Data show that doubling [A] and doubling [B] together makes the rate 8 times greater, with the rate first order in A. The order in B is:", "o": ["second order", "third order", "first order", "zero order"], "a": 0, "e": "8 = 2 × 2², so the factor from A is 2 (first order) and the factor from B is 4 (second order). Overall order is 3.", "h": "Divide the total factor among the reactants."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112", "q": "Molecularity is:", "o": ["the order of reaction found by experiment", "the half-life of the whole reaction", "the number of products the reaction forms", "the number of molecules colliding in one step"], "a": 3, "e": "The book defines molecularity by the number of molecules that simultaneously take part in the reaction. It is a whole number and applies to elementary steps.", "h": "Molecularity: theory. Order: experiment."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112", "q": "A reaction of the type I₂ → 2I (single molecule decomposing) is:", "o": ["unimolecular, usually first order", "zero order", "bimolecular, second order", "termolecular, third order"], "a": 0, "e": "The book says unimolecular reactions have rate = k C and are often first order.", "h": "One molecule = unimolecular."}, {"ch": 9, "k": "concept", "s": "Ch10 p.113", "q": "H₂ + I₂ → 2HI as a simple elementary step is:", "o": ["unimolecular, with rate = k[H₂]", "zero order, with rate = k", "bimolecular, with rate = k[H₂][I₂]", "termolecular, with rate = k[H₂][I₂]²"], "a": 2, "e": "Two molecules collide, so it is bimolecular and second order overall (the book’s example).", "h": "Bimolecular = 2 molecules, second order."}, {"ch": 9, "k": "concept", "s": "Ch10 p.113", "q": "2NO + H₂ → N₂O + H₂O as a simple elementary step is:", "o": ["unimolecular, first order", "bimolecular, second order", "termolecular, third order", "zero order"], "a": 2, "e": "Three molecules (2NO and H₂) must collide. Rate = k[NO]²[H₂]. All termolecular reactions are third order.", "h": "Count the molecules in the step."}, {"ch": 9, "k": "concept", "s": "Ch10 p.113", "q": "For the elementary step 2A → products, the rate law is:", "o": ["rate = k[A]", "rate = k[2A]", "rate = 2k[A]", "rate = k[A]²"], "a": 3, "e": "The book’s table gives rate = k[A]² for this bimolecular step.", "h": "Coefficient becomes the exponent for elementary steps only."}, {"ch": 9, "k": "concept", "s": "Ch10 p.113", "q": "For the elementary step A + B + C → products, the rate law should be:", "o": ["rate = k[A] + k[B] + k[C]", "rate = [A][B][C]", "rate = k[A][B][C]", "rate = k[ABC]"], "a": 2, "e": "⚠ The book’s table prints “rate = [A][B][C]” without the rate constant, a misprint. Every rate law has k.", "h": "⚠ TRAP: do not forget k."}, {"ch": 9, "k": "concept", "s": "Ch10 p.114", "q": "Reactions with molecularity higher than three are:", "o": ["impossible in solutions but common in gases", "the most common type of all reactions seen", "very rare, since many molecules seldom collide at once", "common in gases at high pressure and heat"], "a": 2, "e": "The book says larger numbers of molecules are assumed to react in stages (steps).", "h": "Complicated reactions happen in steps."}, {"ch": 9, "k": "concept", "s": "Ch10 p.114", "q": "The order of reaction is:", "o": ["the same as the stoichiometric coefficient total", "the sum of the exponents of the concentrations in the rate law", "the number of molecules in a collision", "the number of products"], "a": 1, "e": "For rate = k[A]ˣ the order is x.", "h": "Order = Σ exponents."}, {"ch": 9, "k": "concept", "s": "Ch10 p.114", "q": "The integrated first-order rate equation is:", "o": ["ln[A]ₜ − ln[A]₀ = −kt", "[A]₀ − [A]ₜ = kt", "1/[A]ₜ = kt + 1/[A]₀", "[A]ₜ = [A]₀ + kt"], "a": 0, "e": "The book integrates −d[A]/[A] = k dt to get ln[A]ₜ − ln[A]₀ = −kt, or [A]ₜ = [A]₀e^(−kt).", "h": "Natural log for first order."}, {"ch": 9, "k": "concept", "s": "Ch10 p.115", "q": "A plot of ln[A] against time for a first-order reaction is a straight line with slope:", "o": ["k", "ln 2", "1/k", "−k"], "a": 3, "e": "ln[A]ₜ = ln[A]₀ − kt, which is y = c + mx with m = −k.", "h": "Slope is −k."}, {"ch": 9, "k": "concept", "s": "Ch10 p.115", "q": "The first-order equation can also be written as:", "o": ["[A]ₜ = [A]₀e^(kt)", "[A]ₜ = [A]₀ − e^(−kt)", "[A]ₜ = [A]₀ + kt", "[A]ₜ = [A]₀e^(−kt)"], "a": 3, "e": "Take the exponential of both sides of ln([A]ₜ/[A]₀) = −kt. Concentration decays exponentially.", "h": "Exponential decay."}, {"ch": 9, "k": "concept", "s": "Ch10 p.115-116", "q": "The half-life of a first-order reaction is:", "o": ["t½ = 1/(k[A]₀), dependent on the start", "t½ = [A]₀/2k, dependent on the start", "t½ = 0.693/k, independent of the starting [A]", "t½ = 3/(2k[A]₀²), dependent on the start"], "a": 2, "e": "Put [A]ₜ = [A]₀/2 into ln([A]₀/[A]ₜ) = kt to get ln 2 = kt½, so t½ = 0.693/k. This is the only order whose half-life is independent of [A]₀.", "h": "⚠ TRAP: only first-order has constant half-life."}, {"ch": 9, "k": "concept", "s": "Ch10 p.116", "q": "The integrated rate law for a second-order reaction (rate = k[A]²) is:", "o": ["ln[A]ₜ = ln[A]₀ − kt", "1/[A]ₜ = kt + 1/[A]₀", "[A]₀ − [A]ₜ = kt", "[A]ₜ = [A]₀e^(−kt)"], "a": 1, "e": "A plot of 1/[A] against t is a straight line with positive slope k and intercept 1/[A]₀.", "h": "1/[A] versus t for second order."}, {"ch": 9, "k": "concept", "s": "Ch10 p.116", "q": "The half-life of a second-order reaction is:", "o": ["[A]₀/2k", "3/(2k[A]₀²)", "0.693/k", "1/(k[A]₀)"], "a": 3, "e": "It depends on [A]₀: the higher the starting concentration, the shorter the half-life.", "h": "t½ = 1/(k[A]₀)."}, {"ch": 9, "k": "concept", "s": "Ch10 p.116", "q": "The half-life of a third-order reaction is:", "o": ["0.693/k", "1/(k[A]₀)", "[A]₀/2k", "3/(2k[A]₀²)"], "a": 3, "e": "The book gives t½ = 3 / (2k[A]₀²).", "h": "Order 3: the 3 on top."}, {"ch": 9, "k": "concept", "s": "Ch10 p.117", "q": "For a zero-order reaction the integrated equation is:", "o": ["[A]₀ − [A]ₜ = kt", "1/[A]ₜ = kt + 1/[A]₀", "ln[A]ₜ = ln[A]₀ − kt", "[A]ₜ = [A]₀e^(−kt)"], "a": 0, "e": "The concentration falls linearly with time. The half-life follows as [A]₀/2k.", "h": "Zero order: straight line of [A] against t."}, {"ch": 9, "k": "concept", "s": "Ch10 p.116 variant", "q": "For which order is a plot of 1/[A] against time a straight line?", "o": ["Third order", "Second order", "Zero order", "First order"], "a": 1, "e": "First order: ln[A] versus t. Zero order: [A] versus t. Second order: 1/[A] versus t.", "h": "Zero [A], first ln[A], second 1/[A]."}, {"ch": 9, "k": "concept", "s": "Ch10 p.115 variant", "q": "A first-order reaction has k = 0.0693 min⁻¹. Its half-life is:", "o": ["100 min", "0.693 min", "1.0 min", "10 min"], "a": 3, "e": "t½ = 0.693 ÷ 0.0693 = 10 min.", "h": "Divide 0.693 by k."}, {"ch": 9, "k": "concept", "s": "Ch10 p.115 variant", "q": "A first-order reaction has a half-life of 20 min. The rate constant is:", "o": ["0.0347 min", "0.693 min⁻¹", "28.9 min⁻¹", "0.0347 min⁻¹"], "a": 3, "e": "k = 0.693 ÷ 20 = 0.03465 min⁻¹. The unit is per minute for first order.", "h": "k = 0.693 / t½."}, {"ch": 9, "k": "concept", "s": "Ch10 p.115 variant", "q": "A first-order reaction has t½ = 10 min. The fraction of A left after 30 min is:", "o": ["1/8", "1/4", "1/6", "1/3"], "a": 0, "e": "30 min = 3 half-lives. (½)³ = 1/8.", "h": "n half-lives: (½)ⁿ."}, {"ch": 9, "k": "concept", "s": "Ch10 p.115 variant", "q": "A first-order reaction has t½ = 10 min. The percentage of A that has reacted after 30 min is:", "o": ["75 %", "87.5 %", "12.5 %", "66.7 %"], "a": 1, "e": "1/8 (12.5 %) is left, so 100 − 12.5 = 87.5 % has reacted.", "h": "⚠ TRAP: “left” and “reacted” are different questions."}, {"ch": 9, "k": "concept", "s": "Ch10 p.115 variant", "q": "For a first-order reaction with k = 0.10 s⁻¹, what fraction of A remains after 10 s?", "o": ["0.10", "0.37", "0.50", "0.90"], "a": 1, "e": "[A]/[A]₀ = e^(−kt) = e^(−1.0) = 0.368.", "h": "kt = 1 gives 37 %."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112 variant", "q": "The unit of the rate constant k for a first-order reaction is:", "o": ["L mol⁻¹ s⁻¹", "mol L⁻¹ s⁻¹", "mol² L⁻² s⁻¹", "s⁻¹"], "a": 3, "e": "For first order, rate (mol L⁻¹ s⁻¹) = k[A] (mol L⁻¹), so k is s⁻¹.", "h": "Order 0: M/s; order 1: 1/s; order 2: L/mol·s."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112 variant", "q": "The unit of the rate constant k for a second-order reaction is:", "o": ["s⁻¹", "mol L⁻¹ s⁻¹", "L² mol⁻² s⁻¹", "L mol⁻¹ s⁻¹"], "a": 3, "e": "rate = k[A]², so k = (mol L⁻¹ s⁻¹) ÷ (mol L⁻¹)² = L mol⁻¹ s⁻¹.", "h": "Divide the rate unit by concentration^n."}, {"ch": 9, "k": "concept", "s": "Ch10 p.112 variant", "q": "The unit of the rate constant k for a zero-order reaction is:", "o": ["s⁻¹", "L mol⁻¹ s⁻¹", "mol L⁻¹ s⁻¹", "mol⁻¹ L s⁻¹ squared"], "a": 2, "e": "rate = k[A]⁰ = k, so k has the same unit as the rate.", "h": "Zero order: k = rate."}, {"ch": 9, "k": "concept", "s": "Ch10 p.117", "q": "The discovery of radioactivity in 1896 was made by:", "o": ["Pierre Curie, working with polonium", "Ernest Rutherford, working with gold foil", "Henri Becquerel, working with uranium crystals", "Marie Curie, working with radium"], "a": 2, "e": "Becquerel found that uranium crystals fogged photographic plates. Marie Curie then discovered polonium and radium and named the effect radioactivity. Becquerel and the Curies shared the Nobel Prize in physics.", "h": "Becquerel 1896; Curie named it."}, {"ch": 9, "k": "concept", "s": "Ch10 p.118", "q": "Marie Curie discovered the two elements:", "o": ["polonium and radium", "radium and actinium", "radon and francium", "uranium and thorium"], "a": 0, "e": "Polonium was named after her native Poland.", "h": "Po and Ra."}, {"ch": 9, "k": "concept", "s": "Ch10 p.118", "q": "Radioactivity is:", "o": ["the loss of electrons from the outer shell", "a reaction caused by heating atoms strongly", "the formation of ions when salts dissolve", "spontaneous emission of radiation by unstable nuclei"], "a": 3, "e": "The emission includes alpha particles, beta particles and gamma rays.", "h": "Spontaneous and nuclear."}, {"ch": 9, "k": "concept", "s": "Ch10 p.118", "q": "Natural radioactivity is shown by all elements heavier than:", "o": ["iron (Fe)", "uranium (U)", "bismuth (Bi)", "lead (Pb)"], "a": 2, "e": "The book says all elements heavier than bismuth (and some lighter ones) are naturally radioactive.", "h": "Heavier than Bi decays."}, {"ch": 9, "k": "concept", "s": "Ch10 p.118", "q": "A nuclear reaction differs from an ordinary chemical reaction because:", "o": ["it cannot ever change the atomic number", "only the electrons are rearranged between atoms", "it never releases energy to the surroundings", "the nucleus changes, so one element can become another"], "a": 3, "e": "Nuclear reactions change the number of protons or neutrons, giving transmutation. A change in protons changes the element.", "h": "Chemical: electrons. Nuclear: nucleus."}, {"ch": 9, "k": "concept", "s": "Ch10 p.118", "q": "An alpha particle is:", "o": ["a photon", "a helium nucleus, ⁴₂He", "an electron, ⁰₋₁e", "a neutron"], "a": 1, "e": "Two protons and two neutrons. Alpha emission lowers the mass number by 4 and the atomic number by 2.", "h": "Alpha = helium nucleus."}, {"ch": 9, "k": "concept", "s": "Ch10 p.118", "q": "Which equation correctly shows alpha decay of uranium-238?", "o": ["²³⁸₉₂U → ²³⁴₉₁Pa + ⁴₂He", "²³⁸₉₂U → ²³⁸₉₃Np + ⁰₋₁e", "²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He", "²³⁸₉₂U → ²³⁶₉₀Th + ⁴₂He"], "a": 2, "e": "238 − 4 = 234 and 92 − 2 = 90, giving thorium-234. Both mass and charge must balance.", "h": "Alpha: A − 4, Z − 2."}, {"ch": 9, "k": "concept", "s": "Ch10 p.119", "q": "Beta emission is the conversion of:", "o": ["a neutron into a proton and an electron", "a proton into a neutron and an electron", "a neutron into two protons", "a proton into an alpha particle"], "a": 0, "e": "The electron is ejected from the nucleus. The atomic number increases by 1 and the mass number is unchanged.", "h": "Beta: n → p + e⁻."}, {"ch": 9, "k": "concept", "s": "Ch10 p.119", "q": "When an atom emits a beta particle, its mass number:", "o": ["stays the same, while the atomic number increases by 1", "stays the same, and the atomic number decreases by 1", "decreases by 4", "decreases by 1, while the atomic number stays the same"], "a": 0, "e": "A neutron changes to a proton, so A is constant and Z goes up by 1.", "h": "Beta: Z + 1, A unchanged."}, {"ch": 9, "k": "concept", "s": "Ch10 p.119", "q": "The beta decay of carbon-14 gives:", "o": ["¹⁴₅B and a positron", "¹⁴₇N and an electron", "¹⁰₄Be and an alpha particle", "¹³₆C and a neutron"], "a": 1, "e": "¹⁴₆C → ¹⁴₇N + ⁰₋₁e. Mass is unchanged and Z rises from 6 to 7.", "h": "C-14 → N-14."}, {"ch": 9, "k": "concept", "s": "Ch10 p.119", "q": "Gamma radiation is:", "o": ["a stream of neutrons coming from the nucleus", "high energy electromagnetic radiation with no change in A or Z", "a fast stream of electrons coming from the nucleus", "a stream of helium nuclei coming from the nucleus"], "a": 1, "e": "Gamma rays are emitted along with alpha or beta decay but do not themselves change the nucleus type. ⚠ The book says “X-rays emitted during the beta decay of cobalt-60”, but the radiation from Co-60 is gamma rays.", "h": "Gamma: no mass, no charge."}, {"ch": 9, "k": "concept", "s": "Ch10 p.119", "q": "Which type of radiation changes neither the mass number nor the atomic number?", "o": ["Positron", "Gamma", "Alpha", "Beta"], "a": 1, "e": "Alpha: A −4, Z −2. Beta: Z +1. Positron: Z −1. Gamma: nothing changes.", "h": "Gamma is pure energy."}, {"ch": 9, "k": "concept", "s": "Ch10 p.120", "q": "Positron emission causes the atomic number to:", "o": ["increase by 1 and A to decrease by 4", "decrease by 2", "increase by 1, with the mass number unchanged", "decrease by 1, with the mass number unchanged"], "a": 3, "e": "A proton turns into a neutron and a positron. ¹¹₆C → ¹¹₅B + ⁰₊₁e.", "h": "Positron: Z − 1."}, {"ch": 9, "k": "concept", "s": "Ch10 p.120", "q": "A positron is a particle with:", "o": ["the same mass as an electron but positive charge", "no mass and no charge", "the same charge as a proton and the same mass", "the same mass as a proton"], "a": 0, "e": "Positron = ⁰₊₁e.", "h": "Anti-electron."}, {"ch": 9, "k": "concept", "s": "Ch10 p.120", "q": "Electron capture ( ⁸¹₃₇Rb + ⁰₋₁e → ? ) gives:", "o": ["⁸²₃₇Rb", "⁸⁰₃₆Kr", "⁸¹₃₆Kr", "⁸¹₃₈Sr"], "a": 2, "e": "The nucleus captures an inner-shell electron. Z drops by 1 (37 → 36) and A is unchanged, giving krypton-81.", "h": "EC has the same effect on Z as positron emission."}, {"ch": 9, "k": "concept", "s": "Ch10 p.119", "q": "Per the book’s table, beta emission changes the number of neutrons by:", "o": ["+1", "−2", "0", "−1"], "a": 3, "e": "A neutron becomes a proton. Positron emission and electron capture change neutrons by +1.", "h": "Beta: Z +1, n −1."}, {"ch": 9, "k": "concept", "s": "Ch10 p.120", "q": "The two things that must be conserved when balancing a nuclear equation are:", "o": ["the total number of molecules and the energy only", "the number of neutrons and the colour of the radiation", "the total mass number and the total atomic number", "the total number of electrons only"], "a": 2, "e": "The sum of A values and the sum of Z values must be equal on both sides.", "h": "A and Z balance separately."}, {"ch": 9, "k": "concept", "s": "Ch10 p.120 variant", "q": "²²⁶₈₈Ra decays by alpha emission. The product is:", "o": ["²²²₈₆Rn", "²²⁶₈₉Ac", "²²⁸₉₀Th", "²²²₈₈Ra"], "a": 0, "e": "226 − 4 = 222 and 88 − 2 = 86, which is radon.", "h": "Alpha: down 4 and down 2."}, {"ch": 9, "k": "concept", "s": "Ch10 p.120 variant", "q": "³²₁₅P decays by beta emission. The product is:", "o": ["³²₁₄Si", "³²₁₆S", "²⁸₁₃Al", "³¹₁₅P"], "a": 1, "e": "Beta: A unchanged (32), Z + 1 gives 16, which is sulphur.", "h": "Beta: Z + 1."}, {"ch": 9, "k": "concept", "s": "Ch10 p.120 variant", "q": "²³²₉₀Th emits an alpha particle. The product is:", "o": ["²³²₈₈Ra", "²²⁸₉₂U", "²²⁸₈₈Ra", "²²⁸₉₀Th"], "a": 2, "e": "232 − 4 = 228 and 90 − 2 = 88, which is radium.", "h": "Check Z against the periodic table."}, {"ch": 9, "k": "concept", "s": "Ch10 p.120 variant", "q": "¹³₇N undergoes positron emission. The product is:", "o": ["¹³₈O", "¹³₇N", "¹²₇N", "¹³₆C"], "a": 3, "e": "Positron: Z decreases by 1 and A is unchanged. ¹³₇N → ¹³₆C + ⁰₊₁e.", "h": "Positron: Z − 1."}, {"ch": 9, "k": "concept", "s": "Ch10 p.121", "q": "Half-life is the time required for:", "o": ["all of the nuclei to decay completely", "half (50 %) of the nuclei to decay", "just 10 % of the nuclei to decay", "the activity to fall right down to zero"], "a": 1, "e": "After each half-life, half of what is left decays. The sample never completely disappears in finite time.", "h": "Half of what is left."}, {"ch": 9, "k": "concept", "s": "Ch10 p.121", "q": "The decay constant λ is related to half-life by:", "o": ["t½ = 0.693/λ", "t½ = λ × 0.693", "t½ = λ/0.693", "t½ = 1/λ"], "a": 0, "e": "The book writes 0.692 in one place; the standard value is ln 2 = 0.693. Use 0.693.", "h": "λ = 0.693 / t½."}, {"ch": 9, "k": "concept", "s": "Ch10 p.122", "q": "Half-life of a radioactive isotope is affected by:", "o": ["none of temperature, pressure or physical state", "pressure only", "whether it is solid, liquid or gas", "temperature only"], "a": 0, "e": "The book says decay is unaffected by temperature, pressure or physical state, because it is a nuclear process. A short half-life means a less stable nucleus.", "h": "Nuclear process: outside conditions do not matter."}, {"ch": 9, "k": "concept", "s": "Ch10 p.122", "q": "A shorter half-life means that the nucleus is:", "o": ["more stable", "less stable", "non-radioactive", "heavier"], "a": 1, "e": "The book says half-life is a measure of the stability of the nucleus.", "h": "Short half-life, unstable nucleus."}, {"ch": 9, "k": "concept", "s": "Ch10 p.122 variant", "q": "A sample of 80 g of a radioisotope has a half-life of 6 hours. The mass remaining after 18 hours is:", "o": ["10 g", "26.7 g", "40 g", "20 g"], "a": 0, "e": "18 h = 3 half-lives. 80 × (½)³ = 10 g.", "h": "Halve three times."}, {"ch": 9, "k": "concept", "s": "Ch10 p.122 variant", "q": "A radioactive sample has 12.5 % of its nuclei remaining after 24 days. Its half-life is:", "o": ["3 days", "8 days", "6 days", "12 days"], "a": 1, "e": "12.5 % = 1/8 = (½)³, so 3 half-lives take 24 days and one takes 8 days.", "h": "Count halvings: 100 → 50 → 25 → 12.5."}, {"ch": 9, "k": "concept", "s": "Ch10 p.122", "q": "Natural radioactivity is:", "o": ["the spontaneous disintegration of unstable nuclei", "a reaction that needs very high pressure", "a chemical reaction of unstable ions", "an induced nuclear reaction by bombardment"], "a": 0, "e": "Artificial radioactivity is induced by bombarding nuclei with high-velocity particles (neutrons, protons, alpha particles).", "h": "Natural = spontaneous; artificial = induced."}, {"ch": 9, "k": "concept", "s": "Ch10 p.122", "q": "Nuclear transmutation by bombardment is shown by ¹⁴₇N + ⁴₂He → ¹⁷₈O + ?. The missing particle is:", "o": ["¹₀n", "¹₁H", "⁰₋₁e", "²₁H"], "a": 1, "e": "Mass: 14 + 4 = 18 = 17 + 1. Charge: 7 + 2 = 9 = 8 + 1. So the particle is a proton, ¹₁H.", "h": "Balance the top and bottom numbers."}, {"ch": 9, "k": "concept", "s": "Ch10 p.122-123", "q": "Nuclear fission is:", "o": ["splitting of a heavy nucleus into smaller ones plus neutrons", "capture of an orbital electron by a nucleus", "joining of light nuclei into heavier ones", "emission of an electron from a nucleus"], "a": 0, "e": "Example: ²³⁵U + ¹n → ¹⁴⁴Ba + ⁹⁰Kr + 3¹n + energy. ⚠ The book prints the second product as ⁹⁰₃₆Ba, which is wrong: Z = 36 is krypton.", "h": "⚠ TRAP: Z = 36 is Kr, not Ba."}, {"ch": 9, "k": "concept", "s": "Ch10 p.123", "q": "Nuclear fusion is:", "o": ["loss of an alpha particle from a nucleus", "splitting of heavy nuclei into smaller ones", "joining of small nuclei into larger, more stable ones", "decay of a neutron into a proton"], "a": 2, "e": "It needs very high temperatures to start, releases a lot of energy, makes little radioactive waste and uses hydrogen as fuel.", "h": "Fusion = join; fission = split."}, {"ch": 9, "k": "concept", "s": "Ch10 p.123", "q": "Which one needs a very high temperature to start?", "o": ["Fission", "Beta decay", "Alpha decay", "Fusion"], "a": 3, "e": "⚠ The book writes “fission requires initial high temperature while fission does not”. That is a typo; fusion is the one that requires extreme temperatures.", "h": "⚠ TRAP: fusion needs the heat."}, {"ch": 9, "k": "concept", "s": "Ch10 p.123", "q": "The fusion reaction ²₁H + ²₁H → ³₂He + ?. The missing particle is:", "o": ["¹₁H", "¹₀n", "⁴₂He", "⁰₁e"], "a": 1, "e": "Mass: 2 + 2 = 4 = 3 + 1. Charge: 1 + 1 = 2 = 2 + 0. The particle is a neutron. ⚠ The book writes the product as ³₂H and ¹₀He, which swaps the symbols.", "h": "Neutron has Z = 0."}, {"ch": 9, "k": "concept", "s": "Ch10 p.123", "q": "Cobalt-60 is used in:", "o": ["dating the age of very old rocks", "making plant fertiliser for the farm", "radiotherapy to destroy cancer cells", "smoke detectors for use in homes"], "a": 2, "e": "The book lists cobalt-60 for destroying cancer cells. Americium-243 is the one used in smoke detectors.", "h": "Co-60 = cancer treatment."}, {"ch": 9, "k": "concept", "s": "Ch10 p.123", "q": "Iodine-131 is used in medicine to:", "o": ["sterilising syringes in hospitals", "detecting tumours in the bones", "studying how well the thyroid gland works", "treating anaemia in the blood"], "a": 2, "e": "The thyroid takes up iodine to make thyroxine. I-131 can also treat thyroid cancer. Barium-131 is used for bone tumours in the book, and iron-59 for anaemia.", "h": "Iodine → thyroid."}, {"ch": 9, "k": "concept", "s": "Ch10 p.124", "q": "Radioactive phosphorus-32 is used in agriculture to:", "o": ["sterilising packaged food for storage", "improving the pH of the farm soil", "tracing how a plant uses phosphorus in fertiliser", "killing dangerous pests on cattle"], "a": 2, "e": "It is a tracer. Gamma rays are used for sterilising food and killing pests.", "h": "P-32 = tracer."}, {"ch": 9, "k": "concept", "s": "Ch10 p.124", "q": "Gamma rays are used to sterilise medical apparatus and food because they:", "o": ["make the objects radioactive", "kill microorganisms", "remove oxygen", "raise the pH"], "a": 1, "e": "Gamma radiation destroys the bacteria and prevents spoilage.", "h": "Gamma sterilises."}, {"ch": 10, "k": "example", "s": "Ch11 p.125-126 Example 1", "q": "95.0 g of glycerin (C₃H₈O₃, 92.1 g/mol) is dissolved in 190.0 g of ethanol (C₂H₅OH, 46.0 g/mol) at 40 °C. Pure ethanol has P° = 135.3 torr and glycerin is non-volatile. The mole fraction of ethanol is:", "o": ["0.20", "0.50", "0.80", "0.67"], "a": 2, "e": "Glycerin = 95.0/92.1 = 1.03 mol. Ethanol = 190/46.0 = 4.13 mol. x(ethanol) = 4.13 / (4.13 + 1.03) = 0.80. The 0.20 is the mole fraction of glycerin.", "h": "Mole fractions come from MOLES, not grams."}, {"ch": 10, "k": "example", "s": "Ch11 p.126 Example 1", "q": "For the same glycerin–ethanol solution, the vapour pressure of the solution at 40 °C is:", "o": ["108.2 torr", "135.3 torr", "169.1 torr", "27.1 torr"], "a": 0, "e": "P(soln) = x(solvent) × P° = 0.80 × 135.3 = 108.2 torr. The 27.1 torr is the drop in vapour pressure, not the vapour pressure itself.", "h": "⚠ TRAP: Raoult’s law uses the SOLVENT mole fraction for the solution’s vapour pressure."}, {"ch": 10, "k": "example", "s": "Ch11 p.126 Example 1", "q": "For the same solution, the lowering of vapour pressure, ΔP, is:", "o": ["4.13 torr", "108.24 torr", "135.3 torr", "27.06 torr"], "a": 3, "e": "ΔP = x(solute) × P° = 0.20 × 135.3 = 27.06 torr. Or ΔP = 135.3 − 108.24 = 27.06 torr. ⚠ The book’s note writes “135.5 torr” once; the pure-solvent value is 135.3 torr.", "h": "ΔP uses the SOLUTE mole fraction."}, {"ch": 10, "k": "example", "s": "Ch11 p.127-128 Example 2", "q": "Freezing point of a solution of 25.0 g sucrose (342.3 g/mol) in 100.0 g water (Kf = 1.86 °C/m, normal freezing point 0 °C) is:", "o": ["+1.36 °C", "−13.6 °C", "−0.73 °C", "−1.36 °C"], "a": 3, "e": "n = 25.0/342.3 = 0.073 mol. m = 0.073 / 0.1000 kg = 0.73 m. ΔTf = 1.86 × 0.73 = 1.36 °C. So the solution freezes at 0 − 1.36 = −1.36 °C. ⚠ The book writes the Kf units as “°C cm⁻¹”; it should be °C·kg/mol (°C/m).", "h": "Molality uses kg of solvent; then subtract the depression from the normal freezing point."}, {"ch": 10, "k": "example", "s": "Ch11 p.129-130 Example", "q": "1.0 g of glycerine (92.1 g/mol) is dissolved in 47.9 g of water (Kb = 0.512 °C/m). The boiling point elevation is:", "o": ["0.012 °C", "0.12 °C", "0.51 °C", "1.2 °C"], "a": 1, "e": "n = 1.0/92.1 = 0.0109 mol (the book rounds to 0.011). m = 0.0109 / 0.0479 kg = 0.227 m (book 0.2296). ΔTb = 0.512 × 0.227 = 0.116 °C, about 0.12 °C (book 0.118 °C). ⚠ The question prints 4.7 g of water, but the working uses 47.9 g. With 4.7 g the answer would be about 1.2 °C.", "h": "Always check the mass of solvent used in the working."}, {"ch": 10, "k": "example", "s": "Ch11 p.131 Example", "q": "A solution of 20.0 g haemoglobin in 1 L has an osmotic pressure of 5.92 torr at 22 °C (R = 0.08206 L atm/mol K). The molar mass of haemoglobin is about:", "o": ["3.2 × 10⁻⁴ g/mol", "1.6 × 10⁻⁵ g/mol", "6.2 × 10⁴ g/mol", "6.2 × 10⁷ g/mol"], "a": 2, "e": "π = 5.92/760 = 7.79 × 10⁻³ atm. T = 295 K. M = π/RT = 7.79 × 10⁻³ / (0.08206 × 295) = 3.2 × 10⁻⁴ mol/L. Molar mass = 20.0 g ÷ 3.2 × 10⁻⁴ mol = about 6.2 × 10⁴ g/mol (the book rounds to 62,500).", "h": "⚠ TRAP: convert torr to atm and °C to K first."}, {"ch": 10, "k": "exercise", "s": "Ch11 p.131 Exercise 1", "q": "The vapour pressure of an ideal solution with equal mole fractions of benzene (P° = 95.1 mmHg) and toluene (P° = 28.4 mmHg) at 25 °C is:", "o": ["61.75 mmHg", "47.55 mmHg", "123.5 mmHg", "66.7 mmHg"], "a": 0, "e": "Both are volatile, so add their partial pressures: 0.5 × 95.1 + 0.5 × 28.4 = 47.55 + 14.2 = 61.75 mmHg. Using only benzene gives 47.55.", "h": "Both volatile: add the partial pressures."}, {"ch": 10, "k": "exercise", "s": "Ch11 p.132 Exercise 2", "q": "10.0 g of wax (average formula C₁₂H₄₆ as printed, 190 g/mol) is dissolved in 40.0 g of CCl₄ (154 g/mol, P° = 100 torr at 23 °C). The vapour pressure of the solution is about:", "o": ["100 torr", "83 torr", "17 torr", "50 torr"], "a": 1, "e": "Wax: 10.0/190 = 0.0526 mol. CCl₄: 40.0/154 = 0.2597 mol. x(CCl₄) = 0.2597/(0.2597 + 0.0526) = 0.832. P = 0.832 × 100 = 83 torr. ⚠ “C₁₂H₄₆” is not a real alkane formula, so check what molar mass the question wants you to use.", "h": "Solution vapour pressure = x(solvent) × P°."}, {"ch": 10, "k": "exercise", "s": "Ch11 p.132 Exercise 3", "q": "A solution is made of 0.25 mol sucrose and 75.0 g urea (60.06 g/mol) in 1 kg of water (18.02 g/mol, P° = 17.5 mmHg at 20 °C). The vapour pressure of the solution is:", "o": ["17.0 mmHg", "17.5 mmHg", "0.52 mmHg", "16.4 mmHg"], "a": 0, "e": "Urea = 75.0/60.06 = 1.25 mol. Total solute = 1.50 mol. Water = 1000/18.02 = 55.5 mol. x(water) = 55.5/57.0 = 0.974. P = 0.974 × 17.5 = 17.0 mmHg. ⚠ The book writes the formula as “P²_H₂O”; it is P° (pure water).", "h": "Add up ALL the non-volatile solutes."}, {"ch": 10, "k": "exercise", "s": "Ch11 p.132 Exercise 4", "q": "92.1 g of I₂ (253.8 g/mol) is dissolved in 800.0 g of chloroform (Kf = 4.68 °C/m, normal freezing point −63.5 °C). The freezing point of the solution is:", "o": ["−65.6 °C", "−2.1 °C", "−63.5 °C", "−61.4 °C"], "a": 0, "e": "n = 92.1/253.8 = 0.363 mol. m = 0.363 / 0.8000 kg = 0.454 m. ΔTf = 4.68 × 0.454 = 2.12 °C. Tf = −63.5 − 2.12 = −65.6 °C. The −61.4 °C comes from adding instead of subtracting. ⚠ The book puts 253.8 beside chloroform, but it is the molar mass of I₂.", "h": "⚠ TRAP: depression means the freezing point goes DOWN from the pure-solvent value."}, {"ch": 10, "k": "exercise", "s": "Ch11 p.132 Exercise 5a", "q": "A solution of 1.5 g hemocyanin in 250 mL of water has an osmotic pressure of 0.00342 atm at 277 K (R = 0.08206 L atm/mol K). The molar mass of hemocyanin is about:", "o": ["1.0 × 10⁴ g/mol", "4.0 × 10⁷ g/mol", "1.6 × 10⁻⁵ g/mol", "4.0 × 10⁴ g/mol"], "a": 3, "e": "M = π/RT = 0.00342 / (0.08206 × 277) = 1.5 × 10⁻⁴ mol/L. In 0.250 L: 3.76 × 10⁻⁵ mol. Molar mass = 1.5 g ÷ 3.76 × 10⁻⁵ mol = 3.99 × 10⁴ g/mol. If you forget the volume (0.250 L) you get 1.0 × 10⁴.", "h": "Volume matters: moles = M × V."}, {"ch": 10, "k": "exercise", "s": "Ch11 p.132 Exercise 5b", "q": "The freezing point of the hemocyanin solution above (Kf = 1.86 °C/m, molality about 1.5 × 10⁻⁴ m) is about:", "o": ["0.00 °C exactly", "−1.86 °C", "−0.28 °C", "−0.00028 °C"], "a": 3, "e": "ΔTf = 1.86 × 1.5 × 10⁻⁴ = 2.8 × 10⁻⁴ °C. This is far too small to measure, which is why osmotic pressure is used for macromolecules. The solution freezes at −0.00028 °C.", "h": "Tiny ΔTf for huge molecules: use osmotic pressure."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125", "q": "Colligative properties depend on:", "o": ["the number of solute particles, not their identity", "the chemical nature of the solute only", "the colour of the solute", "the molar mass of the solute only"], "a": 0, "e": "The book says they depend solely on the concentration of non-volatile solute, and the nature or size of solute does not matter. ⚠ For ionic solutes you count the particles after dissociation.", "h": "Number of particles, not what they are."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125", "q": "The four colligative properties listed are:", "o": ["vapour pressure lowering, boiling point elevation, freezing point depression and osmotic pressure", "solubility, density, mass and volume", "vapour pressure rise, boiling point fall, freezing point rise and surface tension", "density, viscosity, colour and pH"], "a": 0, "e": "The four are lowering of vapour pressure, elevation of boiling point, depression of freezing point and osmotic pressure.", "h": "V-B-F-O."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125", "q": "Knowledge of colligative properties can be used to find:", "o": ["the speed of light in a liquid", "the number of neutrons in an atom", "the colour of a salt", "the molar mass of a solute"], "a": 3, "e": "The book says they are used for the concentration of solute particles, molecular weight of the solute and purity of solute samples.", "h": "Molar masses from ΔTf, ΔTb, π."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125", "q": "Raoult’s law for a solution with a non-volatile solute is:", "o": ["P(soln) = P° ÷ x(solvent)", "P(soln) = P° + x(solute)", "P(soln) = x(solvent) × P°(solvent)", "P(soln) = x(solute) × P°(solvent)"], "a": 2, "e": "The vapour pressure of the solution equals the mole fraction of solvent times the vapour pressure of the pure solvent.", "h": "Solvent mole fraction for the solution pressure."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125", "q": "A non-volatile solute causes the vapour pressure of a solvent to:", "o": ["stay the same", "decrease", "increase", "become zero"], "a": 1, "e": "Solute particles reduce the number of solvent molecules at the surface, so fewer escape into the vapour.", "h": "Solute lowers vapour pressure."}, {"ch": 10, "k": "concept", "s": "Ch11 p.126", "q": "Raoult’s law holds best for solutions that are:", "o": ["made of gases dissolved in each other", "highly concentrated, with x(solvent) below 0.50", "ideal or very dilute, with x(solvent) above 0.97", "made of ionic compounds in all cases"], "a": 2, "e": "The book says it strictly applies to ideal solutions, though it also works for reasonably dilute non-ideal solutions (xsolv > 0.97).", "h": "Dilute and ideal."}, {"ch": 10, "k": "concept", "s": "Ch11 p.126", "q": "The lowering of vapour pressure is given by:", "o": ["ΔP = x(solute) × P°(solvent)", "ΔP = P° ÷ x(solute)", "ΔP = P(soln) × x(solute)", "ΔP = x(solvent) × P°"], "a": 0, "e": "ΔP = P° − P(soln) = P° (1 − x solvent) = x(solute) P°.", "h": "ΔP = solute fraction × P°."}, {"ch": 10, "k": "concept", "s": "Ch11 p.127", "q": "The freezing point of a liquid is the temperature at which:", "o": ["the solid begins to boil", "the liquid and solid phases have the same vapour pressure", "the vapour pressure equals the external pressure", "the liquid has zero vapour pressure"], "a": 1, "e": "The book defines it this way. It is also where the first solid appears from the solution. Boiling is when vapour pressure equals the external pressure.", "h": "⚠ TRAP: do not mix up the freezing and boiling definitions."}, {"ch": 10, "k": "concept", "s": "Ch11 p.127", "q": "A solution freezes at a temperature that is:", "o": ["the same as the pure solvent", "absolute zero", "lower than the pure solvent", "higher than the pure solvent"], "a": 2, "e": "This is freezing point depression. It is why salt is spread on roads in cold regions and antifreeze is used in car radiators.", "h": "Solute lowers the freezing point."}, {"ch": 10, "k": "concept", "s": "Ch11 p.127", "q": "The equation for freezing point depression is:", "o": ["ΔTf = Kf/m", "ΔTf = Kf × M", "ΔTf = −Kf/m", "ΔTf = −Kf m"], "a": 3, "e": "The minus sign shows the freezing point is lowered. m is molality, and Kf is the cryoscopic constant.", "h": "Molality, not molarity."}, {"ch": 10, "k": "concept", "s": "Ch11 p.127-128", "q": "The cryoscopic constant Kf is:", "o": ["the freezing point depression produced by a 1.0 m solution", "the boiling point rise of a 1.0 M solution", "the osmotic pressure of a 1.0 M solution", "the vapour pressure of a 1.0 m solution"], "a": 0, "e": "It is the molal freezing-point-depression constant, characteristic of each solvent (1.86 °C/m for water).", "h": "Kf is for freezing; Kb is for boiling."}, {"ch": 10, "k": "concept", "s": "Ch11 p.128", "q": "Kf for water is:", "o": ["18.6 °C/m", "0.512 °C/m", "1.86 °C/m", "4.68 °C/m"], "a": 2, "e": "Kf(water) = 1.86 °C/m. Kb(water) = 0.512 °C/m. Kf for chloroform is 4.68 °C/m (from the exercises).", "h": "Kf 1.86, Kb 0.512."}, {"ch": 10, "k": "concept", "s": "Ch11 p.129", "q": "A liquid boils when:", "o": ["its vapour pressure equals the external pressure", "its vapour pressure falls to zero in the open", "its temperature reaches the freezing point", "its osmotic pressure is the highest it can be"], "a": 0, "e": "A non-volatile solute lowers the vapour pressure, so a higher temperature is needed to reach the external pressure. That is boiling point elevation.", "h": "Boiling: vapour pressure = outside pressure."}, {"ch": 10, "k": "concept", "s": "Ch11 p.129", "q": "The boiling point of a solution of a non-volatile solute is:", "o": ["below zero", "the same as the pure solvent", "lower than that of the pure solvent", "higher than that of the pure solvent"], "a": 3, "e": "ΔTb = Tb(soln) − Tb(solvent) = Kb m, and is positive.", "h": "Boiling point goes up, freezing point goes down."}, {"ch": 10, "k": "concept", "s": "Ch11 p.129", "q": "The equation for boiling point elevation is:", "o": ["ΔTb = −Kb m", "ΔTb = Kb × M", "ΔTb = Kb m", "ΔTb = Kb/m"], "a": 2, "e": "No minus sign: the boiling point rises. m is molality (mol/kg).", "h": "Kb m, positive."}, {"ch": 10, "k": "concept", "s": "Ch11 p.129", "q": "Kb for water, 0.512 °C/m, means that:", "o": ["one mole in 1 L of water lowers the boiling point by 0.512 °C", "one gram in 1 kg of water raises it by 0.512 °C", "1 kg of solute in 1 mol of water raises it by 0.512 °C", "one mole of non-volatile solute in 1 kg of water raises the boiling point by 0.512 °C"], "a": 3, "e": "It is the elevation for a 1.0 m solution.", "h": "One molal gives one Kb."}, {"ch": 10, "k": "concept", "s": "Ch11 p.130", "q": "Osmosis is the passage of solvent molecules:", "o": ["from a gas to a liquid", "through a membrane from high to low solute concentration", "through any container wall", "through a semipermeable membrane from low to high solute concentration"], "a": 3, "e": "Solvent moves toward the more concentrated solution. ⚠ Water moves from dilute to concentrated.", "h": "Water follows the solute."}, {"ch": 10, "k": "concept", "s": "Ch11 p.130", "q": "Osmotic pressure is:", "o": ["the pressure of the atmosphere on a solution", "the pressure applied on the concentrated side to stop net flow", "the pressure at which a liquid begins to boil", "the pressure of vapour sitting above a solution"], "a": 1, "e": "It balances the flow of solvent across a semipermeable membrane.", "h": "Stops the osmosis."}, {"ch": 10, "k": "concept", "s": "Ch11 p.130", "q": "Which of these is a semipermeable membrane named in the book?", "o": ["A glass window", "Parchment paper or animal skin", "A sheet of aluminium foil", "A steel plate"], "a": 1, "e": "Others include a pig’s bladder, cell membranes, the lining of the digestive tract and the walls of blood vessels.", "h": "Natural membranes."}, {"ch": 10, "k": "concept", "s": "Ch11 p.130", "q": "The van’t Hoff equation for osmotic pressure of a dilute solution is:", "o": ["π = Kb m, with no gas constant", "π = MR/T, with no moles term", "π = (n/V)RT = MRT", "π = n/RT, with no volume term"], "a": 2, "e": "π is osmotic pressure, n/V is the molarity, R the gas constant and T the temperature in kelvin.", "h": "Same shape as PV = nRT."}, {"ch": 10, "k": "concept", "s": "Ch11 p.130", "q": "Osmotic pressure is the best colligative property for finding the molar mass of macromolecules because:", "o": ["even tiny concentrations give a measurable pressure", "their freezing point rises a very great deal", "they are all volatile at room temperature", "they boil at a very low temperature"], "a": 0, "e": "Proteins and polymers have high molar masses and low molarity, so ΔTf and ΔTb are too small, but osmotic pressure is still easy to read.", "h": "Big molecules: use osmotic pressure."}, {"ch": 10, "k": "concept", "s": "Ch11 p.131", "q": "In π = MRT the temperature must be in:", "o": ["kelvin", "any unit", "degrees Fahrenheit", "degrees Celsius"], "a": 0, "e": "T(K) = °C + 273. In the haemoglobin example, 22 °C = 295 K.", "h": "Add 273 first."}, {"ch": 10, "k": "concept", "s": "Ch11 p.131", "q": "If R = 0.08206 L atm/mol K is used in π = MRT, then π comes out in:", "o": ["atm", "mmHg", "torr", "Pa"], "a": 0, "e": "The unit of π follows the unit of R. Convert torr to atm by dividing by 760.", "h": "Use matching units."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125 variant", "q": "A solution of 0.10 m urea (non-electrolyte) in water has a freezing point depression of:", "o": ["0.186 °C", "0.372 °C", "0.0186 °C", "1.86 °C"], "a": 0, "e": "ΔTf = 1.86 × 0.10 = 0.186 °C.", "h": "Kf × m."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125 variant", "q": "Compared with 0.10 m urea, a 0.10 m NaCl solution (fully dissociated) lowers the freezing point:", "o": ["by the same amount", "about twice as much", "about half as much", "about ten times as much"], "a": 1, "e": "NaCl gives two particles (Na⁺ and Cl⁻) per formula unit, so ΔTf ≈ 2 × 0.186 = 0.372 °C. Colligative properties count particles.", "h": "⚠ TRAP: ionic solutes count each ion."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125 variant", "q": "Which of these 0.10 m solutions has the lowest freezing point?", "o": ["NaCl", "Glucose", "CaCl₂", "Urea"], "a": 2, "e": "CaCl₂ gives three particles per formula unit (Ca²⁺ + 2Cl⁻), NaCl two, glucose and urea one each.", "h": "Count the ions."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125 variant", "q": "Which solution has the highest boiling point?", "o": ["0.10 m glucose", "0.10 m Na₂SO₄", "Pure water", "0.10 m NaCl"], "a": 1, "e": "Na₂SO₄ gives three ions, so it has the largest number of particles.", "h": "More particles, higher boiling point."}, {"ch": 10, "k": "concept", "s": "Ch11 p.129 variant", "q": "6.0 g of urea (60 g/mol) is dissolved in 100 g of water. The boiling point of the solution is about:", "o": ["100.05 °C", "101.0 °C", "99.49 °C", "100.51 °C"], "a": 3, "e": "n = 0.10 mol. m = 0.10 / 0.100 kg = 1.0 m. ΔTb = 0.512 × 1.0 = 0.512 °C. Boiling point = 100.51 °C.", "h": "Raise from 100 °C."}, {"ch": 10, "k": "concept", "s": "Ch11 p.127 variant", "q": "6.0 g of urea (60 g/mol) is dissolved in 100 g of water. The freezing point of the solution is about:", "o": ["−0.186 °C", "+1.86 °C", "−0.51 °C", "−1.86 °C"], "a": 3, "e": "m = 1.0, ΔTf = 1.86 × 1.0 = 1.86 °C, so Tf = −1.86 °C.", "h": "Same urea, but freezing uses Kf."}, {"ch": 10, "k": "concept", "s": "Ch11 p.127 variant", "q": "5.0 g of an unknown non-electrolyte in 100 g of water lowers the freezing point by 0.93 °C (Kf = 1.86 °C/m). Its molar mass is:", "o": ["10 g/mol", "100 g/mol", "200 g/mol", "50 g/mol"], "a": 1, "e": "m = 0.93/1.86 = 0.50 m. Moles in 0.100 kg = 0.050 mol. M = 5.0 g ÷ 0.050 mol = 100 g/mol.", "h": "m → moles → molar mass."}, {"ch": 10, "k": "concept", "s": "Ch11 p.129 variant", "q": "18.0 g of glucose (180 g/mol) is dissolved in 500 g of water (Kb = 0.512 °C/m). ΔTb is:", "o": ["1.02 °C", "0.102 °C", "0.512 °C", "0.0512 °C"], "a": 1, "e": "n = 0.100 mol. m = 0.100 / 0.500 kg = 0.200 m. ΔTb = 0.512 × 0.200 = 0.102 °C.", "h": "Do not forget to change g into kg."}, {"ch": 10, "k": "concept", "s": "Ch11 p.131 variant", "q": "The osmotic pressure of 0.10 M glucose at 27 °C (R = 0.08206 L atm/mol K) is:", "o": ["24.6 atm", "2.46 atm", "0.0082 atm", "0.246 atm"], "a": 1, "e": "π = 0.10 × 0.08206 × 300 = 2.46 atm.", "h": "T = 27 + 273 = 300 K."}, {"ch": 10, "k": "concept", "s": "Ch11 p.131 variant", "q": "Doubling the molarity of a solute at constant temperature, the osmotic pressure:", "o": ["stays the same", "halves", "increases four times", "doubles"], "a": 3, "e": "π = MRT, so π is directly proportional to M.", "h": "π ∝ M."}, {"ch": 10, "k": "concept", "s": "Ch11 p.126 variant", "q": "x(solvent) in a solution is 0.90 and the pure solvent has P° = 50 torr. The vapour pressure of the solution is:", "o": ["5 torr", "45 torr", "55 torr", "50 torr"], "a": 1, "e": "P = 0.90 × 50 = 45 torr, so ΔP = 5 torr.", "h": "Solution pressure is lower than P°."}, {"ch": 10, "k": "concept", "s": "Ch11 p.126 variant", "q": "1 mol of non-volatile solute is dissolved in 9 mol of solvent with P° = 100 torr. The vapour pressure of the solution is:", "o": ["100 torr", "110 torr", "90 torr", "10 torr"], "a": 2, "e": "x(solvent) = 9/10 = 0.9. P = 0.9 × 100 = 90 torr.", "h": "Mole fraction of solvent first."}, {"ch": 10, "k": "concept", "s": "Ch11 p.127", "q": "Why is salt spread on icy roads in cold regions?", "o": ["It raises the freezing point of water", "It adds heat to the ice", "It lowers the density of ice", "It lowers the freezing point of the water"], "a": 3, "e": "The solute lowers the freezing point, so the ice melts at a temperature below 0 °C.", "h": "Salt on roads = freezing point depression."}, {"ch": 10, "k": "concept", "s": "Ch11 p.129", "q": "Adding antifreeze (ethylene glycol) to car radiator water helps because it:", "o": ["lowers both freezing and boiling points", "raises both freezing and boiling points", "lowers the freezing point and raises the boiling point", "raises the freezing point and lowers the boiling point"], "a": 2, "e": "The book asks you to think how these effects solve the problem of freezing in car radiators. Antifreeze acts as a non-volatile solute: ΔTf down, ΔTb up.", "h": "Both effects at once."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125", "q": "Colligative properties apply to solutions of:", "o": ["non-volatile solutes", "volatile solutes only", "insoluble solids", "gases only"], "a": 0, "e": "The difference between a pure solvent and its solution depends only on the number of non-volatile solute particles.", "h": "Non-volatile solute."}, {"ch": 10, "k": "concept", "s": "Ch11 p.126", "q": "In an ideal solution, the solute–solvent attractions are:", "o": ["zero", "the same as the attractions between like molecules", "much stronger than the solvent–solvent forces", "much weaker than the solvent–solvent forces"], "a": 1, "e": "This is what makes Raoult’s law hold exactly.", "h": "Ideal: all attractions similar."}, {"ch": 10, "k": "concept", "s": "Ch11 p.128", "q": "In ΔTf = −Kf m, the molality is:", "o": ["moles of solute per litre of solution", "moles of solute per mole of solution", "grams of solute per litre", "moles of solute per kg of solvent"], "a": 3, "e": "It is molality, so the mass of solvent matters, not the volume of solution.", "h": "Molality for ΔTf and ΔTb."}, {"ch": 10, "k": "concept", "s": "Ch11 p.127", "q": "The freezing point of a solution is found from:", "o": ["Kf ÷ m", "Tf(solvent) + ΔTf", "Tf(solvent) − ΔTf", "ΔTf alone"], "a": 2, "e": "ΔTf is the depression (positive number), so subtract it from the pure-solvent freezing point.", "h": "Subtract."}, {"ch": 10, "k": "concept", "s": "Ch11 p.129", "q": "The boiling point of a solution is found from:", "o": ["Kb ÷ m", "ΔTb alone", "Tb(solvent) + ΔTb", "Tb(solvent) − ΔTb"], "a": 2, "e": "Elevation means going up from the pure-solvent boiling point.", "h": "Add."}, {"ch": 10, "k": "concept", "s": "Ch11 p.126 variant", "q": "A solution has x(solute) = 0.05 and the solvent has P° = 200 torr. The lowering of vapour pressure is:", "o": ["190 torr", "10 torr", "100 torr", "5 torr"], "a": 1, "e": "ΔP = 0.05 × 200 = 10 torr, so the solution has 190 torr.", "h": "ΔP uses x(solute)."}, {"ch": 10, "k": "concept", "s": "Ch11 p.128 variant", "q": "A 0.50 m non-electrolyte solution in water freezes at:", "o": ["−1.86 °C", "−0.93 °C", "+0.93 °C", "−0.50 °C"], "a": 1, "e": "ΔTf = 1.86 × 0.50 = 0.93 °C, so the freezing point is 0 − 0.93 = −0.93 °C.", "h": "Depress means go below 0 °C for water."}, {"ch": 10, "k": "concept", "s": "Ch11 p.129 variant", "q": "A 2.0 m non-electrolyte solution in water boils at (Kb = 0.512 °C/m):", "o": ["101.02 °C", "100.51 °C", "98.98 °C", "102.0 °C"], "a": 0, "e": "ΔTb = 0.512 × 2.0 = 1.02 °C. Boiling point = 100 + 1.02 = 101.02 °C.", "h": "Elevation: add to 100 °C."}, {"ch": 10, "k": "concept", "s": "Ch11 p.125", "q": "Which pair of solutions have the same colligative properties, if both are non-electrolytes?", "o": ["0.1 m glucose and 0.1 m NaCl", "0.1 m urea and 0.1 m CaCl₂", "0.1 m glucose and 0.1 m urea", "0.1 m glucose and 0.2 m urea"], "a": 2, "e": "Same molality of non-dissociating solutes means the same number of particles, so the same properties.", "h": "Same particle count = same colligative effect."}, {"ch": 11, "k": "example", "s": "Ch12 p.143", "q": "Resolve 2Sr + O₂ → 2SrO into half-reactions. Which pair is correct?", "o": ["Oxidation: Sr²⁺ → Sr + 2e⁻; reduction: O²⁻ → O₂", "Oxidation: O₂ → 2O²⁻; reduction: Sr → Sr²⁺ + 2e⁻", "Oxidation: Sr → Sr²⁺ + 2e⁻; reduction: O₂ + 4e⁻ → 2O²⁻", "Oxidation: Sr → Sr⁺ + e⁻; reduction: O₂ + 2e⁻ → O²⁻"], "a": 2, "e": "Sr goes from 0 to +2 (loses electrons, oxidised). Oxygen goes from 0 to −2 (gains electrons, reduced). ⚠ The book writes the products as “Sr₂” and “O₂⁻” by mistake; they are Sr²⁺ and O²⁻.", "h": "Metal loses electrons, non-metal gains them."}, {"ch": 11, "k": "example", "s": "Ch12 p.143", "q": "In 2Sr + O₂ → 2SrO, the oxidising agent is:", "o": ["O₂", "Sr", "SrO", "Sr²⁺"], "a": 0, "e": "O₂ takes the electrons and is reduced, so it is the oxidant. Sr gives the electrons, so it is the reductant.", "h": "Oxidant = the one that gets reduced."}, {"ch": 11, "k": "example", "s": "Ch12 p.143", "q": "In 2Sr + O₂ → 2SrO, how many electrons are transferred in total?", "o": ["4", "6", "2", "1"], "a": 0, "e": "Each Sr loses 2 electrons and there are 2 Sr atoms: 2 × 2 = 4 electrons, which the O₂ molecule gains.", "h": "Total electrons = atoms × change per atom."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.144", "q": "In 2Ca + O₂ → 2CaO, which species is the reductant?", "o": ["O₂", "O²⁻", "Ca", "CaO"], "a": 2, "e": "Ca goes 0 → +2 (oxidised), so Ca is the reducing agent.", "h": "Reductant is oxidised."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.144", "q": "In 2Na + S → Na₂S, the reduction half-reaction is:", "o": ["Na → Na⁺ + e⁻", "S → S²⁻ + 2e⁻", "S + 2e⁻ → S²⁻", "2Na⁺ + 2e⁻ → 2Na"], "a": 2, "e": "Sulphur gains two electrons (0 → −2), which is reduction. Na → Na⁺ + e⁻ is the oxidation half.", "h": "Gain of e⁻ = reduction."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.144", "q": "In 2Li + H₂ → 2LiH, the oxidation number of hydrogen changes from 0 to:", "o": ["−1", "−2", "0", "+1"], "a": 0, "e": "In metal hydrides hydrogen is −1. Li goes 0 → +1 (oxidised) and H goes 0 → −1 (reduced), so H₂ is the oxidant here.", "h": "⚠ TRAP: H is −1 in hydrides, not +1."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.144", "q": "In 3Mg + N₂ → Mg₃N₂, what are the oxidation numbers of Mg and N in the product?", "o": ["Mg = +4, N = −3", "Mg = +3, N = −2", "Mg = +2, N = +3", "Mg = +2, N = −3"], "a": 3, "e": "Mg is in Group II so it is +2. Three Mg give +6, so the two N must give −6, which is −3 each. ⚠ The book’s working shows Mg as +4 at one point; that is wrong.", "h": "Group II metals are always +2 in compounds."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.144", "q": "In 3Mg + N₂ → Mg₃N₂, the oxidising agent is:", "o": ["Mg²⁺", "N₂", "Mg", "Mg₃N₂"], "a": 1, "e": "N₂ gains electrons (0 → −3) and is reduced, so it is the oxidant. Mg is the reductant.", "h": "Non-metal element + metal: non-metal is the oxidant."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.144", "q": "In Zn + I₂ → ZnI₂, which half-reaction is the oxidation?", "o": ["2I⁻ → I₂ + 2e⁻", "Zn²⁺ + 2e⁻ → Zn", "I₂ + 2e⁻ → 2I⁻", "Zn → Zn²⁺ + 2e⁻"], "a": 3, "e": "Zn loses two electrons and rises from 0 to +2, which is oxidation. Iodine is reduced to iodide.", "h": "Oxidation = electrons on the product side."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.144", "q": "In 2C + O₂ → 2CO, the oxidation number of carbon changes from:", "o": ["0 to −2", "0 to +4", "0 to +2", "+2 to 0"], "a": 2, "e": "In CO oxygen is −2, so carbon is +2. Complete combustion to CO₂ would give +4. Carbon is oxidised and is the reductant.", "h": "CO is +2; CO₂ is +4."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.144", "q": "In 2C + O₂ → 2CO, the oxidant is:", "o": ["CO₂", "C", "CO", "O₂"], "a": 3, "e": "Oxygen goes 0 → −2, so it is reduced and is the oxidising agent.", "h": "Oxygen is the usual oxidant in combustion."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Arrange these sulphur species in order of increasing oxidation number of S: S²⁻, S₃, SO₂, SO₃.", "o": ["S²⁻ < SO₂ < S₃ < SO₃", "SO₃ < SO₂ < S₃ < S²⁻", "S²⁻ < S₃ < SO₂ < SO₃", "S₃ < S²⁻ < SO₂ < SO₃"], "a": 2, "e": "S²⁻ = −2, S₃ (element) = 0, SO₂ = +4, SO₃ = +6.", "h": "Element is 0, sulphide is −2, oxides are positive."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "In the list H₂S, HS⁻, S²⁻, which statement is true about the oxidation number of sulphur?", "o": ["It is −2 in all three", "It is −1 in HS⁻ only", "It is +2 in S²⁻", "It is 0 in H₂S"], "a": 0, "e": "H₂S: 2(+1) + S = 0 gives −2. HS⁻: +1 + S = −1 gives −2. S²⁻ is −2 by its charge.", "h": "Count the hydrogens first, then the charge."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "The oxidation number of sulphur in H₂SO₄ is:", "o": ["+4", "+6", "−2", "+2"], "a": 1, "e": "2(+1) + S + 4(−2) = 0, so S = +6.", "h": "Sulphuric acid: S is at its highest state, +6."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Cs in a normal Group I compound such as Cs₂O is:", "o": ["−1", "+1", "0", "+2"], "a": 1, "e": "Group I metals are always +1. ⚠ The book lists “CsO”, which is not a normal oxide formula (Cs₂O is). If you ever see CsO, treat the metal as +1 and expect a peroxide or superoxide type oxygen.", "h": "Group I = +1, no exceptions."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Ca in CaI₂:", "o": ["+2", "+1", "−2", "+3"], "a": 0, "e": "Iodide is −1 each, so 2(−1) + Ca = 0 gives Ca = +2.", "h": "Group II = +2."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Al in Al₂O₃:", "o": ["+6", "+2", "+3", "+1"], "a": 2, "e": "3(−2) = −6, so 2 Al must be +6, giving +3 each.", "h": "Divide by the number of atoms of the metal."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of As in H₃AsO₃:", "o": ["+1", "+3", "−3", "+5"], "a": 1, "e": "3(+1) + As + 3(−2) = 0, so As = +3.", "h": "Add the known ones, solve for the unknown."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Ti in TiO₂:", "o": ["+2", "+3", "+8", "+4"], "a": 3, "e": "2(−2) = −4, so Ti = +4.", "h": "Metal oxide MO₂ gives +4."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Mo in MoO₄²⁻:", "o": ["+6", "+8", "+2", "+4"], "a": 0, "e": "Mo + 4(−2) = −2 gives Mo = +6.", "h": "Total charge on the ion = sum of all oxidation numbers."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Pt in PtCl₄²⁻:", "o": ["+2", "+6", "−2", "+4"], "a": 0, "e": "Pt + 4(−1) = −2 gives Pt = +2.", "h": "Chloride is −1 each; the ion charge is −2."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Sn in SnF₂:", "o": ["+1", "+2", "+4", "−2"], "a": 1, "e": "Fluorine is −1 each, so Sn = +2.", "h": "F is always −1."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Cl in ClF₃:", "o": ["+5", "+3", "+1", "−3"], "a": 1, "e": "F is more electronegative than Cl and is −1, so Cl = +3.", "h": "Fluorine always wins and takes −1."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation numbers of the halogen in HClO₄, HClO₃, HClO₂ and HClO respectively are:", "o": ["+8, +6, +4, +2", "+7, +5, +3, +1", "+4, +3, +2, +1", "+7, +5, +3, −1"], "a": 1, "e": "HClO₄: 1 + Cl − 8 = 0 gives +7. HClO₃: +5. HClO₂: +3. HClO: +1. Each fewer oxygen drops the number by 2.", "h": "Subtract 2 for each oxygen you remove."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.145", "q": "The oxidation number of Br in HBrO₄ and of I in HIO₄ are:", "o": ["both +4", "+7 and +5", "both +7", "both +5"], "a": 2, "e": "Same formula type as HClO₄: 1 + X + 4(−2) = 0 gives X = +7.", "h": "Same formula, same number."}, {"ch": 11, "k": "example", "s": "Ch12 p.146", "q": "Disproportionation is a reaction in which an element:", "o": ["is both oxidised and reduced", "is only reduced in the reaction", "is only oxidised in the reaction", "keeps the same oxidation number"], "a": 0, "e": "One species in one oxidation state forms products in a higher and a lower state. Example: 2H₂O₂ → 2H₂O + O₂.", "h": "One element, two directions."}, {"ch": 11, "k": "example", "s": "Ch12 p.146", "q": "In 2H₂O₂ → 2H₂O + O₂, the oxidation number of oxygen goes from −1 to:", "o": ["0 only", "−1 and −2", "−2 only", "−2 and 0"], "a": 3, "e": "Some oxygen drops to −2 (in water, reduced) and some rises to 0 (in O₂, oxidised). That is disproportionation.", "h": "Peroxide oxygen is −1."}, {"ch": 11, "k": "example", "s": "Ch12 p.146", "q": "In Cl₂ + 2NaOH → NaClO + NaCl + H₂O, chlorine goes from 0 to:", "o": ["+5 and −1", "+1 and −1", "+1 only", "−1 only"], "a": 1, "e": "Chlorine in NaClO is +1 (oxidised) and in NaCl is −1 (reduced). The same Cl₂ does both.", "h": "Cold dilute NaOH gives hypochlorite."}, {"ch": 11, "k": "example", "s": "Ch12 p.145", "q": "Which reaction is a halogen displacement? Cl₂ + 2KBr → 2KCl + Br₂. Here the reducing agent is:", "o": ["Br⁻", "K⁺", "Cl⁻", "Cl₂"], "a": 0, "e": "Br⁻ is oxidised to Br₂ (loses electrons), so bromide is the reductant. Chlorine is reduced and is the oxidant.", "h": "Halide that gets displaced is the reductant."}, {"ch": 11, "k": "example", "s": "Ch12 p.145", "q": "Why does the book say fluorine displacement is not done in water?", "o": ["F₂ reacts violently with water", "F₂ is insoluble in every solvent", "F₂ is the weakest oxidant of the halogens", "F₂ is a solid at room temperature"], "a": 0, "e": "Fluorine is such a strong oxidant that it attacks water directly, so you cannot test its displacement of other halides in aqueous solution.", "h": "F₂ + H₂O is violent. Do the test with Cl₂, Br₂, I₂."}, {"ch": 11, "k": "example", "s": "Ch12 p.146", "q": "Br₂ + 2I⁻ → 2Br⁻ + I₂ works because bromine is:", "o": ["less electronegative than iodine", "a weaker oxidising agent than iodine", "a stronger oxidising agent than iodine", "a stronger reducing agent than iodide"], "a": 2, "e": "Oxidising power falls down Group VII: F₂ > Cl₂ > Br₂ > I₂. Bromine can oxidise iodide but not chloride.", "h": "Higher up the group displaces the one below."}, {"ch": 11, "k": "example", "s": "Ch12 p.147", "q": "In the book’s Example 1, Cr₂O₇²⁻ + C → Cr³⁺ + CO₂ (acid), the balanced equation is:", "o": ["Cr₂O₇²⁻ + 8H⁺ + 3C → 2Cr³⁺ + 4H₂O + 3CO₂", "2Cr₂O₇²⁻ + 28H⁺ + 3C → 4Cr³⁺ + 14H₂O + 3CO₂", "2Cr₂O₇²⁻ + 16H⁺ + 3C → 4Cr³⁺ + 8H₂O + 3CO₂", "Cr₂O₇²⁻ + 14H⁺ + C → 2Cr³⁺ + 7H₂O + CO₂"], "a": 2, "e": "Reduction: Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O (×2). Oxidation: C + 2H₂O → CO₂ + 4H⁺ + 4e⁻ (×3). Add, then cancel 12H⁺ and 6H₂O: 16H⁺ and 8H₂O remain. Charge: left 2(−2) + 16 = +12; right 4(+3) = +12.", "h": "Always check the charge totals at the end."}, {"ch": 11, "k": "example", "s": "Ch12 p.147", "q": "In Example 1, the half-reaction Cr₂O₇²⁻ → Cr³⁺ is identified as reduction because Cr changes from:", "o": ["+3 to +6", "+6 to +3", "+7 to +3", "0 to +3"], "a": 1, "e": "In Cr₂O₇²⁻: 2Cr + 7(−2) = −2 gives Cr = +6. Falling to +3 means gain of electrons.", "h": "Number goes down = reduction."}, {"ch": 11, "k": "example", "s": "Ch12 p.147", "q": "In Example 1, how many electrons does one Cr₂O₇²⁻ gain?", "o": ["3", "4", "2", "6"], "a": 3, "e": "Two Cr atoms each drop from +6 to +3, which is 3 electrons each, so 6 in total.", "h": "Atoms × change per atom."}, {"ch": 11, "k": "example", "s": "Ch12 p.147", "q": "Why must the first half-reaction be multiplied by 2 and the second by 3 in Example 1?", "o": ["To make the charge on both sides zero", "To remove the water molecules", "To balance the oxygen atoms", "To make electrons gained and lost equal (12 each)"], "a": 3, "e": "The lowest common multiple of 6 and 4 is 12. So 2 × 6e⁻ and 3 × 4e⁻.", "h": "Electrons lost must equal electrons gained."}, {"ch": 11, "k": "example", "s": "Ch12 p.148", "q": "In the book’s Example 2 (basic medium), MnO₄⁻ is reduced to:", "o": ["MnO₂", "Mn²⁺", "Mn", "MnO₄²⁻"], "a": 0, "e": "In basic or neutral medium permanganate goes to MnO₂ (+4). In acidic medium it goes to Mn²⁺.", "h": "Acid: Mn²⁺. Base: MnO₂."}, {"ch": 11, "k": "example", "s": "Ch12 p.148", "q": "The balanced equation for MnO₄⁻ + I⁻ → MnO₂ + I₂ in basic medium is:", "o": ["6I⁻ + 2MnO₄⁻ + 8H⁺ → 3I₂ + 2MnO₂ + 4H₂O", "2I⁻ + MnO₄⁻ + 2H₂O → I₂ + MnO₂ + 4OH⁻", "6I⁻ + 2MnO₄⁻ + 4H₂O → 3I₂ + 2MnO₂ + 8OH⁻", "3I⁻ + MnO₄⁻ + 2H₂O → I₂ + MnO₂ + 2OH⁻"], "a": 2, "e": "Oxidation: 2I⁻ → I₂ + 2e⁻ (×3). Reduction: MnO₄⁻ + 2H₂O + 3e⁻ → MnO₂ + 4OH⁻ (×2). Six electrons pass. Charge: left −6 − 2 = −8; right −8.", "h": "The wrong options fail the charge test."}, {"ch": 11, "k": "example", "s": "Ch12 p.149", "q": "To balance the reduction half MnO₄⁻ → MnO₂ in base, the book first adds 2H₂O to the right, then 4H⁺ to the left, then:", "o": ["adds 4H⁺ to the right too", "adds 4OH⁻ to the left only", "removes the water and adds 4 electrons", "4OH⁻ to both sides, and combines H⁺ + OH⁻ into H₂O"], "a": 3, "e": "Adding the same OH⁻ to both sides keeps the equation balanced. 4H⁺ + 4OH⁻ become 4H₂O, which leaves MnO₄⁻ + 2H₂O → MnO₂ + 4OH⁻.", "h": "Basic medium: add OH⁻ equal to the H⁺ on both sides."}, {"ch": 11, "k": "example", "s": "Ch12 p.149", "q": "In MnO₄⁻ + 2H₂O + 3e⁻ → MnO₂ + 4OH⁻, the total charge on each side is:", "o": ["−3", "−1", "−4", "0"], "a": 2, "e": "Left: MnO₄⁻ (−1) plus 3 electrons (−3) = −4. Right: 4OH⁻ = −4. Both sides match, so the half-reaction is balanced.", "h": "Charges must match on both sides."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.150", "q": "Problem (a): ClO₃⁻ + Cl⁻ → Cl₂ + ClO₂ (acid). The balanced equation is:", "o": ["2ClO₃⁻ + 2Cl⁻ + 2H⁺ → Cl₂ + 2ClO₂ + H₂O", "ClO₃⁻ + Cl⁻ + 2H⁺ → Cl₂ + ClO₂ + H₂O", "2ClO₃⁻ + 2Cl⁻ + 4H⁺ → Cl₂ + 2ClO₂ + 2H₂O", "ClO₃⁻ + 2Cl⁻ + 6H⁺ → Cl₂ + ClO₂ + 3H₂O"], "a": 2, "e": "ClO₃⁻ + 2H⁺ + e⁻ → ClO₂ + H₂O (×2); 2Cl⁻ → Cl₂ + 2e⁻. Sum: 2ClO₃⁻ + 4H⁺ + 2Cl⁻ → 2ClO₂ + 2H₂O + Cl₂. Charge: −2 −2 + 4 = 0 on both sides.", "h": "Chlorate goes +5 → +4; chloride goes −1 → 0."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.150", "q": "Problem (b): Mn²⁺ + H₂O₂ → MnO₂ (basic). The balanced equation is:", "o": ["Mn²⁺ + H₂O₂ → MnO₂ + 2H⁺", "Mn²⁺ + H₂O₂ + 4OH⁻ → MnO₂ + 4H₂O", "Mn²⁺ + H₂O₂ + 2OH⁻ → MnO₂ + 2H₂O", "Mn²⁺ + 2H₂O₂ + 2OH⁻ → MnO₂ + 4H₂O"], "a": 2, "e": "Mn²⁺ + 4OH⁻ → MnO₂ + 2H₂O + 2e⁻; H₂O₂ + 2e⁻ → 2OH⁻. Sum and cancel 2OH⁻. ⚠ The book prints “Mn₂⁺”; it should be Mn²⁺. Here H₂O₂ acts as the oxidant.", "h": "Peroxide −1 → −2 means it is the oxidant here."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.150", "q": "Problem (c): Cr₂O₇²⁻ + C₂O₄²⁻ → Cr³⁺ + CO₂ (acid). The balanced equation is:", "o": ["Cr₂O₇²⁻ + C₂O₄²⁻ + 14H⁺ → 2Cr³⁺ + 2CO₂ + 7H₂O", "Cr₂O₇²⁻ + 3C₂O₄²⁻ + 14H⁺ → 2Cr³⁺ + 6CO₂ + 7H₂O", "2Cr₂O₇²⁻ + 3C₂O₄²⁻ + 28H⁺ → 4Cr³⁺ + 6CO₂ + 14H₂O", "Cr₂O₇²⁻ + 3C₂O₄²⁻ + 7H⁺ → 2Cr³⁺ + 6CO₂ + 7H₂O"], "a": 1, "e": "Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O; C₂O₄²⁻ → 2CO₂ + 2e⁻ (×3). Charge: −2 − 6 + 14 = +6; right 2(+3) = +6. ⚠ The book prints Cr³⁻; it is Cr³⁺.", "h": "Oxalate gives 2 electrons per ion; dichromate takes 6."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.150", "q": "Problem (d): S₂O₃²⁻ + I₂ → I⁻ + S₄O₆²⁻. The balanced equation is:", "o": ["2S₂O₃²⁻ + 2I₂ → S₄O₆²⁻ + 4I⁻", "S₂O₃²⁻ + 2I₂ → S₂O₆²⁻ + 4I⁻", "S₂O₃²⁻ + I₂ → S₄O₆²⁻ + I⁻", "2S₂O₃²⁻ + I₂ → S₄O₆²⁻ + 2I⁻"], "a": 3, "e": "2S₂O₃²⁻ → S₄O₆²⁻ + 2e⁻ and I₂ + 2e⁻ → 2I⁻. No H⁺ or H₂O appears, because there is no oxygen change. The book labels it “acidic medium”, but the equation does not need H⁺.", "h": "⚠ TRAP: not every question labelled “acidic” needs H⁺."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.150", "q": "Problem (e): Bi(OH)₃ + SnO₂²⁻ → Bi + SnO₃²⁻ (basic). The balanced equation is:", "o": ["2Bi(OH)₃ + 3SnO₂²⁻ → 2Bi + 3SnO₃²⁻ + 6H₂O", "Bi(OH)₃ + 3SnO₂²⁻ → Bi + 3SnO₃²⁻ + 3H₂O", "Bi(OH)₃ + SnO₂²⁻ → Bi + SnO₃²⁻ + H₂O", "2Bi(OH)₃ + 3SnO₂²⁻ → 2Bi + 3SnO₃²⁻ + 3H₂O"], "a": 3, "e": "Bi(OH)₃ + 3e⁻ → Bi + 3OH⁻ (×2); SnO₂²⁻ + 2OH⁻ → SnO₃²⁻ + H₂O + 2e⁻ (×3). Six electrons pass; 6OH⁻ cancel. ⚠ The book prints SnO₃²⁻ on both sides; the reactant should be SnO₂²⁻ (stannite).", "h": "Bi goes +3 → 0; Sn goes +2 → +4."}, {"ch": 11, "k": "exercise", "s": "Ch12 p.150", "q": "Problem (f): CN⁻ + MnO₄⁻ → CNO⁻ + MnO₂ (basic). The balanced equation is:", "o": ["2CN⁻ + 3MnO₄⁻ + H₂O → 2CNO⁻ + 3MnO₂ + 2OH⁻", "CN⁻ + MnO₄⁻ + H₂O → CNO⁻ + MnO₂ + 2OH⁻", "3CN⁻ + 2MnO₄⁻ + 2H₂O → 3CNO⁻ + 2MnO₂ + 4OH⁻", "3CN⁻ + 2MnO₄⁻ + H₂O → 3CNO⁻ + 2MnO₂ + 2OH⁻"], "a": 3, "e": "CN⁻ + 2OH⁻ → CNO⁻ + H₂O + 2e⁻ (×3); MnO₄⁻ + 2H₂O + 3e⁻ → MnO₂ + 4OH⁻ (×2). Cancel to leave H₂O on the left and 2OH⁻ on the right. Charge: −5 on both sides.", "h": "Cyanide gives 2 e⁻, permanganate takes 3 e⁻: 3 : 2."}, {"ch": 11, "k": "trap", "s": "Ch12 p.145", "q": "The book gives F₂ + 2KCl → 2KF₂ + Cl₂. What is the correct formula for the potassium product?", "o": ["KF", "K₂F", "KF₂", "K₂F₂"], "a": 0, "e": "K is +1 and F is −1, so the compound is KF. Balanced: F₂ + 2KCl → 2KF + Cl₂. ⚠ The book’s “KF₂” is a typing error.", "h": "⚠ TRAP: check formulae with charges before balancing."}, {"ch": 11, "k": "concept", "s": "Ch12 p.147", "q": "The ion-electron method says balance a half-reaction in this order:", "o": ["main atoms, then O (H₂O), H (H⁺), then charge (e⁻)", "charge first, then atoms and then oxygen", "H with H₂O, O with H⁺, then electrons", "electrons first, then everything else"], "a": 0, "e": "Balance the main element, then oxygen by adding H₂O, then hydrogen by adding H⁺, and finally charge by adding electrons.", "h": "Order: main atom, O (H₂O), H (H⁺), charge (e⁻)."}, {"ch": 11, "k": "concept", "s": "Ch12 p.148", "q": "In an acidic medium, oxygen deficiency in a half-reaction is made up by adding:", "o": ["H₂", "OH⁻", "H₂O", "O₂"], "a": 2, "e": "Add H₂O to the side that needs oxygen, then add H⁺ to the other side for hydrogen.", "h": "Acid: H₂O and H⁺. Base: OH⁻ and H₂O."}, {"ch": 11, "k": "concept", "s": "Ch12 p.134", "q": "Oxidation, in the electron sense, is:", "o": ["gain of neutrons", "loss of protons", "gain of electrons", "loss of electrons"], "a": 3, "e": "OIL RIG: Oxidation Is Loss, Reduction Is Gain of electrons.", "h": "OIL RIG."}, {"ch": 11, "k": "concept", "s": "Ch12 p.134", "q": "Reduction, in terms of oxygen and hydrogen, is:", "o": ["gain of oxygen or loss of hydrogen", "loss of oxygen and gain of electrons only", "loss of oxygen or gain of hydrogen", "gain of electrons by an anion only"], "a": 2, "e": "Oxidation = gain of oxygen or loss of hydrogen. Reduction is the reverse.", "h": "Oxygen in = oxidation; hydrogen in = reduction."}, {"ch": 11, "k": "concept", "s": "Ch12 p.135", "q": "Which statement about oxidation and reduction is correct?", "o": ["Oxidation can occur without reduction", "Oxidation occurs only with oxygen", "Reduction occurs only in acids", "They always occur together in one reaction"], "a": 3, "e": "Electrons lost by one species must be gained by another, so you cannot have one without the other. That is why the reaction is called redox.", "h": "Redox = reduction + oxidation together."}, {"ch": 11, "k": "concept", "s": "Ch12 p.135", "q": "An oxidising agent is a substance that:", "o": ["gains hydrogen and is itself oxidised", "donates electrons and is itself oxidised", "loses oxygen and is itself oxidised", "accepts electrons and is itself reduced"], "a": 3, "e": "The oxidant oxidises another species by taking its electrons, so its own oxidation number falls.", "h": "⚠ TRAP: the oxidant is the species that is reduced."}, {"ch": 11, "k": "concept", "s": "Ch12 p.135", "q": "A reducing agent is a substance that:", "o": ["has a decreasing oxidation number", "donates electrons and is itself oxidised", "gains oxygen and is itself reduced", "accepts electrons and is itself reduced"], "a": 1, "e": "A reductant supplies electrons and its own oxidation number rises.", "h": "Reductant is oxidised."}, {"ch": 11, "k": "concept", "s": "Ch12 p.136", "q": "Which of these is a typical oxidising agent?", "o": ["Na", "KMnO₄", "H₂S", "Zn"], "a": 1, "e": "Permanganate has Mn at +7, its highest state, so it can only be reduced. Na and Zn are metals that readily lose electrons, and H₂S has S at −2.", "h": "Highest oxidation state = oxidising agent."}, {"ch": 11, "k": "concept", "s": "Ch12 p.136", "q": "Which of these is a typical reducing agent?", "o": ["KMnO₄", "K₂Cr₂O₇", "H₂S", "F₂"], "a": 2, "e": "Sulphur in H₂S is at its lowest state (−2), so it can only be oxidised. The others are strong oxidants.", "h": "Lowest oxidation state = reducing agent."}, {"ch": 11, "k": "concept", "s": "Ch12 p.137", "q": "Acidified KMnO₄ is used to test for a reducing agent. A positive result is:", "o": ["blue changes to brown", "orange changes to green", "colourless changes to purple", "purple colour changes to colourless"], "a": 3, "e": "MnO₄⁻ (purple, +7) is reduced to Mn²⁺ (very pale pink, almost colourless).", "h": "Purple to colourless = reductant present."}, {"ch": 11, "k": "concept", "s": "Ch12 p.137", "q": "Acidified K₂Cr₂O₇ is used to test for a reducing agent. A positive result is:", "o": ["green c
