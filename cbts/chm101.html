1.8 × 10⁻⁵.", "h": "Added acid: acid goes UP, salt goes DOWN."}, {"ch": 6, "k": "example", "s": "Ch7 p.83 Example", "q": "The buffer range of the HCO₃⁻/H₂CO₃ system (pKa = 6.38) is:", "o": ["6.00 to 7.00", "4.38 to 8.38", "5.38 to 7.38", "6.38 to 7.38"], "a": 2, "e": "Buffer range = pKa ± 1.00, so 6.38 − 1 = 5.38 and 6.38 + 1 = 7.38.", "h": "Range = pKa ± 1."}, {"ch": 6, "k": "example", "s": "Ch7 p.85 Example 1", "q": "The molar solubility of Ag₂SO₄ is 1.5 × 10⁻² mol/L. Its solubility product is:", "o": ["3.4 × 10⁻⁶", "1.4 × 10⁻⁵", "6.8 × 10⁻⁷", "4.5 × 10⁻⁵"], "a": 1, "e": "Ag₂SO₄ ⇌ 2Ag⁺ + SO₄²⁻. [Ag⁺] = 2 × 1.5 × 10⁻² = 3.0 × 10⁻², [SO₄²⁻] = 1.5 × 10⁻². Ksp = [Ag⁺]²[SO₄²⁻] = (3.0 × 10⁻²)² (1.5 × 10⁻²) = 1.35 × 10⁻⁵, which the book rounds to 1.4 × 10⁻⁵.", "h": "⚠ TRAP: Ag⁺ is twice the solubility AND squared in Ksp."}, {"ch": 6, "k": "example", "s": "Ch7 p.87 Example", "q": "200 cm³ of 0.0040 M BaCl₂ is added to 600 cm³ of 0.0080 M K₂SO₄. What is the ion product [Ba²⁺][SO₄²⁻] in the mixture, and does BaSO₄ (Ksp = 1.1 × 10⁻¹⁰) precipitate?", "o": ["2.4 × 10⁻⁸; yes, it precipitates", "6.0 × 10⁻⁶; yes, it precipitates", "6.0 × 10⁻⁶; no, it stays dissolved", "1.1 × 10⁻¹⁰; it is exactly saturated"], "a": 1, "e": "Total volume = 800 cm³. [Ba²⁺] = 8.0 × 10⁻⁴ mol ÷ 0.800 L = 1.0 × 10⁻³ M. [SO₄²⁻] = 4.8 × 10⁻³ mol ÷ 0.800 L = 6.0 × 10⁻³ M. Q = 6.0 × 10⁻⁶, far above Ksp, so BaSO₄ precipitates.", "h": "Dilute first (use the total volume), then compare Q with Ksp."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.79 Ex 1b", "q": "Using the Lewis definition, the reaction Na₂O + SO₃ → Na₂SO₄ is a neutralisation because:", "o": ["Na⁺ donates a proton to SO₃", "O²⁻ from Na₂O donates an electron pair to SO₃", "Na₂O gives H⁺ to SO₃", "SO₃ donates an electron pair to Na₂O"], "a": 1, "e": "O²⁻ (from Na₂O) is the Lewis base, it donates a lone pair. SO₃ is the Lewis acid, it accepts the pair and forms SO₄²⁻. No proton is involved.", "h": "Lewis: acid accepts a pair, base donates a pair."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.79 Ex 2a", "q": "Can ammonia act as a proton donor (acid) in water?", "o": ["Yes, but only very weakly, giving NH₂⁻", "Yes, it gives NH₄⁺ when it donates", "Yes, it is a strong acid in water", "No, it cannot ever donate a proton"], "a": 0, "e": "NH₃ + H₂O ⇌ NH₂⁻ + H₃O⁺ is possible in principle, but NH₂⁻ is a very strong base, so this barely happens. In water ammonia behaves as a base (NH₃ + H₂O ⇌ NH₄⁺ + OH⁻).", "h": "Amphoteric in theory, base in practice."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.79 Ex 2b", "q": "Comparing NH₂⁻ (conjugate base of NH₃) with OH⁻:", "o": ["OH⁻ is the stronger base", "NH₂⁻ is the stronger base", "They are equally strong", "NH₂⁻ is an acid"], "a": 1, "e": "NH₃ is a much weaker acid than H₂O, so its conjugate base NH₂⁻ is stronger than OH⁻. The weaker the acid, the stronger its conjugate base.", "h": "Weak acid → strong conjugate base."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.79 Ex 3", "q": "The conjugate bases of HCN and OH⁻ are respectively:", "o": ["CN⁻ and O²⁻", "CN⁻ and H₂O", "H₂CN⁺ and O²⁻", "CN⁻ and H₃O⁺"], "a": 0, "e": "A conjugate base is the acid minus H⁺. HCN loses H⁺ to give CN⁻, OH⁻ loses H⁺ to give O²⁻.", "h": "Remove one H⁺ from the acid."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.79 Ex 4", "q": "The conjugate acids of C₅H₅N (pyridine), CO₃²⁻ and Br⁻ are respectively:", "o": ["C₅H₅NH⁺, HCO₃⁻ and HBr", "C₅H₄N⁻, HCO₃⁻ and Br₂", "C₅H₅N, H₂CO₃ and HBr", "C₅H₅NH⁺, H₂CO₃ and HBr"], "a": 0, "e": "A conjugate acid is the base plus H⁺. Add one proton only: CO₃²⁻ becomes HCO₃⁻, not H₂CO₃.", "h": "Add exactly one H⁺."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.79 Ex 5", "q": "In N₂H₄ + NH₄⁺ ⇌ N₂H₅⁺ + NH₃, the conjugate acid–base pairs are:", "o": ["NH₄⁺/NH₃ and N₂H₅⁺/N₂H₄", "NH₄⁺/N₂H₅⁺ and NH₃/N₂H₄", "N₂H₄/NH₄⁺ and NH₃/N₂H₅⁺", "NH₄⁺/N₂H₄ and NH₃/N₂H₅⁺"], "a": 0, "e": "A pair differs by one proton. NH₄⁺ loses a proton to give NH₃. N₂H₄ gains a proton to give N₂H₅⁺.", "h": "Each pair differs by just one H⁺."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.79 Ex 6", "q": "In Ag⁺ + 2NH₃ ⇌ Ag(NH₃)₂⁺, the Lewis acid and Lewis base are:", "o": ["Ag(NH₃)₂⁺ is the base", "NH₃ is the acid, Ag⁺ is the base", "Ag⁺ is the acid, NH₃ is the base", "Both are Lewis acids"], "a": 2, "e": "NH₃ has a lone pair to donate (base). Ag⁺ has empty orbitals to accept the pairs (acid).", "h": "Cations are usually Lewis acids; lone-pair species are bases."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.79 Ex 6", "q": "In FeCl₃ + Cl⁻ ⇌ FeCl₄⁻, the Lewis acid is:", "o": ["FeCl₄⁻", "Both FeCl₃ and Cl⁻", "Cl⁻", "FeCl₃"], "a": 3, "e": "Cl⁻ donates a lone pair, so it is the base. FeCl₃ accepts it, so FeCl₃ is the acid.", "h": "Pair donor = base."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.79 Ex 6", "q": "In (CH₃)₂O + BF₃ ⇌ (CH₃)₂OBF₃, the Lewis base is:", "o": ["BF₃", "(CH₃)₂O", "Neither", "The product"], "a": 1, "e": "The oxygen of the ether has lone pairs to donate. BF₃ has an empty p orbital on boron and accepts the pair, so BF₃ is the acid.", "h": "BF₃ is the classic Lewis acid."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.79 Ex 7", "q": "The main advantage of the Lewis concept over the Brønsted–Lowry concept is that:", "o": ["it only applies to aqueous solutions", "it needs a proton to be present", "it defines acids as OH⁻ producers", "it covers reactions with no proton transfer"], "a": 3, "e": "Lewis acids and bases are defined by electron-pair transfer, so substances like BF₃ and Ag⁺ count as acids even with no H⁺ present. The book says electrons are involved in all chemical reactions.", "h": "Lewis = most general."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.83 Ex 1", "q": "A buffer is prepared with 8.3 g of acetic acid (60 g/mol) and 16.0 g of sodium acetate (82 g/mol). Ka = 1.8 × 10⁻⁵. Its pH (the tiny 0.07 mL of 1.0 M HCl changes nothing) is about:", "o": ["4.74", "4.59", "4.89", "5.30"], "a": 2, "e": "Acid = 8.3/60 = 0.138 mol. Salt = 16.0/82 = 0.195 mol. pH = 4.74 + log(0.195/0.138) = 4.74 + 0.15 = 4.89. The HCl is only 7 × 10⁻⁵ mol, which is negligible.", "h": "Moles can be used directly in the ratio if the volume is the same."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.83 Ex 2", "q": "How many moles of sodium acetate must be added to 1.0 L of 0.2 M CH₃COOH to make a buffer of pH 6? (Ka = 1.8 × 10⁻⁵)", "o": ["0.36 mol", "1.8 mol", "3.6 mol", "0.011 mol"], "a": 2, "e": "6 = 4.74 + log(salt/0.2). log(salt/0.2) = 1.26, so salt/0.2 = 18 and salt = 3.6 mol. (Equivalent: ratio = Ka/[H⁺] = 1.8 × 10⁻⁵ / 10⁻⁶ = 18.)", "h": "Rearrange Henderson for the ratio, then multiply by the acid."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.83 Ex 3", "q": "What is the buffer range of the CO₃²⁻/HCO₃⁻ system (pKa = 10.32)?", "o": ["8.32 to 12.32", "9.00 to 11.00", "10.32 to 11.32", "9.32 to 11.32"], "a": 3, "e": "pKa ± 1 = 10.32 ± 1.00.", "h": "Range = pKa ± 1."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.83 Ex 4", "q": "To make a phosphate buffer of pH about 7.40 you should mix:", "o": ["H₃PO₄ with H₂PO₄⁻, mixed in equal amounts", "H₃PO₄ with PO₄³⁻, 10 times more PO₄³⁻", "H₂PO₄⁻ with HPO₄²⁻, about 1.5 times more HPO₄²⁻", "HPO₄²⁻ with PO₄³⁻, mixed in equal amounts"], "a": 2, "e": "Choose the pair whose pKa is closest to 7.40: H₂PO₄⁻/HPO₄²⁻ (pKa₂ ≈ 7.21). pH = pKa + log(base/acid), so 7.40 = 7.21 + log(ratio), ratio = 10^0.19 = 1.55. So HPO₄²⁻ : H₂PO₄⁻ ≈ 1.5 : 1.", "h": "Pick the buffer pair with pKa near the target pH."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.87 Ex 1", "q": "The solubility of CaSO₄ is 0.67 g/L (CaSO₄ = 136.2 g/mol). Its Ksp is about:", "o": ["4.9 × 10⁻³", "2.4 × 10⁻⁵", "1.2 × 10⁻⁵", "4.5 × 10⁻¹"], "a": 1, "e": "Molar solubility = 0.67/136.2 = 4.92 × 10⁻³ mol/L. CaSO₄ ⇌ Ca²⁺ + SO₄²⁻, so Ksp = s² = (4.92 × 10⁻³)² = 2.4 × 10⁻⁵. The 4.9 × 10⁻³ is the molar solubility, not Ksp.", "h": "g/L → mol/L → Ksp."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.87 Ex 2", "q": "The Ksp of CuI is 5.1 × 10⁻¹². Its molar solubility is:", "o": ["5.1 × 10⁻¹² M", "1.0 × 10⁻¹² M", "2.6 × 10⁻⁶ M", "2.3 × 10⁻⁶ M"], "a": 3, "e": "CuI ⇌ Cu⁺ + I⁻, so Ksp = s². s = √(5.1 × 10⁻¹²) = 2.26 × 10⁻⁶ M.", "h": "1 : 1 salt: s = √Ksp."}, {"ch": 6, "k": "exercise", "s": "Ch7 p.87 Ex 3", "q": "Ksp of calcium phosphate, Ca₃(PO₄)₂ (310.2 g/mol), is 1.2 × 10⁻²⁶. Its solubility in g/L is about:", "o": ["2.57 × 10⁻⁶ g/L", "7.96 × 10⁻⁴ g/L", "5.4 × 10⁻⁴ g/L", "1.2 × 10⁻²⁶ g/L"], "a": 1, "e": "Ca₃(PO₄)₂ ⇌ 3Ca²⁺ + 2PO₄³⁻. [Ca²⁺] = 3s, [PO₄³⁻] = 2s, so Ksp = (3s)³(2s)² = 108s⁵. s = (1.2 × 10⁻²⁶/108)^(1/5) = 2.57 × 10⁻⁶ mol/L. × 310.2 = 7.96 × 10⁻⁴ g/L. ⚠ The book says “calcium sulphate” in this question; it clearly means calcium phosphate.", "h": "Ksp = 108 s⁵ for an A₃B₂ salt."}, {"ch": 6, "k": "concept", "s": "Ch7 p.73", "q": "According to Arrhenius, an acid is a substance that:", "o": ["gives H⁺ as the only positive ion in water", "accepts an electron pair", "accepts a proton", "gives OH⁻ as the only negative ion in water"], "a": 0, "e": "Arrhenius (1884) defined an acid by H⁺ in water and a base by OH⁻ in water.", "h": "Arrhenius is water-only."}, {"ch": 6, "k": "concept", "s": "Ch7 p.73", "q": "H⁺ in aqueous solution is better written as H₃O⁺ because:", "o": ["H₃O⁺ is the conjugate base of water", "H⁺ is a different element", "water is a Lewis acid", "a free proton cannot exist alone in water"], "a": 3, "e": "The proton attaches itself to a water molecule: HCl + H₂O → H₃O⁺ + Cl⁻.", "h": "The book says H⁺ is another name for proton."}, {"ch": 6, "k": "concept", "s": "Ch7 p.73", "q": "Which of the following is a polyprotic acid?", "o": ["CH₃COOH", "HNO₃", "H₃PO₄", "HCl"], "a": 2, "e": "H₃PO₄ can give up three protons. HCl, HNO₃ and CH₃COOH each give one, so they are monoprotic (acetic acid has only 1 ionisable H, not 4).", "h": "⚠ TRAP: acetic acid has four H but only one is acidic."}, {"ch": 6, "k": "concept", "s": "Ch7 p.73", "q": "The book writes H₂CO₃ → 2H⁺ + CO₃²⁺. The correct carbonate ion charge is:", "o": ["2−", "1−", "2+", "4−"], "a": 0, "e": "⚠ The book has a misprint: carbonate is CO₃²⁻. A negative ion has to balance the 2 positive charges from 2H⁺.", "h": "Ions from an acid: H⁺ and an anion."}, {"ch": 6, "k": "concept", "s": "Ch7 p.74", "q": "Which of these is an Arrhenius base?", "o": ["H₂SO₄", "NH₃ in the gas phase", "BF₃", "NaOH"], "a": 3, "e": "NaOH gives OH⁻ in water. ⚠ The book writes NaOH → K⁺ + OH⁻, a misprint, it is Na⁺.", "h": "NaOH gives Na⁺ and OH⁻."}, {"ch": 6, "k": "concept", "s": "Ch7 p.74", "q": "In the Brønsted–Lowry definition an acid is:", "o": ["an electron pair donor", "a proton donor", "an electron acceptor", "a proton acceptor"], "a": 1, "e": "Brønsted and Lowry: acid donates H⁺, base accepts H⁺.", "h": "Acid donates, base accepts."}, {"ch": 6, "k": "concept", "s": "Ch7 p.74", "q": "In HCl + H₂O → H₃O⁺ + Cl⁻, the conjugate base of HCl is:", "o": ["Cl⁻", "H₃O⁺", "OH⁻", "H₂O"], "a": 0, "e": "Cl⁻ is HCl after losing the proton. H₃O⁺ is the conjugate acid of the base H₂O.", "h": "Conjugate base = acid − H⁺."}, {"ch": 6, "k": "concept", "s": "Ch7 p.74", "q": "In HNO₃ + F⁻ ⇌ HF + NO₃⁻, the conjugate acid of F⁻ is:", "o": ["H₂F⁺", "HNO₃", "NO₃⁻", "HF"], "a": 3, "e": "F⁻ + H⁺ → HF.", "h": "Conjugate acid = base + H⁺."}, {"ch": 6, "k": "concept", "s": "Ch7 p.74", "q": "In NH₄⁺ + S²⁻ ⇌ HS⁻ + NH₃ (book writes S₂⁻), the base on the left side is:", "o": ["NH₄⁺", "HS⁻", "S²⁻", "NH₃"], "a": 2, "e": "S²⁻ accepts a proton from NH₄⁺, so it is the base and NH₄⁺ is the acid. ⚠ The book prints the sulphide as S₂⁻, a misprint.", "h": "The one that gains H⁺ is the base."}, {"ch": 6, "k": "concept", "s": "Ch7 p.74-75", "q": "Which species is amphiprotic (can act as both Brønsted acid and base)?", "o": ["NH₄⁺", "H₂O", "CH₄", "Cl⁻"], "a": 1, "e": "H₂O accepts H⁺ to give H₃O⁺ and donates H⁺ to give OH⁻.", "h": "Water is the standard amphiprotic species."}, {"ch": 6, "k": "concept", "s": "Ch7 p.75", "q": "Auto-ionisation (self-ionisation) means that:", "o": ["an acid ionises completely in water", "one substance forms a cation and an anion", "a salt dissolves into its two ions", "a base accepts two protons at once"], "a": 1, "e": "Examples in the book: 2H₂O ⇌ H₃O⁺ + OH⁻ and 2NH₃ ⇌ NH₄⁺ + NH₂⁻.", "h": "Same substance acts as acid and base."}, {"ch": 6, "k": "concept", "s": "Ch7 p.75", "q": "The auto-ionisation product of liquid ammonia (2NH₃ ⇌ ?) is:", "o": ["N₂H₅⁺ and NH₂⁻", "H₃O⁺ and OH⁻", "NH₄⁺ and NH₂⁻", "NH₃⁺ and NH₄⁻"], "a": 2, "e": "One NH₃ donates a proton and the other accepts: NH₃ + NH₃ ⇌ NH₄⁺ + NH₂⁻.", "h": "Same pattern as water."}, {"ch": 6, "k": "concept", "s": "Ch7 p.75", "q": "As an acid gets stronger, its conjugate base:", "o": ["gets stronger", "stays the same", "becomes an acid", "gets weaker"], "a": 3, "e": "Strong acids give up H⁺ readily, so their conjugate bases hold on to H⁺ poorly (ClO₄⁻ and Cl⁻ are very weak bases).", "h": "Strong acid ⇒ weak conjugate base."}, {"ch": 6, "k": "concept", "s": "Ch7 p.75", "q": "Of HClO₄, HCl, HF and HNO₂, the weakest acid and the strongest conjugate base belong to:", "o": ["HNO₂, with NO₂⁻ as the stronger base", "HCl, with Cl⁻ as the stronger base", "HF, with F⁻ as the weakest base", "HClO₄, with ClO₄⁻ as the stronger base"], "a": 0, "e": "In the book’s strength chart HNO₂ (written “NHO₂”, a misprint) is near the bottom, with NO₂⁻ as the strongest base of the four.", "h": "Bottom of the acid list = top of the base list."}, {"ch": 6, "k": "concept", "s": "Ch7 p.76", "q": "HCl, HNO₃ and HClO₄ all appear equally strong in water because of:", "o": ["hydrolysis", "the common ion effect", "the Le Chatelier effect", "the levelling effect"], "a": 3, "e": "Water is a strong enough base to take protons from all of them completely, so they all look 100 % ionised. Their differences are levelled out.", "h": "Levelling: water hides differences between strong acids."}, {"ch": 6, "k": "concept", "s": "Ch7 p.76", "q": "Which solvent can be used to tell the strengths of HCl, HNO₃ and HClO₄ apart?", "o": ["Aqueous sodium hydroxide solution", "Glacial ethanoic (acetic) acid", "Pure water at room temperature", "Liquid ammonia under pressure"], "a": 1, "e": "Pure ethanoic acid is a much weaker base than water, so the acids ionise to different extents. It is called a differentiating solvent.", "h": "Weak-base solvent = differentiating."}, {"ch": 6, "k": "concept", "s": "Ch7 p.76", "q": "A salt is formed when:", "o": ["a base loses OH⁻ to water", "an acid reacts with another acid", "an oxide is dissolved in an organic solvent", "ionisable protons of an acid are replaced by metal ions"], "a": 3, "e": "The book defines a salt as the compound formed when any of the ionisable protons of an acid are replaced by metallic ions.", "h": "Acid + metal ion = salt."}, {"ch": 6, "k": "concept", "s": "Ch7 p.76", "q": "How many main types of salt does the book identify?", "o": ["Four: normal, acid, basic and double", "Two: acidic and basic", "Five: normal, acid, basic, double and complex", "Three: normal, acid and basic"], "a": 2, "e": "Five types: normal, acid, basic, double (including alums) and complex salts.", "h": "N-A-B-D-C."}, {"ch": 6, "k": "concept", "s": "Ch7 p.76-77", "q": "A normal salt is formed when:", "o": ["a base reacts with too little acid", "only some of the replaceable hydrogen ions are replaced", "two simple salts crystallise together", "all the replaceable hydrogen ions are replaced by metal ions"], "a": 3, "e": "Examples: Na₂SO₄ from H₂SO₄ + 2NaOH, and NaCl from HCl + NaOH.", "h": "Complete replacement = normal."}, {"ch": 6, "k": "concept", "s": "Ch7 p.77", "q": "Na₂CO₃ and AlCl₃ are normal salts, yet their solutions are not neutral because:", "o": ["they undergo hydrolysis in water", "they are double salts", "they are acid salts", "they contain replaceable hydrogen"], "a": 0, "e": "The book notes that normal salts are neutral to litmus, but Na₂CO₃ (alkaline) and AlCl₃ (acidic) hydrolyse.", "h": "⚠ TRAP: normal salt does not always mean neutral solution."}, {"ch": 6, "k": "concept", "s": "Ch7 p.77", "q": "NaHSO₄ is classified as:", "o": ["a basic salt", "a normal salt", "an acid salt", "a double salt"], "a": 2, "e": "Only one of the two H in H₂SO₄ was replaced. It is called sodium hydrogensulphate, and the remaining H can still be replaced or released.", "h": "Look for a leftover H in the anion."}, {"ch": 6, "k": "concept", "s": "Ch7 p.77", "q": "How many different acid salts can phosphoric acid (H₃PO₄) form with potassium?", "o": ["Three: KH₂PO₄, K₂HPO₄ and K₃PO₄", "Two: KH₂PO₄ and K₂HPO₄", "None", "One: KH₂PO₄ only"], "a": 1, "e": "An acid with three replaceable H can form two acid salts (KH₂PO₄ and K₂HPO₄). K₃PO₄ is the normal salt. Sulphuric acid (two H) can form only one acid salt.", "h": "Acid salts = n − 1 for an acid with n replaceable H."}, {"ch": 6, "k": "concept", "s": "Ch7 p.77", "q": "H₂SO₄ + KOH → KHSO₄ + H₂O gives an acid salt because:", "o": ["KHSO₄ is a double salt of two simple salts", "the water formed dissolves the second hydrogen", "KOH is a weak base and cannot react fully", "there is too little base to replace both hydrogens"], "a": 3, "e": "The book says acid salts form when there is an insufficient supply of metal ions to replace all of the acid’s replaceable hydrogen.", "h": "Not enough base ⇒ acid salt."}, {"ch": 6, "k": "concept", "s": "Ch7 p.78", "q": "A basic salt is formed when:", "o": ["all hydrogen ions are replaced", "an acid reacts with insufficient base", "a base reacts with an insufficient amount of acid", "two salts combine"], "a": 2, "e": "Basic salts such as SbOCl contain O or OH groups and turn red litmus blue. They react with excess acid to give a normal salt and water. ⚠ The book writes SbCl₃ + H₂O → SbOCl + H₂, but the real by-product is 2HCl, not H₂.", "h": "Basic salts have an O or OH in the formula."}, {"ch": 6, "k": "concept", "s": "Ch7 p.78", "q": "Which of these is a double salt?", "o": ["(NH₄)₂SO₄·FeSO₄·6H₂O", "K₄[Fe(CN)₆]·3H₂O", "NaHSO₄·H₂O", "SbOCl·H₂O"], "a": 0, "e": "Double salts ionise into three different ions (here NH₄⁺, Fe²⁺ and SO₄²⁻). K₄[Fe(CN)₆] is a complex salt.", "h": "Double salt: two cations, one anion."}, {"ch": 6, "k": "concept", "s": "Ch7 p.78", "q": "Potassium alum, KAl(SO₄)₂·12H₂O, has the general formula M⁺M³⁺(SO₄)₂·12H₂O. It is classified as:", "o": ["a basic salt", "a double salt", "a normal salt", "a complex salt"], "a": 1, "e": "Alums are double salts. The book says potassium alum is used to treat cotton fibres so they take up dyes better.", "h": "Alum = double salt with 12 H₂O."}, {"ch": 6, "k": "concept", "s": "Ch7 p.78-79", "q": "K₄[Fe(CN)₆] is a complex salt. In water it gives:", "o": ["2K⁺ and [Fe(CN)₆]²⁻", "4K⁺, Fe²⁺ and 6CN⁻", "4K⁺ and [Fe(CN)₆]⁴⁻", "K⁺, Fe²⁺ and 6CN⁻"], "a": 2, "e": "The complex ion stays intact, which is the key difference from a double salt. Hexacyanoferrate(II) has charge 4− to balance four K⁺.", "h": "Complex salt: complex ion stays together."}, {"ch": 6, "k": "concept", "s": "Ch7 p.80", "q": "The pH of a solution is defined as:", "o": ["1/[H⁺]", "log[H⁺]", "−log[H⁺]", "−ln[OH⁻]"], "a": 2, "e": "pH = −log₁₀[H⁺], and pOH = −log[OH⁻].", "h": "Minus log."}, {"ch": 6, "k": "concept", "s": "Ch7 p.80", "q": "At 25 °C, pH + pOH equals:", "o": ["10⁻¹⁴", "14", "7", "1"], "a": 1, "e": "Because Kw = [H⁺][OH⁻] = 10⁻¹⁴, taking −log gives pH + pOH = 14.", "h": "14 total."}, {"ch": 6, "k": "concept", "s": "Ch7 p.80 variant", "q": "The pH of 0.0010 M HCl is:", "o": ["0.001", "11", "1", "3"], "a": 3, "e": "HCl is a strong acid, so [H⁺] = 1.0 × 10⁻³ M and pH = 3.", "h": "Power of ten = pH for 1 × 10ⁿ."}, {"ch": 6, "k": "concept", "s": "Ch7 p.80 variant", "q": "The pH of 0.010 M NaOH is:", "o": ["1.0", "2", "10", "12"], "a": 3, "e": "[OH⁻] = 0.010 M, pOH = 2, pH = 14 − 2 = 12.", "h": "Bases: pOH first."}, {"ch": 6, "k": "concept", "s": "Ch7 p.80 variant", "q": "The pH of 0.0050 M Ca(OH)₂ (strong base) is:", "o": ["11.3", "12", "2.0", "11.7"], "a": 1, "e": "Each Ca(OH)₂ gives 2 OH⁻, so [OH⁻] = 0.010 M. pOH = 2, pH = 12. If you forgot the 2 you get 11.7.", "h": "⚠ TRAP: Ca(OH)₂ gives two OH⁻. The book’s own example: 0.1 M gives 2(0.1) M OH⁻."}, {"ch": 6, "k": "concept", "s": "Ch7 p.80 variant", "q": "A solution has pH 3. Compared with a solution of pH 5, its [H⁺] is:", "o": ["2 times smaller", "100 times greater", "100 times smaller", "2 times greater"], "a": 1, "e": "Each pH unit is a factor of 10. A difference of 2 units gives 10² = 100.", "h": "pH is logarithmic."}, {"ch": 6, "k": "concept", "s": "Ch7 p.80 variant", "q": "If [H⁺] = 2.0 × 10⁻⁴ M the pH is:", "o": ["2.00", "3.70", "3.30", "4.70"], "a": 1, "e": "pH = −log(2.0 × 10⁻⁴) = 4 − log 2 = 4 − 0.30 = 3.70. Remember log 2 = 0.30 and log 3 = 0.48.", "h": "Number × 10⁻ⁿ: pH is a little below n."}, {"ch": 6, "k": "concept", "s": "Ch7 p.80 variant", "q": "The [OH⁻] in a solution of pH 9 is:", "o": ["1 × 10⁻⁵ M", "5 × 10⁻⁹ M", "1 × 10⁻⁹ M", "1 × 10⁻⁷ M"], "a": 0, "e": "pOH = 14 − 9 = 5, so [OH⁻] = 10⁻⁵ M.", "h": "pOH first, then inverse log."}, {"ch": 6, "k": "concept", "s": "Ch7 p.80-81", "q": "A buffer solution consists of:", "o": ["a strong acid together with its own salt", "pure water together with any soluble salt", "a strong acid together with a strong base", "a weak acid with its salt, or a weak base with its salt"], "a": 3, "e": "A buffer needs both parts: a weak acid with its conjugate base, or a weak base with its conjugate acid. It resists pH change when small amounts of acid or base are added.", "h": "Weak partner plus its conjugate."}, {"ch": 6, "k": "concept", "s": "Ch7 p.81", "q": "In an acetic acid / sodium acetate buffer, added OH⁻ is removed by:", "o": ["CH₃COO⁻", "CH₃COOH", "H₂O", "Na⁺"], "a": 1, "e": "CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O. The weak acid consumes added base, and the acetate consumes added acid.", "h": "Acid component fights base; base component fights acid."}, {"ch": 6, "k": "concept", "s": "Ch7 p.81", "q": "Added H⁺ in the same buffer is removed by:", "o": ["OH⁻", "Na⁺", "CH₃COOH", "CH₃COO⁻"], "a": 3, "e": "CH₃COO⁻ + H⁺ → CH₃COOH. The acetate comes from fully dissociated sodium acetate.", "h": "Conjugate base mops up the added acid."}, {"ch": 6, "k": "concept", "s": "Ch7 p.82", "q": "The Henderson equation for an acid buffer is:", "o": ["pH = pKa + log([salt]/[acid])", "pH = pKa × [salt]/[acid]", "pH = −log[salt] − log[acid]", "pH = pKa + log([acid]/[salt])"], "a": 0, "e": "Salt (conjugate base) on top, acid at the bottom. Flip them and you will get the wrong direction of pH shift.", "h": "⚠ TRAP: salt over acid, not the other way round."}, {"ch": 6, "k": "concept", "s": "Ch7 p.82 variant", "q": "A buffer has [acid] = 0.20 M and [salt] = 0.20 M with pKa = 4.76. Its pH is:", "o": ["7.00", "4.76", "5.76", "3.76"], "a": 1, "e": "The ratio is 1, log 1 = 0, so pH = pKa.", "h": "Equal acid and salt: pH = pKa."}, {"ch": 6, "k": "concept", "s": "Ch7 p.82 variant", "q": "A buffer has [salt] = 0.10 M and [acid] = 1.0 M with pKa = 4.76. Its pH is:", "o": ["4.76", "2.76", "3.76", "5.76"], "a": 2, "e": "pH = 4.76 + log(0.10/1.0) = 4.76 − 1 = 3.76.", "h": "Ten times more acid than salt: pH is 1 below pKa."}, {"ch": 6, "k": "concept", "s": "Ch7 p.82 variant", "q": "A buffer has [salt] = 1.0 M and [acid] = 0.10 M with pKa = 4.76. Its pH is:", "o": ["5.76", "4.76", "3.76", "6.76"], "a": 0, "e": "pH = 4.76 + log(10) = 5.76.", "h": "Ten times more salt: pH is 1 above pKa."}, {"ch": 6, "k": "concept", "s": "Ch7 p.83", "q": "The buffer works best when pH is:", "o": ["close to the pKa of the weak acid", "far above the pKa", "equal to pKw", "close to 7 whatever the acid"], "a": 0, "e": "The effective range is pKa ± 1, with greatest capacity at pH = pKa, where acid and salt are in equal amounts.", "h": "Pick the buffer with pKa near the target pH."}, {"ch": 6, "k": "concept", "s": "Ch7 p.83", "q": "The pKa of acetic acid is 4.74, so its buffer range is:", "o": ["6.74 to 8.74", "4.74 to 5.74", "3.74 to 5.74", "2.74 to 6.74"], "a": 2, "e": "pKa ± 1.", "h": "Range = pKa ± 1."}, {"ch": 6, "k": "concept", "s": "Ch7 p.84", "q": "The hydrolysis constant for the acetate ion, Kh, is given by:", "o": ["Ka/Kw", "Ka × Kw", "Kw/Ka", "Kw/Kb"], "a": 2, "e": "CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻. Kh = [CH₃COOH][OH⁻]/[CH₃COO⁻] = Kw/Ka of acetic acid.", "h": "Anion of a weak acid: Kh = Kw/Ka."}, {"ch": 6, "k": "concept", "s": "Ch7 p.84", "q": "The relationship between Ka of an acid and Kb of its conjugate base is:", "o": ["Ka × Kb = 1", "Ka × Kb = Kw", "Ka + Kb = Kw", "Ka/Kb = Kw"], "a": 1, "e": "Their product is Kw = 1.0 × 10⁻¹⁴ at 25 °C. The stronger the acid, the smaller Kb of its conjugate base.", "h": "Multiply, do not add."}, {"ch": 6, "k": "concept", "s": "Ch7 p.84 variant", "q": "For acetic acid Ka = 1.8 × 10⁻⁵. The Kb of the acetate ion is:", "o": ["5.6 × 10⁻¹⁰", "1.8 × 10⁻¹⁹", "5.6 × 10⁻⁵", "1.8 × 10⁻⁹"], "a": 0, "e": "Kb = Kw/Ka = 10⁻¹⁴ / 1.8 × 10⁻⁵ = 5.6 × 10⁻¹⁰.", "h": "Divide Kw by what you have."}, {"ch": 6, "k": "concept", "s": "Ch7 p.84", "q": "A solution of sodium acetate in water is:", "o": ["basic, from hydrolysis of the acetate anion", "acidic, from hydrolysis of the acetate anion", "neutral, because it is a salt", "acidic, from hydrolysis of Na⁺"], "a": 0, "e": "A salt of a strong base and weak acid gives anionic hydrolysis: CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻, producing OH⁻.", "h": "Strong base + weak acid → basic solution."}, {"ch": 6, "k": "concept", "s": "Ch7 p.84", "q": "A solution of ammonium chloride in water is:", "o": ["neutral, since Cl⁻ is spectator", "basic, from hydrolysis of NH₄⁺", "basic, from hydrolysis of Cl⁻", "acidic, from hydrolysis of NH₄⁺"], "a": 3, "e": "A salt of a weak base and strong acid gives cationic hydrolysis: NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺.", "h": "Strong acid + weak base → acidic solution."}, {"ch": 6, "k": "concept", "s": "Ch7 p.85", "q": "Hydrolysis is not possible for ions of strong acids and strong bases because:", "o": ["they are weak electrolytes, so ions are very few", "they are insoluble, so no ions go into solution", "they dissociate completely, so their ions do not react with water", "they carry no charge, so water cannot attack them"], "a": 2, "e": "The book says strong acids (HCl) and strong bases [Ca(OH)₂] dissociate completely, and hydrolysis does not occur for these.", "h": "NaCl solution is neutral."}, {"ch": 6, "k": "concept", "s": "Ch7 p.84", "q": "The common ion effect on a weak acid HA is that adding its salt NaA:", "o": ["reduces the ionisation of HA", "increases the ionisation of HA", "makes HA a strong acid", "has no effect"], "a": 0, "e": "Extra A⁻ pushes the equilibrium HA ⇌ H⁺ + A⁻ to the left (Le Chatelier).", "h": "Common ion suppresses ionisation."}, {"ch": 6, "k": "concept", "s": "Ch7 p.84", "q": "Hydrolysis is best defined as:", "o": ["a reaction in which water is a reactant", "a reaction with an acid", "the loss of water from a hydrate", "dissolving a salt"], "a": 0, "e": "The book says hydrolysis is any reaction involving water molecule(s) as a reactant.", "h": "Hydro (water) + lysis (splitting)."}, {"ch": 6, "k": "concept", "s": "Ch7 p.84", "q": "The “fair approximation” [HA] − x ≈ [HA] for a weak acid is acceptable when:", "o": ["Ka is 1.0 × 10⁻⁴ or smaller", "Ka is larger than 1", "the acid is strong", "Ka is exactly 1 × 10⁻⁷ only"], "a": 0, "e": "When the dissociation constant is small (≤ 1 × 10⁻⁴), x is tiny compared with the initial concentration, so you can ignore it.", "h": "Small Ka: ignore x."}, {"ch": 6, "k": "concept", "s": "Ch7 p.85", "q": "The solubility product Ksp of AgCl is:", "o": ["[Ag⁺][Cl⁻]", "[Ag⁺]²[Cl⁻]", "[AgCl]", "[Ag⁺]/[Cl⁻]"], "a": 0, "e": "AgCl(s) ⇌ Ag⁺ + Cl⁻. Solids are left out, so Ksp = [Ag⁺][Cl⁻] = 1.6 × 10⁻¹⁰.", "h": "Solids never appear in Ksp."}, {"ch": 6, "k": "concept", "s": "Ch7 p.85", "q": "A smaller Ksp for a compound means that it is:", "o": ["more soluble", "a stronger acid", "less soluble", "more ionic"], "a": 2, "e": "For salts of the same formula type, a smaller Ksp indicates lower solubility.", "h": "Small Ksp = hardly dissolves."}, {"ch": 6, "k": "concept", "s": "Ch7 p.85-86", "q": "The ion product Q = [Ag⁺]₀[Cl⁻]₀ is smaller than Ksp. The solution is:", "o": ["a buffer", "supersaturated", "unsaturated", "saturated"], "a": 2, "e": "Q < Ksp: unsaturated, more solid can dissolve. Q = Ksp: saturated. Q > Ksp: supersaturated, precipitate forms.", "h": "Q below Ksp, no precipitate."}, {"ch": 6, "k": "concept", "s": "Ch7 p.86", "q": "If Q is larger than Ksp:", "o": ["more solid dissolves until Q reaches Ksp", "the value of Ksp rises until it equals Q", "nothing happens, the solution stays clear", "a precipitate forms until Q falls back to Ksp"], "a": 3, "e": "The solution is supersaturated and the excess ions come out of solution as solid. ⚠ The book prints the AgCl limit as 6 × 10⁻¹⁰ in one place; Ksp is 1.6 × 10⁻¹⁰.", "h": "Q > Ksp = precipitate."}, {"ch": 6, "k": "concept", "s": "Ch7 p.86", "q": "The molar solubility of a compound is:", "o": ["moles dissolved per litre of saturated solution", "grams dissolved per 100 g of the water", "moles dissolved per kilogram of the solvent", "grams dissolved per litre of saturated solution"], "a": 0, "e": "Molar solubility is in mol/L, solubility is in g/L, both for a saturated solution at 25 °C.", "h": "Molar = moles."}, {"ch": 6, "k": "concept", "s": "Ch7 p.86", "q": "Solubility (as defined in the book) has the unit:", "o": ["mol/kg", "g/L", "g/mol", "mol/L"], "a": 1, "e": "Solubility is the mass in grams of solute in one litre of saturated solution at 25 °C.", "h": "Solubility g/L; molar solubility mol/L."}, {"ch": 6, "k": "concept", "s": "Ch7 p.85 variant", "q": "The molar solubility of AgCl (Ksp = 1.6 × 10⁻¹⁰) is:", "o": ["1.6 × 10⁻¹⁰ M", "1.3 × 10⁻⁵ M", "2.6 × 10⁻²⁰ M", "8.0 × 10⁻¹¹ M"], "a": 1, "e": "s² = 1.6 × 10⁻¹⁰, so s = 1.26 × 10⁻⁵ M.", "h": "1 : 1 salt: square root."}, {"ch": 6, "k": "concept", "s": "Ch7 p.85 variant", "q": "For Ag₂SO₄ the Ksp in terms of molar solubility s is:", "o": ["s²", "27s⁴", "4s³", "2s²"], "a": 2, "e": "[Ag⁺] = 2s, [SO₄²⁻] = s, so Ksp = (2s)² × s = 4s³. Check with the book: 4 × (1.5 × 10⁻²)³ = 1.35 × 10⁻⁵.", "h": "A₂B or AB₂ salt: Ksp = 4s³."}, {"ch": 6, "k": "concept", "s": "Ch7 p.85 variant", "q": "The Ksp of Mg(OH)₂ in terms of molar solubility s is:", "o": ["s²", "108s⁵", "2s³", "4s³"], "a": 3, "e": "Mg(OH)₂ ⇌ Mg²⁺ + 2OH⁻, so [Mg²⁺] = s, [OH⁻] = 2s, Ksp = s(2s)² = 4s³.", "h": "Same shape as Ag₂SO₄."}, {"ch": 6, "k": "concept", "s": "Ch7 p.85 variant", "q": "Adding NaCl to a saturated solution of AgCl will:", "o": ["not change the Ksp or solubility", "turn AgCl into a soluble salt", "decrease the solubility of AgCl", "increase the solubility of AgCl"], "a": 2, "e": "The extra Cl⁻ (common ion) pushes AgCl(s) ⇌ Ag⁺ + Cl⁻ to the left, so less AgCl dissolves. Ksp itself stays the same at a fixed temperature.", "h": "Common ion lowers solubility; Ksp is unchanged."}, {"ch": 6, "k": "concept", "s": "Ch7 p.87 variant", "q": "Equal volumes of 0.002 M AgNO₃ and 0.002 M NaCl are mixed (Ksp AgCl = 1.6 × 10⁻¹⁰). The ion product is:", "o": ["1 × 10⁻⁶, so AgCl precipitates", "4 × 10⁻⁶, so AgCl precipitates", "2 × 10⁻³, so AgCl precipitates", "1 × 10⁻⁶, so no precipitate forms"], "a": 0, "e": "Mixing equal volumes halves each concentration to 0.001 M. Q = (1 × 10⁻³)(1 × 10⁻³) = 1 × 10⁻⁶ which is above 1.6 × 10⁻¹⁰, so AgCl precipitates.", "h": "⚠ TRAP: dilution on mixing, use half concentrations for equal volumes."}, {"ch": 7, "k": "concept", "s": "Ch8 p.89", "q": "A chemical bond is best described as:", "o": ["a gravitational pull between neighbouring atoms", "a force acting only between oppositely charged ions", "a strong nuclear force inside the atom’s nucleus", "an electrostatic pull between electrons and nuclei"], "a": 3, "e": "The book says bonding comes from the electrostatic attraction between negatively charged electrons and positively charged nuclei.", "h": "Opposite charges attract: electrons vs nuclei."}, {"ch": 7, "k": "concept", "s": "Ch8 p.89", "q": "The octet rule states that atoms bond by gaining, losing or sharing valence electrons until they have:", "o": ["the electron configuration of a noble gas", "equal numbers of protons and electrons", "a completely empty valence shell again", "the same mass as a neighbouring atom"], "a": 0, "e": "The book says the atom ends up like the noble gas before or after it in the periodic table (8 outer electrons, or 2 for helium-like atoms).", "h": "Octet = 8 outer electrons, noble gas style."}, {"ch": 7, "k": "concept", "s": "Ch8 p.89", "q": "The three ways of reaching an octet named in the book are:", "o": ["ionic, metallic and hydrogen bonding", "electrovalent, polar and dipole bonding", "covalent, metallic and van der Waals bonding", "electrovalent, covalent and coordinate bonding"], "a": 3, "e": "The book lists electrovalent (ionic), covalent and coordinate (dative) bonding as the three methods of attaining an octet.", "h": "Give, share, or share a donated pair."}, {"ch": 7, "k": "concept", "s": "Ch8 p.89", "q": "The octet rule fails for some molecules. Which of these has a central atom with fewer than eight electrons?", "o": ["CH₄", "NH₃", "H₂O", "BF₃"], "a": 3, "e": "Boron in BF₃ has only six electrons around it. The book says the theory “goes for many atoms but is not always true”.", "h": "BF₃ is the classic electron-deficient exception."}, {"ch": 7, "k": "concept", "s": "Ch8 p.89", "q": "Which of these has an expanded octet (more than eight electrons around the central atom)?", "o": ["CCl₄", "SF₆", "H₂O", "NH₃"], "a": 1, "e": "Sulphur in SF₆ has 12 electrons. Period 3 and beyond can use d orbitals.", "h": "PCl₅ and SF₆ break the octet rule upward."}, {"ch": 7, "k": "concept", "s": "Ch8 p.89", "q": "An electrovalent (ionic) bond is formed by:", "o": ["a sea of electrons shared by many atoms", "a lone pair donated to an electron-poor atom", "complete transfer of electrons from one atom to another", "sharing of an electron pair between two atoms"], "a": 2, "e": "The attraction is between oppositely charged ions after one or more electrons have fully moved across.", "h": "Ionic = transfer; covalent = sharing."}, {"ch": 7, "k": "concept", "s": "Ch8 p.89", "q": "Ionic bonds are most likely between elements of:", "o": ["Groups I and II with Groups VI and VII", "Groups IV and V with Groups I and II", "Group 0 elements with Group I elements", "two atoms that both come from Group VII"], "a": 0, "e": "The book says ionic bonding forms between atoms that readily lose electrons (Groups I and II) and those that readily gain them (Groups VII and VI).", "h": "Metals at the left, non-metals at the right."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "In NaCl, the sodium atom gives an electron to chlorine. The ions then have the electron configurations of:", "o": ["Ne for both ions", "Ar for Na⁺ and Ne for Cl⁻", "Ne for Na⁺ and Ar for Cl⁻", "Ar for both ions"], "a": 2, "e": "Na (2,8,1) loses one electron to give Na⁺ (2,8) like neon. Cl (2,8,7) gains one to give Cl⁻ (2,8,8) like argon.", "h": "Metal copies the noble gas before it; non-metal copies the one after."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "The number of electrons in a sodium ion, Na⁺ (atomic number 11), is:", "o": ["10", "11", "9", "12"], "a": 0, "e": "Na has 11 electrons; it loses one to give Na⁺ with 10 electrons.", "h": "Cation: electrons = atomic number − charge."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "The number of electrons in a chloride ion, Cl⁻ (atomic number 17), is:", "o": ["16", "17", "18", "19"], "a": 2, "e": "Cl gains one electron: 17 + 1 = 18.", "h": "Anion: electrons = atomic number + charge."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "The cation formed from a Group II atom such as Mg carries a charge of:", "o": ["2−", "3+", "2+", "1+"], "a": 2, "e": "Group II atoms have 2 valence electrons and lose both to reach a noble gas configuration. Mg → Mg²⁺ + 2e⁻.", "h": "Group number = charge for the first groups."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "The simplest formula of the compound formed between magnesium and chlorine is:", "o": ["MgCl", "Mg₂Cl₂", "Mg₂Cl", "MgCl₂"], "a": 3, "e": "Mg²⁺ needs two Cl⁻ to balance the charge, so MgCl₂.", "h": "Cross the charges, then simplify."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "The formula of aluminium oxide, from Al³⁺ and O²⁻, is:", "o": ["Al₃O₂", "AlO₃", "Al₂O₃", "AlO"], "a": 2, "e": "Two Al³⁺ (+6) balance three O²⁻ (−6).", "h": "Cross the charges: Al₂O₃."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "Which of these is NOT a property of electrovalent compounds?", "o": ["They have high melting points", "They have low melting and boiling points", "They are made of ions in a crystal lattice", "They are usually soluble in polar solvents"], "a": 1, "e": "Ionic compounds have strong electrostatic forces holding the lattice together, so they have HIGH melting and boiling points.", "h": "⚠ TRAP: high mp/bp = ionic; low mp/bp = molecular covalent."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "Ionic compounds dissolve best in solvents with:", "o": ["no polarity", "a very low boiling point", "a low dielectric constant", "a high dielectric constant"], "a": 3, "e": "Polar solvents with a high dielectric constant (water) solvate the separate ions and weaken the attraction between them.", "h": "Water dissolves ionic compounds; CCl₄ does not."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "Why do ionic compounds usually react faster than covalent ones?", "o": ["They contain more electrons", "Their bonds are weaker than covalent bonds", "The ions are already formed and just collide to react", "They always release more heat"], "a": 2, "e": "The book explains that ions simply collide to form new compounds, while covalent reactions need old bonds to be broken first.", "h": "Ions are ready to react; molecules must break bonds."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "Which statement about a solid ionic crystal is correct?", "o": ["It conducts only when dissolved in CCl₄", "It conducts both as a solid and as a liquid", "It conducts electricity well when it is solid", "It does not conduct as a solid, but the molten salt does"], "a": 3, "e": "In the solid the ions are fixed in the lattice. Melting or dissolving in water frees them to move and carry current.", "h": "Free ions needed: molten or aqueous."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "The crystal lattice of an ionic compound is regarded in the book as:", "o": ["a discrete molecule", "a macromolecule", "a mixture of atoms", "a coordination complex"], "a": 1, "e": "The positive and negative ions are arranged in a huge repeating network, so the book calls the lattice a macromolecule.", "h": "NaCl is not made of separate NaCl molecules."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "A covalent bond exists when the electronegativity difference between the two atoms is:", "o": ["small", "large", "greater than 1.7 always", "zero only"], "a": 0, "e": "Sharing happens when neither atom can pull the electrons away completely. A large difference gives an ionic bond.", "h": "Small ΔEN = covalent; large ΔEN = ionic."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91", "q": "Covalent bonds are formed by:", "o": ["transfer of electrons to filled orbitals", "attraction between free electrons and cations", "overlap of singly filled orbitals", "overlap of two empty orbitals"], "a": 2, "e": "The book states covalent bonds are brought about by the overlap of singly occupied orbitals, each atom donating one electron to the pair.", "h": "One electron each, orbitals overlap."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92", "q": "In the O₂ molecule each oxygen atom shares:", "o": ["one electron pair, forming a single bond", "two electron pairs, forming a double bond", "three electron pairs, forming a triple bond", "two electrons in total, forming a single bond"], "a": 1, "e": "Each O has 6 valence electrons and needs 2 more, so the two atoms share two pairs (four electrons) in an O=O double bond. ⚠ The book words this loosely as “shares two electrons”.", "h": "⚠ TRAP: O₂ double bond (2 pairs), N₂ triple bond (3 pairs)."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92", "q": "The number of covalent bonds in a molecule of CO₂ (O=C=O) is:", "o": ["four bonds, as two double bonds", "two single bonds in all", "three double bonds in all", "two triple bonds in all"], "a": 0, "e": "Carbon has 4 valence electrons and each oxygen needs 2 more. The C shares two pairs with each O, so there are two C=O double bonds.", "h": "Count pairs, not atoms."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92", "q": "Which of these is a covalent molecule listed in the book?", "o": ["KBr", "MgO", "CCl₄", "NaCl"], "a": 2, "e": "The book lists H₂, Cl₂ and CCl₄ as examples of covalent bonding. The others are ionic.", "h": "Non-metal with non-metal = covalent."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92", "q": "A coordinate (dative) covalent bond is formed when:", "o": ["an electron is transferred completely", "both shared electrons come from one atom", "electrons are free to move through a lattice", "each atom supplies one electron"], "a": 1, "e": "One atom donates a lone pair, which is then shared. Once formed it is the same as any other covalent bond. Example: NH₃ + H⁺ → NH₄⁺.", "h": "Donor gives both electrons."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92", "q": "In the ammonium ion, NH₄⁺, the coordinate bond is formed between:", "o": ["the lone pair on N and an H⁺ ion", "two hydrogen atoms sharing e⁻", "N⁺ and H⁻ ions only", "the three ordinary N–H bonds"], "a": 0, "e": "N in NH₃ has a lone pair and donates it to the empty orbital of H⁺. All four N–H bonds in NH₄⁺ are identical once formed.", "h": "Lone pair + empty orbital = dative bond."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92", "q": "Which species contains a coordinate bond?", "o": ["NaCl", "CH₄", "H₃O⁺", "H₂O"], "a": 2, "e": "H₃O⁺ is formed when a lone pair on oxygen in water attaches to H⁺.", "h": "Lone pair + H⁺ gives NH₄⁺ or H₃O⁺."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92", "q": "Covalent compounds are made up of discrete molecules. The only force between these molecules is:", "o": ["covalent bonds", "strong ionic bonds", "weak van der Waals forces", "metallic bonds"], "a": 2, "e": "The bonds inside a molecule are strong covalent bonds, but between molecules there are only weak intermolecular forces. This is why they melt and boil easily.", "h": "Intramolecular strong, intermolecular weak."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92", "q": "Covalent compounds usually have:", "o": ["no boiling point", "low melting and boiling points", "high melting and boiling points", "electrical conductivity when solid"], "a": 1, "e": "They exist as gases, liquids or soft solids because the forces between molecules are weak.", "h": "Covalent = low mp/bp."}, {"ch": 7, "k": "concept", "s": "Ch8 p.93", "q": "Covalent compounds are usually soluble in:", "o": ["non-polar solvents of low dielectric constant", "molten metals only", "liquid mercury only", "polar solvents of high dielectric constant only"], "a": 0, "e": "“Like dissolves like”: non-polar molecules dissolve in non-polar solvents such as benzene or CCl₄.", "h": "Like dissolves like."}, {"ch": 7, "k": "concept", "s": "Ch8 p.93", "q": "Covalent reactions are usually slow because:", "o": ["old bonds must be broken, which takes much energy", "the molecules are always found as solids", "no electrons take part in the reaction", "the compounds are all strongly ionic"], "a": 0, "e": "Breaking existing covalent bonds needs high energy, hence the slower rate.", "h": "Ionic: fast. Covalent: slow."}, {"ch": 7, "k": "concept", "s": "Ch8 p.93", "q": "When two atoms of the same element form a covalent bond (e.g. H₂), the bond is:", "o": ["polar, with a small dipole", "coordinate", "non-polar, with no dipole", "ionic"], "a": 2, "e": "Both atoms pull equally on the shared electrons, so there is no charge separation.", "h": "Same atoms = no dipole."}, {"ch": 7, "k": "concept", "s": "Ch8 p.93", "q": "In a water molecule, oxygen carries a partial negative charge because:", "o": ["hydrogen is more electronegative than oxygen", "oxygen has a greater affinity for electrons than hydrogen", "water is a non-polar molecule", "oxygen has no lone pairs"], "a": 1, "e": "Oxygen pulls the shared electrons toward itself. This gives δ− on O and δ+ on each H.", "h": "Oxygen is greedier for electrons."}, {"ch": 7, "k": "concept", "s": "Ch8 p.93", "q": "The dipole moment of water is about:", "o": ["5.4 D", "1.8 D", "0 D", "0.18 D"], "a": 1, "e": "The book gives μ = 1.8 D for H₂O, because the molecule is bent and the two bond dipoles add up.", "h": "H₂O ≈ 1.8 D, CCl₄ = 0 D."}, {"ch": 7, "k": "concept", "s": "Ch8 p.93", "q": "The dipole moment of CCl₄ is zero because:", "o": ["the four C–Cl bond dipoles cancel in a symmetrical tetrahedron", "chlorine and carbon have equal electronegativity", "the C–Cl bonds are non-polar", "CCl₄ is an ionic compound"], "a": 0, "e": "Each C–Cl bond is polar, but the symmetrical shape makes the dipoles cancel. ⚠ Bond polarity and molecular polarity are not the same thing.", "h": "⚠ TRAP: polar bonds can still give a non-polar molecule (CCl₄, CO₂, BF₃)."}, {"ch": 7, "k": "concept", "s": "Ch8 p.93", "q": "Which molecule is non-polar even though it has polar bonds?", "o": ["CO₂", "HCl", "NH₃", "H₂O"], "a": 0, "e": "CO₂ is linear, so the two C=O dipoles point in opposite directions and cancel.", "h": "Linear and symmetrical = non-polar."}, {"ch": 7, "k": "concept", "s": "Ch8 p.93", "q": "Water is a polar solvent and CCl₄ is a non-polar solvent. Iodine (I₂) would dissolve best in:", "o": ["CCl₄", "aqueous NaOH", "dilute HCl", "water"], "a": 0, "e": "I₂ is non-polar, so it dissolves in a non-polar solvent. This is the same I₂/CCl₄ pair used in the book’s molality example.", "h": "Non-polar solute, non-polar solvent."}, {"ch": 7, "k": "concept", "s": "Ch8 p.93", "q": "The dipole moment of a bond is defined as:", "o": ["charge ÷ distance between the charges", "mass × velocity", "charge + distance between the charges", "charge × distance between the charges"], "a": 3, "e": "The book defines it as the product of the distance separating equal and opposite charges and the magnitude of the charge. Unit: debye (D).", "h": "μ = q × d."}, {"ch": 7, "k": "concept", "s": "Ch8 p.93-94", "q": "Metallic bonding is the force that holds together:", "o": ["discrete molecules held by weak forces", "metal cations in a sea of mobile valence electrons", "positive and negative ions in a fixed lattice", "atoms sharing a single pair of electrons"], "a": 1, "e": "The cations sit in a regular lattice and the valence electrons move freely through it.", "h": "Cations in a sea of electrons."}, {"ch": 7, "k": "concept", "s": "Ch8 p.94", "q": "Metals conduct electricity and heat well because:", "o": ["they have strong ionic bonds", "their valence electrons are free to move", "they are made of discrete molecules", "they have no valence electrons"], "a": 1, "e": "The book says the free-moving electrons account for the high thermal and electrical conductivity of metals.", "h": "Mobile electrons carry charge and heat."}, {"ch": 7, "k": "concept", "s": "Ch8 p.94", "q": "Intermolecular forces are:", "o": ["only found between metal atoms in solids", "stronger than ordinary covalent bonds", "identical to the ionic bonds in crystals", "much weaker than ionic or covalent bonds"], "a": 3, "e": "They act between molecules and are very weak compared with the bonds inside molecules.", "h": "Weaker than any real chemical bond."}, {"ch": 7, "k": "concept", "s": "Ch8 p.94", "q": "Hydrogen bonding occurs when hydrogen is bonded to:", "o": ["fluorine, oxygen or nitrogen", "carbon, sulphur or phosphorus", "sodium, potassium or calcium", "chlorine, bromine or iodine"], "a": 0, "e": "These very electronegative small atoms make H strongly δ+, which then attracts a lone pair on a neighbouring molecule. Memory: F-O-N.", "h": "F-O-N for hydrogen bonding."}, {"ch": 7, "k": "concept", "s": "Ch8 p.94", "q": "Which of these molecules can form hydrogen bonds with other molecules of its own kind?", "o": ["CH₄", "CCl₄", "C₂H₆", "CH₃OH"], "a": 3, "e": "Methanol has an O–H group. The book shows hydrogen bonding in water and methanol.", "h": "Look for O–H, N–H or H–F."}, {"ch": 7, "k": "concept", "s": "Ch8 p.94", "q": "Which statement is true about hydrogen bonds?", "o": ["Stronger than any covalent bond in the molecule", "Stronger than dipole–dipole forces, weaker than covalent bonds", "Weaker than every van der Waals force there is", "The same thing as the covalent O–H bond in water"], "a": 1, "e": "They are much more dramatic than other dipole forces because of the large electronegativity difference and exposed hydrogen, but still far weaker than a covalent O–H bond.", "h": "⚠ TRAP: a hydrogen bond is not a covalent bond."}, {"ch": 7, "k": "concept", "s": "Ch8 p.94", "q": "Water has a much higher boiling point than H₂S mainly because of:", "o": ["larger molar mass of water", "stronger covalent bonds in water", "ionic bonds in water", "hydrogen bonding between water molecules"], "a": 3, "e": "H₂S (molar mass 34) is heavier than H₂O (18), yet it boils far lower. Hydrogen bonds in water account for the difference.", "h": "High bp for a small molecule = hydrogen bonding."}, {"ch": 7, "k": "concept", "s": "Ch8 p.95", "q": "Van der Waals forces are:", "o": ["forces that bind the atoms of a metal", "forces that break covalent bonds apart", "strong forces that hold ions in a crystal", "weak forces that attract neutral molecules together"], "a": 3, "e": "The book defines them as relatively weak electrical forces attracting neutral molecules in gases, liquids and solids. Solids held by them melt at low temperature and are soft.", "h": "Weak and found everywhere."}, {"ch": 7, "k": "concept", "s": "Ch8 p.95", "q": "According to the book, van der Waals forces arise from permanent dipoles and also from:", "o": ["nuclear fusion", "shared electron pairs", "transfer of electrons between atoms", "polarisation induced by neighbouring molecules"], "a": 3, "e": "A neighbouring dipole (polar or non-polar) can distort the electron cloud and induce a temporary dipole, giving a weak attraction.", "h": "Permanent dipoles, induced dipoles."}, {"ch": 7, "k": "concept", "s": "Ch8 p.95", "q": "Why can argon (a noble gas) be liquefied at all?", "o": ["argon forms stable ionic bonds", "argon forms weak covalent bonds", "van der Waals forces act between its atoms", "argon forms strong hydrogen bonds"], "a": 2, "e": "Argon atoms have no bonds, but induced dipoles give a weak attraction. The book gives argon and benzene as examples.", "h": "Even noble gases have dispersion forces."}, {"ch": 7, "k": "concept", "s": "Ch8 p.95", "q": "Which solid is likely to be soft with a low melting point?", "o": ["Solid argon, held by van der Waals forces", "Sodium chloride, a crystal of ions", "Diamond, a giant covalent network", "Copper, a lattice of metal atoms"], "a": 0, "e": "Solids held by van der Waals forces are softer and melt at lower temperatures than ionic, covalent network or metallic solids.", "h": "Weak forces ⇒ soft, low mp."}, {"ch": 7, "k": "concept", "s": "Ch8 p.95 variant", "q": "The boiling points of F₂, Cl₂, Br₂ and I₂ rise down the group because:", "o": ["larger molecules have stronger van der Waals forces", "the covalent bonds get a lot stronger", "the molecules start to form hydrogen bonds", "their dipole moments get steadily larger"], "a": 0, "e": "All are non-polar, so only dispersion forces act. Bigger electron clouds are more polarisable, so the forces are larger.", "h": "More electrons, stronger dispersion forces."}, {"ch": 7, "k": "concept", "s": "Ch8 p.95 variant", "q": "Order of strength of the forces named in this chapter (strongest first):", "o": ["hydrogen bond > covalent > van der Waals", "van der Waals > hydrogen bond > covalent", "covalent > hydrogen bond > van der Waals", "covalent > van der Waals > hydrogen bond"], "a": 2, "e": "Covalent bonds are the strongest, hydrogen bonds are intermolecular but fairly strong, and van der Waals forces are the weakest.", "h": "C-H-V: covalent, hydrogen, van der Waals."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91 variant", "q": "Which compound should have the highest melting point?", "o": ["CH₄", "H₂O", "CCl₄", "MgO"], "a": 3, "e": "MgO is an ionic solid made of doubly charged ions, giving a very strong lattice. The others are molecular.", "h": "Highly charged ions = very high mp."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91 variant", "q": "A compound melts at −23 °C, does not conduct electricity as a liquid and dissolves in benzene. It is most likely:", "o": ["a coordinate polymer", "covalent (molecular)", "ionic", "metallic"], "a": 1, "e": "Low melting point, no conduction and solubility in a non-polar solvent point to a molecular covalent compound such as CCl₄.", "h": "Low mp + non-conductor + benzene-soluble = covalent."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91 variant", "q": "A solid conducts electricity, is malleable and has a shiny surface. The bonding is:", "o": ["hydrogen bonding", "covalent", "ionic", "metallic"], "a": 3, "e": "Free electrons explain conductivity, and the layers of cations can slide, making metals malleable.", "h": "Metal properties = metallic bonding."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91 variant", "q": "Which pair of atoms would form the most ionic bond?", "o": ["H and Cl", "Cs and F", "N and N", "C and O"], "a": 1, "e": "Caesium (very low electronegativity) and fluorine (the highest) have the largest electronegativity difference.", "h": "Far left plus far right = most ionic."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91 variant", "q": "The Mg²⁺ ion is smaller than the Mg atom because:", "o": ["it has more protons than the Mg atom does", "it lost its outer shell, so the nucleus pulls harder", "its electron cloud is now repelling the nucleus", "it has gained extra electrons in the outer shell"], "a": 1, "e": "Losing the third shell leaves a 2,8 core held by 12 protons, so the radius shrinks. Cations are always smaller than their atoms.", "h": "Cation smaller, anion larger."}, {"ch": 7, "k": "concept", "s": "Ch8 p.91 variant", "q": "The Cl⁻ ion is larger than the Cl atom because:", "o": ["it has lost an electron from the outer shell", "it has gained a proton in its nucleus", "extra electron repulsion expands the cloud", "its nucleus is much bigger than before"], "a": 2, "e": "The nuclear charge is the same, but 18 electrons repel each other more than 17, so the cloud spreads out.", "h": "Anion larger than atom."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92 variant", "q": "A nitrogen molecule N₂ contains:", "o": ["a single bond", "a double bond", "a triple bond", "a coordinate bond only"], "a": 2, "e": "Each N has 5 valence electrons, needs 3 more, and so three pairs are shared: N≡N. This is why N₂ is very unreactive.", "h": "N₂ = three pairs."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92 variant", "q": "How many lone pairs does the oxygen atom in H₂O have?", "o": ["2", "0", "1", "4"], "a": 0, "e": "Oxygen has 6 valence electrons. Two are used in the O–H bonds, leaving 4 electrons, which is two lone pairs. These lone pairs are the reason for the bent shape and hydrogen bonding.", "h": "Water: 2 bond pairs, 2 lone pairs."}, {"ch": 7, "k": "concept", "s": "Ch8 p.92 variant", "q": "The shape of the water molecule is:", "o": ["trigonal planar", "bent (V-shaped)", "tetrahedral", "linear"], "a": 1, "e": "Four electron pairs around oxygen arrange tetrahedrally, but only two are bonding, so the molecule is bent. A linear shape would have zero dipole.", "h": "Bent water, linear CO₂."}, {"ch": 8, "k": "exercise", "s": "Ch9 p.98 Question 1.1", "q": "The equilibrium constant expression for 2NO₂ ⇌ N₂O₄ is Kc =", "o": ["[NO₂]² / [N₂O₄], with units mol/L", "[N₂O₄] / [NO₂]², with units L/mol", "[N₂O₄] / [NO₂], with no units", "[N₂O₄] × [NO₂]², with units mol³/L³"], "a": 1, "e": "Products over reactants, each raised to its coefficient. Units: (mol/L) ÷ (mol/L)² = L/mol.", "h": "Products on top. Coefficient becomes the power."}, {"ch": 8, "k": "exercise", "s": "Ch9 p.98 Question 1.2", "q": "The equilibrium constant expression for N₂ + 3H₂ ⇌ 2NH₃ is Kc =", "o": ["[NH₃]² / ([N₂][H₂]), with units L/mol", "[NH₃] / ([N₂][H₂]), with no units", "[N₂][H₂]³ / [NH₃]², with units mol²/L²", "[NH₃]² / ([N₂][H₂]³), with units L²/mol²"], "a": 3, "e": "Units: (mol/L)² ÷ [(mol/L)(mol/L)³] = (mol/L)² ÷ (mol/L)⁴ = L²/mol².", "h": "⚠ TRAP: the 3 on H₂ becomes a cube, not a multiplier."}, {"ch": 8, "k": "exercise", "s": "Ch9 p.98 Question 1.3", "q": "For the esterification CH₃CH₂CO₂H + CH₃CH₂OH ⇌ CH₃CH₂CO₂CH₂CH₃ + H₂O (all liquids mixed together), Kc has:", "o": ["units of L/mol, from one extra reactant", "no units, because the moles and litres cancel", "units of mol/L, from one extra product", "units of mol²/L², from two products"], "a": 1, "e": "Kc = [ester][H₂O] / ([acid][alcohol]). There are two concentration terms above and two below, so the units cancel. The species are dissolved in one mixture, so they all appear in the expression.", "h": "Equal number of moles on each side = no units."}, {"ch": 8, "k": "exercise", "s": "Ch9 p.98", "q": "For PCl₅ ⇌ PCl₃ + Cl₂ the units of Kc are:", "o": ["mol/L", "no units", "mol²/L²", "L/mol"], "a": 0, "e": "Kc = [PCl₃][Cl₂]/[PCl₅]. (mol/L)² ÷ (mol/L) = mol/L, as the book shows.", "h": "One more mole on the product side gives mol/L."}, {"ch": 8, "k": "exercise", "s": "Ch9 p.104 Question 2", "q": "A system absorbs 600 kJ of heat and 450 kJ of work is done ON it. The change in internal energy (ΔE = q + w) is:", "o": ["−150 kJ", "+150 kJ", "−1050 kJ", "+1050 kJ"], "a": 3, "e": "Both heat in and work done on the system add energy: ΔE = 600 + 450 = +1050 kJ. If the 450 kJ were work done BY the system, w = −450 and ΔE = +150 kJ. ⚠ The book prints “600 Kg of heat”, but heat is in kJ, not kg.", "h": "Energy entering the system is positive."}, {"ch": 8, "k": "exercise", "s": "Ch9 p.104 Question 2", "q": "If instead the system absorbs 600 kJ of heat and does 450 kJ of work on its surroundings, ΔE is:", "o": ["−1050 kJ", "−150 kJ", "+1050 kJ", "+150 kJ"], "a": 3, "e": "Work done BY the system has w = −450 kJ. ΔE = 600 + (−450) = +150 kJ.", "h": "By the system = negative work."}, {"ch": 8, "k": "exercise", "s": "Ch9 p.106 Question 3", "q": "C(s) + H₂O(l) → CO(g) + H₂(g) at 27 °C has ΔH = 4500 J and ΔS = 12 J/K. The free energy change ΔG is:", "o": ["+4176 J", "+8100 J", "−900 J", "+900 J"], "a": 3, "e": "T = 27 + 273 = 300 K. ΔG = ΔH − TΔS = 4500 − (300 × 12) = 4500 − 3600 = +900 J. Positive, so the reaction is not spontaneous at 27 °C. ⚠ Using 27 instead of 300 gives 4176 J.", "h": "⚠ TRAP: convert °C to kelvin before TΔS."}, {"ch": 8, "k": "exercise", "s": "Ch9 p.106 Question 3", "q": "At what temperature does the reaction above (ΔH = 4500 J, ΔS = 12 J/K) become spontaneous?", "o": ["Below 375 K", "At every temperature", "Above 27 K", "Above 375 K"], "a": 3, "e": "ΔG = 0 when T = ΔH/ΔS = 4500/12 = 375 K. Above that, TΔS is larger than ΔH and ΔG turns negative.", "h": "Positive ΔH and positive ΔS: spontaneous when hot."}, {"ch": 8, "k": "concept", "s": "Ch9 p.96", "q": "Chemical equilibrium is the state in which:", "o": ["the forward and backward reactions have both stopped", "concentrations stay constant because forward and backward rates are equal", "all reactants have turned into products", "the concentrations of reactants and products are equal"], "a": 1, "e": "At equilibrium the rates are equal, not zero, and concentrations are constant but not necessarily equal.", "h": "⚠ TRAP: constant ≠ equal, and the reactions have not stopped."}, {"ch": 8, "k": "concept", "s": "Ch9 p.96", "q": "At equilibrium, the reaction at the molecular level is:", "o": ["finished in one direction", "happening only in the forward direction", "dynamic, with both reactions still going on", "completely static"], "a": 2, "e": "The book says equilibrium is “highly dynamic”: molecules keep reacting both ways at the same rate.", "h": "Dynamic equilibrium."}, {"ch": 8, "k": "concept", "s": "Ch9 p.97", "q": "Which of these is NOT a property of a system at equilibrium?", "o": ["ΔG = 0", "The concentrations of reactants and products are equal", "The system resists disturbance", "The rate of reaction is the same in both directions"], "a": 1, "e": "The book’s properties: dynamic, equal opposing rates, constant concentrations, ΔG = 0, and resisting disturbance. Concentrations are constant, not necessarily equal.", "h": "Constant, not equal."}, {"ch": 8, "k": "concept", "s": "Ch9 p.97", "q": "At equilibrium the Gibbs free energy change of the reaction is:", "o": ["positive", "equal to ΔH", "zero", "negative"], "a": 2, "e": "ΔG = 0 means there is no driving force either way.", "h": "Equilibrium: ΔG = 0."}, {"ch": 8, "k": "concept", "s": "Ch9 p.96", "q": "Which of these is a reversible reaction given in the book?", "o": ["2Mg + O₂ → 2MgO", "NH₄Cl ⇌ NH₃ + HCl", "CH₄ + 2O₂ → CO₂ + 2H₂O", "Na + Cl₂ → NaCl"], "a": 1, "e": "Heating ammonium chloride gives NH₃ and HCl, which recombine on cooling. The other reactions are normally taken to completion.", "h": "Examples: steam on red hot iron and heating NH₄Cl."}, {"ch": 8, "k": "concept", "s": "Ch9 p.96", "q": "A reversible reaction is one that:", "o": ["can only be carried out by heating strongly", "always goes to completion in one direction", "has no products at all once it starts", "can be made to go either way by changing conditions"], "a": 3, "e": "Defined in the book as a reaction that can be driven both ways by changing the experimental conditions.", "h": "Reversible = two-way."}, {"ch": 8, "k": "concept", "s": "Ch9 p.97", "q": "For A + B ⇌ C + D, the equilibrium constant K equals:", "o": ["k₁ × k₂", "k₁/k₂ = [C][D]/[A][B]", "[A][B]/[C][D]", "k₂/k₁ = [A][B]/[C][D]"], "a": 1, "e": "At equilibrium k₁[A][B] = k₂[C][D], so K = k₁/k₂ = [C][D]/[A][B]. K is the ratio of the forward and backward rate constants.", "h": "Forward over backward, products over reactants."}, {"ch": 8, "k": "concept", "s": "Ch9 p.97", "q": "The rate of the forward reaction for A + B ⇌ C + D is:", "o": ["R₁ = k₁[C][D]", "R₁ = k₂[C][D]", "R₁ = k₁[A][B]", "R₁ = [A][B]/k₁"], "a": 2, "e": "The forward rate depends on the reactants. The backward rate is R₂ = k₂[C][D].", "h": "Forward uses reactants."}, {"ch": 8, "k": "concept", "s": "Ch9 p.98", "q": "The equilibrium constant for aA + bB ⇌ cC + dD is:", "o": ["K = [A]ᵃ[B]ᵇ / [C]ᶜ[D]ᵈ", "K = c[C] × d[D] / a[A] × b[B]", "K = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ", "K = ([C] + [D]) / ([A] + [B])"], "a": 2, "e": "Products over reactants, each concentration raised to its stoichiometric coefficient.", "h": "Law of mass action."}, {"ch": 8, "k": "concept", "s": "Ch9 p.99", "q": "Which of these is a homogeneous equilibrium?", "o": ["Ca(OH)₂(s) ⇌ Ca²⁺(aq) + 2OH⁻(aq)", "N₂(g) + 3H₂(g) ⇌ 2NH₃(g)", "CaCO₃(s) ⇌ CaO(s) + CO₂(g)", "PbI₂(s) ⇌ Pb²⁺(aq) + 2I⁻(aq)"], "a": 1, "e": "Homogeneous: everything in one phase. The ammonia system is all gas. The others each contain a solid together with ions or gas.", "h": "One phase = homogeneous."}, {"ch": 8, "k": "concept", "s": "Ch9 p.99", "q": "In the equilibrium expression for a heterogeneous reaction, pure solids and pure liquids are:", "o": ["raised to the power of their coefficient", "replaced by their densities", "left out of the expression", "included as concentrations in mol/L"], "a": 2, "e": "Their concentration is constant (taken as 1) so they do not affect the value of K. For Ca(OH)₂(s) ⇌ Ca²⁺ + 2OH⁻, K = [Ca²⁺][OH⁻]². ⚠ The book prints the calcium ion as Ca₂⁺, a misprint for Ca²⁺.", "h": "Solids and pure liquids: out."}, {"ch": 8, "k": "concept", "s": "Ch9 p.99", "q": "For Ca(OH)₂(s) ⇌ Ca²⁺(aq) + 2OH⁻(aq), the equilibrium constant is:", "o": ["K = [Ca²⁺][OH⁻]²", "K = [Ca²⁺][2OH⁻]", "K = [Ca²⁺][OH⁻]² / [Ca(OH)₂]", "K = [Ca²⁺][OH⁻]"], "a": 0, "e": "The solid is left out, and the hydroxide is squared (not multiplied by 2).", "h": "This is also the Ksp expression."}, {"ch": 8, "k": "concept", "s": "Ch9 p.99", "q": "Le Chatelier’s principle states that when a system at equilibrium is disturbed:", "o": ["it shifts to increase the disturbance", "the equilibrium constant is always doubled", "it shifts to partly oppose the disturbance", "it stops reacting"], "a": 2, "e": "The system moves in the direction that reduces the effect of the change imposed on it.", "h": "Opposes, never cancels completely."}, {"ch": 8, "k": "concept", "s": "Ch9 p.99", "q": "The three main factors affecting the position of equilibrium in the book are:", "o": ["temperature, pressure and concentration", "pH, colour and elapsed time", "mass, volume and density together", "catalyst, light and particle size"], "a": 0, "e": "The book lists temperature, pressure and concentration. A catalyst is dealt with separately because it does not shift the position.", "h": "T, P, C."}, {"ch": 8, "k": "concept", "s": "Ch9 p.100", "q": "In PCl₅ ⇌ PCl₃ + Cl₂, adding more Cl₂ will:", "o": ["shift equilibrium left, giving more PCl₅", "shift the equilibrium to the right side", "have no effect on the equilibrium at all", "change the numerical value of Kc itself"], "a": 0, "e": "Extra product pushes the system to use it up, so it moves left (as the book says). Kc stays the same.", "h": "Add product → shift to the reactant side."}, {"ch": 8, "k": "concept", "s": "Ch9 p.100", "q": "Removing Cl₂ from PCl₅ ⇌ PCl₃ + Cl₂ as it forms will:", "o": ["make the system static", "shift the equilibrium to the left", "lower the value of Kc", "shift the equilibrium to the right"], "a": 3, "e": "The system tries to replace what was removed, producing more products. That is how yields are raised in industry.", "h": "Remove product → more product."}, {"ch": 8, "k": "concept", "s": "Ch9 p.100", "q": "A change in concentration at constant temperature changes:", "o": ["the value of K, but not the position", "neither the position nor the value of K", "the position of equilibrium, but not K", "both the position and the value of K"], "a": 2, "e": "The book says the equilibrium constant remains the same. Only temperature changes K.", "h": "⚠ TRAP: K depends on temperature alone."}, {"ch": 8, "k": "concept", "s": "Ch9 p.100", "q": "For N₂ + 3H₂ ⇌ 2NH₃, increasing the pressure will:", "o": ["favour the left-hand side", "have no effect on the equilibrium", "favour the right-hand side, giving more NH₃", "make the reaction stop"], "a": 2, "e": "4 moles of gas on the left and 2 on the right. Higher pressure shifts the equilibrium to the side with fewer gas molecules. The book notes that experiments confirm this.", "h": "High pressure → fewer moles of gas."}, {"ch": 8, "k": "concept", "s": "Ch9 p.100", "q": "Lowering the pressure on the N₂ + 3H₂ ⇌ 2NH₃ system will:", "o": ["double the value of Kc for the reaction", "favour breaking NH₃ down into N₂ and H₂", "favour making still more NH₃ from N₂", "have no effect on the position at all"], "a": 1, "e": "Low pressure favours the side with more gas molecules, which is the left.", "h": "Low pressure → more moles of gas."}, {"ch": 8, "k": "concept", "s": "Ch9 p.101", "q": "N₂ + O₂ ⇌ 2NO is not affected by pressure changes because:", "o": ["NO is a solid, so no gas is involved", "N₂ is inert and takes no part in it", "moles of gas are equal on both sides", "the reaction is exothermic and absorbs it"], "a": 2, "e": "2 moles of gas on each side, so a pressure change affects both sides equally. The book gives this example.", "h": "Equal moles of gas = no pressure effect."}, {"ch": 8, "k": "concept", "s": "Ch9 p.101", "q": "The reaction H₂ + I₂ ⇌ HI + heat (as the book writes it) is exothermic. Increasing the temperature will:", "o": ["shift equilibrium to the left, giving less HI", "raise the value of K", "have no effect on HI", "shift equilibrium to the right, giving more HI"], "a": 0, "e": "Heat acts like a product, so extra heat pushes the system left. For an exothermic reaction, K decreases when T rises. ⚠ The book writes “N₂ and I₂ to give HI” (it should be H₂), and the equation is not balanced (H₂ + I₂ ⇌ 2HI).", "h": "Exothermic: heat is a product. Raise T, shift left."}, {"ch": 8, "k": "concept", "s": "Ch9 p.101", "q": "For an endothermic reaction, raising the temperature will:", "o": ["have no effect on K", "decrease K", "shift equilibrium towards the reactants", "shift equilibrium towards the products and increase K"], "a": 3, "e": "Heat is a reactant in an endothermic reaction, so extra heat favours the forward reaction.", "h": "Endo: heat on the left; heating → right."}, {"ch": 8, "k": "concept", "s": "Ch9 p.101", "q": "Adding a catalyst to a system at equilibrium will:", "o": ["shift the equilibrium further to the left", "not change the position, but speed up reaching it", "shift the equilibrium further to the right", "increase the numerical value of K itself"], "a": 1, "e": "A catalyst speeds up the forward and backward reactions equally. The book states it has no effect on the position of the system at equilibrium.", "h": "⚠ TRAP: catalysts change rate, never position or K."}, {"ch": 8, "k": "concept", "s": "Ch9 p.98 variant", "q": "At equilibrium [N₂O₄] = 0.16 M and [NO₂] = 0.040 M in 2NO₂ ⇌ N₂O₄. Kc is:", "o": ["4000 L/mol", "100 L/mol", "4.0 L/mol", "0.010 L/mol"], "a": 1, "e": "Kc = 0.16 / (0.040)² = 0.16 / 0.0016 = 100 L/mol. If you do not square the denominator you get 4.0.", "h": "Square the NO₂ concentration."}, {"ch": 8, "k": "concept", "s": "Ch9 p.98 variant", "q": "At equilibrium [H₂] = [I₂] = 0.10 M and [HI] = 0.40 M for H₂ + I₂ ⇌ 2HI. Kc is:", "o": ["4.0", "16", "40", "0.0625"], "a": 1, "e": "Kc = (0.40)² / (0.10 × 0.10) = 0.16 / 0.010 = 16. No units, since moles on both sides are equal.", "h": "Count the units: they cancel."}, {"ch": 8, "k": "concept", "s": "Ch9 p.98 variant", "q": "For N₂ + 3H₂ ⇌ 2NH₃: [N₂] = 0.50 M, [H₂] = 1.0 M, [NH₃] = 0.20 M. Kc is:", "o": ["12.5 L²/mol²", "0.20 L²/mol²", "0.040 L²/mol²", "0.080 L²/mol²"], "a": 3, "e": "Kc = (0.20)² / (0.50 × 1.0³) = 0.040 / 0.50 = 0.080. Writing it upside down gives 12.5.", "h": "Products on top."}, {"ch": 8, "k": "concept", "s": "Ch9 p.98 variant", "q": "For PCl₅ ⇌ PCl₃ + Cl₂ at equilibrium [PCl₅] = 0.10 M, [PCl₃] = [Cl₂] = 0.20 M. Kc is:", "o": ["0.40 mol/L", "4.0 mol/L", "0.0050 mol/L", "0.10 mol/L"], "a": 0, "e": "Kc = (0.20 × 0.20) / 0.10 = 0.040 / 0.10 = 0.40 mol/L.", "h": "Easy slip: 0.04 ÷ 0.1 = 0.4."}, {"ch": 8, "k": "concept", "s": "Ch9 p.98 variant", "q": "If Kc for A ⇌ B is 4.0, the Kc for B ⇌ A at the same temperature is:", "o": ["0.25", "−4.0", "4.0", "16"], "a": 0, "e": "Reversing the equation inverts K: 1/4.0 = 0.25.", "h": "Reverse reaction: take 1/K."}, {"ch": 8, "k": "concept", "s": "Ch9 p.98 variant", "q": "A very large value of Kc (for example 10⁸) means that at equilibrium:", "o": ["the reaction is at ΔG > 0", "the reaction never started", "products are strongly favoured", "reactants are strongly favoured"], "a": 2, "e": "K = [products]/[reactants]. A big K means mostly products.", "h": "Big K, mostly products."}, {"ch": 8, "k": "concept", "s": "Ch9 p.101", "q": "Thermochemistry is the branch of chemistry concerned with:", "o": ["the properties of ideal gases only", "the structure of atoms in molecules", "the rates at which reactions occur", "the heat effects of chemical reactions"], "a": 3, "e": "The book calls it a sub-field of thermodynamics. “Thermo” means heat and “dynamics” means motion or change.", "h": "Thermo = heat."}, {"ch": 8, "k": "concept", "s": "Ch9 p.102", "q": "In thermodynamics, the system is:", "o": ["the part of the universe chosen for study", "the whole universe at all times", "everything outside the area of study", "only the container used"], "a": 0, "e": "The surroundings are the rest of the universe that interacts with the system.", "h": "System = what you study."}, {"ch": 8, "k": "concept", "s": "Ch9 p.102", "q": "An open system can exchange with its surroundings:", "o": ["matter only", "neither energy nor matter", "both energy and matter", "energy only"], "a": 2, "e": "The book’s example is a beaker of hot coffee, which loses heat and water vapour.", "h": "Open: energy and matter."}, {"ch": 8, "k": "concept", "s": "Ch9 p.102", "q": "A closed system can exchange with its surroundings:", "o": ["matter but not energy", "energy but not matter", "nothing at all", "both energy and matter"], "a": 1, "e": "The book’s example is a stoppered flask of hot coffee. Heat gets out but vapour does not.", "h": "Closed: energy only."}, {"ch": 8, "k": "concept", "s": "Ch9 p.102", "q": "An isolated system (like an ideal insulated flask):", "o": ["exchanges matter but not energy", "exchanges both energy and matter", "exchanges neither energy nor matter", "exchanges energy but not matter"], "a": 2, "e": "Hot coffee in an insulated container approximates an isolated system.", "h": "Isolated: nothing crosses the boundary."}, {"ch": 8, "k": "concept", "s": "Ch9 p.103", "q": "Kinetic energy is given by:", "o": ["½mv²", "½mv", "mgh", "mv²"], "a": 0, "e": "Kinetic energy = ½ × mass × velocity². The book also gives work = force × distance.", "h": "Half-m-v-squared."}, {"ch": 8, "k": "concept", "s": "Ch9 p.103", "q": "The book says heat and work are:", "o": ["two kinds of energy stored in a system", "two forms of potential energy in a system", "two forms of kinetic energy in a system", "ways a system’s energy changes, not forms of energy"], "a": 3, "e": "Both are measured in joules, but they describe energy transfer, not energy stored in the system.", "h": "Heat and work are transfers."}, {"ch": 8, "k": "concept", "s": "Ch9 p.103", "q": "Thermal energy is the kinetic energy associated with:", "o": ["electrons moving in a wire", "random molecular motion", "stored chemical bonds", "the position of an object"], "a": 1, "e": "It is proportional to temperature: the hotter the sample, the more vigorous the motion.", "h": "Thermal = random motion."}, {"ch": 8, "k": "concept", "s": "Ch9 p.103", "q": "The First Law of Thermodynamics (energy is neither created nor destroyed) is written as:", "o": ["ΔE = q × w", "ΔE = q − w always", "ΔE = q/w", "ΔE = q + w"], "a": 3, "e": "q is heat added and w is work done on the system. ⚠ The book’s sentence says “w is the work done by the system” while using ΔE = q + w. Under ΔE = q + w, positive w means work done ON the system.", "h": "Energy in is positive."}, {"ch": 8, "k": "concept", "s": "Ch9 p.104", "q": "Heat given off by the system has the sign:", "o": ["zero", "positive (q > 0)", "negative (q < 0)", "it depends on the pressure"], "a": 2, "e": "Energy leaving the system is negative. Heat absorbed is positive. Work done on the system is positive, work done by the system is negative.", "h": "In +, out −."}, {"ch": 8, "k": "concept", "s": "Ch9 p.104", "q": "Work done by the system on its surroundings has the sign:", "o": ["negative (w < 0)", "zero", "it is always positive", "positive (w > 0)"], "a": 0, "e": "The system loses energy when it does work.", "h": "System does work: w < 0."}, {"ch": 8, "k": "concept", "s": "Ch9 p.104", "q": "For an isolated system, ΔE is:", "o": ["zero, so the energy is conserved", "positive, so the energy increases", "negative, so the energy decreases", "equal to the heat q alone is"], "a": 0, "e": "No heat or work can enter or leave, so the internal energy stays constant.", "h": "Isolated: ΔE = 0."}, {"ch": 8, "k": "concept", "s": "Ch9 p.104", "q": "Enthalpy is defined as:", "o": ["H = E × PV", "H = E + PV", "H = q − w", "H = E − PV"], "a": 1, "e": "It is the sum of the internal energy and the pressure–volume product of the system.", "h": "Enthalpy = energy plus PV."}, {"ch": 8, "k": "concept", "s": "Ch9 p.105", "q": "At constant pressure the enthalpy change is:", "o": ["ΔH = ΔE × PΔV", "ΔH = ΔE", "ΔH = ΔE − PΔV", "ΔH = ΔE + PΔV"], "a": 3, "e": "Starting from ΔH = ΔE + (P₂V₂ − P₁V₁) with P constant, you get ΔH = ΔE + PΔV.", "h": "Add PΔV."}, {"ch": 8, "k": "concept", "s": "Ch9 p.105", "q": "A reaction with a negative ΔH is:", "o": ["spontaneous at all temperatures", "endothermic", "at equilibrium", "exothermic"], "a": 3, "e": "Negative ΔH means the system gives heat to the surroundings. Positive ΔH means endothermic. ⚠ ΔH negative does not alone guarantee spontaneity.", "h": "Negative ΔH = heat out."}, {"ch": 8, "k": "concept", "s": "Ch9 p.105", "q": "In an isolated system an exothermic reaction causes:", "o": ["a pressure decrease only", "no temperature change", "a temperature increase", "a temperature decrease"], "a": 2, "e": "The heat released cannot escape, so the temperature rises. An endothermic reaction in an isolated system lowers the temperature.", "h": "Exo = hot."}, {"ch": 8, "k": "concept", "s": "Ch9 p.105", "q": "The Second Law of Thermodynamics says that for any spontaneous process:", "o": ["the entropy of the universe decreases", "the entropy of the universe increases", "the energy of the universe increases", "the enthalpy of the system is always negative"], "a": 1, "e": "ΔS(universe) > 0. The entropy of an isolated system never spontaneously decreases.", "h": "Universe: entropy up."}, {"ch": 8, "k": "concept", "s": "Ch9 p.105", "q": "Entropy is a measure of:", "o": ["the speed of a reaction", "the heat content of a system", "the disorder of a system", "the pressure of a gas"], "a": 2, "e": "The book describes it as the degree of disorderliness, or the dissipated energy at a given temperature that is unavailable to do work.", "h": "Entropy = disorder."}, {"ch": 8, "k": "concept", "s": "Ch9 p.105", "q": "Which change would increase the entropy of a system?", "o": ["Water freezing to ice", "Gas being compressed", "Steam condensing to water", "Ice melting to water"], "a": 3, "e": "The liquid is more disordered than the solid. Heating a system also increases random motion and entropy.", "h": "Solid → liquid → gas: entropy rises."}, {"ch": 8, "k": "concept", "s": "Ch9 p.106", "q": "The Gibbs free energy equation is:", "o": ["ΔG = ΔH − TΔS", "ΔG = ΔS − TΔH", "ΔG = TΔH − ΔS", "ΔG = ΔH + TΔS"], "a": 0, "e": "G = H − TS, so at constant temperature ΔG = ΔH − TΔS (T in kelvin).", "h": "Gibbs: H minus T-S."}, {"ch": 8, "k": "concept", "s": "Ch9 p.106", "q": "A reaction is spontaneous in the forward direction when:", "o": ["ΔG is less than zero", "ΔG is greater than zero", "ΔH is greater than zero", "ΔG equals zero"], "a": 0, "e": "ΔG < 0 spontaneous, ΔG > 0 non-spontaneous (spontaneous in reverse), ΔG = 0 equilibrium.", "h": "Negative ΔG = spontaneous."}, {"ch": 8, "k": "concept", "s": "Ch9 p.106", "q": "If ΔH is negative and ΔS is positive, the reaction is:", "o": ["non-spontaneous at all temperatures", "spontaneous at all temperatures", "spontaneous only at high temperature", "spontaneous only at low temperature"], "a": 1, "e": "ΔG = (negative) − T(positive) is always negative.", "h": "Both signs favour spontaneity."}, {"ch": 8, "k": "concept", "s": "Ch9 p.106", "q": "If ΔH is positive and ΔS is negative, the reaction is:", "o": ["spontaneous at low temperature only", "spontaneous at high temperature only", "non-spontaneous at all temperatures", "spontaneous at all temperatures"], "a": 2, "e": "ΔG = (positive) − T(negative) is always positive.", "h": "Both signs against spontaneity."}, {"ch": 8, "k": "concept", "s": "Ch9 p.106", "q": "If ΔH and ΔS are both positive, the reaction is spontaneous:", "o": ["never", "only at low temperature", "only at high temperature", "at all temperatures"], "a": 2, "e": "The TΔS term must be larger than ΔH, which happens when T is high.", "h": "Positive both: heat it up."}, {"ch": 8, "k": "concept", "s": "Ch9 p.106 variant", "q": "For N₂ + 3H₂ → 2NH₃, ΔH = −92.2 kJ and ΔS = −198.7 J/K at 298 K. ΔG is:", "o": ["−33.0 kJ", "−92.2 kJ", "−151.4 kJ", "+33.0 kJ"], "a": 0, "e": "ΔG = −92 200 − (298 × −198.7) = −92 200 + 59 213 = −32 987 J, which is about −33.0 kJ. ⚠ ΔH is in kJ and ΔS in J/K, so convert before
