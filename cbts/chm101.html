l₂ + H₂S (H = 1, Cl = 35.5, Fe = 56, S = 32). The mass of H₂S that can form is:", "o": ["5.59 g", "12.0 g", "5.60 g", "11.2 g"], "a": 0, "e": "HCl = 12.0/36.5 = 0.3288 mol. FeS = 14.5/88 = 0.1648 mol, which would need 0.3295 mol HCl. HCl is just short, so HCl is limiting. H₂S = 0.3288/2 = 0.1644 mol × 34 = 5.59 g. FeS would suggest 5.60 g, so the two are very close and you must be careful with the sums. ⚠ The book writes the product as FeCl; it is FeCl₂.", "h": "⚠ TRAP: two limiting-reagent answers can differ by only 0.01 g. Compare moles needed vs moles available.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.63 Exercise 2", "q": "In the FeS + 2HCl reaction (12.0 g HCl, 14.5 g FeS), the limiting reagent is:", "o": ["HCl", "FeCl₂", "FeS", "H₂S"], "a": 0, "e": "FeS needs 0.3295 mol HCl but only 0.3288 mol is available.", "h": "Tiny difference, same method.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.63 Exercise 3", "q": "What mass of acetic acid (60 g/mol) is needed to make 150 g of ethyl acetate (88 g/mol) if the percent yield is 80 % and ethanol is in excess?", "o": ["136.4 g", "102.3 g", "81.8 g", "127.8 g"], "a": 3, "e": "At 80 % yield you must aim for a higher theoretical yield: 150 ÷ 0.80 = 187.5 g ester = 2.131 mol. 1 : 1 ratio, so acetic acid = 2.131 × 60 = 127.8 g. If you ignored the yield you would get 102.3 g.", "h": "⚠ TRAP: yield below 100 % means you need MORE reactant, divide by the fraction.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.64 Exercise 4", "q": "15.0 g of isopentyl alcohol (88 g/mol) reacts with 26.9 g of acetic acid (60 g/mol) in a 1 : 1 reaction to give isopentyl acetate (130 g/mol). The theoretical yield of the ester is:", "o": ["52.0 g", "45.0 g", "19.5 g", "22.2 g"], "a": 3, "e": "Alcohol = 15.0/88 = 0.1705 mol. Acid = 26.9/60 = 0.4483 mol. Alcohol is limiting. Ester = 0.1705 × 130 = 22.2 g. The 52.0 g would come from the acid, which is in excess.", "h": "Compare moles, then choose the smaller.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.64 Exercise 4ii", "q": "If the yield of the isopentyl acetate reaction is 80 %, the actual yield is:", "o": ["17.7 g", "22.2 g", "12.5 g", "27.7 g"], "a": 0, "e": "Actual = 0.80 × 22.2 = 17.7 g. ⚠ The book says “actual yield of isopentyl alcohol”, but alcohol is a reactant. It means the ester product.", "h": "Actual = % yield × theoretical.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.64 Exercise 5a", "q": "50.0 g of toluene (C₇H₈, 92 g/mol) and 100.0 g of HNO₃ (63 g/mol) react: C₇H₈ + 3HNO₃ → C₇H₅(NO₂)₃ + 3H₂O. The theoretical yield of TNT (227 g/mol) is:", "o": ["123.4 g", "227 g", "75.8 g", "120.1 g"], "a": 3, "e": "Toluene = 0.5435 mol needs 1.630 mol HNO₃, but only 1.587 mol is present. So HNO₃ is limiting. TNT = 1.587/3 × 227 = 120.1 g. Taking toluene as limiting would give 123.4 g.", "h": "⚠ TRAP: the 3 in front of HNO₃ shifts the limiting reagent.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.64 Exercise 5b", "q": "If 105.0 g of TNT is actually obtained from the above reaction (theoretical 120.1 g), the percent yield is:", "o": ["85.1 %", "114.4 %", "105 %", "87.4 %"], "a": 3, "e": "105.0 ÷ 120.1 × 100 = 87.4 %.", "h": "Use the right theoretical yield.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 7", "q": "CS₂ + 3Cl₂ → CCl₄ + S₂Cl₂. 20.0 g of CS₂ (76 g/mol) and 24.0 g of Cl₂ (71 g/mol) give 12.3 g of CCl₄ (154 g/mol). The percent yield is:", "o": ["46.7 %", "70.9 %", "100 %", "61.5 %"], "a": 1, "e": "CS₂ = 0.263 mol. Cl₂ = 0.338 mol, but 3 mol Cl₂ is needed per CS₂, so Cl₂ is limiting. CCl₄ = 0.338/3 = 0.1127 mol × 154 = 17.35 g. Yield = 12.3/17.35 × 100 = 70.9 %. (The book does not print the balanced equation.)", "h": "Cl₂ is the limiting reagent: the 3 makes it run out.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 8a", "q": "130.0 g of Fe₂O₃ (160 g/mol) reacts with 130.0 g of CO (28 g/mol): Fe₂O₃ + 3CO → 2Fe + 3CO₂. The maximum mass of Fe formed (Fe = 56) is:", "o": ["45.5 g", "91.0 g", "182 g", "121 g"], "a": 1, "e": "Fe₂O₃ = 0.8125 mol, CO = 4.643 mol. Fe₂O₃ needs only 2.4375 mol CO, so Fe₂O₃ is limiting. Fe = 2 × 0.8125 = 1.625 mol × 56 = 91.0 g.", "h": "Limiting reagent first, then product.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 8b", "q": "In the same reaction, the excess reagent and the mass left over are:", "o": ["CO, 61.7 g", "CO, 2.2 g", "Fe₂O₃, 61.7 g", "CO, 130.0 g"], "a": 0, "e": "CO used = 3 × 0.8125 = 2.4375 mol = 68.25 g. Left over = 130.0 − 68.25 = 61.75 g, which is about 61.7 g. The 2.2 g is the number of moles, not the mass.", "h": "⚠ TRAP: a mol answer is not a gram answer. Read the unit asked for.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.64-65 Example 1", "q": "What is the molarity of a solution made by dissolving 13.5 g of NaOH in enough water to make 2500 mL? (Na = 23, O = 16, H = 1)", "o": ["5.4 M", "0.0054 M", "0.135 M", "0.338 M"], "a": 2, "e": "Moles = 13.5 ÷ 40 = 0.3375 mol. Volume = 2.5 L. M = 0.3375 ÷ 2.5 = 0.135 M. Forgetting to convert mL to L gives 0.000135 and not dividing by 40 gives 5.4.", "h": "⚠ TRAP: convert mL to litres first. 2500 mL = 2.5 L.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.65 Example 2a", "q": "The concentrations of the ions in 0.50 M K₂SO₄ are:", "o": ["0.50 M K⁺ and 1.0 M SO₄²⁻", "0.50 M K⁺ and 0.50 M SO₄²⁻", "1.0 M K⁺ and 0.50 M SO₄²⁻", "1.5 M K⁺ and 0.50 M SO₄²⁻"], "a": 2, "e": "K₂SO₄ → 2K⁺ + SO₄²⁻. Two K⁺ per formula unit gives 2 × 0.50 = 1.0 M. The sulphate is 0.50 M. ⚠ The book prints the sulphate ion without its charge.", "h": "Subscript in front of an ion multiplies its concentration.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.65 Example 2b", "q": "The concentration of Cl⁻ in 2.0 M HCl is:", "o": ["4.0 M", "2.0 M", "1.0 M", "0.5 M"], "a": 1, "e": "HCl is a strong acid that dissociates completely into H⁺ and Cl⁻ in a 1 : 1 ratio, so 2.0 M each.", "h": "1 : 1 salt gives equal ion concentrations.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.66 Example 3", "q": "How many moles of Na⁺ are in 15 cm³ of 0.8 M NaCl?", "o": ["0.8 mol", "12 mol", "0.012 mol", "0.024 mol"], "a": 2, "e": "15/1000 × 0.8 = 0.012 mol NaCl, giving 0.012 mol Na⁺ and 0.012 mol Cl⁻.", "h": "Moles = M × V (in litres).", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.66 Example 4", "q": "What mass of HNO₃ (63 g/mol) is in 300 mL of 0.30 M HNO₃?", "o": ["5.67 g", "0.09 g", "2.1 g", "18.9 g"], "a": 0, "e": "0.30 × 0.300 = 0.09 mol × 63 = 5.67 g.", "h": "mass = M × V(L) × molar mass.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.67 Percent Example 1", "q": "What is the percentage by mass (m/m) of NaCl in a solution of 1.5 g NaCl in 45 g water?", "o": ["1.5 %", "3.23 %", "30 %", "3.33 %"], "a": 1, "e": "Mass of solution = 1.5 + 45 = 46.5 g. 1.5/46.5 × 100 = 3.23 %. Dividing by the water only (3.33 %) is the usual slip.", "h": "⚠ TRAP: the denominator is the whole solution, not the solvent.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.67 Percent Example 2", "q": "What is the mass percent of ethanol in a solution of 2.0 g ethanol in 110.0 g water?", "o": ["2.0 %", "55 %", "1.786 %", "1.818 %"], "a": 2, "e": "2.0 ÷ 112.0 × 100 = 1.786 %.", "h": "Add solute and solvent first.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.68 Example 1", "q": "25.0 g of I₂ (254 g/mol) is dissolved in 200 g of CCl₄. The molality is:", "o": ["0.39 m", "0.49 m", "0.098 m", "2.45 m"], "a": 1, "e": "25/254 = 0.0984 mol. 200 g = 0.200 kg. m = 0.0984 ÷ 0.200 = 0.49 mol/kg.", "h": "Molality = moles per kg of SOLVENT.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.68-69 Example 2", "q": "A 1.65 M H₂SO₄ solution (98 g/mol) has a density of 1.29 g/mL. Its molality is:", "o": ["0.83 m", "1.28 m", "1.46 m", "1.65 m"], "a": 2, "e": "1000 mL weighs 1290 g. H₂SO₄ = 1.65 × 98 = 161.7 g. Water = 1290 − 161.7 = 1128.3 g = 1.1283 kg. m = 1.65 ÷ 1.1283 = 1.46. ⚠ The book mislabels the density unit as g/mol and the final unit as M; it should be g/mL and m.", "h": "Mass of solvent = mass of solution − mass of solute.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.69 Example", "q": "What is the mole fraction of glucose (180 g/mol) in a 30 % (m/m) aqueous glucose solution? (H₂O = 18 g/mol)", "o": ["0.04", "0.17", "0.96", "0.30"], "a": 0, "e": "100 g solution has 30 g glucose (0.167 mol) and 70 g water (3.89 mol). x = 0.167 ÷ (0.167 + 3.89) = 0.041. The 0.96 is the mole fraction of water.", "h": "Mole fractions of all components add up to 1.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.70 Example", "q": "How do you prepare 500 mL of 2.0 M acetic acid from a 16.0 M stock?", "o": ["Add 62.5 mL of stock to 500 mL of water", "Pipette 62.5 mL of stock into a 500 mL flask and make up to the mark with water", "Pipette 250 mL of stock into 500 mL flask and make up to the mark", "Add 437.5 mL of stock to 62.5 mL of water"], "a": 1, "e": "M₁V₁ = M₂V₂, so V₁ = 2.0 × 500 ÷ 16.0 = 62.5 mL. The final volume must be 500 mL, so you dilute up to the mark in a volumetric flask. ⚠ Adding 62.5 mL to 500 mL of water makes 562.5 mL and the concentration would be wrong.", "h": "⚠ TRAP: “make up to the mark” means the FINAL volume is 500 mL.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.70 Exercise 1", "q": "What volume of 5.0 M HCl is needed to prepare 0.70 L of 0.10 M HCl?", "o": ["0.14 mL", "35 mL", "7.0 mL", "14 mL"], "a": 3, "e": "V₁ = M₂V₂ ÷ M₁ = 0.10 × 700 ÷ 5.0 = 14 mL.", "h": "Use the same unit for V₁ and V₂.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.70 Exercise 3", "q": "What mass of water must be added to 425 g of formaldehyde to prepare a 50 % (w/w) solution?", "o": ["850 g", "425 g", "212.5 g", "50 g"], "a": 1, "e": "For 50 % w/w, solute mass = solvent mass, so 425 g of water is needed. Total solution is 850 g.", "h": "50 % w/w means solute = solvent in mass.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 9a", "q": "A 26.0 % (m/m) KI solution has a density of 1.30 g/mL. How many grams of KI are in 70.0 mL of it?", "o": ["26.0 g", "23.7 g", "91.0 g", "18.2 g"], "a": 1, "e": "70.0 mL × 1.30 = 91.0 g solution. KI = 0.260 × 91.0 = 23.7 g. Forgetting the density gives 18.2 g.", "h": "Volume × density first to get mass of solution.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 9b", "q": "How many grams of the same KI solution (26.0 % m/m) contain 25.0 g of KI?", "o": ["6.5 g", "96.2 g", "25.0 g", "125 g"], "a": 1, "e": "25.0 ÷ 0.260 = 96.2 g of solution.", "h": "Divide solute mass by the fraction.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 9c", "q": "How many mL of the same KI solution (26.0 % m/m, density 1.30 g/mL) contain 20.0 g of KI?", "o": ["5.2 mL", "20.0 mL", "76.9 mL", "59.2 mL"], "a": 3, "e": "20.0 ÷ 0.260 = 76.92 g solution. ÷ 1.30 g/mL = 59.2 mL. The 76.9 is the mass, not the volume. ⚠ The book writes KL by mistake for KI.", "h": "⚠ TRAP: final step is mass ÷ density to get volume.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 10", "q": "What is the % (m/m) of HNO₃ (63 g/mol) in a 3.0 molal solution?", "o": ["31.5 %", "3.0 %", "18.9 %", "15.9 %"], "a": 3, "e": "3.0 m means 3.0 mol (189 g) in 1000 g water. Total mass = 1189 g. 189/1189 × 100 = 15.9 %. The 18.9 comes from dividing by the water only.", "h": "Add the solute to the solvent for the total mass.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.72 Exercise 11i", "q": "How many moles of CaCl₂ are in 13.05 mL of 3.00 M CaCl₂?", "o": ["0.0392 mol", "0.00435 mol", "39.2 mol", "0.235 mol"], "a": 0, "e": "13.05 mL = 0.01305 L. 0.01305 × 3.00 = 0.03915 mol. Not converting mL to L gives 39.2.", "h": "Moles = M × V in litres.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.72 Exercise 11ii", "q": "How many moles of (NH₄)₂SO₄ are in 1,200 mL of 0.25 M solution?", "o": ["0.30 mol", "300 mol", "0.21 mol", "4.8 mol"], "a": 0, "e": "1.200 L × 0.25 M = 0.30 mol.", "h": "1200 mL is 1.2 L.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.72 Exercise 11iii", "q": "How many moles of HCl are in 180 mL of 0.21 M HCl?", "o": ["0.038 mol", "38 mol", "0.0038 mol", "0.86 mol"], "a": 0, "e": "0.180 × 0.21 = 0.0378 mol, about 0.038 mol.", "h": "Always change mL to L first.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.72 Exercise 12a", "q": "Concentrated HCl is 37.0 % (m/m) with density 1.19 g/mL (HCl = 36.5 g/mol). Its molarity is:", "o": ["37.0 M", "10.1 M", "16.1 M", "12.1 M"], "a": 3, "e": "1 L weighs 1190 g. HCl = 0.370 × 1190 = 440.3 g = 12.06 mol. So 12.1 M.", "h": "Molarity = (% × density × 10) ÷ molar mass.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.72 Exercise 12b", "q": "For the same concentrated HCl (37.0 % m/m, 1.19 g/mL), the molality is:", "o": ["12.1 m", "1.01 m", "16.1 m", "10.1 m"], "a": 2, "e": "Take 100 g: 37.0 g HCl = 1.014 mol, water = 63.0 g = 0.0630 kg. m = 1.014 ÷ 0.0630 = 16.1 mol/kg. Molality is bigger than molarity here because the solvent mass is smaller than the solution volume in kg terms.", "h": "Use 100 g of solution as the basis.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.72 Exercise 12c", "q": "For the same HCl (37.0 % m/m), the mole fraction of HCl is:", "o": ["0.0630", "0.775", "0.370", "0.225"], "a": 3, "e": "100 g solution: HCl = 1.014 mol; water = 63.0/18 = 3.50 mol. x = 1.014 ÷ 4.514 = 0.225.", "h": "Do not use mass fraction in place of mole fraction.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch7 p.80 Example 1a", "q": "Calculate the pH of a solution that is 0.030 M in H⁺.", "o": ["0.030", "12.5", "2.5", "1.5"], "a": 3, "e": "pH = −log[H⁺] = −log(0.030) = 1.52, which is 1.5 to two figures. A value like 12.5 is the pOH-side mistake: this is an acid, so pH must be below 7.", "h": "Strong acid, small number, pH between 1 and 2.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "example", "s": "Ch7 p.80 Example 1b", "q": "Calculate the pH of a solution that is 2.0 × 10⁻² M in OH⁻.", "o": ["1.7", "2.0", "12.3", "13.7"], "a": 2, "e": "pOH = −log(2.0 × 10⁻²) = 1.70. pH = 14 − 1.70 = 12.3. Stopping at 1.7 gives the pOH, not the pH.", "h": "⚠ TRAP: given [OH⁻], you get pOH first, then subtract from 14.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "example", "s": "Ch7 p.80 Example 1c", "q": "If the pH of an aqueous system is 8.5, the [H⁺] is:", "o": ["1.18 × 10⁻⁹ M", "3.16 × 10⁻⁶ M", "8.5 × 10⁻¹⁴ M", "3.16 × 10⁻⁹ M"], "a": 3, "e": "[H⁺] = 10^(−pH) = 10^(−8.5) = 3.16 × 10⁻⁹ M. The negative sign belongs in the exponent. The book writes it as “log⁻¹(−8.5)”, which means the same thing.", "h": "[H⁺] = 10 to the power of minus pH.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "example", "s": "Ch7 p.82 Example 1", "q": "What is the pH of a buffer containing 1.0 M CH₃COOH and 1.0 M CH₃COONa (Ka = 1.8 × 10⁻⁵)?", "o": ["4.74", "7.00", "5.74", "3.74"], "a": 0, "e": "pKa = −log(1.8 × 10⁻⁵) = 4.74. With equal salt and acid, log(1.0/1.0) = 0, so pH = pKa = 4.74.", "h": "Equal amounts of acid and salt: pH = pKa.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "example", "s": "Ch7 p.82-83 Example 2", "q": "0.10 mol of HCl gas is added to 1 L of the buffer above (1.0 M CH₃COOH, 1.0 M CH₃COO⁻, no volume change). The new pH is:", "o": ["1.00", "5.74", "4.74", "4.66"], "a": 3, "e": "HCl is a strong acid. The 0.10 mol H⁺ turns 0.10 mol acetate into acetic acid. Acid = 1.1 M, salt = 0.9 M. pH = 4.74 + log(0.9/1.1) = 4.74 − 0.09 = 4.66. The pH barely moves, which is what a buffer is for. ⚠ The book prints Ka as 1.08 × 10⁻⁵ in this line, a typo for 1.8 × 10⁻⁵.", "h": "Added acid: acid goes UP, salt goes DOWN.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "example", "s": "Ch7 p.83 Example", "q": "The buffer range of the HCO₃⁻/H₂CO₃ system (pKa = 6.38) is:", "o": ["6.00 to 7.00", "4.38 to 8.38", "5.38 to 7.38", "6.38 to 7.38"], "a": 2, "e": "Buffer range = pKa ± 1.00, so 6.38 − 1 = 5.38 and 6.38 + 1 = 7.38.", "h": "Range = pKa ± 1.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "example", "s": "Ch7 p.85 Example 1", "q": "The molar solubility of Ag₂SO₄ is 1.5 × 10⁻² mol/L. Its solubility product is:", "o": ["3.4 × 10⁻⁶", "1.4 × 10⁻⁵", "6.8 × 10⁻⁷", "4.5 × 10⁻⁵"], "a": 1, "e": "Ag₂SO₄ ⇌ 2Ag⁺ + SO₄²⁻. [Ag⁺] = 2 × 1.5 × 10⁻² = 3.0 × 10⁻², [SO₄²⁻] = 1.5 × 10⁻². Ksp = [Ag⁺]²[SO₄²⁻] = (3.0 × 10⁻²)² (1.5 × 10⁻²) = 1.35 × 10⁻⁵, which the book rounds to 1.4 × 10⁻⁵.", "h": "⚠ TRAP: Ag⁺ is twice the solubility AND squared in Ksp.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "example", "s": "Ch7 p.87 Example", "q": "200 cm³ of 0.0040 M BaCl₂ is added to 600 cm³ of 0.0080 M K₂SO₄. What is the ion product [Ba²⁺][SO₄²⁻] in the mixture, and does BaSO₄ (Ksp = 1.1 × 10⁻¹⁰) precipitate?", "o": ["2.4 × 10⁻⁸; yes, it precipitates", "6.0 × 10⁻⁶; yes, it precipitates", "6.0 × 10⁻⁶; no, it stays dissolved", "1.1 × 10⁻¹⁰; it is exactly saturated"], "a": 1, "e": "Total volume = 800 cm³. [Ba²⁺] = 8.0 × 10⁻⁴ mol ÷ 0.800 L = 1.0 × 10⁻³ M. [SO₄²⁻] = 4.8 × 10⁻³ mol ÷ 0.800 L = 6.0 × 10⁻³ M. Q = 6.0 × 10⁻⁶, far above Ksp, so BaSO₄ precipitates.", "h": "Dilute first (use the total volume), then compare Q with Ksp.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.79 Ex 1b", "q": "Using the Lewis definition, the reaction Na₂O + SO₃ → Na₂SO₄ is a neutralisation because:", "o": ["Na⁺ donates a proton to SO₃", "O²⁻ from Na₂O donates an electron pair to SO₃", "Na₂O gives H⁺ to SO₃", "SO₃ donates an electron pair to Na₂O"], "a": 1, "e": "O²⁻ (from Na₂O) is the Lewis base, it donates a lone pair. SO₃ is the Lewis acid, it accepts the pair and forms SO₄²⁻. No proton is involved.", "h": "Lewis: acid accepts a pair, base donates a pair.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.79 Ex 2a", "q": "Can ammonia act as a proton donor (acid) in water?", "o": ["Yes, but only very weakly, giving NH₂⁻", "Yes, it gives NH₄⁺ when it donates", "Yes, it is a strong acid in water", "No, it cannot ever donate a proton"], "a": 0, "e": "NH₃ + H₂O ⇌ NH₂⁻ + H₃O⁺ is possible in principle, but NH₂⁻ is a very strong base, so this barely happens. In water ammonia behaves as a base (NH₃ + H₂O ⇌ NH₄⁺ + OH⁻).", "h": "Amphoteric in theory, base in practice.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.79 Ex 2b", "q": "Comparing NH₂⁻ (conjugate base of NH₃) with OH⁻:", "o": ["OH⁻ is the stronger base", "NH₂⁻ is the stronger base", "They are equally strong", "NH₂⁻ is an acid"], "a": 1, "e": "NH₃ is a much weaker acid than H₂O, so its conjugate base NH₂⁻ is stronger than OH⁻. The weaker the acid, the stronger its conjugate base.", "h": "Weak acid → strong conjugate base.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.79 Ex 3", "q": "The conjugate bases of HCN and OH⁻ are respectively:", "o": ["CN⁻ and O²⁻", "CN⁻ and H₂O", "H₂CN⁺ and O²⁻", "CN⁻ and H₃O⁺"], "a": 0, "e": "A conjugate base is the acid minus H⁺. HCN loses H⁺ to give CN⁻, OH⁻ loses H⁺ to give O²⁻.", "h": "Remove one H⁺ from the acid.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.79 Ex 4", "q": "The conjugate acids of C₅H₅N (pyridine), CO₃²⁻ and Br⁻ are respectively:", "o": ["C₅H₅NH⁺, HCO₃⁻ and HBr", "C₅H₄N⁻, HCO₃⁻ and Br₂", "C₅H₅N, H₂CO₃ and HBr", "C₅H₅NH⁺, H₂CO₃ and HBr"], "a": 0, "e": "A conjugate acid is the base plus H⁺. Add one proton only: CO₃²⁻ becomes HCO₃⁻, not H₂CO₃.", "h": "Add exactly one H⁺.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.79 Ex 5", "q": "In N₂H₄ + NH₄⁺ ⇌ N₂H₅⁺ + NH₃, the conjugate acid–base pairs are:", "o": ["NH₄⁺/NH₃ and N₂H₅⁺/N₂H₄", "NH₄⁺/N₂H₅⁺ and NH₃/N₂H₄", "N₂H₄/NH₄⁺ and NH₃/N₂H₅⁺", "NH₄⁺/N₂H₄ and NH₃/N₂H₅⁺"], "a": 0, "e": "A pair differs by one proton. NH₄⁺ loses a proton to give NH₃. N₂H₄ gains a proton to give N₂H₅⁺.", "h": "Each pair differs by just one H⁺.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.79 Ex 6", "q": "In Ag⁺ + 2NH₃ ⇌ Ag(NH₃)₂⁺, the Lewis acid and Lewis base are:", "o": ["Ag(NH₃)₂⁺ is the base", "NH₃ is the acid, Ag⁺ is the base", "Ag⁺ is the acid, NH₃ is the base", "Both are Lewis acids"], "a": 2, "e": "NH₃ has a lone pair to donate (base). Ag⁺ has empty orbitals to accept the pairs (acid).", "h": "Cations are usually Lewis acids; lone-pair species are bases.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.79 Ex 6", "q": "In FeCl₃ + Cl⁻ ⇌ FeCl₄⁻, the Lewis acid is:", "o": ["FeCl₄⁻", "Both FeCl₃ and Cl⁻", "Cl⁻", "FeCl₃"], "a": 3, "e": "Cl⁻ donates a lone pair, so it is the base. FeCl₃ accepts it, so FeCl₃ is the acid.", "h": "Pair donor = base.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.79 Ex 6", "q": "In (CH₃)₂O + BF₃ ⇌ (CH₃)₂OBF₃, the Lewis base is:", "o": ["BF₃", "(CH₃)₂O", "Neither", "The product"], "a": 1, "e": "The oxygen of the ether has lone pairs to donate. BF₃ has an empty p orbital on boron and accepts the pair, so BF₃ is the acid.", "h": "BF₃ is the classic Lewis acid.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.79 Ex 7", "q": "The main advantage of the Lewis concept over the Brønsted–Lowry concept is that:", "o": ["it only applies to aqueous solutions", "it needs a proton to be present", "it defines acids as OH⁻ producers", "it covers reactions with no proton transfer"], "a": 3, "e": "Lewis acids and bases are defined by electron-pair transfer, so substances like BF₃ and Ag⁺ count as acids even with no H⁺ present. The book says electrons are involved in all chemical reactions.", "h": "Lewis = most general.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.83 Ex 1", "q": "A buffer is prepared with 8.3 g of acetic acid (60 g/mol) and 16.0 g of sodium acetate (82 g/mol). Ka = 1.8 × 10⁻⁵. Its pH (the tiny 0.07 mL of 1.0 M HCl changes nothing) is about:", "o": ["4.74", "4.59", "4.89", "5.30"], "a": 2, "e": "Acid = 8.3/60 = 0.138 mol. Salt = 16.0/82 = 0.195 mol. pH = 4.74 + log(0.195/0.138) = 4.74 + 0.15 = 4.89. The HCl is only 7 × 10⁻⁵ mol, which is negligible.", "h": "Moles can be used directly in the ratio if the volume is the same.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.83 Ex 2", "q": "How many moles of sodium acetate must be added to 1.0 L of 0.2 M CH₃COOH to make a buffer of pH 6? (Ka = 1.8 × 10⁻⁵)", "o": ["0.36 mol", "1.8 mol", "3.6 mol", "0.011 mol"], "a": 2, "e": "6 = 4.74 + log(salt/0.2). log(salt/0.2) = 1.26, so salt/0.2 = 18 and salt = 3.6 mol. (Equivalent: ratio = Ka/[H⁺] = 1.8 × 10⁻⁵ / 10⁻⁶ = 18.)", "h": "Rearrange Henderson for the ratio, then multiply by the acid.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.83 Ex 3", "q": "What is the buffer range of the CO₃²⁻/HCO₃⁻ system (pKa = 10.32)?", "o": ["8.32 to 12.32", "9.00 to 11.00", "10.32 to 11.32", "9.32 to 11.32"], "a": 3, "e": "pKa ± 1 = 10.32 ± 1.00.", "h": "Range = pKa ± 1.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.83 Ex 4", "q": "To make a phosphate buffer of pH about 7.40 you should mix:", "o": ["H₃PO₄ with H₂PO₄⁻, mixed in equal amounts", "H₃PO₄ with PO₄³⁻, 10 times more PO₄³⁻", "H₂PO₄⁻ with HPO₄²⁻, about 1.5 times more HPO₄²⁻", "HPO₄²⁻ with PO₄³⁻, mixed in equal amounts"], "a": 2, "e": "Choose the pair whose pKa is closest to 7.40: H₂PO₄⁻/HPO₄²⁻ (pKa₂ ≈ 7.21). pH = pKa + log(base/acid), so 7.40 = 7.21 + log(ratio), ratio = 10^0.19 = 1.55. So HPO₄²⁻ : H₂PO₄⁻ ≈ 1.5 : 1.", "h": "Pick the buffer pair with pKa near the target pH.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.87 Ex 1", "q": "The solubility of CaSO₄ is 0.67 g/L (CaSO₄ = 136.2 g/mol). Its Ksp is about:", "o": ["4.9 × 10⁻³", "2.4 × 10⁻⁵", "1.2 × 10⁻⁵", "4.5 × 10⁻¹"], "a": 1, "e": "Molar solubility = 0.67/136.2 = 4.92 × 10⁻³ mol/L. CaSO₄ ⇌ Ca²⁺ + SO₄²⁻, so Ksp = s² = (4.92 × 10⁻³)² = 2.4 × 10⁻⁵. The 4.9 × 10⁻³ is the molar solubility, not Ksp.", "h": "g/L → mol/L → Ksp.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.87 Ex 2", "q": "The Ksp of CuI is 5.1 × 10⁻¹². Its molar solubility is:", "o": ["5.1 × 10⁻¹² M", "1.0 × 10⁻¹² M", "2.6 × 10⁻⁶ M", "2.3 × 10⁻⁶ M"], "a": 3, "e": "CuI ⇌ Cu⁺ + I⁻, so Ksp = s². s = √(5.1 × 10⁻¹²) = 2.26 × 10⁻⁶ M.", "h": "1 : 1 salt: s = √Ksp.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch7 p.87 Ex 3", "q": "Ksp of calcium phosphate, Ca₃(PO₄)₂ (310.2 g/mol), is 1.2 × 10⁻²⁶. Its solubility in g/L is about:", "o": ["2.57 × 10⁻⁶ g/L", "7.96 × 10⁻⁴ g/L", "5.4 × 10⁻⁴ g/L", "1.2 × 10⁻²⁶ g/L"], "a": 1, "e": "Ca₃(PO₄)₂ ⇌ 3Ca²⁺ + 2PO₄³⁻. [Ca²⁺] = 3s, [PO₄³⁻] = 2s, so Ksp = (3s)³(2s)² = 108s⁵. s = (1.2 × 10⁻²⁶/108)^(1/5) = 2.57 × 10⁻⁶ mol/L. × 310.2 = 7.96 × 10⁻⁴ g/L. ⚠ The book says “calcium sulphate” in this question; it clearly means calcium phosphate.", "h": "Ksp = 108 s⁵ for an A₃B₂ salt.", "t": "Acids, Bases and Salts", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch9 p.98 Question 1.1", "q": "The equilibrium constant expression for 2NO₂ ⇌ N₂O₄ is Kc =", "o": ["[NO₂]² / [N₂O₄], with units mol/L", "[N₂O₄] / [NO₂]², with units L/mol", "[N₂O₄] / [NO₂], with no units", "[N₂O₄] × [NO₂]², with units mol³/L³"], "a": 1, "e": "Products over reactants, each raised to its coefficient. Units: (mol/L) ÷ (mol/L)² = L/mol.", "h": "Products on top. Coefficient becomes the power.", "t": "Chemical Equilibrium and Thermodynamics", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch9 p.98 Question 1.2", "q": "The equilibrium constant expression for N₂ + 3H₂ ⇌ 2NH₃ is Kc =", "o": ["[NH₃]² / ([N₂][H₂]), with units L/mol", "[NH₃] / ([N₂][H₂]), with no units", "[N₂][H₂]³ / [NH₃]², with units mol²/L²", "[NH₃]² / ([N₂][H₂]³), with units L²/mol²"], "a": 3, "e": "Units: (mol/L)² ÷ [(mol/L)(mol/L)³] = (mol/L)² ÷ (mol/L)⁴ = L²/mol².", "h": "⚠ TRAP: the 3 on H₂ becomes a cube, not a multiplier.", "t": "Chemical Equilibrium and Thermodynamics", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch9 p.98 Question 1.3", "q": "For the esterification CH₃CH₂CO₂H + CH₃CH₂OH ⇌ CH₃CH₂CO₂CH₂CH₃ + H₂O (all liquids mixed together), Kc has:", "o": ["units of L/mol, from one extra reactant", "no units, because the moles and litres cancel", "units of mol/L, from one extra product", "units of mol²/L², from two products"], "a": 1, "e": "Kc = [ester][H₂O] / ([acid][alcohol]). There are two concentration terms above and two below, so the units cancel. The species are dissolved in one mixture, so they all appear in the expression.", "h": "Equal number of moles on each side = no units.", "t": "Chemical Equilibrium and Thermodynamics", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch9 p.98", "q": "For PCl₅ ⇌ PCl₃ + Cl₂ the units of Kc are:", "o": ["mol/L", "no units", "mol²/L²", "L/mol"], "a": 0, "e": "Kc = [PCl₃][Cl₂]/[PCl₅]. (mol/L)² ÷ (mol/L) = mol/L, as the book shows.", "h": "One more mole on the product side gives mol/L.", "t": "Chemical Equilibrium and Thermodynamics", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch9 p.104 Question 2", "q": "A system absorbs 600 kJ of heat and 450 kJ of work is done ON it. The change in internal energy (ΔE = q + w) is:", "o": ["−150 kJ", "+150 kJ", "−1050 kJ", "+1050 kJ"], "a": 3, "e": "Both heat in and work done on the system add energy: ΔE = 600 + 450 = +1050 kJ. If the 450 kJ were work done BY the system, w = −450 and ΔE = +150 kJ. ⚠ The book prints “600 Kg of heat”, but heat is in kJ, not kg.", "h": "Energy entering the system is positive.", "t": "Chemical Equilibrium and Thermodynamics", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch9 p.104 Question 2", "q": "If instead the system absorbs 600 kJ of heat and does 450 kJ of work on its surroundings, ΔE is:", "o": ["−1050 kJ", "−150 kJ", "+1050 kJ", "+150 kJ"], "a": 3, "e": "Work done BY the system has w = −450 kJ. ΔE = 600 + (−450) = +150 kJ.", "h": "By the system = negative work.", "t": "Chemical Equilibrium and Thermodynamics", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch9 p.106 Question 3", "q": "C(s) + H₂O(l) → CO(g) + H₂(g) at 27 °C has ΔH = 4500 J and ΔS = 12 J/K. The free energy change ΔG is:", "o": ["+4176 J", "+8100 J", "−900 J", "+900 J"], "a": 3, "e": "T = 27 + 273 = 300 K. ΔG = ΔH − TΔS = 4500 − (300 × 12) = 4500 − 3600 = +900 J. Positive, so the reaction is not spontaneous at 27 °C. ⚠ Using 27 instead of 300 gives 4176 J.", "h": "⚠ TRAP: convert °C to kelvin before TΔS.", "t": "Chemical Equilibrium and Thermodynamics", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch9 p.106 Question 3", "q": "At what temperature does the reaction above (ΔH = 4500 J, ΔS = 12 J/K) become spontaneous?", "o": ["Below 375 K", "At every temperature", "Above 27 K", "Above 375 K"], "a": 3, "e": "ΔG = 0 when T = ΔH/ΔS = 4500/12 = 375 K. Above that, TΔS is larger than ΔH and ΔG turns negative.", "h": "Positive ΔH and positive ΔS: spontaneous when hot.", "t": "Chemical Equilibrium and Thermodynamics", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch10 p.117 Question 1i", "q": "For A → P the rate is 0.050, 0.100 and 0.200 M/hr when [A] is 0.170, 0.340 and 0.680 M. The order of reaction is:", "o": ["zero order", "third order", "first order", "second order"], "a": 2, "e": "Doubling [A] doubles the rate (0.050 → 0.100 → 0.200), so rate ∝ [A]¹. If it were second order, doubling [A] would quadruple the rate. ⚠ The book writes the rate unit as “m/hr”, which should be M/hr.", "h": "Double the concentration: rate ×2 = first order; ×4 = second order; ×1 = zero order.", "t": "Introductory Chemical Kinetics and Nuclear Chemistry", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch10 p.117 Question 1ii", "q": "For the same data (rate 0.050 M/hr at [A] = 0.170 M, first order), the rate constant is:", "o": ["0.0085 hr⁻¹", "0.294 hr⁻¹", "0.294 M/hr", "3.40 hr⁻¹"], "a": 1, "e": "rate = k[A], so k = 0.050 ÷ 0.170 = 0.294. For a first-order reaction the unit of k is hr⁻¹ (time⁻¹), not M/hr. Inverting the ratio gives 3.40.", "h": "First order: k has units of 1/time.", "t": "Introductory Chemical Kinetics and Nuclear Chemistry", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch10 p.121 Question 2", "q": "In ²⁵⁴₉₈Cf → ᵃ_bPd + ¹³²₅₂Te + 4¹₀n the palladium isotope is:", "o": ["¹¹⁸₅₂Pd", "¹¹⁸₄₆Pd", "¹²²₄₆Pd", "¹¹⁴₄₆Pd"], "a": 1, "e": "Mass: 254 = a + 132 + 4(1), so a = 118. Charge: 98 = b + 52 + 0, so b = 46. The neutrons have Z = 0.", "h": "Conserve mass number and atomic number separately.", "t": "Introductory Chemical Kinetics and Nuclear Chemistry", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch10 p.121 Question 2", "q": "In ²³⁸U → ²³⁴Th + ⁴₂α, followed by ²³⁴Th → ²³⁴Th + ᶜ_dγ, the gamma ray has:", "o": ["c = 1 and d = 0", "c = 0 and d = 1", "c = 4 and d = 2", "c = 0 and d = 0"], "a": 3, "e": "A gamma ray carries no mass and no charge, so it does not change the nuclide: ²³⁴Th* → ²³⁴Th + ⁰₀γ.", "h": "Gamma: A = 0, Z = 0.", "t": "Introductory Chemical Kinetics and Nuclear Chemistry", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch10 p.122 Question 3", "q": "The half-life of a radioactive sample is 60 days. The fraction of the original nuclei left after 120 days is:", "o": ["1/8", "1/3", "1/4", "1/2"], "a": 2, "e": "120 days = 2 half-lives. (1/2)² = 1/4.", "h": "n half-lives → (½)ⁿ.", "t": "Introductory Chemical Kinetics and Nuclear Chemistry", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch10 p.124 Question 4a", "q": "The alpha emission of americium-243 is written:", "o": ["²⁴³₉₅Am → ²³⁹₉₃Np + ⁴₂He", "²⁴³₉₅Am → ²⁴⁷₉₇Bk + ⁴₂He", "²⁴³₉₅Am → ²³⁹₉₃Pu + ⁴₂He", "²⁴³₉₅Am → ²⁴³₉₆Cm + ⁰₋₁e"], "a": 0, "e": "Alpha emission lowers A by 4 and Z by 2: 243 − 4 = 239, 95 − 2 = 93. Element 93 is neptunium (Np).", "h": "Alpha: A − 4, Z − 2.", "t": "Introductory Chemical Kinetics and Nuclear Chemistry", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch10 p.124 Question 4b", "q": "Iron-59 has a half-life of 45 days. The fraction left after 90 days is:", "o": ["1/8", "1/4", "1/90", "1/2"], "a": 1, "e": "90 days = 2 half-lives, so (½)² = ¼, or 25 %.", "h": "Divide time by half-life first.", "t": "Introductory Chemical Kinetics and Nuclear Chemistry", "d": 1}, {"ch": 12, "k": "example", "s": "Ch10 p.120-121 Example", "q": "In ²³⁵₉₂U + ¹₀n → ⁹⁰₃₈Sr + ?? + 3¹₀n the missing nuclide is:", "o": ["¹⁴³₅₄Xe", "¹⁴⁴₅₄Xe", "¹⁴⁶₅₄Xe", "¹⁴³₅₂Xe"], "a": 0, "e": "Left: A = 235 + 1 = 236 and Z = 92. Right (known): A = 90 + 3 = 93, Z = 38. Missing: A = 236 − 93 = 143, Z = 92 − 38 = 54. That is xenon-143.", "h": "Subtract the known side from the total.", "t": "Introductory Chemical Kinetics and Nuclear Chemistry", "d": 1}, {"ch": 12, "k": "example", "s": "Ch10 p.112 Example", "q": "Bismuth-210 (t½ = 5 days) decays by alpha emission to thallium-206. Starting with 100 g of Bi-210, the masses of Bi-210 and Tl-206 after 10 days are:", "o": ["25 g and 75 g", "0 g and 100 g", "12.5 g and 87.5 g", "50 g and 50 g"], "a": 0, "e": "10 days = 2 half-lives: Bi = 100 × ¼ = 25 g. The rest, 75 g, has become Tl (the book rounds the 206/210 mass loss away).", "h": "Half of what is left decays every half-life.", "t": "Introductory Chemical Kinetics and Nuclear Chemistry", "d": 1}, {"ch": 12, "k": "example", "s": "Ch11 p.125-126 Example 1", "q": "95.0 g of glycerin (C₃H₈O₃, 92.1 g/mol) is dissolved in 190.0 g of ethanol (C₂H₅OH, 46.0 g/mol) at 40 °C. Pure ethanol has P° = 135.3 torr and glycerin is non-volatile. The mole fraction of ethanol is:", "o": ["0.20", "0.50", "0.80", "0.67"], "a": 2, "e": "Glycerin = 95.0/92.1 = 1.03 mol. Ethanol = 190/46.0 = 4.13 mol. x(ethanol) = 4.13 / (4.13 + 1.03) = 0.80. The 0.20 is the mole fraction of glycerin.", "h": "Mole fractions come from MOLES, not grams.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "example", "s": "Ch11 p.126 Example 1", "q": "For the same glycerin–ethanol solution, the vapour pressure of the solution at 40 °C is:", "o": ["108.2 torr", "135.3 torr", "169.1 torr", "27.1 torr"], "a": 0, "e": "P(soln) = x(solvent) × P° = 0.80 × 135.3 = 108.2 torr. The 27.1 torr is the drop in vapour pressure, not the vapour pressure itself.", "h": "⚠ TRAP: Raoult’s law uses the SOLVENT mole fraction for the solution’s vapour pressure.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "example", "s": "Ch11 p.126 Example 1", "q": "For the same solution, the lowering of vapour pressure, ΔP, is:", "o": ["4.13 torr", "108.24 torr", "135.3 torr", "27.06 torr"], "a": 3, "e": "ΔP = x(solute) × P° = 0.20 × 135.3 = 27.06 torr. Or ΔP = 135.3 − 108.24 = 27.06 torr. ⚠ The book’s note writes “135.5 torr” once; the pure-solvent value is 135.3 torr.", "h": "ΔP uses the SOLUTE mole fraction.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "example", "s": "Ch11 p.127-128 Example 2", "q": "Freezing point of a solution of 25.0 g sucrose (342.3 g/mol) in 100.0 g water (Kf = 1.86 °C/m, normal freezing point 0 °C) is:", "o": ["+1.36 °C", "−13.6 °C", "−0.73 °C", "−1.36 °C"], "a": 3, "e": "n = 25.0/342.3 = 0.073 mol. m = 0.073 / 0.1000 kg = 0.73 m. ΔTf = 1.86 × 0.73 = 1.36 °C. So the solution freezes at 0 − 1.36 = −1.36 °C. ⚠ The book writes the Kf units as “°C cm⁻¹”; it should be °C·kg/mol (°C/m).", "h": "Molality uses kg of solvent; then subtract the depression from the normal freezing point.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "example", "s": "Ch11 p.129-130 Example", "q": "1.0 g of glycerine (92.1 g/mol) is dissolved in 47.9 g of water (Kb = 0.512 °C/m). The boiling point elevation is:", "o": ["0.012 °C", "0.12 °C", "0.51 °C", "1.2 °C"], "a": 1, "e": "n = 1.0/92.1 = 0.0109 mol (the book rounds to 0.011). m = 0.0109 / 0.0479 kg = 0.227 m (book 0.2296). ΔTb = 0.512 × 0.227 = 0.116 °C, about 0.12 °C (book 0.118 °C). ⚠ The question prints 4.7 g of water, but the working uses 47.9 g. With 4.7 g the answer would be about 1.2 °C.", "h": "Always check the mass of solvent used in the working.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "example", "s": "Ch11 p.131 Example", "q": "A solution of 20.0 g haemoglobin in 1 L has an osmotic pressure of 5.92 torr at 22 °C (R = 0.08206 L atm/mol K). The molar mass of haemoglobin is about:", "o": ["3.2 × 10⁻⁴ g/mol", "1.6 × 10⁻⁵ g/mol", "6.2 × 10⁴ g/mol", "6.2 × 10⁷ g/mol"], "a": 2, "e": "π = 5.92/760 = 7.79 × 10⁻³ atm. T = 295 K. M = π/RT = 7.79 × 10⁻³ / (0.08206 × 295) = 3.2 × 10⁻⁴ mol/L. Molar mass = 20.0 g ÷ 3.2 × 10⁻⁴ mol = about 6.2 × 10⁴ g/mol (the book rounds to 62,500).", "h": "⚠ TRAP: convert torr to atm and °C to K first.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch11 p.131 Exercise 1", "q": "The vapour pressure of an ideal solution with equal mole fractions of benzene (P° = 95.1 mmHg) and toluene (P° = 28.4 mmHg) at 25 °C is:", "o": ["61.75 mmHg", "47.55 mmHg", "123.5 mmHg", "66.7 mmHg"], "a": 0, "e": "Both are volatile, so add their partial pressures: 0.5 × 95.1 + 0.5 × 28.4 = 47.55 + 14.2 = 61.75 mmHg. Using only benzene gives 47.55.", "h": "Both volatile: add the partial pressures.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch11 p.132 Exercise 2", "q": "10.0 g of wax (average formula C₁₂H₄₆ as printed, 190 g/mol) is dissolved in 40.0 g of CCl₄ (154 g/mol, P° = 100 torr at 23 °C). The vapour pressure of the solution is about:", "o": ["100 torr", "83 torr", "17 torr", "50 torr"], "a": 1, "e": "Wax: 10.0/190 = 0.0526 mol. CCl₄: 40.0/154 = 0.2597 mol. x(CCl₄) = 0.2597/(0.2597 + 0.0526) = 0.832. P = 0.832 × 100 = 83 torr. ⚠ “C₁₂H₄₆” is not a real alkane formula, so check what molar mass the question wants you to use.", "h": "Solution vapour pressure = x(solvent) × P°.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch11 p.132 Exercise 3", "q": "A solution is made of 0.25 mol sucrose and 75.0 g urea (60.06 g/mol) in 1 kg of water (18.02 g/mol, P° = 17.5 mmHg at 20 °C). The vapour pressure of the solution is:", "o": ["17.0 mmHg", "17.5 mmHg", "0.52 mmHg", "16.4 mmHg"], "a": 0, "e": "Urea = 75.0/60.06 = 1.25 mol. Total solute = 1.50 mol. Water = 1000/18.02 = 55.5 mol. x(water) = 55.5/57.0 = 0.974. P = 0.974 × 17.5 = 17.0 mmHg. ⚠ The book writes the formula as “P²_H₂O”; it is P° (pure water).", "h": "Add up ALL the non-volatile solutes.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch11 p.132 Exercise 4", "q": "92.1 g of I₂ (253.8 g/mol) is dissolved in 800.0 g of chloroform (Kf = 4.68 °C/m, normal freezing point −63.5 °C). The freezing point of the solution is:", "o": ["−65.6 °C", "−2.1 °C", "−63.5 °C", "−61.4 °C"], "a": 0, "e": "n = 92.1/253.8 = 0.363 mol. m = 0.363 / 0.8000 kg = 0.454 m. ΔTf = 4.68 × 0.454 = 2.12 °C. Tf = −63.5 − 2.12 = −65.6 °C. The −61.4 °C comes from adding instead of subtracting. ⚠ The book puts 253.8 beside chloroform, but it is the molar mass of I₂.", "h": "⚠ TRAP: depression means the freezing point goes DOWN from the pure-solvent value.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch11 p.132 Exercise 5a", "q": "A solution of 1.5 g hemocyanin in 250 mL of water has an osmotic pressure of 0.00342 atm at 277 K (R = 0.08206 L atm/mol K). The molar mass of hemocyanin is about:", "o": ["1.0 × 10⁴ g/mol", "4.0 × 10⁷ g/mol", "1.6 × 10⁻⁵ g/mol", "4.0 × 10⁴ g/mol"], "a": 3, "e": "M = π/RT = 0.00342 / (0.08206 × 277) = 1.5 × 10⁻⁴ mol/L. In 0.250 L: 3.76 × 10⁻⁵ mol. Molar mass = 1.5 g ÷ 3.76 × 10⁻⁵ mol = 3.99 × 10⁴ g/mol. If you forget the volume (0.250 L) you get 1.0 × 10⁴.", "h": "Volume matters: moles = M × V.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch11 p.132 Exercise 5b", "q": "The freezing point of the hemocyanin solution above (Kf = 1.86 °C/m, molality about 1.5 × 10⁻⁴ m) is about:", "o": ["0.00 °C exactly", "−1.86 °C", "−0.28 °C", "−0.00028 °C"], "a": 3, "e": "ΔTf = 1.86 × 1.5 × 10⁻⁴ = 2.8 × 10⁻⁴ °C. This is far too small to measure, which is why osmotic pressure is used for macromolecules. The solution freezes at −0.00028 °C.", "h": "Tiny ΔTf for huge molecules: use osmotic pressure.", "t": "Introduction to Colligative Properties of Liquids", "d": 1}, {"ch": 12, "k": "example", "s": "Ch12 p.143", "q": "Resolve 2Sr + O₂ → 2SrO into half-reactions. Which pair is correct?", "o": ["Oxidation: Sr²⁺ → Sr + 2e⁻; reduction: O²⁻ → O₂", "Oxidation: O₂ → 2O²⁻; reduction: Sr → Sr²⁺ + 2e⁻", "Oxidation: Sr → Sr²⁺ + 2e⁻; reduction: O₂ + 4e⁻ → 2O²⁻", "Oxidation: Sr → Sr⁺ + e⁻; reduction: O₂ + 2e⁻ → O²⁻"], "a": 2, "e": "Sr goes from 0 to +2 (loses electrons, oxidised). Oxygen goes from 0 to −2 (gains electrons, reduced). ⚠ The book writes the products as “Sr₂” and “O₂⁻” by mistake; they are Sr²⁺ and O²⁻.", "h": "Metal loses electrons, non-metal gains them.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "example", "s": "Ch12 p.143", "q": "In 2Sr + O₂ → 2SrO, the oxidising agent is:", "o": ["O₂", "Sr", "SrO", "Sr²⁺"], "a": 0, "e": "O₂ takes the electrons and is reduced, so it is the oxidant. Sr gives the electrons, so it is the reductant.", "h": "Oxidant = the one that gets reduced.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "example", "s": "Ch12 p.143", "q": "In 2Sr + O₂ → 2SrO, how many electrons are transferred in total?", "o": ["4", "6", "2", "1"], "a": 0, "e": "Each Sr loses 2 electrons and there are 2 Sr atoms: 2 × 2 = 4 electrons, which the O₂ molecule gains.", "h": "Total electrons = atoms × change per atom.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.144", "q": "In 2Ca + O₂ → 2CaO, which species is the reductant?", "o": ["O₂", "O²⁻", "Ca", "CaO"], "a": 2, "e": "Ca goes 0 → +2 (oxidised), so Ca is the reducing agent.", "h": "Reductant is oxidised.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.144", "q": "In 2Na + S → Na₂S, the reduction half-reaction is:", "o": ["Na → Na⁺ + e⁻", "S → S²⁻ + 2e⁻", "S + 2e⁻ → S²⁻", "2Na⁺ + 2e⁻ → 2Na"], "a": 2, "e": "Sulphur gains two electrons (0 → −2), which is reduction. Na → Na⁺ + e⁻ is the oxidation half.", "h": "Gain of e⁻ = reduction.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.144", "q": "In 2Li + H₂ → 2LiH, the oxidation number of hydrogen changes from 0 to:", "o": ["−1", "−2", "0", "+1"], "a": 0, "e": "In metal hydrides hydrogen is −1. Li goes 0 → +1 (oxidised) and H goes 0 → −1 (reduced), so H₂ is the oxidant here.", "h": "⚠ TRAP: H is −1 in hydrides, not +1.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.144", "q": "In 3Mg + N₂ → Mg₃N₂, what are the oxidation numbers of Mg and N in the product?", "o": ["Mg = +4, N = −3", "Mg = +3, N = −2", "Mg = +2, N = +3", "Mg = +2, N = −3"], "a": 3, "e": "Mg is in Group II so it is +2. Three Mg give +6, so the two N must give −6, which is −3 each. ⚠ The book’s working shows Mg as +4 at one point; that is wrong.", "h": "Group II metals are always +2 in compounds.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.144", "q": "In 3Mg + N₂ → Mg₃N₂, the oxidising agent is:", "o": ["Mg²⁺", "N₂", "Mg", "Mg₃N₂"], "a": 1, "e": "N₂ gains electrons (0 → −3) and is reduced, so it is the oxidant. Mg is the reductant.", "h": "Non-metal element + metal: non-metal is the oxidant.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.144", "q": "In Zn + I₂ → ZnI₂, which half-reaction is the oxidation?", "o": ["2I⁻ → I₂ + 2e⁻", "Zn²⁺ + 2e⁻ → Zn", "I₂ + 2e⁻ → 2I⁻", "Zn → Zn²⁺ + 2e⁻"], "a": 3, "e": "Zn loses two electrons and rises from 0 to +2, which is oxidation. Iodine is reduced to iodide.", "h": "Oxidation = electrons on the product side.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.144", "q": "In 2C + O₂ → 2CO, the oxidation number of carbon changes from:", "o": ["0 to −2", "0 to +4", "0 to +2", "+2 to 0"], "a": 2, "e": "In CO oxygen is −2, so carbon is +2. Complete combustion to CO₂ would give +4. Carbon is oxidised and is the reductant.", "h": "CO is +2; CO₂ is +4.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.144", "q": "In 2C + O₂ → 2CO, the oxidant is:", "o": ["CO₂", "C", "CO", "O₂"], "a": 3, "e": "Oxygen goes 0 → −2, so it is reduced and is the oxidising agent.", "h": "Oxygen is the usual oxidant in combustion.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Arrange these sulphur species in order of increasing oxidation number of S: S²⁻, S₃, SO₂, SO₃.", "o": ["S²⁻ < SO₂ < S₃ < SO₃", "SO₃ < SO₂ < S₃ < S²⁻", "S²⁻ < S₃ < SO₂ < SO₃", "S₃ < S²⁻ < SO₂ < SO₃"], "a": 2, "e": "S²⁻ = −2, S₃ (element) = 0, SO₂ = +4, SO₃ = +6.", "h": "Element is 0, sulphide is −2, oxides are positive.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "In the list H₂S, HS⁻, S²⁻, which statement is true about the oxidation number of sulphur?", "o": ["It is −2 in all three", "It is −1 in HS⁻ only", "It is +2 in S²⁻", "It is 0 in H₂S"], "a": 0, "e": "H₂S: 2(+1) + S = 0 gives −2. HS⁻: +1 + S = −1 gives −2. S²⁻ is −2 by its charge.", "h": "Count the hydrogens first, then the charge.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "The oxidation number of sulphur in H₂SO₄ is:", "o": ["+4", "+6", "−2", "+2"], "a": 1, "e": "2(+1) + S + 4(−2) = 0, so S = +6.", "h": "Sulphuric acid: S is at its highest state, +6.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Cs in a normal Group I compound such as Cs₂O is:", "o": ["−1", "+1", "0", "+2"], "a": 1, "e": "Group I metals are always +1. ⚠ The book lists “CsO”, which is not a normal oxide formula (Cs₂O is). If you ever see CsO, treat the metal as +1 and expect a peroxide or superoxide type oxygen.", "h": "Group I = +1, no exceptions.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Ca in CaI₂:", "o": ["+2", "+1", "−2", "+3"], "a": 0, "e": "Iodide is −1 each, so 2(−1) + Ca = 0 gives Ca = +2.", "h": "Group II = +2.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Al in Al₂O₃:", "o": ["+6", "+2", "+3", "+1"], "a": 2, "e": "3(−2) = −6, so 2 Al must be +6, giving +3 each.", "h": "Divide by the number of atoms of the metal.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of As in H₃AsO₃:", "o": ["+1", "+3", "−3", "+5"], "a": 1, "e": "3(+1) + As + 3(−2) = 0, so As = +3.", "h": "Add the known ones, solve for the unknown.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Ti in TiO₂:", "o": ["+2", "+3", "+8", "+4"], "a": 3, "e": "2(−2) = −4, so Ti = +4.", "h": "Metal oxide MO₂ gives +4.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Mo in MoO₄²⁻:", "o": ["+6", "+8", "+2", "+4"], "a": 0, "e": "Mo + 4(−2) = −2 gives Mo = +6.", "h": "Total charge on the ion = sum of all oxidation numbers.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Pt in PtCl₄²⁻:", "o": ["+2", "+6", "−2", "+4"], "a": 0, "e": "Pt + 4(−1) = −2 gives Pt = +2.", "h": "Chloride is −1 each; the ion charge is −2.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Sn in SnF₂:", "o": ["+1", "+2", "+4", "−2"], "a": 1, "e": "Fluorine is −1 each, so Sn = +2.", "h": "F is always −1.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation number of Cl in ClF₃:", "o": ["+5", "+3", "+1", "−3"], "a": 1, "e": "F is more electronegative than Cl and is −1, so Cl = +3.", "h": "Fluorine always wins and takes −1.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "Oxidation numbers of the halogen in HClO₄, HClO₃, HClO₂ and HClO respectively are:", "o": ["+8, +6, +4, +2", "+7, +5, +3, +1", "+4, +3, +2, +1", "+7, +5, +3, −1"], "a": 1, "e": "HClO₄: 1 + Cl − 8 = 0 gives +7. HClO₃: +5. HClO₂: +3. HClO: +1. Each fewer oxygen drops the number by 2.", "h": "Subtract 2 for each oxygen you remove.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch12 p.145", "q": "The oxidation number of Br in HBrO₄ and of I in HIO₄ are:", "o": ["both +4", "+7 and +5", "both +7", "both +5"], "a": 2, "e": "Same formula type as HClO₄: 1 + X + 4(−2) = 0 gives X = +7.", "h": "Same formula, same number.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "example", "s": "Ch12 p.146", "q": "Disproportionation is a reaction in which an element:", "o": ["is both oxidised and reduced", "is only reduced in the reaction", "is only oxidised in the reaction", "keeps the same oxidation number"], "a": 0, "e": "One species in one oxidation state forms products in a higher and a lower state. Example: 2H₂O₂ → 2H₂O + O₂.", "h": "One element, two directions.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "example", "s": "Ch12 p.146", "q": "In 2H₂O₂ → 2H₂O + O₂, the oxidation number of oxygen goes from −1 to:", "o": ["0 only", "−1 and −2", "−2 only", "−2 and 0"], "a": 3, "e": "Some oxygen drops to −2 (in water, reduced) and some rises to 0 (in O₂, oxidised). That is disproportionation.", "h": "Peroxide oxygen is −1.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "example", "s": "Ch12 p.146", "q": "In Cl₂ + 2NaOH → NaClO + NaCl + H₂O, chlorine goes from 0 to:", "o": ["+5 and −1", "+1 and −1", "+1 only", "−1 only"], "a": 1, "e": "Chlorine in NaClO is +1 (oxidised) and in NaCl is −1 (reduced). The same Cl₂ does both.", "h": "Cold dilute NaOH gives hypochlorite.", "t": "Reduction-Oxidation Reactions", "d": 1}, {"ch": 12, "k": "example", "s": "Ch12 p.145", "q": "Which reaction is a halogen displacement? Cl₂ + 2KBr → 2KCl + Br₂. Here the reducing agent is:", var lockMod=null;
var lockReady=(async function(){try{lockMod=await import('../cbt-lock.js');}catch(e){lockMod=null;}})();
var app=document.getElementById('app');
var EX=CH.length;
var PAST=CH.length+1;
var POOL=QS.filter(function(q){return !q.d;});
var KIND={example:'WORKED EXAMPLE',exercise:'EXERCISE',trap:'TRAP ALERT',concept:'KEY POINT',past:'PAST QUESTION'};
var mode='full',sess=0,run=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/&lt;(\/?)(sup|sub)&gt;/g,'<$1$2>');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function bySess(n){return QS.filter(function(q){return q.ch===n;});}
function sessName(n){return n===PAST?'Past Questions':n===EX?'Examples & Exercises':'Ch '+(n+1)+' · '+CH[n];}

async function gate(){
  await lockReady;
  if(!lockMod)return true;
  try{
    var a=await lockMod.checkCbtAccess(CBT_ID);
    if(a&&a.blocked){app.innerHTML='';lockMod.renderCbtLockScreen(app,a.reason);return false;}
  }catch(e){}
  return true;
}

function home(){
  var tot=POOL.length;
  app.innerHTML='<h1 class="brand">INDIGENE</h1><div class="sub">CHM 101 — Introductory Inorganic &amp; Physical Chemistry CBT ('+tot+' Questions)</div>'+
  '<div class="panel"><h2 class="ttl">Choose Your Run</h2><div class="grid" id="runs"></div><div class="sess" id="sess"></div>'+
  '<button class="go" id="go">START QUIZ</button>'+
  '</div>';
  var half=Math.round(tot/2);
  var cards=[['full',tot,'Full CBT'],['quick',50,'Quick Drill'],['half',half,'Half Run'],['sess','🎯','By Session']];
  var r=document.getElementById('runs');
  cards.forEach(function(c){
    var b=document.createElement('button');b.className='run'+(mode===c[0]?' sel':'');
    b.innerHTML='<b>'+c[1]+'</b><span>'+c[2]+'</span>';
    b.onclick=function(){mode=c[0];home();};
    r.appendChild(b);
  });
  var s=document.getElementById('sess');
  if(mode==='sess'){
    s.className='sess show';
    for(var n=0;n<=PAST;n++){(function(n){
      var row=document.createElement('button');
      row.className='srow'+(sess===n?' sel':'')+(n>=EX?' past':'');
      row.innerHTML='<span>'+esc(sessName(n))+'</span><small>'+bySess(n).length+' Qs</small>';
      row.onclick=function(){sess=n;var rows=s.querySelectorAll('.srow');rows.forEach(function(x){x.classList.remove('sel');});row.classList.add('sel');};
      s.appendChild(row);
    })(n);}
  }
  document.getElementById('go').onclick=start;
}

async function start(){
  if(!(await gate()))return;
  var list;
  if(mode==='full')list=shuffle(POOL);
  else if(mode==='quick')list=shuffle(POOL).slice(0,50);
  else if(mode==='half')list=shuffle(POOL).slice(0,Math.round(POOL.length/2));
  else list=bySess(sess);
  run={list:list,i:0,score:0,wrong:[],name:mode==='sess'?sessName(sess):null};
  show();
}

async function show(){
  if(run.i>=run.list.length)return finish();
  if(!(await gate()))return;
  var q=run.list[run.i];
  var opts=shuffle(q.o.map(function(t,k){return{t:t,ok:k===q.a};}));
  run.cur={q:q,opts:opts,done:false};
  var L=['A','B','C','D'];
  var h='<div class="top"><span>Question <b>'+(run.i+1)+'</b> / '+run.list.length+'</span><span>Score <b id="sc">'+run.score+'</b></span><button class="quit" id="quit">Quit</button></div>'+
  '<div class="bar"><i style="width:'+(run.i/run.list.length*100)+'%"></i></div><div class="panel">'+
  '<span class="tag">'+KIND[q.k]+'</span><span class="tag t2">'+esc(q.ch>=EX?q.t:'Ch '+(q.ch+1)+' · '+CH[q.ch])+'</span>'+
  '<div class="qtext">'+esc(q.q)+'</div>'+(q.img?'<img class="qimg" alt="Figure from the textbook" src="'+q.img+'">':'')+'<div id="opts"></div><div id="fb"></div><button class="go" id="nx" style="display:none"></button></div>';
  app.innerHTML=h;
  window.scrollTo(0,0);
  var box=document.getElementById('opts');
  opts.forEach(function(o,k){
    var b=document.createElement('button');b.className='opt';
    b.innerHTML='<span class="l">'+L[k]+'</span><span>'+esc(o.t)+'</span>';
    b.onclick=function(){answer(k);};
    box.appendChild(b);
  });
  document.getElementById('quit').onclick=function(){if(confirm('Quit this run?'))finish();};
}

function answer(k){
  var c=run.cur;if(c.done)return;c.done=true;
  var q=c.q,ok=c.opts[k].ok;
  var btns=document.querySelectorAll('#opts .opt');
  btns.forEach(function(b,j){b.disabled=true;if(c.opts[j].ok)b.classList.add('ok');else if(j===k)b.classList.add('bad');});
  if(ok)run.score++;else run.wrong.push({q:q,pick:c.opts[k].t});
  document.getElementById('sc').textContent=run.score;
  try{if(lockMod&&lockMod.recordCbtQuestionUsed)lockMod.recordCbtQuestionUsed();}catch(e){}
  document.getElementById('fb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><h4>'+(ok?'CORRECT':'WRONG')+'</h4><p>'+esc(q.e)+'</p><div class="hack"><em>EXAM HACK</em>'+esc(q.h)+'</div></div>';
  var nx=document.getElementById('nx');nx.style.display='block';
  nx.textContent=(run.i+1>=run.list.length)?'FINISH':'NEXT QUESTION';
  nx.onclick=function(){run.i++;show();};
  nx.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function finish(){
  var n=run.i+(run.cur&&run.cur.done?1:0);if(n>run.list.length)n=run.list.length;
  var pct=n?Math.round(run.score/n*100):0;
  var msg=pct>=70?'Strong run. Keep going.':pct>=50?'Passable, but go through the ones you missed.':'Not there yet. Read the explanations and run it again.';
  app.innerHTML='<h1 class="brand">INDIGENE</h1><div class="panel res"><h2 class="ttl">Run Complete</h2><div class="big">'+pct+'%</div><p>'+run.score+' correct out of '+n+' answered<br>'+msg+'</p>'+
  (run.wrong.length?'<button class="btn2" id="rv">Review wrong answers ('+run.wrong.length+')</button><button class="btn2" id="rt">Retry only the wrong ones</button>':'')+
  '<button class="btn2" id="hm">Back to start</button><div id="rvbox"></div></div>';
  document.getElementById('hm').onclick=function(){run=null;home();};
  if(run.wrong.length){
    document.getElementById('rt').onclick=function(){run={list:shuffle(run.wrong.map(function(w){return w.q;})),i:0,score:0,wrong:[]};show();};
    document.getElementById('rv').onclick=function(){
      var out='';
      run.wrong.forEach(function(w){
        var cr=w.q.o[w.q.a];
        out+='<div class="rev"><div class="q">'+esc(w.q.q)+'</div><div class="y">Your answer: '+esc(w.pick)+'</div><div class="c">Correct: '+esc(cr)+'</div><p>'+esc(w.q.e)+'</p><p><b>Hack:</b> '+esc(w.q.h)+'</p></div>';
      });
      document.getElementById('rvbox').innerHTML=out;
    };
  }
  window.scrollTo(0,0);
}

(async function(){if(await gate())home();})();
</script>
</body>
</html>
