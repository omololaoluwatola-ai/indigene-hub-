ding to Bohr, an electron in an allowed orbit:", "o": ["changes its energy randomly", "continuously absorbs energy", "neither absorbs nor radiates energy", "continuously radiates energy"], "a": 2, "e": "The energy of an orbit is fixed. The electron only gains or loses energy when it jumps between orbits.", "h": "Stays put = no energy change."}, {"ch": 1, "k": "concept", "s": "Ch2 p.16 Bohr", "q": "Bohr's quantum condition says the angular momentum of an electron in an allowed orbit is:", "o": ["mvr = nh/2π", "mvr = n²h/2π", "mvr = h/2πn", "mvr = nh/π"], "a": 0, "e": "Angular momentum only takes whole-number multiples of h/2π, where n = 1, 2, 3 ...", "h": "mvr = n × (h/2π)."}, {"ch": 1, "k": "concept", "s": "Ch2 p.16 Bohr", "q": "The energy of an electron in the nth Bohr orbit is given by:", "o": ["Eₙ = +Rch/n²", "Eₙ = −Rch/n", "Eₙ = −Rch × n²", "Eₙ = −Rch/n²"], "a": 3, "e": "The energy is negative and falls off with n². The electron is most tightly bound when n = 1.", "h": "E ∝ −1/n²."}, {"ch": 1, "k": "concept", "s": "Ch2 p.16 Bohr", "q": "When an electron changes from one orbit to another, the energy it absorbs or emits equals:", "o": ["the energy of the higher orbit only", "the energy of the lower orbit only", "the difference in energy between the two orbits", "the sum of the energies of the two orbits"], "a": 2, "e": "ΔE = E(final) − E(initial). This is the energy of the photon in the line spectrum.", "h": "ΔE = difference, not sum."}, {"ch": 1, "k": "trap", "s": "Ch2 p.17 Bohr", "q": "Bohr found that the maximum number of electrons in any energy level is:", "o": ["n²", "2n", "2n²", "n² + 2"], "a": 2, "e": "K, L, M and N (n = 1 to 4) therefore hold 2, 8, 18 and 32 electrons.", "h": "2n² = 2, 8, 18, 32."}, {"ch": 1, "k": "concept", "s": "Ch2 p.17 Bohr", "q": "Which letters label the shells for n = 1, 2, 3 and 4?", "o": ["K, L, M, N", "N, M, L, K", "S, P, D, F", "A, B, C, D"], "a": 0, "e": "K is closest to the nucleus (n = 1). s, p, d, f are subshells, not shells.", "h": "K L M N, Keep Lighting My Nights."}, {"ch": 1, "k": "concept", "s": "Ch2 p.16 types", "q": "Electronic energy is the energy due to:", "o": ["the rotation of a whole molecule", "the movement of a molecule through space", "the vibration of nuclei in a molecule", "the motion of the electron about the nucleus"], "a": 3, "e": "It comes from the charge interaction between electrons and the nucleus.", "h": "Electronic = electron around nucleus."}, {"ch": 1, "k": "concept", "s": "Ch2 p.18 wave", "q": "The wave-mechanical model says that electrons:", "o": ["are held at fixed positions inside the nucleus itself", "are equally likely to be found at any distance from the nucleus", "are likely to be found close to the nucleus, not circling it like planets", "move in fixed circular orbits around the nucleus like planets"], "a": 2, "e": "Electrons behave as waves and are described by probabilities, not paths.", "h": "Waves, not planets."}, {"ch": 1, "k": "concept", "s": "Ch2 p.18 wave", "q": "The relationship between wavelength, frequency and speed of a wave is:", "o": ["λ + ν = c", "λν = c", "λ/ν = c", "ν = λc"], "a": 1, "e": "Wavelength times frequency equals the speed of propagation.", "h": "λν = c."}, {"ch": 1, "k": "concept", "s": "Ch2 p.18 wave", "q": "The values of Planck's constant and the speed of light used in the book are:", "o": ["h = 6.63 × 10³⁴ J s and c = 3.00 × 10⁻⁸ m s⁻¹", "h = 6.63 × 10⁻³⁴ m s⁻¹ and c = 3.00 × 10⁸ J s", "h = 3.00 × 10⁸ J s and c = 6.63 × 10⁻³⁴ m s⁻¹", "h = 6.63 × 10⁻³⁴ J s and c = 3.00 × 10⁸ m s⁻¹"], "a": 3, "e": "Planck's constant is tiny and the speed of light is huge.", "h": "h small (10⁻³⁴), c big (10⁸)."}, {"ch": 1, "k": "trap", "s": "Ch2 p.18 wave", "q": "For a moving particle of mass m and speed v, the wavelength is given by:", "o": ["λ = h/mv", "λ = hv/m", "λ = mv/h", "λ = hm/v"], "a": 0, "e": "Heavy or fast particles have very short wavelengths. The book writes it as c = h/m, which is loosely stated; the relation to remember is λ = h/mv.", "h": "⚠ TRAP: h goes on top, mv underneath."}, {"ch": 1, "k": "concept", "s": "Ch2 p.19 levels", "q": "The lowest energy level (E₁) of an atom is called the:", "o": ["ionisation level", "ground state", "excited state", "valence level"], "a": 1, "e": "The electron sits in the lowest level when the atom is not excited.", "h": "Lowest = ground."}, {"ch": 1, "k": "concept", "s": "Ch2 p.19 levels", "q": "What is the maximum number of electrons in an f subshell?", "o": ["10", "2", "6", "14"], "a": 3, "e": "s holds 2, p holds 6, d holds 10 and f holds 14.", "h": "2, 6, 10, 14."}, {"ch": 1, "k": "concept", "s": "Ch2 p.19 Fig 8", "q": "In the energy-level diagram shown, which subshell has lower energy than 3d?", "o": ["4p", "4f", "4d", "4s"], "a": 3, "e": "The 4s subshell sits below 3d, so it fills first. That is the overlap the book mentions.", "h": "4s before 3d.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAGJAhADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAEFBgQCAwf/xABQEAACAQQAAwQFBQsICQIHAAAAAQIDBAURBhIhEzFBURQVImFxBxYykdEjQlJiY3KBkqGxwSQlJzNTc4LhFyY0NURUZIOTQ0U2N1aUorLC/8QAFQEBAQAAAAAAAAAAAAAAAAAAAAH/xAAYEQEBAQEBAAAAAAAAAAAAAAAAARFBMf/aAAwDAQACEQMRAD8A/VQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgCQQSAAIAkEEgCCQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAI2fC8vLexoSr3VaFGlHvlOWkYjM/KfZWrUcba1L1cyi6n0YbfgvNgb7ZJncBxjjM0o041VQu2kpUKvsyT8uveaIAAAAAAAAAAAAAAAAAAAAAAAAAAAAB5b0t+AHPkb6jj7Spc13qFNb14sraWavq0ITp4e4cZpNNziuj/ScSa4kzMZKLljbN98l7NWf+Rp1FJJJJJdyIKr1peqT5sTX15qcX/Ej1xda36ou+/X3v2lvoaKqpll7qPdibt9fxftPnLOXEXr1PfPr4JfaXWhoIp/Xdfma9UX3T8RHuOZqvvxd6l+YvtLXQ0BT1M5VhreKvnvypr7T0s1UbS9WXvVb/qy20NAVlTLVKcterruS81BfaR65knp4+8Xl7H+ZaaGgKp5qXTWNvX8Kf8AmfSWVlGLfoF30/E/zLHQAqfXnSLePvVv8ke3mYpbdlea1v8AqmWekArxSqdpTjPUo7W9SWmiur5y3pXEKUYVKinVVLnivZUn7yxq01VpSpy2oyWnp6  configuration 1s² 2s² 2p⁶?", "o": ["F⁻", "Al³⁺", "O²⁻", "Cl⁻"], "a": 3, "e": "F⁻, O²⁻ and Al³⁺ all have 10 electrons. Cl⁻ has 18 and matches argon.", "h": "Ne: F⁻, O²⁻, Na⁺, Mg²⁺, Al³⁺. Ar: Cl⁻, K⁺, Ca²⁺."}, {"ch": 1, "k": "trap", "s": "Ch2 p.22 valence", "q": "How many electrons are in the valence shell of helium?", "o": ["1", "0", "2", "8"], "a": 2, "e": "Helium is 1s², so two electrons fill its only shell. The book says 1 here, which is a misprint.", "h": "⚠ TRAP: He has 2, not 8 and not 1."}, {"ch": 1, "k": "concept", "s": "Ch2 p.22 valence", "q": "The valence electrons of an atom determine:", "o": ["the combining power of the atom and its bonding", "the number of protons and the nuclear charge", "the mass number and the number of neutrons", "the size of the nucleus and its stability"], "a": 0, "e": "Chemistry happens in the outermost shell, so those electrons decide how the atom bonds.", "h": "Valence = bonding."}, {"ch": 1, "k": "trap", "s": "Ch2 p.22 valence", "q": "Which is the correct configuration of aluminium (Z = 13)? (The book prints it with 2p¹ at the end.)", "o": ["1s² 2s² 2p⁶ 3s³", "1s² 2s² 2p⁶ 3s² 3p¹", "1s² 2s² 2p⁶ 3s² 2p¹", "1s² 2s² 2p⁶ 3s¹ 3p²"], "a": 1, "e": "After 3s² the next electron goes into 3p, not back to 2p, since 2p is already full. Al has 3 valence electrons (3s² 3p¹).", "h": "⚠ TRAP: 2p is full; the last electron goes to 3p."}, {"ch": 1, "k": "concept", "s": "Ch2 p.22 Hund", "q": "Hund's rule states that, for orbitals of equal energy:", "o": ["two electrons in one orbital must have the same spin", "no orbital can hold more than one electron", "electrons occupy each orbital singly before any orbital is doubly filled", "electrons pair up in the first orbital before using the next"], "a": 2, "e": "Each orbital becomes half-filled before any is completely filled. That is why N is 2p³ with three unpaired electrons.", "h": "Hund = bus seats: one person per seat first."}, {"ch": 1, "k": "concept", "s": "Ch2 p.22 Pauli", "q": "The Pauli exclusion principle states that:", "o": ["orbitals of equal energy are filled singly before pairing", "no two electrons in an atom can share all four quantum numbers", "position and momentum cannot both be known at once", "electrons fill the lowest-energy orbitals before higher ones"], "a": 1, "e": "Two electrons in one orbital must differ in spin. This limits an orbital to two electrons.", "h": "Pauli = no identical twins."}, {"ch": 1, "k": "trap", "s": "Ch2 p.22 rules", "q": "Which of the following is NOT a rule for filling electrons into orbitals?", "o": ["Hund's rule", "Aufbau principle", "Pauli exclusion principle", "Heisenberg's uncertainty principle"], "a": 3, "e": "Heisenberg says you cannot know both the position and momentum of a particle exactly. The book lists it with the filling rules, but it does not tell you where to put electrons.", "h": "⚠ TRAP: Heisenberg = uncertainty, not filling."}, {"ch": 1, "k": "concept", "s": "Ch2 p.22 Aufbau", "q": "The Aufbau principle states that electrons are added to orbitals:", "o": ["in order of increasing energy, starting with the lowest", "all at once to the outermost shell", "only in orbitals that already contain an electron", "in order of decreasing energy, starting with the highest"], "a": 0, "e": "Fill from the bottom up: 1s, 2s, 2p, 3s and so on.", "h": "Aufbau = build from the bottom."}, {"ch": 1, "k": "trap", "s": "Ch2 p.22 Hund", "q": "A student draws the 2p orbitals of carbon (2p²) with both electrons paired in one 2p box and the other two empty. This is:", "o": ["correct, because paired electrons are more stable", "wrong, because carbon has no 2p electrons", "wrong, because Hund's rule says each orbital gets one electron first", "correct, because the Pauli principle requires pairing"], "a": 2, "e": "Carbon should be 2pₓ¹ 2pᵧ¹ 2p_z⁰. Filling one box completely while others are empty breaks Hund's rule.", "h": "⚠ TRAP: singles first, pairs later."}, {"ch": 1, "k": "concept", "s": "Ch2 p.20 quantum", "q": "Which quantum number determines the shape of an orbital?", "o": ["Azimuthal quantum number, l", "Spin quantum number, mₛ", "Magnetic quantum number, m", "Principal quantum number, n"], "a": 0, "e": "n gives size and energy, l gives shape, m gives orientation and mₛ gives spin direction.", "h": "n size, l shape, m orientation, s spin."}, {"ch": 1, "k": "concept", "s": "Ch2 p.20 quantum", "q": "The principal quantum number n determines the:", "o": ["spinning direction of the electron", "size and energy of the orbit", "shape of the orbital", "orientation of the orbital"], "a": 1, "e": "Higher n means a bigger orbit with higher energy.", "h": "n = size + energy."}, {"ch": 1, "k": "concept", "s": "Ch2 p.20 quantum", "q": "The magnetic quantum number m describes the:", "o": ["energy of the electron", "orientation of the orbital", "size of the orbit", "shape of the orbital"], "a": 1, "e": "It tells which way the orbital points in space (x, y or z for p).", "h": "m = direction."}, {"ch": 1, "k": "concept", "s": "Ch2 p.20 quantum", "q": "The spin quantum number can have values of:", "o": ["1, 2, 3 ...", "+1 or −1", "0 or 1", "+½ or −½"], "a": 3, "e": "Spin has only two values, one for each spinning direction.", "h": "Two spins: up and down."}, {"ch": 1, "k": "trap", "s": "Ch2 p.20 quantum", "q": "For l = 2, the number of allowed values of the magnetic quantum number m is:", "o": ["5", "2", "7", "3"], "a": 0, "e": "m runs from −l to +l: −2, −1, 0, +1, +2. The book's table shows only −1 to +1, which is the p case.", "h": "⚠ TRAP: count = 2l + 1. p has 3, d has 5, f has 7."}, {"ch": 1, "k": "trap", "s": "Ch2 p.20 quantum", "q": "Which set of quantum numbers (n, l, m, mₛ) is NOT allowed for an electron?", "o": ["n = 3, l = 2, m = −2, mₛ = +½", "n = 2, l = 1, m = 0, mₛ = −½", "n = 4, l = 3, m = 3, mₛ = +½", "n = 2, l = 2, m = 0, mₛ = +½"], "a": 3, "e": "l must be smaller than n. With n = 2 only l = 0 or 1 is possible, so l = 2 is impossible.", "h": "⚠ TRAP: l is always less than n."}, wrhCChCKjFdlFLSR4qxaKZSlVTXCUvzOMUm/1MpIEaPKhFNvpSb8s9gDw4J+Uj14JAHlrZEa4wXyxS/Q9gDz0pjpR6AHlRSfZa2T0r6EgCNEdKPQAjQ19SQBGiQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/2Q=="}, {"ch": 1, "k": "concept", "s": "Ch2 p.20 shape", "q": "How many p orbitals are there in a given p subshell?", "o": ["7", "3", "1", "5"], "a": 1, "e": "pₓ, pᵧ and p_z, with m = −1, 0, +1.", "h": "p = 3, d = 5, f = 7."}, {"ch": 1, "k": "concept", "s": "Ch2 p.22 notation", "q": "The configuration C (6) = 1s² 2s² 2pₓ¹ 2pᵧ¹ 2p_z⁰ shows that:", "o": ["the 2p_z orbital is already holding a pair of electrons", "the two 2p electrons are in different orbitals, as Hund's rule requires", "both 2p electrons are paired together in a single orbital", "carbon has no electrons at all in its 2s subshell"], "a": 1, "e": "Writing the p orbitals separately shows the electrons are unpaired.", "h": "Show px, py, pz to show Hund."}, {"ch": 1, "k": "concept", "s": "Ch2 p.23 Döbereiner", "q": "Döbereiner's triads were groups of three elements in which:", "o": ["the middle element's atomic weight was about the average of the other two", "the atomic weights doubled in every step down the triad", "the first and third elements had exactly the same atomic weight", "the elements were arranged by their atomic number values"], "a": 0, "e": "For Cl, Br and I, the middle value is close to the mean. The book says \"thirteen elements\", but triad means three.", "h": "Triad = three; middle ≈ average."}, {"ch": 1, "k": "concept", "s": "Ch2 p.24 Newlands", "q": "Newlands' law of octaves said that, when elements are listed by increasing atomic weight, the:", "o": ["tenth element is the same as the first", "eighth element has properties similar to the first", "third element has properties similar to the first", "element at the end of each row is a metal"], "a": 1, "e": "Newlands compared this to the musical scale. His groups were of seven. The law failed for heavier elements, which did not fit his octaves.", "h": "Octave: 8th note = 1st note."}, {"ch": 1, "k": "concept", "s": "Ch2 p.24 Mendeleev", "q": "Mendeleev's periodic table listed the elements in order of increasing:", "o": ["atomic mass", "ionisation energy", "atomic number", "atomic radius"], "a": 0, "e": "He then placed elements with similar chemical behaviour underneath each other. Atomic number came later, from Moseley.", "h": "Mendeleev = mass."}, {"ch": 1, "k": "concept", "s": "Ch2 p.24 Mendeleev", "q": "How many elements had been discovered by 1869, when Mendeleev made his table?", "o": ["63", "83", "92", "36"], "a": 0, "e": "The book gives 63. As more were discovered, patterns became clearer.", "h": "1869 → 63."}, {"ch": 1, "k": "concept", "s": "Ch2 p.26 groups", "q": "Group 1A elements are known as the:", "o": ["alkali metals", "noble gases", "alkaline earth metals", "halogens"], "a": 0, "e": "They have one valence electron, are very reactive, and are soft enough to be cut easily.", "h": "1A alkali, 2A alkaline earth."}, {"ch": 1, "k": "concept", "s": "Ch2 p.26 groups", "q": "Group 2A elements are called the:", "o": ["alkaline earth metals (beryllium family)", "alkali metals (lithium family)", "halogens (fluorine family)", "noble gases (helium family)"], "a": 0, "e": "They have similar properties because their outer electron configurations are alike.", "h": "2A = alkaline earth."}, {"ch": 1, "k": "trap", "s": "Ch2 p.26 groups", "q": "Which family does Group VIA (oxygen, sulphur, selenium) belong to?", "o": ["The carbon family", "The halogen family", "The oxygen family", "The nitrogen family"], "a": 2, "e": "The book lists both Group V and Group VI as the \"Nitrogen family\", which is a slip. Group VI is the oxygen family.", "h": "⚠ TRAP: N family is Group V only."}, {"ch": 1, "k": "concept", "s": "Ch2 p.26 groups", "q": "Group VIIB (VIIA) elements such as fluorine and chlorine are called the:", "o": ["carbon family", "halogens", "alkali metals", "noble gases"], "a": 1, "e": "Halogens have seven valence electrons and form −1 ions.", "h": "7 = halogen, 8 = noble gas."}, {"ch": 1, "k": "trap", "s": "Ch2 p.26 metals", "q": "Hydrogen sits on the left of the periodic table but is classified as a:", "o": ["metal", "non-metal", "metalloid", "transition element"], "a": 1, "e": "Hydrogen is the exception to the left-metal, right-non-metal rule.", "h": "⚠ TRAP: H is a non-metal."}, {"ch": 1, "k": "concept", "s": "Ch2 p.27 metals", "q": "Elements located directly on the diagonal line separating metals and non-metals are called:", "o": ["halogens", "transition metals", "noble metals", "metalloids"], "a": 3, "e": "Metalloids sit on the dividing line. Aluminium touches the line but is still classed as a metal.", "h": "On the line = metalloid."}, {"ch": 1, "k": "concept", "s": "Ch2 p.27 metals", "q": "Which element has the most metallic character of all the discovered elements?", "o": ["Lithium", "Mercury", "Francium", "Fluorine"], "a": 2, "e": "Metallic character increases down a group and from right to left across a period. Fr is at the bottom left.", "h": "Metallic: bottom-left."}, {"ch": 1, "k": "concept", "s": "Ch2 p.27 metals", "q": "Which statement about metals is correct?", "o": ["Metals are poor conductors of heat and electricity", "All metals are brittle solids at room temperature", "All metals are liquids except gold", "All metals are solids at room temperature except mercury"], "a": 3, "e": "Metals are ductile, malleable and good conductors. Mercury is the liquid exception.", "h": "Hg = liquid metal."}, {"ch": 1, "k": "concept", "s": "Ch2 p.27 metals", "q": "A metal that can be hammered into thin sheets is described as:", "o": ["ductile", "brittle", "malleable", "metalloid"], "a": 2, "e": "Ductile means drawn into wires. Malleable means hammered into sheets.", "h": "Malleable = M for Mallet."}, {"ch": 1, "k": "concept", "s": "Ch2 p.27 metals", "q": "In chemical reactions, metals tend to:", "o": ["share electrons equally", "gain electrons to form negative ions", "form no ions at all", "lose electrons to form positive ions"], "a": 3, "e": "Low ionisation energy means metals give up electrons easily.", "h": "Metals lose, non-metals gain."}, {"ch": 1, "k": "concept", "s": "Ch2 p.27 size", "q": "Down a group in the periodic table, the atomic size:", "o": ["decreases", "stays the same", "increases", "first falls then rises"], "a": 2, "e": "More shells are added as you go down.", "h": "Down = bigger."}, {"ch": 1, "k": "trap", "s": "Ch2 p.27 size", "q": "Across a period from left to right, atomic size generally:", "o": ["increases", "stays constant", "decreases", "doubles"], "a": 2, "e": "Nuclear charge rises while electrons go into the same shell, so the atom pulls in tighter. The book words this as \"right to left\", which is a slip.", "h": "⚠ TRAP: bigger on the LEFT of a period."}, {"ch": 1, "k": "trap", "s": "Ch2 p.28 ionisation", "q": "The first ionisation energy is the energy required to:", "o": ["remove all the valence electrons from an atom", "add an electron to a gaseous atom", "remove the most loosely held electron from a gaseous atom", "break a bond between two atoms"], "a": 2, "e": "It measures how strongly the outermost electron is held. Adding an electron is electron affinity.", "h": "IE = remove. EA = add."}, {"ch": 1, "k": "concept", "s": "Ch2 p.28 ionisation", "q": "Ionisation energy generally:", "o": ["rises from left to right across a period and up a group", "rises from the top to the bottom of any group", "stays the same for every element across a period", "falls from left to right across a period and up a group"], "a": 0, "e": "Smaller atoms hold their electrons more tightly, so more energy is needed to remove one.", "h": "IE rises towards the top right."}, {"ch": 1, "k": "concept", "s": "Ch2 p.29 ionisation", "q": "In general, metals have:", "o": ["relatively high ionisation energies", "relatively low ionisation energies", "no ionisation energy", "electron affinities that are always zero"], "a": 1, "e": "Metals lose electrons easily, so only a small amount of energy is needed.", "h": "Metal = low IE."}, {"ch": 1, "k": "trap", "s": "Ch2 p.30 Example 2", "q": "Which has the higher first ionisation energy, nitrogen or oxygen?", "o": ["Oxygen, because it is further right in the period", "Nitrogen, because it is larger than oxygen", "Oxygen, because it has more protons", "Nitrogen, because its 2p³ half-filled subshell is stable"], "a": 3, "e": "Normal trend says O should be higher, but N's half-filled p subshell breaks the trend. In O, one electron is paired and is easier to remove.", "h": "Half-filled = extra stable."}, {"ch": 1, "k": "concept", "s": "Ch2 p.29 ionic radius", "q": "The radius of an atom is defined as:", "o": ["half the distance between the centres of two bonded atoms", "twice the distance to the outermost electron", "the distance between the centres of two bonded atoms", "the distance from the nucleus to the nearest atom"], "a": 0, "e": "For bonded ions the same idea gives the ionic radius.", "h": "Radius = half the bond distance."}, {"ch": 1, "k": "concept", "s": "Ch2 p.29 EA", "q": "Electron affinity is the energy change that accompanies:", "o": ["breaking a covalent bond between two atoms", "melting a solid into a liquid", "adding an electron to a gaseous atom", "removing an electron from a gaseous atom"], "a": 2, "e": "M + e⁻ → M⁻ + energy. The smaller the atom, the greater its affinity for an electron.", "h": "EA = adding an electron."}, {"ch": 1, "k": "concept", "s": "Ch2 p.30 EA", "q": "Across a period from left to right, electron affinity generally:", "o": ["becomes zero", "increases", "stays constant", "decreases"], "a": 1, "e": "Atoms get smaller and the electron enters closer to the nucleus.", "h": "EA, IE, EN all rise to the right."}, {"ch": 1, "k": "concept", "s": "Ch2 p.30 EN", "q": "Electronegativity is the:", "o": ["distance between two bonded nuclei", "energy released when an electron is added", "energy required to remove an electron", "relative ability of an atom to attract shared electrons"], "a": 3, "e": "It is used to predict whether a bond will be mainly ionic or covalent.", "h": "EN = pulling shared electrons."}, {"ch": 1, "k": "concept", "s": "Ch2 p.30 EN", "q": "The most electronegative elements are found in the:", "o": ["upper left of the table", "lower right of the table", "lower left of the table", "upper right of the table"], "a": 3, "e": "Electronegativity rises across a period and falls down a group, so fluorine is the highest.", "h": "F = top right."}, {"ch": 1, "k": "trap", "s": "Ch2 p.28 ion", "q": "Which equation correctly represents the ionisation of sodium? (The book writes Li⁺ here.)", "o": ["Na + e⁻ → Na⁻ + energy", "Na → Na⁺ + 2e⁻", "Na + energy → Na⁺ + e⁻", "Na + energy → Li⁺ + e⁻"], "a": 2, "e": "The ion must be the same element as the atom that loses the electron. Ionisation takes in energy and removes one electron.", "h": "⚠ TRAP: Na gives Na⁺, not Li⁺."}, {"ch": 2, "k": "example", "s": "Ch3 p.32 units", "q": "How many millilitres are in 1 litre?", "o": ["1000 mL", "100 mL", "10 mL", "10 000 mL"], "a": 0, "e": "1 L = 1000 mL = 1000 cm³ = 1 dm³.", "h": "1 L = 1 dm³ = 1000 cm³."}, {"ch": 2, "k": "example", "s": "Ch3 p.32 units", "q": "A gas occupies 2.5 m³. What is this in litres?", "o": ["2.5 × 10⁶ L", "2500 L", "25 L", "250 L"], "a": 1, "e": "1 m³ = 10³ L, so 2.5 m³ = 2500 L. The 10⁶ factor is for cm³ or mL.", "h": "1 m³ = 1000 L."}, {"ch": 2, "k": "example", "s": "Ch3 p.32 units", "q": "A volume of 150 mL expressed in dm³ is:", "o": ["0.150 dm³", "150 dm³", "0.0150 dm³", "1.50 dm³"], "a": 0, "e": "1 dm³ = 1000 mL, so 150 mL is 0.150 dm³.", "h": "mL ÷ 1000 = dm³."}, {"ch": 2, "k": "example", "s": "Ch3 p.32 units", "q": "A gas has a pressure of 1520 mmHg. In atmospheres this is:", "o": ["2.00 atm", "0.500 atm", "115 520 atm", "1.52 atm"], "a": 0, "e": "1520 ÷ 760 = 2.00 atm. Multiplying by 760 gives the wrong direction.", "h": "mmHg ÷ 760 = atm."}, {"ch": 2, "k": "example", "s": "Ch3 p.32 units", "q": "A pressure of 2.50 atm expressed in kPa is closest to:", "o": ["1900 kPa", "253 kPa", "24.7 kPa", "2.53 kPa"], "a": 1, "e": "2.50 × 101.325 = 253.3 kPa. 1900 would be the answer in mmHg, not kPa.", "h": "atm × 101.3 = kPa."}, {"ch": 2, "k": "example", "s": "Ch3 p.32 temp", "q": "Convert 45°C to kelvin using T = t + 273.", "o": ["228 K", "318 K", "12 285 K", "45 K"], "a": 1, "e": "45 + 273 = 318 K.", "h": "Add 273."}, {"ch": 2, "k": "example", "s": "Ch3 p.33 kinetic", "q": "Using k = 1.38 × 10⁻²³ J/K, the average kinetic energy of one molecule at 300 K is (3/2)kT, which equals:", "o": ["9.32 × 10⁻²¹ J", "6.21 × 10⁻²¹ J", "3.74 × 10³ J", "4.14 × 10⁻²¹ J"], "a": 1, "e": "(3/2) × 1.38 × 10⁻²³ × 300 = 6.21 × 10⁻²¹ J. Leaving out the 3/2 gives 4.14 × 10⁻²¹; using R instead of k gives the per-mole value.", "h": "Per molecule: k. Per mole: R."}, {"ch": 2, "k": "example", "s": "Ch3 p.33 kinetic", "q": "What is the root mean square speed of hydrogen gas (M = 2.016 × 10⁻³ kg/mol) at 300 K? (R = 8.314 J mol⁻¹ K⁻¹)", "o": ["1.78 × 10³ m/s", "1.93 × 10³ m/s", "61 m/s", "1.57 × 10³ m/s"], "a": 1, "e": "U = √(3 × 8.314 × 300 ÷ 2.016 × 10⁻³) = 1.93 × 10³ m/s. 1.57 × 10³ is the most probable speed, 1.78 × 10³ the average speed, and 61 m/s comes from using M in g/mol instead of kg/mol.", "h": "⚠ TRAP: M must be in kg/mol with R = 8.314 J."}, {"ch": 2, "k": "example", "s": "Ch3 p.34 Boyle", "q": "A gas occupies 6.0 L at 2.0 atm. At constant temperature, its volume at 3.0 atm is:", "o": ["0.25 L", "4.0 L", "9.0 L", "1.0 L"], "a": 1, "e": "P₁V₁ = P₂V₂, so V₂ = 6.0 × 2.0 ÷ 3.0 = 4.0 L. The pressure goes up, so the volume must go down; 9.0 L comes from inverting the ratio.", "h": "P up = V down. Check your answer goes the right way."}, {"ch": 2, "k": "example", "s": "Ch3 p.35 Charles", "q": "A gas has a volume of 2.0 L at 27°C. At constant pressure, its volume at 127°C is:", "o": ["4.0 L", "2.7 L", "1.5 L", "9.4 L"], "a": 1, "e": "Convert: 27°C = 300 K and 127°C = 400 K. V₂ = 2.0 × 400 ÷ 300 = 2.67 L. Using °C directly gives 9.4 L; doubling the temperature in °C does not double the volume.", "h": "⚠ TRAP: gas laws need kelvin."}, {"ch": 2, "k": "example", "s": "Ch3 p.36 Example 1", "q": "10.0 L of a gas has a pressure of 0.7 atm and a temperature of 23°C. What will the volume be if the pressure is increased to 1.4 atm and the temperature to 380 K?", "o": ["25.7 L", "5.00 L", "6.42 L", "82.6 L"], "a": 2, "e": "T₁ = 23 + 273 = 296 K. V₂ = 0.7 × 10.0 × 380 ÷ (296 × 1.4) = 6.42 L (the book gets 6.4189 L). Inverting the pressure ratio gives 25.7 L; ignoring temperature gives 5.00 L; forgetting to convert 23°C gives 82.6 L.", "h": "⚠ TRAP: convert 23°C to 296 K."}, {"ch": 2, "k": "example", "s": "Ch3 p.36 combined", "q": "5.0 L of gas at 1.0 atm and 27°C is changed to 2.0 atm and 127°C. The new volume is:", "o": ["1.3 L", "3.3 L", "1.9 L", "13.3 L"], "a": 1, "e": "V₂ = 5.0 × 1.0 × 400 ÷ (300 × 2.0) = 3.33 L. Pressure doubling halves V and the temperature rise increases it by 4/3.", "h": "Double P halves V."}, {"ch": 2, "k": "example", "s": "Ch3 p.36 Gay-Lussac", "q": "A sealed rigid container holds gas at 2.0 atm and 27°C. The pressure when it is heated to 127°C is:", "o": ["2.7 atm", "2.0 atm", "9.4 atm", "1.5 atm"], "a": 0, "e": "Volume is fixed, so P₂ = 2.0 × 400 ÷ 300 = 2.67 atm.", "h": "Heating a rigid can raises P."}, {"ch": 2, "k": "example", "s": "Ch3 p.37 Avogadro", "q": "At constant temperature and pressure, 3.0 L of a gas holds 0.5 mol. How many moles are in 6.0 L of the same gas?", "o": ["1.0 mol", "2.0 mol", "0.25 mol", "0.75 mol"], "a": 0, "e": "V ∝ n, so doubling the volume doubles the moles: 0.5 × 6.0 ÷ 3.0 = 1.0 mol.", "h": "V ∝ n."}, {"ch": 2, "k": "example", "s": "Ch3 p.37 Graham", "q": "How many times faster does hydrogen (M = 2) diffuse than oxygen (M = 32) under the same conditions?", "o": ["4 times", "8 times", "2 times", "16 times"], "a": 0, "e": "r(H₂)/r(O₂) = √(32/2) = √16 = 4. Forgetting the square root gives 16.", "h": "⚠ TRAP: take the square root."}, {"ch": 2, "k": "example", "s": "Ch3 p.37 Graham", "q": "Helium (M = 4) and methane (M = 16) are allowed to effuse under the same conditions. The rate of helium compared with methane is:", "o": ["1.4 times as fast", "half as fast", "4 times as fast", "2 times as fast"], "a": 3, "e": "r(He)/r(CH₄) = √(16/4) = 2. The lighter gas is faster.", "h": "Lighter gas on top: √(M_heavy/M_light)."}, {"ch": 2, "k": "example", "s": "Ch3 p.37 Graham", "q": "An unknown gas effuses 3 times more slowly than hydrogen (M = 2) under the same conditions. Its molar mass is:", "o": ["9", "18", "6", "54"], "a": 1, "e": "r(H₂)/r(X) = √(M_X/2) = 3, so M_X = 2 × 9 = 18. Using 3 × 2 = 6 forgets to square.", "h": "Slower by n = heavier by n²."}, {"ch": 2, "k": "example", "s": "Ch3 p.38 Dalton", "q": "A vessel holds 2.0 mol of H₂ and 3.0 mol of N₂ at a total pressure of 5.0 atm. The partial pressure of N₂ is:", "o": ["2.5 atm", "2.0 atm", "3.0 atm", "1.5 atm"], "a": 2, "e": "Mole fraction of N₂ = 3.0 ÷ 5.0 = 0.60. Partial pressure = 0.60 × 5.0 = 3.0 atm.", "h": "x = part ÷ whole."}, {"ch": 2, "k": "example", "s": "Ch3 p.38 Dalton", "q": "A gas mixture has partial pressures of 0.50 atm (O₂), 0.30 atm (N₂) and 0.20 atm (Ar). The total pressure is:", "o": ["1.50 atm", "1.00 atm", "0.03 atm", "0.33 atm"], "a": 1, "e": "Add them: 0.50 + 0.30 + 0.20 = 1.00 atm.", "h": "Dalton = just add."}, {"ch": 2, "k": "example", "s": "Ch3 p.38 Example", "q": "Hydrogen collected over water has a volume of 453 mL at 18°C and 780 mmHg. Using the book's method (P₁V₁/T₁ = P₂V₂/T₂, STP = 273 K and 760 mmHg), the dry volume at STP is:", "o": ["496 mL", "436 mL", "425 mL", "414 mL"], "a": 1, "e": "V₂ = 780 × 453 × 273 ÷ (291 × 760) = 436 mL. Flipping the temperature ratio gives 496 mL; ignoring the pressure ratio gives 425 mL. In a fuller treatment you would first subtract the water vapour pressure.", "h": "⚠ TRAP: °C → K, and put T₂ on top."}, {"ch": 2, "k": "example", "s": "Ch3 p.39 ideal", "q": "What amount of gas, in moles, is in 2.46 L at 1.0 atm and 300 K? (R = 0.082 L atm mol⁻¹ K⁻¹)", "o": ["10 mol", "0.010 mol", "0.10 mol", "1.0 mol"], "a": 2, "e": "n = PV ÷ RT = (1.0 × 2.46) ÷ (0.082 × 300) = 0.10 mol.", "h": "n = PV/RT."}, {"ch": 2, "k": "example", "s": "Ch3 p.39 ideal", "q": "The pressure of 0.50 mol of gas in a 10.0 L container at 27°C is: (R = 0.082 L atm mol⁻¹ K⁻¹)", "o": ["0.15 atm", "12.3 atm", "0.0041 atm", "1.23 atm"], "a": 3, "e": "P = nRT ÷ V = 0.50 × 0.082 × 300 ÷ 10.0 = 1.23 atm. Using 27 in place of 300 gives 0.11 atm.", "h": "Temperature in kelvin, always."}, {"ch": 2, "k": "example", "s": "Ch3 p.39 ideal", "q": "The volume of 2.0 mol of gas at 1.0 atm and 300 K is: (R = 0.082 L atm mol⁻¹ K⁻¹)", "o": ["0.16 L", "4.9 L", "12 L", "49 L"], "a": 3, "e": "V = nRT ÷ P = 2.0 × 0.082 × 300 ÷ 1.0 = 49 L.", "h": "V = nRT/P."}, {"ch": 2, "k": "example", "s": "Ch3 p.39 STP", "q": "What volume does 0.50 mol of an ideal gas occupy at STP, taking 22.4 L/mol?", "o": ["22.4 L", "44.8 L", "5.6 L", "11.2 L"], "a": 3, "e": "0.50 × 22.4 = 11.2 L.", "h": "Moles × 22.4."}, {"ch": 2, "k": "example", "s": "Ch3 p.39 STP", "q": "How many moles of gas are in 44.8 L at STP (22.4 L/mol)?", "o": ["2.0 mol", "4.0 mol", "1.0 mol", "0.50 mol"], "a": 0, "e": "44.8 ÷ 22.4 = 2.0 mol.", "h": "Litres ÷ 22.4."}, {"ch": 2, "k": "example", "s": "Ch3 p.39-40 Example", "q": "The density of a gaseous compound is 340 g/L at 45°C and 1.7 atm. Using R = 0.082 L atm mol⁻¹ K⁻¹, its molar mass is:", "o": ["521.5 g/mol", "738 g/mol", "5215 g/mol", "1.92 × 10⁻⁴ g/mol"], "a": 2, "e": "T = 318 K. M = dRT ÷ P = 340 × 0.082 × 318 ÷ 1.7 = 5215 g/mol. Using 45 in place of 318 gives 738. The book's printed working uses 1.74 atm, which does not match the question; the corrected note on the page gives 5215.", "h": "⚠ TRAP: °C → K, then M = dRT/P."}, {"ch": 2, "k": "exercise", "s": "Ch3 p.40 Exercise", "q": "A compound X with density 8.9 g/L is made at 60°C and 2.73 atm. Using R = 0.082 L atm mol⁻¹ K⁻¹, its molar mass is:", "o": ["663 g/mol", "0.89 g/mol", "16 g/mol", "89 g/mol"], "a": 3, "e": "T = 333 K. M = dRT ÷ P = 8.9 × 0.082 × 333 ÷ 2.73 = 89 g/mol. Using 60 in place of 333 gives 16, and multiplying by P instead of dividing gives 663.", "h": "M = dRT/P with T in kelvin."}, {"ch": 2, "k": "example", "s": "Ch3 p.39 density", "q": "A gas has a density of 1.43 g/L at 1.0 atm and 273 K. Using R = 0.082 L atm mol⁻¹ K⁻¹, its molar mass is about:", "o": ["64 g/mol", "0.31 g/mol", "32 g/mol", "16 g/mol"], "a": 2, "e": "M = 1.43 × 0.082 × 273 ÷ 1.0 = 32.0 g/mol. This is oxygen.", "h": "Density × 22.4 ≈ molar mass at STP."}, {"ch": 2, "k": "concept", "s": "Ch3 p.31 text", "q": "Which four states of matter are observable in everyday life, according to the book?", "o": ["Solid, gas, plasma and condensate", "Solid, liquid, plasma and crystal", "Solid, liquid, gas and plasma", "Solid, liquid, gas and vapour"], "a": 2, "e": "The book lists solid, liquid, gas and plasma. Plasma is the one many students forget.", "h": "Four states: S, L, G, P."}, {"ch": 2, "k": "concept", "s": "Ch3 p.31 text", "q": "Which state of matter is the most common form of visible matter in the universe?", "o": ["Solid", "Gas", "Liquid", "Plasma"], "a": 3, "e": "Plasma holds neutral atoms plus a large number of free ions and electrons, and stars are made of it.", "h": "Stars = plasma."}, {"ch": 2, "k": "trap", "s": "Ch3 p.31 text", "q": "Matter in the liquid state has:", "o": ["a fixed volume but a variable shape that fits its container", "a fixed shape and a fixed volume that never change", "a variable volume but a fixed shape of its own", "a variable volume and a variable shape like a gas"], "a": 0, "e": "Liquid particles are close but free to move, so volume is fixed and shape follows the container. Solids fix both; gases and plasma fix neither.", "h": "⚠ TRAP: liquid = fixed volume, free shape."}, {"ch": 2, "k": "concept", "s": "Ch3 p.31 text", "q": "A solid has:", "o": ["a fixed volume and shape, with particles close together and held in place", "a variable volume, with particles that move around freely", "a fixed shape but no fixed volume, with particles far apart", "a fixed volume but a variable shape, with particles moving freely"], "a": 0, "e": "The particles in a solid are fixed in position.", "h": "Solid = fixed both."}, {"ch": 2, "k": "concept", "s": "Ch3 p.31 text", "q": "The term \"phase\" is sometimes used as a synonym for state of matter, but a system can contain:", "o": ["only one phase at a time, whatever the substances", "only phases that mix together completely", "several immiscible phases of the same state of matter", "phases that are always gases and nothing else"], "a": 2, "e": "Oil and water are both liquids, but they form two separate phases.", "h": "Oil + water = 2 liquid phases."}, {"ch": 2, "k": "concept", "s": "Ch3 p.32 gases", "q": "Which of these is NOT listed as a basic physical property of gases?", "o": ["Expansion", "Compression", "Diffusion", "Fixed shape"], "a": 3, "e": "Gases expand to fill their container, can be compressed, diffuse and have low density. They have no fixed shape.", "h": "Gas = no fixed shape or volume."}, {"ch": 2, "k": "concept", "s": "Ch3 p.32 gases", "q": "The volume of a gas is equal to:", "o": ["the volume of its container", "the volume of the atmosphere", "twice the volume of the container", "the volume of the gas molecules only"], "a": 0, "e": "A gas fills whatever space it is put into.", "h": "Gas volume = container volume."}, {"ch": 2, "k": "concept", "s": "Ch3 p.32 units", "q": "Gas pressure in a container is measured with a manometer, while atmospheric pressure is measured with a:", "o": ["barometer", "thermometer", "calorimeter", "hydrometer"], "a": 0, "e": "The book separates the two instruments.", "h": "Manometer = gas. Barometer = air."}, {"ch": 2, "k": "concept", "s": "Ch3 p.32 units", "q": "Which of the following correctly equals 1 atm?", "o": ["76 mmHg", "7.6 mmHg", "1000 mmHg", "760 mmHg"], "a": 3, "e": "1 atm = 760 mmHg = 760 torr = 101.325 kPa = 101 325 Pa = 1.01325 bar.", "h": "1 atm = 760 mmHg = 101.3 kPa."}, {"ch": 2, "k": "concept", "s": "Ch3 p.32 units", "q": "1 bar is equal to:", "o": ["10⁵ Pa", "101 325 Pa", "10³ Pa", "760 Pa"], "a": 0, "e": "1 bar = 10⁵ Pa, slightly less than 1 atm (101 325 Pa).", "h": "⚠ TRAP: bar ≠ atm."}, {"ch": 2, "k": "trap", "s": "Ch3 p.32 temp", "q": "The SI unit of temperature is the kelvin, and the book converts °C to K using:", "o": ["T(K) = t°C − 273", "T(K) = t°C ÷ 273", "T(K) = t°C + 273", "T(K) = t°C × 273"], "a": 2, "e": "Add 273. For example 23°C becomes 296 K.", "h": "⚠ TRAP: never use °C in gas laws."}, {"ch": 2, "k": "trap", "s": "Ch3 p.32 temp", "q": "The book states that STP stands for 273.15 K (0°C) and a pressure of:", "o": ["1 bar (10⁵ Pa), where the molar volume of an ideal gas is 22.71 L/mol", "1 bar (10⁵ Pa), where the molar volume is 22.4 L/mol", "1 atm (101 325 Pa), where the molar volume is 22.71 L/mol", "1 mmHg, where the molar volume is 22.71 L/mol"], "a": 0, "e": "With 1 bar the molar volume is 22.71 L. The commonly used 22.4 L/mol belongs to 1 atm. Know which pressure your question uses.", "h": "⚠ TRAP: 22.4 L at 1 atm, 22.71 L at 1 bar."}, {"ch": 2, "k": "concept", "s": "Ch3 p.33 kinetic", "q": "Which statement is NOT an assumption of the kinetic theory of gases?", "o": ["Collisions between molecules are perfectly elastic", "The volume of the molecules is negligible compared with the volume of the gas", "Gas molecules attract one another strongly", "Gas molecules are in continuous random motion"], "a": 2, "e": "The theory says there are no attractive forces between gas molecules.", "h": "Ideal gas: no attraction."}, {"ch": 2, "k": "concept", "s": "Ch3 p.33 kinetic", "q": "According to the kinetic theory, the pressure of a gas is caused by:", "o": ["molecules attracting each other", "molecules bombarding the walls of the container", "the chemical reactions between molecules", "the weight of the gas"], "a": 1, "e": "Each collision with the wall pushes on it, and together they make up the pressure.", "h": "Pressure = wall collisions."}, {"ch": 2, "k": "concept", "s": "Ch3 p.33 kinetic", "q": "The average kinetic energy of gas molecules is directly proportional to the:", "o": ["mass of the container", "volume of the gas", "pressure of the gas", "absolute temperature"], "a": 3, "e": "KE = (3/2)RT per mole, so doubling the temperature in kelvin doubles the KE.", "h": "KE ∝ T (kelvin)."}, {"ch": 2, "k": "concept", "s": "Ch3 p.33 kinetic", "q": "The Boltzmann constant k is the gas constant per molecule, k = R/N, and its value is:", "o": ["6.02 × 10²³ J K⁻¹", "1.38 × 10⁻²³ J K⁻¹", "1.38 × 10²³ J K⁻¹", "8.314 J K⁻¹"], "a": 1, "e": "k = 8.314 ÷ 6.022 × 10²³ = 1.38 × 10⁻²³ J/K.", "h": "k is tiny (10⁻²³)."}, {"ch": 2, "k": "trap", "s": "Ch3 p.33 kinetic", "q": "For the speeds of gas molecules, which order is correct?", "o": ["root mean square < average < most probable", "most probable < average < root mean square", "most probable = average = root mean square", "average < most probable < root mean square"], "a": 1, "e": "Their formulas are √(2RT/M), √(8RT/πM) and √(3RT/M), which are in the ratio about 1 : 1.13 : 1.22.", "h": "2, 8/π, 3: smallest to biggest."}, {"ch": 2, "k": "concept", "s": "Ch3 p.33 kinetic", "q": "The root mean square velocity of gas molecules is given by:", "o": ["U = √(2RT/M)", "U = √(RT/3M)", "U = √(3RT/M)", "U = √(8RT/πM)"], "a": 2, "e": "√(2RT/M) is the most probable speed and √(8RT/πM) is the average speed.", "h": "rms has the 3."}, {"ch": 2, "k": "concept", "s": "Ch3 p.34 Boyle", "q": "Boyle's law states that, at constant temperature, the volume of a fixed mass of gas is:", "o": ["inversely proportional to its pressure", "directly proportional to its temperature", "directly proportional to its pressure", "independent of its pressure"], "a": 0, "e": "V ∝ 1/P, so PV = constant. Robert Boyle stated this in 1661.", "h": "Boyle: P up, V down."}, {"ch": 2, "k": "concept", "s": "Ch3 p.34 Boyle", "q": "Boyle's law strictly applies to ideal gases at:", "o": ["very low temperatures, close to the point of liquefaction", "very low pressures, where molecular collisions and interactions are few", "very high pressures, where the molecules are crowded close", "any pressure and any temperature whatsoever"], "a": 1, "e": "At low pressure, molecules are far apart, so they behave ideally.", "h": "Ideal = low P, high T."}, {"ch": 2, "k": "concept", "s": "Ch3 p.34 Fig 11", "q": "The graph of volume against pressure for a fixed mass of gas at constant temperature (Boyle's law) is:", "o": ["a straight horizontal line parallel to the axis", "a straight line rising upwards from the origin", "a straight line falling downwards to zero volume", "a curve that falls steeply and then flattens out"], "a": 3, "e": "Since V = k/P, the plot of V against P is a curve, not a straight line.", "h": "V vs P = curve; V vs 1/P = straight line.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAHVArcDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAEGAwQFAgcI/8QAUBAAAQQCAAQDBQQHAQsMAAcAAQACAwQFEQYSITETQVEUImFxgQcVMpEWI0JSobHBYhckJzNDRGNyc7LRJSY0NlRkdIKDkuHwNTdTlKKzwv/EABUBAQEAAAAAAAAAAAAAAAAAAAAB/8QAFhEBAQEAAAAAAAAAAAAAAAAAABEB/9oADAMBAAIRAxEAPwD6qiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiCD2VQ4ejszcaZy7ZqWImOayKu+WItaWt6HRI8z1VvTQQc/OVfasXYZ40sREbnc0TuU9B236LncAvdJwhjXSOLnGLqSdnuV1MtVnu0Za0Fk1nSjlMgYHEDz6FavDGGlwWNbRdbNmKL/FbYGlo9OndBX+HeG7cXE+SuXgRTZakmqsOvfe/u76DoFn+0msXYUWWzTNdHNEAxryGnbwOo8/qrhpcPifBSZ+uyt7dJWgDg5zWMB5iDsdT27IO1H/i2776XpYKUcsNdkc0xne0aMhaG830C2EHFvcNV71t9iW3faXnfJHaexo+QBWD9D8dzBzpb7tEHTrkhH81YUQQBoLmcS1rN3BXatLXtE0RYzZ  region of:", "o": ["higher temperature to lower temperature only", "higher concentration to a region of lower concentration", "lower concentration to higher concentration", "lower pressure to higher pressure only"], "a": 1, "e": "Molecules migrate by random motion until they are evenly spread.", "h": "Diffusion goes downhill in concentration."}, {"ch": 2, "k": "concept", "s": "Ch3 p.37 effusion", "q": "Effusion is best described as:", "o": ["the condensation of a gas on a cold surface", "the escape of gas molecules through a small hole", "the mixing of two gases by random motion", "the dissolving of a gas into a liquid solvent"], "a": 1, "e": "Effusion is related to diffusion but happens through an orifice or pinhole.", "h": "Effusion = pinhole."}, {"ch": 2, "k": "concept", "s": "Ch3 p.37 Graham", "q": "Graham's law states that, at constant temperature and pressure, the rates of diffusion of gases are:", "o": ["directly proportional to the square roots of their densities", "inversely proportional to their densities", "directly proportional to their densities", "inversely proportional to the square roots of their densities"], "a": 3, "e": "Lighter gases move faster. r₁/r₂ = √d₂/√d₁ = √M₂/√M₁.", "h": "Light = fast. Square root on both."}, {"ch": 2, "k": "concept", "s": "Ch3 p.37 Dalton", "q": "Dalton's law of partial pressures says that the total pressure of a mixture of non-reacting gases is:", "o": ["the sum of the individual partial pressures", "equal to the largest single partial pressure", "the product of the individual partial pressures", "the average of the individual partial pressures"], "a": 0, "e": "P_T = p₁ + p₂ + p₃ + ... It only works for gases that do not react.", "h": "Dalton = add."}, {"ch": 2, "k": "concept", "s": "Ch3 p.38 Dalton", "q": "The partial pressure of a gas in a mixture equals:", "o": ["its mass fraction divided by the total pressure", "the total pressure divided by the number of gases", "its mole fraction multiplied by the total pressure", "its mole fraction divided by the total pressure"], "a": 2, "e": "p = x × P_T.", "h": "p = x · P."}, {"ch": 2, "k": "concept", "s": "Ch3 p.38 ideal", "q": "The ideal gas equation is derived by combining:", "o": ["Boyle's, Dalton's and Graham's laws", "Boyle's, Gay-Lussac's and Dalton's laws", "Boyle's, Charles' and Avogadro's laws", "Charles', Graham's and Dalton's laws"], "a": 2, "e": "V ∝ 1/P, V ∝ T and V ∝ n together give V ∝ nT/P, and with R this becomes PV = nRT.", "h": "Boyle + Charles + Avogadro = PV = nRT."}, {"ch": 2, "k": "concept", "s": "Ch3 p.39 ideal", "q": "The value of the gas constant R used in the book is:", "o": ["0.082 L atm mol K", "0.82 L atm mol⁻¹ K⁻¹", "8.2 L atm mol⁻¹ K⁻¹", "0.082 L atm mol⁻¹ K⁻¹"], "a": 3, "e": "The book gets it from 1 atm × 22.4 L ÷ (1 mol × 273 K) = 0.082.", "h": "R = 0.082 with litres and atm."}, {"ch": 2, "k": "concept", "s": "Ch3 p.39 density", "q": "Which equation correctly links the molar mass of an ideal gas to its density d, pressure P and temperature T?", "o": ["M = dP/RT", "M = PRT/d", "M = d/(RTP)", "M = dRT/P"], "a": 3, "e": "From PV = (m/M)RT and d = m/V we get P = dRT/M, so M = dRT/P.", "h": "M = dRT over P."}, {"ch": 2, "k": "concept", "s": "Ch3 p.40 real gas", "q": "Real gases deviate most from ideal behaviour at:", "o": ["high pressure and high temperature", "low pressure and low temperature", "high pressure and low temperature", "low pressure and high temperature"], "a": 2, "e": "At high pressure the molecules are crowded and at low temperature they are slow, so attraction and molecular volume matter.", "h": "Ideal: low P, high T. Real: high P, low T."}, {"ch": 2, "k": "concept", "s": "Ch3 p.40 real gas", "q": "Which is a difference between an ideal gas and a real gas?", "o": ["A real gas has molecules with volume that attract each other", "Collisions in a real gas are perfectly elastic ones", "An ideal gas has attractive forces between its molecules", "A real gas obeys the equation PV = nRT exactly"], "a": 0, "e": "Ideal gas: negligible molecular volume, no attraction, elastic collisions. A real gas fails on these points.", "h": "Real gas: volume + attraction."}, {"ch": 2, "k": "concept", "s": "Ch3 p.40 Z", "q": "The compressibility factor of a gas is defined as:", "o": ["Z = PV × nRT", "Z = nRT/PV", "Z = PV/nRT", "Z = P/nRTV"], "a": 2, "e": "For an ideal gas Z = 1. For a real gas Z ≠ 1.", "h": "Z = PV/nRT."}, {"ch": 2, "k": "trap", "s": "Ch3 p.40 Z", "q": "A gas with Z < 1 shows:", "o": ["negative deviation, and is more compressible than an ideal gas", "positive deviation, and is more compressible than an ideal gas", "no deviation from ideal behaviour", "negative deviation, and is less compressible than an ideal gas"], "a": 0, "e": "Z < 1 = negative deviation (more compressible). Z > 1 = positive deviation (less compressible).", "h": "⚠ TRAP: Z < 1 means MORE compressible."}, {"ch": 2, "k": "concept", "s": "Ch3 p.40 factors", "q": "Which type of gas shows the larger deviation from ideal behaviour?", "o": ["A gas that does not dissolve in water", "A gas that is very light and hard to liquefy", "A gas that is easily liquefiable and highly soluble", "A gas with the smallest molecules"], "a": 2, "e": "Gases that liquefy easily have stronger attractions, so they stray further from ideal.", "h": "Easy to liquefy = more non-ideal."}, {"ch": 2, "k": "concept", "s": "Ch3 p.41 factors", "q": "Which gases always show positive deviation at 0°C?", "o": ["Carbon dioxide and nitrogen", "Oxygen and chlorine", "Hydrogen and helium", "Ammonia and sulphur dioxide"], "a": 2, "e": "H₂ and He are very small and weakly attracted, so they show positive deviation (Z > 1).", "h": "H₂ and He = positive."}, {"ch": 2, "k": "concept", "s": "Ch3 p.41 factors", "q": "Carbon dioxide and nitrogen show:", "o": ["positive deviation at low pressure and negative deviation at high pressure", "negative deviation at low pressure and positive deviation at high pressure", "positive deviation at all pressures", "negative deviation at all pressures"], "a": 1, "e": "At low pressure, attraction dominates. At high pressure, the molecules' own volume dominates.", "h": "Low P attraction, high P size."}, {"ch": 2, "k": "concept", "s": "Ch3 p.41 vdW", "q": "In the van der Waals equation, the volume term is corrected to (V − nb) because:", "o": ["gas molecules attract one another strongly", "the temperature changes the volume of the container", "gas molecules have no mass of their own", "the molecules themselves occupy volume not free for movement"], "a": 3, "e": "b is the extended volume of the molecules for each mole of gas. It is subtracted from the container volume.", "h": "b subtracts volume."}, {"ch": 2, "k": "concept", "s": "Ch3 p.41 vdW", "q": "In the van der Waals equation, the pressure is corrected by adding an²/V² because:", "o": ["the molecules collide in an inelastic way", "the walls of the vessel add extra pressure of their own", "the molecules are bigger than the whole container", "attraction between molecules lowers the pressure on the walls"], "a": 3, "e": "A molecule about to strike the wall is pulled inwards by the others, so the measured pressure is less than the ideal pressure.", "h": "a corrects for attraction."}, {"ch": 2, "k": "trap", "s": "Ch3 p.42 vdW", "q": "The van der Waals equation for n moles of gas is:", "o": ["(P + an²/V²)(V + nb) = nRT", "(P − an²/V²)(V − nb) = nRT", "(P − an²/V²)(V + nb) = nRT", "(P + an²/V²)(V − nb) = nRT"], "a": 3, "e": "Add to the pressure, subtract from the volume. Remember the real pressure is lower, so the ideal one is bigger; the real volume is bigger, so subtract nb.", "h": "⚠ TRAP: P plus, V minus."}, {"ch": 2, "k": "concept", "s": "Ch3 p.42 vdW", "q": "In the van der Waals equation, the constants a and b:", "o": ["equal 1 for an ideal gas", "are the gas constant and Avogadro's number", "are characteristic of each gas", "are the same for all gases"], "a": 2, "e": "Each gas has its own a (attraction) and b (molecular volume).", "h": "a = attraction, b = bulk."}, {"ch": 3, "k": "example", "s": "Ch4 p.43-44 Example 1a", "q": "Given Cu = 63.55 g/mol, calculate the mass of 0.0892 mol of Cu.", "o": ["712 g", "5.67 g", "0.0014 g", "0.567 g"], "a": 1, "e": "mass = n × M = 0.0892 mol × 63.55 g/mol = 5.6687 g ≈ 5.67 g (book: 5.6687 g). Dividing n by M gives 1.40e-03 (wrong: that is mol²/g), and M/n gives 712 g (inverted). The last option is a decimal-place slip.", "h": "m = n × M. Moles × grams-per-mole: the 'mol' cancels and leaves grams."}, {"ch": 3, "k": "example", "s": "Ch4 p.44 Example 1b", "q": "Given Cu = 63.55 g/mol, how many moles of Cu are present in a 72.5 g sample?", "o": ["1.141 mol", "0.8766 mol", "0.114 mol", "4607 mol"], "a": 0, "e": "n = m/M = 72.5 g ÷ 63.55 g/mol = 1.1408 mol (book: 1.1408 mol; rounding gives 1.141). Multiplying 72.5 × 63.55 = 4607 or inverting to M/m = 0.8766 are the usual slips.", "h": "n = m/M. Mass bigger than molar mass → answer must be MORE than 1 mol. Quick sanity check."}, {"ch": 3, "k": "example", "s": "Ch4 p.44 Example 1c", "q": "Given Cu = 63.55 g/mol and N = 6.022×10²³ mol⁻¹, calculate the mass of a sample of Cu containing 2.00×10¹⁶ atoms of Cu.", "o": ["7.65×10⁴¹ g", "21.1 g", "2.11×10⁻⁶ g", "5.23×10⁻¹⁰ g"], "a": 2, "e": "mass = (N atoms/N_A) × M = (2.00×10¹⁶ / 6.022×10²³) × 63.55 = 2.111e-06 g. The book prints 21.1059 g, but that value is what you get for 2.00×10²³ atoms; for 10¹⁶ atoms the correct answer is 2.111e-06 g (book's printed answer is inconsistent with its own numbers). Multiplying by N_A instead of dividing, or dividing by M, gives absurd values.", "h": "⚠ TRAP: atoms → moles means DIVIDE by 6.022×10²³, then × molar mass. A few atoms can never weigh tens of grams."}, {"ch": 3, "k": "example", "s": "Ch4 p.44 Example 1c (variant matching book's answer)", "q": "Given Cu = 63.55 g/mol, calculate the mass of a sample of Cu containing 2.00×10²³ atoms of Cu.", "o": ["2.111 g", "1.895×10⁴⁵ g", "127.1 g", "21.11 g"], "a": 3, "e": "n = 2.00×10²³ / 6.022×10²³ = 0.3321 mol; m = 0.3321 × 63.55 = 21.11 g (this is the book's 21.1059 g worked answer). Wrong options come from a decimal-place slip, or multiplying instead of dividing by N_A.", "h": "atoms ÷ N_A = mol; mol × M = g."}, {"ch": 3, "k": "example", "s": "Ch4 p.44 Example 1d", "q": "Given Cu = 63.55 g/mol and N = 6.022×10²³ mol⁻¹, what is the mass of a single atom of Cu?", "o": ["3.827×10²⁵ g", "2.613×10⁻²⁶ g", "1.055×10⁻²¹ g", "1.055×10⁻²² g"], "a": 3, "e": "1 mol Cu (63.55 g) contains 6.022×10²³ atoms, so one atom = 63.55 / 6.022×10²³ = 1.0553e-22 g (book: 1.0553×10⁻²² g). Multiplying (63.55 × N_A) gives the mass of N_A² atoms; 1/(N_A × M) has wrong units.", "h": "Mass of ONE particle = M / N_A. Tiny answer (10⁻²² to 10⁻²⁴ g) is expected."}, {"ch": 3, "k": "example", "s": "Ch4 p.45 Example 2", "q": "Using N=14, H=1, S=32, O=16, what is the molar mass of ammonium sulphate, (NH₄)₂SO₄?", "o": ["128 g/mol", "132 g/mol", "84 g/mol", "114 g/mol"], "a": 1, "e": "(NH₄)₂SO₄ = 2N + 8H + S + 4O = 2(14) + 8(1) + 32 + 4(16) = 28 + 8 + 32 + 64 = 132 g/mol. 128 comes from counting only 4 H (ignoring the subscript outside the bracket applies to H too); 114 counts only one NH₄ group; 84 uses only one O.", "h": "⚠ TRAP: a subscript outside a bracket multiplies EVERY atom inside it: (NH₄)₂ = 2 N and 8 H."}, {"ch": 3, "k": "example", "s": "Ch4 p.45 Example 2", "q": "The molecular mass of (NH₄)₂SO₄ is 132 u. Which of these is the correct statement of its molar mass?", "o": ["132 u/mol", "132 g/mol", "132 g", "1.32×10² u"], "a": 1, "e": "Molecular mass is expressed in atomic mass units (a.m.u or u) for ONE molecule; molar mass is the mass in grams per mole. Same number, different units: 132 u and 132 g/mol. 132 g has no 'per mole'; u/mol is not the unit used.", "h": "Molecular mass → u (one molecule). Molar mass → g/mol (one mole)."}, {"ch": 3, "k": "example", "s": "Ch4 p.45-46 Example 3a", "q": "Calculate the number of SO₄²⁻ ions in a 150 g sample of H₂SO₄ (S = 32, H = 1, O = 16; N = 6.022×10²³ mol⁻¹).", "o": ["3.934×10²³ ions", "3.687×10²⁴ ions", "9.217×10²³ ions", "9.033×10²⁵ ions"], "a": 2, "e": "M(H₂SO₄) = 2 + 32 + 64 = 98 g/mol. n = 150/98 = 1.5306 mol. 1 mol H₂SO₄ gives 1 mol SO₄²⁻, so ions = 1.5306 × 6.022×10²³ = 9.2173e+23 (book: 9.2173×10²³). Inverting 98/150 gives 3.934e+23; 4 × is the number of O atoms, not sulphate ions.", "h": "Formula tells the ratio: one SO₄²⁻ per H₂SO₄, so ions = molecules."}, {"ch": 3, "k": "example", "s": "Ch4 p.46 Example 3b", "q": "What volume of HCl (d = 1.18 g/mL) contains 2.00 mol of Cl atoms? (H = 1, Cl = 35.5)", "o": ["83.8 mL", "30.08 mL", "60.17 mL", "61.86 mL"], "a": 2, "e": "1 mol HCl contains 1 mol Cl atoms, so 2.00 mol Cl = 2.00 mol HCl. Mass of Cl = 2 × 35.5 = 71.0 g, and since the book treats this as 71 g HCl (as given), volume = 71/1.18 = 60.1695 mL (book: 60.1695 mL). 30.08 uses only 1 mol; 83.8 multiplies by density instead of dividing; 61.86 uses 73 g (2 × 36.5). Note: strictly, 2 mol HCl weighs 73 g, but the book uses 71 g.", "h": "Volume = mass ÷ density. Mass bigger than volume when d > 1, so mL < g."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 1", "q": "Calculate the total number of Cl atoms in 150 mL of liquid CCl₄ (d = 1.589 g/mL; C = 12, Cl = 35.5; N = 6.022×10²³ mol⁻¹).", "o": ["9.320×10²³ atoms", "2.346×10²⁴ atoms", "5.741×10²⁶ atoms", "3.728×10²⁴ atoms"], "a": 3, "e": "mass = 150 × 1.589 = 238.35 g; M(CCl₄) = 12 + 4(35.5) = 154 g/mol; n = 1.5477 mol; each molecule has 4 Cl, so atoms = 1.5477 × 4 × 6.022×10²³ = 3.728e+24. Without the ×4 you count molecules (9.320e+23); skipping density (2.346e+24) treats mL as g; using mass × 4 × N_A forgets to divide by M.", "h": "⚠ TRAP: mL → g (× density) → mol (÷ M) → molecules (× N_A) → atoms (× atoms per molecule)."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 2", "q": "Find the mass of carbon in 300 g of sucrose, C₁₂H₂₂O₁₁ (C = 12, H = 1, O = 16).", "o": ["154.4 g", "126.3 g", "19.3 g", "10.5 g"], "a": 1, "e": "M = 12(12) + 22 + 11(16) = 342 g/mol. Mass fraction C = 144/342. Mass of C = 300 × 144/342 = 126.32 g. Using 12 instead of 144 forgets the 12 carbon atoms (10.53 g); dividing again by 12 gives moles-of-C-like value (10.53).", "h": "Mass of element = (total atoms × A_r ÷ M_r) × sample mass."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 3", "q": "Calculate the volume (mL) of aqueous 40% sucrose (density 0.911 g/mL) required to furnish 1.5 mol of C atoms (sucrose = C₁₂H₂₂O₁₁; C = 12, H = 1, O = 16). Take 40% as 40 g sucrose per 100 g solution.", "o": ["117.3 mL", "18.77 mL", "1408 mL", "46.93 mL"], "a": 0, "e": "1.5 mol C ÷ 12 = 0.125 mol sucrose; mass = 0.125 × 342 = 42.75 g. That is only 40% of the solution, so solution mass = 42.75/0.40 = 106.88 g; volume = 106.88/0.911 = 117.3 mL. Ignoring the 40% gives 46.9 mL; forgetting ÷12 gives 1408 mL; multiplying by 0.40 gives 18.8 mL.", "h": "⚠ TRAP: '40%' means only 40% of the solution mass is sucrose, so divide the sucrose mass by 0.40 before using density."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 4", "q": "Calculate the mass (g) of Ag in 3 atoms of Ag (Ag = 107.9; N = 6.022×10²³ mol⁻¹).", "o": ["5.375×10⁻²² g", "1.949×10²⁶ g", "1.792×10⁻²² g", "4.617×10⁻²⁶ g"], "a": 0, "e": "One atom = 107.9/6.022×10²³ = 1.7918e-22 g; 3 atoms = 5.3753e-22 g. Giving 1.792e-22 g is the mass of ONE atom. Multiplying by N_A gives a huge mass.", "h": "Particles → mass: (number × M) ÷ N_A."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 5", "q": "How many grams of Zn are there in 0.54 mol of Zn (Zn = 65.39)?", "o": ["35.3 g", "3.53 g", "0.00826 g", "121 g"], "a": 0, "e": "m = n × M = 0.54 × 65.39 = 35.31 g ≈ 35 g to 2 s.f. (data has 2 s.f.). 0.54/65.39 = 0.0083 (divided); 65.39/0.54 = 121.1 (inverted).", "h": "Mol → g: multiply by M."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 6", "q": "Compute the mass (g) of americium in 12 atoms of Am (Am = 243; N = 6.022×10²³ mol⁻¹).", "o": ["8.20×10⁻²⁶ g", "1.76×10²⁷ g", "4.84×10⁻²¹ g", "4.04×10⁻²² g"], "a": 2, "e": "m = (12 × 243)/6.022×10²³ = 4.842e-21 g. 4.035e-22 g is only one atom.", "h": "Always remember: atoms ÷ N_A first, then × M."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 7(i)", "q": "Calculate the number of moles of atoms in a 20 g sample of Ce (Ce = 140.1).", "o": ["7 mol", "2802 mol", "8.60×10²² mol", "0.143 mol"], "a": 3, "e": "n = 20/140.1 = 0.1428 mol ≈ 0.14 mol (2 s.f. data). 7.01 is the inverted ratio; 2802 multiplies; 8.60e+22 is the NUMBER of atoms, not moles.", "h": "mol = g ÷ M. 20 g ≪ 140 g, so the answer must be below 1 mol."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 7(ii)", "q": "Calculate the number of atoms in a 20 g sample of Ce (Ce = 140.1; N = 6.022×10²³ mol⁻¹).", "o": ["1.69×10²⁷ atoms", "0.143 atoms", "8.60×10²² atoms", "4.22×10²⁴ atoms"], "a": 2, "e": "n = 20/140.1 = 0.1428 mol; atoms = 0.1428 × 6.022×10²³ = 8.597e+22. The other values come from inverting n, multiplying by M, or stopping at moles.", "h": "g → mol → atoms: two steps, don't stop at moles."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.47 Exercise 8", "q": "How many silicon atoms are there in a silicon chip of mass 6.78 mg? (Si = 28.09; N = 6.022×10²³ mol⁻¹)", "o": ["1.45×10¹⁷ atoms", "1.45×10²⁰ atoms", "1.15×10²³ atoms", "1.45×10²³ atoms"], "a": 1, "e": "6.78 mg = 6.78×10⁻³ g; n = 6.78×10⁻³/28.09 = 2.414e-04 mol; atoms = 1.454e+20. Forgetting mg → g gives 1.45e+23 (1000× too large); multiplying by M gives 1.15e+23; using 10⁻⁶ (µg) gives 1.45e+17.", "h": "⚠ TRAP: convert mg → g (÷1000) BEFORE dividing by molar mass."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.47 Exercise 9(i)", "q": "A sample of cobalt contains 3.00×10²⁰ atoms. How many moles of Co is this? (N = 6.022×10²³ mol⁻¹)", "o": ["2.01×10³ mol", "1.81×10⁴⁴ mol", "4.98×10⁻⁴ mol", "0.0294 mol"], "a": 2, "e": "n = N/N_A = 3.00×10²⁰/6.022×10²³ = 4.982e-04 mol. 2.94e-02 is the mass in grams; multiplying by N_A or inverting gives nonsense.", "h": "n = N/N_A. For N ≪ N_A the moles are tiny."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.47 Exercise 9(ii)", "q": "A sample of cobalt contains 3.00×10²⁰ atoms. What is its mass? (Co = 58.93; N = 6.022×10²³ mol⁻¹)", "o": ["1.18×10⁵ g", "0.0294 g", "29.4 g", "4.98×10⁻⁴ g"], "a": 1, "e": "n = 4.982e-04 mol; m = n × M = 4.982e-04 × 58.93 = 0.0294 g ≈ 0.0294 g. 4.98e-04 is moles, not grams; 29.4 is a unit slip (that would be mg).", "h": "Particles → mol (÷N_A) → grams (×M)."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.47 Exercise 10", "q": "Determine the mass percent of sulphur in penicillin, C₁₄H₂₀N₂SO₄ (C = 12, H = 1, N = 14, S = 32, O = 16).", "o": ["11.43 %", "0.1026 %", "20.51 %", "10.26 %"], "a": 3, "e": "M = 14(12) + 20(1) + 2(14) + 32 + 4(16) = 168 + 20 + 28 + 32 + 64 = 312 g/mol. %S = 32/312 × 100 = 10.26 %. Dividing by the mass without S gives 11.43 %; omitting ×100 gives 0.1026; 64 is the wrong atomic count (2 S).", "h": "% by mass = (atoms × A_r ÷ M_r) × 100, with M_r of the WHOLE compound."}, {"ch": 3, "k": "example", "s": "Ch4 p.44 text (2 MgSO₄)", "q": "2 MgSO₄ is written for the amount of magnesium sulphate. How many MgSO₄ formula units/molecules does this represent?", "o": ["7.226×10²⁴ molecules", "3.011×10²³ molecules", "6.022×10²³ molecules", "1.204×10²⁴ molecules"], "a": 3, "e": "A coefficient 2 means 2 mol of MgSO₄ = 2 × 6.022×10²³ = 1.204e+24 molecules. One mole would be 6.022×10²³; ½ mol would be 3.011e+23.", "h": "Coefficient × N_A = number of particles."}, {"ch": 3, "k": "example", "s": "Ch4 p.44 text (½ O₂)", "q": "How many O₂ molecules are in ½ mol of O₂? (N = 6.022×10²³ mol⁻¹)", "o": ["3.011×10²³ molecules", "9.635×10²⁴ molecules", "6.022×10²³ molecules", "1.204×10²⁴ molecules"], "a": 0, "e": "½ × 6.022×10²³ = 3.011e+23 molecules. (The book writes '½ × 6.022 molecules' omitting the 10²³ - a typo.) 1.204e+24 would be the number of O ATOMS in 1 mol O₂ is 2 N_A, not here; 6.022e+23 is 1 mol.", "h": "½ mol → half of N_A."}, {"ch": 3, "k": "example", "s": "Ch4 p.44 Example 1d (variant)", "q": "Calculate the mass of one molecule of water, H₂O (H = 1, O = 16; N = 6.022×10²³ mol⁻¹).", "o": ["5.98×10⁻²³ g", "1.08×10²⁵ g", "2.99×10⁻²³ g", "9.23×10⁻²⁶ g"], "a": 2, "e": "M = 18 g/mol; one molecule = 18/6.022×10²³ = 2.989e-23 g. 18 × N_A is the mass of N_A² molecules; double is a mass of 2 molecules.", "h": "Mass of ONE particle = M / N_A."}, {"ch": 3, "k": "example", "s": "Ch4 p.44 Example 1b (variant)", "q": "How many moles are in 36.0 g of water, H₂O (H = 1, O = 16)?", "o": ["0.500 mol", "1.00 mol", "648 mol", "2.00 mol"], "a": 3, "e": "M(H₂O) = 18.0 g/mol; n = 36.0/18.0 = 2.00 mol. 0.500 is M/m (inverted); 648 is m × M; 1.00 is the mole count for 18 g.", "h": "n = m / M. 36 g is TWO times 18 g."}, {"ch": 3, "k": "example", "s": "Ch4 p.44 Example 1 (variant)", "q": "How many molecules are in 4.5 g of water? (H = 1, O = 16; N = 6.022×10²³ mol⁻¹)", "o": ["2.41×10²⁴ molecules", "1.51×10²³ molecules", "4.88×10²⁵ molecules", "4.52×10²³ molecules"], "a": 1, "e": "n = 4.5/18 = 0.25 mol; molecules = 0.25 × 6.022×10²³ = 1.506e+23. 4.517e+23 would be total ATOMS; the other two come from multiplying/inverting.", "h": "Molecules and atoms are different counts: ask which one is wanted."}, {"ch": 3, "k": "example", "s": "Ch4 p.45 Example 2 (variant)", "q": "What is the molar mass of aluminium sulphate, Al₂(SO₄)₃ (Al = 27, S = 32, O = 16)?", "o": ["278 g/mol", "342 g/mol", "150 g/mol", "246 g/mol"], "a": 1, "e": "Al₂(SO₄)₃ = 2(27) + 3(32) + 12(16) = 54 + 96 + 192 = 342. 150 uses a single SO₄ (54+96... Al₂SO₄ = 54+32+64); 278 uses (SO₄) counted with 3 S and 4 O only (278); 246 counts SO₄ as 3 × 64 = 192 wrongly with one S (246).", "h": "⚠ TRAP: subscript 3 outside bracket multiplies S AND all 4 O (12 O atoms)."}, {"ch": 3, "k": "example", "s": "Ch4 p.45 Example 2 (variant)", "q": "What is the molecular (formula) mass of calcium hydroxide, Ca(OH)₂ (Ca = 40, O = 16, H = 1)?", "o": ["41 u", "90 u", "57 u", "74 u"], "a": 3, "e": "Ca(OH)₂ = 40 + 2(16) + 2(1) = 74 u. 57 counts only one OH; 41 omits O; 90 treats OH as 2 O + ... incorrectly.", "h": "Bracket subscript multiplies both O and H."}, {"ch": 3, "k": "example", "s": "Ch4 p.45-46 Example 3a (variant)", "q": "Calculate the number of SO₄²⁻ ions in 49 g of H₂SO₄ (S = 32, H = 1, O = 16; N = 6.022×10²³ mol⁻¹).", "o": ["6.022×10²³ ions", "3.011×10²³ ions", "2.951×10²⁵ ions", "1.204×10²⁴ ions"], "a": 1, "e": "n = 49/98 = 0.500 mol; 1 mol H₂SO₄ gives 1 mol SO₄²⁻, so ions = 0.500 × 6.022×10²³ = 3.011e+23. 98/49 inverts the ratio; 4× counts O atoms; 49 × N_A forgets M.", "h": "49 g = half of 98 g → half a mole."}, {"ch": 3, "k": "example", "s": "Ch4 p.46 Example 3b (variant)", "q": "What volume of HCl (d = 1.18 g/mL) contains 3.00 mol of Cl atoms? Use the book's method (mass of Cl = mol × 35.5, then ÷ density).", "o": ["2.54 mL", "90.25 mL", "92.8 mL", "125.7 mL"], "a": 1, "e": "Mass = 3.00 × 35.5 = 106.5 g; V = 106.5/1.18 = 90.25 mL. 125.7 mL multiplies by density; 92.8 mL uses 36.5 g/mol; 2.54 divides mol by density.", "h": "Density = mass/volume → V = m/d."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 1 (variant)", "q": "How many Cl atoms are present in 0.50 mol of CCl₄? (N = 6.022×10²³ mol⁻¹)", "o": ["3.01×10²³ atoms", "2.41×10²⁴ atoms", "1.20×10²⁴ atoms", "1.51×10²⁴ atoms"], "a": 2, "e": "0.50 mol CCl₄ = 3.011e+23 molecules; 4 Cl per molecule gives 1.204e+24 Cl atoms. 3.011e+23 counts molecules; 1.506e+24 counts all atoms (C + 4 Cl).", "h": "Atoms of X = n × N_A × (number of X per formula)."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 2 (variant)", "q": "Find the mass of nitrogen in 300 g of ammonium sulphate, (NH₄)₂SO₄ (N = 14, H = 1, S = 32, O = 16).", "o": ["80.77 g", "63.64 g", "127.3 g", "31.82 g"], "a": 1, "e": "M = 132 g/mol; 2 N atoms contribute 28 g. Mass N = 300 × 28/132 = 63.64 g. Using only 14 forgets 2 N (31.82); dividing by the mass without N gives 80.77; halving gives 31.82.", "h": "Count atoms of the element, × A_r, ÷ M_r of the whole compound."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.47 Exercise 10 (variant)", "q": "What is the mass percent of nitrogen in (NH₄)₂SO₄ (N = 14, H = 1, S = 32, O = 16)?", "o": ["0.212 %", "26.9 %", "21.2 %", "10.6 %"], "a": 2, "e": "%N = 2(14)/132 × 100 = 21.21 %. 10.6 % counts one N; 26.9 % divides by the mass without N; 0.212 lacks ×100.", "h": "⚠ TRAP: two N atoms in (NH₄)₂; denominator is the whole compound."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.47 Exercise 10 (variant)", "q": "Determine the mass percent of sulphur in H₂SO₄ (H = 1, S = 32, O = 16).", "o": ["50 %", "48.48 %", "0.3265 %", "32.65 %"], "a": 3, "e": "M = 98; %S = 32/98 × 100 = 32.65 %. 48.48 % divides by the mass without S; 50 % divides by the O mass only; 0.3265 omits ×100.", "h": "Divide by the WHOLE molar mass."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.47 Exercise 9 (variant)", "q": "How many moles of atoms are in a sample containing 2.00×10²⁴ atoms? (N = 6.022×10²³ mol⁻¹)", "o": ["3.32 mol", "1.20×10⁴⁸ mol", "0.332 mol", "0.301 mol"], "a": 0, "e": "n = N/N_A = 2.00×10²⁴/6.022×10²³ = 3.32 mol. Inverting gives 0.301; the second option multiplies; 0.332 is a power-of-ten slip.", "h": "10²⁴ ≈ 10 × 10²³ → about 3.3 mol: quick mental check."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 5 (variant)", "q": "Calculate the mass of 2.50 mol of sodium, Na = 23.0 g/mol.", "o": ["9.2 g", "5.75 g", "57.5 g", "0.109 g"], "a": 2, "e": "m = n × M = 2.50 × 23.0 = 57.5 g. 9.20 is M/n; 0.109 is n/M; 5.75 is a decimal slip.", "h": "g = mol × g/mol."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.44 Example 1b (variant)", "q": "How many moles of copper are in 2.0 kg of Cu (Cu = 63.55 g/mol)?", "o": ["127 mol", "0.0318 mol", "0.0315 mol", "31.5 mol"], "a": 3, "e": "2.0 kg = 2000 g; n = 2000/63.55 = 31.5 mol. Using 2.0 g gives 0.031; multiplying gives 127; 0.032 is inverted.", "h": "⚠ TRAP: kg → g (×1000) before dividing by g/mol."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.47 Exercise 8 (variant)", "q": "How many gold atoms are in 15.0 mg of gold (Au = 197; N = 6.022×10²³ mol⁻¹)?", "o": ["4.59×10¹⁹ atoms", "7.61×10⁻⁵ atoms", "4.59×10²² atoms", "1.78×10²⁴ atoms"], "a": 0, "e": "15.0 mg = 0.0150 g; n = 0.0150/197 = 7.614e-05 mol; atoms = 4.585e+19. Without mg → g the answer is 1000× too large (4.59e+22); multiplying by M gives 1.8e+24; stopping at moles gives 7.61e-05.", "h": "mg → g first. Then n = m/M, then × N_A."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 1 (variant)", "q": "A bottle holds 0.500 mol of CCl₄ (C = 12, Cl = 35.5). What is the mass of the CCl₄?", "o": ["77.0 g", "154 g", "308 g", "38.5 g"], "a": 0, "e": "M(CCl₄) = 12 + 4(35.5) = 154 g/mol; m = 0.500 × 154 = 77.0 g. 154 g is the mass of 1 mol; 38.5 divides by 4 incorrectly; 308 is 2 mol.", "h": "Use the MOLES given, not 1 mol."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 3 (variant)", "q": "What mass of sucrose, C₁₂H₂₂O₁₁ (C = 12, H = 1, O = 16), contains 3.0 mol of C atoms?", "o": ["1026 g", "85.5 g", "432 g", "114 g"], "a": 1, "e": "3.0 mol C ÷ 12 = 0.25 mol sucrose; mass = 0.25 × 342 = 85.5 g. Multiplying 3 × 342 forgets the 12 C atoms per molecule.", "h": "Divide by atoms-per-formula to convert mol of an element into mol of compound."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.47 Exercise 9 (variant)", "q": "Given Co = 58.93 g/mol, what is the mass of 1.00×10²² atoms of Co? (N = 6.022×10²³ mol⁻¹)", "o": ["3.55×10⁴⁷ g", "0.979 g", "9.79×10⁻⁴⁵ g", "9.79 g"], "a": 1, "e": "m = (1.00×10²²/6.022×10²³) × 58.93 = 0.0166 mol × 58.93 = 0.979 g. The others multiply by N_A, invert, or are a power-of-ten slip.", "h": "10²² ≈ 1/60 of a mole → about 1/60 of M."}, {"ch": 3, "k": "exercise", "s": "Ch4 p.46 Exercise 5 (variant)", "q": "How many moles of Zn are in 10.0 g of Zn (Zn = 65.39)?", "o": ["0.153 mol", "9.21×10²² mol", "6.54 mol", "654 mol"], "a": 0, "e": "n = 10.0/65.39 = 0.1529 mol ≈ 0.153 mol. 6.54 is inverted; 654 is multiplied; the last is a number of atoms.", "h": "Mass less than M → under 1 mol."}, {"ch": 3, "k": "concept", "s": "Ch4 p.43-47 text", "q": "What is Avogadro's number as used in this course?", "o": ["6.022×10²³ grams per mole", "6.022×10⁻²³ particles per mole", "6.022×10²⁴ particles per mole", "6.022×10²³ particles per mole"], "a": 3, "e": "One mole of any particle contains exactly 6.022×10²³ of those particles (atoms, ions, molecules, electrons). It is a count, not a mass; the exponent is +23.", "h": "N = 6.022×10²³ mol⁻¹ — a NUMBER of particles, not a mass."}, {"ch": 3, "k": "concept", "s": "Ch4 p.43-47 text", "q": "Which statement about the mole is correct?", "o": ["One mole of gas always contains more particles than one mole of solid.", "One mole of any substance contains the same number of particles, 6.022×10²³.", "One mole of any substance has the same mass, equal to 6.022×10²³ g.", "One mole of an element has a mass of 1 g equal to its atomic number."], "a": 1, "e": "The mole is a counting unit like a dozen: same number of entities whatever the substance. The MASS of a mole differs (its molar mass in g/mol). Phase is irrelevant to the number of particles.", "h": "Same number, different masses."}, {"ch": 3, "k": "concept", "s": "Ch4 p.43-47 text", "q": "The Periodic Table lists copper as 63.55. What does this value mean?", "o": ["One mole (6.022×10²³ atoms) of Cu atoms has a mass of 63.55 g", "One mole of Cu atoms has a mass of 63.55 kg", "A mole of Cu contains 63.55 × 6.022×10²³ atoms", "One atom of Cu has a mass of exactly 63.55 g"], "a": 0, "e": "The Periodic Table gives the average molar mass: 63.55 g Cu = 1 mol = 6.022×10²³ atoms. The mass of a single atom is 63.55/6.022×10²³ ≈ 1.06×10⁻²² g.", "h": "Periodic Table number = g per mole (average of isotopes) = u per atom."}, {"ch": 3, "k": "concept", "s": "Ch4 p.43-47 text", "q": "Which of the following is the basis for measuring the amounts of reactants and products in a reaction?", "o": ["The gram, as the unit of reaction rate", "The atomic mass unit, as the reacting unit", "The litre, as the unit of volume of every reactant", "The mole, as the reacting unit of chemical species"], "a": 3, "e": "The book says the mole is the reacting unit of chemical species and so the basis on which reactant and product amounts are measured and monitored.", "h": "Mole = bridge between the microscopic and the lab balance."}, {"ch": 3, "k": "concept", "s": "Ch4 p.43-47 text", "q": "Which one is NOT an elementary entity that is quantified in moles, as listed in this chapter?", "o": ["A cup of rice", "Covalent molecules", "Dissolved ions", "Free electrons"], "a": 0, "e": "Scientists quantify elementary entities such as electrons, atoms, ions and molecules in moles. The cup of rice is only the everyday analogy (a cup holds about 2.0×10¹² grains) used to explain why we measure by a convenient group rather than counting.", "h": "Mole = a counting unit for tiny particles."}, {"ch": 3, "k": "trap", "s": "Ch4 p.43-47 text", "q": "How many oxygen ATOMS are in 1 mol of O₂ molecules? (N = 6.022×10²³ mol⁻¹)", "o": ["6.022×10²³ atoms", "3.011×10²³ atoms", "1.204×10²⁴ atoms", "9.635×10²⁴ atoms"], "a": 2, "e": "Each O₂ molecule has 2 atoms: 1 mol O₂ = 6.022×10²³ molecules = 1.204e+24 atoms. 6.022e+23 counts molecules, not atoms.", "h": "⚠ TRAP: molecules ≠ atoms. Multiply by atoms per molecule."}, {"ch": 3, "k": "trap", "s": "Ch4 p.43-47 text", "q": "How many hydrogen atoms are in 1.00 mol of H₂SO₄? (N = 6.022×10²³ mol⁻¹)", "o": ["4.215×10²⁴ atoms", "2.409×10²⁴ atoms", "6.022×10²³ atoms", "1.204×10²⁴ atoms"], "a": 3, "e": "1 mol H₂SO₄ has 2 mol H atoms: 2 × 6.022×10²³ = 1.204e+24. 6.022e+23 counts molecules; 2.409e+24 counts O atoms; 4.215e+24 counts all atoms.", "h": "⚠ TRAP: read the subscript on the SPECIFIC element asked about."}, {"ch": 3, "k": "trap", "s": "Ch4 p.43-47 text", "q": "How many atoms in total are in 0.500 mol of CO₂? (N = 6.022×10²³ mol⁻¹)", "o": ["9.033×10²³ atoms", "3.011×10²³ atoms", "1.807×10²⁴ atoms", "6.022×10²³ atoms"], "a": 0, "e": "0.500 mol CO₂ = 3.011e+23 molecules, each of 3 atoms (1 C + 2 O): total = 3 × 3.011e+23 = 9.033e+23 atoms. 3.011e+23 counts molecules; 6.022e+23 counts O atoms only; 1.807e+24 is for 1 mol.", "h": "Total atoms = molecules × atoms per formula."}, {"ch": 3, "k": "trap", "s": "Ch4 p.43-47 text", "q": "How many chloride ions are in 0.250 mol of MgCl₂? (N = 6.022×10²³ mol⁻¹)", "o": ["6.022×10²³ ions", "1.506×10²³ ions", "4.517×10²³ ions", "3.011×10²³ ions"], "a": 3, "e": "Each formula unit gives 2 Cl⁻: 0.250 × 2 = 0.500 mol Cl⁻ = 3.011e+23 ions. 1.506e+23 counts formula units; 4.517e+23 counts all ions (Mg²⁺ + 2 Cl⁻).", "h": "ions = moles × (ions per formula unit) × N_A."}, {"ch": 3, "k": "trap", "s": "Ch4 p.43-44 text", "q": "Which of these samples contains the GREATEST number of atoms? (C = 12, Cu = 63.55, Ag = 107.9, Ce = 140.1)", "o": ["10 g of C", "10 g of Ag", "10 g of Cu", "10 g of Ce"], "a": 0, "e": "Equal masses: the lightest atom gives the most moles. n(C) = 10/12 = 0.833 mol; Cu 0.157; Ag 0.093; Ce 0.071. So carbon has the most atoms.", "h": "⚠ TRAP: same MASS ≠ same number of atoms. Smaller molar mass → more atoms."}, {"ch": 3, "k": "trap", "s": "Ch4 p.43 text", "q": "Which of these contains the same number of particles as 1 mol of Cu atoms (63.55 g)? (H = 1, C = 12, O = 16)", "o": ["1.00 g of hydrogen gas, H₂, counting molecules", "44 g of carbon dioxide, counting every atom", "18 g of water, counting molecules", "18 g of water, counting every atom"], "a": 2, "e": "1 mol of Cu is 6.022×10²³ atoms. 18 g of water is 1 mol of molecules, so the same number of particles. If you count atoms, water gives 3 mol and CO₂ (44 g = 1 mol) also gives 3 mol of atoms. 1.00 g of H₂ is only 0.5 mol.", "h": "Always ask: am I counting molecules or atoms? 1 mol of a compound has 1 mol of molecules but more mol of atoms."}, {"ch": 3, "k": "concept", "s": "Ch4 p.44 solutions", "q": "A student calculates the number of particles in a sample of mass m (g) and molar mass M (g/mol). Which expression is correct?", "o": ["N = (m / M) × 6.022×10²³", "N = (m × M) × 6.022×10²³", "N = (M / m) × 6.022×10²³", "N = (m / M) ÷ 6.022×10²³"], "a": 0, "e": "n = m/M and N = n × N_A, so N = (m/M) N_A. Inverting, multiplying m and M, or dividing by N_A all give wrong units/magnitudes.", "h": "n = m/M ; N = n × N_A ; so N = (m/M) N_A."}, {"ch": 3, "k": "concept", "s": "Ch4 p.44 Example 1c", "q": "Which expression gives the mass of N particles of a substance of molar mass M?", "o": ["m = (N × 6.022×10²³) × M", "m = (N × 6.022×10²³) / M", "m = (N / 6.022×10²³) × M", "m = N / (6.022×10²³ × M)"], "a": 2, "e": "n = N/N_A, m = n × M = (N/N_A) × M. This is exactly the method of Example 1c.", "h": "Atoms → ÷N_A → mol → ×M → g."}, {"ch": 3, "k": "concept", "s": "Ch4 p.45 text", "q": "What is the difference between molar mass and molecular mass of the same compound?", "o": ["They are different numbers because molar mass includes N_A", "Molar mass is in u while molecular mass is in g/mol", "Same number; molar mass is in g/mol while molecular mass is in atomic mass units", "Molar mass is the mass of one molecule, molecular mass is the mass of one mole"], "a": 2, "e": "For (NH₄)₂SO₄ the molecular mass is 132 u and the molar mass is 132 g/mol. The numbers are identical; the units differ.", "h": "u per molecule = g per mole (same number)."}, {"ch": 4, "k": "exercise", "s": "Ch5 p.50 Exercise 1", "q": "Calculate the average atomic mass of neon from these data: ²⁰Ne = 19.99244 u (90.51%); ²¹Ne = 20.99395 u (0.27%); ²²Ne = 21.99138 u (9.22%).", "o": ["20.90 u", "20.99 u", "20.18 u", "2018 u"], "a": 2, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 20.18 u. The simple mean (20.99) ignores abundance, the swapped-abundance answer (20.90) mixes up which isotope is common, and 2018 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean."}, {"ch": 4, "k": "example", "s": "Ch5 p.48 Example 1", "q": "Use the data to calculate the average atomic mass of carbon: ¹²C = 12.00000 u (98.892 %) and ¹³C = 13.00335 u (1.108 %).", "o": ["12.0111 u", "12.5017 u", "12.9990 u", "1201.11 u"], "a": 0, "e": "0.98892 × 12.00000 + 0.01108 × 13.00335 = 11.86704 + 0.14408 = 12.0111 u. The plain mean is 12.5017 u, swapping the abundances gives 12.9990 u, and not dividing by 100 gives 1201.11 u.", "h": "Carbon is mostly C-12, so the answer sits just above 12."}, {"ch": 4, "k": "example", "s": "Ch5 p.49 Example 2", "q": "Copper has two isotopes, ⁶³Cu (62.9298 u) and ⁶⁵Cu (64.9278 u). If the average atomic mass of copper is 63.546 u, the percent abundance of ⁶³Cu is:", "o": ["63.55 %", "50.00 %", "69.16 %", "30.84 %"], "a": 2, "e": "Let ⁶³Cu = x, so ⁶⁵Cu = 1 − x. 62.9298x + 64.9278(1 − x) = 63.546 gives x = 0.6916, so 69.16 %. The 30.84 % is ⁶⁵Cu; 50 % would give 63.93 u.", "h": "Average is nearer the lighter isotope, so the lighter one is more abundant."}, {"ch": 4, "k": "example", "s": "Ch5 p.49 Example 2", "q": "With the same data (⁶³Cu = 62.9298 u, ⁶⁵Cu = 64.9278 u, average 63.546 u), the percent abundance of ⁶⁵Cu is:", "o": ["30.84 %", "35.00 %", "69.16 %", "36.46 %"], "a": 0, "e": "The two abundances add to 100 %, so ⁶⁵Cu = 100 − 69.16 = 30.84 %.", "h": "Two isotopes: x and 1 − x."}, {"ch": 4, "k": "exercise", "s": "Ch5 p.50 Exercise 2", "q": "Indium has two natural isotopes and an average atomic mass of 114.82 u. If ¹¹³In (112.9043 u) makes up 4.30 % of the sample, the mass of the second isotope is: (the book leaves out the 4.30 %, without which the question cannot be solved)", "o": ["113.86 u", "114.91 u", "115.83 u", "109.97 u"], "a": 1, "e": "0.0430 × 112.9043 + 0.9570 × M = 114.82, so M = (114.82 − 4.855) ÷ 0.9570 = 114.91 u. 113.86 is the plain mean of 112.9043 and 114.82; 109.97 forgets to divide by 0.957.", "h": "⚠ TRAP: to find a missing isotope you need the abundances."}, {"ch": 4, "k": "exercise", "s": "Ch5 p.50 Exercise 3", "q": "Chlorine has ³⁵Cl (34.9688 u) and
