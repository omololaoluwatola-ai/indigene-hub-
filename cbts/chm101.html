ey are the same size", "K⁺", "Cannot be compared", "Na⁺"], "a": 1, "e": "Similarly charged ions increase in size down a group. K⁺ has one more shell.", "h": "Down the group, ions get bigger.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.29 ionic radius", "q": "Which of the ions Na⁺, Mg²⁺ and Al³⁺ has the smallest radius?", "o": ["Na⁺", "Al³⁺", "Mg²⁺", "They are the same size"], "a": 1, "e": "All three have 10 electrons, but Al³⁺ has the most protons (13) pulling them in. Positive ions shrink from left to right in a period.", "h": "Same electrons, more protons = smaller.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.30 EN", "q": "Which is more electronegative, sodium or chlorine?", "o": ["Chlorine", "Neither has electronegativity", "They are equal", "Sodium"], "a": 0, "e": "Cl is far to the right of Na in the same period, so its nuclear charge pulls shared electrons harder.", "h": "Right of the same period wins.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.32 units", "q": "How many millilitres are in 1 litre?", "o": ["1000 mL", "100 mL", "10 mL", "10 000 mL"], "a": 0, "e": "1 L = 1000 mL = 1000 cm³ = 1 dm³.", "h": "1 L = 1 dm³ = 1000 cm³.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.32 units", "q": "A gas occupies 2.5 m³. What is this in litres?", "o": ["2.5 × 10⁶ L", "2500 L", "25 L", "250 L"], "a": 1, "e": "1 m³ = 10³ L, so 2.5 m³ = 2500 L. The 10⁶ factor is for cm³ or mL.", "h": "1 m³ = 1000 L.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.32 units", "q": "A volume of 150 mL expressed in dm³ is:", "o": ["0.150 dm³", "150 dm³", "0.0150 dm³", "1.50 dm³"], "a": 0, "e": "1 dm³ = 1000 mL, so 150 mL is 0.150 dm³.", "h": "mL ÷ 1000 = dm³.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.32 units", "q": "A gas has a pressure of 1520 mmHg. In atmospheres this is:", "o": ["2.00 atm", "0.500 atm", "115 520 atm", "1.52 atm"], "a": 0, "e": "1520 ÷ 760 = 2.00 atm. Multiplying by 760 gives the wrong direction.", "h": "mmHg ÷ 760 = atm.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.32 units", "q": "A pressure of 2.50 atm expressed in kPa is closest to:", "o": ["1900 kPa", "253 kPa", "24.7 kPa", "2.53 kPa"], "a": 1, "e": "2.50 × 101.325 = 253.3 kPa. 1900 would be the answer in mmHg, not kPa.", "h": "atm × 101.3 = kPa.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.32 temp", "q": "Convert 45°C to kelvin using T = t + 273.", "o": ["228 K", "318 K", "12 285 K", "45 K"], "a": 1, "e": "45 + 273 = 318 K.", "h": "Add 273.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.33 kinetic", "q": "Using k = 1.38 × 10⁻²³ J/K, the average kinetic energy of one molecule at 300 K is (3/2)kT, which equals:", "o": ["9.32 × 10⁻²¹ J", "6.21 × 10⁻²¹ J", "3.74 × 10³ J", "4.14 × 10⁻²¹ J"], "a": 1, "e": "(3/2) × 1.38 × 10⁻²³ × 300 = 6.21 × 10⁻²¹ J. Leaving out the 3/2 gives 4.14 × 10⁻²¹; using R instead of k gives the per-mole value.", "h": "Per molecule: k. Per mole: R.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.33 kinetic", "q": "What is the root mean square speed of hydrogen gas (M = 2.016 × 10⁻³ kg/mol) at 300 K? (R = 8.314 J mol⁻¹ K⁻¹)", "o": ["1.78 × 10³ m/s", "1.93 × 10³ m/s", "61 m/s", "1.57 × 10³ m/s"], "a": 1, "e": "U = √(3 × 8.314 × 300 ÷ 2.016 × 10⁻³) = 1.93 × 10³ m/s. 1.57 × 10³ is the most probable speed, 1.78 × 10³ the average speed, and 61 m/s comes from using M in g/mol instead of kg/mol.", "h": "⚠ TRAP: M must be in kg/mol with R = 8.314 J.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.34 Boyle", "q": "A gas occupies 6.0 L at 2.0 atm. At constant temperature, its volume at 3.0 atm is:", "o": ["0.25 L", "4.0 L", "9.0 L", "1.0 L"], "a": 1, "e": "P₁V₁ = P₂V₂, so V₂ = 6.0 × 2.0 ÷ 3.0 = 4.0 L. The pressure goes up, so the volume must go down; 9.0 L comes from inverting the ratio.", "h": "P up = V down. Check your answer goes the right way.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.35 Charles", "q": "A gas has a volume of 2.0 L at 27°C. At constant pressure, its volume at 127°C is:", "o": ["4.0 L", "2.7 L", "1.5 L", "9.4 L"], "a": 1, "e": "Convert: 27°C = 300 K and 127°C = 400 K. V₂ = 2.0 × 400 ÷ 300 = 2.67 L. Using °C directly gives 9.4 L; doubling the temperature in °C does not double the volume.", "h": "⚠ TRAP: gas laws need kelvin.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.36 Example 1", "q": "10.0 L of a gas has a pressure of 0.7 atm and a temperature of 23°C. What will the volume be if the pressure is increased to 1.4 atm and the temperature to 380 K?", "o": ["25.7 L", "5.00 L", "6.42 L", "82.6 L"], "a": 2, "e": "T₁ = 23 + 273 = 296 K. V₂ = 0.7 × 10.0 × 380 ÷ (296 × 1.4) = 6.42 L (the book gets 6.4189 L). Inverting the pressure ratio gives 25.7 L; ignoring temperature gives 5.00 L; forgetting to convert 23°C gives 82.6 L.", "h": "⚠ TRAP: convert 23°C to 296 K.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.36 combined", "q": "5.0 L of gas at 1.0 atm and 27°C is changed to 2.0 atm and 127°C. The new volume is:", "o": ["1.3 L", "3.3 L", "1.9 L", "13.3 L"], "a": 1, "e": "V₂ = 5.0 × 1.0 × 400 ÷ (300 × 2.0) = 3.33 L. Pressure doubling halves V and the temperature rise increases it by 4/3.", "h": "Double P halves V.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.36 Gay-Lussac", "q": "A sealed rigid container holds gas at 2.0 atm and 27°C. The pressure when it is heated to 127°C is:", "o": ["2.7 atm", "2.0 atm", "9.4 atm", "1.5 atm"], "a": 0, "e": "Volume is fixed, so P₂ = 2.0 × 400 ÷ 300 = 2.67 atm.", "h": "Heating a rigid can raises P.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.37 Avogadro", "q": "At constant temperature and pressure, 3.0 L of a gas holds 0.5 mol. How many moles are in 6.0 L of the same gas?", "o": ["1.0 mol", "2.0 mol", "0.25 mol", "0.75 mol"], "a": 0, "e": "V ∝ n, so doubling the volume doubles the moles: 0.5 × 6.0 ÷ 3.0 = 1.0 mol.", "h": "V ∝ n.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.37 Graham", "q": "How many times faster does hydrogen (M = 2) diffuse than oxygen (M = 32) under the same conditions?", "o": ["4 times", "8 times", "2 times", "16 times"], "a": 0, "e": "r(H₂)/r(O₂) = √(32/2) = √16 = 4. Forgetting the square root gives 16.", "h": "⚠ TRAP: take the square root.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.37 Graham", "q": "Helium (M = 4) and methane (M = 16) are allowed to effuse under the same conditions. The rate of helium compared with methane is:", "o": ["1.4 times as fast", "half as fast", "4 times as fast", "2 times as fast"], "a": 3, "e": "r(He)/r(CH₄) = √(16/4) = 2. The lighter gas is faster.", "h": "Lighter gas on top: √(M_heavy/M_light).", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.37 Graham", "q": "An unknown gas effuses 3 times more slowly than hydrogen (M = 2) under the same conditions. Its molar mass is:", "o": ["9", "18", "6", "54"], "a": 1, "e": "r(H₂)/r(X) = √(M_X/2) = 3, so M_X = 2 × 9 = 18. Using 3 × 2 = 6 forgets to square.", "h": "Slower by n = heavier by n².", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.38 Dalton", "q": "A vessel holds 2.0 mol of H₂ and 3.0 mol of N₂ at a total pressure of 5.0 atm. The partial pressure of N₂ is:", "o": ["2.5 atm", "2.0 atm", "3.0 atm", "1.5 atm"], "a": 2, "e": "Mole fraction of N₂ = 3.0 ÷ 5.0 = 0.60. Partial pressure = 0.60 × 5.0 = 3.0 atm.", "h": "x = part ÷ whole.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.38 Dalton", "q": "A gas mixture has partial pressures of 0.50 atm (O₂), 0.30 atm (N₂) and 0.20 atm (Ar). The total pressure is:", "o": ["1.50 atm", "1.00 atm", "0.03 atm", "0.33 atm"], "a": 1, "e": "Add them: 0.50 + 0.30 + 0.20 = 1.00 atm.", "h": "Dalton = just add.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.38 Example", "q": "Hydrogen collected over water has a volume of 453 mL at 18°C and 780 mmHg. Using the book's method (P₁V₁/T₁ = P₂V₂/T₂, STP = 273 K and 760 mmHg), the dry volume at STP is:", "o": ["496 mL", "436 mL", "425 mL", "414 mL"], "a": 1, "e": "V₂ = 780 × 453 × 273 ÷ (291 × 760) = 436 mL. Flipping the temperature ratio gives 496 mL; ignoring the pressure ratio gives 425 mL. In a fuller treatment you would first subtract the water vapour pressure.", "h": "⚠ TRAP: °C → K, and put T₂ on top.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.39 ideal", "q": "What amount of gas, in moles, is in 2.46 L at 1.0 atm and 300 K? (R = 0.082 L atm mol⁻¹ K⁻¹)", "o": ["10 mol", "0.010 mol", "0.10 mol", "1.0 mol"], "a": 2, "e": "n = PV ÷ RT = (1.0 × 2.46) ÷ (0.082 × 300) = 0.10 mol.", "h": "n = PV/RT.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.39 ideal", "q": "The pressure of 0.50 mol of gas in a 10.0 L container at 27°C is: (R = 0.082 L atm mol⁻¹ K⁻¹)", "o": ["0.15 atm", "12.3 atm", "0.0041 atm", "1.23 atm"], "a": 3, "e": "P = nRT ÷ V = 0.50 × 0.082 × 300 ÷ 10.0 = 1.23 atm. Using 27 in place of 300 gives 0.11 atm.", "h": "Temperature in kelvin, always.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.39 ideal", "q": "The volume of 2.0 mol of gas at 1.0 atm and 300 K is: (R = 0.082 L atm mol⁻¹ K⁻¹)", "o": ["0.16 L", "4.9 L", "12 L", "49 L"], "a": 3, "e": "V = nRT ÷ P = 2.0 × 0.082 × 300 ÷ 1.0 = 49 L.", "h": "V = nRT/P.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.39 STP", "q": "What volume does 0.50 mol of an ideal gas occupy at STP, taking 22.4 L/mol?", "o": ["22.4 L", "44.8 L", "5.6 L", "11.2 L"], "a": 3, "e": "0.50 × 22.4 = 11.2 L.", "h": "Moles × 22.4.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.39 STP", "q": "How many moles of gas are in 44.8 L at STP (22.4 L/mol)?", "o": ["2.0 mol", "4.0 mol", "1.0 mol", "0.50 mol"], "a": 0, "e": "44.8 ÷ 22.4 = 2.0 mol.", "h": "Litres ÷ 22.4.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.39-40 Example", "q": "The density of a gaseous compound is 340 g/L at 45°C and 1.7 atm. Using R = 0.082 L atm mol⁻¹ K⁻¹, its molar mass is:", "o": ["521.5 g/mol", "738 g/mol", "5215 g/mol", "1.92 × 10⁻⁴ g/mol"], "a": 2, "e": "T = 318 K. M = dRT ÷ P = 340 × 0.082 × 318 ÷ 1.7 = 5215 g/mol. Using 45 in place of 318 gives 738. The book's printed working uses 1.74 atm, which does not match the question; the corrected note on the page gives 5215.", "h": "⚠ TRAP: °C → K, then M = dRT/P.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch3 p.40 Exercise", "q": "A compound X with density 8.9 g/L is made at 60°C and 2.73 atm. Using R = 0.082 L atm mol⁻¹ K⁻¹, its molar mass is:", "o": ["663 g/mol", "0.89 g/mol", "16 g/mol", "89 g/mol"], "a": 3, "e": "T = 333 K. M = dRT ÷ P = 8.9 × 0.082 × 333 ÷ 2.73 = 89 g/mol. Using 60 in place of 333 gives 16, and multiplying by P instead of dividing gives 663.", "h": "M = dRT/P with T in kelvin.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch3 p.39 density", "q": "A gas has a density of 1.43 g/L at 1.0 atm and 273 K. Using R = 0.082 L atm mol⁻¹ K⁻¹, its molar mass is about:", "o": ["64 g/mol", "0.31 g/mol", "32 g/mol", "16 g/mol"], "a": 2, "e": "M = 1.43 × 0.082 × 273 ÷ 1.0 = 32.0 g/mol. This is oxygen.", "h": "Density × 22.4 ≈ molar mass at STP.", "t": "States of Matter", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.43-44 Example 1a", "q": "Given Cu = 63.55 g/mol, calculate the mass of 0.0892 mol of Cu.", "o": ["712 g", "5.67 g", "0.0014 g", "0.567 g"], "a": 1, "e": "mass = n × M = 0.0892 mol × 63.55 g/mol = 5.6687 g ≈ 5.67 g (book: 5.6687 g). Dividing n by M gives 1.40e-03 (wrong: that is mol²/g), and M/n gives 712 g (inverted). The last option is a decimal-place slip.", "h": "m = n × M. Moles × grams-per-mole: the 'mol' cancels and leaves grams.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.44 Example 1b", "q": "Given Cu = 63.55 g/mol, how many moles of Cu are present in a 72.5 g sample?", "o": ["1.141 mol", "0.8766 mol", "0.114 mol", "4607 mol"], "a": 0, "e": "n = m/M = 72.5 g ÷ 63.55 g/mol = 1.1408 mol (book: 1.1408 mol; rounding gives 1.141). Multiplying 72.5 × 63.55 = 4607 or inverting to M/m = 0.8766 are the usual slips.", "h": "n = m/M. Mass bigger than molar mass → answer must be MORE than 1 mol. Quick sanity check.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.44 Example 1c", "q": "Given Cu = 63.55 g/mol and N = 6.022×10²³ mol⁻¹, calculate the mass of a sample of Cu containing 2.00×10¹⁶ atoms of Cu.", "o": ["7.65×10⁴¹ g", "21.1 g", "2.11×10⁻⁶ g", "5.23×10⁻¹⁰ g"], "a": 2, "e": "mass = (N atoms/N_A) × M = (2.00×10¹⁶ / 6.022×10²³) × 63.55 = 2.111e-06 g. The book prints 21.1059 g, but that value is what you get for 2.00×10²³ atoms; for 10¹⁶ atoms the correct answer is 2.111e-06 g (book's printed answer is inconsistent with its own numbers). Multiplying by N_A instead of dividing, or dividing by M, gives absurd values.", "h": "⚠ TRAP: atoms → moles means DIVIDE by 6.022×10²³, then × molar mass. A few atoms can never weigh tens of grams.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.44 Example 1c (variant matching book's answer)", "q": "Given Cu = 63.55 g/mol, calculate the mass of a sample of Cu containing 2.00×10²³ atoms of Cu.", "o": ["2.111 g", "1.895×10⁴⁵ g", "127.1 g", "21.11 g"], "a": 3, "e": "n = 2.00×10²³ / 6.022×10²³ = 0.3321 mol; m = 0.3321 × 63.55 = 21.11 g (this is the book's 21.1059 g worked answer). Wrong options come from a decimal-place slip, or multiplying instead of dividing by N_A.", "h": "atoms ÷ N_A = mol; mol × M = g.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.44 Example 1d", "q": "Given Cu = 63.55 g/mol and N = 6.022×10²³ mol⁻¹, what is the mass of a single atom of Cu?", "o": ["3.827×10²⁵ g", "2.613×10⁻²⁶ g", "1.055×10⁻²¹ g", "1.055×10⁻²² g"], "a": 3, "e": "1 mol Cu (63.55 g) contains 6.022×10²³ atoms, so one atom = 63.55 / 6.022×10²³ = 1.0553e-22 g (book: 1.0553×10⁻²² g). Multiplying (63.55 × N_A) gives the mass of N_A² atoms; 1/(N_A × M) has wrong units.", "h": "Mass of ONE particle = M / N_A. Tiny answer (10⁻²² to 10⁻²⁴ g) is expected.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.45 Example 2", "q": "Using N=14, H=1, S=32, O=16, what is the molar mass of ammonium sulphate, (NH₄)₂SO₄?", "o": ["128 g/mol", "132 g/mol", "84 g/mol", "114 g/mol"], "a": 1, "e": "(NH₄)₂SO₄ = 2N + 8H + S + 4O = 2(14) + 8(1) + 32 + 4(16) = 28 + 8 + 32 + 64 = 132 g/mol. 128 comes from counting only 4 H (ignoring the subscript outside the bracket applies to H too); 114 counts only one NH₄ group; 84 uses only one O.", "h": "⚠ TRAP: a subscript outside a bracket multiplies EVERY atom inside it: (NH₄)₂ = 2 N and 8 H.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.45 Example 2", "q": "The molecular mass of (NH₄)₂SO₄ is 132 u. Which of these is the correct statement of its molar mass?", "o": ["132 u/mol", "132 g/mol", "132 g", "1.32×10² u"], "a": 1, "e": "Molecular mass is expressed in atomic mass units (a.m.u or u) for ONE molecule; molar mass is the mass in grams per mole. Same number, different units: 132 u and 132 g/mol. 132 g has no 'per mole'; u/mol is not the unit used.", "h": "Molecular mass → u (one molecule). Molar mass → g/mol (one mole).", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.45-46 Example 3a", "q": "Calculate the number of SO₄²⁻ ions in a 150 g sample of H₂SO₄ (S = 32, H = 1, O = 16; N = 6.022×10²³ mol⁻¹).", "o": ["3.934×10²³ ions", "3.687×10²⁴ ions", "9.217×10²³ ions", "9.033×10²⁵ ions"], "a": 2, "e": "M(H₂SO₄) = 2 + 32 + 64 = 98 g/mol. n = 150/98 = 1.5306 mol. 1 mol H₂SO₄ gives 1 mol SO₄²⁻, so ions = 1.5306 × 6.022×10²³ = 9.2173e+23 (book: 9.2173×10²³). Inverting 98/150 gives 3.934e+23; 4 × is the number of O atoms, not sulphate ions.", "h": "Formula tells the ratio: one SO₄²⁻ per H₂SO₄, so ions = molecules.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.46 Example 3b", "q": "What volume of HCl (d = 1.18 g/mL) contains 2.00 mol of Cl atoms? (H = 1, Cl = 35.5)", "o": ["83.8 mL", "30.08 mL", "60.17 mL", "61.86 mL"], "a": 2, "e": "1 mol HCl contains 1 mol Cl atoms, so 2.00 mol Cl = 2.00 mol HCl. Mass of Cl = 2 × 35.5 = 71.0 g, and since the book treats this as 71 g HCl (as given), volume = 71/1.18 = 60.1695 mL (book: 60.1695 mL). 30.08 uses only 1 mol; 83.8 multiplies by density instead of dividing; 61.86 uses 73 g (2 × 36.5). Note: strictly, 2 mol HCl weighs 73 g, but the book uses 71 g.", "h": "Volume = mass ÷ density. Mass bigger than volume when d > 1, so mL < g.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 1", "q": "Calculate the total number of Cl atoms in 150 mL of liquid CCl₄ (d = 1.589 g/mL; C = 12, Cl = 35.5; N = 6.022×10²³ mol⁻¹).", "o": ["9.320×10²³ atoms", "2.346×10²⁴ atoms", "5.741×10²⁶ atoms", "3.728×10²⁴ atoms"], "a": 3, "e": "mass = 150 × 1.589 = 238.35 g; M(CCl₄) = 12 + 4(35.5) = 154 g/mol; n = 1.5477 mol; each molecule has 4 Cl, so atoms = 1.5477 × 4 × 6.022×10²³ = 3.728e+24. Without the ×4 you count molecules (9.320e+23); skipping density (2.346e+24) treats mL as g; using mass × 4 × N_A forgets to divide by M.", "h": "⚠ TRAP: mL → g (× density) → mol (÷ M) → molecules (× N_A) → atoms (× atoms per molecule).", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 2", "q": "Find the mass of carbon in 300 g of sucrose, C₁₂H₂₂O₁₁ (C = 12, H = 1, O = 16).", "o": ["154.4 g", "126.3 g", "19.3 g", "10.5 g"], "a": 1, "e": "M = 12(12) + 22 + 11(16) = 342 g/mol. Mass fraction C = 144/342. Mass of C = 300 × 144/342 = 126.32 g. Using 12 instead of 144 forgets the 12 carbon atoms (10.53 g); dividing again by 12 gives moles-of-C-like value (10.53).", "h": "Mass of element = (total atoms × A_r ÷ M_r) × sample mass.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 3", "q": "Calculate the volume (mL) of aqueous 40% sucrose (density 0.911 g/mL) required to furnish 1.5 mol of C atoms (sucrose = C₁₂H₂₂O₁₁; C = 12, H = 1, O = 16). Take 40% as 40 g sucrose per 100 g solution.", "o": ["117.3 mL", "18.77 mL", "1408 mL", "46.93 mL"], "a": 0, "e": "1.5 mol C ÷ 12 = 0.125 mol sucrose; mass = 0.125 × 342 = 42.75 g. That is only 40% of the solution, so solution mass = 42.75/0.40 = 106.88 g; volume = 106.88/0.911 = 117.3 mL. Ignoring the 40% gives 46.9 mL; forgetting ÷12 gives 1408 mL; multiplying by 0.40 gives 18.8 mL.", "h": "⚠ TRAP: '40%' means only 40% of the solution mass is sucrose, so divide the sucrose mass by 0.40 before using density.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 4", "q": "Calculate the mass (g) of Ag in 3 atoms of Ag (Ag = 107.9; N = 6.022×10²³ mol⁻¹).", "o": ["5.375×10⁻²² g", "1.949×10²⁶ g", "1.792×10⁻²² g", "4.617×10⁻²⁶ g"], "a": 0, "e": "One atom = 107.9/6.022×10²³ = 1.7918e-22 g; 3 atoms = 5.3753e-22 g. Giving 1.792e-22 g is the mass of ONE atom. Multiplying by N_A gives a huge mass.", "h": "Particles → mass: (number × M) ÷ N_A.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 5", "q": "How many grams of Zn are there in 0.54 mol of Zn (Zn = 65.39)?", "o": ["35.3 g", "3.53 g", "0.00826 g", "121 g"], "a": 0, "e": "m = n × M = 0.54 × 65.39 = 35.31 g ≈ 35 g to 2 s.f. (data has 2 s.f.). 0.54/65.39 = 0.0083 (divided); 65.39/0.54 = 121.1 (inverted).", "h": "Mol → g: multiply by M.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 6", "q": "Compute the mass (g) of americium in 12 atoms of Am (Am = 243; N = 6.022×10²³ mol⁻¹).", "o": ["8.20×10⁻²⁶ g", "1.76×10²⁷ g", "4.84×10⁻²¹ g", "4.04×10⁻²² g"], "a": 2, "e": "m = (12 × 243)/6.022×10²³ = 4.842e-21 g. 4.035e-22 g is only one atom.", "h": "Always remember: atoms ÷ N_A first, then × M.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 7(i)", "q": "Calculate the number of moles of atoms in a 20 g sample of Ce (Ce = 140.1).", "o": ["7 mol", "2802 mol", "8.60×10²² mol", "0.143 mol"], "a": 3, "e": "n = 20/140.1 = 0.1428 mol ≈ 0.14 mol (2 s.f. data). 7.01 is the inverted ratio; 2802 multiplies; 8.60e+22 is the NUMBER of atoms, not moles.", "h": "mol = g ÷ M. 20 g ≪ 140 g, so the answer must be below 1 mol.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 7(ii)", "q": "Calculate the number of atoms in a 20 g sample of Ce (Ce = 140.1; N = 6.022×10²³ mol⁻¹).", "o": ["1.69×10²⁷ atoms", "0.143 atoms", "8.60×10²² atoms", "4.22×10²⁴ atoms"], "a": 2, "e": "n = 20/140.1 = 0.1428 mol; atoms = 0.1428 × 6.022×10²³ = 8.597e+22. The other values come from inverting n, multiplying by M, or stopping at moles.", "h": "g → mol → atoms: two steps, don't stop at moles.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.47 Exercise 8", "q": "How many silicon atoms are there in a silicon chip of mass 6.78 mg? (Si = 28.09; N = 6.022×10²³ mol⁻¹)", "o": ["1.45×10¹⁷ atoms", "1.45×10²⁰ atoms", "1.15×10²³ atoms", "1.45×10²³ atoms"], "a": 1, "e": "6.78 mg = 6.78×10⁻³ g; n = 6.78×10⁻³/28.09 = 2.414e-04 mol; atoms = 1.454e+20. Forgetting mg → g gives 1.45e+23 (1000× too large); multiplying by M gives 1.15e+23; using 10⁻⁶ (µg) gives 1.45e+17.", "h": "⚠ TRAP: convert mg → g (÷1000) BEFORE dividing by molar mass.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.47 Exercise 9(i)", "q": "A sample of cobalt contains 3.00×10²⁰ atoms. How many moles of Co is this? (N = 6.022×10²³ mol⁻¹)", "o": ["2.01×10³ mol", "1.81×10⁴⁴ mol", "4.98×10⁻⁴ mol", "0.0294 mol"], "a": 2, "e": "n = N/N_A = 3.00×10²⁰/6.022×10²³ = 4.982e-04 mol. 2.94e-02 is the mass in grams; multiplying by N_A or inverting gives nonsense.", "h": "n = N/N_A. For N ≪ N_A the moles are tiny.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.47 Exercise 9(ii)", "q": "A sample of cobalt contains 3.00×10²⁰ atoms. What is its mass? (Co = 58.93; N = 6.022×10²³ mol⁻¹)", "o": ["1.18×10⁵ g", "0.0294 g", "29.4 g", "4.98×10⁻⁴ g"], "a": 1, "e": "n = 4.982e-04 mol; m = n × M = 4.982e-04 × 58.93 = 0.0294 g ≈ 0.0294 g. 4.98e-04 is moles, not grams; 29.4 is a unit slip (that would be mg).", "h": "Particles → mol (÷N_A) → grams (×M).", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.47 Exercise 10", "q": "Determine the mass percent of sulphur in penicillin, C₁₄H₂₀N₂SO₄ (C = 12, H = 1, N = 14, S = 32, O = 16).", "o": ["11.43 %", "0.1026 %", "20.51 %", "10.26 %"], "a": 3, "e": "M = 14(12) + 20(1) + 2(14) + 32 + 4(16) = 168 + 20 + 28 + 32 + 64 = 312 g/mol. %S = 32/312 × 100 = 10.26 %. Dividing by the mass without S gives 11.43 %; omitting ×100 gives 0.1026; 64 is the wrong atomic count (2 S).", "h": "% by mass = (atoms × A_r ÷ M_r) × 100, with M_r of the WHOLE compound.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.44 text (2 MgSO₄)", "q": "2 MgSO₄ is written for the amount of magnesium sulphate. How many MgSO₄ formula units/molecules does this represent?", "o": ["7.226×10²⁴ molecules", "3.011×10²³ molecules", "6.022×10²³ molecules", "1.204×10²⁴ molecules"], "a": 3, "e": "A coefficient 2 means 2 mol of MgSO₄ = 2 × 6.022×10²³ = 1.204e+24 molecules. One mole would be 6.022×10²³; ½ mol would be 3.011e+23.", "h": "Coefficient × N_A = number of particles.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.44 text (½ O₂)", "q": "How many O₂ molecules are in ½ mol of O₂? (N = 6.022×10²³ mol⁻¹)", "o": ["3.011×10²³ molecules", "9.635×10²⁴ molecules", "6.022×10²³ molecules", "1.204×10²⁴ molecules"], "a": 0, "e": "½ × 6.022×10²³ = 3.011e+23 molecules. (The book writes '½ × 6.022 molecules' omitting the 10²³ - a typo.) 1.204e+24 would be the number of O ATOMS in 1 mol O₂ is 2 N_A, not here; 6.022e+23 is 1 mol.", "h": "½ mol → half of N_A.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.44 Example 1d (variant)", "q": "Calculate the mass of one molecule of water, H₂O (H = 1, O = 16; N = 6.022×10²³ mol⁻¹).", "o": ["5.98×10⁻²³ g", "1.08×10²⁵ g", "2.99×10⁻²³ g", "9.23×10⁻²⁶ g"], "a": 2, "e": "M = 18 g/mol; one molecule = 18/6.022×10²³ = 2.989e-23 g. 18 × N_A is the mass of N_A² molecules; double is a mass of 2 molecules.", "h": "Mass of ONE particle = M / N_A.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.44 Example 1b (variant)", "q": "How many moles are in 36.0 g of water, H₂O (H = 1, O = 16)?", "o": ["0.500 mol", "1.00 mol", "648 mol", "2.00 mol"], "a": 3, "e": "M(H₂O) = 18.0 g/mol; n = 36.0/18.0 = 2.00 mol. 0.500 is M/m (inverted); 648 is m × M; 1.00 is the mole count for 18 g.", "h": "n = m / M. 36 g is TWO times 18 g.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.44 Example 1 (variant)", "q": "How many molecules are in 4.5 g of water? (H = 1, O = 16; N = 6.022×10²³ mol⁻¹)", "o": ["2.41×10²⁴ molecules", "1.51×10²³ molecules", "4.88×10²⁵ molecules", "4.52×10²³ molecules"], "a": 1, "e": "n = 4.5/18 = 0.25 mol; molecules = 0.25 × 6.022×10²³ = 1.506e+23. 4.517e+23 would be total ATOMS; the other two come from multiplying/inverting.", "h": "Molecules and atoms are different counts: ask which one is wanted.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.45 Example 2 (variant)", "q": "What is the molar mass of aluminium sulphate, Al₂(SO₄)₃ (Al = 27, S = 32, O = 16)?", "o": ["278 g/mol", "342 g/mol", "150 g/mol", "246 g/mol"], "a": 1, "e": "Al₂(SO₄)₃ = 2(27) + 3(32) + 12(16) = 54 + 96 + 192 = 342. 150 uses a single SO₄ (54+96... Al₂SO₄ = 54+32+64); 278 uses (SO₄) counted with 3 S and 4 O only (278); 246 counts SO₄ as 3 × 64 = 192 wrongly with one S (246).", "h": "⚠ TRAP: subscript 3 outside bracket multiplies S AND all 4 O (12 O atoms).", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.45 Example 2 (variant)", "q": "What is the molecular (formula) mass of calcium hydroxide, Ca(OH)₂ (Ca = 40, O = 16, H = 1)?", "o": ["41 u", "90 u", "57 u", "74 u"], "a": 3, "e": "Ca(OH)₂ = 40 + 2(16) + 2(1) = 74 u. 57 counts only one OH; 41 omits O; 90 treats OH as 2 O + ... incorrectly.", "h": "Bracket subscript multiplies both O and H.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.45-46 Example 3a (variant)", "q": "Calculate the number of SO₄²⁻ ions in 49 g of H₂SO₄ (S = 32, H = 1, O = 16; N = 6.022×10²³ mol⁻¹).", "o": ["6.022×10²³ ions", "3.011×10²³ ions", "2.951×10²⁵ ions", "1.204×10²⁴ ions"], "a": 1, "e": "n = 49/98 = 0.500 mol; 1 mol H₂SO₄ gives 1 mol SO₄²⁻, so ions = 0.500 × 6.022×10²³ = 3.011e+23. 98/49 inverts the ratio; 4× counts O atoms; 49 × N_A forgets M.", "h": "49 g = half of 98 g → half a mole.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "example", "s": "Ch4 p.46 Example 3b (variant)", "q": "What volume of HCl (d = 1.18 g/mL) contains 3.00 mol of Cl atoms? Use the book's method (mass of Cl = mol × 35.5, then ÷ density).", "o": ["2.54 mL", "90.25 mL", "92.8 mL", "125.7 mL"], "a": 1, "e": "Mass = 3.00 × 35.5 = 106.5 g; V = 106.5/1.18 = 90.25 mL. 125.7 mL multiplies by density; 92.8 mL uses 36.5 g/mol; 2.54 divides mol by density.", "h": "Density = mass/volume → V = m/d.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 1 (variant)", "q": "How many Cl atoms are present in 0.50 mol of CCl₄? (N = 6.022×10²³ mol⁻¹)", "o": ["3.01×10²³ atoms", "2.41×10²⁴ atoms", "1.20×10²⁴ atoms", "1.51×10²⁴ atoms"], "a": 2, "e": "0.50 mol CCl₄ = 3.011e+23 molecules; 4 Cl per molecule gives 1.204e+24 Cl atoms. 3.011e+23 counts molecules; 1.506e+24 counts all atoms (C + 4 Cl).", "h": "Atoms of X = n × N_A × (number of X per formula).", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 2 (variant)", "q": "Find the mass of nitrogen in 300 g of ammonium sulphate, (NH₄)₂SO₄ (N = 14, H = 1, S = 32, O = 16).", "o": ["80.77 g", "63.64 g", "127.3 g", "31.82 g"], "a": 1, "e": "M = 132 g/mol; 2 N atoms contribute 28 g. Mass N = 300 × 28/132 = 63.64 g. Using only 14 forgets 2 N (31.82); dividing by the mass without N gives 80.77; halving gives 31.82.", "h": "Count atoms of the element, × A_r, ÷ M_r of the whole compound.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.47 Exercise 10 (variant)", "q": "What is the mass percent of nitrogen in (NH₄)₂SO₄ (N = 14, H = 1, S = 32, O = 16)?", "o": ["0.212 %", "26.9 %", "21.2 %", "10.6 %"], "a": 2, "e": "%N = 2(14)/132 × 100 = 21.21 %. 10.6 % counts one N; 26.9 % divides by the mass without N; 0.212 lacks ×100.", "h": "⚠ TRAP: two N atoms in (NH₄)₂; denominator is the whole compound.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.47 Exercise 10 (variant)", "q": "Determine the mass percent of sulphur in H₂SO₄ (H = 1, S = 32, O = 16).", "o": ["50 %", "48.48 %", "0.3265 %", "32.65 %"], "a": 3, "e": "M = 98; %S = 32/98 × 100 = 32.65 %. 48.48 % divides by the mass without S; 50 % divides by the O mass only; 0.3265 omits ×100.", "h": "Divide by the WHOLE molar mass.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.47 Exercise 9 (variant)", "q": "How many moles of atoms are in a sample containing 2.00×10²⁴ atoms? (N = 6.022×10²³ mol⁻¹)", "o": ["3.32 mol", "1.20×10⁴⁸ mol", "0.332 mol", "0.301 mol"], "a": 0, "e": "n = N/N_A = 2.00×10²⁴/6.022×10²³ = 3.32 mol. Inverting gives 0.301; the second option multiplies; 0.332 is a power-of-ten slip.", "h": "10²⁴ ≈ 10 × 10²³ → about 3.3 mol: quick mental check.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 5 (variant)", "q": "Calculate the mass of 2.50 mol of sodium, Na = 23.0 g/mol.", "o": ["9.2 g", "5.75 g", "57.5 g", "0.109 g"], "a": 2, "e": "m = n × M = 2.50 × 23.0 = 57.5 g. 9.20 is M/n; 0.109 is n/M; 5.75 is a decimal slip.", "h": "g = mol × g/mol.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.44 Example 1b (variant)", "q": "How many moles of copper are in 2.0 kg of Cu (Cu = 63.55 g/mol)?", "o": ["127 mol", "0.0318 mol", "0.0315 mol", "31.5 mol"], "a": 3, "e": "2.0 kg = 2000 g; n = 2000/63.55 = 31.5 mol. Using 2.0 g gives 0.031; multiplying gives 127; 0.032 is inverted.", "h": "⚠ TRAP: kg → g (×1000) before dividing by g/mol.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.47 Exercise 8 (variant)", "q": "How many gold atoms are in 15.0 mg of gold (Au = 197; N = 6.022×10²³ mol⁻¹)?", "o": ["4.59×10¹⁹ atoms", "7.61×10⁻⁵ atoms", "4.59×10²² atoms", "1.78×10²⁴ atoms"], "a": 0, "e": "15.0 mg = 0.0150 g; n = 0.0150/197 = 7.614e-05 mol; atoms = 4.585e+19. Without mg → g the answer is 1000× too large (4.59e+22); multiplying by M gives 1.8e+24; stopping at moles gives 7.61e-05.", "h": "mg → g first. Then n = m/M, then × N_A.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 1 (variant)", "q": "A bottle holds 0.500 mol of CCl₄ (C = 12, Cl = 35.5). What is the mass of the CCl₄?", "o": ["77.0 g", "154 g", "308 g", "38.5 g"], "a": 0, "e": "M(CCl₄) = 12 + 4(35.5) = 154 g/mol; m = 0.500 × 154 = 77.0 g. 154 g is the mass of 1 mol; 38.5 divides by 4 incorrectly; 308 is 2 mol.", "h": "Use the MOLES given, not 1 mol.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 3 (variant)", "q": "What mass of sucrose, C₁₂H₂₂O₁₁ (C = 12, H = 1, O = 16), contains 3.0 mol of C atoms?", "o": ["1026 g", "85.5 g", "432 g", "114 g"], "a": 1, "e": "3.0 mol C ÷ 12 = 0.25 mol sucrose; mass = 0.25 × 342 = 85.5 g. Multiplying 3 × 342 forgets the 12 C atoms per molecule.", "h": "Divide by atoms-per-formula to convert mol of an element into mol of compound.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.47 Exercise 9 (variant)", "q": "Given Co = 58.93 g/mol, what is the mass of 1.00×10²² atoms of Co? (N = 6.022×10²³ mol⁻¹)", "o": ["3.55×10⁴⁷ g", "0.979 g", "9.79×10⁻⁴⁵ g", "9.79 g"], "a": 1, "e": "m = (1.00×10²²/6.022×10²³) × 58.93 = 0.0166 mol × 58.93 = 0.979 g. The others multiply by N_A, invert, or are a power-of-ten slip.", "h": "10²² ≈ 1/60 of a mole → about 1/60 of M.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch4 p.46 Exercise 5 (variant)", "q": "How many moles of Zn are in 10.0 g of Zn (Zn = 65.39)?", "o": ["0.153 mol", "9.21×10²² mol", "6.54 mol", "654 mol"], "a": 0, "e": "n = 10.0/65.39 = 0.1529 mol ≈ 0.153 mol. 6.54 is inverted; 654 is multiplied; the last is a number of atoms.", "h": "Mass less than M → under 1 mol.", "t": "The Mole Concept and Avogadro’s Number", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch5 p.50 Exercise 1", "q": "Calculate the average atomic mass of neon from these data: ²⁰Ne = 19.99244 u (90.51%); ²¹Ne = 20.99395 u (0.27%); ²²Ne = 21.99138 u (9.22%).", "o": ["20.90 u", "20.99 u", "20.18 u", "2018 u"], "a": 2, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 20.18 u. The simple mean (20.99) ignores abundance, the swapped-abundance answer (20.90) mixes up which isotope is common, and 2018 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48 Example 1", "q": "Use the data to calculate the average atomic mass of carbon: ¹²C = 12.00000 u (98.892 %) and ¹³C = 13.00335 u (1.108 %).", "o": ["12.0111 u", "12.5017 u", "12.9990 u", "1201.11 u"], "a": 0, "e": "0.98892 × 12.00000 + 0.01108 × 13.00335 = 11.86704 + 0.14408 = 12.0111 u. The plain mean is 12.5017 u, swapping the abundances gives 12.9990 u, and not dividing by 100 gives 1201.11 u.", "h": "Carbon is mostly C-12, so the answer sits just above 12.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.49 Example 2", "q": "Copper has two isotopes, ⁶³Cu (62.9298 u) and ⁶⁵Cu (64.9278 u). If the average atomic mass of copper is 63.546 u, the percent abundance of ⁶³Cu is:", "o": ["63.55 %", "50.00 %", "69.16 %", "30.84 %"], "a": 2, "e": "Let ⁶³Cu = x, so ⁶⁵Cu = 1 − x. 62.9298x + 64.9278(1 − x) = 63.546 gives x = 0.6916, so 69.16 %. The 30.84 % is ⁶⁵Cu; 50 % would give 63.93 u.", "h": "Average is nearer the lighter isotope, so the lighter one is more abundant.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.49 Example 2", "q": "With the same data (⁶³Cu = 62.9298 u, ⁶⁵Cu = 64.9278 u, average 63.546 u), the percent abundance of ⁶⁵Cu is:", "o": ["30.84 %", "35.00 %", "69.16 %", "36.46 %"], "a": 0, "e": "The two abundances add to 100 %, so ⁶⁵Cu = 100 − 69.16 = 30.84 %.", "h": "Two isotopes: x and 1 − x.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch5 p.50 Exercise 2", "q": "Indium has two natural isotopes and an average atomic mass of 114.82 u. If ¹¹³In (112.9043 u) makes up 4.30 % of the sample, the mass of the second isotope is: (the book leaves out the 4.30 %, without which the question cannot be solved)", "o": ["113.86 u", "114.91 u", "115.83 u", "109.97 u"], "a": 1, "e": "0.0430 × 112.9043 + 0.9570 × M = 114.82, so M = (114.82 − 4.855) ÷ 0.9570 = 114.91 u. 113.86 is the plain mean of 112.9043 and 114.82; 109.97 forgets to divide by 0.957.", "h": "⚠ TRAP: to find a missing isotope you need the abundances.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch5 p.50 Exercise 3", "q": "Chlorine has ³⁵Cl (34.9688 u) and ³⁷Cl (36.9659 u). If the average atomic mass of chlorine is 35.45 u, the percent natural abundance of ³⁵Cl is:", "o": ["24.10 %", "35.45 %", "75.90 %", "50.00 %"], "a": 2, "e": "x(34.9688) + (1 − x)(36.9659) = 35.45 gives x = 0.7590, so 75.90 % ³⁵Cl and 24.10 % ³⁷Cl. The 24.10 % belongs to the heavier isotope.", "h": "Average near 35.45 = mostly Cl-35.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch5 p.50 Exercise 3", "q": "With the same chlorine data, the percent natural abundance of ³⁷Cl is:", "o": ["75.90 %", "64.55 %", "37.00 %", "24.10 %"], "a": 3, "e": "Subtract from 100: 100 − 75.90 = 24.10 %.", "h": "Cl-35 : Cl-37 is about 3 : 1.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of boron from these data: ¹⁰B = 10.0129 u (19.9%); ¹¹B = 11.0093 u (80.1%).", "o": ["10.81 u", "10.51 u", "10.21 u", "1081 u"], "a": 0, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 10.81 u. The simple mean (10.51) ignores abundance, the swapped-abundance answer (10.21) mixes up which isotope is common, and 1081 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of lithium from these data: ⁶Li = 6.0151 u (7.5%); ⁷Li = 7.016 u (92.5%).", "o": ["6.52 u", "6.94 u", "694 u", "6.09 u"], "a": 1, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 6.94 u. The simple mean (6.52) ignores abundance, the swapped-abundance answer (6.09) mixes up which isotope is common, and 694 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of magnesium from these data: ²⁴Mg = 23.985 u (78.99%); ²⁵Mg = 24.986 u (10.0%); ²⁶Mg = 25.983 u (11.01%).", "o": ["24.31 u", "2431 u", "25.31 u", "24.98 u"], "a": 0, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 24.31 u. The simple mean (24.98) ignores abundance, the swapped-abundance answer (25.31) mixes up which isotope is common, and 2431 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of bromine from these data: ⁷⁹Br = 78.918 u (50.69%); ⁸¹Br = 80.916 u (49.31%).", "o": ["79.90 u", "7990 u", "79.93 u", "79.92 u"], "a": 0, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 79.90 u. The simple mean (79.92) ignores abundance, the swapped-abundance answer (79.93) mixes up which isotope is common, and 7990 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of silver from these data: ¹⁰⁷Ag = 106.905 u (51.84%); ¹⁰⁹Ag = 108.905 u (48.16%).", "o": ["107.94 u", "10787 u", "107.91 u", "107.87 u"], "a": 3, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 107.87 u. The simple mean (107.91) ignores abundance, the swapped-abundance answer (107.94) mixes up which isotope is common, and 10787 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of chlorine from these data: ³⁵Cl = 34.9688 u (75.78%); ³⁷Cl = 36.9659 u (24.22%).", "o": ["35.45 u", "3545 u", "36.48 u", "35.97 u"], "a": 0, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 35.45 u. The simple mean (35.97) ignores abundance, the swapped-abundance answer (36.48) mixes up which isotope is common, and 3545 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of gallium from these data: ⁶⁹Ga = 68.9256 u (60.11%); ⁷¹Ga = 70.9247 u (39.89%).", "o": ["69.72 u", "69.93 u", "6972 u", "70.13 u"], "a": 0, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 69.72 u. The simple mean (69.93) ignores abundance, the swapped-abundance answer (70.13) mixes up which isotope is common, and 6972 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of nitrogen from these data: ¹⁴N = 14.0031 u (99.63%); ¹⁵N = 15.0001 u (0.37%).", "o": ["15.00 u", "14.50 u", "1401 u", "14.01 u"], "a": 3, "e": "Weighted average = Σ(isotope mass × fractional abundance). Divide each % by 100 first. Result 14.01 u. The simple mean (14.50) ignores abundance, the swapped-abundance answer (15.00) mixes up which isotope is common, and 1401 forgot to divide by 100.", "h": "⚠ TRAP: percent → fraction first, and it is a weighted average, not a plain mean.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.49 variant", "q": "Boron has two isotopes, ¹⁰B (10.0129 u) and ¹¹B (11.0093 u). Its average atomic mass is 10.81 u. The percent abundance of ¹⁰B is:", "o": ["10.81 %", "80.00 %", "50.00 %", "20.00 %"], "a": 3, "e": "Let ¹⁰B = x. 10.0129x + 11.0093(1 − x) = 10.81, so x = (11.0093 − 10.81) ÷ (11.0093 − 10.0129) = 0.2000, which is 20.00 %. 80.00 % is the other isotope.", "h": "Put x and 1 − x, then solve one equation.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.49 variant", "q": "Gallium has two isotopes, ⁶⁹Ga (68.9256 u) and ⁷¹Ga (70.9247 u). Its average atomic mass is 69.723 u. The percent abundance of ⁶⁹Ga is:", "o": ["69.723 %", "60.11 %", "39.89 %", "50.00 %"], "a": 1, "e": "Let ⁶⁹Ga = x. 68.9256x + 70.9247(1 − x) = 69.723, so x = (70.9247 − 69.723) ÷ (70.9247 − 68.9256) = 0.6011, which is 60.11 %. 39.89 % is the other isotope.", "h": "Put x and 1 − x, then solve one equation.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.49 variant", "q": "Bromine has two isotopes, ⁷⁹Br (78.918 u) and ⁸¹Br (80.916 u). Its average atomic mass is 79.904 u. The percent abundance of ⁷⁹Br is:", "o": ["49.35 %", "79.904 %", "50.00 %", "50.65 %"], "a": 3, "e": "Let ⁷⁹Br = x. 78.918x + 80.916(1 − x) = 79.904, so x = (80.916 − 79.904) ÷ (80.916 − 78.918) = 0.5065, which is 50.65 %. 49.35 % is the other isotope.", "h": "Put x and 1 − x, then solve one equation.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.49 variant", "q": "Lithium has two isotopes, ⁶Li (6.0151 u) and ⁷Li (7.016 u). Its average atomic mass is 6.941 u. The percent abundance of ⁶Li is:", "o": ["50.00 %", "92.51 %", "7.49 %", "6.941 %"], "a": 2, "e": "Let ⁶Li = x. 6.0151x + 7.016(1 − x) = 6.941, so x = (7.016 − 6.941) ÷ (7.016 − 6.0151) = 0.0749, which is 7.49 %. 92.51 % is the other isotope.", "h": "Put x and 1 − x, then solve one equation.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48-49 variant", "q": "Calculate the average atomic mass of silicon: ²⁸Si = 27.9769 u (92.23 %), ²⁹Si = 28.9765 u (4.68 %), ³⁰Si = 29.9738 u (3.09 %).", "o": ["28.98 u", "28.09 u", "2809 u", "29.90 u"], "a": 1, "e": "0.9223 × 27.9769 + 0.0468 × 28.9765 + 0.0309 × 29.9738 = 28.09 u. The plain mean of the three masses is 28.98 u.", "h": "Mostly Si-28, so the answer is just above 28.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.49 variant", "q": "Rubidium has two isotopes, ⁸⁵Rb (84.9118 u) and ⁸⁷Rb (86.9092 u), and an average atomic mass of 85.468 u. The percent abundance of ⁸⁷Rb is:", "o": ["50.00 %", "27.85 %", "72.15 %", "85.468 %"], "a": 1, "e": "Let ⁸⁵Rb = x: 84.9118x + 86.9092(1 − x) = 85.468 gives x = 0.7215. So ⁸⁷Rb = 1 − x = 27.85 %. The 72.15 % belongs to ⁸⁵Rb.", "h": "Solve for the lighter, then subtract from 100.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.49 variant", "q": "Copper has two isotopes, ⁶³Cu (62.9296 u) and ⁶⁵Cu (64.9278 u), and an average atomic mass of 63.546 u. The percent abundance of ⁶⁵Cu is:", "o": ["69.15 %", "63.546 %", "30.85 %", "50.00 %"], "a": 2, "e": "Let ⁶³Cu = x: 62.9296x + 64.9278(1 − x) = 63.546 gives x = 0.6915. So ⁶⁵Cu = 1 − x = 30.85 %. The 69.15 % belongs to ⁶³Cu.", "h": "Solve for the lighter, then subtract from 100.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.49 variant", "q": "Silver has two isotopes, ¹⁰⁷Ag (106.905 u) and ¹⁰⁹Ag (108.905 u), and an average atomic mass of 107.868 u. The percent abundance of ¹⁰⁹Ag is:", "o": ["107.868 %", "48.15 %", "50.00 %", "51.85 %"], "a": 1, "e": "Let ¹⁰⁷Ag = x: 106.905x + 108.905(1 − x) = 107.868 gives x = 0.5185. So ¹⁰⁹Ag = 1 − x = 48.15 %. The 51.85 % belongs to ¹⁰⁷Ag.", "h": "Solve for the lighter, then subtract from 100.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.50 variant", "q": "Boron has two isotopes. ¹⁰B has mass 10.0129 u and abundance 19.9 %. The average atomic mass is 10.81 u. The mass of the other isotope is:", "o": ["10.41 u", "11.01 u", "8.82 u", "11.61 u"], "a": 1, "e": "a₁m₁ + a₂m₂ = average, so m₂ = (10.81 − 0.19899999999999998 × 10.0129) ÷ 0.801 = 11.01 u.", "h": "Subtract the known contribution, then divide by the other fraction.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.50 variant", "q": "Lithium has two isotopes. ⁶Li has mass 6.0151 u and abundance 7.5 %. The average atomic mass is 6.941 u. The mass of the other isotope is:", "o": ["7.02 u", "7.87 u", "6.48 u", "6.49 u"], "a": 0, "e": "a₁m₁ + a₂m₂ = average, so m₂ = (6.941 − 0.075 × 6.0151) ÷ 0.925 = 7.02 u.", "h": "Subtract the known contribution, then divide by the other fraction.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.50 variant", "q": "Chlorine has two isotopes. ³⁵Cl has mass 34.9688 u and abundance 75.78 %. The average atomic mass is 35.453 u. The mass of the other isotope is:", "o": ["36.97 u", "35.94 u", "8.95 u", "35.21 u"], "a": 0, "e": "a₁m₁ + a₂m₂ = average, so m₂ = (35.453 − 0.7578 × 34.9688) ÷ 0.242 = 36.97 u.", "h": "Subtract the known contribution, then divide by the other fraction.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48 Example 1", "q": "In the carbon example, the contribution of ¹²C (12.00000 u, 98.892 %) to the average atomic mass is:", "o": ["12.000 u", "11.867 u", "0.1441 u", "1186.7 u"], "a": 1, "e": "0.98892 × 12.00000 = 11.86704 u. The 0.1441 u is ¹³C's share.", "h": "Each isotope contributes mass × fraction.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48 Example 1", "q": "In the carbon example, the contribution of ¹³C (13.00335 u, 1.108 %) to the average atomic mass is:", "o": ["0.1441 u", "13.003 u", "11.867 u", "14.41 u"], "a": 0, "e": "0.01108 × 13.00335 = 0.14408 u. Add this to 11.86704 to get 12.0111 u.", "h": "Small abundance, small contribution.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.50 Exercise 1", "q": "The fractional abundance of ²⁰Ne (90.51 %) is:", "o": ["0.009051", "9.051", "0.9051", "90.51"], "a": 2, "e": "Divide the percentage by 100.", "h": "% ÷ 100.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.50 Exercise 1", "q": "In the neon data, which isotope contributes the most to the average atomic mass?", "o": ["All three equally", "²²Ne", "²¹Ne", "²⁰Ne"], "a": 3, "e": "²⁰Ne is 90.51 % of the atoms, so its share is about 18.10 u out of the 20.18 u total.", "h": "Biggest abundance wins.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.50 Exercise 1", "q": "The abundances of three isotopes of an element are listed. Which set is possible for a complete natural sample?", "o": ["90.51 %, 0.27 %, 9.22 %", "90.51 %, 2.70 %, 9.22 %", "91.51 %, 0.27 %, 9.22 %", "90.51 %, 0.27 %, 9.02 %"], "a": 0, "e": "Abundances must add to 100 %. Only 90.51 + 0.27 + 9.22 = 100.00.", "h": "Add them up.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.48 Example 1", "q": "How many ¹³C atoms would you expect in a sample of 10 000 carbon atoms, given ¹³C = 1.108 %?", "o": ["About 1108", "About 111", "About 11", "About 9889"], "a": 1, "e": "10 000 × 0.01108 = 110.8, so about 111. The 9889 is the number of ¹²C.", "h": "Total × fraction.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.50 Exercise 3", "q": "In a sample of 2000 chlorine atoms, about how many are ³⁷Cl if ³⁷Cl is 24.10 % of chlorine?", "o": ["About 24", "About 4820", "About 482", "About 1518"], "a": 2, "e": "2000 × 0.2410 = 482. The 1518 are ³⁵Cl.", "h": "Count = fraction × total.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch5 p.50 Exercise 1", "q": "Which value best represents the average atomic mass of neon?", "o": ["20.18 u", "19.99 u", "21.99 u", "20.99 u"], "a": 0, "e": "It sits just above 20 because ²⁰Ne dominates, with small shares from ²¹Ne and ²²Ne. The three given values are the individual isotope masses.", "h": "Average ≠ any single isotope mass.", "t": "Determination of Relative and Average Atomic Masses", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.51 Example 1", "q": "Balance Fe + O₂ → Fe₂O₃. The coefficients (Fe, O₂, Fe₂O₃) are:", "o": ["2, 1, 1", "2, 3, 2", "4, 3, 2", "4, 2, 3"], "a": 2, "e": "Oxygen is odd on the right (3 per Fe₂O₃), so take 2 Fe₂O₃ to get 6 O, which needs 3 O₂. Six O on the left, six on the right. Now Fe: 4 on the right, so 4 Fe. Answer 4Fe + 3O₂ → 2Fe₂O₃.", "h": "Fix the element that appears in only one place on each side last; use the O count to start.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.51 Example 2", "q": "Balance C₂H₆ + O₂ → CO₂ + H₂O. The coefficient of O₂ is:", "o": ["7", "5", "3.5", "4"], "a": 0, "e": "Start with C and H: 2C₂H₆ + O₂ → 4CO₂ + 6H₂O. Oxygen on the right is 8 + 6 = 14, so O₂ needs 7. Written as 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O. If you leave it as 1 C₂H₆ you get 3.5 O₂, which is correct ratio but not whole numbers.", "h": "Hydrocarbon combustion: balance C, then H, then O last. Clear fractions by doubling.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.51 Exercise i", "q": "Balance H₂ + O₂ → H₂O. The coefficients (H₂, O₂, H₂O) are:", "o": ["1, 1, 1", "1, 2, 2", "2, 2, 2", "2, 1, 2"], "a": 3, "e": "Two O atoms in O₂ need two H₂O, which gives four H, so two H₂. 2H₂ + O₂ → 2H₂O.", "h": "Never change a subscript to balance; H₂O₂ is a different compound.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.51 Exercise ii", "q": "Balance SiCl₄ + H₂O → SiO₂ + HCl. The coefficient of HCl is:", "o": ["4", "8", "1", "2"], "a": 0, "e": "SiCl₄ has four Cl so you need 4HCl. That brings 4 H, so 2H₂O, which supplies the 2 O for SiO₂. SiCl₄ + 2H₂O → SiO₂ + 4HCl.", "h": "Balance the element with the biggest number first (Cl here).", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.51 Exercise iii", "q": "Balance PCl₅ + H₂O → H₃PO₄ + HCl. The coefficients of H₂O and HCl are:", "o": ["4 and 4", "5 and 4", "3 and 5", "4 and 5"], "a": 3, "e": "Five Cl give 5HCl. Four O in H₃PO₄ means 4H₂O, which gives 8 H on the left and 3 + 5 = 8 on the right. PCl₅ + 4H₂O → H₃PO₄ + 5HCl.", "h": "Count H last; it should come out equal by itself if O and Cl are right.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.51 Exercise iv", "q": "Balance CaO + P₄O₁₀ → Ca₃(PO₄)₂. The coefficient of CaO is:", "o": ["4", "3", "2", "6"], "a": 3, "e": "P₄O₁₀ has 4 P, so you need 2Ca₃(PO₄)₂, which carries 6 Ca. Then 6CaO + P₄O₁₀ → 2Ca₃(PO₄)₂. Oxygen: 6 + 10 = 16 and 2 × 8 = 16.", "h": "Balance Ca and P first, check O at the end.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.51 Exercise v", "q": "Complete combustion of CH₃CH₂CH₂CH(OH)CH₂OH (C₅H₁₂O₂) gives CO₂ and H₂O. The coefficient of O₂ is:", "o": ["8", "6.5", "5", "7"], "a": 3, "e": "C₅H₁₂O₂ + xO₂ → 5CO₂ + 6H₂O. Oxygen on the right is 10 + 6 = 16. The compound already holds 2 O, so O₂ supplies 14 O, which is 7 O₂.", "h": "The O already inside the compound reduces how much O₂ you need.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.51 Exercise vi", "q": "Balance MnO₄⁻ + H⁺ + 5e⁻ → Mn²⁺ + H₂O. The coefficients of H⁺ and H₂O are:", "o": ["5 and 4", "8 and 4", "8 and 2", "4 and 2"], "a": 1, "e": "Four O in MnO₄⁻ give 4H₂O, which needs 8 H⁺. Check charge: −1 + 8 − 5 = +2, matching Mn²⁺. ⚠ The book prints the product as Mn₂⁺, which is a typo; it is Mn²⁺ (charge 2+).", "h": "⚠ TRAP: half-equations must balance atoms AND charge. Balance O with H₂O, then H with H⁺.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.51 variant", "q": "Balance C₃H₈ + O₂ → CO₂ + H₂O. The coefficients (C₃H₈, O₂, CO₂, H₂O) are:", "o": ["1, 3, 3, 4", "2, 5, 6, 8", "1, 4, 3, 5", "1, 5, 3, 4"], "a": 3, "e": "3 C give 3CO₂, 8 H give 4H₂O, so O on the right is 6 + 4 = 10, which is 5 O₂.", "h": "Propane burns with 5 O₂.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.58 Example", "q": "Balance C₆H₆ + O₂ → CO₂ + H₂O (this is the equation used for the benzene stoichiometry example). The coefficients are:", "o": ["1, 15, 6, 6", "2, 15, 12, 6", "2, 12, 12, 6", "1, 7.5, 6, 3"], "a": 1, "e": "1 C₆H₆ needs 7.5 O₂; double everything to clear the fraction: 2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O.", "h": "Fractions in an equation? Double it.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.51 variant", "q": "Balance Al + O₂ → Al₂O₃. The coefficients (Al, O₂, Al₂O₃) are:", "o": ["4, 2, 2", "2, 1, 1", "4, 3, 2", "2, 3, 1"], "a": 2, "e": "O: 3 per Al₂O₃ and 2 per O₂, so least common multiple is 6, giving 2Al₂O₃ and 3O₂. Then Al is 4.", "h": "Same pattern as Fe₂O₃: 4, 3, 2.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.51-52 Example", "q": "Calculate the percentage of nitrogen in magnesium nitrate, Mg(NO₃)₂ (Mg = 24.31, N = 14.01, O = 16.00).", "o": ["27.78 %", "18.89 %", "9.45 %", "14.01 %"], "a": 1, "e": "Molar mass = 24.31 + 2(14.01) + 6(16.00) = 148.33 g/mol. Nitrogen contributes 2 × 14.01 = 28.02. 28.02 ÷ 148.33 × 100 = 18.89 %. Using one N only gives 9.45 %.", "h": "⚠ TRAP: multiply by the subscript outside the bracket too: (NO₃)₂ means 2 N and 6 O.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.51-52 Example", "q": "In the same compound, Mg(NO₃)₂, the percentage of oxygen is about:", "o": ["43.15 %", "64.72 %", "16.39 %", "32.36 %"], "a": 1, "e": "96.00 ÷ 148.33 × 100 = 64.72 %. Mg is 16.39 % and N is 18.89 %, and the three add to 100.", "h": "Percentages of all elements must add to 100.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.52 Exercise i", "q": "Calculate the percentage of oxygen in C₃H₈O₃ (glycerol).", "o": ["48.00 %", "34.78 %", "17.39 %", "52.17 %"], "a": 3, "e": "Molar mass = 36 + 8 + 48 = 92 g/mol. Oxygen = 48 ÷ 92 × 100 = 52.17 %. The 34.78 % comes from counting only 2 O.", "h": "Count atoms from the subscripts, then divide by the whole molar mass.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.52 Exercise ii", "q": "Calculate the percentage of oxygen in (NH₄)₂SO₄.", "o": ["24.24 %", "54.55 %", "48.48 %", "12.12 %"], "a": 2, "e": "Molar mass = 2(14 + 4) + 32 + 64 = 132 g/mol. Oxygen = 64 ÷ 132 × 100 = 48.48 %.", "h": "The bracket (NH₄)₂ doubles N and H but does not touch O.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.52 Exercise iii", "q": "Calculate the percentage of oxygen in N(CH₂CH₂OH)₃, which is C₆H₁₅NO₃.", "o": ["32.21 %", "25.50 %", "10.74 %", "48.00 %"], "a": 0, "e": "Expand the formula: 3 × (CH₂CH₂OH) gives C₆H₁₅O₃, plus N. Molar mass = 72 + 15 + 14 + 48 = 149. Oxygen = 48 ÷ 149 × 100 = 32.21 %.", "h": "⚠ TRAP: expand brackets fully, the H in OH counts as well (15 H, not 12).", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 5a", "q": "What is the mass of Al in 1.5 kg of AlCl₃ (Al = 27, Cl = 35.5)?", "o": ["101.1 g", "606.7 g", "303.4 g", "27.0 g"], "a": 2, "e": "Molar mass of AlCl₃ = 27 + 106.5 = 133.5. Fraction of Al = 27/133.5 = 0.2022. 0.2022 × 1500 g = 303.4 g.", "h": "Mass of element = (element mass ÷ molar mass) × sample mass.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 5b", "q": "What is the mass of Al in 1.5 kg of Al₂O₃?", "o": ["794.1 g", "529.4 g", "397.1 g", "1500 g"], "a": 0, "e": "Molar mass of Al₂O₃ = 54 + 48 = 102. Al = 54/102 × 1500 = 794.1 g. Using one Al gives 397.1 g.", "h": "Two Al atoms per formula unit.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 5c", "q": "What is the mass of Al in 1.5 kg of alum, KAl(SO₄)₂·12H₂O (K = 39, S = 32)?", "o": ["303.4 g", "76.0 g", "85.4 g", "170.9 g"], "a": 2, "e": "Molar mass = 39 + 27 + 2(96) + 12(18) = 474 g/mol. Al = 27/474 × 1500 = 85.4 g. Leaving out the water of crystallisation gives 258 and a wrong 157 g.", "h": "⚠ TRAP: water of crystallisation (·12H₂O) is part of the molar mass.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 6c", "q": "Calculate the percentage of K in K₂SO₄.", "o": ["44.83 %", "18.39 %", "39.00 %", "22.41 %"], "a": 0, "e": "Molar mass = 78 + 32 + 64 = 174. K = 78/174 × 100 = 44.83 %. S would be 18.39 %.", "h": "Two K per formula unit.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 6b", "q": "Calculate the percentage of C in CH₄.", "o": ["25 %", "12 %", "75 %", "33.3 %"], "a": 2, "e": "Molar mass of CH₄ = 12 + 4 = 16. C = 12/16 × 100 = 75 %, H = 25 %.", "h": "Methane is three-quarters carbon by mass.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 6a", "q": "Calculate the percentage of Li in LiBr (Li = 6.94, Br = 79.9).", "o": ["8.68 %", "50.00 %", "92.01 %", "7.99 %"], "a": 3, "e": "6.94 ÷ 86.84 × 100 = 7.99 %. The 92.01 % is bromine.", "h": "Light atom, heavy partner: tiny percentage.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 6d", "q": "Calculate the percentage of Cu in CuSO₄ (Cu = 63.5).", "o": ["60.19 %", "63.50 %", "20.07 %", "39.81 %"], "a": 3, "e": "Molar mass = 63.5 + 32 + 64 = 159.5. Cu = 63.5/159.5 × 100 = 39.81 %.", "h": "Check the answer is below 100 and that the other percentages are consistent.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.52-53 Example 1", "q": "Phenol contains 76.57 % C, 6.49 % H and 17.00 % O by mass (C = 12, H = 1, O = 16). Its empirical formula is:", "o": ["C₆H₆O₂", "C₆H₁₂O", "C₆H₆O", "C₃H₃O"], "a": 2, "e": "Moles: C 76.57/12 = 6.38, H 6.49/1 = 6.49, O 17.00/16 = 1.06. Divide by the smallest (1.06): C 6.0, H 6.1, O 1. So C₆H₆O.", "h": "Percent → grams (assume 100 g) → moles → divide by smallest → whole numbers.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.53 Exercise 1", "q": "Cyclohexanol contains 71.95 % C, 12.08 % H and 15.97 % O (C = 12.011, H = 1.0079, O = 15.99). Its empirical formula is:", "o": ["C₆H₁₂O", "C₆H₁₂O₂", "C₃H₆O", "C₆H₆O"], "a": 0, "e": "Moles: C 5.990, H 11.985, O 0.9987. Divide by 0.9987: 6.00 : 12.00 : 1. So C₆H₁₂O, which is also the molecular formula.", "h": "When the ratio comes out clean, stop. Do not multiply further.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.53 Exercise 2", "q": "Mebutamate contains 51.70 % C, 8.68 % H, 12.06 % N and 27.55 % O (C = 12.011, H = 1.0079, N = 14.0067, O = 15.999). Its empirical formula is:", "o": ["C₅H₁₀NO₂", "C₅H₁₀N₂O₂", "C₅H₅NO", "C₁₀H₂₀N₂O₄"], "a": 0, "e": "Moles: C 4.304, H 8.612, N 0.861, O 1.722. Divide by 0.861: 5 : 10 : 1 : 2. The formula C₁₀H₂₀N₂O₄ is the molecular formula, which is twice the empirical one.", "h": "Empirical means simplest ratio, so never quote a formula that can still be divided down.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.53 Exercise 3", "q": "A compound contains 19.3 % C, 2.5 % H and 11.69 % N (C = 12.011, H = 1.0079, N = 14.0067). Based only on these three elements, the C : H : N mole ratio is closest to:", "o": ["1 : 1 : 1", "3 : 4 : 2", "1 : 2 : 1", "2 : 3 : 1"], "a": 3, "e": "Moles: C 1.607, H 2.48, N 0.835. Divide by 0.835: C 1.92, H 2.97, N 1. That is 2 : 3 : 1. ⚠ The three percentages only add up to 33.5 %, so the rest of the compound is another element the book left out. Without it you cannot give the true empirical formula.", "h": "⚠ TRAP: check that the percentages add up to 100 before you start.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.53 Exercise 4", "q": "Ascorbic acid (vitamin C) contains 40.91 % C, 4.58 % H and 54.51 % O. Its empirical formula is:", "o": ["CH₂O", "C₆H₈O₆", "C₃H₃O₃", "C₃H₄O₃"], "a": 3, "e": "Moles: C 3.409, H 4.58, O 3.407. Divide by 3.407: 1 : 1.344 : 1. 1.344 is close to 4/3, so multiply by 3 to get 3 : 4 : 3. C₃H₄O₃. The real vitamin C is C₆H₈O₆.", "h": "⚠ TRAP: a ratio of 1.33 means multiply by 3, do not round to 1.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.54-55 Example 1", "q": "A 0.10 g sample of an alcohol (C, H and O only) burns to give 0.1910 g CO₂ and 0.1172 g H₂O (C = 12, H = 1, O = 16). The empirical formula is:", "o": ["C₃H₈O", "C₂H₄O", "C₂H₆O", "CH₃O"], "a": 2, "e": "C = 0.1910 × 12/44 = 0.0521 g. H = 0.1172 × 2/18 = 0.0130 g. O by difference = 0.10 − 0.0651 = 0.0349 g. Moles: C 0.00434, H 0.0130, O 0.00218. Divide by 0.00218: 2 : 6 : 1. C₂H₆O. ⚠ The book prints 0.1772 g in one line, but the data (and the answer) use 0.1172 g.", "h": "Combustion: CO₂ gives the carbon, H₂O gives the hydrogen, oxygen is found by difference.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.54-55 Example 1", "q": "In the combustion analysis above, how is the mass of oxygen in the alcohol found?", "o": ["Sample mass minus mass of C and H", "By adding the masses of CO₂ and H₂O", "From the mass of CO₂ only", "From the mass of H₂O only"], "a": 0, "e": "The oxygen in the CO₂ and H₂O partly comes from the O₂ gas used for burning, so you cannot read it from the products. You subtract C and H from the sample mass.", "h": "⚠ TRAP: never get O from the products. Use difference.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.56 Example 2", "q": "A gas contains 2.34 g of N and 5.34 g of O (N = 14, O = 16). Its empirical formula is:", "o": ["NO", "N₂O₅", "N₂O", "NO₂"], "a": 3, "e": "Moles: N 2.34/14 = 0.167, O 5.34/16 = 0.334. Divide by 0.167: 1 : 2. So NO₂.", "h": "If you are given masses, skip the percent step and go straight to moles.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.56 Exercise", "q": "A hydrocarbon burns to give 3.007 g CO₂ and 1.845 g H₂O. Its empirical formula is:", "o": ["CH₂", "C₂H₅", "CH₃", "CH₄"], "a": 2, "e": "C = 3.007 × 12/44 = 0.8201 g, which is 0.06834 mol. H = 1.845 × 2/18 = 0.2050 g, which is 0.2050 mol. Ratio H : C = 3.00, so CH₃ (really C₂H₆, ethane). ⚠ The book says the sample was 25 g, but C + H come to only 1.025 g, so the sample mass must be about 1.025 g.", "h": "⚠ TRAP: in hydrocarbon burning, C mass + H mass must equal the sample mass. Use that to spot wrong data.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.57 Example", "q": "Fruit sugar has a molar mass of 180.2 and empirical formula CH₂O. Its molecular formula is:", "o": ["CH₂O", "C₆H₁₂O₆", "C₁₂H₂₄O₁₂", "C₃H₆O₃"], "a": 1, "e": "Empirical mass = 12 + 2 + 16 = 30. n = 180.2 ÷ 30 = 6.007, which is 6. (CH₂O)₆ = C₆H₁₂O₆.", "h": "n = molar mass ÷ empirical mass; n must be a whole number.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.57 Exercise 1", "q": "Adenine has a molar mass of 135.1 and consists of 44.45 % C, 3.73 % H and 52.82 % N. Its molecular formula is:", "o": ["C₁₀H₁₀N₁₀", "C₂H₂N₂", "C₅H₅N₅", "CHN"], "a": 2, "e": "Moles: C 3.70, H 3.70, N 3.77. Ratio 1 : 1 : 1, so empirical CHN with mass 27.0. n = 135.1 ÷ 27.0 = 5. C₅H₅N₅.", "h": "Do the empirical formula first, then n.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.57 Exercise 2", "q": "A compound has 49.02 % C, 2.74 % H and 48.24 % Cl, and a molar mass of 147.0 (Cl = 35.45). Its molecular formula is:", "o": ["C₆H₄Cl₂", "C₃H₂Cl₂", "C₆H₄Cl", "C₃H₂Cl"], "a": 0, "e": "Moles: C 4.08, H 2.72, Cl 1.36. Divide by 1.36: 3 : 2 : 1. Empirical C₃H₂Cl has mass 73.45. 147.0 ÷ 73.45 = 2, so C₆H₄Cl₂.", "h": "Check by adding up: C₆H₄Cl₂ = 72 + 4 + 70.9 = 146.9.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.57 Exercise 3", "q": "The empirical formula of hydroquinone is C₃H₃O. If its molar mass is 110, its molecular formula is:", "o": ["C₃H₃O", "C₆H₆O", "C₆H₆O₂", "C₉H₉O₃"], "a": 2, "e": "Empirical mass = 36 + 3 + 16 = 55. n = 110 ÷ 55 = 2. C₆H₆O₂.", "h": "Quick check: 110 is exactly 2 × 55.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.58 Exercise 4", "q": "Ethylene (28.0 g/mol), cyclohexane (84.0 g/mol) and 1-pentene (70.0 g/mol) all have the empirical formula CH₂. Their molecular formulae are respectively:", "o": ["C₂H₄, C₆H₁₂, C₅H₁₀", "CH₂, C₃H₆, C₅H₁₀", "C₂H₄, C₅H₁₀, C₆H₁₂", "C₂H₄, C₆H₁₂, C₄H₈"], "a": 0, "e": "CH₂ = 14. n = 28/14 = 2, 84/14 = 6, 70/14 = 5. So C₂H₄, C₆H₁₂, C₅H₁₀.", "h": "Divide each molar mass by 14.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.58 Exercise 5", "q": "A liquid has empirical formula NO₂ and molar mass 92.0. Its molecular formula is:", "o": ["NO₂", "N₂O₂", "N₄O₈", "N₂O₄"], "a": 3, "e": "NO₂ = 46. 92 ÷ 46 = 2, so N₂O₄.", "h": "Brown NO₂ dimerises to colourless N₂O₄.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.58 Example", "q": "How many moles of CO₂ are produced when 4.30 mol of C₆H₆ burns completely? (2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O)", "o": ["12.9 mol", "51.6 mol", "25.8 mol", "8.60 mol"], "a": 2, "e": "2 mol C₆H₆ give 12 mol CO₂, so 4.30 × 12/2 = 25.8 mol. ⚠ The book’s working line writes 4.60 mol by mistake; the data is 4.30 mol.", "h": "Mole ratio = coefficient ratio, 6 CO₂ per C₆H₆.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.58 Exercise 1", "q": "How many moles of H₂O are produced from 0.40 mol of C₆H₆ in 2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O?", "o": ["2.4 mol", "0.13 mol", "0.40 mol", "1.2 mol"], "a": 3, "e": "0.40 × 6/2 = 1.2 mol H₂O.", "h": "Three H₂O per C₆H₆.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.59 Exercise 2", "q": "What mass of HCl is produced from 15.0 g of PCl₃ in PCl₃ + 3H₂O → 3HCl + H₃PO₃? (P = 31, Cl = 35.5, H = 1)", "o": ["3.98 g", "35.8 g", "5.97 g", "11.9 g"], "a": 3, "e": "PCl₃ = 137.5 g/mol, so 15.0 g = 0.1091 mol. × 3 gives 0.3273 mol HCl × 36.5 = 11.9 g. Without the ×3 you get 3.98 g. ⚠ The book calls the reactant “phosphorous tetrachloride”, but PCl₃ is phosphorus trichloride.", "h": "⚠ TRAP: HCl comes in threes. Use the equation, not the name.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.59 Exercise 3", "q": "What mass of Al is required to produce 4.0 g of H₂ in 2Al + 3H₂SO₄ → Al₂(SO₄)₃ + 3H₂? (Al = 27, H = 1)", "o": ["36 g", "18 g", "27 g", "54 g"], "a": 0, "e": "4.0 g H₂ = 2.0 mol. Al : H₂ = 2 : 3, so Al = 2.0 × 2/3 = 1.333 mol × 27 = 36 g. ⚠ The book’s printed equation shows the H₂ coefficient clumsily; with 3H₂ the answer is 36 g.", "h": "Convert grams → moles → ratio → grams.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.59 Exercise 4", "q": "How many grams of CO₂ form when 73.9 g of propane burns? (C₃H₈ + 5O₂ → 3CO₂ + 4H₂O)", "o": ["221.7 g", "110.9 g", "73.9 g", "24.6 g"], "a": 0, "e": "Propane = 44 g/mol, so 73.9 g = 1.680 mol. CO₂ = 3 × 1.680 = 5.039 mol × 44 = 221.7 g. Notice CO₂ has the same molar mass as propane, so the answer is exactly 3 × 73.9.", "h": "Because M(C₃H₈) = M(CO₂) = 44, the mass is simply tripled.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.59 Exercise 5", "q": "How many grams of oxygen can be obtained from 2.50 g of KClO₃ (K = 39, Cl = 35.5, O = 16) in 2KClO₃ → 2KCl + 3O₂?", "o": ["0.65 g", "0.98 g", "2.50 g", "1.47 g"], "a": 1, "e": "KClO₃ = 122.5 g/mol, so 2.50 g = 0.02041 mol. O₂ = 0.02041 × 3/2 = 0.03061 mol × 32 = 0.98 g.", "h": "3 O₂ per 2 KClO₃ means ×1.5.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.70 Exercise 2", "q": "What mass of CO and H₂ are needed to make 5.0 kg of CH₃OH in CO + 2H₂ → CH₃OH? (C = 12, H = 1, O = 16)", "o": ["5.0 kg CO and 0.625 kg H₂", "4.375 kg CO and 0.625 kg H₂", "4.375 kg CO and 1.25 kg H₂", "2.5 kg CO and 2.5 kg H₂"], "a": 1, "e": "CH₃OH = 32 g/mol, so 5000 g = 156.25 mol. CO = 156.25 mol × 28 = 4375 g. H₂ = 2 × 156.25 = 312.5 mol × 2 = 625 g. Check: 4375 + 625 = 5000 g.", "h": "Check by conservation of mass: reactants must add up to the product mass.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 4a", "q": "How many grams of KClO₃ must react to produce 4.00 mol of O₂ (2KClO₃ → 2KCl + 3O₂)?", "o": ["327 g", "490 g", "122.5 g", "218 g"], "a": 0, "e": "KClO₃ = 2/3 × 4.00 = 2.667 mol × 122.5 = 326.7 g.", "h": "Go from the wanted product back to the reactant.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 4b", "q": "How many grams of O₂ come from the complete decomposition of 9.25 g of KClO₃?", "o": ["6.04 g", "3.62 g", "9.25 g", "2.41 g"], "a": 1, "e": "9.25 ÷ 122.5 = 0.07551 mol. × 3/2 = 0.1133 mol O₂ × 32 = 3.62 g.", "h": "Multiply by 1.5, not 2/3, when going from KClO₃ to O₂.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 4c", "q": "How many moles of KClO₃ must decompose to prepare 12.0 g of O₂?", "o": ["0.56 mol", "0.25 mol", "0.14 mol", "0.375 mol"], "a": 1, "e": "12.0 g O₂ = 0.375 mol. KClO₃ = 0.375 × 2/3 = 0.25 mol.", "h": "Always check the direction of the ratio.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.71 Exercise 4d", "q": "How many grams of KCl are produced when 11.0 g of O₂ forms in the same reaction? (K = 39, Cl = 35.5)", "o": ["17.1 g", "25.6 g", "34.1 g", "11.0 g"], "a": 0, "e": "11.0 g O₂ = 0.3438 mol. KCl : O₂ = 2 : 3, so KCl = 0.2292 mol × 74.5 = 17.1 g.", "h": "KCl = 74.5 g/mol.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.60 Example 1", "q": "5.0 mol of Ba reacts with 12.0 mol of water in Ba + 2H₂O → Ba(OH)₂ + H₂. The limiting reagent is:", "o": ["H₂", "Ba", "H₂O", "Ba(OH)₂"], "a": 1, "e": "5.0 mol Ba needs 10 mol H₂O, and 12 mol is available, so Ba runs out first.", "h": "Work out how much of B is needed to use up all of A.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.60 Example 1", "q": "In the Ba + 2H₂O reaction (5.0 mol Ba, 12.0 mol water), the amount of water left unreacted is:", "o": ["7.0 mol", "2.0 mol", "5.0 mol", "10 mol"], "a": 1, "e": "Water used = 10 mol, so 12 − 10 = 2.0 mol is left over.", "h": "Excess = supplied − used.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.60-61 Example 2", "q": "25.0 g of N₂ reacts with 5.0 g of H₂ (N = 14, H = 1) in N₂ + 3H₂ → 2NH₃. The limiting reagent is:", "o": ["H₂", "Both are used up exactly", "N₂", "NH₃"], "a": 0, "e": "25 g N₂ would need 5.357 g H₂, but only 5.0 g is available, so H₂ runs out first. Note that H₂ is limiting even though it has far more moles (2.5 mol) than N₂ (0.89 mol). It needs 3 mol for every 1 mol of N₂.", "h": "⚠ TRAP: the one with more moles or the bigger mass is not automatically in excess.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.61 Example 2", "q": "From the same reaction (25.0 g N₂, 5.0 g H₂), the mass of NH₃ that forms is:", "o": ["34.0 g", "28.33 g", "30.36 g", "56.7 g"], "a": 1, "e": "Base the calculation on the limiting reagent, H₂: 6 g H₂ gives 34 g NH₃, so 5.0 g gives 5/6 × 34 = 28.33 g. The 30.36 g would come from N₂ (25 g × 34/28 = 30.36 g), but N₂ is in excess.", "h": "Product is always based on the limiting reagent.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.61 Example 2", "q": "In the same reaction, the mass of N₂ left over after H₂ is used up is about:", "o": ["20.0 g", "23.33 g", "1.67 g", "5.36 g"], "a": 2, "e": "H₂ used = 5.0 g, which takes 5/6 × 28 = 23.33 g N₂. Left over = 25.0 − 23.33 = 1.67 g.", "h": "Excess = start − used.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.61-62 Example", "q": "40.00 g of Mg reacts with 17.00 g of N₂ in 3Mg + N₂ → Mg₃N₂ (Mg = 24.3, N = 14). The limiting reagent is:", "o": ["Mg", "Mg₃N₂", "N₂", "Neither"], "a": 0, "e": "Mg = 1.646 mol. N₂ = 17.00/28 = 0.607 mol. Mg needs 3 × 0.607 = 1.82 mol of itself to use up the N₂, but only 1.646 mol is available. So Mg is limiting. ⚠ The book mixed up the figures (27.9 g instead of 72.9 g for 3 mol Mg) and claimed N₂ was limiting.", "h": "⚠ TRAP: 3 mol Mg = 72.9 g, not 27.9 g. A slip here flips the answer.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.61-62 Example", "q": "In the Mg + N₂ reaction (40.00 g Mg, 17.00 g N₂), the correct theoretical yield of Mg₃N₂ (100.9 g/mol) is:", "o": ["100.9 g", "61.26 g", "55.36 g", "30.30 g"], "a": 2, "e": "Mg limiting: 1.646 mol ÷ 3 = 0.5487 mol Mg₃N₂ × 100.9 = 55.36 g. The book got 61.26 g by taking N₂ as limiting (17/28 × 100.9).", "h": "Theoretical yield comes from the TRUE limiting reagent.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.62 Example", "q": "In the same reaction, the mass of the excess N₂ that remains is about:", "o": ["0 g", "15.4 g", "1.64 g", "13.1 g"], "a": 2, "e": "N₂ used = 0.5487 mol × 28 = 15.36 g. Left = 17.00 − 15.36 = 1.64 g.", "h": "Mg is limiting, so N₂ is the excess one.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "example", "s": "Ch6 p.62-63 Example", "q": "The book gets 96.32 % yield for Mg₃N₂ from the percent yield formula. Which formula did it use?", "o": ["Theoretical yield ÷ actual yield × 100", "Actual yield ÷ theoretical yield × 100", "Limiting reagent ÷ excess reagent × 100", "(Actual − theoretical) ÷ theoretical × 100"], "a": 1, "e": "% yield = actual ÷ theoretical × 100. The book used 59.01 g ÷ 61.26 g × 100 = 96.32 %. ⚠ The question also writes the actual yield as 59.01 mg while the solution uses g, and with the correct theoretical yield (55.36 g) 59.01 g would give over 100 %, which is impossible.", "h": "⚠ TRAP: percent yield can never be above 100 %. If it is, check the limiting reagent or the units.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.63 Exercise 1", "q": "Which is the more effective antacid: 0.50 g of NaHCO₃ or 0.50 g of Mg(OH)₂ (Na = 23, H = 1, C = 12, O = 16, Mg = 24.3)? Reaction with HCl: NaHCO₃ takes 1 HCl per mole, Mg(OH)₂ takes 2.", "o": ["Mg(OH)₂", "Cannot tell without the volume of acid", "Both are equally effective", "NaHCO₃"], "a": 0, "e": "NaHCO₃ = 84 g/mol, so 0.50 g = 0.00595 mol, neutralising 0.00595 mol HCl. Mg(OH)₂ = 58.3 g/mol, so 0.50 g = 0.00858 mol, neutralising 2 × 0.00858 = 0.01715 mol HCl. That is nearly 3 times more. ⚠ The book writes the first compound as “Na₂HCO₃”; the right formula is NaHCO₃ (sodium hydrogencarbonate).", "h": "The better antacid neutralises more moles of acid per gram.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.63 Exercise 1", "q": "How many moles of HCl does 0.50 g of Mg(OH)₂ (58.3 g/mol) neutralise?", "o": ["0.0086 mol", "0.0172 mol", "0.0060 mol", "0.50 mol"], "a": 1, "e": "0.50 ÷ 58.3 = 0.00858 mol. × 2 = 0.0172 mol.", "h": "2 HCl per Mg(OH)₂.", "t": "Stoichiometry and Chemical Equations", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch6 p.63 Exercise 2", "q": "12.0 g of HCl is mixed with 14.5 g of FeS in FeS + 2HCl → FeC
