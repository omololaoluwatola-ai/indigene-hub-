hanges to orange", "orange changes to green", "purple changes to colourless", "yellow changes to purple"], "a": 1, "e": "Orange Cr₂O₇²⁻ (Cr +6) is reduced to green Cr³⁺ (Cr +3).", "h": "Orange to green = reductant present."}, {"ch": 11, "k": "concept", "s": "Ch12 p.137", "q": "Which colour change shows Fe²⁺ has been oxidised to Fe³⁺ in solution?", "o": ["pale green to yellow-brown", "blue to colourless", "colourless to purple", "yellow-brown to pale green"], "a": 0, "e": "Fe²⁺ is pale green and Fe³⁺ is yellow-brown. Iron loses an electron.", "h": "Fe²⁺ green, Fe³⁺ brown."}, {"ch": 11, "k": "concept", "s": "Ch12 p.137", "q": "Potassium iodide solution is used to test for an oxidising agent. A positive result is:", "o": ["brown changes to colourless again", "purple changes to colourless", "colourless changes to green", "colourless to brown (iodine)"], "a": 3, "e": "Oxidant converts I⁻ to I₂ which is brown, and turns starch blue-black.", "h": "Iodide to iodine: brown, with starch blue-black."}, {"ch": 11, "k": "concept", "s": "Ch12 p.137", "q": "In the test above, iodide is acting as:", "o": ["a spectator ion", "a catalyst only", "an oxidising agent", "a reducing agent"], "a": 3, "e": "I⁻ loses an electron to form I₂, so it is oxidised and is therefore the reductant.", "h": "Iodide is a good reducing agent."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "The oxidation number of an uncombined element, e.g. O₂, S₈ or Fe, is:", "o": ["0", "equal to its valency", "−1", "+1"], "a": 0, "e": "Atoms in their elemental form are not bonded to different atoms, so they have zero charge.", "h": "All free elements = 0."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "The sum of the oxidation numbers in a neutral compound is:", "o": ["equal to the number of atoms", "−1", "+1", "0"], "a": 3, "e": "In an ion the sum equals the charge on the ion. In a neutral compound it equals zero.", "h": "Neutral = 0; ion = its charge."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "Oxygen in H₂O₂ has an oxidation number of:", "o": ["−1", "+1", "−2", "0"], "a": 0, "e": "In peroxides oxygen is −1 because of the O–O bond. Check: 2(+1) + 2x = 0, so x = −1.", "h": "⚠ TRAP: peroxides are −1, not −2."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "Hydrogen has an oxidation number of −1 in:", "o": ["NaH", "NH₃", "HCl", "H₂O"], "a": 0, "e": "In metal hydrides hydrogen is bonded to a less electronegative metal, so it is −1. In the others H is +1.", "h": "Metal + H = hydride, H is −1."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "Oxygen has a positive oxidation number in:", "o": ["Na₂O₂", "H₂O", "CO₂", "OF₂"], "a": 3, "e": "Fluorine is more electronegative than oxygen, so in OF₂ fluorine is −1 and oxygen is +2.", "h": "F beats O."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "Which element has an oxidation number of −1 in all its compounds?", "o": ["Chlorine", "Fluorine", "Hydrogen", "Oxygen"], "a": 1, "e": "Fluorine is the most electronegative element and has no positive state. Chlorine can be +1 to +7 with oxygen.", "h": "F is always −1."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "The oxidation number of Mn in KMnO₄ is:", "o": ["+7", "+4", "+6", "+2"], "a": 0, "e": "K is +1, 4 O is −8, so Mn = +7. In K₂MnO₄ it is +6.", "h": "Permanganate +7; manganate +6."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "The oxidation number of Cr in K₂Cr₂O₇ is:", "o": ["+3", "+12", "+7", "+6"], "a": 3, "e": "2(+1) + 2x + 7(−2) = 0 gives x = +6.", "h": "Divide by two chromium atoms."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "The oxidation number of N in HNO₃ is:", "o": ["+4", "−3", "+3", "+5"], "a": 3, "e": "+1 + N + 3(−2) = 0 gives N = +5.", "h": "Nitrate nitrogen is +5."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "In Li₂O the oxidation numbers of Li and O are:", "o": ["+1 and −2", "+1 and −1", "+2 and −1", "+2 and −2"], "a": 0, "e": "Group I metal is +1, oxygen is −2, and 2(+1) + (−2) = 0.", "h": "Group I = +1."}, {"ch": 11, "k": "concept", "s": "Ch12 p.138", "q": "The oxidation number of P in PF₃ is:", "o": ["+5", "+1", "−3", "+3"], "a": 3, "e": "Fluorine is −1, so P = +3.", "h": "F = −1 first."}, {"ch": 11, "k": "concept", "s": "Ch12 p.139", "q": "In Fe₃O₄ the average oxidation number of iron is:", "o": ["+2", "+3", "+8/3", "+4"], "a": 2, "e": "4(−2) = −8, so 3Fe = +8, giving +8/3. In reality it is a mixture of Fe²⁺ and 2 Fe³⁺.", "h": "Fractional means an average of two states."}, {"ch": 11, "k": "concept", "s": "Ch12 p.139", "q": "The oxidation number of N in NH₄⁺ is:", "o": ["+3", "−3", "+1", "−4"], "a": 1, "e": "N + 4(+1) = +1 gives N = −3.", "h": "Ion: sum = charge, not zero."}, {"ch": 11, "k": "concept", "s": "Ch12 p.139", "q": "The oxidation number of S in Na₂S₂O₃ (thiosulphate) is, on average:", "o": ["+2", "+4", "+6", "−2"], "a": 0, "e": "2(+1) + 2x + 3(−2) = 0 gives x = +2.", "h": "Average over both sulphur atoms."}, {"ch": 11, "k": "concept", "s": "Ch12 p.139", "q": "In SO₂ + 2H₂S → 3S + 2H₂O, sulphur in SO₂ is:", "o": ["reduced from +6 to 0", "reduced from +4 to 0", "oxidised from −2 to +4", "oxidised from +4 to 0"], "a": 1, "e": "SO₂ gains electrons and falls from +4 to 0; H₂S rises from −2 to 0. SO₂ is the oxidant here, H₂S the reductant.", "h": "SO₂ can be either oxidant or reductant because it is in an intermediate state."}, {"ch": 11, "k": "concept", "s": "Ch12 p.140", "q": "Why can SO₂ act as both an oxidising and a reducing agent?", "o": ["S is in an intermediate state (+4)", "It is a free uncombined element", "It is a solid at room temperature", "It has no sulphur atoms in it"], "a": 0, "e": "S can go from +4 up to +6 or down to 0 or −2, so SO₂ can lose or gain electrons depending on the partner.", "h": "Intermediate state: both are possible."}, {"ch": 11, "k": "concept", "s": "Ch12 p.140", "q": "H₂S can act only as a reducing agent because sulphur is at:", "o": ["zero oxidation state", "its lowest oxidation state (−2)", "an intermediate oxidation state", "its highest oxidation state"], "a": 1, "e": "Sulphur cannot go lower than −2, so H₂S can only lose electrons.", "h": "Lowest state = can only be oxidised."}, {"ch": 11, "k": "concept", "s": "Ch12 p.140", "q": "H₂SO₄ (concentrated) behaves as an oxidising agent because sulphur is at:", "o": ["−2", "its lowest oxidation state", "zero", "its highest oxidation state (+6)"], "a": 3, "e": "S at +6 cannot be oxidised further so it can only accept electrons.", "h": "Highest state = can only be reduced."}, {"ch": 11, "k": "concept", "s": "Ch12 p.141", "q": "Which is a combustion reaction in which carbon is oxidised?", "o": ["NaOH + HCl → NaCl + H₂O", "AgNO₃ + NaCl → AgCl + NaNO₃", "CH₄ + 2O₂ → CO₂ + 2H₂O", "CaCO₃ → CaO + CO₂"], "a": 2, "e": "Carbon rises from −4 in CH₄ to +4 in CO₂. The other three show no change in oxidation numbers.", "h": "Combustion is always redox."}, {"ch": 11, "k": "concept", "s": "Ch12 p.141", "q": "Which of these is a decomposition redox reaction?", "o": ["Cu(OH)₂ → CuO + H₂O", "CaCO₃ → CaO + CO₂", "2HgO → 2Hg + O₂", "NaHCO₃ → CO₂ + H₂O + Na₂CO₃"], "a": 2, "e": "Mercury goes +2 → 0 and oxygen goes −2 → 0. The others have no change in oxidation numbers.", "h": "Elements as products: redox."}, {"ch": 11, "k": "concept", "s": "Ch12 p.141", "q": "Zn + CuSO₄ → ZnSO₄ + Cu is a:", "o": ["hydrogen displacement reaction", "disproportionation reaction", "metal displacement reaction", "neutralisation reaction"], "a": 2, "e": "Zinc is above copper in the activity series, so it displaces copper from solution. Zn is oxidised, Cu²⁺ is reduced.", "h": "A more reactive metal pushes out a less reactive one."}, {"ch": 11, "k": "concept", "s": "Ch12 p.142", "q": "Which metal will NOT displace hydrogen from dilute HCl?", "o": ["Fe", "Cu", "Zn", "Mg"], "a": 1, "e": "Copper is below hydrogen in the activity series and is not reactive enough to reduce H⁺.", "h": "Metals below H do not react with dilute acids."}, {"ch": 11, "k": "concept", "s": "Ch12 p.142", "q": "Which of these reactions does NOT take place?", "o": ["Mg + FeSO₄ → MgSO₄ + Fe", "Fe + CuSO₄ → FeSO₄ + Cu", "Cu + ZnSO₄ → CuSO₄ + Zn", "Zn + CuSO₄ → ZnSO₄ + Cu"], "a": 2, "e": "Copper is below zinc, so it cannot displace zinc from its salt.", "h": "Check the activity series order before answering."}, {"ch": 11, "k": "concept", "s": "Ch12 p.142", "q": "Which halogen is the strongest oxidising agent?", "o": ["F₂", "I₂", "Cl₂", "Br₂"], "a": 0, "e": "Oxidising power decreases down Group VII, so fluorine is the strongest.", "h": "F₂ > Cl₂ > Br₂ > I₂."}, {"ch": 11, "k": "concept", "s": "Ch12 p.142", "q": "Which halide ion is the strongest reducing agent?", "o": ["Cl⁻", "F⁻", "I⁻", "Br⁻"], "a": 2, "e": "Reducing power increases down the group because large I⁻ loses its electron most easily.", "h": "Opposite order to oxidising power."}, {"ch": 11, "k": "concept", "s": "Ch12 p.143", "q": "Which statement about the reaction 2Na + Cl₂ → 2NaCl is correct?", "o": ["Na is reduced from 0 to +1", "Cl₂ is reduced (0 to −1)", "Na is the oxidising agent", "Cl₂ is oxidised from 0 to −1"], "a": 1, "e": "Sodium loses one electron (oxidised, reductant) and chlorine gains one (reduced, oxidant).", "h": "Number up = oxidised; down = reduced."}, {"ch": 11, "k": "concept", "s": "Ch12 p.143", "q": "Which statement about 2Mg + O₂ → 2MgO is correct?", "o": ["Mg is oxidised", "Mg is reduced", "O₂ is oxidised", "O₂ is the reducing agent"], "a": 0, "e": "Magnesium loses 2 electrons per atom and rises from 0 to +2. Oxygen is reduced.", "h": "Metal burning in oxygen: metal oxidised."}, {"ch": 11, "k": "concept", "s": "Ch12 p.143", "q": "In the reaction Fe₂O₃ + 3CO → 2Fe + 3CO₂, the reducing agent is:", "o": ["Fe₂O₃", "CO", "Fe", "CO₂"], "a": 1, "e": "Carbon rises from +2 to +4 (oxidised), so CO is the reductant. Fe goes +3 → 0, so Fe₂O₃ is the oxidant.", "h": "⚠ TRAP: the oxide that loses oxygen is the oxidant."}, {"ch": 11, "k": "concept", "s": "Ch12 p.143", "q": "In Fe₂O₃ + 3CO → 2Fe + 3CO₂, the iron(III) oxide is:", "o": ["both oxidised and reduced", "reduced", "unchanged", "oxidised"], "a": 1, "e": "Fe falls from +3 to 0.", "h": "Loss of oxygen = reduction."}, {"ch": 11, "k": "concept", "s": "Ch12 p.135", "q": "Which reaction is NOT a redox reaction?", "o": ["2Na + Cl₂ → 2NaCl", "2H₂O₂ → 2H₂O + O₂", "NaOH + HCl → NaCl + H₂O", "Zn + 2HCl → ZnCl₂ + H₂"], "a": 2, "e": "In the neutralisation no element changes its oxidation number.", "h": "Check every element: if none change, it is not redox."}, {"ch": 11, "k": "concept", "s": "Ch12 p.135", "q": "In 2KI + Cl₂ → 2KCl + I₂, which species is oxidised?", "o": ["Cl⁻", "I⁻", "K⁺", "Cl₂"], "a": 1, "e": "Iodide loses an electron to form I₂, so its oxidation number rises from −1 to 0. K⁺ is a spectator.", "h": "Spectators never change number."}, {"ch": 11, "k": "concept", "s": "Ch12 p.149", "q": "In balancing redox equations, the number of electrons lost by the reductant must be:", "o": ["one less than the number gained", "equal to the number gained by the oxidant", "double the number gained by the oxidant", "independent of the oxidant"], "a": 1, "e": "Electrons are not created or destroyed, so the two half-reactions must be multiplied until the electrons match.", "h": "Match electrons, then add."}, {"ch": 13, "k": "past", "s": "Practice Questions p.150", "q": "Which symbol is used for the factor 10⁻⁶?", "o": ["n", "m", "μ", "M"], "a": 2, "e": "10⁻⁶ is micro (μ). M is mega (10⁶), m is milli (10⁻³), n is nano (10⁻⁹).", "h": "Micro is the small Greek mu.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.150", "q": "The factor 0.001 corresponds to which prefix?", "o": ["milli", "deka", "deci", "centi"], "a": 0, "e": "0.001 = 10⁻³ = milli. Deci is 0.1 and centi is 0.01.", "h": "Milli = thousandth.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.150", "q": "How many significant figures are in the answer to 23.1 + 0.5848 + 11?", "o": ["three", "one", "four", "two"], "a": 3, "e": "The sum is 34.6848. For addition, the answer keeps the least number of decimal places, and 11 has none. So you round to 35, which has two significant figures.", "h": "Add or subtract: count decimal places. Multiply or divide: count sig figs.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.150", "q": "Round off 00307506 to four significant figures.", "o": ["3.075 × 10⁵", "3100", "3076", "0031"], "a": 0, "e": "Leading zeros do not count, so the number is 307506. Four significant figures: 3075 followed by two more places, so 3.075 × 10⁵ (the next digit is 0, so we round down).", "h": "Strip leading zeros, then count from the first non-zero digit.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.150", "q": "Convert 0.008723 to standard scientific notation.", "o": ["8723 × 10⁶", "8.723 × 10⁻³", "8723 × 10⁻⁶", "8.723 × 10³"], "a": 1, "e": "Move the decimal three places to the right to get 8.723, so the power is −3. Standard form keeps only one digit before the decimal point.", "h": "Small number = negative power.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.150", "q": "Convert 7.0 μm to metres.", "o": ["7.0 × 10⁹ m", "7.0 × 10⁶ m", "7.0 × 10⁻⁶ m", "7.0 × 10³ m"], "a": 2, "e": "Micro = 10⁻⁶, so 7.0 μm = 7.0 × 10⁻⁶ m.", "h": "Micro to metre: ×10⁻⁶.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.150", "q": "The fundamental SI unit of mass is the:", "o": ["metre", "kelvin", "millilitre", "kilogram"], "a": 3, "e": "The kilogram is the SI base unit of mass. Kelvin is temperature and metre is length.", "h": "Mass in SI = kg, not g.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.151", "q": "According to history, the idea that all matter is made of atoms was first proposed by:", "o": ["Democritus, but it was not widely accepted until modern times", "Dalton, but it was not accepted until Einstein", "Dalton, and it was accepted within a few decades", "Mendeleev, and it was widely accepted at once"], "a": 0, "e": "Democritus, the Greek philosopher, proposed it first. Dalton revived it with experimental evidence much later.", "h": "Democritus first, Dalton later.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.151", "q": "Mendeleev arranged the elements according to:", "o": ["atomic weight and chemical reactivity", "electron configuration and atomic weight", "physical state and relative abundance", "atomic number and atomic weight"], "a": 0, "e": "Mendeleev used atomic weight and grouped elements with similar chemical behaviour. Atomic number came later with Moseley.", "h": "⚠ TRAP: atomic number = Moseley/modern table; atomic weight = Mendeleev.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.151", "q": "Elements in a periodic group have similar:", "o": ["physical properties", "masses", "chemical properties", "densities"], "a": 2, "e": "Elements in a group have the same number of valence electrons, so they react in a similar way.", "h": "Same group, same chemistry.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.151", "q": "Which group of elements reacts violently with water?", "o": ["noble gases", "alkali metals", "transition metals", "halogens"], "a": 1, "e": "Alkali metals (Group I) react vigorously with cold water to give hydrogen and the hydroxide. Noble gases do not react.", "h": "Group I and water: violent.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.151", "q": "The existence of electrons in atoms of all elements was shown by:", "o": ["Millikan’s oil drop experiment", "Rutherford’s gold foil experiment", "Thomson’s cathode ray tube experiment", "Dalton’s atomic theory"], "a": 2, "e": "Thomson found the same negative particle from cathode rays whatever the gas or metal used. Millikan measured the charge and Rutherford found the nucleus.", "h": "Thomson = electron, Millikan = charge, Rutherford = nucleus.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.151", "q": "In Rutherford’s gold foil experiment, most of the alpha particles:", "o": ["passed straight through the foil without deflection", "were absorbed by the foil", "were deflected through very large angles", "bounced directly back from the foil"], "a": 0, "e": "Most of the atom is empty space, so most alpha particles went straight through. Only a few were deflected, and very few bounced back.", "h": "Most through, some deflected, very few back.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.154", "q": "Which statement about real gases is true?", "o": ["Forces of attraction and repulsion exist between the gas particles at close range", "The behaviour of real gases is exactly predicted by the ideal gas law", "The particles have no volume at all", "The mass of the gas particles is zero"], "a": 0, "e": "Real gas particles have mass and volume, and they attract and repel each other when close. That is why gases deviate from ideal behaviour at high pressure and low temperature.", "h": "Ideal gas ignores forces and volume. Real gas does not.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.154", "q": "Which one of these is NOT used to describe the condition of a gas?", "o": ["temperature of the gas", "pressure of the gas", "number of moles present", "electronic configuration"], "a": 3, "e": "The condition (state) of a gas is described by P, V, T and n. Electronic configuration describes an atom, not the state of a gas.", "h": "P, V, T, n only.", "t": "Physical Quantities, Atom & States of Matter"}, {"ch": 13, "k": "past", "s": "Practice Questions p.154", "q": "Molarity is defined as:", "o": ["moles of solute per litre of solvent", "moles of solute per litre of solution", "moles of solvent per litre of solvent", "moles of solvent per litre of solution"], "a": 1, "e": "Molarity = moles of solute ÷ volume of solution in litres. Molality uses kilograms of solvent.", "h": "⚠ TRAP: molarity = solution, molality = solvent.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.154", "q": "Chemical equations are balanced in order to obey the law of:", "o": ["definite proportions", "conservation of mass", "mass action", "multiple proportions"], "a": 1, "e": "Atoms are not created or destroyed, so the number of each atom must be the same on both sides.", "h": "Balance = conserve mass.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.154", "q": "Which of these contains Avogadro’s number of formula units?", "o": ["36.5 g of NaCl", "36.5 g of Cl₂", "36.5 g of HCl", "36.5 g of Cl atoms only"], "a": 2, "e": "Molar mass of HCl is about 36.5 g/mol, so 36.5 g is one mole. 36.5 g of Cl₂ is only about 0.51 mol. 36.5 g of Cl atoms is about 1.03 mol, which is not exactly one mole.", "h": "Match the grams to the molar mass of that exact formula.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.155", "q": "What is the molar mass of aspartic acid, C₄H₇NO₄?", "o": ["197 g/mol", "70 g/mol", "43 g/mol", "133 g/mol"], "a": 3, "e": "4(12.01) + 7(1.008) + 14.01 + 4(16.00) = 48.04 + 7.06 + 14.01 + 64.00 = 133.1 g/mol.", "h": "Carbon ×12, hydrogen ×1, nitrogen ×14, oxygen ×16.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.155", "q": "How many moles are in 1.50 g of ethylamine, CH₃CH₂NH₂?", "o": ["90.16 mol", "45.08 mol", "0.0222 mol", "0.0333 mol"], "a": 3, "e": "The formula is C₂H₇N, molar mass = 24.02 + 7.06 + 14.01 = 45.09 g/mol. Moles = 1.50 ÷ 45.09 = 0.0333 mol. The 45.08 mol option is the molar mass, not moles.", "h": "Moles = mass ÷ molar mass.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.155", "q": "Ozone decomposes as 2O₃ → 3O₂. How many grams of oxygen form from 96 g of ozone?", "o": ["16 g", "96 g", "6 g", "32 g"], "a": 1, "e": "Mass is conserved. All the atoms in 96 g of ozone are oxygen atoms, so they must make 96 g of O₂.", "h": "Same atoms in, same mass out.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.155", "q": "The book asks for the oxidation number of Cr in “K₂Cr₂O₄”. As printed, the answer is:", "o": ["+3", "+6", "−2", "+7"], "a": 0, "e": "2(+1) + 2x + 4(−2) = 0 gives x = +3, which matches the book’s key. ⚠ The formula looks like a misprint. In the usual K₂CrO₄ or K₂Cr₂O₇, chromium is +6, so read the formula carefully in the exam.", "h": "⚠ TRAP: always solve with the formula printed, then check if it makes chemical sense.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.155", "q": "How many grams of KNO₃ are needed to make 250. mL of a 0.135 M solution?", "o": ["6.82 g", "0.341 g", "3.41 g", "1.71 g"], "a": 2, "e": "Moles = 0.135 × 0.250 = 0.03375 mol. Mass = 0.03375 × 101.1 = 3.41 g.", "h": "Moles = M × V (in litres), then × molar mass.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.155", "q": "How many millilitres of 6.0 M HNO₃ are needed to make 0.25 L of 3.5 M HNO₃?", "o": ["686 mL", "428 mL", "119 mL", "146 mL"], "a": 3, "e": "M₁V₁ = M₂V₂. V₁ = (3.5 × 250) ÷ 6.0 = 145.8, about 146 mL.", "h": "Dilution: C₁V₁ = C₂V₂.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.155", "q": "The net ionic equation for H₂SO₄(aq) + Ba(OH)₂(aq) is:", "o": ["H⁺(aq) + OH⁻(aq) → H₂O(l), with Ba²⁺ and SO₄²⁻ as spectators", "H₂SO₄(aq) + Ba(OH)₂(aq) → BaSO₄(s) + 2H₂O(l), the molecular form", "2H⁺ + SO₄²⁻ + Ba²⁺ + 2OH⁻ → BaSO₄(s) + 2H₂O(l)", "Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s), with H⁺ and OH⁻ as spectators"], "a": 2, "e": "Both the BaSO₄ precipitate and the water are formed, so no ion is a spectator here. H⁺ and OH⁻ combine, and Ba²⁺ and SO₄²⁻ combine at the same time.", "h": "No spectators in this one. Everything reacts.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.156", "q": "How many litres of O₂ at STP are needed to burn 55.6 g of methane? (CH₄ + 2O₂ → CO₂ + 2H₂O)", "o": ["39.0 L", "19.5 L", "156 L", "77.8 L"], "a": 2, "e": "Moles CH₄ = 55.6 ÷ 16.04 = 3.47. O₂ needed = 2 × 3.47 = 6.93 mol. Volume = 6.93 × 22.4 = 155 L, closest to 156 L.", "h": "Mole ratio first, then × 22.4 L at STP.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.156", "q": "Molality is defined as moles of solute per:", "o": ["mole of solvent", "total moles present", "litre of solution", "kilogram of solvent"], "a": 3, "e": "Molality (m) = moles of solute ÷ kg of solvent. It does not change with temperature.", "h": "m is for mass of solvent.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.156", "q": "A 3.17 m solution of CaCl₂ has a density of 1.24 g/mL. What is the molarity?", "o": ["2.91 M", "3.93 M", "3.50 M", "2.56 M"], "a": 0, "e": "Take 1 kg of water: 3.17 mol × 110.98 = 351.8 g of CaCl₂. Solution mass = 1351.8 g. Volume = 1351.8 ÷ 1.24 = 1090 mL = 1.090 L. M = 3.17 ÷ 1.090 = 2.91 M.", "h": "Assume 1 kg solvent, find the solution volume from density.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.156", "q": "What mass of HNO₃ (63 g/mol) is in 300 mL of 0.30 M HNO₃?", "o": ["5.67 g", "0.30 g", "6.30 g", "30.0 g"], "a": 0, "e": "Moles = 0.30 × 0.300 = 0.090 mol. Mass = 0.090 × 63 = 5.67 g.", "h": "Convert mL to L before multiplying.", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.156", "q": "Percentage of nitrogen in magnesium nitrate, Mg(NO₃)₂ (Mg = 24.31, N = 14.01, O = 16.00):", "o": ["0.01889%", "18.89%", "1.889%", "0.1889%"], "a": 1, "e": "Molar mass = 24.31 + 2(14.01 + 48.00) = 148.33. Nitrogen = 28.02. 28.02 ÷ 148.33 × 100 = 18.89%.", "h": "Count both nitrogens (the 2 outside the bracket).", "t": "Mole Concept, Stoichiometry & Solutions"}, {"ch": 13, "k": "past", "s": "Practice Questions p.157", "q": "A saturated solution is one that:", "o": ["has pure solvent only", "is not in equilibrium with undissolved solute", "is in equilibrium with undissolved solute", "contains a lot of solute"], "a": 2, "e": "In a saturated solution dissolving and crystallising go at the same rate. More solute will not dissolve.", "h": "Saturated means: equilibrium with solid.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.157", "q": "Which of these compounds is NOT an Arrhenius acid?", "o": ["HF", "H₂SO₃", "KOH", "HClO"], "a": 2, "e": "KOH gives OH⁻ in water, so it is an Arrhenius base. The other three give H⁺.", "h": "Acid gives H⁺. Base gives OH⁻.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.157", "q": "When dissolved in water, NaOH behaves as:", "o": ["an acid that forms NaO⁻ and H⁺ ions", "an acid that forms Na⁺ and OH⁻ ions", "a base that forms Na⁺ and OH⁻ ions", "a base that forms NaO⁻ and H⁺ ions"], "a": 2, "e": "NaOH dissociates into Na⁺ and OH⁻. The OH⁻ makes it a base.", "h": "OH⁻ present = base.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.157", "q": "Arrhenius bases provide which ion when they dissolve in water?", "o": ["Cl⁻", "H⁺", "Na⁺", "OH⁻"], "a": 3, "e": "Arrhenius base = substance that increases OH⁻ concentration in water.", "h": "Base = hydroxide.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.157", "q": "How many H⁺ ions can H₂CO₃ donate per molecule?", "o": ["3", "2", "1", "0"], "a": 1, "e": "Carbonic acid is diprotic: it has two ionisable hydrogens.", "h": "Count the acidic H atoms in the formula.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.157", "q": "The net ionic equation for HCN(aq) + NaOH(aq) is:", "o": ["Na⁺ + CN⁻ → NaCN", "HCN(aq) + OH⁻(aq) → CN⁻(aq) + H₂O(l)", "HCN + NaOH → NaCN + H₂O (molecular form)", "H⁺(aq) + OH⁻(aq) → H₂O(l)"], "a": 1, "e": "HCN is a weak acid, so it stays as molecules and is written whole. Na⁺ is a spectator, and the strong base gives OH⁻.", "h": "⚠ TRAP: weak acid stays as HCN. Only strong acids are split into H⁺.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "The reaction 2HNO₃ + Ba(OH)₂ → Ba(NO₃)₂ + 2H₂O is best classified as:", "o": ["an acid-base neutralisation reaction", "a precipitation reaction", "a single replacement reaction", "an oxidation-reduction reaction"], "a": 0, "e": "An acid and a base give a salt and water. No oxidation numbers change.", "h": "Acid + base = salt + water.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "Calculate [OH⁻] in an aqueous solution with [H₃O⁺] = 3.50 × 10⁻³ M.", "o": ["2.86 × 10⁻⁴ M", "2.86 × 10⁻¹¹ M", "3.50 × 10⁻¹² M", "2.86 × 10⁻¹² M"], "a": 3, "e": "[OH⁻] = Kw ÷ [H₃O⁺] = 1.0 × 10⁻¹⁴ ÷ 3.50 × 10⁻³ = 2.86 × 10⁻¹² M.", "h": "[H⁺][OH⁻] = 10⁻¹⁴ at 25 °C.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "If Kw at 40 °C is 2.92 × 10⁻¹⁴, the [H₃O⁺] in a neutral solution is:", "o": ["1.71 × 10⁻⁷ M", "less than 1.71 × 10⁻⁷ M", "greater than 1.71 × 10⁻⁷ M", "less than 1.00 × 10⁻⁷ M"], "a": 0, "e": "In a neutral solution [H₃O⁺] = [OH⁻], so each equals √Kw = √(2.92 × 10⁻¹⁴) = 1.71 × 10⁻⁷ M.", "h": "Neutral: take the square root of Kw.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "Calculate the pH of an acetic acid solution containing 2.15 × 10⁻³ M hydronium ion.", "o": ["11.33", "2.67", "2.15 × 10⁻³", "4.65 × 10⁻¹²"], "a": 1, "e": "pH = −log(2.15 × 10⁻³) = 2.67.", "h": "pH = −log[H⁺].", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "Calculate the pH of a pyridine solution containing 2.15 × 10⁻⁴ M hydroxide ion.", "o": ["2.15 × 10⁻⁴", "3.67", "10.33", "4.65 × 10⁻¹¹"], "a": 2, "e": "pOH = −log(2.15 × 10⁻⁴) = 3.67. pH = 14 − 3.67 = 10.33.", "h": "From OH⁻: find pOH, then 14 − pOH.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "Which solution has the highest [OH⁻]?", "o": ["pH = 10.93", "pH = 3.21", "pH = 12.04", "pH = 7.83"], "a": 2, "e": "The higher the pH, the lower the [H⁺] and the higher the [OH⁻].", "h": "Highest pH = most hydroxide.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "Which of these can be classified as a weak base?", "o": ["CH₃NH₂ only", "both CH₃NH₂ and NH₂OH", "NH₂OH only", "neither of them"], "a": 1, "e": "Both are nitrogen compounds that only partly ionise in water, like ammonia. So both are weak bases.", "h": "Amines and hydroxylamine are weak bases.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "Which of these species can NOT act as a Lewis base?", "o": ["NH₃", "O²⁻", "H₂O", "CH₄"], "a": 3, "e": "A Lewis base needs a lone pair to donate. CH₄ has none. O²⁻, H₂O and NH₃ all have lone pairs.", "h": "Lewis base = lone pair donor.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "Covalent bonding is the:", "o": ["transfer of electrons", "loss of electrons", "gain of electrons", "sharing of electrons"], "a": 3, "e": "In a covalent bond atoms share one or more pairs of electrons.", "h": "Covalent = share, ionic = transfer.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "What type of bonding is found in PCl₅?", "o": ["metallic bonding", "ionic bonding", "hydrogen bonding", "covalent bonding"], "a": 3, "e": "Both P and Cl are non-metals, so they share electrons. PCl₅ also has an expanded octet.", "h": "Non-metal + non-metal = covalent.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "Which bond has the highest bond dissociation energy?", "o": ["N≡N", "N–N", "N=N", "all are equal"], "a": 0, "e": "A triple bond is the shortest and the strongest, so it needs the most energy to break.", "h": "More bonds, shorter, stronger.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.158", "q": "The greater the electronegativity difference between two atoms, the:", "o": ["greater the bond order", "shorter the bond", "greater the covalent character", "greater the ionic character of the bond"], "a": 3, "e": "A large difference pulls the electron pair almost completely toward one atom, and the bond becomes ionic.", "h": "Big difference = ionic.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.159", "q": "Which of these is NOT a property of electrovalent compounds?", "o": ["They are made of positive and negative ions in crystal lattices", "They usually have high boiling points", "They usually have low melting points", "They are usually soluble in polar solvents"], "a": 2, "e": "Strong electrostatic attraction in the lattice gives HIGH melting and boiling points.", "h": "⚠ TRAP: ionic = high mp. Low mp = molecular.", "t": "Acids, Bases, Bonding & Forces"}, {"ch": 13, "k": "past", "s": "Practice Questions p.160", "q": "Which is a measure of the sum of the kinetic and potential energies of each particle in the system?", "o": ["E, the internal energy", "G, the Gibbs free energy", "T, the temperature", "H, the enthalpy"], "a": 0, "e": "Internal energy is the total of all kinetic and potential energies inside the system.", "h": "E = total energy inside.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.160", "q": "Which of these can be interpreted as a measure of randomness?", "o": ["enthalpy", "entropy", "free energy", "temperature"], "a": 1, "e": "Entropy (S) measures disorder or the number of ways to arrange the particles.", "h": "Entropy = disorder.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.160", "q": "For a process at constant pressure, q = 200 kJ and w = −85 kJ. Therefore:", "o": ["ΔE = 285 kJ and ΔH = 200 kJ", "ΔE = 200 kJ and ΔH = 285 kJ", "ΔE = 115 kJ and ΔH = 200 kJ", "ΔE = 200 kJ and ΔH = 115 kJ"], "a": 2, "e": "ΔE = q + w = 200 − 85 = 115 kJ. At constant pressure ΔH = q = 200 kJ.", "h": "ΔH = heat at constant pressure. ΔE = q + w.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.160", "q": "Under thermodynamic standard state conditions, the element oxygen occurs as:", "o": ["O₃(g)", "O₂(g)", "O₂(l)", "O(g)"], "a": 1, "e": "The most stable form of oxygen at standard conditions is diatomic gas. ΔHf° of O₂(g) is zero.", "h": "Standard state of oxygen: O₂ gas.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.160", "q": "Which combination always results in a spontaneous reaction?", "o": ["ΔH negative and ΔS positive", "ΔH positive and ΔS negative", "ΔH negative and ΔS negative", "ΔH positive and ΔS positive"], "a": 0, "e": "ΔG = ΔH − TΔS. A negative ΔH and a positive ΔS make ΔG negative at every temperature.", "h": "−ΔH and +ΔS: always spontaneous.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.160", "q": "The thermodynamic criterion for equilibrium at constant T and P is:", "o": ["ΔG < 0", "ΔS = 0", "ΔS > 0", "ΔG = 0"], "a": 3, "e": "At equilibrium there is no net drive in either direction, so ΔG = 0. ΔG < 0 means spontaneous.", "h": "Equilibrium ΔG = 0, spontaneous ΔG < 0.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.160", "q": "The energy of motion is:", "o": ["kinetic energy", "electrical energy", "reserve energy", "dam energy"], "a": 0, "e": "Kinetic energy is the energy an object has because it is moving.", "h": "Move = kinetic.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.160", "q": "Which of these is NOT a type of energy or energy transfer?", "o": ["heat", "thermal energy", "height", "work"], "a": 2, "e": "Height is a quantity, not energy. Height only gives potential energy when combined with mass and gravity.", "h": "Heat and work are transfers; height is not.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.161", "q": "The minimum energy barrier that must be overcome for a chemical reaction to occur is the:", "o": ["rate limiting energy", "potential energy", "activation energy", "net energy"], "a": 2, "e": "Reacting particles must collide with at least the activation energy for a reaction to take place.", "h": "Ea = energy hill.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.161", "q": "A zero-order reaction is one whose:", "o": ["rate is zero", "rate is independent of the reactant concentration", "rate depends on none of the products", "rate can be found from [A]t = −kt + ln[A]₀"], "a": 1, "e": "In a zero-order reaction, rate = k, so changing the concentration does not change the rate. ⚠ The rate is not zero.", "h": "⚠ TRAP: zero order does NOT mean zero rate.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.162", "q": "What is the overall order of the reaction with rate law: rate = k[H₂][NO]²?", "o": ["first order", "second order", "third order", "zero order"], "a": 2, "e": "Add the powers: 1 + 2 = 3.", "h": "Overall order = sum of exponents.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.162", "q": "In the initial rates method for A → B, doubling [A] quadruples the rate. The order with respect to A is:", "o": ["zeroth", "fourth", "first", "second"], "a": 3, "e": "Rate ∝ [A]ⁿ. If 2ⁿ = 4, then n = 2.", "h": "Doubling gives ×2ⁿ.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.162", "q": "The rate constant of a first-order reaction is 4.2 × 10⁻⁴ s⁻¹. What is the half-life?", "o": ["2.4 × 10³ s", "1.2 × 10³ s", "1.7 × 10³ s", "2.9 × 10⁻⁴ s"], "a": 2, "e": "t½ = 0.693 ÷ k = 0.693 ÷ (4.2 × 10⁻⁴) = 1650 s = 1.7 × 10³ s.", "h": "First order: t½ = 0.693/k.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.162", "q": "The elementary reaction 2HF → H₂ + F₂ is an example of a ______ reaction.", "o": ["termolecular", "unimolecular", "tetramolecular", "bimolecular"], "a": 3, "e": "Two HF molecules collide in one step, so it is bimolecular.", "h": "Molecularity = number of particles colliding.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.162", "q": "Which rate law corresponds to an elementary bimolecular reaction?", "o": ["Rate = k[A]²", "Rate = k[B]", "Rate = k[A][B]²", "Rate = k[A][B][C][D]"], "a": 0, "e": "For an elementary step, the exponents equal the coefficients. Two A molecules colliding gives k[A]². A bimolecular step cannot involve three molecules in the rate law.", "h": "Elementary step: exponents = number of molecules.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.162", "q": "A catalyst increases the rate of a reaction by providing a different pathway that:", "o": ["lowers only the activation energy", "affects all the energies of the reaction", "lowers the energy of the reactants and products", "raises only the energy of the products"], "a": 0, "e": "A catalyst gives a lower-Ea route. It does not change ΔH or the equilibrium position.", "h": "Catalyst: lower Ea, same ΔH.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.162", "q": "A reaction reaches dynamic equilibrium at a given temperature when:", "o": ["k forward is equal to k reverse always", "the reactions stop completely", "the amounts are constant and rate forward = rate reverse", "the amount of products exceeds the amount of reactants"], "a": 2, "e": "At equilibrium both reactions go on at the same rate, so concentrations stay fixed. They do not have to be equal.", "h": "Equilibrium = equal rates, not equal amounts.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.162", "q": "Which of these is a homogeneous equilibrium?", "o": ["CaSO₄(s) ⇌ Ca²⁺(aq) + SO₄²⁻(aq)", "NH₄NO₃(s) ⇌ N₂O(g) + 2H₂O(g)", "2H₂O₂(l) ⇌ 2H₂O(l) + O₂(g)", "2CO(g) + O₂(g) ⇌ 2CO₂(g)"], "a": 3, "e": "Everything is in the gas phase, so there is only one phase. The others mix solids, liquids or gases.", "h": "Same phase everywhere = homogeneous.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.162", "q": "Which statement is true?", "o": ["As a reaction at constant T and P goes to equilibrium, |ΔG| decreases", "The larger ΔG°, the faster the reaction", "The standard state for solutes is the pure solute at 1 atm", "At equilibrium ΔG° = 0"], "a": 0, "e": "ΔG gets closer to zero as the reaction approaches equilibrium. ΔG° does not predict speed. The standard state for solutes is 1 M, and at equilibrium ΔG (not ΔG°) is zero.", "h": "⚠ TRAP: ΔG = 0 at equilibrium, not ΔG°.", "t": "Equilibrium, Thermodynamics & Kinetics"}, {"ch": 13, "k": "past", "s": "Practice Questions p.164", "q": "Which statement about nuclear reactions is true?", "o": ["The rate is affected by catalysts", "New elements are never produced", "They involve valence electrons", "Tremendous amounts of energy are involved"], "a": 3, "e": "Nuclear reactions change the nucleus and release very large amounts of energy. They often make new elements.", "h": "Nuclear = nucleus, huge energy.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.164", "q": "The number of nucleons in an atom or ion is the same as its:", "o": ["number of electrons", "mass number", "charge", "atomic number"], "a": 1, "e": "Nucleons are protons plus neutrons, which is the mass number.", "h": "Nucleons = A.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.164", "q": "The number of nucleons in a ²³⁶₉₂U²⁺ nucleus is:", "o": ["92", "236", "144", "328"], "a": 1, "e": "The mass number 236 is the number of nucleons. The charge is about electrons and does not change the count.", "h": "Top number = nucleons.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.164", "q": "How many neutrons are in ⁶²₂₆Fe²⁺?", "o": ["36", "26", "62", "60"], "a": 0, "e": "Neutrons = mass number − atomic number = 62 − 26 = 36. Charge does not change neutrons.", "h": "n = A − Z.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.164", "q": "A beta particle is:", "o": ["a proton, ¹₁p", "a helium nucleus, ⁴₂He", "a positron, ⁰₊₁e", "an electron, ⁰₋₁e"], "a": 3, "e": "Beta minus is an electron. ⁴₂He is an alpha particle.", "h": "Beta = electron, alpha = helium.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.164", "q": "Gamma radiation can be described as:", "o": ["a positively charged free electron", "high-energy electromagnetic radiation", "a negatively charged free electron", "a helium nucleus"], "a": 1, "e": "Gamma rays are photons with no mass and no charge.", "h": "Gamma = EM wave.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.164", "q": "The binding energy is defined as:", "o": ["the energy absorbed when electrons are added to an ion", "the energy absorbed when protons and neutrons form a nucleus", "the energy required to break a nucleus into individual protons and neutrons", "the energy released when electrons are removed from an atom"], "a": 2, "e": "Binding energy holds the nucleus together, so the same amount is needed to pull it apart. Energy is released (not absorbed) when the nucleus forms.", "h": "⚠ TRAP: forming a nucleus releases energy.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.165", "q": "Elements with ______ atomic mass are best candidates for a fusion reaction.", "o": ["very low", "very heavy", "moderate", "moderate to heavy"], "a": 0, "e": "Fusion joins light nuclei such as hydrogen into heavier ones.", "h": "Fusion = light.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.165", "q": "Elements with ______ atomic mass are best candidates for a fission reaction.", "o": ["moderate to heavy", "moderate", "very heavy", "very low"], "a": 2, "e": "Fission splits large nuclei such as uranium-235 into smaller ones.", "h": "Fission = heavy.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.165", "q": "²⁰⁹₈₃Bi + ¹₁p → ? + ²¹⁰₈₅Po. What is the missing product, using the numbers as printed?", "o": ["β⁻", "n", "α", "β⁺"], "a": 0, "e": "Mass: 209 + 1 = 210 = 210 + 0. Charge: 83 + 1 = 84 = 85 + (−1). So the missing particle has mass 0 and charge −1, a beta⁻ particle. ⚠ Polonium is actually Z = 84 and Z = 85 is astatine. Use the numbers printed in the question.", "h": "Balance top numbers, then bottom numbers.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.165", "q": "Radiation is detected by its ______ properties.", "o": ["ionising", "kinetic", "thermal", "gravitational"], "a": 0, "e": "Radiation knocks electrons off atoms, which a Geiger counter detects.", "h": "Detector = ionisation.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.165", "q": "Which unit describes the amount of energy absorbed by a kilogram of tissue exposed to radiation?", "o": ["curie", "rad", "rem", "becquerel"], "a": 1, "e": "The rad measures absorbed dose. Becquerel and curie measure activity. Rem accounts for biological damage.", "h": "Absorbed dose = rad (or gray).", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.165", "q": "The effects of ionising radiation depend on:", "o": ["location of the source only", "length of exposure only", "all of these three factors", "type of radiation only"], "a": 2, "e": "Exposure time, whether the source is inside or outside the body, and the type and energy of the radiation all matter.", "h": "All of the above.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.166", "q": "In most liquid solutions, the component present in the larger amount is called the:", "o": ["emulsifying agent", "dispersed medium", "solute", "solvent"], "a": 3, "e": "The solvent is the major component. The solute is the smaller part.", "h": "Solvent = more.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.166", "q": "One reason ionic compounds do not dissolve well in nonpolar solvents is that:", "o": ["no forces exist between ions", "ion-dipole forces are too strong", "all ions have equal charge", "ion-solvent attractions are too weak"], "a": 3, "e": "Nonpolar solvents have no dipoles, so they cannot stabilise the separated ions enough to overcome the lattice.", "h": "Like dissolves like.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.166", "q": "When two similar liquids mix to form a solution, the entropy of solution is expected to be:", "o": ["zero", "positive", "negative at low temperatures only", "negative"], "a": 1, "e": "Mixing makes the particles more disordered, so entropy increases.", "h": "Mixing = more disorder.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.166", "q": "What is the mole fraction of ethanol in a solution made by dissolving 25.0 g of C₂H₅OH in 53.6 g of water?", "o": ["0.214", "0.154", "0.272", "0.846"], "a": 1, "e": "Ethanol = 25.0 ÷ 46.07 = 0.543 mol. Water = 53.6 ÷ 18.02 = 2.975 mol. x = 0.543 ÷ 3.518 = 0.154. The 0.846 is the mole fraction of water.", "h": "Mole fraction = moles of one ÷ total moles.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.166", "q": "Which of these is NOT an application of colligative properties?", "o": ["adding silver to mercury to lower its vapour pressure", "melting snow by applying salt", "desalinating sea water by reverse osmosis", "reduced boiling points of pure liquids at increased altitudes"], "a": 3, "e": "Reduced boiling point at altitude is because of lower air pressure. Pure liquids have no solute, so it is not colligative.", "h": "Colligative = solute particles.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.167", "q": "60.0 g KCl is dissolved in 250.0 g water at 25 °C. The vapour pressure of water at 25 °C is 23.76 mm Hg. What is the vapour pressure of the solution?", "o": ["21.3 mm Hg", "25.5 mm Hg", "22.5 mm Hg", "20.5 mm Hg"], "a": 0, "e": "KCl moles = 60.0 ÷ 74.55 = 0.805. KCl splits into 2 ions, so particles = 1.610 mol. Water = 250.0 ÷ 18.02 = 13.87 mol. x(water) = 13.87 ÷ 15.48 = 0.896. P = 0.896 × 23.76 = 21.3 mm Hg.", "h": "Strong electrolytes: multiply moles by i.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.167", "q": "What is the expected freezing point of a 0.50 m Na₂CO₃ solution? Kf = 1.86 °C/m.", "o": ["−2.8 °C", "−1.9 °C", "−6.5 °C", "−0.93 °C"], "a": 0, "e": "Na₂CO₃ gives 3 ions (i = 3). ΔTf = 3 × 1.86 × 0.50 = 2.79 °C, so the freezing point is −2.8 °C.", "h": "Count the ions: Na₂CO₃ = 3.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.167", "q": "Solutions A and B are separated by a semipermeable membrane. The osmotic pressure of A starts to decrease. Which is true?", "o": ["Only the solute is crossing the membrane", "The osmotic pressure of B was less than that of A", "Solvent molecules are moving from B into A", "Solvent molecules are moving from A into B"], "a": 2, "e": "A’s pressure falls because it is being diluted, so water flows into A from B.", "h": "Solvent moves toward higher concentration.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.167", "q": "How will the osmotic pressure of an aqueous solution change as evaporation occurs?", "o": ["It will decrease", "It will increase", "It will rise then fall until it equals the vapour pressure of water", "It will not change"], "a": 1, "e": "Evaporation leaves less solvent, so the concentration and the osmotic pressure rise.", "h": "Less water, stronger solution.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.167", "q": "An aqueous solution boils at 105.0 °C. What is its freezing point? Kb = 0.51 °C/m, Kf = 1.86 °C/m.", "o": ["14.7 °C", "−14.7 °C", "18.2 °C", "−18.2 °C"], "a": 3, "e": "ΔTb = 5.0, so m = 5.0 ÷ 0.51 = 9.80. ΔTf = 1.86 × 9.80 = 18.2, so the freezing point is −18.2 °C (below zero).", "h": "Same molality for both effects.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.168", "q": "HBr, HCl, HClO₄, KBr and NaCl are all classified as:", "o": ["nonelectrolytes", "strong electrolytes", "weak electrolytes", "acids"], "a": 1, "e": "All are fully ionised in water. Not all of them are acids, since KBr and NaCl are salts.", "h": "Strong acids and soluble salts = strong electrolytes.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.168", "q": "In 2Rb(s) + Cl₂(g) → 2RbCl(s), Cl₂ is:", "o": ["oxidised", "the electron donor", "the oxidising agent", "the reducing agent"], "a": 2, "e": "Chlorine gains electrons (0 → −1) and is reduced, so it is the oxidant.", "h": "Reduced = oxidising agent.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.168", "q": "Which species is the oxidising agent in 5Fe²⁺ + MnO₄⁻ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O?", "o": ["H⁺", "MnO₄⁻", "Fe²⁺", "Mn²⁺"], "a": 1, "e": "Mn goes from +7 to +2, so it is reduced. MnO₄⁻ is the oxidant, and Fe²⁺ is the reductant.", "h": "Mn falls so MnO₄⁻ is the oxidant.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.168", "q": "How many water molecules are needed to balance Cr₂O₇²⁻ + Cl⁻ + H⁺ → Cr³⁺ + Cl₂ + __H₂O?", "o": ["3", "7", "14", "5"], "a": 1, "e": "The balanced equation is Cr₂O₇²⁻ + 6Cl⁻ + 14H⁺ → 2Cr³⁺ + 3Cl₂ + 7H₂O. Seven oxygens give 7 H₂O.", "h": "Oxygen from dichromate becomes water: 7 O means 7 H₂O.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.168", "q": "What is the oxidation half-reaction in Cr₂O₇²⁻ + 6Cl⁻ + 14H⁺ → 2Cr³⁺ + 3Cl₂ + 7H₂O?", "o": ["Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O", "2Cl⁻ → Cl₂ + 2e⁻", "Cl₂ + 2e⁻ → 2Cl⁻", "2Cr³⁺ + 7H₂O → Cr₂O₇²⁻ + 14H⁺ + 6e⁻"], "a": 1, "e": "Chloride loses electrons (−1 → 0), which is oxidation. The chromium half is the reduction.", "h": "Electrons on the right = oxidation.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.169", "q": "Which cell involves a non-spontaneous redox reaction?", "o": ["electrolytic cell", "fuel cell", "galvanic cell", "concentration cell"], "a": 0, "e": "An electrolytic cell uses an outside current to force the reaction. Galvanic cells and fuel cells are spontaneous.", "h": "Electrolytic = forced.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.169", "q": "During an electrochemical reaction, electrons move through the external circuit toward the ______ and positive ions in the cell move toward the ______.", "o": ["anode, anode", "cathode, anode", "anode, cathode", "cathode, cathode"], "a": 3, "e": "Reduction happens at the cathode, so electrons arrive there and cations move to it as well.", "h": "Everything positive or reducing heads to the cathode.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.169", "q": "Which shorthand notation represents Fe(s) + Cu(NO₃)₂(aq) → Fe(NO₃)₂(aq) + Cu(s)?", "o": ["Cu(s) | Cu²⁺(aq) || Fe²⁺(aq) | Fe(s)", "Fe(s) | NO₃⁻(aq) || NO₃⁻(aq) | Cu(s)", "Cu(s) | Cu(NO₃)₂(aq) || Fe(NO₃)₂(aq) | Fe(s)", "Fe(s) | Fe²⁺(aq) || Cu²⁺(aq) | Cu(s)"], "a": 3, "e": "The anode (oxidation, Fe) goes on the left and the cathode (reduction, Cu²⁺) goes on the right. Nitrate is a spectator ion and is left out.", "h": "Anode left, cathode right.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.169", "q": "For Pb(s) | Pb²⁺(0.0400 M) || Fe³⁺(0.200 M), Fe²⁺(0.0100 M) | Pt(s), E° = +0.897 V. What is E at 25 °C?", "o": ["+0.779 V", "+1.015 V", "+1.134 V", "+0.935 V"], "a": 1, "e": "Cell reaction: Pb + 2Fe³⁺ → Pb²⁺ + 2Fe²⁺ (n = 2). Q = (0.0400)(0.0100)² ÷ (0.200)² = 1.0 × 10⁻⁴. E = 0.897 − (0.0592/2) log(10⁻⁴) = 0.897 + 0.118 = 1.015 V.", "h": "Nernst: E = E° − (0.0592/n) log Q.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.169", "q": "How many grams of chromium are plated out when 8.00 A passes through a Cr³⁺ solution for 40.0 minutes?", "o": ["3.45 g", "6.15 g", "10.3 g", "31.0 g"], "a": 0, "e": "Charge = 8.00 × 2400 = 19 200 C. Moles of e⁻ = 19 200 ÷ 96 485 = 0.199. Cr³⁺ needs 3 e⁻: 0.0663 mol × 52.00 = 3.45 g.", "h": "Q = It, then moles of e⁻, then divide by charge on ion.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.170", "q": "How many grams of nickel are plated out when 15.0 A passes through aqueous NiCl₂ for 80.0 minutes?", "o": ["43.8 g", "21.9 g", "48.4 g", "14.7 g"], "a": 1, "e": "Charge = 15.0 × 4800 = 72 000 C. Moles of e⁻ = 0.746. Ni²⁺ needs 2 e⁻: 0.373 mol × 58.69 = 21.9 g.", "h": "Convert minutes to seconds first.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 13, "k": "past", "s": "Practice Questions p.170", "q": "Given Ag⁺ + e⁻ → Ag (0.80 V) and Cu²⁺ + 2e⁻ → Cu (0.34 V), the cell potential is:", "o": ["1.94 V", "1.14 V", "0.46 V", "1.26 V"], "a": 2, "e": "E°cell = E°cathode − E°anode = 0.80 − 0.34 = 0.46 V. Never multiply the potential by the electrons.", "h": "⚠ TRAP: do not multiply E° by the coefficients.", "t": "Nuclear, Colligative Properties & Redox"}, {"ch": 12, "k": "exercise", "s": "Ch1 p.3 Table 2 (applied)", "q": "A block has a mass of 2.7 kg and a volume of 0.001 m³. Its density in the SI derived unit is:", "o": ["270 kg/m³", "2700 kg/m³", "2.7 kg/m³", "0.0027 kg/m³"], "a": 1, "e": "Density = mass / volume = 2.7 kg ÷ 0.001 m³ = 2700 kg/m³. Multiplying instead of dividing gives 0.0027; forgetting the 0.001 gives 2.7; mis-moving the decimal gives 270.", "h": "Divide by a small volume → big density.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch1 p.2-3 velocity relation (applied)", "q": "An object covers a displacement of 150 m in 12 s. Using velocity = displacement/time, its velocity is:", "o": ["138 m/s", "12.5 m/s", "0.08 m/s", "1800 m/s"], "a": 1, "e": "v = 150 m ÷ 12 s = 12.5 m/s. Multiplying gives 1800; inverting gives 0.08; subtracting gives 138, which has no meaning.", "h": "Velocity = distance ÷ time; units m/s.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch1 p.3 Table 2 (applied)", "q": "A current of 3 A flows uniformly through a cross-section of 0.5 m². The current density in SI units is:", "o": ["1.5 A/m²", "6 A/m²", "6 A·m²", "0.17 A/m²"], "a": 1, "e": "Current density = current ÷ area = 3 A ÷ 0.5 m² = 6 A/m². Multiplying gives 1.5, and a product unit (A·m²) is wrong because the unit must be per area.", "h": "Per area means divide.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch1 p.3 Table 2 (applied)", "q": "A speed changes by 20 m/s in 4 s. The acceleration, in the SI derived unit, is:", "o": ["0.2 m/s²", "5 m/s", "5 m/s²", "80 m/s²"], "a": 2, "e": "a = Δv/t = 20 m/s ÷ 4 s = 5 m/s². Multiplication gives 80, losing the 's²' meaning; 5 m/s has the wrong unit; inverting gives 0.2.", "h": "Acceleration unit has s²; check your unit.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "example", "s": "Ch1 p.4 text (energy loss example)", "q": "Scientist 1 obtained 22.60, 22.75 and 22.98 per cent for an energy loss. Scientist 2 obtained 22.63, 22.62 and 22.62 per cent. Which statement is correct?", "o": ["Scientist 2's results are more accurate because they have more digits", "Scientist 1's results are more precise because their mean is higher", "The two sets are equally precise because both are near 22.6", "Scientist 2's results are more precise because they vary much less"], "a": 3, "e": "The spread for scientist 1 is 22.98 - 22.60 = 0.38, while for scientist 2 it is 22.63 - 22.62 = 0.01. Smaller variation among replicates means better precision. Nothing is said about the true value so accuracy cannot be judged here.", "h": "Smaller spread = more precise.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "example", "s": "Ch1 p.5 text (0.428 m example)", "q": "A length is given as 0.428 m ± 0.002 m. The absolute error and relative error (as a percentage) are respectively:", "o": ["0.002 m and 0.467 %", "0.002 m and 4.67 %", "0.002 and 0.467 m", "0.428 m and 0.467 %"], "a": 0, "e": "Absolute error = 0.002 m (it keeps the unit). Relative error = 0.002 ÷ 0.428 = 0.00467, which is 0.467 %. 4.67 % mis-places the decimal; relative error has no unit.", "h": "Absolute in metres, relative in %.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch1 p.5 text (variant)", "q": "The mass of a sample is 25.0 g ± 0.1 g. The percentage relative error is:", "o": ["0.04 %", "0.4 %", "0.1 %", "4 %"], "a": 1, "e": "Relative error = 0.1 ÷ 25.0 = 0.004, which is 0.4 %. Using 0.1 alone gives 0.1 %; forgetting ×100 gives 0.004 (0.004 % misread as 0.04 %).", "h": "0.1/25 = 1/250 = 0.4 %.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch1 p.5 text (variant)", "q": "A volume is recorded as 0.250 L ± 0.005 L. The percentage relative error is:", "o": ["0.5 %", "5 %", "0.02 %", "2.0 %"], "a": 3, "e": "0.005 ÷ 0.250 = 0.020, so 2.0 %. 0.02 % forgets the ×100; 5 % divides by the error's own digit by mistake; 0.5 % moves the decimal wrongly.", "h": "0.005/0.25 = 1/50 = 2 %.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch1 p.5 text (variant)", "q": "A length is 12.50 cm ± 0.05 cm. Its percentage relative error is:", "o": ["0.05 %", "0.4 %", "4 %", "0.04 %"], "a": 1, "e": "0.05 ÷ 12.50 = 0.004, i.e. 0.4 %. Stating the absolute error as the percentage (0.05 %) is a mix-up of absolute and relative error.", "h": "Divide error by the value, then × 100.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch1 p.5 text (variant)", "q": "A reading of 2.50 V has an absolute error of ± 0.02 V. The relative error expressed as a percentage is:", "o": ["8 %", "0.8 %", "125 %", "0.08 %"], "a": 1, "e": "0.02 ÷ 2.50 = 0.008 = 0.8 %. Moving the decimal point wrongly gives 8 % or 0.08 %; 1.25 % comes from 2.50 ÷ 0.02 = 125 inverted.", "h": "Absolute ÷ value, then ×100.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch1 p.5 text (variant)", "q": "A student measures 50.0 mL with a relative error of 2 %. The absolute error, in mL, is:", "o": ["1.0 mL", "2.0 mL", "25 mL", "0.04 mL"], "a": 0, "e": "Absolute error = relative error × quantity = 0.02 × 50.0 mL = 1.0 mL. Dividing the quantity by 2 % (50/0.02 = 2500) or using 2.0 are errors.", "h": "Reverse: absolute = fraction × quantity.", "t": "Physical Quantities and Error Treatments", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.11 Millikan", "q": "The charge on an electron is 1.6 × 10⁻¹⁹ C and its mass is 9.1 × 10⁻²⁸ g. The charge-to-mass ratio in C/g is:", "o": ["1.76 × 10¹¹ C/g", "1.76 × 10⁸ C/g", "5.69 × 10⁻⁹ C/g", "1.46 × 10⁻⁴⁶ C/g"], "a": 1, "e": "e/m = 1.6 × 10⁻¹⁹ ÷ 9.1 × 10⁻²⁸ = 1.76 × 10⁸ C/g. Inverting gives 5.69 × 10⁻⁹; multiplying gives 1.46 × 10⁻⁴⁶; 1.76 × 10¹¹ is the value in C/kg, not C/g.", "h": "⚠ TRAP: grams vs kilograms changes the answer by 10³.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.12 Millikan", "q": "An oil drop carries a total charge of 4.8 × 10⁻¹⁹ C. How many excess electrons does it carry?", "o": ["5", "4", "2", "3"], "a": 3, "e": "4.8 × 10⁻¹⁹ ÷ 1.6 × 10⁻¹⁹ = 3. The answer must be a whole number.", "h": "Total charge ÷ 1.6 × 10⁻¹⁹ = number of electrons.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.12 Millikan", "q": "What is the total charge on 7 electrons?", "o": ["2.29 × 10⁻²⁰ C", "1.12 × 10⁻¹⁹ C", "1.12 × 10⁻¹⁷ C", "1.12 × 10⁻¹⁸ C"], "a": 3, "e": "7 × 1.6 × 10⁻¹⁹ = 1.12 × 10⁻¹⁸ C. Dividing 1.6 by 7 gives 2.29 × 10⁻²⁰, and the others are power-of-ten slips.", "h": "Count × 1.6 × 10⁻¹⁹.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.14 Fig 5", "q": "In the instrument shown, the sample passes through the stages in which order?", "o": ["Acceleration → ionisation → deflection → detection", "Ionisation → deflection → acceleration → detection", "Ionisation → acceleration → deflection → detection", "Detection → deflection → acceleration → ionisation"], "a": 2, "e": "The vaporised sample is first ionised, the ions are accelerated, bent by the electromagnet, and finally detected and recorded.", "h": "I-A-D-D: Ionise, Accelerate, Deflect, Detect.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAIVApEDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAEFAgQGAwf/xABWEAACAgECBAMEBQcHBgoJBQAAAQIDBAURBhIhMRNBURQiYXEHMoGRsRUWQlKhwdEjM2JykrLhFyRTVGSCJTQ1Q0Rjc4Oi8CZFdISTlLPC0ic2N0bx/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//EABsRAQEBAQEBAQEAAAAAAAAAAAARASESMQJB/9oADAMBAAIRAxEAPwD6qAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAByWq6jqNvF1ek4WRGmt43iNtb9dyxjo+fP8AntUt/wB1bBV42l3Zi7IRW7lFL5lR+b0JfzmZkS/3zJcO4fK4yldNP9axhFg83Gi9nfWv95Hm9Uwl3yqv7RqLh3TN93Ru/jJmf5F0ypbvGqS9WB6T1rTobb5dfXqupEtc06Meb2mOxC0fTN+mLS38j0rwMBx2rx6Wk9nsk9mB4fnDpn+sxEeIdNkt/aF9x6WYumQsUJ048ZtbqLS3Zl7Pp0a5T8KhQj9aWy2QHnHXtOl2yImS1vT5b7ZMOhlXDTpOChHHbl9VLbqZ2UYVco+LVTFze0d0luwPH8u6d/rMTH84NN329pTffszZsxcKtc06aYfF  "434 nm"], "a": 0, "e": "1/λ = 1.097 × 10⁷ × (1/4 − 1/16) = 2.057 × 10⁶ m⁻¹, so λ = 486 nm. 656 nm is the first line and 434 nm the third.", "h": "Balmer: 656, 486, 434, 410.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch2 p.19 Exercise c", "q": "The first line of the Lyman series (n = 2 → 1) has a wavelength of (R = 1.097 × 10⁷ m⁻¹):", "o": ["656 nm", "102.6 nm", "121.5 nm", "91.2 nm"], "a": 2, "e": "1/λ = 1.097 × 10⁷ × (1 − 1/4) = 8.23 × 10⁶ m⁻¹, so λ = 1.215 × 10⁻⁷ m = 121.5 nm. 102.6 nm is the second line and 91.2 nm the limit.", "h": "Lyman starts at 121.5 nm (UV).", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch2 p.19 Exercise c", "q": "The second line of the Lyman series (n = 3 → 1) has a wavelength of (R = 1.097 × 10⁷ m⁻¹):", "o": ["121.5 nm", "97.2 nm", "486 nm", "102.6 nm"], "a": 3, "e": "1/λ = 1.097 × 10⁷ × (1 − 1/9) = 9.75 × 10⁶ m⁻¹, so λ = 102.6 nm. 121.5 is the first line, 97.2 the third.", "h": "Bigger jump, shorter wavelength.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.16 Bohr", "q": "If the energy of the electron in the first orbit is E₁, the energy in the second orbit is:", "o": ["2E₁", "E₁/4", "E₁/2", "4E₁"], "a": 1, "e": "Eₙ = E₁/n², so E₂ = E₁/4. It is a smaller negative number, which means higher energy.", "h": "⚠ TRAP: it is n², not n.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.16 Bohr", "q": "Which Bohr orbit has an energy of −Rch/9?", "o": ["The first orbit (n = 1)", "The third orbit (n = 3)", "The second orbit (n = 2)", "The fourth orbit (n = 4)"], "a": 1, "e": "Eₙ = −Rch/n², and 9 = 3². So n = 3.", "h": "n² in the denominator tells you the orbit.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.17 Example", "q": "For hydrogen, which relationship between energy changes is correct?", "o": ["ΔE(3→1) = ΔE(3→2) + ΔE(2→1)", "ΔE(3→1) = ΔE(3→2) × ΔE(2→1)", "ΔE(3→1) = ΔE(2→1) − ΔE(3→2)", "ΔE(3→1) = ΔE(3→2) − ΔE(2→1)"], "a": 0, "e": "The two steps 3→2 and 2→1 add up to the full jump 3→1. The book works it by adding, even though its heading prints a minus sign.", "h": "Energies add over steps.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.17 Example", "q": "Let K = Rch. The energy change for the jump n = 2 → n = 1 is K(1 − 1/4) and for n = 3 → n = 2 is K(1/4 − 1/9). The energy change for n = 3 → n = 1 is therefore:", "o": ["8K/9", "3K/4", "2K/3", "5K/36"], "a": 0, "e": "3K/4 + 5K/36 = 27K/36 + 5K/36 = 32K/36 = 8K/9. Same as K(1 − 1/9).", "h": "Add the steps or use 1 − 1/9 directly.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.17 Bohr", "q": "What is the maximum number of electrons in the M shell (n = 3)?", "o": ["32", "18", "9", "8"], "a": 1, "e": "2n² = 2 × 3² = 18. The value 9 is n², which is the number of orbitals in that shell.", "h": "⚠ TRAP: n² orbitals, 2n² electrons.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.17 Bohr", "q": "What is the maximum number of electrons in the N shell (n = 4)?", "o": ["32", "18", "16", "8"], "a": 0, "e": "2n² = 2 × 16 = 32. 16 is the number of orbitals.", "h": "N = 32.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.18-19 Example", "q": "A body of mass 0.23 mg moves with a wavelength of 1.45 × 10⁻²⁵ m. Using ν = h/mλ with h = 6.63 × 10⁻³⁴ J s, the value of ν is:", "o": ["1.99 × 10⁻⁵", "1.99 × 10⁻²", "2.88 × 10⁻²⁷", "1.99 × 10¹"], "a": 1, "e": "Convert 0.23 mg to 2.3 × 10⁻⁷ kg. ν = 6.63 × 10⁻³⁴ ÷ (2.3 × 10⁻⁷ × 1.45 × 10⁻²⁵) = 1.99 × 10⁻² (the book gets 1.988 × 10⁻²). Wrong mg→kg conversions give the other powers of ten.", "h": "⚠ TRAP: mg → kg is × 10⁻⁶.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.18-19 Example", "q": "A body of mass 0.50 mg has a wavelength of 2.0 × 10⁻²⁵ m. Using ν = h/mλ with h = 6.63 × 10⁻³⁴ J s, ν is:", "o": ["6.63 × 10⁻³", "1.33 × 10⁻²⁷", "6.63 × 10⁻⁶", "6.63 × 10⁰"], "a": 0, "e": "0.50 mg = 5.0 × 10⁻⁷ kg. ν = 6.63 × 10⁻³⁴ ÷ (5.0 × 10⁻⁷ × 2.0 × 10⁻²⁵) = 6.63 × 10⁻³. Leaving out λ gives 1.33 × 10⁻²⁷.", "h": "Mass in kg first.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.18-19 Example", "q": "A body of mass 0.80 mg has a wavelength of 3.2 × 10⁻²⁶ m. Using ν = h/mλ with h = 6.63 × 10⁻³⁴ J s, ν is:", "o": ["2.59 × 10⁻²", "2.59 × 10¹", "8.29 × 10⁻²⁸", "2.59 × 10⁻⁵"], "a": 0, "e": "0.80 mg = 8.0 × 10⁻⁷ kg. ν = 6.63 × 10⁻³⁴ ÷ (8.0 × 10⁻⁷ × 3.2 × 10⁻²⁶) = 2.59 × 10⁻².", "h": "Same method, new numbers.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.19 levels", "q": "Adding the capacity of the s, p and d subshells gives the maximum number of electrons in the third shell, which is:", "o": ["32", "14", "10", "18"], "a": 3, "e": "2 + 6 + 10 = 18, which agrees with 2n² for n = 3.", "h": "3rd shell: 2 + 6 + 10.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.20 config", "q": "Which is the correct electron configuration of argon (Z = 18)?", "o": ["1s² 2s² 2p⁶ 3s² 3p⁶", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s²", "1s² 2s² 2p⁶ 3s² 3d⁶", "1s² 2s² 2p⁶ 3s² 3p⁴"], "a": 0, "e": "Fill in order: 1s, 2s, 2p, 3s, 3p. That uses 2 + 2 + 6 + 2 + 6 = 18 electrons. Adding 4s² would be 20 (calcium).", "h": "Count the electrons: total must equal Z.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch2 p.20 Exercise 1", "q": "The book asks for the electronic configuration of an element M \"whose atomic mass is 17\". Reading this as atomic NUMBER 17, the configuration is:", "o": ["1s² 2s² 2p⁶ 3s² 3p³", "1s² 2s² 2p⁶ 3s² 3p⁵", "1s² 2s² 2p⁶ 3s¹ 3p⁶", "1s² 2s² 2p⁶ 3s² 3p⁶"], "a": 1, "e": "Configurations depend on the number of electrons, which is the atomic number, not the atomic mass. Z = 17 is chlorine, with 7 electrons in its outer shell.", "h": "⚠ TRAP: electrons = atomic NUMBER, never mass.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch2 p.20 Exercise 2", "q": "What is the electron configuration of the K⁺ ion (Z = 19)?", "o": ["1s² 2s² 2p⁶ 3s² 3p⁶ 4s²", "1s² 2s² 2p⁶ 3s² 3p⁶", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹", "1s² 2s² 2p⁶ 3s² 3p⁵"], "a": 1, "e": "A positive ion has lost electrons. K⁺ has 18 electrons, the same as argon. The 4s electron is the one that goes.", "h": "Positive ion: take electrons from the outermost shell.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch2 p.20 Exercise 2", "q": "What is the electron configuration of the Ca²⁺ ion (Z = 20)?", "o": ["1s² 2s² 2p⁶ 3s² 3p⁶ 4s²", "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹", "1s² 2s² 2p⁶ 3s² 3p⁴", "1s² 2s² 2p⁶ 3s² 3p⁶"], "a": 3, "e": "Ca has 20 electrons. Losing two 4s electrons leaves 18, the argon configuration.", "h": "Ca²⁺ = Ar.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch2 p.20 Exercise 2", "q": "What is the electron configuration of the Al³⁺ ion (Z = 13)?", "o": ["1s² 2s² 2p⁶ 3s²", "1s² 2s² 2p⁶ 3s¹", "1s² 2s² 2p⁶ 3s² 3p¹", "1s² 2s² 2p⁶"], "a": 3, "e": "Al has 13 electrons. Losing three leaves 10, the neon configuration. The three lost are 3p¹ and 3s².", "h": "Al³⁺ = Ne.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch2 p.20 Exercise 3", "q": "What is the electron configuration of the Cl⁻ ion (Z = 17)?", "o": ["1s² 2s² 2p⁶ 3s² 3p⁶", "1s² 2s² 2p⁶ 3s¹ 3p⁶", "1s² 2s² 2p⁶ 3s² 3p⁴", "1s² 2s² 2p⁶ 3s² 3p⁵"], "a": 0, "e": "A negative ion has gained electrons. Cl has 17, so Cl⁻ has 18, the same as argon.", "h": "Cl⁻ = Ar.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch2 p.20 Exercise 3", "q": "What is the electron configuration of the F⁻ ion (Z = 9)?", "o": ["1s² 2s² 2p⁶", "1s² 2s² 2p⁴", "1s² 2s² 2p⁶ 3s¹", "1s² 2s² 2p⁵"], "a": 0, "e": "F has 9 electrons; gaining one gives 10, the neon configuration.", "h": "F⁻ = Ne.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch2 p.20 Exercise 3", "q": "What is the electron configuration of the O²⁻ ion (Z = 8)?", "o": ["1s² 2s² 2p⁶ 3s²", "1s² 2s² 2p⁴", "1s² 2s² 2p⁶", "1s² 2s² 2p⁵"], "a": 2, "e": "O has 8 electrons. Gaining two gives 10, the neon configuration.", "h": "O²⁻ = Ne.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "exercise", "s": "Ch2 p.20 Exercise 3", "q": "How many electrons are in a bromide ion, Br⁻ (Br: Z = 35)?", "o": ["34", "36", "35", "37"], "a": 1, "e": "Br has 35 electrons and gains one to form Br⁻, giving 36 (the krypton configuration).", "h": "Negative ion: add electrons to Z.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.20 Exercise 2", "q": "How many electrons are in a Ca²⁺ ion (Z = 20)?", "o": ["18", "20", "22", "2"], "a": 0, "e": "Ca²⁺ has lost two electrons from the 20 in the neutral atom, so 20 − 2 = 18.", "h": "Charge tells you the change: + loses, − gains.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.21 noble gas", "q": "Which is the noble gas (shorthand) notation for magnesium (Z = 12)?", "o": ["[He] 3s²", "[Ar] 3s²", "[Ne] 3s²", "[Ne] 3s¹"], "a": 2, "e": "Mg = 1s² 2s² 2p⁶ 3s². The first ten electrons are the neon core, leaving 3s².", "h": "Core = the noble gas just before the element.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.21 noble gas", "q": "Which is the noble gas notation for fluorine (Z = 9)?", "o": ["[He] 2p⁵", "[He] 2s² 2p⁵", "[Ne] 2s² 2p⁵", "[He] 2s² 2p⁶"], "a": 1, "e": "F = 1s² 2s² 2p⁵. Replace 1s² with [He] to get [He] 2s² 2p⁵.", "h": "Write the core, then everything after it.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.21 noble gas", "q": "The noble gas notation for potassium (Z = 19) is:", "o": ["[Ne] 4s¹", "[Ar] 4s¹", "[Ar] 3d¹", "[Kr] 4s¹"], "a": 1, "e": "Argon accounts for the first 18 electrons, and the 19th goes into 4s.", "h": "K = [Ar]4s¹.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.22 valence", "q": "How many valence electrons does calcium (Z = 20) have?", "o": ["1", "10", "2", "8"], "a": 2, "e": "Ca = [Ar] 4s², so two outer electrons.", "h": "Same as the group number for main groups.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.23 table", "q": "Using the shell table, how are the electrons of phosphorus (Z = 15) arranged in the K, L and M shells?", "o": ["2, 7, 6", "2, 8, 8", "2, 5, 8", "2, 8, 5"], "a": 3, "e": "K takes 2, L takes 8, and the remaining 5 go into M.", "h": "Fill K, L, M in order: 2, 8, then the rest.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.23 table", "q": "From the shell table, calcium (Z = 20) has its electrons arranged in the K, L, M and N shells as:", "o": ["2, 8, 8, 2", "2, 8, 10", "2, 8, 18, 2", "2, 8, 9, 1"], "a": 0, "e": "M stops at 8 for Ar, K and Ca, so the last two electrons go into the N shell.", "h": "Ar, K, Ca: M holds only 8 here.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.21 box", "q": "How many unpaired electrons does a nitrogen atom (1s² 2s² 2p³) have?", "o": ["1", "0", "3", "2"], "a": 2, "e": "The three 2p electrons go into the three 2p orbitals one each (Hund's rule), so all three are unpaired.", "h": "N = 3 unpaired.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.21 box", "q": "How many unpaired electrons does an oxygen atom (1s² 2s² 2p⁴) have?", "o": ["4", "3", "0", "2"], "a": 3, "e": "The 4th electron pairs up with one in 2p, leaving two orbitals singly occupied.", "h": "O = 2 unpaired.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.21 box", "q": "How many unpaired electrons does fluorine (1s² 2s² 2p⁵) have?", "o": ["1", "5", "0", "2"], "a": 0, "e": "In 2p⁵, two orbitals are full and one has a single electron.", "h": "F = 1 unpaired.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.20 quantum", "q": "For n = 3, the allowed values of the azimuthal quantum number l are:", "o": ["0, 1, 2 and 3", "1, 2 and 3", "−2, −1, 0, 1 and 2", "0, 1 and 2"], "a": 3, "e": "l runs from 0 to n − 1, so 0, 1 and 2 (the 3s, 3p and 3d subshells).", "h": "l = 0 to n − 1.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.20 quantum", "q": "How many orbitals are in the third shell (n = 3)?", "o": ["6", "9", "3", "18"], "a": 1, "e": "The number of orbitals in a shell is n², which is 9. They hold up to 18 electrons.", "h": "Orbitals n², electrons 2n².", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.23 Döbereiner", "q": "Which of these is one of Döbereiner's triads?", "o": ["Lithium, beryllium, boron", "Carbon, nitrogen, oxygen", "Calcium, strontium, barium", "Sodium, magnesium, aluminium"], "a": 2, "e": "His triads were Cl–Br–I, S–Se–Te, Ca–Sr–Ba and Li–Na–K. Each is a group down the table, not a row across it.", "h": "Triads go down a group.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.23 Döbereiner", "q": "Taking Cl = 35.5 and I = 126.9, the triad rule predicts the atomic weight of bromine to be about:", "o": ["81.2", "67.1", "162.4", "45.7"], "a": 0, "e": "Average of the outer two: (35.5 + 126.9) ÷ 2 = 81.2. The real value is close to 79.9.", "h": "Middle = (first + third) ÷ 2.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.23 Döbereiner", "q": "Taking Ca = 40.1 and Ba = 137.3, the triad rule predicts the atomic weight of strontium to be about:", "o": ["74.2", "177.4", "48.6", "88.7"], "a": 3, "e": "(40.1 + 137.3) ÷ 2 = 88.7. The real value, 87.6, is close.", "h": "Add the outer two, halve.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.30 Example 1", "q": "Which of Li, K and Ti has the largest atomic radius?", "o": ["Li and Ti are equal", "K", "Li", "Ti"], "a": 1, "e": "Potassium has four shells, so it is the biggest by far. The book's answer lists Ti last, which does not fit real atomic radii.", "h": "Look for the most shells.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.30 Example 1", "q": "Which of Be, Mg and Zn has the largest atomic radius?", "o": ["Zn", "All three are equal", "Mg", "Be"], "a": 2, "e": "Mg has three shells and Be only two, so Mg > Be. Zn is smaller than Mg because its extra protons pull the electrons in. The book's key puts Zn last, which does not match real data.", "h": "⚠ TRAP: Zn is smaller than Mg.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.28 ionisation", "q": "Which of Li, Na and K has the highest first ionisation energy?", "o": ["All are equal", "Li", "K", "Na"], "a": 1, "e": "Li is the smallest atom in the group, so its outer electron is held most tightly.", "h": "Up the group = higher IE.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.30 Example 2", "q": "Arrange N, O and Be in decreasing order of first ionisation energy.", "o": ["N > O > Be", "O > N > Be", "Be > N > O", "N > Be > O"], "a": 0, "e": "N has a half-filled 2p³ subshell, which makes it more stable and harder to ionise than O. Be has the lowest value here. The book writes the order as O, N, Be, but N is higher than O.", "h": "⚠ TRAP: N beats O because 2p³ is half-filled.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.30 Example 2", "q": "Arrange Mg, Al and Na in decreasing order of first ionisation energy.", "o": ["Mg > Na > Al", "Na > Mg > Al", "Mg > Al > Na", "Al > Mg > Na"], "a": 2, "e": "Na is lowest because it has just one outer electron. Mg is higher than Al because Al's outer electron is in 3p, which is easier to remove than Mg's 3s pair.", "h": "Mg > Al, a famous dip.", "t": "Structure of the Atom", "d": 1}, {"ch": 12, "k": "example", "s": "Ch2 p.29 ionic radius", "q": "Which is larger, the Na⁺ ion or the K⁺ ion?", "o": ["Th
