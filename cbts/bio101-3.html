cribes the observable/expressed trait (phenotype).", "hack": "Letters (BB, Bb, bb) = Genotype; a described physical trait (brown hair) = Phenotype."}, {"tier": "past", "topic": "Heredity", "q": "Which of these — Blue eyes, or Tt — is an example of a phenotype?", "correct": "Blue eyes", "wrongs": ["Tt", "Both are phenotypes", "Neither is a phenotype"], "exp": "'Blue eyes' describes an observable physical trait (phenotype), while Tt represents the underlying genetic makeup (genotype).", "hack": "Observable trait (Blue eyes) = Phenotype; Letter pair (Tt) = Genotype."}, {"tier": "past", "topic": "Heredity", "q": "Segments of DNA that carry instructions for the traits of an offspring are referred to as:", "correct": "Genes", "wrongs": ["Alleles only", "Chromatids", "Centromeres"], "exp": "Genes are specific DNA segments that encode the hereditary instructions determining an organism's traits.", "hack": "Gene = a DNA segment carrying instructions for a specific trait."}, {"tier": "past", "topic": "Heredity", "q": "The process by which parents pass characteristics or traits on to their children is called:", "correct": "Heredity", "wrongs": ["Mutation", "Natural selection", "Adaptation"], "exp": "Heredity is the biological process of transmitting traits from parents to offspring across generations.", "hack": "Heredity = the parent-to-child trait transmission process."}, {"tier": "past", "topic": "Heredity", "q": "An organism with two different alleles for a particular trait is said to be:", "correct": "Heterozygous", "wrongs": ["Homozygous", "Hybrid vigor", "Polyploid"], "exp": "Heterozygous describes an organism carrying two different alleles (e.g. Bb) for a given gene.", "hack": "Hetero- = different; Heterozygous = two DIFFERENT alleles at that locus (e.g. Bb)."}];

const SESSION_TOPICS = [...new Set(ALL_Q.filter(q=>q.tier!=='past').map(q=>q.topic))];
let currentRunMode = 'full';
let currentSession = SESSION_TOPICS[0];

function sessionCount(topic){
  if(topic==='past') return ALL_Q.filter(q=>q.tier==='past').length;
  return ALL_Q.filter(q=>q.topic===topic && q.tier!=='past').length;
}

function buildSessionListUI(){
  const wrap = document.getElementById('sessionList');
  let html = '<div class="sessionlist">';
  SESSION_TOPICS.forEach(t=>{
    const active = (t===currentSession) ? ' active' : '';
    html += `<div class="sessionbtn${active}" onclick="selectSession('${t}')"><span>${t}</span><b>${sessionCount(t)}Q</b></div>`;
  });
  const pastActive = (currentSession==='past') ? ' active' : '';
  html += `<div class="sessionbtn pastbtn${pastActive}" onclick="selectSession('past')"><span>📋 Past Questions</span><b>${sessionCount('past')}Q</b></div>`;
  html += '</div>';
  wrap.innerHTML = html;
}

function selectRunMode(mode){
  currentRunMode = mode;
  document.querySelectorAll('.tierbar .tierbtn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.tierbtn[data-run="${mode}"]`).classList.add('active');
  const sessionList = document.getElementById('sessionList');
  if(mode === 'session'){
    sessionList.classList.remove('hidden');
    buildSessionListUI();
  } else {
    sessionList.classList.add('hidden');
  }
}

function selectSession(topic){
  currentSession = topic;
  buildSessionListUI();
}
let quizQuestions = [];
let currentIndex = 0;
let score = 0;
let wrongLog = [];
let answered = false;

function fisherYates(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildQuizSet(){
  const basePool = ALL_Q.filter(q=>q.tier!=='past');
  let pool;
  if(currentRunMode === 'session'){
    pool = (currentSession === 'past')
      ? ALL_Q.filter(q=>q.tier==='past')
      : basePool.filter(q=>q.topic===currentSession);
  } else if(currentRunMode === 'drill20'){
    pool = fisherYates(basePool).slice(0,20);
  } else if(currentRunMode === 'half'){
    pool = fisherYates(basePool).slice(0, Math.ceil(basePool.length/2));
  } else {
    pool = basePool;
  }
  pool = fisherYates(pool);
  return pool.map(q=>{
    const opts = fisherYates([q.correct, ...q.wrongs]);
    return {
      tier:q.tier, topic:q.topic, question:q.q,
      options:opts, correct:q.correct,
      exp:q.exp, hack:q.hack
    };
  });
}

let __cbtLockMod = null;
function getCbtLock(){
  if(!__cbtLockMod) __cbtLockMod = import('../cbt-lock.js');
  return __cbtLockMod;
}

let __cbtAllowedToday = Infinity;
let __cbtLimited = false;

async function startQuiz(){
  let gate;
  try {
    const lock = await getCbtLock();
    gate = await lock.checkCbtAccess('bio101');
  } catch(e) {
    gate = { blocked:false, questionsAllowedToday: Infinity };
  }

  if(gate.blocked){
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');
    const lock = await getCbtLock();
    lock.renderCbtLockScreen(document.getElementById('quizScreen'), gate.reason);
    return;
  }

  __cbtAllowedToday = gate.questionsAllowedToday;
  __cbtLimited = __cbtAllowedToday !== Infinity;

  quizQuestions = buildQuizSet();

  if(__cbtLimited){
    const remaining = __cbtAllowedToday - (gate.usedToday || 0);
    if(remaining <= 0){
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      const lock = await getCbtLock();
      lock.renderCbtLockScreen(document.getElementById('quizScreen'), 'limit');
      return;
    }
    quizQuestions = quizQuestions.slice(0, remaining);
  }

  currentIndex = 0; score = 0; wrongLog = [];
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('reviewScreen').classList.add('hidden');
  document.getElementById('liveTotal').textContent = quizQuestions.length;
  document.getElementById('qOfLabel').textContent = 'of ' + quizQuestions.length;
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const q = quizQuestions[currentIndex];
  document.getElementById('qNumLabel').textContent = 'Q ' + (currentIndex+1);
  document.getElementById('pbarFill').style.width = ((currentIndex)/quizQuestions.length*100)+'%';
  document.getElementById('liveScore').textContent = score;
  let modeLabel;
  if(currentRunMode==='session'){
    modeLabel = (currentSession==='past') ? 'PAST QUESTIONS' : currentSession.toUpperCase();
  } else if(currentRunMode==='drill20'){ modeLabel = 'QUICK DRILL'; }
  else if(currentRunMode==='half'){ modeLabel = 'HALF RUN'; }
  else { modeLabel = 'FULL CBT'; }
  document.getElementById('tierLabel').textContent = modeLabel;
  document.getElementById('qTierTag').textContent = q.tier.toUpperCase();
  document.getElementById('qTierTag').className = 'qtier ' + q.tier;
  document.getElementById('qText').textContent = q.question;

  const wrap = document.getElementById('optsWrap');
  wrap.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<b>'+letters[i]+'.</b> '+opt;
    btn.onclick = ()=>selectAnswer(opt, btn);
    wrap.appendChild(btn);
  });

  document.getElementById('fbBox').classList.remove('show','right','wrong');
  document.getElementById('nextBtn').style.display = 'none';
}

async function selectAnswer(chosen, btnEl){
  if(answered) return;
  answered = true;
  const q = quizQuestions[currentIndex];
  const correct = chosen === q.correct;
  const allBtns = document.querySelectorAll('.opt');
  allBtns.forEach(b=>{
    b.classList.add('disabled');
    const label = b.textContent.replace(/^[A-D]\.\s*/, '');
    if(label === q.correct) b.classList.add('correct');
  });
  if(!correct){
    btnEl.classList.add('wrong');
    wrongLog.push({question:q.question, correct:q.correct, chosen:chosen, exp:q.exp, hack:q.hack});
  } else {
    score++;
  }
  document.getElementById('liveScore').textContent = score;

  const fb = document.getElementById('fbBox');
  fb.classList.add('show', correct?'right':'wrong');
  document.getElementById('fbLabel').className = 'fb-label ' + (correct?'right':'wrong');
  document.getElementById('fbLabel').textContent = correct ? '✅ CORRECT' : '❌ INCORRECT — Correct answer: ' + q.correct;
  document.getElementById('fbExp').textContent = q.exp;
  document.getElementById('fbHack').textContent = q.hack;

  document.getElementById('nextBtn').style.display = 'block';

  if(__cbtLimited){
    try {
      const lock = await getCbtLock();
      await lock.recordCbtQuestionUsed();
    } catch(e) {}
  }
}

function nextQuestion(){
  currentIndex++;
  if(currentIndex >= quizQuestions.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalNum').textContent = score + '/' + quizQuestions.length;
  const pct = Math.round((score/quizQuestions.length)*100);
  document.getElementById('finalPct').textContent = pct + '%';
}

function showReview(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('reviewScreen').classList.remove('hidden');
  const list = document.getElementById('reviewList');
  if(wrongLog.length===0){
    list.innerHTML = '<p style="color:var(--good);text-align:center;">🔥 Perfect score — no wrong answers!</p>';
    return;
  }
  list.innerHTML = wrongLog.map(w=>`
    <div class="reviewitem">
      <div class="riq">${w.question}</div>
      <div class="riwrong">Your answer: ${w.chosen}</div>
      <div class="ricorrect">Correct: ${w.correct}</div>
      <div class="exp" style="margin-top:6px;">${w.exp}</div>
      <div class="hackbox" style="margin-top:6px;"><div class="hacklabel">🔥 EXAM HACK</div><div class="hacktext">${w.hack}</div></div>
    </div>
  `).join('');
}

function restart(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('reviewScreen').classList.add('hidden');
  document.getElementById('setupScreen').classList.remove('hidden');
}
</script>
