tiates the contraction process."}, {"s": "Muscle tissue is highly vascularized to support its high metabolic demand.", "a": true, "e": "Correct \u2014 good blood supply is needed for oxygen and nutrient delivery."}, {"s": "All three muscle types contain the contractile proteins actin and myosin.", "a": true, "e": "Correct \u2014 actin and myosin are common to skeletal, cardiac, and smooth muscle."}, {"s": "Only skeletal and cardiac muscle exhibit striations under the microscope.", "a": true, "e": "Correct \u2014 smooth muscle lacks visible striations."}, {"s": "Striations are caused by the regular, repeating arrangement of actin and myosin filaments.", "a": true, "e": "Correct \u2014 this organized arrangement produces the striped appearance."}, {"s": "Muscle tissue relies exclusively on aerobic respiration for energy.", "a": false, "e": "Muscle tissue can use both aerobic and anaerobic pathways, depending on demand."}, {"s": "Hypertrophy refers to an increase in the size of existing muscle cells.", "a": true, "e": "Correct \u2014 this contrasts with hyperplasia (increase in cell number)."}, {"s": "Atrophy refers to a decrease in muscle size, often due to disuse or denervation.", "a": true, "e": "Correct \u2014 this is the standard definition of muscle atrophy."}, {"s": "Muscle tissue contributes significantly to overall body heat production.", "a": true, "e": "Correct \u2014 muscle contraction generates metabolic heat."}, {"s": "Skeletal muscle is voluntary and typically attached to bones.", "a": true, "e": "Correct \u2014 this defines skeletal muscle's control and typical attachment."}, {"s": "Skeletal muscle fibers are long, cylindrical, and multinucleated.", "a": true, "e": "Correct \u2014 multiple nuclei result from fusion of myoblasts during development."}, {"s": "Skeletal muscle nuclei are located peripherally, just beneath the sarcolemma.", "a": true, "e": "Correct \u2014 a key identifying feature versus cardiac/smooth muscle."}, {"s": "Skeletal muscle fibers show clear striations under light microscopy.", "a": true, "e": "Correct \u2014 the organized sarcomere arrangement produces striations."}, {"s": "The sarcolemma is the plasma membrane of a skeletal muscle fiber.", "a": true, "e": "Correct \u2014 this is the specific term for muscle cell membrane."}, {"s": "The sarcoplasm is the cytoplasm of a muscle fiber.", "a": true, "e": "Correct \u2014 this is the specific term for muscle cell cytoplasm."}, {"s": "Myofibrils are rod-like structures within muscle fibers that contain the contractile units.", "a": true, "e": "Correct \u2014 myofibrils house the sarcomeres."}, {"s": "A sarcomere is the basic functional contractile unit of skeletal muscle.", "a": true, "e": "Correct \u2014 sarcomeres repeat along the length of a myofibril."}, {"s": "A sarcomere is defined as the region between two adjacent Z-lines (Z-discs).", "a": true, "e": "Correct \u2014 this is the standard anatomical definition of a sarcomere."}, {"s": "Actin filaments are the thick filaments of the sarcomere.", "a": false, "e": "Actin filaments are THIN filaments; myosin filaments are the thick ones."}, {"s": "Myosin filaments are the thick filaments of the sarcomere.", "a": true, "e": "Correct \u2014 myosin forms the thick filament of the sarcomere."}, {"s": "During muscle contraction, actin and myosin filaments themselves shorten.", "a": false, "e": "The filaments do NOT shorten \u2014 they slide past each other, per the sliding filament theory."}, {"s": "The sliding filament theory explains that actin filaments slide over myosin filaments during contraction.", "a": true, "e": "Correct \u2014 this is the mechanism of muscle shortening."}, {"s": "During contraction, the distance between Z-lines decreases as filaments slide.", "a": true, "e": "Correct \u2014 sarcomere shortening results from this sliding."}, {"s": "The sarcoplasmic reticulum is a specialized form of smooth endoplasmic reticulum that stores calcium.", "a": true, "e": "Correct \u2014 SR calcium storage is essential for contraction signaling."}, {"s": "T-tubules are extensions of the sarcolemma that carry electrical impulses deep into the muscle fiber.", "a": true, "e": "Correct \u2014 T-tubules ensure synchronized contraction throughout the fiber."}, {"s": "A triad refers to one T-tubule flanked by two terminal cisternae of the sarcoplasmic reticulum.", "a": true, "e": "Correct \u2014 this structure enables rapid calcium release upon stimulation."}, {"s": "Troponin and tropomyosin regulate the interaction between actin and myosin.", "a": true, "e": "Correct \u2014 these regulatory proteins control the exposure of binding sites."}, {"s": "Calcium binding to troponin causes a conformational change that exposes myosin-binding sites on actin.", "a": true, "e": "Correct \u2014 this initiates the cross-bridge cycle."}, {"s": "Acetylcholine is the neurotransmitter released at the neuromuscular junction to stimulate skeletal muscle contraction.", "a": true, "e": "Correct \u2014 ACh triggers depolarization of the sarcolemma."}, {"s": "The neuromuscular junction is the synapse between a motor neuron and a skeletal muscle fiber.", "a": true, "e": "Correct \u2014 this is the definition of the neuromuscular junction."}, {"s": "A motor unit consists of a single motor neuron and all the muscle fibers it innervates.", "a": true, "e": "Correct \u2014 this is the functional unit of muscle control."}, {"s": "Skeletal muscle fibers are classified into type I (slow-twitch) and type II (fast-twitch) fibers.", "a": true, "e": "Correct \u2014 this classification relates to speed and fatigue resistance."}, {"s": "Type I (slow-twitch) fibers are more fatigue-resistant than type II fibers.", "a": true, "e": "Correct \u2014 slow-twitch fibers rely on aerobic metabolism, resisting fatigue."}, {"s": "Type II (fast-twitch) fibers generate more force quickly but fatigue faster than type I fibers.", "a": true, "e": "Correct \u2014 fast-twitch fibers rely more on anaerobic metabolism."} gh to prevent muscle relaxation between twitches.", "a": true, "e": "Correct \u2014 this is the physiological basis of tetanic contraction."}, {"s": "Skeletal muscle fibers develop from the fusion of embryonic cells called myoblasts.", "a": true, "e": "Correct \u2014 myoblast fusion produces multinucleated fibers."}, {"s": "The A band of a sarcomere represents the region of overlapping thick and thin filaments, and its length stays constant during contraction.", "a": true, "e": "Correct \u2014 the A band width does not change, unlike the H zone and I band."}, {"s": "The I band of a sarcomere consists of thin (actin) filaments only, and it shortens during contraction.", "a": true, "e": "Correct \u2014 the I band narrows as filaments slide together."}, {"s": "The H zone represents the region of the sarcomere with thick filaments only, and it also shortens during contraction.", "a": true, "e": "Correct \u2014 the H zone narrows as thin filaments slide inward."}, {"s": "Skeletal muscle fatigue can result from depletion of ATP, accumulation of metabolic byproducts, or neurotransmitter depletion.", "a": true, "e": "Correct \u2014 multiple mechanisms can underlie muscle fatigue."}, {"s": "Creatine phosphate provides a rapid, short-term source of energy for regenerating ATP in muscle.", "a": true, "e": "Correct \u2014 the phosphagen system supports brief, intense activity."}, {"s": "Skeletal muscle relies exclusively on anaerobic glycolysis for ATP production during rest.", "a": false, "e": "At rest, skeletal muscle primarily relies on aerobic respiration, not anaerobic glycolysis."}, {"s": "Myoglobin in skeletal muscle stores oxygen for use during periods of high demand.", "a": true, "e": "Correct \u2014 myoglobin acts as an intracellular oxygen reservoir."}, {"s": "Red (dark) muscle fibers are rich in myoglobin and mitochondria, consistent with type I fiber characteristics.", "a": true, "e": "Correct \u2014 high myoglobin/mitochondria content supports sustained aerobic activity."}, {"s": "White (pale) muscle fibers have less myoglobin and are more consistent with type II fiber characteristics.", "a": true, "e": "Correct \u2014 lower myoglobin content is typical of fast-twitch fibers."}, {"s": "Skeletal muscle can only contract, never actively relax; relaxation is a purely passive process.", "a": true, "e": "Correct \u2014 muscles cannot push, only pull; opposing muscles or elastic recoil cause lengthening."}, {"s": "Tendons, composed of dense regular connective tissue, transmit the force generated by skeletal muscle to bone.", "a": true, "e": "Correct \u2014 tendons are the mechanical link between muscle and bone."}, {"s": "The all-or-none principle states that a muscle fiber either contracts fully or not at all in response to a stimulus.", "a": true, "e": "Correct \u2014 this principle applies at the level of individual muscle fibers."}, {"s": "Skeletal muscle contraction strength can be increased by recruiting more motor units.", "a": true, "e": "Correct \u2014 motor unit recruitment increases overall force output."}, {"s": "Fasciculations are involuntary, visible twitches of small muscle groups, often due to spontaneous motor unit activity.", "a": true, "e": "Correct \u2014 this describes the clinical phenomenon of fasciculation."}, {"s": "Electromyography (EMG) is a diagnostic technique used to assess the electrical activity of skeletal muscle.", "a": true, "e": "Correct \u2014 EMG is used clinically to evaluate muscle and nerve function."}, {"s": "Myasthenia gravis is an autoimmune condition affecting acetylcholine receptors at the neuromuscular junction.", "a": true, "e": "Correct \u2014 this leads to muscle weakness and fatigue."}, {"s": "Skeletal muscle biopsy can help diagnose various muscular dystrophies and myopathies.", "a": true, "e": "Correct \u2014 histological examination reveals characteristic changes in these conditions."}, {"s": "The costameres are structures that link the sarcomere to the sarcolemma and extracellular matrix.", "a": true, "e": "Correct \u2014 costameres help transmit force and maintain fiber integrity."}, {"s": "Skeletal muscle growth in adults primarily occurs via hypertrophy rather than hyperplasia.", "a": true, "e": "Correct \u2014 existing fibers enlarge rather than new fibers forming in significant numbers."}, {"s": "Disuse of skeletal muscle, such as during prolonged immobilization, leads to muscle atrophy.", "a": true, "e": "Correct \u2014 lack of use reduces muscle mass and strength."}, {"s": "Denervation of skeletal muscle leads to progressive muscle atrophy due to loss of nerve stimulation.", "a": true, "e": "Correct \u2014 nerve signals are needed to maintain muscle mass."}, {"s": "Skeletal muscle contraction requires depolarization of the sarcolemma to trigger calcium release from the sarcoplasmic reticulum.", "a": true, "e": "Correct \u2014 this is the excitation-contraction coupling process."}, {"s": "Cardiac muscle is found exclusively in the wall of the heart (myocardium).", "a": true, "e": "Correct \u2014 cardiac muscle is unique to the heart."}, {"s": "Cardiac muscle is under involuntary control.", "a": true, "e": "Correct \u2014 the heart beats automatically without conscious control."}, {"s": "Cardiac muscle cells are typically branched and cylindrical in shape.", "a": true, "e": "Correct \u2014 branching allows efficient force transmission throughout the heart."}, {"s": "Cardiac muscle cells typically contain a single, centrally located nucleus.", "a": true, "e": "Correct \u2014 a key identifying feature versus skeletal muscle."}, {"s": "Cardiac muscle cells occasionally have two nuclei.", "a": true, "e": "Correct \u2014 binucleation occurs in a minority of cardiac cells."}, {"s": "Cardiac muscle is striated, similar to skeletal muscle.", "a": true, "e": "Correct \u2014 cardiac muscle shares the sarcomere organization with skeletal muscle."}, {"s": "Intercalated discs are specialized junctions unique to cardiac muscle, connecting adjacent cardiac cells.", "a": true, "e": "Correct \u2014 this is a defining structural feature of cardiac muscle."}, {"s": "Intercalated discs contain both desmosomes and gap junctions.", "a": true, "e": "Correct \u2014 desmosomes provide mechanical strength, gap junctions provide electrical coupling."}, {"s": "Gap junctions within intercalated discs allow electrical signals to pass rapidly between cardiac cells.", "a": true, "e": "Correct \u2014 this enables coordinated, synchronized contraction of the heart."}, {"s": "Desmosomes within intercalated discs provide strong mechanical adhesion between cardiac cells during contraction.", "a": true, "e": "Correct \u2014 this prevents cells from pulling apart under contractile stress."}, {"s": "Cardiac muscle functions as a functional syncytium due to electrical coupling via gap junctions.", "a": true, "e": "Correct \u2014 the heart behaves as a single coordinated unit despite being made of separate cells."}, {"s": "Cardiac muscle has a high density of mitochondria to support its continuous, high energy demand.", "a": true, "e": "Correct \u2014 the heart relies heavily on aerobic metabolism."}, {"s": "Cardiac muscle is highly resistant to fatigue.", "a": true, "e": "Correct \u2014 this is essential since the heart must beat continuously throughout life."}, {"s": "Cardiac muscle cells have minimal to no regenerative capacity after significant injury, such as a myocardial infarction.", "a": true, "e": "Correct \u2014 damaged cardiac tissue is typically replaced by non-contractile scar tissue."}, {"s": "After a myocardial infarction, damaged cardiac muscle is typically replaced by fibrous connective tissue scar rather than new cardiac muscle.", "a": true, "e": "Correct \u2014 this explains the permanent functional loss after a heart attack."}, {"s": "The sinoatrial (SA) node is a specialized region of cardiac tissue that generates the heart's normal electrical rhythm.", "a": true, "e": "Correct \u2014 the SA node acts as the heart's natural pacemaker."}, {"s": "Cardiac muscle contraction is entirely dependent on nervous stimulation to occur at all.", "a": false, "e": "Cardiac muscle is myogenic \u2014 it can contract intrinsically without nerve input; the nervous system only modulates rate/force."}, {"s": "Purkinje fibers are specialized conducting cells within the heart that rapidly transmit electrical impulses to the ventricles.", "a": true, "e": "Correct \u2014 Purkinje fibers ensure coordinated ventricular contraction."}, {"s": "Cardiac muscle relies almost entirely on anaerobic metabolism for its energy needs.", "a": false, "e": "Cardiac muscle relies predominantly on AEROBIC metabolism due to its high mitochondrial content."}, {"s": "Cardiac muscle cells are shorter than typical skeletal muscle fibers.", "a": true, "e": "Correct \u2014 cardiac cells are much shorter than the long, multinucleated skeletal fibers."}, {"s": "The T-tubule system in cardiac muscle is generally wider than in skeletal muscle.", "a": true, "e": "Correct \u2014 this anatomical difference relates to differences in excitation-contraction coupling."}, {"s": "Cardiac muscle has a longer refractory period than skeletal muscle, preventing tetanic contraction of the heart.", "a": true, "e": "Correct \u2014 this prevents dangerous sustained heart contraction."}, {"s": "Cardiac muscle cannot undergo tetanic (sustained) contraction due to its long refractory period.", "a": true, "e": "Correct \u2014 this protects the heart's essential pumping rhythm."}, {"s": "Cardiomyocytes (cardiac muscle cells) rely on calcium influx from both the extracellular space and the sarcoplasmic reticulum for contraction.", "a": true, "e": "Correct \u2014 this is called calcium-induced calcium release."}, {"s": "Cardiac muscle tissue is supplied by an extensive capillary network to meet its high oxygen demand.", "a": true, "e": "Correct \u2014 rich vascularization supports continuous aerobic work."}, {"s": "Arrhythmias can result from abnormalities in the electrical conduction system of cardiac muscle.", "a": true, "e": "Correct \u2014 conduction defects can disrupt normal heart rhythm."}, {"s": "Cardiac hypertrophy can occur in response to chronic increased workload, such as in hypertension.", "a": true, "e": "Correct \u2014 the heart muscle enlarges to compensate for increased demand."}, {"s": "Troponin I and Troponin T are cardiac-specific biomarkers used clinically to diagnose myocardial infarction.", "a": true, "e": "Correct \u2014 elevated cardiac troponins indicate heart muscle damage."}, {"s": "Cardiac muscle fibers typically branch and interconnect with neighboring fibers, unlike skeletal muscle fibers.", "a": true, "e": "Correct \u2014 this branching supports efficient impulse spread."}, {"s": "Cardiac muscle tissue develops from mesoderm during embryonic development.", "a": true, "e": "Correct \u2014 like other muscle types, cardiac muscle is mesodermal in origin."}, {"s": "The myocardium is the middle, muscular layer of the heart wall composed of cardiac muscle.", "a": true, "e": "Correct \u2014 this is the definition of myocardium."}, {"s": "The atrioventricular (AV) node delays the electrical impulse before it passes to the ventricles.", "a": true, "e": "Correct \u2014 this delay allows the atria to finish contracting before ventricular contraction begins."}, {"s": "Cardiac muscle cells have fewer mitochondria than skeletal muscle cells because their energy needs are lower.", "a": false, "e": "Cardiac muscle actually has MORE mitochondria than skeletal muscle due to its continuous, high aerobic demand."}, {"s": "Cardiac muscle relies on both intrinsic (myogenic) and extrinsic (autonomic nervous system) regulation of its activity.", "a": true, "e": "Correct \u2014 the heart beats on its own but rate/force are modulated externally."}, {"s": "The autonomic nervous system can increase or decrease heart rate but does not initiate the heartbeat itself.", "a": true, "e": "Correct \u2014 the SA node initiates the beat; the ANS only modulates it."}, {"s": "Cardiac muscle injury releases specific enzymes and proteins into the blood, useful for clinical diagnosis of heart attacks.", "a": true, "e": "Correct \u2014 troponins and creatine kinase-MB are examples used diagnostically."}, {"s": "Cardiac muscle contraction strength can be modulated by the force of calcium influx and myofilament sensitivity.", "a": true, "e": "Correct \u2014 this underlies concepts like the Frank-Starling mechanism."}, {"s": "Ischemic damage to cardiac muscle, if prolonged, leads to irreversible cell death (infarction).", "a": true, "e": "Correct \u2014 prolonged oxygen deprivation causes permanent tissue damage."}, {"s": "Cardiac muscle tissue is generally thinner in the atria compared to the ventricles.", "a": true, "e": "Correct \u2014 ventricles, especially the left, need thicker walls to generate higher pressures."}, {"s": "The left ventricle has thicker cardiac muscle walls than the right ventricle due to its higher workload pumping blood to the whole body.", "a": true, "e": "Correct \u2014 this reflects differing pressure demands of systemic vs pulmonary circulation."}, {"s": "Cardiac muscle cells are connected end-to-end primarily via intercalated discs located at the Z-line region.", "a": true, "e": "Correct \u2014 intercalated discs typically occur at or near the Z-line."}, {"s": "Bundle branches carry electrical impulses from the AV node toward the Purkinje fibers in the ventricles.", "a": true, "e": "Correct \u2014 this is part of the heart's conduction pathway."}, {"s": "Cardiac muscle's involuntary nature distinguishes it functionally from skeletal muscle, despite sharing a striated appearance.", "a": true, "e": "Correct \u2014 this combination of features is unique to cardiac muscle."}, {"s": "Chronic hypertension can lead to compensatory cardiac muscle hypertrophy, which may eventually progress to heart failure.", "a": true, "e": "Correct \u2014 sustained overload can eventually impair cardiac function."}, {"s": "Cardiac muscle regeneration research, including stem cell therapies, is an active area due to the heart's limited natural regenerative capacity.", "a": true, "e": "Correct \u2014 this reflects ongoing clinical and research interest."}, {"s": "Cardiac muscle's unique structure allows it to function continuously for an entire lifetime without rest.", "a": true, "e": "Correct \u2014 unlike skeletal muscle, cardiac muscle cannot rest and must contract continuously."}, {"s": "The pericardium, though a connective tissue structure, encloses and protects the cardiac muscle of the heart.", "a": true, "e": "Correct \u2014 the pericardium is the protective sac surrounding the heart."}, {"s": "Cardiac conduction abnormalities can be assessed clinically using an electrocardiogram (ECG/EKG).", "a": true, "e": "Correct \u2014 ECG records the heart's electrical activity."}, {"s": "Cardiac muscle tissue integrates structural features of both skeletal muscle (striations) and smooth muscle (involuntary, single nucleus).", "a": true, "e": "Correct \u2014 cardiac muscle is often described as a hybrid of the other two muscle types."}, {"s": "Smooth muscle is involuntary and lacks visible striations under the microscope.", "a": true, "e": "Correct \u2014 these are defining features of smooth muscle."}, {"s": "Smooth muscle cells are spindle-shaped (fusiform), tapering at both ends.", "a": true, "e": "Correct \u2014 this describes typical smooth muscle cell morphology."}, {"s": "Smooth muscle cells typically have a single, centrally located nucleus.", "a": true, "e": "Correct \u2014 a key identifying feature of smooth muscle."}, {"s": "Smooth muscle is found in the walls of hollow organs such as the stomach, intestines, and blood vessels.", "a": true, "e": "Correct \u2014 this is the typical location of smooth muscle."}, {"s": "Smooth muscle lacks the organized sarcomere structure found in skeletal and cardiac muscle.", "a": true, "e": "Correct \u2014 this explains its non-striated appearance."}, {"s": "Smooth muscle contains actin and myosin filaments, but they are arranged in a less organized, oblique pattern.", "a": true, "e": "Correct \u2014 this arrangement allows for different contraction dynamics."}, {"s": "Smooth muscle contraction is generally slower and more sustained than skeletal muscle contraction.", "a": true, "e": "Correct \u2014 smooth muscle is adapted for prolonged, low-energy contraction."}, {"s": "Smooth muscle is highly resistant to fatigue, allowing for sustained tone over long periods.", "a": true, "e": "Correct \u2014 this supports functions like maintaining vascular tone."}, {"s": "Single-unit (visceral) smooth muscle cells are connected by gap junctions and contract as a coordinated unit.", "a": true, "e": "Correct \u2014 this describes single-unit smooth muscle behavior."}, {"s": "Single-unit smooth muscle is found in the walls of the gastrointestinal tract, uterus, and blood vessels.", "a": true, "e": "Correct \u2014 these organs require coordinated, wave-like contractions."}, {"s": "Multi-unit smooth muscle cells act relatively independently, each with its own nerve supply.", "a": true, "e": "Correct \u2014 this describes multi-unit smooth muscle behavior."}, {"s": "Multi-unit smooth muscle is found in structures like the iris of the eye and the arrector pili muscles of hair follicles.", "a": true, "e": "Correct \u2014 these require fine, independent control."}, {"s": "Smooth muscle lacks troponin but uses calmodulin to regulate calcium-dependent contraction.", "a": true, "e": "Correct \u2014 this is a key biochemical difference from skeletal/cardiac muscle."}, {"s": "In smooth muscle, calcium binds to calmodulin, which then activates myosin light-chain kinase to enable contraction.", "a": true, "e": "Correct \u2014 this describes the smooth muscle contraction pathway."}, {"s": "Smooth muscle cells lack T-tubules, unlike skeletal muscle fibers.", "a": true, "e": "Correct \u2014 smooth muscle relies on other mechanisms for calcium signaling."}, {"s": "Peristalsis, the wave-like contraction that moves substances through hollow organs, is driven by smooth muscle.", "a": true, "e": "Correct \u2014 peristalsis is a hallmark function of smooth muscle."}, {"s": "Smooth muscle in blood vessel walls regulates vessel diameter and blood pressure.", "a": true, "e": "Correct \u2014 vascular smooth muscle controls vasoconstriction and vasodilation."}, {"s": "Smooth muscle can be stimulated by hormones as well as by autonomic nerve signals.", "a": true, "e": "Correct \u2014 smooth muscle is regulated by both neural and hormonal input."}, {"s": "Smooth muscle exhibits greater capacity for cell division (hyperplasia) than skeletal or cardiac muscle.", "a": true, "e": "Correct \u2014 smooth muscle retains more regenerative/proliferative capacity."}, {"s": "Uterine smooth muscle (myometrium) undergoes hyperplasia and hypertrophy during pregnancy.", "a": true, "e": "Correct \u2014 the uterus enlarges through both increased cell number and cell size."}, {"s": "Smooth muscle tone refers to a state of partial, sustained contraction even at rest.", "a": true, "e": "Correct \u2014 baseline tone is important for organ and vessel function."}, {"s": "Smooth muscle lacks intercalated discs, distinguishing it from cardiac muscle.", "a": true, "e": "Correct \u2014 intercalated discs are unique to cardiac muscle."}, {"s": "Smooth muscle relaxation in blood vessels is often mediated by nitric oxide.", "a": true, "e": "Correct \u2014 nitric oxide is a key vasodilator acting on vascular smooth muscle."}, {"s": "Dense bodies in smooth muscle cells serve a function similar to Z-lines in striated muscle, anchoring actin filaments.", "a": true, "e": "Correct \u2014 dense bodies organize the contractile apparatus in smooth muscle."}, {"s": "Smooth muscle contraction can be sustained for long periods with relatively low energy expenditure, known as the latch state.", "a": true, "e": "Correct \u2014 the latch state allows efficient, prolonged tension."}, {"s": "Bronchial smooth muscle regulates airway diameter in the respiratory tract.", "a": true, "e": "Correct \u2014 this is relevant to conditions like asthma."}, {"s": "Asthma involves excessive contraction (bronchoconstriction) of smooth muscle in the airways.", "a": true, "e": "Correct \u2014 this leads to the characteristic breathing difficulty in asthma."}, {"s": "Smooth muscle in the iris controls pupil size through both dilation and constriction.", "a": true, "e": "Correct \u2014 the iris contains both circular and radial smooth muscle fibers."}, {"s": "Piloerection (goosebumps) results from contraction of arrector pili smooth muscle attached to hair follicles.", "a": true, "e": "Correct \u2014 this is a classic multi-unit smooth muscle function."}, {"s": "Smooth muscle in the gastrointestinal tract is arranged in both longitudinal and circular layers to enable peristalsis.", "a": true, "e": "Correct \u2014 these layered contractions propel contents through the tract."}, {"s": "Unlike skeletal muscle, smooth muscle cells are not multinucleated.", "a": true, "e": "Correct \u2014 smooth muscle cells have only a single nucleus each."}, {"s": "Smooth muscle cells can respond to stretch, such as in the bladder, by adjusting their tension (stress-relaxation response).", "a": true, "e": "Correct \u2014 this allows organs like the bladder to fill without a large pressure increase."}, {"s": "Vascular smooth muscle hypertrophy can contribute to increased vascular resistance in chronic hypertension.", "a": true, "e": "Correct \u2014 thickened vessel walls narrow the lumen and increase resistance."}, {"s": "Smooth muscle is generally slower to contract but more efficient at sustaining contraction than skeletal muscle.", "a": true, "e": "Correct \u2014 this trade-off suits its role in maintaining prolonged tone."}, {"s": "Smooth muscle lacks the highly organized sarcomeres seen in skeletal and cardiac muscle, yet still relies on the sliding filament principle for contraction.", "a": true, "e": "Correct \u2014 the same basic actin-myosin sliding mechanism applies, despite different organization."}, {"s": "Achalasia is a condition involving dysfunction of smooth muscle (and its neural control) in the esophagus, impairing swallowing.", "a": true, "e": "Correct \u2014 this reflects a clinical smooth muscle disorder."}, {"s": "Smooth muscle relaxation and contraction are essential for regulating blood flow distribution throughout the body.", "a": true, "e": "Correct \u2014 vascular smooth muscle tone directs blood flow to different regions as needed."}, {"s": "Myometrial smooth muscle contractions are essential for labor and delivery during childbirth.", "a": true, "e": "Correct \u2014 coordinated uterine smooth muscle contractions drive labor."}, {"s": "Smooth muscle's ability to stretch considerably without a large increase in tension is important for organs like the stomach and bladder.", "a": true, "e": "Correct \u2014 this property accommodates variable filling volumes."}, {"s": "Understanding the differences between skeletal, cardiac, and smooth muscle is essential for understanding physiology across nearly every organ system.", "a": true, "e": "Correct \u2014 muscle tissue underlies function in the musculoskeletal, cardiovascular, digestive, respiratory, and other systems."}, {"s": "Skeletal muscle fibers can range from a few millimeters to many centimeters in length.", "a": true, "e": "Correct \u2014 skeletal fibers can be remarkably long, spanning much of a muscle's length."}, {"s": "The term 'myoblast' refers to an undifferentiated embryonic cell that fuses to form skeletal muscle fibers.", "a": true, "e": "Correct \u2014 myoblast fusion produces multinucleated skeletal fibers."}, {"s": "Cardiac muscle cells are joined end-to-end in a branching network that allows the heart to contract as a coordinated whole.", "a": true, "e": "Correct \u2014 this branching network supports synchronized pumping."}, {"s": "The term 'myocyte' can refer generally to any muscle cell, including skeletal, cardiac, or smooth muscle cells.", "a": true, "e": "Correct \u2014 'myocyte' is a general term for muscle cells."}, {"s": "Smooth muscle cells are generally much smaller than skeletal muscle fibers.", "a": true, "e": "Correct \u2014 smooth muscle cells are shorter and narrower than the long skeletal fibers."}, {"s": "The three muscle types differ significantly in their location, control, and structure, despite sharing the basic contractile mechanism.", "a": true, "e": "Correct \u2014 this summarizes the key comparative theme of muscle histology."}, {"s": "Skeletal muscle is the only muscle type attached to the skeleton via tendons.", "a": true, "e": "Correct \u2014 this is a defining anatomical feature of skeletal muscle."}, {"s": "A key exam distinction is that skeletal muscle nuclei are peripheral and multiple, while cardiac and smooth muscle nuclei are central and single.", "a": true, "e": "Correct \u2014 this nuclear location/number pattern is a classic exam differentiator."}, {"s": "Only skeletal muscle shows both striations and voluntary control simultaneously.", "a": true, "e": "Correct \u2014 cardiac muscle is striated but involuntary; smooth muscle is neither striated nor voluntary."}, {"s": "Smooth muscle is the only muscle type that is both non-striated and involuntary.", "a": true, "e": "Correct \u2014 this combination is unique to smooth muscle."}, {"s": "Muscle spindle receptors within skeletal muscle detect changes in muscle length and contribute to proprioception.", "a": true, "e": "Correct \u2014 muscle spindles are stretch receptors important for reflexes and coordination."}, {"s": "Golgi tendon organs detect tension within tendons and help protect muscles from excessive force.", "a": true, "e": "Correct \u2014 these receptors provide feedback on muscle tension."}, {"s": "The stretch reflex, such as the knee-jerk reflex, relies on sensory input from muscle spindles.", "a": true, "e": "Correct \u2014 this classic reflex demonstrates muscle spindle function."}, {"s": "Skeletal muscle biopsies are stained using techniques like H&E or ATPase staining to differentiate fiber types.", "a": true, "e": "Correct \u2014 these staining methods reveal fiber type distribution."}, {"s": "Polio is a viral disease that can damage motor neurons, leading to skeletal muscle weakness or paralysis.", "a": true, "e": "Correct \u2014 poliovirus targets motor neurons controlling skeletal muscle."}, {"s": "Amyotrophic lateral sclerosis (ALS) is a disease that leads to progressive skeletal muscle weakness due to motor neuron degeneration.", "a": true, "e": "Correct \u2014 ALS involves loss of motor neurons that supply skeletal muscle."}, {"s": "Botulinum toxin blocks acetylcholine release at the neuromuscular junction, causing muscle paralysis.", "a": true, "e": "Correct \u2014 this is the mechanism behind botulinum toxin's paralytic effect."}, {"s": "Cardiac muscle's automatic rhythmic contraction without external nerve stimulation is called myogenic activity.", "a": true, "e": "Correct \u2014 'myogenic' describes intrinsic, muscle-originating electrical activity."}, {"s": "The cardiac conduction system includes the SA node, AV node, bundle of His, and Purkinje fibers.", "a": true, "e": "Correct \u2014 these structures form the heart's electrical pathway."}, {"s": "Bundle of His is the pathway connecting the AV node to the bundle branches in the ventricles.", "a": true, "e": "Correct \u2014 this structure is part of the cardiac conduction system."}, {"s": "Cardiac muscle's continuous need for oxygen makes it particularly vulnerable to ischemic injury during reduced blood flow.", "a": true, "e": "Correct \u2014 this vulnerability underlies conditions like myocardial infarction."}, {"s": "Smooth muscle's dense bodies function analogously to the Z-discs found in skeletal and cardiac muscle sarcomeres.", "a": true, "e": "Correct \u2014 both anchor actin filaments, although smooth muscle lacks true sarcomeres."}, {"s": "The lack of a highly organized sarcomere in smooth muscle allows it to generate tension over a wider range of lengths compared to skeletal muscle.", "a": true, "e": "Correct \u2014 this contributes to smooth muscle's adaptability in hollow organs."}, {"s": "Uterine smooth muscle contraction during labor is stimulated in part by the hormone oxytocin.", "a": true, "e": "Correct \u2014 oxytocin is a key hormonal stimulator of uterine contraction."}, {"s": "Smooth muscle in the walls of arterioles plays a major role in regulating systemic blood pressure.", "a": true, "e": "Correct \u2014 arteriolar smooth muscle tone significantly affects vascular resistance."}, {"s": "The autonomic nervous system innervates both cardiac and smooth muscle, but not skeletal muscle.", "a": true, "e": "Correct \u2014 skeletal muscle is innervated by the somatic (voluntary) nervous system instead."}, {"s": "Skeletal muscle is innervated by the somatic nervous system, allowing for voluntary control.", "a": true, "e": "Correct \u2014 this contrasts with the autonomic control of cardiac and smooth muscle."}, {"s": "Muscle tissue, along with nervous tissue, is classified as excitable tissue due to its ability to generate and respond to electrical signals.", "a": true, "e": "Correct \u2014 both tissue types show excitability as a shared property."}, {"s": "Rhabdomyolysis is a condition involving the breakdown of skeletal muscle tissue, releasing muscle contents like myoglobin into the blood.", "a": true, "e": "Correct \u2014 this can cause kidney injury due to myoglobin release."}, {"s": "Elevated creatine kinase (CK) levels in the blood can indicate skeletal or cardiac muscle damage.", "a": true, "e": "Correct \u2014 CK is a useful clinical marker of muscle injury."}, {"s": "Both skeletal and cardiac muscle rely on similar excitation-contraction coupling mechanisms involving calcium release from the sarcoplasmic reticulum.", "a": true, "e": "Correct \u2014 though details differ, the basic mechanism is shared."}, {"s": "Smooth muscle contraction, unlike skeletal muscle, does not rely on troponin as its calcium-sensing regulatory protein.", "a": true, "e": "Correct \u2014 smooth muscle uses calmodulin instead of troponin."}, {"s": "The three muscle tissue types can all be identified histologically by examining cell shape, striation pattern, and nucleus number/location.", "a": true, "e": "Correct \u2014 these three features are the primary tools for identifying muscle type under the microscope."}, {"s": "Skeletal muscle contributes to posture maintenance through sustained low-level contraction (muscle tone).", "a": true, "e": "Correct \u2014 postural muscles maintain tone to support body position."}, {"s": "Smooth muscle in the gastrointestinal tract exhibits slow wave electrical activity that coordinates rhythmic contractions.", "a": true, "e": "Correct \u2014 slow waves set the rhythm for peristaltic and segmentation contractions."}, {"s": "Cardiac muscle's intercalated discs are typically visible as dark transverse lines under light microscopy.", "a": true, "e": "Correct \u2014 this is a classic histological identifying feature of cardiac muscle."}, {"s": "The presence of a single nucleus alone is sufficient to distinguish cardiac from smooth muscle without considering other features.", "a": false, "e": "Both cardiac and smooth muscle have single nuclei; other features like striations and intercalated discs are needed to distinguish them."}, {"s": "Cardiac muscle can be distinguished from smooth muscle by the presence of striations and intercalated discs.", "a": true, "e": "Correct \u2014 these features are unique to cardiac muscle among the involuntary muscle types."}, {"s": "Smooth muscle tissue is capable of significant hyperplasia in response to conditions such as pregnancy or chronic irritation.", "a": true, "e": "Correct \u2014 this contributes to conditions like uterine enlargement or airway remodeling in asthma."}, {"s": "The functional properties of muscle tissue \u2014 contractility, excitability, extensibility, elasticity \u2014 apply across all three muscle types despite structural differences.", "a": true, "e": "Correct \u2014 these four core properties define muscle tissue broadly."}, {"s": "Leiomyoma (fibroid) is a benign tumor arising from smooth muscle, commonly found in the uterus.", "a": true, "e": "Correct \u2014 uterine fibroids are a classic example of smooth muscle tumors."}, {"s": "Rhabdomyoma and rhabdomyosarcoma are tumors arising from skeletal muscle tissue, the latter being malignant.", "a": true, "e": "Correct \u2014 these tumors originate from skeletal muscle cells."}, {"s": "Myosin heads use ATP hydrolysis to perform the power stroke that pulls actin filaments during contraction.", "a": true, "e": "Correct \u2014 this is the molecular basis of the cross-bridge cycle."}, {"s": "The cross-bridge cycle includes attachment, power stroke, detachment, and re-cocking of the myosin head.", "a": true, "e": "Correct \u2014 these are the four sequential steps of the contraction cycle."}, {"s": "Rigor mortis eventually resolves as muscle proteins begin to degrade after death.", "a": true, "e": "Correct \u2014 enzymatic breakdown eventually releases the actin-myosin cross-bridges."}, {"s": "Skeletal muscle fiber types can shift somewhat in response to endurance or resistance training.", "a": true, "e": "Correct \u2014 training can influence fiber type proportions and characteristics to some degree."}, {"s": "Muscle tissue repair after minor injury generally involves inflammation, satellite cell activation, and regeneration in skeletal muscle.", "a": true, "e": "Correct \u2014 this describes the general skeletal muscle repair process."}, {"s": "Smooth muscle tone contributes to maintaining sphincter closure in structures like the lower esophageal sphincter.", "a": true, "e": "Correct \u2014 sphincters rely on sustained smooth muscle contraction."}, {"s": "The lower esophageal sphincter is composed of smooth muscle that helps prevent reflux of stomach contents.", "a": true, "e": "Correct \u2014 this sphincter's tone is important in preventing GERD."}, {"s": "Gastroesophageal reflux disease (GERD) can result from dysfunction of lower esophageal sphincter smooth muscle.", "a": true, "e": "Correct \u2014 reduced sphincter tone allows stomach acid to reflux upward."}, {"s": "Skeletal muscle's rich blood supply is delivered via blood vessels that travel alongside the connective tissue layers (epimysium, perimysium, endomysium).", "a": true, "e": "Correct \u2014 these connective tissue layers also carry the muscle's vasculature."}, {"s": "Cardiac muscle receives its blood supply primarily via the coronary arteries.", "a": true, "e": "Correct \u2014 coronary circulation supplies the myocardium."}, {"s": "Blockage of a coronary artery can lead to ischemia and infarction of the cardiac muscle it supplies.", "a": true, "e": "Correct \u2014 this is the basic mechanism of a heart attack."}, {"s": "Smooth muscle blood supply varies by organ but is generally sufficient to support its lower, sustained metabolic demand compared to cardiac muscle.", "a": true, "e": "Correct \u2014 smooth muscle's lower energy demand requires less intense vascularization than cardiac muscle."}, {"s": "A key histological clue for identifying smooth muscle in tissue sections is the presence of centrally located, elongated (cigar-shaped) nuclei within spindle-shaped cells.", "a": true, "e": "Correct \u2014 this nuclear shape and position is characteristic of smooth muscle."}, {"s": "Skeletal muscle fibers, unlike cardiac or smooth muscle cells, do not typically divide once fully differentiated.", "a": true, "e": "Correct \u2014 mature skeletal muscle fibers are largely post-mitotic, relying on satellite cells for repair instead."}, {"s": "The term 'myofilament' refers to the individual actin or myosin protein filaments that make up myofibrils.", "a": true, "e": "Correct \u2014 myofilaments are the smallest contractile units within myofibrils."}, {"s": "Cardiac muscle's structural hybrid nature (striated but involuntary, single central nucleus) makes it a frequently tested comparison point in histology exams.", "a": true, "e": "Correct \u2014 this blend of features makes cardiac muscle a common source of exam questions."}, {"s": "Smooth muscle can be found in the walls of the respiratory tract, digestive tract, urinary tract, and reproductive tract.", "a": true, "e": "Correct \u2014 smooth muscle is widely distributed among hollow, tubular organs."}, {"s": "The autonomic nervous system's two divisions, sympathetic and parasympathetic, often have opposing effects on smooth and cardiac muscle activity.", "a": true, "e": "Correct \u2014 e.g., sympathetic increases heart rate while parasympathetic decreases it."}, {"s": "Sympathetic stimulation generally increases heart rate and force of cardiac muscle contraction.", "a": true, "e": "Correct \u2014 this reflects the 'fight or flight' response on the heart."}, {"s": "Parasympathetic stimulation, primarily via the vagus nerve, generally decreases heart rate.", "a": true, "e": "Correct \u2014 vagal tone slows the SA node's firing rate."}, {"s": "Skeletal muscle contraction is entirely under conscious, voluntary control with no involuntary component.", "a": false, "e": "While primarily voluntary, skeletal muscle also has involuntary components like reflexes (e.g., stretch reflex) and muscle tone."}, {"s": "Reflex arcs involving skeletal muscle, such as the withdrawal reflex, can occur without direct conscious control.", "a": true, "e": "Correct \u2014 spinal reflexes can bypass conscious brain processing."}, {"s": "Cardiac muscle cells are connected not only functionally via gap junctions but also structurally via desmosomes within intercalated discs.", "a": true, "e": "Correct \u2014 this combination provides both electrical and mechanical connectivity."}, {"s": "Vascular smooth muscle responds to local factors such as oxygen levels, carbon dioxide, and pH to regulate blood flow to tissues.", "a": true, "e": "Correct \u2014 local metabolic factors influence vascular smooth muscle tone."}, {"s": "Smooth muscle's slower contraction speed compared to skeletal muscle is partly due to the slower myosin ATPase activity in smooth muscle.", "a": true, "e": "Correct \u2014 smooth muscle myosin has lower ATPase activity, contributing to slower, sustained contraction."}, {"s": "Latch state in smooth muscle allows sustained force generation with reduced ATP consumption, useful in maintaining vascular tone over long periods.", "a": true, "e": "Correct \u2014 this state supports energy-efficient prolonged contraction."}, {"s": "The presence of visible cross-striations under a microscope rules out smooth muscle as the tissue type.", "a": true, "e": "Correct \u2014 smooth muscle never shows cross-striations."}, {"s": "A muscle biopsy showing branched, striated fibers with central nuclei and intercalated discs indicates cardiac muscle tissue.", "a": true, "e": "Correct \u2014 these combined features are diagnostic for cardiac muscle."}, {"s": "A muscle biopsy showing spindle-shaped cells with central nuclei and no striations indicates smooth muscle tissue.", "a": true, "e": "Correct \u2014 these combined features are diagnostic for smooth muscle."}, {"s": "A muscle biopsy showing long, cylindrical, striated fibers with multiple peripheral nuclei indicates skeletal muscle tissue.", "a": true, "e": "Correct \u2014 these combined features are diagnostic for skeletal muscle."}, {"s": "Muscle relaxants used clinically may act at the level of the neuromuscular junction, the sarcoplasmic reticulum, or the central nervous system, depending on the drug.", "a": true, "e": "Correct \u2014 different classes of muscle relaxants target different points in the contraction pathway."}, {"s": "Unde o the swelling of red blood cells.", "a": false, "e": "Crenation refers to shrinking, not swelling (that's hemolysis)."}, {"s": "The rough endoplasmic reticulum has ribosomes attached to its surface.", "a": true, "e": "Correct \u2014 ribosomes give rough ER its studded appearance."}, {"s": "Peripheral proteins are embedded within the hydrophobic core of the membrane.", "a": false, "e": "Peripheral proteins attach to the membrane surface, not the hydrophobic core."}, {"s": "Spindle fibers are formed by the centrioles during mitosis.", "a": true, "e": "Correct \u2014 centrioles organize the mitotic spindle apparatus."}, {"s": "The nucleus controls gene expression and cellular activities.", "a": true, "e": "Correct \u2014 the nucleus houses DNA and directs cell function."}, {"s": "Secretory proteins are packaged into vesicles by the Golgi apparatus for export.", "a": true, "e": "Correct \u2014 this is part of the secretory pathway."}, {"s": "The nuclear envelope is continuous with the rough endoplasmic reticulum.", "a": true, "e": "Correct \u2014 this continuity links the two structures."}, {"s": "Centrioles are involved in spindle fiber formation during cell division.", "a": true, "e": "Correct \u2014 centrioles organize the mitotic spindle."}, {"s": "The mnemonic PMAT represents the order of mitotic phases: Prophase, Metaphase, Anaphase, Telophase.", "a": true, "e": "Correct \u2014 PMAT is the standard mnemonic."}, {"s": "Mitochondria have their own DNA, distinct from nuclear DNA.", "a": true, "e": "Correct \u2014 mitochondrial DNA (mtDNA) is separate and circular."}, {"s": "Isotonic IV fluids include normal saline and lactated Ringer's solution.", "a": true, "e": "Correct \u2014 both are commonly used isotonic IV fluids."}, {"s": "Polar bodies are non-functional byproducts of meiosis in females.", "a": true, "e": "Correct \u2014 they degenerate and are not used for fertilization."}, {"s": "Active transport pumps are examples of integral membrane proteins.", "a": true, "e": "Correct \u2014 pumps span the membrane as integral proteins."}, {"s": "The plasma membrane is also called the plasmalemma.", "a": true, "e": "Correct \u2014 plasmalemma is an alternate anatomical term."}, {"s": "The sodium-glucose symporter (SGLT) is targeted by certain diabetes medications.", "a": true, "e": "Correct \u2014 SGLT2 inhibitors are a class of diabetes drugs."}, {"s": "Temperature increase generally increases the rate of diffusion.", "a": true, "e": "Correct \u2014 higher temperature increases molecular kinetic energy."}, {"s": "The plasma membrane is completely impermeable to all substances.", "a": false, "e": "It is selectively (semi-) permeable, not impermeable."}, {"s": "Epithelial tissue receives nutrients by diffusion from underlying connective tissue.", "a": true, "e": "Correct \u2014 since epithelium itself has no blood vessels."}, {"s": "Stratified epithelium consists of multiple layers of cells.", "a": true, "e": "Correct \u2014 'stratified' means multiple layers."}, {"s": "Cilia on pseudostratified columnar epithelium help move mucus and trapped particles.", "a": true, "e": "Correct \u2014 this is the mucociliary escalator function."}, {"s": "Stratified squamous epithelium is found in areas subject to friction and abrasion.", "a": true, "e": "Correct \u2014 multiple layers provide protection."}, {"s": "Epithelial tissue in the kidney tubules is specialized for reabsorption and secretion functions.", "a": true, "e": "Correct \u2014 cuboidal epithelium performs these roles."}, {"s": "Stratified squamous non-keratinized epithelium is found lining the mouth and vagina.", "a": true, "e": "Correct \u2014 moist protective surfaces use the non-keratinized form."}, {"s": "Goblet cells are specialized unicellular glands found within epithelial linings.", "a": true, "e": "Correct \u2014 goblet cells secrete mucus directly into the lumen."}, {"s": "Simple columnar epithelium often contains goblet cells that secrete mucus.", "a": true, "e": "Correct \u2014 goblet cells are scattered within this epithelium."}, {"s": "Keratinocytes are the predominant cell type in the epidermis.", "a": true, "e": "Correct \u2014 keratinocytes make up the majority of epidermal cells."}, {"s": "Skin epidermis develops from ectoderm.", "a": true, "e": "Correct \u2014 the epidermis is ectodermal in origin."}, {"s": "Epithelial-mesenchymal transition (EMT) is a process where epithelial cells gain migratory, mesenchymal-like properties, relevant in wound healing and cancer metastasis.", "a": true, "e": "Correct \u2014 EMT is clinically important in both healing and cancer spread."}, {"s": "Stratified epithelium is generally found in areas requiring more protection than simple epithelium can provide.", "a": true, "e": "Correct \u2014 multiple layers add protective strength."}, {"s": "Desmosomes provide strong mechanical attachment between adjacent epithelial cells.", "a": true, "e": "Correct \u2014 desmosomes resist mechanical stress."}, {"s": "Pseudostratified ciliated columnar epithelium lines much of the respiratory tract, including the trachea.", "a": true, "e": "Correct \u2014 a classic location for this tissue type."}, {"s": "Endothelium refers specifically to the simple squamous epithelium lining the heart and blood vessels.", "a": true, "e": "Correct \u2014 this is the specific term used for vascular lining."}, {"s": "All glandular tissue in the body originates from epithelial tissue.", "a": true, "e": "Correct \u2014 both exocrine and endocrine glands are epithelial derivatives."}, {"s": "Transitional epithelium is found lining the urinary bladder, ureters, and part of the urethra.", "a": true, "e": "Correct \u2014 the classic location for transitional epithelium."}, {"s": "Ground substance is entirely solid and does not allow diffusion of substances through it.", "a": false, "e": "Ground substance is gel-like and permits diffusion of nutrients, gases, and wastes."}, {"s": "Mast cell degranulation plays a key role in anaphylactic and allergic reactions.", "a": true, "e": "Correct \u2014 histamine release from mast cells drives these reactions."}, {"s": "Connective tissue is characterized by cells scattered within an abundant extracellular matrix.", "a": true, "e": "Correct \u2014 this defines connective tissue's structure."}, {"s": "Understanding connective tissue cell types and fiber composition helps explain the pathology of many clinical conditions.", "a": true, "e": "Correct \u2014 structure-function-pathology links are central to histology."}, {"s": "Loose connective tissue is commonly found beneath epithelial tissue and surrounding organs.", "a": true, "e": "Correct \u2014 it's a widespread supportive/packing tissue."}, {"s": "Wound healing in richly vascularized connective tissue is generally faster than in avascular tissue like cartilage.", "a": true, "e": "Correct \u2014 blood supply speeds the healing process."}, {"s": "Macrophages can present antigens to immune cells as part of the immune response.", "a": true, "e": "Correct \u2014 macrophages act as antigen-presenting cells."}, {"s": "Fibroblasts are also responsible for wound healing by producing new collagen.", "a": true, "e": "Correct \u2014 fibroblast activity is essential to tissue repair."}, {"s": "The extracellular matrix largely determines the physical properties of a given connective tissue type.", "a": true, "e": "Correct \u2014 matrix composition dictates tissue strength and flexibility."}, {"s": "Loose (areolar) connective tissue has a high ratio of ground substance to fibers, making it flexible.", "a": true, "e": "Correct \u2014 this gives loose CT its pliability."}, {"s": "Dense regular connective tissue is found in tendons and ligaments.", "a": true, "e": "Correct \u2014 a classic location for this tissue type."}, {"s": "The extracellular matrix of connective tissue is entirely absent of any protein components.", "a": false, "e": "The matrix contains protein-based fibers (collagen, elastin, reticulin) as key // Fisher-Yates shuffle
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let order = shuffle(QUESTIONS.map((_, i) => i));
let current = 0;
let selected = null;
let locked = false;
let correctCount = 0;
let incorrectCount = 0;
let wrongAnswers = [];

function loadQuestion() {
  if (current >= order.length) {
    showFinal();
    return;
  }
  const q = QUESTIONS[order[current]];
  document.getElementById('statementText').textContent = q.s;
  document.getElementById('qCounter').textContent = `Question ${current + 1} / ${order.length}`;
  document.getElementById('progressFill').style.width = `${(current / order.length) * 100}%`;
  document.getElementById('liveScore').textContent = `✅ ${correctCount}   ❌ ${incorrectCount}`;
  selected = null;
  locked = false;
  document.getElementById('trueBtn').className = 'tf-btn';
  document.getElementById('falseBtn').className = 'tf-btn';
  document.getElementById('lockBtn').disabled = true;
  document.getElementById('lockBtn').style.display = 'block';
  document.getElementById('feedbackBox').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('trueBtn').disabled = false;
  document.getElementById('falseBtn').disabled = false;
}

function selectAnswer(val) {
  if (locked) return;
  selected = val;
  document.getElementById('trueBtn').className = 'tf-btn' + (val === true ? ' selected-true' : '');
  document.getElementById('falseBtn').className = 'tf-btn' + (val === false ? ' selected-false' : '');
  document.getElementById('lockBtn').disabled = false;
}

function lockAnswer() {
  if (selected === null || locked) return;
  locked = true;
  const q = QUESTIONS[order[current]];
  const isCorrect = selected === q.a;
  document.getElementById('trueBtn').disabled = true;
  document.getElementById('falseBtn').disabled = true;
  document.getElementById('lockBtn').style.display = 'none';

  const fb = document.getElementById('feedbackBox');
  const lbl = document.getElementById('feedbackLabel');
  const txt = document.getElementById('feedbackText');

  if (isCorrect) {
    correctCount++;
    fb.className = 'feedback correct';
    lbl.textContent = '✅ CORRECT';
  } else {
    incorrectCount++;
    fb.className = 'feedback incorrect';
    lbl.textContent = `❌ INCORRECT — Correct answer: ${q.a ? 'TRUE' : 'FALSE'}`;
    wrongAnswers.push({ s: q.s, correct: q.a, chosen: selected, e: q.e });
  }
  txt.textContent = q.e;
  document.getElementById('liveScore').textContent = `✅ ${correctCount}   ❌ ${incorrectCount}`;
  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
  current++;
  loadQuestion();
}

function showFinal() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('finalCard').style.display = 'block';
  const total = order.length;
  const pct = Math.round((correctCount / total) * 100);
  document.getElementById('finalScoreText').textContent = pct + '%';
  document.getElementById('finalCorrect').textContent = correctCount;
  document.getElementById('finalIncorrect').textContent = incorrectCount;
  document.getElementById('finalTotal').textContent = total;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  wrongAnswers.forEach(w => {
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `<div class="q">${w.s}</div><div class="ans">Your answer: ${w.chosen ? 'TRUE' : 'FALSE'} &nbsp;|&nbsp; Correct: ${w.correct ? 'TRUE' : 'FALSE'}<br>${w.e}</div>`;
    reviewList.appendChild(div);
  });
}

function toggleReview() {
  const rl = document.getElementById('reviewList');
  rl.style.display = rl.style.display === 'block' ? 'none' : 'block';
}

function restartQuiz() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  current = 0;
  correctCount = 0;
  incorrectCount = 0;
  wrongAnswers = [];
  document.getElementById('finalCard').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('reviewList').style.display = 'none';
  loadQuestion();
}

loadQuestion();
</script>
