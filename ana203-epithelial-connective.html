yologically from mesenchyme.", "a": true, "e": "Correct \u2014 mesenchyme is the embryonic source of all connective tissue."}, {"s": "The extracellular matrix of connective tissue consists of ground substance and fibers.", "a": true, "e": "Correct \u2014 these two components make up the matrix."}, {"s": "Ground substance is a gel-like substance filling the space between cells and fibers.", "a": true, "e": "Correct \u2014 this is the standard definition of ground substance."}, {"s": "Collagen fibers provide high tensile strength to connective tissue.", "a": true, "e": "Correct \u2014 collagen resists pulling/stretching forces."}, {"s": "Elastic fibers allow connective tissue to stretch and recoil.", "a": true, "e": "Correct \u2014 elastin gives tissues their stretch-and-return property."}, {"s": "Elastic fibers are made of the protein elastin.", "a": true, "e": "Correct \u2014 elastin is the core protein of elastic fibers."}, {"s": "Reticular fibers form a fine, branching supportive network in organs like the spleen and lymph nodes.", "a": true, "e": "Correct \u2014 reticular fibers create organ stroma."}, {"s": "Reticular fibers are composed of type III collagen.", "a": true, "e": "Correct \u2014 type III collagen forms reticular fibers specifically."}, {"s": "Fibroblasts are the most abundant and primary resident cells of connective tissue proper.", "a": true, "e": "Correct \u2014 fibroblasts are the main 'fixed' cell type."}, {"s": "Fibroblasts synthesize collagen, elastin, and ground substance components.", "a": true, "e": "Correct \u2014 this is the fibroblast's key function."}, {"s": "Macrophages in connective tissue are derived from monocytes and function in phagocytosis.", "a": true, "e": "Correct \u2014 macrophages are monocyte-derived phagocytes."}, {"s": "Mast cells release histamine and heparin, contributing to inflammatory and allergic responses.", "a": true, "e": "Correct \u2014 these are key mast cell mediators."}, {"s": "Plasma cells, found in connective tissue, are responsible for antibody production.", "a": true, "e": "Correct \u2014 plasma cells are differentiated B cells that secrete antibodies."}, {"s": "Adipocytes are specialized cells for storing lipid (fat).", "a": true, "e": "Correct \u2014 this is the defining function of adipocytes."}, {"s": "Leukocytes found in connective tissue are considered transient/wandering cells.", "a": true, "e": "Correct \u2014 they migrate in from blood as needed."}, {"s": "Fixed cells of connective tissue, like fibroblasts and adipocytes, remain relatively stationary within the tissue.", "a": true, "e": "Correct \u2014 this contrasts with wandering immune cells."}, {"s": "Loose (areolar) connective tissue has a high ratio of ground substance to fibers, making it flexible.", "a": true, "e": "Correct \u2014 this gives loose CT its pliability."}, {"s": "Loose connective tissue is commonly found beneath epithelial tissue and surrounding organs.", "a": true, "e": "Correct \u2014 it's a widespread supportive/packing tissue."}, {"s": "Adipose tissue is a specialized type of loose connective tissue for fat storage.", "a": true, "e": "Correct \u2014 adipose tissue is a variant of loose connective tissue."}, {"s": "Adipose tissue provides insulation and cushioning for the body.", "a": true, "e": "Correct \u2014 these are key physical roles of adipose tissue."}, {"s": "White adipose tissue is the primary fat-storing tissue in adults.", "a": true, "e": "Correct \u2014 most adult fat stores are white adipose tissue."}, {"s": "Brown adipose tissue is more abundant in infants and is specialized for heat generation.", "a": true, "e": "Correct \u2014 brown fat generates heat via thermogenesis."}, {"s": "Reticular connective tissue forms the structural framework of lymphoid organs like the spleen and lymph nodes.", "a": true, "e": "Correct \u2014 reticular fibers create the organ's internal scaffold."}, {"s": "Dense regular connective tissue has collagen fibers arranged in parallel bundles. ing to tissue resilience.", "a": true, "e": "Correct \u2014 this branching pattern supports elastic recoil."}, {"s": "Reticular tissue is not the same as reticular fibers, though reticular tissue is defined by predominance of reticular fibers.", "a": true, "e": "Correct \u2014 reticular tissue is a distinct tissue type built around reticular fibers."}, {"s": "The perichondrium is a layer of dense connective tissue surrounding cartilage that provides nutrients via diffusion.", "a": true, "e": "Correct \u2014 this compensates for cartilage's lack of blood supply."}, {"s": "Keloid scars form due to excessive collagen production during wound healing.", "a": true, "e": "Correct \u2014 keloids result from overactive fibroblast collagen synthesis."}, {"s": "Connective tissue proper does not include specialized connective tissues like blood, cartilage, or bone.", "a": true, "e": "Correct \u2014 those are classified separately as specialized connective tissue."}, {"s": "Ligament sprains often heal slowly due to relatively poor blood supply in dense regular connective tissue.", "a": true, "e": "Correct \u2014 reduced vascularity slows healing in tendons/ligaments."}, {"s": "Fibroblasts can differentiate or transition into myofibroblasts during wound contraction.", "a": true, "e": "Correct \u2014 myofibroblasts help contract and close wounds."}, {"s": "Mast cells are structurally and functionally similar to basophils found in blood.", "a": true, "e": "Correct \u2014 both cell types release similar inflammatory mediators."}, {"s": "Ground substance regulates the diffusion of nutrients, gases, and wastes between blood and cells within connective tissue.", "a": true, "e": "Correct \u2014 this is a key physiological role of ground substance."}, {"s": "Loose connective tissue provides a reservoir for water and electrolytes in the body.", "a": true, "e": "Correct \u2014 its gel-like ground substance can hold fluid."}, {"s": "Elastic cartilage, elastic ligaments, and the walls of large arteries all rely on abundant elastic fibers.", "a": true, "e": "Correct \u2014 these all require significant elasticity."}, {"s": "Dense regular connective tissue is poorly vascularized compared to loose connective tissue.", "a": true, "e": "Correct \u2014 this contributes to its slower healing."}, {"s": "The extracellular matrix of connective tissue can range from fluid (blood) to solid (bone).", "a": true, "e": "Correct \u2014 this range illustrates the diversity of connective tissue."}, {"s": "Fat (adipose) tissue also functions as an endocrine organ, secreting hormones like leptin.", "a": true, "e": "Correct \u2014 adipose tissue has recognized endocrine functions."}, {"s": "Leptin, secreted by adipose tissue, plays a role in regulating appetite and energy balance.", "a": true, "e": "Correct \u2014 leptin signals satiety to the brain."}, {"s": "Areolar (loose) connective tissue supports blood vessels and nerves as they pass through tissues.", "a": true, "e": "Correct \u2014 its flexible matrix accommodates vessels and nerves."}, {"s": "Reticular connective tissue provides a supportive stroma for hematopoietic and lymphoid cells.", "a": true, "e": "Correct \u2014 bone marrow and lymphoid organs rely on this framework."}, {"s": "The three main types of connective tissue fibers are collagen, elastic, and reticular fibers.", "a": true, "e": "Correct \u2014 these are the three classic fiber types."}, {"s": "Cartilage lacks nerve supply, similar to its lack of blood supply.", "a": true, "e": "Correct \u2014 cartilage is both avascular and aneural."}, {"s": "Blood vessels supplying connective tissue also nourish adjacent epithelial tissue by diffusion.", "a": true, "e": "Correct \u2014 this is how avascular epithelium gets its nutrients."}, {"s": "Wound healing in richly vascularized connective tissue is generally faster than in avascular tissue like cartilage.", "a": true, "e": "Correct \u2014 blood supply speeds the healing process."}, {"s": "Type I collagen is t ular or vascular depending on location.", "a": false, "e": "Epithelial tissue is always avascular \u2014 it is nourished by diffusion from underlying connective tissue, regardless of location."}, {"s": "The apical surface of an epithelial cell faces the basement membrane.", "a": false, "e": "The apical surface faces the lumen/outside world; the BASAL surface faces the basement membrane."}, {"s": "Simple squamous epithelium lining the kidney's Bowman's capsule allows efficient filtration of blood.", "a": true, "e": "Correct \u2014 thinness supports rapid filtration."}, {"s": "The number of cell layers in an epithelium generally correlates with how much protection it provides.", "a": true, "e": "Correct \u2014 more layers generally mean more protection from abrasion."}, {"s": "Ciliated pseudostratified epithelium is well suited to trap and move debris out of the airway.", "a": true, "e": "Correct \u2014 coordinated ciliary beating clears mucus and trapped particles."}, {"s": "A single layer of flattened cells lining the inside of blood vessels is termed the endothelium.", "a": true, "e": "Correct \u2014 endothelium is a specialized simple squamous epithelium."}, {"s": "Epithelial tissue never contains glands.", "a": false, "e": "Glands (both exocrine and endocrine) are derived from epithelial tissue."}, {"s": "Merocrine and eccrine are sometimes used interchangeably to describe sweat gland secretion.", "a": true, "e": "Correct \u2014 eccrine sweat glands use the merocrine mechanism."}, {"s": "The junctional complex near the apical surface of epithelial cells often includes a tight junction, adherens junction, and desmosome in sequence.", "a": true, "e": "Correct \u2014 this arrangement is typical in many epithelia."}, {"s": "Columnar epithelial cells are generally taller in absorptive tissues like the small intestine to maximize surface area.", "a": true, "e": "Correct \u2014 height supports greater absorptive capacity."}, {"s": "Epithelium regenerates from stem cells // Fisher-Yates shuffle
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let order = shuffle(QUESTIONS.map((_, i) => i));
let current = 0;
let selected = null;
let locked = false;
let correctCount = 0;
let incorrectCount = 0;
let wrongAnswers = [];

function loadQuestion() {
  if (current >= order.length) {
    showFinal();
    return;
  }
  const q = QUESTIONS[order[current]];
  document.getElementById('statementText').textContent = q.s;
  document.getElementById('qCounter').textContent = `Question ${current + 1} / ${order.length}`;
  document.getElementById('progressFill').style.width = `${(current / order.length) * 100}%`;
  document.getElementById('liveScore').textContent = `✅ ${correctCount}   ❌ ${incorrectCount}`;
  selected = null;
  locked = false;
  document.getElementById('trueBtn').className = 'tf-btn';
  document.getElementById('falseBtn').className = 'tf-btn';
  document.getElementById('lockBtn').disabled = true;
  document.getElementById('lockBtn').style.display = 'block';
  document.getElementById('feedbackBox').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('trueBtn').disabled = false;
  document.getElementById('falseBtn').disabled = false;
}

function selectAnswer(val) {
  if (locked) return;
  selected = val;
  document.getElementById('trueBtn').className = 'tf-btn' + (val === true ? ' selected-true' : '');
  document.getElementById('falseBtn').className = 'tf-btn' + (val === false ? ' selected-false' : '');
  document.getElementById('lockBtn').disabled = false;
}

function lockAnswer() {
  if (selected === null || locked) return;
  locked = true;
  const q = QUESTIONS[order[current]];
  const isCorrect = selected === q.a;
  document.getElementById('trueBtn').disabled = true;
  document.getElementById('falseBtn').disabled = true;
  document.getElementById('lockBtn').style.display = 'none';

  const fb = document.getElementById('feedbackBox');
  const lbl = document.getElementById('feedbackLabel');
  const txt = document.getElementById('feedbackText');

  if (isCorrect) {
    correctCount++;
    fb.className = 'feedback correct';
    lbl.textContent = '✅ CORRECT';
  } else {
    incorrectCount++;
    fb.className = 'feedback incorrect';
    lbl.textContent = `❌ INCORRECT — Correct answer: ${q.a ? 'TRUE' : 'FALSE'}`;
    wrongAnswers.push({ s: q.s, correct: q.a, chosen: selected, e: q.e });
  }
  txt.textContent = q.e;
  document.getElementById('liveScore').textContent = `✅ ${correctCount}   ❌ ${incorrectCount}`;
  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
  current++;
  loadQuestion();
}

function showFinal() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('finalCard').style.display = 'block';
  const total = order.length;
  const pct = Math.round((correctCount / total) * 100);
  document.getElementById('finalScoreText').textContent = pct + '%';
  document.getElementById('finalCorrect').textContent = correctCount;
  document.getElementById('finalIncorrect').textContent = incorrectCount;
  document.getElementById('finalTotal').textContent = total;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  wrongAnswers.forEach(w => {
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `<div class="q">${w.s}</div><div class="ans">Your answer: ${w.chosen ? 'TRUE' : 'FALSE'} &nbsp;|&nbsp; Correct: ${w.correct ? 'TRUE' : 'FALSE'}<br>${w.e}</div>`;
    reviewList.appendChild(div);
  });
}

function toggleReview() {
  const rl = document.getElementById('reviewList');
  rl.style.display = rl.style.display === 'block' ? 'none' : 'block';
}

function restartQuiz() {
  order = shuffle(QUESTIONS.map((_, i) => i));
  current = 0;
  correctCount = 0;
  incorrectCount = 0;
  wrongAnswers = [];
  document.getElementById('finalCard').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('reviewList').style.display = 'none';
  loadQuestion();
}

loadQuestion();
</script>
