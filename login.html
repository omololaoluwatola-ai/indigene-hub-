<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — INDIGENE Study Console</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0704;
    --card: #17100a;
    --fire1: #ff6a00;
    --fire2: #ffb300;
    --fire3: #ff2e00;
    --text: #fdf1e6;
    --muted: #b89a80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 15%, rgba(255,106,0,0.18) 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(255,46,0,0.12) 0%, transparent 60%),
      var(--bg);
    font-family: 'Exo 2', sans-serif;
    color: var(--text);
    padding: 24px 20px;
  }

  /* ---- Hero: A+ coin crossfading above glowing INDIGENE wordmark ---- */
  .hero {
    text-align: center;
    margin-bottom: 26px;
  }
  .hero-glow {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,170,50,0.35) 0%, rgba(255,120,0,0.12) 45%, transparent 75%);
    filter: blur(6px);
    z-index: -1;
  }
  .hero { position: relative; }
  .coin {
    width: 120px;
    height: 120px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 38% 28%, #fffaf0 0%, #ffe9a8 18%, #ffcf5c 45%, #ffab2e 72%, #f08a00 100%);
    box-shadow:
      0 0 30px rgba(255,180,60,0.55),
      0 0 60px rgba(255,130,0,0.3),
      inset 0 3px 6px rgba(255,255,255,0.5),
      inset 0 -8px 12px rgba(140,60,0,0.4);
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 34px;
    color: #2a1400;
    opacity: 0;
    animation: pop-in 0.7s ease-out 0.1s forwards;
  }
  .wordmark {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 54px;
    letter-spacing: 3px;
    line-height: 1;
    background: linear-gradient(180deg, #ffe27a 0%, #ffb020 25%, #ff7a00 55%, #ff3d00 80%, #d92600 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow:
      0 0 14px rgba(255,140,0,0.55),
      0 0 32px rgba(255,90,0,0.4),
      0 3px 0 rgba(120,20,0,0.6);
    opacity: 0;
    animation: pop-in 0.8s ease-out 0.3s forwards;
  }
  @keyframes pop-in {
    0% { opacity: 0; transform: scale(0.7) translateY(10px); }
    70% { opacity: 1; transform: scale(1.05) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .tagline {
    margin-top: 4px;
    font-family: 'Exo 2', sans-serif;
    font-weight: 500;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7d6650;
    opacity: 0;
    animation: pop-in 0.7s ease-out 0.55s forwards;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(180deg, #1c130b 0%, #140d07 100%);
    border: 1px solid rgba(255,140,0,0.18);
    border-radius: 18px;
    padding: 28px 24px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,180,80,0.06);
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 22px;
    letter-spacing: 0.5px;
  }
  input {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,140,0,0.2);
    background: #0f0a06;
    color: var(--text);
    font-size: 15px;
    font-family: 'Exo 2', sans-serif;
  }
  input::placeholder { color: #7a5f4a; }
  input:focus { outline: none; border-color: var(--fire1); box-shadow: 0 0 0 3px rgba(255,106,0,0.15); }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Exo 2', sans-serif;
    cursor: pointer;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .btn-primary {
    background: linear-gradient(90deg, var(--fire3), var(--fire1), var(--fire2));
    color: #1a0a00;
    box-shadow: 0 4px 18px rgba(255,90,0,0.35);
  }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-google {
    background: #fdf1e6;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
    margin: 16px 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255,140,0,0.15);
  }
  .switch {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }
  .switch a { color: var(--fire2); text-decoration: none; font-weight: 700; }
  #msg {
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    margin-bottom: 8px;
  }
  #msg.error { color: #ff6b5c; }
  #msg.success { color: #ffcf5c; }
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-glow"></div>
    <div class="coin">A+</div>
    <div class="wordmark">INDIGENE</div>
    <div class="tagline">Personal Study Console</div>
  </div>

  <div class="card">
    <div class="subtitle">Welcome back</div>

    <div id="msg"></div>

    <input id="email" type="email" placeholder="Email" autocomplete="email" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn" class="btn-primary">Log in</button>

    <div class="divider">OR</div>

    <button id="googleBtn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="switch">New here? <a href="register.html">Create an account</a></div>
  </div>

  <script type="module">
    import { loginWithEmail, loginWithGoogle, friendlyError } from "./auth.js";

    const msg = document.getElementById("msg");
    const loginBtn = document.getElementById("loginBtn");
    const googleBtn = document.getElementById("googleBtn");

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = type;
    }

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMsg("Enter your email and password.", "error");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";
      try {
        await loginWithEmail(email, password);
        showMsg("Welcome back! Redirecting...", "success");
        setTimeout(() => (window.location.href = "index.html"), 800);
      } catch (err) {
        showMsg(friendlyError(err.code), "error");
        loginBtn.disabled = false;
        loginBtn.textContent = "Log in";
      }
    });

    googleBtn.addEventListener("click", async () => {
      try {
        await loginWithGoogle();
        showMsg("Signed in! Redirecting...", "success");
        setTimeout(() => (window.location.href = "index.html"), 800);
      } catch (err) {
        showMsg(friendlyError(err.code), "error");
      }
    });
  </script>
</body>
</html>
