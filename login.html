<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — INDIGENE Study Console</title>
<style>
  :root {
    --bg: #0a0a12;
    --card: #14141f;
    --accent: #ff4d4d;
    --accent2: #7b2ff7;
    --text: #f2f2f7;
    --muted: #9a9ab0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #1a1a2e 0%, var(--bg) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 32px 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .wordmark {
    text-align: center;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  input {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    background: #1c1c2a;
    color: var(--text);
    font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--accent2); }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn-primary {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: white;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-google {
    background: #fff;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
    margin: 16px 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.1);
  }
  .switch {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }
  .switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
  #msg {
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    margin-bottom: 8px;
  }
  #msg.error { color: #ff6b6b; }
  #msg.success { color: #4dff9e; }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">INDIGENE</div>
    <div class="subtitle">Welcome back</div>

    <div id="msg"></div>

    <input id="email" type="email" placeholder="Email" autocomplete="email" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn" class="btn-primary">Log in</button>

    <div class="divider">OR</div>

    <button id="googleBtn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="switch">New here? <a href="register.html">Create an account</a></div>
  </div>

  <script type="module">
    import { loginWithEmail, loginWithGoogle, friendlyError } from "./auth.js";

    const msg = document.getElementById("msg");
    const loginBtn = document.getElementById("loginBtn");
    const googleBtn = document.getElementById("googleBtn");

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = type;
    }

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMsg("Enter your email and password.", "error");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";
      try {
        await loginWithEmail(email, password);
        showMsg("Welcome back! Redirecting...", "success");
        setTimeout(() => (window.location.href = "index.html"), 800);
      } catch (err) {
        showMsg(friendlyError(err.code), "error");
        loginBtn.disabled = false;
        loginBtn.textContent = "Log in";
      }
    });

    googleBtn.addEventListener("click", async () => {
      try {
        await loginWithGoogle();
        showMsg("Signed in! Redirecting...", "success");
        setTimeout(() => (window.location.href = "index.html"), 800);
      } catch (err) {
        showMsg(friendlyError(err.code), "error");
      }
    });
  </script>
</body>
</html>
