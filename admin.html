<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · INDIGENE</title>
<style>
  :root{--bg:#0b0706; --char:#120b09; --line:rgba(255,122,26,0.18); --ember:#ff7a1a; --hot:#ffb066; --deep:#d9480f; --text:#f6e9db; --dim:#a89888; --ok:#7ddc8a; --bad:#ff7a6a;}
  *{box-sizing:border-box; margin:0;}
  body{background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px; line-height:1.45; padding:16px; max-width:640px; margin:0 auto; padding-bottom:60px;}
  h1{font-size:1.7rem; font-weight:900; letter-spacing:.04em; text-transform:uppercase; margin:6px 0 2px;}
  h1 b{color:var(--ember);}
  h2{font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin:26px 0 10px; font-weight:600;}
  .top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .sub{color:var(--dim); font-size:.9rem;}
  .card{border:1px solid var(--line); background:var(--char); border-radius:8px; padding:14px;}
  input[type=email],input[type=search]{width:100%; min-height:46px; padding:0 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:1rem;}
  input:focus{outline:none; border-color:rgba(255,122,26,.6);}
  .btn{min-height:44px; padding:0 18px; border-radius:999px; border:none; cursor:pointer; font-weight:700; font-size:.95rem; color:#fff; background:linear-gradient(135deg,var(--ember),var(--deep));}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  .btn.small{min-height:38px; padding:0 14px; font-size:.85rem;}
  .btn[disabled]{opacity:.5; cursor:default;}
  .checks{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0;}
  .chk{display:flex; align-items:center; gap:10px; min-height:46px; padding:0 12px; border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:.92rem;}
  .chk input{width:20px; height:20px; accent-color:var(--ember); flex:none;}
  .chk:has(input:checked){border-color:var(--ember); background:rgba(255,122,26,.08);}
  .msg{min-height:1.3em; margin-top:10px; font-size:.9rem;}
  .msg.ok{color:var(--ok);} .msg.bad{color:var(--bad);}
  .grp{margin-bottom:14px;}
  .grp-name{font-weight:700; margin-bottom:6px;}
  .sw{display:flex; gap:8px;}
  .swb{flex:1; min-height:46px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--dim); font-weight:700; cursor:pointer;}
  .swb.on{background:rgba(125,220,138,.12); border-color:var(--ok); color:var(--ok);}
  .swb small{display:block; font-weight:500; font-size:.7rem; letter-spacing:.06em;}
  .who{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:12px 0; border-top:1px solid var(--line);}
  .who:first-child{border-top:none;}
  .who-email{word-break:break-all; font-weight:600;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .tag{font-size:.72rem; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--hot);}
  .acts{display:flex; gap:6px; flex:none;}
  .center{text-align:center; padding:40px 10px;}
  .center .btn{margin-top:16px;}
</style>
</head>
<body>

<div id="gate" class="center"><div class="sub">Checking sign-in...</div></div>

<div id="panel" hidden>
  <div class="top">
    <div><h1>Indigene <b>Admin</b></h1><div class="sub" id="who-am-i"></div></div>
    <button class="btn ghost small" id="out" type="button">Log out</button>
  </div>

  <h2>Unlock a student</h2>
  <div class="card">
    <input type="email" id="em" placeholder="Student email" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="checks" id="checks"></div>
    <div style="display:flex; gap:8px;">
      <button class="btn" id="save" type="button">Save unlock</button>
      <button class="btn ghost" id="clear" type="button">Clear</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <h2>Premium (CBT + past questions)</h2>
  <div class="card">
    <input type="email" id="pem" placeholder="Student email" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn" id="psave" type="button">Give premium</button>
    </div>
    <div class="msg" id="pmsg" role="status"></div>
    <input type="search" id="pfind" placeholder="Search premium students" style="margin:6px 0 6px;">
    <div id="plist"><div class="sub">Loading...</div></div>
  </div>

  <h2>Mock switches</h2>
  <div class="card" id="switches"></div>

  <h2>Unlocked students <span id="count"></span></h2>
  <input type="search" id="find" placeholder="Search email" style="margin-bottom:10px;">
  <div class="card" id="list"><div class="sub">Loading...</div></div>
</div>

<script type="module">
  import { auth, db, watchAuthState, loginWithGoogle, logout } from "./auth.js";
  import { doc, getDoc, setDoc, deleteDoc, getDocs, collection, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // Must match the email in firestore.rules
  const ADMIN_EMAIL = "omololaoluwatola@gmail.com";
  const GROUPS = [
    { key: "100-1", label: "100 level · 1st semester" },
    { key: "100-2", label: "100 level · 2nd semester" },
    { key: "200-1", label: "200 level · 1st semester" },
    { key: "200-2", label: "200 level · 2nd semester" }
  ];
  const $ = id => document.getElementById(id);
  let switches = {};
  let rows = [];
  let prem = [];

  function gate(html, btnText, btnFn) {
    $("panel").hidden = true;
    const g = $("gate"); g.hidden = false; g.textContent = "";
    const p = document.createElement("div"); p.textContent = html; g.appendChild(p);
    if (btnText) { const b = document.createElement("button"); b.className = "btn"; b.textContent = btnText; b.onclick = btnFn; g.appendChild(b); }
  }

  function say(text, ok) { const m = $("msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "bad"); }
  function cleanEmail(v) { return String(v || "").trim().toLowerCase(); }
  function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }

  function buildChecks() {
    $("checks").innerHTML = "";
    GROUPS.forEach(g => {
      const l = document.createElement("label"); l.className = "chk";
      const i = document.createElement("input"); i.type = "checkbox"; i.value = g.key;
      const t = document.createElement("span"); t.textContent = g.label;
      l.append(i, t); $("checks").appendChild(l);
    });
  }
  const ticked = () => [...$("checks").querySelectorAll("input:checked")].map(i => i.value);
  function setTicks(keys) { $("checks").querySelectorAll("input").forEach(i => { i.checked = keys.includes(i.value); }); }

  function drawSwitches() {
    const box = $("switches"); box.innerHTML = "";
    GROUPS.forEach(g => {
      const w = document.createElement("div"); w.className = "grp";
      const n = document.createElement("div"); n.className = "grp-name"; n.textContent = g.label; w.appendChild(n);
      const r = document.createElement("div"); r.className = "sw";
      [1, 2, 3].forEach(m => {
        const k = g.key + "-" + m, on = switches[k] === true;
        const b = document.createElement("button"); b.type = "button"; b.className = "swb" + (on ? " on" : "");
        b.innerHTML = "Mock " + m + "<small>" + (on ? "ON" : "OFF") + "</small>";
        b.onclick = () => flip(k, b);
        r.appendChild(b);
      });
      w.appendChild(r); box.appendChild(w);
    });
  }

  async function flip(k, btn) {
    btn.disabled = true;
    const next = !(switches[k] === true);
    try {
      await setDoc(doc(db, "mockSwitches", "main"), { [k]: next }, { merge: true });
      switches[k] = next;
    } catch (e) { say("Could not change the switch. " + (e.code || ""), false); }
    drawSwitches();
  }

  function drawList() {
    const q = cleanEmail($("find").value);
    const shown = rows.filter(r => !q || r.email.includes(q));
    $("count").textContent = rows.length ? "(" + rows.length + ")" : "";
    const box = $("list"); box.innerHTML = "";
    if (!shown.length) { const d = document.createElement("div"); d.className = "sub"; d.textContent = rows.length ? "No match." : "Nobody unlocked yet."; box.appendChild(d); return; }
    shown.forEach(r => {
      const w = document.createElement("div"); w.className = "who";
      const left = document.createElement("div");
      const e = document.createElement("div"); e.className = "who-email"; e.textContent = r.email; left.appendChild(e);
      const tg = document.createElement("div"); tg.className = "tags";
      GROUPS.filter(g => r.groups[g.key] === true).forEach(g => { const s = document.createElement("span"); s.className = "tag"; s.textContent = g.label; tg.appendChild(s); });
      left.appendChild(tg);
      const a = document.createElement("div"); a.className = "acts";
      const ed = document.createElement("button"); ed.className = "btn ghost small"; ed.textContent = "Edit";
      ed.onclick = () => { $("em").value = r.email; setTicks(GROUPS.filter(g => r.groups[g.key] === true).map(g => g.key)); window.scrollTo({ top: 0, behavior: "smooth" }); say("Editing " + r.email, true); };
      const rm = document.createElement("button"); rm.className = "btn ghost small"; rm.textContent = "Remove";
      rm.onclick = async () => {
        if (!confirm("Remove " + r.email + "?")) return;
        try { await deleteDoc(doc(db, "mockUnlocks", r.email)); rows = rows.filter(x => x.email !== r.email); drawList(); say("Removed " + r.email, true); }
        catch (err) { say("Could not remove. " + (err.code || ""), false); }
      };
      a.append(ed, rm); w.append(left, a); box.appendChild(w);
    });
  }

  async function loadAll() {
    try {
      const sw = await getDoc(doc(db, "mockSwitches", "main"));
      switches = sw.exists() ? sw.data() : {};
      const snap = await getDocs(collection(db, "mockUnlocks"));
      const ps = await getDocs(collection(db, "premiumUnlocks"));
      prem = ps.docs.map(d => d.id).sort();
      rows = snap.docs.map(d => ({ email: d.id, groups: (d.data().groups || {}) }))
        .sort((a, b) => a.email.localeCompare(b.email));
    } catch (e) { say("Could not load data. " + (e.code || ""), false); }
    drawSwitches(); drawList(); drawPrem();
  }

  function pSay(text, ok) { const m = $("pmsg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "bad"); }

  function drawPrem() {
    const q = cleanEmail($("pfind").value);
    const shown = prem.filter(e => !q || e.includes(q));
    const box = $("plist"); box.innerHTML = "";
    if (!shown.length) { const d = document.createElement("div"); d.className = "sub"; d.textContent = prem.length ? "No match." : "No premium students yet."; box.appendChild(d); return; }
    shown.forEach(email => {
      const w = document.createElement("div"); w.className = "who";
      const e = document.createElement("div"); e.className = "who-email"; e.textContent = email;
      const rm = document.createElement("button"); rm.className = "btn ghost small"; rm.textContent = "Remove";
      rm.onclick = async () => {
        if (!confirm("Remove premium from " + email + "?")) return;
        try { await deleteDoc(doc(db, "premiumUnlocks", email)); prem = prem.filter(x => x !== email); drawPrem(); pSay("Premium removed from " + email, true); }
        catch (err) { pSay("Could not remove. " + (err.code || ""), false); }
      };
      w.append(e, rm); box.appendChild(w);
    });
  }

  $("psave").onclick = async () => {
    const email = cleanEmail($("pem").value);
    if (!validEmail(email)) return pSay("That email does not look right.", false);
    $("psave").disabled = true;
    try {
      await setDoc(doc(db, "premiumUnlocks", email), { email, premium: true, updatedAt: serverTimestamp() });
      if (!prem.includes(email)) { prem.push(email); prem.sort(); }
      drawPrem(); pSay("Premium given to " + email, true); $("pem").value = "";
    } catch (e) { pSay("Could not save. " + (e.code || ""), false); }
    $("psave").disabled = false;
  };
  $("pfind").addEventListener("input", drawPrem);

  $("save").onclick = async () => {
    const email = cleanEmail($("em").value);
    if (!validEmail(email)) return say("That email does not look right.", false);
    const keys = ticked();
    if (!keys.length) return say("Tick at least one level and semester.", false);
    const groups = {}; keys.forEach(k => { groups[k] = true; });
    $("save").disabled = true;
    try {
      await setDoc(doc(db, "mockUnlocks", email), { email, groups, updatedAt: serverTimestamp() });
      const i = rows.findIndex(r => r.email === email);
      if (i >= 0) rows[i].groups = groups; else { rows.push({ email, groups }); rows.sort((a, b) => a.email.localeCompare(b.email)); }
      drawList(); say("Saved. " + email + " is unlocked.", true);
      $("em").value = ""; setTicks([]);
    } catch (e) { say("Could not save. " + (e.code || ""), false); }
    $("save").disabled = false;
  };
  $("clear").onclick = () => { $("em").value = ""; setTicks([]); say("", true); };
  $("find").addEventListener("input", drawList);
  $("out").onclick = () => logout();

  buildChecks();
  let started = false;
  watchAuthState(user => {
    if (!user) { started = false; return gate("Sign in with the admin Google account.", "Sign in with Google", async () => { try { await loginWithGoogle(); } catch (e) {} }); }
    const ok = (user.email || "").toLowerCase() === ADMIN_EMAIL && user.emailVerified;
    if (!ok) {
      return gate("This account is not the admin: " + (user.email || "") + ". Log out and sign in with the admin Google account.", "Log out", () => logout());
    }
    $("gate").hidden = true; $("panel").hidden = false;
    $("who-am-i").textContent = user.email;
    if (!started) { started = true; loadAll(); }
  });
</script>
</body>
</html>
