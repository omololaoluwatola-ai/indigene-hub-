a is the primary weight-transmitting structure of the forearm at the wrist joint.", "answer": false, "explanation": "This is a repeated high-yield theme \u2014 the radius, not the ulna, bears the main load transmission to the carpus."}, {"id": 9, "topic": "Scapula", "statement": "The supraspinous fossa lies above the spine of the scapula on its posterior surface.", "answer": true, "explanation": "The spine of the scapula divides the posterior surface into supraspinous (above) and infraspinous (below) fossae."}, {"id": 10, "topic": "HandBones", "statement": "The distal phalanges have no distinguishing terminal features.", "answer": false, "explanation": "The distal phalangeal tuft is a recognized anatomical feature supporting the fingertip's pulp and nail bed."}, {"id": 11, "topic": "Humerus", "statement": "The lateral epicondyle of the humerus is the common origin for the forearm extensor muscles.", "answer": true, "explanation": "The lateral epicondyle is the common extensor origin; the medial epicondyle is the common flexor origin."}, {"id": 12, "topic": "Humerus", "statement": "A supracondylar humeral fracture is exclusively an adult injury with no vascular risk.", "answer": false, "explanation": "Supracondylar fractures are classically a pediatric injury, with risk to the brachial artery and median nerve due to their proximity."}, {"id": 13, "topic": "Scapula", "statement": "The supraglenoid tubercle gives origin to the long head of triceps.", "answer": false, "explanation": "This is the classic paired fact with the infraglenoid tubercle \u2014 supraglenoid feeds biceps, infraglenoid feeds triceps."}, {"id": 14, "topic": "Humerus", "statement": "The axillary nerve and posterior circumflex humeral artery travel within the radial groove of the humeral shaft.", "answer": false, "explanation": "The radial groove on the posterior humeral shaft carries the radial nerve and profunda brachii artery, at risk in mid-shaft fractures."}, {"id": 15, "topic": "Clavicle", "sta assically risks injury to the radial nerve, producing wrist drop.", "answer": true, "explanation": "Because the radial nerve runs in the spiral groove of the mid-shaft, fractures here classically injure it, causing wrist drop."}, {"id": 23, "topic": "Humerus", "statement": "Brachialis originates from the proximal posterior surface of the humeral shaft.", "answer": false, "explanation": "Brachialis takes a broad origin from the lower half of the anterior humeral shaft."}, {"id": 24, "topic": "Clavicle", "statement": "The costoclavicular ligament anchors the medial clavicle to the first rib.", "answer": true, "explanation": "The costoclavicular ligament stabilizes the sternoclavicular joint by connecting the clavicle to the first rib."}, {"id": 25, "topic": "Humerus", "statement": "The olecranon fossa on the posterior distal humerus receives the olecranon process during elbow extension.", "answer": true, "explanation": "The olecranon fossa is posterior and accommodates the olecranon in full extension; the coronoid fossa is anterior."}, {"id": 26, "topic": "Scapula", "statement": "The infraglenoid tubercle, just below the glenoid cavity, gives origin to the long head of triceps.", "answer": true, "explanation": "Infraglenoid tubercle (triceps long head) sits below the glenoid; supraglenoid tubercle (biceps long head) sits above it."}, {"id": 27, "topic": "HandBones", "statement": "Each finger's proximal phalanx is the longest of its three phalanges.", "answer": true, "explanation": "In each finger, phalangeal length decreases from proximal to distal \u2014 proximal is longest, distal is shortest."}, {"id": 28, "topic": "HandBones", "statement": "The scaphoid and navicular are two completely separate, unrelated carpal bones.", "answer": false, "explanation": "'Navicular' is an older/alternative name sometimes used for the scaphoid bone, which can cause naming confusion."}, {"id": 29, "topic": "Clavicle", "statement": "The clavicle is convex forward at its medial two-thirds and concave forward at its lateral third.", "answer": true, "explanation": "This double-curve S-shape is a defining feature of the clavicle."}, {"id": 30, "topic": "Humerus", "statement": "The greater tubercle can be palpated as the bony prominence just below the acromion.", "answer": true, "explanation": "The greater tubercle is a recognizable palpable landmark on the lateral shoulder, just distal to the acromion."}, {"id": 31, "topic": "Humerus", "statement": "Teres minor inserts on the lesser tubercle of the humerus.", "answer": false, "explanation": "Teres minor's insertion is the lowest of the three greater-tubercle rotator cuff insertions (supraspinatus, infraspinatus, teres minor in that order top to bottom)."}, {"id": 32, "topic": "RadiusUlna", "statement": "The ulna acts as the relatively fixed pivot around which the radius rotates during pronation and supination.", "answer": true, "explanation": "The ulna stays comparatively still while the radius rotates around it during forearm rotation."}, {"id": 33, "topic": "RadiusUlna", "statement": "The radius is a long bone while the ulna is classified as a flat bone.", "answer": false, "explanation": "Both forearm bones share the long bone classification, consistent with the humerus and femur."}, {"id": 34, "topic": "Clavicle", "statement": "The clavicle is the most commonly fractured bone in the human body.", "answer": true, "explanation": "The clavicle's subcutaneous position and thin mid-shaft make it the most frequently fractured bone overall."}, {"id": 35, "topic": "Humerus", "statement": "The trochlea of the humerus is rounded and articulates with the radius.", "answer": false, "explanation": "The trochlea's pulley shape matches the trochlear notch of the ulna for the hinge action of the elbow."}, {"id": 36, "topic": "Humerus", "statement": "The greater tubercle of the humerus receives the insertion of subscapularis only.", "answer": false, "explanation": "The 'SIT' muscles (supraspinatus, infraspinatus, jor is a distinct origin from the medial clavicle."}, {"id": 59, "topic": "RadiusUlna", "statement": "The radial notch of the ulna articulates with the head of the radius at the proximal radioulnar joint.", "answer": true, "explanation": "The radial notch, on the lateral side of the coronoid process, forms the proximal radioulnar joint with the radial head."}, {"id": 60, "topic": "RadiusUlna", "statement": "The styloid process of the radius is located more distally than the styloid process of the ulna.", "answer": true, "explanation": "The radial styloid process typically extends slightly more distally than the ulnar styloid process, an important radiographic landmark."}, {"id": 61, "topic": "Humerus", "statement": "The medial and lateral supracondylar ridges are located at the proximal humerus near the head.", "answer": false, "explanation": "These ridges taper distally toward their respective epicondyles, forming part of the distal humeral shape."}, {"id": 62, "topic": "Humerus", "statement": "The deltoid tuberosity is located on the medial aspect of the humeral shaft.", "answer": false, "explanation": "The deltoid inserts on the deltoid tuberosity, on the lateral surface of the mid-shaft."}, {"id": 63, "topic": "Clavicle", "statement": "Sternocleidomastoid has a clavicular head that attaches to the medial clavicle.", "answer": true, "explanation": "SCM's clavicular head anchors to the medial part of the clavicle, alongside its sternal head on the manubrium."}, {"id": 64, "topic": "HandBones", "statement": "The blood supply to the scaphoid runs in a retrograde direction, making its proximal pole vulnerable to avascular necrosis after fracture.", "answer": true, "explanation": "Scaphoid blood supply enters distally and runs retrograde, so fractures near the proximal pole risk cutting off blood supply and causing avascular necrosis."}, {"id": 65, "topic": "Scapula", "statement": "Serratus anterior inserts along the lateral border of the scapula on its posterior surf ive structures (labrum, capsule, ligaments); the rotator cuff actively contracts to center the humeral head \u2014 it is dynamic."}, {"id": 270, "topic": "Glenohumeral", "statement": "The rotator cuff is a static stabilizer of the glenohumeral joint, while the labrum, capsule, and GHLs are dynamic stabilizers.", "answer": false, "explanation": "Static stabilizers are passive structures (labrum, capsule, ligaments); the rotator cuff actively contracts to center the humeral head \u2014 it is dynamic."}, {"id": 271, "topic": "Glenohumeral", "statement": "The subacromial bursa lies below the acromion and deltoid, above the supraspinatus tendon.", "answer": true, "explanation": "The subacromial (subdeltoid) bursa is the most clinically important bursa, sitting directly over supraspinatus beneath the acromion."}, {"id": 272, "topic": "Glenohumeral", "statement": "The subacromial bursa lies below the subscapularis tendon on the anterior scapula.", "answer": false, "explanation": "The subacromial (subdeltoid) bursa is the most clinically important bursa, sitting directly over supraspinatus beneath the acromion."}, {"id": 273, "topic": "Glenohumeral", "statement": "Anterior shoulder dislocation classically produces a Bankart lesion (labral/IGL tear) together with a Hill-Sachs lesion (humeral head compression fracture).", "answer": true, "explanation": "Bankart (anteroinferior labrum/IGL) and Hill-Sachs (posterolateral humeral head) lesions are the classic paired injuries of anterior dislocation."}, {"id": 274, "topic": "Glenohumeral", "statement": "Anterior shoulder dislocation classically produces a Colles' fracture together with a Monteggia fracture.", "answer": false, "explanation": "Bankart (anteroinferior labrum/IGL) and Hill-Sachs (posterolateral humeral head) lesions are the classic paired injuries of anterior dislocation."}, {"id": 275, "topic": "Glenohumeral", "statement": "The transverse humeral ligament holds the tendon of the long head of biceps within the intert d = anterior divisions of superior + middle trunks; medial cord = anterior division of inferior trunk alone."}, {"id": 307, "topic": "BrachialPlexus", "statement": "The medial cord is formed from the anterior division of the inferior trunk only (C8,T1).", "answer": true, "explanation": "The medial cord arises solely from the anterior division of the inferior trunk, carrying C8,T1 fibers."}, {"id": 308, "topic": "BrachialPlexus", "statement": "The medial cord is formed from the posterior divisions of all three trunks (C5-T1).", "answer": false, "explanation": "The medial cord arises solely from the anterior division of the inferior trunk, carrying C8,T1 fibers."}, {"id": 309, "topic": "BrachialPlexus", "statement": "The five terminal branches of the brachial plexus are Musculocutaneous, Axillary, Radial, Median, and Ulnar.", "answer": true, "explanation": "'Matt Ate Rats And Mice' \u2014 Musculocutaneous, Axillary, Radial, (median), Ulnar; suprascapular branches off earlier, at the trunk level."}, {"id": 310, "topic": "BrachialPlexus", "statement": "The five terminal branches of the brachial plexus are Musculocutaneous, Axillary, Radial, Median, and Suprascapular.", "answer": false, "explanation": "'Matt Ate Rats And Mice' \u2014 Musculocutaneous, Axillary, Radial, (median), Ulnar; suprascapular branches off earlier, at the trunk level."}, {"id": 311, "topic": "BrachialPlexus", "statement": "The median nerve is formed from both the lateral and medial cords, giving it a characteristic 'M' shape straddling the axillary artery.", "answer": true, "explanation": "Median = lateral cord head + medial cord head, the only terminal nerve formed from two cords \u2014 hence its M-shaped straddle over the axillary artery."}, {"id": 312, "topic": "BrachialPlexus", "statement": "The median nerve is formed solely from the posterior cord.", "answer": false, "explanation": "Median = lateral cord head + medial cord head, the only terminal nerve formed from two cords \u2014 hence its M- ", "statement": "The brachial artery becomes the radial and ulnar arteries by bifurcating at the radial neck of the ulna.", "answer": true, "explanation": "The brachial artery terminates by bifurcating at the level of the radial neck of the ulna (approx. the cubital fossa), forming the radial and ulnar arteries."}, {"id": 498, "topic": "Vasculature", "statement": "The brachial artery becomes the radial and ulnar arteries by bifurcating at the axillary artery's third part.", "answer": false, "explanation": "The brachial artery terminates by bifurcating at the level of the radial neck of the ulna (approx. the cubital fossa), forming the radial and ulnar arteries."}, {"id": 499, "topic": "Vasculature", "statement": "The brachial artery becomes the axillary artery's continuation at the lower margin of teres major.", "answer": true, "explanation": "The axillary artery is renamed the brachial artery once it passes the lower border of teres major."}, {"id": 500, "topic": "Vasculature", "statement": "The brachial artery becomes the axillary artery's continuation at the lower margin of pectoralis minor.", "answer": false, "explanation": "The axillary artery is renamed the brachial artery once it passes the lower border of teres major."}];</script>
<script>
// ---- App state ----
let sessionQueue = [];
let currentIndex = 0;
let selected = null;
let locked = false;
let score = 0;
let answered = 0;
let wrongList = [];
let topicScores = {};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const TOPIC_GROUPS = {
  "Osteology": ["Clavicle","Scapula","Humerus","RadiusUlna","HandBones"],
  "Joints & Ligaments": ["SCJoint","ACLigaments","Glenohumeral","Elbow","WristJoint","CMCMCP","IPJoints"],
  "Brachial Plexus": ["BrachialPlexus"],
  "Musculature": ["ScapularMuscles","RotatorCuff","ThoracicWall","ScapularMovements","ArmMuscles","ForearmFlexors","ForearmExtensors","HandIntrinsics"],
  "Vasculature": ["Vasculature"]
};

const TOPIC_LABELS = {
  Clavicle:"Osteology · Clavicle", Scapula:"Osteology · Scapula", Humerus:"Osteology · Humerus",
  RadiusUlna:"Osteology · Radius & Ulna", HandBones:"Osteology · Hand Bones",
  SCJoint:"Joints · Sternoclavicular", ACLigaments:"Joints · AC/Coracoclavicular", Glenohumeral:"Joints · Glenohumeral",
  Elbow:"Joints · Elbow", WristJoint:"Joints · Wrist", CMCMCP:"Joints · CMC/MCP", IPJoints:"Joints · IP / Joint Types",
  BrachialPlexus:"Nerves · Brachial Plexus",
  ScapularMuscles:"Muscles · Scapular Stabilizers", RotatorCuff:"Muscles · Rotator Cuff", ThoracicWall:"Muscles · Thoracic Wall",
  ScapularMovements:"Muscles · Scapular Movements", ArmMuscles:"Muscles · Arm", ForearmFlexors:"Muscles · Forearm Flexors",
  ForearmExtensors:"Muscles · Forearm Extensors", HandIntrinsics:"Muscles · Hand Intrinsics",
  Vasculature:"Vasculature"
};

function prettyTopic(t){ return TOPIC_LABELS[t] || t; }

function getTopicCount(topic){
  return QUESTIONS.filter(q => q.topic === topic).length;
}
function getGroupCount(group){
  const topics = TOPIC_GROUPS[group];
  return QUESTIONS.filter(q => topics.includes(q.topic)).length;
}

function startSession(size){
  sessionQueue = shuffle(QUESTIONS).slice(0, size);
  resetAndRender();
}

function startByTopic(topic){
  let pool;
  if(topic === "__ALL__"){
    pool = QUESTIONS.slice();
  } else if(TOPIC_GROUPS[topic]){
    pool = QUESTIONS.filter(q => TOPIC_GROUPS[topic].includes(q.topic));
  } else {
    pool = QUESTIONS.filter(q => q.topic === topic);
  }
  sessionQueue = shuffle(pool);
  resetAndRender();
}

function startProgressCheck(){
  // Guarantees even coverage across every topic - stratified sample
  const allTopics = Object.keys(TOPIC_LABELS);
  let picked = [];
  allTopics.forEach(t => {
    const pool = shuffle(QUESTIONS.filter(q => q.topic === t));
    const take = Math.min(pool.length, 10); // up to 10 per topic
    picked = picked.concat(pool.slice(0, take));
  });
  sessionQueue = shuffle(picked);
  resetAndRender();
}

function resetAndRender(){
  currentIndex = 0;
  score = 0;
  answered = 0;
  wrongList = [];
  topicScores = {};
  renderQuestion();
}

function renderStart(){
  const root = document.getElementById('root');
  let groupHtml = '';
  for(const g in TOPIC_GROUPS){
    groupHtml += `<div class="mode-opt" data-action="starttopic" data-topic="${g}"><span>${g}</span><span class="count">${getGroupCount(g)} Qs</span></div>`;
  }
  root.innerHTML = `
    <div class="panel start-screen">
      <div style="font-family:'Trebuchet MS','Segoe UI',sans-serif;font-weight:700;font-size:1.05rem;color:var(--ember2);margin-bottom:10px;">
        Monster Mode Loaded — 500 Questions
      </div>
      <div style="color:var(--muted);font-size:0.9rem;line-height:1.5;">
        True/False across the WHOLE ANA217 Upper Limb compendium — osteology, joints & ligaments, brachial plexus, musculature, and vasculature. Pick a session below.
      </div>
      <div class="mode-select">
        <div class="mode-opt hero" data-action="progresscheck"><span>🔥 ALL-TOPIC PROGRESS CHECK</span><span class="count">~${Math.min(230, QUESTIONS.length)} Qs</span></div>
        <div class="mode-opt" data-action="start" data-size="50"><span>Quick Fire</span><span class="count">50 Qs</span></div>
        <div class="mode-opt" data-action="start" data-size="150"><span>Deep Dive</span><span class="count">150 Qs</span></div>
        <div class="mode-opt" data-action="start" data-size="500"><span>Full Monster</span><span class="count">500 Qs</span></div>
      </div>
      <div class="section-label">By Section</div>
      <div class="mode-select">
        ${groupHtml}
      </div>
      <div class="section-label">By Specific Topic</div>
      <select class="topic-select" id="topicDropdown">
        <option value="">— choose a topic —</option>
        ${Object.keys(TOPIC_LABELS).map(t => `<option value="${t}">${prettyTopic(t)} (${getTopicCount(t)} Qs)</option>`).join('')}
      </select>
    </div>
  `;
  document.getElementById('topicDropdown').addEventListener('change', function(){
    if(this.value) startByTopic(this.value);
  });
}

function renderQuestion(){
  if(currentIndex >= sessionQueue.length){
    renderEnd();
    return;
  }
  selected = null;
  locked = false;
  const q = sessionQueue[currentIndex];
  const root = document.getElementById('root');
  const pct = Math.round((currentIndex / sessionQueue.length) * 100);
  root.innerHTML = `
    <div class="statbar">
      <div class="stat"><div class="num">${currentIndex+1}/${sessionQueue.length}</div><div class="lbl">Question</div></div>
      <div class="stat"><div class="num">${score}</div><div class="lbl">Correct</div></div>
      <div class="stat"><div class="num">${answered ? Math.round((score/answered)*100) : 0}%</div><div class="lbl">Accuracy</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="panel">
      <div class="topic-tag">${prettyTopic(q.topic)}</div>
      <div class="qnum">Statement</div>
      <div class="statement">${q.statement}</div>
      <div class="choices">
        <button class="choice-btn true-btn" id="btnTrue" data-action="select" data-val="true">TRUE</button>
        <button class="choice-btn false-btn" id="btnFalse" data-action="select" data-val="false">FALSE</button>
      </div>
      <button class="lockin-btn" id="lockBtn" data-action="lockin">LOCK IN ANSWER</button>
      <div id="feedbackZone"></div>
    </div>
  `;
}

function select(val){
  if(locked) return;
  selected = val;
  document.getElementById('btnTrue').classList.toggle('selected', val===true);
  document.getElementById('btnFalse').classList.toggle('selected', val===false);
  document.getElementById('lockBtn').classList.add('active');
}

function lockIn(){
  if(selected===null || locked) return;
  locked = true;
  const q = sessionQueue[currentIndex];
  const correct = selected === q.answer;
  answered++;
  if(!topicScores[q.topic]) topicScores[q.topic] = {correct:0, total:0};
  topicScores[q.topic].total++;
  if(correct){
    score++;
    topicScores[q.topic].correct++;
  } else {
    wrongList.push(q);
  }
  const zone = document.getElementById('feedbackZone');
  zone.innerHTML = `
    <div class="feedback ${correct ? 'correct' : 'incorrect'}">
      <div class="verdict ${correct ? 'correct' : 'incorrect'}">${correct ? '✓ CORRECT' : '✗ INCORRECT'} — Answer: ${q.answer ? 'TRUE' : 'FALSE'}</div>
      <div class="expl">${q.explanation}</div>
      <div class="hack">🔥 EXAM HACK: ${q.explanation}</div>
    </div>
    <button class="next-btn" data-action="next">NEXT →</button>
  `;
}

function next(){
  currentIndex++;
  renderQuestion();
}

function renderEnd(){
  const root = document.getElementById('root');
  const pct = answered ? Math.round((score/answered)*100) : 0;
  let verdict = "Keep grinding — repetition builds retention.";
  if(pct >= 90) verdict = "🔥 Monster-tier mastery. You own this.";
  else if(pct >= 75) verdict = "Strong run — polish the weak topics below.";
  else if(pct >= 50) verdict = "Solid foundation — revisit the misses.";

  let breakdown = '';
  for(const t in topicScores){
    const s = topicScores[t];
    breakdown += `<div class="topic-row"><span class="tname">${prettyTopic(t)}</span><span class="tscore">${s.correct}/${s.total}</span></div>`;
  }

  let wrongHtml = '';
  if(wrongList.length){
    wrongHtml = `<div class="section-label">Review Wrong Answers (${wrongList.length})</div>` +
      wrongList.map(q => `
        <div class="wrong-item">
          <div class="ws">${q.statement} <strong style="color:var(--ember2)">[${q.answer ? 'TRUE' : 'FALSE'}]</strong></div>
          <div class="we">${q.explanation}</div>
        </div>
      `).join('');
  }

  root.innerHTML = `
    <div class="panel end-summary">
      <div style="color:var(--muted);font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">Session Complete</div>
      <div class="bigscore">${score}/${answered}</div>
      <div class="verdict-line">${pct}% accuracy — ${verdict}</div>
      <div class="topic-breakdown">${breakdown}</div>
      <div class="action-row">
        <button data-action="restart">New Session</button>
        <button class="primary" data-action="review">${wrongList.length ? 'Review Misses' : 'Done'}</button>
      </div>
      <div id="wrongZone"></div>
    </div>
  `;
  document.querySelector('[data-action="review"]').addEventListener('click', function(){
    document.getElementById('wrongZone').innerHTML = wrongHtml || '<div style="color:var(--muted);padding:20px 0;">Perfect run — nothing to review 🔥</div>';
  });
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action === 'start') startSession(parseInt(el.dataset.size));
  else if(action === 'starttopic') startByTopic(el.dataset.topic);
  else if(action === 'progresscheck') startProgressCheck();
  else if(action === 'select') select(el.dataset.val === 'true');
  else if(action === 'lockin') lockIn();
  else if(action === 'next') next();
  else if(action === 'restart') renderStart();
});

renderStart();
</script>
</body>
</html>
