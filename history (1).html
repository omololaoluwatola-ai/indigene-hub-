<style>
  :root{
    --void:#07050a; --char:#120b09; --ember:#ff7a1a; --ember-hot:#ffb020; --gold:#e8b84b;
    --parchment:#f2e6d8; --ash:#a89484; --ash-dim:#7a6a5d; --line:rgba(255,122,26,0.14);
    --ok:#7ddc8a; --mid:#ffb020; --bad:#ff6a5a;
    --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
    --body:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  @font-face{font-family:'Big Shoulders Display'; font-weight:700; font-display:swap; src:url(bigshoulders-700.woff2) format('woff2');}
  @font-face{font-family:'Big Shoulders Display'; font-weight:900; font-display:swap; src:url(bigshoulders-900.woff2) format('woff2');}
  @font-face{font-family:'Schibsted Grotesk'; font-weight:400; font-display:swap; src:url(schibsted-400.woff2) format('woff2');}
  @font-face{font-family:'Schibsted Grotesk'; font-weight:500; font-display:swap; src:url(schibsted-500.woff2) format('woff2');}
  @font-face{font-family:'Schibsted Grotesk'; font-weight:600; font-display:swap; src:url(schibsted-600.woff2) format('woff2');}
  html{background:var(--void);}
  body{background:radial-gradient(ellipse at 50% -10%, #2a1208 0%, var(--void) 55%) fixed; color:var(--parchment); font-family:var(--body); min-height:100vh; padding-bottom:40px; line-height:1.45;}
  .top{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:14px 16px; background:rgba(7,5,10,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .back{width:36px; height:36px; border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--gold); text-decoration:none; font-size:1.5rem; line-height:1; padding-bottom:3px;}
  .top h1{font-family:var(--display); font-weight:900; font-size:2rem; line-height:1; text-transform:uppercase; flex:1;}
  .top span{color:var(--ash-dim); font-size:.9rem;}
  main{max-width:720px; margin:0 auto; padding:14px 16px 0;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; border:1px solid var(--line); background:var(--char); color:var(--parchment); border-radius:20px; padding:7px 15px; font-family:var(--display); font-weight:900; font-size:1.15rem; letter-spacing:.03em; cursor:pointer;}
  .chip.on{background:linear-gradient(135deg,var(--ember),#d4400f); border-color:var(--ember-hot); color:#fff;}
  .stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:10px;}
  .stat{border:1px solid var(--line); background:linear-gradient(160deg, rgba(255,122,26,0.07), rgba(0,0,0,0) 60%), var(--char); border-radius:6px; padding:12px 2px 10px; text-align:center; min-width:0;}
  .stat b{display:block; font-family:var(--display); font-weight:900; font-size:clamp(1.35rem,7vw,1.9rem); line-height:1; white-space:nowrap;}
  .stat span{display:block; margin-top:5px; font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ash-dim);}
  .stat.fire b{color:var(--ember-hot); text-shadow:0 0 14px rgba(255,122,26,0.55);}
  .pep{margin-top:10px; padding:10px 14px; border-left:3px solid var(--ember); background:rgba(255,122,26,0.06); border-radius:0 6px 6px 0; font-size:.95rem;}
  .label{display:flex; align-items:baseline; gap:12px; margin:22px 2px 8px;}
  .label b{font-family:var(--display); font-weight:900; font-size:1.7rem; line-height:1; text-transform:uppercase;}
  .label span{color:var(--ash-dim); font-size:.9rem;}
  .spark{width:100%; height:64px; display:block;}
  .card{border:1px solid var(--line); background:linear-gradient(160deg, rgba(255,122,26,0.05), rgba(0,0,0,0) 55%), var(--char); border-radius:8px; padding:14px;}
  .sum{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; text-align:center;}
  .sum b{display:block; font-family:var(--display); font-weight:900; font-size:1.8rem; line-height:1; color:var(--gold);}
  .sum span{display:block; margin-top:4px; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ash-dim);}
  .bar{height:6px; border-radius:3px; background:rgba(255,255,255,0.07); overflow:hidden; margin-top:10px;}
  .bar>i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,var(--ember),var(--ember-hot));}
  .bar>i.ok{background:linear-gradient(90deg,#4fbf6a,var(--ok));}
  .bar>i.bad{background:linear-gradient(90deg,#c9392b,var(--bad));}
  .verdict{margin-top:12px; text-align:center; font-weight:600;}
  .ok{color:var(--ok);} .mid{color:var(--mid);} .bad{color:var(--bad);} .dim{color:var(--ash-dim);}
  .rev{margin-top:12px; padding:12px 14px; border:1px solid rgba(255,106,90,.5); background:rgba(255,106,90,.08); border-radius:8px;}
  .rev b{font-family:var(--display); font-weight:900; font-size:1.25rem; text-transform:uppercase;}
  .line{display:flex; justify-content:space-between; gap:10px; padding:7px 0; font-size:.92rem;}
  .line + .line{border-top:1px solid var(--line);}
  details.ch{border:1px solid var(--line); background:var(--char); border-radius:8px; margin-top:8px;}
  details.ch>summary{list-style:none; cursor:pointer; padding:12px 14px;}
  details.ch>summary::-webkit-details-marker{display:none;}
  .sh{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .sh .nm{font-weight:600;}
  .pill{flex:none; font-family:var(--display); font-weight:900; font-size:.95rem; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap;}
  .sub{margin-top:3px; font-size:.82rem; color:var(--ash-dim);}
  .secs{padding:2px 14px 10px; border-top:1px solid var(--line);}
  .tag{flex:none; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; border:1px solid currentColor; border-radius:3px; padding:1px 6px;}
  .ledger{display:flex; flex-direction:column; gap:8px;}
  .hs-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:13px 14px; border:1px solid var(--line); border-radius:8px; background:linear-gradient(160deg, rgba(255,122,26,0.045), rgba(0,0,0,0) 55%), var(--char);}
  .hs-row .code{flex:1; min-width:0; font-family:var(--display); font-weight:900; font-size:1.45rem; line-height:1; color:var(--gold);}
  .hs-row .md{font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); border:1px solid var(--line); border-radius:3px; padding:2px 6px;}
  .hs-row .sc{font-family:var(--display); font-weight:900; font-size:1.5rem; line-height:1;}
  .grade{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; font-family:var(--display); font-weight:900; font-size:1.1rem; border:2px solid currentColor;}
  .g-A{color:#7ddc8a;} .g-B{color:#b6e07a;} .g-C{color:var(--ember-hot);} .g-D{color:#ff9a4a;} .g-E,.g-F{color:#ff6a5a;}
  .hs-row .dt{width:100%; font-size:.78rem; color:var(--ash-dim);}
  .hs-x{display:none;} .ledger.more .hs-x{display:flex;}
  .btn{display:block; width:100%; margin-top:10px; padding:13px; border:1px solid var(--line); border-radius:8px; background:var(--char); color:var(--gold); font-family:var(--display); font-weight:900; font-size:1.15rem; letter-spacing:.05em; text-transform:uppercase; text-align:center; text-decoration:none; cursor:pointer;}
  .btn.fire{background:linear-gradient(135deg,var(--ember),#d4400f); border:0; color:#fff;}
  .empty{text-align:center; padding:60px 20px; color:var(--ash-dim);}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<header class="top"><a class="back" href="index.html" aria-label="Back to home">‹</a><h1>History</h1><span id="count"></span></header>
<main>
  <div class="chips" id="chips"></div>
  <div class="stats" id="stats" hidden></div>
  <div class="pep" id="pep" hidden></div>
  <div id="trendWrap" hidden><div class="label"><b>Trend</b><span id="trendNote"></span></div><div class="card"><div id="trend"></div></div></div>
  <div id="report"></div>
  <div class="label" id="attLabel" hidden><b>Attempts</b><span id="attNote"></span></div>
  <div class="ledger" id="list"></div>
  <button class="btn" id="more" hidden>See more</button>
  <div class="empty" id="empty" hidden>Nothing here yet.<br>Finish a CBT and your scores will show up.</div>
</main>
<script src="/history.js"></script>
<script>
(function(){
  // Course structure used to show chapters and sections you have not touched yet.
  // A course that is not listed here still works: its chapters and topics are read from the saved attempts.
  var STRUCT = {"BIO101": {"title": "BIO 101 · Introduction to Biology", "chapters": [{"t": "Introduction to Biology", "n": 60, "s": ["Branches of Biology", "Scope of Biology", "Human Health & Diseases", "Immunity", "Food & Microbes in Human Welfare", "Characteristics of Life", "Topical Issues (Unsolved Problems)", "Career Opportunities"]}, {"t": "Diversity & Classification", "n": 143, "s": ["Introduction & Key Terms", "History of Classification", "Five-Kingdom System", "Three Domains", "Binomial Nomenclature", "Kingdom Monera", "Classification of Bacteria", "Prokaryotes vs Eukaryotes", "Kingdom Protista", "Kingdom Fungi", "Kingdom Plantae", "Animalia: Invertebrate Phyla", "Chordates & Vertebrates"]}, {"t": "Cytology", "n": 70, "s": ["Prokaryotic vs Eukaryotic Cells", "Plant vs Animal Cells", "Cell Fractionation & Cell Membrane", "Nucleus", "Mitochondria", "Endoplasmic Reticulum", "Golgi Apparatus", "Lysosomes", "Ribosomes", "Peroxisomes", "Vacuoles & Storage Granules", "Centrioles, Cytoskeleton & Microvilli", "Cell Wall & Chloroplasts", "Transport Across Cells"]}, {"t": "Reproduction", "n": 75, "s": ["Asexual Reproduction in Plants", "Sexual Reproduction in Plants", "Alternation of Generations", "Bryophytes", "Ferns & Other Spore Plants", "Gymnosperms vs Angiosperms", "Reproductive Organs in Animals", "Fertilization & Development", "Viviparous & Oviparous Animals", "Asexual Reproduction in Animals"]}, {"t": "Interrelationship of Organisms", "n": 38, "s": ["Types of Interactions", "Competition", "Predation", "Symbiosis & Parasitism", "Mutualism", "Commensalism"]}, {"t": "Heredity", "n": 54, "s": ["Heredity Basics", "Variation", "Mendel's Laws", "Genetic Terms", "Sex Determination in Humans"]}, {"t": "Evolution", "n": 40, "s": ["Meaning & Evidences of Evolution", "Homologous & Analogous Organs", "Vestigial Organs", "Embryology", "Darwin's Natural Selection", "Lamarckian Evolution"]}, {"t": "Ecology", "n": 52, "s": ["Meaning of Ecology", "The Ecosystem", "Components of an Ecosystem", "Energy Flow & Food Chains", "Ecological Pyramids", "Nutrient Cycling", "Population Growth"]}]}};
  var PASS = 50, STRONG = 70, MIN_RUN = 8, MAX_ROWS = 60;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function grade(p){ return p>=70?'A':p>=60?'B':p>=50?'C':p>=45?'D':p>=40?'E':'F'; }
  function pct(c,n){ return n>0 ? Math.round(c/n*100) : 0; }
  function tone(p){ return p>=STRONG?'ok':p>=PASS?'mid':'bad'; }
  function fmtDate(ts){ var d=new Date(ts); return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
  function fmtTime(s){ s=Number(s)||0; if(!s) return ''; var m=Math.floor(s/60), r=s%60; return m? m+' min'+(r?' '+r+' s':'') : r+' s'; }
  function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }

  var ALL = [], scope = 'ALL';

  function load(){
    try{ if(window.IndigeneHistory && window.IndigeneHistory.adoptGuest) window.IndigeneHistory.adoptGuest(); }catch(e){}
    var list = [];
    try{ list = window.IndigeneHistory ? window.IndigeneHistory.getAll() : []; }catch(e){}
    // mock scores are never shown to students
    ALL = list.filter(function(a){ return a && a.mode !== 'mock'; }).sort(function(a,b){ return a.ts-b.ts; });
  }

  function streakDays(){
    var days = {}; ALL.forEach(function(a){ days[dayKey(a.ts)] = 1; });
    var d = new Date(); if(!days[dayKey(d.getTime())]) d.setDate(d.getDate()-1);
    var n = 0; while(days[dayKey(d.getTime())]){ n++; d.setDate(d.getDate()-1); }
    return n;
  }

  function sparkline(scores){
    var w=300, h=64, p=6;
    var pts = scores.map(function(s,i){ return [scores.length===1 ? w/2 : p+i*(w-p*2)/(scores.length-1), h-p-(s/100)*(h-p*2)]; });
    var line = pts.map(function(q){ return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' ');
    var dots = pts.map(function(q){ return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5" fill="#ffb020"/>'; }).join('');
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Score trend" preserveAspectRatio="none">'+
      '<line x1="0" y1="'+(h-p)+'" x2="'+w+'" y2="'+(h-p)+'" stroke="rgba(255,122,26,0.18)"/>'+
      (pts.length>1 ? '<polyline points="'+line+'" fill="none" stroke="#ff7a1a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : '')+dots+'</svg>';
  }

  // ---- course report ----------------------------------------------------
  // Topic names saved by the CBTs look like "Ch 3 · Nucleus": chapter number, then the section.
  var TOPIC_RE = /^Ch\s*(\d+)\s*[·.\-:]\s*(.+)$/i;

  function buildReport(course, attempts){
    var st = STRUCT[course] || null, chap = {}, flat = {}, hasCh = false;
    function getCh(n){ return chap[n] || (chap[n] = { n:n, name:'', secs:{}, order:[], runs:[], c:0, t:0, need:MIN_RUN }); }
    if(st){
      st.chapters.forEach(function(ch,i){
        var o = getCh(i+1); o.name = ch.t; o.need = Math.max(MIN_RUN, Math.ceil((ch.n||0)*0.4));
        ch.s.forEach(function(sn){ o.secs[sn] = { c:0, t:0 }; o.order.push(sn); });
      });
    }
    attempts.forEach(function(a){
      var perRun = {};
      Object.keys(a.topics || {}).forEach(function(k){
        var v = a.topics[k]; if(!Array.isArray(v)) return;
        var c = Number(v[0])||0, t = Number(v[1])||0; if(t<=0) return;
        var m = TOPIC_RE.exec(k);
        if(m){
          hasCh = true;
          var o = getCh(+m[1]), sn = m[2].trim();
          if(!o.secs[sn]){ o.secs[sn] = { c:0, t:0 }; o.order.push(sn); }
          o.secs[sn].c += c; o.secs[sn].t += t; o.c += c; o.t += t;
          var r = perRun[o.n] || (perRun[o.n] = { c:0, t:0 }); r.c += c; r.t += t;
        } else {
          var f = flat[k] || (flat[k] = { c:0, t:0 }); f.c += c; f.t += t;
        }
      });
      Object.keys(perRun).forEach(function(n){ chap[n].runs.push({ c:perRun[n].c, t:perRun[n].t }); });
    });
    return { chap:chap, flat:flat, hasCh:hasCh, struct:!!st };
  }

  function secTag(s){
    if(s.t<=0) return '<span class="tag dim">Not tried</span>';
    var p = pct(s.c,s.t);
    return '<span class="tag '+tone(p)+'">'+(p>=STRONG?'Strong':p>=PASS?'Pass':'Revise')+'</span>';
  }
  function secLine(name, s){
    var p = pct(s.c,s.t);
    return '<div class="line"><span>'+esc(name)+'</span><span style="display:flex;gap:8px;align-items:center"><b class="'+(s.t?tone(p):'dim')+'">'+(s.t? s.c+'/'+s.t+' · '+p+'%' : '—')+'</b>'+secTag(s)+'</span></div>';
  }

  function renderReport(course, attempts){
    var box = $('report'); var rep = buildReport(course, attempts);
    var link = 'cbts/'+course.toLowerCase()+'.html';
    var title = (STRUCT[course] && STRUCT[course].title) || course;
    var out = '';

    if(rep.hasCh || rep.struct){
      var nums = Object.keys(rep.chap).map(Number).sort(function(a,b){ return a-b; });
      var passed = 0, secTotal = 0, secDone = 0, rev = [];
      var cards = nums.map(function(n){
        var o = rep.chap[n];
        var best = -1; o.runs.forEach(function(r){ if(r.t>=o.need) best = Math.max(best, pct(r.c,r.t)); });
        var cum = pct(o.c,o.t), tried = o.t>0, ok = best>=PASS;
        if(ok) passed++;
        o.order.forEach(function(sn){
          var s = o.secs[sn]; secTotal++; if(s.t>0) secDone++;
          if(s.t>=2 && pct(s.c,s.t)<PASS) rev.push({ n:n, sn:sn, p:pct(s.c,s.t), c:s.c, t:s.t });
        });
        var status, cls;
        if(!tried){ status='Not tried'; cls='dim'; }
        else if(best<0){ status='Practising'; cls='mid'; }
        else if(ok){ status='Passed ✔'; cls='ok'; }
        else { status='Not yet ✖'; cls='bad'; }
        var sub = !tried ? 'No attempt yet' :
          (best>=0 ? 'Best run '+best+'/100 · '+grade(best)+' · ' : 'Needs one run of '+o.need+'+ questions from this chapter to pass · ')+'All attempts '+cum+'% ('+o.c+' of '+o.t+')';
        var secsHtml = o.order.map(function(sn){ return secLine(sn, o.secs[sn]); }).join('');
        return '<details class="ch"'+(tried && !ok ? ' open':'')+'><summary><div class="sh"><span class="nm">Ch '+n+(o.name?' · '+esc(o.name):'')+'</span><span class="pill '+cls+'">'+status+'</span></div>'+
          '<div class="sub">'+sub+'</div><div class="bar"><i class="'+(tried? tone(cum):'')+'" style="width:'+(tried?cum:0)+'%"></i></div></summary><div class="secs">'+secsHtml+'</div></details>';
      }).join('');

      rev.sort(function(a,b){ return a.p-b.p; });
      var total = nums.length, cover = pct(secDone, secTotal);
      out += '<div class="label"><b>'+esc(title)+'</b></div>'+
        '<div class="card"><div class="sum"><div><b>'+passed+' / '+total+'</b><span>Chapters passed</span></div>'+
        '<div><b>'+secDone+' / '+secTotal+'</b><span>Sections tried</span></div>'+
        '<div><b>'+rev.length+'</b><span>To revise</span></div></div>'+
        '<div class="bar"><i class="'+(passed===total && total? 'ok':'')+'" style="width:'+cover+'%"></i></div>'+
        '<div class="verdict '+(passed===total && total?'ok':'dim')+'">'+(passed===total && total ? 'Whole manual passed ✔' : 'Pass mark is '+PASS+'/100 on one run covering at least 40% of the chapter')+'</div></div>';
      if(rev.length){
        out += '<div class="rev"><b>Revise next</b>'+rev.slice(0,6).map(function(r){
          return '<div class="line"><span>Ch '+r.n+' · '+esc(r.sn)+'</span><b class="bad">'+r.p+'% <span class="dim" style="font-weight:400">('+r.c+'/'+r.t+')</span></b></div>';
        }).join('')+'<a class="btn fire" href="'+esc(link)+'">Practice '+esc(course)+'</a></div>';
      }
      out += '<div class="label"><b>Chapters</b><span>Tap one to see its sections</span></div>'+cards;
    } else {
      var keys = Object.keys(rep.flat).map(function(k){ return { k:k, c:rep.flat[k].c, t:rep.flat[k].t, p:pct(rep.flat[k].c, rep.flat[k].t) }; }).sort(function(a,b){ return a.p-b.p; });
      if(keys.length){
        out += '<div class="label"><b>'+esc(title)+'</b><span>Topics, weakest first</span></div><div class="card">'+
          keys.map(function(x){ return secLine(x.k, { c:x.c, t:x.t }); }).join('')+
          '<a class="btn fire" href="'+esc(link)+'">Practice '+esc(course)+'</a></div>';
      }
    }
    box.innerHTML = out;
  }

  // ---- page --------------------------------------------------------------
  function render(){
    var list = scope==='ALL' ? ALL : ALL.filter(function(a){ return a.course===scope; });
    $('count').textContent = ALL.length ? ALL.length+(ALL.length===1?' attempt':' attempts') : '';
    if(!ALL.length){
      ['chips','stats','pep','trendWrap','report','list'].forEach(function(id){ $(id).innerHTML=''; });
      $('stats').hidden = true; $('pep').hidden = true; $('trendWrap').hidden = true; $('attLabel').hidden = true; $('more').hidden = true;
      $('empty').hidden = false; return;
    }
    $('empty').hidden = true;

    // course chips: most recently practised first
    var last = {}; ALL.forEach(function(a){ last[a.course] = Math.max(last[a.course]||0, a.ts); });
    var codes = Object.keys(last).sort(function(a,b){ return last[b]-last[a]; });
    $('chips').innerHTML = ['ALL'].concat(codes).map(function(c){
      return '<button type="button" class="chip'+(c===scope?' on':'')+'" data-c="'+esc(c)+'">'+(c==='ALL'?'All':esc(c))+'</button>';
    }).join('');

    var avg = Math.round(list.reduce(function(s,a){ return s+a.score; },0)/list.length);
    var best = Math.max.apply(null, list.map(function(a){ return a.score; }));
    var sk = streakDays();
    $('stats').innerHTML =
      '<div class="stat"><b>'+list.length+'</b><span>Attempts</span></div>'+
      '<div class="stat"><b>'+avg+'%</b><span>Average</span></div>'+
      '<div class="stat"><b>'+best+'%</b><span>Best</span></div>'+
      '<div class="stat fire"><b>'+(sk? '🔥 '+sk : '0')+'</b><span>Day streak</span></div>';
    $('stats').hidden = false;

    var msg;
    if(list.length<3) msg = 'Just getting started. Do a few more and your trend line will show.';
    else {
      var half = Math.floor(list.length/2), older = list.slice(0,half), newer = list.slice(half);
      var mean = function(a){ return a.reduce(function(s,x){ return s+x.score; },0)/a.length; };
      var d = Math.round(mean(newer)-mean(older));
      msg = d>2 ? 'Your scores are going up. Recent ones are '+d+'% higher than the early ones.'
        : d<-2 ? 'Your recent scores dropped by '+Math.abs(d)+'%. Check the sections to revise below and try again.'
        : 'Your scores are steady. Hit the weak sections to push them up.';
    }
    $('pep').textContent = msg; $('pep').hidden = false;

    var sc = list.slice(-20).map(function(a){ return a.score; });
    $('trend').innerHTML = sparkline(sc);
    $('trendNote').textContent = 'Last '+sc.length+(scope==='ALL'?' attempts, all courses':' attempts');
    $('trendWrap').hidden = false;

    if(scope==='ALL') $('report').innerHTML = ''; else renderReport(scope, list);

    var rows = list.slice().sort(function(a,b){ return b.ts-a.ts; }).slice(0, MAX_ROWS);
    $('attLabel').hidden = false; $('attNote').textContent = rows.length+' shown';
    $('list').innerHTML = rows.map(function(a,i){
      var g = grade(a.score), t = fmtTime(a.secs);
      return '<div class="hs-row'+(i>=5?' hs-x':'')+'"><span class="code">'+esc(a.course)+'</span><span class="md">'+(a.mode==='past'?'Past Q':'CBT')+'</span>'+
        '<span class="sc">'+a.score+'%</span><span class="grade g-'+g+'">'+g+'</span>'+
        '<span class="dt">'+fmtDate(a.ts)+' · '+a.correct+' of '+a.total+(t?' · '+t:'')+'</span></div>';
    }).join('');
    $('list').classList.remove('more');
    $('more').textContent = 'See more'; $('more').hidden = rows.length<=5;
  }

  $('chips').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    scope = b.getAttribute('data-c'); render();
    try{ history.replaceState(null,'', scope==='ALL' ? location.pathname : '?course='+encodeURIComponent(scope)); }catch(x){}
  });
  $('more').addEventListener('click', function(){
    var on = $('list').classList.toggle('more'); $('more').textContent = on ? 'See less' : 'See more';
  });
  window.addEventListener('indigene-uid', function(){ load(); render(); });

  load();
  var want = '';
  try{ want = (new URLSearchParams(location.search).get('course') || '').toUpperCase(); }catch(e){}
  if(want && ALL.some(function(a){ return a.course===want; })) scope = want;
  else if(ALL.length) scope = ALL[ALL.length-1].course;
  render();
})();
</script>
</body>
</html>
